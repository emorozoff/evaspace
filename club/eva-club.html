function wireStratBudget(rerender){
  document.querySelectorAll('.money-fmt-input').forEach(wireThousandsInput);

  /* сворачивание разделов — без перерисовки, чтобы ничего не дёргалось */
  const applyGroup = (key)=>{
    const open = _budOpen[key]!==false;
    const head = document.querySelector(`tr.bud-group[data-bud-group="${key}"]`);
    const bodyEl = document.querySelector(`tbody.bud-body[data-bud-rows="${key}"]`);
    if(head) head.classList.toggle('collapsed', !open);
    if(bodyEl) bodyEl.classList.toggle('collapsed', !open);
    const btn = document.querySelector(`[data-bud-toggle="${key}"]`);
    if(btn) btn.setAttribute('aria-expanded', String(open));
  };
  document.querySelectorAll('[data-bud-toggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.budToggle;
      _budOpen[key] = _budOpen[key]===false;
      applyGroup(key);
      const all = document.getElementById('budCollapseAll');
      if(all) all.textContent = Object.values(_budOpen).every(v=>v===false) ? 'Развернуть все разделы' : 'Свернуть все разделы';
    };
  });
  const collapseAll = document.getElementById('budCollapseAll');
  if(collapseAll) collapseAll.onclick = ()=>{
    const anyOpen = Object.values(_budOpen).some(v=>v!==false);
    Object.keys(_budOpen).forEach(k=>{ _budOpen[k] = !anyOpen; });
    Object.keys(_budOpen).forEach(applyGroup);
    collapseAll.textContent = anyOpen ? 'Развернуть все разделы' : 'Свернуть все разделы';
  };

  document.querySelectorAll('[data-bud-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const id = inp.dataset.id, f = inp.dataset.budField;
      if(f==='salary'){
        if(inp.dataset.real==='true'){
          const list = await getPositions();
          const pos = list.find(x=>x.id===id);
          if(pos){ pos.salary = parseThousands(inp.value); savePositions(list); }
        } else {
          const list = await getExtraHires();
          const h = list.find(x=>x.id===id);
          if(h){ h.salary = parseThousands(inp.value); saveExtraHires(list); }
        }
      } else if(f==='hireFrom'){
        const v = parseInt(inp.value)||1;
        const list = await getExtraHires();
        const h = list.find(x=>x.id===id);
        if(h){ h.month = v; saveExtraHires(list); }
        else { const mm = await getHireMonths(); mm[id] = v; saveHireMonths(mm); }
      } else if(f==='hireUntil'){
        const v = inp.value ? parseInt(inp.value) : null;
        const list = await getExtraHires();
        const h = list.find(x=>x.id===id);
        if(h){ h.until = v; saveExtraHires(list); }
        else { const uu = await getHireUntil(); if(v) uu[id] = v; else delete uu[id]; saveHireUntil(uu); }
      } else {
        const e = await getExpenses();
        const it = e.items.find(x=>x.id===id);
        if(!it) return;
        if(f==='name')           it.name = inp.value;
        else if(f==='amount')    it.amount = parseThousands(inp.value);
        else if(f==='expFrom')   it.from = parseInt(inp.value)||1;
        else if(f==='expTo')     it.to = inp.value ? parseInt(inp.value) : null;
        else if(f==='onceMonth') it.month = parseInt(inp.value)||1;
        saveExpenses(e);
      }
      rerender();
    });
  });
  document.querySelectorAll('[data-bud-del-exp]').forEach(b=>{
    b.onclick = async ()=>{
      const e = await getExpenses();
      e.items = e.items.filter(x=>x.id!==b.dataset.budDelExp);
      saveExpenses(e); rerender();
    };
  });
  document.querySelectorAll('[data-bud-del-hire]').forEach(b=>{
    b.onclick = async ()=>{
      saveExtraHires((await getExtraHires()).filter(h=>h.id!==b.dataset.budDelHire));
      rerender();
    };
  });
  document.querySelectorAll('[data-bud-exclude-hire]').forEach(b=>{
    b.onclick = async ()=>{ const ex = await getHireExcluded(); ex[b.dataset.budExcludeHire] = true; saveHireExcluded(ex); rerender(); };
  });
  document.querySelectorAll('[data-bud-restore-hire]').forEach(b=>{
    b.onclick = async ()=>{ const ex = await getHireExcluded(); delete ex[b.dataset.budRestoreHire]; saveHireExcluded(ex); rerender(); };
  });
  document.querySelectorAll('.bud-month-input').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const e = await getExpenses();
      const it = e.items.find(x=>x.id===inp.dataset.id); if(!it) return;
      const m = parseInt(inp.dataset.budMonth);
      const raw = inp.value.trim();
      it.byMonth = it.byMonth || {};
      if(raw===''){ delete it.byMonth[m]; }
      else {
        const v = parseThousands(raw);
        /* значение, равное базовой ставке внутри периода, — не переопределение */
        const from = it.from||1, to = it.to||FIN_HORIZON;
        if(v===(it.amount||0) && m>=from && m<=to) delete it.byMonth[m]; else it.byMonth[m] = v;
      }
      if(!Object.keys(it.byMonth).length) delete it.byMonth;
      saveExpenses(e); rerender();
    });
  });

  const addHire = document.getElementById('budAddHire');
  if(addHire) addHire.onclick = async ()=>{
    const role = document.getElementById('budNewHireRole').value.trim();
    const salary = parseThousands(document.getElementById('budNewHireSalary').value);
    if(!role){ document.getElementById('budNewHireRole').focus(); return; }
    if(!salary){ document.getElementById('budNewHireSalary').focus(); return; }
    const list = await getExtraHires();
    const to = document.getElementById('budNewHireTo').value;
    list.push({id:uid(), role, salary, month: parseInt(document.getElementById('budNewHireFrom').value)||1,
      until: to ? parseInt(to) : null, status:'Стартовый план', dept:'founders'});
    saveExtraHires(list); rerender();
  };
  const addMon = document.getElementById('budAddMon');
  if(addMon) addMon.onclick = async ()=>{
    const name = document.getElementById('budNewMonName').value.trim();
    const amount = parseThousands(document.getElementById('budNewMonAmount').value);
    if(!name){ document.getElementById('budNewMonName').focus(); return; }
    if(!amount){ document.getElementById('budNewMonAmount').focus(); return; }
    const e = await getExpenses();
    const to = document.getElementById('budNewMonTo').value;
    e.items.push({id:uid(), name, cat:document.getElementById('budNewMonCat').value, kind:'monthly',
      amount, from: parseInt(document.getElementById('budNewMonFrom').value)||1,
      to: to ? parseInt(to) : null, mandatory:true, dept:null});
    saveExpenses(e); rerender();
  };
  const addOnce = document.getElementById('budAddOnce');
  if(addOnce) addOnce.onclick = async ()=>{
    const name = document.getElementById('budNewOnceName').value.trim();
    const amount = parseThousands(document.getElementById('budNewOnceAmount').value);
    if(!name){ document.getElementById('budNewOnceName').focus(); return; }
    if(!amount){ document.getElementById('budNewOnceAmount').focus(); return; }
    const e = await getExpenses();
    e.items.push({id:uid(), name, cat:document.getElementById('budNewOnceCat').value, kind:'once',
      amount, month: parseInt(document.getElementById('budNewOnceMonth').value)||1, mandatory:true, dept:null});
    saveExpenses(e); rerender();
  };
}

const STRAT_MONEY_HORIZON = 6;

async function stratMoneyHtml(){
  const planRows= await getStratPlan();
  const targets = await getStratTargets();
  const norms   = await getNorms();
  const H       = STRAT_MONEY_HORIZON;
  const plan    = salesPlanFromGoals(planRows, H);
  const cfgBase = await buildFinCfg({});
  const cfg     = await buildFinCfg({newPayingPlan: plan, noFinancing:true, cashStart:0});
  const model   = computeFinModel(cfg);
  const ue      = unitEconomics(cfg, 2);

  const NY = Math.min(H, targets.throughMonth || 4);          /* до Нового года */
  const rows = Array.from({length:H},(_,i)=>i+1);
  /* Оборудование — это тоже деньги со счёта, поэтому в поток входит
     и операционная часть, и капвложения. */
  const flow = {};
  const cumFlow = [];
  let acc = 0;
  rows.forEach(m=>{ flow[m] = model.cfOper[m]+model.cfInvest[m]; acc += flow[m]; cumFlow[m] = acc; });
  const need = Math.abs(Math.min(0, ...rows.map(m=>cumFlow[m])));
  const needMonth = rows.find(m=>cumFlow[m]===Math.min(...rows.map(x=>cumFlow[x])));
  const cashNY  = cfSumRange(model.cashIn, 1, NY);
  const revNY   = cfSumRange(model.revenue, 1, NY);
  const spendNY = cfSumRange(model.totalExpense, 1, NY)+cfSumRange(model.capex, 1, NY);
  const firstPlus = rows.find(m=>flow[m] > 0);

  const investOk = need <= targets.invest;
  const earnOk   = cashNY >= targets.earn;


  const rowsHtml = rows.map(m=>{
    const isNY = m===NY;
    return `<tr class="${isNY?'ny-row':''}">
      <td>${finMonthLabel(m)}${isNY?'<span class="ny-tag">Новый год</span>':''}</td>
      <td class="num">${plan[m]?num(plan[m]):'<span class="soft">—</span>'}</td>
      <td class="num">${num(model.active[m])}</td>
      <td class="num">${money(model.revenue[m])}</td>
      <td class="num hl">${money(model.cashIn[m])}</td>
      <td class="num">${money(model.totalExpense[m]+model.capex[m])}</td>
      <td class="num ${flow[m]<0?'neg':'pos'}">${signedMoney(flow[m])}</td>
      <td class="num ${cumFlow[m]<0?'neg':'pos'}">${signedMoney(cumFlow[m])}</td>
    </tr>`;
  }).join('');

  /* Что нужно под цель: воронка вверх от продаж и производство —
     план по экспертам и контенту сверяется с тем, сколько их
     требует растущая база. */
  const decompHtml = rows.map(m=>{
    const sales = plan[m]||0;
    const regNeed = cfg.funnel.crRegPay ? sales/cfg.funnel.crRegPay : 0;
    const leads = cfg.funnel.crLeadReg ? regNeed/cfg.funnel.crLeadReg : 0;
    const contentNeed = norms.contentBaseMonthly + model.active[m]/100*norms.contentPer100Users;
    const expertsNeed = Math.ceil(model.active[m]/norms.usersPerExpert);
    const contentPlan = planAt(planRows, m, 'content');
    const expertsPlan = planAt(planRows, m, 'experts');
    const gap = (p, need)=> p===null ? '<span class="soft">не задано</span>'
      : `<b>${num(p)}</b> <span class="${p>=need?'pos':'neg'}">${p>=need?'✓':'нужно '+num(need)}</span>`;
    return `<tr>
      <td>${finMonthLabel(m)}</td>
      <td class="num hl">${sales?num(sales):'<span class="soft">—</span>'}</td>
      <td class="num">${num(regNeed)}</td>
      <td class="num">${num(leads)}</td>
      <td class="num">${sales?num(Math.ceil(sales/22)):'—'}</td>
      <td class="num">${gap(contentPlan, contentNeed)}</td>
      <td class="num">${gap(expertsPlan, expertsNeed)}</td>
    </tr>`;
  }).join('');

  const contentTotal = rows.reduce((a,m)=>a+(planAt(planRows,m,'content')||0),0);
  const expertsEnd = (function(){ for(let m=H;m>=1;m--){ const v=planAt(planRows,m,'experts'); if(v!==null) return v; } return 0; })();

  return `
    <section class="block">
      <h2>Что стратегия значит в деньгах</h2>
      <p class="block-sub">Первые ${STRAT_MONEY_HORIZON} месяцев — бюджет до запуска: цели по продажам из ганта, расходы из стартового бюджета выше. Раунды не учтены: таблица показывает, сколько денег нужно принести мини-раундом. Основной раунд к официальному запуску считается на вкладке «Сколько нужно на запуск».</p>
      ${metricCards([
        {l:'Бюджет до запуска — нужно вложить', v:money(need), cls: investOk?'pos':'neg',
         sub:`мини-раунд основателей · дно в ${finMonthLabel(needMonth||1)} · ориентир ${money(targets.invest)}`},
        {l:`Поступит деньгами до ${finMonthLabel(NY)}`, v:money(cashNY), cls: earnOk?'pos':'neg',
         sub:`ориентир ${money(targets.earn)} · выручка начислением ${money(revNY)}`},
        {l:`Потратим до ${finMonthLabel(NY)}`, v:money(spendNY), sub:'ФОТ, студия, реестр и налоги'},
        {l:'Первый месяц в плюс', v: firstPlus?finMonthLabel(firstPlus):'позже '+finMonthLabel(H),
         cls: firstPlus?'pos':'neg', sub:'поступления перекрывают расходы месяца'},
      ])}
      <div class="verdict ${investOk&&earnOk?'good':(investOk||earnOk?'neutral':'warn')}">
        ${investOk&&earnOk
          ? `План сходится с ориентирами: нужно ${money(need)} при потолке ${money(targets.invest)}, до Нового года приходит ${money(cashNY)} при цели ${money(targets.earn)}.`
          : investOk
            ? `Денег нужно меньше потолка (${money(need)} против ${money(targets.invest)}), но до Нового года приходит ${money(cashNY)} вместо ${money(targets.earn)}. Либо поднимите цели по продажам, либо примите цифру как есть.`
            : earnOk
              ? `Заработок в цель (${money(cashNY)}), но вложить придётся ${money(need)} вместо ${money(targets.invest)}. Смотрите, что резать: ФОТ, студию или сроки найма.`
              : `Пока не сходится с обоими ориентирами: нужно ${money(need)} вместо ${money(targets.invest)}, приходит ${money(cashNY)} вместо ${money(targets.earn)}. Двигайте цели по месяцам и состав расходов — таблица пересчитается.`}
      </div>
      <div class="apply-plan">
        <div>
          <strong>Стартовый план: трое в команде и студия на три месяца.</strong>
          Основатель, ассистент-менеджер по экспертам и техдиректор с первого месяца, видеограф и штаб-квартира-студия ${money(175000)}/мес — со второго по четвёртый. Маркетинг не покупаем до февраля.
        </div>
        <button class="btn ghost" id="applyLaunchBtn" data-armed="0">Вернуть расходы к этому плану</button>
      </div>
      <div class="field-row target-row">

          <select id="stTargetMonth">${Array.from({length:H},(_,i)=>i+1).map(m=>`<option value="${m}" ${(targets.throughMonth||4)===m?'selected':''}>${finMonthLabel(m)}</option>`).join('')}</select></div>

      <div class="card table-card">

          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      ${howHtml('Почему поступления больше выручки', 'Годовая подписка приносит все '+money(cfgBase.revenue.priceAnnual)+' сразу, а в выручку месяца попадает только '+money(cfgBase.revenue.priceAnnual/12)+'. На старте это заметно помогает кассе. Полный разбор — на странице P&amp;L.')}
    </section>

    <section class="block">
      <h2>Что нужно делать под эти цели</h2>

function wireStratMoney(rerender){

  const mon = document.getElementById('stTargetMonth');
  if(mon) mon.addEventListener('change', async ()=>{ const t = await getStratTargets(); t.throughMonth = parseInt(mon.value)||4; saveStratTargets(t); rerender(); });

function migrateExpenses(obj){
  if(!obj) return JSON.parse(JSON.stringify(DEFAULT_EXPENSES));
  if(Array.isArray(obj.items)) return obj;
  /* старый формат: recurring[] + oneoff[] → единый items[] */
  const items = [];
  (obj.recurring||[]).forEach(r=>items.push({
    id:r.id||uid(), name:r.name, cat:guessCat(r.name), dept:null, kind:'monthly',
    amount:r.amount||0, from:r.month||1, to:null, mandatory:r.mandatory!==false,
  }));
  (obj.oneoff||[]).forEach(o=>items.push({
    id:o.id||uid(), name:o.name, cat:guessCat(o.name), dept:null, kind:'once',
    amount:o.amount||0, month: cfRelativeMonth(o.when, FIN_BASE_ABS) || 1,
    mandatory:o.mandatory!==false, taskId:o.taskId, pendingApproval:o.pendingApproval,
  }));
  const base = JSON.parse(JSON.stringify(DEFAULT_EXPENSES));
  return {cash: obj.cash!==undefined ? obj.cash : base.cash, items: items.length ? items : base.items};
}
function guessCat(name){
  const n = String(name||'').toLowerCase();
  if(/маркет|реклам|привлеч|блогер|smm/.test(n)) return 'marketing';
  if(/контент|съём|съем|модерац|видео/.test(n)) return 'content';
  if(/хостинг|инфраструктур|сервис|домен/.test(n)) return 'infra';
  if(/поддержк/.test(n)) return 'support';
  if(/эквайринг|комисси/.test(n)) return 'acquiring';
  if(/разработк|платформ|версия/.test(n)) return 'product';
  if(/юрист|юр|бухгалт|пошлин|ооо|документ|знак/.test(n)) return 'legal';
  if(/офис/.test(n)) return 'office';
  if(/оборудован|техник|камер/.test(n)) return 'equipment';
  return 'other';
}

function parseRuMonthYearToAbs(str){
  if(!str) return null;
  const m = String(str).match(/([А-Яа-яёЁ]+)\.?\s*(\d{4})/);
  if(!m) return null;
  const prefix = m[1].slice(0,3).toLowerCase();
  const idx = MONTH_ABBR.findIndex(ab=>ab.slice(0,3).toLowerCase()===prefix);
  if(idx<0) return null;
  return parseInt(m[2],10)*12+idx;
}
function cfRelativeMonth(whenStr, baseAbs){
  const abs = parseRuMonthYearToAbs(whenStr);
  if(abs===null || baseAbs===null || baseAbs===undefined) return null;
  return abs - baseAbs + 1;
}
function finMonthLabel(m){ return monthCalendarLabel(m, FIN_BASE_ABS); }
function finMonthShort(m){ const abs = FIN_BASE_ABS+(m-1); return MONTH_ABBR[((abs%12)+12)%12]; }
/* Календарный месяц (0-11) и год для месяца модели */
function finMonthDate(m){ const abs = FIN_BASE_ABS+(m-1); return {year: Math.floor(abs/12), month: ((abs%12)+12)%12}; }
function finMonthFromDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.getFullYear()*12 + d.getMonth() - FIN_BASE_ABS + 1;
}

/* Бюджет задачи из дорожной карты попадает в тот же реестр расходов
   отдельной единоразовой записью — цифры дорожной карты и финмодели
   всегда сходятся. */
/* ------------------------------------------------------------
   БЮДЖЕТ ЗАДАЧИ → РАЗОВЫЙ РАСХОД
   Бюджет, проставленный в карточке, живёт в реестре расходов
   одной строкой: месяц берётся из месяца карточки, сумма — из
   карточки. Повторная правка эту же строку и обновляет, поэтому
   задвоиться она не может; убрали бюджет или задачу — строка
   уходит. Синхронизация идёт от всего списка задач сразу, чтобы
   ни один способ правки (карточка, перетаскивание, гант, смена
   первого месяца карты) не остался в стороне.
   ------------------------------------------------------------ */
const TASK_BUDGET_CAT = {tech:'product', legal:'legal', content:'content', commercial:'marketing', founders:'other'};
function taskBudgetMonth(task, roadmapBase){
  const base = (roadmapBase===null || roadmapBase===undefined) ? ROADMAP_BASE_DEFAULT : roadmapBase;
  return base + ((task.month||1)-1) - FIN_BASE_ABS + 1;
}
function taskBudgetRow(task, roadmapBase){
  const m = taskBudgetMonth(task, roadmapBase);
  return {
    id:'taskbudget_'+task.id, taskId:task.id, name:'Бюджет задачи: '+task.title,
    cat: TASK_BUDGET_CAT[task.dept] || 'other',
    dept: task.dept, kind:'once', amount:task.budget,
    month: Math.max(1, m), outOfHorizon: m>FIN_HORIZON, mandatory:true,
    pendingApproval: !!(task.budgetNeedsApproval && !task.budgetApproved),
  };
}
async function syncAllTaskBudgets(){
  const tasks = await getTasks();
  const exp   = await getExpenses();
  const base  = await getMonthsBase();
  const wanted = tasks.filter(t=>t.budget>0);
  const alive  = new Set(wanted.map(t=>t.id));
  let changed = false;

  /* строки задач, которых уже нет или у которых убрали бюджет */
  const kept = exp.items.filter(i=>!i.taskId || alive.has(i.taskId));
  if(kept.length !== exp.items.length){ exp.items = kept; changed = true; }

  const byTask = {};
  exp.items.forEach(i=>{ if(i.taskId) byTask[i.taskId] = i; });
  wanted.forEach(t=>{
    const row = taskBudgetRow(t, base);
    const cur = byTask[t.id];
    if(!cur){ exp.items.push(row); changed = true; return; }
    /* правим на месте: строка остаётся там же, где стояла в реестре */
    const same = cur.amount===row.amount && cur.month===row.month && cur.name===row.name
              && cur.cat===row.cat && !!cur.pendingApproval===!!row.pendingApproval
              && !!cur.outOfHorizon===!!row.outOfHorizon;
    if(!same){ Object.assign(cur, row); changed = true; }
  });
  if(changed) saveExpenses(exp);
  return changed;
}
/* оставлено для точечных вызовов из карточки — считает всё разом */
async function syncTaskBudgetToExpenses(){ return syncAllTaskBudgets(); }

/* ============================================================
   ДВИЖОК. На вход — конфиг, на выход — помесячные ряды.
   Индекс 0 — «до старта», месяцы модели идут с 1.
   ============================================================ */
/* Темп роста притока меняется плавно, а не ступенькой в январе.
   Ползунки задают средний темп года — он приходится на середину года,
   между серединами темп перетекает линейно. Так на графике нет
   искусственного излома на 13-м и 25-м месяце. */
function growthAt(F, m){
  const g1 = F.growthY1||0, g2 = F.growthY2||0, g3 = F.growthY3||0;
  if(m<=6)  return g1;
  if(m<=18) return g1 + (g2-g1)*(m-6)/12;
  if(m<=30) return g2 + (g3-g2)*(m-18)/12;
  return g3;
}
function computeFinModel(cfg){
  const months   = cfg.months || FIN_HORIZON;
  const F        = cfg.funnel;
  const R        = cfg.revenue;
  const items    = cfg.expenses || [];
  const hires    = cfg.hires || [];
  const tax      = cfg.tax || DEFAULT_TAX;
  const financing= cfg.financing || [];
  const insRate  = tax.it ? 0.076 : 0.30;

  const z = ()=>new Array(months+1).fill(0);
  const o = {
    months,
    leads:z(), registered:z(), newPaying:z(), newMonthly:z(), newAnnual:z(),
    churned:z(), active:z(), activeMonthly:z(), activeAnnual:z(),
    revSub:z(), revAddonNet:z(), gmvAddon:z(), revenue:z(), turnover:z(),
    cashSub:z(), cashAddon:z(), cashIn:z(), deferred:z(),
    fot:z(), insurance:z(), payrollTotal:z(),
    cogs:z(), opex:z(), capex:z(), depreciation:z(),
    grossProfit:z(), grossMargin:z(), ebitda:z(), ebit:z(),
    taxProfit:z(), taxTotal:z(), netProfit:z(),
    cfOper:z(), cfInvest:z(), cfFin:z(), cfNet:z(), cash:z(), totalExpense:z(),
    burn:z(), cac:z(), arpu:z(), ltv:z(), ltvCac:z(),
    byCat:{}, catCogs:z(), catOpex:z(),
    cumOperNoFin:z(),
  };
  EXP_CATS.forEach(c=>{ o.byCat[c.id] = z(); });

  const arpuAddonNet = R.addons.filter(a=>a.active!==false)
    .reduce((s,a)=>s + a.conv*a.price*a.take, 0);
  const gmvAddonPer  = R.addons.filter(a=>a.active!==false)
    .reduce((s,a)=>s + a.conv*a.price, 0);
  const capexQueue = [];

  o.cash[0] = cfg.cashStart || 0;

  for(let m=1; m<=months; m++){
    /* --- воронка --- */
    const g = growthAt(F, m);
    /* Если на месяц задан план продаж из стратегии — берём его, а не
       формулу роста: так гант и деньги считают одно и то же. */
    const planned = cfg.newPayingPlan && cfg.newPayingPlan[m];
    o.newPaying[m]  = (planned!==undefined && planned!==null)
      ? planned
      : (m===1 ? F.newPayingM1 : o.newPaying[m-1]*(1+g));
    o.registered[m] = F.crRegPay  > 0 ? o.newPaying[m]/F.crRegPay   : 0;
    o.leads[m]      = F.crLeadReg > 0 ? o.registered[m]/F.crLeadReg : 0;

    o.newAnnual[m]  = o.newPaying[m]*R.annualShare;
    o.newMonthly[m] = o.newPaying[m]-o.newAnnual[m];

    const churnM = o.activeMonthly[m-1]*R.churn;
    const churnA = o.activeAnnual[m-1]*R.churnAnnual;
    o.churned[m]  = churnM+churnA;
    o.activeMonthly[m] = Math.max(0, o.activeMonthly[m-1]+o.newMonthly[m]-churnM);
    o.activeAnnual[m]  = Math.max(0, o.activeAnnual[m-1]+o.newAnnual[m]-churnA);
    o.active[m] = o.activeMonthly[m]+o.activeAnnual[m];

    /* --- выручка (начислением) и поступления (деньгами) ---
       Считаем по средней базе месяца, а не по базе на конец: те, кто
       пришёл в середине месяца, платят не за весь месяц. Иначе модель
       систематически завышает выручку на этапе быстрого роста.
       Годовая подписка приносит деньги сразу, а выручку — по 1/12
       в месяц. Разница копится в «авансах полученных» (deferred). */
    const avgMonthlyBase = (o.activeMonthly[m-1]+o.activeMonthly[m])/2;
    const avgAnnualBase  = (o.activeAnnual[m-1]+o.activeAnnual[m])/2;
    const avgBase        = avgMonthlyBase+avgAnnualBase;
    const subAccrual = avgMonthlyBase*R.priceMonthly + avgAnnualBase*(R.priceAnnual/12);
    const subCash    = avgMonthlyBase*R.priceMonthly + o.newAnnual[m]*R.priceAnnual;
    o.revSub[m]      = subAccrual;
    o.cashSub[m]     = subCash;
    o.deferred[m]    = Math.max(0, o.deferred[m-1] + o.newAnnual[m]*R.priceAnnual - avgAnnualBase*(R.priceAnnual/12));

    o.gmvAddon[m]    = avgBase*gmvAddonPer;
    o.revAddonNet[m] = avgBase*arpuAddonNet;
    o.cashAddon[m]   = o.revAddonNet[m];

    /* оборот — все деньги, которые проходят через площадку:
       подписка целиком наша, от допродаж наша только доля */
    o.turnover[m] = o.revSub[m]+o.gmvAddon[m];
    o.revenue[m] = o.revSub[m]+o.revAddonNet[m];
    o.cashIn[m]  = o.cashSub[m]+o.cashAddon[m];

    /* --- ФОТ --- */
    o.fot[m]       = hires.filter(h=>h.month<=m && (!h.until || m<=h.until)).reduce((s,h)=>s+(h.salary||0),0);
    o.insurance[m] = o.fot[m]*insRate;
    o.payrollTotal[m] = o.fot[m]+o.insurance[m];
    o.byCat.fot[m] = o.payrollTotal[m];

    /* --- расходы из единого реестра --- */
    items.forEach(it=>{
      let amt = 0;
      if(it.kind==='monthly'){
        amt = monthlyAmountAt(it, m, months);
      } else if(it.kind==='once'){
        if((it.month||1)===m) amt = it.amount||0;
      } else if(it.kind==='variable'){
        const d = it.driver||{}; const rate = d.rate||0;
        if(d.base==='cash_in')            amt = o.cashIn[m]*rate;
        else if(d.base==='revenue')       amt = o.revenue[m]*rate;
        else if(d.base==='gmv_addons')    amt = o.gmvAddon[m]*rate;
        else if(d.base==='active')        amt = o.active[m]*rate;
        else if(d.base==='new_paying')    amt = o.newPaying[m]*rate;
        else if(d.base==='active_step500')amt = Math.floor(o.active[m]/500)*rate;
        const from = it.from || 1, to = it.to || months;
        if(m<from || m>to) amt = 0;
      }
      if(!amt) return;
      const cat = it.cat || 'other';
      if(o.byCat[cat]) o.byCat[cat][m] += amt; else o.byCat.other[m] += amt;
      const kind = expCatPnl(it);
      if(kind==='cogs')      o.cogs[m]  += amt;
      else if(kind==='capex'){ o.capex[m] += amt; capexQueue.push({from:m, amount:amt}); }
      else                   o.opex[m]  += amt;
    });
    o.opex[m] += o.payrollTotal[m];

    /* --- P&L --- */
    o.depreciation[m] = capexQueue.reduce((s,c)=>
      (m>=c.from && m<c.from+CAPEX_AMORT_MONTHS) ? s+c.amount/CAPEX_AMORT_MONTHS : s, 0);
    o.grossProfit[m] = o.revenue[m]-o.cogs[m];
    o.grossMargin[m] = o.revenue[m] ? o.grossProfit[m]/o.revenue[m] : 0;
    o.ebitda[m]      = o.grossProfit[m]-o.opex[m];
    o.ebit[m]        = o.ebitda[m]-o.depreciation[m];

    if(tax.base==='usn15'){
      const taxBase = o.revenue[m]-o.cogs[m]-o.opex[m];
      o.taxProfit[m] = Math.max(taxBase*0.15, o.revenue[m]*0.01);
    } else {
      /* УСН «доходы» 6%: налог уменьшается на страховые взносы, но не более чем вдвое */
      const gross = o.revenue[m]*0.06;
      o.taxProfit[m] = Math.max(gross - Math.min(o.insurance[m], gross*0.5), 0);
    }
    o.taxTotal[m]  = o.taxProfit[m];
    o.netProfit[m] = o.ebit[m]-o.taxProfit[m];

    /* --- денежный поток --- */
    o.totalExpense[m] = o.cogs[m]+o.opex[m]+o.taxProfit[m];
    const cashOutOper = o.totalExpense[m];
    o.cfOper[m]   = o.cashIn[m]-cashOutOper;
    o.cfInvest[m] = -o.capex[m];
    o.cfFin[m]    = financing.filter(f=>f.month===m).reduce((s,f)=>s+(f.amount||0),0);
    o.cfNet[m]    = o.cfOper[m]+o.cfInvest[m]+o.cfFin[m];
    o.cash[m]     = o.cash[m-1]+o.cfNet[m];
    o.cumOperNoFin[m] = o.cumOperNoFin[m-1]+o.cfOper[m]+o.cfInvest[m];
    o.burn[m]     = Math.max(0, -(o.cfOper[m]+o.cfInvest[m]));

    /* --- юнит-экономика --- */
    const marketing = o.byCat.marketing[m];
    o.cac[m]  = o.newPaying[m] ? marketing/o.newPaying[m] : 0;
    o.arpu[m] = o.active[m] ? o.revenue[m]/o.active[m] : 0;
    const blendedChurn = o.active[m] ? (o.activeMonthly[m]*R.churn+o.activeAnnual[m]*R.churnAnnual)/o.active[m] : R.churn;
    o.ltv[m]  = blendedChurn>0 ? o.arpu[m]*o.grossMargin[m]/blendedChurn : 0;
    o.ltvCac[m] = o.cac[m] ? o.ltv[m]/o.cac[m] : 0;
  }

  /* --- сводные показатели --- */
  o.breakevenMonth   = o.ebitda.findIndex((v,i)=>i>0 && v>0);
  o.cashPositiveMonth= o.cfOper.findIndex((v,i)=>i>0 && v>0);
  o.minCumOper       = Math.min(...o.cumOperNoFin.slice(1));
  o.minCumOperMonth  = o.cumOperNoFin.indexOf(o.minCumOper);
  o.minCash          = Math.min(...o.cash.slice(1));
  o.blendedChurn     = R.churn*(1-R.annualShare)+R.churnAnnual*R.annualShare;
  return o;
}

/* Собрать конфиг из сохранённых данных и посчитать модель. */
async function getVariants(){
  if(!('eva-club-fin-variants' in _cache)){

    _cache['eva-club-fin-variants'] = stored || {items:[], approved:null};
  }

function saveVariants(v){ setCacheLocal('eva-club-fin-variants', v); persistCache('eva-club-fin-variants'); }

/* снимок текущих ползунков — только доходная часть */
async function variantFromCurrent(name, kind){
  const fun = await getFunnelCfg(), rev = await getRevenueCfg();
  const f = {}, r = {};
  VARIANT_FUNNEL_KEYS.forEach(k=>{ if(fun[k]!==undefined) f[k] = fun[k]; });
  VARIANT_REVENUE_KEYS.forEach(k=>{ if(rev[k]!==undefined) r[k] = JSON.parse(JSON.stringify(rev[k])); });
  return {id:uid(), name, kind, funnel:f, revenue:r, savedAt:new Date().toISOString()};
}
/* применить вариант: трогаем только доходы, расходы остаются как есть */
async function applyVariant(v){
  const fun = await getFunnelCfg(); Object.assign(fun, v.funnel); saveFunnelCfg(fun);
  const rev = await getRevenueCfg(); Object.assign(rev, JSON.parse(JSON.stringify(v.revenue))); saveRevenueCfg(rev);
  _finScenario = null;
}
function scaleVariant(v, s){
  const cl = (x,a,b)=>Math.max(a, Math.min(b, x));
  const f = Object.assign({}, v.funnel), r = JSON.parse(JSON.stringify(v.revenue||{}));
  ['growthY1','growthY2','growthY3'].forEach(k=>{ if(f[k]!==undefined) f[k] = +cl(f[k]*s, 0, 0.4).toFixed(4); });
  ['crRegPay','crLeadReg'].forEach(k=>{ if(f[k]!==undefined) f[k] = +cl(f[k]*Math.sqrt(s), 0.01, 0.9).toFixed(4); });
  if(f.newPayingM1!==undefined) f.newPayingM1 = Math.max(1, Math.round(f.newPayingM1*Math.sqrt(s)));
  ['churn','churnAnnual'].forEach(k=>{ if(r[k]!==undefined) r[k] = +cl(r[k]/Math.sqrt(s), 0.002, 0.5).toFixed(4); });
  return Object.assign({}, v, {funnel:f, revenue:r});
}
function variantModel(baseCfg, v){
  const cfg = Object.assign({}, baseCfg, {
    funnel:  Object.assign({}, baseCfg.funnel,  v.funnel||{}),
    revenue: Object.assign({}, baseCfg.revenue, v.revenue||{}),
  });
  return computeFinModel(cfg);
}
function variantStats(baseCfg, v){
  const m = variantModel(baseCfg, v);
  return {
    revY3:  cfSumRange(m.revenue, 25, 36),
    turnY3: cfSumRange(m.turnover, 25, 36),
    active36: m.active[36],
    be: m.breakevenMonth,
    minCash: m.minCash,
  };
}
/* подгонка: ищем множитель силы, при котором вариант попадает
   в разумную полосу относительно базового */
function fitVariant(baseCfg, v, targetRev){
  let lo = 0.2, hi = 4, best = v;
  for(let i=0;i<26;i++){
    const mid = (lo+hi)/2;
    const cand = scaleVariant(v, mid);
    const rev = cfSumRange(variantModel(baseCfg, cand).revenue, 25, 36);
    best = cand;
    if(rev < targetRev) lo = mid; else hi = mid;
  }
  return best;
}
async function buildFinCfg(opts){
  opts = opts || {};
  const exp   = await getExpenses();
  const rev   = await getRevenueCfg();
  /* Первые месяцы модель считает по плану продаж из «Стратегии» —
     это единственный план до запуска. Формула роста включается
     после горизонта плана. Отключается на вкладке «Доходы и воронка». */
  let planOverride = opts.newPayingPlan || null;
  if(!planOverride && rev.useStrategyPlan!==false && !opts.ignoreStrategy){
    planOverride = salesPlanFromGoals(await getStratPlan(), STRAT_MONEY_HORIZON);
  }
  const fun   = await getFunnelCfg();
  const tax   = await getTaxCfg();
  const fin   = await getFinancing();
  let hires   = await buildHires();
  let items   = exp.items.slice();
  if(opts.economy){
    hires = hires.filter(h=>h.mandatory!==false);
    items = items.filter(i=>i.mandatory!==false);
  }
  if(opts.noFinancing) { /* режим «сколько нужно денег» — считаем без раунда */ }
  return {
    months: opts.months || FIN_HORIZON,
    newPayingPlan: planOverride,
    funnel: Object.assign({}, fun, opts.funnel),
    revenue: Object.assign({}, rev, opts.revenue),
    expenses: items, hires, tax: Object.assign({}, tax, opts.tax),
    financing: opts.noFinancing ? [] : fin,
    cashStart: opts.cashStart!==undefined ? opts.cashStart : exp.cash,
  };
}
async function finModel(opts){ return computeFinModel(await buildFinCfg(opts)); }

/* ============================================================
   ФОРМАТИРОВАНИЕ ЧИСЕЛ
   ============================================================ */
function cfMoney(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const sign = n<0?'−':'';
  n = Math.abs(n);
  if(n>=1e9) return sign+(n/1e9).toFixed(2).replace(/\.00$/,'').replace('.', ',')+' млрд ₽';
  if(n>=1e6) return sign+(n/1e6).toFixed(1).replace(/\.0$/,'').replace('.', ',')+' млн ₽';
  if(n>=1e4) return sign+Math.round(n/1000).toLocaleString('ru-RU')+' тыс ₽';
  return sign+Math.round(n).toLocaleString('ru-RU')+' ₽';
}
function cfPct(n, signed){
  if(n===null||n===undefined||!isFinite(n)) return '—';
  const v = (n*100).toFixed(1).replace(/\.0$/,'').replace('.', ',')+'%';
  return signed && n>0 ? '+'+v : v;
}
function dec(n, digits){ return Number(n).toFixed(digits===undefined?1:digits).replace('.', ','); }
function signedMoney(n){ return (n>=0?'+':'')+money(n); }
function cfSumRange(arr, from, to){ let s=0; for(let i=from;i<=to;i++) s+=(arr[i]||0); return s; }
function finTrendCls(n){ return n<0 ? 'neg' : 'pos'; }

/* ============================================================
   ЕЖЕДНЕВНАЯ ОТЧЁТНОСТЬ — ФАКТ
   Один день = одна запись одного и того же формата.
   Из дневных записей собираются недели, месяцы и кварталы,

/* --- Демо-факт: 4 отработанных месяца ------------------------------
   Данные вымышленные, но собраны так, чтобы сходиться с планом
   первых четырёх месяцев: подписка, допродажи, воронка и расходы.
   Генератор детерминированный — при перезагрузке цифры те же.       */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* План по месяцам демо-периода: новые платящие, отток, регистрации,
   лиды, контент, эксперты и разовые платежи по категориям. */
const DEMO_MONTHS = [
  {y:2026, m:8,  newPay:17,  churn:1,  reg:110, leads:900,  content:26, experts:9,
   spend:{marketing:95000,  content:60000, other:18000}},
  {y:2026, m:9,  newPay:61,  churn:6,  reg:330, leads:2900, content:34, experts:13,
   spend:{marketing:240000, content:75000, other:24000}},
  {y:2026, m:10, newPay:89,  churn:11, reg:400, leads:3400, content:29, experts:11,
   spend:{marketing:365000, content:80000, other:26000}},
  {y:2026, m:11, newPay:107, churn:15, reg:460, leads:3800, content:24, experts:8,
   spend:{marketing:470000, content:85000, other:29000}},
];

function generateDemoDaily(){
  const rnd = mulberry32(20260901);
  const out = [], ledger = [];
  let active = 0;
  const price = DEFAULT_REVENUE.priceMonthly;
  const priceY = DEFAULT_REVENUE.priceAnnual;
  const addonIds = DEFAULT_REVENUE.addons.map(a=>a.id);

  DEMO_MONTHS.forEach(M=>{
    const nd = daysInMonth(M.y, M.m);
    /* веса дней: будни живее выходных, к концу месяца небольшой всплеск */
    const w = [];
    for(let d=1; d<=nd; d++){
      const dow = new Date(M.y, M.m, d).getDay();
      let k = (dow===0||dow===6) ? 0.62 : 1.0;
      if(d>=nd-2) k *= 1.25;
      k *= 0.8+rnd()*0.45;
      w.push(k);
    }
    const wSum = w.reduce((a,b)=>a+b,0);
    const spread = (total)=>{
      const raw = w.map(k=>total*k/wSum);
      const ints = raw.map(v=>Math.floor(v));
      let left = Math.round(total) - ints.reduce((a,b)=>a+b,0);
      const order = raw.map((v,i)=>[v-Math.floor(v), i]).sort((a,b)=>b[0]-a[0]);
      for(let i=0; i<order.length && left>0; i++, left--) ints[order[i][1]]++;
      return ints;
    };
    const dayNew   = spread(M.newPay);
    const dayChurn = spread(M.churn);
    const dayReg   = spread(M.reg);
    const dayLeads = spread(M.leads);
    const dayCont  = spread(M.content);
    const dayExp   = spread(M.experts);
    const daySpend = {};
    Object.keys(M.spend).forEach(cat=>{ daySpend[cat] = spread(M.spend[cat]); });

    for(let i=0; i<nd; i++){
      const d = i+1;
      const iso = isoDate(M.y, M.m, d);
      const newPay = dayNew[i];
      const annual = Math.round(newPay*(0.10+rnd()*0.12));
      const churn  = dayChurn[i];
      /* поступления: новые оплаты + продления действующей базы,
         распределённые по дням месяца */
      const renewals = active*(1-DEFAULT_REVENUE.annualShare)*price/nd;
      const revSub = Math.round((newPay-annual)*price + annual*priceY + renewals);
      /* оборот допродаж: доля активной базы покупает что-то каждый день */
      const gmv = {};
      DEFAULT_REVENUE.addons.forEach(a=>{
        const buyers = active*a.conv/nd*(0.55+rnd()*0.95);
        gmv[a.id] = Math.round(buyers*a.price);
      });
      const spend = {};
      Object.keys(daySpend).forEach(cat=>{ if(daySpend[cat][i]) spend[cat] = daySpend[cat][i]; });

      out.push({
        d: iso, leads: dayLeads[i], reg: dayReg[i], newPay, annual, churn,
        content: dayCont[i], experts: dayExp[i], demo:true,
      });
      if(revSub) ledger.push({id:'demo_'+iso+'_in_sub', d:iso, kind:'in', cat:'sub', amount:revSub, note:'', demo:true});
      Object.entries(gmv).forEach(([id,v])=>{ if(v) ledger.push({id:'demo_'+iso+'_in_'+id, d:iso, kind:'in', cat:id, amount:v, note:'', demo:true}); });
      Object.entries(spend).forEach(([cat,v])=>{ if(v) ledger.push({id:'demo_'+iso+'_out_'+cat, d:iso, kind:'out', cat, amount:v, note:'', demo:true}); });
      active = Math.max(0, active+newPay-churn);
    }
  });
  return {days: out, ledger};
}

/* ============================================================
   ДВА ХРАНИЛИЩА ВМЕСТО ОДНОГО
   • дни — воронка и производство (регистрации, платящие, контент);
   • журнал платежей — каждое движение денег отдельной строкой:
     дата, приход или расход, статья, сумма, комментарий.
   Деньги живут только в журнале: это и есть таблица «доходы и
   расходы», которую заполняет менеджер. Для расчётов оба списка
   склеиваются в один вид дня — getDays().
   ============================================================ */
const LEDGER_MONEY_FIELDS = ['revSub','gmv','spend','finIn'];

function stripMoneyFromDay(r){
  const o = Object.assign({}, r);
  LEDGER_MONEY_FIELDS.forEach(k=>{ delete o[k]; });
  return o;
}
/* Старые дневные записи хранили деньги внутри себя — разносим их по
   журналу платежей один раз, с предсказуемыми id, чтобы не задвоить. */
function migrateDayMoneyToLedger(days, ledger){
  const have = new Set(ledger.map(e=>e.id));
  let touched = false;
  days.forEach(r=>{
    if(r.revSub){ const id='mig_'+r.d+'_in_sub'; if(!have.has(id)){ ledger.push({id, d:r.d, kind:'in', cat:'sub', amount:r.revSub, note:'', demo:!!r.demo}); have.add(id); } touched = true; }
    Object.entries(r.gmv||{}).forEach(([c,v])=>{ if(!v) return; const id='mig_'+r.d+'_in_'+c; if(!have.has(id)){ ledger.push({id, d:r.d, kind:'in', cat:c, amount:v, note:'', demo:!!r.demo}); have.add(id); } touched = true; });
    Object.entries(r.spend||{}).forEach(([c,v])=>{ if(!v) return; const id='mig_'+r.d+'_out_'+c; if(!have.has(id)){ ledger.push({id, d:r.d, kind:'out', cat:c, amount:v, note:'', demo:!!r.demo}); have.add(id); } touched = true; });
  });
  return touched;
}

async function _loadDayStores(){
  if('eva-club-daily' in _cache && 'eva-club-ledger' in _cache) return;
  const storedDays = await loadShared('eva-club-daily', null);
  const storedLedger = await loadShared('eva-club-ledger', null);
  let days, ledger;
  if(Array.isArray(storedDays)){
    /* Пустой список — осознанный выбор («очистить демо-данные»),
       а не отсутствие данных: демо подставляется только когда в базе
       вообще ничего нет. */
    days = storedDays;
    ledger = Array.isArray(storedLedger) ? storedLedger : [];
    if(migrateDayMoneyToLedger(days, ledger)){
      days = days.map(stripMoneyFromDay);
      setCacheLocal('eva-club-daily', days); persistCache('eva-club-daily');
      setCacheLocal('eva-club-ledger', ledger); persistCache('eva-club-ledger');
    }
  } else {
    const demo = generateDemoDaily();
    days = demo.days; ledger = Array.isArray(storedLedger) ? storedLedger.concat(demo.ledger) : demo.ledger;
  }
  days.sort((a,b)=>a.d.localeCompare(b.d));
  ledger.sort((a,b)=>a.d.localeCompare(b.d));

  _cache['eva-club-ledger'] = ledger;
}

/* Деньги дня из журнала: подписка, оборот по потокам, платежи по категориям. */
function ledgerByDay(ledger){
  const map = {};
  ledger.forEach(e=>{
    const m = map[e.d] || (map[e.d] = {revSub:0, gmv:{}, spend:{}, finIn:0});
    if(e.kind==='fin'){ m.finIn += e.amount||0; return; }
    if(e.kind==='in'){
      if(e.cat==='sub') m.revSub += e.amount||0;
      else m.gmv[e.cat] = (m.gmv[e.cat]||0)+(e.amount||0);
    } else {
      m.spend[e.cat||'other'] = (m.spend[e.cat||'other']||0)+(e.amount||0);
    }
  });
  return map;
}
/* Объединённый вид: метрики дня + деньги дня. Есть запись на каждую
   дату, где было хоть что-то — метрика или платёж. */
async function getDays(){
  const days = await getDailyMetrics();
  const ledger = await getLedger();
  const money = ledgerByDay(ledger);
  const byDate = {};
  days.forEach(r=>{ byDate[r.d] = Object.assign(emptyDay(r.d), r); });
  Object.keys(money).forEach(d=>{ if(!byDate[d]) byDate[d] = emptyDay(d); });
  const out = Object.values(byDate).sort((a,b)=>a.d.localeCompare(b.d));
  out.forEach(r=>{
    const m = money[r.d];
    if(m){ r.revSub = m.revSub; r.gmv = m.gmv; r.spend = m.spend; r.finIn = m.finIn||0; }
    r.demo = !!(days.find(x=>x.d===r.d)||{}).demo || ledger.some(e=>e.d===r.d && e.demo);
  });
  return out;
}
/* Совместимость: старые вызовы получают объединённый вид. */
async function getDaily(){ return getDays(); }
function emptyDay(iso){
  return {d:iso, leads:0, reg:0, newPay:0, annual:0, churn:0, revSub:0, gmv:{}, spend:{}, finIn:0, content:0, experts:0};
}

/* Свод дневных записей за период + разложение выручки по потокам. */
function rollupDays(days, revCfg){
  const takeMap = Object.fromEntries((revCfg.addons||[]).map(a=>[a.id, a]));
  const agg = {
    days: days.length, leads:0, reg:0, newPay:0, annual:0, churn:0,
    revSub:0, gmvTotal:0, revAddonNet:0, revenue:0,
    gmvByStream:{}, netByStream:{}, spendByCat:{}, spendTotal:0, finIn:0,
    content:0, experts:0, first: days.length?days[0].d:null, last: days.length?days[days.length-1].d:null,
  };
  days.forEach(r=>{
    agg.leads+=r.leads||0; agg.reg+=r.reg||0; agg.newPay+=r.newPay||0;
    agg.annual+=r.annual||0; agg.churn+=r.churn||0; agg.revSub+=r.revSub||0;
    agg.content+=r.content||0; agg.experts+=r.experts||0; agg.finIn+=r.finIn||0;
    Object.entries(r.gmv||{}).forEach(([id,v])=>{
      agg.gmvByStream[id] = (agg.gmvByStream[id]||0)+v;
      const take = takeMap[id] ? takeMap[id].take : 1;
      agg.netByStream[id] = (agg.netByStream[id]||0)+v*take;
      agg.gmvTotal += v; agg.revAddonNet += v*take;
    });
    Object.entries(r.spend||{}).forEach(([cat,v])=>{
      agg.spendByCat[cat] = (agg.spendByCat[cat]||0)+v;
      agg.spendTotal += v;
    });
  });
  agg.revenue = agg.revSub+agg.revAddonNet;
  agg.crRegPay  = agg.reg   ? agg.newPay/agg.reg  : 0;
  agg.crLeadReg = agg.leads ? agg.reg/agg.leads   : 0;
  agg.cac = agg.newPay ? (agg.spendByCat.marketing||0)/agg.newPay : 0;
  return agg;
}

/* Активная платящая база на конец каждого дня — из дневных записей.
   Месячные и годовые подписчики считаются отдельно: у них разная
   экономика и разное признание выручки. */
function activeSeries(days){
  let am = 0, aa = 0;
  return days.map(r=>{
    const na = Math.min(r.annual||0, r.newPay||0);
    const nm = (r.newPay||0)-na;
    const tot = am+aa, ch = r.churn||0;
    const cm = tot ? ch*am/tot : ch;
    const ca = tot ? ch-cm : 0;
    am = Math.max(0, am+nm-cm); aa = Math.max(0, aa+na-ca);
    return {d:r.d, am, aa, active:am+aa};
  });
}
function activeAt(days, iso){
  const series = activeSeries(days.filter(r=>r.d<=iso));
  return series.length ? series[series.length-1].active : 0;
}

function groupDaysBy(days, keyFn){
  const map = new Map();
  days.forEach(r=>{
    const k = keyFn(r.d);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return map;
}

/* Фактические расходы месяца = дневные платежи + ФОТ + регулярные и
   единоразовые позиции реестра, попадающие на этот месяц. */
/* Сумма регулярного расхода в конкретном месяце: базовая ставка в
   периоде «с — по», а если для месяца задано своё значение — оно.
   Так студия может стоить 175 в октябре и 150 в декабре. */
function monthlyAmountAt(it, m, months){
  const from = it.from||1, to = it.to||months||FIN_HORIZON;
  const ov = it.byMonth && it.byMonth[m];
  if(ov!==undefined && ov!==null && ov!=='') return Number(ov)||0;
  if(m>=from && m<=to) return it.amount||0;
  return 0;
}
function registryMonthCost(items, m, months){
  const out = {byCat:{}, cogs:0, opex:0, capex:0, total:0};
  items.forEach(it=>{
    let amt = 0;
    if(it.kind==='monthly'){
      amt = monthlyAmountAt(it, m, months);
    } else if(it.kind==='once'){
      if((it.month||1)===m) amt = it.amount||0;
    } else return;  /* переменные считаются от факта отдельно */
    if(!amt) return;
    const cat = it.cat||'other';
    out.byCat[cat] = (out.byCat[cat]||0)+amt;
    const k = expCatPnl(it);
    if(k==='cogs') out.cogs+=amt; else if(k==='capex') out.capex+=amt; else out.opex+=amt;
    out.total += amt;
  });
  return out;
}
function registryVariableCost(items, ctx){
  const out = {byCat:{}, cogs:0, opex:0, capex:0, total:0};
  items.filter(i=>i.kind==='variable').forEach(it=>{
    const d = it.driver||{}; const rate = d.rate||0; let amt = 0;
    if(d.base==='cash_in')             amt = ctx.cashIn*rate;
    else if(d.base==='revenue')        amt = ctx.revenue*rate;
    else if(d.base==='gmv_addons')     amt = ctx.gmv*rate;
    else if(d.base==='active')         amt = ctx.active*rate;
    else if(d.base==='new_paying')     amt = ctx.newPaying*rate;
    else if(d.base==='active_step500') amt = Math.floor(ctx.active/500)*rate;
    if(!amt) return;
    const cat = it.cat||'other';
    out.byCat[cat] = (out.byCat[cat]||0)+amt;
    const k = expCatPnl(it);
    if(k==='cogs') out.cogs+=amt; else if(k==='capex') out.capex+=amt; else out.opex+=amt;
    out.total += amt;
  });
  return out;
}

/* Полный фактический месяц.
   Выручка считается дважды и по-разному, потому что это разные вещи:
     • начислением — то, что заработано в этом месяце: месячные
       подписчики × цена плюс годовые × 1/12 годовой цены. Это идёт в P&L.
     • деньгами — то, что реально пришло на счёт: годовая подписка
       приносит все 24 900 ₽ сразу. Это идёт в денежный поток.
   Разница копится в авансах полученных.

   Расходы: ФОТ всегда из штата, переменные позиции считаются от факта.
   Для категории, по которой в этом месяце были дневные платежи, берётся
   факт из отчётов, а плановая строка реестра пропускается — иначе один
   и тот же рубль посчитался бы дважды. */
function factMonth(monthKey, days, ctxCfg){
  const {items, hires, tax, revCfg, allDays} = ctxCfg;
  const insRate = tax.it ? 0.076 : 0.30;
  const [y, mm] = monthKey.split('-').map(Number);
  const m = y*12 + (mm-1) - FIN_BASE_ABS + 1;
  const agg = rollupDays(days, revCfg);
  const lastDay = days.length ? days[days.length-1].d : monthKey+'-28';
  const dim = daysInMonth(y, mm-1);

  const series = activeSeries(allDays);
  const inMonth = series.filter(x=>monthKeyOf(x.d)===monthKey);
  const endState = inMonth.length ? inMonth[inMonth.length-1] : {am:0, aa:0, active:0};
  const active = endState.active;
  const avgAm = inMonth.length ? inMonth.reduce((s2,x)=>s2+x.am,0)/inMonth.length : 0;
  const avgAa = inMonth.length ? inMonth.reduce((s2,x)=>s2+x.aa,0)/inMonth.length : 0;
  const activeAvg = avgAm+avgAa;

  /* выручка начислением */
  const revSubAccrual = avgAm*revCfg.priceMonthly + avgAa*(revCfg.priceAnnual/12);
  const revenue  = revSubAccrual + agg.revAddonNet;
  const cashIn   = agg.revSub + agg.revAddonNet;
  const deferredDelta = cashIn - revenue;

  const fot = hires.filter(h=>h.month<=m && (!h.until || m<=h.until)).reduce((s2,h)=>s2+(h.salary||0),0);
  const insurance = fot*insRate;

  const dailyCats = new Set(Object.keys(agg.spendByCat).filter(c=>agg.spendByCat[c]>0));
  const planItems = items.filter(it=>!dailyCats.has(it.cat||'other'));
  const reg  = registryMonthCost(planItems, m, FIN_HORIZON);
  const varc = registryVariableCost(planItems, {
    cashIn, revenue, gmv: agg.gmvTotal, active: activeAvg, newPaying: agg.newPay,
  });

  const byCat = {};
  const add = (cat, v)=>{ if(v) byCat[cat] = (byCat[cat]||0)+v; };
  add('fot', fot+insurance);
  Object.entries(reg.byCat).forEach(([c,v])=>add(c,v));
  Object.entries(varc.byCat).forEach(([c,v])=>add(c,v));
  Object.entries(agg.spendByCat).forEach(([c,v])=>add(c,v));

  let dailyCogs=0, dailyOpex=0, dailyCapex=0;
  Object.entries(agg.spendByCat).forEach(([c,v])=>{
    const k = (EXP_CAT_MAP[c]||{}).pnl || 'opex';
    if(k==='cogs') dailyCogs+=v; else if(k==='capex') dailyCapex+=v; else dailyOpex+=v;
  });

  const cogs  = reg.cogs+varc.cogs+dailyCogs;
  const opex  = reg.opex+varc.opex+dailyOpex+fot+insurance;
  const capex = reg.capex+varc.capex+dailyCapex;
  const grossProfit = revenue-cogs;
  const ebitda = grossProfit-opex;
  let taxProfit;
  if(tax.base==='usn15') taxProfit = Math.max((revenue-cogs-opex)*0.15, revenue*0.01);
  else { const g = revenue*0.06; taxProfit = Math.max(g-Math.min(insurance, g*0.5), 0); }
  const netProfit = ebitda-taxProfit;

  return {
    key:monthKey, m, label:monthKeyLabel(monthKey), agg, active, activeAvg, activeMonthly:endState.am, activeAnnual:endState.aa,
    fot, insurance, byCat, cogs, opex, capex,
    revenue, revSub:revSubAccrual, cashIn, deferredDelta, days: days.length, dim,
    grossProfit, grossMargin: revenue?grossProfit/revenue:0,
    ebitda, taxProfit, netProfit,
    totalExpense: cogs+opex+taxProfit,
    finIn: agg.finIn,
    cashFlow: cashIn-cogs-opex-taxProfit-capex+agg.finIn,
  };
}

async function buildFactMonths(){
  const days = await getDaily();
  const items = (await getExpenses()).items;
  const hires = await buildHires();
  const tax = await getTaxCfg();
  const revCfg = await getRevenueCfg();
  const byMonth = groupDaysBy(days, monthKeyOf);
  const keys = Array.from(byMonth.keys()).sort();
  const ctx = {items, hires, tax, revCfg, allDays:days};
  return keys.map(k=>factMonth(k, byMonth.get(k), ctx));
}


/* Simple inline SVG grouped bar chart — no external library needed. */
function groupedBarChart(labels, seriesA, seriesB, opts){
  opts = opts || {};
  const w = 640, h = 220, padB = 26, padT = 10;
  const max = Math.max(...seriesA, ...seriesB, 1);
  const n = labels.length;
  const groupW = w / n;
  const barW = groupW * 0.30;
  const bars = labels.map((lab,i)=>{
    const cx = i*groupW + groupW/2;
    const ah = (seriesA[i]/max) * (h-padB-padT);
    const bh = (seriesB[i]/max) * (h-padB-padT);
    const ax = cx - barW - 2, bx = cx + 2;
    return `
      <rect x="${ax}" y="${h-padB-ah}" width="${barW}" height="${ah}" rx="2" fill="var(--green)"/>
      <rect x="${bx}" y="${h-padB-bh}" width="${barW}" height="${bh}" rx="2" fill="var(--rust)"/>
      <text x="${cx}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">${esc(lab)}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">${bars}</svg>`;
}
function lineChart(labels, series, color){
  const w = 640, h = 180, padB = 24, padT = 14, padX = 10;
  const max = Math.max(...series, 1);
  const n = series.length;
  const stepX = (w-padX*2) / Math.max(n-1,1);
  const pts = series.map((v,i)=>{
    const x = padX + i*stepX;
    const y = h-padB - (v/max)*(h-padB-padT);
    return [x,y];
  });
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const labs = labels.map((lab,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">${esc(lab)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>${dots}${labs}
  </svg>`;
}

/* Multi-series line chart — used for План vs Факт comparisons. seriesList: [{name,color,values,dash}] */
function multiLineChart(labels, seriesList){
  const w = 640, h = 200, padB = 26, padT = 14, padX = 10;
  const allVals = seriesList.flatMap(s=>s.values);
  const max = Math.max(...allVals, 1);
  const n = labels.length;
  const stepX = (w-padX*2) / Math.max(n-1,1);
  const toPts = (values)=>values.map((v,i)=>[padX+i*stepX, h-padB-(v/max)*(h-padB-padT)]);
  const lines = seriesList.map(s=>{
    const pts = toPts(s.values);
    const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${s.color}"/>`).join('');
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash?'stroke-dasharray="5,4"':''}/>${dots}`;
  }).join('');
  const labs = labels.map((lab,i)=>`<text x="${(padX+i*stepX).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">${esc(lab)}</text>`).join('');
  const legend = seriesList.map(s=>`<span style="display:inline-flex; align-items:center; gap:6px; margin-right:16px;"><span style="width:14px; height:${s.dash?'0':'3'}px; ${s.dash?'border-top:2px dashed '+s.color:'background:'+s.color}; display:inline-block; border-radius:2px;"></span>${esc(s.name)}</span>`).join('');
  return `<div style="margin-bottom:8px; font-size:12px;">${legend}</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">${lines}${labs}</svg>`;
}

async function renderDepartmentDetail(id){

  if(!d){ app.innerHTML = `<div class="empty-state">Отдел не найден.</div><a class="back-link" href="#departments">← К отделам</a>`; return; }

function wireExpenseRegistry(rerender){
  document.querySelectorAll('.money-fmt-input').forEach(wireThousandsInput);
  const catSel = document.getElementById('expFilterCat');
  if(catSel) catSel.onchange = ()=>{ _expFilterCat = catSel.value; rerender(); };
  const kindSel = document.getElementById('expFilterKind');
  if(kindSel) kindSel.onchange = ()=>{ _expFilterKind = kindSel.value; rerender(); };

  document.querySelectorAll('[data-exp-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const exp = await getExpenses();
      const it = exp.items.find(x=>x.id===inp.dataset.id);
      if(!it) return;
      const f = inp.dataset.expField;
      if(f==='amount')            it.amount = parseThousands(inp.value);
      else if(f==='from')         it.from = parseInt(inp.value)||1;
      else if(f==='to')           it.to = parseInt(inp.value)||null;
      else if(f==='month')        it.month = parseInt(inp.value)||1;
      else if(f==='driverBase'){  it.driver = it.driver||{}; it.driver.base = inp.value; }
      else if(f==='driverRate'){
        it.driver = it.driver||{};
        const def = EXP_DRIVER_MAP[it.driver.base]||{};
        it.driver.rate = def.unit==='pct' ? (parseFloat(inp.value)||0)/100 : (parseFloat(inp.value)||0);
      }
      else if(f==='kind'){
        it.kind = inp.value;
        if(it.kind==='variable' && !it.driver) it.driver = {base:'revenue', rate:0.05};
        if(it.kind==='once' && !it.month) it.month = it.from||1;
      }
      else it[f] = inp.value;
      saveExpenses(exp); rerender();
    });
  });
  document.querySelectorAll('.exp-mandatory').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const exp = await getExpenses();
      const it = exp.items.find(x=>x.id===cb.dataset.id);
      if(it){ it.mandatory = cb.checked; saveExpenses(exp); rerender(); }
    });
  });
  document.querySelectorAll('[data-del-exp]').forEach(btn=>{
    btn.onclick = async ()=>{
      const exp = await getExpenses();
      exp.items = exp.items.filter(x=>x.id!==btn.dataset.delExp);
      saveExpenses(exp); rerender();
    };
  });

  const kindNew = document.getElementById('newExpKind');
  const toggleNewRows = ()=>{
    const v = kindNew.value;
    document.getElementById('newExpDriverRow').style.display = v==='variable' ? '' : 'none';
    document.getElementById('newExpAmountRow').style.display = v==='variable' ? 'none' : '';
  };
  if(kindNew){ kindNew.onchange = toggleNewRows; toggleNewRows(); }

  const addBtn = document.getElementById('addExpBtn');
  if(addBtn) addBtn.onclick = async ()=>{
    const name = document.getElementById('newExpName').value.trim();
    if(!name){ document.getElementById('newExpName').focus(); return; }
    const kind = kindNew.value;
    const exp = await getExpenses();
    const rec = {
      id: uid(), name, cat: document.getElementById('newExpCat').value, kind,
      mandatory: document.getElementById('newExpMandatory').checked, dept:null,
    };
    if(kind==='variable'){
      const base = document.getElementById('newExpDriver').value;
      const def = EXP_DRIVER_MAP[base]||{};
      const raw = parseFloat(document.getElementById('newExpRate').value)||0;
      rec.driver = {base, rate: def.unit==='pct' ? raw/100 : raw};
      rec.from = 1; rec.to = null;
    } else if(kind==='once'){
      rec.amount = parseThousands(document.getElementById('newExpAmount').value);
      rec.month = parseInt(document.getElementById('newExpFrom').value)||1;
    } else {
      rec.amount = parseThousands(document.getElementById('newExpAmount').value);
      rec.from = parseInt(document.getElementById('newExpFrom').value)||1;
      rec.to = parseInt(document.getElementById('newExpTo').value)||null;
    }
    exp.items.push(rec);
    saveExpenses(exp); rerender();
  };
}

  /* сценарий меняет только доходную часть: воронку, цены и отток.

     сценариев — иначе «пессимизм» незаметно переписывал бы бюджет. */
  const fun = await getFunnelCfg(); Object.assign(fun, s.funnel); saveFunnelCfg(fun);

}

async function renderFinDashboard(body){
  const model = await finModel({economy:_economyMode});
  const facts = await buildFactMonths();
  const exp   = await getExpenses();
  const tax   = await getTaxCfg();

  const lastFact = facts[facts.length-1];
  const factRevenue = facts.reduce((s,f)=>s+f.revenue,0);
  const factSpend   = facts.reduce((s,f)=>s+f.totalExpense,0);
  const planRevenue = cfSumRange(model.revenue, 1, facts.length);
  const planSpend   = cfSumRange(model.cogs, 1, facts.length)+cfSumRange(model.opex,1,facts.length)+cfSumRange(model.taxTotal,1,facts.length);

  const be   = model.breakevenMonth;
  const burnNow = lastFact ? Math.max(0, lastFact.totalExpense-lastFact.revenue) : model.burn[1];
  const cashNow = exp.cash + facts.reduce((s,f)=>s+f.cashFlow,0);
  const runway  = burnNow>0 ? cashNow/burnNow : null;

  const tiles = [
    {l:'выход в плюс по EBITDA', v: be>0 ? finMonthLabel(be) : 'позже 36 мес.', cls: be>0?'':'neg'},
    {l:'платящих через 12 мес.', v: num(model.active[12])},
    {l:'выручка Год 1', v: cfMoney(cfSumRange(model.revenue,1,12))},
    {l:'выручка Год 3', v: cfMoney(cfSumRange(model.revenue,25,36))},
    {l:'минимум на счету', v: cfMoney(model.minCash), cls: model.minCash<0?'neg':'pos'},
  ];

  let statusCls, statusLabel, statusDesc;
  if(runway!==null && runway<3){
    statusCls='warn'; statusLabel='Короткий запас хода';
    statusDesc=`На счету ${money(cashNow)}, факт burn ${money(burnNow)}/мес — денег примерно на ${dec(runway)} мес. Либо режим экономии на вкладке «Расходы», либо деньги в течение квартала.`;
  } else if(lastFact && lastFact.ebitda>=0){
    statusCls='good'; statusLabel='Операционный плюс';
    statusDesc='Последний закрытый месяц отработан в плюс по EBITDA — выручка покрывает и себестоимость, и операционные расходы.';
  } else {
    statusCls='neutral'; statusLabel='Плановый минус — инвестиционная стадия';
    statusDesc=`Модель выходит в плюс ${be>0?('в '+finMonthLabel(be)):'позже 36-го месяца'}. До этого минус — это цена роста, а не сбой. Запас хода: ${runway!==null?dec(runway)+' мес.':'—'}.`;
  }

/* План против факта по категориям за закрытые месяцы. Это и есть
   «учёт расходов»: реестр задаёт план, ежедневные отчёты и штат дают
   факт, а разница показывает, где бюджет уехал. */
function planFactExpenseHtml(model, facts){
  if(!facts.length) return `
    <section class="block">
      <h2>План против факта</h2>
      <p class="block-sub">Как только в «Отчётах» появятся закрытые месяцы, здесь встанет сравнение реестра с фактическими платежами по каждой категории.</p>
    </section>`;
  const n = facts.length;
  const rows = EXP_CATS.map(c=>{
    const plan = cfSumRange(model.byCat[c.id], 1, n);
    const fact = facts.reduce((a,f)=>a+(f.byCat[c.id]||0), 0);
    return {c, plan, fact, d: fact-plan};
  }).filter(r=>r.plan>0 || r.fact>0).sort((a,b)=>b.fact-a.fact);
  const totalPlan = rows.reduce((a,r)=>a+r.plan,0);
  const totalFact = rows.reduce((a,r)=>a+r.fact,0);
  const taxPlan = cfSumRange(model.taxTotal, 1, n);
  const taxFact = facts.reduce((a,f)=>a+f.taxProfit, 0);

  return `
    <section class="block">
      <h2>План против факта — ${n} закрытых ${n===1?'месяц':(n<5?'месяца':'месяцев')}</h2>
      <p class="block-sub">Слева то, что заложено в реестр, справа — что реально заплатили по ежедневным отчётам и штату. Перерасход красным: по этим категориям план не держится.</p>
      <div class="card table-card">
        <table class="calc-table">
          <thead><tr><th>Категория</th><th>План</th><th>Факт</th><th>Разница</th><th>Исполнение</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr>
              <td>${r.c.name}</td>
              <td class="num">${money(r.plan)}</td>
              <td class="num hl">${money(r.fact)}</td>
              <td class="num ${r.d>0?'neg':'pos'}">${r.d>=0?'+':'−'}${money(Math.abs(r.d))}</td>
              <td class="num">${r.plan?Math.round(r.fact/r.plan*100)+'%':'—'}</td>
            </tr>`).join('')}
            <tr><td>Налоги и взносы к уплате</td><td class="num">${money(taxPlan)}</td><td class="num hl">${money(taxFact)}</td>
              <td class="num ${taxFact>taxPlan?'neg':'pos'}">${taxFact>=taxPlan?'+':'−'}${money(Math.abs(taxFact-taxPlan))}</td>
              <td class="num">${taxPlan?Math.round(taxFact/taxPlan*100)+'%':'—'}</td></tr>
            <tr class="total-row"><td>Итого</td><td class="num">${money(totalPlan+taxPlan)}</td><td class="num">${money(totalFact+taxFact)}</td>
              <td class="num ${(totalFact+taxFact)>(totalPlan+taxPlan)?'neg':'pos'}">${(totalFact+taxFact)>=(totalPlan+taxPlan)?'+':'−'}${money(Math.abs((totalFact+taxFact)-(totalPlan+taxPlan)))}</td>
              <td class="num">${(totalPlan+taxPlan)?Math.round((totalFact+taxFact)/(totalPlan+taxPlan)*100)+'%':'—'}</td></tr>
          </tbody>
        </table>
      </div>
    </section>`;
}

/* ============================================================
   ЮНИТ-ЭКОНОМИКА И РЕШЕНИЕ ЗАДАЧ «СКОЛЬКО НУЖНО, ЧТОБЫ…»
   ============================================================ */
function unitEconomics(cfg, m){
  m = m || 12;
  const R = cfg.revenue, F = cfg.funnel;
  const arpuSub = (1-R.annualShare)*R.priceMonthly + R.annualShare*(R.priceAnnual/12);
  const addons = (R.addons||[]).filter(a=>a.active!==false);
  const gmvPerUser = addons.reduce((s,a)=>s+a.conv*a.price, 0);
  const arpuAddon  = addons.reduce((s,a)=>s+a.conv*a.price*a.take, 0);
  const arpu = arpuSub+arpuAddon;
  const churn = R.churn*(1-R.annualShare)+R.churnAnnual*R.annualShare;

  /* переменная себестоимость на одного активного в месяц */
  let varPerUser = 0, cacRate = 0, pctOfRevenue = 0;
  (cfg.expenses||[]).filter(i=>i.kind==='variable').forEach(it=>{
    const d = it.driver||{}, r = d.rate||0;
    if(d.base==='active')              varPerUser += r;
    else if(d.base==='active_step500') varPerUser += r/500;
    else if(d.base==='new_paying')     cacRate    += r;
    else if(d.base==='cash_in' || d.base==='revenue') pctOfRevenue += r;
    else if(d.base==='gmv_addons')     varPerUser += gmvPerUser*r;
  });
  varPerUser += arpu*pctOfRevenue;

  /* постоянные расходы месяца m: ФОТ со взносами + регулярные позиции */
  const insRate = (cfg.tax&&cfg.tax.it) ? 0.076 : 0.30;
  const fot = (cfg.hires||[]).filter(h=>h.month<=m && (!h.until || m<=h.until)).reduce((s,h)=>s+(h.salary||0),0);
  let fixed = fot*(1+insRate);
  (cfg.expenses||[]).forEach(it=>{
    if(it.kind!=='monthly') return;
    fixed += monthlyAmountAt(it, m, cfg.months||FIN_HORIZON);
  });

  /* Смешанный CAC — весь маркетинговый бюджет месяца на всех новых
     платящих, а не только предельная ставка. Именно эту цифру смотрит
     инвестор: базовый бюджет тоже приводит людей и тоже стоит денег. */
  let marketingFixed = 0;
  (cfg.expenses||[]).forEach(it=>{
    if(it.cat!=='marketing' || it.kind!=='monthly') return;
    const from = it.from||1, to = it.to||cfg.months||FIN_HORIZON;
    if(m>=from && m<=to) marketingFixed += it.amount||0;
  });
  const F2 = cfg.funnel;
  let newAtM = F2.newPayingM1;
  for(let i=2;i<=m;i++){ newAtM *= (1+growthAt(F2, i)); }
  const cacBlended = newAtM ? (marketingFixed + newAtM*cacRate)/newAtM : cacRate;

  /* вклад одного пользователя в покрытие постоянных расходов:
     выручка минус переменная себестоимость минус стоимость
     замены оттока (каждый месяц уходит churn — их надо докупать) */
  const contribution = arpu - varPerUser - churn*cacRate;
  /* LTV считаем за обозримые 24 месяца, а не «до бесконечности»:
     на горизонте дальше двух лет любая оценка удержания — фантазия. */
  const LTV_HORIZON = 24;
  const ltv = churn>0
    ? (arpu-varPerUser)*(1-Math.pow(1-churn, LTV_HORIZON))/churn
    : (arpu-varPerUser)*LTV_HORIZON;
  return {
    arpuSub, arpuAddon, arpu, gmvPerUser, varPerUser, cacRate, cacBlended, churn,
    marketingFixed, newAtM, ltvHorizon: LTV_HORIZON,
    contribution, ltv, ltvCac: cacBlended ? ltv/cacBlended : 0,
    paybackMonths: (arpu-varPerUser)>0 ? cacBlended/(arpu-varPerUser) : Infinity,
    fixedMonthly: fixed, fot,
    breakevenActive: contribution>0 ? fixed/contribution : Infinity,
    lifetimeMonths: churn>0 ? 1/churn : Infinity,
  };
}

/* Сколько новых платящих в месяц нужно, чтобы из базы a0 за N месяцев
   дойти до базы target при оттоке c. Ровный темп — закрытая формула. */
function requiredNewPerMonth(a0, target, months, churn){
  if(months<=0) return Infinity;
  if(churn<=0) return Math.max(0, (target-a0)/months);
  const decay = Math.pow(1-churn, months);
  const denom = (1-decay)/churn;
  return Math.max(0, (target - a0*decay)/denom);
}
/* Плавный разгон: ищем темп прироста r, при котором база дойдёт до цели. */
function requiredGrowthRate(a0, n0, target, months, churn){
  const reach = (r)=>{
    let a = a0, n = n0;
    for(let i=1;i<=months;i++){ n = n*(1+r); a = a*(1-churn)+n; }
    return a;
  };
  if(reach(0) >= target) return 0;
  let lo = 0, hi = 1.0;
  for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(reach(mid)<target) lo=mid; else hi=mid; }
  return hi;
}

/* Разложить цель на то, что надо делать каждый месяц, неделю и день. */
function decomposeGoal(goal, cfg, ue, startActive, startMonth, norms){
  const monthsLeft = Math.max(0, goal.byMonth - startMonth);
  let targetActive;
  if(goal.kind==='paying')         targetActive = goal.target;
  else if(goal.kind==='revenue')   targetActive = ue.arpu>0 ? goal.target/ue.arpu : Infinity;
  else if(goal.kind==='breakeven') targetActive = ue.breakevenActive;
  else if(goal.kind==='content')   targetActive = null;
  else targetActive = goal.target;

  const out = {goal, monthsLeft, startActive, targetActive, feasible:true};

  if(goal.kind==='content'){
    const need = Math.max(0, goal.target - (norms.libraryNow||0));
    out.contentPerMonth = monthsLeft ? need/monthsLeft : Infinity;
    out.contentPerWeek  = out.contentPerMonth/4.33;
    out.shootDaysPerMonth = out.contentPerMonth/3;   /* 3 мастер-класса за съёмочный день */
    return out;
  }

  const churn = ue.churn;
  const newPerMonth = requiredNewPerMonth(startActive, targetActive, monthsLeft, churn);
  out.newPerMonth = newPerMonth;
  out.churnPerMonth = targetActive*churn;
  out.grossNewPerMonth = newPerMonth;
  out.regPerMonth  = cfg.funnel.crRegPay  ? newPerMonth/cfg.funnel.crRegPay  : Infinity;
  out.leadsPerMonth= cfg.funnel.crLeadReg ? out.regPerMonth/cfg.funnel.crLeadReg : Infinity;
  out.budgetPerMonth = newPerMonth*ue.cacBlended;
  out.newPerWeek  = newPerMonth/4.33;
  out.newPerDay   = newPerMonth/30.4;
  out.regPerDay   = out.regPerMonth/30.4;
  out.leadsPerDay = out.leadsPerMonth/30.4;
  out.revenueAtGoal = targetActive*ue.arpu;
  out.contributionAtGoal = targetActive*ue.contribution;
  out.ebitdaAtGoal = out.contributionAtGoal - ue.fixedMonthly;
  out.expertsNeeded = Math.ceil(targetActive/norms.usersPerExpert);
  out.contentPerMonth = norms.contentBaseMonthly + targetActive/100*norms.contentPer100Users;
  out.growthRate = requiredGrowthRate(startActive, Math.max(1, newPerMonth*0.6), targetActive, monthsLeft, churn);
  out.feasible = isFinite(newPerMonth) && monthsLeft>0;
  return out;
}

    });
  });
  document.querySelectorAll('[data-del-exp]').forEach(b=>{
    b.onclick = async ()=>{ const e = await getExpenses(); e.items = e.items.filter(x=>x.id!==b.dataset.delExp); saveExpenses(e); renderFinPlan(body); };
  });
  document.querySelectorAll('.money-fmt-input').forEach(wireThousandsInput);
  document.getElementById('pbAddBtn').onclick = async ()=>{
    const name = document.getElementById('pbName').value.trim();
    if(!name){ document.getElementById('pbName').focus(); return; }
    const kind = document.getElementById('pbKind').value;
    const amount = parseThousands(document.getElementById('pbAmount').value);
    if(!amount){ document.getElementById('pbAmount').focus(); return; }
    const from = parseInt(document.getElementById('pbFrom').value)||1;
    const e = await getExpenses();
    const rec = {id:uid(), name, cat:document.getElementById('pbCat').value, kind, mandatory:document.getElementById('pbMandatory').checked, dept:null};
    if(kind==='once'){ rec.amount = amount; rec.month = from; } else { rec.amount = amount; rec.from = from; rec.to = null; }
    e.items.push(rec); saveExpenses(e); renderFinPlan(body);
  };

  const goalsEl = document.getElementById('planGoals');
  if(goalsEl) await renderFinGoals(goalsEl);
}

async function renderFinGoals(body){
  const cfg   = await buildFinCfg({economy:_economyMode});
  const model = computeFinModel(cfg);
  const facts = await buildFactMonths();
  const goals = await getGoals();
  const norms = await getNorms();
  const ue    = unitEconomics(cfg, 12);

  const lastFact  = facts[facts.length-1];
  const startActive = lastFact ? lastFact.active : 0;
  const startMonth  = facts.length;
  const recentNew = facts.length ? facts.slice(-2).reduce((s,f)=>s+f.agg.newPay,0)/Math.min(2,facts.length) : 0;

  const cards = goals.map(g=>{
    const d = decomposeGoal(g, cfg, ue, startActive, startMonth, norms);
    const kind = GOAL_KINDS[g.kind];
    const pace = recentNew && d.newPerMonth ? d.newPerMonth/recentNew : null;
    const paceLabel = pace===null ? '' :
      (pace<=1 ? `Текущий темп уже перекрывает нужный — держим и не ломаем.`
               : `Нужно ускориться в ${dec(pace)} раза: сейчас ${num(recentNew)} новых платящих в месяц, требуется ${num(d.newPerMonth)}.`);
    const paceCls = pace===null ? 'neutral' : (pace<=1 ? 'good' : (pace<=2 ? 'neutral' : 'warn'));

    if(g.kind==='content'){
      return goalCardHtml(g, kind, d, `
        <div class="decomp-grid">
          ${decompItem('Снимать в месяц', num(d.contentPerMonth)+' мастер-классов')}
          ${decompItem('В неделю', num(d.contentPerWeek)+' шт.')}
          ${decompItem('Съёмочных дней в месяц', num(d.shootDaysPerMonth)+' дн.', '3 мастер-класса за смену')}
        </div>`, 'neutral', '');
    }

    return goalCardHtml(g, kind, d, `
      <div class="decomp-flow">
        ${decompStep('1', 'Активная база к цели', num(d.targetActive)+' платящих',
          `сейчас ${num(startActive)}, за ${d.monthsLeft} мес. надо добрать ${num(Math.max(0,d.targetActive-startActive))} нетто`)}
        ${decompStep('2', 'Новых платящих в месяц', num(d.newPerMonth),
          `из них ${num(d.churnPerMonth)} уходит на замену оттока ${cfPct(ue.churn)} — база «протекает», и это надо докупать`)}
        ${decompStep('3', 'Регистраций в месяц', num(d.regPerMonth),
          `при конверсии регистрация → оплата ${cfPct(cfg.funnel.crRegPay)}`)}
        ${decompStep('4', 'Визитов / лидов в месяц', num(d.leadsPerMonth),
          `при конверсии визит → регистрация ${cfPct(cfg.funnel.crLeadReg)}`)}
        ${decompStep('5', 'Бюджет привлечения', money(d.budgetPerMonth)+'/мес',
          `${num(d.newPerMonth)} новых × смешанный CAC ${money(ue.cacBlended)}`)}
      </div>
      <div class="decomp-grid">
        ${decompItem('В неделю', num(d.newPerWeek)+' платящих', num(d.regPerMonth/4.33)+' регистраций')}
        ${decompItem('В день', num(d.newPerDay)+' платящих', num(d.leadsPerDay)+' визитов')}
        ${decompItem('Экспертов в сети', num(d.expertsNeeded), `1 эксперт на ${norms.usersPerExpert} пользователей`)}
        ${decompItem('Контента в месяц', num(d.contentPerMonth)+' шт.', `база ${norms.contentBaseMonthly} + ${norms.contentPer100Users} на каждые 100 пользователей`)}
        ${decompItem('Выручка на цели', money(d.revenueAtGoal)+'/мес', `ARPU ${money(ue.arpu)}`)}
        ${decompItem('EBITDA на цели', signedMoney(d.ebitdaAtGoal)+'/мес', d.ebitdaAtGoal>=0?'цель окупает постоянные расходы':'постоянных расходов больше, чем вклада базы', d.ebitdaAtGoal>=0?'pos':'neg')}
      </div>
      <div class="pace-note ${paceCls}">${paceLabel || 'Фактического темпа пока нет — начните вести ежедневные отчёты, и сравнение появится здесь.'}</div>
    `, paceCls, `Плавный разгон вместо ровного темпа: +${cfPct(d.growthRate)} к притоку каждый месяц.`);
  }).join('');

  body.innerHTML = `
    <section class="block" style="margin-top:0;">
      <p class="block-sub">Ставите цель — программа раскладывает её обратно по воронке: сколько нужно платящих, регистраций, визитов, денег на привлечение, экспертов и контента. Каждый месяц, каждую неделю, каждый день.</p>
      ${metricCards([
        {l:'ARPU — выручка с активного', v:money(ue.arpu)+'/мес', sub:`подписка ${money(ue.arpuSub)} + допродажи ${money(ue.arpuAddon)}`},
        {l:'Вклад одного пользователя', v:money(ue.contribution)+'/мес', sub:'после переменных расходов и замены оттока', cls: ue.contribution>0?'pos':'neg'},
        {l:'Постоянные расходы', v:money(ue.fixedMonthly)+'/мес', sub:'ФОТ со взносами + регулярные позиции реестра'},
        {l:'Безубыточность', v:isFinite(ue.breakevenActive)?num(ue.breakevenActive)+' платящих':'недостижима', sub:'при текущей структуре расходов', cls: isFinite(ue.breakevenActive)?'':'neg'},
