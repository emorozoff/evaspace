function decompStep(n, label, value, hint){
  return `<div class="decomp-step">
    <span class="ds-n">${n}</span>
    <div class="ds-body"><span class="ds-label">${label}</span><span class="ds-value">${value}</span>${hint?`<span class="ds-hint">${hint}</span>`:''}</div>
  </div>`;
}
function decompItem(label, value, hint, cls){
  return `<div class="decomp-item ${cls||''}"><span class="di-label">${label}</span><span class="di-value">${value}</span>${hint?`<span class="di-hint">${hint}</span>`:''}</div>`;
}

/* ============================================================
   ДОХОДЫ И ВОРОНКА
   ============================================================ */
async function renderFinRevenue(body){
  const rev = await getRevenueCfg();
  const fun = await getFunnelCfg();
  const cfg = await buildFinCfg({economy:_economyMode});
  const ue  = unitEconomics(cfg, 12);
  const model = computeFinModel(cfg);

  const addonRows = rev.addons.map(a=>`
    <tr data-id="${a.id}" class="${a.active===false?'economy-cut':''}">
      <td><input type="text" class="v-input rev-f" data-rev-field="name" data-id="${a.id}" value="${esc(a.name)}"></td>
      <td><input type="number" step="1" class="v-input rev-f" data-rev-field="conv" data-id="${a.id}" value="${(a.conv*100).toFixed(0)}" style="width:64px; text-align:right;"> <span class="unit">%</span></td>
      <td><input type="text" class="v-input money-fmt-input rev-f" data-rev-field="price" data-id="${a.id}" value="${fmtThousands(a.price)}" style="width:88px; text-align:right;"></td>
      <td><input type="number" step="1" class="v-input rev-f" data-rev-field="take" data-id="${a.id}" value="${(a.take*100).toFixed(0)}" style="width:64px; text-align:right;"> <span class="unit">%</span></td>
      <td class="num">${money(a.conv*a.price)}</td>
      <td class="num hl">${money(a.conv*a.price*a.take)}</td>
      <td style="text-align:center;"><input type="checkbox" class="rev-active" data-id="${a.id}" ${a.active!==false?'checked':''}></td>
      <td><button class="btn ghost sm-del" data-del-addon="${a.id}">✕</button></td>
    </tr>`).join('');

  const funnelFields = [
    {key:'newPayingM1', label:'Новых платящих в 1-й месяц', min:5,   max:200, step:5,    fmt:v=>num(v)+' чел.'},
    {key:'crLeadReg',   label:'Конверсия визит → регистрация', min:0.02, max:0.6, step:0.01, fmt:cfPct},
    {key:'crRegPay',    label:'Конверсия регистрация → оплата', min:0.03, max:0.7, step:0.01, fmt:cfPct},
    {key:'growthY1',    label:'Темп роста притока, Год 1',   min:0, max:0.30, step:0.01, fmt:cfPct},
    {key:'growthY2',    label:'Темп роста притока, Год 2',   min:0, max:0.20, step:0.01, fmt:cfPct},
    {key:'growthY3',    label:'Темп роста притока, Год 3',   min:0, max:0.10, step:0.005, fmt:cfPct},
  ];
  const revFields = [
    {key:'priceMonthly', label:'Цена месячной подписки', min:900,  max:7000,  step:100, fmt:v=>num(v)+' ₽'},
    {key:'priceAnnual',  label:'Цена годовой подписки',  min:9000, max:60000, step:500, fmt:v=>num(v)+' ₽'},
    {key:'annualShare',  label:'Доля выбирающих годовую',min:0,    max:0.8,   step:0.05, fmt:cfPct},
    {key:'churn',        label:'Отток по месячной подписке', min:0.02, max:0.20, step:0.005, fmt:cfPct},
    {key:'churnAnnual',  label:'Отток по годовой подписке',  min:0.002, max:0.08, step:0.002, fmt:cfPct},
  ];
  const slider = (f, store, val)=>`
    <div class="ctrl">
      <label>${f.label} <span class="ctrl-val" data-val-for="${f.key}">${f.fmt(val)}</span></label>
      <input type="range" data-cfg-store="${store}" data-cfg-key="${f.key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}">
    </div>`;

  body.innerHTML = `
    <section class="block" style="margin-top:0;">
      <h2>Из чего складывается выручка</h2>
      <p class="block-sub">Подписка — своя выручка целиком. Допродажи — оборот площадки, из которого нам остаётся take rate: доля платформы после выплаты эксперту или поставщику. Инвестор смотрит именно на вторую цифру, а не на оборот.</p>
      ${metricCards([
        {l:'ARPU — всего с активного', v:money(ue.arpu)+'/мес'},
        {l:'из них подписка', v:money(ue.arpuSub)+'/мес', sub:cfPct(ue.arpuSub/Math.max(1,ue.arpu))+' выручки'},
        {l:'из них допродажи', v:money(ue.arpuAddon)+'/мес', sub:`оборот ${money(ue.gmvPerUser)} × средний take rate ${cfPct(ue.gmvPerUser?ue.arpuAddon/ue.gmvPerUser:0)}`},
        {l:'Срок жизни платящей', v: isFinite(ue.lifetimeMonths)?ue.lifetimeMonths.toFixed(1)+' мес.':'—', sub:`смешанный отток ${cfPct(ue.churn)}`},
      ])}
    </section>

    <section class="block">
      <h2>Допродажи</h2>
      <p class="block-sub">Конверсия — какая доля активной базы покупает это в течение месяца. Take rate — сколько остаётся платформе после выплаты эксперту или поставщику.</p>
      <div class="card table-card">
        <table class="calc-table">
          <thead><tr><th>Поток</th><th>Конверсия</th><th>Средний чек</th><th>Take rate</th><th>Оборот на польз.</th><th>Наша выручка</th><th>Вкл.</th><th></th></tr></thead>
          <tbody>${addonRows}
            <tr class="total-row"><td>Итого на активного пользователя</td><td></td><td></td><td></td>
              <td class="num">${money(ue.gmvPerUser)}</td><td class="num">${money(ue.arpuAddon)}</td><td></td><td></td></tr>
          </tbody>
        </table>
        <div class="field-row" style="margin-top:14px;">
          <div class="field grow"><label>Название потока</label><input type="text" id="newAddonName" placeholder="Например, корпоративные программы"></div>
          <div class="field"><label>Конверсия, %</label><input type="number" id="newAddonConv" value="5"></div>
          <div class="field"><label>Чек, ₽</label><input type="text" class="money-fmt-input" id="newAddonPrice" placeholder="5 000"></div>
          <div class="field"><label>Take rate, %</label><input type="number" id="newAddonTake" value="30"></div>
        </div>
        <button class="btn ghost" id="addAddonBtn">+ Добавить поток дохода</button>
      </div>
    </section>

    <section class="block">
      <h2>Рычаги подписки и оттока</h2>
      <p class="block-sub">Отток — самый чувствительный рычаг модели: он определяет и срок жизни пользователя, и сколько новых нужно докупать просто чтобы стоять на месте.</p>
      <div class="ctrl-grid">
        <div class="ctrl-group churn-group">
          <h4>Цена и удержание</h4>
          ${revFields.map(f=>slider(f,'revenue',rev[f.key])).join('')}
          <div class="ctrl-note">При текущем оттоке база «протекает» на ${num(model.active[12]*ue.churn)} человек в месяц к концу первого года — столько нужно привлекать только чтобы не падать.</div>
        </div>
        <div class="ctrl-group">
          <h4>Воронка привлечения</h4>
          ${funnelFields.map(f=>slider(f,'funnel',fun[f.key])).join('')}
          <div class="ctrl-note">Чтобы получить одного платящего, нужно ${num(1/Math.max(0.0001,fun.crRegPay*fun.crLeadReg))} визитов и ${num(1/Math.max(0.0001,fun.crRegPay))} регистраций.</div>
        </div>
      </div>
    </section>

    <section class="block">
      <h2>Воронка первого года</h2>
      <p class="block-sub">Визиты, регистрации, новые платящие и отток по месяцам — по текущим настройкам.</p>
      <div class="chart-card"><div class="chart-holder" style="height:300px;"><canvas id="funnelChart"></canvas></div></div>
    </section>
  `;

  document.querySelectorAll('.money-fmt-input').forEach(wireThousandsInput);
  document.querySelectorAll('[data-cfg-store]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const store = inp.dataset.cfgStore, key = inp.dataset.cfgKey, v = parseFloat(inp.value);
      if(store==='revenue'){ const r = await getRevenueCfg(); r[key]=v; saveRevenueCfg(r); }
      else { const f = await getFunnelCfg(); f[key]=v; saveFunnelCfg(f); }
      _finScenario = null;
      renderFinRevenue(body);
    });
    inp.addEventListener('input', ()=>{
      const key = inp.dataset.cfgKey;
      const all = funnelFields.concat(revFields);
      const def = all.find(f=>f.key===key);
      const el = document.querySelector(`[data-val-for="${key}"]`);
      if(def && el) el.textContent = def.fmt(parseFloat(inp.value));
    });
  });
  document.querySelectorAll('[data-rev-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const r = await getRevenueCfg(); const a = r.addons.find(x=>x.id===inp.dataset.id); if(!a) return;
      const f = inp.dataset.revField;
      if(f==='conv'||f==='take') a[f] = (parseFloat(inp.value)||0)/100;
      else if(f==='price') a.price = parseThousands(inp.value);
      else a[f] = inp.value;
      saveRevenueCfg(r); renderFinRevenue(body);
    });
  });
  document.querySelectorAll('.rev-active').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const r = await getRevenueCfg(); const a = r.addons.find(x=>x.id===cb.dataset.id);
      if(a){ a.active = cb.checked; saveRevenueCfg(r); renderFinRevenue(body); }
    });
  });
  document.querySelectorAll('[data-del-addon]').forEach(b=>{
    b.onclick = async ()=>{
      const r = await getRevenueCfg(); r.addons = r.addons.filter(a=>a.id!==b.dataset.delAddon);
      saveRevenueCfg(r); renderFinRevenue(body);
    };
  });
  document.getElementById('addAddonBtn').onclick = async ()=>{
    const name = document.getElementById('newAddonName').value.trim(); if(!name) return;
    const r = await getRevenueCfg();
    r.addons.push({id:uid(), name,
      conv:(parseFloat(document.getElementById('newAddonConv').value)||0)/100,
      price: parseThousands(document.getElementById('newAddonPrice').value),
      take:(parseFloat(document.getElementById('newAddonTake').value)||0)/100, active:true});
    saveRevenueCfg(r); renderFinRevenue(body);
  };

  killChart('funnel');
  const cv = document.getElementById('funnelChart');
  if(cv) _finCharts.funnel = new Chart(cv, {
    type:'bar',
    data:{labels:Array.from({length:12},(_,i)=>finMonthLabel(i+1)), datasets:[
      {type:'bar', label:'Визиты', data:model.leads.slice(1,13), backgroundColor:'#E4E0D4', yAxisID:'big', borderWidth:0},
      {type:'bar', label:'Регистрации', data:model.registered.slice(1,13), backgroundColor:'#C7B79A', yAxisID:'big', borderWidth:0},
      {type:'line', label:'Новые платящие', data:model.newPaying.slice(1,13), borderColor:SERIES.revenue, yAxisID:'small', tension:0.25, borderWidth:2.5, pointRadius:2},
      {type:'line', label:'Отток', data:model.churned.slice(1,13), borderColor:SERIES.expense, yAxisID:'small', tension:0.25, borderWidth:2, borderDash:[4,3], pointRadius:0},
    ]},
    options: chartBase({scales:{
      x:{grid:{display:false}, ticks:{color:CHART_SOFT, font:{size:10}}},
      big:{position:'left', grid:{color:CHART_GRID}, ticks:{color:CHART_SOFT, font:{size:10}, callback:v=>num(v)}},
      small:{position:'right', grid:{display:false}, ticks:{color:CHART_SOFT, font:{size:10}, callback:v=>num(v)}},
    }}),
  });
}

/* ============================================================
   СКОЛЬКО НУЖНО ДЕНЕГ НА ЗАПУСК
   ============================================================ */
let _launchBufferMonths = 3;

async function renderFinLaunch(body){
  const exp = await getExpenses();
  const plan = await getLaunchPlan();
  const cfgNoFin = await buildFinCfg({economy:_economyMode, noFinancing:true, cashStart:0});
  const bare = computeFinModel(cfgNoFin);

  /* Дно кумулятивного потока без внешних денег — это и есть дыра,
     которую надо закрыть, чтобы не остаться без денег ни в один месяц. */
  const deficit    = Math.abs(Math.min(0, bare.minCumOper));
  const bottomM    = Math.max(1, bare.minCumOperMonth);
  const peakBurn   = Math.max(...bare.burn.slice(1, bottomM+1), 0);
  const buffer     = peakBurn*_launchBufferMonths;
  const needed     = Math.ceil((deficit+buffer)/100000)*100000;
  const financing  = await getFinancing();
  const raised     = financing.reduce((s,f)=>s+f.amount, 0) + exp.cash;
  const gap        = needed - raised;

  /* На что уходят деньги до выхода в плюс */
  const to = Math.max(1, bottomM);
  const spendRows = EXP_CATS.map(c=>({c, v:cfSumRange(bare.byCat[c.id], 1, to)}))
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const spendTotal = spendRows.reduce((s,r)=>s+r.v,0);
  const revenueTilBottom = cfSumRange(bare.cashIn, 1, to);
  const taxTilBottom = cfSumRange(bare.taxTotal, 1, to);

  const scenarioNeed = await Promise.all(Object.entries(FIN_SCENARIOS).map(async ([k,s])=>{
    const c = await buildFinCfg({economy:_economyMode, noFinancing:true, cashStart:0, funnel:s.funnel, revenue:s.revenue});
    const m = computeFinModel(c);
    const d = Math.abs(Math.min(0, m.minCumOper));
    const b = Math.max(...m.burn.slice(1, Math.max(2, m.minCumOperMonth+1)), 0)*_launchBufferMonths;
    return {k, s, need: Math.ceil((d+b)/100000)*100000, bottom:m.minCumOperMonth, be:m.breakevenMonth};
  }));

  const planMonths = [1,2,3,4,5,6];
  const planRows = [
    {key:'registered', label:'Зарегистрировано, накопительно'},
    {key:'paying',     label:'Платящих, накопительно'},
    {key:'experts',    label:'Экспертов привлечено, накопительно'},
    {key:'content',    label:'Мастер-классов отснято, накопительно'},
  ];
  planRows.forEach(r=>{ while(plan[r.key].length < planMonths.length) plan[r.key].push(plan[r.key][plan[r.key].length-1]||0); });
  const rev = await getRevenueCfg();
  const ue = unitEconomics(cfgNoFin, 4);
  const planRevenue = planMonths.map((m,i)=> (i>0 ? plan.paying[i-1] : 0)*ue.arpu);
  const planExpense = planMonths.map(m=> bare.totalExpense[m]);
  let c = 0;
  const planCash = planMonths.map((m,i)=>{ c += planRevenue[i]-planExpense[i]; return c; });

  const financingRows = financing.map(f=>`
    <tr data-id="${f.id}">
      <td><input type="text" class="v-input fin-f" data-fin-field="name" data-id="${f.id}" value="${esc(f.name)}"></td>
      <td><select class="v-input fin-f" data-fin-field="month" data-id="${f.id}">
        ${Array.from({length:FIN_HORIZON},(_,i)=>i+1).map(m=>`<option value="${m}" ${f.month===m?'selected':''}>${finMonthLabel(m)}</option>`).join('')}
      </select></td>
      <td><input type="text" class="v-input money-fmt-input fin-f" data-fin-field="amount" data-id="${f.id}" value="${fmtThousands(f.amount)}" style="text-align:right;"></td>
      <td><button class="btn ghost sm-del" data-del-fin="${f.id}">✕</button></td>
    </tr>`).join('');

  body.innerHTML = `
    <section class="block" style="margin-top:0;">
      <span class="pre-launch-badge">Сколько денег нужно, чтобы дойти до самоокупаемости</span>
      <div class="need-hero">
        <div class="need-main">
          <span class="need-label">Нужно привлечь</span>
          <span class="need-value">${money(needed)}</span>
          <span class="need-sub">чтобы ни в один месяц не остаться без денег и дойти до операционного плюса${bare.breakevenMonth>0?' в '+finMonthLabel(bare.breakevenMonth):''}</span>
        </div>
        <div class="need-parts">
          <div class="need-part"><span class="np-l">Кассовый разрыв — дно в ${finMonthLabel(bottomM)}</span><span class="np-v">${money(deficit)}</span></div>
          <div class="need-part"><span class="np-l">Подушка: ${_launchBufferMonths} мес. пикового burn ${money(peakBurn)}</span><span class="np-v">${money(buffer)}</span></div>
          <div class="need-part total"><span class="np-l">Итого с округлением</span><span class="np-v">${money(needed)}</span></div>
        </div>
      </div>
      <div class="buffer-row">
        <label>Подушка безопасности:</label>
        <div class="toggle-row inline" id="bufferRow">
          ${[0,2,3,6].map(n=>`<button data-buffer="${n}" class="${_launchBufferMonths===n?'active':''}">${n===0?'без подушки':n+' мес.'}</button>`).join('')}
        </div>
        <span class="note-sm">Подушка — это месяцы, которые проект переживёт, если выручка не придёт вовремя. Без неё модель верна ровно до первого сдвига плана.</span>
      </div>
      ${metricCards([
        {l:'Уже есть и обещано', v:money(raised), sub:`остаток ${money(exp.cash)} + раунды ${money(raised-exp.cash)}`},
        {l: gap>0 ? 'Не хватает' : 'Запас сверх потребности', v: money(Math.abs(gap)), cls: gap>0?'neg':'pos',
         sub: gap>0 ? 'столько нужно найти, чтобы модель не ушла в минус' : 'эти деньги нужны не на выживание, а на ускорение: чем больше бюджет привлечения, тем раньше набирается база'},
        {l:'Пиковый burn', v:money(peakBurn)+'/мес', sub:`месяц ${finMonthLabel(Math.max(1, bare.burn.indexOf(peakBurn)))}`},
        {l:'Дойти до плюса', v: bare.breakevenMonth>0 ? bare.breakevenMonth+' мес.' : 'дольше 36 мес.', cls: bare.breakevenMonth>0?'':'neg', sub:'без учёта внешних денег'},
      ])}
    </section>

    <section class="block">
      <h2>На что уходят деньги до дна</h2>
      <p class="block-sub">Всё, что проект потратит с первого месяца по ${finMonthLabel(bottomM)} включительно. Выручка за тот же период — ${money(revenueTilBottom)}, она уже вычтена из потребности выше.</p>
      <div class="grid-2">
        <div class="card table-card">
          <table class="calc-table">
            <thead><tr><th>Категория</th><th>Сумма</th><th>Доля</th></tr></thead>
            <tbody>
              ${spendRows.map(r=>`<tr><td>${r.c.name}</td><td class="num hl">${money(r.v)}</td><td class="num">${cfPct(r.v/spendTotal)}</td></tr>`).join('')}
              <tr><td>Налоги и взносы к уплате</td><td class="num hl">${money(taxTilBottom)}</td><td class="num">—</td></tr>
              <tr class="total-row"><td>Всего расходов за период</td><td class="num">${money(spendTotal+taxTilBottom)}</td><td class="num">100%</td></tr>
              <tr><td>Минус поступления</td><td class="num pos">−${money(revenueTilBottom)}</td><td></td></tr>
              <tr class="total-row"><td>Кассовый разрыв</td><td class="num neg">${money(deficit)}</td><td></td></tr>
            </tbody>
          </table>
        </div>
        <div class="card"><div class="chart-holder" style="height:320px;"><canvas id="launchCumChart"></canvas></div></div>
      </div>
    </section>

    <section class="block">
      <h2>Сколько нужно при разных сценариях</h2>
      <p class="block-sub">Одна и та же команда и те же расходы, но разные предположения о рынке. Разница между строками — это и есть цена оптимизма.</p>
      <div class="card table-card">
        <table class="calc-table">
          <thead><tr><th>Сценарий</th><th>Нужно денег</th><th>Дно кассы</th><th>Выход в плюс</th></tr></thead>
          <tbody>${scenarioNeed.map(x=>`
            <tr class="${_finScenario===x.k?'row-active':''}">
              <td><span class="sc-dot ${x.s.cls}"></span>${x.s.label}</td>
              <td class="num hl">${money(x.need)}</td>
              <td class="num">${finMonthLabel(x.bottom)}</td>
              <td class="num">${x.be>0?finMonthLabel(x.be):'позже 36 мес.'}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
    </section>

    <section class="block">
      <h2>Привлечённые и планируемые деньги</h2>
      <p class="block-sub">Раунды и займы, которые попадают в модель. Модель Cash Flow считает остаток на счету с их учётом, расчёт выше — без них.</p>
      <div class="card table-card">
        <table class="calc-table">
          <thead><tr><th>Источник</th><th>Когда</th><th>Сумма</th><th></th></tr></thead>
          <tbody>${financingRows}<tr class="total-row"><td>Итого</td><td></td><td class="num">${money(financing.reduce((s,f)=>s+f.amount,0))}</td><td></td></tr></tbody>
        </table>
        <div class="field-row" style="margin-top:14px;">
          <div class="field grow"><label>Источник</label><input type="text" id="newFinName" placeholder="Например, мини-раунд от партнёров"></div>
          <div class="field"><label>Месяц</label><select id="newFinMonth">${Array.from({length:FIN_HORIZON},(_,i)=>i+1).map(m=>`<option value="${m}">${finMonthLabel(m)}</option>`).join('')}</select></div>
          <div class="field"><label>Сумма, ₽</label><input type="text" class="money-fmt-input" id="newFinAmount" placeholder="0"></div>
        </div>
        <button class="btn ghost" id="addFinBtn">+ Добавить источник</button>
      </div>
    </section>

    <section class="block">

/* ============================================================

async function renderFinUnit(body){
  const cfg = await buildFinCfg({economy:_economyMode});
  const model = computeFinModel(cfg);
  const ue = unitEconomics(cfg, 12);
  const facts = await buildFactMonths();

  const factCac = facts.length ? (function(){
    const f = facts.slice(-3);
    const spend = f.reduce((s,x)=>s+(x.byCat.marketing||0),0);
    const newP  = f.reduce((s,x)=>s+x.agg.newPay,0);
    return newP ? spend/newP : 0;
  })() : 0;
  const factArpu = facts.length ? (function(){
    const f = facts[facts.length-1];
    return f.activeAvg ? f.revenue/f.activeAvg : 0;
  })() : 0;

  /* Чувствительность: что будет с выходом в плюс и деньгами при сдвиге рычага */
  const sens = [];
  const variants = [
    {label:'Отток −2 п.п.',        rev:{churn:Math.max(0.01, cfg.revenue.churn-0.02)}},
    {label:'Отток +2 п.п.',        rev:{churn:cfg.revenue.churn+0.02}},
    {label:'Конверсия в оплату +5 п.п.', fun:{crRegPay:cfg.funnel.crRegPay+0.05}},
    {label:'Цена подписки +300 ₽', rev:{priceMonthly:cfg.revenue.priceMonthly+300}},
    {label:'CAC дешевле на 30%',   cac:0.7},
    {label:'CAC дороже на 30%',    cac:1.3},
  ];
  variants.forEach(v=>{
    const c = JSON.parse(JSON.stringify(cfg));
    if(v.rev) Object.assign(c.revenue, v.rev);
    if(v.fun) Object.assign(c.funnel, v.fun);
    if(v.cac) c.expenses = c.expenses.map(it=>{
      if(it.driver && it.driver.base==='new_paying'){ const n = JSON.parse(JSON.stringify(it)); n.driver.rate *= v.cac; return n; }
      return it;
    });
    const m = computeFinModel(c);
    const u = unitEconomics(c, 12);
    sens.push({label:v.label, be:m.breakevenMonth, cash36:m.cash[36], ltvCac:u.ltvCac, y1:cfSumRange(m.revenue,1,12)});
  });
  const baseRow = {label:'Текущая модель', be:model.breakevenMonth, cash36:model.cash[36], ltvCac:ue.ltvCac, y1:cfSumRange(model.revenue,1,12)};

  const verdictCls = ue.ltvCac>=3 ? 'good' : (ue.ltvCac>=1.5 ? 'neutral' : 'warn');
  const verdict = ue.ltvCac>=3
    ? `LTV/CAC ${ue.ltvCac.toFixed(1)}× — экономика здоровая. Каждый рубль в привлечение возвращается ${ue.ltvCac.toFixed(1)} рублями валовой прибыли за срок жизни пользователя, и рост можно ускорять деньгами.`
    : ue.ltvCac>=1.5
      ? `LTV/CAC ${ue.ltvCac.toFixed(1)}× — экономика сходится, но запас тонкий. Инвестор ждёт 3× и выше: до этого масштабировать платное привлечение рискованно.`
      : `LTV/CAC ${ue.ltvCac.toFixed(1)}× — привлечение не окупается. Сначала отток и удержание, только потом бюджет на трафик: иначе каждый новый рубль в рекламу увеличивает убыток.`;

  body.innerHTML = `
    <section class="block" style="margin-top:0;">
      <div class="status-banner ${verdictCls}">
        <div class="status-label">Экономика одного пользователя</div>
        <div class="status-desc">${verdict}</div>
      </div>
      ${metricCards([
        {l:'ARPU', v:money(ue.arpu)+'/мес', sub: factArpu?`факт последнего месяца: ${money(factArpu)}`:'фактических данных пока нет'},
        {l:'CAC — смешанный', v:money(ue.cacBlended), sub: factCac?`факт за 3 мес.: ${money(factCac)} · предельный ${money(ue.cacRate)}`:`весь бюджет маркетинга на всех новых · предельный ${money(ue.cacRate)}`},
        {l:'LTV за 24 мес.', v:money(ue.ltv), sub:`валовая прибыль когорты за 24 мес.; средний срок жизни ${isFinite(ue.lifetimeMonths)?ue.lifetimeMonths.toFixed(1):'∞'} мес.`},
        {l:'LTV / CAC', v:ue.ltvCac?ue.ltvCac.toFixed(1)+'×':'—', cls: ue.ltvCac>=3?'pos':(ue.ltvCac>=1.5?'':'neg'), sub:'здоровый ориентир — от 3×'},
        {l:'Окупаемость привлечения', v: isFinite(ue.paybackMonths)?ue.paybackMonths.toFixed(1)+' мес.':'—', cls: ue.paybackMonths<=6?'pos':'neg', sub:'ориентир — до 6 месяцев'},
        {l:'Вклад в постоянные расходы', v:money(ue.contribution)+'/мес', cls: ue.contribution>0?'pos':'neg', sub:'с одного активного, после переменных и замены оттока'},
      ])}
    </section>

    <section class="block">
      <h2>Как собирается вклад одного пользователя</h2>
      <p class="block-sub">Из выручки вычитается всё, что растёт вместе с пользователем. Остаток — то, чем база покрывает постоянные расходы.</p>
      <div class="card table-card">
        <table class="calc-table waterfall">
          <tbody>
            <tr><td>Подписка</td><td class="num pos">+${money(ue.arpuSub)}</td></tr>
            <tr><td>Допродажи, наша доля <span class="soft">(оборот ${money(ue.gmvPerUser)})</span></td><td class="num pos">+${money(ue.arpuAddon)}</td></tr>
            <tr class="subtotal"><td>Выручка с активного, ARPU</td><td class="num">${money(ue.arpu)}</td></tr>
            <tr><td>Переменные расходы: эквайринг, хостинг, поддержка</td><td class="num neg">−${money(ue.varPerUser)}</td></tr>
            <tr><td>Замена оттока: ${cfPct(ue.churn)} × предельный CAC ${money(ue.cacRate)}</td><td class="num neg">−${money(ue.churn*ue.cacRate)}</td></tr>

/* ============================================================
   СТРАНИЦА P&L — ОТЧЁТ О ПРИБЫЛЯХ И УБЫТКАХ
   Начислением, а не по деньгам: выручка признаётся в месяце,
   к которому относится, даже если деньги пришли раньше
   (годовые подписки) или позже.
   ============================================================ */
let _pnlPeriod = 'month';
let _pnlSource = 'both';

function splitCats(byCat){
  const cogs = {}, opex = {}, capex = {};
  Object.entries(byCat||{}).forEach(([id,v])=>{
    if(!v) return;
    const k = (EXP_CAT_MAP[id]||{}).pnl || 'opex';
    if(k==='cogs') cogs[id]=v; else if(k==='capex') capex[id]=v; else opex[id]=v;
  });
  return {cogs, opex, capex};
}
function pnlFromModel(model, m){
  const byCat = {};
  EXP_CATS.forEach(c=>{ if(model.byCat[c.id][m]) byCat[c.id] = model.byCat[c.id][m]; });
  return {
    revSub: model.revSub[m], revAddon: model.revAddonNet[m], gmv: model.gmvAddon[m],
    revenue: model.revenue[m], byCat,
    cogs: model.cogs[m], opex: model.opex[m], capex: model.capex[m],
    grossProfit: model.grossProfit[m], ebitda: model.ebitda[m],
    depreciation: model.depreciation[m], ebit: model.ebit[m],
    tax: model.taxTotal[m], net: model.netProfit[m],
    active: model.active[m], cashIn: model.cashIn[m], cfOper: model.cfOper[m],
    deferredDelta: model.deferred[m]-model.deferred[m-1],
  };
}
function pnlFromFact(f, depreciation){
  return {
    revSub: f.revSub, revAddon: f.agg.revAddonNet, gmv: f.agg.gmvTotal,
    revenue: f.revenue, byCat: f.byCat,
    cogs: f.cogs, opex: f.opex, capex: f.capex,
    grossProfit: f.grossProfit, ebitda: f.ebitda,
    depreciation: depreciation||0, ebit: f.ebitda-(depreciation||0),
    tax: f.taxProfit, net: f.ebitda-(depreciation||0)-f.taxProfit,
    active: f.active, cashIn: f.cashIn, cfOper: f.cashIn-f.cogs-f.opex-f.taxProfit,
    deferredDelta: f.deferredDelta,
  };
}
function pnlSum(list){
  if(!list.length) return null;
  const out = {byCat:{}};
  ['revSub','revAddon','gmv','revenue','cogs','opex','capex','grossProfit','ebitda','depreciation','ebit','tax','net','cashIn','cfOper','deferredDelta']
    .forEach(k=>{ out[k] = list.reduce((s,p)=>s+(p[k]||0), 0); });
  list.forEach(p=>Object.entries(p.byCat||{}).forEach(([c,v])=>{ out.byCat[c]=(out.byCat[c]||0)+v; }));
  out.active = list[list.length-1].active;
  return out;
}

function pnlRowsFor(p){
  const {cogs, opex} = splitCats(p.byCat);
  const rows = [];
  rows.push({label:'Выручка', head:true});
  rows.push({label:'Подписка', v:p.revSub, indent:true});
  rows.push({label:'Допродажи — наша доля', v:p.revAddon, indent:true});
  rows.push({label:'Итого выручка', v:p.revenue, sub:true});
  rows.push({label:'Себестоимость', head:true});
  Object.entries(cogs).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>rows.push({label:expCatName(c), v:-v, indent:true}));
  rows.push({label:'Итого себестоимость', v:-p.cogs, sub:true});
  rows.push({label:'Валовая прибыль', v:p.grossProfit, total:true});
  rows.push({label:'Валовая маржа', pct: p.revenue?p.grossProfit/p.revenue:0, muted:true});
  rows.push({label:'Операционные расходы', head:true});
  Object.entries(opex).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>rows.push({label:expCatName(c), v:-v, indent:true}));
  rows.push({label:'Итого операционные', v:-p.opex, sub:true});
  rows.push({label:'EBITDA', v:p.ebitda, total:true});
  rows.push({label:'Рентабельность по EBITDA', pct: p.revenue?p.ebitda/p.revenue:0, muted:true});
  rows.push({label:'Амортизация капвложений', v:-p.depreciation, indent:true});
  rows.push({label:'Операционная прибыль (EBIT)', v:p.ebit, sub:true});
  rows.push({label:'Налоги', v:-p.tax, indent:true});
  rows.push({label:'Чистая прибыль', v:p.net, grand:true});
  rows.push({label:'Рентабельность по чистой прибыли', pct: p.revenue?p.net/p.revenue:0, muted:true});
  rows.push({label:'Справочно', head:true});
  rows.push({label:'Оборот площадки по допродажам', v:p.gmv, indent:true, memo:true});
  rows.push({label:'Активных платящих на конец периода', count:p.active, indent:true, memo:true});
  rows.push({label:'Выручка на активного (ARPU)', v: p.active ? p.revenue/p.active : 0, indent:true, memo:true});
  return rows;
}
function pnlCell(r, p){
  if(r.head) return '<td></td>';
  if(r.pct!==undefined) return `<td class="num muted">${cfPct(r.pct)}</td>`;
  if(r.count!==undefined) return `<td class="num">${num(r.count)}</td>`;
  const v = r.v;
  const cls = (r.total||r.grand||r.sub) ? (v<0?'num neg':'num') : (v<0?'num neg':'num');
  return `<td class="${cls}">${v<0?'('+money(-v).replace(' ₽','')+') ₽':money(v)}</td>`;
}

async function renderPnl(){
  killAllCharts();
  const cfg = await buildFinCfg({economy:_economyMode});
  const model = computeFinModel(cfg);
  const facts = await buildFactMonths();

  /* амортизация факта — по тому же правилу, что и в модели */
  const factDep = facts.map((f,i)=>facts.slice(0,i+1).reduce((s,x)=>s+x.capex/CAPEX_AMORT_MONTHS,0));

  let periods = [];
  if(_pnlPeriod==='month'){
    const n = Math.max(facts.length, 12);
    for(let m=1;m<=n;m++){
      const f = facts[m-1];
      periods.push({key:'m'+m, label:finMonthLabel(m),
        plan: pnlFromModel(model,m),
        fact: f ? pnlFromFact(f, factDep[m-1]) : null});
    }
  } else if(_pnlPeriod==='quarter'){
    for(let q=0;q<8;q++){
      const a=q*3+1, b=q*3+3;
      const planList=[]; for(let m=a;m<=b;m++) planList.push(pnlFromModel(model,m));
      const factList = facts.slice(a-1,b).map((f,i)=>pnlFromFact(f, factDep[a-1+i]));
      periods.push({key:'q'+q, label:'Кв. '+(q%4+1)+' · '+finMonthDate(a).year,
        plan:pnlSum(planList), fact: factList.length===3 ? pnlSum(factList) : (factList.length?pnlSum(factList):null),
        partial: factList.length>0 && factList.length<3});
    }
  } else {
    for(let y=0;y<3;y++){
      const a=y*12+1, b=y*12+12;
      const planList=[]; for(let m=a;m<=b;m++) planList.push(pnlFromModel(model,m));
      const factList = facts.slice(a-1,b).map((f,i)=>pnlFromFact(f, factDep[a-1+i]));
      periods.push({key:'y'+y, label:'Год '+(y+1), plan:pnlSum(planList),
        fact: factList.length?pnlSum(factList):null, partial: factList.length>0 && factList.length<12});
    }
  }

  const showPlan = _pnlSource!=='fact';
  const showFact = _pnlSource!=='plan';
  const factPeriods = periods.filter(p=>p.fact);
  const cols = [];
  periods.forEach(p=>{
    if(showFact && p.fact) cols.push({p, kind:'fact'});
    if(showPlan) cols.push({p, kind:'plan'});
  });

  const template = pnlRowsFor(periods[0].plan);
  const headRow = `<tr><th class="sticky-col">Показатель</th>${cols.map(c=>`
    <th class="${c.kind}">${c.p.label}<span class="col-kind">${c.kind==='fact'?(c.p.partial?'факт, неполный':'факт'):'план'}</span></th>`).join('')}</tr>`;
  const bodyRows = template.map((r,i)=>{
    const cls = [r.head?'pnl-head':'', r.sub?'pnl-sub':'', r.total?'pnl-total':'', r.grand?'pnl-grand':'',
                 r.muted?'pnl-muted':'', r.memo?'pnl-memo':'', r.indent?'pnl-indent':''].filter(Boolean).join(' ');
    const cells = cols.map(c=>{
      const src = c.kind==='fact' ? c.p.fact : c.p.plan;
      const rr = pnlRowsFor(src)[i];
      return pnlCell(rr, src).replace('<td', `<td data-kind="${c.kind}"`);
    }).join('');
    return `<tr class="${cls}"><td class="sticky-col">${r.label}</td>${r.head?cols.map(()=>'<td></td>').join(''):cells}</tr>`;
  }).join('');

  /* сводка план/факт по закрытым месяцам */
  const closedPlan = pnlSum(facts.map((f,i)=>pnlFromModel(model,i+1)));
  const closedFact = facts.length ? pnlSum(facts.map((f,i)=>pnlFromFact(f, factDep[i]))) : null;

  app.innerHTML = `
    <h1 class="page-title">Отчёт о прибылях и убытках</h1>
    <p class="page-sub">Начислением: выручка признаётся в том месяце, к которому относится, а не когда пришли деньги. Годовая подписка приносит деньги сразу, а в P&amp;L раскладывается по 1/12 — поэтому прибыль и остаток на счету никогда не совпадают, и ниже показано, почему.</p>

    <div class="pnl-controls">
      <div class="toggle-row" id="pnlPeriodRow">
        <button data-p="month" class="${_pnlPeriod==='month'?'active':''}">По месяцам</button>
        <button data-p="quarter" class="${_pnlPeriod==='quarter'?'active':''}">По кварталам</button>
        <button data-p="year" class="${_pnlPeriod==='year'?'active':''}">По годам</button>
      </div>
      <div class="toggle-row" id="pnlSourceRow">
        <button data-s="both" class="${_pnlSource==='both'?'active':''}">Факт и план</button>
        <button data-s="fact" class="${_pnlSource==='fact'?'active':''}">Только факт</button>
        <button data-s="plan" class="${_pnlSource==='plan'?'active':''}">Только план</button>
      </div>
    </div>

    ${closedFact ? `
    <section class="block" style="margin-top:0;">
      <h2>Закрытый период — ${facts.length} ${facts.length===1?'месяц':(facts.length<5?'месяца':'месяцев')} факта против плана</h2>
      <p class="block-sub">С ${facts[0].label} по ${facts[facts.length-1].label}. Отклонение считается к плановой модели за тот же период.</p>
      <div class="card table-card">
        <table class="calc-table variance-table">
          <thead><tr><th>Показатель</th><th>Факт</th><th>План</th><th>Отклонение</th><th>%</th></tr></thead>
          <tbody>${[
            ['Выручка', closedFact.revenue, closedPlan.revenue, false],
            ['— подписка', closedFact.revSub, closedPlan.revSub, false],
            ['— допродажи', closedFact.revAddon, closedPlan.revAddon, false],
            ['Себестоимость', closedFact.cogs, closedPlan.cogs, true],
            ['Валовая прибыль', closedFact.grossProfit, closedPlan.grossProfit, false],
            ['Операционные расходы', closedFact.opex, closedPlan.opex, true],
            ['EBITDA', closedFact.ebitda, closedPlan.ebitda, false],
            ['Налоги', closedFact.tax, closedPlan.tax, true],
            ['Чистая прибыль', closedFact.net, closedPlan.net, false],
          ].map(([label, f, pl, invert])=>{
            const d = f-pl;
            const good = invert ? d<=0 : d>=0;
            return `<tr class="${label.startsWith('—')?'pnl-indent':''} ${['EBITDA','Чистая прибыль','Валовая прибыль'].includes(label)?'pnl-total':''}">
              <td>${label}</td>
              <td class="num hl">${money(f)}</td>
              <td class="num">${money(pl)}</td>
              <td class="num ${good?'pos':'neg'}">${d>=0?'+':'−'}${money(Math.abs(d))}</td>
              <td class="num ${good?'pos':'neg'}">${pl?((d/Math.abs(pl))*100).toFixed(0)+'%':'—'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </section>` : ''}

    <section class="block">
      <h2>Полный отчёт</h2>
      <p class="block-sub">Отрицательные суммы в скобках — как в бухгалтерской практике. Строки со сдвигом — расшифровка итога над ними.</p>
      <div class="breakout-wide">
        <div class="cf-table-card">
          <div class="cf-table-title">P&amp;L · ${_pnlPeriod==='month'?'помесячно':(_pnlPeriod==='quarter'?'по кварталам':'по годам')}</div>
          <div class="table-scroll">
            <table class="pnl-table">
              <thead>${headRow}</thead>
              <tbody>${bodyRows}</tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section class="block">
      <h2>Почему прибыль и деньги — разные числа</h2>
      <p class="block-sub">Мост от чистой прибыли к денежному потоку за первый год модели. Каждая строка объясняет, где деньги расходятся с прибылью.</p>
      <div class="grid-2">
        <div class="card table-card">
          <table class="calc-table waterfall">
            <tbody>
              <tr><td>Чистая прибыль за Год 1</td><td class="num">${money(cfSumRange(model.netProfit,1,12))}</td></tr>
              <tr><td>+ Амортизация — расход в P&amp;L, но деньги ушли раньше</td><td class="num pos">+${money(cfSumRange(model.depreciation,1,12))}</td></tr>
              <tr><td>+ Прирост авансов по годовым подпискам</td><td class="num pos">+${money(model.deferred[12]-model.deferred[0])}</td></tr>
              <tr><td>− Капвложения — деньги ушли, в P&amp;L их нет</td><td class="num neg">−${money(cfSumRange(model.capex,1,12))}</td></tr>
              <tr class="total-row"><td>Операционный денежный поток</td><td class="num ${cfSumRange(model.cfOper,1,12)<0?'neg':'pos'}">${money(cfSumRange(model.cfOper,1,12))}</td></tr>
              <tr><td>+ Внешние деньги — раунды и займы</td><td class="num pos">+${money(cfSumRange(model.cfFin,1,12))}</td></tr>
              <tr><td>+ Остаток на начало</td><td class="num">${money(model.cash[0])}</td></tr>
              <tr class="total-row"><td>Остаток на счету к концу Года 1</td><td class="num ${model.cash[12]<0?'neg':'pos'}">${money(model.cash[12])}</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card"><div class="chart-holder" style="height:320px;"><canvas id="pnlChart"></canvas></div></div>
      </div>
    </section>
  `;

  document.querySelectorAll('#pnlPeriodRow button').forEach(b=>{ b.onclick = ()=>{ _pnlPeriod = b.dataset.p; renderPnl(); }; });
  document.querySelectorAll('#pnlSourceRow button').forEach(b=>{ b.onclick = ()=>{ _pnlSource = b.dataset.s; renderPnl(); }; });

  killChart('pnl');
  const cv = document.getElementById('pnlChart');
  if(cv) _finCharts.pnl = new Chart(cv, {
    type:'bar',

/* ============================================================

let _repView = 'day';
let _repDate = null;

async function renderReports(){
  killAllCharts();
  const days = await getDaily();
  if(!_repDate || !days.some(d=>d.d===_repDate)) _repDate = days.length ? days[days.length-1].d : new Date().toISOString().slice(0,10);
  app.innerHTML = `
    <h1 class="page-title">Отчёты</h1>
    <p class="page-sub">Один день — одна запись одного и того же формата. Из дней собираются недели и месяцы, из месяцев — фактический P&amp;L. Регулярные расходы и ФОТ сюда не вносятся: они уже в реестре расходов и подхватываются сами.</p>
    <div class="toggle-row" id="repTabs">
      <button data-v="day"     class="${_repView==='day'?'active':''}">День</button>
      <button data-v="week"    class="${_repView==='week'?'active':''}">Недели</button>

    <div id="repBody"><div class="loading">Собираем отчёт…</div></div>
  `;
  document.querySelectorAll('#repTabs button').forEach(b=>{ b.onclick = ()=>{ _repView = b.dataset.v; renderReports(); }; });
  const body = document.getElementById('repBody');
  const map = {day:renderRepDay, week:renderRepWeek, month:renderRepMonth, journal:renderRepJournal};
  await (map[_repView]||renderRepDay)(body);
}

function readDailyForm(){
  const rec = {d: document.getElementById('dfDate').value, gmv:{}, spend:{}};
  document.querySelectorAll('.df-in').forEach(el=>{

  });
  document.querySelectorAll('[data-df="revSub"]').forEach(el=>{ rec.revSub = parseThousands(el.value); });
  document.querySelectorAll('.df-gmv').forEach(el=>{ const v = parseThousands(el.value); if(v) rec.gmv[el.dataset.addon]=v; });
  document.querySelectorAll('.df-spend').forEach(el=>{ const v = parseThousands(el.value); if(v) rec.spend[el.dataset.cat]=v; });
  const n = document.getElementById('dfNote'); if(n && n.value.trim()) rec.note = n.value.trim();

function wireDailyForm(rerender){
  document.querySelectorAll('.money-fmt-input').forEach(wireThousandsInput);
  document.getElementById('dfDate').addEventListener('change', (e)=>{ _repDate = e.target.value; rerender(); });
  document.getElementById('saveDayBtn').onclick = async ()=>{
    const rec = readDailyForm();
    const list = (await getDaily()).filter(x=>x.d!==rec.d);
    list.push(rec); saveDaily(list); _repDate = rec.d; rerender();
  };
  document.getElementById('deleteDayBtn').onclick = async ()=>{
    const list = (await getDaily()).filter(x=>x.d!==_repDate);
    saveDaily(list); rerender();
  };
}

  const idx = days.findIndex(d=>d.d===_repDate);

  const prev7  = idx>=7 ? days.slice(Math.max(0, idx-13), idx-6) : [];
  const dayAgg = rollupDays([rec], revCfg);

        <div class="stat-box"><div class="sv">${num(activeNow)}</div><div class="sl">платящих всего</div></div>
        <div class="stat-box ${dayAgg.spendTotal?'neg':''}"><div class="sv">${money(dayAgg.spendTotal)}</div><div class="sl">платежей за день</div></div>

    <section class="block">

      <p class="block-sub">Последние 7 дней против предыдущих семи, и месяц нарастающим итогом против плана модели, разложенного по дням.</p>

async function renderVoting(){
  const polls = await getCache('eva-club-polls', []);
  polls.sort((a,b)=>b.ts-a.ts);
  const allTasks = await getTasks();
  const people = await getPeople();

  const reviewTasks = allTasks.filter(t=>t.status==='review');
  const blockedTasks = allTasks.filter(t=>isBlocked(t, allTasks));
  const decisionRow = (t, reason)=>{
    const a = people.find(p=>p.id===t.assignee);
    return `<div class="decision-row" data-task="${t.id}">
      <span class="dept-badge dept-${t.dept||'none'}">${t.dept?DEPT_CODE[t.dept]:'—'}</span>
      <span class="decision-title">${esc(t.title)}</span>

    </div>`;
  };
  const decisionsHtml = (reviewTasks.length || blockedTasks.length) ? `
    <section class="block">
      <h2>Требует решения сейчас</h2>

        ${reviewTasks.map(t=>decisionRow(t, '◈ Ждёт согласования')).join('')}

    </section>` : '';

  const LEVEL_LABEL = {team:'Команда', shareholders:'Акционеры'};
  const list = polls.length ? polls.map(p=>{
    const total = p.options.reduce((a,o)=>a+o.votes,0);

    const opts = p.options.map((o,i)=>{
      const pct = total ? Math.round(o.votes/total*100) : 0;
      return `<div class="poll-opt"><button data-poll="${p.id}" data-opt="${i}">
        <span class="barfill" style="width:${pct}%"></span>

    }).join('');

    const applyBtn = (p.taskId && total>0) ? `<button class="btn ghost" data-apply-decision="${p.id}" style="margin-top:10px;">Применить решение к задаче</button>` : '';
    const openTaskLink = p.taskId ? `<button class="btn ghost" data-open-task="${p.taskId}" style="margin-top:10px;">→ Открыть задачу</button>` : '';
    return `<div class="poll-card"><h3>${esc(p.question)}${levelBadge}</h3>${opts}<div class="poll-meta">${total} голос(ов) · ${fmtDate(p.ts)}</div><div style="display:flex; gap:8px; flex-wrap:wrap;">${applyBtn}${openTaskLink}</div></div>`;
  }).join('') : `<div class="empty-state">Пока нет голосований — создайте первое.</div>`;

  app.innerHTML = `
    <h1 class="page-title">Голосования</h1>
    <p class="page-sub">Совместные решения по проекту. Один голос за опрос с этого устройства.</p>
    ${decisionsHtml}
    <section class="block">
      <h2>Опросы</h2>
    <div class="composer">
      <h4>Новое голосование</h4>
      <div class="field-row">
        <div class="field" style="flex:2;"><label>Вопрос</label><input type="text" id="pollQuestion" placeholder="О чём голосуем?"></div>
        <div class="field"><label>Уровень</label><select id="pollLevel"><option value="team">Команда</option><option value="shareholders">Акционеры</option></select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Вариант 1</label><input type="text" class="pollOpt" placeholder="Вариант"></div>
        <div class="field"><label>Вариант 2</label><input type="text" class="pollOpt" placeholder="Вариант"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Вариант 3 (необязательно)</label><input type="text" class="pollOpt" placeholder="Вариант"></div>
        <div class="field"><label>Вариант 4 (необязательно)</label><input type="text" class="pollOpt" placeholder="Вариант"></div>
      </div>
      <button class="btn" id="createPollBtn">Создать голосование</button>
    </div>
    <div>${list}</div>
    </section>

    <section class="block">
      <h2>Как это работает</h2>
      <div class="card">
        <div class="value-item" style="border-top:none; padding-top:0;"><div class="n">01</div><div><h4>Два уровня</h4><p>«Команда» — для операционных вопросов, «Акционеры» — для стратегических решений (раунды, крупные найм-решения, целевые метрики).</p></div></div>
        <div class="value-item"><div class="n">02</div><div><h4>Требует решения — само собой</h4><p>Задачи на согласовании и заблокированные зависимостями появляются здесь автоматически — их не нужно выносить вручную.</p></div></div>
        <div class="value-item"><div class="n">03</div><div><h4>Голосование от задачи</h4><p>Кнопка «Вынести на голосование» в карточке задачи создаёт опрос с тремя исходами: одобрить и запустить, вернуть на доработку, или обсудить.</p></div></div>
        <div class="value-item"><div class="n">04</div><div><h4>Применение решения</h4><p>Когда голосов достаточно, лидирующий вариант помечается 👑. Кнопка «Применить решение к задаче» переносит исход в саму задачу — она уходит в работу, на доработку или закрывается.</p></div></div>
      </div>
    </section>
  `;
  document.querySelectorAll('.decision-row').forEach(row=>{
    row.addEventListener('click', ()=>openTaskModal(row.dataset.task, renderVoting));
  });
  document.getElementById('createPollBtn').onclick = async ()=>{
    const question = document.getElementById('pollQuestion').value.trim();
    const level = document.getElementById('pollLevel').value;
    const opts = Array.from(document.querySelectorAll('.pollOpt')).map(i=>i.value.trim()).filter(Boolean);
    if(!question || opts.length < 2) return;
    const btn = document.getElementById('createPollBtn');
    btn.textContent = 'Создание…'; btn.disabled = true;
    const list2 = await getCache('eva-club-polls', []);
    list2.push({id:uid(), question, level, options:opts.map(t=>({text:t, votes:0})), ts:Date.now()});
    setCacheLocal('eva-club-polls', list2); persistCache('eva-club-polls');
    renderVoting();
  };
  document.querySelectorAll('.poll-opt button').forEach(btn=>{
    btn.onclick = async ()=>{
      const pollId = btn.dataset.poll;
      if(votedPolls.has(pollId)) return;
      votedPolls.add(pollId);
      const list2 = await getCache('eva-club-polls', []);
      const p2 = list2.find(x=>x.id===pollId);
      if(p2){ p2.options[parseInt(btn.dataset.opt)].votes++; }
      setCacheLocal('eva-club-polls', list2); persistCache('eva-club-polls');
      renderVoting();
    };
  });
  document.querySelectorAll('[data-open-task]').forEach(btn=>{
    btn.onclick = ()=>openTaskModal(btn.dataset.openTask, renderVoting);
  });
  document.querySelectorAll('[data-apply-decision]').forEach(btn=>{
    btn.onclick = async ()=>{
      const list2 = await getCache('eva-club-polls', []);
      const p = list2.find(x=>x.id===btn.dataset.applyDecision);
      if(!p || !p.taskId) return;
      const total = p.options.reduce((a,o)=>a+o.votes,0);
      if(!total) return;
      const leadIdx = p.options.reduce((best,o,i,arr)=>o.votes>arr[best].votes?i:best, 0);
      const leadText = p.options[leadIdx].text;
      const tasks = await getTasks();
      const task = tasks.find(x=>x.id===p.taskId);
      if(task){
        if(leadText.includes('Одобрить')){ task.status='done'; task.rejected=false; }
        else if(leadText.includes('доработку')){ task.status='doing'; task.rejected=true; task.comment='Решение по голосованию: вернуть на доработку.'; }
        saveTasks(tasks);
      }
      alert('Решение применено к задаче: «'+leadText+'»');
      renderVoting();
    };
  });
}

/* ============================================================
   ATTACH HANDLERS (per-page interactive bits that need post-render wiring)
   ============================================================ */
function attachHandlers(){
  // referral calc (community page)
  const refAmount = document.getElementById('refAmount');
  const refTier = document.getElementById('refTier');
  if(refAmount && refTier){
    const upd = ()=>{ document.getElementById('refResult').textContent = money((parseFloat(refAmount.value)||0) * (parseFloat(refTier.value)/100)); };
    refAmount.oninput = upd; refTier.onchange = upd; upd();
  }
  const refAmount2 = document.getElementById('refAmount2');
  const refTier2 = document.getElementById('refTier2');
  if(refAmount2 && refTier2){
    const upd = ()=>{ document.getElementById('refResult2').textContent = money((parseFloat(refAmount2.value)||0) * (parseFloat(refTier2.value)/100)); };
    refAmount2.oninput = upd; refTier2.onchange = upd; upd();
  }
  // growth toggle
  const growthToggle = document.getElementById('growthToggle');
  if(growthToggle){
    growthToggle.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ growthToggle.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderGrowthTable(b.dataset.k); };
    });
    renderGrowthTable('average');
  }
  // launch toggle
  const launchToggle = document.getElementById('launchToggle');
  if(launchToggle){
    launchToggle.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ launchToggle.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderLaunchTable(b.dataset.k); };
    });
    renderLaunchTable('desired');
  }
  // equity exit calc
  const exitVal = document.getElementById('exitVal');
  if(exitVal){ exitVal.oninput = renderExitTable; renderExitTable(); }
  // bonus calc
  const bonusBtnFields = document.getElementById('bonusSalary');
  if(bonusBtnFields){
    document.querySelectorAll('#bonusSalary, #bonusPct, .bonusGrade, #bonusProfit').forEach(el=>{
      el.addEventListener('input', renderBonus); el.addEventListener('change', renderBonus);
    });
    renderBonus();
  }
}
</script>
