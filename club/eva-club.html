    </section>

    <section class="block">
      <h2>Добавить цель</h2>
      <div class="card">
        <div class="field-row">
          <div class="field"><label>Что считаем</label><select id="newGoalKind">${Object.entries(GOAL_KINDS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select></div>
          <div class="field"><label>Значение</label><input type="text" class="money-fmt-input" id="newGoalTarget" placeholder="1000"></div>
          <div class="field"><label>К месяцу</label><select id="newGoalMonth">${Array.from({length:FIN_HORIZON},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===12?'selected':''}>${finMonthLabel(m)}</option>`).join('')}</select></div>
          <div class="field grow"><label>Зачем эта цель</label><input type="text" id="newGoalNote" placeholder="Например, выйти на самоокупаемость до раунда A"></div>
        </div>
        <button class="btn" id="addGoalBtn">+ Поставить цель</button>
      </div>
    </section>

    <section class="block">
      <h2>Нормативы декомпозиции</h2>
      <p class="block-sub">Правила, по которым цель превращается в задачи по людям и контенту. Меняются под вашу реальность.</p>
      <div class="card">
        <div class="field-row">
          <div class="field"><label>Пользователей на одного эксперта</label><input type="number" id="normExpert" value="${norms.usersPerExpert}"></div>
          <div class="field"><label>Мастер-классов на каждые 100 пользователей в мес.</label><input type="number" id="normContent100" value="${norms.contentPer100Users}"></div>
          <div class="field"><label>Базовый выпуск контента, шт./мес</label><input type="number" id="normContentBase" value="${norms.contentBaseMonthly}"></div>
          <div class="field"><label>Рабочих дней в месяце</label><input type="number" id="normWorkDays" value="${norms.workDaysPerMonth}"></div>
        </div>
      </div>
    </section>
  `;

  document.getElementById('addGoalBtn').onclick = async ()=>{
    const list = await getGoals();
    list.push({
      id:uid(), kind:document.getElementById('newGoalKind').value,
      target: parseThousands(document.getElementById('newGoalTarget').value),
      byMonth: parseInt(document.getElementById('newGoalMonth').value)||12,
      note: document.getElementById('newGoalNote').value.trim(),
    });
    saveGoals(list); renderFinGoals(body);
  };
  document.querySelectorAll('[data-del-goal]').forEach(b=>{
    b.onclick = async ()=>{ saveGoals((await getGoals()).filter(g=>g.id!==b.dataset.delGoal)); renderFinGoals(body); };
  });
  document.querySelectorAll('[data-goal-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const list = await getGoals(); const g = list.find(x=>x.id===inp.dataset.id); if(!g) return;
      const f = inp.dataset.goalField;
      g[f] = (f==='target') ? parseThousands(inp.value) : (f==='byMonth' ? parseInt(inp.value) : inp.value);
      saveGoals(list); renderFinGoals(body);
    });
  });
  const normMap = {normExpert:'usersPerExpert', normContent100:'contentPer100Users', normContentBase:'contentBaseMonthly', normWorkDays:'workDaysPerMonth'};
  Object.entries(normMap).forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', async ()=>{
      const n = await getNorms(); n[key] = parseFloat(el.value)||DEFAULT_NORMS[key]; saveNorms(n); renderFinGoals(body);
    });
  });
  document.querySelectorAll('.money-fmt-input').forEach(wireThousandsInput);
}

function goalCardHtml(g, kind, d, inner, cls, footnote){
  const targetLabel = g.kind==='breakeven' ? 'выход в плюс' : (g.kind==='revenue' ? money(g.target)+'/мес' : num(g.target)+' '+kind.unit);
  return `
    <article class="goal-card ${cls||''}">
      <header class="goal-head">
        <div>
          <span class="goal-kind">${kind.name}</span>
          <h3 class="goal-target">${targetLabel} <span class="goal-when">к ${finMonthLabel(g.byMonth)}</span></h3>
          ${g.note?`<p class="goal-note">${esc(g.note)}</p>`:''}
        </div>
        <div class="goal-controls">
          <input type="text" class="v-input money-fmt-input" data-goal-field="target" data-id="${g.id}" value="${fmtThousands(g.target)}" title="Значение цели" style="width:96px; text-align:right;">
          <select class="v-input" data-goal-field="byMonth" data-id="${g.id}" title="Срок">
            ${Array.from({length:FIN_HORIZON},(_,i)=>i+1).map(m=>`<option value="${m}" ${g.byMonth===m?'selected':''}>${finMonthLabel(m)}</option>`).join('')}
          </select>
          <button class="btn ghost sm-del" data-del-goal="${g.id}" title="Убрать цель">✕</button>
        </div>
      </header>
      ${d.monthsLeft<=0 ? `<p class="empty-note">Срок цели уже наступил или прошёл — сдвиньте дату, чтобы получить декомпозицию.</p>` : inner}
      ${footnote && d.monthsLeft>0 ? `<p class="goal-footnote">${footnote}</p>` : ''}
    </article>`;
}
function decompStep(n, label, value, hint){
  return `<div class="decomp-step">
    <span class="ds-n">${n}</span>
    <div class="ds-body"><span class="ds-label">${label}</span><span class="ds-value">${value}</span>${hint?`<span class="ds-hint">${hint}</span>`:''}</div>
  </div>`;
}
function decompItem(label, value, hint, cls){
  return `<div class="decomp-item ${cls||''}"><span class="di-label">${label}</span><span class="di-value">${value}</span>${hint?`<span class="di-hint">${hint}</span>`:''}</div>`;
}

async function renderFinRevenue(body){
  const rev = await getRevenueCfg();
  const fun = await getFunnelCfg();
  const cfg = await buildFinCfg({economy:_economyMode});
  const ue  = unitEconomics(cfg, 12);
  const model = computeFinModel(cfg);

  const addonRows = rev.addons.map(a=>`
    <tr data-id="${a.id}" class="${a.active===false?'economy-cut':''}">
      <td><input type="text" class="v-input rev-f" data-rev-field="name" data-id="${a.id}" value="${esc(a.name)}"></td>
      <td><input type="number" step="1" class="v-input rev-f" data-rev-field="conv" data-id="${a.id}" value="${(a.conv*100).toFixed(0)}" style="width:64px; text-align:right;"> <span class="unit">%</span></td>
      <td><input type="text" class="v-input money-fmt-input rev-f" data-rev-field="price" data-id="${a.id}" value="${fmtThousands(a.price)}" style="width:88px; text-align:right;"></td>
      <td><input type="number" step="1" class="v-input rev-f" data-rev-field="take" data-id="${a.id}" value="${(a.take*100).toFixed(0)}" style="width:64px; text-align:right;"> <span class="unit">%</span></td>

      <td style="text-align:center;"><input type="checkbox" class="rev-active" data-id="${a.id}" ${a.active!==false?'checked':''}></td>
      <td><button class="btn ghost sm-del" data-del-addon="${a.id}">✕</button></td>
    </tr>`).join('');

  /* ---------- варианты модели ---------- */
  const vstore   = await getVariants();
  const vitems   = vstore.items || [];
  const current  = await variantFromCurrent('текущие настройки', 'realistic');
  const curStats = variantStats(cfg, current);
  const vrows    = vitems.map(v=>({v, st: variantStats(cfg, v)}));
  const baseRow  = vrows.find(r=>r.v.id===vstore.approved) || vrows.find(r=>r.v.kind==='realistic') || null;
  const baseRev  = baseRow ? baseRow.st.revY3 : curStats.revY3;
  const sameAsCurrent = (v)=>JSON.stringify([v.funnel, v.revenue])===JSON.stringify([current.funnel, current.revenue]);

  /* проверки: пессимистичный не должен быть сильнее базового и наоборот */
  const vwarn = [];
  vrows.forEach(r=>{
    const k = VARIANT_KIND_MAP[r.v.kind]; if(!k || !baseRow || r.v.id===baseRow.v.id || k.id==='realistic') return;
    const ratio = baseRev ? r.st.revY3/baseRev : 1;
    if(ratio < k.min || ratio > k.max){
      vwarn.push({row:r, kind:k, ratio,
        text: k.id==='pessimistic'
          ? (ratio > k.max
              ? `«${esc(r.v.name)}» помечен пессимистичным, но даёт ${cfPct(ratio-1, true)} к базовому варианту — пессимистичный сценарий не может быть выгоднее базового.`

          : (ratio < k.min
              ? `«${esc(r.v.name)}» помечен оптимистичным, но почти не отличается от базового (${cfPct(ratio-1, true)}). Оптимистичный вариант должен показывать, что будет, если всё пойдёт лучше.`
              : `«${esc(r.v.name)}» выше базового в ${dec(ratio)} раза. Такой разброс инвестор читает как «цифры взяты с потолка».`)});

      <div class="ctrl-grid">

        </div>

  /* ---------- варианты: сохранить, применить, утвердить, подогнать ---------- */
  const rerenderRev = ()=>renderFinRevenue(body);
  /* каждая кнопка спрашивает подтверждение вторым нажатием */
  const armed = (btn, question, run)=>{
    const original = btn.textContent;
    btn.onclick = async ()=>{
      if(btn.dataset.armed!=='1'){
        btn.dataset.armed = '1';
        btn.textContent = question;
        btn.classList.add('armed');
        setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.textContent = original; btn.classList.remove('armed'); } }, 6000);
        return;
      }
      await run();
    };
  };

  if(saveVarBtn) saveVarBtn.onclick = async ()=>{
    const name = document.getElementById('newVarName').value.trim();
    const kind = document.getElementById('newVarKind').value;
    if(!name){ document.getElementById('newVarName').focus(); return; }
    const st = await getVariants();
    const v = await variantFromCurrent(name, kind);
    st.items = (st.items||[]).concat([v]);
    if(!st.approved && kind==='realistic') st.approved = v.id;   /* первый базовый становится точкой отсчёта */

  document.querySelectorAll('[data-var-approve]').forEach(btn=>armed(btn, 'Утвердить? Ещё раз', async ()=>{

    const st = await getVariants();

    if(v){
      const fresh = await variantFromCurrent(v.name, v.kind);
      v.funnel = fresh.funnel; v.revenue = fresh.revenue; v.savedAt = fresh.savedAt;
      saveVariants(st);
    }
    rerenderRev();
  }));
  document.querySelectorAll('[data-var-del]').forEach(btn=>armed(btn, 'Удалить?', async ()=>{

    const st = await getVariants();
    const v = (st.items||[]).find(x=>x.id===btn.dataset.varFit);
    if(v){
      const k = VARIANT_KIND_MAP[v.kind] || VARIANT_KINDS[1];
      const fitted = fitVariant(cfg, v, baseRev*k.ratio);
      v.funnel = fitted.funnel; v.revenue = fitted.revenue; v.savedAt = new Date().toISOString();
      saveVariants(st);
    }
    rerenderRev();
  }));

  document.querySelectorAll('.money-fmt-input').forEach(wireThousandsInput);

  document.querySelectorAll('[data-cfg-store]').forEach(inp=>{

      renderFinRevenue(body);

        el.textContent = def.fmt(v);
        el.classList.toggle('warn', !!(def.warn && v>def.warn));
      }
    });
  });
  document.querySelectorAll('[data-rev-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const r = await getRevenueCfg(); const a = r.addons.find(x=>x.id===inp.dataset.id); if(!a) return;
      const f = inp.dataset.revField;
      if(f==='conv'||f==='take') a[f] = (parseFloat(inp.value)||0)/100;
      else if(f==='price') a.price = parseThousands(inp.value);
      else a[f] = inp.value;
      saveRevenueCfg(r); renderFinRevenue(body);

  });
  document.querySelectorAll('.rev-active').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const r = await getRevenueCfg(); const a = r.addons.find(x=>x.id===cb.dataset.id);
      if(a){ a.active = cb.checked; saveRevenueCfg(r); renderFinRevenue(body); }
    });
  });
  document.querySelectorAll('[data-del-addon]').forEach(b=>{
    b.onclick = async ()=>{
      const r = await getRevenueCfg(); r.addons = r.addons.filter(a=>a.id!==b.dataset.delAddon);
      saveRevenueCfg(r); renderFinRevenue(body);
    };
  });
  document.getElementById('addAddonBtn').onclick = async ()=>{
    const name = document.getElementById('newAddonName').value.trim(); if(!name) return;
    const r = await getRevenueCfg();
    r.addons.push({id:uid(), name,
      conv:(parseFloat(document.getElementById('newAddonConv').value)||0)/100,
      price: parseThousands(document.getElementById('newAddonPrice').value),
      take:(parseFloat(document.getElementById('newAddonTake').value)||0)/100, active:true});
    saveRevenueCfg(r); renderFinRevenue(body);
  };

  killChart('funnel');
  const cv = document.getElementById('funnelChart');
  if(cv) _finCharts.funnel = new Chart(cv, {
    type:'bar',
    data:{labels:Array.from({length:12},(_,i)=>finMonthLabel(i+1)), datasets:[
      {type:'bar', label:'Визиты', data:model.leads.slice(1,13), backgroundColor:'#E4E0D4', yAxisID:'big', borderWidth:0},
      {type:'bar', label:'Регистрации', data:model.registered.slice(1,13), backgroundColor:'#C7B79A', yAxisID:'big', borderWidth:0},
      {type:'line', label:'Новые платящие', data:model.newPaying.slice(1,13), borderColor:SERIES.revenue, yAxisID:'small', tension:0.25, borderWidth:2.5, pointRadius:2},
      {type:'line', label:'Отток', data:model.churned.slice(1,13), borderColor:SERIES.expense, yAxisID:'small', tension:0.25, borderWidth:2, borderDash:[4,3], pointRadius:0},
    ]},

      x:{grid:{display:false}, ticks:{color:CHART_SOFT, font:{size:10}}},
      big:{position:'left', grid:{color:CHART_GRID}, ticks:{color:CHART_SOFT, font:{size:10}, callback:v=>num(v)}},
      small:{position:'right', grid:{display:false}, ticks:{color:CHART_SOFT, font:{size:10}, callback:v=>num(v)}},

}

/* ============================================================
   СКОЛЬКО НУЖНО ДЕНЕГ НА ЗАПУСК
   ============================================================ */
let _launchBufferMonths = 3;

async function renderFinLaunch(body){
  const exp = await getExpenses();
  const stratPlan = await getStratPlan();
  const cfgNoFin = await buildFinCfg({economy:_economyMode, noFinancing:true, cashStart:0});
  const bare = computeFinModel(cfgNoFin);

  /* Дно кумулятивного потока без внешних денег — это и есть дыра,
     которую надо закрыть, чтобы не остаться без денег ни в один месяц. */
  const deficit    = Math.abs(Math.min(0, bare.minCumOper));
  const bottomM    = Math.max(1, bare.minCumOperMonth);
  const peakBurn   = Math.max(...bare.burn.slice(1, bottomM+1), 0);
  const buffer     = peakBurn*_launchBufferMonths;
  const needed     = Math.ceil((deficit+buffer)/100000)*100000;
  const financing  = await getFinancing();
  const raised     = financing.reduce((s,f)=>s+f.amount, 0) + exp.cash;
  const gap        = needed - raised;

  /* На что уходят деньги до выхода в плюс */
  const to = Math.max(1, bottomM);
  const spendRows = EXP_CATS.map(c=>({c, v:cfSumRange(bare.byCat[c.id], 1, to)}))
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  const spendTotal = spendRows.reduce((s,r)=>s+r.v,0);
  const revenueTilBottom = cfSumRange(bare.cashIn, 1, to);
  const taxTilBottom = cfSumRange(bare.taxTotal, 1, to);

  const scenarioNeed = await Promise.all(Object.entries(FIN_SCENARIOS).map(async ([k,s])=>{
    const c = await buildFinCfg({economy:_economyMode, noFinancing:true, cashStart:0, funnel:s.funnel, revenue:s.revenue});
    const m = computeFinModel(c);
    const d = Math.abs(Math.min(0, m.minCumOper));
    const b = Math.max(...m.burn.slice(1, Math.max(2, m.minCumOperMonth+1)), 0)*_launchBufferMonths;
    return {k, s, need: Math.ceil((d+b)/100000)*100000, bottom:m.minCumOperMonth, be:m.breakevenMonth};
  }));

  /* План первых месяцев — из «Стратегии», здесь он только показывается */
  const planMonths = [1,2,3,4,5,6];
  const ue = unitEconomics(cfgNoFin, 4);
  const planExpense = planMonths.map(m=> bare.totalExpense[m]+bare.capex[m]);
  let c = 0;
  const planCash = planMonths.map((m,i)=>{ c += bare.cashIn[m]-planExpense[i]; return c; });

  const preFin   = financing.filter(f=>f.stage==='prelaunch');
  const scaleFin = financing.filter(f=>f.stage==='scale');
  const mainFin  = financing.filter(f=>f.stage!=='prelaunch' && f.stage!=='scale');
  const preSum   = preFin.reduce((s2,f)=>s2+f.amount,0);
  const mainSum  = mainFin.reduce((s2,f)=>s2+f.amount,0);
  const scaleSum = scaleFin.reduce((s2,f)=>s2+f.amount,0);
  const preNeed  = Math.abs(Math.min(0, ...planMonths.map((m,i)=>planCash[i])));
  const mainNeed = Math.max(0, needed - preNeed);
  const stageOpts = (sel)=>FIN_STAGES.map(st=>`<option value="${st.id}" ${(sel||'launch')===st.id?'selected':''}>${st.label}</option>`).join('');
  /* ориентир для раунда на масштабирование: год привлечения сверх плана
     на третьем году — столько стоит купить рост, а не ждать его */
  const scaleHint = Math.round((cfSumRange(bare.byCat.marketing||[],25,36))/1e6)*1e6;

  const financingRows = financing.map(f=>`
    <tr data-id="${f.id}">
      <td><input type="text" class="v-input fin-f" data-fin-field="name" data-id="${f.id}" value="${esc(f.name)}"></td>
      <td><select class="v-input fin-f" data-fin-field="stage" data-id="${f.id}">${stageOpts(f.stage)}</select></td>
      <td><select class="v-input fin-f" data-fin-field="month" data-id="${f.id}">
        ${Array.from({length:FIN_HORIZON},(_,i)=>i+1).map(m=>`<option value="${m}" ${f.month===m?'selected':''}>${finMonthLabel(m)}</option>`).join('')}
      </select></td>
      <td><input type="text" class="v-input money-fmt-input fin-f" data-fin-field="amount" data-id="${f.id}" value="${fmtThousands(f.amount)}" style="text-align:right;"></td>
      <td><button class="btn ghost sm-del" data-del-fin="${f.id}">✕</button></td>
    </tr>`).join('');

  body.innerHTML = `
    <section class="block" style="margin-top:0;">
      <span class="pre-launch-badge">Сколько денег нужно, чтобы дойти до самоокупаемости</span>
      <div class="need-hero">
        <div class="need-main">
          <span class="need-label">Нужно привлечь</span>
          <span class="need-value">${money(needed)}</span>
          <span class="need-sub">чтобы ни в один месяц не остаться без денег и дойти до операционного плюса${bare.breakevenMonth>0?' в '+finMonthLabel(bare.breakevenMonth):''}</span>
        </div>
        <div class="need-parts">
          <div class="need-part"><span class="np-l">Кассовый разрыв — дно в ${finMonthLabel(bottomM)}</span><span class="np-v">${money(deficit)}</span></div>
          <div class="need-part"><span class="np-l">Подушка: ${_launchBufferMonths} мес. пикового burn ${money(peakBurn)}</span><span class="np-v">${money(buffer)}</span></div>
          <div class="need-part total"><span class="np-l">Итого с округлением</span><span class="np-v">${money(needed)}</span></div>
        </div>
      </div>
      <div class="buffer-row">
        <label>Подушка безопасности:</label>
        <div class="toggle-row inline" id="bufferRow">
          ${[0,2,3,6].map(n=>`<button data-buffer="${n}" class="${_launchBufferMonths===n?'active':''}">${n===0?'без подушки':n+' мес.'}</button>`).join('')}
        </div>
        <span class="note-sm">Месяцы, которые проект переживёт, если выручка задержится.</span>
      </div>
      ${metricCards([
        {l:'Уже есть и обещано', v:money(raised), sub:`остаток ${money(exp.cash)} + раунды ${money(raised-exp.cash)}`},
        {l: gap>0 ? 'Не хватает' : 'Запас сверх потребности', v: money(Math.abs(gap)), cls: gap>0?'neg':'pos',
         sub: gap>0 ? 'столько нужно найти, чтобы модель не ушла в минус' : 'эти деньги нужны не на выживание, а на ускорение: чем больше бюджет привлечения, тем раньше набирается база'},
        {l:'Пиковый burn', v:money(peakBurn)+'/мес', sub:`месяц ${finMonthLabel(Math.max(1, bare.burn.indexOf(peakBurn)))}`},
        {l:'Дойти до плюса', v: bare.breakevenMonth>0 ? bare.breakevenMonth+' мес.' : 'дольше 36 мес.', cls: bare.breakevenMonth>0?'':'neg', sub:'без учёта внешних денег'},
      ])}
    </section>

    <section class="block">
      <h2>На что уходят деньги до дна</h2>
      <p class="block-sub">Всё, что проект потратит с первого месяца по ${finMonthLabel(bottomM)} включительно. Выручка за тот же период — ${money(revenueTilBottom)}, она уже вычтена из потребности выше.</p>
      <div class="grid-2">
        <div class="card table-card">
          <table class="calc-table">
            <thead><tr><th>Категория</th><th>Сумма</th><th>Доля</th></tr></thead>
            <tbody>
              ${spendRows.map(r=>`<tr><td>${r.c.name}</td><td class="num hl">${money(r.v)}</td><td class="num">${cfPct(r.v/spendTotal)}</td></tr>`).join('')}
              <tr><td>Налоги и взносы к уплате</td><td class="num hl">${money(taxTilBottom)}</td><td class="num">—</td></tr>
              <tr class="total-row"><td>Всего расходов за период</td><td class="num">${money(spendTotal+taxTilBottom)}</td><td class="num">100%</td></tr>
              <tr><td>Минус поступления</td><td class="num pos">−${money(revenueTilBottom)}</td><td></td></tr>
              <tr class="total-row"><td>Кассовый разрыв</td><td class="num neg">${money(deficit)}</td><td></td></tr>
            </tbody>
          </table>
        </div>
        <div class="card"><div class="chart-holder" style="height:320px;"><canvas id="launchCumChart"></canvas></div></div>
      </div>
    </section>

    <section class="block">
      <h2>Сколько нужно при разных сценариях</h2>
      <p class="block-sub">Те же расходы — разный рынок. Разница между строками — цена оптимизма.</p>
      <div class="card table-card">

/* ============================================================
   СТРАНИЦА P&L — ОТЧЁТ О ПРИБЫЛЯХ И УБЫТКАХ
   Начислением, а не по деньгам: выручка признаётся в месяце,
   к которому относится, даже если деньги пришли раньше
   (годовые подписки) или позже.
   ============================================================ */
let _pnlPeriod = 'month';
let _pnlSource = 'both';

function splitCats(byCat){
  const cogs = {}, opex = {}, capex = {};
  Object.entries(byCat||{}).forEach(([id,v])=>{
    if(!v) return;
    const k = (EXP_CAT_MAP[id]||{}).pnl || 'opex';
    if(k==='cogs') cogs[id]=v; else if(k==='capex') capex[id]=v; else opex[id]=v;
  });
  return {cogs, opex, capex};
}
function pnlFromModel(model, m){
  const byCat = {};
  EXP_CATS.forEach(c=>{ if(model.byCat[c.id][m]) byCat[c.id] = model.byCat[c.id][m]; });
  return {
    revSub: model.revSub[m], revAddon: model.revAddonNet[m], gmv: model.gmvAddon[m],
    revenue: model.revenue[m], byCat,
    cogs: model.cogs[m], opex: model.opex[m], capex: model.capex[m],
    grossProfit: model.grossProfit[m], ebitda: model.ebitda[m],
    depreciation: model.depreciation[m], ebit: model.ebit[m],
    tax: model.taxTotal[m], net: model.netProfit[m],
    active: model.active[m], cashIn: model.cashIn[m], cfOper: model.cfOper[m],
    deferredDelta: model.deferred[m]-model.deferred[m-1],
  };
}
function pnlFromFact(f, depreciation){
  return {
    revSub: f.revSub, revAddon: f.agg.revAddonNet, gmv: f.agg.gmvTotal,
    revenue: f.revenue, byCat: f.byCat,
    cogs: f.cogs, opex: f.opex, capex: f.capex,
    grossProfit: f.grossProfit, ebitda: f.ebitda,
    depreciation: depreciation||0, ebit: f.ebitda-(depreciation||0),
    tax: f.taxProfit, net: f.ebitda-(depreciation||0)-f.taxProfit,
    active: f.active, cashIn: f.cashIn, cfOper: f.cashIn-f.cogs-f.opex-f.taxProfit,
    deferredDelta: f.deferredDelta,
  };
}
function pnlSum(list){
  if(!list.length) return null;
  const out = {byCat:{}};
  ['revSub','revAddon','gmv','revenue','cogs','opex','capex','grossProfit','ebitda','depreciation','ebit','tax','net','cashIn','cfOper','deferredDelta']
    .forEach(k=>{ out[k] = list.reduce((s,p)=>s+(p[k]||0), 0); });
  list.forEach(p=>Object.entries(p.byCat||{}).forEach(([c,v])=>{ out.byCat[c]=(out.byCat[c]||0)+v; }));
  out.active = list[list.length-1].active;
  return out;
}

/* Один и тот же набор строк для всех колонок отчёта: список категорий
   собирается объединением по всем периодам, иначе у плана и факта
   получились бы разные строки и колонки поехали бы друг относительно
   друга. */
function pnlCatSets(sources){
  const totals = {};
  sources.forEach(p=>{ if(p) Object.entries(p.byCat||{}).forEach(([c,v])=>{ totals[c]=(totals[c]||0)+Math.abs(v||0); }); });
  const ids = Object.keys(totals).filter(c=>totals[c]>0).sort((a,b)=>totals[b]-totals[a]);
  return {
    cogs: ids.filter(c=>((EXP_CAT_MAP[c]||{}).pnl||'opex')==='cogs'),
    opex: ids.filter(c=>((EXP_CAT_MAP[c]||{}).pnl||'opex')==='opex'),
  };
}
function pnlRowsFor(p, sets){
  const byCat = (p && p.byCat) || {};
  const rows = [];
  rows.push({label:'Выручка', head:true});
  rows.push({label:'Подписка', v:p.revSub, indent:true});
  rows.push({label:'Допродажи — наша доля', v:p.revAddon, indent:true});
  rows.push({label:'Итого выручка', v:p.revenue, sub:true});
  rows.push({label:'Себестоимость', head:true});
  sets.cogs.forEach(c=>rows.push({label:expCatName(c), v:-(byCat[c]||0), indent:true}));
  rows.push({label:'Итого себестоимость', v:-p.cogs, sub:true});
  rows.push({label:'Валовая прибыль', v:p.grossProfit, total:true});
  rows.push({label:'Валовая маржа', pct: p.revenue?p.grossProfit/p.revenue:0, muted:true});
  rows.push({label:'Операционные расходы', head:true});
  sets.opex.forEach(c=>rows.push({label:expCatName(c), v:-(byCat[c]||0), indent:true}));
  rows.push({label:'Итого операционные', v:-p.opex, sub:true});
  rows.push({label:'EBITDA', v:p.ebitda, total:true});
  rows.push({label:'Рентабельность по EBITDA', pct: p.revenue?p.ebitda/p.revenue:0, muted:true});
  rows.push({label:'Амортизация капвложений', v:-p.depreciation, indent:true});
  rows.push({label:'Операционная прибыль (EBIT)', v:p.ebit, sub:true});
  rows.push({label:'Налоги', v:-p.tax, indent:true});
  rows.push({label:'Чистая прибыль', v:p.net, grand:true});
  rows.push({label:'Рентабельность по чистой прибыли', pct: p.revenue?p.net/p.revenue:0, muted:true});
  rows.push({label:'Справочно', head:true});
  rows.push({label:'Оборот площадки по допродажам', v:p.gmv, indent:true, memo:true});
  rows.push({label:'Активных платящих на конец периода', count:p.active, indent:true, memo:true});
  rows.push({label:'Выручка на активного (ARPU)', v: p.active ? p.revenue/p.active : 0, indent:true, memo:true});
  rows.push({label:'Поступило деньгами', v:p.cashIn, indent:true, memo:true});
  return rows;
}
function pnlCell(r){
  if(r.head) return '<td></td>';
  if(r.pct!==undefined) return `<td class="num muted">${cfPct(r.pct)}</td>`;
  if(r.count!==undefined) return `<td class="num">${num(r.count)}</td>`;
  const v = r.v || 0;
  return `<td class="num${v<0?' neg':''}">${v<0?'('+money(-v).replace(' ₽','')+') ₽':money(v)}</td>`;
}

async function renderPnl(){
  killAllCharts();
  const cfg = await buildFinCfg({economy:_economyMode});
  const model = computeFinModel(cfg);
  const facts = await buildFactMonths();
  const ledger = await getLedger();
  const revCfgL = await getRevenueCfg();

  /* амортизация факта — по тому же правилу, что и в модели */
  const factDep = facts.map((f,i)=>facts.slice(0,i+1).reduce((s,x)=>s+x.capex/CAPEX_AMORT_MONTHS,0));

  let periods = [];
  if(_pnlPeriod==='month'){
    const n = Math.max(facts.length, 12);
    for(let m=1;m<=n;m++){
      const f = facts[m-1];
      periods.push({key:'m'+m, label:finMonthLabel(m),
        plan: pnlFromModel(model,m),
        fact: f ? pnlFromFact(f, factDep[m-1]) : null});
    }
  } else if(_pnlPeriod==='quarter'){
    for(let q=0;q<8;q++){
      const a=q*3+1, b=q*3+3;
      const planList=[]; for(let m=a;m<=b;m++) planList.push(pnlFromModel(model,m));
      const factList = facts.slice(a-1,b).map((f,i)=>pnlFromFact(f, factDep[a-1+i]));
      periods.push({key:'q'+q, label:'Кв. '+(q%4+1)+' · '+finMonthDate(a).year,
        plan:pnlSum(planList), fact: factList.length===3 ? pnlSum(factList) : (factList.length?pnlSum(factList):null),
        partial: factList.length>0 && factList.length<3});
    }
  } else {
    for(let y=0;y<3;y++){
      const a=y*12+1, b=y*12+12;
      const planList=[]; for(let m=a;m<=b;m++) planList.push(pnlFromModel(model,m));
      const factList = facts.slice(a-1,b).map((f,i)=>pnlFromFact(f, factDep[a-1+i]));
      periods.push({key:'y'+y, label:'Год '+(y+1), plan:pnlSum(planList),
        fact: factList.length?pnlSum(factList):null, partial: factList.length>0 && factList.length<12});
    }
  }

  const showPlan = _pnlSource!=='fact' || !facts.length;
  const showFact = _pnlSource!=='plan';
  const factPeriods = periods.filter(p=>p.fact);
  const cols = [];
  periods.forEach(p=>{
    if(showFact && p.fact) cols.push({p, kind:'fact'});
    if(showPlan) cols.push({p, kind:'plan'});

  const sets = pnlCatSets(cols.map(c=>c.kind==='fact'?c.p.fact:c.p.plan));
  const colRows = cols.map(c=>pnlRowsFor(c.kind==='fact'?c.p.fact:c.p.plan, sets));
  const template = colRows[0] || pnlRowsFor(periods[0].plan, sets);
  const headRow = `<tr><th class="sticky-col">Показатель</th>${cols.map(c=>`
    <th class="${c.kind}">${c.p.label}<span class="col-kind">${c.kind==='fact'?(c.p.partial?'факт, неполный':'факт'):'план'}</span></th>`).join('')}</tr>`;
  const bodyRows = template.map((r,i)=>{
    const cls = [r.head?'pnl-head':'', r.sub?'pnl-sub':'', r.total?'pnl-total':'', r.grand?'pnl-grand':'',
                 r.muted?'pnl-muted':'', r.memo?'pnl-memo':'', r.indent?'pnl-indent':''].filter(Boolean).join(' ');

    return `<tr class="${cls}"><td class="sticky-col">${r.label}</td>${r.head?cols.map(()=>'<td></td>').join(''):cells}</tr>`;
  }).join('');

  /* сводка план/факт по закрытым месяцам */
  const closedPlan = pnlSum(facts.map((f,i)=>pnlFromModel(model,i+1)));
  const closedFact = facts.length ? pnlSum(facts.map((f,i)=>pnlFromFact(f, factDep[i]))) : null;

  app.innerHTML = `

    <p class="page-sub">Сколько заработали и сколько потратили — по месяцам, кварталам и годам. Факт против плана.</p>
    ${howHtml('Почему прибыль и деньги на счету не совпадают', 'Отчёт составлен начислением: выручка признаётся в том месяце, к которому относится, а не когда пришли деньги. Годовая подписка приносит все деньги сразу, а в P&amp;L раскладывается по 1/12 — разница копится в авансах. Мост от прибыли к деньгам показан внизу страницы.')}

            ['Валовая прибыль', closedFact.grossProfit, closedPlan.grossProfit, false],
            ['Операционные расходы', closedFact.opex, closedPlan.opex, true],
            ['EBITDA', closedFact.ebitda, closedPlan.ebitda, false],
            ['Амортизация', closedFact.depreciation, closedPlan.depreciation, true],
            ['Налоги', closedFact.tax, closedPlan.tax, true],
            ['Чистая прибыль', closedFact.net, closedPlan.net, false],
          ].map(([label, f, pl, invert])=>{
            const d = f-pl;
            const good = invert ? d<=0 : d>=0;
            return `<tr class="${label.startsWith('—')?'pnl-indent':''} ${['EBITDA','Чистая прибыль','Валовая прибыль'].includes(label)?'pnl-total':''}">
              <td>${label}</td>
              <td class="num hl">${money(f)}</td>
              <td class="num">${money(pl)}</td>
              <td class="num ${good?'pos':'neg'}">${d>=0?'+':'−'}${money(Math.abs(d))}</td>
              <td class="num ${good?'pos':'neg'}">${pl?((d/Math.abs(pl))*100).toFixed(0)+'%':'—'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </section>` : ''}

    <section class="block">
      <h2>Доходы и расходы — журнал платежей</h2>
      <p class="block-sub">Каждая оплата одной строкой: что пришло, что ушло. Из этих строк собирается факт. ФОТ и регулярные расходы записывать не нужно — они подставляются из реестра.</p>
      ${ledgerTableHtml(ledger, revCfgL, {defaultKind:'out', defaultDate: ledger.length ? ledger[ledger.length-1].d : undefined})}
    </section>

    <section class="block">
      <h2>Полный отчёт</h2>
      <p class="block-sub">Отрицательные суммы в скобках — как в бухгалтерской практике. Строки со сдвигом — расшифровка итога над ними.</p>
      <div class="breakout-wide">
        <div class="cf-table-card">
          <div class="cf-table-title">P&amp;L · ${_pnlPeriod==='month'?'помесячно':(_pnlPeriod==='quarter'?'по кварталам':'по годам')}</div>
          <div class="table-scroll">
            <table class="pnl-table">

              <tbody>${bodyRows}</tbody>

              <tr><td>+ Амортизация — расход в P&amp;L, но деньги ушли раньше</td><td class="num pos">+${money(cfSumRange(model.depreciation,1,12))}</td></tr>
              <tr><td>+ Прирост авансов по годовым подпискам</td><td class="num pos">+${money(model.deferred[12]-model.deferred[0])}</td></tr>

/* ============================================================
   ЖУРНАЛ ПЛАТЕЖЕЙ — ТАБЛИЦА «ДОХОДЫ И РАСХОДЫ»
   Один компонент для всех страниц: на P&L, в отчёте за день,
   на вкладке расходов. Одна строка — одно движение денег.
   ============================================================ */
let _lgMonth = 'all';
let _lgKindFilter = 'all';
let _lgShow = 60;

const FIN_SOURCES = [
  {id:'round',   name:'Инвестиционный раунд'},
  {id:'loan',    name:'Займ'},
  {id:'founder', name:'Взнос основателя'},
  {id:'grant',   name:'Грант / субсидия'},
];
function ledgerStatName(cat, revCfg){
  if(cat==='sub') return 'Подписка';
  const f = FIN_SOURCES.find(x=>x.id===cat); if(f) return f.name;
  const a = (revCfg.addons||[]).find(x=>x.id===cat);
  if(a) return a.name;
  return expCatName(cat);
}
function ledgerStatOptions(kind, revCfg, selected){
  if(kind==='fin'){
    return FIN_SOURCES.map(f=>`<option value="${f.id}" ${selected===f.id?'selected':''}>${f.name}</option>`).join('');
  }
  if(kind==='in'){
    return [`<option value="sub" ${selected==='sub'?'selected':''}>Подписка</option>`]
      .concat((revCfg.addons||[]).map(a=>`<option value="${a.id}" ${selected===a.id?'selected':''}>${esc(a.name)} (нам ${cfPct(a.take)})</option>`)).join('');
  }
  return EXP_CATS.filter(c=>!c.auto).map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${c.name}</option>`).join('');
}
function ledgerNet(e, revCfg){
  if(e.kind!=='in') return e.amount||0;
  if(e.cat==='sub') return e.amount||0;
  const a = (revCfg.addons||[]).find(x=>x.id===e.cat);
  return (e.amount||0)*(a?a.take:1);
}

function ledgerTableHtml(entries, revCfg, opts){
  opts = opts || {};
  const showFilters = !opts.fixedDate && opts.filters!==false;
  let list = entries.slice();
  if(opts.fixedDate) list = list.filter(e=>e.d===opts.fixedDate);
  if(showFilters && _lgMonth!=='all') list = list.filter(e=>monthKeyOf(e.d)===_lgMonth);
  if(showFilters && _lgKindFilter!=='all') list = list.filter(e=>e.kind===_lgKindFilter);
  list.sort((a,b)=>b.d.localeCompare(a.d) || String(b.id).localeCompare(String(a.id)));
  const totalRows = list.length;
  const pageSize = opts.limit || (showFilters ? _lgShow : list.length);
  const hiddenRows = Math.max(0, list.length - pageSize);
  list = list.slice(0, pageSize);

  const totIn  = list.filter(e=>e.kind==='in').reduce((s,e)=>s+(e.amount||0),0);
  const totInNet = list.filter(e=>e.kind==='in').reduce((s,e)=>s+ledgerNet(e, revCfg),0);
  const totFin = list.filter(e=>e.kind==='fin').reduce((s,e)=>s+(e.amount||0),0);
  const totOut = list.filter(e=>e.kind==='out').reduce((s,e)=>s+(e.amount||0),0);

  const months = Array.from(new Set(entries.map(e=>monthKeyOf(e.d)))).sort().reverse();
  const filtersHtml = showFilters ? `
    <div class="exp-toolbar">
      <div class="exp-filters">
        <select id="lgMonthFilter" class="v-input">
          <option value="all" ${_lgMonth==='all'?'selected':''}>Все месяцы</option>
          ${months.map(m=>`<option value="${m}" ${_lgMonth===m?'selected':''}>${monthKeyLabel(m)}</option>`).join('')}
        </select>
        <select id="lgKindFilter" class="v-input">
          <option value="all" ${_lgKindFilter==='all'?'selected':''}>Доходы и расходы</option>
          <option value="in" ${_lgKindFilter==='in'?'selected':''}>Только доходы</option>
          <option value="out" ${_lgKindFilter==='out'?'selected':''}>Только расходы</option>
          <option value="fin" ${_lgKindFilter==='fin'?'selected':''}>Инвестиции и займы</option>
        </select>
      </div>
      <span class="exp-count">${totalRows} ${totalRows===1?'запись':(totalRows<5?'записи':'записей')}</span>
    </div>` : '';

  const rows = list.map(e=>`
    <tr data-id="${e.id}" class="lg-row lg-${e.kind}">
      <td class="lg-date">${opts.fixedDate ? '' : `<input type="date" class="v-input lg-f" data-lg-field="d" data-id="${e.id}" value="${e.d}">`}</td>
      <td><span class="kind-pill ${e.kind}">${e.kind==='in'?'доход':(e.kind==='fin'?'инвестиции':'расход')}</span></td>
      <td><select class="v-input lg-f" data-lg-field="cat" data-id="${e.id}">${ledgerStatOptions(e.kind, revCfg, e.cat)}</select></td>
      <td><input type="text" class="v-input lg-f lg-note" data-lg-field="note" data-id="${e.id}" value="${esc(e.note||'')}" placeholder="—"></td>
      <td class="num">${e.kind!=='out' ? `<input type="text" class="v-input money-fmt-input lg-f lg-amount" data-lg-field="amount" data-id="${e.id}" value="${fmtThousands(e.amount)}">` : ''}</td>
      <td class="num">${e.kind==='out' ? `<input type="text" class="v-input money-fmt-input lg-f lg-amount" data-lg-field="amount" data-id="${e.id}" value="${fmtThousands(e.amount)}">` : ''}</td>
      <td><button class="btn ghost sm-del" data-del-lg="${e.id}" title="Удалить">✕</button></td>
    </tr>`).join('');

  const defaultKind = opts.defaultKind || 'out';
  const addForm = opts.showAdd===false ? '' : `
    <div class="lg-add">
      <div class="field-row">
        ${opts.fixedDate ? `<input type="hidden" id="lgDate" value="${opts.fixedDate}">` : `<div class="field" style="flex:0 0 150px;"><label>Дата</label><input type="date" id="lgDate" value="${opts.defaultDate || new Date().toISOString().slice(0,10)}"></div>`}
        <div class="field" style="flex:0 0 130px;"><label>Тип</label>

        <tbody>${rows || `<tr><td colspan="7" class="empty-note">${opts.fixedDate ? 'За этот день платежей не записано.' : 'Пока пусто — добавьте первую запись.'}</td></tr>`}</tbody>
        ${list.length ? `<tfoot><tr class="total-row">
          <td colspan="4">Итого${opts.fixedDate?' за день':''}${totIn!==totInNet?` <span class="soft">· наша доля доходов ${money(totInNet)}</span>`:''}${totFin?` <span class="soft">· из них инвестиции и займы ${money(totFin)}</span>`:''}</td>
          <td class="num pos">${money(totIn+totFin)}</td>
          <td class="num neg">${money(totOut)}</td>
          <td></td>
        </tr></tfoot>` : ''}
      </table>
      ${hiddenRows>0 && !opts.limit ? `<div class="lg-more"><button class="btn ghost" id="lgMoreBtn">Показать ещё ${Math.min(hiddenRows, 200)} из ${hiddenRows} более ранних</button></div>` : ''}

function wireLedger(rerender, revCfg){
  document.querySelectorAll('.money-fmt-input').forEach(wireThousandsInput);
  const mf = document.getElementById('lgMonthFilter');
  if(mf) mf.onchange = ()=>{ _lgMonth = mf.value; rerender(); };
  const kf = document.getElementById('lgKindFilter');
  if(kf) kf.onchange = ()=>{ _lgKindFilter = kf.value; rerender(); };
  const more = document.getElementById('lgMoreBtn');
  if(more) more.onclick = ()=>{ _lgShow += 200; rerender(); };

  const kindSel = document.getElementById('lgKind');
  const catSel  = document.getElementById('lgCat');
  if(kindSel && catSel){
    kindSel.onchange = ()=>{ catSel.innerHTML = ledgerStatOptions(kindSel.value, revCfg); };
  }
  const addBtn = document.getElementById('lgAddBtn');
  if(addBtn) addBtn.onclick = async ()=>{
    const amount = parseThousands(document.getElementById('lgAmount').value);
    const d = document.getElementById('lgDate').value;
    if(!amount){ document.getElementById('lgAmount').focus(); return; }
    if(!d){ const de = document.getElementById('lgDate'); if(de) de.focus(); return; }
    const list = await getLedger();
    list.push({id:uid(), d, kind:kindSel.value, cat:catSel.value, amount, note:document.getElementById('lgNote').value.trim()});
    saveLedger(list);
    rerender();
  };
  document.querySelectorAll('[data-lg-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const list = await getLedger(); const e = list.find(x=>x.id===inp.dataset.id); if(!e) return;
      const f = inp.dataset.lgField;
      if(f==='amount') e.amount = parseThousands(inp.value);
      else e[f] = inp.value;
      if(f==='d' && !e.d) return;
      saveLedger(list); rerender();
    });
  });
  document.querySelectorAll('[data-del-lg]').forEach(b=>{
    b.onclick = async ()=>{
      const list = (await getLedger()).filter(x=>x.id!==b.dataset.delLg);
      saveLedger(list); rerender();
    };
  });
}

let _repView = 'day';

async function renderReports(){
  killAllCharts();
  const days = await getDaily();
  if(!_repDate || !days.some(d=>d.d===_repDate)) _repDate = days.length ? days[days.length-1].d : new Date().toISOString().slice(0,10);
  app.innerHTML = `
    <h1 class="page-title">Отчёты</h1>
    <p class="page-sub">Что происходит по факту: показатели по дням и все движения денег. Из дней собираются недели и месяцы, из них — фактический P&amp;L.</p>
    <div class="toggle-row" id="repTabs">
      <button data-v="day"     class="${_repView==='day'?'active':''}">День</button>
      <button data-v="week"    class="${_repView==='week'?'active':''}">Недели</button>
      <button data-v="month"   class="${_repView==='month'?'active':''}">Месяцы и план/факт</button>
      <button data-v="ledger"  class="${_repView==='ledger'?'active':''}">Платежи</button>
      <button data-v="journal" class="${_repView==='journal'?'active':''}">Все дни</button>

  `;
  document.querySelectorAll('#repTabs button').forEach(b=>{

      _repView = b.dataset.v;

async function renderRepBody(body){
  if(!body) return;
  const map = {day:renderRepDay, week:renderRepWeek, month:renderRepMonth, ledger:renderRepLedger, journal:renderRepJournal};
  await (map[_repView]||renderRepDay)(body);
}

function readDailyForm(){
  const rec = {d: document.getElementById('dfDate').value};
  document.querySelectorAll('.df-in').forEach(el=>{ rec[el.dataset.df] = Math.max(0, parseFloat(el.value)||0); });
  const n = document.getElementById('dfNote'); if(n && n.value.trim()) rec.note = n.value.trim();
  return rec;
}
function wireDailyForm(rerender, revCfg, opts){
  opts = opts || {};
  const dateEl = document.getElementById('dfDate');
  if(dateEl) dateEl.addEventListener('change', (e)=>{
    if(!e.target.value) return;
    /* на вкладке дня смена даты открывает этот день; в форме добавления — просто меняет дату записи */
    if(opts.navigateOnDate){ _repDate = e.target.value; rerender(); }
    else {
      const lbl = document.querySelector('.day-weekday');
      if(lbl) lbl.textContent = weekdayShort(e.target.value)+', '+ruDateFull(e.target.value);
      const lg = document.getElementById('lgDate'); if(lg) lg.value = e.target.value;
    }
  });
  const saveBtn = document.getElementById('saveDayBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const rec = readDailyForm();
    if(!rec.d){ dateEl.focus(); return; }
    const list = (await getDailyMetrics()).filter(x=>x.d!==rec.d);
    list.push(rec); saveDaily(list); _repDate = rec.d; rerender();

  if(delBtn) delBtn.onclick = async ()=>{
    const list = (await getDailyMetrics()).filter(x=>x.d!==_repDate);
    saveDaily(list); rerender();
  };
  wireLedger(rerender, revCfg);
}

async function renderRepDay(body){
  const days = await getDays();
  const ledger = await getLedger();
  const revCfg = await getRevenueCfg();
  const cfg = await buildFinCfg({economy:_economyMode});
  const model = computeFinModel(cfg);
  const rec = days.find(d=>d.d===_repDate) || emptyDay(_repDate);

  const idx = days.findIndex(d=>d.d===_repDate);
  const last7  = idx>=0 ? days.slice(Math.max(0, idx-6), idx+1) : [];
  const prev7  = idx>=7 ? days.slice(Math.max(0, idx-13), idx-6) : [];
  const dayAgg = rollupDays([rec], revCfg);
  const w      = rollupDays(last7, revCfg);
  const wPrev  = rollupDays(prev7, revCfg);
  const activeNow = activeAt(days, _repDate);

  const mKey = monthKeyOf(_repDate);
  const mDays = days.filter(d=>monthKeyOf(d.d)===mKey && d.d<=_repDate);
  const mAgg  = rollupDays(mDays, revCfg);
  const mFact = mDays.length ? factMonth(mKey, mDays, {
    items:(await getExpenses()).items, hires: cfg.hires, tax: cfg.tax, revCfg, allDays: days.filter(d=>d.d<=_repDate),
  }) : null;
  const [my, mm] = mKey.split('-').map(Number);
  const modelMonth = my*12+(mm-1)-FIN_BASE_ABS+1;
  const dim = daysInMonth(my, mm-1);
  const elapsed = parseInt(_repDate.slice(8,10));
  const planMonthRevenue = model.revenue[modelMonth]||0;
  const planMonthCash    = model.cashIn[modelMonth]||0;
  const planToDate = planMonthRevenue*elapsed/dim;
  const factRevenueMTD = mFact ? mFact.revenue : 0;
  const pace = planToDate ? factRevenueMTD/planToDate : null;
  const planNewMonth = model.newPaying[modelMonth]||0;
  const pacePaying = planNewMonth ? mAgg.newPay/(planNewMonth*elapsed/dim) : null;

  const delta = (a,b)=> b ? (a-b)/b : null;
  const dBadge = (d)=> d===null||!isFinite(d) ? '' : `<span class="trend-badge ${d>=0?'trend-up':'trend-down'}">${d>=0?'↑':'↓'} ${Math.abs(d*100).toFixed(0)}%</span>`;

  const streams = revCfg.addons.map(a=>({a, gmv:(rec.gmv||{})[a.id]||0}));

  body.innerHTML = `
    ${demoNoticeHtml(days)}

    <section class="block" style="margin-top:0;">
      <div class="day-head">
        <div>
          <h2>${ruDateFull(_repDate)}</h2>
          <p class="block-sub">${weekdayShort(_repDate)} · ${finMonthLabel(modelMonth)} — ${elapsed}-й день из ${dim}</p>
        </div>
        <div class="day-nav">
          <button class="btn ghost" data-day-step="-1">← предыдущий</button>
          <button class="btn ghost" data-day-step="1">следующий →</button>
        </div>
      </div>
      <div class="stat-strip">
        <div class="stat-box"><div class="sv">${money(dayAgg.revenue)}</div><div class="sl">поступлений за день</div></div>
        <div class="stat-box"><div class="sv">${num(dayAgg.newPay)}</div><div class="sl">новых платящих</div></div>
        <div class="stat-box"><div class="sv">${num(dayAgg.reg)}</div><div class="sl">регистраций</div></div>
        <div class="stat-box ${dayAgg.churn?'neg':''}"><div class="sv">${num(dayAgg.churn)}</div><div class="sl">отписалось</div></div>
        <div class="stat-box"><div class="sv">${num(activeNow)}</div><div class="sl">платящих всего</div></div>
        <div class="stat-box ${dayAgg.spendTotal?'neg':''}"><div class="sv">${money(dayAgg.spendTotal)}</div><div class="sl">платежей за день</div></div>
      </div>
    </section>

    <section class="block">
      <h2>Неделя и месяц</h2>
      <p class="block-sub">Последние 7 дней против предыдущих семи, и месяц нарастающим итогом против плана модели, разложенного по дням. Темп считается по выручке начислением — так же, как её видит P&amp;L.</p>
      <div class="grid-2">
        <div class="card">
          <p class="k-label">7 дней по ${ruDate(_repDate)}</p>
          <div class="kv-list">
            <div class="kv-row"><span>Поступления</span><span class="kv-v">${money(w.revenue)} ${dBadge(delta(w.revenue, wPrev.revenue))}</span></div>
            <div class="kv-row"><span>Новых платящих</span><span class="kv-v">${num(w.newPay)} ${dBadge(delta(w.newPay, wPrev.newPay))}</span></div>
            <div class="kv-row"><span>Регистраций</span><span class="kv-v">${num(w.reg)} ${dBadge(delta(w.reg, wPrev.reg))}</span></div>
            <div class="kv-row"><span>Конверсия регистрация → оплата</span><span class="kv-v">${cfPct(w.crRegPay)}</span></div>
            <div class="kv-row"><span>Стоимость привлечения, CAC</span><span class="kv-v">${w.cac?money(w.cac):'—'}</span></div>
            <div class="kv-row"><span>Отписалось</span><span class="kv-v">${num(w.churn)}</span></div>
          </div>
        </div>
        <div class="card">
          <p class="k-label">${monthKeyLabel(mKey)} нарастающим итогом</p>
          <div class="pace-block ${pace===null?'':(pace>=1?'good':(pace>=0.8?'neutral':'warn'))}">
            <span class="pace-value">${pace===null?'—':(pace*100).toFixed(0)+'%'}</span>
            <span class="pace-label">темп к плану месяца по выручке</span>
          </div>
          <div class="kv-list">
            <div class="kv-row"><span>Выручка начислением</span><span class="kv-v">${money(factRevenueMTD)}</span></div>
            <div class="kv-row"><span>План к этому дню</span><span class="kv-v">${money(planToDate)}</span></div>
            <div class="kv-row"><span>План на весь месяц</span><span class="kv-v">${money(planMonthRevenue)}</span></div>
            <div class="kv-row"><span>Поступило деньгами</span><span class="kv-v">${money(mAgg.revenue)} <span class="soft">из плана ${money(planMonthCash)}</span></span></div>
            <div class="kv-row"><span>Новых платящих</span><span class="kv-v">${num(mAgg.newPay)} из ${num(planNewMonth)} по плану ${pacePaying!==null?`<span class="soft">(темп ${(pacePaying*100).toFixed(0)}%)</span>`:''}</span></div>
            <div class="kv-row"><span>Разовых платежей</span><span class="kv-v">${money(mAgg.spendTotal)}</span></div>
            <div class="kv-row"><span>Контента снято</span><span class="kv-v">${num(mAgg.content)} шт.</span></div>
          </div>
          <p class="note-sm">Деньги и выручка расходятся на годовых подписках: годовая приносит все ${money(revCfg.priceAnnual)} сразу, а в выручку месяца попадает только ${money(revCfg.priceAnnual/12)}. Разница — аванс, который отработается за год.</p>
        </div>
      </div>
    </section>

    <section class="block">
      <h2>Поступления дня по потокам</h2>
      <div class="card table-card">
        <table class="calc-table">
          <thead><tr><th>Поток</th><th>Оборот</th><th>Take rate</th><th>Наша выручка</th></tr></thead>
          <tbody>
            <tr><td>Подписка</td><td class="num">${money(dayAgg.revSub)}</td><td class="num">100%</td><td class="num hl">${money(dayAgg.revSub)}</td></tr>
            ${streams.map(s=>`<tr><td>${esc(s.a.name)}</td><td class="num">${money(s.gmv)}</td><td class="num">${cfPct(s.a.take)}</td><td class="num hl">${money(s.gmv*s.a.take)}</td></tr>`).join('')}
            <tr class="total-row"><td>Итого</td><td class="num">${money(dayAgg.revSub+dayAgg.gmvTotal)}</td><td></td><td class="num">${money(dayAgg.revenue)}</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="block">
      <h2>Динамика последних 60 дней</h2>
      <p class="block-sub">Выручка по дням со сглаживанием по неделе — дневные всплески не должны сбивать с толку, важна линия тренда.</p>
      <div class="chart-card"><div class="chart-holder" style="height:300px;"><canvas id="dayChart"></canvas></div></div>
    </section>

    <section class="block">
      <h2>Внести день</h2>
      <p class="block-sub">Показатели дня — штуками, деньги — отдельными строками в журнале ниже. Так цифры складываются в недели, месяцы и P&amp;L без ручной сверки.</p>
      ${dailyFormHtml(rec, revCfg, ledger, {})}
    </section>
  `;

  document.querySelectorAll('[data-day-step]').forEach(b=>{
    b.onclick = ()=>{
      const step = parseInt(b.dataset.dayStep);
      const d = new Date(_repDate+'T00:00:00'); d.setDate(d.getDate()+step);
      _repDate = d.toISOString().slice(0,10);
      renderReports();
    };
  });
  wireDemoNotice();
  wireDailyForm(()=>renderReports(), revCfg, {navigateOnDate:true});

  killChart('day');
  const cv = document.getElementById('dayChart');
  if(cv){
    const window60 = days.slice(Math.max(0, idx-59), idx+1);
    const rev = window60.map(r=>rollupDays([r], revCfg).revenue);
    const ma = rev.map((_,i)=>{
      const s = rev.slice(Math.max(0,i-6), i+1);
      return s.reduce((a,b)=>a+b,0)/s.length;
    });
    const act = activeSeries(days).filter(x=>window60.some(r=>r.d===x.d)).map(x=>x.active);
    _finCharts.day = new Chart(cv, {
      type:'bar',
      data:{labels:window60.map(r=>ruDate(r.d)), datasets:[
        {type:'bar', label:'Поступления за день', data:rev, backgroundColor:'#E0D9C4', yAxisID:'money', borderWidth:0},
        {type:'line', label:'Среднее за 7 дней', data:ma, borderColor:SERIES.revenue, yAxisID:'money', tension:0.3, pointRadius:0, borderWidth:2.5},
        {type:'line', label:'Активные платящие', data:act, borderColor:SERIES.users, yAxisID:'count', tension:0.3, pointRadius:0, borderWidth:1.5, borderDash:[3,3]},

async function renderRepWeek(body){
  const days = await getDaily();
  const revCfg = await getRevenueCfg();
  const groups = groupDaysBy(days, isoWeekKey);
  const keys = Array.from(groups.keys()).sort();
  const rows = keys.map(k=>{
    const g = groups.get(k);
    const a = rollupDays(g, revCfg);
    const endActive = activeAt(days, g[g.length-1].d);
    return {k, a, endActive, from:g[0].d, to:g[g.length-1].d, days:g.length};
  });
  const prevMap = {};
  rows.forEach((r,i)=>{ prevMap[r.k] = i>0 ? rows[i-1] : null; });

  body.innerHTML = `
    ${demoNoticeHtml(days)}
    <section class="block" style="margin-top:0;">
      <h2>Недели</h2>
      <p class="block-sub">Неделя — рабочий горизонт: достаточно длинная, чтобы сгладить выходные, и достаточно короткая, чтобы успеть среагировать. Поступления — это деньги на счёт; признанная выручка считается по месяцам, она на соседней вкладке. Стрелка — к предыдущей неделе.</p>

async function renderRepMonth(body){
  const days = await getDaily();
  const facts = await buildFactMonths();
  const cfg = await buildFinCfg({economy:_economyMode});
  const model = computeFinModel(cfg);

  const rows = facts.map(f=>{
    const m = f.m;
    return {f, m,
      planRevenue: model.revenue[m]||0,
      planNew: model.newPaying[m]||0,
      planActive: model.active[m]||0,
      planExpense: (model.cogs[m]||0)+(model.opex[m]||0)+(model.taxTotal[m]||0),
      planEbitda: model.ebitda[m]||0,
    };
  });
  const tot = rows.reduce((a,r)=>({
    revenue:a.revenue+r.f.revenue, planRevenue:a.planRevenue+r.planRevenue,
    expense:a.expense+r.f.totalExpense, planExpense:a.planExpense+r.planExpense,
    ebitda:a.ebitda+r.f.ebitda, planEbitda:a.planEbitda+r.planEbitda,
    newPay:a.newPay+r.f.agg.newPay, planNew:a.planNew+r.planNew,
  }), {revenue:0, planRevenue:0, expense:0, planExpense:0, ebitda:0, planEbitda:0, newPay:0, planNew:0});

  const varCell = (fact, plan, invert)=>{
    const d = fact-plan;
    const good = invert ? d<=0 : d>=0;
    return `<td class="num ${good?'pos':'neg'}">${d>=0?'+':'−'}${money(Math.abs(d))}<span class="delta">${plan?((d/Math.abs(plan))*100).toFixed(0)+'%':''}</span></td>`;
  };

  body.innerHTML = `
    ${demoNoticeHtml(days)}
    <section class="block" style="margin-top:0;">
      <h2>Месяцы: факт против плана</h2>
      <p class="block-sub">Факт собран из ежедневных отчётов и реестра расходов. План — та же финмодель, что на вкладке «Финмодель», за те же месяцы.</p>
      ${metricCards([
        {l:'Выручка за период', v:money(tot.revenue), sub:`план ${money(tot.planRevenue)} ${planFactBadge(tot.revenue, tot.planRevenue)}`},
        {l:'Расходы за период', v:money(tot.expense), sub:`план ${money(tot.planExpense)} ${planFactBadge(tot.expense, tot.planExpense, true)}`},
        {l:'EBITDA за период', v:signedMoney(tot.ebitda), cls: tot.ebitda<0?'neg':'pos', sub:`план ${signedMoney(tot.planEbitda)}`},
        {l:'Новых платящих', v:num(tot.newPay), sub:`план ${num(tot.planNew)} ${planFactBadge(tot.newPay, tot.planNew)}`},
      ])}
      <div class="card table-card">
        <table class="calc-table">
          <thead><tr>
            <th>Месяц</th><th>Выручка, факт</th><th>Выручка, план</th><th>Отклонение</th>
            <th>Расходы, факт</th><th>EBITDA, факт</th><th>Платящих на конец</th><th>план</th>
          </tr></thead>
          <tbody>
            ${rows.map(r=>`<tr>
              <td><strong>${r.f.label}</strong></td>
              <td class="num hl">${money(r.f.revenue)}</td>
              <td class="num">${money(r.planRevenue)}</td>
              ${varCell(r.f.revenue, r.planRevenue)}
              <td class="num">${money(r.f.totalExpense)}</td>
              <td class="num ${r.f.ebitda<0?'neg':'pos'}">${signedMoney(r.f.ebitda)}</td>
              <td class="num">${num(r.f.active)}</td>
              <td class="num soft">${num(r.planActive)}</td>
            </tr>`).join('')}
            <tr class="total-row">
              <td>Итого</td><td class="num">${money(tot.revenue)}</td><td class="num">${money(tot.planRevenue)}</td>
              ${varCell(tot.revenue, tot.planRevenue)}
              <td class="num">${money(tot.expense)}</td>
              <td class="num ${tot.ebitda<0?'neg':'pos'}">${signedMoney(tot.ebitda)}</td><td></td><td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="block">
      <h2>Как складывались расходы месяцев</h2>
      <p class="block-sub">Дневные платежи из отчётов плюс ФОТ и регулярные позиции реестра. Одна и та же категория считается один раз.</p>
      <div class="card table-card">
        <table class="calc-table">
          <thead><tr><th>Категория</th>${rows.map(r=>`<th>${r.f.label}</th>`).join('')}<th>Всего</th></tr></thead>
          <tbody>
            ${EXP_CATS.filter(c=>rows.some(r=>r.f.byCat[c.id])).map(c=>`
              <tr><td>${c.name}</td>
                ${rows.map(r=>`<td class="num">${r.f.byCat[c.id]?money(r.f.byCat[c.id]):'—'}</td>`).join('')}
                <td class="num hl">${money(rows.reduce((s,r)=>s+(r.f.byCat[c.id]||0),0))}</td></tr>`).join('')}
            <tr><td>Налоги</td>${rows.map(r=>`<td class="num">${money(r.f.taxProfit)}</td>`).join('')}<td class="num hl">${money(rows.reduce((s,r)=>s+r.f.taxProfit,0))}</td></tr>
            <tr class="total-row"><td>Итого расходов</td>${rows.map(r=>`<td class="num">${money(r.f.totalExpense)}</td>`).join('')}<td class="num">${money(tot.expense)}</td></tr>

      <h2>Факт и план на графике</h2>

  if(cv){
    const horizon = Math.max(12, facts.length+2);
    const labels = Array.from({length:horizon},(_,i)=>finMonthLabel(i+1));
    const factRev = labels.map((_,i)=>{ const r = rows.find(x=>x.m===i+1); return r?r.f.revenue:null; });
    const factExp = labels.map((_,i)=>{ const r = rows.find(x=>x.m===i+1); return r?r.f.totalExpense:null; });
    _finCharts.month = new Chart(cv, {
      type:'line',
      data:{labels, datasets:[
        {label:'Выручка — факт', data:factRev, borderColor:SERIES.revenue, backgroundColor:'rgba(63,107,74,0.12)', fill:true, tension:0.25, borderWidth:2.5, pointRadius:3, spanGaps:false},
        {label:'Выручка — план', data:model.revenue.slice(1,horizon+1), borderColor:SERIES.revenue, tension:0.25, borderWidth:1.5, borderDash:[5,3], pointRadius:0},
        {label:'Расходы — факт', data:factExp, borderColor:SERIES.expense, tension:0.25, borderWidth:2.5, pointRadius:3, spanGaps:false},
        {label:'Расходы — план', data:model.totalExpense.slice(1,horizon+1), borderColor:SERIES.expense, tension:0.25, borderWidth:1.5, borderDash:[5,3], pointRadius:0},
      ]},
      options: chartBase({scales:{x:{grid:{display:false}, ticks:{color:CHART_SOFT, font:{size:10}}}, y:moneyAxis('left')}}),
    });
  }
}

async function renderRepLedger(body){
  const ledger = await getLedger();
  const revCfg = await getRevenueCfg();
  const days = await getDays();
  const thisMonth = ledger.length ? monthKeyOf(ledger[ledger.length-1].d) : null;
  const mEntries = thisMonth ? ledger.filter(e=>monthKeyOf(e.d)===thisMonth) : [];
  const mIn  = mEntries.filter(e=>e.kind==='in').reduce((s2,e)=>s2+e.amount,0);

  body.innerHTML = `
    ${demoNoticeHtml(days)}
    <section class="block" style="margin-top:0;">
      <h2>Доходы и расходы</h2>
      <p class="block-sub">Каждое движение денег — одной строкой. Регулярные расходы и ФОТ сюда не вносятся: они подставляются из реестра сами. Всё, что записано здесь, сразу видно в отчёте за день, в месяцах и в P&amp;L.</p>
      ${thisMonth ? metricCards([
        {l:`Поступило за ${monthKeyLabel(thisMonth)}`, v:money(mIn), cls:'pos'},
        {l:`Заплатили разово за ${monthKeyLabel(thisMonth)}`, v:money(mOut), cls:'neg'},
        {l:'Сальдо по журналу', v:signedMoney(mIn-mOut), cls: mIn-mOut>=0?'pos':'neg', sub:'без ФОТ и регулярных расходов из реестра'},
        {l:'Записей всего', v:num(ledger.length)},
      ]) : ''}
      ${ledgerTableHtml(ledger, revCfg, {defaultKind:'out', defaultDate: ledger.length ? ledger[ledger.length-1].d : undefined})}

  wireDemoNotice();
  wireLedger(()=>renderReports(), revCfg);
}

async function renderDiscussions(){

    </div>
    <div>${list}</div>
  `;
  document.getElementById('postThreadBtn').onclick = async ()=>{
    const author = document.getElementById('newAuthor').value.trim() || 'Аноним';
    const title = document.getElementById('newTitle').value.trim();
    const body = document.getElementById('newBody').value.trim();
    if(!title || !body) return;
    const btn = document.getElementById('postThreadBtn');
    btn.textContent = 'Публикация…'; btn.disabled = true;
    const list2 = await loadShared('eva-club-discussions', []);

    };
  };
  document.getElementById('qamAddBtn').onclick = async ()=>{
    const task = buildTask();
    if(!task) return;
    const btn = document.getElementById('qamAddBtn');
    btn.textContent = 'Добавление…'; btn.disabled = true;
    const list = await getTasks();
    list.push(task);
    saveTasks(list);
    overlay.remove();
    if(onDone) onDone();
  };
  document.getElementById('qamDetailBtn').onclick = async ()=>{
    const task = buildTask();
    if(!task) return;
    const btn = document.getElementById('qamDetailBtn');
    btn.textContent = 'Открываю…'; btn.disabled = true;
    const list = await getTasks();
    list.push(task);
    saveTasks(list);
    overlay.remove();
    openTaskModal(task.id, onDone);
  };
}

function openVoteLevelPrompt(task, onDone){
  const oldVlp = document.getElementById('voteLevelOverlay');
  if(oldVlp) oldVlp.remove();
  const overlay = document.createElement('div');
  overlay.className = 'tm-overlay';
  overlay.id = 'voteLevelOverlay';
  overlay.style.zIndex = 300;
  overlay.innerHTML = `
    <div class="tm-modal" style="max-width:420px;">
      <div class="tm-header"><span class="tm-header-label">Вынести на голосование</span><button class="tm-close" id="vlpClose">✕</button></div>
      <div class="tm-body">
        <p style="font-size:13px; color:var(--ink-soft); margin-bottom:14px;">«${esc(task.title)}»</p>
        <div class="tm-field"><label>Уровень голосования</label>
          <select id="vlpLevel">
            <option value="team">Команда</option>
            <option value="shareholders">Акционеры</option>
          </select>
        </div>
        <button class="btn" id="vlpConfirm" style="margin-top:14px;">Создать голосование</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('vlpClose').onclick = ()=>overlay.remove();
  document.getElementById('vlpConfirm').onclick = async ()=>{
    const level = document.getElementById('vlpLevel').value;
    const btn = document.getElementById('vlpConfirm');
    btn.textContent = 'Создание…'; btn.disabled = true;
    const polls = await getCache('eva-club-polls', []);
    polls.push({
      id:uid(), question:task.title, level, taskId:task.id,
      options:[{text:'✓ Одобрить / запустить',votes:0},{text:'↩ Вернуть на доработку',votes:0},{text:'💬 Нужно обсудить',votes:0}],
      ts:Date.now()
    });
    setCacheLocal('eva-club-polls', polls); persistCache('eva-club-polls');
    document.querySelector('#vlpConfirm').parentElement.innerHTML = `<p style="color:var(--green); font-weight:500; font-size:13.5px;">✓ Голосование создано — переходим на страницу «Голосования»…</p>`;
    setTimeout(()=>{
      overlay.remove();
      if(onDone) onDone();
      location.hash = 'voting';
    }, 700);
  };
}

async function renderVoting(){
  const polls = await getCache('eva-club-polls', []);
  polls.sort((a,b)=>b.ts-a.ts);
  const allTasks = await getTasks();
  const people = await getPeople();

  const reviewTasks = allTasks.filter(t=>t.status==='review');
  const blockedTasks = allTasks.filter(t=>isBlocked(t, allTasks));
  const decisionRow = (t, reason)=>{
    const a = people.find(p=>p.id===t.assignee);
    return `<div class="decision-row" data-task="${t.id}">
      <span class="dept-badge dept-${t.dept||'none'}">${t.dept?DEPT_CODE[t.dept]:'—'}</span>
      <span class="decision-title">${esc(t.title)}</span>
      <span class="decision-reason">${reason}</span>
      ${a ? personAvatarHtml(a,false).replace('p-avatar-img','p-avatar-img tc-avatar').replace('p-avatar-fallback','p-avatar-fallback tc-avatar') : ''}
    </div>`;
  };
  const decisionsHtml = (reviewTasks.length || blockedTasks.length) ? `
    <section class="block">
      <h2>Требует решения сейчас</h2>
      <p class="section-sub">Собрано автоматически из задач: на согласовании у постановщика или заблокировано зависимостью.</p>
      <div class="card">
        ${reviewTasks.map(t=>decisionRow(t, '◈ Ждёт согласования')).join('')}
        ${blockedTasks.map(t=>decisionRow(t, '🔒 Заблокировано')).join('')}
      </div>
    </section>` : '';

  const LEVEL_LABEL = {team:'Команда', shareholders:'Акционеры'};
  const list = polls.length ? polls.map(p=>{
    const total = p.options.reduce((a,o)=>a+o.votes,0);
    let leadIdx = -1;
    if(total>0){ leadIdx = p.options.reduce((best,o,i,arr)=>o.votes>arr[best].votes?i:best, 0); }
    const opts = p.options.map((o,i)=>{
      const pct = total ? Math.round(o.votes/total*100) : 0;
      return `<div class="poll-opt"><button data-poll="${p.id}" data-opt="${i}">
        <span class="barfill" style="width:${pct}%"></span>
        <span class="label"><span>${esc(o.text)}${i===leadIdx?' 👑':''}</span><span>${pct}% (${o.votes})</span></span>
      </button></div>`;
    }).join('');
    const levelBadge = p.level ? `<span class="badge ${p.level==='shareholders'?'review':'current'}" style="margin-left:8px;"><span class="dot"></span>${LEVEL_LABEL[p.level]}</span>` : '';
    const applyBtn = (p.taskId && total>0) ? `<button class="btn ghost" data-apply-decision="${p.id}" style="margin-top:10px;">Применить решение к задаче</button>` : '';
    const openTaskLink = p.taskId ? `<button class="btn ghost" data-open-task="${p.taskId}" style="margin-top:10px;">→ Открыть задачу</button>` : '';
    return `<div class="poll-card"><h3>${esc(p.question)}${levelBadge}</h3>${opts}<div class="poll-meta">${total} голос(ов) · ${fmtDate(p.ts)}</div><div style="display:flex; gap:8px; flex-wrap:wrap;">${applyBtn}${openTaskLink}</div></div>`;
  }).join('') : `<div class="empty-state">Пока нет голосований — создайте первое.</div>`;

  app.innerHTML = `
    <h1 class="page-title">Голосования</h1>
    <p class="page-sub">Совместные решения по проекту. Один голос за опрос с этого устройства.</p>
    ${decisionsHtml}
    <section class="block">
      <h2>Опросы</h2>
    <div class="composer">
      <h4>Новое голосование</h4>
      <div class="field-row">
        <div class="field" style="flex:2;"><label>Вопрос</label><input type="text" id="pollQuestion" placeholder="О чём голосуем?"></div>
        <div class="field"><label>Уровень</label><select id="pollLevel"><option value="team">Команда</option><option value="shareholders">Акционеры</option></select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Вариант 1</label><input type="text" class="pollOpt" placeholder="Вариант"></div>
        <div class="field"><label>Вариант 2</label><input type="text" class="pollOpt" placeholder="Вариант"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Вариант 3 (необязательно)</label><input type="text" class="pollOpt" placeholder="Вариант"></div>
        <div class="field"><label>Вариант 4 (необязательно)</label><input type="text" class="pollOpt" placeholder="Вариант"></div>
      </div>
      <button class="btn" id="createPollBtn">Создать голосование</button>
    </div>
    <div>${list}</div>
    </section>

    <section class="block">
      <h2>Как это работает</h2>
      <div class="card">
        <div class="value-item" style="border-top:none; padding-top:0;"><div class="n">01</div><div><h4>Два уровня</h4><p>«Команда» — для операционных вопросов, «Акционеры» — для стратегических решений (раунды, крупные найм-решения, целевые метрики).</p></div></div>
        <div class="value-item"><div class="n">02</div><div><h4>Требует решения — само собой</h4><p>Задачи на согласовании и заблокированные зависимостями появляются здесь автоматически — их не нужно выносить вручную.</p></div></div>
        <div class="value-item"><div class="n">03</div><div><h4>Голосование от задачи</h4><p>Кнопка «Вынести на голосование» в карточке задачи создаёт опрос с тремя исходами: одобрить и запустить, вернуть на доработку, или обсудить.</p></div></div>
        <div class="value-item"><div class="n">04</div><div><h4>Применение решения</h4><p>Когда голосов достаточно, лидирующий вариант помечается 👑. Кнопка «Применить решение к задаче» переносит исход в саму задачу — она уходит в работу, на доработку или закрывается.</p></div></div>
      </div>
    </section>
  `;
  document.querySelectorAll('.decision-row').forEach(row=>{
    row.addEventListener('click', ()=>openTaskModal(row.dataset.task, renderVoting));
  });
  document.getElementById('createPollBtn').onclick = async ()=>{
    const question = document.getElementById('pollQuestion').value.trim();
    const level = document.getElementById('pollLevel').value;
    const opts = Array.from(document.querySelectorAll('.pollOpt')).map(i=>i.value.trim()).filter(Boolean);
    if(!question || opts.length < 2) return;
    const btn = document.getElementById('createPollBtn');
    btn.textContent = 'Создание…'; btn.disabled = true;
    const list2 = await getCache('eva-club-polls', []);
    list2.push({id:uid(), question, level, options:opts.map(t=>({text:t, votes:0})), ts:Date.now()});
    setCacheLocal('eva-club-polls', list2); persistCache('eva-club-polls');
    renderVoting();
  };
  document.querySelectorAll('.poll-opt button').forEach(btn=>{
    btn.onclick = async ()=>{
      const pollId = btn.dataset.poll;
      if(votedPolls.has(pollId)) return;
      votedPolls.add(pollId);
      const list2 = await getCache('eva-club-polls', []);
      const p2 = list2.find(x=>x.id===pollId);
      if(p2){ p2.options[parseInt(btn.dataset.opt)].votes++; }
      setCacheLocal('eva-club-polls', list2); persistCache('eva-club-polls');
      renderVoting();
    };
  });
  document.querySelectorAll('[data-open-task]').forEach(btn=>{
    btn.onclick = ()=>openTaskModal(btn.dataset.openTask, renderVoting);
  });
  document.querySelectorAll('[data-apply-decision]').forEach(btn=>{
    btn.onclick = async ()=>{
      const list2 = await getCache('eva-club-polls', []);
      const p = list2.find(x=>x.id===btn.dataset.applyDecision);
      if(!p || !p.taskId) return;
      const total = p.options.reduce((a,o)=>a+o.votes,0);
      if(!total) return;
      const leadIdx = p.options.reduce((best,o,i,arr)=>o.votes>arr[best].votes?i:best, 0);
      const leadText = p.options[leadIdx].text;
      const tasks = await getTasks();
      const task = tasks.find(x=>x.id===p.taskId);
      if(task){
        if(leadText.includes('Одобрить')){ task.status='done'; task.rejected=false; }
        else if(leadText.includes('доработку')){ task.status='doing'; task.rejected=true; task.comment='Решение по голосованию: вернуть на доработку.'; }
        saveTasks(tasks);
      }
      alert('Решение применено к задаче: «'+leadText+'»');
      renderVoting();
    };
  });
}

/* ============================================================
   ATTACH HANDLERS (per-page interactive bits that need post-render wiring)
   ============================================================ */
function attachHandlers(){
  // referral calc (community page)
  const refAmount = document.getElementById('refAmount');
  const refTier = document.getElementById('refTier');
  if(refAmount && refTier){
    const upd = ()=>{ document.getElementById('refResult').textContent = money((parseFloat(refAmount.value)||0) * (parseFloat(refTier.value)/100)); };
    refAmount.oninput = upd; refTier.onchange = upd; upd();
  }
  const refAmount2 = document.getElementById('refAmount2');
  const refTier2 = document.getElementById('refTier2');
  if(refAmount2 && refTier2){
    const upd = ()=>{ document.getElementById('refResult2').textContent = money((parseFloat(refAmount2.value)||0) * (parseFloat(refTier2.value)/100)); };
    refAmount2.oninput = upd; refTier2.onchange = upd; upd();
  }
  // growth toggle
  const growthToggle = document.getElementById('growthToggle');
  if(growthToggle){
    growthToggle.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ growthToggle.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderGrowthTable(b.dataset.k); };
    });
    renderGrowthTable('average');
  }
  // launch toggle
  const launchToggle = document.getElementById('launchToggle');
  if(launchToggle){
    launchToggle.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ launchToggle.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderLaunchTable(b.dataset.k); };
    });
    renderLaunchTable('desired');
  }
  // equity exit calc
  const exitVal = document.getElementById('exitVal');
  if(exitVal){ exitVal.oninput = renderExitTable; renderExitTable(); }
  // bonus calc
  const bonusBtnFields = document.getElementById('bonusSalary');
  if(bonusBtnFields){
    document.querySelectorAll('#bonusSalary, #bonusPct, .bonusGrade, #bonusProfit').forEach(el=>{
      el.addEventListener('input', renderBonus); el.addEventListener('change', renderBonus);
    });
    renderBonus();
  }
}
</script>
