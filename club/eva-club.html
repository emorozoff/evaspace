    position:fixed; z-index:90; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 12px 32px rgba(28,27,24,0.16); padding:14px 16px;
  }
  .pp-head{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px; color:var(--ink-soft);}
  .pp-head b{color:var(--ink);}
  .pp-sugg{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .pp-chip{

/* ============================================================
   STORAGE — общая база штаба.
   Порядок источников: общая база артефакта (все видят одно и то же)
   → localStorage этого браузера → значения по умолчанию из кода.
   Пишем всегда в оба места: локально мгновенно, в общую базу — фоном.
   ============================================================ */
const STORAGE_COLLECTION = 'club';
let _storageMode = 'local';
const _dbReady = (function(){
  if(typeof window === 'undefined' || !window.claude || typeof window.claude.use !== 'function'){
    return Promise.resolve(null);
  }
  const timeout = new Promise(res=>setTimeout(()=>res(null), 6000));
  return Promise.race([window.claude.use('db').catch(()=>null), timeout])
    .then(db=>{ if(db) _storageMode = 'shared'; setTimeout(_setSaveStatus, 0); return db; })
    .catch(()=>null);
})();

function _lsGet(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : undefined;
  }catch(e){ return undefined; }
}
function _lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* приватный режим или переполнение */ }
}

async function loadShared(key, fallback){
  const db = await _dbReady;
  if(db){
    try{
      const snap = await db.doc(STORAGE_COLLECTION+'/'+key).get();
      if(snap && snap.exists && snap.data && snap.data.v !== undefined){
        _lsSet(key, snap.data.v);
        return snap.data.v;
      }
    }catch(e){ /* падаем на локальную копию */ }
  }
  const local = _lsGet(key);
  return local === undefined ? fallback : local;
}

/* Записи в общую базу идут по одному ключу строго по очереди: иначе две
   быстрые правки могли бы долететь в обратном порядке, и старая
   затёрла бы новую. Значение прогоняется через JSON — так в базу не
   попадают undefined и функции. */
const _saveQueues = {};
const _saveState = {pending:0, failed:false, lastOk:null};
function _setSaveStatus(){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  if(_saveState.failed){ el.textContent = 'не сохранилось в общую базу — данные остались в этом браузере'; el.className = 'save-status err'; return; }
  if(_saveState.pending>0){ el.textContent = 'сохраняю…'; el.className = 'save-status busy'; return; }
  if(_storageMode==='shared'){ el.textContent = _saveState.lastOk ? 'сохранено для всех' : 'общая база'; el.className = 'save-status ok'; }
  else { el.textContent = 'только этот браузер'; el.className = 'save-status local'; }
}
async function saveShared(key, value){
  const clean = JSON.parse(JSON.stringify(value === undefined ? null : value));
  _lsSet(key, clean);
  const db = await _dbReady;
  if(!db){ _setSaveStatus(); return true; }
  _saveState.pending++; _setSaveStatus();
  const prev = _saveQueues[key] || Promise.resolve();
  const run = prev.catch(()=>{}).then(async ()=>{
    try{
      await db.doc(STORAGE_COLLECTION+'/'+key).set({v:clean, updatedAt: Date.now()});
      _saveState.failed = false; _saveState.lastOk = Date.now();
      return true;
    }catch(e){
      console.error('storage error', key, e);
      _saveState.failed = true;
      return false;
    }finally{
      _saveState.pending = Math.max(0, _saveState.pending-1);
      _setSaveStatus();
    }
  });
  _saveQueues[key] = run;
  return run;
}

/* In-memory cache mirroring shared storage, so checkbox clicks and edits feel
   instant and never revert while a save is in flight or fails. Storage is

const _cache = {};
async function getCache(key, fallback){
  if(!(key in _cache)) _cache[key] = await loadShared(key, fallback);
  return _cache[key];
}
function setCacheLocal(key, value){ _cache[key] = value; }

/* ============================================================
   ФОКУС ПОСЛЕ ПЕРЕРИСОВКИ
   Страницы перерисовываются целиком после каждой правки. Без этого
   клик по соседнему полю пропадал: поле успевало получить фокус,
   а потом его заменяла свежая копия. Запоминаем, какой элемент был
   в фокусе, и после перерисовки возвращаем фокус его двойнику.
   ============================================================ */
function focusKeyOf(el){
  if(!el || el===document.body || el===document.documentElement) return null;
  const tag = el.tagName ? el.tagName.toLowerCase() : '';
  if(!['input','select','textarea','button'].includes(tag)) return null;
  if(el.id) return '#'+CSS.escape(el.id);
  const parts = [];
  for(const a of el.attributes){
    if(a.name.startsWith('data-')) parts.push(`[${a.name}="${String(a.value).replace(/"/g,'\\"')}"]`);
  }
  if(!parts.length) return null;
  return tag+parts.join('');
}
function captureFocus(){
  const el = document.activeElement;
  const key = focusKeyOf(el);
  if(!key) return null;
  let sel = null;
  try{ if(el.selectionStart!==undefined && el.selectionStart!==null) sel = el.selectionStart; }catch(e){}
  return {key, sel, scrollY: window.scrollY};
}
function restoreFocus(f){
  if(!f || !f.key) return;
  let el = null;
  try{ el = document.querySelector(f.key); }catch(e){ return; }
  if(!el) return;
  try{ el.focus({preventScroll:true}); }catch(e){ return; }
  try{ if(f.sel!==null && el.setSelectionRange && /^(text|search|url|tel|password)$/i.test(el.type||'text')) el.setSelectionRange(f.sel, f.sel); }catch(e){}
  if(typeof f.scrollY==='number') window.scrollTo(0, f.scrollY);
}
/* ------------------------------------------------------------
   Перерисовка без рывков.
   Любое действие внутри страницы — перетащили задачу, сменили
   статус, добавили платёж — не должно выглядеть как перезагрузка:
   держим прокрутку страницы, прокрутку внутренних областей
   (доска, гант, широкие таблицы) и высоту страницы, пока
   содержимое пересобирается.
   ------------------------------------------------------------ */
const SCROLL_KEEP_SEL = '.kanban-board, .gantt-scroll, .table-scroll, .table-card, .scroll-tabs, [data-keep-scroll]';
function cssPathOf(el){
  const parts = [];
  let node = el;
  while(node && node.nodeType===1 && node!==document.body && parts.length<10){
    if(node.id){ parts.unshift('#'+(window.CSS && CSS.escape ? CSS.escape(node.id) : node.id)); break; }
    const parent = node.parentElement;
    if(!parent) break;
    parts.unshift(node.tagName.toLowerCase()+':nth-child('+(Array.prototype.indexOf.call(parent.children, node)+1)+')');
    node = parent;
  }
  return parts.length ? parts.join('>') : null;
}
/* Если человек сам прокрутил страницу, пока идёт перерисовка, — не
   тянем его обратно: возвращаем положение только когда прокрутку
   сбил сам браузер. */
let _lastUserScroll = 0;
['wheel','touchmove','pointerdown'].forEach(ev=>
  document.addEventListener(ev, ()=>{ _lastUserScroll = Date.now(); }, {passive:true, capture:true}));
document.addEventListener('keydown', (e)=>{
  if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(e.key)) _lastUserScroll = Date.now();
}, true);
function captureScroll(){
  const inner = [];
  document.querySelectorAll(SCROLL_KEEP_SEL).forEach(el=>{
    if(!el.scrollLeft && !el.scrollTop) return;
    const sel = cssPathOf(el);
    if(sel) inner.push({sel, left:el.scrollLeft, top:el.scrollTop});
  });
  return {y: window.scrollY, inner, t: Date.now()};
}
function restoreScroll(s){
  if(!s) return;
  const apply = ()=>{
    if(_lastUserScroll > s.t) return;   /* человек уже прокрутил сам */
    s.inner.forEach(r=>{
      let el = null; try{ el = document.querySelector(r.sel); }catch(e){}
      if(!el) return;
      if(r.left && !el.scrollLeft) el.scrollLeft = r.left;
      if(r.top  && !el.scrollTop ) el.scrollTop  = r.top;
    });
    if(Math.abs(window.scrollY - s.y) > 1) window.scrollTo(0, s.y);
  };
  apply();
  requestAnimationFrame(apply);   /* высота могла ещё не устояться */
}
/* Переключили вкладку — строка вкладок должна остаться на виду.
   Если она ушла под шапку, аккуратно подтягиваем страницу к ней;

function keepTabsInView(row){

}

  return async function(){

       а новое ещё не получило. Один тик ожидания — и браузер успевает
       поставить курсор туда, куда кликнул пользователь; это место и
       запоминаем. */
    await new Promise(r=>setTimeout(r, 0));
    /* перерисовки вложены друг в друга (страница → вкладка → блок);
       положение запоминает и возвращает только самая внешняя, иначе
       внутренняя запомнит уже «схлопнутую» страницу */
    const outer = _renderDepth===0;
    let f = null, s = null;
    if(outer){
      f = captureFocus();
      s = captureScroll();
      const hold = app ? app.offsetHeight : 0;
      if(app && hold) app.style.minHeight = hold+'px';
    }
    _renderDepth++;
    try{
      return await fn.apply(this, arguments);
    } finally {
      _renderDepth--;
      if(outer){
        if(app) app.style.minHeight = '';
        restoreFocus(f);
        restoreScroll(s);
      }
    }
  };
}

  const financing = await getFinancing();
  const bare = computeFinModel(await buildFinCfg({noFinancing:true, cashStart:0}));

  const lastFact = facts[facts.length-1];
  const cashNow  = exp.cash + facts.reduce((a,f)=>a+f.cashFlow,0);
  const burnNow  = lastFact ? Math.max(0, lastFact.totalExpense-lastFact.revenue) : model.burn[1];
  const runway   = burnNow>0 ? cashNow/burnNow : null;
  const factRev  = facts.reduce((a,f)=>a+f.revenue,0);
  const planRev  = cfSumRange(model.revenue, 1, Math.max(1,facts.length));
  const bottom   = Math.max(1, bare.minCumOperMonth);
  const deficit  = Math.abs(Math.min(0, bare.minCumOper));
  const peakBurn = Math.max(...bare.burn.slice(1, bottom+1), 0);
  const needed   = Math.ceil((deficit + peakBurn*3)/100000)*100000;
  const roundSum = financing.reduce((a,f)=>a+f.amount,0);

/* ============================================================
   PHOTO UPLOAD — resize/crop client-side before storing as data URL
   ============================================================ */
function resizeImageFile(file, size){
  size = size || 140;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const scale = Math.max(size/img.width, size/img.height);
          const w = img.width*scale, h = img.height*scale;
          ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
          // Крупнее всего аватар показывается в 88px — 140px с запасом под retina.
          // Дожимаем качество, чтобы каждая аватарка укладывалась в разумный бюджет
          // текстового хранилища (у артефакта общий лимит 20 МБ на все данные).
          let quality = 0.70;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          const budget = 28000; // ~28 КБ как base64-текст на одну аватарку
          while(dataUrl.length > budget && quality > 0.30){
            quality -= 0.10;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(dataUrl);
        }catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getBlockers(task, allTasks){
  if(!task.blockedBy || !task.blockedBy.length) return [];
  return task.blockedBy.map(id=>allTasks.find(t=>t.id===id)).filter(Boolean);
}
function isBlocked(task, allTasks){
  return getBlockers(task, allTasks).some(b=>b.status!=='done');
}
function isBlockerFor(task, allTasks){
  if(task.status==='done') return false;
  return allTasks.some(t=>(t.blockedBy||[]).includes(task.id) && t.status!=='done');
}
function sortByOrder(tasks){
  return tasks.slice().sort((a,b)=>(a.order||0)-(b.order||0));
}
function reorderTaskRelative(allTasks, draggedTask, targetTask, insertBefore, groupBy){
  if(groupBy==='stage') draggedTask.stage = targetTask.stage;
  else if(groupBy==='month') draggedTask.month = targetTask.month;
  const groupVal = groupBy==='stage' ? targetTask.stage : targetTask.month;
  const rest = sortByOrder(allTasks.filter(t=> t.id!==draggedTask.id && (groupBy==='stage' ? t.stage===groupVal : (t.month||0)===groupVal)));
  const targetIdx = rest.findIndex(t=>t.id===targetTask.id);
  const insertIdx = insertBefore ? targetIdx : targetIdx+1;
  rest.splice(insertIdx, 0, draggedTask);
  rest.forEach((t,i)=>{ t.order = i*10; });
}
function appendToGroupEnd(allTasks, task, groupBy, groupVal){
  const group = allTasks.filter(t=>t.id!==task.id && (groupBy==='stage' ? t.stage===groupVal : (t.month||0)===groupVal));
  const maxOrder = group.length ? Math.max(...group.map(t=>t.order||0)) : 0;
  task.order = maxOrder + 10;
}
function lockIconHtml(task, allTasks){
  if(!task.blockedBy || !task.blockedBy.length) return '';
  const blocked = isBlocked(task, allTasks);
  return `<span class="lock-icon ${blocked?'locked':'unlocked'}" title="${blocked?'Заблокировано':'Разблокировано'}">${blocked?'🔒':'🔓'}</span>`;
}
function smartTaskSort(tasks, allTasks){
  const statusRank = {doing:0, review:1, todo:2, done:3};
  return tasks.slice().sort((a,b)=>{
    const sr = statusRank[a.status]-statusRank[b.status];
    if(sr!==0) return sr;
    const ab = isBlocked(a, allTasks) ? 1 : 0, bb = isBlocked(b, allTasks) ? 1 : 0;
    if(ab!==bb) return ab-bb;
    return PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority];
  });
}

function wirePersonEval(personId){
  const calc = ()=>{
    const salary = parseFloat(document.getElementById('peSalary').value)||0;
    const pct = (parseFloat(document.getElementById('peTargetPct').value)||0)/100;
    const grades = Array.from(document.querySelectorAll('.peGrade')).map(s=>GRADES[s.value]);
    const avg = grades.reduce((a,b)=>a+b,0)/grades.length;
    const profitCoef = PROFIT_COEF[document.getElementById('peProfit').value];
    const bonus = salary*3*pct*avg*profitCoef;
    document.getElementById('peResult').textContent = money(bonus);
    return {salary, pct, grades: Array.from(document.querySelectorAll('.peGrade')).map(s=>s.value), profitKey: document.getElementById('peProfit').value};
  };
  document.querySelectorAll('#peSalary, #peTargetPct, .peGrade, #peProfit').forEach(el=>{
    el.addEventListener('input', calc); el.addEventListener('change', calc);
  });
  calc();
  document.getElementById('peSaveBtn').onclick = async ()=>{
    const state = calc();
    const btn = document.getElementById('peSaveBtn');
    btn.textContent = 'Сохранение…'; btn.disabled = true;
    const evals = await getCache('eva-club-evaluations', {});
    evals[personId] = {grades: state.grades, profitKey: state.profitKey, salary: state.salary, pct: state.pct, ts: Date.now()};
    setCacheLocal('eva-club-evaluations', evals);
    persistCache('eva-club-evaluations');
    renderPersonDetail(personId);
  };
}

function escalationLevel(t){
  const pc = t.postponeCount || 0;
  const rc = t.reworkCount || 0;
  const worst = Math.max(pc, rc);
  return worst===0 ? 0 : (worst===1 ? 1 : 2);
}
function escalationDotsHtml(t){
  const level = escalationLevel(t);
  const pc = t.postponeCount || 0, rc = t.reworkCount || 0;
  const reasons = [];
  if(pc>0) reasons.push(`перенос срока ×${pc}`);
  if(rc>0) reasons.push(`доработка ×${rc}`);
  const labels = ['В срок, без доработок', `Есть повод для внимания: ${reasons.join(', ')}`, `Контроль руководства: ${reasons.join(', ')}`];
  const colors = ['var(--green)', 'var(--gold-ink)', 'var(--rust)'];
  const dots = [0,1,2].map(i=>`<span class="esc-dot" style="background:${i===level?colors[i]:'#DDD8C8'}" title="${labels[i]}"></span>`).join('');
  return `<div class="tc-esc-dots">${dots}</div>`;
}

  const isControl = escalationLevel(t) >= 2;

  const isDone = t.status==='done';
  const isBlockerCard = isBlockerFor(t, allTasks||[]);
  const assigneeOpts = `<option value="">— Не назначено —</option>` + people.map(p=>`<option value="${p.id}" ${t.assignee===p.id?'selected':''}>${esc(p.name||p.role)}</option>`).join('');

    <div class="tc-inline-row">

function wireInlineTaskControls(container, allTasks, rerenderFn){
  container.querySelectorAll('.task-card').forEach(card=>{
    const id = card.dataset.task;
    const task = allTasks.find(t=>t.id===id);
    const stop = (e)=>e.stopPropagation();
    card.querySelectorAll('select').forEach(s=>{
      s.addEventListener('mousedown', stop);
      s.addEventListener('click', stop);
      s.addEventListener('dragstart', (e)=>e.preventDefault());
    });
    const stSel = card.querySelector('.tk-status');
    if(stSel) stSel.addEventListener('change', (e)=>{ task.status = e.target.value; saveTasks(allTasks); rerenderFn(); });
    const prSel = card.querySelector('.tk-priority');
    if(prSel) prSel.addEventListener('change', (e)=>{ task.priority = e.target.value; saveTasks(allTasks); rerenderFn(); });
    const asSel = card.querySelector('.tk-assignee');
    if(asSel) asSel.addEventListener('change', (e)=>{ task.assignee = e.target.value||null; saveTasks(allTasks); rerenderFn(); });
  });
}

function wireTaskCardClicks(container, rerenderFn){
  container.querySelectorAll('.task-card').forEach(card=>{
    const id = card.dataset.task;
    card.addEventListener('mousedown', (e)=>{ if(e.target.tagName==='SELECT') return; card._downX = e.clientX; card._downY = e.clientY; });
    card.addEventListener('click', (e)=>{
      if(e.target.tagName==='SELECT') return;
      const dx = Math.abs(e.clientX - (card._downX===undefined?e.clientX:card._downX));
      const dy = Math.abs(e.clientY - (card._downY===undefined?e.clientY:card._downY));
      if(dx<4 && dy<4){ openTaskModal(id, rerenderFn); }
    });
  });
}

function taskCardGridHtml(tasks, people, allTasks){
  if(!tasks.length) return `<div class="empty-state">Задач пока нет.</div>`;
  return `<div class="task-card-grid">${tasks.map(t=>taskCardHtml(t, people, allTasks)).join('')}</div>`;
}

function wireTaskCards(container, allTasks, rerenderFn){
  const board = container.querySelector('.kanban-board');
  if(board){
    board.addEventListener('dragover', (e)=>{
      const rect = board.getBoundingClientRect();
      const threshold = 70;
      if(e.clientX - rect.left < threshold) board.scrollLeft -= 22;
      else if(rect.right - e.clientX < threshold) board.scrollLeft += 22;
    });
  }
  const groupTypeOf = (card)=>{
    const kcol = card.closest('.kanban-cards');
    if(kcol){
      if(kcol.dataset.stageDrop!==undefined) return 'stage';
      if(kcol.dataset.monthDrop!==undefined) return 'month';
    }
    const lines = card.closest('[data-reorder-type]');
    if(lines) return lines.dataset.reorderType;
    return null;
  };
  container.querySelectorAll('.task-card').forEach(card=>{
    const id = card.dataset.task;
    card.addEventListener('dragstart', (e)=>{
      if(e.target.tagName==='SELECT'){ e.preventDefault(); return; }
      e.dataTransfer.setData('text/plain', id);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=>card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      container.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(el=>el.classList.remove('drag-over-top','drag-over-bottom'));
    });
    card.addEventListener('dragover', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const rect = card.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height/2;
      card.classList.toggle('drag-over-top', before);
      card.classList.toggle('drag-over-bottom', !before);
    });
    card.addEventListener('dragleave', ()=>{ card.classList.remove('drag-over-top','drag-over-bottom'); });
    card.addEventListener('drop', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const insertBefore = card.classList.contains('drag-over-top');
      card.classList.remove('drag-over-top','drag-over-bottom');
      const draggedId = e.dataTransfer.getData('text/plain');
      if(draggedId===id) return;
      const draggedTask = allTasks.find(t=>t.id===draggedId);
      const targetTask = allTasks.find(t=>t.id===id);
      const groupType = groupTypeOf(card);
      if(draggedTask && targetTask && groupType){
        if(groupType==='month'){
          const newMonth = targetTask.month||0;
          if(newMonth > (draggedTask.month||0)) draggedTask.postponeCount = (draggedTask.postponeCount||0) + 1;
        }
        reorderTaskRelative(allTasks, draggedTask, targetTask, insertBefore, groupType);
        saveTasks(allTasks); rerenderFn();
      }
    });
    card.addEventListener('mousedown', (e)=>{ if(e.target.tagName==='SELECT') return; card._downX = e.clientX; card._downY = e.clientY; });
    card.addEventListener('click', (e)=>{
      if(e.target.tagName==='SELECT') return;
      const dx = Math.abs(e.clientX - (card._downX===undefined?e.clientX:card._downX));
      const dy = Math.abs(e.clientY - (card._downY===undefined?e.clientY:card._downY));
      if(dx<4 && dy<4){ openTaskModal(id, rerenderFn); }
    });
  });
  container.querySelectorAll('.kanban-cards').forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=>{ col.classList.remove('drag-over'); });
    col.addEventListener('drop', (e)=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      const taskId = e.dataTransfer.getData('text/plain');
      const task = allTasks.find(t=>t.id===taskId);
      if(task){
        if(col.dataset.stageDrop!==undefined){
          task.stage = col.dataset.stageDrop;
          appendToGroupEnd(allTasks, task, 'stage', task.stage);
        }
        if(col.dataset.monthDrop!==undefined){
          const newMonth = parseInt(col.dataset.monthDrop);
          if(newMonth > (task.month||0)) task.postponeCount = (task.postponeCount||0) + 1;
          task.month = newMonth;
          appendToGroupEnd(allTasks, task, 'month', task.month);
        }
        saveTasks(allTasks); rerenderFn();
      }
    });
  });
  wireInlineTaskControls(container, allTasks, rerenderFn);
}

  const roadmapBase = await getMonthsBase();
  const bMonth = taskBudgetMonth(t, roadmapBase);
  const budgetNote = !(t.budget>0)
    ? 'Проставьте сумму — она сама встанет разовым платежом в реестр расходов, в месяц этой карточки.'
    : (bMonth>FIN_HORIZON
        ? `Месяц карточки (${monthCalendarLabel(t.month, roadmapBase)}) выходит за 36 месяцев модели — платёж сохранится в реестре, но в расчёт не попадёт.`
        : `Уже в расходах: разовый платёж <b>${money(t.budget)}</b> за <b>${finMonthLabel(Math.max(1,bMonth))}</b> — строка «Бюджет задачи: ${esc(t.title)}». Правка суммы или месяца здесь обновляет ту же строку, второй не появится.`);

  document.body.appendChild(overlay);

  const rerenderModal = ()=>openTaskModal(taskId, onCloseRerender);
  const closeAndRefresh = ()=>{ overlay.remove(); if(onCloseRerender) onCloseRerender(); };

  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) closeAndRefresh(); });
  document.getElementById('tmCloseBtn').onclick = closeAndRefresh;
  document.getElementById('tmApplyBtn').onclick = closeAndRefresh;

  document.getElementById('tmTitle').addEventListener('blur', (e)=>{ t.title = e.target.value.trim()||t.title; saveTasks(allTasks); });
  document.getElementById('tmDesc').addEventListener('blur', (e)=>{ t.desc = e.target.value; saveTasks(allTasks); });
  document.getElementById('tmCkp').addEventListener('blur', (e)=>{ t.ckp = e.target.value; saveTasks(allTasks); });
  const resultEl = document.getElementById('tmResult');
  if(resultEl) resultEl.addEventListener('blur', (e)=>{ t.result = e.target.value; saveTasks(allTasks); });
  document.getElementById('tmCreator').addEventListener('change', (e)=>{ t.creator = e.target.value||null; saveTasks(allTasks); rerenderModal(); });
  document.getElementById('tmAssignee').addEventListener('change', (e)=>{ t.assignee = e.target.value||null; saveTasks(allTasks); rerenderModal(); });
  document.getElementById('tmDept').addEventListener('change', (e)=>{ t.dept = e.target.value||null; saveTasks(allTasks); rerenderModal(); });
  document.getElementById('tmPriority').addEventListener('change', (e)=>{ t.priority = e.target.value; saveTasks(allTasks); rerenderModal(); });
  document.getElementById('tmStage').addEventListener('change', (e)=>{ t.stage = e.target.value||null; saveTasks(allTasks); rerenderModal(); });
  document.getElementById('tmMonth').addEventListener('change', (e)=>{
    const newMonth = parseInt(e.target.value);
    if(newMonth > (t.month||0)) t.postponeCount = (t.postponeCount||0) + 1;
    t.month = newMonth; saveTasks(allTasks); syncTaskBudgetToExpenses(t); rerenderModal();
  });

  overlay.querySelectorAll('[data-budget-quick]').forEach(btn=>{
    btn.onclick = ()=>{
      t.budget = parseInt(btn.dataset.budgetQuick);
      saveTasks(allTasks); syncTaskBudgetToExpenses(t); rerenderModal();
    };
  });
  document.getElementById('tmBudget').addEventListener('change', (e)=>{
    t.budget = parseThousands(e.target.value);
    saveTasks(allTasks); syncTaskBudgetToExpenses(t); rerenderModal();
  });
  document.getElementById('tmBudgetApproval').addEventListener('change', (e)=>{
    t.budgetNeedsApproval = e.target.checked;
    if(!t.budgetNeedsApproval) t.budgetApproved = false;
    saveTasks(allTasks); syncTaskBudgetToExpenses(t); rerenderModal();
  });
  const budgetApproverEl = document.getElementById('tmBudgetApprover');
  if(budgetApproverEl) budgetApproverEl.addEventListener('change', (e)=>{
    t.budgetApprover = e.target.value; t.budgetApproved = false;
    saveTasks(allTasks); syncTaskBudgetToExpenses(t); rerenderModal();
  });
  const budgetApproveBtn = document.getElementById('tmBudgetApproveBtn');
  if(budgetApproveBtn) budgetApproveBtn.onclick = ()=>{
    t.budgetApproved = true;
    saveTasks(allTasks); syncTaskBudgetToExpenses(t); rerenderModal();
  };

  document.getElementById('tmAddBlocker').addEventListener('change', (e)=>{
    if(!e.target.value) return;
    t.blockedBy = t.blockedBy || [];
    t.blockedBy.push(e.target.value);
    saveTasks(allTasks); rerenderModal();
  });
  overlay.querySelectorAll('[data-remove-blocker]').forEach(btn=>{
    btn.onclick = ()=>{
      t.blockedBy = (t.blockedBy||[]).filter(id=>id!==btn.dataset.removeBlocker);
      saveTasks(allTasks); rerenderModal();
    };
  });

  const sendReview = document.getElementById('tmSendReview');
  if(sendReview) sendReview.onclick = ()=>{
    const replyEl = document.getElementById('tmReply');
    if(replyEl && replyEl.value.trim()){
      t.commentThread = t.commentThread || [];
      t.commentThread.push({from:'assignee', text:replyEl.value.trim(), ts:Date.now()});
    }
    t.status='review'; t.rejected=false;
    saveTasks(allTasks); rerenderModal();
  };
  const approveBtn = document.getElementById('tmApprove');
  if(approveBtn) approveBtn.onclick = ()=>{
    t.status='done'; t.rejected=false; t.notifyResult='approved';
    saveTasks(allTasks); rerenderModal();
  };
  const rejectBtn = document.getElementById('tmReject');
  if(rejectBtn) rejectBtn.onclick = ()=>{ document.getElementById('tmRejectCommentWrap').style.display='block'; rejectBtn.style.display='none'; };
  const confirmReject = document.getElementById('tmConfirmReject');
  if(confirmReject) confirmReject.onclick = ()=>{
    const comment = document.getElementById('tmRejectComment').value.trim();
    t.commentThread = t.commentThread || [];
    t.commentThread.push({from:'creator', text:comment||'Без комментария', ts:Date.now()});
    t.status='doing'; t.rejected=true;
    t.reworkCount = (t.reworkCount||0) + 1;
    t.notifyResult = 'rejected';
    saveTasks(allTasks); rerenderModal();
  };
  overlay.querySelectorAll('[data-set-status]').forEach(b=>{
    b.onclick = ()=>{ t.status = b.dataset.setStatus; saveTasks(allTasks); rerenderModal(); };
  });

  document.getElementById('tmVoteBtn').onclick = ()=>{ openVoteLevelPrompt(t, closeAndRefresh); };
  /* Системные окна confirm() внутри артефакта не открываются, поэтому
     подтверждаем удаление вторым нажатием на саму кнопку. */
  const delBtn = document.getElementById('tmDeleteBtn');
  delBtn.onclick = async ()=>{
    if(delBtn.dataset.armed!=='1'){
      delBtn.dataset.armed = '1';
      delBtn.textContent = 'Точно удалить? Нажмите ещё раз';
      delBtn.style.background = 'var(--rust)'; delBtn.style.color = '#fff'; delBtn.style.borderColor = 'var(--rust)';
      setTimeout(()=>{ if(delBtn.dataset.armed==='1'){ delBtn.dataset.armed='0'; delBtn.textContent='Удалить задачу';
        delBtn.style.background=''; delBtn.style.color='var(--rust)'; delBtn.style.borderColor='#D9B3A8'; } }, 6000);
      return;
    }
    const list = (await getTasks()).filter(x=>x.id!==taskId);
    saveTasks(list);
    /* отвязываем ключевую задачу стратегии, если она ссылалась на эту */
    const items = await getStratItems();
    let touched = false;
    items.forEach(i=>{ if(i.taskId===taskId){ delete i.taskId; touched = true; } });
    if(touched) saveStratItems(items);
    closeAndRefresh();
  };
}

const MONTH_ABBR = ['Янв','Февр','Март','Апр','Май','Июнь','Июль','Авг','Сент','Окт','Нояб','Дек'];
function monthCalendarLabel(n, baseAbs){
  if(baseAbs===null || baseAbs===undefined) return `Месяц ${n}`;
  const abs = baseAbs + (n-1);
  const year = Math.floor(abs/12);
  const idx = ((abs%12)+12)%12;
  return `${MONTH_ABBR[idx]}. ${year}`;
}
async function getMonthsBase(){
  if(!('eva-club-months-base' in _cache)){
    const stored = await loadShared('eva-club-months-base', null);
    /* задачи доски заведены от августа 2026 — это и есть месяц 1 */
    _cache['eva-club-months-base'] = (stored===null || stored===undefined) ? ROADMAP_BASE_DEFAULT : stored;
  }
  return _cache['eva-club-months-base'];
}

function monthKanbanHtml(allTasks, people, baseAbs){
  const months = [1,2,3,4,5,6,7,8];
  return months.map(m=>{
    const monthTasks = sortByOrder(allTasks.filter(t=>(t.month||0)===m));
    const st = taskStats(monthTasks);
    const cards = monthTasks.map(t=>taskCardHtml(t, people, allTasks, 'month')).join('');
    return `
    <div class="kanban-col">
      <div class="kanban-col-head">
        <h4>${monthCalendarLabel(m, baseAbs)}</h4>
        <div class="pctbar"><div class="pctfill" style="width:${st.pct}%"></div></div>
        <div class="kc-pct mono">${st.pct}% · ${monthTasks.length} задач</div>

      <button class="col-add-btn" data-quick-add-month="${m}">+ Добавить задачу</button>
    </div>`;
  }).join('');
}

  return `<div class="task-card task-line ${isControl?'control-card':''} ${isRejected?'rejected-card':''} ${isDone?'done-card':''} ${isBlockerCard?'is-blocker':''} ${isAwaitingApproval?'awaiting-approval':''}" draggable="true" data-task="${t.id}" title="${isBlockerCard?'От этой задачи зависят другие':''}">

function taskLinesHtml(tasks, people, allTasks, groupBy){
  if(!tasks.length) return '<div class="kanban-empty">Нет задач на этом этапе</div>';
  const sorted = groupBy ? sortByOrder(tasks) : tasks;
  return `<div class="task-lines" ${groupBy?`data-reorder-type="${groupBy}"`:''}>${sorted.map(t=>taskLineHtml(t, people, allTasks, groupBy)).join('')}</div>`;
}

/* Сколько стоит дорожная карта: бюджеты задач по этапам и месяцам
   плюс burn модели за те же месяцы. Бюджет задачи автоматически
   становится единоразовой строкой в реестре расходов, поэтому
   дорожная карта и финмодель считают одни и те же деньги. */
async function roadmapBudgetHtml(allTasks){
  const monthsBase = await getMonthsBase();
  const model = computeFinModel(await buildFinCfg({}));
  const budgeted = allTasks.filter(t=>t.budget>0);
  const total = budgeted.reduce((a,t)=>a+t.budget,0);
  const pending = budgeted.filter(t=>t.budgetNeedsApproval && !t.budgetApproved);
  const pendingSum = pending.reduce((a,t)=>a+t.budget,0);
  const doneSum = budgeted.filter(t=>t.status==='done').reduce((a,t)=>a+t.budget,0);

  const stageRows = ROADMAP.map(st=>{
    const tasks = allTasks.filter(t=>t.stage===st.id);
    const b = tasks.filter(t=>t.budget>0);
    const sum = b.reduce((a,t)=>a+t.budget,0);
    const stat = taskStats(tasks);
    return {st, tasks, sum, count:b.length, stat};
  });

  const monthNums = Array.from(new Set(allTasks.map(t=>t.month||0).filter(Boolean))).sort((a,b)=>a-b);
  const monthRows = monthNums.map(mn=>{
    const tasks = allTasks.filter(t=>(t.month||0)===mn);
    const sum = tasks.reduce((a,t)=>a+(t.budget||0),0);
    const finM = (monthsBase!==null && monthsBase!==undefined) ? (monthsBase+(mn-1)-FIN_BASE_ABS+1) : null;
    const burn = (finM && finM>=1 && finM<=FIN_HORIZON) ? model.totalExpense[finM] : null;
    return {mn, label: monthCalendarLabel(mn, monthsBase), tasks: tasks.length, sum, burn, finM};
  });

  return `
    <section class="block" style="margin-top:36px;">
      <h2>Сколько стоит дорожная карта</h2>
      <p class="block-sub">Бюджет, проставленный в карточке задачи, автоматически становится единоразовым расходом в общем реестре — с тем же месяцем. Поэтому дорожная карта и финансовая модель считают одни и те же деньги, а не два разных бюджета.</p>
      ${metricCards([
        {l:'Бюджетов проставлено', v:money(total), sub:`${budgeted.length} задач из ${allTasks.length}`},
        {l:'Ждёт согласования', v:money(pendingSum), cls: pendingSum?'neg':'', sub:`${pending.length} задач`},
        {l:'Уже потрачено по закрытым задачам', v:money(doneSum)},
        {l:'Задач без бюджета', v:num(allTasks.filter(t=>!t.budget && t.status!=='done').length), sub:'из незакрытых — стоит проверить, точно ли они бесплатные'},
      ])}
      <div class="grid-2">
        <div class="card table-card">
          <table class="calc-table">
            <thead><tr><th>Этап</th><th>Задач с бюджетом</th><th>Бюджет</th><th>Готовность</th></tr></thead>
            <tbody>
              ${stageRows.map(r=>`<tr>
                <td><strong>${r.st.stage}</strong> · ${esc(r.st.title)}<div class="soft" style="font-size:11.5px;">${r.st.when}</div></td>
                <td class="num">${r.count}</td>
                <td class="num hl">${r.sum?money(r.sum):'—'}</td>
                <td class="num">${r.stat.pct}%</td>
              </tr>`).join('')}
              <tr class="total-row"><td>Итого</td><td class="num">${budgeted.length}</td><td class="num">${money(total)}</td><td class="num">${taskStats(allTasks).pct}%</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card table-card">
          <table class="calc-table">
            <thead><tr><th>Месяц</th><th>Задач</th><th>Бюджеты задач</th><th>Полные расходы месяца</th></tr></thead>
            <tbody>
              ${monthRows.map(r=>`<tr>
                <td>${r.label}</td>
                <td class="num">${r.tasks}</td>
                <td class="num hl">${r.sum?money(r.sum):'—'}</td>
                <td class="num">${r.burn!==null?money(r.burn):'<span class="soft">вне горизонта модели</span>'}</td>
              </tr>`).join('')}

async function getStratPlan(){
  if(!('eva-club-strategy-plan' in _cache)){

          base[g.month] = Object.assign({sales:0, experts:0, content:0}, base[g.month], {sales:g.value||0});
        });
      }
      stored = base;
    }
    _cache['eva-club-strategy-plan'] = stored;
  }
  return _cache['eva-club-strategy-plan'];
}

/* План продаж по месяцам из целей ганта — то, чем кормится движок.
   Внутри горизонта стратегии месяц без цели означает ноль продаж,
   а не формулу роста: иначе сентябрь «продавал» бы до запуска.
   За горизонтом план заканчивается и модель считает как обычно. */
function salesPlanFromGoals(plan, horizon){
  const out = {};
  for(let m=1; m<=(horizon||0); m++){
    const v = planAt(plan, m, 'sales');
    out[m] = v===null ? 0 : v;
  }
  return out;
}

/* Подсказки для клетки плана: программа предлагает несколько вариантов
   от предыдущего месяца, но можно вписать любое своё число. */
function planSuggestions(line, plan, month, funnel){
  const prev = month>1 ? planAt(plan, month-1, line.key) : null;
  const base = prev===null ? 0 : prev;
  const out = [];
  const add = (v, hint)=>{ v = Math.max(0, Math.round(v)); if(!out.some(o=>o.v===v)) out.push({v, hint}); };
  if(line.key==='sales'){
    if(base<=0){ add(10,'осторожный старт'); add(20,'первые продажи'); add(40,'активный старт'); }
    else {
      add(base, 'как в прошлом месяце');
      add(base*1.3, '+30%');
      add(base*1.5, '+50%');
      add(base*2, '×2');
      add(base*(1+(funnel.growthY1||0.12)), 'по формуле модели, '+cfPct(funnel.growthY1||0.12));
    }
  } else if(line.key==='experts'){
    if(base<=0){ add(20,'стартовая база'); add(30,'первые договоры'); add(50,'вся база практикующих'); }
    else { add(base,'без изменений'); add(base+5,'+5 экспертов'); add(base+10,'+10'); add(base+20,'+20'); }
  } else {
    /* библиотека накопительно: прирост — это план съёмок за месяц */
    if(base<=0){ add(0,'съёмок ещё нет'); add(30,'+30: половина загрузки студии'); add(60,'+60: 1 эксперт в день'); }
    else { add(base,'съёмок нет'); add(base+30,'+30 за месяц'); add(base+60,'+60: 1 эксперт в день'); add(base+90,'+90: полная загрузка студии'); }
  }
  return out.slice(0,5);
}

async function openPlanPicker(btn, lineKey, month, rerender){
  const line = STRAT_PLAN_LINES.find(l=>l.key===lineKey); if(!line) return;
  const plan = await getStratPlan();
  const funnel = await getFunnelCfg();
  const cur = planAt(plan, month, lineKey);
  const sugg = planSuggestions(line, plan, month, funnel);
  const old = document.getElementById('planPicker'); if(old) old.remove();

  const pop = document.createElement('div');
  pop.id = 'planPicker'; pop.className = 'plan-picker';
  pop.innerHTML = `
    <div class="pp-head"><span class="g-dot track-${line.color}"></span><b>${line.name}</b> · ${finMonthLabel(month)}</div>
    <div class="pp-sugg">${sugg.map(o=>`<button type="button" class="pp-chip ${cur===o.v?'active':''}" data-pp-val="${o.v}"><b>${num(o.v)}</b><span>${o.hint}</span></button>`).join('')}</div>
    <div class="pp-own">
      <input type="number" min="0" step="1" id="ppInput" value="${cur===null?'':cur}" placeholder="своё число">
      <button type="button" class="btn" id="ppSave">Сохранить</button>
      <button type="button" class="btn ghost" id="ppClear" title="Очистить клетку">Очистить</button>
    </div>
    <div class="pp-hint">${esc(line.hint)}</div>`;
  document.body.appendChild(pop);

  /* позиционируем у клетки, не выходя за экран */
  const r = btn.getBoundingClientRect();
  const w = 340;
  let left = Math.min(window.innerWidth - w - 12, Math.max(12, r.left + r.width/2 - w/2));
  let top = r.bottom + 8;
  if(top + 230 > window.innerHeight) top = Math.max(12, r.top - 238);
  pop.style.left = left+'px'; pop.style.top = top+'px'; pop.style.width = w+'px';

  const close = ()=>{ pop.remove(); document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', onKey, true); };
  const save = async (val)=>{
    const planObj = await getStratPlan();
    const row = planObj[month] || (planObj[month] = {sales:null, experts:null, content:null});
    row[lineKey] = val;
    saveStratPlan(planObj); close(); rerender();
  };
  const outside = (e)=>{ if(!pop.contains(e.target) && e.target!==btn) close(); };
  const onKey = (e)=>{ if(e.key==='Escape'){ e.preventDefault(); close(); } };
  setTimeout(()=>{ document.addEventListener('pointerdown', outside, true); document.addEventListener('keydown', onKey, true); }, 0);

  pop.querySelectorAll('[data-pp-val]').forEach(c=>{ c.onclick = ()=>save(parseInt(c.dataset.ppVal)); });
  const input = pop.querySelector('#ppInput');
  input.focus(); input.select();
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); const v = input.value.trim(); save(v===''?null:Math.max(0, parseInt(v)||0)); } });
  pop.querySelector('#ppSave').onclick = ()=>{ const v = input.value.trim(); save(v===''?null:Math.max(0, parseInt(v)||0)); };
  pop.querySelector('#ppClear').onclick = ()=>save(null);
}

function stratMilesRowHtml(miles, cols){
  /* Подписи вех раскладываются по двум ярусам: если следующая точка
     ближе, чем длина подписи предыдущей, она уходит на второй ярус —
     иначе названия наезжают друг на друга. */
  const list = miles.filter(m=>m.h<cols).slice().sort((a,b)=>a.h-b.h);
  const laneEnd = [-99, -99, -99];
  const placed = list.map(m=>{
    const span = Math.ceil(m.title.length/5) + 1;
    let lane = laneEnd.findIndex(end=>m.h > end);
    if(lane < 0) lane = laneEnd.indexOf(Math.min(...laneEnd));
    laneEnd[lane] = m.h + span;
    /* у правого края подпись уводится влево, иначе она уезжает за таблицу */
    return {m, lane, left: m.h > cols-7};
  });
  const months = Math.ceil(cols/2);
  const cells = [];
  for(let m=1;m<=months;m++){
    cells.push(`<div class="g-mile-cell"><button type="button" class="g-mile-add" data-add-mile="${m}" title="Добавить ключевую точку на ${finMonthLabel(m)}">+</button></div>`);
  }
  return `<div class="g-row g-miles">
    <div class="g-label"><span class="g-band-name">Ключевые точки</span></div>
    <div class="g-mile-cells">${cells.join('')}</div>
    ${placed.map(({m,lane,left})=>`
      <button type="button" class="g-mile lane-${lane} ${left?'to-left':''}" style="grid-column:${2+m.h}/${3+m.h}" data-strat-mile="${m.id}"
              title="${esc(m.title)} · ${halfLabel(m.h)} · тяните, чтобы сдвинуть; клик — правка">
        <span class="g-mile-dot"></span><span class="g-mile-label"><span class="g-mile-when">${halfShort(m.h)}</span>${esc(m.title)}</span>
      </button>`).join('')}
  </div>`;
}

function stratLoadRowHtml(items, cols){
  const load = new Array(cols).fill(0);
  items.forEach(it=>{ for(let h=Math.max(0,it.from); h<=Math.min(cols-1,it.to); h++) load[h]++; });
  const max = Math.max(1, ...load);
  return `<div class="g-row g-load">
    <div class="g-label"><span class="g-band-name">Загрузка</span></div>
    ${load.map((v,h)=>`<div class="g-load-cell" title="${halfLabel(h)}: ${v} ${v===1?'задача':(v<5?'задачи':'задач')} в работе">
      <span class="g-load-bar" style="height:${Math.round(v/max*100)}%"></span></div>`).join('')}
  </div>`;
}

    <div class="card strat-editor">
      <div class="strat-editor-head">
        <input type="text" class="v-input strat-title" data-strat-field="title" data-id="${it.id}" value="${esc(it.title)}">

      <div class="field-row">
        <div class="field"><label>Направление</label>
          <select class="v-input" data-strat-field="track" data-id="${it.id}">

          <select class="v-input" data-strat-field="status" data-id="${it.id}">

            <select class="v-input" data-strat-field="fromHalf" data-id="${it.id}">
              <option value="0" ${!halfIsSecond(it.from)?'selected':''}>с начала</option>
              <option value="1" ${halfIsSecond(it.from)?'selected':''}>с середины</option>

          </div></div>
        <div class="field"><label>Окончание</label>
          <div class="half-pick">
            <select class="v-input" data-strat-field="toMonth" data-id="${it.id}">${monthOpts(halfToMonth(it.to))}</select>
            <select class="v-input" data-strat-field="toHalf" data-id="${it.id}">
              <option value="0" ${!halfIsSecond(it.to)?'selected':''}>до середины</option>

          <select class="v-input" data-strat-field="owner" data-id="${it.id}">
            <option value="">— не назначен</option>
            ${people.filter(p=>p.type!=='investor'&&p.type!=='expert').map(p=>`<option value="${p.id}" ${it.owner===p.id?'selected':''}>${esc(p.name||p.role)}</option>`).join('')}
          </select></div>
        <div class="field"><label>Начинается после</label>
          <select class="v-input" data-strat-field="dep" data-id="${it.id}">
            <option value="">— ни от чего не зависит</option>

        <span class="note-sm" style="margin:0; flex:1;">${halfLabel(it.from)} → ${halfLabel(it.to)} · ${it.to-it.from+1} ${it.to-it.from+1===1?'полмесяца':'полумесяца'}</span>
        ${it.task ? `<button class="btn ghost" data-open-task="${it.task.id}">Открыть задачу на доске ${TASK_STATUS_ICON[it.task.status]||''}</button>` : `<button class="btn ghost" data-strat-task="${it.id}">Создать задачу на доске</button>`}
        <button class="btn ghost" data-strat-del="${it.id}">Удалить из стратегии</button>

}

  const items  = await getStratItems();
  const plan   = await getStratPlan();
  const miles  = await getStratMiles();
  const people = await getPeople();
  /* имя ответственного и связанная задача нужны прямо в строке */
  const allTasks = await getTasks();
  items.forEach(i=>{
    const o = people.find(x=>x.id===i.owner); i.ownerName = o ? (o.name || o.role) : '';
    i.task = i.taskId ? (allTasks.find(t=>t.id===i.taskId)||null) : null;
    if(i.taskId && !i.task) delete i.taskId;   /* задачу удалили с доски */
  });
  /* сколько ключевых задач ещё не на доске — с той же логикой поиска,
     что и у кнопки: карточка по названию тоже считается найденной */
  const usedIds = new Set(items.map(i=>i.taskId).filter(Boolean));

  }

  container.innerHTML = `
    <div class="gantt-toolbar">
      <div class="toggle-row inline" id="stratMonthsRow">

      </div>
      <span class="note-sm" style="margin:0;">Полоса тянется мышью: за середину — сдвинуть срок, за край — растянуть. Клик раскрывает её и открывает карточку.</span>
      ${unlinked ? `<button class="btn ghost" id="stratSyncBtn" title="Создать задачи на доске для ключевых задач, у которых их ещё нет">Задачи на доску: ${unlinked}</button>` : ''}
      <button class="btn ghost" id="stratAddMileBtn">+ Ключевая точка</button>
      <button class="btn" id="stratAddBtn">+ Ключевая задача</button>
    </div>
    <div class="gantt-scroll">
      <div class="gantt" style="--g-cols:${cols}; --g-months:${months};">
        <div class="g-row g-head">
          <div class="g-label"><span class="g-band-name">Направления</span></div>
          ${headCells.join('')}
        </div>
        ${stratMilesRowHtml(miles, cols)}
        ${stratPlanRowsHtml(plan, months)}
        ${byTrack.map(g=>`
          <div class="g-row g-track-head">
            <div class="g-label"><span class="g-dot track-${g.t.color}"></span><span class="g-track-name">${g.t.name}</span></div>
            <div class="g-lane"></div>
          </div>
          ${g.list.map(it=>stratItemRowHtml(it, items, cols)).join('')}
        `).join('')}
        ${stratLoadRowHtml(items, cols)}
        <svg class="g-deps" aria-hidden="true"></svg>
      </div>
    </div>
    ${open ? stratEditorHtml(open, items, people, cols) : ''}
    ${_stratAdding ? `
      <div class="card add-exp-card">
        <p class="k-label">Новая ключевая задача</p>
        <div class="field-row">
          <div class="field grow"><label>Что делаем</label><input type="text" id="stratNewTitle" placeholder="Например, запуск подкаста с экспертами"></div>
          <div class="field"><label>Направление</label><select id="stratNewTrack">${STRAT_TRACKS.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
          <div class="field"><label>С месяца</label><select id="stratNewFrom">${Array.from({length:months},(_,i)=>i+1).map(m=>`<option value="${m}">${finMonthLabel(m)}</option>`).join('')}</select></div>
          <div class="field"><label>По месяц</label><select id="stratNewTo">${Array.from({length:months},(_,i)=>i+1).map(m=>`<option value="${m}">${finMonthLabel(m)}</option>`).join('')}</select></div>

/* Стрелки зависимостей рисуются поверх сетки после отрисовки:
   до этого момента реальные координаты полос неизвестны. */
function drawStratDeps(container){
  const gantt = container.querySelector('.gantt');
  const svg = container.querySelector('.g-deps');
  if(!gantt || !svg) return;
  const items = _cache['eva-club-strategy-items'] || [];
  const box = gantt.getBoundingClientRect();
  svg.setAttribute('width', gantt.scrollWidth);
  svg.setAttribute('height', gantt.scrollHeight);
  svg.setAttribute('viewBox', `0 0 ${gantt.scrollWidth} ${gantt.scrollHeight}`);
  const paths = [];
  items.forEach(it=>{
    (it.deps||[]).forEach(depId=>{
      const a = gantt.querySelector(`[data-strat-bar="${depId}"].g-bar`);
      const b = gantt.querySelector(`[data-strat-bar="${it.id}"].g-bar`);
      if(!a || !b) return;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const x1 = ra.right - box.left, y1 = ra.top - box.top + ra.height/2;
      const x2 = rb.left  - box.left, y2 = rb.top - box.top + rb.height/2;
      const late = (items.find(x=>x.id===depId)||{}).to > it.from;
      const mid = x2 > x1+14 ? x1 + Math.min(18, (x2-x1)/2) : x1 + 10;
      paths.push(`<path d="M${x1} ${y1} H${mid} V${y2} H${x2}" class="dep-line ${late?'late':''}"/>`);
      paths.push(`<circle cx="${x2}" cy="${y2}" r="3" class="dep-dot ${late?'late':''}"/>`);
    });
  });
  svg.innerHTML = paths.join('');
}

function wireStrategyGantt(container){
  const rerender = ()=>renderStrategy(document.getElementById('rmBody'));

  container.querySelectorAll('#stratMonthsRow button').forEach(b=>{
    b.onclick = ()=>{ _stratMonths = parseInt(b.dataset.m); rerender(); };
  });
  const addBtn = container.querySelector('#stratAddBtn');
  if(addBtn) addBtn.onclick = ()=>{ _stratAdding = true; _stratOpen = null; rerender(); };
  const addMile = container.querySelector('#stratAddMileBtn');
  if(addMile) addMile.onclick = ()=>openMileEditor(null, 1, rerender);
  container.querySelectorAll('[data-open-task]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); openTaskModal(b.dataset.openTask, rerender); };
  });
  const syncBtn = container.querySelector('#stratSyncBtn');
  if(syncBtn) syncBtn.onclick = async ()=>{
    const list = await getStratItems();
    const tasks = await getTasks();
    const used = new Set(list.map(x=>x.taskId).filter(Boolean));
    for(const it of list){
      /* карточка уже может быть на доске — тогда просто связываем,
         а не заводим вторую с тем же названием */
      const found = findTaskForStratItem(tasks, it, used);
      if(found){
        it.taskId = found.id; found.stratId = it.id; used.add(found.id);
        continue;
      }
      const tr = STRAT_TRACK_MAP[it.track] || STRAT_TRACKS[0];
      const id = uid();
      tasks.push({id, title:it.title, dept:tr.dept, stage:'s1', status: it.status==='done'?'done':(it.status==='doing'?'doing':'todo'),
        priority:'high', month: await stratToRoadmapMonth(halfToMonth(it.from)), assignee:it.owner||null, budget:0, stratId:it.id,
        desc:(it.note||'')+(it.note?'\n\n':'')+'Из стратегии: '+halfLabel(it.from)+' → '+halfLabel(it.to)});
      it.taskId = id; used.add(id);
    }
    saveTasks(tasks); saveStratItems(list); rerender();
  };
  /* три строки плана: правка любой ячейки пересчитывает деньги */
  container.querySelectorAll('.g-plan-btn').forEach(btn=>{
    btn.onclick = ()=>openPlanPicker(btn, btn.dataset.planLine, parseInt(btn.dataset.planMonth), rerender);
  });
  const cancel = container.querySelector('#stratNewCancel');
  if(cancel) cancel.onclick = ()=>{ _stratAdding = false; rerender(); };
  const save = container.querySelector('#stratNewSave');
  if(save) save.onclick = async ()=>{
    const title = container.querySelector('#stratNewTitle').value.trim();
    if(!title){ container.querySelector('#stratNewTitle').focus(); return; }
    const fm = parseInt(container.querySelector('#stratNewFrom').value)||1;
    const tm = Math.max(fm, parseInt(container.querySelector('#stratNewTo').value)||fm);
    const list = await getStratItems();
    const id = uid();
    list.push({id, track: container.querySelector('#stratNewTrack').value, title,
      from: mkHalf(fm,0), to: mkHalf(tm,1), status:'plan', deps:[]});
    saveStratItems(list); _stratAdding = false; _stratOpen = id; rerender();
  };

  /* клик и перетаскивание полос */
  container.querySelectorAll('.g-bar').forEach(bar=>{
    bar.addEventListener('pointerdown', (e)=>startStratDrag(e, bar, rerender));
    bar.addEventListener('keydown', async (e)=>{
      const step = e.key==='ArrowLeft' ? -1 : (e.key==='ArrowRight' ? 1 : 0);
      if(step){
        e.preventDefault();
        const list = await getStratItems();
        const it = list.find(x=>x.id===bar.dataset.stratBar); if(!it) return;
        const cols = _stratMonths*2;
        if(e.shiftKey){ it.to = Math.max(it.from, Math.min(cols-1, it.to+step)); }
        else {
          const len = it.to-it.from;
          it.from = Math.max(0, Math.min(cols-1-len, it.from+step));
          it.to = it.from+len;
        }
        saveStratItems(list); await syncLinkedTask(it); rerender();
      } else if(e.key==='Enter' || e.key===' '){
        e.preventDefault();
        _stratOpen = _stratOpen===bar.dataset.stratBar ? null : bar.dataset.stratBar;
        _stratAdding = false; rerender();
      }
    });
  });

  /* редактор */
  const closeBtn = container.querySelector('[data-strat-close]');
  if(closeBtn) closeBtn.onclick = ()=>{ _stratOpen = null; rerender(); };
  container.querySelectorAll('[data-strat-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const list = await getStratItems();
      const it = list.find(x=>x.id===inp.dataset.id); if(!it) return;
      const f = inp.dataset.stratField;
      const cols = _stratMonths*2;
      if(f==='fromMonth')      it.from = mkHalf(parseInt(inp.value)||1, halfIsSecond(it.from)?1:0);
      else if(f==='fromHalf')  it.from = mkHalf(halfToMonth(it.from), parseInt(inp.value));
      else if(f==='toMonth')   it.to   = mkHalf(parseInt(inp.value)||1, halfIsSecond(it.to)?1:0);
      else if(f==='toHalf')    it.to   = mkHalf(halfToMonth(it.to), parseInt(inp.value));
      else if(f==='dep')       it.deps = inp.value ? [inp.value] : [];
      else it[f] = inp.value;
      it.from = Math.max(0, Math.min(cols-1, it.from));
      it.to   = Math.max(it.from, Math.min(cols-1, it.to));
      saveStratItems(list);
      if(f==='fromMonth' || f==='fromHalf') await syncLinkedTask(it);
      rerender();
    });
  });
  const delBtn = container.querySelector('[data-strat-del]');
  if(delBtn) delBtn.onclick = async ()=>{
    const id = delBtn.dataset.stratDel;
    let list = (await getStratItems()).filter(x=>x.id!==id);
    list.forEach(x=>{ if(x.deps) x.deps = x.deps.filter(d=>d!==id); });
    saveStratItems(list);
    /* карточка на доске остаётся, но метку стратегии с неё снимаем —
       иначе она ссылалась бы на удалённую полосу */
    const tasks = await getTasks();
    let touched = false;
    tasks.forEach(t=>{ if(t.stratId===id){ delete t.stratId; touched = true; } });
    if(touched) saveTasks(tasks);
    _stratOpen = null; rerender();
  };
  const taskBtn = container.querySelector('[data-strat-task]');
  if(taskBtn) taskBtn.onclick = async ()=>{
    const list = await getStratItems();
    const it = list.find(x=>x.id===taskBtn.dataset.stratTask); if(!it) return;
    const tr = STRAT_TRACK_MAP[it.track] || STRAT_TRACKS[0];
    const tasks = await getTasks();
    const used = new Set(list.map(x=>x.taskId).filter(Boolean).filter(id=>id!==it.taskId));
    let newId;
    const found = findTaskForStratItem(tasks, it, used);
    if(found){ newId = found.id; found.stratId = it.id; }
    else {
      newId = uid();
      tasks.push({id:newId, title:it.title, dept:tr.dept, stage:'s1', status:'todo',
        priority:'high', month: await stratToRoadmapMonth(halfToMonth(it.from)), assignee:it.owner||null, budget:0, stratId:it.id,
        desc:(it.note||'')+(it.note?'\n\n':'')+'Из стратегии: '+halfLabel(it.from)+' → '+halfLabel(it.to)});
    }
    saveTasks(tasks);
    it.taskId = newId; saveStratItems(list);
    rerender();
  };

  /* цели */
  container.querySelectorAll('[data-strat-mile]').forEach(b=>{
    b.addEventListener('pointerdown', (e)=>startMileDrag(e, b, rerender));
    b.addEventListener('keydown', async (e)=>{
      const step = e.key==='ArrowLeft' ? -1 : (e.key==='ArrowRight' ? 1 : 0);
      if(step){
        e.preventDefault();
        const list = await getStratMiles(); const m = list.find(x=>x.id===b.dataset.stratMile); if(!m) return;
        m.h = Math.max(0, Math.min(_stratMonths*2-1, m.h+step)); saveStratMiles(list); rerender();
      } else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openMileEditor(b.dataset.stratMile, null, rerender); }
      else if(e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); saveStratMiles((await getStratMiles()).filter(x=>x.id!==b.dataset.stratMile)); rerender(); }
    });
  });
  container.querySelectorAll('[data-add-mile]').forEach(b=>{
    b.onclick = ()=>openMileEditor(null, parseInt(b.dataset.addMile), rerender);
  });
}

function startStratDrag(e, bar, rerender){
  if(e.button!==undefined && e.button!==0) return;
  const row = bar.closest('.g-row');
  const lane = row && row.querySelector('.g-lane');
  if(!lane) return;
  const cols = _stratMonths*2;
  const laneRect = lane.getBoundingClientRect();
  const cellW = laneRect.width/cols;
  const mode = e.target.dataset && e.target.dataset.stratHandle
    ? (e.target.dataset.stratHandle==='l' ? 'resize-l' : 'resize-r') : 'move';
  const startX = e.clientX;
  const items = _cache['eva-club-strategy-items'] || [];
  const it = items.find(x=>x.id===bar.dataset.stratBar);
  if(!it) return;
  const from0 = it.from, to0 = it.to;
  let from = from0, to = to0, moved = false;

  bar.setPointerCapture(e.pointerId);
  bar.classList.add('dragging');

  const onMove = (ev)=>{
    const d = Math.round((ev.clientX-startX)/cellW);
    if(Math.abs(ev.clientX-startX) > 3) moved = true;
    if(mode==='move'){
      const len = to0-from0;
      from = Math.max(0, Math.min(cols-1-len, from0+d));
      to = from+len;
    } else if(mode==='resize-l'){
      from = Math.max(0, Math.min(to0, from0+d));
      to = to0;
    } else {
      from = from0;
      to = Math.max(from0, Math.min(cols-1, to0+d));
    }
    bar.style.gridColumn = `${2+from}/${3+to}`;
  };
  const onUp = ()=>{
    bar.releasePointerCapture(e.pointerId);
    bar.classList.remove('dragging');
    bar.removeEventListener('pointermove', onMove);
    bar.removeEventListener('pointerup', onUp);
    bar.removeEventListener('pointercancel', onUp);
    if(!moved){
      _stratOpen = _stratOpen===it.id ? null : it.id;
      _stratAdding = false;
      rerender();
      return;
    }
    if(from!==from0 || to!==to0){
      it.from = from; it.to = to;
      saveStratItems(items);
      syncLinkedTask(it).then(rerender);
      return;
    }
    rerender();
  };
  bar.addEventListener('pointermove', onMove);
  bar.addEventListener('pointerup', onUp);
  bar.addEventListener('pointercancel', onUp);
  e.preventDefault();
}

/* Месяц стратегии (1 = сентябрь 2026) → месяц дорожной карты. У доски
   своя привязка «месяц 1 = какой календарный»; без неё считаем, что
   доска начинается с августа 2026, как заведены её задачи. */
async function stratToRoadmapMonth(finM){
  let base = await getMonthsBase();
  if(base===null || base===undefined) base = ROADMAP_BASE_DEFAULT;
  return Math.max(1, FIN_BASE_ABS + (finM-1) - base + 1);
}
/* ------------------------------------------------------------
   ЗАДАЧИ БЕЗ ДУБЛЕЙ
   Одна ключевая задача стратегии = одна карточка на доске.
   Прежде чем заводить новую, ищем уже существующую: сначала по
   прямой связи, потом по метке стратегии, потом по названию.
   ------------------------------------------------------------ */
function normTaskTitle(s){
  return (s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/gi,' ').trim();
}
function findTaskForStratItem(tasks, it, used){
  used = used || new Set();
  if(it.taskId){
    const byId = tasks.find(t=>t.id===it.taskId);
    if(byId) return byId;
  }
  const byStrat = tasks.find(t=>t.stratId===it.id && !used.has(t.id));
  if(byStrat) return byStrat;
  const n = normTaskTitle(it.title);
  return tasks.find(t=>!used.has(t.id) && !t.stratId && normTaskTitle(t.title)===n) || null;
}
/* Насколько карточка «наполнена» — при слиянии дублей оставляем самую живую */
function taskWeight(t){
  return (t.budget>0?8:0) + ((t.desc||'').length>20?4:0) + ((t.ckp||'').length>10?2:0)
       + (t.status==='done'?6:(t.status==='doing'?3:0)) + (t.stratId?2:0) + (t.assignee?1:0)
       + ((t.commentThread||[]).length?3:0);
}
/* Группы карточек с одинаковым названием — это и есть дубли.
   Повторяющиеся по смыслу задачи в разных месяцах («Отчёт за месяц»)
   дублями не считаем: группа берётся только если хотя бы одна карточка
   пришла из стратегии либо все они стоят в одном месяце или на одном
   этапе — там одинаковое название всегда означает лишнюю копию. */
function duplicateTaskGroups(tasks){
  const by = {};
  tasks.forEach(t=>{
    const n = normTaskTitle(t.title);
    if(!n) return;
    (by[n] = by[n] || []).push(t);
  });
  return Object.values(by).filter(g=>{
    if(g.length<2) return false;
    if(g.some(t=>t.stratId)) return true;
    if(g.every(t=>(t.month||0)===(g[0].month||0))) return true;
    if(g.every(t=>(t.stage||'')===(g[0].stage||''))) return true;
    return false;
  });
}
/* Слить дубли: оставляем самую наполненную карточку, переносим в неё
   то, чего в ней нет, остальные убираем и переводим на неё ссылки. */
async function mergeDuplicateTasks(){
  const tasks = await getTasks();
  const groups = duplicateTaskGroups(tasks);
  if(!groups.length) return 0;
  const drop = new Set();
  const remap = {};
  groups.forEach(g=>{
    const sorted = g.slice().sort((a,b)=>taskWeight(b)-taskWeight(a));
    const keep = sorted[0];
    sorted.slice(1).forEach(x=>{
      if(!keep.budget && x.budget) keep.budget = x.budget;
      if(!keep.desc && x.desc) keep.desc = x.desc;
      if(!keep.ckp && x.ckp) keep.ckp = x.ckp;
      if(!keep.assignee && x.assignee) keep.assignee = x.assignee;
      if(!keep.stratId && x.stratId) keep.stratId = x.stratId;
      if(x.status==='done') keep.status = 'done';
      drop.add(x.id); remap[x.id] = keep.id;
    });
  });
  if(!drop.size) return 0;
  const left = tasks.filter(t=>!drop.has(t.id));
  /* чужие ссылки на убранные карточки переводим на оставшуюся */
  left.forEach(t=>{ if(t.blockedBy) t.blockedBy = [...new Set(t.blockedBy.map(id=>remap[id]||id))].filter(id=>!drop.has(id)); });
  saveTasks(left);
  const items = await getStratItems();
  let touched = false;
  items.forEach(i=>{ if(i.taskId && remap[i.taskId]){ i.taskId = remap[i.taskId]; touched = true; } });
  if(touched) saveStratItems(items);
  return drop.size;
}

/* Сдвинули ключевую задачу — двигаем и её задачу на доске. */
async function syncLinkedTask(it){
  if(!it.taskId) return;
  const tasks = await getTasks();
  const t = tasks.find(x=>x.id===it.taskId);
  if(!t) return;
  const m = await stratToRoadmapMonth(halfToMonth(it.from));
  if(t.month!==m){ t.month = m; saveTasks(tasks); }
}

/* Веха тянется мышью по половинам месяца; короткий клик открывает правку. */
function startMileDrag(e, el, rerender){
  if(e.button!==undefined && e.button!==0) return;
  const row = el.closest('.g-row');
  const track = row && row.querySelector('.g-mile-cells');
  if(!track) return;
  const cols = _stratMonths*2;
  const cellW = track.getBoundingClientRect().width/cols;
  const startX = e.clientX;
  const miles = _cache['eva-club-strategy-miles'] || [];
  const m = miles.find(x=>x.id===el.dataset.stratMile);
  if(!m) return;
  const h0 = m.h;
  let h = h0, moved = false;
  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');
  const onMove = (ev)=>{
    if(Math.abs(ev.clientX-startX) > 3) moved = true;
    h = Math.max(0, Math.min(cols-1, h0 + Math.round((ev.clientX-startX)/cellW)));
    el.style.gridColumn = `${2+h}/${3+h}`;
  };
  const onUp = ()=>{
    el.releasePointerCapture(e.pointerId);
    el.classList.remove('dragging');
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.removeEventListener('pointercancel', onUp);
    if(!moved){ openMileEditor(m.id, null, rerender); return; }
    if(h!==h0){ m.h = h; saveStratMiles(miles); }
    rerender();
  };
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  e.preventDefault();
}

/* Редакторы цели и ключевой точки — компактные модалки поверх ганта. */
function stratOverlay(inner, onClose){
  const old = document.getElementById('stratOverlay'); if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'tm-overlay'; el.id = 'stratOverlay';
  el.innerHTML = `<div class="tm-modal strat-modal">${inner}</div>`;
  document.body.appendChild(el);
  const close = ()=>{ el.remove(); if(onClose) onClose(); };
  el.addEventListener('click', (e)=>{ if(e.target===el) close(); });
  const x = el.querySelector('[data-modal-close]');
  if(x) x.onclick = close;
  return {el, close};
}
async function openMileEditor(mileId, month, rerender){
  const miles = await getStratMiles();
  const isNew = !mileId;
  const m = isNew ? {id:uid(), h:mkHalf(month||1, 0), title:''} : miles.find(x=>x.id===mileId);
  if(!m) return;
  const {el, close} = stratOverlay(`
    <div class="tm-header"><span class="tm-header-label">${isNew?'Новая ключевая точка':'Ключевая точка'}</span>
      <button class="tm-close" data-modal-close="1">✕</button></div>
    <div class="tm-body">
      <div class="field-row">
        <div class="field grow"><label>Название</label><input type="text" id="mlTitle" value="${esc(m.title)}" placeholder="Например, первая тысяча платящих"></div>
        <div class="field"><label>Месяц</label>
          <select id="mlMonth">${Array.from({length:_stratMonths},(_,i)=>i+1).map(x=>`<option value="${x}" ${halfToMonth(m.h)===x?'selected':''}>${finMonthLabel(x)}</option>`).join('')}</select></div>
        <div class="field"><label>Когда в месяце</label>
          <select id="mlHalf"><option value="0" ${!halfIsSecond(m.h)?'selected':''}>первая половина</option><option value="1" ${halfIsSecond(m.h)?'selected':''}>вторая половина</option></select></div>
      </div>
      <div class="tm-actions">
        <button class="btn" id="mlSave">${isNew?'Добавить точку':'Сохранить'}</button>
        ${isNew?'':'<button class="btn ghost" id="mlDel">Удалить точку</button>'}
      </div>
    </div>`);
  el.querySelector('#mlSave').onclick = async ()=>{
    const title = el.querySelector('#mlTitle').value.trim();
    if(!title){ el.querySelector('#mlTitle').focus(); return; }
    const list = await getStratMiles();
    const t = isNew ? m : list.find(x=>x.id===m.id);
    t.title = title;
    t.h = mkHalf(parseInt(el.querySelector('#mlMonth').value)||1, parseInt(el.querySelector('#mlHalf').value));
    if(isNew) list.push(t);
    saveStratMiles(list); close(); rerender();
  };
  const mlDel = el.querySelector('#mlDel');
  if(mlDel) mlDel.onclick = async ()=>{
    saveStratMiles((await getStratMiles()).filter(x=>x.id!==m.id)); close(); rerender();
  };
}

/* ============================================================
   ДЕНЬГИ ПОД ЦЕЛИ СТРАТЕГИИ
   Цели по продажам из ганта подставляются прямо в движок вместо
   формулы роста — поэтому выручка, налоги и расходы считаются
   ровно так же, как в основной модели, просто на нашем плане.
   Основную модель на 36 месяцев это не меняет.
   ============================================================ */
/* ============================================================
   СТАРТОВЫЙ БЮДЖЕТ ДО ЗАПУСКА
   Всё, что проект платит в первые месяцы, одной таблицей: люди
   с окладами и сроками, регулярные платежи, разовые и переменные.
   Правки пишутся в общий реестр расходов и в штат — те же данные,
   что считают модель, P&L и «сколько нужно на запуск».
   ============================================================ */
function budgetMonthSelect(name, id, value, months, allowEmpty){
  return `<select class="v-input bud-sel" data-bud-field="${name}" data-id="${id}">
    ${allowEmpty?`<option value="" ${!value?'selected':''}>бессрочно</option>`:''}
    ${Array.from({length:FIN_HORIZON},(_,i)=>i+1).map(m=>`<option value="${m}" ${value===m?'selected':''}>${finMonthLabel(m)}</option>`).join('')}
  </select>`;
}

async function stratBudgetHtml(model){
  const H      = STRAT_MONEY_HORIZON;
  const months = Array.from({length:H},(_,i)=>i+1);
  const exp    = await getExpenses();
  const hires  = await buildHires();
  const tax    = await getTaxCfg();
  const insRate = tax.it ? 0.076 : 0.30;

  const rows = [];
  /* --- люди --- */
  hires.filter(h=>h.salary>0 && h.month<=H).forEach(h=>{
    const arr = months.map(m=>(m>=h.month && (!h.until || m<=h.until)) ? h.salary*(1+insRate) : 0);
    rows.push({group:'people', id:h.id, real:h.real, name:h.role, dept:h.dept,
      amount:h.salary, from:h.month, to:h.until, arr, total:arr.reduce((a,b)=>a+b,0),
      note:`оклад ${money(h.salary)} + взносы ${cfPct(insRate)}`});
  });
  /* --- регулярные и разовые из реестра --- */
  exp.items.forEach(it=>{
    if(it.kind==='monthly'){
      const from = it.from||1;
      const arr = months.map(m=>monthlyAmountAt(it, m, FIN_HORIZON));
      if(from>H && !arr.some(v=>v>0)) return;
      rows.push({group:'monthly', id:it.id, name:it.name, cat:it.cat, amount:it.amount, byMonth:it.byMonth||{},
        from, to:it.to, arr, total:arr.reduce((a,b)=>a+b,0), note:`${money(it.amount)}/мес`});
    } else if(it.kind==='once'){
      const mm = it.month||1;
      if(mm>H) return;
      const arr = months.map(m=>m===mm ? (it.amount||0) : 0);
      rows.push({group:'once', id:it.id, taskId:it.taskId, name:it.name, cat:it.cat, amount:it.amount,
        from:mm, arr, total:it.amount||0, note: it.taskId ? 'бюджет задачи' : 'разово'});
    }
  });
  /* --- переменные: считаются от объёма, править можно только ставку --- */
  const varRows = exp.items.filter(it=>it.kind==='variable').map(it=>{
    const arr = months.map(m=>{
      const from = it.from||1, to = it.to||FIN_HORIZON;
      if(m<from || m>to) return 0;
      return registryVariableCost([it], {
        cashIn: model.cashIn[m], revenue: model.revenue[m], gmv: model.gmvAddon[m],
        active: model.active[m], newPaying: model.newPaying[m],
      }).total;
    });
    const d = it.driver||{}; const def = EXP_DRIVER_MAP[d.base]||{};
    return {group:'variable', id:it.id, name:it.name, cat:it.cat, arr, total:arr.reduce((a,b)=>a+b,0),
      note: def.unit==='pct' ? cfPct(d.rate||0)+' · '+(def.name||'') : num(d.rate||0)+' ₽ · '+(def.name||'')};
  }).filter(r=>r.total>0);

  const taxArr = months.map(m=>model.taxTotal[m]);
  const totals = months.map((m,i)=>
    rows.reduce((a,r)=>a+r.arr[i],0) + varRows.reduce((a,r)=>a+r.arr[i],0) + taxArr[i]);
  let cum = 0; const cumArr = totals.map(v=>(cum+=v));
  const grand = totals.reduce((a,b)=>a+b,0);
  const fotTotal  = rows.filter(r=>r.group==='people').reduce((a,r)=>a+r.total,0);
  const monTotal  = rows.filter(r=>r.group==='monthly').reduce((a,r)=>a+r.total,0);
  const onceTotal = rows.filter(r=>r.group==='once').reduce((a,r)=>a+r.total,0);
  const varTotal  = varRows.reduce((a,r)=>a+r.total,0) + taxArr.reduce((a,b)=>a+b,0);

  const cellFor = (v)=>`<td class="num">${v?cfMoney(v):'<span class="soft">—</span>'}</td>`;
  /* регулярный расход: каждая клетка месяца — поле, своё значение помечается */
  const cellEdit = (r, m, v)=>{
    const ov = r.byMonth && r.byMonth[m]!==undefined && r.byMonth[m]!==null && r.byMonth[m]!=='';
    return `<td class="num bud-cell ${ov?'overridden':''}">
      <input type="text" class="bud-month-input money-fmt-input" data-bud-month="${m}" data-id="${r.id}" value="${v?fmtThousands(v):''}" placeholder="—"
             title="${finMonthLabel(m)}: ${ov?'своё значение — очистите, чтобы вернуть базовую ставку':'базовая ставка, можно задать своё значение'}">
    </td>`;
  };
  const excluded = await getHireExcluded();
  const positionsAll = await getPositions();
  const excludedRows = positionsAll.filter(p=>p.status!=='archived' && excluded[p.id]);
  /* Шапка группы: сворачивается, показывает число строк и раскладку

  const groupHead = (key, title, hint, list, total)=>{
    const open = _budOpen[key]!==false;

      <td class="num">${cfMoney(total)}</td><td></td>

  const grp = (key, html)=>`<tbody class="bud-body ${_budOpen[key]===false?'collapsed':''}" data-bud-rows="${key}">${html}</tbody>`;

    <tr>
      <td><div class="pb-name">${esc(r.name)}</div><div class="pb-sub">${r.note}</div></td>
      <td><input type="text" class="v-input money-fmt-input bud-money" data-bud-field="salary" data-id="${r.id}" data-real="${!!r.real}" value="${fmtThousands(r.amount)}"></td>
      <td class="bud-period">
        ${budgetMonthSelect('hireFrom', r.id, r.from, months, false)}
        ${budgetMonthSelect('hireUntil', r.id, r.to, months, true)}
      </td>
      ${r.arr.map(cellFor).join('')}
      <td class="num hl">${cfMoney(r.total)}</td>
      <td>${r.real
        ? `<button class="btn ghost sm-del" data-bud-exclude-hire="${r.id}" title="Убрать из плана — человек останется в «Команде», вернуть можно ниже">✕</button>`
        : `<button class="btn ghost sm-del" data-bud-del-hire="${r.id}" title="Убрать">✕</button>`}</td>
    </tr>`).join('') + (excludedRows.length ? `
    <tr class="bud-excluded"><td colspan="${months.length+5}">
      <span class="soft">Убраны из плана:</span>
      ${excludedRows.map(p=>`<button type="button" class="pp-chip small" data-bud-restore-hire="${p.id}" title="Вернуть в план">${esc(p.title)} ↩</button>`).join(' ')}
    </td></tr>` : '');

  const editRow = (r)=>{
    /* бюджет задачи правится в карточке — здесь он только показан,
       иначе правки разъезжались бы с доской */
    if(r.taskId) return `
    <tr class="bud-from-task">
      <td><div class="pb-name">${esc(r.name.replace(/^Бюджет задачи:\s*/,''))}</div><div class="pb-sub">бюджет задачи · сумма и месяц берутся из карточки</div></td>
      <td class="num">${money(r.amount)}</td>
      <td class="soft">${finMonthLabel(r.from)}</td>
      ${r.arr.map(cellFor).join('')}
      <td class="num hl">${cfMoney(r.total)}</td>
      <td><button class="btn ghost sm-del" data-open-task="${r.taskId}" title="Открыть карточку задачи">↗</button></td>
    </tr>`;
    return `
    <tr>
      <td><input type="text" class="v-input bud-name" data-bud-field="name" data-id="${r.id}" value="${esc(r.name)}"></td>
      <td><input type="text" class="v-input money-fmt-input bud-money" data-bud-field="amount" data-id="${r.id}" value="${fmtThousands(r.amount)}"></td>
      <td class="bud-period">
        ${r.group==='once'
          ? budgetMonthSelect('onceMonth', r.id, r.from, months, false)
          : budgetMonthSelect('expFrom', r.id, r.from, months, false)+budgetMonthSelect('expTo', r.id, r.to, months, true)}
      </td>
      ${r.group==='monthly' ? months.map((m,i)=>cellEdit(r, m, r.arr[i])).join('') : r.arr.map(cellFor).join('')}
      <td class="num hl">${cfMoney(r.total)}</td>
      <td><button class="btn ghost sm-del" data-bud-del-exp="${r.id}" title="Убрать">✕</button></td>
    </tr>`;
  };

  const varRowsHtml = varRows.map(r=>`
    <tr class="bud-var">

      ${r.arr.map(cellFor).join('')}
      <td class="num hl">${cfMoney(r.total)}</td>

  return `

      ${metricCards([
