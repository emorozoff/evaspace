/* Оболочка и маршруты. Адрес страницы — простое слово после #:
   #home, #strategy, #tasks, #money, #reports, #team, #m-standards (материал).
   Данные приходят вживую — страница перерисовывается сама, но не тогда,
   когда человек печатает в поле: дождёмся, пока он закончит. */

const App = {
  pages: {},
  shell: false,
  cur: null,
  _t: null,
  _pending: false,
  _pointer: false,

  register(id, page) { this.pages[id] = page; },

  start() {
    Store.subscribe(() => this.renderSoon());
    Store.onStatus(s => this.paintSync(s));
    window.addEventListener('hashchange', () => this.render());
    document.addEventListener('pointerdown', () => { this._pointer = true; }, true);
    document.addEventListener('pointerup', () => { this._pointer = false; if (this._pending) this.renderSoon(); }, true);
    document.addEventListener('focusout', () => { if (this._pending) this.renderSoon(250); });
    wireCharts();
    this.render();
  },

  parse() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h.startsWith('m-')) return {id: 'material', param: h.slice(2)};
    return {id: h || 'home', param: null};
  },
  go(hash) { if (location.hash === '#' + hash) this.render(); else location.hash = hash; },

  typing() {
    const a = document.activeElement, page = $('#page');
    return !!(page && a && page.contains(a) && a.matches('input:not([type=checkbox]):not([type=radio]), textarea, select'));
  },
  renderSoon(delay = 60) {
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      if (this.typing() || this._pointer) { this._pending = true; return; }
      this._pending = false;
      this.render();
    }, delay);
  },

  render(opts = {}) {
    const root = $('#app');
    const me = Auth.me();
    if (!me) {
      /* экран входа не перерисовываем от чужих правок — только если штаб перестал быть пустым */
      const mode = Store.count('accounts') ? 'has' : 'empty';
      if (!opts.force && $('#authRoot') && this._authMode === mode) return;
      this._authMode = mode;
      this.shell = false;
      this.cur = null;
      root.innerHTML = '<div class="auth-page" id="authRoot"></div>';
      renderAuth($('#authRoot'));
      return;
    }
    let {id, param} = this.parse();
    const nav = NAV.find(n => n.id === id);
    if (!this.pages[id] || (nav && nav.perm && !Auth.can(nav.perm))) { id = 'home'; param = null; }
    if (!this.shell) this.buildShell();
    this.paintNav(id);
    /* свежий контейнер на каждую отрисовку: старые обработчики событий уходят вместе с ним */
    const prev = $('#page');
    const page = prev.cloneNode(false);
    prev.replaceWith(page);
    const key = id + ':' + (param || '');
    const y = window.scrollY;
    page.dataset.page = id;
    this.pages[id].render(page, param);
    if (this.cur === key) window.scrollTo(0, y);
    else window.scrollTo(0, 0);
    this.cur = key;
    if (opts.focus) { const el = document.getElementById(opts.focus); if (el) el.focus(); }
    document.title = (id === 'home' ? '' : (this.pages[id].title || '') + ' · ') + 'Штаб Eva Club V2';
  },

  buildShell() {
    $('#app').innerHTML = `<div class="shell">
      <aside class="side">
        <a class="brand" href="#home">${starSvg('brand-mark')}<div><b>Eva Club</b><span>штаб команды · V2</span></div></a>
        <nav class="nav" id="nav" aria-label="Разделы"></nav>
        <div class="side-foot">
          <div class="sync" id="sync"><i></i><span></span></div>
          <div class="me-chip" id="meChip"></div>
        </div>
      </aside>
      <main class="main"><div class="page" id="page"></div></main>
    </div>`;
    on($('#meChip'), 'click', '[data-logout]', () => Auth.logout());
    this.shell = true;
    this.paintSync(Store.state);
  },

  paintNav(active) {
    const items = NAV.filter(n => !n.perm || Auth.can(n.perm));
    $('#nav').innerHTML = items.map(n => {
      const b = n.id === 'tasks' ? taskBadge() : 0;
      return `<a href="#${n.id}" class="${n.id === active || (active === 'material' && n.id === 'home') ? 'on' : ''}">${icon(n.icon)}<span>${n.name}</span>${b ? `<span class="badge" title="Требуют внимания">${b}</span>` : ''}</a>`;
    }).join('');
    const me = Auth.me(), p = Auth.person();
    $('#meChip').innerHTML = `${avatar(p || {name: me.name})}<div class="who"><b>${esc(me.name)}</b><span>${ROLES[roleOf(me.role)].name}</span></div>
      <button data-logout title="Выйти" aria-label="Выйти">${icon('logout')}</button>`;
  },

  paintSync(s) {
    const el = $('#sync');
    if (!el) return;
    let cls = '', text = 'Общая база · сохранено';
    if (s.mode === 'local') { cls = 'local'; text = 'Только этот браузер'; }
    else if (s.pending) { cls = 'busy'; text = 'Сохраняю…'; }
    else if (s.readOnly) { cls = 'err'; text = 'Только просмотр'; }
    else if (s.error) { cls = 'err'; text = 'Не сохранилось'; }
    el.className = 'sync ' + cls;
    $('span', el).textContent = text;
    el.title = s.mode === 'local'
      ? 'Штаб открыт не в артефакте Claude: данные живут только в этом браузере'
      : 'Все правки сразу видны команде';
  },
};

/* ── 06-model.js ── */
/* Расчёты для главной, денег и отчётов — в одном месте, чтобы цифры везде
   совпадали. Продажа = первая оплата подписки. Выручка дня считается сама:
   (оплаты + продления) × цена, если её не поправили руками. */

/* ── продажи ── */
function revenueOf(s) {
  const own = s.revenue;
  if (own !== undefined && own !== null && own !== '') return Number(own) || 0;
  return ((Number(s.pays) || 0) + (Number(s.renewals) || 0)) * settings().price;
}
const Sales = {
  list() { return Store.all('sales').filter(s => /^\d{4}-\d\d-\d\d$/.test(s.id)).sort((a, b) => (a.id < b.id ? -1 : 1)); },
  day(iso) { return Store.get('sales', iso); },
  agg(list) {
    const price = settings().price;
    const a = {reach: 0, regs: 0, pays: 0, renewals: 0, revenue: 0, revNew: 0, revRenew: 0, experts: 0, mk: 0, days: 0};
    list.forEach(s => {
      a.reach += Number(s.reach) || 0;
      a.regs += Number(s.regs) || 0;
      a.pays += Number(s.pays) || 0;
      a.renewals += Number(s.renewals) || 0;
      const rev = revenueOf(s), renew = Math.min(rev, (Number(s.renewals) || 0) * price);
      a.revenue += rev;
      a.revRenew += renew;
      a.revNew += rev - renew;
      a.experts += Number(s.experts) || 0;
      a.mk += Number(s.mk) || 0;
      a.days++;
    });
    return a;
  },
  range(from, to) { return this.agg(this.list().filter(s => s.id >= from && s.id <= to)); },
  month(m) { return this.range(monthStart(m), monthEnd(m)); },
};

/* ── план продаж ── */
const Plan = {
  /* продажи месяца по сценарию; сентябрь — подготовка, плана нет */
  sales(sc, m) { return Q.months.includes(m) ? scenarioSales(sc)[m] : 0; },
  day(sc, iso) { const m = monthOf(iso); return this.sales(sc, m) / daysInMonth(m); },
  range(sc, from, to) {
    let s = 0;
    for (let d = from; d <= to; d = addDays(d, 1)) s += this.day(sc, d);
    return s;
  },
  regs(sales) { return sales / (settings().convPay || 0.05); },
  reach(sales) { return this.regs(sales) / (settings().convReg || 0.02); },
  total(sc) { return sum(Q.months, m => this.sales(sc, m)); },
  /* цепочка по плану: новые + продления при удержании */
  chain(sc) {
    const s = settings();
    let payers = 0;
    return CF_MONTHS.map(m => {
      const fresh = this.sales(sc, m);
      const renewals = payers * s.retention;
      payers = fresh + renewals;
      return {m, fresh, renewals, revNew: fresh * s.price, revRenew: renewals * s.price};
    });
  },
};

/* ход квартала: сколько продано, где должны быть, куда идём */
function quarterPace(sc) {
  const t = today();
  const started = t >= Q.start, over = t > Q.end;
  const to = over ? Q.end : t;
  const fact = started ? Sales.range(Q.start, to).pays : 0;
  const planToDate = started ? Plan.range(sc, Q.start, to) : 0;
  const total = Plan.total(sc);
  const daysAll = daysBetween(Q.start, Q.end) + 1;
  const daysGone = started ? daysBetween(Q.start, to) + 1 : 0;
  const daysLeft = daysAll - daysGone;
  const projected = daysGone ? Math.round(fact / daysGone * daysAll) : 0;
  const needPerDay = daysLeft > 0 ? Math.max(0, (total - fact) / daysLeft) : 0;
  let heading = 'ниже минимума';
  if (projected >= Plan.total('max')) heading = 'на «Прорыв»';
  else if (projected >= Plan.total('goal')) heading = 'на «Цель»';
  else if (projected >= Plan.total('min')) heading = 'на «Минимум»';
  return {started, over, fact, planToDate, total, daysAll, daysGone, daysLeft, projected, needPerDay, heading,
    toStart: started ? 0 : daysBetween(t, Q.start)};
}
/* премия команды: 30% чистого дохода (выручка первых платежей минус реферальные 30%) */
function premiumOf(salesCount, revNew) {
  const s = settings();
  if (salesCount < s.premiumMin) return 0;
  return revNew * (1 - s.referral) * s.premium;
}

/* ── деньги ── */
const Money = {
  ledger() { return Store.all('ledger').sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || 0) - (a.at || 0))); },
  month(m) {
    const t = {in: 0, out: 0, invest: 0, cats: {in: {}, out: {}, invest: {}}};
    Store.all('ledger').forEach(e => {
      if (monthOf(e.date) !== m || !KINDS[e.kind]) return;
      const a = Number(e.amount) || 0;
      t[e.kind] += a;
      t.cats[e.kind][e.cat] = (t.cats[e.kind][e.cat] || 0) + a;
    });
    return t;
  },
  planItems() {
    const order = {payroll: 0, regular: 1, once: 2};
    return Store.all('plan').sort((a, b) => (order[a.group] ?? 3) - (order[b.group] ?? 3) || (a.months || [])[0]?.localeCompare((b.months || [])[0] || '') || (b.amount || 0) - (a.amount || 0));
  },
  planAmount(item, m) {
    if (!(item.months || []).includes(m)) return 0;
    const base = Number(item.amount) || 0;
    return item.group === 'payroll' && item.insurance !== false ? Math.round(base * (1 + settings().insurance)) : base;
  },
  paid(item, m) { return Store.all('ledger').find(e => e.planId === item.id && e.planMonth === m) || null; },
  /* план расходов месяца по статьям: всего и ещё не оплачено */
  planByCat(m) {
    const all = {}, unpaid = {};
    this.planItems().forEach(it => {
      const a = this.planAmount(it, m);
      if (!a) return;
      const cat = it.group === 'payroll' ? 'payroll' : (it.cat || 'other');
      all[cat] = (all[cat] || 0) + a;
      if (!this.paid(it, m)) unpaid[cat] = (unpaid[cat] || 0) + a;
    });
    return {all, unpaid};
  },
  /* деньги на счёте: старт + приходы + вложения + выручка − расходы после даты старта */
  cashNow() {
    const s = settings(), t = today();
    let cash = Number(s.cashStart) || 0;
    Store.all('ledger').forEach(e => {
      if (e.date < s.cashDate || e.date > t) return;
      const a = Number(e.amount) || 0;
      cash += e.kind === 'out' ? -a : a;
    });
    cash += Sales.range(s.cashDate, t).revenue;
    return cash;
  },
};

const VAR_CATS = ['referral', 'acquiring', 'tax'];
const FIXED_CATS = Object.keys(OUT_CATS).filter(c => !VAR_CATS.includes(c));

/* ── Cash Flow до Нового года: прошлые месяцы — факт, текущий — факт плюс
   остаток плана, будущие — план. Выручка — по выбранному сценарию. ── */
function cashFlow(sc) {
  const s = settings(), t = today(), cur = monthOf(t);
  let open = Number(s.cashStart) || 0;
  let prevPayers = 0;
  return CF_MONTHS.map(m => {
    const status = m < cur ? 'fact' : m === cur ? 'now' : 'plan';
    const f = Sales.month(m), led = Money.month(m), plan = Money.planByCat(m);
    const planFresh = Plan.sales(sc, m);
    let fresh, renewCount, revNew, revRenew;
    if (status === 'fact') {
      fresh = f.pays; renewCount = f.renewals; revNew = f.revNew; revRenew = f.revRenew;
    } else {
      const restDays = status === 'now' ? Math.max(0, daysBetween(t, monthEnd(m))) : daysInMonth(m);
      const restPlan = planFresh * restDays / daysInMonth(m);
      fresh = f.pays + restPlan;
      renewCount = Math.max(f.renewals, prevPayers * s.retention);
      revNew = f.revNew + restPlan * s.price;
      revRenew = Math.max(f.revRenew, renewCount * s.price);
    }
    prevPayers = fresh + renewCount;
    const otherIn = led.in;
    const invest = status === 'fact' ? led.invest : Math.max(led.invest, Number((s.invest || {})[m]) || 0);
    const revenue = revNew + revRenew;
    const out = {};
    FIXED_CATS.forEach(c => {
      out[c] = (led.cats.out[c] || 0) + (status === 'fact' ? 0 : (plan.unpaid[c] || 0));
    });
    const varBase = {referral: revNew * s.referral, acquiring: revenue * s.acquiring, tax: revenue * s.taxRate};
    VAR_CATS.forEach(c => {
      out[c] = status === 'fact' ? (led.cats.out[c] || 0) : Math.max(led.cats.out[c] || 0, varBase[c]);
    });
    const inTotal = revenue + otherIn;
    const outTotal = sum(Object.values(out));
    const close = open + inTotal + invest - outTotal;
    const row = {m, status, open, fresh, renewCount, revNew, revRenew, otherIn, invest, out, inTotal, outTotal, net: inTotal + invest - outTotal, close};
    open = close;
    return row;
  });
}

/* ── P&L по месяцам: факт и план ── */
function pnl(sc) {
  const s = settings();
  const chain = Plan.chain(sc);
  return CF_MONTHS.map((m, i) => {
    const f = Sales.month(m), led = Money.month(m), plan = Money.planByCat(m);
    const c = chain[i];
    const factOut = {...led.cats.out};
    const planRev = c.revNew + c.revRenew;
    const planOut = {...plan.all, referral: c.revNew * s.referral, acquiring: planRev * s.acquiring, tax: planRev * s.taxRate};
    const fact = {subs: f.revenue, other: led.in, out: factOut, outTotal: led.out, invest: led.invest};
    fact.income = fact.subs + fact.other;
    fact.profit = fact.income - fact.outTotal;
    const pl = {subs: planRev, other: 0, out: planOut, outTotal: sum(Object.values(planOut))};
    pl.income = pl.subs;
    pl.profit = pl.income - pl.outTotal;
    return {m, fact, plan: pl};
  });
}

   темп квартала и материалы — стандарты и презентации. Состав зависит

function paceChart(sc) {
  const days = [];
  for (let d = Q.start; d <= Q.end; d = addDays(d, 1)) days.push(d);
  const t = today();
  const plans = Object.keys(SCENARIOS).map(k => {
    let acc = 0;
    return {k, values: days.map(d => { acc += Plan.day(k, d); return Math.round(acc); })};
  });
  const byDay = byKey(Sales.list(), 'id');
  let acc = 0;
  const fact = days.map(d => { if (d > t) return null; acc += Number((byDay[d] || {}).pays) || 0; return acc; });
  const labels = days.map(d => ({text: dayLong(d), tick: d.endsWith('-01') ? dayShort(d) : d === Q.end ? dayShort(d) : ''}));
  const series = plans.reverse().map(p => ({
    values: p.values, color: 'var(--ink-2)', dash: true, width: p.k === sc ? 2 : 1.5, opacity: p.k === sc ? 1 : 0.45,
    endLabel: `${SCENARIOS[p.k].name} ${fmt(Plan.total(p.k))}`, legend: p.k === sc ? `План «${SCENARIOS[p.k].name}»` : '',
  }));
  if (t >= Q.start) series.push({values: fact, color: 'var(--rose)', area: true, dot: true, width: 2.5, legend: 'Продано', endLabel: t <= Q.end ? `${fmt(acc)} сейчас` : '', labelAbove: true});
  else series.push({values: fact.map(() => null), color: 'var(--rose)', legend: 'Продано'});
  return lineChart({labels, series, height: 250});
}

/* ── 20-strategy.js ── */
/* Стратегия без лишнего: пять целей квартала, план продаж по сценариям,
   дорожная карта года, три кита и ритм команды. Правит основатель,
   пункты целей отмечают основатель и руководители. */

const GANTT_START = '2026-09';   // полумесяц 0 = первая половина сентября 2026
const GANTT_HALVES = 34;         // до конца января 2028
const hMonth = h => addMonths(GANTT_START, Math.floor(h / 2));
const hLabel = h => `${h % 2 ? 'вторая' : 'первая'} половина ${MONTHS_GEN[monthIdx(hMonth(h))]} ${hMonth(h).slice(0, 4)}`;
const hOfDate = iso => { const [y, m, d] = iso.split('-').map(Number); return (y - 2026) * 24 + (m - 9) * 2 + (d > 15 ? 1 : 0); };

const GOAL_STATUS = {
  '':      {name: 'Не начато',  tone: ''},
  ontrack: {name: 'В графике',  tone: 'good'},
  behind:  {name: 'Отстаём',    tone: 'bad'},
  done:    {name: 'Сделано',    tone: 'violet'},
};
const ITEM_STATUS = {plan: 'В плане', doing: 'Идёт', done: 'Сделано'};

/* ритм команды — одинаков каждую неделю */
const RHYTHM = [
  {when: 'Каждый понедельник, 11:00', what: 'Созвон 45 минут: цифры недели → по направлениям → неделя вперёд → отчёты → идеи и решения', rule: 'Цифры продаж — в «Отчётах» до 11:00. Без цифр направление не выступает.'},
  {when: 'Последний понедельник месяца', what: 'Сверка месяца: шесть показателей план-факт, статус пяти целей, что меняем, деньги и штаб', rule: 'Таблица сверки собрана в «Отчётах» → «Месяц».'},
  {when: 'Первая неделя января', what: 'Кварталка: личная оценка, коэффициент компании, премия, стратегия на следующий квартал', rule: 'Меньше 60 продаж за квартал — премии нет ни у кого.'},
];
function nextCall() {
  const t = today();
  let d = t;
  while (weekday(d) !== 0) d = addDays(d, 1);
  return d;
}
function lastMonday(m) {
  let d = monthEnd(m);
  while (weekday(d) !== 0) d = addDays(d, -1);
  return d;
}
function nextReview() {
  const t = today();
  let d = lastMonday(monthOf(t));
  if (d < t) d = lastMonday(addMonths(monthOf(t), 1));
  return d;
}

const Strategy = {
  doc() { return Store.get('docs', 'strategy') || {}; },
  save(partial) { return Store.patch('docs', 'strategy', partial); },
  goals() { return Object.entries(this.doc().goals || {}).map(([id, g]) => ({...g, id})).filter(g => !g.deleted).sort((a, b) => (a.order ?? 99) - (b.order ?? 99)); },
  goal(id) { const g = (this.doc().goals || {})[id]; return g && !g.deleted ? {...g, id} : null; },
  items() { return Object.entries(this.doc().items || {}).map(([id, x]) => ({...x, id})).filter(x => !x.deleted).sort((a, b) => a.from - b.from || a.to - b.to); },
  miles() { return Object.entries(this.doc().miles || {}).map(([id, x]) => ({...x, id})).filter(x => !x.deleted).sort((a, b) => a.h - b.h); },
  stages() { return this.doc().stages || []; },
  drivers() { return this.doc().drivers || {}; },
  whales() { return this.doc().whales || {}; },
};

          const open = allTasks.filter(t => t.dir === k && Tasks.isOpen(t));

            <p>${esc(d.about)}</p>
            <div class="whale-m"><span class="label">Метрика недели</span>${esc(d.metric)}</div>
            <div class="whale-lead">${canEdit
              ? `<select class="select sm" data-whale="${k}" aria-label="Ведущий"><option value="">Ведущий не назначен</option>${people().map(p => `<option value="${p.id}" ${lead && lead.id === p.id ? 'selected' : ''}>${esc(personName(p))}</option>`).join('')}</select>`

      <section class="section">

    wireHelp(root);
    on(root, 'change', '[data-goal-item]', (e, el) => {
      const [gid, k] = el.dataset.goalItem.split(':');

      const items = clone(g.items || []);
      items[k].done = el.checked;
      Strategy.save({goals: {[gid]: {items}}});
    });
    on(root, 'change', '[data-goal-st]', (e, el) => Strategy.save({goals: {[el.dataset.goalSt]: {status: el.value}}}));
    on(root, 'click', '[data-goal-edit]', (e, el) => editGoal(el.dataset.goalEdit));
    on(root, 'click', '[data-goal-add]', () => editGoal(null));
    on(root, 'click', '[data-goal-tasks]', (e, el) => { View.set('t.goal', el.dataset.goalTasks); View.set('t.who', 'all'); View.set('t.chip', 'all'); App.go('tasks'); });
    on(root, 'click', '[data-dir-tasks]', (e, el) => { View.set('t.dir', el.dataset.dirTasks); View.set('t.who', 'all'); View.set('t.chip', 'open'); View.set('t.goal', ''); App.go('tasks'); });
    on(root, 'change', 'input[name=scPick]', (e, el) => { saveSettings({scenario: el.value}); toast(`План ведём по сценарию «${SCENARIOS[el.value].name}»`); });
    on(root, 'click', '[data-sc-edit]', () => editScenarios());
    on(root, 'change', '[data-whale]', (e, el) => Strategy.save({whales: {[el.dataset.whale]: {lead: el.value || null}}}));
    on(root, 'click', '[data-item]', (e, el) => openItem(el.dataset.item));
    on(root, 'click', '[data-item-add]', () => openItem(null));
    on(root, 'click', '[data-mile]', (e, el) => canEdit && editMile(el.dataset.mile));
    on(root, 'click', '[data-mile-add]', () => editMile(null));
  },
});

/* ── гант: месяцы по полумесяцам, этапы года, вехи, работы по направлениям ── */
function ganttHtml(allTasks) {
  const items = Strategy.items(), miles = Strategy.miles(), stages = Strategy.stages();
  const months = [];
  for (let h = 0; h < GANTT_HALVES; h += 2) months.push(hMonth(h));
  const nowH = hOfDate(today());
  const col = h => `grid-column:${h + 2} / span 1`;
  const span = (a, b) => `grid-column:${clamp(a, 0, GANTT_HALVES - 1) + 2} / ${clamp(b, 0, GANTT_HALVES - 1) + 3}`;
  let rows = `<div class="g-lab g-head">Месяц</div>${months.map((m, i) => `<div class="g-month ${m.endsWith('-01') ? 'year' : ''}" style="grid-column:${i * 2 + 2} / span 2">${monthShort(m)}${m.endsWith('-01') ? `<small>${m.slice(0, 4)}</small>` : ''}</div>`).join('')}`;
  if (stages.length) {
    rows += `<div class="g-lab">Этапы года</div>` + stages.map((st, i) => {
      const a = hOfDate(st.from + '-01'), b = hOfDate(monthEnd(st.to)) ;
      const here = nowH >= a && nowH <= b;
      return `<div class="g-stage s${i % 3} ${here ? 'here' : ''}" style="${span(a, b)}" title="${esc(st.text || '')}"><b>${esc(st.title)}</b>${here ? '<small>мы здесь</small>' : ''}</div>`;
    }).join('');
  }
  if (miles.length) {
    rows += `<div class="g-lab">Вехи</div><div class="g-miles" style="grid-column:2 / ${GANTT_HALVES + 2}">${miles.map((ml, i) =>
      `<button class="g-mile lane${i % 3} ${ml.h <= nowH ? 'past' : ''}" data-mile="${ml.id}" style="left:${((ml.h + 0.5) / GANTT_HALVES * 100).toFixed(2)}%" title="${esc(ml.title)} · ${hLabel(ml.h)}"><i></i><span>${esc(ml.title)}</span></button>`).join('')}</div>`;
  }
  Object.entries(DIRS).forEach(([k, d]) => {
    const list = items.filter(x => (x.dir || 'ops') === k);
    if (!list.length) return;
    rows += `<div class="g-dir" style="--c:${d.color}">${d.name}</div>`;
    list.forEach(x => {
      const linked = allTasks.filter(t => t.stratId === x.id);
      const done = linked.filter(t => t.status === 'done').length;
      rows += `<div class="g-lab g-item-lab" title="${esc(x.title)}">${esc(x.title)}</div>
        <button class="g-bar ${x.status || 'plan'}" data-item="${x.id}" style="${span(x.from, x.to)};--c:${d.color}" title="${esc(x.title)} · ${hLabel(x.from)} → ${hLabel(x.to)}">
          <span>${esc(x.title)}</span>${linked.length ? `<em>${done}/${linked.length}</em>` : ''}</button>`;
    });
  });
  if (!items.length && !stages.length && !miles.length) return '<div class="empty"><b>Дорожная карта пуста</b>Основатель добавит этапы и работы.</div>';
  /* положение «сегодня» внутри полумесяца: 1–15 число и 16–конец месяца */
  const dd = Number(today().slice(8)), dim = daysInMonth(monthOf(today()));
  const nowPos = nowH + (dd <= 15 ? (dd - 1) / 15 : (dd - 16) / (dim - 15));
  const nowLine = nowH >= 0 && nowH < GANTT_HALVES ? `<div class="g-now" style="left:calc(var(--lab) + (100% - var(--lab)) * ${(nowPos / GANTT_HALVES).toFixed(4)})" title="Сегодня, ${dayLong(today())}"></div>` : '';
  return `<div class="gantt-wrap"><div class="gantt" style="grid-template-columns:var(--lab) repeat(${GANTT_HALVES}, minmax(22px, 1fr))">${rows}${nowLine}</div></div>
    <div class="legend g-legend"><span><i style="background:var(--ink-3)"></i>В плане</span><span><i style="background:var(--violet)"></i>Идёт</span><span><i style="background:var(--good)"></i>Сделано</span><span><i class="g-leg-now"></i>Сегодня</span></div>`;
}

const halfOptions = cur => {
  let o = '';
  for (let h = 0; h < GANTT_HALVES; h++) o += `<option value="${h}" ${h === cur ? 'selected' : ''}>${cap(hLabel(h))}</option>`;
  return o;
};

function openItem(id) {
  const x = id ? Strategy.items().find(i => i.id === id) : null;
  const canEdit = Auth.can('strategy.edit');
  const linked = x && Auth.can('tasks.view') ? Tasks.sort(Tasks.all().filter(t => t.stratId === x.id)) : [];
  const tasksHtml = x ? `<div><div class="label">Связанные задачи</div>${linked.length ? `<div class="t-list mini">${linked.map(taskRow).join('')}</div>` : '<p class="note">Задач пока нет. Привяжите задачу к этапу в её карточке.</p>'}</div>` : '';
  if (!canEdit) {
    openModal({title: x.title, body: `<p class="soft">${dirName(x.dir)} · ${cap(hLabel(x.from))} → ${hLabel(x.to)} · ${ITEM_STATUS[x.status || 'plan']}</p>${x.note ? `<p>${esc(x.note)}</p>` : ''}${tasksHtml}`,
      onMount: el => wireTaskCards(el)});
    return;
  }
  const v = x || {title: '', dir: 'product', from: Math.max(0, hOfDate(today())), to: Math.max(1, hOfDate(today()) + 3), status: 'plan', note: ''};
  openModal({
    title: x ? 'Работа на дорожной карте' : 'Новая работа',
    body: `<label class="field"><span>Название</span><input class="input" id="giTitle" value="${esc(v.title)}"></label>
      <div class="grid3">
        <label class="field"><span>Направление</span><select class="select" id="giDir">${Object.entries(DIRS).map(([k, d]) => `<option value="${k}" ${k === v.dir ? 'selected' : ''}>${d.name}</option>`).join('')}</select></label>
        <label class="field"><span>Начало</span><select class="select" id="giFrom">${halfOptions(v.from)}</select></label>
        <label class="field"><span>Конец</span><select class="select" id="giTo">${halfOptions(v.to)}</select></label>
      </div>
      <label class="field"><span>Статус</span><select class="select" id="giSt">${Object.entries(ITEM_STATUS).map(([k, n]) => `<option value="${k}" ${k === (v.status || 'plan') ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="field"><span>Пояснение</span><textarea class="textarea" id="giNote" rows="2">${esc(v.note || '')}</textarea></label>
      ${tasksHtml}`,
    foot: `${x ? `<button class="btn danger left" id="giDel">${icon('trash')}Удалить</button>` : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" id="giSave">Сохранить</button>`,
    wide: !!linked.length,
    onMount(el, close) {
      wireTaskCards(el);
      $('#giSave', el).onclick = () => {
        const title = $('#giTitle', el).value.trim();
        if (!title) { $('#giTitle', el).focus(); return; }
        let from = Number($('#giFrom', el).value), to = Number($('#giTo', el).value);
        if (to < from) [from, to] = [to, from];
        Strategy.save({items: {[x ? x.id : uid()]: {title, dir: $('#giDir', el).value, from, to, status: $('#giSt', el).value, note: $('#giNote', el).value, deleted: false}}});
        close();
      };
      const del = $('#giDel', el);
      if (del) del.onclick = async () => {
        if (!(await confirmPop(del, {text: 'Убрать работу с дорожной карты?', yes: 'Да, убрать', danger: true}))) return;
        Strategy.save({items: {[x.id]: {deleted: true}}});
        close();
        toast('Работа убрана', {undo: () => Strategy.save({items: {[x.id]: {deleted: false}}})});
      };
    },
  });
}

function editMile(id) {
  const ml = id ? Strategy.miles().find(m => m.id === id) : null;
  const v = ml || {title: '', h: Math.max(0, hOfDate(today()) + 2)};
  openModal({
    title: ml ? 'Веха' : 'Новая веха',
    body: `<label class="field"><span>Что должно случиться</span><input class="input" id="gmTitle" value="${esc(v.title)}" placeholder="Например: первые 100 платящих"></label>
      <label class="field"><span>Когда</span><select class="select" id="gmH">${halfOptions(v.h)}</select></label>`,
    foot: `${ml ? `<button class="btn danger left" id="gmDel">${icon('trash')}Удалить</button>` : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" id="gmSave">Сохранить</button>`,
    onMount(el, close) {
      $('#gmSave', el).onclick = () => {
        const title = $('#gmTitle', el).value.trim();
        if (!title) return $('#gmTitle', el).focus();
        Strategy.save({miles: {[ml ? ml.id : uid()]: {title, h: Number($('#gmH', el).value), deleted: false}}});
        close();
      };
      const del = $('#gmDel', el);
      if (del) del.onclick = async () => {
        if (!(await confirmPop(del, {text: 'Удалить веху?', yes: 'Да, удалить', danger: true}))) return;
        Strategy.save({miles: {[ml.id]: {deleted: true}}});
        close();
      };
    },
  });
}

function editGoal(id) {
  const g = id ? Strategy.goal(id) : null;
  const v = g || {short: '', title: '', result: '', items: []};
  openModal({
    title: g ? 'Цель квартала' : 'Новая цель',
    body: `<div class="grid2"><label class="field"><span>Коротко</span><input class="input" id="ggShort" value="${esc(v.short)}" placeholder="Запуск"></label>
      <label class="field"><span>Направление</span><select class="select" id="ggDir"><option value="">—</option>${Object.entries(DIRS).map(([k, d]) => `<option value="${k}" ${k === v.dir ? 'selected' : ''}>${d.name}</option>`).join('')}</select></label></div>
      <label class="field"><span>Цель целиком</span><input class="input" id="ggTitle" value="${esc(v.title)}" placeholder="Компания, оплаты и платформа на рабочем адресе"></label>
      <label class="field"><span>Пункты — по одному в строке</span><textarea class="textarea" id="ggItems" rows="4">${esc((v.items || []).map(x => x.t).join('\n'))}</textarea><small>Отметки у существующих пунктов сохранятся.</small></label>
      <label class="field"><span>Результат — как проверим одним вопросом</span><input class="input" id="ggResult" value="${esc(v.result || '')}" placeholder="Женщина регистрируется и оплачивает сама"></label>`,
    foot: `${g ? `<button class="btn danger left" id="ggDel">${icon('trash')}Удалить</button>` : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" id="ggSave">Сохранить</button>`,
    onMount(el, close) {
      $('#ggSave', el).onclick = () => {
        const short = $('#ggShort', el).value.trim(), title = $('#ggTitle', el).value.trim();
        if (!short && !title) return $('#ggShort', el).focus();
        const old = Object.fromEntries((v.items || []).map(x => [x.t, x.done]));
        const items = $('#ggItems', el).value.split('\n').map(s => s.trim()).filter(Boolean).map(t => ({t, done: !!old[t]}));
        const gid = g ? g.id : uid();
        const order = g ? g.order : (Strategy.goals().length + 1);
        Strategy.save({goals: {[gid]: {short, title, items, result: $('#ggResult', el).value.trim(), dir: $('#ggDir', el).value, order, deleted: false}}});
        close();
      };
      const del = $('#ggDel', el);
      if (del) del.onclick = async () => {
        if (!(await confirmPop(del, {text: 'Удалить цель? Задачи останутся, связь с целью пропадёт.', yes: 'Да, удалить', danger: true}))) return;
        Strategy.save({goals: {[g.id]: {deleted: true}}});
        close();
        toast('Цель удалена', {undo: () => Strategy.save({goals: {[g.id]: {deleted: false}}})});
      };
    },
  });
}

function editScenarios() {
  const s = settings();
  const inputs = Object.entries(SCENARIOS).map(([k, x]) => `<tr><td><b>${x.name}</b></td>${Q.months.map(m => `<td><input class="input num sm" data-scv="${k}:${m}" inputmode="numeric" value="${scenarioSales(k)[m]}"></td>`).join('')}</tr>`).join('');
  openModal({
    title: 'Цифры сценариев',
    body: `<p class="note">Продажи (первые оплаты) по месяцам. Регистрации и охват пересчитаются сами по конверсиям ниже.</p>
      <div class="table-wrap"><table class="t"><thead><tr><th></th>${Q.months.map(m => `<th>${monthName(m)}</th>`).join('')}</tr></thead><tbody>${inputs}</tbody></table></div>
      <div class="grid3">
        <label class="field"><span>Цена подписки, ₽</span><input class="input num" id="scPrice" inputmode="numeric" value="${s.price}"></label>
        <label class="field"><span>Регистрация → оплата, %</span><input class="input num" id="scConv" inputmode="decimal" value="${fmt(s.convPay * 100, 1)}"></label>
        <label class="field"><span>Охват → регистрация, %</span><input class="input num" id="scReach" inputmode="decimal" value="${fmt(s.convReg * 100, 1)}"></label>
        <label class="field"><span>Удержание, %</span><input class="input num" id="scRet" inputmode="decimal" value="${fmt(s.retention * 100, 0)}"></label>
        <label class="field"><span>Реферальные, % выручки</span><input class="input num" id="scRef" inputmode="decimal" value="${fmt(s.referral * 100, 0)}"></label>
        <label class="field"><span>Премия команды, %</span><input class="input num" id="scPrem" inputmode="decimal" value="${fmt(s.premium * 100, 0)}"></label>
      </div>`,
    foot: `<button class="btn left" id="scReset">Вернуть план квартала</button><button class="btn" data-close>Отмена</button><button class="btn primary" id="scSave">Сохранить</button>`,
    wide: true,
    onMount(el, close) {
      $('#scSave', el).onclick = () => {
        const plans = {};
        $$('[data-scv]', el).forEach(i => { const [k, m] = i.dataset.scv.split(':'); (plans[k] = plans[k] || {})[m] = Math.max(0, Math.round(parseNum(i.value))); });
        saveSettings({plans, price: Math.max(1, parseNum($('#scPrice', el).value)), convPay: parseNum($('#scConv', el).value) / 100 || 0.05,
          convReg: parseNum($('#scReach', el).value) / 100 || 0.02, retention: clamp(parseNum($('#scRet', el).value) / 100, 0, 1),
          referral: clamp(parseNum($('#scRef', el).value) / 100, 0, 1), premium: clamp(parseNum($('#scPrem', el).value) / 100, 0, 1)});
        close();
        toast('Цифры сценариев сохранены');
      };
      $('#scReset', el).onclick = () => {
        $$('[data-scv]', el).forEach(i => { const [k, m] = i.dataset.scv.split(':'); i.value = SCENARIOS[k].sales[m]; });
      };
    },
  });
}

/* ── 30-tasks.js ── */
/* Задачи команды: список, по месяцам, по неделям. Каждая задача — свой
   документ в базе, поэтому правки разных людей не затирают друг друга.
   Цикл: К работе → В работе → На проверке → Готово. Если задачу поставил
   другой человек, исполнитель сдаёт её на проверку, а принимает автор
   или руководитель. */

const Tasks = {
  all() { return Store.all('tasks'); },
  get(id) { return Store.get('tasks', id); },
  meKey() { return Auth.personId() || (Auth.me() || {}).id; },
  due(t) { return t.due || (t.month ? monthEnd(t.month) : null); },
  isOpen(t) { return t.status !== 'done'; },
  overdue(t) { const d = this.due(t); return this.isOpen(t) && !!d && d < today(); },
  mine(t) { return !!t.assignee && t.assignee === Auth.personId(); },
  manager() { return Auth.can('tasks.manage'); },
  canEdit(t) { return this.manager() || this.mine(t) || (t.createdBy && t.createdBy === this.meKey()); },
  canJudge(t) { return this.manager() || (t.createdBy && t.createdBy === this.meKey() && !this.mine(t)); },
  canDelete(t) { return this.manager() || (t.createdBy && t.createdBy === this.meKey()); },
  unseen(t) {
    const k = this.meKey();
    return this.mine(t) && this.isOpen(t) && t.updatedBy && t.updatedBy !== k && (!t.seen || !t.seen[k] || t.seen[k] < (t.updatedAt || 0));
  },
  /* нужна ли приёмка: задачу поставил другой человек, а сдаёт не руководитель */
  needsReview(t) { return !this.manager() && t.createdBy && t.createdBy !== this.meKey(); },
  sortKey(t) { return [t.status === 'done' ? 1 : 0, t.priority === 'high' ? 0 : 1, this.due(t) || '9999', t.createdAt || 0]; },
  sort(list) {
    return list.slice().sort((a, b) => {
      const x = this.sortKey(a), y = this.sortKey(b);
      for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
      return 0;
    });
  },

  create(fields) {
    const k = this.meKey(), now = Date.now();
    const assignee = fields.assignee === undefined ? Auth.personId() : fields.assignee;
    const p = personById(assignee);
    const t = {
      title: fields.title.trim(), desc: fields.desc || '', result: fields.result || '',
      status: fields.status || 'todo', assignee: assignee || null,
      dir: fields.dir || (p && p.dir) || '', priority: fields.priority || 'normal',
      due: fields.due || null, month: fields.due ? monthOf(fields.due) : (fields.month || monthOf(today())),
      goalId: fields.goalId || null, stratId: fields.stratId || null,
      createdBy: k, createdAt: now, updatedAt: now, updatedBy: k, comments: {},
    };
    return Store.add('tasks', t);
  },
  update(id, patch, log) {
    const k = this.meKey(), now = Date.now();
    const p = {...patch, updatedAt: now, updatedBy: k};
    if (log) p.comments = {[uid()]: {by: k, at: now, text: log, kind: 'system'}};
    return Store.patch('tasks', id, p);
  },
  setStatus(t, status, note) {
    const patch = {status};
    if (status === 'done') patch.doneAt = Date.now();
    if (status === 'doing' && t.status === 'todo') patch.startedAt = Date.now();
    const who = firstName(Auth.person() || {name: Auth.me().name});
    const log = note || `${who}: ${STATUSES[t.status].name} → ${STATUSES[status].name}`;
    return this.update(t.id, patch, log);
  },
  /* «сделано» из списка или карточки */
  complete(t) {
    const next = this.needsReview(t) ? 'review' : 'done';
    this.setStatus(t, next);
    toast(next === 'review' ? 'Отправлено на проверку' : 'Готово', {undo: () => this.setStatus({...t, status: next}, t.status)});
  },
  comment(t, text, kind = 'comment') {
    const k = this.meKey(), now = Date.now();
    return Store.patch('tasks', t.id, {updatedAt: now, updatedBy: k, comments: {[uid()]: {by: k, at: now, text: text.trim(), kind}}});
  },
  markSeen(t) {
    if (!this.unseen(t)) return;
    Store.patch('tasks', t.id, {seen: {[this.meKey()]: Date.now()}});
  },
  remove(t, anchor) {
    return confirmPop(anchor, {text: `Удалить задачу «${t.title.slice(0, 60)}»?`, yes: 'Да, удалить', danger: true}).then(ok => {
      if (!ok) return false;
      const copy = clone(t);
      Store.remove('tasks', t.id);
      toast('Задача удалена', {undo: () => Store.put('tasks', copy.id, copy)});
      return true;
    });
  },
};

/* счётчик в меню: мне поставили или вернули + (руководителю) ждут приёмки */
function taskBadge() {
  if (!Auth.can('tasks.view')) return 0;
  const list = Tasks.all();
  const mine = list.filter(t => Tasks.unseen(t)).length;
  const review = Tasks.manager() ? list.filter(t => t.status === 'review').length
    : list.filter(t => t.status === 'review' && t.createdBy === Tasks.meKey() && !Tasks.mine(t)).length;
  return mine + review;
}

/* ── страница ── */
const TaskUI = {
  draft: {title: '', assignee: undefined, due: ''},
  months() {
    const t = monthOf(today());
    const set = new Set(Tasks.all().map(x => x.month).filter(Boolean));
    let from = addMonths(t, -1), to = addMonths(t, 4);
    set.forEach(m => { if (m < from && Tasks.all().some(x => x.month === m && Tasks.isOpen(x))) from = m; if (m > to) to = m; });
    return monthRange(from, to);
  },
  filters() {
    return {
      who: View.get('t.who', Auth.personId() ? 'me' : 'all'),
      chip: View.get('t.chip', 'open'),
      dir: View.get('t.dir', ''),
      goal: View.get('t.goal', ''),
      q: View.get('t.q', ''),
    };
  },
  filtered(opts = {}) {
    const f = this.filters(), q = f.q.trim().toLowerCase(), me = Auth.personId();
    return Tasks.all().filter(t => {
      if (f.who === 'me' && t.assignee !== me) return false;
      if (f.who !== 'me' && f.who !== 'all' && f.who !== 'none' && t.assignee !== f.who) return false;
      if (f.who === 'none' && t.assignee) return false;
      if (f.dir && t.dir !== f.dir) return false;
      if (f.goal && t.goalId !== f.goal) return false;
      if (q && !(t.title + ' ' + (t.desc || '')).toLowerCase().includes(q)) return false;
      if (opts.ignoreChip) return true;
      if (f.chip === 'open') return Tasks.isOpen(t);
      if (f.chip === 'review') return t.status === 'review';
      if (f.chip === 'overdue') return Tasks.overdue(t);
      if (f.chip === 'done') return t.status === 'done';
      return true;
    });
  },
};

/* ── строка и карточка задачи ── */
function dueChip(t) {
  const d = Tasks.due(t);
  if (!d) return '<span class="due none">без срока</span>';
  const label = t.due ? dayShort(t.due) : monthShort(t.month);
  if (t.status === 'done') return `<span class="due">${label}</span>`;
  if (d < today()) return `<span class="due late" title="Срок прошёл">${label}</span>`;
  if (t.due && daysBetween(today(), t.due) <= 2) return `<span class="due soon">${t.due === today() ? 'сегодня' : label}</span>`;
  return `<span class="due">${label}</span>`;
}
function taskMeta(t) {
  const g = t.goalId ? Strategy.goal(t.goalId) : null;
  const n = Object.values(t.comments || {}).filter(c => c.kind !== 'system').length;
  return [
    g ? `<span class="t-goal">${esc(g.short || g.title)}</span>` : '',
    t.dir && DIRS[t.dir] ? `<span class="t-dir"><i class="dot" style="background:${DIRS[t.dir].color}"></i>${DIRS[t.dir].name}</span>` : '',
    n ? `<span class="t-cm">${icon('msg')}${n}</span>` : '',
    Tasks.unseen(t) ? '<span class="pill rose">новое</span>' : '',
  ].join('');
}
function taskRow(t) {
  const p = personById(t.assignee);
  const can = Tasks.canEdit(t);
  return `<div class="t-row ${t.status === 'done' ? 'done' : ''} ${Tasks.unseen(t) ? 'fresh' : ''}" data-task="${t.id}" draggable="${can}">
    <button class="t-check ${t.status}" data-done="${t.id}" ${can ? '' : 'disabled'} aria-label="${t.status === 'done' ? 'Вернуть в работу' : 'Отметить сделанной'}" title="${t.status === 'done' ? 'Вернуть в работу' : t.status === 'review' ? 'На проверке' : 'Сделано'}">${icon('tick')}</button>
    <div class="t-main">
      <div class="t-title">${t.priority === 'high' ? '<i class="prio" title="Важно"></i>' : ''}${esc(t.title)}</div>
      <div class="t-meta">${taskMeta(t)}</div>
    </div>
    <div class="t-who">${avatar(p)}<span class="t-who-n">${esc(p ? firstName(p) : 'Никто')}</span></div>
    ${dueChip(t)}
    <span class="pill ${STATUSES[t.status].tone} t-st">${STATUSES[t.status].name}</span>
  </div>`;
}
function taskCard(t) {
  const p = personById(t.assignee);
  return `<div class="t-card ${t.status} ${Tasks.unseen(t) ? 'fresh' : ''}" data-task="${t.id}" draggable="${Tasks.canEdit(t)}">
    <div class="t-title">${t.priority === 'high' ? '<i class="prio" title="Важно"></i>' : ''}${esc(t.title)}</div>
    <div class="t-card-foot">${avatar(p)}${dueChip(t)}<span class="pill ${STATUSES[t.status].tone}">${STATUSES[t.status].name}</span></div>
  </div>`;
}

function renderTaskList(box, list) {
  if (!list.length) { box.innerHTML = taskEmpty(); return; }
  const groups = ['review', 'doing', 'todo', 'done'];
  const openDone = View.get('t.showDone', false) || TaskUI.filters().chip === 'done';
  box.innerHTML = groups.map(st => {
    let items = Tasks.sort(list.filter(t => t.status === st));
    if (!items.length) return '';
    const total = items.length;
    if (st === 'done') {
      items = items.sort((a, b) => (b.doneAt || b.updatedAt || 0) - (a.doneAt || a.updatedAt || 0));
      if (!openDone) return `<section class="t-group"><button class="t-group-head as-btn" data-show-done>${STATUSES.done.name} <span>${total}</span> — показать</button></section>`;
      items = items.slice(0, 60);
    }
    return `<section class="t-group"><div class="t-group-head">${STATUSES[st].name} <span>${total}</span>${st === 'review' ? '<em>ждут приёмки автора или руководителя</em>' : ''}</div>
      <div class="t-list grouped">${items.map(taskRow).join('')}</div></section>`;
  }).join('');
  on(box, 'click', '[data-show-done]', () => { View.set('t.showDone', true); App.render(); });
}
function taskEmpty() {
  const f = TaskUI.filters();
  return `<div class="empty"><b>${f.chip === 'overdue' ? 'Просроченных задач нет' : f.chip === 'review' ? 'На проверке ничего нет' : 'Задач по этому фильтру нет'}</b>
    ${f.who === 'me' ? 'Показаны только ваши задачи — выберите «Все люди», чтобы увидеть задачи команды.' : 'Поменяйте фильтр или добавьте задачу строкой выше.'}</div>`;
}

function renderTaskMonths(box, list) {
  const months = TaskUI.months();
  const cols = [...months.map(m => ({key: m, name: monthName(m), items: list.filter(t => t.month === m)})),
    {key: 'none', name: 'Без срока', items: list.filter(t => !t.month)}];
  const base = TaskUI.filtered({ignoreChip: true});
  box.innerHTML = `<div class="board">${cols.map(c => {
    const all = base.filter(t => (c.key === 'none' ? !t.month : t.month === c.key));
    const done = all.filter(t => t.status === 'done').length;
    const now = c.key === monthOf(today());
    return `<div class="col ${now ? 'now' : ''}" data-drop-month="${c.key}">
      <div class="col-head"><b>${c.name}</b>${now ? '<span class="pill rose">сейчас</span>' : ''}<span class="col-n">${done}/${all.length}</span></div>
      ${all.length ? progress(done / all.length, 'good') : ''}
      <div class="col-body">${Tasks.sort(c.items).map(taskCard).join('') || '<div class="col-empty">Перетащите сюда задачу</div>'}</div>
    </div>`;
  }).join('')}</div>`;
  wireDrop(box, '[data-drop-month]', (t, el) => {
    const m = el.dataset.dropMonth === 'none' ? null : el.dataset.dropMonth;
    if (t.month === m) return;
    const patch = {month: m};
    if (!m || (t.due && monthOf(t.due) !== m)) patch.due = null;
    Tasks.update(t.id, patch, `Перенесено на ${m ? monthName(m).toLowerCase() : '«без срока»'}`);
  });
}

function renderTaskWeeks(box, list) {
  const months = TaskUI.months();
  let m = View.get('t.weekMonth', monthOf(today()));
  if (!months.includes(m)) m = monthOf(today());
  const weeks = [];
  for (let w = weekStart(monthStart(m)); w <= monthEnd(m); w = addDays(w, 7)) weeks.push(w);
  const inMonth = list.filter(t => (t.due ? monthOf(t.due) === m : t.month === m));
  const thisWeek = weekStart(today());
  box.innerHTML = `<div class="tabs week-tabs">${months.map(x => `<button data-wm="${x}" class="${x === m ? 'on' : ''}">${monthName(x)}<span class="n">${list.filter(t => (t.due ? monthOf(t.due) === x : t.month === x)).length}</span></button>`).join('')}</div>
    <div class="board weeks">
    <div class="col undated" data-drop-week="none">
      <div class="col-head"><b>Без даты</b><span class="col-n">${inMonth.filter(t => !t.due).length}</span></div>
      <div class="col-body">${Tasks.sort(inMonth.filter(t => !t.due)).map(taskCard).join('') || '<div class="col-empty">Всё распределено по неделям</div>'}</div>
    </div>${weeks.map(w => {
      const end = addDays(w, 6);
      const items = inMonth.filter(t => t.due && t.due >= w && t.due <= end);
      return `<div class="col ${w === thisWeek ? 'now' : ''}" data-drop-week="${w}">
        <div class="col-head"><b>${weekLabel(w)}</b>${w === thisWeek ? '<span class="pill rose">эта неделя</span>' : ''}<span class="col-n">${items.length}</span></div>
        <div class="col-body">${Tasks.sort(items).map(taskCard).join('') || '<div class="col-empty">Свободно</div>'}</div>
      </div>`;
    }).join('')}</div>
    <p class="note">Слева — задачи месяца без даты. Перетащите задачу в неделю — срок встанет на пятницу этой недели (или на тот же день недели, если срок уже был).</p>`;
  on(box, 'click', '[data-wm]', (e, el) => { View.set('t.weekMonth', el.dataset.wm); App.render(); });
  wireDrop(box, '[data-drop-week]', (t, el) => {
    const w = el.dataset.dropWeek;
    if (w === 'none') { if (t.due) Tasks.update(t.id, {due: null, month: m}, 'Срок снят'); return; }
    const wd = t.due ? weekday(t.due) : 4;
    let d = addDays(w, wd);
    if (d < monthStart(m)) d = monthStart(m);
    if (d > monthEnd(m)) d = monthEnd(m);
    if (d === t.due) return;
    Tasks.update(t.id, {due: d, month: monthOf(d)}, `Срок: ${dayLong(d)}`);
  });
}

/* перетаскивание карточек между колонками */
function wireDrop(box, colSel, onDrop) {
  let dragId = null;
  box.addEventListener('dragstart', e => {
    const card = e.target.closest('[data-task]');
    if (!card) return;
    dragId = card.dataset.task;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) { /* старые браузеры */ }
  });
  box.addEventListener('dragend', e => { const c = e.target.closest('[data-task]'); if (c) c.classList.remove('dragging'); $$('.drop-on', box).forEach(x => x.classList.remove('drop-on')); });
  box.addEventListener('dragover', e => {
    const col = e.target.closest(colSel);
    if (!col || !dragId) return;
    e.preventDefault();
    $$('.drop-on', box).forEach(x => x !== col && x.classList.remove('drop-on'));
    col.classList.add('drop-on');
  });
  box.addEventListener('drop', e => {
    const col = e.target.closest(colSel);
    if (!col || !dragId) return;
    e.preventDefault();
    col.classList.remove('drop-on');
    const t = Tasks.get(dragId);
    dragId = null;
    if (t && Tasks.canEdit(t)) onDrop(t, col);
  });
}
function wireTaskCards(root) {
  on(root, 'click', '[data-done]', (e, el) => {
    e.stopPropagation();
    const t = Tasks.get(el.dataset.done);
    if (!t) return;
    if (t.status === 'done') Tasks.setStatus(t, 'doing');
    else if (t.status === 'review') { if (Tasks.canJudge(t)) Tasks.setStatus(t, 'done', `${firstName(Auth.person() || {})}: принято`); else toast('Задача ждёт приёмки автора или руководителя'); }
    else Tasks.complete(t);
  });
  on(root, 'click', '[data-task]', (e, el) => {
    if (e.target.closest('[data-done], button, a, input, select')) return;
    openTask(el.dataset.task);
  });
}

/* ── карточка задачи в окне ── */
function openTask(id, defaults = {}) {
  const isNew = !id;
  let unsub = null;
  let t = isNew ? null : Tasks.get(id);
  if (!isNew && !t) { toast('Задача уже удалена'); return; }
  if (t) Tasks.markSeen(t);
  const can = isNew || Tasks.canEdit(t);
  const ppl = people();
  const months = monthRange('2026-08', '2027-12');
  const goals = Strategy.goals();
  const items = Strategy.items();
  const v = t || {title: '', desc: '', result: '', status: 'todo', assignee: Auth.personId(), dir: (Auth.person() || {}).dir || '',
    priority: 'normal', due: '', month: monthOf(today()), goalId: '', stratId: '', ...defaults};
  const sel = (id, opts, cur, dis) => `<select class="select" id="${id}" ${dis ? 'disabled' : ''}>${opts.map(([val, n]) => `<option value="${esc(val)}" ${String(cur || '') === String(val) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;

  const body = `
    <input class="input t-m-title" id="tmTitle" value="${esc(v.title)}" placeholder="Что нужно сделать" ${can ? '' : 'disabled'} maxlength="200">
    ${isNew ? '' : `<div class="t-m-status" id="tmStatus"></div>`}
    <div class="grid2">
      <label class="field"><span>Кто делает</span>${sel('tmWho', [['', 'Не назначено'], ...ppl.map(p => [p.id, personName(p) + (p.title && p.name ? ' · ' + p.title : '')])], v.assignee, !can)}</label>
      <label class="field"><span>Срок</span><input class="input" id="tmDue" type="date" value="${esc(v.due || '')}" ${can ? '' : 'disabled'} min="2026-01-01" max="2028-12-31"></label>
      <label class="field"><span>Месяц</span>${sel('tmMonth', [['', 'Без срока'], ...months.map(m => [m, monthName(m, true)])], v.month, !can)}</label>
      <label class="field"><span>Направление</span>${sel('tmDir', [['', 'Без направления'], ...Object.entries(DIRS).map(([k, d]) => [k, d.name])], v.dir, !can)}</label>
      <label class="field"><span>Важность</span>${sel('tmPrio', [['normal', 'Обычная'], ['high', 'Важно']], v.priority, !can)}</label>
      <label class="field"><span>Цель квартала</span>${sel('tmGoal', [['', 'Не связана'], ...goals.map(g => [g.id, g.short || g.title])], v.goalId, !can)}</label>
    </div>
    ${items.length ? `<label class="field"><span>Этап дорожной карты</span>${sel('tmStrat', [['', 'Не связана'], ...items.map(i => [i.id, `${dirName(i.dir)} · ${i.title}`])], v.stratId, !can)}</label>` : ''}
    <label class="field"><span>Что сделать подробнее</span><textarea class="textarea" id="tmDesc" rows="3" ${can ? '' : 'disabled'} placeholder="Контекст, ссылки, договорённости">${esc(v.desc || '')}</textarea></label>
    <label class="field"><span>Результат — как поймём, что готово</span><input class="input" id="tmResult" value="${esc(v.result || '')}" ${can ? '' : 'disabled'} placeholder="Например: договор подписан и лежит в папке"></label>
    ${isNew ? '' : `<div class="t-m-comments"><div class="label">Обсуждение и история</div><div id="tmThread" class="thread"></div>
      <form id="tmCForm" class="t-m-cform"><textarea class="textarea" id="tmComment" rows="2" placeholder="Написать комментарий: вопрос, ссылка, что сделано"></textarea><button class="btn sm dark" type="submit">Отправить</button></form></div>`}`;
  const foot = isNew
    ? `<button class="btn" data-close>Отмена</button><button class="btn primary" id="tmCreate">Создать задачу</button>`
    : `${Tasks.canDelete(t) ? `<button class="btn danger left" id="tmDel">${icon('trash')}Удалить</button>` : '<span class="left note" id="tmWhoMade"></span>'}<span class="note" id="tmSaved"></span><button class="btn" data-close>Закрыть</button>`;

  openModal({
    title: isNew ? 'Новая задача' : 'Задача',
    body, foot, wide: true, focus: isNew,
    onMount(el, close) {
      const val = sel => $(sel, el).value;
      if (isNew) {
        $('#tmCreate', el).onclick = () => {
          const title = val('#tmTitle').trim();
          if (!title) { $('#tmTitle', el).focus(); return; }
          const due = val('#tmDue') || null;
          Tasks.create({title, assignee: val('#tmWho') || null, due, month: val('#tmMonth') || null, dir: val('#tmDir'),
            priority: val('#tmPrio'), goalId: val('#tmGoal') || null, stratId: $('#tmStrat', el) ? val('#tmStrat') || null : null,
            desc: val('#tmDesc'), result: val('#tmResult')});
          close();
          toast('Задача создана');
        };
        return;
      }
      /* автосохранение по полю */
      const saved = () => { const s = $('#tmSaved', el); if (s) { s.textContent = 'Сохранено'; clearTimeout(s._t); s._t = setTimeout(() => { s.textContent = ''; }, 1600); } };
      const field = (sel, key, map = x => x, log) => {
        const input = $(sel, el);
        if (!input) return;
        input.addEventListener('change', () => {
          const cur = Tasks.get(id);
          if (!cur) return;
          let value = map(input.value);
          if (key === 'title' && !value) { input.value = cur.title; return; }
          const patch = {[key]: value};
          if (key === 'due') { patch.month = value ? monthOf(value) : cur.month; const mm = $('#tmMonth', el); if (mm && value) mm.value = monthOf(value); }
          if (key === 'month' && cur.due && monthOf(cur.due) !== value) { patch.due = null; $('#tmDue', el).value = ''; }
          if (key === 'assignee' && value && !cur.dir) { const p = personById(value); if (p && p.dir) patch.dir = p.dir; }
          Tasks.update(id, patch, log ? log(value) : null);
          saved();
        });
      };
      field('#tmTitle', 'title', s => s.trim());
      field('#tmWho', 'assignee', s => s || null, s => `Исполнитель: ${s ? personName(personById(s)) : 'не назначен'}`);
      field('#tmDue', 'due', s => s || null, s => (s ? `Срок: ${dayLong(s)}` : 'Срок снят'));
      field('#tmMonth', 'month', s => s || null);
      field('#tmDir', 'dir');
      field('#tmPrio', 'priority');
      field('#tmGoal', 'goalId', s => s || null);
      field('#tmStrat', 'stratId', s => s || null);
      field('#tmDesc', 'desc');
      field('#tmResult', 'result');

      const paint = () => {
        const cur = Tasks.get(id);
        if (!cur) { close(); return; }
        paintTaskStatus($('#tmStatus', el), cur);
        const typing = document.activeElement && document.activeElement.id === 'tmComment';
        paintThread($('#tmThread', el), cur, typing);
        const wm = $('#tmWhoMade', el);
        if (wm) { const c = personById(cur.createdBy); wm.textContent = c ? `Поставил(а): ${personName(c)}` : ''; }
      };
      paint();
      unsub = Store.subscribe(c => { if (c === 'tasks') paint(); });

      on(el, 'click', '[data-st]', (e, b) => {
        const cur = Tasks.get(id);
        const st = b.dataset.st;
        if (st === 'return') {
          const box = $('#tmComment', el);
          if (!box.value.trim()) { box.focus(); box.placeholder = 'Напишите, что доработать — без комментария вернуть нельзя'; box.classList.add('need'); return; }
          Tasks.comment(cur, box.value, 'return');
          box.value = '';
          Tasks.setStatus(cur, 'doing', `${firstName(Auth.person() || {})}: вернул(а) на доработку`);
          return;
        }
        if (st === 'accept') { Tasks.setStatus(cur, 'done', `${firstName(Auth.person() || {})}: принято`); return; }
        if (st === 'complete') { Tasks.complete(cur); return; }
        Tasks.setStatus(cur, st);
      });
      const cf = $('#tmCForm', el);
      cf.onsubmit = e => {
        e.preventDefault();
        const box = $('#tmComment', el);
        if (!box.value.trim()) return;
        Tasks.comment(Tasks.get(id), box.value);
        box.value = '';
        box.classList.remove('need');
        paint();
      };
      $('#tmComment', el).addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) cf.requestSubmit(); });
      const del = $('#tmDel', el);
      if (del) del.onclick = () => Tasks.remove(Tasks.get(id), del).then(ok => { if (ok) close(); });
    },
    onClose() { if (unsub) unsub(); },
  });
}
function paintTaskStatus(box, t) {
  if (!box) return;
  const can = Tasks.canEdit(t), judge = Tasks.canJudge(t);
  const steps = Object.entries(STATUSES).map(([k, s]) => `<span class="st-step ${k === t.status ? 'on ' + s.tone : ''}">${s.name}</span>`).join('<i></i>');
  let actions = '';
  if (t.status === 'todo' && can) actions = `<button class="btn sm" data-st="doing">В работу</button><button class="btn sm primary" data-st="complete">${Tasks.needsReview(t) ? 'Сдать на проверку' : 'Сделано'}</button>`;
  if (t.status === 'doing' && can) actions = `<button class="btn sm primary" data-st="complete">${Tasks.needsReview(t) ? 'Сдать на проверку' : 'Сделано'}</button>`;
  if (t.status === 'review') actions = judge ? `<button class="btn sm good" data-st="accept">${icon('tick')}Принять</button><button class="btn sm danger" data-st="return">Вернуть на доработку</button>` : '<span class="note">Ждёт приёмки автора или руководителя</span>';
  if (t.status === 'done' && can) actions = `<button class="btn sm" data-st="doing">Вернуть в работу</button>`;
  box.innerHTML = `<div class="st-steps">${steps}</div><div class="st-actions">${actions}</div>`;
}
function paintThread(box, t, keepScroll) {
  if (!box) return;
  const list = Object.entries(t.comments || {}).map(([cid, c]) => ({cid, ...c})).sort((a, b) => a.at - b.at);
  if (!list.length) { box.innerHTML = '<p class="note">Пока пусто. Вопросы и договорённости по задаче пишите здесь — их увидит вся команда.</p>'; return; }
  box.innerHTML = list.map(c => {
    const p = personById(c.by);
    if (c.kind === 'system') return `<div class="th-sys"><span>${esc(c.text)}</span><time>${timeAgo(c.at)}</time></div>`;
    return `<div class="th-msg ${c.kind === 'return' ? 'ret' : ''}">${avatar(p)}<div><div class="th-h"><b>${esc(p ? personName(p) : 'Кто-то из команды')}</b><time>${timeAgo(c.at)}</time>${c.kind === 'return' ? '<span class="pill bad">вернул(а) на доработку</span>' : ''}</div><p></p></div></div>`;
  }).join('');
  /* текст комментариев — только через textContent */
  const msgs = list.filter(c => c.kind !== 'system');
  $$('.th-msg p', box).forEach((pEl, i) => { pEl.textContent = msgs[i].text; });
  if (!keepScroll) box.scrollTop = box.scrollHeight;
}

/* Деньги: быстрая запись сверху → месяцы → P&L план/факт → план платежей

const MoneyUI = {
  draft: {kind: 'out', amount: '', cat: 'other', date: '', note: ''},
};
const catName = (kind, cat) => ((KINDS[kind] || {}).cats || {})[cat] || 'Прочее';
const monthStatus = m => (m < monthOf(today()) ? 'fact' : m === monthOf(today()) ? 'now' : 'plan');
const STATUS_TAG = {fact: 'факт', now: 'идёт', plan: 'план'};

App.register('money', {
  title: 'Деньги',
  render(root) {
    if (!Auth.can('money.view')) { root.innerHTML = pageHead('Деньги', '') + noAccess(); return; }
    const s = settings(), sc = s.scenario;
    const edit = Auth.can('money.edit');

    const cash = Money.cashNow();

    root.innerHTML = `
      ${pageHead('Деньги', 'Сверху — быстрая запись расхода, прихода или вложения. Ниже — P&L по месяцам, план платежей и журнал всех операций.', helpBtn('money'))}
      ${helpBox('money', `<b>Как вести деньги.</b><ol>
        <li>Потратили или получили деньги — запишите строкой сверху: сумма, статья, дата. Enter — сохранить. Ошиблись — «Отменить» в уведомлении или правка в журнале.</li>
        <li>Плановые платежи (зарплаты, штаб, сервисы) отмечайте кнопкой «Оплатить» в плане — операция запишется в журнал сама.</li>
        <li>Выручку подписок вносить не нужно: она считается из цифр продаж в «Отчётах».</li>
        <li>«Вложение» — деньги основателя или инвестора: они пополняют счёт, но не считаются доходом.</li></ol>`)}
      ${edit ? quickEntryHtml() : ''}
      <div class="money-top">
        <div class="card stat cash-card"><span class="label">На счёте сейчас</span><div class="big">${rubK(cash)}</div>
          <div class="foot">старт ${rubK(s.cashStart)} на ${dayLong(s.cashDate)} + все операции и выручка</div></div>
        ${rows.map(r => {
          const st = monthStatus(r.m);
          const f = st === 'plan' ? r.plan : r.fact;
          return `<div class="card month-card ${st}"><div class="mc-h"><b>${monthName(r.m)}</b><span class="pill ${st === 'now' ? 'rose' : ''}">${STATUS_TAG[st]}</span></div>
            <div class="mc-row"><span>Доходы</span><b class="good">${rubK(f.income)}</b></div>
            <div class="mc-row"><span>Расходы</span><b class="bad">${rubK(f.outTotal)}</b></div>
            <div class="mc-row total"><span>Итог</span><b class="${f.profit < 0 ? 'bad' : 'good'}">${signed(f.profit)}</b></div>
            ${st !== 'plan' ? `<div class="note">план: ${signed(r.plan.profit)}</div>` : '<div class="note">по плану платежей и сценарию</div>'}</div>`;
        }).join('')}
      </div>
      <section class="section">
        <div class="section-head"><h2>P&amp;L по месяцам</h2><span class="hint-inline">Крупно — факт, мелко — план. Будущие месяцы — только план. Сценарий продаж «${SCENARIOS[sc].name}».</span></div>
        ${pnlTable(rows)}
      </section>
      <section class="section">
        <div class="section-head"><h2>План платежей</h2><span class="hint-inline">${edit ? 'Нажмите «Оплатить», когда деньги ушли — операция попадёт в журнал и в P&L.' : 'Что и когда платим до конца года.'}</span>
          ${edit ? `<button class="btn sm" data-plan-add>${icon('plus')}Платёж</button>` : ''}</div>
        ${planTable()}
      </section>
      <section class="section">
        <div class="section-head"><h2>Журнал операций</h2>${ledgerFilters()}</div>

      ${Auth.can('settings.edit') ? moneySettingsHtml() : ''}`;

    wireHelp(root);
    if (edit) wireQuickEntry(root);

    wireLedger(root);
    if (Auth.can('settings.edit')) wireMoneySettings(root);
  },
});

/* ── быстрая запись ── */
function quickEntryHtml() {
  const d = MoneyUI.draft;
  const cats = KINDS[d.kind].cats;
  if (!cats[d.cat]) d.cat = Object.keys(cats)[0];
  const recent = Money.ledger().slice(0, 4);
  return `<form class="card qe ${d.kind}" id="qeForm" autocomplete="off">
    <div class="seg qe-kind" role="tablist">${Object.entries(KINDS).map(([k, x]) => `<button type="button" data-kind="${k}" class="${d.kind === k ? 'on' : ''} k-${k}">${x.name}</button>`).join('')}</div>
    <div class="qe-fields">
      <label class="field qe-amount"><span>Сумма, ₽</span><input class="input num" id="qeAmount" inputmode="decimal" placeholder="0" value="${esc(d.amount)}"></label>
      <label class="field"><span>Статья</span><select class="select" id="qeCat">${Object.entries(cats).map(([k, n]) => `<option value="${k}" ${k === d.cat ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="field"><span>Дата</span><input class="input" id="qeDate" type="date" value="${esc(d.date || today())}"></label>
      <label class="field qe-note"><span>Комментарий</span><input class="input" id="qeNote" placeholder="${d.kind === 'out' ? 'За что: например, хостинг на месяц' : d.kind === 'in' ? 'От кого и за что' : 'Кто вложил'}" value="${esc(d.note)}" maxlength="160"></label>
      <button class="btn ${d.kind === 'out' ? 'danger solid' : d.kind === 'in' ? 'good' : 'dark'} qe-go" type="submit">Записать ${KINDS[d.kind].name.toLowerCase()}</button>
    </div>
    ${recent.length ? `<div class="qe-recent"><span class="label">Последние</span>${recent.map(e => `<button type="button" class="qe-r" data-led="${e.id}"><span>${dayShort(e.date)}</span><span>${esc(e.note || catName(e.kind, e.cat))}</span><b class="${e.kind === 'out' ? 'bad' : 'good'}">${e.kind === 'out' ? '−' : '+'}${rub(e.amount)}</b></button>`).join('')}</div>` : ''}
  </form>`;
}
function wireQuickEntry(root) {
  const form = $('#qeForm', root);
  const d = MoneyUI.draft;
  on(form, 'click', '[data-kind]', (e, el) => { d.kind = el.dataset.kind; d.cat = Object.keys(KINDS[d.kind].cats)[0]; App.render({focus: 'qeAmount'}); });
  $('#qeAmount', form).oninput = e => { d.amount = e.target.value; };
  $('#qeCat', form).onchange = e => { d.cat = e.target.value; };
  $('#qeDate', form).onchange = e => { d.date = e.target.value; };
  $('#qeNote', form).oninput = e => { d.note = e.target.value; };
  form.onsubmit = e => {
    e.preventDefault();
    const amount = Math.round(parseNum($('#qeAmount', form).value) * 100) / 100;
    if (!(amount > 0)) { $('#qeAmount', form).focus(); toast('Укажите сумму больше нуля'); return; }
    const entry = {kind: d.kind, amount, cat: $('#qeCat', form).value, date: $('#qeDate', form).value || today(),
      note: $('#qeNote', form).value.trim(), by: Tasks.meKey(), at: Date.now()};
    const id = Store.add('ledger', entry);
    d.amount = ''; d.note = '';
    toast(`Записано: ${d.kind === 'out' ? '−' : '+'}${rub(amount)} · ${catName(entry.kind, entry.cat)}`, {undo: () => Store.remove('ledger', id)});
    App.render({focus: 'qeAmount'});
  };
}

/* ── P&L ── */
function pnlTable(rows) {
  const cell = (r, f, p) => {
    const st = monthStatus(r.m);
    if (st === 'plan') return `<td class="r pl-cell future"><b>${p ? rubK(p) : '—'}</b><small>план</small></td>`;
    return `<td class="r pl-cell"><b>${f ? rubK(f) : '—'}</b>${p ? `<small>план ${rubK(p)}</small>` : ''}</td>`;
  };
  const total = (get) => sum(rows, r => get(r));
  const line = (name, getF, getP, cls = '') => `<tr class="${cls}"><td>${name}</td>${rows.map(r => cell(r, getF(r), getP(r))).join('')}
    <td class="r pl-cell tot"><b>${rubK(total(r => (monthStatus(r.m) === 'plan' ? getP(r) : getF(r))))}</b><small>план ${rubK(total(getP))}</small></td></tr>`;
  const outCats = Object.keys(OUT_CATS).filter(c => rows.some(r => (r.fact.out[c] || 0) || (r.plan.out[c] || 0)));
  const profitCell = r => {
    const st = monthStatus(r.m), v = st === 'plan' ? r.plan.profit : r.fact.profit;
    return `<td class="r pl-cell ${st === 'plan' ? 'future' : ''}"><b class="${v < 0 ? 'bad' : 'good'}">${signed(v)}</b>${st !== 'plan' ? `<small>план ${signed(r.plan.profit)}</small>` : '<small>план</small>'}</td>`;
  };
  const profitTot = total(r => (monthStatus(r.m) === 'plan' ? r.plan.profit : r.fact.profit));
  return `<div class="table-wrap"><table class="t pnl grid-lines">
    <thead><tr><th>Статья</th>${rows.map(r => `<th class="r">${monthName(r.m)} <span class="th-tag">${STATUS_TAG[monthStatus(r.m)]}</span></th>`).join('')}<th class="r">До конца года</th></tr></thead>
    <tbody>
      <tr class="group in"><td colspan="${rows.length + 2}">Доходы</td></tr>
      ${line('Подписки <span class="note">из отчётов о продажах</span>', r => r.fact.subs, r => r.plan.subs, 'in')}
      ${line('Прочие приходы', r => r.fact.other, r => r.plan.other, 'in')}
      ${line('Итого доходы', r => r.fact.income, r => r.plan.income, 'sub in')}
      <tr class="group out"><td colspan="${rows.length + 2}">Расходы</td></tr>
      ${outCats.map(c => line(OUT_CATS[c], r => r.fact.out[c] || 0, r => r.plan.out[c] || 0, 'out')).join('') || `<tr><td colspan="${rows.length + 2}" class="note">Расходов пока нет</td></tr>`}
      ${line('Итого расходы', r => r.fact.outTotal, r => r.plan.outTotal, 'sub out')}
      <tr class="total"><td>Прибыль</td>${rows.map(profitCell).join('')}<td class="r pl-cell tot"><b class="${profitTot < 0 ? 'bad' : 'good'}">${signed(profitTot)}</b></td></tr>
      <tr class="fin"><td>Вложения <span class="note">вне P&amp;L</span></td>${rows.map(r => `<td class="r pl-cell"><b>${r.fact.invest ? rubK(r.fact.invest) : '—'}</b></td>`).join('')}<td class="r pl-cell tot"><b>${rubK(total(r => r.fact.invest))}</b></td></tr>
    </tbody></table></div>
    <p class="note">План расходов = план платежей ниже + от выручки по плану: реферальные ${pct(settings().referral)} первых оплат, эквайринг ${pct(settings().acquiring, 1)}, налог ${pct(settings().taxRate)}.</p>`;

/* ── план платежей ── */
function planTable() {
  const items = Money.planItems();
  const months = CF_MONTHS;
  const edit = Auth.can('money.edit');
  const seePay = Auth.can('payroll.view');
  if (!items.length) return `<div class="empty"><b>План платежей пуст</b>${edit ? 'Добавьте зарплаты, штаб, сервисы и разовые платежи кнопкой «Платёж».' : ''}</div>`;
  const cell = (it, m) => {
    const a = Money.planAmount(it, m);
    if (!a) return '<td class="r plan-c empty-c"></td>';
    const paid = Money.paid(it, m);
    const canPay = edit && (it.group !== 'payroll' || seePay);
    if (paid) return `<td class="r plan-c paid"><button class="pay-btn paid" ${canPay ? `data-unpay="${it.id}:${m}"` : 'disabled'} title="Оплачено ${dayLong(paid.date)}${canPay ? ' — нажмите, чтобы отменить' : ''}"><span>${rub(a)}</span>${icon('tick')}</button></td>`;
    return `<td class="r plan-c"><div class="pc-amt">${rub(a)}</div>${canPay ? `<button class="pay-btn" data-pay="${it.id}:${m}">Оплатить</button>` : `<span class="note">${m < monthOf(today()) ? 'не оплачено' : ''}</span>`}</td>`;
  };
  const groupRows = Object.entries(PLAN_GROUPS).map(([g, gname]) => {
    const list = items.filter(it => it.group === g);
    if (!list.length) return '';
    const gTot = m => sum(list, it => Money.planAmount(it, m));
    const head = `<tr class="group"><td>${gname}</td>${months.map(m => `<td class="r">${gTot(m) ? rubK(gTot(m)) : ''}</td>`).join('')}<td class="r">${rubK(sum(months, gTot))}</td></tr>`;
    if (g === 'payroll' && !seePay) {
      return head + `<tr><td><span class="soft">${list.length} ${plural(list.length, 'человек', 'человека', 'человек')} в команде</span><div class="note">суммы по людям видит основатель</div></td>${months.map(m => `<td class="r plan-c">${gTot(m) ? rub(gTot(m)) : ''}</td>`).join('')}<td class="r"><b>${rub(sum(months, gTot))}</b></td></tr>`;
    }
    return head + list.map(it => {
      const p = personById(it.personId);
      return `<tr><td><button class="plan-name" ${edit && (g !== 'payroll' || seePay) ? `data-plan-edit="${it.id}"` : 'disabled'}>${esc(it.title)}</button>
        <div class="note">${g === 'payroll' ? `${p ? esc(personName(p)) + ' · ' : ''}${rub(it.amount)}${it.insurance !== false ? ' + взносы ' + pct(settings().insurance, 1) : ''}` : `${catName('out', it.cat)} · ${rub(it.amount)}${g === 'regular' ? ' в месяц' : ''}`}</div></td>
        ${months.map(m => cell(it, m)).join('')}<td class="r"><b>${rub(sum(months, m => Money.planAmount(it, m)))}</b></td></tr>`;
    }).join('');
  }).join('');
  const tot = m => sum(items, it => Money.planAmount(it, m));
  const paidTot = m => sum(items, it => (Money.paid(it, m) ? Money.planAmount(it, m) : 0));
  return `<div class="table-wrap"><table class="t plan grid-lines">
    <thead><tr><th>Платёж</th>${months.map(m => `<th class="r">${monthName(m)}</th>`).join('')}<th class="r">Всего</th></tr></thead>
    <tbody>${groupRows}
      <tr class="total"><td>Итого по плану</td>${months.map(m => `<td class="r">${rub(tot(m))}</td>`).join('')}<td class="r">${rub(sum(months, tot))}</td></tr>
      <tr class="sub"><td>Оплачено</td>${months.map(m => `<td class="r good">${paidTot(m) ? rub(paidTot(m)) : '—'}</td>`).join('')}<td class="r good">${rub(sum(months, paidTot))}</td></tr>
      <tr class="sub"><td>Осталось оплатить</td>${months.map(m => `<td class="r">${tot(m) - paidTot(m) ? rub(tot(m) - paidTot(m)) : '—'}</td>`).join('')}<td class="r">${rub(sum(months, m => tot(m) - paidTot(m)))}</td></tr>
    </tbody></table></div>`;
}
function wirePlan(root) {
  on(root, 'click', '[data-pay]', async (e, el) => {
    const [id, m] = el.dataset.pay.split(':');
    const it = Store.get('plan', id);
    if (!it) return;
    const a = Money.planAmount(it, m);
    if (!(await confirmPop(el, {text: `Отметить оплаченным: ${it.title}, ${monthName(m).toLowerCase()} — ${rub(a)}?`, yes: 'Да, оплачено'}))) return;
    const cur = monthOf(today());
    const date = m === cur ? today() : m < cur ? monthEnd(m) : today();
    Store.add('ledger', {kind: 'out', amount: a, cat: it.group === 'payroll' ? 'payroll' : (it.cat || 'other'), date, note: it.title,
      planId: it.id, planMonth: m, by: Tasks.meKey(), at: Date.now()});
    toast(`Оплачено: ${it.title}`);
  });
  on(root, 'click', '[data-unpay]', async (e, el) => {
    const [id, m] = el.dataset.unpay.split(':');
    const it = Store.get('plan', id);
    const paid = it && Money.paid(it, m);
    if (!paid) return;
    if (!(await confirmPop(el, {text: `Отменить оплату: ${it.title}, ${monthName(m).toLowerCase()}? Операция уйдёт из журнала.`, yes: 'Да, отменить', danger: true}))) return;
    const copy = clone(paid);
    Store.remove('ledger', paid.id);
    toast('Оплата отменена', {undo: () => Store.put('ledger', copy.id, copy)});
  });
  on(root, 'click', '[data-plan-edit]', (e, el) => editPlanItem(el.dataset.planEdit));
  on(root, 'click', '[data-plan-add]', () => editPlanItem(null));
}
function editPlanItem(id) {
  const it = id ? Store.get('plan', id) : null;
  const seePay = Auth.can('payroll.view');
  const v = it || {title: '', group: 'regular', cat: 'office', amount: '', months: [monthOf(today())], insurance: true, personId: ''};
  const groups = Object.entries(PLAN_GROUPS).filter(([g]) => g !== 'payroll' || seePay);
  openModal({
    title: it ? 'Платёж в плане' : 'Новый платёж',
    body: `<label class="field"><span>Название</span><input class="input" id="piTitle" value="${esc(v.title)}" placeholder="Например: Студия-штаб, аренда"></label>
      <div class="grid3">
        <label class="field"><span>Группа</span><select class="select" id="piGroup">${groups.map(([g, n]) => `<option value="${g}" ${g === v.group ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="field" id="piCatF"><span>Статья</span><select class="select" id="piCat">${Object.entries(OUT_CATS).filter(([k]) => k !== 'payroll').map(([k, n]) => `<option value="${k}" ${k === v.cat ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="field"><span>Сумма за месяц, ₽</span><input class="input num" id="piAmount" inputmode="decimal" value="${esc(v.amount)}"></label>
      </div>
      <div class="grid2" id="piPayF">
        <label class="field"><span>Человек</span><select class="select" id="piPerson"><option value="">Вакансия / не выбран</option>${people().map(p => `<option value="${p.id}" ${p.id === v.personId ? 'selected' : ''}>${esc(personName(p))}</option>`).join('')}</select></label>
        <label class="check pi-ins"><input type="checkbox" id="piIns" ${v.insurance !== false ? 'checked' : ''}>Плюс страховые взносы ${pct(settings().insurance, 1)}</label>
      </div>
      <div class="field"><span>В какие месяцы платим</span><div class="chips">${CF_MONTHS.map(m => `<label class="chip pick"><input type="checkbox" value="${m}" ${(v.months || []).includes(m) ? 'checked' : ''}>${monthName(m)}</label>`).join('')}</div></div>`,
    foot: `${it ? `<button class="btn danger left" id="piDel">${icon('trash')}Удалить</button>` : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" id="piSave">Сохранить</button>`,
    onMount(el, close) {
      const sync = () => {
        const pay = $('#piGroup', el).value === 'payroll';
        $('#piPayF', el).hidden = !pay;
        $('#piCatF', el).hidden = pay;
      };
      $('#piGroup', el).onchange = sync;
      sync();
      $('#piSave', el).onclick = () => {
        const title = $('#piTitle', el).value.trim();
        const amount = parseNum($('#piAmount', el).value);
        const months = $$('.chip.pick input:checked', el).map(i => i.value);
        if (!title) return $('#piTitle', el).focus();
        if (!(amount > 0)) { $('#piAmount', el).focus(); toast('Укажите сумму'); return; }
        if (!months.length) { toast('Отметьте хотя бы один месяц'); return; }
        const group = $('#piGroup', el).value;
        const data = {title, group, amount, months, cat: group === 'payroll' ? 'payroll' : $('#piCat', el).value,
          personId: group === 'payroll' ? $('#piPerson', el).value || null : null, insurance: group === 'payroll' ? $('#piIns', el).checked : false};
        if (it) Store.put('plan', it.id, {...it, ...data}); else Store.add('plan', data);
        close();
      };
      const del = $('#piDel', el);
      if (del) del.onclick = async () => {
        const paid = Store.all('ledger').filter(e => e.planId === it.id).length;
        if (!(await confirmPop(del, {text: paid ? `Удалить платёж из плана? ${paid} оплат(ы) останутся в журнале.` : 'Удалить платёж из плана?', yes: 'Да, удалить', danger: true}))) return;
        const copy = clone(it);
        Store.remove('plan', it.id);
        close();
        toast('Платёж удалён из плана', {undo: () => Store.put('plan', copy.id, copy)});
      };
    },
  });
}

    onMount(el, close) {
      let kind = e0.kind;
      const fillCats = keep => {
        const cats = KINDS[kind].cats;
        $('#leCat', el).innerHTML = Object.entries(cats).map(([k, n]) => `<option value="${k}" ${k === keep ? 'selected' : ''}>${n}</option>`).join('');

      fillCats(e0.cat);
      on(el, 'click', '[data-k]', (e, b) => { kind = b.dataset.k; $$('[data-k]', el).forEach(x => x.classList.toggle('on', x === b)); fillCats(''); });

        close();
        toast('Операция удалена', {undo: () => Store.put('ledger', copy.id, copy)});
      };
    },
  });
}

const SALES_FIELDS = [
