<title>Штаб Eva Club V2</title>
<meta name="description" content="Рабочий штаб команды Eva Space: задачи, деньги, продажи и отчёты до конца года.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── 00-tokens.css ── */
/* Деловая палитра на основе Книги стандартов Eva Space:
   Ночь #14111A — основа и тёмная панель, Роза и Золото — только акценты
   бренда (знак, отметки, деньги), Фиалка — ссылки и выбранное.
   Шрифт — Inter; Unbounded остаётся только в названии штаба. */
:root{
  --bg:#F3F3F6;
  --surface:#FFFFFF;
  --surface-2:#F8F8FA;
  --sunken:#EEEEF2;
  --line:#E2E2E8;
  --line-strong:#CBCBD4;
  --ink:#16141C;
  --ink-2:#4A4856;
  --ink-3:#7B7987;

  --night:#15121B;
  --night-2:#211C29;
  --night-line:#2F2838;
  --night-ink:#ECE9F1;
  --night-ink-2:#9F99AB;

  --accent:#1D1828;          /* главные кнопки */
  --on-accent:#FFFFFF;
  --link:#4F46B8;            /* ссылки, выбранные вкладки, фокус */
  --link-soft:#ECEBFA;

  --rose:#A8456F;
  --rose-brand:#E4A0B8;
  --rose-soft:#F7E6EE;
  --gold:#8A6420;
  --gold-brand:#E7C58B;
  --gold-soft:#F5EDDC;
  --violet:#4F46B8;
  --violet-soft:#ECEBFA;

  --good:#23734F;
  --good-soft:#E0F0E7;
  --bad:#A23A4A;
  --bad-soft:#F7E4E7;
  --warn:#94600E;
  --warn-soft:#F9EED8;

  --in-row:#F1F8F4;
  --out-row:#FCF3F4;

  /* сетка дорожной карты */
  --g-alt:rgba(22,20,28,.028);
  --g-half:rgba(22,20,28,.06);
  --g-month:rgba(22,20,28,.13);
  --g-quarter:rgba(22,20,28,.28);

  --shadow:0 1px 2px rgba(22,20,28,.05);
  --shadow-pop:0 16px 44px rgba(22,20,28,.18), 0 2px 6px rgba(22,20,28,.08);
  --radius:10px;
  --radius-sm:7px;

  --f-display:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --f-text:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --f-brand:'Unbounded', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111016; --surface:#1A1820; --surface-2:#1F1D26; --sunken:#15131A;
    --line:#2C2A34; --line-strong:#403D4B;
    --ink:#EFEDF3; --ink-2:#BEBBC8; --ink-3:#8D8A99;
    --night:#0C0B10; --night-2:#18161E; --night-line:#27242E;
    --accent:#ECE9F3; --on-accent:#15121B;
    --link:#A9A3F4; --link-soft:#26234A;
    --rose:#E4A0B8; --rose-soft:#3A2431;
    --gold:#E7C58B; --gold-soft:#33291B;
    --violet:#A9A3F4; --violet-soft:#26234A;
    --good:#7DCBA3; --good-soft:#1B3027;
    --bad:#EF929F; --bad-soft:#3B2027;
    --warn:#E8B463; --warn-soft:#352819;
    --in-row:#17231D; --out-row:#261B20;
    --g-alt:rgba(255,255,255,.025); --g-half:rgba(255,255,255,.05); --g-month:rgba(255,255,255,.11); --g-quarter:rgba(255,255,255,.24);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-pop:0 16px 44px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111016; --surface:#1A1820; --surface-2:#1F1D26; --sunken:#15131A;
  --line:#2C2A34; --line-strong:#403D4B;
  --ink:#EFEDF3; --ink-2:#BEBBC8; --ink-3:#8D8A99;
  --night:#0C0B10; --night-2:#18161E; --night-line:#27242E;
  --accent:#ECE9F3; --on-accent:#15121B;
  --link:#A9A3F4; --link-soft:#26234A;
  --rose:#E4A0B8; --rose-soft:#3A2431;
  --gold:#E7C58B; --gold-soft:#33291B;
  --violet:#A9A3F4; --violet-soft:#26234A;
  --good:#7DCBA3; --good-soft:#1B3027;
  --bad:#EF929F; --bad-soft:#3B2027;
  --warn:#E8B463; --warn-soft:#352819;
  --in-row:#17231D; --out-row:#261B20;
  --g-alt:rgba(255,255,255,.025); --g-half:rgba(255,255,255,.05); --g-month:rgba(255,255,255,.11); --g-quarter:rgba(255,255,255,.24);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 16px 44px rgba(0,0,0,.6);
}

/* ── 01-base.css ── */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 var(--f-text); -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance;}
h1{font:600 22px/1.25 var(--f-display); letter-spacing:-.015em;}
h2{font:600 15px/1.3 var(--f-display); letter-spacing:-.005em;}
h3{font:600 14px/1.35 var(--f-text);}
p{margin:0;}
a{color:inherit;}
button,input,select,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--link); outline-offset:2px;}
img{max-width:100%;}
[hidden]{display:none !important;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-3);}
.soft{color:var(--ink-2);}
.good{color:var(--good);}
.bad{color:var(--bad);}
.warn{color:var(--warn);}
.label{
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
}
.nowrap{white-space:nowrap;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

/* загрузка */
.boot{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:var(--ink-3); text-align:center; padding-inline:16px;
}
.boot b{font:500 17px var(--f-brand); color:var(--ink);}
.boot-mark{width:44px; height:44px; margin-bottom:8px; animation:pulse 1.6s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 02-shell.css ── */
/* Оболочка: тёмная боковая панель «Ночь» + рабочая область */
.app{min-height:100%;}
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh;}
.side{
  position:sticky; top:0; height:100vh; overflow-y:auto;
  background:var(--night); color:var(--night-ink);
  display:flex; flex-direction:column; padding:20px 14px 16px;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px; text-decoration:none;}
.brand-mark{width:34px; height:34px; flex:0 0 34px; border-radius:9px; box-shadow:0 2px 8px rgba(0,0,0,.35);}
.brand b{display:block; font:500 14.5px/1.1 var(--f-brand); color:#fff; letter-spacing:.02em;}
.brand span{display:block; font-size:11px; color:var(--night-ink-2); margin-top:3px;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav a{
  display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:7px;
  color:var(--night-ink-2); text-decoration:none; font-weight:500; font-size:14px;
}
.nav a svg{width:18px; height:18px; flex:0 0 18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.nav a:hover{background:var(--night-2); color:var(--night-ink);}
.nav a.on{background:var(--night-2); color:#fff; box-shadow:inset 2px 0 0 var(--gold-brand);}
.nav .badge{
  margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px;
  background:var(--rose-brand); color:var(--night); font-size:11.5px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center;
}
.side-foot{margin-top:auto; padding-top:18px; display:flex; flex-direction:column; gap:10px;}
.me-chip{
  display:flex; align-items:center; gap:10px; padding:8px; border-radius:9px;
  background:var(--night-2); border:1px solid var(--night-line);
}
.me-link{display:flex; align-items:center; gap:10px; flex:1; min-width:0; text-decoration:none; color:inherit; border-radius:7px;}
.me-link:hover b{text-decoration:underline; text-underline-offset:3px;}
.me-chip.on{border-color:var(--gold-brand);}
.me-chip .who{min-width:0; flex:1;}
.me-chip b{display:block; font-size:13px; color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.me-chip .who span{display:block; font-size:11.5px; color:var(--night-ink-2);}
.me-chip button{
  background:none; border:1px solid var(--night-line); color:var(--night-ink-2); border-radius:8px;
  width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 30px;
}
.me-chip button:hover{color:#fff; border-color:var(--rose-brand);}
.me-chip button svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8;}
.sync{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--night-ink-2); padding:0 4px;}
.sync i{width:7px; height:7px; border-radius:50%; background:#6FC49A; flex:0 0 7px;}
.sync.local i{background:var(--gold-brand);}
.sync.busy i{background:var(--gold-brand); animation:pulse 1s ease-in-out infinite;}
.sync.err i{background:#EF929F;}
@keyframes pulse{50%{opacity:.35;}}

.main{min-width:0; padding:26px 36px 64px;}
.page{max-width:1200px; margin:0 auto;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
.page-head .sub{color:var(--ink-3); margin-top:6px; max-width:62ch;}
.page-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.section{margin-top:30px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
.section-head .hint-inline{color:var(--ink-3); font-size:12.5px;}

/* узкие экраны: панель становится шапкой с прокручиваемым меню */
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);}
  .side{min-width:0;
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40; height:auto; overflow:visible;
    flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px 16px; gap:8px 12px;
  }
  .brand{padding:0; flex:1 1 auto;}
  .brand span{display:none;}
  .side-foot{margin:0; padding:0; flex-direction:row; align-items:center;}
  .sync span{display:none;}
  .me-chip{padding:4px 4px 4px 4px; background:none; border:0;}
  .me-chip .who{display:none;}
  .nav{order:3; flex:1 0 100%; flex-direction:row; overflow-x:auto; gap:4px; margin:0 -16px; padding:0 16px 2px; scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{padding:7px 10px; white-space:nowrap; font-size:13px;}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--rose-brand);}
  .main{padding:20px 16px 56px;}
  h1{font-size:20px;}
}

/* ── 03-components.css ── */
/* ── кнопки ── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:34px; padding:0 13px; border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-weight:500; font-size:13.5px; white-space:nowrap;
  text-decoration:none; transition:background .12s, border-color .12s, color .12s;
}
.btn:hover{border-color:var(--ink-3);}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.25);}
.btn.dark{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2);}
.btn.ghost:hover{background:var(--sunken); color:var(--ink);}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line));}
.btn.danger.solid{background:var(--bad); border-color:var(--bad); color:#fff;}
.btn.good{background:var(--good); border-color:var(--good); color:#fff;}
.btn.sm{height:30px; padding:0 10px; font-size:12.5px; border-radius:6px;}
.btn.xs{height:26px; padding:0 8px; font-size:12px; border-radius:7px;}
.btn[disabled]{opacity:.5; cursor:default; pointer-events:none;}
.icon-btn{
  width:32px; height:32px; border-radius:8px; border:1px solid transparent; background:none; color:var(--ink-3);
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 32px;
}
.icon-btn:hover{background:var(--sunken); color:var(--ink);}
.icon-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.link-btn{background:none; border:0; padding:0; color:var(--link); font-weight:500; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;}

/* ── поля ── */
.field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.field > span{font-size:12px; font-weight:500; color:var(--ink-2);}
.field small{font-size:11.5px; color:var(--ink-3);}
.input, .select, .textarea{
  width:100%; height:34px; padding:0 10px; border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:14px; min-width:0;
}
.textarea{height:auto; min-height:84px; padding:9px 11px; resize:vertical; line-height:1.5;}
.select{padding-right:28px; appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position:calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size:5px 5px; background-repeat:no-repeat;
}
.input:focus, .select:focus, .textarea:focus{outline:none; border-color:var(--link); box-shadow:0 0 0 3px var(--link-soft);}
.input.num{text-align:right;}
.input.sm, .select.sm{height:30px; font-size:13px; border-radius:8px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
@media (max-width:640px){ .grid2, .grid3{grid-template-columns:1fr;} }
.check{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px;}
.check input{width:16px; height:16px; accent-color:var(--link);}

/* ── переключатель вариантов ── */
.seg{display:inline-flex; background:var(--sunken); border-radius:8px; padding:3px; gap:2px; flex-wrap:wrap; border:1px solid var(--line);}
.seg button{
  border:0; background:none; height:28px; padding:0 11px; border-radius:6px; font-size:13px; font-weight:500; color:var(--ink-2);
  white-space:nowrap;
}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(23,19,31,.12);}
.seg.out button.on{color:var(--bad);} .seg.in button.on{color:var(--good);}

/* ── метки ── */
.pill{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:11px;
  font-size:11.5px; font-weight:600; white-space:nowrap; background:var(--sunken); color:var(--ink-2);
}
.pill.rose{background:var(--rose-soft); color:var(--rose);}
.pill.gold{background:var(--gold-soft); color:var(--gold);}
.pill.violet{background:var(--violet-soft); color:var(--violet);}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.line{background:none; border:1px solid var(--line-strong);}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 8px; background:var(--ink-3);}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  height:28px; padding:0 10px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface);
  font-size:12.5px; font-weight:500; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.chip:hover{border-color:var(--ink-3); color:var(--ink);}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.chip b{font-weight:700;}

/* ── панели ── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.card.flat{box-shadow:none;}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.card-head h2{font-size:14.5px;}
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));}
.split{display:grid; gap:16px; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);}
@media (max-width:1000px){ .split{grid-template-columns:1fr;} }

/* показатели */
.stat .label{display:block; margin-bottom:8px;}
.stat .big{font:600 26px/1.1 var(--f-display); letter-spacing:-.02em;}
.stat .big small{font:500 14px var(--f-text); color:var(--ink-3); letter-spacing:0;}
.stat .foot{margin-top:8px; font-size:12.5px; color:var(--ink-3);}
.bar{height:6px; border-radius:3px; background:var(--sunken); overflow:hidden; margin-top:10px; position:relative;}
.bar > i{display:block; height:100%; border-radius:3px; background:var(--link);}
.bar > i.good{background:var(--good);} .bar > i.warn{background:var(--warn);} .bar > i.bad{background:var(--bad);}
.bar > b{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); border-radius:1px;}

/* ── таблицы ── */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
table.t{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums;}
table.t th, table.t td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle;}
table.t th{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); background:var(--surface-2); white-space:nowrap;}
table.t tbody tr:last-child td{border-bottom:0;}
table.t td.r, table.t th.r{text-align:right;}
table.t td.c, table.t th.c{text-align:center;}
table.t tr.total td{font-weight:700; background:var(--surface-2);}
table.t tr.sub td{font-weight:600;}
table.t tr.group td{background:var(--sunken); font-weight:600; font-size:12px; color:var(--ink-2);}
table.t tr.now td{background:var(--rose-soft);}
table.t tr:hover td.hov{background:var(--surface-2);}
table.grid-lines td, table.grid-lines th{border-right:1px solid var(--line);}
table.grid-lines td:last-child, table.grid-lines th:last-child{border-right:0;}

/* ── аватар ── */
.av{
  width:26px; height:26px; border-radius:50%; flex:0 0 26px; display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff; background:var(--violet); letter-spacing:.02em; text-transform:uppercase;
}
.av.lg{width:40px; height:40px; flex-basis:40px; font-size:14px;}
.av.none{background:var(--sunken); color:var(--ink-3); border:1px dashed var(--line-strong);}
.av img{width:100%; height:100%; border-radius:50%; object-fit:cover;}

/* ── пустое состояние и подсказки ── */
.empty{padding:26px 18px; text-align:center; color:var(--ink-3); font-size:13.5px; border:1px dashed var(--line-strong); border-radius:var(--radius);}
.empty b{display:block; color:var(--ink-2); margin-bottom:4px; font-size:14px;}
.help{
  display:flex; gap:14px; align-items:flex-start; padding:12px 16px; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--link); color:var(--ink-2); font-size:13px; line-height:1.55; margin-bottom:18px;
}
.help b{color:var(--ink);}
.help ol, .help ul{margin:4px 0 0; padding-left:18px;}
.help .x{margin-left:auto; flex:0 0 auto;}
.note{font-size:12.5px; color:var(--ink-3); line-height:1.5;}

/* ── вкладки ── */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; scrollbar-width:none;}
.tabs button{
  border:0; background:none; padding:10px 12px; font-weight:500; color:var(--ink-3); font-size:14px; white-space:nowrap;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink);}
.tabs button.on{color:var(--ink); border-bottom-color:var(--link);}
.tabs button .n{font-size:11.5px; color:var(--ink-3); margin-left:4px;}

/* ── окно ── */
.modal-back{
  position:fixed; inset:0; z-index:100; background:rgba(14,11,18,.48); display:flex; align-items:flex-start; justify-content:center;
  padding:6vh 16px 24px; overflow-y:auto; animation:fade .14s ease-out;
}
.modal{
  width:100%; max-width:560px; background:var(--surface); border-radius:12px; box-shadow:var(--shadow-pop);
  border:1px solid var(--line); animation:rise .16s ease-out;
}
.modal.wide{max-width:860px;}
.modal-head{display:flex; align-items:flex-start; gap:12px; padding:18px 20px 0;}
.modal-head h2{flex:1; font-size:16px; padding-top:4px;}
.modal-body{padding:16px 20px 20px; display:flex; flex-direction:column; gap:14px;}
.modal-foot{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:14px 20px; border-top:1px solid var(--line); background:var(--surface-2); border-radius:0 0 12px 12px;}
.modal-foot .left{margin-right:auto;}
@keyframes fade{from{opacity:0;}}
@keyframes rise{from{opacity:0; transform:translateY(8px);}}

/* ── всплывающее подтверждение ── */
.pop{
  position:absolute; z-index:120; width:max-content; max-width:280px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow-pop); padding:12px 14px; animation:fade .12s ease-out;
}
.pop p{font-size:13px; font-weight:500; margin-bottom:10px;}
.pop .row{gap:6px;}

/* ── уведомления ── */
.toast-root{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:max-content; max-width:calc(100vw - 32px);}
.toast{
  display:flex; align-items:center; gap:14px; background:var(--night); color:var(--night-ink); padding:10px 14px 10px 16px;
  border-radius:11px; box-shadow:var(--shadow-pop); font-size:13.5px; animation:rise .16s ease-out;
}
.toast button{background:none; border:0; color:var(--rose-brand); font-weight:600; padding:2px 4px;}
.toast.err{background:var(--bad);}

/* ── графики ── */
.chart{width:100%; height:auto; display:block; overflow:visible;}
.chart text{font:11px var(--f-text); fill:var(--ink-3);}
.chart .grid{stroke:var(--line); stroke-width:1;}
.chart .axis{stroke:var(--line-strong); stroke-width:1;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:8px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:14px; height:3px; border-radius:2px; display:inline-block;}
.legend i.dash{background:repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height:2px;}
@media (max-width:640px){
  .tiles, .periods, .cf-sum{grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .tiles .stat, .periods .period, .cf-sum .stat{min-height:0; padding:14px;}
  .stat .big{font-size:20px;}
  .stat .foot{font-size:12px;}
}

/* ── 10-auth-home.css ── */
/* ── вход ── */
.auth-page{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
  background:radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb, var(--rose-brand) 22%, transparent), transparent 60%), var(--bg);}
.auth{display:grid; grid-template-columns:minmax(0,420px) minmax(0,300px); gap:40px; align-items:center; width:100%; max-width:800px;}
.auth-card{padding:28px; display:flex; flex-direction:column; gap:14px;}
.auth-brand{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
.auth-mark{width:44px; height:44px; flex:0 0 44px; border-radius:11px;}
.auth-brand b{display:block; font:500 16px/1.1 var(--f-brand);}
.auth-brand span{font-size:12px; color:var(--ink-3);}
.auth-tabs{align-self:flex-start;}
.auth-card h1{font-size:21px;}
.auth-lead{color:var(--ink-2); font-size:13.5px; margin-top:-6px;}
.auth-fields{display:flex; flex-direction:column; gap:12px;}
.auth-code{text-transform:uppercase; letter-spacing:.12em; font-weight:600;}
.auth-go{height:42px; font-size:14.5px;}
.auth-msg{background:var(--bad-soft); color:var(--bad); border-radius:9px; padding:10px 12px; font-size:13px;}
.auth-links{display:flex; justify-content:center; min-height:4px;}
.auth-note{font-size:11.5px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:12px; line-height:1.5;}
.auth-side .label{margin-bottom:12px; display:block;}
.auth-roles{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:12px;}
.auth-roles li{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--ink-2);}
.auth-roles .pill{align-self:flex-start;}
@media (max-width:760px){ .auth{grid-template-columns:1fr;} .auth-side{display:none;} }

/* ── главная ── */
.tiles .stat{min-height:132px;}
a.card.as-link{text-decoration:none; color:inherit; transition:border-color .12s;}
a.card.as-link:hover{border-color:var(--line-strong); background:var(--surface-2);}
.focus-list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.focus-row{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--surface); border:0; border-bottom:1px solid var(--line); text-align:left; text-decoration:none; color:inherit; width:100%;}
.focus-row:last-child{border-bottom:0;}
.focus-row:hover{background:var(--surface-2);}
.fr-t{flex:1; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px;}
.focus-pay{margin-top:14px; display:flex; flex-direction:column; gap:4px;}
.focus-pay .label{margin-bottom:4px;}
.fp-row{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px dashed var(--line); text-decoration:none; color:inherit; font-size:13.5px;}
.fp-row b{font-variant-numeric:tabular-nums;}
.today{display:flex; flex-direction:column; gap:14px;}
.today .card-head{margin-bottom:0;}
.today-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line);}
.today-row.wait{background:var(--warn-soft); border-color:transparent;}
.today-row.ok{background:var(--good-soft); border-color:transparent;}
.today-row > div{flex:1; display:flex; flex-direction:column; gap:2px; font-size:13.5px;}
.today-rh{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.today-rh > div{display:flex; gap:10px; align-items:flex-start; font-size:13px;}
.today-rh svg{width:18px; height:18px; stroke:var(--violet); fill:none; stroke-width:1.8; flex:0 0 18px; margin-top:1px;}
.today-rh span{display:flex; flex-direction:column;}
.today-rh small{color:var(--ink-3); font-size:12px;}
@media (max-width:520px){ .today-rh{grid-template-columns:1fr;} }
.feed{display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line); padding-top:12px;}
.feed .label{margin-bottom:6px;}
.feed-row{display:flex; gap:10px; align-items:flex-start; background:none; border:0; text-align:left; padding:6px 4px; border-radius:8px; font-size:13px; color:var(--ink);}
.feed-row:hover{background:var(--surface-2);}
.feed-row > span:not(.av){display:flex; flex-direction:column; min-width:0;}
.feed-row small{color:var(--ink-3); font-size:11.5px;}
.help.start{border-left-color:var(--gold);}
.help.start a{color:var(--link); font-weight:600;}

/* ── материалы ── */
.mats{display:flex; flex-direction:column; gap:14px;}
.mat-hero{
  display:flex; align-items:center; gap:18px; padding:18px 20px; border-radius:var(--radius); text-decoration:none;
  background:var(--night); color:var(--night-ink); border:1px solid var(--night-line);
}
.mat-hero:hover{border-color:var(--rose-brand);}
.mat-star{width:48px; height:48px; flex:0 0 48px; border-radius:12px;}
.mat-hero > div{flex:1; min-width:0;}
.mat-hero .label{color:var(--night-ink-2);}
.mat-hero b{display:block; font:600 17px/1.25 var(--f-display); color:#fff; margin:2px 0 4px;}
.mat-hero p{font-size:13px; color:var(--night-ink-2);}
.mat-hero .btn.primary{background:var(--gold-brand); border-color:var(--gold-brand); color:var(--night);}
.mat-groups{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px;}
.mat-group{display:flex; flex-direction:column; gap:8px;}
.mat-gh{display:flex; flex-direction:column; padding:0 2px 2px;}
.mat-gh b{font-size:13.5px;}
.mat-gh span{font-size:12px; color:var(--ink-3);}
.mat{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:11px; background:var(--surface);
  border:1px solid var(--line); text-decoration:none; color:inherit; transition:border-color .12s, transform .12s;
}
.mat:hover{border-color:var(--line-strong); background:var(--surface-2);}
.mat-ico{width:34px; height:34px; border-radius:8px; background:var(--sunken); color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; flex:0 0 34px;}
.mat-ico svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9;}
.mat-t{flex:1; min-width:0; display:flex; flex-direction:column;}
.mat-t b{font-size:13.5px;}
.mat-t small{font-size:12px; color:var(--ink-3); line-height:1.4;}
.mat-go{width:16px; height:16px; stroke:var(--ink-3); fill:none; stroke-width:1.9; flex:0 0 16px;}
.mat-wrap{position:relative;}
.mat-wrap .mat{padding-right:44px;}
.mat-del{position:absolute; right:6px; top:50%; transform:translateY(-50%);}
.mat-more{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:13px; padding:4px 2px;}
.mat-more .label{margin-right:4px;}
.mat-more a{color:var(--ink-2); display:inline-flex; align-items:center; gap:4px; text-decoration:none;}
.mat-more a:hover{color:var(--link);}
.mat-more svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2;}
.mat-add{align-self:flex-start;}
.viewer{display:flex; flex-direction:column; gap:12px;}
.viewer-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.viewer-t{flex:1; min-width:180px; display:flex; flex-direction:column;}
.viewer-t b{font:600 17px/1.2 var(--f-display);}
.viewer-act{display:flex; gap:8px; flex-wrap:wrap;}
.viewer-frame{position:relative; height:calc(100vh - 170px); min-height:420px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:#faf9f5;}
.viewer-frame iframe{width:100%; height:100%; border:0; display:block; background:#faf9f5;}
.viewer-load{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#6b6760; text-align:center; padding:24px;}
.viewer-load b{color:#1c1b18; font-size:15px;}
@media (max-width:880px){ .viewer-frame{height:calc(100vh - 220px);} }

/* ── подсказка графика ── */
.chart-box{position:relative;}
.chart-tip{
  position:absolute; z-index:5; pointer-events:none; background:var(--surface); border:1px solid var(--line); border-radius:9px;
  box-shadow:var(--shadow-pop); padding:8px 10px; font-size:12px; min-width:130px;
}
.tip-h{font-weight:600; color:var(--ink-2); margin-bottom:4px;}
.tip-row{display:flex; align-items:center; gap:7px; line-height:1.6;}
.tip-row i{width:12px; height:2px; border-radius:1px; display:inline-block; flex:0 0 12px;}
.tip-row i.dash{background:repeating-linear-gradient(90deg, currentColor 0 3px, transparent 3px 5px) !important;}
.tip-row b{font-variant-numeric:tabular-nums; color:var(--ink);}
.tip-row span{color:var(--ink-3);}
.chart .bar-hit:hover path, .chart .bar-hit:focus path{filter:brightness(1.12);}
.chart .bar-hit:focus{outline:none;}
.chart .cross{stroke:var(--ink-3); stroke-width:1;}

/* ── 20-strategy.css ── */
/* ── стратегия ── */
.north{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:24px; align-items:center;}
.north-num{display:flex; align-items:baseline; gap:12px; margin:8px 0 2px;}
.north-num b{font:600 44px/1 var(--f-display); letter-spacing:-.03em; color:var(--ink);}
.north-num span{color:var(--ink-3); font-size:15px;}
.north .bar{height:8px;}
.north .note{margin-top:10px;}
.north-side{display:grid; gap:12px; border-left:1px solid var(--line); padding-left:24px;}
.north-side > div{display:grid; grid-template-columns:1fr auto; align-items:baseline; gap:2px 12px;}
.north-side .label{grid-column:1 / -1;}
.north-side b{font:600 17px var(--f-display); color:var(--ink); font-variant-numeric:tabular-nums;}
.north-side small{font-size:12px; color:var(--ink-3); text-align:right;}
@media (max-width:760px){ .north{grid-template-columns:1fr;} .north-side{border-left:0; padding-left:0; border-top:1px solid var(--line); padding-top:14px;} }

.goals{display:grid; grid-template-columns:repeat(auto-fit, minmax(205px, 1fr)); gap:12px;}
.goal{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
.goal.is-done{background:var(--violet-soft); border-color:transparent;}
.goal-top{display:flex; align-items:center; gap:8px;}
.goal-n{font:600 12px var(--f-display); color:var(--ink-3); margin-right:auto; letter-spacing:.04em;}
.goal-st{width:auto; height:28px; font-size:12px; font-weight:600; padding-left:10px;}
.goal-st.good{color:var(--good);} .goal-st.bad{color:var(--bad);} .goal-st.violet{color:var(--violet);}
.goal-short{font:600 16px/1.25 var(--f-display);}
.goal-title{color:var(--ink-2); font-size:13.5px;}
.goal-items{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
.goal-items .check{align-items:flex-start; font-size:13px; line-height:1.45; color:var(--ink-2);}
.goal-items .check input{margin-top:2px; flex:0 0 16px;}
.goal-items .check.on span{text-decoration:line-through; color:var(--ink-3);}
.goal-result{font-size:13px; background:var(--surface-2); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; gap:2px;}
.goal-foot{margin-top:auto; padding-top:8px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink-3); flex-wrap:wrap;}

.sc-table td{vertical-align:top;}
.sc-table tr.sc-on td{background:var(--link-soft);}
.sc-pick{display:inline-flex; align-items:center; gap:8px; cursor:pointer;}
.sc-pick input{accent-color:var(--link); width:16px; height:16px;}
.sc-note{margin-top:8px;}
.drivers{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:14px;}
.driver{padding:14px 16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:4px;}
.driver b{font-size:14px;}
.driver p{font-size:13px; color:var(--ink-2);}

/* дорожная карта: расчерченная сетка */
.gt-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
.gt{--lab:250px; --mw:58px; min-width:calc(var(--lab) + 17 * var(--mw)); position:relative; font-size:12.5px;}
.gt-head, .gt-row, .gt-dir{display:grid; grid-template-columns:var(--lab) minmax(0,1fr);}
.gt-lab{position:sticky; left:0; z-index:3; background:var(--surface); border-right:1px solid var(--line-strong); padding:0 10px 0 14px; display:flex; align-items:center; gap:8px; min-width:0;}
.gt-lab span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink-2);}
.gt-lab b{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap;}
.gt-lab .icon-btn{width:24px; height:24px; flex-basis:24px; margin-left:auto;}
.gt-head{position:sticky; top:0; z-index:4; background:var(--surface-2); border-bottom:1px solid var(--line-strong);}
.gt-head .gt-tl{padding-bottom:6px;}
.gt-corner{background:var(--surface-2); font-size:11px; color:var(--ink-3); line-height:1.35;}
.gt-qrow, .gt-mrow{display:flex;}
.gt-qrow div{flex:0 0 auto; padding:6px 8px 4px; font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--ink-2); border-left:1px solid var(--g-quarter); white-space:nowrap; overflow:hidden;}
.gt-qrow div:first-child{border-left:0;}
.gt-mrow div{flex:1 1 0; padding:4px 0 6px 7px; font-size:11.5px; color:var(--ink-3); border-left:1px solid var(--g-month); white-space:nowrap;}
.gt-mrow div:first-child{border-left:0;}
.gt-mrow div.now{color:var(--link); font-weight:700;}
.gt-tl{position:relative; min-width:0;}
.gt-tl.grid{
  background-image:
    linear-gradient(to right, var(--g-month) 1px, transparent 1px),
    linear-gradient(to right, var(--g-half) 1px, transparent 1px),
    linear-gradient(to right, var(--g-alt) 50%, transparent 50%);
  background-size:calc(100% / 17) 100%, calc(100% / 34) 100%, calc(200% / 17) 100%;
}
.gt-row{min-height:36px; border-bottom:1px solid var(--line);}
.gt-row:hover .gt-lab, .gt-row:hover .gt-tl{background-color:color-mix(in srgb, var(--link-soft) 35%, transparent);}
.gt-row:hover .gt-lab{background-color:color-mix(in srgb, var(--link-soft) 35%, var(--surface));}
.gt-dir{border-bottom:1px solid var(--line); border-top:1px solid var(--line-strong); background:var(--surface-2);}
.gt-dir .gt-lab{background:var(--surface-2); padding-top:8px; padding-bottom:8px;}
.gt-dir .gt-lab b{color:var(--c);}
.gt-dir .gt-lab span{font-size:11px; color:var(--ink-3); background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:0 6px;}
.gt-add{margin-left:auto; display:inline-flex; align-items:center; gap:3px; background:none; border:1px dashed var(--line-strong); border-radius:6px; padding:2px 7px; font-size:11.5px; color:var(--ink-3);}
.gt-add svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.2;}
.gt-add:hover{border-color:var(--link); color:var(--link);}
.gt-bar{
  position:absolute; top:6px; height:24px; border-radius:6px; display:flex; align-items:center; gap:6px; padding:0 8px; min-width:10px;
  background:color-mix(in srgb, var(--c) 18%, var(--surface)); border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
  color:var(--ink); font-size:11.5px; font-weight:500; overflow:hidden; cursor:pointer; z-index:2; box-shadow:0 1px 2px rgba(22,20,28,.06);
}
.gt-bar.can{cursor:grab;}
.gt-bar.doing{background:color-mix(in srgb, var(--c) 42%, var(--surface)); border-color:var(--c);}
.gt-bar.done{background:var(--good-soft); border-color:color-mix(in srgb, var(--good) 45%, transparent); color:var(--ink-3);}
.gt-bar:hover{box-shadow:0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent);}
.gt-bar.moving{cursor:grabbing; box-shadow:0 8px 20px rgba(22,20,28,.22); z-index:5; overflow:visible;}
.gt-bar.moving::after, .gt-mile.moving::after{content:attr(data-tip); position:absolute; left:0; bottom:calc(100% + 6px); background:var(--night); color:#fff; font-size:11px; padding:3px 7px; border-radius:5px; white-space:nowrap;}
.gt-bt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; pointer-events:none;}
.gt-bar em{font-style:normal; font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; pointer-events:none;}
.gt-hl, .gt-hr{position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:3;}
.gt-hl{left:0;} .gt-hr{right:0;}
.gt-bar.can:hover .gt-hl, .gt-bar.can:hover .gt-hr{background:color-mix(in srgb, var(--c) 35%, transparent);}
.gt-stage-row .gt-tl{min-height:40px;}
.gt-stage{position:absolute; top:5px; bottom:5px; border-radius:6px; padding:3px 8px; display:flex; flex-direction:column; justify-content:center; overflow:hidden; font-size:11.5px; background:var(--sunken); border:1px solid var(--line); color:var(--ink-2);}
.gt-stage b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.gt-stage small{font-size:10.5px; color:var(--link); font-weight:600;}
.gt-stage.s1{background:var(--violet-soft);} .gt-stage.s2{background:var(--gold-soft);}
.gt-stage.here{border-color:var(--link); box-shadow:inset 0 0 0 1px var(--link);}
.gt-mile-row .gt-tl{min-height:36px;}
.gt-mile{position:absolute; top:6px; display:flex; align-items:center; gap:5px; transform:translateX(-6px); cursor:pointer; z-index:2; white-space:nowrap;}
.gt-mile.can{cursor:grab;}
.gt-mile i{width:12px; height:12px; flex:0 0 12px; transform:rotate(45deg); background:var(--gold-brand); border:2px solid var(--surface); box-shadow:0 0 0 1px var(--gold);}
.gt-mile span{font-size:11px; font-weight:600; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:1px 6px; max-width:170px; overflow:hidden; text-overflow:ellipsis;}
.gt-mile.done i{background:var(--good); box-shadow:0 0 0 1px var(--good);}
.gt-mile.done span{color:var(--good); border-color:color-mix(in srgb, var(--good) 35%, var(--line));}
.gt-mile.late i{background:var(--bad-soft); box-shadow:0 0 0 1px var(--bad);}
.gt-mile.late span{color:var(--bad);}
.gt-mile:hover span{border-color:var(--gold);}
.gt-mile.moving{z-index:6;}
.gt-body{position:relative;}
.gt-over{position:absolute; top:0; bottom:0; left:var(--lab); right:0; pointer-events:none; z-index:1;}
.gt-ql{position:absolute; top:0; bottom:0; width:0; border-left:1px solid var(--g-quarter);}
.gt-ql.year{border-left:2px solid var(--g-quarter);}
.gt-ml{position:absolute; top:0; bottom:0; width:0; border-left:1px dashed color-mix(in srgb, var(--gold) 55%, transparent);}
.gt-now{position:absolute; top:0; bottom:0; width:0; border-left:2px solid var(--rose); z-index:4;}
.gt-now-tag{position:absolute; bottom:2px; transform:translateX(-50%); font-style:normal; font-size:10px; font-weight:700; color:#fff; background:var(--rose); padding:0 5px; border-radius:4px; line-height:15px; white-space:nowrap; z-index:2;}
.gt-lab-col{flex-wrap:wrap; row-gap:0; padding-top:8px; padding-bottom:8px;}
.gt-lab-col small{flex-basis:100%; order:3; font-size:11px; color:var(--ink-3);}
.gt-lab-col .gt-add{order:2;}
.g-legend .g-leg-now{width:2px; height:12px; background:var(--rose);}
.g-legend .g-leg-mile{width:10px; height:10px; transform:rotate(45deg); background:var(--gold-brand); border-radius:1px;}
@media (max-width:640px){ .gt{--lab:150px; --mw:48px;} .gt-corner{font-size:10px;} }

.whales{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px;}
.whale{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--c);}
.whale-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.whale-h b{font:600 14.5px var(--f-display);}
.whale p{font-size:13px; color:var(--ink-2);}
.whale-m{font-size:13px; display:flex; flex-direction:column; gap:2px;}
.whale-lead{display:flex; align-items:center; gap:8px; margin-top:auto; font-size:13px;}
.rhythm{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px;}
.rh{padding:14px 16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:6px;}
.rh b{font-size:14px;}
.rh p{font-size:13px; color:var(--ink-2);}

/* ── 30-tasks.css ── */
/* ── задачи: панель ── */
.t-bar{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin-bottom:16px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
.t-bar .select{width:auto; max-width:190px;}
.t-search{width:170px;}
.t-bar-sp{flex:1;}
.t-done-t{font-size:12.5px; color:var(--ink-2);}
@media (max-width:760px){ .t-bar .select, .t-search{max-width:none; flex:1 1 140px;} .t-bar-sp{display:none;} }

/* ── доска ── */
.kb{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(264px, 1fr); gap:12px; overflow-x:auto; padding-bottom:10px; align-items:start;}
.kb-wide{grid-auto-columns:minmax(250px, 1fr);}
.kb-weeks{grid-auto-columns:minmax(210px, 1fr);}
@media (max-width:760px){ .kb, .kb-wide, .kb-weeks{grid-auto-columns:minmax(82vw, 1fr); scroll-snap-type:x mandatory;} .kb-col{scroll-snap-align:start;} }
.kb-col{background:var(--sunken); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column; min-height:120px; transition:border-color .12s, background .12s;}
.kb-col.now{border-color:color-mix(in srgb, var(--link) 45%, var(--line));}
.kb-col.backlog{background:var(--surface-2); border-style:dashed;}
.kb-col.drop-on{border-color:var(--link); background:color-mix(in srgb, var(--link-soft) 70%, var(--sunken));}
.kb-h{display:flex; align-items:center; gap:8px; padding:10px 12px 8px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.kb-h b{font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap;}
.kb-h em{font-style:normal; font-size:11.5px; color:var(--ink-3);}
.kb-col.doing .kb-h b{color:var(--violet);} .kb-col.review .kb-h b{color:var(--gold);} .kb-col.done .kb-h b{color:var(--good);}
.kb-col.now .kb-h b::after{content:' · сейчас'; color:var(--link); text-transform:none; letter-spacing:0; font-weight:600;}
.kb-n{margin-left:auto; min-width:22px; height:20px; padding:0 6px; border-radius:10px; background:var(--surface); border:1px solid var(--line); font-size:11.5px; font-weight:600; color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;}
.kb-prog{font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.kb-list{display:flex; flex-direction:column; gap:8px; padding:10px; min-height:60px;}
.kb-add{display:flex; align-items:center; gap:6px; width:100%; padding:8px 10px; border-radius:8px; border:1px dashed var(--line-strong); background:transparent; color:var(--ink-3); font-size:13px; font-weight:500; text-align:left;}
.kb-add svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;}
.kb-add:hover{border-style:solid; border-color:var(--link); color:var(--link); background:var(--surface);}
.kb-more-done{background:none; border:0; color:var(--link); font-size:12.5px; font-weight:500; padding:4px; text-align:left;}
.kb-composer{background:var(--surface); border:1px solid var(--link); border-radius:9px; padding:8px; display:flex; flex-direction:column; gap:6px; box-shadow:0 0 0 3px var(--link-soft);}
.kb-composer .textarea{min-height:52px; border:0; padding:4px 6px; box-shadow:none; resize:none; font-size:13.5px;}
.kb-composer .textarea:focus{box-shadow:none;}
.kb-comp-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.kb-comp-row .select, .kb-comp-row .input{flex:1 1 110px; width:auto;}
.kb-more{margin-left:auto;}
.list-add{background:none; border:0; min-height:0; margin-bottom:8px;}
.list-add .kb-list{padding:0; min-height:0;}

/* карточка */
.kc{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 10px 10px; display:flex; flex-direction:column; gap:7px; cursor:pointer; box-shadow:0 1px 1px rgba(22,20,28,.04); user-select:none; -webkit-user-select:none; touch-action:manipulation;}
.kc.can{cursor:grab;}
.kc:hover{border-color:var(--line-strong);}
.kc:focus-visible{outline:2px solid var(--link); outline-offset:1px;}
.kc.fresh{box-shadow:inset 3px 0 0 var(--rose-brand);}
.kc.done .kc-title{color:var(--ink-3); text-decoration:line-through;}
.kc-top{display:flex; align-items:center; gap:6px; min-height:24px;}
.kc-dir{font-size:10.5px; font-weight:700; letter-spacing:.06em; padding:2px 6px; border-radius:5px; color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent);}
.kc-dir.none{color:var(--ink-3); background:var(--sunken);}
.kc-prio{width:16px; height:16px; border-radius:50%; background:var(--bad-soft); color:var(--bad); font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center;}
.kc-av{margin-left:auto; background:none; border:0; padding:0; border-radius:50%; line-height:0;}
.kc-av:hover:not([disabled]) .av{box-shadow:0 0 0 2px var(--link);}
.kc-av .av{width:24px; height:24px; flex-basis:24px; font-size:10px;}
.kc-av[disabled]{cursor:default;}
.kc-title{font-size:13.5px; font-weight:500; line-height:1.4; overflow-wrap:anywhere;}
.kc-foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ink-3);}
.kc-foot .t-goal{max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.kc-st{margin-left:auto; height:20px; font-size:11px;}
.due svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2; vertical-align:-2px; margin-right:3px;}
.drag-ghost{position:fixed; left:0; top:0; z-index:300; pointer-events:none; box-shadow:0 18px 40px rgba(22,20,28,.28); border-color:var(--link) !important; opacity:.96; cursor:grabbing;}
.drag-ph{border:2px dashed var(--link); border-radius:9px; background:color-mix(in srgb, var(--link-soft) 60%, transparent); flex:0 0 auto;}
.kc.drag-src{display:none;}
body.dragging-now, body.dragging-now *{cursor:grabbing !important; user-select:none !important;}
.week-tabs{margin-bottom:12px;}

/* выбор исполнителя */
.pop.pick{padding:6px; max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:1px; min-width:220px;}
.pick-i{background:none; border:0; text-align:left; padding:7px 10px; border-radius:6px; font-size:13px; color:var(--ink);}
.pick-i:hover, .pick-i:focus{background:var(--sunken); outline:none;}
.pick-i.on{font-weight:600; color:var(--link);}
.t-m-title.need, .input.need{border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-soft);}

/* ── список ── */
.t-group{margin-bottom:18px;}
.t-group-head{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin:0 0 8px 2px; display:flex; gap:8px; align-items:baseline;}
.t-group-head span{color:var(--ink-3); font-weight:600;}
.t-group-head em{font-style:normal; text-transform:none; letter-spacing:0; font-weight:400; color:var(--ink-3); font-size:12.5px;}
.t-group-head.as-btn{background:none; border:0; padding:4px 2px; cursor:pointer;}
.t-group-head.as-btn:hover{color:var(--ink);}
.t-list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); overflow:hidden;}
.t-list.mini{border-radius:10px;}
.t-row{
  display:grid; grid-template-columns:28px minmax(0,1fr) 140px 86px 104px; gap:12px; align-items:center;
  padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer; background:var(--surface);
}
.t-row:last-child{border-bottom:0;}
.t-row:hover{background:var(--surface-2);}
.t-row.fresh{box-shadow:inset 3px 0 0 var(--rose);}
.t-row.done .t-title{color:var(--ink-3); text-decoration:line-through;}
.t-list.mini .t-row{grid-template-columns:28px minmax(0,1fr) auto 86px; }
.t-list.mini .t-row .t-st{display:none;}
.t-list.grouped .t-row{grid-template-columns:28px minmax(0,1fr) 150px 96px;}
.t-list.grouped .t-st{display:none;}
.t-list.mini .t-who-n{display:none;}
.t-check{
  width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line-strong); background:var(--surface); color:transparent;
  display:inline-flex; align-items:center; justify-content:center; padding:0;
}
.t-check svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
.t-check:hover:not([disabled]){border-color:var(--good); color:var(--good);}
.t-check.done{background:var(--good); border-color:var(--good); color:#fff;}
.t-check.review{background:var(--gold-soft); border-color:var(--gold); color:var(--gold);}
.t-check[disabled]{opacity:.45; cursor:default;}
.t-main{min-width:0;}
.t-title{font-size:13.5px; font-weight:500; line-height:1.4; overflow-wrap:anywhere;}
.prio{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--bad); margin-right:7px; vertical-align:middle; position:relative; top:-1px;}
.t-meta{display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:3px; font-size:12px; color:var(--ink-3); align-items:center;}
.t-meta:empty{display:none;}
.t-goal{color:var(--violet); font-weight:500;}
.t-dir{display:inline-flex; align-items:center; gap:5px;}
.t-dir .dot{width:6px; height:6px; flex-basis:6px;}
.t-cm{display:inline-flex; align-items:center; gap:3px;}
.t-cm svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8;}
.t-who{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2); min-width:0;}
.t-who-n{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.due{font-size:12px; color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums;}
.due.none{color:var(--ink-3);}
.due.late{color:var(--bad); font-weight:600;}
.due.soon{color:var(--warn); font-weight:600;}
.t-st{justify-self:start;}
@media (max-width:760px){
  .t-row, .t-list.grouped .t-row, .t-list.mini .t-row{grid-template-columns:26px minmax(0,1fr) auto; row-gap:6px;}
  .t-row .t-who{grid-column:2; grid-row:2;}
  .t-row .due{grid-column:3; grid-row:1;}
  .t-row .t-st{grid-column:3; grid-row:2; justify-self:end;}
}

/* карточка задачи */
.t-m-title{height:auto; font:500 18px/1.35 var(--f-text); padding:8px 11px; border-color:transparent; background:var(--surface-2);}
.t-m-title:hover{border-color:var(--line-strong);}
.t-m-status{display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; padding:10px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line);}
.st-steps{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.st-steps i{width:14px; height:1px; background:var(--line-strong);}
.st-step{font-size:12px; color:var(--ink-3); padding:3px 9px; border-radius:11px;}
.st-step.on{font-weight:700; color:var(--ink); background:var(--sunken);}
.st-step.on.violet{background:var(--violet-soft); color:var(--violet);}
.st-step.on.gold{background:var(--gold-soft); color:var(--gold);}
.st-step.on.good{background:var(--good-soft); color:var(--good);}
.st-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.t-m-comments{display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--line); padding-top:14px;}
.thread{display:flex; flex-direction:column; gap:10px; max-height:300px; overflow-y:auto; padding-right:4px;}
.th-msg{display:flex; gap:10px; align-items:flex-start;}
.th-msg > div{flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 11px;}
.th-msg.ret > div{background:var(--bad-soft); border-color:transparent;}
.th-h{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; font-size:12.5px; margin-bottom:2px;}
.th-h time, .th-sys time{color:var(--ink-3); font-size:11.5px;}
.th-msg p{font-size:13.5px; white-space:pre-wrap; overflow-wrap:anywhere;}
.th-sys{display:flex; gap:8px; justify-content:center; font-size:11.5px; color:var(--ink-3); text-align:center;}
.t-m-cform{display:flex; gap:8px; align-items:flex-end;}
.t-m-cform .textarea{min-height:44px;}
.t-m-cform .textarea.need{border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-soft);}

/* ── 40-money-reports.css ── */
/* ── деньги ── */
.qe{display:flex; flex-direction:column; gap:14px; margin-bottom:18px; border-top:3px solid var(--bad);}
.qe.in{border-top-color:var(--good);} .qe.invest{border-top-color:var(--violet);}
.qe-kind{align-self:flex-start;}
.qe-kind .k-out.on{color:var(--bad);} .qe-kind .k-in.on{color:var(--good);} .qe-kind .k-invest.on{color:var(--violet);}
.qe-fields{display:grid; grid-template-columns:150px 210px 150px minmax(0,1fr) auto; gap:10px; align-items:end;}
.qe-amount .input{font:600 16px var(--f-text); height:40px;}
.qe-fields .input, .qe-fields .select, .qe-go{height:40px;}
@media (max-width:1000px){ .qe-fields{grid-template-columns:1fr 1fr;} .qe-note, .qe-go{grid-column:1 / -1;} }
.qe-recent{display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; border-top:1px solid var(--line); padding-top:10px;}
.qe-recent .label{margin-right:4px;}
.qe-r{display:inline-flex; gap:8px; align-items:center; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:4px 9px; font-size:12px; color:var(--ink-2); max-width:100%;}
.qe-r span:nth-child(2){max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.qe-r b{font-variant-numeric:tabular-nums;}
.money-top{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px;}
.cash-card{background:var(--night); color:var(--night-ink); border-color:var(--night-line);}
.cash-card .label{color:var(--night-ink-2);}
.cash-card .big{color:var(--gold-brand);}
.cash-card .foot{color:var(--night-ink-2);}
.month-card{padding:14px 16px; display:flex; flex-direction:column; gap:6px;}
.month-card.plan{background:var(--surface-2); box-shadow:none;}
.mc-h{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
.mc-h b{font:600 14px var(--f-display);}
.mc-row{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-2);}
.mc-row b{font-variant-numeric:tabular-nums;}
.mc-row.total{border-top:1px solid var(--line); padding-top:6px; color:var(--ink); font-weight:600;}
.th-tag{font-size:10px; font-weight:600; letter-spacing:.04em; color:var(--ink-3); background:var(--sunken); border-radius:6px; padding:1px 6px; margin-left:4px; text-transform:lowercase;}
.th-tag.now{background:var(--rose-soft); color:var(--rose);} .th-tag.plan{background:var(--violet-soft); color:var(--violet);}
table.pnl td:first-child, table.plan td:first-child, table.cf-table td:first-child, table.sverka td:first-child{min-width:230px;}
.pl-cell b{display:block; font-weight:600;}
.pl-cell small{display:block; font-size:11px; color:var(--ink-3); white-space:nowrap;}
.pl-cell.future b{color:var(--ink-3); font-weight:500;}
.pl-cell.tot{background:var(--surface-2);}
table.t tr.in td:first-child{box-shadow:inset 3px 0 0 var(--good);}
table.t tr.out td:first-child{box-shadow:inset 3px 0 0 var(--bad);}
table.t tr.in{background:var(--in-row);}
table.t tr.out{background:var(--out-row);}
table.t tr.group.in td{background:color-mix(in srgb, var(--good) 14%, var(--surface)); color:var(--good);}
table.t tr.group.out td{background:color-mix(in srgb, var(--bad) 12%, var(--surface)); color:var(--bad);}
table.t tr.fin td{color:var(--violet);}
table.t tr.bal td{background:var(--surface-2);}
.plan-name{background:none; border:0; padding:0; text-align:left; font-weight:600; font-size:13px; color:var(--ink); cursor:pointer;}
.plan-name:hover:not([disabled]){color:var(--link); text-decoration:underline;}
.plan-name[disabled]{cursor:default;}
.plan-c{min-width:120px;}
.pc-amt{font-variant-numeric:tabular-nums; margin-bottom:4px;}
.pay-btn{border:1px solid var(--line-strong); background:var(--surface); border-radius:7px; height:24px; padding:0 8px; font-size:11.5px; font-weight:600; color:var(--link);}
.pay-btn:hover{border-color:var(--link); background:var(--link-soft);}
.pay-btn.paid{display:inline-flex; align-items:center; gap:6px; color:var(--good); background:var(--good-soft); border-color:transparent; height:28px; font-size:12.5px;}
.pay-btn.paid svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.6;}
.pay-btn.paid:hover{background:var(--bad-soft); color:var(--bad);}
.pay-btn[disabled]{cursor:default;}
.pay-btn.paid[disabled]:hover{background:var(--good-soft); color:var(--good);}
.chip.pick{cursor:pointer;}
.chip.pick input{accent-color:var(--link);}
.pi-ins{align-self:end; padding-bottom:9px;}
table.led tr.click{cursor:pointer;}
table.led tr.click:hover td{background:var(--surface-2);}
.led-tot{display:flex; gap:14px; flex-wrap:wrap; font-weight:500;}
.led-f{gap:8px;}
.led-f .select{width:auto;}
.settings-box summary{display:flex; align-items:baseline; gap:12px; cursor:pointer; list-style:none;}
.settings-box summary::-webkit-details-marker{display:none;}
.settings-box summary h2::before{content:'▸ '; color:var(--ink-3);}
.settings-box[open] summary h2::before{content:'▾ ';}
.settings-box[open] summary{margin-bottom:14px;}
.set-grid{margin-bottom:14px;}

/* ── отчёты ── */
.entry{display:flex; flex-direction:column; gap:14px; margin-bottom:18px; border-top:3px solid var(--link);}
.entry-head{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap;}
.entry-date{display:flex; align-items:center; gap:4px;}
.entry-date .input{width:150px;}
.entry-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(118px,1fr)); gap:10px;}
.entry-grid .input{height:40px; font-size:15px; font-weight:600;}
.entry-note{grid-column:span 3;}
.entry-note .input{font-weight:400; font-size:14px;}
@media (max-width:900px){ .entry-grid{grid-template-columns:repeat(2, minmax(0,1fr));} .entry-note{grid-column:1 / -1;} }
.entry-more summary{cursor:pointer; font-size:13px; color:var(--ink-2); font-weight:500; margin-bottom:10px;}
.entry-foot{display:flex; align-items:center; gap:10px; justify-content:flex-end; flex-wrap:wrap;}
.entry-foot .note{margin-right:auto;}
.periods .period{min-height:140px;}
.period .foot b{font-weight:700;}
.pace-line{display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); margin-top:14px; font-size:13.5px; color:var(--ink-2);}
.pace-line svg{width:18px; height:18px; stroke:var(--violet); fill:none; stroke-width:1.9; flex:0 0 18px; margin-top:1px;}
.pace-line.good{background:var(--good-soft); border-color:transparent;} .pace-line.warn{background:var(--warn-soft); border-color:transparent;} .pace-line.bad{background:var(--bad-soft); border-color:transparent;}
.pace-line b{color:var(--ink);}
.rep-tabs{margin-top:26px;}
.sub-tabs{margin-bottom:12px; border-bottom:0;}
.sub-tabs button{border:1px solid var(--line); border-radius:8px; margin:0 6px 0 0; padding:6px 12px; font-size:13px;}
.sub-tabs button.on{border-color:var(--ink); background:var(--ink); color:var(--bg);}
table.days tr.click{cursor:pointer;}
table.days tr.click:hover td{background:var(--surface-2);}
table.t tr.muted-row td{color:var(--ink-3);}
.sv b{display:block; font-weight:600;}
.sv small{display:block; font-size:11px; color:var(--ink-3); white-space:nowrap;}
.sverka-q{margin-top:14px; font-size:13px; color:var(--ink-2);}
.sverka-q ol{margin:6px 0 0; padding-left:18px; display:grid; gap:2px;}
.cf-sum{margin-bottom:14px;}
.cf-table td.now{background:color-mix(in srgb, var(--rose-soft) 40%, transparent);}
.cf-table td.plan{color:var(--ink-2);}

/* ── 70-team.css ── */
/* ── команда ── */
.team-group{margin-bottom:22px;}
.team-gh{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:10px;}
.team-gh span{font-weight:400; color:var(--ink-3); font-size:12.5px;}
.people{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px;}
.person{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:10px;}
.person-h{display:flex; gap:12px; align-items:center;}
.person-n{flex:1; min-width:0; display:flex; flex-direction:column;}
.person-n b{font-size:14px;}
.person-n span{font-size:12.5px; color:var(--ink-3);}
.person-tags{display:flex; gap:6px; flex-wrap:wrap;}
.person-f{display:flex; align-items:center; gap:10px; font-size:12.5px; margin-top:auto; padding-top:8px; border-top:1px solid var(--line); white-space:nowrap; flex-wrap:wrap;}
.person-f .btn{margin-left:auto;}
table.acc tr.off td{opacity:.5;}
table.acc .select{width:auto;}
.inv-h{margin-top:18px;}
.inv-code{font-family:var(--f-text); font-weight:700; letter-spacing:.12em; background:var(--gold-soft); color:var(--gold); padding:3px 9px; border-radius:7px; font-variant-numeric:tabular-nums;}
.inv-code.big-code{font-size:22px; display:inline-block; padding:8px 16px;}
.invite-out{display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:14px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line);}
.invite-out .inv-code{font-size:20px; padding:6px 14px;}
.help-ico{width:18px; height:18px; stroke:var(--violet); fill:none; stroke-width:1.8; flex:0 0 18px; margin-top:2px;}
/* ── команда списком ── */
.team-bar{display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap; margin-bottom:14px;}
.team-sum{font-size:13px; color:var(--ink-3);}
table.team-t td{padding-top:8px; padding-bottom:8px;}
table.team-t tr.dim td{color:var(--ink-3);}
table.team-t tr.dim .av{opacity:.55;}
.tp{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; min-width:190px;}
.tp span{display:flex; flex-direction:column; min-width:0;}
.tp b{font-weight:600; font-size:13.5px;}
.tp small{font-size:12px; color:var(--ink-3);}
.tp:hover b{color:var(--link); text-decoration:underline; text-underline-offset:3px;}
.tp-acc{white-space:nowrap;}
.tp-acc small{display:block; font-size:11px; color:var(--ink-3); margin-top:2px;}
.tp-acc .link-btn{margin-left:6px; font-size:12px;}
.team-gh em{font-style:normal; margin-left:auto; font-size:12px; color:var(--ink-3); font-weight:500;}
a.person{text-decoration:none; color:inherit;}
a.person:hover{border-color:var(--line-strong); background:var(--surface-2);}
.form-sec{display:flex; flex-direction:column; gap:10px; padding-bottom:4px;}
.form-sec + .form-sec{border-top:1px solid var(--line); padding-top:14px;}
table.plan tr.dim td{color:var(--ink-3);}

/* ── страница человека ── */
.av.xl{width:88px; height:88px; flex-basis:88px; font-size:28px;}
.pf-head{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:18px 22px; align-items:center; margin-bottom:16px;}
.pf-photo{position:relative; width:88px; height:88px;}
.pf-photo-btn{position:absolute; right:-4px; bottom:-4px; width:30px; height:30px; border-radius:50%; background:var(--surface); border:1px solid var(--line-strong); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow);}
.pf-photo-btn svg{width:14px; height:14px; stroke:var(--ink-2); fill:none; stroke-width:2;}
.pf-photo-btn:hover{border-color:var(--link);}
.pf-main{min-width:0; display:flex; flex-direction:column; gap:6px;}
.pf-name{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pf-title{color:var(--ink-2);}
.pf-tags{display:flex; gap:6px; flex-wrap:wrap;}
.pf-contacts{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
.pf-ct{display:inline-flex; flex-direction:column; align-items:flex-start; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:4px 10px; text-align:left;}
.pf-ct span{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em;}
.pf-ct b{font-size:13px; font-weight:500;}
.pf-ct:hover{border-color:var(--link);}
.pf-stats{display:grid; grid-template-columns:repeat(2, minmax(96px, auto)); gap:8px;}
.pf-stats > *{display:flex; flex-direction:column; padding:8px 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); text-decoration:none; color:inherit;}
.pf-stats b{font-size:20px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums;}
.pf-stats span{font-size:11.5px; color:var(--ink-3);}
.pf-stats a:hover{border-color:var(--link);}
.pf-act{grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:12px;}
@media (max-width:900px){ .pf-head{grid-template-columns:auto minmax(0,1fr);} .pf-stats{grid-column:1 / -1; grid-template-columns:repeat(4, minmax(0,1fr));} }
@media (max-width:520px){ .pf-stats{grid-template-columns:repeat(2, minmax(0,1fr));} }
.pf-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:start;}
@media (max-width:900px){ .pf-grid{grid-template-columns:1fr;} }
.pf-col{display:flex; flex-direction:column; gap:14px;}
.pf-sec .card-head{margin-bottom:8px;}
.pf-text{white-space:pre-wrap; color:var(--ink); line-height:1.6;}
.pf-mission{font-size:15px; font-weight:500; color:var(--ink); border-left:3px solid var(--gold-brand); padding-left:12px;}
.pf-kv{display:flex; flex-direction:column; gap:4px;}
.pf-kv .label{margin-top:6px;}
.tags{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.tag{display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 10px; border-radius:14px; background:var(--violet-soft); color:var(--violet); font-size:12.5px; font-weight:500;}
.tag button{background:none; border:0; color:inherit; font-size:15px; line-height:1; padding:0 0 0 2px; opacity:.6;}
.tag button:hover{opacity:1;}
.tag-in{border:1px dashed var(--line-strong); border-radius:14px; height:28px; padding:0 12px; background:transparent; font-size:12.5px; min-width:220px; flex:1;}
.tag-in:focus{outline:none; border-color:var(--link); border-style:solid;}
.pf-goals{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:4px;}
.pf-goals li{display:flex; align-items:flex-start; gap:6px;}
.pf-goals li .check{flex:1; align-items:flex-start; font-size:13.5px; line-height:1.45;}
.pf-goals li .check input{margin-top:2px;}
.pf-goals li.done span{text-decoration:line-through; color:var(--ink-3);}
.pf-goals .icon-btn, .learn .icon-btn{width:26px; height:26px; flex-basis:26px;}
.learn{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column;}
.lr{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
.lr:last-child{border-bottom:0;}
.lr-t{flex:1; min-width:0; display:flex; flex-direction:column;}
.lr-t a, .lr-t span{font-size:13.5px; font-weight:500; color:var(--ink); text-decoration:none;}
.lr-t a:hover{color:var(--link); text-decoration:underline;}
.lr-t a svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2; margin-left:4px; vertical-align:-1px;}
.lr-t small{font-size:11.5px; color:var(--ink-3);}
.lr.done .lr-t a, .lr.done .lr-t span{color:var(--ink-3); text-decoration:line-through;}
.learn-add{margin-top:10px; gap:8px;}
.pf-pw .input{flex:1 1 170px; width:auto;}

/* ── 80-calendar-metrics.css ── */
/* ── Календарь ── */
.cal-conn{
  display:flex; align-items:center; gap:14px; padding:14px 18px; margin-bottom:16px;
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--link); border-radius:var(--radius);
}
.cal-conn > div:first-child svg{width:28px; height:28px; stroke:var(--link); fill:none; stroke-width:1.6;}
.cal-conn > div:nth-child(2){flex:1; min-width:0;}
.cal-conn p{color:var(--ink-2); font-size:13px; margin-top:3px; max-width:78ch;}
.cal-conn.warn{border-left-color:var(--warn);}
.cal-conn.warn > div:first-child svg{stroke:var(--warn);}
.cal-conn.slim{padding:9px 14px; gap:10px; font-size:13px; color:var(--ink-2); flex-wrap:wrap;}
.cal-conn.slim > span{flex:1; min-width:200px;}
.cal-conn.slim .dot{background:var(--ink-3);}
.cal-conn.slim.ok{border-left-color:var(--good);}
.cal-conn.slim.ok .dot{background:var(--good);}
.cal-conn.slim.off{border-left-color:var(--line-strong);}
@media (max-width:640px){ .cal-conn{flex-wrap:wrap;} .cal-conn > .btn{width:100%;} }

.cal-bar{display:flex; align-items:flex-end; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:14px;}
.cal-bar .tabs{border-bottom:0; margin-bottom:0;}
.cal-nav{display:flex; align-items:center; gap:6px; padding-bottom:6px; flex-wrap:wrap;}
.cal-wk{min-width:118px; text-align:center; font-size:14px;}
.cal-legend{display:flex; gap:8px 16px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--ink-2); margin-bottom:10px;}
.cal-legend > span{display:inline-flex; align-items:center; gap:6px;}
.cal-legend i{width:12px; height:12px; border-radius:3px; display:inline-block;}
.cal-legend .note{margin-left:auto;}
.lg-own{background:var(--link-soft); border:1px solid color-mix(in srgb, var(--link) 45%, transparent);}
.lg-meet{background:var(--accent);}
.lg-off{background:repeating-linear-gradient(135deg, var(--sunken) 0 3px, transparent 3px 6px); border:1px solid var(--line);}

.cal-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
.cal-week{
  --hh:46px; display:grid; grid-template-columns:52px repeat(var(--days), minmax(96px, 1fr));
  min-width:calc(52px + var(--days) * 96px);
}
.cw-corner{border-bottom:1px solid var(--line); background:var(--surface-2);}
.cw-dh{
  display:flex; align-items:baseline; gap:5px; padding:8px 10px; border-bottom:1px solid var(--line); border-left:1px solid var(--line);
  background:var(--surface-2); position:sticky; top:0;
}
.cw-dh span{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:600;}
.cw-dh b{font-size:17px; font-weight:600;}
.cw-dh small{font-size:11.5px; color:var(--ink-3);}
.cw-dh{white-space:nowrap;}
.cw-dh.is-today b{background:var(--link); color:#fff; border-radius:6px; padding:0 6px;}
.cw-dh.we span, .cw-dh.we b{color:var(--ink-3);}
.cw-adl{font-size:10.5px; color:var(--ink-3); padding:6px 4px; text-align:right; border-bottom:1px solid var(--line);}
.cw-ad{border-left:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px; display:flex; flex-direction:column; gap:3px; min-width:0;}
.cw-adi{font-size:11.5px; background:var(--link-soft); color:var(--link); border-radius:4px; padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cw-times{position:relative; height:calc(var(--hh) * 13);}
.cw-times span{position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.cw-times span:first-child{transform:none; top:2px !important;}
.cw-col{
  position:relative; height:calc(var(--hh) * 13); border-left:1px solid var(--line); cursor:pointer;
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(var(--g-alt) 1px, transparent 1px);
  background-size:100% var(--hh), 100% calc(var(--hh) / 2);
}
.cw-col.we{background-color:var(--surface-2);}
.cw-col.past{background-color:color-mix(in srgb, var(--sunken) 45%, transparent);}
.cw-col:hover{background-color:color-mix(in srgb, var(--link-soft) 35%, transparent);}
.cw-off{position:absolute; left:0; right:0; pointer-events:none; background:repeating-linear-gradient(135deg, var(--g-alt) 0 4px, transparent 4px 8px);}
.cw-now{position:absolute; left:0; right:0; height:2px; background:var(--bad); z-index:3; pointer-events:none;}
.cw-now::before{content:''; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--bad);}
.cw-ev{
  position:absolute; z-index:2; overflow:hidden; border-radius:5px; padding:3px 6px; text-align:left; text-decoration:none;
  display:flex; flex-direction:column; gap:1px; font-size:11.5px; line-height:1.25; border:1px solid transparent; min-height:18px;
}
.cw-ev.short{flex-direction:row; align-items:center; gap:6px; padding-top:1px; padding-bottom:1px;}
.cw-ev b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cw-ev small{font-size:10.5px; opacity:.8; white-space:nowrap;}
.cw-ev.own{background:var(--link-soft); color:var(--ink); border-color:color-mix(in srgb, var(--link) 40%, transparent); border-left:3px solid var(--link);}
.cw-ev.own.free{background:var(--surface); border-style:dashed; color:var(--ink-3);}
.cw-ev.meet{background:color-mix(in srgb, var(--accent) 82%, var(--link)); color:var(--on-accent); border-left:3px solid var(--gold-brand);}
.cw-ev.meet:not(.mine){background:var(--sunken); color:var(--ink-2); border-color:var(--line-strong); border-left:3px solid var(--ink-3);}
.cw-ev:hover{filter:brightness(1.06); z-index:4;}

/* занятость команды */
.ct-days{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none;}
.ct-days button{
  flex:1 0 108px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; text-align:left;
  display:flex; flex-direction:column; gap:2px;
}
.ct-days button span{font-size:13px; font-weight:600;}
.ct-days button small{font-size:11.5px; color:var(--good);}
.ct-days button.past{opacity:.55;}
.ct-days button.on{border-color:var(--link); box-shadow:0 0 0 2px var(--link-soft);}
.ct-tools{display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; margin-bottom:12px;}
.ct-tools .chips{flex:1; min-width:240px;}
.ct-nd{color:var(--warn); font-weight:700;}
.chip.ghost{border-style:dashed;}
.ct-wh{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2);}
.ct-wh .select{width:84px;}
.cal-team{min-width:760px;}
.ct-row{display:grid; grid-template-columns:170px minmax(0,1fr); border-bottom:1px solid var(--line); min-height:46px;}
.ct-row:last-child{border-bottom:0;}
.ct-name{display:flex; align-items:center; gap:9px; padding:6px 12px; text-decoration:none; color:inherit; min-width:0; background:var(--surface); position:sticky; left:0; z-index:3; border-right:1px solid var(--line);}
.ct-name > span:last-child{min-width:0;}
.ct-name b{display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ct-name small{display:block; font-size:11px; color:var(--ink-3); white-space:nowrap;}
a.ct-name:hover b{text-decoration:underline;}
.ct-fico{width:26px; height:26px; border-radius:50%; background:var(--good-soft); display:inline-flex; align-items:center; justify-content:center; flex:0 0 26px;}
.ct-fico svg{width:15px; height:15px; stroke:var(--good); fill:none; stroke-width:2.2;}
.ct-track{
  position:relative; cursor:pointer;
  background-image:linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:calc(100% / 13) 100%;
}
.ct-head{min-height:28px; background:var(--surface-2);}
.ct-head .ct-name{background:var(--surface-2);}
.ct-head .ct-track{cursor:default; background:none;}
.ct-head .ct-track span{position:absolute; top:7px; transform:translateX(-50%); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.ct-head .ct-track span:first-child{transform:none; padding-left:3px;}
.ct-head .ct-track span:last-child{transform:translateX(-100%); padding-right:3px;}
.ct-off{position:absolute; top:0; bottom:0; pointer-events:none; background:repeating-linear-gradient(135deg, var(--g-alt) 0 4px, transparent 4px 8px); background-color:var(--g-alt);}
.ct-now{position:absolute; top:0; bottom:0; width:2px; background:var(--bad); z-index:2; pointer-events:none;}
.ct-b{position:absolute; top:7px; bottom:7px; border-radius:5px; overflow:hidden; display:flex; align-items:center; padding:0 6px; min-width:3px;}
.ct-b em{font-style:normal; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ct-b.busy{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink-3) 42%, transparent) 0 5px, color-mix(in srgb, var(--ink-3) 30%, transparent) 5px 10px); cursor:default;}
.ct-b.meet{background:color-mix(in srgb, var(--accent) 82%, var(--link)); color:var(--on-accent); cursor:pointer;}
.ct-b.free{background:var(--good-soft); border:1px solid color-mix(in srgb, var(--good) 45%, transparent); color:var(--good); cursor:pointer; z-index:1;}
.ct-b.free:hover{background:color-mix(in srgb, var(--good) 22%, var(--surface));}
.ct-free{background:color-mix(in srgb, var(--good-soft) 35%, transparent);}
.ct-row.nodata .ct-track{background-color:var(--surface-2);}
.ct-row.nodata .ct-name small{color:var(--warn);}
.ct-nodata{margin-top:10px;}

/* список собраний */
.mt-tools{display:flex; gap:10px 16px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
.mt-list{padding:0; overflow:hidden;}
.mt-row{display:grid; grid-template-columns:86px minmax(0,1fr) auto auto auto; gap:14px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line);}
.mt-row:last-child{border-bottom:0;}
.mt-row.mine{box-shadow:inset 3px 0 0 var(--gold-brand);}
