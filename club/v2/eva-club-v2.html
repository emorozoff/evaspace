<title>Штаб Eva Club V2</title>
<meta name="description" content="Рабочий штаб команды Eva Space: задачи, деньги, продажи и отчёты до конца года.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── 00-tokens.css ── */
/* Цвета и шрифты — из Книги стандартов Eva Space:
   Ночь #14111A — основа, Роза #E4A0B8 — акцент, Золото #E7C58B — числа,
   Фиалка #8C83DE — схемы. Unbounded — заголовки и числа, Inter — текст.
   На светлом фоне фирменные оттенки темнее, чтобы текст читался. */
:root{
  --bg:#F5F3F7;
  --surface:#FFFFFF;
  --surface-2:#FAF9FC;
  --sunken:#EFECF3;
  --line:#E4DFEA;
  --line-strong:#CEC7D8;
  --ink:#17131F;
  --ink-2:#4B4557;
  --ink-3:#7A7386;

  --night:#14111A;
  --night-2:#1E1926;
  --night-line:#2E2738;
  --night-ink:#EEE9F4;
  --night-ink-2:#A39CB0;

  --rose:#AD4C74;
  --rose-brand:#E4A0B8;
  --rose-soft:#F8E6EE;
  --on-rose:#FFFFFF;
  --gold:#8F6B27;
  --gold-brand:#E7C58B;
  --gold-soft:#F6EEDC;
  --violet:#5A50C0;
  --violet-soft:#ECEAFB;

  --good:#2C7753;
  --good-soft:#E1F1E8;
  --bad:#A03A4B;
  --bad-soft:#F8E5E8;
  --warn:#9C6410;
  --warn-soft:#FAEFD9;

  --in-row:#EEF7F1;
  --out-row:#FBF0F2;

  --shadow:0 1px 2px rgba(23,19,31,.05), 0 4px 16px rgba(23,19,31,.05);
  --shadow-pop:0 12px 40px rgba(23,19,31,.18);
  --radius:12px;
  --radius-sm:8px;

  --f-display:'Unbounded', 'Inter', system-ui, sans-serif;
  --f-text:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121017; --surface:#1B1722; --surface-2:#1F1A27; --sunken:#16121C;
    --line:#2E2737; --line-strong:#43394F;
    --ink:#F0ECF5; --ink-2:#C1B9CC; --ink-3:#8F879C;
    --night:#0D0B11; --night-2:#18141F; --night-line:#28222F;
    --rose:#E4A0B8; --rose-soft:#3A2431; --on-rose:#14111A;
    --gold:#E7C58B; --gold-soft:#33291B;
    --violet:#A9A2F3; --violet-soft:#262243;
    --good:#7DCBA3; --good-soft:#1B3027;
    --bad:#EF929F; --bad-soft:#3B2027;
    --warn:#E8B463; --warn-soft:#352819;
    --in-row:#18261F; --out-row:#2A1C22;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
    --shadow-pop:0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121017; --surface:#1B1722; --surface-2:#1F1A27; --sunken:#16121C;
  --line:#2E2737; --line-strong:#43394F;
  --ink:#F0ECF5; --ink-2:#C1B9CC; --ink-3:#8F879C;
  --night:#0D0B11; --night-2:#18141F; --night-line:#28222F;
  --rose:#E4A0B8; --rose-soft:#3A2431; --on-rose:#14111A;
  --gold:#E7C58B; --gold-soft:#33291B;
  --violet:#A9A2F3; --violet-soft:#262243;
  --good:#7DCBA3; --good-soft:#1B3027;
  --bad:#EF929F; --bad-soft:#3B2027;
  --warn:#E8B463; --warn-soft:#352819;
  --in-row:#18261F; --out-row:#2A1C22;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  --shadow-pop:0 12px 40px rgba(0,0,0,.55);
}

/* ── 01-base.css ── */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 var(--f-text); -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance;}
h1{font:500 24px/1.2 var(--f-display); letter-spacing:-.01em;}
h2{font:500 16px/1.3 var(--f-display);}
h3{font:600 14px/1.35 var(--f-text);}
p{margin:0;}
a{color:inherit;}
button,input,select,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--rose); outline-offset:2px;}
img{max-width:100%;}
[hidden]{display:none !important;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-3);}
.soft{color:var(--ink-2);}
.good{color:var(--good);}
.bad{color:var(--bad);}
.warn{color:var(--warn);}
.label{
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
}
.nowrap{white-space:nowrap;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

/* загрузка */
.boot{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:var(--ink-3); text-align:center; padding-inline:16px;
}
.boot b{font:500 18px var(--f-display); color:var(--ink);}
.boot-mark{width:34px; height:34px; margin-bottom:8px; animation:spin 2.4s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 02-shell.css ── */
/* Оболочка: тёмная боковая панель «Ночь» + рабочая область */
.app{min-height:100%;}
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh;}
.side{
  position:sticky; top:0; height:100vh; overflow-y:auto;
  background:var(--night); color:var(--night-ink);
  display:flex; flex-direction:column; padding:20px 14px 16px;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px; text-decoration:none;}
.brand-mark{width:30px; height:30px; flex:0 0 30px;}
.brand b{display:block; font:500 15px/1.1 var(--f-display); color:#fff; letter-spacing:.01em;}
.brand span{display:block; font-size:11px; color:var(--night-ink-2); margin-top:3px;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav a{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px;
  color:var(--night-ink-2); text-decoration:none; font-weight:500; font-size:14px;
}
.nav a svg{width:18px; height:18px; flex:0 0 18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.nav a:hover{background:var(--night-2); color:var(--night-ink);}
.nav a.on{background:var(--night-2); color:#fff; box-shadow:inset 3px 0 0 var(--rose-brand);}
.nav .badge{
  margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px;
  background:var(--rose-brand); color:var(--night); font-size:11.5px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center;
}
.side-foot{margin-top:auto; padding-top:18px; display:flex; flex-direction:column; gap:10px;}
.me-chip{
  display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px;
  background:var(--night-2); border:1px solid var(--night-line);
}
.me-chip .who{min-width:0; flex:1;}
.me-chip b{display:block; font-size:13px; color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.me-chip .who span{display:block; font-size:11.5px; color:var(--night-ink-2);}
.me-chip button{
  background:none; border:1px solid var(--night-line); color:var(--night-ink-2); border-radius:8px;
  width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 30px;
}
.me-chip button:hover{color:#fff; border-color:var(--rose-brand);}
.me-chip button svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8;}
.sync{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--night-ink-2); padding:0 4px;}
.sync i{width:7px; height:7px; border-radius:50%; background:#6FC49A; flex:0 0 7px;}
.sync.local i{background:var(--gold-brand);}
.sync.busy i{background:var(--gold-brand); animation:pulse 1s ease-in-out infinite;}
.sync.err i{background:#EF929F;}
@keyframes pulse{50%{opacity:.35;}}

.main{min-width:0; padding:28px 36px 64px;}
.page{max-width:1200px; margin:0 auto;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:22px;}
.page-head .sub{color:var(--ink-3); margin-top:6px; max-width:62ch;}
.page-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.section{margin-top:30px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
.section-head .hint-inline{color:var(--ink-3); font-size:12.5px;}

/* узкие экраны: панель становится шапкой с прокручиваемым меню */
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);}
  .side{min-width:0;
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40; height:auto; overflow:visible;
    flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px 16px; gap:8px 12px;
  }
  .brand{padding:0; flex:1 1 auto;}
  .brand span{display:none;}
  .side-foot{margin:0; padding:0; flex-direction:row; align-items:center;}
  .sync span{display:none;}
  .me-chip{padding:4px 4px 4px 4px; background:none; border:0;}
  .me-chip .who{display:none;}
  .nav{order:3; flex:1 0 100%; flex-direction:row; overflow-x:auto; gap:4px; margin:0 -16px; padding:0 16px 2px; scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{padding:7px 10px; white-space:nowrap; font-size:13px;}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--rose-brand);}
  .main{padding:20px 16px 56px;}
  h1{font-size:20px;}
}

/* ── 03-components.css ── */
/* ── кнопки ── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:36px; padding:0 14px; border-radius:9px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-weight:500; font-size:13.5px; white-space:nowrap;
  text-decoration:none; transition:background .12s, border-color .12s, color .12s;
}
.btn:hover{border-color:var(--ink-3);}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.btn.primary{background:var(--rose); border-color:var(--rose); color:var(--on-rose);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.dark{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2);}
.btn.ghost:hover{background:var(--sunken); color:var(--ink);}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line));}
.btn.danger.solid{background:var(--bad); border-color:var(--bad); color:#fff;}
.btn.good{background:var(--good); border-color:var(--good); color:#fff;}
.btn.sm{height:30px; padding:0 10px; font-size:12.5px; border-radius:8px;}
.btn.xs{height:26px; padding:0 8px; font-size:12px; border-radius:7px;}
.btn[disabled]{opacity:.5; cursor:default; pointer-events:none;}
.icon-btn{
  width:32px; height:32px; border-radius:8px; border:1px solid transparent; background:none; color:var(--ink-3);
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 32px;
}
.icon-btn:hover{background:var(--sunken); color:var(--ink);}
.icon-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.link-btn{background:none; border:0; padding:0; color:var(--rose); font-weight:500; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;}

/* ── поля ── */
.field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.field > span{font-size:12px; font-weight:500; color:var(--ink-2);}
.field small{font-size:11.5px; color:var(--ink-3);}
.input, .select, .textarea{
  width:100%; height:36px; padding:0 11px; border-radius:9px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:14px; min-width:0;
}
.textarea{height:auto; min-height:84px; padding:9px 11px; resize:vertical; line-height:1.5;}
.select{padding-right:28px; appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position:calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size:5px 5px; background-repeat:no-repeat;
}
.input:focus, .select:focus, .textarea:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px var(--rose-soft);}
.input.num{text-align:right;}
.input.sm, .select.sm{height:30px; font-size:13px; border-radius:8px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
@media (max-width:640px){ .grid2, .grid3{grid-template-columns:1fr;} }
.check{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px;}
.check input{width:16px; height:16px; accent-color:var(--rose);}

/* ── переключатель вариантов ── */
.seg{display:inline-flex; background:var(--sunken); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap;}
.seg button{
  border:0; background:none; height:30px; padding:0 12px; border-radius:8px; font-size:13px; font-weight:500; color:var(--ink-2);
  white-space:nowrap;
}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(23,19,31,.12);}
.seg.out button.on{color:var(--bad);} .seg.in button.on{color:var(--good);}

/* ── метки ── */
.pill{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:11px;
  font-size:11.5px; font-weight:600; white-space:nowrap; background:var(--sunken); color:var(--ink-2);
}
.pill.rose{background:var(--rose-soft); color:var(--rose);}
.pill.gold{background:var(--gold-soft); color:var(--gold);}
.pill.violet{background:var(--violet-soft); color:var(--violet);}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.line{background:none; border:1px solid var(--line-strong);}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 8px; background:var(--ink-3);}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  height:30px; padding:0 11px; border-radius:15px; border:1px solid var(--line-strong); background:var(--surface);
  font-size:12.5px; font-weight:500; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.chip:hover{border-color:var(--ink-3); color:var(--ink);}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.chip b{font-weight:700;}

/* ── панели ── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.card.flat{box-shadow:none;}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.card-head h2{font-size:14.5px;}
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));}
.split{display:grid; gap:16px; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);}
@media (max-width:1000px){ .split{grid-template-columns:1fr;} }

/* показатели */
.stat .label{display:block; margin-bottom:8px;}
.stat .big{font:500 26px/1.1 var(--f-display); letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
.stat .big small{font:500 14px var(--f-text); color:var(--ink-3); letter-spacing:0;}
.stat .foot{margin-top:8px; font-size:12.5px; color:var(--ink-3);}
.bar{height:6px; border-radius:3px; background:var(--sunken); overflow:hidden; margin-top:10px; position:relative;}
.bar > i{display:block; height:100%; border-radius:3px; background:var(--rose);}
.bar > i.good{background:var(--good);} .bar > i.warn{background:var(--warn);} .bar > i.bad{background:var(--bad);}
.bar > b{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); border-radius:1px;}

/* ── таблицы ── */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
table.t{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums;}
table.t th, table.t td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle;}
table.t th{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); background:var(--surface-2); white-space:nowrap;}
table.t tbody tr:last-child td{border-bottom:0;}
table.t td.r, table.t th.r{text-align:right;}
table.t td.c, table.t th.c{text-align:center;}
table.t tr.total td{font-weight:700; background:var(--surface-2);}
table.t tr.sub td{font-weight:600;}
table.t tr.group td{background:var(--sunken); font-weight:600; font-size:12px; color:var(--ink-2);}
table.t tr.now td{background:var(--rose-soft);}
table.t tr:hover td.hov{background:var(--surface-2);}
table.grid-lines td, table.grid-lines th{border-right:1px solid var(--line);}
table.grid-lines td:last-child, table.grid-lines th:last-child{border-right:0;}

/* ── аватар ── */
.av{
  width:26px; height:26px; border-radius:50%; flex:0 0 26px; display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff; background:var(--violet); letter-spacing:.02em; text-transform:uppercase;
}
.av.lg{width:40px; height:40px; flex-basis:40px; font-size:14px;}
.av.none{background:var(--sunken); color:var(--ink-3); border:1px dashed var(--line-strong);}
.av img{width:100%; height:100%; border-radius:50%; object-fit:cover;}

/* ── пустое состояние и подсказки ── */
.empty{padding:26px 18px; text-align:center; color:var(--ink-3); font-size:13.5px; border:1px dashed var(--line-strong); border-radius:var(--radius);}
.empty b{display:block; color:var(--ink-2); margin-bottom:4px; font-size:14px;}
.help{
  display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border-radius:var(--radius);
  background:var(--violet-soft); color:var(--ink-2); font-size:13px; line-height:1.55; margin-bottom:18px;
}
.help b{color:var(--ink);}
.help ol, .help ul{margin:4px 0 0; padding-left:18px;}
.help .x{margin-left:auto; flex:0 0 auto;}
.note{font-size:12.5px; color:var(--ink-3); line-height:1.5;}

/* ── вкладки ── */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; scrollbar-width:none;}
.tabs button{
  border:0; background:none; padding:10px 12px; font-weight:500; color:var(--ink-3); font-size:14px; white-space:nowrap;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink);}
.tabs button.on{color:var(--ink); border-bottom-color:var(--rose);}
.tabs button .n{font-size:11.5px; color:var(--ink-3); margin-left:4px;}

/* ── окно ── */
.modal-back{
  position:fixed; inset:0; z-index:100; background:rgba(14,11,18,.48); display:flex; align-items:flex-start; justify-content:center;
  padding:6vh 16px 24px; overflow-y:auto; animation:fade .14s ease-out;
}
.modal{
  width:100%; max-width:560px; background:var(--surface); border-radius:16px; box-shadow:var(--shadow-pop);
  border:1px solid var(--line); animation:rise .16s ease-out;
}
.modal.wide{max-width:860px;}
.modal-head{display:flex; align-items:flex-start; gap:12px; padding:18px 20px 0;}
.modal-head h2{flex:1; font-size:16px; padding-top:4px;}
.modal-body{padding:16px 20px 20px; display:flex; flex-direction:column; gap:14px;}
.modal-foot{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:14px 20px; border-top:1px solid var(--line); background:var(--surface-2); border-radius:0 0 16px 16px;}
.modal-foot .left{margin-right:auto;}
@keyframes fade{from{opacity:0;}}
@keyframes rise{from{opacity:0; transform:translateY(8px);}}

/* ── всплывающее подтверждение ── */
.pop{
  position:absolute; z-index:120; width:max-content; max-width:280px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow-pop); padding:12px 14px; animation:fade .12s ease-out;
}
.pop p{font-size:13px; font-weight:500; margin-bottom:10px;}
.pop .row{gap:6px;}

/* ── уведомления ── */
.toast-root{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:max-content; max-width:calc(100vw - 32px);}
.toast{
  display:flex; align-items:center; gap:14px; background:var(--night); color:var(--night-ink); padding:10px 14px 10px 16px;
  border-radius:11px; box-shadow:var(--shadow-pop); font-size:13.5px; animation:rise .16s ease-out;
}
.toast button{background:none; border:0; color:var(--rose-brand); font-weight:600; padding:2px 4px;}
.toast.err{background:var(--bad);}

/* ── графики ── */
.chart{width:100%; height:auto; display:block; overflow:visible;}
.chart text{font:11px var(--f-text); fill:var(--ink-3);}
.chart .grid{stroke:var(--line); stroke-width:1;}
.chart .axis{stroke:var(--line-strong); stroke-width:1;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:8px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:14px; height:3px; border-radius:2px; display:inline-block;}
.legend i.dash{background:repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height:2px;}
@media (max-width:640px){
  .tiles, .periods, .cf-sum{grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .tiles .stat, .periods .period, .cf-sum .stat{min-height:0; padding:14px;}
  .stat .big{font-size:20px;}
  .stat .foot{font-size:12px;}
}

/* ── 10-auth-home.css ── */
/* ── вход ── */
.auth-page{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
  background:radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb, var(--rose-brand) 22%, transparent), transparent 60%), var(--bg);}
.auth{display:grid; grid-template-columns:minmax(0,420px) minmax(0,300px); gap:40px; align-items:center; width:100%; max-width:800px;}
.auth-card{padding:28px; display:flex; flex-direction:column; gap:14px;}
.auth-brand{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
.auth-mark{width:40px; height:40px; flex:0 0 40px;}
.auth-brand b{display:block; font:500 17px/1.1 var(--f-display);}
.auth-brand span{font-size:12px; color:var(--ink-3);}
.auth-tabs{align-self:flex-start;}
.auth-card h1{font-size:21px;}
.auth-lead{color:var(--ink-2); font-size:13.5px; margin-top:-6px;}
.auth-fields{display:flex; flex-direction:column; gap:12px;}
.auth-code{text-transform:uppercase; letter-spacing:.12em; font-weight:600;}
.auth-go{height:42px; font-size:14.5px;}
.auth-msg{background:var(--bad-soft); color:var(--bad); border-radius:9px; padding:10px 12px; font-size:13px;}
.auth-links{display:flex; justify-content:center; min-height:4px;}
.auth-note{font-size:11.5px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:12px; line-height:1.5;}
.auth-side .label{margin-bottom:12px; display:block;}
.auth-roles{list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:12px;}
.auth-roles li{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--ink-2);}
.auth-roles .pill{align-self:flex-start;}
@media (max-width:760px){ .auth{grid-template-columns:1fr;} .auth-side{display:none;} }

/* ── главная ── */
.tiles .stat{min-height:132px;}
a.card.as-link{text-decoration:none; color:inherit; transition:border-color .12s;}
a.card.as-link:hover{border-color:var(--rose);}
.focus-list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.focus-row{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--surface); border:0; border-bottom:1px solid var(--line); text-align:left; text-decoration:none; color:inherit; width:100%;}
.focus-row:last-child{border-bottom:0;}
.focus-row:hover{background:var(--surface-2);}
.fr-t{flex:1; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px;}
.focus-pay{margin-top:14px; display:flex; flex-direction:column; gap:4px;}
.focus-pay .label{margin-bottom:4px;}
.fp-row{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px dashed var(--line); text-decoration:none; color:inherit; font-size:13.5px;}
.fp-row b{font-variant-numeric:tabular-nums;}
.today{display:flex; flex-direction:column; gap:14px;}
.today .card-head{margin-bottom:0;}
.today-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line);}
.today-row.wait{background:var(--warn-soft); border-color:transparent;}
.today-row.ok{background:var(--good-soft); border-color:transparent;}
.today-row > div{flex:1; display:flex; flex-direction:column; gap:2px; font-size:13.5px;}
.today-rh{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.today-rh > div{display:flex; gap:10px; align-items:flex-start; font-size:13px;}
.today-rh svg{width:18px; height:18px; stroke:var(--violet); fill:none; stroke-width:1.8; flex:0 0 18px; margin-top:1px;}
.today-rh span{display:flex; flex-direction:column;}
.today-rh small{color:var(--ink-3); font-size:12px;}
@media (max-width:520px){ .today-rh{grid-template-columns:1fr;} }
.feed{display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line); padding-top:12px;}
.feed .label{margin-bottom:6px;}
.feed-row{display:flex; gap:10px; align-items:flex-start; background:none; border:0; text-align:left; padding:6px 4px; border-radius:8px; font-size:13px; color:var(--ink);}
.feed-row:hover{background:var(--surface-2);}
.feed-row > span:not(.av){display:flex; flex-direction:column; min-width:0;}
.feed-row small{color:var(--ink-3); font-size:11.5px;}
.help.start{background:var(--gold-soft);}
.help.start a{color:var(--rose); font-weight:600;}

/* ── материалы ── */
.mats{display:flex; flex-direction:column; gap:14px;}
.mat-hero{
  display:flex; align-items:center; gap:18px; padding:18px 20px; border-radius:var(--radius); text-decoration:none;
  background:var(--night); color:var(--night-ink); border:1px solid var(--night-line);
}
.mat-hero:hover{border-color:var(--rose-brand);}
.mat-star{width:46px; height:46px; flex:0 0 46px;}
.mat-hero > div{flex:1; min-width:0;}
.mat-hero .label{color:var(--night-ink-2);}
.mat-hero b{display:block; font:500 18px/1.25 var(--f-display); color:#fff; margin:2px 0 4px;}
.mat-hero p{font-size:13px; color:var(--night-ink-2);}
.mat-hero .btn.primary{background:var(--rose-brand); border-color:var(--rose-brand); color:var(--night);}
.mat-groups{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px;}
.mat-group{display:flex; flex-direction:column; gap:8px;}
.mat-gh{display:flex; flex-direction:column; padding:0 2px 2px;}
.mat-gh b{font-size:13.5px;}
.mat-gh span{font-size:12px; color:var(--ink-3);}
.mat{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:11px; background:var(--surface);
  border:1px solid var(--line); text-decoration:none; color:inherit; transition:border-color .12s, transform .12s;
}
.mat:hover{border-color:var(--rose);}
.mat-ico{width:34px; height:34px; border-radius:9px; background:var(--rose-soft); color:var(--rose); display:inline-flex; align-items:center; justify-content:center; flex:0 0 34px;}
.mat-ico svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9;}
.mat-t{flex:1; min-width:0; display:flex; flex-direction:column;}
.mat-t b{font-size:13.5px;}
.mat-t small{font-size:12px; color:var(--ink-3); line-height:1.4;}
.mat-go{width:16px; height:16px; stroke:var(--ink-3); fill:none; stroke-width:1.9; flex:0 0 16px;}
.mat-wrap{position:relative;}
.mat-wrap .mat{padding-right:44px;}
.mat-del{position:absolute; right:6px; top:50%; transform:translateY(-50%);}
.mat-more{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:13px; padding:4px 2px;}
.mat-more .label{margin-right:4px;}
.mat-more a{color:var(--ink-2); display:inline-flex; align-items:center; gap:4px; text-decoration:none;}
.mat-more a:hover{color:var(--rose);}
.mat-more svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2;}
.mat-add{align-self:flex-start;}
.viewer{display:flex; flex-direction:column; gap:12px;}
.viewer-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.viewer-t{flex:1; min-width:180px; display:flex; flex-direction:column;}
.viewer-t b{font:500 18px/1.2 var(--f-display);}
.viewer-act{display:flex; gap:8px; flex-wrap:wrap;}
.viewer-frame{position:relative; height:calc(100vh - 170px); min-height:420px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:#faf9f5;}
.viewer-frame iframe{width:100%; height:100%; border:0; display:block; background:#faf9f5;}
.viewer-load{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#6b6760; text-align:center; padding:24px;}
.viewer-load b{color:#1c1b18; font-size:15px;}
@media (max-width:880px){ .viewer-frame{height:calc(100vh - 220px);} }

/* ── подсказка графика ── */
.chart-box{position:relative;}
.chart-tip{
  position:absolute; z-index:5; pointer-events:none; background:var(--surface); border:1px solid var(--line); border-radius:9px;
  box-shadow:var(--shadow-pop); padding:8px 10px; font-size:12px; min-width:130px;
}
.tip-h{font-weight:600; color:var(--ink-2); margin-bottom:4px;}
.tip-row{display:flex; align-items:center; gap:7px; line-height:1.6;}
.tip-row i{width:12px; height:2px; border-radius:1px; display:inline-block; flex:0 0 12px;}
.tip-row i.dash{background:repeating-linear-gradient(90deg, currentColor 0 3px, transparent 3px 5px) !important;}
.tip-row b{font-variant-numeric:tabular-nums; color:var(--ink);}
.tip-row span{color:var(--ink-3);}
.chart .bar-hit:hover path, .chart .bar-hit:focus path{filter:brightness(1.12);}
.chart .bar-hit:focus{outline:none;}
.chart .cross{stroke:var(--ink-3); stroke-width:1;}

/* ── 20-strategy.css ── */
/* ── стратегия ── */
.north{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:24px; align-items:center;}
.north-num{display:flex; align-items:baseline; gap:12px; margin:8px 0 2px;}
.north-num b{font:500 44px/1 var(--f-display); letter-spacing:-.02em; color:var(--ink);}
.north-num span{color:var(--ink-3); font-size:15px;}
.north .bar{height:8px;}
.north .note{margin-top:10px;}
.north-side{display:grid; gap:12px; border-left:1px solid var(--line); padding-left:24px;}
.north-side > div{display:grid; grid-template-columns:1fr auto; align-items:baseline; gap:2px 12px;}
.north-side .label{grid-column:1 / -1;}
.north-side b{font:500 18px var(--f-display); color:var(--gold); font-variant-numeric:tabular-nums;}
.north-side small{font-size:12px; color:var(--ink-3); text-align:right;}
@media (max-width:760px){ .north{grid-template-columns:1fr;} .north-side{border-left:0; padding-left:0; border-top:1px solid var(--line); padding-top:14px;} }

.goals{display:grid; grid-template-columns:repeat(auto-fit, minmax(205px, 1fr)); gap:12px;}
.goal{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:8px;}
.goal.is-done{background:var(--violet-soft); border-color:transparent;}
.goal-top{display:flex; align-items:center; gap:8px;}
.goal-n{font:500 13px var(--f-display); color:var(--rose); margin-right:auto;}
.goal-st{width:auto; height:28px; font-size:12px; font-weight:600; padding-left:10px;}
.goal-st.good{color:var(--good);} .goal-st.bad{color:var(--bad);} .goal-st.violet{color:var(--violet);}
.goal-short{font:500 17px/1.2 var(--f-display);}
.goal-title{color:var(--ink-2); font-size:13.5px;}
.goal-items{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
.goal-items .check{align-items:flex-start; font-size:13px; line-height:1.45; color:var(--ink-2);}
.goal-items .check input{margin-top:2px; flex:0 0 16px;}
.goal-items .check.on span{text-decoration:line-through; color:var(--ink-3);}
.goal-result{font-size:13px; background:var(--surface-2); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; gap:2px;}
.goal-foot{margin-top:auto; padding-top:8px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink-3); flex-wrap:wrap;}

.sc-table td{vertical-align:top;}
.sc-table tr.sc-on td{background:var(--rose-soft);}
.sc-pick{display:inline-flex; align-items:center; gap:8px; cursor:pointer;}
.sc-pick input{accent-color:var(--rose); width:16px; height:16px;}
.sc-note{margin-top:8px;}
.drivers{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:14px;}
.driver{padding:14px 16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:4px;}
.driver b{font-size:14px;}
.driver p{font-size:13px; color:var(--ink-2);}

/* гант */
.gantt-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
.gantt{--lab:240px; display:grid; position:relative; min-width:calc(var(--lab) + 34 * 24px); padding:8px 0 12px; row-gap:4px;}
.g-lab{grid-column:1; padding:0 12px 0 14px; font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; align-self:center; position:sticky; left:0; background:var(--surface); z-index:2; min-height:28px; display:flex; align-items:center;}
.g-head{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
.g-month{font-size:11.5px; color:var(--ink-3); border-left:1px solid var(--line); padding:4px 0 4px 6px; display:flex; flex-direction:column; line-height:1.2;}
.g-month small{font-size:10px; color:var(--ink-3);}
.g-month.year{border-left-color:var(--line-strong); color:var(--ink);}
.g-stage{border-radius:7px; padding:5px 8px; font-size:11.5px; line-height:1.25; display:flex; flex-direction:column; justify-content:center; min-height:34px; overflow:hidden; background:var(--sunken); color:var(--ink-2); margin:0 1px;}
.g-stage b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.g-stage.s1{background:var(--violet-soft);} .g-stage.s2{background:var(--gold-soft);}
.g-stage.here{background:var(--rose-soft); color:var(--rose); box-shadow:inset 0 0 0 1px var(--rose);}
.g-stage small{font-size:10.5px;}
.g-miles{position:relative; height:60px;}
.g-mile{position:absolute; top:4px; transform:translateX(-50%); background:none; border:0; padding:0; display:flex; flex-direction:column; align-items:center; gap:3px; max-width:110px; cursor:pointer; color:var(--ink-2);}
.g-mile i{width:11px; height:11px; background:var(--gold-brand); border:2px solid var(--surface); box-shadow:0 0 0 1px var(--gold); transform:rotate(45deg); display:block;}
.g-mile{flex-direction:row; gap:5px; transform:translateX(-5px);}
.g-mile span{font-size:10.5px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; background:var(--surface); padding-right:3px;}
.g-mile.past i{background:var(--ink-3); box-shadow:0 0 0 1px var(--ink-3);}
.g-mile.past span{color:var(--ink-3);}
.g-mile.lane1{top:20px;} .g-mile.lane2{top:36px;}
.g-mile.lane1 i, .g-mile.lane2 i{order:0;}
.g-dir{grid-column:1 / -1; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c); padding:10px 14px 2px; border-top:1px solid var(--line); margin-top:4px; position:sticky; left:0;}
.g-bar{
  height:26px; border-radius:6px; border:0; margin:1px 1px; padding:0 8px; display:flex; align-items:center; gap:6px; min-width:0;
  background:color-mix(in srgb, var(--c) 16%, var(--surface)); color:var(--ink); box-shadow:inset 3px 0 0 var(--c);
  font-size:11.5px; font-weight:500; text-align:left; cursor:pointer; overflow:hidden;
}
.g-bar span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;}
.g-bar em{font-style:normal; font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.g-bar.doing{background:color-mix(in srgb, var(--c) 34%, var(--surface));}
.g-bar.done{background:var(--good-soft); box-shadow:inset 3px 0 0 var(--good); color:var(--ink-3);}
.g-bar:hover{filter:brightness(.97); outline:1px solid var(--c);}
.g-now{position:absolute; top:0; bottom:0; width:2px; background:var(--rose); opacity:.75; z-index:1; pointer-events:none;}
.g-legend .g-leg-now{width:2px; height:12px; background:var(--rose);}
@media (max-width:640px){ .gantt{--lab:140px;} }

.whales{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:12px;}
.whale{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--c);}
.whale-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.whale-h b{font:500 15px var(--f-display);}
.whale p{font-size:13px; color:var(--ink-2);}
.whale-m{font-size:13px; display:flex; flex-direction:column; gap:2px;}
.whale-lead{display:flex; align-items:center; gap:8px; margin-top:auto; font-size:13px;}
.rhythm{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px;}
.rh{padding:14px 16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:6px;}
.rh b{font-size:14px;}
.rh p{font-size:13px; color:var(--ink-2);}

/* ── 30-tasks.css ── */
/* ── задачи ── */
.qa{display:grid; grid-template-columns:minmax(0,1fr) 190px 150px auto; gap:8px; padding:10px; margin-bottom:14px; align-items:center;}
.qa-title{height:40px; font-size:14.5px;}
.qa .select, .qa .input{height:40px;}
.qa .btn{height:40px;}
@media (max-width:760px){ .qa{grid-template-columns:1fr 1fr;} .qa-title{grid-column:1 / -1;} .qa .btn{grid-column:1 / -1;} }
.t-toolbar{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin-bottom:16px;}
.t-selects{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto;}
.t-selects .select{width:auto; max-width:190px;}
.t-selects .input{width:160px;}
@media (max-width:1100px){ .t-selects{margin-left:0;} }

.t-group{margin-bottom:18px;}
.t-group-head{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin:0 0 8px 2px; display:flex; gap:8px; align-items:baseline;}
.t-group-head span{color:var(--ink-3); font-weight:600;}
.t-group-head em{font-style:normal; text-transform:none; letter-spacing:0; font-weight:400; color:var(--ink-3); font-size:12.5px;}
.t-group-head.as-btn{background:none; border:0; padding:4px 2px; cursor:pointer;}
.t-group-head.as-btn:hover{color:var(--ink);}
.t-list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); overflow:hidden;}
.t-list.mini{border-radius:10px;}
.t-row{
  display:grid; grid-template-columns:28px minmax(0,1fr) 140px 86px 104px; gap:12px; align-items:center;
  padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer; background:var(--surface);
}
.t-row:last-child{border-bottom:0;}
.t-row:hover{background:var(--surface-2);}
.t-row.fresh{box-shadow:inset 3px 0 0 var(--rose);}
.t-row.done .t-title{color:var(--ink-3); text-decoration:line-through;}
.t-list.mini .t-row{grid-template-columns:28px minmax(0,1fr) auto 86px; }
.t-list.mini .t-row .t-st{display:none;}
.t-list.grouped .t-row{grid-template-columns:28px minmax(0,1fr) 150px 96px;}
.t-list.grouped .t-st{display:none;}
.t-list.mini .t-who-n{display:none;}

<script>
(() => {
'use strict';
/* ── 00-core.js ── */
/* Ядро: DOM, форматирование чисел и дат. Все модули собираются в одну
   область видимости (см. build.py), поэтому функции отсюда видны везде. */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const byKey = (arr, k) => Object.fromEntries(arr.map(x => [x[k], x]));

/* Слияние как у db.update(): вложенные объекты сливаются, остальное заменяется */
function deepMerge(base, patch) {
  const out = isObj(base) ? {...base} : {};
  for (const [k, v] of Object.entries(patch || {})) {
    out[k] = isObj(v) && isObj(out[k]) ? deepMerge(out[k], v) : clone(v);
  }
  return out;
}

/* Делегирование событий: on(root, 'click', '[data-x]', (e, el) => …) */
function on(root, type, sel, fn) {
  root.addEventListener(type, e => {
    const el = e.target.closest(sel);
    if (el && root.contains(el)) fn(e, el);
  });
}

/* ── числа ── */
const NB = ' ';
function fmt(n, d = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const v = Number(n);
  return v.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d}).replace(/\s/g, NB);
}
const rub = n => (n === null || n === undefined ? '—' : fmt(Math.round(n)) + NB + '₽');
/* компактно: 1,45 млн ₽ · 290 тыс ₽ · 900 ₽ */
function rubK(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + fmt(a / 1e6, a >= 1e7 ? 1 : 2).replace(/,?0+$/, '') + NB + 'млн' + NB + '₽';
  if (a >= 1e4) return s + fmt(Math.round(a / 1e3)) + NB + 'тыс' + NB + '₽';
  return s + fmt(Math.round(a)) + NB + '₽';
}
const signed = (n, f = rubK) => (n > 0 ? '+' : n < 0 ? '' : '') + f(n);
const pct = (x, d = 0) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : fmt(x * 100, d) + '%');
const parseNum = s => {
  const v = parseFloat(String(s ?? '').replace(/\s| /g, '').replace(',', '.'));
  return Number.isFinite(v) ? v : 0;
};
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/* ── даты: всё в местном времени, формат 'YYYY-MM-DD' и месяц 'YYYY-MM' ── */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
/* «сегодня» можно подменить для проверок: window.__EVA_TODAY = '2026-10-15' */
const today = () => (typeof window !== 'undefined' && window.__EVA_TODAY) || isoOf(new Date());
const addDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return isoOf(d); };
const monthOf = s => String(s).slice(0, 7);
const daysBetween = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
const daysInMonth = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); };
const monthStart = m => m + '-01';
const monthEnd = m => m + '-' + pad(daysInMonth(m));
function addMonths(m, n) {
  const [y, mm] = m.split('-').map(Number);
  const d = new Date(y, mm - 1 + n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthRange(from, to) {
  const out = [];
  for (let m = from; m <= to; m = addMonths(m, 1)) out.push(m);
  return out;
}
/* понедельник недели */
const weekStart = s => { const d = dateOf(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return isoOf(d); };
const weekday = s => (dateOf(s).getDay() + 6) % 7; // 0 = пн

const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_SH = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD_SH = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const monthIdx = m => Number(m.slice(5, 7)) - 1;
/* 'Октябрь' · с годом, если он не текущий квартальный: 'Январь 2027' */
function monthName(m, withYear = false) {
  const name = cap(MONTHS[monthIdx(m)]);
  return withYear || m.slice(0, 4) !== '2026' ? `${name} ${m.slice(0, 4)}` : name;
}
const monthShort = m => cap(MONTHS_SH[monthIdx(m)]) + (m.slice(0, 4) !== '2026' ? ' ' + m.slice(2, 4) : '');
/* '5 окт' · '5 октября' */
const dayShort = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}`; };
const dayLong = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_GEN[d.getMonth()]}`; };
const dayWd = s => `${WD_SH[weekday(s)]}, ${dayShort(s)}`;
/* подпись недели: '5–11 окт' или '28 сен – 4 окт' */
function weekLabel(start) {
  const end = addDays(start, 6), a = dateOf(start), b = dateOf(end);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()}${NB}${MONTHS_SH[b.getMonth()]}`
    : `${dayShort(start)} – ${dayShort(end)}`;
}
function timeAgo(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return 'только что';
  if (s < 3600) { const m = Math.round(s / 60); return `${m}${NB}мин назад`; }
  if (s < 86400) { const h = Math.round(s / 3600); return `${h}${NB}ч назад`; }
  const d = new Date(ts);
  return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ── 02-store.js ── */
/* Хранилище. Один слой — два источника:
   • в артефакте Claude — общая база claude.use('db'): у каждой записи свой
     документ, правки расходятся по команде вживую (onSnapshot);
   • везде ещё (GitHub Pages, локальный сервер) — localStorage этого браузера.
   Коллекции: люди, учётки, приглашения, задачи, операции, план расходов,
   продажи по дням, ссылки на материалы и docs — одиночные документы
   (docs/strategy, docs/settings). */

const Store = (() => {
  const COLS = ['accounts', 'invites', 'people', 'tasks', 'ledger', 'plan', 'sales', 'links', 'docs'];
  const LS = 'eva-hq:';
  const data = Object.fromEntries(COLS.map(c => [c, new Map()]));
  const subs = new Set();
  const statusSubs = new Set();
  const queue = new Map();
  const state = {mode: 'local', ready: false, pending: 0, error: null, readOnly: false};
  let db = null;

  const strip = o => { const {id, ...body} = o || {}; return body; };
  const emit = c => subs.forEach(fn => { try { fn(c); } catch (e) { console.error(e); } });
  const emitStatus = () => statusSubs.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });

  function loadLocal() {
    for (const c of COLS) {
      const o = Local.get(LS + c, null);
      if (o && typeof o === 'object') for (const [id, v] of Object.entries(o)) data[c].set(id, {...v, id});
    }
  }
  function saveLocal(c) {
    Local.set(LS + c, Object.fromEntries([...data[c]].map(([id, v]) => [id, strip(v)])));
  }

  async function init() {
    loadLocal();
    let api = null;
    try {
      api = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null;
    } catch (e) { api = null; }
    if (!api) { state.mode = 'local'; state.ready = true; emitStatus(); return; }
    db = api;
    state.mode = 'db';
    /* ждём первый окончательный снимок каждой коллекции, чтобы не решить
       «учёток нет» по неполному кэшу; через 9 с идём с тем, что есть */
    await new Promise(resolve => {
      let left = COLS.length, done = false;
      const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
      const timer = setTimeout(finish, 9000);
      COLS.forEach(c => {
        let settled = false;
        const settle = () => { if (!settled) { settled = true; if (--left === 0) finish(); } };
        try {
          db.collection(c).onSnapshot(snap => {
            const m = new Map();
            snap.docs.forEach(d => { const v = d.data(); if (v) m.set(d.id, {...clone(v), id: d.id}); });
            data[c] = m;
            saveLocal(c);
            if (!snap.metadata || !snap.metadata.fromCache) settle();
            if (state.ready) emit(c);
          }, err => {
            state.error = (err && err.code) || 'error';
            if (err && err.code === 'revoked') state.readOnly = true;
            settle();
            emitStatus();
          });
        } catch (e) { settle(); }
      });
    });
    state.ready = true;
    emitStatus();
  }

  /* одна запись на документ за раз: следующая ждёт предыдущую */
  function enqueue(path, op) {
    state.pending++;
    emitStatus();
    const prev = queue.get(path) || Promise.resolve();
    const run = async () => {
      try { await op(); }
      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await op(); }
        else throw e;
      }
    };
    const p = prev.catch(() => {}).then(run).then(
      () => { state.error = null; },
      e => {
        state.error = (e && e.code) || 'error';
        if (e && e.code === 'invalid_argument') state.readOnly = true;
        console.warn('Запись не прошла', path, e);
        if (typeof toast === 'function') toast(writeErrorText(e), {error: true});
      }
    ).finally(() => {
      state.pending--;
      if (queue.get(path) === p) queue.delete(path);
      emitStatus();
    });
    queue.set(path, p);
    return p;
  }
  function writeErrorText(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') return 'База заполнена: удалите старые записи, чтобы добавить новые';
    if (code === 'invalid_argument') return 'Не сохранилось: у вас доступ только на просмотр этого штаба';
    if (code === 'resource_exhausted') return 'Слишком много правок подряд — повторите через минуту';
    return 'Не сохранилось. Проверьте связь и повторите';
  }

  function commitLocal(c) { saveLocal(c); emit(c); }

  function put(c, id, obj) {
    const body = strip(obj);
    data[c].set(id, {...clone(body), id});
    commitLocal(c);
    if (db) return enqueue(`${c}/${id}`, () => db.collection(c).doc(id).set(body));
    return Promise.resolve();
  }
  function add(c, obj, id = uid()) { put(c, id, obj); return id; }
  function patch(c, id, partial) {
    const cur = data[c].get(id);
    const next = deepMerge(cur ? strip(cur) : {}, partial);
    data[c].set(id, {...next, id});
    commitLocal(c);
    if (!db) return Promise.resolve();
    return enqueue(`${c}/${id}`, async () => {
      const ref = db.collection(c).doc(id);
      if (!cur) return ref.set(next);
      try { await ref.update(clone(partial)); }
      catch (e) {
        /* документа уже нет в базе (удалили с другого устройства) — записываем целиком */
        if (e && e.code === 'invalid_argument') await ref.set(strip(data[c].get(id) || next));
        else throw e;
      }
    });
  }
  function remove(c, id) {
    data[c].delete(id);
    commitLocal(c);
    if (db) return enqueue(`${c}/${id}`, () => db.collection(c).doc(id).delete());
    return Promise.resolve();
  }

  return {
    COLS, state, init, put, add, patch, remove,
    all: c => [...data[c].values()],
    get: (c, id) => data[c].get(id) || null,
    count: c => data[c].size,
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    onStatus(fn) { statusSubs.add(fn); return () => statusSubs.delete(fn); },
    flush: () => Promise.all([...queue.values()]),
  };
})();

/* ── 03-auth.js ── */
/* Вход по ролям. У каждого человека своя учётка; роль решает меню и права.
   Пароль хранится только как PBKDF2-SHA256 (150 000 итераций) с солью —
   тем же способом, что в первой версии, поэтому старые пароли подходят.
   Честно: это разделение кабинетов внутри команды, а не сейф — общая база
   читается всеми, у кого есть доступ к штабу. */

const SESSION_KEY = 'eva-hq-session';
const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
function randSalt() {
  const a = new Uint8Array(16);
  if ((window.crypto || {}).getRandomValues) window.crypto.getRandomValues(a);
  else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  return b64(a.buffer);
}
async function hashPassword(pw, salt) {
  const enc = new TextEncoder();
  const subtle = (window.crypto || {}).subtle;
  if (subtle && subtle.importKey) {
    try {
      const key = await subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await subtle.deriveBits({name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256'}, key, 256);
      return 'pbkdf2$' + b64(bits);
    } catch (e) { /* ниже запасной путь */ }
  }
  let h = 5381;
  const s = salt + '|' + pw;
  for (let r = 0; r < 20000; r++) for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return 'weak$' + h.toString(36);
}
const normEmail = s => String(s || '').trim().toLowerCase();
function makeCode() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 8; i++) s += abc[Math.floor(Math.random() * abc.length)];
  return s.slice(0, 4) + '-' + s.slice(4);
}
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^(.{4})(.+)$/, '$1-$2');

const Auth = {
  me() {
    /* window.__EVA_AS — только для проверок: две вкладки под разными людьми */
    const id = window.__EVA_AS || Local.get(SESSION_KEY, null);
    const a = id ? Store.get('accounts', id) : null;
    return a && a.active !== false ? a : null;
  },
  role() { const a = this.me(); return a ? roleOf(a.role) : null; },
  person() { const a = this.me(); return a ? personById(a.personId) : null; },
  personId() { const a = this.me(); return a ? a.personId || null : null; },
  can(perm) { const r = this.role(); return !!r && (PERMS[perm] || []).includes(r); },
  isOwner() { return this.role() === 'owner'; },

  start(acc) {
    Local.set(SESSION_KEY, acc.id);
    if (!acc.lastSeen || Date.now() - acc.lastSeen > 3600e3) Store.patch('accounts', acc.id, {lastSeen: Date.now()});
  },
  logout() { Local.del(SESSION_KEY); window.__EVA_AS = null; App.render(); },

  findByEmail(email) { const e = normEmail(email); return Store.all('accounts').find(a => normEmail(a.email) === e) || null; },

  async login(email, pw) {
    const acc = this.findByEmail(email);
    if (!acc) throw new Error('Нет учётки с такой почтой. Если вас пригласили — войдите по коду приглашения.');
    if (acc.active === false) throw new Error('Учётка отключена. Напишите основателю.');
    if ((await hashPassword(pw, acc.salt)) !== acc.hash) throw new Error('Пароль не подошёл. Проверьте раскладку или попросите у основателя код сброса.');
    this.start(acc);
  },

  async createAccount({name, email, pw, role, personId}) {
    if (!name.trim()) throw new Error('Напишите имя и фамилию.');
    if (!/^\S+@\S+\.\S+$/.test(email.trim())) throw new Error('Почта выглядит неправильно.');
    if (pw.length < 6) throw new Error('Пароль — не короче 6 символов.');
    if (this.findByEmail(email)) throw new Error('Эта почта уже зарегистрирована — просто войдите.');
    const salt = randSalt();
    const acc = {name: name.trim(), email: normEmail(email), role, personId: personId || null,
      salt, hash: await hashPassword(pw, salt), active: true, createdAt: Date.now(), lastSeen: Date.now()};
    const id = Store.add('accounts', acc);
    return {...acc, id};
  },

  /* первый вход в пустой штаб — учётка основателя и его карточка в команде */
  async createOwner(f) {
    if (Store.count('accounts')) throw new Error('Штаб уже создан — войдите своей почтой.');
    let pid = (people().find(p => p.founder) || {}).id;
    if (!pid) pid = Store.add('people', {name: f.name.trim(), title: 'Основатель', dir: 'ops', founder: true, order: 0});
    const acc = await this.createAccount({...f, role: 'owner', personId: pid});
    if (!personById(pid).name) Store.patch('people', pid, {name: f.name.trim()});
    this.start(acc);
  },

  async acceptInvite(f) {
    const code = normCode(f.code);
    const inv = Store.get('invites', code);
    if (!inv || inv.usedBy) throw new Error('Код не найден или уже использован. Попросите у основателя новый.');
    let pid = inv.personId;
    if (!pid || !personById(pid)) pid = Store.add('people', {name: f.name.trim(), title: inv.title || '', dir: inv.dir || '', order: 50});
    const acc = await this.createAccount({...f, role: roleOf(inv.role), personId: pid});
    const p = personById(pid);
    if (p && !p.name) Store.patch('people', pid, {name: f.name.trim()});
    Store.patch('invites', code, {usedBy: acc.id, usedAt: Date.now()});
    this.start(acc);
  },

  async resetWithCode(f) {
    const acc = this.findByEmail(f.email);
    const r = acc && acc.reset;
    if (!r || r.exp < Date.now()) throw new Error('Код сброса не найден или истёк. Попросите у основателя новый.');
    if ((await hashPassword(normCode(f.code), r.salt)) !== r.hash) throw new Error('Код сброса не подошёл.');
    if (f.pw.length < 6) throw new Error('Пароль — не короче 6 символов.');
    const salt = randSalt();
    await Store.put('accounts', acc.id, {...acc, salt, hash: await hashPassword(f.pw, salt), reset: null});
    this.start(acc);
  },

  /* основатель выдаёт код сброса пароля: действует сутки */
  async issueReset(accId) {
    const code = makeCode(), salt = randSalt();
    await Store.patch('accounts', accId, {reset: {salt, hash: await hashPassword(normCode(code), salt), exp: Date.now() + 864e5}});
    return code;
  },
};

function renderAuth(root) {
  const empty = !Store.count('accounts');
  let mode = empty ? 'owner' : View.get('authMode', 'login');
  if (mode === 'owner' && !empty) mode = 'login';

  const titles = {
    owner:  ['Создайте штаб', 'Вы первый: эта учётка станет учёткой основателя. Команду пригласите кодами из раздела «Команда».'],
    login:  ['Вход в штаб', 'Почта и пароль, которые вы задали при регистрации.'],
    invite: ['Вход по приглашению', 'Код выдаёт основатель. Роль и кабинет подставятся сами.'],
    reset:  ['Новый пароль', 'Попросите у основателя код сброса — он действует сутки.'],
  };
  const fields = {
    owner:  ['name', 'email', 'pw', 'pw2'],
    login:  ['email', 'pw'],
    invite: ['code', 'name', 'email', 'pw', 'pw2'],
    reset:  ['email', 'code', 'pw', 'pw2'],
  };
  const F = {
    name:  '<label class="field"><span>Имя и фамилия</span><input class="input" id="a-name" autocomplete="name" placeholder="Анна Смирнова"></label>',
    email: '<label class="field"><span>Почта</span><input class="input" id="a-email" type="email" autocomplete="email" placeholder="name@mail.ru"></label>',
    pw:    `<label class="field"><span>${mode === 'login' ? 'Пароль' : 'Пароль (от 6 символов)'}</span><input class="input" id="a-pw" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}"></label>`,
    pw2:   '<label class="field"><span>Пароль ещё раз</span><input class="input" id="a-pw2" type="password" autocomplete="new-password"></label>',
    code:  `<label class="field"><span>${mode === 'reset' ? 'Код сброса' : 'Код приглашения'}</span><input class="input auth-code" id="a-code" autocomplete="one-time-code" placeholder="ABCD-2345"></label>`,
  };
  const [title, lead] = titles[mode];
  const tabs = empty ? '' : `<div class="seg auth-tabs">
      <button data-mode="login" class="${mode === 'login' ? 'on' : ''}">Вход</button>
      <button data-mode="invite" class="${mode === 'invite' ? 'on' : ''}">У меня приглашение</button>
    </div>`;
  const roles = Object.entries(ROLES).map(([k, r]) =>
    `<li><span class="pill ${r.tone}">${r.name}</span><span>${esc(r.about)}</span></li>`).join('');

  root.innerHTML = `<div class="auth">
    <form class="auth-card card" id="authForm" novalidate>
      <div class="auth-brand">${starSvg('auth-mark')}<div><b>Eva Club</b><span>штаб команды Eva Space · V2</span></div></div>
      ${tabs}
      <h1>${title}</h1>
      <p class="auth-lead">${lead}</p>
      <div class="auth-msg" id="authMsg" hidden></div>
      <div class="auth-fields">${fields[mode].map(k => F[k]).join('')}</div>
      <button class="btn primary auth-go" type="submit" id="authGo">${mode === 'owner' ? 'Создать штаб' : mode === 'invite' ? 'Войти и получить кабинет' : mode === 'reset' ? 'Сохранить пароль и войти' : 'Войти'}</button>
      <div class="auth-links">
        ${mode === 'login' ? '<button type="button" class="link-btn" data-mode="reset">Забыли пароль?</button>' : ''}
        ${mode === 'reset' ? '<button type="button" class="link-btn" data-mode="login">Вернуться ко входу</button>' : ''}
      </div>
      <p class="auth-note">Не используйте пароль от почты или банка: вход разделяет кабинеты внутри команды, а данные штаба видят все, кому открыт доступ к нему.</p>
    </form>
    <aside class="auth-side">
      <p class="label">Кто что видит</p>
      <ul class="auth-roles">${roles}</ul>
      <p class="note">Роль назначает основатель, когда выдаёт код приглашения. Поменять её можно в разделе «Команда».</p>

  const val = id => ($('#' + id, root) || {}).value || '';

    e.preventDefault();
    msg.hidden = true;
    const f = {name: val('a-name'), email: val('a-email'), pw: val('a-pw'), code: val('a-code')};

      if (mode === 'owner') await Auth.createOwner(f);

      msg.textContent = err.message || String(err);
      msg.hidden = false;
      go.disabled = false;
      go.textContent = 'Попробовать ещё раз';

  });

  if (first) setTimeout(() => first.focus(), 30);

/* восьмилучевая звезда Евы — знак из Книги стандартов */
function starPath(cx, cy, R, r) {
  let d = '';
  for (let i = 0; i < 16; i++) {
    const a = (Math.PI / 8) * i - Math.PI / 2, rad = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2);
  }
  return d + 'Z';
}
const STAR = starPath(16, 16, 15, 6.2);
const starSvg = (cls = '') => `<svg viewBox="0 0 32 32" class="${cls}" aria-hidden="true"><path d="${STAR}" fill="#E4A0B8"/><circle cx="16" cy="16" r="3.2" fill="#E7C58B"/></svg>`;

  const n = personName(p).replace(/[^\p{L}\s-]/gu, '').trim().split(/\s+/);
  return ((n[0] || '?')[0] + (n[1] ? n[1][0] : '')).toUpperCase();
}
function avatar(p, cls = '') {

  const color = (DIRS[p.dir] || {}).color || '#7A7386';

  return `<span class="av ${cls}" style="background:${color}" title="${esc(personName(p))}">${inner}</span>`;
}

function toast(text, opts = {}) {
  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' err' : '');
  const span = document.createElement('span');
  span.textContent = text;
  el.appendChild(span);
  let timer;
  const close = () => { clearTimeout(timer); el.remove(); };
  if (opts.undo) {
    const b = document.createElement('button');
    b.textContent = 'Отменить';
    b.onclick = () => { close(); opts.undo(); };
    el.appendChild(b);
  }
  root.appendChild(el);
  timer = setTimeout(close, opts.undo ? 7000 : 4200);
  while (root.children.length > 3) root.firstChild.remove();
}

function openModal({title, body, foot = '', wide = false, focus = true, onMount, onClose}) {
  closePops();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Закрыть">${icon('x')}</button></div>
    <div class="modal-body">${body}</div>
    ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
  </div>`;
  $('#modalRoot').appendChild(back);
  const el = $('.modal', back);
  const key = e => { if (e.key === 'Escape' && !$('.pop')) close(); };
  function close() {
    if (!back.isConnected) return;
    back.remove();
    document.removeEventListener('keydown', key);
    if (onClose) onClose();
    App.renderSoon();
  }
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  on(back, 'click', '[data-close]', e => { e.preventDefault(); close(); });
  document.addEventListener('keydown', key);
  if (onMount) onMount(el, close);
  const first = $('input:not([type=checkbox]):not([disabled]), textarea, select', el);
  if (first && focus) setTimeout(() => first.focus(), 30);
  return {el, close};
}
const modalOpen = () => !!$('#modalRoot .modal-back');

/* ── подтверждение «Да / Нет» рядом с кнопкой (confirm() в артефакте не работает) ── */
function closePops() { $$('.pop').forEach(p => p._done ? p._done(false) : p.remove()); }
function confirmPop(anchor, {text, yes = 'Да', no = 'Нет', danger = false}) {
  return new Promise(resolve => {
    closePops();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.setAttribute('role', 'alertdialog');
    pop.innerHTML = `<p></p><div class="row"><button class="btn sm ${danger ? 'danger solid' : 'primary'}" data-yes></button><button class="btn sm" data-no></button></div>`;
    $('p', pop).textContent = text;
    $('[data-yes]', pop).textContent = yes;
    $('[data-no]', pop).textContent = no;
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = r.bottom + 6, left = r.left + r.width / 2 - w / 2;
    if (top + h > window.innerHeight - 8) top = r.top - h - 6;
    left = clamp(left, 8, window.innerWidth - w - 8);
    pop.style.top = (top + window.scrollY) + 'px';
    pop.style.left = (left + window.scrollX) + 'px';
    const done = v => {
      pop.remove();
      document.removeEventListener('mousedown', outside, true);
      document.removeEventListener('keydown', key, true);
      resolve(v);
    };
    pop._done = done;
    const outside = e => { if (!pop.contains(e.target)) done(false); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    document.addEventListener('keydown', key, true);
    $('[data-yes]', pop).onclick = () => done(true);
    $('[data-no]', pop).onclick = () => done(false);
    $('[data-yes]', pop).focus();
  });
}

/* полоса прогресса: доля и отметка «где должны быть» */
function progress(share, tone = '', mark = null) {
  const w = clamp(share || 0, 0, 1) * 100;
  return `<div class="bar"><i class="${tone}" style="width:${w.toFixed(1)}%"></i>${mark !== null ? `<b style="left:calc(${(clamp(mark, 0, 1) * 100).toFixed(1)}% - 1px)"></b>` : ''}</div>`;
}
const paceTone = (fact, plan) => (!plan ? '' : fact >= plan ? 'good' : fact >= plan * 0.8 ? 'warn' : 'bad');

/* ── графики ──
   Линии: факт — сплошная розовая с заливкой 10% и точкой на конце;
   планы — пунктир (это прогноз), подписаны у правого края.
   Столбики: не толще 24 px, скругление 4 px сверху. Подсказка по наведению. */
/* ровная шкала: шаг 1-2-2,5-5 × 10ⁿ, для штук — только целые */
function niceScale(v, integer = true, ticks = 4) {
  const raw = Math.max(v, integer ? 1 : 1e-9) / ticks;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  let step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  if (integer) step = Math.max(1, Math.ceil(step));
  const max = Math.max(step, Math.ceil(v / step) * step);
  return {max, step};
}
/* ширина графика в пикселях страницы — чтобы подписи были обычного размера */
const chartWidth = () => clamp((($('#page') || {}).clientWidth || 800) - 44, 300, 1200);
function lineChart({labels, series, height = 240, yFmt = fmt}) {
  const W = chartWidth(), H = height, L = 44, R = W < 520 ? 84 : 118, T = 14, B = 26;
  const n = labels.length;
  const sc = niceScale(Math.max(1, ...series.flatMap(s => s.values.filter(v => v !== null))));
  const maxV = sc.max;
  const x = i => L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R));
  const y = v => T + (1 - v / maxV) * (H - T - B);
  let g = '';
  for (let v = 0; v <= maxV + 1e-9; v += sc.step) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 8));
  labels.forEach((lb, i) => { if (lb.tick) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(lb.tick)}</text>`; else if (!labels.some(l => l.tick) && i % step === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(lb.text)}</text>`; });
  let marks = '';
  const ends = [], endsAbove = [];
  series.forEach(s => {
    const pts = s.values.map((v, i) => (v === null ? null : [x(i), y(v)])).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    if (s.area) marks += `<path d="${d}L${pts[pts.length - 1][0].toFixed(1)} ${y(0)}L${pts[0][0].toFixed(1)} ${y(0)}Z" fill="${s.color}" opacity=".1"/>`;
    marks += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linecap="round" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 5"' : ''} opacity="${s.opacity || 1}"/>`;
    const last = pts[pts.length - 1];
    if (s.dot) marks += `<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    if (s.endLabel) (s.labelAbove ? endsAbove : ends).push({y: last[1], x: last[0], text: s.endLabel, above: !!s.labelAbove});
  });
  ends.sort((a, b) => a.y - b.y);
  ends.push(...endsAbove);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  ends.forEach(e => { marks += e.above ? `<text x="${e.x}" y="${e.y - 12}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${esc(e.text)}</text>` : `<text x="${e.x + 8}" y="${e.y + 4}" style="fill:var(--ink-2)">${esc(e.text)}</text>`; });
  const legend = series.filter(s => s.legend).map(s => `<span><i class="${s.dash ? 'dash' : ''}" style="background:${s.color};color:${s.color}"></i>${esc(s.legend)}</span>`).join('');
  const data = esc(JSON.stringify({labels: labels.map(l => l.text), series: series.map(s => ({name: s.legend || s.endLabel || '', color: s.color, dash: !!s.dash, values: s.values}))}));
  return `<div class="chart-box" data-chart="line" data-cfg="${data}" data-geo="${[W, H, L, R, T, B].join(',')}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}<line class="cross" x1="0" x2="0" y1="${T}" y2="${y(0)}" hidden/></svg>
    <div class="chart-tip" hidden></div>
  </div>${legend ? `<div class="legend">${legend}</div>` : ''}`;
}
function barChart({labels, values, plan = null, height = 200, color = 'var(--rose)', yFmt = fmt, highlight = -1}) {
  const W = chartWidth(), H = height, L = 40, R = 12, T = 12, B = 26;
  const n = labels.length;
  const sc = niceScale(Math.max(1, ...values.map(v => v || 0), ...(plan || []).map(v => v || 0)));
  const maxV = sc.max;
  const band = (W - L - R) / Math.max(1, n);
  const bw = Math.min(24, Math.max(3, band - 2));
  const y = v => T + (1 - v / maxV) * (H - T - B);
  let g = '';
  for (let v = 0; v <= maxV + 1e-9; v += sc.step) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / (W < 520 ? 7 : 12)));
  let marks = '';
  values.forEach((v, i) => {
    const cx = L + band * i + band / 2;
    if (i % step === 0 || i === n - 1) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(labels[i].tick ?? labels[i].text)}</text>`;
    const val = v || 0;
    const h = Math.max(0, y(0) - y(val));
    const r = Math.min(4, h / 2, bw / 2);
    const x0 = cx - bw / 2, top = y(0) - h;
    const d = h > 0 ? `M${x0} ${y(0)}V${top + r}Q${x0} ${top} ${x0 + r} ${top}H${x0 + bw - r}Q${x0 + bw} ${top} ${x0 + bw} ${top + r}V${y(0)}Z` : '';
    const tip = `${labels[i].text}|${yFmt(val)}${plan ? '|' + yFmt(plan[i] || 0) : ''}`;
    marks += `<g class="bar-hit" data-tip="${esc(tip)}" tabindex="0"><rect x="${cx - band / 2}" y="${T}" width="${band}" height="${y(0) - T}" fill="transparent"/>${d ? `<path d="${d}" fill="${color}" opacity="${i === highlight || highlight < 0 ? 1 : .55}"/>` : ''}</g>`;
  });
  if (plan) {
    const pts = plan.map((v, i) => `${i ? 'L' : 'M'}${(L + band * i + band / 2).toFixed(1)} ${y(v || 0).toFixed(1)}`).join('');
    marks += `<path d="${pts}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4" pointer-events="none"/>`;
  }
  return `<div class="chart-box" data-chart="bar"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}</svg><div class="chart-tip" hidden></div></div>
    ${plan ? `<div class="legend"><span><i style="background:${color}"></i>Факт</span><span><i class="dash" style="color:var(--ink-2)"></i>План</span></div>` : ''}`;
}
/* подсказки графиков: одна подписка на весь документ */
function wireCharts() {
  const tipAt = (box, html, px, py) => {
    const tip = $('.chart-tip', box);
    tip.innerHTML = html;
    tip.hidden = false;
    const bw = box.clientWidth, tw = tip.offsetWidth;
    tip.style.left = clamp(px + 12, 0, bw - tw) + 'px';
    tip.style.top = Math.max(0, py - tip.offsetHeight - 8) + 'px';
  };
  document.addEventListener('pointermove', e => {
    const box = e.target.closest && e.target.closest('.chart-box');
    $$('.chart-box').forEach(b => { if (b !== box) { const t = $('.chart-tip', b); if (t) t.hidden = true; const c = $('.cross', b); if (c) c.setAttribute('hidden', ''); } });
    if (!box) return;
    const rect = box.getBoundingClientRect();
    if (box.dataset.chart === 'line') {
      const cfg = JSON.parse(box.dataset.cfg);
      const [W, H, L, R, T, B] = box.dataset.geo.split(',').map(Number);
      const sx = (e.clientX - rect.left) * (W / rect.width);
      const n = cfg.labels.length;
      const i = clamp(Math.round(((sx - L) / (W - L - R)) * (n - 1)), 0, n - 1);
      const cx = L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R));
      const cross = $('.cross', box);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.removeAttribute('hidden');
      const rows = cfg.series.filter(s => s.values[i] !== null && s.values[i] !== undefined)
        .map(s => `<div class="tip-row"><i class="${s.dash ? 'dash' : ''}" style="background:${s.color};color:${s.color}"></i><b>${fmt(s.values[i])}</b><span>${esc(s.name)}</span></div>`).join('');
      tipAt(box, `<div class="tip-h">${esc(cfg.labels[i])}</div>${rows}`, (cx / W) * rect.width, e.clientY - rect.top);
    } else {
      const hit = e.target.closest('.bar-hit');
      if (!hit) { $('.chart-tip', box).hidden = true; return; }
      const [label, val, plan] = hit.dataset.tip.split('|');
      tipAt(box, `<div class="tip-h">${esc(label)}</div><div class="tip-row"><b>${esc(val)}</b><span>факт</span></div>${plan !== undefined ? `<div class="tip-row"><b>${esc(plan)}</b><span>план</span></div>` : ''}`, e.clientX - rect.left, e.clientY - rect.top);
    }
  });
}
