.pf-head{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:18px 22px; align-items:center; margin-bottom:16px;}
.pf-photo{position:relative; width:88px; height:88px;}
.pf-photo-btn{position:absolute; right:-4px; bottom:-4px; width:30px; height:30px; border-radius:50%; background:var(--surface); border:1px solid var(--line-strong); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow);}
.pf-photo-btn svg{width:14px; height:14px; stroke:var(--ink-2); fill:none; stroke-width:2;}
.pf-photo-btn:hover{border-color:var(--link);}
.pf-main{min-width:0; display:flex; flex-direction:column; gap:6px;}
.pf-name{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.pf-title{color:var(--ink-2);}
.pf-tags{display:flex; gap:6px; flex-wrap:wrap;}
.pf-contacts{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
.pf-ct{display:inline-flex; flex-direction:column; align-items:flex-start; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:4px 10px; text-align:left;}
.pf-ct span{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em;}
.pf-ct b{font-size:13px; font-weight:500;}
.pf-ct:hover{border-color:var(--link);}
.pf-stats{display:grid; grid-template-columns:repeat(2, minmax(96px, auto)); gap:8px;}
.pf-stats > *{display:flex; flex-direction:column; padding:8px 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); text-decoration:none; color:inherit;}
.pf-stats b{font-size:20px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums;}
.pf-stats span{font-size:11.5px; color:var(--ink-3);}
.pf-stats a:hover{border-color:var(--link);}
.pf-act{grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:12px;}
@media (max-width:900px){ .pf-head{grid-template-columns:auto minmax(0,1fr);} .pf-stats{grid-column:1 / -1; grid-template-columns:repeat(4, minmax(0,1fr));} }
@media (max-width:520px){ .pf-stats{grid-template-columns:repeat(2, minmax(0,1fr));} }
.pf-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:start;}
@media (max-width:900px){ .pf-grid{grid-template-columns:1fr;} }
.pf-col{display:flex; flex-direction:column; gap:14px;}
.pf-sec .card-head{margin-bottom:8px;}
.pf-text{white-space:pre-wrap; color:var(--ink); line-height:1.6;}
.pf-mission{font-size:15px; font-weight:500; color:var(--ink); border-left:3px solid var(--gold-brand); padding-left:12px;}
.pf-kv{display:flex; flex-direction:column; gap:4px;}
.pf-kv .label{margin-top:6px;}
.tags{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.tag{display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 10px; border-radius:14px; background:var(--violet-soft); color:var(--violet); font-size:12.5px; font-weight:500;}
.tag button{background:none; border:0; color:inherit; font-size:15px; line-height:1; padding:0 0 0 2px; opacity:.6;}
.tag button:hover{opacity:1;}
.tag-in{border:1px dashed var(--line-strong); border-radius:14px; height:28px; padding:0 12px; background:transparent; font-size:12.5px; min-width:220px; flex:1;}
.tag-in:focus{outline:none; border-color:var(--link); border-style:solid;}
.pf-goals{list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:4px;}
.pf-goals li{display:flex; align-items:flex-start; gap:6px;}
.pf-goals li .check{flex:1; align-items:flex-start; font-size:13.5px; line-height:1.45;}
.pf-goals li .check input{margin-top:2px;}
.pf-goals li.done span{text-decoration:line-through; color:var(--ink-3);}
.pf-goals .icon-btn, .learn .icon-btn{width:26px; height:26px; flex-basis:26px;}
.learn{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column;}
.lr{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
.lr:last-child{border-bottom:0;}
.lr-t{flex:1; min-width:0; display:flex; flex-direction:column;}
.lr-t a, .lr-t span{font-size:13.5px; font-weight:500; color:var(--ink); text-decoration:none;}
.lr-t a:hover{color:var(--link); text-decoration:underline;}
.lr-t a svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2; margin-left:4px; vertical-align:-1px;}
.lr-t small{font-size:11.5px; color:var(--ink-3);}
.lr.done .lr-t a, .lr.done .lr-t span{color:var(--ink-3); text-decoration:line-through;}
.learn-add{margin-top:10px; gap:8px;}
.pf-pw .input{flex:1 1 170px; width:auto;}

/* ── 72-join.css ── */
/* ── колокольчик звука в меню ── */
.side-row{display:flex; align-items:center; gap:6px; justify-content:space-between;}
.snd-btn{width:28px; height:28px; flex:0 0 28px; border-radius:7px; border:1px solid var(--night-line); background:none; color:var(--night-ink); display:inline-flex; align-items:center; justify-content:center;}
.snd-btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.snd-btn:hover{border-color:var(--rose-brand);}
.snd-btn.off{color:var(--night-ink-2); opacity:.7;}
@media (max-width:880px){ .side-row{gap:4px;} }

/* заметное уведомление: новая задача, согласование */
.toast.ring{background:linear-gradient(135deg, var(--night) 0%, #3A2236 100%); box-shadow:0 0 0 1px color-mix(in srgb, var(--rose-brand) 55%, transparent), var(--shadow-pop); animation:rise .16s ease-out, ring-glow 1.6s ease-out 1;}
.toast-ico{width:18px; height:18px; flex:0 0 18px; stroke:var(--rose-brand); fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; animation:ring-bell .9s ease-in-out 2;}
@keyframes ring-bell{0%,100%{transform:rotate(0);} 20%{transform:rotate(16deg);} 40%{transform:rotate(-14deg);} 60%{transform:rotate(9deg);} 80%{transform:rotate(-5deg);}}
@keyframes ring-glow{0%{box-shadow:0 0 0 6px color-mix(in srgb, var(--rose-brand) 45%, transparent), var(--shadow-pop);}}

/* ── искры: тихо мерцают на тёмном ── */
.wl-sparks{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.wl-sparks svg{position:absolute; fill:#fff; opacity:.0; animation:twinkle 3.2s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.6);} 45%{opacity:.85; transform:scale(1);} 70%{opacity:.25;}}
@media (prefers-reduced-motion: reduce){ .wl-sparks svg{opacity:.5; animation:none;} }

/* ── анкета по ссылке ── */
.auth.one{grid-template-columns:minmax(0,440px); justify-content:center;}
.join{width:100%; max-width:760px; display:flex; flex-direction:column; gap:0;}
.join-hero{position:relative; overflow:hidden; border-radius:var(--radius) var(--radius) 0 0; padding:28px 28px 24px; color:#fff;
  background:radial-gradient(420px 260px at 82% 10%, rgba(194,80,111,.55), transparent 70%), radial-gradient(360px 220px at 10% 110%, rgba(94,47,102,.6), transparent 70%), var(--night);}
.join-mark{width:52px; height:52px; border-radius:13px; position:relative; box-shadow:0 6px 22px rgba(194,80,111,.35);}
.join-hero h1{position:relative; font:600 24px/1.25 var(--f-display); margin:10px 0 6px; color:#fff; letter-spacing:-.01em;}
.join-hero p{position:relative; color:var(--night-ink); font-size:14px; max-width:58ch;}
.join-hero b{color:#fff;}
.wl-kicker{position:relative; margin-top:14px; font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--rose-brand);}
.join-role{position:relative; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; font-size:13px; color:var(--night-ink-2);}
.join-form{border-radius:0 0 var(--radius) var(--radius); border-top:0; padding:22px 28px 24px; display:flex; flex-direction:column; gap:18px;}
.join-lead{font-size:14px; color:var(--ink-2);}
.jf-sec{display:flex; flex-direction:column; gap:12px;}
.jf-sec + .jf-sec{border-top:1px solid var(--line); padding-top:16px;}
.jf-sec h3{font:600 14.5px var(--f-display); display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.jf-sec h3 small{font:400 12px var(--f-text); color:var(--ink-3);}
.jf-src{font-style:normal; font-size:10.5px; font-weight:600; color:var(--good); background:var(--good-soft); border-radius:5px; padding:1px 6px; margin-left:6px; white-space:nowrap;}
.hd-types{display:flex; flex-wrap:wrap; gap:6px;}
.hd-chip{height:32px; padding:0 12px;}
.hd-chip.on{background:var(--violet); border-color:var(--violet); color:#fff;}
.hd-chip[disabled]{cursor:default;}
.hd-hint{min-height:16px; color:var(--violet) !important;}
.hd-prof{max-width:360px;}
.join-go{height:46px; font-size:15px;}
.join-go svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.9;}
.join.preview{max-width:none;}
.join.preview .join-hero{border-radius:var(--radius) var(--radius) 0 0;}
.join.preview .join-form{border:1px solid var(--line); background:var(--surface); padding:18px 20px;}
.join-in{display:flex; flex-direction:column; gap:12px; max-width:640px;}
@media (max-width:640px){
  .join-hero{padding:22px 18px 20px;}
  .join-hero h1{font-size:20px;}
  .join-form{padding:18px 16px 20px;}
}

/* ── окно приглашения ── */
.iv-who{display:flex; align-items:center; gap:12px;}
.iv-who b{display:block; font-size:15px;}
.iv-who small{font-size:12.5px; color:var(--ink-3);}
.iv-roles{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:8px;}
.iv-role{display:flex; flex-direction:column; gap:3px; padding:10px 12px; border:1px solid var(--line-strong); border-radius:9px; cursor:pointer; position:relative; background:var(--surface);}
.iv-role input{position:absolute; opacity:0; pointer-events:none;}
.iv-role b{font-size:13.5px;}
.iv-role small{font-size:12px; color:var(--ink-3); line-height:1.4;}
.iv-role.on{border-color:var(--link); box-shadow:0 0 0 3px var(--link-soft);}
.iv-role:focus-within{outline:2px solid var(--link); outline-offset:2px;}
.iv-fill{display:flex; flex-direction:column; gap:10px; padding:12px 14px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line);}
.iv-fill .label{display:block; margin-bottom:6px;}
.iv-fill .link-btn{align-self:flex-start;}
.invite-out{align-items:stretch;}
.iv-link{display:flex; gap:8px; flex-wrap:wrap;}
.iv-link .input{flex:1 1 260px; font-size:13px; background:var(--surface);}
.iv-msg{margin:0; white-space:pre-wrap; font:13px/1.55 var(--f-text); color:var(--ink-2); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; max-height:180px; overflow:auto;}

/* ── приветствие ── */
.modal.wl-modal{max-width:780px; overflow:hidden; position:relative;}
.wl-modal .modal-head{position:absolute; right:10px; top:10px; padding:0; z-index:3;}
.wl-modal .modal-head h2{display:none;}
.wl-modal .modal-head .icon-btn{color:var(--night-ink); background:rgba(255,255,255,.08);}
.wl-modal .modal-head .icon-btn:hover{background:rgba(255,255,255,.18); color:#fff;}
.wl-modal .modal-body{padding-top:0;}
.wl-hero{position:relative; overflow:hidden; margin:0 -20px; padding:30px 28px 24px; text-align:center; color:#fff;
  background:radial-gradient(460px 260px at 50% 0%, rgba(194,80,111,.55), transparent 70%), radial-gradient(320px 200px at 0% 100%, rgba(94,47,102,.55), transparent 70%), var(--night);}
.wl-mark{width:64px; height:64px; border-radius:16px; position:relative; box-shadow:0 8px 28px rgba(194,80,111,.4); animation:wl-pop .5s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes wl-pop{from{transform:scale(.6); opacity:0;}}
.wl-hero .wl-kicker{margin-top:12px;}
.wl-title{position:relative; font:600 25px/1.25 var(--f-display); color:#fff; margin:6px auto 4px; max-width:24ch; letter-spacing:-.01em;}
.wl-lead{position:relative; font-size:16px; color:var(--night-ink);}
.wl-text{font-size:14.5px; line-height:1.6; color:var(--ink); margin-top:4px;}
.wl-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px;}
@media (max-width:640px){ .wl-grid{grid-template-columns:1fr;} .wl-title{font-size:21px;} .wl-hero{padding:26px 18px 20px;} }
.wl-card{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:8px;}
.wl-year{font-size:14.5px; font-weight:600; color:var(--ink);}
.wl-stages{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
.wl-stages li{display:flex; flex-direction:column; padding-left:12px; border-left:2px solid var(--line-strong);}
.wl-stages li.here{border-left-color:var(--rose);}
.wl-stages b{font-size:13.5px;}
.wl-stages small{font-size:12px; color:var(--ink-3);}
.wl-stages li.here small{color:var(--rose); font-weight:600;}
.wl-miles{font-size:12.5px; color:var(--ink-2);}
.wl-miles span{color:var(--ink-3);}
.wl-num{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.wl-num b{font:600 30px/1 var(--f-display); letter-spacing:-.02em;}
.wl-num span{font-size:12.5px; color:var(--ink-3);}
.wl-goals{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--ink-2);}
.wl-goals b{color:var(--ink);}
.wl-hd{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:10px; background:var(--violet-soft);}
.wl-hd svg{width:20px; height:20px; flex:0 0 20px; stroke:var(--violet); fill:none; stroke-width:1.8; margin-top:2px;}
.wl-hd b{color:var(--violet);}
.wl-hd p{font-size:13.5px; color:var(--ink-2); margin-top:2px;}
.wl-start{display:flex; flex-direction:column; gap:6px;}
.wl-start ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:13.5px;}
.wl-start a{color:var(--link); text-decoration:none;}
.wl-start a:hover{text-decoration:underline;}
.modal-foot svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9;}

/* редактор приветствия у основателя */
.onb{display:flex; flex-direction:column; gap:12px;}
.onb .card-head{margin-bottom:0;}

/* ── командный дух на главной ── */
.spirit{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:0; padding:0; overflow:hidden; margin-bottom:16px;}
@media (max-width:900px){ .spirit{grid-template-columns:1fr;} }
.sp-main{position:relative; overflow:hidden; padding:20px 22px; color:#fff; display:flex; flex-direction:column; gap:10px;
  background:radial-gradient(380px 220px at 90% 0%, rgba(194,80,111,.5), transparent 70%), radial-gradient(300px 200px at 0% 120%, rgba(94,47,102,.55), transparent 70%), var(--night);}
.spirit.bday .sp-main{background:radial-gradient(380px 220px at 90% 0%, rgba(231,197,139,.55), transparent 70%), radial-gradient(300px 200px at 0% 120%, rgba(194,80,111,.55), transparent 70%), var(--night);}
.sp-kicker{position:relative; display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--rose-brand);}
.spirit.bday .sp-kicker{color:var(--gold-brand);}
.sp-kicker svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}
.sp-text{position:relative; font:500 19px/1.4 var(--f-display); color:#fff; max-width:44ch; text-wrap:pretty;}
.sp-text.pop{animation:sp-in .35s ease-out;}
@keyframes sp-in{from{opacity:0; transform:translateY(6px);}}
.sp-foot{position:relative; margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; padding-top:4px;}
.sp-slogan{font-size:12.5px; color:var(--night-ink-2); font-style:italic;}
/* светлая кнопка с тёмным текстом: читается и на тёмном фоне, и при нажатии в любом браузере */
.sp-more{-webkit-appearance:none; appearance:none; background:#fff; border:1px solid #fff; color:#1D1828; border-radius:8px; height:30px; padding:0 12px; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
.sp-more:hover, .sp-more:focus, .sp-more:active{background:#F7E6EE; border-color:#F7E6EE; color:#1D1828;}
.sp-more:focus-visible{outline:2px solid var(--rose-brand); outline-offset:2px;}
.sp-main{background-color:var(--night);}
.sp-side{padding:16px 20px; display:flex; flex-direction:column; gap:12px; background:var(--surface);}
.sp-stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px;}
.sp-stats > div{display:flex; flex-direction:column; padding:8px 10px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line);}
.sp-stats b{font:600 20px/1.1 var(--f-display); font-variant-numeric:tabular-nums;}
.sp-stats span{font-size:11.5px; color:var(--ink-3); line-height:1.3;}
.sp-heroes{display:flex; align-items:center; gap:6px 12px; flex-wrap:wrap;}
.sp-h-l{font-size:12px; font-weight:600; color:var(--ink-2); margin-right:2px;}
.sp-hero{display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--ink); font-size:13px;}
.sp-hero b{font-weight:600;}
.sp-hero em{font-style:normal; font-size:11px; font-weight:700; color:var(--good); background:var(--good-soft); border-radius:9px; padding:0 6px; line-height:18px;}
.sp-hero:hover b{text-decoration:underline;}
.sp-empty{margin:0;}
.sp-bdays{display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--ink-2);}
.sp-bdays svg{width:16px; height:16px; flex:0 0 16px; stroke:var(--gold); fill:none; stroke-width:1.8; margin-top:1px;}
.sp-bdays.now{background:var(--gold-soft); border-radius:8px; padding:8px 10px; color:var(--ink);}
.pill svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2;}

/* ── рождение и дизайн на странице человека ── */
.pf-bd{display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:8px; margin-bottom:10px;}
.pf-bd > div{display:flex; flex-direction:column; padding:8px 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line);}
.pf-bd b{font-size:14px; font-weight:600;}
.pf-bd small{font-size:11.5px; color:var(--ink-3);}
.pf-hd{display:flex; flex-direction:column; gap:6px;}
.pf-hd p{font-size:13.5px; color:var(--ink-2);}
.pf-snd{align-items:center; justify-content:space-between;}
.pf-snd .btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8;}

/* ── 76-tour.css ── */
/* ── подсказки на страницах: заметные, с «Просмотрено» и свёрнутой строкой ── */
.help-wrap{margin-bottom:18px;}
.help{background:color-mix(in srgb, var(--gold-brand) 22%, var(--surface)); border:1px solid color-mix(in srgb, var(--gold) 35%, transparent); border-left:4px solid var(--gold); color:var(--ink); margin-bottom:0; padding:14px 16px; align-items:flex-start;}
.help b{color:var(--ink);}
.help-ico{stroke:var(--gold) !important; width:20px !important; height:20px !important; flex-basis:20px !important;}
.help-body{flex:1; min-width:0;}
.help-ok{flex:0 0 auto; background:var(--gold); border-color:var(--gold); color:#fff; height:30px; padding:0 12px; font-weight:600;}
.help-ok:hover{filter:brightness(1.1); border-color:var(--gold);}
.help-ok svg{width:14px; height:14px;}
/* телефон: «Просмотрено» — под текстом, текст на всю ширину */
@media (max-width:640px){ .help{flex-wrap:wrap;} .help-body{flex:1 1 calc(100% - 36px);} .help-ok{margin-left:32px;} }
.help-mini{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 12px; border-radius:var(--radius); border:1px dashed color-mix(in srgb, var(--gold) 55%, transparent); background:color-mix(in srgb, var(--gold-brand) 10%, var(--surface)); color:var(--ink-2); font-size:13px;}
.help-mini svg{width:16px; height:16px; flex:0 0 16px; stroke:var(--gold); fill:none; stroke-width:1.9;}
.help-mini span{flex:1; min-width:0;}
.help-mini em{font-style:normal; font-size:12px; font-weight:600; color:var(--gold);}
.help-mini:hover{border-style:solid; color:var(--ink);}
@media (max-width:640px){ .help{flex-wrap:wrap;} .help-ok{margin-left:32px;} }

/* ── материал на весь экран ── */
.viewer.full{position:fixed; inset:0; z-index:400; background:var(--bg); padding:0; gap:0;}
.viewer.full .viewer-head, .viewer.full > .note{display:none;}
.viewer.full .viewer-frame{height:100vh; min-height:0; border-radius:0; border:0;}
.viewer-exit{position:fixed; top:12px; right:12px; z-index:410; display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:9px; border:1px solid var(--night-line); background:var(--night); color:#fff; font-size:13px; font-weight:600; box-shadow:var(--shadow-pop);}
.viewer-exit svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2;}
.viewer-exit[hidden]{display:none;}
body.viewer-open{overflow:hidden;}

/* ── тур по странице ── */
.tour{position:fixed; inset:0; z-index:350; pointer-events:none;}
.tour-hole{position:fixed; border-radius:12px; box-shadow:0 0 0 9999px rgba(14,11,18,.58); outline:2px solid var(--gold-brand); outline-offset:2px; transition:top .2s, left .2s, width .2s, height .2s; pointer-events:none;}
.tour-pop{position:fixed; width:340px; max-width:calc(100vw - 16px); background:var(--surface); border-radius:14px; box-shadow:var(--shadow-pop); border:1px solid var(--line); padding:14px 16px; display:flex; flex-direction:column; gap:6px; pointer-events:auto; animation:rise .18s ease-out;}
.tour-n{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--gold);}
.tour-t{font:600 16px/1.3 var(--f-display);}
.tour-x{font-size:13.5px; color:var(--ink-2); line-height:1.55;}
.tour-btns{display:flex; align-items:center; gap:6px; margin-top:6px;}
.tour-btns span{flex:1;}
@media (prefers-reduced-motion: reduce){ .tour-hole{transition:none;} }

/* ── вход: глазок у пароля, вход через Claude, предупреждения ── */
.pw-wrap{position:relative; display:block;}
.pw-wrap .input{padding-right:40px;}
.pw-eye{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:32px; height:30px; border:0; background:none; color:var(--ink-3); display:inline-flex; align-items:center; justify-content:center; border-radius:6px;}
.pw-eye:hover{color:var(--ink); background:var(--sunken);}
.pw-eye svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.pf-pw .pw-wrap{flex:1 1 170px;}
.auth-claude{font-size:12.5px; color:var(--good); background:var(--good-soft); border-radius:8px; padding:8px 10px;}
.join-ro{background:var(--bad-soft); color:var(--bad); border-radius:9px; padding:10px 12px; font-size:13px; font-weight:500;}
.ro-banner{display:flex; gap:10px; align-items:flex-start; margin:0 auto 14px; max-width:1200px; padding:10px 14px; border-radius:var(--radius); background:var(--bad-soft); color:var(--bad); font-size:13px;}
.ro-banner svg{width:18px; height:18px; flex:0 0 18px; stroke:currentColor; fill:none; stroke-width:1.8;}
.ro-banner b{color:var(--bad);}

/* ── данные штаба ── */
.portable{display:flex; flex-direction:column; gap:12px;}
.portable .card-head{margin-bottom:0;}
.pt-row{display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap;}
.pt-row .label{margin-right:4px;}
.pt-row code{background:var(--sunken); padding:1px 5px; border-radius:4px; font-size:12px;}
.pt-acc{font-size:12.5px; color:var(--ink-2);}
.join-ro b{display:block; color:var(--bad); margin-bottom:4px;}
.join-ro p{margin:0 0 8px; color:var(--ink-2); font-weight:400;}
.join-form.is-ro .jf-sec{opacity:.75;}
.iv-share{display:flex; gap:10px; align-items:flex-start; margin-top:12px; padding:10px 12px; border-radius:9px; background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent); font-size:13px;}
.iv-share svg{width:18px; height:18px; flex:0 0 18px; stroke:var(--warn); fill:none; stroke-width:1.9; margin-top:1px;}
.iv-share ol{margin:6px 0 0; padding-left:18px; display:grid; gap:3px; color:var(--ink-2);}
.tour-hole.none{opacity:0;}
.tour-off{align-self:flex-start; font-size:12px; color:var(--ink-3); margin-top:2px;}
.tour-ex{display:flex; flex-direction:column; gap:6px; margin-top:4px; padding:10px; border-radius:10px; background:var(--surface-2); border:1px dashed var(--line-strong);}
.tour-demo{display:flex; flex-direction:column; gap:8px; font-size:12.5px; color:var(--ink-2);}
.td-row{display:flex; align-items:center; gap:10px;}
.td-lock{position:static !important; flex:0 0 22px;}
.td-card{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface);}
.td-card b{font-size:13px; color:var(--ink);}
.td-legend{flex-direction:row; flex-wrap:wrap; align-items:center; gap:8px;}
.td-sw{font-size:11.5px; padding:3px 8px; border-radius:7px; background:var(--surface); border:1px solid var(--line-strong);}
.td-sw.fresh{box-shadow:0 0 0 2px var(--rose-brand);}
.td-sw.awaiting{box-shadow:0 0 0 2px color-mix(in srgb, var(--gold) 70%, transparent);}
.td-sw.returned{background:var(--warn-soft); border-color:color-mix(in srgb, var(--warn) 45%, transparent);}
.tour.center{background:rgba(14,11,18,.45);}
.td-col{flex-direction:column; align-items:flex-start; gap:5px;}
.td-flow{font-size:11.5px; color:var(--ink-3);}
.td-meta{display:flex; gap:6px; align-items:center;}
.td-due{pointer-events:none;}

/* ── 77-tasks-org.css ── */
/* ── задачи: чьи задачи — крупные вкладки ── */
.t-scope{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.t-scope button{display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2); font-size:14px; font-weight:600;}
.t-scope button b{min-width:22px; height:20px; padding:0 6px; border-radius:10px; background:var(--sunken); color:var(--ink-2); font-size:11.5px; display:inline-flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;}
.t-scope button:hover{border-color:var(--ink-3); color:var(--ink);}
.t-scope button.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.t-scope button.on b{background:rgba(255,255,255,.18); color:var(--on-accent);}
.t-scope .select{width:auto; max-width:240px; height:38px; border-radius:10px;}
.t-scope .select.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--link-soft);}

/* строка быстрого добавления — прямо над доской */
.t-quick{display:flex; align-items:flex-end; gap:8px 10px; flex-wrap:wrap; padding:10px 12px; margin-bottom:12px; background:var(--surface); border:1.5px solid color-mix(in srgb, var(--link) 35%, var(--line)); border-radius:12px; box-shadow:0 1px 3px rgba(22,20,28,.05);}
.t-quick:focus-within{border-color:var(--link); box-shadow:0 0 0 3px var(--link-soft);}
.tq-plus{width:32px; height:32px; flex:0 0 32px; border-radius:9px; background:var(--accent); color:var(--on-accent); display:inline-flex; align-items:center; justify-content:center; align-self:center;}
.tq-plus svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.2;}
.tq-title{flex:1 1 280px; min-width:0; height:38px; border:0; background:none; font-size:15px; padding:0 4px; color:var(--ink); align-self:center;}
.tq-title:focus{outline:none;}
.tq-f{display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--ink-3);}
.tq-f .select, .tq-f .input{width:auto; min-width:140px;}
.tq-fix{font-size:12.5px; color:var(--ink-2); align-self:center;}
.tq-twin{flex-basis:100%;}
.t-quick .btn{align-self:center;}
@media (max-width:640px){ .tq-f{flex:1 1 140px;} .tq-f .select, .tq-f .input{min-width:0; width:100%;} }

/* от кого → кому */
.tc-flow{margin-left:auto; display:inline-flex; align-items:center; gap:3px; line-height:0;}
.tc-flow i{font-style:normal; font-size:12px; color:var(--ink-3); line-height:1;}
.tc-flow .av{width:24px; height:24px; flex-basis:24px; font-size:10px;}
.av.xs, .tc-flow .av.xs{width:18px; height:18px; flex-basis:18px; font-size:8px; opacity:.85;}
.t-from{font-size:12px; color:var(--ink-3);}

/* срок: нажать — поменять */
.due-btn{background:none; border:1px dashed transparent; border-radius:6px; padding:1px 4px; margin:-2px -4px; cursor:pointer;}
.due-btn:hover{border-color:var(--line-strong); background:var(--surface-2);}
.t-dfix{font-size:10.5px; font-weight:700; color:var(--bad); background:var(--bad-soft); border-radius:5px; padding:1px 6px;}
.t-dreq{font-size:11px; font-weight:700; color:var(--gold); background:var(--gold-soft); border-radius:5px; padding:1px 6px; white-space:nowrap;}
.pop.due-pop{display:flex; flex-direction:column; gap:8px; width:280px; max-width:calc(100vw - 16px);}
.pop.due-pop p{margin:0;}
.pop.due-pop .note{line-height:1.45;}
.tm-due{display:flex; flex-direction:column; gap:6px;}
.tm-due:empty{display:none;}
.tm-fix{font-size:13px; flex-wrap:wrap;}
.tm-due-hint{margin:0;}
.tm-dreq{display:flex; align-items:center; justify-content:space-between; gap:8px 12px; flex-wrap:wrap; padding:10px 12px; border-radius:9px; background:var(--gold-soft); font-size:13.5px;}
.tm-dreq > span:first-child{display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;}
.tm-dreq svg{width:16px; height:16px; stroke:var(--gold); fill:none; stroke-width:2;}

/* кнопки добавления — рядом с тем, куда добавляют */
.team-add{display:inline-flex; gap:8px; flex-wrap:wrap; margin-left:auto;}
.cal-add{align-self:center; margin-right:auto; margin-left:8px;}
.card-head .row{gap:10px; align-items:center;}

/* ── структура команды ── */
.org{display:flex; flex-direction:column; align-items:center; gap:0; padding:8px 0 4px;}
.org .label{display:block; text-align:center; margin-bottom:8px;}
.org-l0{display:flex; flex-direction:column; align-items:center; position:relative; padding-bottom:22px;}
.org-l0::after{content:''; position:absolute; left:50%; bottom:0; width:2px; height:22px; background:var(--line-strong);}
.org-band{width:100%; border-top:2px solid var(--line-strong); padding-top:10px; margin-bottom:10px; max-width:1100px;}
.org-l1{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px; width:100%; max-width:1100px; align-items:start;}
.org-col{display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line);}
.org-head{padding-bottom:8px; border-bottom:1px solid var(--line);}
.org-team{display:flex; flex-direction:column; gap:6px; padding-left:12px; border-left:2px solid var(--line-strong); margin-left:14px;}
.org-node{display:flex; flex-direction:column; gap:6px;}
.org-sub{display:flex; flex-direction:column; gap:6px; padding-left:12px; border-left:2px dashed var(--line); margin-left:12px;}
.org-box{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; background:var(--surface); border:1px solid var(--line); text-decoration:none; color:inherit; min-width:0;}
.org-box:hover{border-color:var(--link);}
.org-box > span{display:flex; flex-direction:column; min-width:0;}
.org-box b{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.org-box small{font-size:11.5px; color:var(--ink-3); line-height:1.3;}
.org-box em{font-style:normal; margin-left:auto; font-size:10.5px; font-weight:600; color:var(--ink-3); border:1px dashed var(--line-strong); border-radius:6px; padding:1px 6px; white-space:nowrap;}
.org-box.dim{opacity:.75; border-style:dashed;}
.org-box.ceo{min-width:260px; padding:12px 16px; background:var(--night); border-color:var(--night-line); color:#fff; box-shadow:var(--shadow-pop);}
.org-box.ceo small{color:var(--night-ink-2);}
.org-box.ceo .av{width:40px; height:40px; flex-basis:40px; font-size:14px;}
.org-box.dir{border-color:color-mix(in srgb, var(--link) 40%, var(--line)); border-width:1.5px;}
.org-box.dir b{font-size:14px;}
.org-box.sm{padding:6px 8px;}
.org-empty{margin:0 0 0 14px;}
.org-direct{width:100%; max-width:1100px; margin-top:16px;}
.org-row{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px;}
.org > .note{margin-top:14px; text-align:center; max-width:70ch;}

/* ── 80-calendar-metrics.css ── */
/* ── Календарь ── */
.cal-conn{
  display:flex; align-items:center; gap:14px; padding:14px 18px; margin-bottom:16px;
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--link); border-radius:var(--radius);
}
.cal-conn > div:first-child svg{width:28px; height:28px; stroke:var(--link); fill:none; stroke-width:1.6;}
.cal-conn > div:nth-child(2){flex:1; min-width:0;}
.cal-conn p{color:var(--ink-2); font-size:13px; margin-top:3px; max-width:78ch;}
.cal-conn.warn{border-left-color:var(--warn);}
.cal-conn.warn > div:first-child svg{stroke:var(--warn);}
.cal-conn.slim{padding:9px 14px; gap:10px; font-size:13px; color:var(--ink-2); flex-wrap:wrap;}
.cal-conn.slim > span{flex:1; min-width:200px;}
.cal-conn.slim .dot{background:var(--ink-3);}
.cal-conn.slim.ok{border-left-color:var(--good);}
.cal-conn.slim.ok .dot{background:var(--good);}
.cal-conn.slim.off{border-left-color:var(--line-strong);}
@media (max-width:640px){ .cal-conn{flex-wrap:wrap;} .cal-conn > .btn{width:100%;} }

.cal-bar{display:flex; align-items:flex-end; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:14px;}
.cal-bar .tabs{border-bottom:0; margin-bottom:0;}
.cal-nav{display:flex; align-items:center; gap:6px; padding-bottom:6px; flex-wrap:wrap;}
.cal-wk{min-width:118px; text-align:center; font-size:14px;}
.cal-legend{display:flex; gap:8px 16px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--ink-2); margin-bottom:10px;}
.cal-legend > span{display:inline-flex; align-items:center; gap:6px;}
.cal-legend i{width:12px; height:12px; border-radius:3px; display:inline-block;}
.cal-legend .note{margin-left:auto;}
.lg-own{background:var(--link-soft); border:1px solid color-mix(in srgb, var(--link) 45%, transparent);}
.lg-meet{background:var(--accent);}
.lg-off{background:repeating-linear-gradient(135deg, var(--sunken) 0 3px, transparent 3px 6px); border:1px solid var(--line);}

.cal-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
.cal-week{
  --hh:46px; display:grid; grid-template-columns:52px repeat(var(--days), minmax(96px, 1fr));
  min-width:calc(52px + var(--days) * 96px);
}
.cw-corner{border-bottom:1px solid var(--line); background:var(--surface-2);}
.cw-dh{
  display:flex; align-items:baseline; gap:5px; padding:8px 10px; border-bottom:1px solid var(--line); border-left:1px solid var(--line);
  background:var(--surface-2); position:sticky; top:0;
}
.cw-dh span{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:600;}
.cw-dh b{font-size:17px; font-weight:600;}
.cw-dh small{font-size:11.5px; color:var(--ink-3);}
.cw-dh{white-space:nowrap;}
.cw-dh.is-today b{background:var(--link); color:#fff; border-radius:6px; padding:0 6px;}
.cw-dh.we span, .cw-dh.we b{color:var(--ink-3);}
.cw-adl{font-size:10.5px; color:var(--ink-3); padding:6px 4px; text-align:right; border-bottom:1px solid var(--line);}
.cw-ad{border-left:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px; display:flex; flex-direction:column; gap:3px; min-width:0;}
.cw-adi{font-size:11.5px; background:var(--link-soft); color:var(--link); border-radius:4px; padding:1px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cw-times{position:relative; height:calc(var(--hh) * 13);}
.cw-times span{position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.cw-times span:first-child{transform:none; top:2px !important;}
.cw-col{
  position:relative; height:calc(var(--hh) * 13); border-left:1px solid var(--line); cursor:pointer;
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(var(--g-alt) 1px, transparent 1px);
  background-size:100% var(--hh), 100% calc(var(--hh) / 2);
}
.cw-col.we{background-color:var(--surface-2);}
.cw-col.past{background-color:color-mix(in srgb, var(--sunken) 45%, transparent);}
.cw-col:hover{background-color:color-mix(in srgb, var(--link-soft) 35%, transparent);}
.cw-off{position:absolute; left:0; right:0; pointer-events:none; background:repeating-linear-gradient(135deg, var(--g-alt) 0 4px, transparent 4px 8px);}
.cw-now{position:absolute; left:0; right:0; height:2px; background:var(--bad); z-index:3; pointer-events:none;}
.cw-now::before{content:''; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--bad);}
.cw-ev{
  position:absolute; z-index:2; overflow:hidden; border-radius:5px; padding:3px 6px; text-align:left; text-decoration:none;
  display:flex; flex-direction:column; gap:1px; font-size:11.5px; line-height:1.25; border:1px solid transparent; min-height:18px;
}
.cw-ev.short{flex-direction:row; align-items:center; gap:6px; padding-top:1px; padding-bottom:1px;}
.cw-ev b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cw-ev small{font-size:10.5px; opacity:.8; white-space:nowrap;}
.cw-ev.own{background:var(--link-soft); color:var(--ink); border-color:color-mix(in srgb, var(--link) 40%, transparent); border-left:3px solid var(--link);}
.cw-ev.own.free{background:var(--surface); border-style:dashed; color:var(--ink-3);}
.cw-ev.meet{background:color-mix(in srgb, var(--accent) 82%, var(--link)); color:var(--on-accent); border-left:3px solid var(--gold-brand);}
.cw-ev.meet:not(.mine){background:var(--sunken); color:var(--ink-2); border-color:var(--line-strong); border-left:3px solid var(--ink-3);}
.cw-ev:hover{filter:brightness(1.06); z-index:4;}

/* занятость команды */
.ct-days{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none;}
.ct-days button{
  flex:1 0 108px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; text-align:left;
  display:flex; flex-direction:column; gap:2px;
}
.ct-days button span{font-size:13px; font-weight:600;}
.ct-days button small{font-size:11.5px; color:var(--good);}
.ct-days button.past{opacity:.55;}
.ct-days button.on{border-color:var(--link); box-shadow:0 0 0 2px var(--link-soft);}
.ct-tools{display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap; margin-bottom:12px;}
.ct-tools .chips{flex:1; min-width:240px;}
.ct-nd{color:var(--warn); font-weight:700;}
.chip.ghost{border-style:dashed;}
.ct-wh{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2);}
.ct-wh .select{width:84px;}
.cal-team{min-width:760px;}
.ct-row{display:grid; grid-template-columns:170px minmax(0,1fr); border-bottom:1px solid var(--line); min-height:46px;}
.ct-row:last-child{border-bottom:0;}
.ct-name{display:flex; align-items:center; gap:9px; padding:6px 12px; text-decoration:none; color:inherit; min-width:0; background:var(--surface); position:sticky; left:0; z-index:3; border-right:1px solid var(--line);}
.ct-name > span:last-child{min-width:0;}
.ct-name b{display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ct-name small{display:block; font-size:11px; color:var(--ink-3); white-space:nowrap;}
a.ct-name:hover b{text-decoration:underline;}
.ct-fico{width:26px; height:26px; border-radius:50%; background:var(--good-soft); display:inline-flex; align-items:center; justify-content:center; flex:0 0 26px;}
.ct-fico svg{width:15px; height:15px; stroke:var(--good); fill:none; stroke-width:2.2;}
.ct-track{
  position:relative; cursor:pointer;
  background-image:linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:calc(100% / 13) 100%;
}
.ct-head{min-height:28px; background:var(--surface-2);}
.ct-head .ct-name{background:var(--surface-2);}
.ct-head .ct-track{cursor:default; background:none;}
.ct-head .ct-track span{position:absolute; top:7px; transform:translateX(-50%); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.ct-head .ct-track span:first-child{transform:none; padding-left:3px;}
.ct-head .ct-track span:last-child{transform:translateX(-100%); padding-right:3px;}
.ct-off{position:absolute; top:0; bottom:0; pointer-events:none; background:repeating-linear-gradient(135deg, var(--g-alt) 0 4px, transparent 4px 8px); background-color:var(--g-alt);}
.ct-now{position:absolute; top:0; bottom:0; width:2px; background:var(--bad); z-index:2; pointer-events:none;}
.ct-b{position:absolute; top:7px; bottom:7px; border-radius:5px; overflow:hidden; display:flex; align-items:center; padding:0 6px; min-width:3px;}
.ct-b em{font-style:normal; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ct-b.busy{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink-3) 42%, transparent) 0 5px, color-mix(in srgb, var(--ink-3) 30%, transparent) 5px 10px); cursor:default;}
.ct-b.meet{background:color-mix(in srgb, var(--accent) 82%, var(--link)); color:var(--on-accent); cursor:pointer;}
.ct-b.free{background:var(--good-soft); border:1px solid color-mix(in srgb, var(--good) 45%, transparent); color:var(--good); cursor:pointer; z-index:1;}
.ct-b.free:hover{background:color-mix(in srgb, var(--good) 22%, var(--surface));}
.ct-free{background:color-mix(in srgb, var(--good-soft) 35%, transparent);}
.ct-row.nodata .ct-track{background-color:var(--surface-2);}
.ct-row.nodata .ct-name small{color:var(--warn);}
.ct-nodata{margin-top:10px;}

/* список собраний */
.mt-tools{display:flex; gap:10px 16px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
.mt-list{padding:0; overflow:hidden;}
.mt-row{display:grid; grid-template-columns:86px minmax(0,1fr) auto auto auto; gap:14px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line);}
.mt-row:last-child{border-bottom:0;}
.mt-row.mine{box-shadow:inset 3px 0 0 var(--gold-brand);}
.mt-when b{display:block; font-size:16px; font-variant-numeric:tabular-nums;}
.mt-when small{font-size:11.5px; color:var(--ink-3);}
.mt-main{background:none; border:0; padding:0; text-align:left; min-width:0; display:flex; flex-direction:column; gap:2px; color:inherit;}
.mt-main b{font-size:14px;}
.mt-main:hover b{text-decoration:underline; text-underline-offset:3px;}
.mt-main small{font-size:12px; color:var(--ink-3);}
.mt-agenda{font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mt-ppl{display:flex; align-items:center;}
.mt-p{position:relative; margin-left:-5px; border-radius:50%; box-shadow:0 0 0 2px var(--surface);}
.mt-p:first-child{margin-left:0;}
.mt-p i{position:absolute; right:-4px; bottom:-4px; width:14px; height:14px; border-radius:50%; font-style:normal; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; background:var(--surface); color:var(--ink-3); box-shadow:0 0 0 1px var(--line-strong);}
.mt-p.good i{background:var(--good); color:#fff; box-shadow:none;}
.mt-p.bad i{background:var(--bad); color:#fff; box-shadow:none;}
.mt-p.warn i{background:var(--warn); color:#fff; box-shadow:none;}
.mt-act{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
.mt-past summary{cursor:pointer; font-weight:600; font-size:13.5px; color:var(--ink-2); margin-bottom:10px;}
@media (max-width:900px){
  .mt-row{grid-template-columns:64px minmax(0,1fr); gap:8px 12px;}
  .mt-ppl, .mt-st, .mt-act{grid-column:2;}
  .mt-act{justify-content:flex-start;}
}

/* окно собрания */
.mt-time{display:grid; grid-template-columns:150px 110px auto minmax(150px,1fr); gap:12px; align-items:end;}
@media (max-width:760px){ .mt-time{grid-template-columns:1fr 1fr;} .mt-time > :nth-child(3){grid-column:1 / -1;} }
.mt-chips .chip{height:32px; padding:0 10px 0 4px;}
.mt-chips .chip .av{width:22px; height:22px; flex-basis:22px; font-size:9.5px;}
.mt-chip.on{background:var(--link-soft); border-color:var(--link); color:var(--ink);}
.mt-chip.nomail{border-style:dashed;}
.mt-nomail{font-size:10.5px; color:var(--warn); font-weight:600;}
.mt-help{display:flex; flex-direction:column; gap:10px;}
.mt-help:empty{display:none;}
.mt-state{display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border-radius:8px; font-size:13px;}
.mt-state svg{width:17px; height:17px; flex:0 0 17px; fill:none; stroke:currentColor; stroke-width:2.2; margin-top:1px;}
.mt-state small{display:block; color:var(--ink-3); margin-top:2px; font-size:12px;}
.mt-state.good{background:var(--good-soft); color:var(--good);}
.mt-state.good span{color:var(--ink);}
.mt-state.bad{background:var(--bad-soft); color:var(--bad);}
.mt-state.bad span{color:var(--ink);}
.mt-slots, .mt-gslots{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.mt-slots .label, .mt-gslots .label{margin-right:4px;}
.mt-gslots:empty{display:none;}
.mt-opts{display:flex; flex-direction:column; gap:8px; padding:12px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;}
.warn-t{color:var(--warn);}
.mt-view{display:flex; flex-direction:column; gap:12px;}
.mt-agenda-full{white-space:pre-wrap; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13.5px;}
.mt-ppl.big{flex-wrap:wrap; gap:8px 14px;}
.mt-pl{display:inline-flex; align-items:center; gap:6px; font-size:13px;}
.mt-pl small{font-size:11.5px; color:var(--ink-3);}
.mt-pl small.good{color:var(--good);} .mt-pl small.bad{color:var(--bad);} .mt-pl small.warn{color:var(--warn);}

/* собрания сегодня на главной */
.today-meet{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px;}
.tm-row{display:flex; align-items:center; gap:10px; font-size:13.5px;}
.tm-row b{font-variant-numeric:tabular-nums; min-width:44px;}
.tm-row a:not(.btn){color:var(--ink); text-decoration:none; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tm-row a:not(.btn):hover{text-decoration:underline;}

/* ── Метрики: одна воронка сверху вниз ── */
.mx-mode{margin-bottom:14px;}
.mx2{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr); gap:16px; align-items:start;}
@media (max-width:1000px){ .mx2{grid-template-columns:1fr;} }
.mx-flow{padding:10px 20px 14px;}
.mf2-row{display:grid; grid-template-columns:150px minmax(0,1fr) 120px; gap:14px; align-items:center; padding:9px 0;}
.mf2-name b{display:block; font-size:14px;}
.mf2-name small{display:block; font-size:11.5px; color:var(--ink-3); line-height:1.3;}
.mf2-bar{height:26px; background:var(--sunken); border-radius:6px; overflow:hidden;}
.mf2-bar i{display:block; height:100%; border-radius:6px; background:color-mix(in srgb, var(--link) 78%, var(--surface)); transition:width .18s ease;}
.mf2-row.main .mf2-bar i{background:var(--good);}
.mf2-row.renew .mf2-bar i{background:var(--gold-brand);}
.mf2-val{text-align:right;}
.mf2-val b{font-size:18px; font-weight:600; font-variant-numeric:tabular-nums;}
.mf2-row.main .mf2-val b{font-size:22px; color:var(--good);}
.mf2-row.main .mf2-name b{color:var(--good);}
.mx-reach-in{height:36px; font-size:16px; font-weight:600;}
.mf2-conv{display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:40px; margin-left:164px; padding:2px 0 2px 14px; border-left:2px dashed var(--line-strong);}
.mf2-arr{display:none;}
.mx-pct{display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); overflow:hidden;}
.mx-pct button{width:30px; height:32px; border:0; background:var(--surface-2); color:var(--ink-2); font-size:16px; font-weight:600; line-height:1;}
.mx-pct button:hover{background:var(--sunken); color:var(--ink);}
.mx-pct .input{width:58px; height:32px; border:0; border-radius:0; text-align:right; font-weight:700; font-size:15px; padding:0 2px 0 6px; box-shadow:none;}
.mx-pct span{font-size:13px; color:var(--ink-3); padding-right:6px; font-weight:600;}
.mf2-verb{font-size:13px; color:var(--ink-2);}
.mf2-hint{font-size:12px; color:var(--ink-3); margin-left:auto;}
@media (max-width:640px){
  .mx-flow{padding:6px 14px 10px;}
  .mf2-row{grid-template-columns:minmax(0,1fr) auto; gap:4px 10px;}
  .mf2-bar{grid-column:1 / -1; grid-row:2; height:14px;}
  .mf2-conv{margin-left:10px; padding-left:12px;}
  .mf2-hint{margin-left:0; flex-basis:100%;}
}
.mx-side{display:flex; flex-direction:column; gap:12px; position:sticky; top:16px;}
@media (max-width:1000px){ .mx-side{position:static;} }
.mx-res .label{display:block; margin-bottom:6px;}
.mx-big{font:600 40px/1.05 var(--f-display); letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.mx-big small{font:500 15px var(--f-text); color:var(--ink-3); letter-spacing:0; margin-left:8px;}
.mx-vs{margin-top:6px; font-size:13.5px; font-weight:600; color:var(--ink-2);}
.mx-vs.good{color:var(--good);} .mx-vs.warn{color:var(--warn);} .mx-vs.bad{color:var(--bad);}
.mx-dl{margin:14px 0 0; display:flex; flex-direction:column; border-top:1px solid var(--line);}
.mx-dl div{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.mx-dl div:last-child{border-bottom:0;}
.mx-dl dt{color:var(--ink-2);}
.mx-dl dd{margin:0; font-weight:600; font-variant-numeric:tabular-nums;}
.mx-set{display:flex; flex-direction:column; gap:12px;}
.mx-set .field .input{max-width:160px;}
.mx-act{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding-top:12px; border-top:1px solid var(--line);}
.mx-act .row{gap:6px;}
.mx-fact{font-size:12.5px; color:var(--ink-3); line-height:1.5;}
.mx-levs{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px;}
.mx-levs li{font-size:13.5px; display:flex; gap:8px; flex-wrap:wrap; align-items:baseline;}
.mx-levs li::marker{color:var(--ink-3); font-weight:600;}
.mx-lv-v{margin-left:auto; color:var(--good); font-weight:600; font-variant-numeric:tabular-nums;}
.mx-months summary{cursor:pointer; font-weight:600; font-size:14px; margin-bottom:10px;}
.mx-months .input{max-width:130px; margin-left:auto;}
.ct-tools .chip.on{background:var(--link-soft); border-color:var(--link); color:var(--ink);}
@media (max-width:640px){
  .ct-row{grid-template-columns:118px minmax(0,1fr);}
  .ct-name{padding:6px 8px; gap:7px;}
  .ct-name small{white-space:normal; line-height:1.2;}
  .cal-team{min-width:640px;}
  .cal-conn.slim .btn{flex:1;}
}

/* вкладка «Почты» */
.ml-me{margin-bottom:6px;}
.ml-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px 28px;}
@media (max-width:860px){ .ml-grid{grid-template-columns:1fr;} }
.ml-block{display:flex; flex-direction:column; gap:8px; min-width:0;}
.ml-block .note b{color:var(--ink);}
.ml-cands .chip{height:auto; min-height:28px; padding:4px 10px; flex-direction:column; align-items:flex-start; gap:0;}
.ml-cands .chip small{font-size:10.5px; color:var(--ink-3); font-weight:400;}
.ml-other summary{cursor:pointer; font-size:12.5px; color:var(--link); font-weight:500;}
.ml-other p{margin-top:6px;}
.ml-foot{display:flex; justify-content:flex-end; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
.ml-person{display:flex; align-items:center; gap:9px; color:inherit; text-decoration:none; min-width:0;}
.ml-person b{display:block; font-size:13px;}
.ml-person small{display:block; font-size:11.5px; color:var(--ink-3);}
.ml-table td{vertical-align:middle;}
.ml-table .input{min-width:200px;}
.ml-src{display:block; font-size:11px; color:var(--ink-3);}
.input.bad{border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-soft);}
.cal-tabs .n.warn-t{color:var(--warn);}
.mt-mail:empty{display:none;}
.mt-mail{display:flex; flex-direction:column; gap:8px; padding:10px 12px; border-radius:8px; background:var(--warn-soft);}
.mt-mail .note{color:var(--warn);}
.mt-mail-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
.mt-mail-row .field{min-width:190px; flex:1;}

/* ── созвоны из Eva CRM: полупрозрачные — время занято, но это не собрание штаба ── */
.lg-crm{background:color-mix(in srgb, #C2506F 22%, transparent); border:1px dashed color-mix(in srgb, #C2506F 70%, transparent);}
.cw-ev.own.crm{background:color-mix(in srgb, #C2506F 12%, transparent); border:1px dashed color-mix(in srgb, #C2506F 55%, transparent); border-left:3px solid color-mix(in srgb, #C2506F 70%, transparent); color:var(--ink-2); opacity:.78;}
.cw-ev.own.crm:hover{opacity:1;}
.ct-b.crm{background:color-mix(in srgb, #C2506F 16%, transparent); border:1px dashed color-mix(in srgb, #C2506F 60%, transparent); color:color-mix(in srgb, #C2506F 85%, var(--ink)); opacity:.8; cursor:default;}
.crm-today .tm-row{gap:10px; align-items:center; flex-wrap:wrap;}
.crm-today .tm-row span{color:var(--ink-3); font-size:13px;}

/* ── 86-adam.css ── */
/* Адам и сообщения команды: кнопка в углу и панель справа */
.adam-av{display:inline-flex; width:100%; height:100%; border-radius:50%; flex:0 0 auto;}
.adam-av svg{width:100%; height:100%; display:block;}
.adam-av.xs{width:22px; height:22px; flex-basis:22px;}
.adam-av.lg{width:64px; height:64px;}
.adam-eyes{transform-origin:24px 24.5px; animation:adamBlink 5.5s infinite;}
@keyframes adamBlink{0%, 93%, 100%{transform:scaleY(1);} 95%{transform:scaleY(.12);}}
.adam-spark{transform-origin:37.5px 10.5px; animation:adamSpark 3.2s ease-in-out infinite;}
@keyframes adamSpark{50%{transform:scale(.7) rotate(20deg); opacity:.75;}}
@media (prefers-reduced-motion: reduce){ .adam-eyes, .adam-spark, .adam-fab.news{animation:none;} }

.adam-fab{
  position:fixed; right:22px; bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:90;
  width:58px; height:58px; padding:0; border:0; border-radius:50%; background:none; cursor:pointer;
  box-shadow:0 10px 26px rgba(40,20,60,.35), 0 2px 6px rgba(40,20,60,.2); transition:transform .15s ease;
}
.adam-fab:hover{transform:translateY(-2px) scale(1.04);}
.adam-fab:focus-visible{outline:3px solid var(--link); outline-offset:3px;}
.adam-fab.news{animation:fabPulse 2.4s ease-in-out infinite;}
@keyframes fabPulse{50%{box-shadow:0 10px 26px rgba(40,20,60,.35), 0 0 0 8px color-mix(in srgb, var(--rose-brand) 35%, transparent);}}
.fab-n{
  position:absolute; top:-3px; right:-3px; min-width:21px; height:21px; padding:0 6px; border-radius:11px;
  background:var(--bad); color:#fff; font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center;
  border:2px solid var(--bg); font-variant-numeric:tabular-nums;
}
.fab-n.dot{min-width:14px; width:14px; height:14px; padding:0; top:1px; right:1px; background:var(--gold-brand);}
body.chat-on .adam-fab{transform:scale(.9);}

.chat{
  position:fixed; right:22px; bottom:calc(92px + env(safe-area-inset-bottom,0px)); z-index:90;
  width:min(420px, calc(100vw - 44px)); height:min(640px, calc(100vh - 120px));
  display:flex; flex-direction:column; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow-pop); overflow:hidden;
}
.chat[hidden]{display:none;}
.chat-head{display:flex; align-items:center; gap:8px; padding:10px 10px 0 12px; border-bottom:1px solid var(--line);}
.chat-tabs{display:flex; gap:2px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none;}
.chat-tabs button{
  display:inline-flex; align-items:center; gap:6px; padding:8px 10px 10px; border:0; background:none; color:var(--ink-3);
  font:600 13px/1 var(--f-text); border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer;
}
.chat-tabs button svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.chat-tabs button.on{color:var(--ink); border-bottom-color:var(--link);}
.chat-tabs .n:not(:empty){min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--bad); color:#fff; font-size:11px; display:inline-flex; align-items:center; justify-content:center;}
.chat-sub{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); min-height:34px;}
.chat-sub .note{font-size:12px;}
.chat-back{display:inline-flex; align-items:center; gap:4px;}
.chat-back svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;}
.chat-peer{display:inline-flex; align-items:center; gap:7px; font-size:13px;}
.chat-peer .av{width:22px; height:22px; flex-basis:22px; font-size:9.5px;}
.chat-list{flex:1; overflow-y:auto; padding:14px 12px 10px; display:flex; flex-direction:column; gap:10px; overscroll-behavior:contain;}
.chat-empty{margin:auto; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; color:var(--ink-3); max-width:280px; font-size:13px;}
.chat-empty b{color:var(--ink); font-size:15px;}

.msg{display:flex; gap:8px; align-items:flex-end; max-width:92%;}
.msg.own{align-self:flex-end; flex-direction:row-reverse;}
.msg .av{width:24px; height:24px; flex-basis:24px; font-size:10px;}
.msg-b{background:var(--surface-2); border:1px solid var(--line); border-radius:12px 12px 12px 4px; padding:8px 11px; min-width:0;}
.msg.own .msg-b{background:var(--link-soft); border-color:color-mix(in srgb, var(--link) 30%, transparent); border-radius:12px 12px 4px 12px;}
.msg.adam .msg-b{background:color-mix(in srgb, var(--rose-soft) 70%, var(--surface));}
.msg-b > b{display:block; font-size:11.5px; color:var(--link); margin-bottom:2px;}
.msg-b p{margin:0; font-size:13.5px; line-height:1.45; overflow-wrap:anywhere;}
.msg-b p a{color:var(--link);}
.msg-b small{display:flex; align-items:center; gap:4px; justify-content:flex-end; font-size:10.5px; color:var(--ink-3); margin-top:3px;}
.msg-del{border:0; background:none; padding:0; width:15px; height:15px; color:var(--ink-3); cursor:pointer; opacity:0; display:inline-flex;}
.msg-del svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2;}
.msg:hover .msg-del, .msg-del:focus-visible{opacity:1;}
@media (hover:none){ .msg-del{opacity:.6;} }
.msg-day{align-self:center; font-size:11px; color:var(--ink-3); background:var(--sunken); padding:2px 10px; border-radius:10px;}
.adam-note{justify-content:flex-start !important; color:var(--warn) !important; font-size:11.5px !important;}
.typing{display:inline-flex; gap:4px; padding:4px 0;}
.typing i{width:6px; height:6px; border-radius:50%; background:var(--ink-3); animation:typing 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.15s;}
.typing i:nth-child(3){animation-delay:.3s;}
@keyframes typing{30%{transform:translateY(-4px); opacity:.5;}}
.adam-cards{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.adam-cards .chip{height:auto; min-height:28px; padding:4px 10px; font-size:12.5px; gap:5px; max-width:100%;}
.adam-cards .chip svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; flex:0 0 14px;}
.adam-card{flex:1 1 100%; display:flex; flex-direction:column; gap:5px; padding:9px 10px; border-radius:9px; background:var(--surface); border:1px solid var(--line);}
.adam-card .label{font-size:11px;}
.adam-card small{color:var(--ink-3); font-size:12px;}
.adam-card .row{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
.adam-card blockquote{margin:0; padding:6px 10px; border-left:3px solid var(--rose-brand); background:var(--surface-2); border-radius:0 6px 6px 0; font-size:13px; line-height:1.45;}

.dm-list{display:flex; flex-direction:column;}
.dm-row{display:flex; align-items:center; gap:10px; padding:9px 6px; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer; color:inherit; border-radius:6px;}
.dm-row:hover{background:var(--surface-2);}
.dm-row > span{flex:1; min-width:0; display:flex; flex-direction:column;}

const $ = (s, r = document) => r.querySelector(s);

const ESC = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);

const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));

const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* Слияние как у db.update(): вложенные объекты сливаются, остальное заменяется */
function deepMerge(base, patch) {
  const out = isObj(base) ? {...base} : {};
  for (const [k, v] of Object.entries(patch || {})) {
    out[k] = isObj(v) && isObj(out[k]) ? deepMerge(out[k], v) : clone(v);
  }
  return out;
}

/* Делегирование событий: on(root, 'click', '[data-x]', (e, el) => …) */
function on(root, type, sel, fn) {
  root.addEventListener(type, e => {

    if (el && root.contains(el)) fn(e, el);
  });
}

/* ── числа ── */
const NB = ' ';
function fmt(n, d = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const v = Number(n);
  return v.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d}).replace(/\s/g, NB);
}
const rub = n => (n === null || n === undefined ? '—' : fmt(Math.round(n)) + NB + '₽');
/* компактно: 1,45 млн ₽ · 290 тыс ₽ · 900 ₽ */
function rubK(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + fmt(a / 1e6, a >= 1e7 ? 1 : 2).replace(/,?0+$/, '') + NB + 'млн' + NB + '₽';
  if (a >= 1e4) return s + fmt(Math.round(a / 1e3)) + NB + 'тыс' + NB + '₽';
  return s + fmt(Math.round(a)) + NB + '₽';
}
const signed = (n, f = rubK) => (n > 0 ? '+' : n < 0 ? '' : '') + f(n);
/* доля без лишних знаков: 5% · 5,3% · 1,9% */
const pctA = x => (Number.isFinite(x) && Math.abs(x * 100 - Math.round(x * 100)) >= 0.05 ? pct(x, 1) : pct(x));
const pct = (x, d = 0) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : fmt(x * 100, d) + '%');
const parseNum = s => {
  const v = parseFloat(String(s ?? '').replace(/\s| /g, '').replace(',', '.'));
  return Number.isFinite(v) ? v : 0;
};
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/* ── даты: всё в местном времени, формат 'YYYY-MM-DD' и месяц 'YYYY-MM' ── */

const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
/* «сегодня» можно подменить для проверок: window.__EVA_TODAY = '2026-10-15' */
const today = () => (typeof window !== 'undefined' && window.__EVA_TODAY) || isoOf(new Date());

  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthRange(from, to) {

  for (let m = from; m <= to; m = addMonths(m, 1)) out.push(m);

}
/* понедельник недели */
const weekStart = s => { const d = dateOf(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return isoOf(d); };
const weekday = s => (dateOf(s).getDay() + 6) % 7; // 0 = пн

const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_SH = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD_SH = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const monthIdx = m => Number(m.slice(5, 7)) - 1;
/* 'Октябрь' · с годом, если он не текущий квартальный: 'Январь 2027' */
function monthName(m, withYear = false) {
  const name = cap(MONTHS[monthIdx(m)]);

const monthShort = m => cap(MONTHS_SH[monthIdx(m)]) + (m.slice(0, 4) !== '2026' ? ' ' + m.slice(2, 4) : '');
/* '5 окт' · '5 октября' */
const dayShort = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}`; };
const dayLong = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_GEN[d.getMonth()]}`; };

/* подпись недели: '5–11 окт' или '28 сен – 4 окт' */

  const end = addDays(start, 6), a = dateOf(start), b = dateOf(end);

function timeAgo(ts) {
  if (!ts) return '';

/* Хранилище на своём сервере (club/v2/server/server.js) — тот же интерфейс,
