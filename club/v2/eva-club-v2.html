        const tw = $('#tmTwin', el), twin = Tasks.twin($('#tmTitle', el).value, isNew ? null : id);
        tw.hidden = !twin;
        if (twin) tw.innerHTML = `Похожая задача уже есть: «${esc(twin.title.slice(0, 60))}» — ${esc(twin.assignee ? personName(personById(twin.assignee)) : 'без исполнителя')}, ${STATUSES[twin.status].name.toLowerCase()}.`;
      });
      bind('#tmDesc', v => set({desc: v}));
      bind('#tmResult', v => set({result: v}));
      bind('#tmCreator', v => set({createdBy: v || null}, `Постановщик: ${v ? whoName(v) : '—'}`));
      bind('#tmWho', v => { const t = cur(), p = personById(v); set({assignee: v || null, ...(p && p.dir && !t.dir ? {dir: p.dir} : {})}, `Исполнитель: ${p ? personName(p) : 'не назначен'}`, {type: 'assign', to: [v]}); });
      bind('#tmDir', v => set({dir: v}));
      bind('#tmPrio', v => set({priority: v}, `Приоритет: ${PRIO[v].name.toLowerCase()}`));
      bind('#tmGoal', v => set({goalId: v || null}));
      bind('#tmStrat', v => set({stratId: v || null}));
      bind('#tmDue', v => {
        const t = cur();
        if (isNew) { const patch = {due: v || null}; if (v) { patch.month = monthOf(v); const mm = $('#tmMonth', el); if (mm) mm.value = monthOf(v); } set(patch); return; }
        if (Tasks.changeDue(t, v || null, v ? undefined : t.month) !== 'requested') saved();
        paint();
      });
      bind('#tmMonth', v => {
        const t = cur();
        if (isNew) { const patch = {month: v || null}; if (t.due && monthOf(t.due) !== v) { patch.due = null; $('#tmDue', el).value = ''; } set(patch); return; }
        if (Tasks.changeDue(t, t.due && monthOf(t.due) === v ? t.due : null, v || null) !== 'requested') saved();
        paint();
      });
      on(el, 'change', '#tmDueFixed', (e, i) => set({dueFixed: i.checked}, i.checked ? 'Срок важен: перенос — по согласованию' : 'Срок гибкий: в пределах месяца исполнитель переносит сам'));
      on(el, 'click', '[data-due-ok]', (e, b) => Tasks.resolveDue(cur(), b.dataset.dueOk === '1'));

      /* бюджет */
      const setBudget = (amount) => {
        const t = cur(), patch = {budget: Math.max(0, Math.round(amount))};
        const force = !Auth.can('money.edit');
        if (force && patch.budget > 0) patch.budgetNeedsApproval = true;
        const needs = patch.budgetNeedsApproval ?? t.budgetNeedsApproval;
        let log = patch.budget ? `Бюджет: ${rub(patch.budget)}` : 'Бюджет снят', ev = null;
        if (needs && patch.budget > 0 && !Tasks.canApproveBudget(t)) {
          Object.assign(patch, {budgetApproved: false, budgetRejected: false});
          ev = {type: 'budget', to: [Tasks.budgetApprover(t)]};
          log = `${me()}: просит согласовать бюджет ${rubK(patch.budget)}`;
        }
        set(patch, log, ev);
      };
      on(el, 'click', '[data-bq]', (e, b) => setBudget(Number(b.dataset.bq)));
      on(el, 'change', '#tmBudget', (e, i) => setBudget(parseNum(i.value)));
      on(el, 'change', '#tmBudgetCat', (e, i) => set({budgetCat: i.value}));
      on(el, 'change', '#tmBudgetAppr', (e, i) => {
        const t = cur();
        if (!i.checked && !Auth.can('money.edit')) { i.checked = true; toast('Бюджет от сотрудника всегда идёт на согласование'); return; }
        const patch = {budgetNeedsApproval: i.checked, budgetApproved: false, budgetRejected: false};
        const pending = i.checked && Number(t.budget) > 0;
        set(patch, i.checked ? (pending ? `${me()}: просит согласовать бюджет ${rubK(t.budget)}` : 'Бюджет — с согласованием') : 'Бюджет — без согласования', pending ? {type: 'budget', to: [Tasks.budgetApprover(t)]} : null);
      });
      on(el, 'change', '#tmBudgetWho', (e, i) => {
        const t = cur();
        set({budgetApprover: i.value, budgetApproved: false, budgetRejected: false}, `Бюджет согласует: ${whoName(i.value)}`, Number(t.budget) > 0 ? {type: 'budget', to: [i.value]} : null);
      });
      on(el, 'click', '[data-budget-ok]', (e, b) => { approveBudget(cur(), b.dataset.budgetOk === '1'); });

      /* приёмка результата */
      on(el, 'change', '#tmAppr', (e, i) => {
        const t = cur();
        const ap = t.approver || (t.createdBy && t.createdBy !== t.assignee ? t.createdBy : founderId());
        set(i.checked ? {approval: true, approver: ap && ap !== t.assignee ? ap : null} : {approval: false}, i.checked ? `Результат согласует: ${whoName(ap)}` : 'Результат — без согласования');
      });
      on(el, 'change', '#tmApprWho', (e, i) => set({approval: true, approver: i.value}, `Результат согласует: ${whoName(i.value)}`, cur().status === 'review' ? {type: 'review', to: [i.value]} : null));

      /* зависимости */
      on(el, 'change', '#tmDepAdd', (e, i) => {
        if (!i.value) return;
        const t = cur();
        set({blockedBy: [...new Set([...(t.blockedBy || []), i.value])]}, `Зависит от: «${(Tasks.get(i.value) || {}).title || ''}»`);
      });
      on(el, 'click', '[data-dep-rm]', (e, b) => { const t = cur(); set({blockedBy: (t.blockedBy || []).filter(x => x !== b.dataset.depRm)}, 'Зависимость снята'); });
      on(el, 'click', '[data-dep-open]', (e, b) => { close(); openTask(b.dataset.depOpen); });

      /* статус */
      on(el, 'click', '[data-st]', (e, b) => {
        const t = cur(), st = b.dataset.st;
        const out = $('#tmOutcome', el);
        if (out && out.value !== (t.outcome || '')) Store.patch('tasks', id, {outcome: out.value}, {mustExist: true});
        if (st === 'return-open') { $('#tmRetWrap', el).hidden = false; b.hidden = true; $('#tmRetText', el).focus(); return; }
        if (st === 'return') {
          const box = $('#tmRetText', el);
          if (!box.value.trim()) { box.focus(); box.classList.add('need'); box.placeholder = 'Без комментария вернуть нельзя: что доработать?'; return; }
          Tasks.giveBack(t, box.value);
          toast('Возвращено на доработку — исполнитель увидит комментарий');
          return;
        }
        if (st === 'accept') { Tasks.setStatus(t, 'done'); toast('Согласовано, задача закрыта'); return; }
        if (st === 'finish') { Tasks.apply(t, 'done'); return; }
        Tasks.apply(t, st);
      });
      on(el, 'change', '#tmOutcome', (e, i) => set({outcome: i.value}));

      if (isNew) {
        $('#tmCreate', el).onclick = () => {
          const title = $('#tmTitle', el).value.trim();
          if (!title) { $('#tmTitle', el).focus(); return; }
          const twin = Tasks.twin(title);
          const btn = $('#tmCreate', el);
          if (twin && !btn.dataset.force) { btn.dataset.force = '1'; btn.textContent = 'Всё равно создать'; $('#tmTwin', el).hidden = false; return; }
          const d = {...draft};
          ['#tmDesc', '#tmResult'].forEach((s2, i2) => { d[['desc', 'result'][i2]] = $(s2, el).value; });
          Tasks.create({...d, title, force: !!btn.dataset.force, assignee: $('#tmWho', el).value || null, due: $('#tmDue', el).value || null, month: $('#tmMonth', el).value || null,
            dir: $('#tmDir', el).value, priority: $('#tmPrio', el).value, goalId: $('#tmGoal', el).value || null, stratId: $('#tmStrat', el) ? $('#tmStrat', el).value || null : null,
            dueFixed: !!draft.dueFixed,
            createdBy: draft.createdBy || undefined});
          close();
          if (Date.now() - (Tasks._told || 0) > 800) toast('Задача создана');
        };
      } else {
        const cf = $('#tmCForm', el);
        cf.onsubmit = e => {
          e.preventDefault();
          const box = $('#tmComment', el);
          if (!box.value.trim()) return;
          Tasks.comment(cur(), box.value);
          box.value = '';
        };
        $('#tmComment', el).addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) cf.requestSubmit(); });
        const del = $('#tmDel', el);
        if (del) del.onclick = () => Tasks.remove(cur(), del).then(ok => { if (ok) close(); });
        /* Адам пишет черновик второму человеку в задаче — в панели справа */
        $('#tmAdam', el).onclick = () => { const t = cur(); close(); Adam.draftFor(t); };
      }

      /* перерисовка живых частей: не трогаем поле, в котором человек печатает,
         и ждём, пока отпустят кнопку мыши, — иначе нажатие «Отправить» сразу
         после ввода текста уходит в пустоту */
      let waiting = false;
      function paint() {
        if (App._pointer) {
          if (!waiting) { waiting = true; document.addEventListener('pointerup', () => { waiting = false; setTimeout(paint, 0); }, {once: true, capture: true}); }
          return;
        }
        const t = cur();
        if (!t) { close(); toast('Задачу удалили'); return; }
        const inside = box => box && box.contains(document.activeElement) && document.activeElement.matches('input:not([type=checkbox]), textarea');
        $('#tmTop', el).innerHTML = topHtml(t, isNew);
        const dbx = $('#tmDueBox', el); if (!inside(dbx)) dbx.innerHTML = dueBoxHtml(t, isNew);
        const dI = $('#tmDue', el); if (dI && document.activeElement !== dI) dI.value = t.due || '';
        const mI = $('#tmMonth', el); if (mI && document.activeElement !== mI) mI.value = t.month || '';
        const bb = $('#tmBudgetBox', el); if (!inside(bb)) bb.innerHTML = budgetHtml(t, can, isNew);
        const ab = $('#tmApprBox', el); if (!inside(ab)) ab.innerHTML = approvalHtml(t, can);
        if (!isNew) {
          const db = $('#tmDepsBox', el); if (!inside(db)) db.innerHTML = depsHtml(t, can);
          /* блок статуса пересобираем только при смене состояния; текст результата — на месте */
          const z = $('#tmZone', el), ret = lastReturn(t);
          const zk = [t.status, Tasks.approver(t), Tasks.canJudge(t), can, ret ? ret.at : 0, t.submittedAt || 0, t.acceptedBy || '', t.status === 'done' || t.status === 'review' ? t.outcome : ''].join('|');
          if (z.dataset.k !== zk && !inside(z)) { z.innerHTML = zoneHtml(t, can); z.dataset.k = zk; }
          else { const o = $('#tmOutcome', z); if (o && document.activeElement !== o && o.value !== (t.outcome || '')) o.value = t.outcome || ''; }
          paintThread($('#tmThread', el), t, document.activeElement && document.activeElement.id === 'tmComment');
          if (opts.focus === 'return' && t.status === 'review' && Tasks.canJudge(t)) {
            opts.focus = null;
            const b = $('[data-st="return-open"]', el); if (b) b.click();
          }
          const w = $('#tmWho', el); if (w && document.activeElement !== w) w.value = t.assignee || '';
        }
      }
      paint();
      if (!isNew) unsub = Store.subscribe(c => { if (c === 'tasks' || c === 'people') paint(); });
    },
    onClose() { if (unsub) unsub(); },
  });
}

function topHtml(t, isNew) {
  const code = DIR_CODE[t.dir];
  const blocked = !isNew && Tasks.blocked(t);
  const steps = Object.entries(STATUSES).map(([k, s]) => `<span class="st-step ${k === t.status ? 'on ' + s.tone : ''}">${s.name}</span>`).join('<i></i>');
  return `${code ? `<span class="kc-dir lg" style="--c:${DIRS[t.dir].color}">${code}</span>` : '<span class="kc-dir lg none">—</span>'}
    <span class="tm-dirn">${t.dir ? esc(dirName(t.dir)) : 'Без направления'}</span>
    ${blocked ? '<span class="pill bad">🔒 ждёт другую задачу</span>' : ''}
    ${escDots(t)}
    ${isNew ? '' : `<span class="tm-steps st-steps">${steps}</span>`}`;
}
function budgetHtml(t, can, isNew) {
  const st = Tasks.budgetState(t), amount = Number(t.budget) || 0;
  const force = !Auth.can('money.edit');
  const needs = !!t.budgetNeedsApproval || (force && amount > 0);
  const m = Tasks.budgetMonth(t), inPlan = CF_MONTHS.includes(m);
  const cat = t.id ? Tasks.budgetCat(t) : (t.budgetCat || DIR_CAT[t.dir] || 'other');
  const note = st === 'none' ? `Выберите сумму — ${needs ? 'после согласования она встанет' : 'она встанет'} разовым платежом в план платежей, в месяц задачи.`
    : st === 'pending' ? `Ждёт согласования: <b>${esc(whoName(Tasks.budgetApprover(t)))}</b>. В план платежей попадёт после согласования.`
    : st === 'rejected' ? 'Бюджет не согласован — поправьте сумму, и он снова уйдёт на согласование.'
    : `В плане платежей: разовый платёж <b>${rub(amount)}</b> за <b>${monthName(m, true).toLowerCase()}</b> — строка «Задача: ${esc(t.title)}». Правка суммы или срока обновит ту же строку, второй не появится.${inPlan ? '' : ' Месяц вне плана до Нового года — в Cash Flow не попадёт.'}`;
  const approvers = [...new Set([founderId(), ...people().filter(p => (Store.all('accounts').find(a => a.personId === p.id && ['owner', 'lead', 'finance'].includes(a.role)))).map(p => p.id)])].filter(Boolean);
  return `<p class="tm-box-l">Бюджет задачи</p>
    <div class="tm-bq">${BUDGET_QUICK.map(v => `<button type="button" class="tm-chip ${amount === v ? 'on' : ''}" data-bq="${v}" ${can ? '' : 'disabled'}>${v ? fmt(v / 1000) + ' тыс ₽' : '0'}</button>`).join('')}</div>
    <div class="tm-brow">
      <label class="tm-f"><span>Или своя сумма, ₽</span><input class="input num" id="tmBudget" inputmode="numeric" value="${amount ? fmt(amount) : ''}" placeholder="0" ${can ? '' : 'disabled'}></label>
      <label class="tm-f"><span>Статья расходов</span><select class="select" id="tmBudgetCat" ${can ? '' : 'disabled'}>${Object.entries(OUT_CATS).filter(([k]) => k !== 'payroll').map(([k, n]) => `<option value="${k}" ${k === cat ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    </div>
    <div class="tm-note">${note}</div>
    <div class="tm-appr-row">
      <label class="check"><input type="checkbox" id="tmBudgetAppr" ${needs ? 'checked' : ''} ${can ? '' : 'disabled'}> Требует согласования</label>
      ${needs ? `<select class="select sm" id="tmBudgetWho" ${can ? '' : 'disabled'}>${approvers.map(pid => `<option value="${pid}" ${pid === Tasks.budgetApprover(t) ? 'selected' : ''}>Кому: ${esc(whoName(pid))}</option>`).join('')}</select>` : ''}
      ${st === 'approved' ? `<span class="pill good">✓ согласовано${t.budgetApprovedBy ? ': ' + esc(whoFirst(t.budgetApprovedBy)) : ''}</span>` : st === 'pending' ? '<span class="pill warn">ждёт согласования</span>' : st === 'rejected' ? '<span class="pill bad">не согласовано</span>' : ''}
      ${!isNew && (st === 'pending' || st === 'rejected') && Tasks.canApproveBudget(t) ? `<button type="button" class="btn sm good" data-budget-ok="1">${icon('tick')}Согласовать бюджет</button>${st === 'pending' ? '<button type="button" class="btn sm ghost" data-budget-ok="0">Не согласовывать</button>' : ''}` : ''}
    </div>
    ${force && can ? '<p class="note">Бюджет, который ставит сотрудник, всегда идёт на согласование.</p>' : ''}`;
}
function approvalHtml(t, can) {
  const ap = Tasks.approver(t);
  const opts = people().filter(p => p.id !== t.assignee);
  return `<p class="tm-box-l">Приёмка результата</p>
    <div class="tm-appr-row">
      <label class="check"><input type="checkbox" id="tmAppr" ${ap ? 'checked' : ''} ${can ? '' : 'disabled'}> Результат согласовывает</label>
      ${ap || t.approval === true ? `<select class="select sm" id="tmApprWho" ${can ? '' : 'disabled'}>${opts.map(p => `<option value="${p.id}" ${p.id === ap ? 'selected' : ''}>${esc(personName(p))}</option>`).join('')}</select>` : ''}
    </div>
    <p class="note">${ap ? `Когда исполнитель нажмёт «Готово», задача уйдёт ${esc(whoName(ap))} на согласование — он согласует или вернёт с комментарием.` : 'Без галочки исполнитель закрывает задачу сам.'}</p>`;
}
function depsHtml(t, can) {
  const bl = Tasks.blockers(t), dep = Tasks.dependents(t);
  const exclude = new Set([t.id, ...(t.blockedBy || [])]);
  /* нельзя зависеть от задачи, которая сама ждёт эту — иначе круг */
  const walk = x => Tasks.dependents(x).forEach(d => { if (!exclude.has(d.id)) { exclude.add(d.id); walk(d); } });
  walk(t);
  const addable = Tasks.all().filter(x => !exclude.has(x.id) && x.status !== 'done').sort((a, b) => a.title.localeCompare(b.title, 'ru'));
  return `<p class="tm-box-l">Зависит от ${Tasks.blocked(t) ? '· <span class="bad">🔒 заблокирована</span>' : bl.length ? '· 🔓 можно делать' : ''}</p>
    ${bl.length ? bl.map(b => `<div class="tm-dep"><span class="pill ${STATUSES[b.status].tone}">${STATUSES[b.status].name}</span><button type="button" class="link-btn" data-dep-open="${b.id}">${esc(b.title)}</button>${can ? `<button type="button" class="icon-btn" data-dep-rm="${b.id}" title="Убрать зависимость">${icon('x')}</button>` : ''}</div>`).join('') : '<p class="note">Ни от чего не зависит.</p>'}
    ${can ? `<select class="select sm" id="tmDepAdd"><option value="">+ Добавить задачу, которую надо сделать раньше…</option>${addable.map(x => `<option value="${x.id}">${esc(x.title.slice(0, 90))}</option>`).join('')}</select>` : ''}
    ${dep.length ? `<p class="note">От этой задачи зависят: ${dep.map(d => `<button type="button" class="link-btn" data-dep-open="${d.id}">${esc(d.title.slice(0, 50))}</button>`).join(', ')} — когда она будет готова, их исполнители получат «можно начинать».</p>` : ''}`;
}
function zoneHtml(t, can) {
  const ap = Tasks.approver(t), judge = Tasks.canJudge(t);
  const out = t.outcome ? `<div class="tm-outcome"><span>Результат работы</span><p>${esc(t.outcome)}</p></div>` : '';
  if (t.status === 'todo' || t.status === 'doing') {
    const ret = lastReturn(t);
    const returned = ret && t.reworkCount && (!t.submittedAt || ret.at > t.submittedAt);
    return `${returned ? `<div class="tm-returned"><b>Возвращено на доработку</b> — ${esc(whoFirst(ret.by))}, ${timeAgo(ret.at)}:<p>${esc(ret.text)}</p></div>` : ''}
      <p class="tm-zone-note">${ap ? `Отвечает ${esc(t.assignee ? whoName(t.assignee) : 'исполнитель')}, результат принимает <b>${esc(whoName(ap))}</b>.` : 'Задачу закрывает сам исполнитель.'}</p>
      <label class="tm-f"><span>Результат работы — ссылка, документ, скрин или текст</span><textarea class="textarea" id="tmOutcome" rows="2" ${can ? '' : 'disabled'} placeholder="Вставьте ссылку или опишите, что сделано и что проверить">${esc(t.outcome || '')}</textarea></label>
      ${can ? `<div class="tm-zone-btns">${t.status === 'todo' ? '<button type="button" class="btn" data-st="doing">◐ В работу</button>' : ''}<button type="button" class="btn primary" data-st="finish">${ap && !judge ? (returned ? 'Отправить повторно на согласование →' : 'Отправить на согласование →') : '✓ Готово'}</button></div>` : ''}`;
  }
  if (t.status === 'review') {
    return `<p class="tm-zone-note gold">Согласовывает: <b>${esc(whoName(ap || founderId()))}</b>${t.submittedAt ? ` · сдано ${timeAgo(t.submittedAt)}` : ''}</p>
      ${out || '<p class="note">Результат работы не приложен.</p>'}
      ${judge ? `<div class="tm-zone-btns"><button type="button" class="btn good" data-st="accept">${icon('tick')}Согласовать</button><button type="button" class="btn" data-st="return-open">↩ Вернуть на доработку</button></div>
        <div id="tmRetWrap" class="tm-ret" hidden><textarea class="textarea" id="tmRetText" rows="2" placeholder="Что нужно доработать?"></textarea><button type="button" class="btn danger" data-st="return">Подтвердить возврат</button></div>`
      : can ? '<div class="tm-zone-btns"><button type="button" class="btn" data-st="doing">Забрать обратно в работу</button></div>' : ''}`;
  }
  return `<p class="tm-zone-note good">✓ ${t.acceptedBy ? `Согласовано: ${esc(whoFirst(t.acceptedBy))}` : 'Готово'}${t.doneAt ? ` · ${dayLong(isoOf(new Date(t.doneAt)))}` : ''}</p>
    ${out}
    ${can ? '<div class="tm-zone-btns"><button type="button" class="btn" data-st="doing">Вернуть в работу</button></div>' : ''}`;
}
function paintThread(box, t, keepScroll) {
  if (!box) return;
  const list = Object.entries(t.comments || {}).map(([cid, c]) => ({cid, ...c})).sort((a, b) => a.at - b.at);
  if (!list.length) { box.innerHTML = '<p class="note">Пока пусто. Вопросы и договорённости по задаче пишите здесь — их увидят исполнитель и постановщик.</p>'; return; }
  box.innerHTML = list.map(c => {
    const p = personById(c.by);
    if (c.kind === 'system') return `<div class="th-sys"><span>${esc(c.text)}</span><time>${timeAgo(c.at)}</time></div>`;
    return `<div class="th-msg ${c.kind === 'return' ? 'ret' : ''}">${avatar(p)}<div><div class="th-h"><b>${esc(p ? personName(p) : whoName(c.by))}</b><time>${timeAgo(c.at)}</time>${c.kind === 'return' ? '<span class="pill bad">вернул(а) на доработку</span>' : ''}</div><p></p></div></div>`;
  }).join('');
  /* текст комментариев — только через textContent */
  const msgs = list.filter(c => c.kind !== 'system');
  $$('.th-msg p', box).forEach((pEl, i) => { pEl.textContent = msgs[i].text; });
  if (!keepScroll) box.scrollTop = box.scrollHeight;
}

/* ── от кого → кому: на карточке видно, кто поставил задачу и кто её делает ── */
function flowHtml(t) {
  const p = personById(t.assignee), boss = personById(t.createdBy);
  if (!boss || t.createdBy === t.assignee) return `<span class="tc-av" title="${esc(p ? personName(p) + (boss ? ' — сам(а) себе' : '') : 'Не назначено')}">${avatar(p)}</span>`;
  return `<span class="tc-flow" title="Поставил(а): ${esc(personName(boss))} → делает: ${esc(p ? personName(p) : 'не назначено')}">${avatar(boss, 'xs')}<i>→</i>${avatar(p)}</span>`;
}
/* срок на карточке: нажать — поменять; «важный» срок помечен, запрос переноса виден */
function dueBtn(t, can) {
  const req = t.dueReq ? `<span class="t-dreq" title="Ждёт согласования: ${esc(whoName(Tasks.dueBoss(t)))}">→ ${t.dueReq.due ? dayShort(t.dueReq.due) : t.dueReq.month ? monthShort(t.dueReq.month) : 'без срока'}?</span>` : '';
  const fix = t.dueFixed ? '<span class="t-dfix" title="Срок важен: перенос — только по согласованию постановщика">важен</span>' : '';
  if (!can || t.status === 'done') return dueChip(t) + fix + req;
  return `<button type="button" class="due-btn" data-due-edit="${t.id}" title="Поменять срок">${dueChip(t)}</button>${fix}${req}`;
}
function dueHint(t) {
  const k = Tasks.meKey(), boss = Tasks.dueBoss(t);
  if (Auth.isOwner() || boss === k) return t.assignee && t.assignee !== k ? 'Вы постановщик: срок поменяется у всех, исполнитель получит уведомление.' : 'Срок поменяется сразу.';
  if (t.assignee === k) {
    if (t.dueFixed) return `Срок важен для постановщика: перенос уйдёт на согласование — ${whoName(boss)}.`;
    const m = t.due ? monthOf(t.due) : t.month;
    return m ? `В пределах ${MONTHS_GEN[monthIdx(m)]} — меняете сами, на другой месяц — по согласованию с постановщиком (${whoName(boss)}).` : 'Срок пока не задан — ставьте сами.';
  }
  return Tasks.manager() ? 'Срок поменяется сразу.' : `Перенос согласует постановщик — ${whoName(boss)}.`;
}
function duePop(anchor, t) {
  closePops();
  const pop = document.createElement('div');
  pop.className = 'pop due-pop';
  pop.innerHTML = `<p>Срок задачи</p><input class="input sm" type="date" value="${esc(t.due || '')}" min="2026-01-01" max="2028-12-31">
    <small class="note">${esc(dueHint(t))}</small>
    <div class="row"><button class="btn sm primary" data-ok>Сохранить</button>${t.due ? '<button class="btn sm ghost" data-clear>Снять дату</button>' : ''}<button class="btn sm ghost" data-no>Отмена</button></div>`;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let top = r.bottom + 6, left = clamp(r.left, 8, window.innerWidth - w - 8);
  if (top + h > window.innerHeight - 8) top = r.top - h - 6;
  pop.style.top = (top + window.scrollY) + 'px';
  pop.style.left = (left + window.scrollX) + 'px';
  const inp = $('input', pop);
  const done = () => { pop.remove(); document.removeEventListener('mousedown', outside, true); };
  const outside = e => { if (!pop.contains(e.target)) done(); };
  pop._done = done;
  setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
  $('[data-ok]', pop).onclick = () => { const v = inp.value || null; done(); if (v !== (t.due || null)) Tasks.changeDue(t, v, v ? undefined : t.month); };
  const cl = $('[data-clear]', pop); if (cl) cl.onclick = () => { done(); Tasks.changeDue(t, null, t.month); };
  $('[data-no]', pop).onclick = done;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-ok]', pop).click(); if (e.key === 'Escape') done(); });
  setTimeout(() => { inp.focus(); try { if (inp.showPicker) inp.showPicker(); } catch (e) { /* выбор даты откроется по нажатию */ } }, 30);
}
/* блок срока в окне задачи: «срок важен» и запрос переноса */
function dueBoxHtml(t, isNew) {
  const k = Tasks.meKey(), boss = isNew ? k : Tasks.dueBoss(t);
  const canFix = isNew || Auth.isOwner() || boss === k;
  const showFix = isNew ? (t.assignee && t.assignee !== k) : (t.assignee && t.assignee !== boss);
  const r = !isNew && t.dueReq;
  return `${showFix || t.dueFixed ? `<label class="check tm-fix"><input type="checkbox" id="tmDueFixed" ${t.dueFixed ? 'checked' : ''} ${canFix ? '' : 'disabled'}> Срок важен <small class="note">— исполнитель переносит срок только с вашего согласования; без галочки — сам в пределах месяца</small></label>` : ''}
    ${!isNew && t.assignee ? `<p class="note tm-due-hint">${esc(dueHint(t))}</p>` : ''}
    ${r ? `<div class="tm-dreq"><span>${icon('clock')}<b>${esc(whoFirst(r.by))}</b> просит перенести срок на <b>${esc(Tasks.dueLabel(r.due, r.month))}</b>${t.due || t.month ? ` (сейчас — ${esc(Tasks.dueLabel(t.due, t.month))})` : ''}</span>
      ${Tasks.canResolveDue(t) && r.by !== k ? `<span class="row"><button type="button" class="btn sm good" data-due-ok="1">${icon('tick')}Согласовать</button><button type="button" class="btn sm ghost" data-due-ok="0">Оставить прежний</button></span>` : '<em class="note">ждём ответа постановщика</em>'}</div>` : ''}`;
}

/* ── строка быстрого добавления прямо над доской ── */
function quickBarHtml(person) {
  if (!Auth.can('tasks.edit')) return '';
  const who = person || Auth.personId() || '';

    <label class="tq-f"><span>Кому</span><select class="select sm" id="tqWho">${[['', 'Не назначено'], ...people().map(p => [p.id, personName(p) + (p.id === Auth.personId() ? ' (я)' : '')])].map(([v, n]) => `<option value="${v}" ${v === who ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
    <label class="tq-f"><span>Срок</span><input class="input sm" type="date" id="tqDue"></label>

    <button class="btn primary sm" type="submit">Добавить</button>
    <button class="btn ghost sm" type="button" data-tq-more>Подробнее…</button>
    <div class="kb-twin tq-twin" id="tqTwin" hidden></div>
  </form>`;
}
function wireQuickBar(root) {
  const form = $('#tQuick', root);
  if (!form) return;
  const title = $('#tqTitle', form), twin = $('#tqTwin', form);
  let force = false;
  $('#tqWho', form).onchange = e => { $('#tqFixWrap', form).hidden = !e.target.value || e.target.value === Auth.personId(); };
  title.addEventListener('input', () => { force = false; twin.hidden = true; });
  const make = () => {
    const t = title.value.trim();
    if (!t) { title.focus(); return null; }
    const tw = Tasks.twin(t);
    if (tw && !force) {
      force = true;
      twin.innerHTML = `Такая задача уже есть: «${esc(tw.title.slice(0, 60))}» — ${esc(tw.assignee ? personName(personById(tw.assignee)) : 'без исполнителя')}. Нажмите «Добавить» ещё раз, если нужна вторая.`;
      twin.hidden = false;
      return null;
    }
    const due = $('#tqDue', form).value || null, who = $('#tqWho', form).value || null;
    const id = Tasks.create({title: t, force, assignee: who, due, dueFixed: !!(who && who !== Auth.personId() && $('#tqFix', form).checked)});
    force = false;
    return id;
  };
  form.onsubmit = e => {
    e.preventDefault();
    const id = make();
    if (!id) return;
    if (Date.now() - (Tasks._told || 0) > 800) toast('Задача добавлена');
    App.render({focus: 'tqTitle'});
  };
  on(form, 'click', '[data-tq-more]', () => {
    openTask(null, {defaults: {title: title.value.trim(), assignee: $('#tqWho', form).value || null, due: $('#tqDue', form).value || '', month: $('#tqDue', form).value ? monthOf($('#tqDue', form).value) : monthOf(today()), dueFixed: $('#tqFix', form).checked}});
  });
}

/* ── 40-money.js ── */
/* Финансы: вкладки «Обзор», «Операции» (быстрая запись и журнал), «План и

const monthStatus = m => (m < monthOf(today()) ? 'fact' : m === monthOf(today()) ? 'now' : 'plan');

      plan: () => `<section class="section"><div class="section-head"><h2>Финплан: платежи по месяцам</h2><span class="hint-inline">${edit ? 'Регулярные и разовые платежи. «Оплатить», когда деньги ушли, — операция попадёт в журнал и в план-факт.' : 'Что и когда платим до конца года.'}</span>
            ${edit ? `<button class="btn sm" data-plan-add>${icon('plus')}Платёж</button>` : ''}</div>${planTable()}</section>
        <section class="section"><div class="section-head"><h2>План-факт по месяцам</h2><span class="hint-inline">Крупно — факт, мелко — план. Будущие месяцы — только план. Сценарий продаж «${SCENARIOS[sc].name}».</span></div>${pnlTable(pnl(sc))}</section>
        ${Auth.can('cf.view') ? cashFlowHtml(sc) : ''}

      ${helpBox('money', `<b>Как устроены финансы.</b> Всё, что пришло и ушло, лежит в <b>журнале операций</b> — из него считаются баланс, план-факт и прогноз. Записывать вручную нужно только обычные расходы и приходы (строка в «Операциях»). Остальное попадает в журнал само, когда вы нажимаете: «Оплатить» в финплане, «Выплатить» рефералу, автору или продавцу, «Оплачен» у заказа, «Возвращено» у запроса на возврат, «Внести приход» у курсов. Выручка подписок считается из «Цифр дня» в «Отчётах»; в «Подписках» её можно разделить на месячные и годовые. Сбои оплат и возвраты — карточки со сроком, статусом, ответственным и готовым сообщением клиенту.`)}
      <div class="tabs fin-tabs" role="tablist">${tabs.map(([k, n]) => `<button type="button" role="tab" data-ftab="${k}" class="${k === tab ? 'on' : ''}">${n}${badge[k] ? ` <span class="n fin-n">${badge[k]}</span>` : ''}</button>`).join('')}</div>

function wireQuickEntry(root) {
  const form = $('#qeForm', root);

/* ── P&L ── */
function pnlTable(rows) {
  const cell = (r, f, p) => {
    const st = monthStatus(r.m);
    if (st === 'plan') return `<td class="r pl-cell future"><b>${p ? rubK(p) : '—'}</b><small>план</small></td>`;
    return `<td class="r pl-cell"><b>${f ? rubK(f) : '—'}</b>${p ? `<small>план ${rubK(p)}</small>` : ''}</td>`;
  };
  const total = (get) => sum(rows, r => get(r));
  const line = (name, getF, getP, cls = '') => `<tr class="${cls}"><td>${name}</td>${rows.map(r => cell(r, getF(r), getP(r))).join('')}
    <td class="r pl-cell tot"><b>${rubK(total(r => (monthStatus(r.m) === 'plan' ? getP(r) : getF(r))))}</b><small>план ${rubK(total(getP))}</small></td></tr>`;
  const outCats = Object.keys(OUT_CATS).filter(c => rows.some(r => (r.fact.out[c] || 0) || (r.plan.out[c] || 0)));
  const profitCell = r => {
    const st = monthStatus(r.m), v = st === 'plan' ? r.plan.profit : r.fact.profit;
    return `<td class="r pl-cell ${st === 'plan' ? 'future' : ''}"><b class="${v < 0 ? 'bad' : 'good'}">${signed(v)}</b>${st !== 'plan' ? `<small>план ${signed(r.plan.profit)}</small>` : '<small>план</small>'}</td>`;
  };
  const profitTot = total(r => (monthStatus(r.m) === 'plan' ? r.plan.profit : r.fact.profit));
  return `<div class="table-wrap"><table class="t pnl grid-lines">
    <thead><tr><th>Статья</th>${rows.map(r => `<th class="r">${monthName(r.m)} <span class="th-tag">${STATUS_TAG[monthStatus(r.m)]}</span></th>`).join('')}<th class="r">До конца года</th></tr></thead>
    <tbody>
      <tr class="group in"><td colspan="${rows.length + 2}">Доходы</td></tr>
      ${line('Подписки <span class="note">из отчётов о продажах</span>', r => r.fact.subs, r => r.plan.subs, 'in')}
      ${line('Прочие приходы', r => r.fact.other, r => r.plan.other, 'in')}
      ${line('Итого доходы', r => r.fact.income, r => r.plan.income, 'sub in')}
      <tr class="group out"><td colspan="${rows.length + 2}">Расходы</td></tr>
      ${outCats.map(c => line(OUT_CATS[c], r => r.fact.out[c] || 0, r => r.plan.out[c] || 0, 'out')).join('') || `<tr><td colspan="${rows.length + 2}" class="note">Расходов пока нет</td></tr>`}
      ${line('Итого расходы', r => r.fact.outTotal, r => r.plan.outTotal, 'sub out')}
      <tr class="total"><td>Прибыль</td>${rows.map(profitCell).join('')}<td class="r pl-cell tot"><b class="${profitTot < 0 ? 'bad' : 'good'}">${signed(profitTot)}</b></td></tr>
      <tr class="fin"><td>Вложения <span class="note">вне P&amp;L</span></td>${rows.map(r => `<td class="r pl-cell"><b>${r.fact.invest ? rubK(r.fact.invest) : '—'}</b></td>`).join('')}<td class="r pl-cell tot"><b>${rubK(total(r => r.fact.invest))}</b></td></tr>
    </tbody></table></div>
    <p class="note">План расходов = план платежей ниже + от выручки по плану: реферальные ${pct(settings().referral)} первых оплат, эквайринг ${pct(settings().acquiring, 1)}, налог ${pct(settings().taxRate)}.</p>`;
}

/* ── план платежей ── */
function planTable() {
  const items = Money.planItems();
  const months = CF_MONTHS;
  const edit = Auth.can('money.edit');
  const seePay = Auth.can('payroll.view');
  if (!items.length) return `<div class="empty"><b>План платежей пуст</b>${edit ? 'Добавьте зарплаты, штаб, сервисы и разовые платежи кнопкой «Платёж».' : ''}</div>`;
  const cell = (it, m) => {
    const a = Money.planAmount(it, m);
    if (!a) return '<td class="r plan-c empty-c"></td>';
    const paid = Money.paid(it, m);
    const canPay = edit && (it.group !== 'payroll' || seePay);
    if (paid) return `<td class="r plan-c paid"><button class="pay-btn paid" ${canPay ? `data-unpay="${it.id}:${m}"` : 'disabled'} title="Оплачено ${dayLong(paid.date)}${canPay ? ' — нажмите, чтобы отменить' : ''}"><span>${rub(a)}</span>${icon('tick')}</button></td>`;
    return `<td class="r plan-c"><div class="pc-amt">${rub(a)}</div>${canPay ? `<button class="pay-btn" data-pay="${it.id}:${m}">Оплатить</button>` : `<span class="note">${m < monthOf(today()) ? 'не оплачено' : ''}</span>`}</td>`;
  };
  const groupRows = Object.entries(PLAN_GROUPS).map(([g, gname]) => {
    const list = items.filter(it => it.group === g);
    if (!list.length) return '';
    const gTot = m => sum(list, it => Money.planAmount(it, m));
    const head = `<tr class="group"><td>${gname}</td>${months.map(m => `<td class="r">${gTot(m) ? rubK(gTot(m)) : ''}</td>`).join('')}<td class="r">${rubK(sum(months, gTot))}</td></tr>`;
    if (g === 'payroll' && !seePay) {
      return head + `<tr><td><span class="soft">${list.length} ${plural(list.length, 'человек', 'человека', 'человек')} в команде</span><div class="note">суммы по людям видит основатель</div></td>${months.map(m => `<td class="r plan-c">${gTot(m) ? rub(gTot(m)) : ''}</td>`).join('')}<td class="r"><b>${rub(sum(months, gTot))}</b></td></tr>`;
    }
    return head + list.map(it => {
      const p = personById(it.personId);
      const off = p && (p.status === 'inactive' || p.archived);
      return `<tr class="${off ? 'dim' : ''}"><td><button class="plan-name" ${edit && (g !== 'payroll' || seePay) ? `data-plan-edit="${it.id}"` : 'disabled'}>${esc(it.title)}</button>${off ? ' <span class="pill warn">не активирован — не считаем</span>' : ''}
        <div class="note">${g === 'payroll' ? `${p ? esc(personName(p)) + ' · ' : ''}${rub(it.amount)}${it.insurance !== false ? ' + взносы ' + pct(settings().insurance, 1) : ''}` : `${catName('out', it.cat)} · ${rub(it.amount)}${g === 'regular' ? ' в месяц' : ''}`}</div></td>
        ${months.map(m => cell(it, m)).join('')}<td class="r"><b>${rub(sum(months, m => Money.planAmount(it, m)))}</b></td></tr>`;
    }).join('');
  }).join('');
  const tot = m => sum(items, it => Money.planAmount(it, m));
  const paidTot = m => sum(items, it => (Money.paid(it, m) ? Money.planAmount(it, m) : 0));
  return `<div class="table-wrap"><table class="t plan grid-lines">
    <thead><tr><th>Платёж</th>${months.map(m => `<th class="r">${monthName(m)}</th>`).join('')}<th class="r">Всего</th></tr></thead>
    <tbody>${groupRows}
      <tr class="total"><td>Итого по плану</td>${months.map(m => `<td class="r">${rub(tot(m))}</td>`).join('')}<td class="r">${rub(sum(months, tot))}</td></tr>
      <tr class="sub"><td>Оплачено</td>${months.map(m => `<td class="r good">${paidTot(m) ? rub(paidTot(m)) : '—'}</td>`).join('')}<td class="r good">${rub(sum(months, paidTot))}</td></tr>
      <tr class="sub"><td>Осталось оплатить</td>${months.map(m => `<td class="r">${tot(m) - paidTot(m) ? rub(tot(m) - paidTot(m)) : '—'}</td>`).join('')}<td class="r">${rub(sum(months, m => tot(m) - paidTot(m)))}</td></tr>
    </tbody></table></div>`;
}
function wirePlan(root) {
  on(root, 'click', '[data-pay]', async (e, el) => {
    const [id, m] = el.dataset.pay.split(':');

    const a = Money.planAmount(it, m);
    if (!(await confirmPop(el, {text: `Отметить оплаченным: ${it.title}, ${monthName(m).toLowerCase()} — ${rub(a)}?`, yes: 'Да, оплачено'}))) return;
    const cur = monthOf(today());
    const date = m === cur ? today() : m < cur ? monthEnd(m) : today();
    Store.add('ledger', {kind: 'out', amount: a, cat: it.group === 'payroll' ? 'payroll' : (it.cat || 'other'), date, note: it.title,
      planId: it.id, planMonth: m, by: Tasks.meKey(), at: Date.now()});

/* Финансы — модель. Подписки по месяцам, выплаты (рефералам, авторам курсов,
   продавцам маркетплейса), курсы, заказы и товары, сбои оплат и возвраты.
   Правило одно: деньги, которые на самом деле пришли или ушли, всегда лежат

   Операция помнит, откуда она: payoutId (выплата), orderId (заказ),
   refundId (возврат), courseMonth (выручка курсов за месяц). */

/* месяцы учёта: с начала Cash Flow по текущий */
function finMonths() {
  const cur = monthOf(today()), first = CF_MONTHS[0];
  return monthRange(first, cur < first ? first : cur);
}

/* ── подписки по месяцам: внесённое человеком поверх того, что видно из «Цифр дня» ── */
const Subs = {
  rec(m) { return Store.get('subs', m) || {}; },
  rows() {
    const s = settings(), out = [], cur = monthOf(today());
    let prev = null;
    finMonths().forEach(m => {
      const r = this.rec(m), f = Sales.month(m), ref = Fin.refundsIn(m, 'sub');
      const num = (k, def) => (isSet(r[k]) ? Number(r[k]) || 0 : def);
      const now = m === cur;
      const startM = num('startM', prev ? prev.endM : 0), startY = num('startY', prev ? prev.endY : 0);
      const newY = num('newY', 0);
      const newM = num('newM', Math.max(0, f.pays - newY));
      const renewed = num('renewed', f.renewals);
      /* продлеваются все месячные, кто был на начало; в идущем месяце срок
         подошёл ещё не у всех — ждём пропорционально прошедшим дням */
      const share = now ? Math.min(1, Number(today().slice(8)) / daysInMonth(m)) : 1;
      const due = Math.round(startM * share);
      const churn = num('churn', Math.max(0, due - renewed));
      const refunds = num('refunds', ref.n);
      const refundSum = num('refundSum', ref.sum);
      const endM = Math.max(0, startM + newM - churn - refunds);
      const endY = Math.max(0, startY + newY);
      const pays = newM + newY + renewed;
      const row = {m, now, r, startM, startY, newM, newY, renewed, due, churn, refunds, refundSum, endM, endY, total: endM + endY, pays,
        renewRate: due ? Math.min(1, renewed / due) : null, churnRate: due ? churn / due : null, refundRate: pays ? refunds / pays : null,
        revenue: f.revenue, check: pays ? f.revenue / pays : null, mrr: endM * s.price + endY * priceYear() / 12,
        auto: {newM: !isSet(r.newM), renewed: !isSet(r.renewed), churn: !isSet(r.churn), refunds: !isSet(r.refunds), refundSum: !isSet(r.refundSum), startM: !isSet(r.startM), startY: !isSet(r.startY)}};
      out.push(row);
      prev = row;
    });
    return out;
  },
  now() { const rows = this.rows(); return rows[rows.length - 1]; },
  /* процент продлений — по последнему месяцу, где было кому продлевать */
  rate() {
    const rows = this.rows().filter(r => r.due > 0);
    const full = rows.filter(r => !r.now);
    const r = full[full.length - 1] || rows[rows.length - 1];
    return r ? {renew: r.renewRate, churn: r.churnRate, refund: r.refundRate, m: r.m} : null;
  },
};

/* ── общее по финансам ── */
const Fin = {
  byDate: list => list.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || (b.at || 0) - (a.at || 0)),
  refunds() { return this.byDate(Store.all('refunds')); },
  refundOpen: r => REFUND_OPEN.includes(r.status || 'new'),
  refundLate(r) { return this.refundOpen(r) && !!r.deadline && r.deadline < today(); },
  refundsIn(m, product) {
    const list = Store.all('refunds').filter(r => r.status === 'refunded' && monthOf(r.refundedAt || r.date || '') === m && (!product || (r.product || 'sub') === product));
    return {n: list.length, sum: sum(list, r => r.amount)};
  },
  failed() { return this.byDate(Store.all('failed')); },
  failOpen: f => FAIL_OPEN.includes(f.status || 'new'),
  failDue(f) { return this.failOpen(f) && ((f.status || 'new') === 'new' || !f.next || f.next <= today()); },
  orders() { return Store.all('orders').sort((a, b) => (Number(b.no) || 0) - (Number(a.no) || 0)); },
  orderTotal: o => sum(o.items || [], it => (Number(it.qty) || 0) * (Number(it.price) || 0)) + (Number(o.shipCost) || 0),
  toShip: o => o.pay === 'paid' && ['new', 'packing'].includes(o.delivery || 'new'),
  products() { return Store.all('products').filter(p => p.title).sort((a, b) => String(a.title).localeCompare(String(b.title), 'ru')); },
  courses() { return Store.all('courses').filter(c => c.title).sort((a, b) => (a.at || 0) - (b.at || 0)); },
  courseSale(c, m) {
    const x = (c.sales || {})[m] || {};
    const n = Number(x.n) || 0;
    const revenue = isSet(x.revenue) ? Number(x.revenue) || 0 : n * (Number(c.price) || 0);
    return {n, revenue, author: Math.round(revenue * (Number(c.authorPct) || 0) / 100), own: isSet(x.revenue)};
  },
  courseLedger: m => Store.all('ledger').find(e => e.courseMonth === m) || null,
  authorId: (cid, m) => `author_${cid}_${m}`,
  sellerId: (name, m) => `seller_s${hashStr(normTitle(name)).toString(36)}_${m}`,

  /* начисления к выплате: рефералам — записями, авторам и продавцам — из продаж;
     текущий месяц ещё «начисляется», к выплате — закрытые месяцы */
  accruals() {
    const cur = monthOf(today()), out = [];
    Store.all('payouts').filter(p => p.kind === 'ref' && p.to).forEach(p => out.push({kind: 'ref', id: p.id, to: p.to, contact: p.contact || '', month: p.month, amount: Number(p.amount) || 0,
      base: Number(p.base) || 0, n: Number(p.n) || 0, pct: Number(p.pct) || 0, note: p.note || '', paid: p.status === 'paid', paidAt: p.paidAt || '', doc: p, closed: true}));
    this.courses().forEach(c => finMonths().forEach(m => {
      const s = this.courseSale(c, m);
      if (!s.author) return;
      const id = this.authorId(c.id, m), p = Store.get('payouts', id);
      out.push({kind: 'author', id, to: c.author || 'Автор курса', contact: c.authorContact || '', course: c, month: m, amount: s.author, n: s.n, revenue: s.revenue,
        paid: !!(p && p.status === 'paid'), paidAt: (p && p.paidAt) || '', doc: p, closed: m < cur});
    }));
    finMonths().forEach(m => Market.split(m).sellers.forEach(x => {
      if (!x.payout) return;
      const id = this.sellerId(x.seller, m), p = Store.get('payouts', id);
      out.push({kind: 'seller', id, to: x.seller, month: m, amount: Math.round(x.payout), revenue: x.turnover, fee: x.fee, paid: !!(p && p.status === 'paid'), paidAt: (p && p.paidAt) || '', doc: p, closed: m < cur});
    }));
    return out.sort((a, b) => (a.paid - b.paid) || String(b.month).localeCompare(String(a.month)));
  },
  payoutsDue() {
    const list = this.accruals().filter(x => !x.paid && x.closed);
    const by = k => sum(list.filter(x => x.kind === k), x => x.amount);
    return {list, ref: by('ref'), author: by('author'), seller: by('seller'), total: sum(list, x => x.amount)};
  },
  /* выплатить: расход в журнал + отметка «выплачено» */
  pay(acc) {
    const date = today();
    const lid = Store.add('ledger', {kind: 'out', amount: acc.amount, cat: PAYOUT_KINDS[acc.kind].cat, date,
      note: `${PAYOUT_KINDS[acc.kind].name}: ${acc.to}${acc.course ? ' · ' + acc.course.title : ''} · ${monthName(acc.month).toLowerCase()}`, payoutId: acc.id, by: Tasks.meKey(), at: Date.now()});
    const {id: _drop, ...base} = acc.doc || {kind: acc.kind, to: acc.to, month: acc.month, ...(acc.course ? {courseId: acc.course.id} : {}), at: Date.now()};
    Store.put('payouts', acc.id, {...base, amount: acc.amount, status: 'paid', paidAt: date, ledgerId: lid, paidBy: Tasks.meKey()});
  },
  unpay(acc) {
    Store.all('ledger').filter(e => e.payoutId === acc.id).forEach(e => Store.remove('ledger', e.id));
    if (acc.kind === 'ref') Store.patch('payouts', acc.id, {status: 'accrued', paidAt: null, ledgerId: null});
    else Store.remove('payouts', acc.id);
  },

  /* что требует действий финансов */
  attention() {
    const refunds = Store.all('refunds').filter(r => this.refundOpen(r));
    const failed = Store.all('failed').filter(f => this.failOpen(f));
    return {
      refunds, late: refunds.filter(r => this.refundLate(r)),
      failed, failedDue: failed.filter(f => this.failDue(f)), failedSum: sum(failed, f => f.amount),
      ship: Store.all('orders').filter(o => this.toShip(o)),
      low: this.products().filter(p => !p.seller && isSet(p.stock) && Number(p.stock) <= 3),
      payouts: this.payoutsDue(),
    };
  },
  badge() {
    if (!Auth.can('fin.ops')) return 0;
    const a = this.attention();
    return a.refunds.length + a.failedDue.length + a.ship.length;
  },
};

/* ── маркетплейс: оплата заказа ↔ журнал и склад ── */
const Market = {
  nextNo() { return 1 + Math.max(0, ...Store.all('orders').map(o => Number(o.no) || 0)); },
  /* привести журнал и склад к статусу заказа: оплачен — приход; возврат —
     ещё и расход «Возвраты клиентам»; свой товар списан со склада, пока заказ
     оплачен и не отменён */
  sync(id) {
    const o = Store.get('orders', id);
    if (!o) return;
    const led = Store.all('ledger').filter(e => e.orderId === id);
    const inE = led.find(e => e.kind === 'in'), outE = led.find(e => e.kind === 'out');
    const total = Fin.orderTotal(o), by = Tasks.meKey(), at = Date.now();
    const wantIn = o.pay === 'paid' || o.pay === 'refund', wantOut = o.pay === 'refund';
    if (wantIn && !inE) Store.add('ledger', {kind: 'in', amount: total, cat: 'market', date: o.paidAt || today(), note: `Заказ №${o.no}${o.customer ? ' · ' + o.customer : ''}`, orderId: id, by, at});
    else if (wantIn && inE && Number(inE.amount) !== total) Store.patch('ledger', inE.id, {amount: total});
    else if (!wantIn && inE) Store.remove('ledger', inE.id);
    if (wantOut && !outE) Store.add('ledger', {kind: 'out', amount: total, cat: 'refunds', date: today(), note: `Возврат по заказу №${o.no}`, orderId: id, by, at});
    else if (!wantOut && outE) Store.remove('ledger', outE.id);
    const need = {};
    if (o.pay === 'paid' && o.delivery !== 'cancelled') (o.items || []).forEach(it => {
      const p = it.productId ? Store.get('products', it.productId) : null;
      if (p && !p.seller) need[p.id] = (need[p.id] || 0) + (Number(it.qty) || 0);
    });
    const have = o.stockOut || {};
    let moved = false;
    new Set([...Object.keys(need), ...Object.keys(have)]).forEach(pid => {
      const delta = (need[pid] || 0) - (Number(have[pid]) || 0);
      const p = Store.get('products', pid);
      if (delta && p && isSet(p.stock)) { Store.patch('products', pid, {stock: (Number(p.stock) || 0) - delta}); moved = true; }
    });
    if (moved || JSON.stringify(need) !== JSON.stringify(have)) Store.put('orders', id, {...Store.get('orders', id), stockOut: need});
  },
  setPay(id, pay) {
    const o = Store.get('orders', id);
    if (!o || o.pay === pay) return;
    Store.patch('orders', id, {pay, ...(pay === 'paid' && !o.paidAt ? {paidAt: today()} : {}), ...(pay === 'wait' ? {paidAt: null} : {})});
    this.sync(id);
  },
  setDelivery(id, delivery) {
    const o = Store.get('orders', id);
    if (!o || o.delivery === delivery) return;
    Store.patch('orders', id, {delivery, ...(delivery === 'shipped' && !o.shippedAt ? {shippedAt: today()} : {})});
    this.sync(id);
  },
  /* распределение выручки месяца: свои товары — маржа клуба; товары продавцов —
     комиссия клуба и выплата продавцу */
  split(m) {
    const orders = Store.all('orders').filter(o => o.pay === 'paid' && o.delivery !== 'cancelled' && monthOf(o.paidAt || o.date || '') === m);
    const own = {rev: 0, cost: 0}, sellers = {};
    let revenue = 0, shipping = 0;
    orders.forEach(o => {
      shipping += Number(o.shipCost) || 0;
      (o.items || []).forEach(it => {
        const amount = (Number(it.qty) || 0) * (Number(it.price) || 0);
        revenue += amount;
        if (it.seller) {
          const x = sellers[it.seller] = sellers[it.seller] || {seller: it.seller, turnover: 0, fee: 0, payout: 0, orders: 0};
          const fee = amount * (Number(it.fee) || 0) / 100;
          x.turnover += amount; x.fee += fee; x.payout += amount - fee; x.orders++;
        } else {
          own.rev += amount;
          own.cost += (Number(it.qty) || 0) * (Number(it.cost) || 0);
        }
      });
    });
    const list = Object.values(sellers);
    return {orders, revenue: revenue + shipping, goods: revenue, shipping, own, sellers: list,
      club: own.rev - own.cost + sum(list, x => x.fee) + shipping, toSellers: sum(list, x => x.payout)};
  },
};

/* ── чек и юнит-экономика за период ── */
function unitEcon(from, to) {
  const s = settings(), f = Sales.range(from, to);
  const pays = f.pays + f.renewals;
  const check = pays ? f.revenue / pays : s.price;
  let spend = 0;
  Store.all('ledger').forEach(e => { if (e.kind === 'out' && e.date >= from && e.date <= to && ['marketing', 'referral'].includes(e.cat)) spend += Number(e.amount) || 0; });
  const cac = f.pays ? spend / f.pays : null;
  const varShare = (Number(s.acquiring) || 0) + (Number(s.taxRate) || 0);
  const margin = check * (1 - varShare);
  const rate = Subs.rate();
  const renew = rate && rate.renew !== null ? rate.renew : s.retention;
  const churn = Math.max(0.02, 1 - renew);
  const life = Math.min(36, 1 / churn);
  const ltv = margin * life;
  return {from, to, f, pays, check, spend, cac, varShare, margin, renew, renewPlan: !(rate && rate.renew !== null), churn, life, ltv,
    ltvCac: cac ? ltv / cac : null, payback: cac && margin ? cac / margin : null};
}

/* ── обзор ── */
function finOverviewHtml(sc) {

  const sub = Subs.now(), rate = Subs.rate();
  const tiles = [
    finTile('Баланс на сегодня', rubK(cash), `старт ${rubK(s.cashStart)} на ${dayLong(s.cashDate)} + операции и выручка`, 'cash-card'),
    finTile(`Итог ${MONTHS_GEN[monthIdx(m)]}`, `<span class="${net < 0 ? 'bad' : 'good'}">${signed(net)}</span>`, `приход ${rubK(income)} · расход ${rubK(led.out)}`),

    finTile('Платных подписчиков', fmt(sub.total), `месячных ${fmt(sub.endM)} · годовых ${fmt(sub.endY)}`),
    finTile('MRR', rubK(sub.mrr), `месячная выручка подписок: ${rub(s.price)} и ${rub(priceYear())}/12`),
    finTile('Продления', pctOr(rate && rate.renew), rate ? `${monthName(rate.m).toLowerCase()} · отток ${pctOr(rate.churn)}` : 'появятся после первого месяца'),
    finTile('Возвраты', pctOr(rate && rate.refund, 1), `от оплат · за ${monthName(m).toLowerCase()} ${fmt(sub.refunds)} на ${rubK(sub.refundSum)}`),
    finTile('Средний чек', sub.check ? rub(Math.round(sub.check)) : '—', `${fmt(sub.pays)} ${plural(sub.pays, 'оплата', 'оплаты', 'оплат')} подписки за ${monthName(m).toLowerCase()}`),
  ];
  /* приход и расход месяца: одна шкала на обе стороны */

  const outs = Object.entries(led.cats.out).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).map(([c, v]) => [OUT_CATS[c] || c, v]);
  const outTop = outs.length > 6 ? [...outs.slice(0, 5), ['Остальное', sum(outs.slice(5), x => x[1])]] : outs;
  const max = Math.max(1, ...ins.map(x => x[1]), ...outTop.map(x => x[1]));
  const bar = (tone) => ([name, v]) => `<div class="fin-bar" title="${esc(name)}: ${rub(v)}"><span class="fb-l">${esc(name)}</span><span class="fb-t"><i class="${tone}" style="width:${Math.max(1.5, v / max * 100).toFixed(1)}%"></i></span><b>${rubK(v)}</b></div>`;
  const flow = `<div class="card fin-flow"><div class="card-head"><h2>Приход и расход — ${monthName(m).toLowerCase()}</h2><button class="link-btn" data-fin-go="ops">Журнал</button></div>
    <div class="fb-group"><span class="label">Приход <b class="good">+${rub(income)}</b></span>${ins.length ? ins.map(bar('in')).join('') : '<p class="note">Прихода пока нет</p>'}</div>
    <div class="fb-group"><span class="label">Расход <b class="bad">${led.out ? '−' : ''}${rub(led.out)}</b></span>${outTop.length ? outTop.map(bar('out')).join('') : '<p class="note">Расходов пока нет</p>'}</div></div>`;
  /* что требует действий */
  let att = '';
  if (finOps()) {
    const a = Fin.attention();
    const planUnpaid = Money.planItems().filter(it => Money.planAmount(it, m) && !Money.paid(it, m));
    const rows = [
      a.refunds.length ? ['refunds', 'bad', `Запросы на возврат: ${a.refunds.length}`, a.late.length ? `<b class="bad">${a.late.length} ${plural(a.late.length, 'просрочен', 'просрочено', 'просрочено')}</b> · ответить за ${REFUND_DAYS} дней` : `ответить за ${REFUND_DAYS} дней с запроса`] : null,
      a.failed.length ? ['failed', 'warn', `Сбои оплат: ${a.failed.length} на ${rub(a.failedSum)}`, a.failedDue.length ? `сегодня нужно действие по ${a.failedDue.length}` : 'ждём ответа клиентов'] : null,

    ].filter(Boolean);
    att = `<div class="card fin-att"><div class="card-head"><h2>Нужно внимание</h2></div>

        : '<p class="note">Всё под контролем: открытых возвратов и сбоев нет, выплаты сделаны.</p>'}</div>`;

/* чек и юнит-экономика */

  const s = settings();
  const orders = Store.all('orders').filter(o => o.pay === 'paid' && (o.paidAt || o.date) >= from && (o.paidAt || o.date) <= t);
  const courseN = sum(Fin.courses(), c => sum(finMonths().filter(m => m >= monthOf(from)), m => Fin.courseSale(c, m).n));
  const courseRev = sum(Fin.courses(), c => sum(finMonths().filter(m => m >= monthOf(from)), m => Fin.courseSale(c, m).revenue));
  const row = (name, val, how, cls = '') => `<tr class="${cls}"><td>${name}<small class="block how-m">${how}</small></td><td class="r nowrap"><b>${val}</b></td><td class="note">${how}</td></tr>`;
  const ok = u.ltvCac === null ? '' : u.ltvCac >= 3 ? 'good' : u.ltvCac >= 1 ? 'warn' : 'bad';
  return `<section class="section card unit">
    <div class="card-head"><h2>Чек и юнит-экономика</h2>${finSeg('ue', [['month', 'Этот месяц'], ['quarter', 'С начала квартала']], per)}</div>
    <div class="table-wrap"><table class="t unit-t">
      <tbody>
        ${row('Средний чек оплаты', rub(Math.round(u.check)), `выручка подписок ${rubK(u.f.revenue)} ÷ ${fmt(u.pays)} ${plural(u.pays, 'оплата', 'оплаты', 'оплат')} (первые и продления)`)}
        ${row('Цена подписки', `${rub(s.price)} · ${rub(priceYear())}`, `месяц · год (≈ ${rub(Math.round(priceYear() / 12))} в месяц)`)}
        ${row('Переменные расходы с оплаты', pct(u.varShare, 1), `эквайринг ${pct(s.acquiring, 1)} + налог ${pct(s.taxRate, 1)}`)}
        ${row('Маржа с оплаты', rub(Math.round(u.margin)), 'чек минус переменные расходы')}
        ${row('Продлевают каждый месяц', pct(u.renew), u.renewPlan ? 'по плану — фактических продлений ещё нет' : 'по последнему месяцу в «Подписках»')}
        ${row('Средний срок подписки', `${fmt(u.life, 1)} мес.`, `1 ÷ отток ${pct(u.churn)}`)}
        ${row('LTV — доход с подписчика', rub(Math.round(u.ltv)), 'маржа с оплаты × срок подписки', 'sub')}
        ${row('Стоимость привлечения (CAC)', u.cac === null ? '—' : rub(Math.round(u.cac)), `маркетинг и реферальные ${rubK(u.spend)} ÷ ${fmt(u.f.pays)} новых платящих`, 'sub')}
        ${row('LTV / CAC', u.ltvCac === null ? '—' : `<span class="${ok}">${fmt(u.ltvCac, 1)}</span>`, u.cac === 0 ? 'расходов на привлечение за период нет — подписчики пришли сами' : 'здорово — от 3; меньше 1 — привлечение не окупается')}
        ${row('Окупаемость привлечения', u.payback === null ? '—' : `${fmt(u.payback, 1)} мес.`, 'CAC ÷ маржа с оплаты')}
        ${orders.length ? row('Средний чек заказа маркетплейса', rub(Math.round(sum(orders, o => Fin.orderTotal(o)) / orders.length)), `${fmt(orders.length)} оплаченных заказов`) : ''}

  </section>`;
}

      </div>
      <label class="field"><span>Комментарий</span><input class="input" id="rfNote" value="${esc(v.note || '')}" maxlength="160" placeholder="Например: промокод ANNA, блог"></label>
      ${p && p.status === 'paid' ? `<p class="note">Выплачено ${dayLong(p.paidAt)} — сумма в журнале не изменится; чтобы поправить, отмените выплату.</p>` : ''}`,

        close();
        toast(`Начислено: ${to} — ${rub(amount)}`);

      const del = $('#rfDel', el);
      if (del) del.onclick = async () => {
        if (!(await confirmPop(del, {text: p.status === 'paid' ? 'Удалить начисление? Выплата останется в журнале.' : 'Удалить начисление?', yes: 'Удалить', danger: true}))) return;
        Store.remove('payouts', p.id);
        close();
      };
    },
  });
}

/* выручка курсов месяца уже в журнале — держим сумму в актуальном виде */
function syncCourseLedger(m) {
  const e = Fin.courseLedger(m);
  if (!e) return;
  const total = sum(Fin.courses(), c => Fin.courseSale(c, m).revenue);
  if (!total) Store.remove('ledger', e.id);
  else if (Number(e.amount) !== total) Store.patch('ledger', e.id, {amount: total});
}

    foot: `${p ? `<button class="btn danger left" id="prDel">${icon('trash')}Удалить</button>` : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" id="prSave">Сохранить</button>`,
    onMount(el, close) {
      let own = !v.seller;
      const sync = () => { $$('[data-own-f]', el).forEach(x => { x.hidden = !own; }); $$('[data-sel-f]', el).forEach(x => { x.hidden = own; }); $$('[data-own]', el).forEach(b => b.classList.toggle('on', (b.dataset.own === '1') === own)); };
      on(el, 'click', '[data-own]', (e, b) => { own = b.dataset.own === '1'; sync(); });
      sync();
      $('#prSave', el).onclick = () => {
        const title = $('#prTitle', el).value.trim();
        if (!title) { $('#prTitle', el).focus(); return; }
        const seller = own ? '' : $('#prSeller', el).value.trim();
        if (!own && !seller) { $('#prSeller', el).focus(); toast('Чей товар? Укажите продавца'); return; }
        const st = $('#prStock', el).value.trim();
        const data = {title, sku: $('#prSku', el).value.trim(), price: parseNum($('#prPrice', el).value), seller,
          cost: own ? parseNum($('#prCost', el).value) : 0, stock: own && st !== '' ? Math.round(parseNum(st)) : null, fee: own ? 0 : parseNum($('#prFee', el).value)};
        if (p) Store.put('products', p.id, {...p, ...data}); else Store.add('products', {...data, at: Date.now()});
        close();
      };
      const del = $('#prDel', el);
      if (del) del.onclick = async () => {
        if (!(await confirmPop(del, {text: 'Удалить товар из каталога? В старых заказах он останется.', yes: 'Удалить', danger: true}))) return;
        Store.remove('products', p.id);
        close();
      };
    },
  });
}

        <label class="field"><span>Причина</span><select class="select" id="rqReason">${REFUND_REASONS.map(r => `<option ${r === v.reason ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
        <label class="field"><span>Статус</span><select class="select" id="rqStatus">${Object.entries(REFUND_ST).map(([k, st]) => `<option value="${k}" ${k === (v.status || 'new') ? 'selected' : ''}>${st.name}</option>`).join('')}</select></label>
        <label class="field"><span>Ответственный</span>${whoSel('rqWho', v.who)}</label>
        <label class="field fin-span2"><span>Что пишет клиент</span><input class="input" id="rqComment" value="${esc(v.comment || '')}" maxlength="300"></label>
        <label class="field fin-span2"><span>Решение и пояснение</span><input class="input" id="rqDecision" value="${esc(v.decision || '')}" maxlength="300" placeholder="Обязательно при отказе"></label>
      </div>
      <div class="fin-msg"><span class="label">Ответ клиенту</span><p id="rqMsg"></p><div class="row"><button type="button" class="btn xs" id="rqCopy">${icon('copy')}Скопировать</button><span id="rqTg"></span></div></div>
      ${logHtml(x)}`,
    foot: `${x ? `<button class="btn danger left" id="rqDel">${icon('trash')}Удалить</button><button class="btn ghost" id="rqTask">${icon('check')}Задача</button>` : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" id="rqSave">Сохранить</button>`,
    onMount(el, close) {
      const dl = () => addDays($('#rqDate', el).value || today(), REFUND_DAYS);
      const paint = () => {
        const prod = $('#rqProduct', el).value;
        $$('[data-rq]', el).forEach(f => { f.hidden = f.dataset.rq !== prod && !(f.dataset.rq === 'other' && prod === 'sub'); });
        $('#rqDl', el).textContent = `ответить до ${dayLong(dl())}`;
        $('#rqMsg', el).textContent = refundMessage({client: $('#rqClient', el).value, amount: parseNum($('#rqAmount', el).value), deadline: dl(), decision: $('#rqDecision', el).value.trim()}, $('#rqStatus', el).value);
        const tg = normTg($('#rqContact', el).value);
        $('#rqTg', el).innerHTML = tg ? `<a class="btn xs ghost" href="${esc(tgUrl(tg))}" target="_blank" rel="noopener" data-rq-tg>${icon('ext')}Открыть чат</a>` : '';
      };
      on(el, 'input', 'input', paint);
      on(el, 'change', 'select, input[type=date]', paint);
      on(el, 'change', '#rqOrder', (e, s) => { const o = Store.get('orders', s.value); if (o) { $('#rqAmount', el).value = Fin.orderTotal(o); if (!$('#rqClient', el).value) $('#rqClient', el).value = o.customer || ''; if (!$('#rqContact', el).value) $('#rqContact', el).value = o.contact || ''; paint(); } });
      on(el, 'change', '#rqCourse', (e, s) => { const c = Store.get('courses', s.value); if (c && c.price) { $('#rqAmount', el).value = c.price; paint(); } });
      paint();
      $('#rqCopy', el).onclick = e => copyText($('#rqMsg', el).textContent, e.currentTarget);
      on(el, 'click', '[data-rq-tg]', () => copyText($('#rqMsg', el).textContent));
      $('#rqSave', el).onclick = () => {
        const status = $('#rqStatus', el).value, product = $('#rqProduct', el).value;
        if (!$('#rqClient', el).value.trim() && !$('#rqContact', el).value.trim()) { $('#rqClient', el).focus(); toast('Укажите клиента или контакт'); return; }
        if (status === 'rejected' && !$('#rqDecision', el).value.trim()) { $('#rqDecision', el).focus(); toast('При отказе напишите пояснение — клиенту и для истории'); return; }
        const amount = parseNum($('#rqAmount', el).value);
        const data = {date: $('#rqDate', el).value || today(), deadline: dl(), client: $('#rqClient', el).value.trim(), contact: $('#rqContact', el).value.trim(), product,
          courseId: product === 'course' ? $('#rqCourse', el).value || null : null, orderId: product === 'market' ? $('#rqOrder', el).value || null : null,
          what: $('#rqWhat', el).value.trim(), amount, reason: $('#rqReason', el).value, comment: $('#rqComment', el).value.trim(), status, who: $('#rqWho', el).value || null, decision: $('#rqDecision', el).value.trim()};
        const was = x ? x.status || 'new' : null;
        let rid;
        if (x) { rid = x.id; Store.patch('refunds', rid, {...data, ...(was !== status ? {log: finLog(`статус: ${REFUND_ST[status].name.toLowerCase()}`)} : {})}); }
        else rid = Store.add('refunds', {...data, by: Tasks.meKey(), at: Date.now(), log: finLog('получен запрос на возврат')});
        refundMoney(rid, was, status);
        close();
        if (status === 'refunded' && was !== 'refunded') toast(`Возвращено ${rub(amount)} — расход в журнале`);
      };
      const del = $('#rqDel', el);
      if (del) del.onclick = async () => {
        if (!(await confirmPop(del, {text: x.status === 'refunded' ? 'Удалить запрос? Расход по возврату уйдёт из журнала.' : 'Удалить запрос на возврат?', yes: 'Удалить', danger: true}))) return;
        refundMoney(x.id, x.status, 'deleted');
        Store.remove('refunds', x.id);
        close();
      };
      const task = $('#rqTask', el);
      if (task) task.onclick = () => { close(); openTask(null, {defaults: {title: `Возврат: ${x.client || x.contact}`, desc: `${REFUND_PRODUCTS[x.product || 'sub']}, ${rub(Number(x.amount) || 0)}. Причина: ${x.reason || '—'}. Ответить до ${x.deadline ? dayLong(x.deadline) : '—'}.`, assignee: x.who || Auth.personId(), due: x.deadline || '', dir: 'ops'}}); };
    },
  });
}
/* деньги по возврату: «Возвращено» — расход в журнал (по заказу — через заказ), отмена — обратно */
function refundMoney(rid, was, status) {
  const x = Store.get('refunds', rid);
  if (!x) return;
  const now = status === 'refunded', before = was === 'refunded';
  if (now === before) return;
  if (x.product === 'market' && x.orderId && Store.get('orders', x.orderId)) {
    Market.setPay(x.orderId, now ? 'refund' : 'paid');
  } else if (now) {
    const lid = Store.add('ledger', {kind: 'out', amount: Number(x.amount) || 0, cat: 'refunds', date: today(), note: `Возврат: ${x.client || x.contact || ''} · ${REFUND_PRODUCTS[x.product || 'sub']}`, refundId: rid, by: Tasks.meKey(), at: Date.now()});
    Store.patch('refunds', rid, {ledgerId: lid});
  } else Store.all('ledger').filter(e => e.refundId === rid).forEach(e => Store.remove('ledger', e.id));
  if (status !== 'deleted') Store.patch('refunds', rid, {refundedAt: now ? today() : null});
}

/* ── события вкладки ── */
function wireFin(root) {
  on(root, 'click', '[data-fin-go]', (e, el) => {
    View.set('fin.tab', el.dataset.finGo);
    App.render();
    const tabs = $('.fin-tabs');
    if (tabs && tabs.getBoundingClientRect().top < 0) tabs.scrollIntoView({block: 'start'});
  });
  on(root, 'click', '[data-fseg]', (e, el) => { const [k, v] = el.dataset.fseg.split(':'); View.set('fin.' + k, v); App.render(); });
  on(root, 'click', '[data-fin-csv]', async (e, el) => {
    const k = el.dataset.finCsv, name = `eva-hq-${k}-${today()}.csv`;
    if (await Portable.save(name, Portable[k + 'Csv']())) toast(`Файл ${name} — сохранён`);
  });
  /* подписки и выплаты */
  on(root, 'click', '[data-subs-edit]', (e, el) => editSubs(el.dataset.subsEdit));
  on(root, 'click', '[data-ref-add]', () => editRef(null));
  on(root, 'click', '[data-ref-edit]', (e, el) => editRef(el.dataset.refEdit));
  const accOf = id => Fin.accruals().find(x => x.id === id);
  on(root, 'click', '[data-pay-x]', async (e, el) => {
    const a = accOf(el.dataset.payX);
    if (!a || !(await confirmPop(el, {text: `Выплатить ${rub(a.amount)} — ${a.to}? Расход попадёт в журнал.`, yes: 'Да, выплачено'}))) return;
    Fin.pay(a);
    toast(`Выплачено: ${a.to} — ${rub(a.amount)}`);
  });
  on(root, 'click', '[data-unpay-x]', async (e, el) => {
    const a = accOf(el.dataset.unpayX);
    if (!a || !(await confirmPop(el, {text: 'Отменить выплату? Расход уйдёт из журнала.', yes: 'Да, отменить', danger: true}))) return;
    Fin.unpay(a);
  });
  /* курсы */
  on(root, 'click', '[data-course-add]', () => editCourse(null));
  on(root, 'click', '[data-course-edit]', (e, el) => editCourse(el.dataset.courseEdit));
  on(root, 'change', '[data-cs]', (e, el) => {
    const [cid, m] = el.dataset.cs.split(':');
    Store.patch('courses', cid, {sales: {[m]: {n: Math.max(0, Math.round(parseNum(el.value)))}}}, {mustExist: true});
    syncCourseLedger(m);
  });
  on(root, 'click', '[data-course-led]', (e, el) => {
    const m = el.dataset.courseLed, total = sum(Fin.courses(), c => Fin.courseSale(c, m).revenue);
    if (!total) return;
    Store.add('ledger', {kind: 'in', amount: total, cat: 'courses', date: m === monthOf(today()) ? today() : monthEnd(m), note: `Курсы · ${monthName(m).toLowerCase()}`, courseMonth: m, by: Tasks.meKey(), at: Date.now()});
    toast(`Выручка курсов за ${monthName(m).toLowerCase()} — в журнале: +${rub(total)}`);
  });
  /* маркетплейс */
  on(root, 'click', '[data-order-add]', () => editOrder(null));
  on(root, 'click', '[data-order]', (e, el) => { if (!e.target.closest('[data-stop], a, select')) editOrder(el.dataset.order); });
  on(root, 'change', '[data-ord-pay]', (e, el) => { Market.setPay(el.dataset.ordPay, el.value); toast(`Заказ: ${ORDER_PAY[el.value].name.toLowerCase()}${el.value === 'paid' ? ' — приход в журнале' : el.value === 'refund' ? ' — расход «Возвраты клиентам» в журнале' : ''}`); });
  on(root, 'change', '[data-ord-del]', (e, el) => Market.setDelivery(el.dataset.ordDel, el.value));
  on(root, 'click', '[data-product-add]', () => editProduct(null));
  on(root, 'click', '[data-product]', (e, el) => editProduct(el.dataset.product));
  on(root, 'change', '[data-stock]', (e, el) => Store.patch('products', el.dataset.stock, {stock: el.value.trim() === '' ? null : Math.round(parseNum(el.value))}, {mustExist: true}));
  const sm = $('#splitM', root);
  if (sm) sm.onchange = () => { View.set('fin.splitm', sm.value); App.render(); };
  /* сбои и возвраты */
  on(root, 'click', '[data-fail-add]', () => editFailed(null));
  on(root, 'click', '[data-fail]', (e, el) => { if (!e.target.closest('a')) editFailed(el.dataset.fail); });
  on(root, 'click', '[data-refund-add]', () => editRefund(null));
  on(root, 'click', '[data-refund]', (e, el) => { if (!e.target.closest('a')) editRefund(el.dataset.refund); });
}

/* новые возвраты, сбои и заказы от коллег — звук и уведомление тем, кто ведёт финансы */
const FinNotify = {
  since: 0,
  wired: false,
  init() {
    if (this.wired) return;
    this.wired = true;
    this.since = Date.now() - 2000;
    Store.subscribe(c => { if (['refunds', 'failed', 'orders'].includes(c)) setTimeout(() => this.check(), 40); });
  },
  check() {
    if (!Auth.me() || !finOps()) return [];
    const me = Tasks.meKey();
    const fresh = [
      ...Store.all('refunds').map(x => ({c: 'refunds', x, text: `Запрос на возврат: ${x.client || x.contact || 'клиент'} — ${rub(Number(x.amount) || 0)}`, tab: 'refunds'})),
      ...Store.all('failed').map(x => ({c: 'failed', x, text: `Сбой оплаты: ${x.client || x.contact || 'клиент'} — ${FAIL_REASONS[x.reason] || 'платёж не прошёл'}`, tab: 'failed'})),
      ...Store.all('orders').map(x => ({c: 'orders', x, text: `Новый заказ №${x.no}: ${rub(Fin.orderTotal(x))}`, tab: 'market'})),
    ].filter(e => (e.x.at || 0) > this.since && e.x.by && e.x.by !== me);
    if (!fresh.length) return [];
    this.since = Math.max(this.since, ...fresh.map(e => e.x.at || 0));
    Sound.play(fresh.some(e => e.c === 'refunds') ? 'control' : 'task');
    fresh.slice(-3).forEach(e => toast(e.text, {ring: true, action: {label: 'Открыть', fn: () => { View.set('fin.tab', e.tab); App.go('money'); }}}));
    return fresh;
  },
};

const SALES_FIELDS = [
  ['reach', 'Охват', 'сколько людей увидели нас'],

];

  ['experts', 'Новые эксперты', 'подписали оферту'],

App.register('reports', {

    const t = today();

    const period = (name, from, to, sub) => {
      const f = Sales.range(from, to);

      return `<div class="card stat period">
        <span class="label">${name}</span>
        <div class="big">${fmt(f.pays)} <small>${plan ? `из ${fmt(Math.round(plan))}` : 'продаж'}</small></div>
        ${plan ? progress(share, paceTone(f.pays, plan)) : '<div class="bar"></div>'}
        <div class="foot">${fmt(f.regs)} рег. · ${rubK(f.revenue)}${plan ? ` · <b class="${paceTone(f.pays, plan)}">${pct(share)}</b> плана` : ''}</div>
        <div class="foot">${sub}</div></div>`;
    };
    const ws = weekStart(t), qFrom = Q.start;
    const strip = `<div class="cards periods">
      ${period('Сегодня', t, t, dayWd(t))}
      ${period('Неделя', ws, addDays(ws, 6), weekLabel(ws))}
      ${period('Месяц', monthStart(monthOf(t)), monthEnd(monthOf(t)), monthName(monthOf(t)) + (monthOf(t) === '2026-09' ? ' · подготовка, без плана' : ''))}
      ${period('Квартал', qFrom, Q.end, pace.started ? `день ${pace.daysGone} из ${pace.daysAll}` : `старт через ${pace.toStart} ${plural(pace.toStart, 'день', 'дня', 'дней')}`)}
    </div>`;

      ? `<div class="pace-line ${paceTone(pace.fact, pace.planToDate)}">${icon('chart')}<span>При текущем темпе квартал закончится на <b>≈${fmt(pace.projected)}</b> продажах — это ${pace.heading}. Чтобы выйти на «${SCENARIOS[sc].name}» (${fmt(pace.total)}), нужно <b>${fmt(Math.ceil(pace.needPerDay))} в день</b> до 31 декабря.</span></div>`
      : pace.over ? '' : `<div class="pace-line">${icon('cal')}<span>Квартал стартует 1 октября. План «${SCENARIOS[sc].name}»: ${fmt(scenarioSales(sc)['2026-10'])} продаж в октябре — это ${fmt(Math.ceil(scenarioSales(sc)['2026-10'] / 31))} в день.</span></div>`;

    root.innerHTML = `
      ${pageHead('Отчёты', 'Как идём каждый день, неделю и месяц — против плана квартала. Внизу — Cash Flow с прогнозом до Нового года.',
        `<div class="seg" title="Сравнить со сценарием">${Object.entries(SCENARIOS).map(([k, x]) => `<button data-sc="${k}" class="${k === sc ? 'on' : ''}">${x.name} ${fmt(Plan.total(k))}</button>`).join('')}</div>${helpBtn('reports')}`)}
      ${helpBox('reports', `<b>Как вносить цифры.</b> Каждый день до вечера (и обязательно до созвона в понедельник, 11:00) откройте «Цифры дня», выберите дату и впишите охват, регистрации и оплаты. Выручка посчитается сама: оплаты и продления × ${rub(s.price)} — поправьте, если были годовые тарифы или скидки. Внести может любой в команде, исправить — тоже: видно, кто внёс последним. Сценарий сверху только меняет сравнение — план команды выбирает основатель в «Стратегии».`)}

      <div class="tabs rep-tabs" role="tablist">

      ${Auth.can('cf.view') ? cashFlowHtml(sc) : ''}`;

    wireHelp(root);

    on(root, 'click', '[data-tab]', (e, el) => { View.set('r.tab', el.dataset.tab); App.render(); });
    on(root, 'click', '[data-rm]', (e, el) => { View.set('r.month', el.dataset.rm); App.render(); });
    on(root, 'click', '[data-day]', (e, el) => {

/* ── цифры дня ── */

  const auto = ((Number(dr.pays) || 0) + (Number(dr.renewals) || 0)) * price;
  const val = k => (dr[k] === undefined || dr[k] === null ? '' : dr[k]);
  const inp = ([k, name, hint]) => `<label class="field"><span>${name}</span><input class="input num" id="se-${k}" data-sf="${k}" inputmode="numeric" value="${esc(val(k))}" placeholder="0"><small>${hint}</small></label>`;
  return `<form class="card entry" id="salesForm" autocomplete="off">

      <h2>Цифры дня</h2>

        <button type="button" class="icon-btn" data-shift="-1" aria-label="Предыдущий день">${icon('back')}</button>
        <input class="input sm" type="date" id="seDate" value="${d}" min="2026-09-01" max="2027-01-31">

        ${d !== today() ? '<button type="button" class="btn xs ghost" data-shift="0">Сегодня</button>' : ''}
      </div>
      <span class="note">${rec ? `внесено${by ? ': ' + esc(personName(by)) : ''}, ${timeAgo(rec.at)}` : 'за этот день ещё ничего'}</span>
    </div>
    <div class="entry-grid">${SALES_FIELDS.map(inp).join('')}
      <label class="field"><span>Выручка, ₽</span><input class="input num" id="se-revenue" data-sf="revenue" inputmode="numeric" value="${esc(val('revenue'))}" placeholder="${fmt(auto)}"><small>само: ${fmt(auto)} ₽ — поправьте при годовых</small></label>
    </div>
    <details class="entry-more" ${dr.experts || dr.mk || dr.note ? 'open' : ''}><summary>Продукт и заметка</summary>
      <div class="entry-grid">${PRODUCT_FIELDS.map(inp).join('')}
        <label class="field entry-note"><span>Заметка</span><input class="input" id="se-note" data-sf="note" value="${esc(val('note'))}" placeholder="Что повлияло на цифры: эфир, рассылка, сбой оплаты" maxlength="200"></label></div>
    </details>
    <div class="entry-foot">
      <span class="note">${[dr.reach && dr.views ? `просмотр ${pct(dr.views / dr.reach, 1)}` : '', dr.views && dr.clicks ? `переход ${pct(dr.clicks / dr.views, 1)}` : '', dr.clicks && dr.regs ? `регистрация ${pct(dr.regs / dr.clicks, 1)}` : dr.reach && dr.regs ? `охват → регистрация ${pct(dr.regs / dr.reach, 1)}` : '', dr.regs && dr.pays ? `покупка ${pct(dr.pays / dr.regs, 1)}` : ''].filter(Boolean).join(' · ')}</span>
      ${rec && Auth.can('tasks.manage') ? '<button type="button" class="btn ghost sm" id="seDel">Удалить день</button>' : ''}
      <button class="btn primary" type="submit">${rec ? 'Обновить' : 'Сохранить'} цифры за ${dayLong(d)}</button>
    </div>
