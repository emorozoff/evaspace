function wireEntry(root) {
  const form = $('#salesForm', root);
  if (!form) return;
  const d = () => RepUI.date || today();
  on(form, 'input', '[data-sf]', (e, el) => {
    const k = el.dataset.sf;
    const dr = RepUI.drafts[d()] = RepUI.drafts[d()] || {...(Sales.day(d()) || {})};
    dr[k] = k === 'note' ? el.value : (el.value === '' ? '' : Math.max(0, Math.round(parseNum(el.value))));
    if (k === 'pays' || k === 'renewals') {
      const auto = ((Number(dr.pays) || 0) + (Number(dr.renewals) || 0)) * settings().price;
      const r = $('#se-revenue', form); r.placeholder = fmt(auto);
      $('#se-revenue', form).nextElementSibling.textContent = `само: ${fmt(auto)} ₽ — поправьте при годовых`;
    }
  });
  on(form, 'click', '[data-shift]', (e, el) => {
    const n = Number(el.dataset.shift);
    RepUI.date = n === 0 ? today() : addDays(d(), n);
    App.render();
  });
  $('#seDate', form).onchange = e => { if (e.target.value) { RepUI.date = e.target.value; App.render(); } };
  const del = $('#seDel', form);
  if (del) del.onclick = async () => {
    if (!(await confirmPop(del, {text: `Удалить цифры за ${dayLong(d())}?`, yes: 'Да, удалить', danger: true}))) return;
    const copy = clone(Sales.day(d()));
    Store.remove('sales', d());
    delete RepUI.drafts[d()];
    toast('Цифры дня удалены', {undo: () => Store.put('sales', copy.id, copy)});
  };
  form.onsubmit = e => {
    e.preventDefault();
    const day = d();
    const rec = {};
    $$('[data-sf]', form).forEach(el => {
      const k = el.dataset.sf;
      if (k === 'note') { if (el.value.trim()) rec.note = el.value.trim(); return; }
      if (el.value.trim() !== '') rec[k] = Math.max(0, Math.round(parseNum(el.value)));
    });
    if (!Object.keys(rec).length) { toast('Впишите хотя бы одну цифру'); return; }
    Store.put('sales', day, {...rec, by: Tasks.meKey(), at: Date.now()});
    delete RepUI.drafts[day];
    toast(`Цифры за ${dayLong(day)} сохранены`);
    App.render();
  };
}

/* ── по дням ── */
function dayView(sc) {
  const t = today();
  const months = CF_MONTHS.filter(m => m <= monthOf(t) || m === Q.months[0]);
  let m = View.get('r.month', monthOf(t));
  if (!CF_MONTHS.includes(m)) m = CF_MONTHS.includes(monthOf(t)) ? monthOf(t) : Q.months[0];
  const days = [];
  for (let d = monthStart(m); d <= monthEnd(m); d = addDays(d, 1)) days.push(d);
  const byDay = byKey(Sales.list(), 'id');
  const chart = barChart({
    labels: days.map(d => ({text: dayWd(d), tick: String(Number(d.slice(8)))})),
    values: days.map(d => (d <= t ? Number((byDay[d] || {}).pays) || 0 : 0)),
    plan: Q.months.includes(m) ? days.map(d => Math.round(Plan.day(sc, d) * 10) / 10) : null,
    highlight: days.indexOf(t),
  });
  const rows = days.filter(d => d <= t || byDay[d]).reverse();
  const table = rows.length ? `<div class="table-wrap"><table class="t days">
    <thead><tr><th>День</th><th class="r">Охват</th><th class="r">Просм.</th><th class="r">Перех.</th><th class="r">Регистрации</th><th class="r">Оплаты</th><th class="r">Продления</th><th class="r">Выручка</th><th class="r">Рег. → оплата</th><th class="r">План оплат</th><th class="r">±</th><th>Внёс</th></tr></thead>
    <tbody>${rows.map(d => {
      const r = byDay[d];
      const plan = Plan.day(sc, d);
      const pays = r ? Number(r.pays) || 0 : 0;
      const diff = pays - plan;
      const p = r ? personById(r.by) : null;
      return `<tr class="${d === t ? 'now' : ''} ${Auth.can('sales.edit') ? 'click' : ''}" data-day="${d}">
        <td class="nowrap">${dayWd(d)}${r && r.note ? ` <span class="pill line" title="${esc(r.note)}">заметка</span>` : ''}</td>
        ${r ? `<td class="r">${fmt(r.reach || 0)}</td><td class="r">${r.views ? fmt(r.views) : '—'}</td><td class="r">${r.clicks ? fmt(r.clicks) : '—'}</td><td class="r">${fmt(r.regs || 0)}</td><td class="r"><b>${fmt(pays)}</b></td><td class="r">${fmt(r.renewals || 0)}</td><td class="r">${rub(revenueOf(r))}</td><td class="r">${r.regs ? pct(pays / r.regs, 1) : '—'}</td>`
          : `<td class="r muted" colspan="8">${Auth.can('sales.edit') ? 'не внесено — нажмите, чтобы внести' : 'не внесено'}</td>`}
        <td class="r muted">${plan ? fmt(plan, 1) : '—'}</td>
        <td class="r ${!plan ? '' : diff >= 0 ? 'good' : 'bad'}">${plan ? (diff >= 0 ? '+' : '') + fmt(diff, 1) : ''}</td>
        <td class="soft nowrap">${p ? esc(firstName(p)) : ''}</td></tr>`;
    }).join('')}</tbody></table></div>` : '<div class="empty"><b>Этот месяц ещё не начался</b>Цифры появятся с первого дня.</div>';
  return `<div class="tabs sub-tabs">${months.map(x => `<button data-rm="${x}" class="${x === m ? 'on' : ''}">${monthName(x)}</button>`).join('')}</div>
    <div class="card"><div class="card-head"><h2>Продажи по дням · ${monthName(m).toLowerCase()}</h2><span class="note">${Q.months.includes(m) ? `план ${fmt(Plan.sales(sc, m))} за месяц — ${fmt(Plan.sales(sc, m) / daysInMonth(m), 1)} в день` : 'подготовительный месяц — без плана'}</span></div>${chart}</div>
    <div class="section">${table}</div>`;
}

/* ── по неделям ── */
function weekView(sc) {
  const t = today();
  const weeks = [];
  for (let w = weekStart('2026-09-01'); w <= Q.end; w = addDays(w, 7)) weeks.push(w);
  const rows = weeks.map(w => {
    const from = w < '2026-09-01' ? '2026-09-01' : w, to = addDays(w, 6) > Q.end ? Q.end : addDays(w, 6);
    const f = Sales.range(from, to), plan = Plan.range(sc, from, to);
    return {w, from, to, f, plan, now: t >= w && t <= addDays(w, 6), future: from > t};
  });
  const chart = barChart({
    labels: rows.map(r => ({text: weekLabel(r.w), tick: dayShort(r.w).replace(NB, ' ')})),
    values: rows.map(r => (r.future ? 0 : r.f.pays)),
    plan: rows.map(r => Math.round(r.plan)),
    highlight: rows.findIndex(r => r.now),
  });
  return `<div class="card"><div class="card-head"><h2>Продажи по неделям</h2><span class="note">понедельник — воскресенье, план ${SCENARIOS[sc].name.toLowerCase()}</span></div>${chart}</div>
    <div class="section table-wrap"><table class="t weeks-t">
      <thead><tr><th>Неделя</th><th class="r">План продаж</th><th class="r">Факт</th><th class="r">% плана</th><th class="r">Регистрации</th><th class="r">план</th><th class="r">Охват</th><th class="r">Выручка</th><th class="r">Рег. → оплата</th></tr></thead>
      <tbody>${rows.map(r => {
        const share = r.plan ? r.f.pays / r.plan : null;
        return `<tr class="${r.now ? 'now' : ''} ${r.future ? 'muted-row' : ''}">
          <td class="nowrap">${weekLabel(r.w)}${r.now ? ' <span class="pill rose">эта</span>' : ''}</td>
          <td class="r">${r.plan ? fmt(r.plan, 0) : '—'}</td>
          <td class="r"><b>${r.future ? '' : fmt(r.f.pays)}</b></td>
          <td class="r ${r.future || !r.plan ? '' : paceTone(r.f.pays, r.plan)}">${r.future || !r.plan ? '' : pct(share)}</td>
          <td class="r">${r.future ? '' : fmt(r.f.regs)}</td><td class="r muted">${r.plan ? fmt(Plan.regs(r.plan)) : '—'}</td>
          <td class="r">${r.future ? '' : fmt(r.f.reach)}</td><td class="r">${r.future ? '' : rubK(r.f.revenue)}</td>
          <td class="r">${r.future || !r.f.regs ? '' : pct(r.f.pays / r.f.regs, 1)}</td></tr>`;
      }).join('')}</tbody></table></div>`;
}

function wireMaterials(root) {

const deckCache = {};
App.register('material', {
  title: 'Материал',
  render(root, id) {
    const m = MATERIALS.find(x => x.id === id);
    if (!m || !matVisible(m)) { root.innerHTML = pageHead('Материал', '') + noAccess('Материал не найден или закрыт для вашей роли.'); return; }
    const siblings = MATERIALS.filter(x => x.group === m.group && x.id !== m.id && matVisible(x));
    root.innerHTML = `<div class="viewer">
      <div class="viewer-head">
        <a class="btn ghost sm" href="#home">${icon('back')}Главная</a>
        <div class="viewer-t"><span class="label">${MAT_GROUPS[m.group].name}</span><b>${esc(m.title)}</b></div>
        <div class="viewer-act">
          ${siblings.map(x => `<a class="btn sm" href="#m-${x.id}">${esc(x.title)}</a>`).join('')}
          <button class="btn sm primary" data-full>${icon('expand')}На весь экран</button>
          <a class="btn sm" href="${esc(m.url)}" target="_blank" rel="noopener">${icon('ext')}Открыть оригинал</a>
        </div>
      </div>
      <div class="viewer-frame" id="vFrame"><div class="viewer-load">Открываю «${esc(m.title)}»…</div></div>
      <button class="viewer-exit" data-full-exit hidden>${icon('x')}Свернуть</button>
      <p class="note">${m.group === 'standards' ? 'Книга читается прокруткой, оглавление слева, тест — в конце. Прогресс чтения запоминается в этом браузере.' : 'Листайте стрелками ← → или пробелом, F — на весь экран.'} Если материал не открылся здесь, нажмите «Открыть оригинал».</p>
    </div>`;
    const box = $('#vFrame', root), wrap = $('.viewer', root);
    /* на весь экран: настоящий полноэкранный режим, а где он запрещён — окно поверх штаба */
    const setFull = onOff => {
      wrap.classList.toggle('full', onOff);
      document.body.classList.toggle('viewer-open', onOff);
      $('[data-full-exit]', root).hidden = !onOff;
      if (onOff) {
        const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
        if (req) { try { const r = req.call(wrap); if (r && r.catch) r.catch(() => {}); } catch (e) { /* окно поверх — уже открыто */ } }
      } else if (document.fullscreenElement || document.webkitFullscreenElement) {
        try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { /* ничего */ }
      }
    };
    on(root, 'click', '[data-full]', () => setFull(true));
    on(root, 'click', '[data-full-exit]', () => setFull(false));
    const onKey = e => { if (e.key === 'Escape' && wrap.classList.contains('full')) setFull(false); };
    const onFs = () => { if (!document.fullscreenElement && !document.webkitFullscreenElement && wrap.classList.contains('full') && wrap.dataset.fs === '1') setFull(false); wrap.dataset.fs = document.fullscreenElement ? '1' : ''; };
    document.addEventListener('keydown', onKey);
    document.addEventListener('fullscreenchange', onFs);
    /* ушли со страницы — снимаем слушатели и режим */
    const off = () => { if (!root.isConnected) { document.removeEventListener('keydown', onKey); document.removeEventListener('fullscreenchange', onFs); document.body.classList.remove('viewer-open'); window.removeEventListener('hashchange', off); } };
    window.addEventListener('hashchange', () => setTimeout(off, 0));
    const show = html => {
      const f = document.createElement('iframe');
      f.title = m.title;
      f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
      f.setAttribute('allowfullscreen', '');
      f.srcdoc = html;
      box.innerHTML = '';
      box.appendChild(f);
      setTimeout(() => { try { f.focus(); } catch (e) { /* ничего */ } }, 200);
    };
    if (deckCache[m.id]) { show(deckCache[m.id]); return; }
    fetch(m.file, {cache: 'force-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(html => {
      deckCache[m.id] = html;
      if (box.isConnected) show(html);
    }).catch(() => {
      if (!box.isConnected) return;
      box.innerHTML = `<div class="viewer-load"><b>Здесь презентация не открылась</b><p>Файл лежит только в артефакте штаба. Откройте оригинал — он всегда под рукой.</p>
        <a class="btn primary" href="${esc(m.url)}" target="_blank" rel="noopener">${icon('ext')}Открыть «${esc(m.title)}»</a></div>`;
    });
  },
});

const pStatus = p => (PERSON_STATUS[p.status] ? p.status : 'active');

          ${owner ? `<td class="r"><button class="icon-btn" data-person-edit="${p.id}" title="Изменить">${icon('edit')}</button></td>` : ''}

      ${owner ? onboardHtml() : ''}
      ${Auth.can('money.edit') ? portableHtml() : ''}
      ${owner ? accessHtml(accs, invs) : ''}`;

    on(root, 'click', '[data-tv]', (e, el) => { View.set('team.view', el.dataset.tv); App.render(); });

/* оклад → план платежей: меняем суммы у связанных строк зарплаты,
   а если строки нет — заводим её с месяца начала до конца года */
function syncPayroll(pid) {
  const p = personById(pid);
  if (!p) return;
  const items = Store.all('plan').filter(it => it.group === 'payroll' && it.personId === pid);
  const salary = Number(p.salary) || 0;
  items.forEach(it => { if (it.amount !== salary && salary > 0) Store.patch('plan', it.id, {amount: salary}); });
  if (!items.length && salary > 0 && pStatus(p) === 'active') {
    const from = p.startMonth || monthOf(today());
    const months = CF_MONTHS.filter(m => m >= from);
    if (months.length) Store.put('plan', 'pay_' + pid, {title: p.title || personName(p), group: 'payroll', cat: 'payroll', amount: salary, months, personId: pid, insurance: true});
  }
}

/* ── копирование ── */
function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.innerHTML; btn.textContent = 'Скопировано'; setTimeout(() => { btn.innerHTML = o; }, 1500); } };
  try {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } catch (e) { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  if (ok) done(); else toast('Не получилось скопировать — выделите текст и нажмите Ctrl+C');
}

/* ── структура: генеральный директор сверху, под ним управление (финансовый,
   исполнительный, коммерческий и другие директора), под каждым — его люди.
   Кому подчиняется человек, можно указать в карточке; иначе — по должности
   и направлению. ── */
const ORG_ORDER = [[/фин|cfo/i, 1], [/исполн|операц|coo/i, 2], [/коммерч|продаж|cco/i, 3], [/техн|cto/i, 4], [/продукт|cpo/i, 5], [/маркет|cmo/i, 6]];
const isDirector = p => !p.founder && /директор|\bc[fotpm]o\b|\bcco\b/i.test(p.title || '');
const orgRank = p => { const r = ORG_ORDER.find(([re]) => re.test(p.title || '')); return r ? r[1] : 9; };
const orgSort = (a, b) => (isDirector(b) - isDirector(a)) || orgRank(a) - orgRank(b) || (pStatus(a) === 'vacancy') - (pStatus(b) === 'vacancy') || personName(a).localeCompare(personName(b), 'ru');
function orgManagerOf(p, ppl, founder) {
  if (!p || p.founder) return null;
  if (p.managerId && p.managerId !== p.id && ppl.some(x => x.id === p.managerId)) return p.managerId;
  if (!founder) return null;
  if (isDirector(p)) return founder.id;
  const whale = (Strategy.whales()[p.dir] || {}).lead;
  const lead = ppl.find(x => x.id !== p.id && isDirector(x) && x.dir && x.dir === p.dir) || (whale && whale !== p.id ? ppl.find(x => x.id === whale) : null);
  return lead ? lead.id : founder.id;
}
function orgChartHtml(ppl, owner) {
  const founder = ppl.find(p => p.founder) || null;
  if (!founder) return '<div class="empty"><b>Нет основателя в команде</b>Отметьте генерального директора, чтобы построить структуру.</div>';
  const mgr = {};
  ppl.forEach(p => { mgr[p.id] = orgManagerOf(p, ppl, founder); });
  /* замкнутый круг подчинения разрываем — такие люди подчиняются генеральному */
  ppl.forEach(p => { const seen = new Set([p.id]); let m = mgr[p.id]; while (m) { if (seen.has(m)) { mgr[p.id] = founder.id; break; } seen.add(m); m = mgr[m]; } });
  const kids = id => ppl.filter(p => mgr[p.id] === id).sort(orgSort);
  const box = (p, cls = '') => `<a class="org-box ${cls} ${pStatus(p) !== 'active' ? 'dim' : ''}" href="#p-${p.id}">${avatar(p)}<span><b>${esc(p.name || 'Вакансия')}</b><small>${esc(p.title || '')}</small></span>${pStatus(p) === 'vacancy' ? '<em>вакансия</em>' : ''}</a>`;
  const team = id => {
    const list = kids(id);
    return list.length ? `<div class="org-team">${list.map(x => `<div class="org-node">${box(x)}${kids(x.id).length ? `<div class="org-sub">${kids(x.id).map(y => box(y, 'sm')).join('')}</div>` : ''}</div>`).join('')}</div>` : '<p class="note org-empty">команда набирается</p>';
  };
  const top = kids(founder.id);
  const dirs = top.filter(p => isDirector(p) || kids(p.id).length);
  const direct = top.filter(p => !dirs.includes(p));
  return `<div class="org">
    <div class="org-l0"><span class="label">Генеральный директор</span>${box(founder, 'ceo')}</div>
    ${dirs.length ? `<div class="org-band"><span class="label">Управление</span></div>
    <div class="org-l1">${dirs.map(d => `<div class="org-col"><div class="org-head">${box(d, 'dir')}</div>${team(d.id)}</div>`).join('')}</div>` : ''}
    ${direct.length ? `<div class="org-direct"><span class="label">Подчиняются напрямую генеральному директору</span><div class="org-row">${direct.map(x => box(x)).join('')}</div></div>` : ''}
    <p class="note">${owner ? 'Кому подчиняется человек, меняется в его карточке («Изменить» → «Подчиняется»). ' : ''}Без явного указания директора стоят под генеральным, остальные — под директором своего направления.</p>
  </div>`;
}

function nextBirthday(iso, from = today()) {
  if (!/^\d{4}-\d\d-\d\d$/.test(iso || '')) return null;
  const y = Number(from.slice(0, 4));
  let d = isoOf(dateOf(`${y}-${iso.slice(5)}`));
  if (d < from) d = isoOf(dateOf(`${y + 1}-${iso.slice(5)}`));
  return {date: d, days: daysBetween(from, d)};

function fillHtml(p) {

function issueInvite(pid) {
  const p = pid ? personById(pid) : null;
  let inv = p ? pendingInvite(pid) : null;
  const roles = Object.entries(ROLES).filter(([k]) => k !== 'owner');
  const curRole = inv ? roleOf(inv.role) : 'member';
  const out = code => `<span class="label">Ссылка-приглашение</span>
    <div class="iv-link"><input class="input" id="ivLink" readonly value="${esc(inviteLink(code))}" aria-label="Ссылка-приглашение"><button type="button" class="btn sm primary" data-iv-copy-link>${icon('copy')}Скопировать ссылку</button></div>
    <pre class="iv-msg" id="ivMsg"></pre>
    <div class="row"><button type="button" class="btn sm" data-iv-copy-msg>${icon('copy')}Скопировать приглашение целиком</button><button type="button" class="btn sm ghost" data-iv-preview>Как увидит человек</button></div>
    <p class="note">Ссылка одноразовая: после регистрации она перестанет работать. Запасной код из сообщения — <span class="inv-code">${esc(code)}</span>.</p>
    ${shareHelpHtml()}`;
  openModal({
    title: p ? `Пригласить: ${personName(p)}` : 'Пригласить в команду',
    wide: true,
    body: `${p ? `<div class="iv-who">${avatar(p, 'lg')}<div><b>${esc(personName(p))}</b><small>${esc([p.title, DIRS[p.dir] ? DIRS[p.dir].name : ''].filter(Boolean).join(' · ') || 'должность не указана')}</small></div></div>`
      : `<div class="grid2"><label class="field"><span>Имя</span><input class="input" id="ivGiven" placeholder="Анна"></label>
          <label class="field"><span>Фамилия</span><input class="input" id="ivSurname" placeholder="Смирнова"></label></div>
        <div class="grid2"><label class="field"><span>Должность</span><input class="input" id="ivTitle" placeholder="SMM-менеджер"></label>
          <label class="field"><span>Направление</span><select class="select" id="ivDir"><option value="">Без направления</option>${Object.entries(DIRS).map(([k, d]) => `<option value="${k}">${d.name}</option>`).join('')}</select></label></div>`}
      <div class="field"><span>Доступ в штабе</span><div class="iv-roles" role="radiogroup">${roles.map(([k, r]) => `<label class="iv-role ${k === curRole ? 'on' : ''}"><input type="radio" name="ivRole" value="${k}" ${k === curRole ? 'checked' : ''}><b>${r.name}</b><small>${esc(r.about)}</small></label>`).join('')}</div></div>
      ${p ? fillHtml(p) : '<p class="note">Остальное — день рождения, контакты, Human Design — человек допишет сам в анкете по ссылке.</p>'}
      <div class="invite-out" id="ivOut" ${inv ? '' : 'hidden'}>${inv ? out(inv.id) : ''}</div>`,
    foot: `<button class="btn" data-close>Готово</button><button class="btn primary" id="ivGo">${inv ? 'Выдать новую ссылку' : `${icon('link')}Создать ссылку`}</button>`,
    onMount(el, close) {
      const role = () => ($('input[name=ivRole]:checked', el) || {}).value || 'member';
      const paintOut = () => {
        $('#ivOut', el).innerHTML = out(inv.id);
        $('#ivOut', el).hidden = false;
        $('#ivMsg', el).textContent = inviteText(inv.id);
      };
      if (inv) $('#ivMsg', el).textContent = inviteText(inv.id);
      on(el, 'change', 'input[name=ivRole]', (e, i) => {
        $$('.iv-role', el).forEach(x => x.classList.toggle('on', x.contains(i)));
        /* роль в уже выданной ссылке меняется сразу — ссылка та же */
        if (inv) { Store.patch('invites', inv.id, {role: i.value}); inv = Store.get('invites', inv.id); paintOut(); toast(`Доступ по ссылке: ${ROLES[i.value].name}`); }
      });
      $('#ivGo', el).onclick = () => {
        let personId = pid;
        if (!p) {
          const given = $('#ivGiven', el).value.trim(), surname = $('#ivSurname', el).value.trim(), title = $('#ivTitle', el).value.trim();
          if (!given && !title) { $('#ivGiven', el).focus(); toast('Напишите имя или должность'); return; }
          personId = Store.add('people', {name: joinName(given, surname), givenName: given, surname, title, dir: $('#ivDir', el).value, order: 50});
        }
        if (inv) Store.remove('invites', inv.id);
        const code = makeCode();
        const pp = personById(personId) || {};
        Store.put('invites', code, {role: role(), personId, title: pp.title || '', dir: pp.dir || '', by: Tasks.meKey(), at: Date.now()});
        inv = Store.get('invites', code);
        paintOut();
        $('#ivGo', el).textContent = 'Выдать новую ссылку';
        if (!p) $$('#ivGiven, #ivSurname, #ivTitle, #ivDir', el).forEach(x => { x.disabled = true; });
        toast('Ссылка готова — отправьте её человеку');
      };
      on(el, 'click', '[data-iv-copy-link]', (e, b) => copyText(inviteLink(inv.id), b));
      on(el, 'click', '[data-iv-copy-msg]', (e, b) => copyText(inviteText(inv.id), b));
      on(el, 'click', '[data-iv-preview]', () => previewJoin(inv.id));
      on(el, 'click', '[data-iv-edit]', () => { close(); editPerson(pid, {then: 'invite'}); });
    },
  });
}

function wireJoinForm(root, code) {
  let hd = (($('.hd-chip.on', root) || {}).dataset || {}).hd || '';
  on(root, 'click', '[data-hd]', (e, b) => {
    hd = b.dataset.hd;
    $('#joinForm', root).dataset.dirty = '1';
    $$('.hd-chip', root).forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); });
    $('#jHdHint', root).textContent = HD_TYPES[hd] ? `Стратегия — ${HD_TYPES[hd].strategy}.` : '';
  });
  const form = $('#joinForm', root), msg = $('#joinMsg', root), go = $('#joinGo', root);
  const val = k => (($('#j-' + k, root) || {}).value || '').trim();
  const fail = (text, k) => { msg.textContent = text; msg.hidden = false; const i = k && $('#j-' + k, root); if (i) { i.classList.add('bad'); i.focus(); } else msg.scrollIntoView({block: 'center', behavior: 'smooth'}); };
  /* черновик анкеты — в этом браузере, без пароля */
  const keep = () => {
    const d = {hdType: hd};
    ['given', 'surname', 'title', 'dir', 'email', 'phone', 'telegram', 'birthDate', 'birthTime', 'birthCity', 'hdProfile'].forEach(k => { d[k] = val(k); });
    Local.set('eva-hq-join:' + code, d);
  };
  on(form, 'input', '.input', (e, i) => { i.classList.remove('bad'); form.dataset.dirty = '1'; if (i.type !== 'password') keep(); });
  on(form, 'change', 'select', () => { form.dataset.dirty = '1'; keep(); });
  on(root, 'click', '[data-hd]', () => keep());
  form.addEventListener('submit', async e => {
    e.preventDefault();
    msg.hidden = true;
    Sound.unlock();
    const f = {code, hdType: hd};
    ['given', 'surname', 'title', 'dir', 'email', 'phone', 'telegram', 'birthDate', 'birthTime', 'birthCity', 'hdProfile'].forEach(k => { f[k] = val(k); });
    f.pw = ($('#j-pw', root) || {}).value || '';
    if (!f.given) return fail('Напиши имя.', 'given');
    if (!f.surname) return fail('Напиши фамилию.', 'surname');
    if (!/^\S+@\S+\.\S+$/.test(f.email)) return fail('Почта выглядит неправильно — по ней ты будешь входить в штаб.', 'email');
    if (Auth.findByEmail(f.email)) return fail('С этой почтой уже есть учётка — войди или укажи другую почту.', 'email');
    if (f.pw.length < 6) return fail('Пароль — не короче 6 символов.', 'pw');
    if (f.pw !== (($('#j-pw2', root) || {}).value || '')) return fail('Пароли не совпадают.', 'pw2');
    go.disabled = true;
    go.textContent = 'Создаю учётку…';
    try {
      await Auth.acceptInvite(f);
      Local.del('eva-hq-join:' + code);
      try { history.replaceState(null, '', '#home'); } catch (err) { location.hash = 'home'; }
      App.render({force: true});
    } catch (err) {
      fail(err.message || String(err));
      go.disabled = false;
      go.innerHTML = `${icon('heart')}Попробовать ещё раз`;
    }
  });
}

const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h; };
function teamWeek() {
  const since = Date.now() - 7 * 864e5, t = today();
  const closed = Tasks.all().filter(x => x.status === 'done' && (x.doneAt || 0) >= since);
  const by = {};
  closed.forEach(x => { if (x.assignee && personById(x.assignee)) by[x.assignee] = (by[x.assignee] || 0) + 1; });
  const heroes = Object.entries(by).map(([pid, n]) => ({p: personById(pid), n})).sort((a, b) => b.n - a.n || personName(a.p).localeCompare(personName(b.p), 'ru')).slice(0, 3);
  let days = 0;
  for (let i = 0; i < 7; i++) if (Sales.day(addDays(t, -i))) days++;
  return {closed: closed.length, accepted: closed.filter(x => x.acceptedBy).length, days, heroes};
}

/* Данные штаба — в файл и обратно. Один формат на всё: выгрузка из
   артефакта Claude, с GitHub Pages и со своего сервера одинаковая
   ({format: 'eva-hq', version: 1, collections: {коллекция: {id: документ}}},
   см. DATA.md), поэтому переезд на другой хостинг — «Выгрузить всё» здесь и
   «Загрузить из файла» там (или node server.js --import файл).
   Таблицы CSV — для Excel и Google Таблиц: разделитель «;», UTF-8 с BOM. */

const Portable = {
  snapshot({accounts = true} = {}) {
    const collections = {};
    Store.COLS.forEach(c => {
      if (c === 'accounts' && !accounts) return;
      collections[c] = Object.fromEntries(Store.all(c).map(d => { const {id, ...body} = d; return [id, body]; }));
    });
    return {format: 'eva-hq', version: 1, exportedAt: new Date().toISOString(), source: Store.state.mode, collections};
  },
  csv(rows, cols) {
    const q = v => { const s = v === null || v === undefined ? '' : String(v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    return '﻿' + [cols.map(c => q(c[1])).join(';'), ...rows.map(r => cols.map(c => q(typeof c[0] === 'function' ? c[0](r) : r[c[0]])).join(';'))].join('\r\n');
  },
  tasksCsv() {
    const nm = id => (id ? whoName(id) : '');
    return this.csv(Tasks.sort(Tasks.all()), [
      ['id', 'id'], ['title', 'Задача'], [t => STATUSES[t.status] ? STATUSES[t.status].name : t.status, 'Статус'],
      [t => nm(t.createdBy), 'Поставил(а)'], [t => nm(t.assignee), 'Исполнитель'], [t => PRIO[prioOf(t)].name, 'Приоритет'],
      ['due', 'Срок'], ['month', 'Месяц'], [t => (t.dueFixed ? 'да' : ''), 'Срок важен'], [t => dirName(t.dir), 'Направление'],
      [t => { const g = t.goalId ? Strategy.goal(t.goalId) : null; return g ? g.short || g.title : ''; }, 'Цель'],
      [t => Number(t.budget) || '', 'Бюджет, ₽'], ['result', 'ЦКП'], ['outcome', 'Результат'], ['desc', 'Описание'],
      [t => (t.createdAt ? isoOf(new Date(t.createdAt)) : ''), 'Создана'], [t => (t.doneAt ? isoOf(new Date(t.doneAt)) : ''), 'Готово'],
    ]);
  },
  salesCsv() {
    return this.csv(Sales.list(), [['id', 'Дата'], ['reach', 'Охват'], ['views', 'Просмотры'], ['clicks', 'Переходы'], ['regs', 'Регистрации'], ['pays', 'Оплаты'], ['renewals', 'Продления'], [s => revenueOf(s), 'Выручка, ₽'], ['experts', 'Эксперты'], ['mk', 'Мастер-классы'], ['note', 'Заметка'], [s => (s.by ? whoName(s.by) : ''), 'Внёс(ла)']]);
  },
  ledgerCsv() {
    return this.csv(Money.ledger(), [['date', 'Дата'], [e => (KINDS[e.kind] || {}).name || e.kind, 'Тип'], [e => catName(e.kind, e.cat), 'Статья'], [e => (e.kind === 'out' ? -1 : 1) * (Number(e.amount) || 0), 'Сумма, ₽'], ['note', 'Комментарий'], [e => (e.planId ? 'по плану' : ''), 'План'], [e => (e.by ? whoName(e.by) : ''), 'Кто']]);
  },

  },
  /* сохранить файл: в Claude — через площадку (человек подтверждает), иначе — обычной загрузкой */
  async save(filename, text) {
    let dl = null;
    try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({filename, data: text}); return true; }
      catch (e) { if (e && e.code === 'declined') return false; if (e && e.code === 'rate_limited') { toast('Окно сохранения уже открыто — подтвердите или закройте его'); return false; } }
    }
    try {
      const blob = new Blob([text], {type: filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return true;
    } catch (e) { toast('Браузер не дал сохранить файл', {error: true}); return false; }
  },
  parse(text) {
    const j = JSON.parse(text);
    const cols = j && (j.collections || j);
    if (!cols || typeof cols !== 'object') throw new Error('В файле нет данных штаба');
    const known = Object.keys(cols).filter(c => Store.COLS.includes(c) && cols[c] && typeof cols[c] === 'object' && !Array.isArray(cols[c]));
    if (!known.length) throw new Error('Это не выгрузка штаба: нет ни задач, ни людей, ни цифр');
    return {cols: Object.fromEntries(known.map(c => [c, cols[c]])), meta: j};
  },
  /* загрузить: «добавить и обновить» или «заменить» — только те коллекции, что есть в файле */
  async apply(cols, mode) {
    const me = (Auth.me() || {}).id;
    let n = 0;
    for (const c of Object.keys(cols)) {
      const docs = cols[c];
      Object.entries(docs).forEach(([id, d]) => { if (d && typeof d === 'object') { Store.put(c, id, d); n++; } });
      if (mode === 'replace') Store.all(c).filter(x => !(x.id in docs) && !(c === 'accounts' && x.id === me)).forEach(x => Store.remove(c, x.id));
    }
    await Store.flush();
    return n;
  },
};

function wirePortable(root) {
  on(root, 'click', '[data-pt]', async (e, b) => {
    const k = b.dataset.pt;
    let name, text;
    if (k === 'json') {
      const acc = !!($('#ptAcc', root) || {}).checked && Auth.isOwner();
      name = `eva-hq-${acc ? 'full' : 'data'}-${dayStamp()}.json`;
      text = JSON.stringify(Portable.snapshot({accounts: acc}), null, 1);
    } else {
      name = `eva-hq-${k}-${dayStamp()}.csv`;
      text = Portable[k + 'Csv']();
    }
    if (await Portable.save(name, text)) toast(`Файл ${name} — сохранён`);
  });
  const file = $('#ptFile', root);
  on(root, 'click', '[data-pt-import]', () => file && file.click());
  if (file) file.onchange = async () => {
    const f = file.files && file.files[0];
    file.value = '';
    if (!f) return;
    let parsed;
    try { parsed = Portable.parse(await f.text()); }
    catch (err) { toast('Не получилось прочитать файл: ' + (err.message || err), {error: true}); return; }
    importModal(parsed, f.name);
  };
}

/* картинка → квадрат 192 px в JPEG (≈15 КБ), чтобы не раздувать базу */
function shrinkImage(file, size) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    r.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

const Tour = {
  active: null,
  _timer: null,
  seen(page) { return !!Prefs.get('tour_' + page, false); },
  off() { return !!Prefs.get('tours_off', false); },
  can(page) {
    const me = Auth.me();
    return !!TOURS[page] && !window.__EVA_NOTOUR && !this.active && !this.off() && !this.seen(page) && !!me && me.welcomed !== false;
  },
  /* первый заход на страницу — тур через мгновение, если ничего не мешает;
     still() — та же ли страница и раздел, когда пришло время */
  maybe(page, still = () => true) {
    if (!this.can(page)) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      if (!this.can(page) || modalOpen() || $('.pop') || !still()) return;
      this.start(page);
    }, 800);
  },
  /* тур внутри окна: первая задача, первое собрание, панель Адама */
  inModal(page, within = '.modal') {
    if (!this.can(page)) return;
    setTimeout(() => { if (this.can(page) && $(within) && !$('.pop')) { this.start(page); if (this.active) this.active.within = within; } }, 450);
  },
  /* шаг с примером (demo) показываем и тогда, когда на странице такого ещё нет */
  steps(page) {
    return (TOURS[page] || []).filter(s => { const el = s.sel ? $(s.sel) : null; return (el && el.getClientRects().length) || s.demo; });
  },
  /* «Я всё знаю» — больше никаких туров; вернуть — на своей странице */
  disable() {
    this.stop(true);
    Prefs.setMany({tours_off: true, ...Object.fromEntries(Object.keys(TOURS).map(k => ['tour_' + k, true]))});
    toast('Туры выключены. Включить снова — на вашей странице: «Показать подсказки и туры снова»');
  },
  start(page, manual = false) {
    const steps = this.steps(page);
    if (!steps.length) { if (manual) toast('На этой странице пока нечего показывать'); return; }
    this.stop(false);
    const root = document.createElement('div');
    root.className = 'tour';
    root.innerHTML = '<div class="tour-hole"></div><div class="tour-pop" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(root);
    this.active = {page, steps, i: 0, root};
    this._key = e => {
      if (!this.active) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); this.stop(true); }
      if (e.key === 'ArrowRight') this.go(1);
      if (e.key === 'ArrowLeft') this.go(-1);
    };
    this._place = () => this.place();
    document.addEventListener('keydown', this._key, true);
    window.addEventListener('resize', this._place);
    window.addEventListener('scroll', this._place, true);
    on(root, 'click', '[data-tour-go]', (e, b) => this.go(Number(b.dataset.tourGo)));
    on(root, 'click', '[data-tour-end]', () => this.stop(true));
    on(root, 'click', '[data-tour-off]', () => this.disable());
    this.show();
  },
  go(d) {
    const a = this.active;
    if (!a) return;
    const i = a.i + d;
    if (i >= a.steps.length) { this.stop(true); toast('Готово! Тур можно повторить кнопкой «Тур по странице»'); return; }
    if (i < 0) return;
    a.i = i;
    this.show();
  },
  el(st) { const el = st.sel ? $(st.sel) : null; return el && el.getClientRects().length ? el : null; },
  show() {
    const a = this.active, st = a.steps[a.i], el = this.el(st);
    if (!el && !st.demo) { this.go(1); return; }
    if (el) el.scrollIntoView({block: 'center', inline: 'nearest'});
    const pop = $('.tour-pop', a.root);
    pop.innerHTML = `<div class="tour-n">${a.i + 1} из ${a.steps.length}</div>
      <b class="tour-t"></b><p class="tour-x"></p>${!el && st.demo ? `<div class="tour-ex"><span class="label">Как это выглядит</span>${st.demo}</div>` : ''}
      <div class="tour-btns"><button class="btn ghost sm" data-tour-end>Пропустить</button><span></span>
        ${a.i ? '<button class="btn sm" data-tour-go="-1">Назад</button>' : ''}
        <button class="btn primary sm" data-tour-go="1">${a.i === a.steps.length - 1 ? 'Понятно' : 'Дальше'}</button></div>
      ${a.i === 0 ? '<button class="link-btn tour-off" data-tour-off>Я всё знаю — больше не показывать подсказки</button>' : ''}`;
    $('.tour-t', pop).textContent = st.title;
    $('.tour-x', pop).textContent = st.text;
    this.place();
    setTimeout(() => { const b = $('[data-tour-go="1"]', pop); if (b) b.focus({preventScroll: true}); }, 30);
  },
  place() {
    const a = this.active;
    if (!a) return;
    /* окно, в котором шёл тур, закрыли — тур тоже заканчиваем */
    if (a.within && !$(a.within)) { this.stop(true); return; }
    const el = this.el(a.steps[a.i]);
    const hole = $('.tour-hole', a.root), pop = $('.tour-pop', a.root);
    /* шаг-пример без места на странице — окно по центру, без подсветки */
    hole.classList.toggle('none', !el);
    a.root.classList.toggle('center', !el);
    if (!el) {
      Object.assign(pop.style, {top: Math.max(8, (window.innerHeight - pop.offsetHeight) / 2) + 'px', left: Math.max(8, (window.innerWidth - pop.offsetWidth) / 2) + 'px'});
      return;
    }
    const r = el.getBoundingClientRect(), pad = 6;
    const top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
    const w = Math.min(window.innerWidth - left - 4, r.width + pad * 2), h = Math.min(window.innerHeight - top - 4, r.height + pad * 2);
    Object.assign(hole.style, {top: top + 'px', left: left + 'px', width: w + 'px', height: h + 'px'});
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let py = r.bottom + 12;
    if (py + ph > window.innerHeight - 8) py = r.top - ph - 12;
    if (py < 8) py = Math.min(window.innerHeight - ph - 8, Math.max(8, r.top + 12));
    const px = clamp(r.left + r.width / 2 - pw / 2, 8, window.innerWidth - pw - 8);
    Object.assign(pop.style, {top: py + 'px', left: px + 'px'});
  },
  stop(markSeen) {
    const a = this.active;
    if (!a) return;
    if (markSeen) Prefs.set('tour_' + a.page, true);
    a.root.remove();
    document.removeEventListener('keydown', this._key, true);
    window.removeEventListener('resize', this._place);
    window.removeEventListener('scroll', this._place, true);
    this.active = null;
  },
  reset() { Prefs.setMany({tours_off: false, ...Object.fromEntries(Object.keys(TOURS).map(k => ['tour_' + k, false]))}); },
};

/* Календарь команды. Google Календарь подключается через коннектор Claude
   (capability mcp) и работает от имени того, кто смотрит штаб:
   • каждый видит свои события с названиями — они не сохраняются в штабе;
   • в общую базу уходят только интервалы «занят» на 4 недели вперёд — без
     названий, мест и участников, — чтобы команда видела занятость друг
     друга и общие свободные окна;
   • собрание создаётся в Google Календаре организатора, участникам сразу
     приходит приглашение, а в штабе видно, кто принял.
   Без коннектора (GitHub Pages, другое окно) собрания живут в штабе —
   просто без приглашений. Время команды — московское. */

const GCAL = 'Google Calendar';
/* Созвоны из Eva CRM: CRM ставит их в Google Календарь того, кто назначил,
   с названием «CRM · …» и меткой #eva-crm в описании. Штаб узнаёт их по
   метке и рисует полупрозрачными — это чужие для штаба встречи, но время
   занято. Ссылка из описания ведёт прямо в карточку человека в CRM. */
const CRM_URL = 'https://claude.ai/artifact/3KRhRoeBVMY5cWps3oSASA';
const CRM_TAG = '#eva-crm';
const evCrm = ev => String(ev.description || '').includes(CRM_TAG) || /^CRM ·/.test(String(ev.summary || ''));

/* ── связь с Google ── */
const Cal = {
  api: undefined,
  conn: 'checking',     // checking · ready · prompt · denied · off · error

  hint: '',             // мягкая подсказка по списку коннекторов

  _init: null,

  init() {

      try {
        const lt = await this.api.listTools(GCAL);
        const srv = ((lt && lt.servers) || []).find(x => x.server === GCAL);
        if (srv && srv.authStatus === 'needs_reauth') this.setErr({code: 'needs_reauth'});

  usable() { return this.conn === 'ready' || this.conn === 'prompt'; },
  setErr(e) {

    if (!this.api) throw {code: 'capability_disabled'};

  /* тихое обновление занятости раз в полчаса — только если человек уже поделился и доступ дан */

/* ── события Google ── */
function evRange(ev) {
  const s = ev.start || {}, e = ev.end || {};
  if (s.dateTime) { const a = Date.parse(s.dateTime); return {start: a, end: Date.parse(e.dateTime || s.dateTime) || a, allDay: false}; }
  /* день события приходит и как «2026-10-10», и как «2026-10-10T00:00:00Z» — берём дату */
  if (s.date) { const d0 = String(s.date).slice(0, 10), d1 = e.date ? String(e.date).slice(0, 10) : addDays(d0, 1); return {start: tMs(d0, '00:00'), end: tMs(d1 > d0 ? d1 : addDays(d0, 1), '00:00'), allDay: true, d0, d1: d1 > d0 ? d1 : addDays(d0, 1)}; }
  return null;
}
const evType = ev => String(ev.eventType || '').toLowerCase().replace(/[_\s]/g, '');
/* занимает ли событие время: не «свободен», не отклонено, не место работы и не день рождения */
const evDeclined = ev => { const me = (ev.attendees || []).find(a => a.self); return !!(me && me.responseStatus === 'declined'); };
function evBusy(ev) {
  if (ev.transparency === 'transparent' || ev.availability === 'AVAILABILITY_FREE') return false;
  if (['workinglocation', 'birthday'].includes(evType(ev))) return false;
  return !evDeclined(ev);
}
function selfEmail(events) {
  for (const ev of events) {
    const a = (ev.attendees || []).find(x => x.self && x.email);
    if (a) return a.email;
    if (ev.organizer && ev.organizer.self && ev.organizer.email) return ev.organizer.email;
    if (ev.creator && ev.creator.self && ev.creator.email) return ev.creator.email;
  }
  return '';
}
function meetingOfEvent(ev) {
  const id = String(ev.id || ''), rid = String(ev.recurringEventId || '');
  return Store.all('meetings').find(m => m.gcalId && (id === m.gcalId || rid === m.gcalId || id.startsWith(m.gcalId + '_'))) || null;
}
/* кто принял приглашение: статусы участников из своей копии события */
function syncRsvp(events) {
  events.forEach(ev => {
    const m = meetingOfEvent(ev);
    if (!m || !Array.isArray(ev.attendees)) return;
    const resp = {}, gr = [];
    ev.attendees.forEach(a => {
      const p = personByEmail(a.email);
      if (p && a.responseStatus) resp[p.id] = a.responseStatus;
      else if (!p && a.email && a.responseStatus) gr.push([normEmail(a.email), a.responseStatus]);
    });
    const cur = m.responses || {};
    if (Object.keys(resp).some(k => cur[k] !== resp[k])) Store.patch('meetings', m.id, {responses: resp});
    /* ответы гостей не из команды — по почте (списком: в почте есть точки) */
    if (gr.length && JSON.stringify(gr) !== JSON.stringify(m.guestResp || [])) Store.patch('meetings', m.id, {guestResp: gr});
  });
}
const eventOf = res => (res && (res.event || res.createdEvent || res.updatedEvent)) || res || {};
function meetUrlOf(ev) {
  if (!ev) return '';
  if (ev.hangoutLink) return ev.hangoutLink;
  const ep = ((ev.conferenceData || {}).entryPoints || []).find(x => x.entryPointType === 'video' && x.uri);
  return ep ? ep.uri : (ev.meetUrl || ev.googleMeetUrl || '');
}

/* ── собрания штаба ── */
const Meetings = {
  all() { return Store.all('meetings').filter(m => m.date && m.start); },
  step(m) { return m.repeat === 'weekly' ? 7 : m.repeat === 'biweekly' ? 14 : 0; },
  /* вхождения в диапазон дат, с повторами */
  occ(from, to) {
    const out = [];
    this.all().forEach(m => {
      const step = this.step(m);
      if (!step) { if (m.date >= from && m.date <= to) out.push({m, date: m.date}); return; }
      let d = m.date;
      if (d < from) d = addDays(d, Math.ceil(daysBetween(d, from) / step) * step);
      for (; d <= to && d <= (m.until || Q.end); d = addDays(d, step)) out.push({m, date: d});
    });
    return out.map(o => { const s = tMs(o.date, o.m.start); return {...o, s, e: s + (Number(o.m.dur) || 60) * 60e3}; }).sort((a, b) => a.s - b.s);
  },
  next(m) { const t = today(); return this.occ(t, addDays(t, 120)).find(o => o.m.id === m.id && o.e > nowMs()) || null; },
  people(m) { return [m.organizer, ...(m.attendees || [])].filter((x, i, a) => x && a.indexOf(x) === i); },
  mine(m) { const pid = Auth.personId(); return !!pid && this.people(m).includes(pid); },
  when(m) {
    const step = this.step(m);
    const t = `${m.start}–${hmMs(tMs(m.date, m.start) + (Number(m.dur) || 60) * 60e3)}`;
    if (!step) return `${dayWd(m.date)}, ${t}`;
    const wd = ['по понедельникам', 'по вторникам', 'по средам', 'по четвергам', 'по пятницам', 'по субботам', 'по воскресеньям'][weekday(m.date)];
    return `${step === 7 ? '' : 'раз в две недели, '}${wd}, ${t}`;
  },
};

/* занятость человека за дни: интервалы Google (без названий) + собрания штаба */
function busyOf(pid, from, to) {
  const doc = Store.get('busy', pid);
  const shared = !!(doc && doc.share !== false && doc.from);
  const a = tMs(from, '00:00'), b = tMs(addDays(to, 1), '00:00');
  const list = [];
  if (shared) (doc.slots || []).forEach(([s, e]) => { if (e > a && s < b) list.push({s, e, kind: 'busy'}); });
  if (shared) (doc.crm || []).forEach(([s, e]) => { if (e > a && s < b) list.push({s, e, kind: 'crm'}); });
  Meetings.occ(from, to).forEach(o => {
    if (Meetings.people(o.m).includes(pid) && (o.m.responses || {})[pid] !== 'declined') list.push({s: o.s, e: o.e, kind: 'meet', m: o.m});
  });
  return {has: shared && doc.from <= from && doc.to >= to, shared, at: doc ? doc.at : 0, list: list.sort((x, y) => x.s - y.s)};
}
/* общие свободные окна: рабочие часы минус чья-то занятость */
function freeWindows(pids, date, wh, minDur = 30) {
  const d0 = tMs(date, '00:00');
  let lo = d0 + wh[0] * 36e5;
  const hi = d0 + wh[1] * 36e5, now = nowMs();
  if (hi <= now) return [];
  if (lo < now) lo = ceil15(now);
  const busy = mergeIv(pids.flatMap(pid => busyOf(pid, date, date).list.map(x => [x.s, x.e])));
  const out = [];
  let cur = lo;
  for (const [s, e] of busy) {
    if (e <= cur) continue;
    if (s >= hi) break;
    if (s - cur >= minDur * 60e3) out.push([cur, Math.min(s, hi)]);
    cur = Math.max(cur, e);
  }
  if (hi - cur >= minDur * 60e3) out.push([cur, hi]);
  return out;
}
/* ближайшие удобные начала для собрания */
function suggestSlots(pids, dur, wh, fromDate, n = 8) {
  const out = [];
  for (let i = 0, d = fromDate; i < 21 && out.length < n; i++, d = addDays(d, 1)) {
    if (weekday(d) > 4) continue;
    freeWindows(pids, d, wh, dur).forEach(([s, e]) => {
      for (let t = s, k = 0; t + dur * 60e3 <= e && k < 2 && out.length < n; t += 60 * 60e3, k++) out.push(t);
    });
  }
  return out;
}
/* кто занят в выбранное время */
function conflictsAt(pids, s, e, skipId) {
  const d = mskDate(s);
  return pids.map(pid => {
    const b = busyOf(pid, d, d);
    const hit = b.list.find(x => x.s < e && x.e > s && !(x.m && x.m.id === skipId));
    return hit ? {pid, hit} : (!b.has ? {pid, unknown: true} : null);
  }).filter(Boolean);
}

/* ── раскладка пересекающихся блоков в дорожки ── */
function lanes(items) {
  items.sort((a, b) => a.s - b.s || b.e - a.e);
  let group = [], ends = [], groupEnd = -Infinity;
  const finish = () => { const n = ends.length || 1; group.forEach(x => { x.lanes = n; }); };
  items.forEach(it => {
    if (it.s >= groupEnd && group.length) { finish(); group = []; ends = []; }
    let c = ends.findIndex(end => end <= it.s);
    if (c < 0) { c = ends.length; ends.push(0); }
    ends[c] = it.e;
    it.lane = c;
    group.push(it);
    groupEnd = Math.max(groupEnd, it.e);
  });
  if (group.length) finish();
  return items;
}

/* ── подключение ── */
function connCard() {
  const pid = Auth.personId();
  const doc = pid ? Store.get('busy', pid) : null;
  const shared = doc && doc.share !== false && doc.from;
  const p = personById(pid);
  if (Cal.conn === 'checking') return '<div class="cal-conn slim"><i class="dot"></i><span>Проверяю Google Календарь…</span></div>';
  if (Cal.conn === 'off') return `<div class="cal-conn slim off"><i class="dot"></i><span><b>Google Календарь подключается, когда штаб открыт в Claude.</b> Здесь собрания сохраняются в штабе и видны команде, но приглашения не уходят, а своя занятость не подтягивается.</span></div>`;
  if (Cal.conn === 'error' && Cal.err) return `<div class="cal-conn warn"><div>${icon('cal')}</div><div><b>Google Календарь не отвечает штабу</b><p>${esc(Cal.err.text)}</p></div><button class="btn sm" data-cal-retry>Проверить снова</button></div>`;
  if (Cal.conn === 'denied') return `<div class="cal-conn warn"><div>${icon('cal')}</div><div><b>Доступ к календарю не разрешён</b><p>Вы отказали в доступе в этот раз. Обновите страницу и нажмите «Разрешить», когда Claude спросит.</p></div></div>`;
  if (!pid) return '<div class="cal-conn slim off"><i class="dot"></i><span>Ваша учётка не связана с карточкой в «Команде» — занятость не с чем связать. Напишите основателю.</span></div>';
  if (!shared) return `<div class="cal-conn">
      <div>${icon('cal')}</div>
      <div><b>Подключите свой Google Календарь</b>
        <p>Вы увидите свои события в сетке недели, а команда — только интервалы «занят» на 4 недели вперёд. Названия, места и участники ваших встреч в штаб не попадают. Claude спросит разрешение на доступ — нажмите «Разрешить».</p>
        ${Cal.hint ? `<p class="warn-t">${esc(Cal.hint)}</p>` : ''}</div>
      <button class="btn primary" data-cal-connect ${Cal.syncing ? 'disabled' : ''}>${Cal.syncing ? 'Подключаю…' : 'Подключить мой Google Календарь'}</button>
    </div>`;
  const cid = myCalId(), im = inviteMail(p);
  return `<div class="cal-conn slim ok"><i class="dot"></i>
      <span><b>Google Календарь подключён</b> · календарь: ${esc(cid ? calName(cid) : (p && p.gcalEmail) || 'основной')} · приглашения: ${im.mail ? esc(im.mail) : '<b class="warn-t">почта не указана</b>'} <button class="link-btn" data-ctab="mail">изменить</button> · занятость ${Cal.syncing ? 'обновляется…' : 'обновлена ' + timeAgo(doc.at)}</span>
      <button class="btn xs ghost" data-cal-sync ${Cal.syncing ? 'disabled' : ''}>${icon('refresh')}Обновить</button>
      <button class="btn xs ghost" data-cal-stop>Не показывать занятость</button>
    </div>`;
}

/* ── неделя: свои события + собрания штаба ── */
function calWeekView(ws, nDays) {
  const t = today();
  const dates = Array.from({length: nDays}, (_, i) => addDays(ws, i));
  const H = CAL_H1 - CAL_H0;
  const wk = Cal.week[ws];
  const own = wk && wk.events ? wk.events.filter(ev => !meetingOfEvent(ev)) : [];
  CalUI.evs = new Map(own.map(ev => [String(ev.id), ev]));
  const occ = Meetings.occ(dates[0], dates[dates.length - 1]);
  const pct0 = ms => clamp((mskMin(ms) - CAL_H0 * 60) / (H * 60) * 100, 0, 100);
  const allDay = dates.map(d => own.filter(ev => { const r = evRange(ev); return r && r.allDay && r.d0 <= d && r.d1 > d && !evDeclined(ev); }));
  const hasAllDay = allDay.some(x => x.length);

  const col = (d, i) => {
    const a = tMs(d, hmOf(CAL_H0 * 60)), b = tMs(d, hmOf(CAL_H1 * 60));
    const items = [];
    own.forEach(ev => {
      const r = evRange(ev);
      if (!r || r.allDay || r.end <= a || r.start >= b || evDeclined(ev)) return;
      items.push({s: Math.max(r.start, a), e: Math.min(r.end, b), rs: r.start, re: r.end, ev, busy: evBusy(ev)});
    });
    occ.forEach(o => { if (o.date === d && o.e > a && o.s < b) items.push({s: Math.max(o.s, a), e: Math.min(o.e, b), rs: o.s, re: o.e, m: o.m}); });
    lanes(items);
    const blocks = items.map(it => {
      const top = pct0(it.s), h = Math.max(pct0(it.e) - top, 2.2);
      const style = `top:${top.toFixed(2)}%;height:${h.toFixed(2)}%;left:calc(${(it.lane / it.lanes * 100).toFixed(2)}% + 2px);width:calc(${(100 / it.lanes).toFixed(2)}% - 4px)`;
      const time = `${hmMs(it.rs)}–${hmMs(it.re)}`;
      const short = it.e - it.s <= 35 * 60e3 ? ' short' : '';
      if (it.m) {
        const mine = Meetings.mine(it.m);
        return `<button class="cw-ev meet${short} ${mine ? 'mine' : ''}" style="${style}" data-meet="${it.m.id}" title="${esc(it.m.title)} · ${time}"><b>${esc(it.m.title)}</b><small>${time}${it.m.meetUrl ? ' · Meet' : ''}</small></button>`;
      }
      const title = it.ev.summary || 'Без названия';
      if (evCrm(it.ev)) return `<a class="cw-ev own crm${short}" style="${style}" href="${esc(crmLinkOf(it.ev))}" target="_blank" rel="noopener" title="${esc(title)} · ${time} · открыть в CRM"><b>${esc(title.replace(/^CRM · /, ''))}</b><small>${time} · CRM</small></a>`;
      return `<button type="button" class="cw-ev own${short} ${it.busy ? '' : 'free'}" style="${style}" data-gev="${esc(it.ev.id)}" title="${esc(title)} · ${time}${it.busy ? '' : ' · не занимает время'}"><b>${esc(title)}</b><small>${time}</small></button>`;
    }).join('');
    const nowLine = d === t && mskDate(nowMs()) === d ? `<i class="cw-now" style="top:${pct0(nowMs()).toFixed(2)}%"></i>` : '';
    const offHours = `<i class="cw-off" style="top:0;height:${((10 - CAL_H0) / H * 100).toFixed(2)}%"></i><i class="cw-off" style="top:${((19 - CAL_H0) / H * 100).toFixed(2)}%;bottom:0"></i>`;
    return `<div class="cw-col ${weekday(d) > 4 ? 'we' : ''} ${d < t ? 'past' : ''}" data-date="${d}">${offHours}${blocks}${nowLine}</div>`;
  };

  let status = '';
  if (Cal.conn === 'ready' || Cal.conn === 'prompt') {
    if (!wk) status = Cal.conn === 'ready' ? 'Загружаю ваши события…' : 'Свои события появятся после подключения Google Календаря.';
    else if (wk.loading) status = 'Загружаю ваши события…';
    else if (wk.err) status = wk.err.text;
    else status = `Ваших событий: ${own.length} · собраний штаба: ${occ.length}`;
  } else status = `Собраний штаба на неделе: ${occ.length}`;

  const crmN = crmCalls(tMs(dates[0], '00:00'), tMs(addDays(dates[dates.length - 1], 1), '00:00')).length;
  return `<div class="cal-legend"><span><i class="lg-own"></i>ваши события из Google</span><span><i class="lg-crm"></i>созвоны CRM${crmN ? ` · ${crmN}` : ''}</span><span><i class="lg-meet"></i>собрания штаба</span><span><i class="lg-off"></i>вне рабочих часов</span><span class="note">${esc(status)}</span></div>
    <div class="cal-wrap"><div class="cal-week" style="--days:${nDays}">
      <div class="cw-corner"></div>
      ${dates.map(d => `<div class="cw-dh ${d === t ? 'is-today' : ''} ${weekday(d) > 4 ? 'we' : ''}"><span>${WD_SH[weekday(d)]}</span><b>${Number(d.slice(8))}</b><small>${MONTHS_SH[dateOf(d).getMonth()]}</small></div>`).join('')}
      ${hasAllDay ? `<div class="cw-adl">весь день</div>${allDay.map(list => `<div class="cw-ad">${list.map(ev => `<button type="button" class="cw-adi" data-gev="${esc(ev.id)}" title="${esc(ev.summary || '')}">${esc(ev.summary || 'Событие')}</button>`).join('')}</div>`).join('')}` : ''}
      <div class="cw-times">${Array.from({length: H}, (_, i) => `<span style="top:${(i / H * 100).toFixed(2)}%">${pad(CAL_H0 + i)}:00</span>`).join('')}</div>
      ${dates.map(col).join('')}
    </div></div>
    ${Auth.can('tasks.edit') ? '<p class="note">Нажмите на свободное место в сетке — откроется новое собрание на это время.</p>' : ''}`;
}
function calWireWeek(root) {
  on(root, 'click', '[data-gev]', (e, el) => { e.stopPropagation(); const ev = CalUI.evs && CalUI.evs.get(el.dataset.gev); if (ev) openGEvent(ev); });
  if (!Auth.can('tasks.edit')) return;
  on(root, 'click', '.cw-col', (e, el) => {
    if (e.target.closest('.cw-ev')) return;
    const r = el.getBoundingClientRect();
    const min = CAL_H0 * 60 + (e.clientY - r.top) / r.height * (CAL_H1 - CAL_H0) * 60;
    const start = clamp(Math.floor(min / 30) * 30, CAL_H0 * 60, CAL_H1 * 60 - 30);
    openMeeting(null, {date: el.dataset.date, start: hmOf(start)});
  });
}

/* ── занятость команды: люди × часы одного дня ── */
function calTeamView(ws) {
  const t = today();
  const days = Array.from({length: 7}, (_, i) => addDays(ws, i));
  let day = CalUI.day && days.includes(CalUI.day) ? CalUI.day : (days.includes(t) ? t : days[0]);
  CalUI.day = day;
  const wh = View.get('cal.wh', [10, 19]);
  const all = calPeople();
  let sel = View.get('cal.sel', null);
  sel = (sel || all.map(p => p.id)).filter(id => all.some(p => p.id === id));
  const H = CAL_H1 - CAL_H0;
  const px = ms => clamp((mskMin(ms) - CAL_H0 * 60) / (H * 60) * 100, 0, 100);
  const withData = sel.filter(pid => busyOf(pid, day, day).has);
  const noData = sel.filter(pid => !withData.includes(pid));
  const free = weekday(day) > 4 && !View.get('cal.we', false) ? [] : freeWindows(withData, day, wh, 30);
  const d0 = tMs(day, '00:00');

  const seg = (s, e, cls, attrs = '', inner = '') => {
    const a = Math.max(s, d0 + CAL_H0 * 36e5), b = Math.min(e, d0 + CAL_H1 * 36e5);
    if (b <= a) return '';
    const l = px(a), w = Math.max(px(b) - l, .8);
    return `<span class="${cls}" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%" ${attrs}>${inner}</span>`;
  };
  const offHours = `<i class="ct-off" style="left:0;width:${((wh[0] - CAL_H0) / H * 100).toFixed(2)}%"></i><i class="ct-off" style="left:${((wh[1] - CAL_H0) / H * 100).toFixed(2)}%;right:0"></i>`;
  const now = nowMs();
  const nowLine = mskDate(now) === day ? `<i class="ct-now" style="left:${px(now).toFixed(2)}%"></i>` : '';
  const rows = sel.map(pid => {
    const p = personById(pid);
    const b = busyOf(pid, day, day);
    const stale = b.shared && b.at && Date.now() - b.at > 3 * 864e5;
    const blocks = b.list.map(x => x.kind === 'meet'
      ? seg(x.s, x.e, 'ct-b meet', `data-meet="${x.m.id}" title="${esc(x.m.title)} · ${hmMs(x.s)}–${hmMs(x.e)}"`, `<em>${esc(x.m.title)}</em>`)
      : x.kind === 'crm' ? seg(x.s, x.e, 'ct-b crm', `title="Созвон CRM · ${hmMs(x.s)}–${hmMs(x.e)}"`, '<em>CRM</em>')
      : seg(x.s, x.e, 'ct-b busy', `title="Занят · ${hmMs(x.s)}–${hmMs(x.e)}"`)).join('');
    return `<div class="ct-row ${b.has ? '' : 'nodata'}">
      <a class="ct-name" href="#p-${pid}">${avatar(p)}<span><b>${esc(firstName(p))}</b><small>${b.has ? (stale ? 'обновлено ' + timeAgo(b.at) : 'календарь подключён') : 'нет данных календаря'}</small></span></a>
      <div class="ct-track" data-pid="${pid}">${offHours}${blocks}${nowLine}</div></div>`;
  }).join('');

  return `<div class="ct-days">${days.map(d => {
      const n = freeWindows(withData, d, wh, 30).length;
      return `<button data-cday="${d}" class="${d === day ? 'on' : ''} ${d < t ? 'past' : ''}"><span>${WD_SH[weekday(d)]}, ${dayShort(d)}</span><small>${d < t ? '' : weekday(d) > 4 && !View.get('cal.we', false) ? 'выходной' : n ? `${n} ${plural(n, 'окно', 'окна', 'окон')}` : 'нет окон'}</small></button>`;
    }).join('')}</div>
    <div class="ct-tools">

function calWireTeam(root) {
  on(root, 'click', '[data-cday]', (e, el) => { CalUI.day = el.dataset.cday; App.render(); });
  const all = calPeople().map(p => p.id);
  const cur = () => (View.get('cal.sel', null) || all).filter(id => all.includes(id));
  on(root, 'click', '[data-sel]', (e, el) => {
    const s = new Set(cur());
    if (s.has(el.dataset.sel)) s.delete(el.dataset.sel); else s.add(el.dataset.sel);
    View.set('cal.sel', [...s]);
    App.render();
  });
  on(root, 'click', '[data-sel-all]', () => { View.set('cal.sel', cur().length === all.length ? [] : all); App.render(); });
  const whF = $('#whFrom', root), whT = $('#whTo', root);
  const setWh = () => { const a = Number(whF.value), b = Math.max(a + 1, Number(whT.value)); View.set('cal.wh', [a, b]); App.render(); };
  if (whF) { whF.onchange = setWh; whT.onchange = setWh; }
  const we = $('#ctWe', root);
  if (we) we.onchange = () => { View.set('cal.we', we.checked); App.render(); };
  if (!Auth.can('tasks.edit')) return;
  on(root, 'click', '[data-free]', (e, el) => {
    e.stopPropagation();
    const s = Number(el.dataset.free);
    openMeeting(null, {date: mskDate(s), start: hmMs(s), attendees: cur().filter(id => id !== Auth.personId())});
  });
  on(root, 'click', '.ct-track[data-pid], .ct-free .ct-track', (e, el) => {
    if (e.target.closest('.ct-b')) return;
    const r = el.getBoundingClientRect();
    const min = CAL_H0 * 60 + (e.clientX - r.left) / r.width * (CAL_H1 - CAL_H0) * 60;
    const start = clamp(Math.floor(min / 30) * 30, CAL_H0 * 60, CAL_H1 * 60 - 30);
    openMeeting(null, {date: CalUI.day, start: hmOf(start), attendees: cur().filter(id => id !== Auth.personId())});
  });
}

/* ── список собраний ── */
function upcomingMeetings() {
  const now = nowMs();
  return Meetings.all().map(m => ({m, o: Meetings.next(m)})).filter(x => x.o && x.o.e > now).sort((a, b) => a.o.s - b.o.s);
}
function inviteState(m) {
  if (m.invite === 'sent') return `<span class="pill good" title="${esc((m.sentTo || []).join(', '))}">приглашения ушли${m.sentTo ? ': ' + m.sentTo.length : ''}</span>`;
  if (m.invite === 'sending') return '<span class="pill warn">отправляю…</span>';
  if (m.invite === 'unknown') return '<span class="pill warn" title="Google не ответил вовремя">не ясно, создалось ли</span>';
  if (m.invite === 'failed') return `<span class="pill bad" title="${esc(CAL_ERR[m.inviteErr] || m.inviteErr || '')}">приглашения не ушли</span>`;
  return '<span class="pill line">только в штабе</span>';
}
function meetRow(m, o) {
  const pid = Auth.personId();
  const org = personById(m.organizer);
  const isOrg = m.organizer === pid;
  const resp = m.responses || {};
  const ppl = Meetings.people(m).map(id => {
    const p = personById(id);
    const st = id === m.organizer ? 'accepted' : resp[id] || (m.invite === 'sent' ? 'needsAction' : '');
    const r = RSVP[st];
    return `<span class="mt-p ${r ? r.tone : ''}" title="${esc(personName(p))}${id === m.organizer ? ' · организатор' : r ? ' · ' + r.name : ''}">${avatar(p)}${r && id !== m.organizer ? `<i>${r.mark}</i>` : ''}</span>`;
  }).join('');
  const guests = Math.max((m.extGuests || []).length, (m.guests || []).length);
  const actions = [];
  if (m.meetUrl) actions.push(`<a class="btn xs" href="${esc(m.meetUrl)}" target="_blank" rel="noopener">${icon('video')}Meet</a>`);
  if (m.link) actions.push(`<a class="btn xs ghost" href="${esc(m.link)}" target="_blank" rel="noopener">${icon('ext')}Google</a>`);
  if (isOrg && m.invite === 'unknown' && Cal.usable()) actions.push(`<button class="btn xs" data-verify="${m.id}">Проверить в Google</button>`);
  if (isOrg && m.invite === 'failed' && Cal.usable()) actions.push(`<button class="btn xs primary" data-push="${m.id}">Отправить приглашения</button>`);
  if (isOrg && (!m.invite || m.invite === 'none') && Cal.usable()) actions.push(`<button class="btn xs" data-push="${m.id}">Отправить в Google</button>`);
  if ((isOrg || Auth.isOwner()) && o && (m.extGuests || []).some(g => g.tg)) actions.push(`<button class="btn xs" data-remind="${m.id}" title="Напомнить гостям в Telegram">${icon('bell')}Напомнить</button>`);
  if (isOrg || Auth.isOwner()) actions.push(`<button class="btn xs ghost" data-cancel-meet="${m.id}">${m.gcalId && isOrg && !m.gcalReadonly ? 'Отменить' : 'Удалить'}</button>`);
  return `<div class="mt-row ${Meetings.mine(m) ? 'mine' : ''}">
    <div class="mt-when"><b>${o ? hmMs(o.s) : m.start}</b><small>${o ? dayWd(o.date) : dayWd(m.date)}</small></div>
    <button class="mt-main" data-meet="${m.id}"><b>${esc(m.title)}</b>
      <small>${Meetings.step(m) ? esc(REPEATS[m.repeat]) + ' · ' : ''}${m.dur} мин · организатор ${esc(org ? firstName(org) : '—')}${guests ? ` · гостей: ${guests}` : ''}</small>
      ${m.agenda ? `<span class="mt-agenda">${esc(m.agenda.split('\n')[0]).slice(0, 140)}</span>` : ''}</button>
    <div class="mt-ppl">${ppl}</div>
    <div class="mt-st">${inviteState(m)}</div>
    <div class="mt-act">${actions.join('')}</div>
  </div>`;
}
function calListView() {

/* ── окно собрания ── */
function nextWorkday() {
  const now = nowMs();
  let d = today();
  if (mskMin(now) > 17 * 60 || weekday(d) > 4) d = addDays(d, 1);
  while (weekday(d) > 4) d = addDays(d, 1);
  return d;
}

function openMeeting(id, preset = {}) {
  const m = id ? Store.get('meetings', id) : null;
  const me = Auth.personId();
  if (!m && !Auth.can('tasks.edit')) return;
  const isOrg = !m || m.organizer === me;
  const canEdit = !m || isOrg || Auth.isOwner();
  const inGoogle = !!(m && m.gcalId);
  const d = {title: '', date: nextWorkday(), start: '11:00', dur: 60, attendees: [], guests: [], extGuests: [], agenda: '', meet: true, repeat: '', remindMin: 60, ...(m ? clone(m) : {}), ...preset};
  const organizer = m ? m.organizer : me;
  d.attendees = (d.attendees || []).filter(x => x !== organizer);
  const all = calPeople();
  const times = [];
  for (let x = 7 * 60; x <= 22 * 60; x += 15) times.push(hmOf(x));
  if (!times.includes(d.start)) times.push(d.start);
  times.sort();
  /* событие чужого календаря, перенесённое в штаб, в Google меняет только его организатор */
  const google = Cal.usable() && !(m && m.gcalReadonly);
  const orgP = personById(organizer);
  /* гости не из команды: имя, почта для приглашения, Telegram для напоминания */
  const gList = (d.extGuests || []).map(g => ({...g}));
  (d.guests || []).forEach(mail => { if (!gList.some(g => normEmail(g.email) === normEmail(mail))) gList.push({id: uid(), name: '', email: mail, tg: ''}); });
  const prevG = new Map(gList.map(g => [g.id, g]));
  const gResp = new Map((d.guestResp || []).map(([mail, st]) => [mail, st]));

  if (m && !canEdit) {
    /* участник смотрит собрание */
    const o = Meetings.next(m);
    openModal({
      title: m.title,
      body: `<div class="mt-view">
        <p><b>${o ? `${dayWd(o.date)}, ${hmMs(o.s)}–${hmMs(o.e)}` : Meetings.when(m)}</b>${Meetings.step(m) ? ` · ${esc(REPEATS[m.repeat].toLowerCase())}` : ''}</p>
        <p class="note">Организатор — ${esc(personName(orgP))}. ${m.invite === 'sent' ? 'Приглашение пришло вам в Google Календарь — ответьте там, ответ появится в штабе.' : 'Собрание сохранено в штабе.'}</p>
        ${m.agenda ? `<div class="mt-agenda-full">${esc(m.agenda)}</div>` : ''}
        <div class="mt-ppl big">${Meetings.people(m).map(id => { const p = personById(id); const r = RSVP[(m.responses || {})[id] || '']; return `<span class="mt-pl">${avatar(p)}${esc(firstName(p))}${id === m.organizer ? ' <small>организатор</small>' : r ? ` <small class="${r.tone}">${r.name}</small>` : ''}</span>`; }).join('')}</div>
        ${gList.length ? `<p class="note">Гости: ${gList.map(g => esc(g.name || g.email || tgShow(g.tg))).join(', ')}</p>` : ''}
        <div class="row">${m.meetUrl ? `<a class="btn primary" href="${esc(m.meetUrl)}" target="_blank" rel="noopener">${icon('video')}Войти в Google Meet</a>` : ''}${m.link ? `<a class="btn" href="${esc(m.link)}" target="_blank" rel="noopener">${icon('ext')}Открыть в Google</a>` : ''}</div>
      </div>`,
      foot: '<button class="btn" data-close>Закрыть</button>',
    });
    return;
  }

  const chip = (p, on = d.attendees.includes(p.id)) => {
    const mail = inviteEmail(p);
    return `<button type="button" class="chip mt-chip ${on ? 'on' : ''} ${mail ? '' : 'nomail'}" data-att="${p.id}" title="${mail ? esc(mail) : 'нет почты — приглашение не придёт; впишите её ниже или во вкладке «Почты»'}">${avatar(p)}${esc(firstName(p))}${mail ? '' : ' <span class="mt-nomail">нет почты</span>'}</button>`;
  };
  const foot = `${m && canEdit ? `<button class="btn ghost danger left" id="mtDel">${inGoogle && isOrg && !m.gcalReadonly ? 'Отменить собрание' : 'Удалить'}</button>` : ''}
    ${m && gList.some(g => g.tg) ? `<button class="btn ghost" id="mtRemindNow">${icon('bell')}Напомнить гостям</button>` : ''}
    <button class="btn" data-close>Отмена</button>
    <button class="btn primary" id="mtSave">${m ? 'Сохранить' : 'Создать собрание'}</button>`;

  openModal({
    title: m ? 'Собрание' : 'Новое собрание',
    wide: true,

      const paintMail = () => {

      });

      on(el, 'click', '[data-slot]', (e, b) => {
        const t = Number(b.dataset.slot);
        $('#mtDate', el).value = mskDate(t);
        const hm = hmMs(t), sel = $('#mtStart', el);
        if (![...sel.options].some(o => o.value === hm)) sel.add(new Option(hm, hm));

      on(el, 'click', '#mtAskG', async (e, b) => {
        const v = val();
        const emails = [organizer, ...v.attendees].map(pid => inviteEmail(personById(pid))).filter(Boolean).concat(v.guests);

        b.disabled = true;
        box.innerHTML = '<span class="note">Спрашиваю Google…</span>';
        const wh = View.get('cal.wh', [10, 19]);

        try {
          const res = await Cal.call('suggest_time', {
            attendeeEmails: emails, startTime: isoMs(ceil15(from)), endTime: isoMs(tMs(addDays(today(), 10), '23:00')),
            durationMinutes: v.dur, timeZone: TZ, preferences: {startHour: hmOf(wh[0] * 60), endHour: hmOf(wh[1] * 60), excludeWeekends: true, pageSize: 6},
          }, true);
          /* Google отдаёт свободные периоды целиком: показываем диапазон, клик ставит начало */
          const list = ((res && (res.timeSlots || res.slots)) || []).map(x => ({s: Date.parse(x.startTime || (x.start || {}).dateTime), e: Date.parse(x.endTime || (x.end || {}).dateTime)})).filter(x => x.s);
          box.innerHTML = list.length
            ? `<span class="label">Google: свободно</span>${list.map(x => `<button type="button" class="chip" data-slot="${x.s}">${dayWd(mskDate(x.s))}, ${hmMs(x.s)}${x.e && mskDate(x.e) === mskDate(x.s) ? '–' + hmMs(x.e) : ''}</button>`).join('')}<small class="note">учтены календари, которые Google вам показывает</small>`
            : '<span class="note">Google не нашёл общего окна на ближайшие 10 дней.</span>';
        } catch (err) {
          box.innerHTML = `<span class="note bad">${esc(calErr(err).text)}</span>`;
        }
        b.disabled = false;
      });
      ['#mtDate', '#mtStart'].forEach(s => { $(s, el).onchange = paint; });
      $('#mtGAdd', el).onclick = () => {
        const g = {id: uid(), name: '', email: '', tg: ''};
        $('#mtGuests', el).insertAdjacentHTML('beforeend', guestRow(g));

      };
      on(el, 'click', '[data-g-del]', (e, b) => b.closest('.mt-g').remove());
      on(el, 'change', '.mt-g input', (e, i) => { i.classList.remove('bad'); });
      const rn = $('#mtRemindNow', el);
      if (rn) rn.onclick = () => { close(); remindGuests(m.id); };
      const del = $('#mtDel', el);
      if (del) del.onclick = async () => { if (await cancelMeeting(m.id, del)) close(); };
      $('#mtSave', el).onclick = async () => {
        const v = val();
        if (!v.title) { $('#mtTitle', el).focus(); toast('Напишите название собрания'); return; }
        if (!v.date || !v.start) { toast('Выберите дату и время'); return; }
        /* гостям: почта — как почта, Telegram — @имя или номер */
        let badG = 0;
        $$('.mt-g', el).forEach(r => {
          const em = $('[data-gf="email"]', r), tg = $('[data-gf="tg"]', r);
          if (em.value.trim() && !EMAIL_RE.test(em.value.trim())) { em.classList.add('bad'); badG++; }
          if (tg.value.trim() && !normTg(tg.value)) { tg.classList.add('bad'); badG++; }
        });
        if (badG) { toast('Проверьте гостей: почта вида name@mail.ru, Telegram — @имя или номер телефона'); return; }
        const send = $('#mtSend', el).checked && !$('#mtSend', el).disabled;

          Store.put('meetings', nid, {...body, organizer, calId: myCalId() || null, by: Auth.me().id, at: Date.now(), invite: send ? 'sending' : 'none'});
          close();
          if (send) await pushMeeting(nid); else toast('Собрание сохранено в штабе');

        Store.patch('meetings', m.id, {...body, guests: v.guests, attendees: v.attendees, extGuests: v.extGuests, editedAt: Date.now()});
        close();
        if (send && before.gcalId && isOrg) await updateInGoogle(m.id, before);
        else if (send && !before.gcalId) await pushMeeting(m.id);
        else toast('Собрание обновлено');
      };
    },
  });
}

/* участники для Google: почты команды и гости. Хозяину календаря, в котором
   создаётся событие, приглашение не нужно; если организатор вписал для
   календаря другую почту — пригласим и её, чтобы собрание было и там. */
function inviteList(m) {
  const seen = new Set(), out = [];
  const org = personById(m.organizer);
  const host = normEmail(EMAIL_RE.test(m.calId || '') ? m.calId : (org && org.gcalEmail) || (m.organizer === Auth.personId() ? Cal.hostEmail : ''));
  const add = (mail, name) => {
    const k = normEmail(mail);
    if (!mail || seen.has(k) || k === host) return;
    seen.add(k);
    out.push(name ? {email: mail, displayName: name} : {email: mail});
  };
  if (org && host) add(inviteEmail(org), personName(org));
  (m.attendees || []).forEach(pid => { const p = personById(pid); add(inviteEmail(p), personName(p)); });
  (m.guests || []).forEach(mail => { const g = (m.extGuests || []).find(x => normEmail(x.email) === normEmail(mail)); add(mail, g && g.name); });
  return out;
}
/* название календаря для подписи */
function calName(id) {
  const c = (Cal.calendars || []).find(x => x.id === id);
  return c ? c.name + (c.name !== id && EMAIL_RE.test(id) ? ` (${id})` : '') : id;
}
function descOf(m) {
  return `${m.agenda ? m.agenda + '\n\n' : ''}Собрание из штаба Eva Club.`;
}
function rruleOf(m) {
  return `RRULE:FREQ=WEEKLY;${m.repeat === 'biweekly' ? 'INTERVAL=2;' : ''}UNTIL=${(m.until || Q.end).replace(/-/g, '')}T205959Z`;
}

/* создать событие в Google Календаре организатора — приглашения уходят сами */
async function pushMeeting(id) {
  const m = Store.get('meetings', id);
  if (!m) return;
  const att = inviteList(m);
  const s = tMs(m.date, m.start), e = s + (Number(m.dur) || 60) * 60e3;
  Store.patch('meetings', id, {invite: 'sending', inviteErr: null});
  const input = {
    summary: m.title, startTime: isoMs(s), endTime: isoMs(e), timeZone: TZ,
    attendees: att, description: descOf(m), addGoogleMeetUrl: !!m.meet,
    notificationLevel: 'ALL', useDefaultReminders: true,
  };
  if (m.calId) input.calendarId = m.calId;
  if (m.repeat) input.recurrenceData = [rruleOf(m)];
  try {
    const ev = eventOf(await Cal.call('create_event', input));
    Store.patch('meetings', id, {invite: 'sent', gcalId: ev.id || ev.eventId || null, link: ev.htmlLink || null, meetUrl: meetUrlOf(ev) || null, sentTo: att.map(a => a.email), sentAt: Date.now()});
    toast(att.length ? `Собрание в Google Календаре, приглашения ушли: ${att.length}` : 'Собрание добавлено в ваш Google Календарь');
  } catch (err) {
    const x = calErr(err);
    Store.patch('meetings', id, {invite: x.ambiguous ? 'unknown' : 'failed', inviteErr: x.code});
    toast(x.ambiguous ? 'Google не ответил вовремя. Проверьте календарь, прежде чем отправлять ещё раз — кнопка «Проверить в Google» в «Собраниях».' : x.text, {error: true});
  }
}
/* поменять время, название, участников — Google сам разошлёт обновление */
async function updateInGoogle(id, before) {
  const m = Store.get('meetings', id);
  if (!m || !m.gcalId) return;
  const now = inviteList(m).map(a => a.email);
  const was = before.sentTo || inviteList(before).map(a => a.email);
  const lower = x => x.map(normEmail);
  const added = inviteList(m).filter(a => !lower(was).includes(normEmail(a.email)));
  const removed = was.filter(x => !lower(now).includes(normEmail(x)));
  const s = tMs(m.date, m.start), e = s + (Number(m.dur) || 60) * 60e3;
  const input = {eventId: m.gcalId, summary: m.title, description: descOf(m), startTime: isoMs(s), endTime: isoMs(e), timeZone: TZ, notificationLevel: 'ALL'};
  if (m.calId) input.calendarId = m.calId;
  if (added.length) input.addedAttendees = added;
  if (removed.length) input.removedAttendeeEmails = removed;
  if (m.meet && !m.meetUrl) input.addGoogleMeetUrl = true;
  try {
    const ev = eventOf(await Cal.call('update_event', input));
    Store.patch('meetings', id, {invite: 'sent', sentTo: now, sentAt: Date.now(), meetUrl: meetUrlOf(ev) || m.meetUrl || null, link: ev.htmlLink || m.link || null});
    toast('Собрание обновлено, участникам ушло изменение');
  } catch (err) {
    const x = calErr(err);
    toast(x.ambiguous ? 'Google не ответил вовремя — проверьте событие в календаре.' : 'В штабе поменяли, в Google — нет. ' + x.text, {error: true});
  }
}
/* после неясного ответа: ищем событие в своём календаре, прежде чем создавать заново */
async function verifyMeeting(id) {
  const m = Store.get('meetings', id);
  if (!m) return;
  try {
    const list = await Cal.events(m.date, m.date);
    const s = tMs(m.date, m.start);
    const ev = list.find(x => x.summary === m.title && Math.abs((evRange(x) || {}).start - s) < 60e3);
    if (ev) {
      Store.patch('meetings', id, {invite: 'sent', gcalId: String(ev.recurringEventId || ev.id), link: ev.htmlLink || null, meetUrl: meetUrlOf(ev) || null, sentTo: inviteList(m).map(a => a.email), sentAt: Date.now()});
      toast('Нашёл событие в Google — приглашения ушли');
    } else {
      Store.patch('meetings', id, {invite: 'failed', inviteErr: 'not_found'});
      toast('В Google такого события нет — можно отправить приглашения ещё раз');
    }
  } catch (err) { toast(calErr(err).text, {error: true}); }
}
/* отменить: у организатора — через Google (участникам придёт отмена), иначе — только из штаба */
async function cancelMeeting(id, anchor) {
  const m = Store.get('meetings', id);
  if (!m) return false;
  const isOrg = m.organizer === Auth.personId();
  if (m.gcalId && isOrg && !m.gcalReadonly && Cal.conn !== 'off') {
    if (!(await confirmPop(anchor, {text: 'Отменить собрание? Участникам придёт отмена в Google Календаре.', yes: 'Да, отменить', danger: true}))) return false;
    try {
      await Cal.call('delete_event', m.calId ? {eventId: m.gcalId, calendarId: m.calId, notificationLevel: 'ALL'} : {eventId: m.gcalId, notificationLevel: 'ALL'});
      Store.remove('meetings', id);
      toast('Собрание отменено, участникам ушла отмена');
      return true;
    } catch (err) {
      const x = calErr(err);
      if (x.code !== 'tool_error') { toast(x.ambiguous ? 'Google не ответил вовремя — проверьте календарь, прежде чем отменять ещё раз.' : x.text, {error: true}); return false; }
      if (!(await confirmPop(anchor, {text: `Google не отменил событие (${x.text.replace('Google ответил ошибкой: ', '')}). Удалить собрание только из штаба?`, yes: 'Удалить из штаба', danger: true}))) return false;
      Store.remove('meetings', id);
      return true;
    }
  }
  const org = personById(m.organizer);
  const text = m.gcalReadonly ? 'Удалить из штаба? В Google Календаре событие останется.' : m.gcalId && !isOrg ? `Удалить из штаба? В Google Календаре собрание отменит только организатор — ${personName(org)}.` : 'Удалить собрание?';
  if (!(await confirmPop(anchor, {text, yes: 'Удалить', danger: true}))) return false;
  const copy = clone(m);
  Store.remove('meetings', id);
  toast('Собрание удалено', {undo: () => Store.put('meetings', copy.id, copy)});
  return true;
}

/* созвоны CRM за период: по занятости всей команды (у кого подключён
   календарь) и по своим событиям в этом окне; одинаковые — один раз */
function crmCalls(a, b) {
  const seen = new Set(), out = [];
  const add = (s, e) => { const k = s + ':' + e; if (e > a && s < b && !seen.has(k)) { seen.add(k); out.push([s, e]); } };
  Store.all('busy').forEach(doc => { if (doc && doc.share !== false) (doc.crm || []).forEach(([s, e]) => add(s, e)); });
  Object.values(Cal.week).forEach(w => (w && w.events || []).filter(evCrm).forEach(ev => { const r = evRange(ev); if (r && !r.allDay) add(r.start, r.end); }));
  return out.sort((x, y) => x[0] - y[0]);
}
const crmWeek = () => { const ws = weekStart(today()); return crmCalls(tMs(ws, '00:00'), tMs(addDays(ws, 7), '00:00')); };
function crmTodayHtml() {
