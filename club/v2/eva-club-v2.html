        <button class="chip ${f.late ? 'on' : ''}" data-late>Просрочено <b>${lateN}</b></button>
        ${reviewN ? `<span class="pill gold">${reviewN} на проверке</span>` : ''}
        ${view !== 'board' ? `<label class="check t-done-t"><input type="checkbox" id="fDone" ${f.done ? 'checked' : ''}>Показывать готовые</label>` : ''}
      </div>
      <div id="taskView"></div>`;

    const box = $('#taskView', root);
    if (view === 'month') renderTaskMonths(box, list);
    else if (view === 'week') renderTaskWeeks(box, list);
    else if (view === 'list') renderTaskList(box, list);
    else renderTaskBoard(box, list);

    wireHelp(root);
    on(root, 'click', '[data-view]', (e, el) => { View.set('t.view', el.dataset.view); TaskUI.composer = null; App.render(); });
    on(root, 'click', '[data-late]', () => { View.set('t.late', !f.late); App.render(); });
    on(root, 'click', '[data-quick]', () => quickTask({}));
    $('#fWho', root).onchange = e => { View.set('t.who', e.target.value); App.render(); };
    $('#fDir', root).onchange = e => { View.set('t.dir', e.target.value); App.render(); };
    if ($('#fGoal', root)) $('#fGoal', root).onchange = e => { View.set('t.goal', e.target.value); App.render(); };
    if ($('#fDone', root)) $('#fDone', root).onchange = e => { View.set('t.done', e.target.checked); App.render(); };
    let qt;
    $('#fQ', root).oninput = e => { clearTimeout(qt); const v = e.target.value; qt = setTimeout(() => { View.set('t.q', v); App.render({focus: 'fQ'}); const el = $('#fQ'); if (el) el.setSelectionRange(v.length, v.length); }, 250); };
    wireTaskCards(root);
    wireComposer(root);
  },
});

/* ── карточка на доске (по мотивам первой версии: код направления, аватар, срок) ── */
function dueChip(t) {
  const d = Tasks.due(t);
  if (!d) return '<span class="due none">без срока</span>';
  const label = t.due ? dayShort(t.due) : monthShort(t.month);
  if (t.status === 'done') return `<span class="due">${label}</span>`;
  if (d < today()) return `<span class="due late" title="Срок прошёл">${icon('cal')}${label}</span>`;
  if (t.due && daysBetween(today(), t.due) <= 2) return `<span class="due soon">${icon('cal')}${t.due === today() ? 'сегодня' : label}</span>`;
  return `<span class="due">${icon('cal')}${label}</span>`;
}
function taskMeta(t) {
  const g = t.goalId ? Strategy.goal(t.goalId) : null;
  const n = Object.values(t.comments || {}).filter(c => c.kind !== 'system').length;
  return [
    g ? `<span class="t-goal" title="Цель квартала">${esc(g.short || g.title)}</span>` : '',
    t.dir && DIRS[t.dir] ? `<span class="t-dir"><i class="dot" style="background:${DIRS[t.dir].color}"></i>${DIRS[t.dir].name}</span>` : '',
    n ? `<span class="t-cm">${icon('msg')}${n}</span>` : '',
    Tasks.unseen(t) ? '<span class="pill rose">новое</span>' : '',
  ].join('');
}
function taskCard(t, opts = {}) {
  const p = personById(t.assignee);
  const can = Tasks.canEdit(t);
  const g = t.goalId ? Strategy.goal(t.goalId) : null;
  const n = Object.values(t.comments || {}).filter(c => c.kind !== 'system').length;
  const code = DIR_CODE[t.dir];
  return `<div class="kc ${t.status} ${Tasks.unseen(t) ? 'fresh' : ''} ${can ? 'can' : ''}" data-task="${t.id}" tabindex="0">
    <div class="kc-top">
      ${code ? `<span class="kc-dir" style="--c:${DIRS[t.dir].color}" title="${DIRS[t.dir].name}">${code}</span>` : '<span class="kc-dir none">—</span>'}
      ${t.priority === 'high' ? '<span class="kc-prio" title="Важная задача">!</span>' : ''}
      ${Tasks.unseen(t) ? '<span class="pill rose">новое</span>' : ''}
      <button class="kc-av" ${can ? `data-assign="${t.id}"` : 'disabled'} title="${esc(p ? personName(p) : 'Назначить исполнителя')}">${avatar(p)}</button>
    </div>
    <div class="kc-title">${esc(t.title)}</div>
    <div class="kc-foot">${dueChip(t)}${n ? `<span class="t-cm">${icon('msg')}${n}</span>` : ''}${g ? `<span class="t-goal">${esc(g.short || g.title)}</span>` : ''}${opts.status ? `<span class="pill ${STATUSES[t.status].tone} kc-st">${STATUSES[t.status].name}</span>` : ''}</div>
  </div>`;
}
/* строка — для списка, главной и дорожной карты */
function taskRow(t) {
  const p = personById(t.assignee);
  const can = Tasks.canEdit(t);
  return `<div class="t-row ${t.status === 'done' ? 'done' : ''} ${Tasks.unseen(t) ? 'fresh' : ''}" data-task="${t.id}">
    <button class="t-check ${t.status}" data-done="${t.id}" ${can ? '' : 'disabled'} aria-label="${t.status === 'done' ? 'Вернуть в работу' : 'Отметить сделанной'}" title="${t.status === 'done' ? 'Вернуть в работу' : t.status === 'review' ? 'На проверке' : 'Сделано'}">${icon('tick')}</button>
    <div class="t-main">
      <div class="t-title">${t.priority === 'high' ? '<i class="prio" title="Важно"></i>' : ''}${esc(t.title)}</div>
      <div class="t-meta">${taskMeta(t)}</div>
    </div>
    <div class="t-who">${avatar(p)}<span class="t-who-n">${esc(p ? firstName(p) : 'Никто')}</span></div>
    ${dueChip(t)}
    <span class="pill ${STATUSES[t.status].tone} t-st">${STATUSES[t.status].name}</span>
  </div>`;
}

/* колонка доски с добавлением внизу */
function kbCol({key, title, sub = '', items, add = null, now = false, tone = '', extra = ''}) {
  const comp = TaskUI.composer && TaskUI.composer.col === key ? TaskUI.composer : null;
  return `<section class="kb-col ${now ? 'now' : ''} ${tone}" data-col="${key}">
    <header class="kb-h"><b>${title}</b>${sub}<span class="kb-n">${items.length}</span></header>
    <div class="kb-list">
      ${items.map(t => taskCard(t, {status: key.startsWith('m:') || key.startsWith('w:')})).join('')}
      ${extra}
      ${add ? (comp ? composerHtml(comp) : `<button class="kb-add" data-add="${key}">${icon('plus')}Добавить задачу</button>`) : ''}
    </div>
  </section>`;
}
function composerHtml(c) {
  const ppl = people();
  return `<form class="kb-composer" data-composer="${c.col}" autocomplete="off">
    <textarea class="textarea" id="kbTitle" rows="2" placeholder="Что нужно сделать? Enter — добавить" maxlength="200">${esc(c.title || '')}</textarea>
    <div class="kb-comp-row">
      <select class="select sm" id="kbWho" aria-label="Кому">${[['', 'Не назначено'], ...ppl.map(p => [p.id, personName(p)])].map(([v, n]) => `<option value="${v}" ${(c.assignee ?? Auth.personId() ?? '') === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <input class="input sm" id="kbDue" type="date" value="${esc(c.due || '')}" aria-label="Срок">
    </div>
    <div class="kb-comp-row"><button class="btn sm primary" type="submit">Добавить</button><button class="btn sm ghost" type="button" data-comp-close>Отмена</button><button class="btn sm ghost kb-more" type="button" data-comp-more>Подробнее…</button></div>
  </form>`;
}
/* что означает колонка для новой задачи */
function colPreset(key) {
  if (key.startsWith('s:')) return {status: key.slice(2)};
  if (key.startsWith('m:')) return key === 'm:none' ? {month: null} : {month: key.slice(2)};
  if (key.startsWith('w:')) {
    const w = key.slice(2), m = View.get('t.weekMonth', monthOf(today()));
    if (w === 'none') return {month: m};
    let d = addDays(w, 4);
    if (d < monthStart(m)) d = monthStart(m);
    if (d > monthEnd(m)) d = monthEnd(m);
    return {due: d};
  }
  return {};
}
function wireComposer(root) {
  on(root, 'click', '[data-add]', (e, el) => {
    const pre = colPreset(el.dataset.add);
    TaskUI.composer = {col: el.dataset.add, title: '', assignee: undefined, due: pre.due || ''};
    App.render({focus: 'kbTitle'});
  });
  on(root, 'click', '[data-comp-close]', () => { TaskUI.composer = null; App.render(); });
  const form = $('.kb-composer', root);
  if (!form) return;
  const c = TaskUI.composer;
  const ta = $('#kbTitle', form);
  ta.addEventListener('input', () => { c.title = ta.value; });
  $('#kbWho', form).onchange = e => { c.assignee = e.target.value; };
  $('#kbDue', form).onchange = e => { c.due = e.target.value; };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    if (e.key === 'Escape') { TaskUI.composer = null; App.render(); }
  });
  const make = () => {
    const title = ta.value.trim();
    if (!title) { ta.focus(); return null; }
    const pre = colPreset(c.col);
    const due = $('#kbDue', form).value || null;
    const col = $$(`[data-col="${c.col}"] [data-task]`, root).map(x => Tasks.get(x.dataset.task)).filter(Boolean);
    const id = Tasks.create({title, assignee: $('#kbWho', form).value || null, due, month: due ? monthOf(due) : (pre.month !== undefined ? pre.month : undefined), status: pre.status});
    Store.patch('tasks', id, {order: col.length ? effOrder(col[col.length - 1]) + 1000 : Date.now()});
    return id;
  };
  form.onsubmit = e => {
    e.preventDefault();
    if (!make()) return;
    c.title = '';
    App.render({focus: 'kbTitle'});
  };
  $('[data-comp-more]', form).onclick = () => {
    const id = make();
    if (!id) return;
    TaskUI.composer = null;
    App.render();
    openTask(id);
  };
  setTimeout(() => { const t = $('#kbTitle'); if (t && document.activeElement !== t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 0);
}

/* ── доска по статусам ── */
function renderTaskBoard(box, list) {
  const doneAll = list.filter(t => t.status === 'done').sort((a, b) => (b.doneAt || b.updatedAt || 0) - (a.doneAt || a.updatedAt || 0));
  const doneShown = TaskUI.showDone ? doneAll : doneAll.slice(0, 8);
  const cols = [
    kbCol({key: 's:todo', title: 'К работе', items: byOrder(list.filter(t => t.status === 'todo')), add: true}),
    kbCol({key: 's:doing', title: 'В работе', items: byOrder(list.filter(t => t.status === 'doing')), add: true, tone: 'doing'}),
    kbCol({key: 's:review', title: 'На проверке', sub: '<em>принимает автор</em>', items: byOrder(list.filter(t => t.status === 'review')), tone: 'review'}),
    kbCol({key: 's:done', title: 'Готово', items: doneShown, tone: 'done',
      extra: doneAll.length > doneShown.length ? `<button class="kb-more-done" data-more-done>Показать ещё ${doneAll.length - doneShown.length}</button>` : ''}),
  ];
  box.innerHTML = `<div class="kb kb-status">${cols.join('')}</div>`;
  on(box, 'click', '[data-more-done]', () => { TaskUI.showDone = true; App.render(); });
  Drag.board(box, {canDrag: id => { const t = Tasks.get(id); return t && Tasks.canEdit(t); }, onDrop: dropOnStatus});
}
function dropOnStatus(id, key, pos) {
  const t = Tasks.get(id);
  if (!t) return;
  let st = key.slice(2);
  const order = orderBetween(pos.afterId, pos.beforeId);
  if (st === t.status) { Store.patch('tasks', id, {order}); return; }
  if (t.status === 'review' && st === 'done' && !Tasks.canJudge(t)) { toast('Принять задачу может автор или руководитель'); return; }
  if (st === 'done' && t.status !== 'review' && Tasks.needsReview(t)) { st = 'review'; toast('Задачу ставил другой человек — она ушла ему на проверку'); }
  Store.patch('tasks', id, {order});
  Tasks.setStatus(t, st, st === 'done' && t.status === 'review' ? `${firstName(Auth.person() || {})}: принято` : null);
}

/* ── по месяцам ── */
function renderTaskMonths(box, list) {
  const showDone = TaskUI.filters().done;
  const vis = list.filter(t => showDone || t.status !== 'done');
  const cur = monthOf(today());
  const cols = [...TaskUI.months().map(m => {
      const all = list.filter(t => t.month === m);
      const done = all.filter(t => t.status === 'done').length;
      return kbCol({key: 'm:' + m, title: monthName(m), now: m === cur, add: true,
        sub: `<span class="kb-prog" title="Готово ${done} из ${all.length}">${all.length ? `${done}/${all.length}` : ''}</span>`,
        items: byOrder(vis.filter(t => t.month === m))});
    }),
    kbCol({key: 'm:none', title: 'Без срока', add: true, items: byOrder(vis.filter(t => !t.month))})];
  box.innerHTML = `<div class="kb kb-wide">${cols.join('')}</div>`;
  Drag.board(box, {canDrag: id => { const t = Tasks.get(id); return t && Tasks.canEdit(t); }, onDrop: (id, key, pos) => {
    const t = Tasks.get(id);
    const m = key === 'm:none' ? null : key.slice(2);
    const patch = {order: orderBetween(pos.afterId, pos.beforeId)};
    if (t.month !== m) {
      patch.month = m;
      if (!m || (t.due && monthOf(t.due) !== m)) patch.due = null;
      Tasks.update(id, patch, `Перенесено на ${m ? monthName(m).toLowerCase() : '«без срока»'}`);
    } else Store.patch('tasks', id, patch);
  }});
}

/* ── по неделям ── */
function renderTaskWeeks(box, list) {
  const months = TaskUI.months();
  let m = View.get('t.weekMonth', monthOf(today()));
  if (!months.includes(m)) m = monthOf(today());
  const showDone = TaskUI.filters().done;
  const weeks = [];
  for (let w = weekStart(monthStart(m)); w <= monthEnd(m); w = addDays(w, 7)) weeks.push(w);
  const inMonth = list.filter(t => (t.due ? monthOf(t.due) === m : t.month === m) && (showDone || t.status !== 'done'));
  const thisWeek = weekStart(today());
  const cols = [kbCol({key: 'w:none', title: 'Без даты', sub: '<em>разложите по неделям</em>', add: true, tone: 'backlog', items: byOrder(inMonth.filter(t => !t.due))}),
    ...weeks.map(w => kbCol({key: 'w:' + w, title: weekLabel(w), now: w === thisWeek, add: true,
      items: byOrder(inMonth.filter(t => t.due && t.due >= w && t.due <= addDays(w, 6)))}))];
  box.innerHTML = `<div class="tabs week-tabs">${months.map(x => `<button data-wm="${x}" class="${x === m ? 'on' : ''}">${monthName(x)}<span class="n">${list.filter(t => (t.due ? monthOf(t.due) === x : t.month === x) && t.status !== 'done').length}</span></button>`).join('')}</div>
    <div class="kb kb-weeks">${cols.join('')}</div>`;
  on(box, 'click', '[data-wm]', (e, el) => { View.set('t.weekMonth', el.dataset.wm); TaskUI.composer = null; App.render(); });
  Drag.board(box, {canDrag: id => { const t = Tasks.get(id); return t && Tasks.canEdit(t); }, onDrop: (id, key, pos) => {
    const t = Tasks.get(id);
    const w = key.slice(2);
    const order = orderBetween(pos.afterId, pos.beforeId);
    if (w === 'none') { if (t.due) Tasks.update(id, {due: null, month: m, order}, 'Срок снят'); else Store.patch('tasks', id, {order}); return; }
    let d = addDays(w, t.due ? weekday(t.due) : 4);
    if (d < monthStart(m)) d = monthStart(m);
    if (d > monthEnd(m)) d = monthEnd(m);
    if (d === t.due) { Store.patch('tasks', id, {order}); return; }
    Tasks.update(id, {due: d, month: monthOf(d), order}, `Срок: ${dayLong(d)}`);
  }});
}

/* ── список ── */
function renderTaskList(box, list) {
  const showDone = TaskUI.filters().done;
  const groups = ['review', 'doing', 'todo', ...(showDone ? ['done'] : [])];
  const comp = TaskUI.composer && TaskUI.composer.col === 's:todo' ? TaskUI.composer : null;
  const html = groups.map(st => {
    let items = st === 'done' ? list.filter(t => t.status === 'done').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 60) : Tasks.sort(list.filter(t => t.status === st));
    if (!items.length && st !== 'todo') return '';
    return `<section class="t-group"><div class="t-group-head">${STATUSES[st].name} <span>${items.length}</span>${st === 'review' ? '<em>ждут приёмки автора или руководителя</em>' : ''}</div>
      ${st === 'todo' ? `<div class="kb-col list-add" data-col="s:todo"><div class="kb-list">${comp ? composerHtml(comp) : '<button class="kb-add" data-add="s:todo">' + icon('plus') + 'Добавить задачу</button>'}</div></div>` : ''}
      ${items.length ? `<div class="t-list grouped">${items.map(taskRow).join('')}</div>` : ''}</section>`;
  }).join('');
  box.innerHTML = html || taskEmpty();
}
function taskEmpty() {
  const f = TaskUI.filters();
  return `<div class="empty"><b>${f.late ? 'Просроченных задач нет' : 'Задач по этому фильтру нет'}</b>
    ${f.who === 'me' ? 'Показаны только ваши задачи — выберите «Вся команда», чтобы увидеть задачи всех.' : 'Поменяйте фильтр или добавьте задачу.'}</div>`;
}

/* клики по карточкам и строкам: галочка, смена исполнителя, открытие */
function wireTaskCards(root) {
  on(root, 'click', '[data-done]', (e, el) => {
    e.stopPropagation();
    const t = Tasks.get(el.dataset.done);
    if (!t) return;
    if (t.status === 'done') Tasks.setStatus(t, 'doing');
    else if (t.status === 'review') { if (Tasks.canJudge(t)) Tasks.setStatus(t, 'done', `${firstName(Auth.person() || {})}: принято`); else toast('Задача ждёт приёмки автора или руководителя'); }
    else Tasks.complete(t);
  });
  on(root, 'click', '[data-assign]', async (e, el) => {
    e.stopPropagation();
    const t = Tasks.get(el.dataset.assign);
    if (!t) return;
    const v = await pickPop(el, [['', 'Не назначено'], ...people().map(p => [p.id, personName(p) + (p.title && p.name ? ' · ' + p.title : '')])], t.assignee || '');
    if (v === null || v === (t.assignee || '')) return;
    const p = personById(v);
    Tasks.update(t.id, {assignee: v || null, ...(p && p.dir && !t.dir ? {dir: p.dir} : {})}, `Исполнитель: ${p ? personName(p) : 'не назначен'}`);
  });
  on(root, 'click', '[data-task]', (e, el) => {
    if (e.target.closest('[data-done], button, a, input, select, textarea')) return;
    openTask(el.dataset.task);
  });
  on(root, 'keydown', '[data-task]', (e, el) => { if (e.key === 'Enter' && e.target === el) openTask(el.dataset.task); });
}

/* быстрое окно, как в первой версии: название, кто, срок → Добавить или Подробнее… */
function quickTask(preset) {
  const ppl = people();
  openModal({
    title: 'Новая задача',
    body: `<input class="input t-m-title" id="qtTitle" placeholder="Название задачи" maxlength="200">
      <div class="grid3">
        <label class="field"><span>Кто делает</span><select class="select" id="qtWho">${[['', 'Не назначено'], ...ppl.map(p => [p.id, personName(p)])].map(([v, n]) => `<option value="${v}" ${(Auth.personId() || '') === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
        <label class="field"><span>Срок</span><input class="input" id="qtDue" type="date" value="${esc(preset.due || '')}"></label>
        <label class="field"><span>Направление</span><select class="select" id="qtDir"><option value="">Как у исполнителя</option>${Object.entries(DIRS).map(([k, d]) => `<option value="${k}">${d.name}</option>`).join('')}</select></label>
      </div>`,
    foot: `<button class="btn ghost left" id="qtMore">Подробнее…</button><button class="btn" data-close>Отмена</button><button class="btn primary" id="qtAdd">Добавить</button>`,
    onMount(el, close) {
      const make = () => {
        const title = $('#qtTitle', el).value.trim();
        if (!title) { $('#qtTitle', el).focus(); $('#qtTitle', el).classList.add('need'); return null; }
        const due = $('#qtDue', el).value || null;
        return Tasks.create({title, assignee: $('#qtWho', el).value || null, due, dir: $('#qtDir', el).value || undefined});
      };
      $('#qtAdd', el).onclick = () => { if (make()) { close(); toast('Задача добавлена'); } };
      $('#qtMore', el).onclick = () => { const id = make(); if (id) { close(); openTask(id); } };
      $('#qtTitle', el).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#qtAdd', el).click(); } });
    },
  });
}

/* ── карточка задачи в окне ── */
function openTask(id, defaults = {}) {
  const isNew = !id;
  let unsub = null;
  let t = isNew ? null : Tasks.get(id);
  if (!isNew && !t) { toast('Задача уже удалена'); return; }
  if (t) Tasks.markSeen(t);
  const can = isNew || Tasks.canEdit(t);
  const ppl = people();
  const months = monthRange('2026-08', '2027-12');
  const goals = Strategy.goals();
  const items = Strategy.items();
  const v = t || {title: '', desc: '', result: '', status: 'todo', assignee: Auth.personId(), dir: (Auth.person() || {}).dir || '',
    priority: 'normal', due: '', month: monthOf(today()), goalId: '', stratId: '', ...defaults};
  const sel = (id, opts, cur, dis) => `<select class="select" id="${id}" ${dis ? 'disabled' : ''}>${opts.map(([val, n]) => `<option value="${esc(val)}" ${String(cur || '') === String(val) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;

  const body = `
    <input class="input t-m-title" id="tmTitle" value="${esc(v.title)}" placeholder="Что нужно сделать" ${can ? '' : 'disabled'} maxlength="200">
    ${isNew ? '' : `<div class="t-m-status" id="tmStatus"></div>`}
    <div class="grid2">
      <label class="field"><span>Кто делает</span>${sel('tmWho', [['', 'Не назначено'], ...ppl.map(p => [p.id, personName(p) + (p.title && p.name ? ' · ' + p.title : '')])], v.assignee, !can)}</label>
      <label class="field"><span>Срок</span><input class="input" id="tmDue" type="date" value="${esc(v.due || '')}" ${can ? '' : 'disabled'} min="2026-01-01" max="2028-12-31"></label>
      <label class="field"><span>Месяц</span>${sel('tmMonth', [['', 'Без срока'], ...months.map(m => [m, monthName(m, true)])], v.month, !can)}</label>
      <label class="field"><span>Направление</span>${sel('tmDir', [['', 'Без направления'], ...Object.entries(DIRS).map(([k, d]) => [k, d.name])], v.dir, !can)}</label>
      <label class="field"><span>Важность</span>${sel('tmPrio', [['normal', 'Обычная'], ['high', 'Важно']], v.priority, !can)}</label>
      <label class="field"><span>Цель квартала</span>${sel('tmGoal', [['', 'Не связана'], ...goals.map(g => [g.id, g.short || g.title])], v.goalId, !can)}</label>
    </div>
    ${items.length ? `<label class="field"><span>Этап дорожной карты</span>${sel('tmStrat', [['', 'Не связана'], ...items.map(i => [i.id, `${dirName(i.dir)} · ${i.title}`])], v.stratId, !can)}</label>` : ''}
    <label class="field"><span>Что сделать подробнее</span><textarea class="textarea" id="tmDesc" rows="3" ${can ? '' : 'disabled'} placeholder="Контекст, ссылки, договорённости">${esc(v.desc || '')}</textarea></label>
    <label class="field"><span>Результат — как поймём, что готово</span><input class="input" id="tmResult" value="${esc(v.result || '')}" ${can ? '' : 'disabled'} placeholder="Например: договор подписан и лежит в папке"></label>
    ${isNew ? '' : `<div class="t-m-comments"><div class="label">Обсуждение и история</div><div id="tmThread" class="thread"></div>
      <form id="tmCForm" class="t-m-cform"><textarea class="textarea" id="tmComment" rows="2" placeholder="Написать комментарий: вопрос, ссылка, что сделано"></textarea><button class="btn sm dark" type="submit">Отправить</button></form></div>`}`;
  const foot = isNew
    ? `<button class="btn" data-close>Отмена</button><button class="btn primary" id="tmCreate">Создать задачу</button>`
    : `${Tasks.canDelete(t) ? `<button class="btn danger left" id="tmDel">${icon('trash')}Удалить</button>` : '<span class="left note" id="tmWhoMade"></span>'}<span class="note" id="tmSaved"></span><button class="btn" data-close>Закрыть</button>`;

  openModal({
    title: isNew ? 'Новая задача' : 'Задача',
    body, foot, wide: true, focus: isNew,
    onMount(el, close) {
      const val = sel => $(sel, el).value;
      if (isNew) {
        $('#tmCreate', el).onclick = () => {
          const title = val('#tmTitle').trim();
          if (!title) { $('#tmTitle', el).focus(); return; }
          const due = val('#tmDue') || null;
          Tasks.create({title, assignee: val('#tmWho') || null, due, month: val('#tmMonth') || null, dir: val('#tmDir'),
            priority: val('#tmPrio'), goalId: val('#tmGoal') || null, stratId: $('#tmStrat', el) ? val('#tmStrat') || null : null,
            desc: val('#tmDesc'), result: val('#tmResult')});
          close();
          toast('Задача создана');
        };
        return;
      }
      /* автосохранение по полю */
      const saved = () => { const s = $('#tmSaved', el); if (s) { s.textContent = 'Сохранено'; clearTimeout(s._t); s._t = setTimeout(() => { s.textContent = ''; }, 1600); } };
      const field = (sel, key, map = x => x, log) => {
        const input = $(sel, el);
        if (!input) return;
        input.addEventListener('change', () => {
          const cur = Tasks.get(id);
          if (!cur) return;
          let value = map(input.value);
          if (key === 'title' && !value) { input.value = cur.title; return; }
          const patch = {[key]: value};
          if (key === 'due') { patch.month = value ? monthOf(value) : cur.month; const mm = $('#tmMonth', el); if (mm && value) mm.value = monthOf(value); }
          if (key === 'month' && cur.due && monthOf(cur.due) !== value) { patch.due = null; $('#tmDue', el).value = ''; }
          if (key === 'assignee' && value && !cur.dir) { const p = personById(value); if (p && p.dir) patch.dir = p.dir; }
          Tasks.update(id, patch, log ? log(value) : null);
          saved();
        });
      };
      field('#tmTitle', 'title', s => s.trim());
      field('#tmWho', 'assignee', s => s || null, s => `Исполнитель: ${s ? personName(personById(s)) : 'не назначен'}`);
      field('#tmDue', 'due', s => s || null, s => (s ? `Срок: ${dayLong(s)}` : 'Срок снят'));
      field('#tmMonth', 'month', s => s || null);
      field('#tmDir', 'dir');
      field('#tmPrio', 'priority');
      field('#tmGoal', 'goalId', s => s || null);
      field('#tmStrat', 'stratId', s => s || null);
      field('#tmDesc', 'desc');
      field('#tmResult', 'result');

      const paint = () => {
        const cur = Tasks.get(id);
        if (!cur) { close(); return; }
        paintTaskStatus($('#tmStatus', el), cur);
        const typing = document.activeElement && document.activeElement.id === 'tmComment';
        paintThread($('#tmThread', el), cur, typing);
        const wm = $('#tmWhoMade', el);
        if (wm) { const c = personById(cur.createdBy); wm.textContent = c ? `Поставил(а): ${personName(c)}` : ''; }
      };
      paint();
      unsub = Store.subscribe(c => { if (c === 'tasks') paint(); });

      on(el, 'click', '[data-st]', (e, b) => {
        const cur = Tasks.get(id);
        const st = b.dataset.st;
        if (st === 'return') {
          const box = $('#tmComment', el);
          if (!box.value.trim()) { box.focus(); box.placeholder = 'Напишите, что доработать — без комментария вернуть нельзя'; box.classList.add('need'); return; }
          Tasks.comment(cur, box.value, 'return');
          box.value = '';
          Tasks.setStatus(cur, 'doing', `${firstName(Auth.person() || {})}: вернул(а) на доработку`);
          return;
        }
        if (st === 'accept') { Tasks.setStatus(cur, 'done', `${firstName(Auth.person() || {})}: принято`); return; }
        if (st === 'complete') { Tasks.complete(cur); return; }
        Tasks.setStatus(cur, st);
      });
      const cf = $('#tmCForm', el);
      cf.onsubmit = e => {
        e.preventDefault();
        const box = $('#tmComment', el);
        if (!box.value.trim()) return;
        Tasks.comment(Tasks.get(id), box.value);
        box.value = '';
        box.classList.remove('need');
        paint();
      };
      $('#tmComment', el).addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) cf.requestSubmit(); });
      const del = $('#tmDel', el);
      if (del) del.onclick = () => Tasks.remove(Tasks.get(id), del).then(ok => { if (ok) close(); });
    },
    onClose() { if (unsub) unsub(); },
  });
}
function paintTaskStatus(box, t) {
  if (!box) return;
  const can = Tasks.canEdit(t), judge = Tasks.canJudge(t);
  const steps = Object.entries(STATUSES).map(([k, s]) => `<span class="st-step ${k === t.status ? 'on ' + s.tone : ''}">${s.name}</span>`).join('<i></i>');
  let actions = '';
  if (t.status === 'todo' && can) actions = `<button class="btn sm" data-st="doing">В работу</button><button class="btn sm primary" data-st="complete">${Tasks.needsReview(t) ? 'Сдать на проверку' : 'Сделано'}</button>`;
  if (t.status === 'doing' && can) actions = `<button class="btn sm primary" data-st="complete">${Tasks.needsReview(t) ? 'Сдать на проверку' : 'Сделано'}</button>`;
  if (t.status === 'review') actions = judge ? `<button class="btn sm good" data-st="accept">${icon('tick')}Принять</button><button class="btn sm danger" data-st="return">Вернуть на доработку</button>` : '<span class="note">Ждёт приёмки автора или руководителя</span>';
  if (t.status === 'done' && can) actions = `<button class="btn sm" data-st="doing">Вернуть в работу</button>`;
  box.innerHTML = `<div class="st-steps">${steps}</div><div class="st-actions">${actions}</div>`;
}
function paintThread(box, t, keepScroll) {
  if (!box) return;
  const list = Object.entries(t.comments || {}).map(([cid, c]) => ({cid, ...c})).sort((a, b) => a.at - b.at);
  if (!list.length) { box.innerHTML = '<p class="note">Пока пусто. Вопросы и договорённости по задаче пишите здесь — их увидит вся команда.</p>'; return; }
  box.innerHTML = list.map(c => {
    const p = personById(c.by);
    if (c.kind === 'system') return `<div class="th-sys"><span>${esc(c.text)}</span><time>${timeAgo(c.at)}</time></div>`;
    return `<div class="th-msg ${c.kind === 'return' ? 'ret' : ''}">${avatar(p)}<div><div class="th-h"><b>${esc(p ? personName(p) : 'Кто-то из команды')}</b><time>${timeAgo(c.at)}</time>${c.kind === 'return' ? '<span class="pill bad">вернул(а) на доработку</span>' : ''}</div><p></p></div></div>`;
  }).join('');
  /* текст комментариев — только через textContent */
  const msgs = list.filter(c => c.kind !== 'system');
  $$('.th-msg p', box).forEach((pEl, i) => { pEl.textContent = msgs[i].text; });
  if (!keepScroll) box.scrollTop = box.scrollHeight;
}

/* ── 40-money.js ── */
/* Деньги: быстрая запись сверху → месяцы → P&L план/факт → план платежей
   с кнопкой «Оплатить» → журнал. Выручка подписок приходит из «Отчётов»
   (цифры продаж), поэтому здесь её вручную не вносим. */

const MoneyUI = {
  draft: {kind: 'out', amount: '', cat: 'other', date: '', note: ''},
};
const catName = (kind, cat) => ((KINDS[kind] || {}).cats || {})[cat] || 'Прочее';
const monthStatus = m => (m < monthOf(today()) ? 'fact' : m === monthOf(today()) ? 'now' : 'plan');
const STATUS_TAG = {fact: 'факт', now: 'идёт', plan: 'план'};

App.register('money', {
  title: 'Деньги',
  render(root) {
    if (!Auth.can('money.view')) { root.innerHTML = pageHead('Деньги', '') + noAccess(); return; }
    const s = settings(), sc = s.scenario;

    const rows = pnl(sc);
    const cash = Money.cashNow();

    root.innerHTML = `
      ${pageHead('Деньги', 'Сверху — быстрая запись расхода, прихода или вложения. Ниже — P&L по месяцам, план платежей и журнал всех операций.', helpBtn('money'))}
      ${helpBox('money', `<b>Как вести деньги.</b><ol>
        <li>Потратили или получили деньги — запишите строкой сверху: сумма, статья, дата. Enter — сохранить. Ошиблись — «Отменить» в уведомлении или правка в журнале.</li>
        <li>Плановые платежи (зарплаты, штаб, сервисы) отмечайте кнопкой «Оплатить» в плане — операция запишется в журнал сама.</li>
        <li>Выручку подписок вносить не нужно: она считается из цифр продаж в «Отчётах».</li>
        <li>«Вложение» — деньги основателя или инвестора: они пополняют счёт, но не считаются доходом.</li></ol>`)}
      ${edit ? quickEntryHtml() : ''}
      <div class="money-top">
        <div class="card stat cash-card"><span class="label">На счёте сейчас</span><div class="big">${rubK(cash)}</div>
          <div class="foot">старт ${rubK(s.cashStart)} на ${dayLong(s.cashDate)} + все операции и выручка</div></div>
        ${rows.map(r => {
          const st = monthStatus(r.m);
          const f = st === 'plan' ? r.plan : r.fact;
          return `<div class="card month-card ${st}"><div class="mc-h"><b>${monthName(r.m)}</b><span class="pill ${st === 'now' ? 'rose' : ''}">${STATUS_TAG[st]}</span></div>
            <div class="mc-row"><span>Доходы</span><b class="good">${rubK(f.income)}</b></div>
            <div class="mc-row"><span>Расходы</span><b class="bad">${rubK(f.outTotal)}</b></div>
            <div class="mc-row total"><span>Итог</span><b class="${f.profit < 0 ? 'bad' : 'good'}">${signed(f.profit)}</b></div>
            ${st !== 'plan' ? `<div class="note">план: ${signed(r.plan.profit)}</div>` : '<div class="note">по плану платежей и сценарию</div>'}</div>`;
        }).join('')}
      </div>
      <section class="section">
        <div class="section-head"><h2>P&amp;L по месяцам</h2><span class="hint-inline">Крупно — факт, мелко — план. Будущие месяцы — только план. Сценарий продаж «${SCENARIOS[sc].name}».</span></div>
        ${pnlTable(rows)}
      </section>
      <section class="section">
        <div class="section-head"><h2>План платежей</h2><span class="hint-inline">${edit ? 'Нажмите «Оплатить», когда деньги ушли — операция попадёт в журнал и в P&L.' : 'Что и когда платим до конца года.'}</span>
          ${edit ? `<button class="btn sm" data-plan-add>${icon('plus')}Платёж</button>` : ''}</div>
        ${planTable()}
      </section>
      <section class="section">
        <div class="section-head"><h2>Журнал операций</h2>${ledgerFilters()}</div>
        ${ledgerTable()}

/* ── быстрая запись ── */
function quickEntryHtml() {
  const d = MoneyUI.draft;
  const cats = KINDS[d.kind].cats;
  if (!cats[d.cat]) d.cat = Object.keys(cats)[0];
  const recent = Money.ledger().slice(0, 4);
  return `<form class="card qe ${d.kind}" id="qeForm" autocomplete="off">
    <div class="seg qe-kind" role="tablist">${Object.entries(KINDS).map(([k, x]) => `<button type="button" data-kind="${k}" class="${d.kind === k ? 'on' : ''} k-${k}">${x.name}</button>`).join('')}</div>
    <div class="qe-fields">
      <label class="field qe-amount"><span>Сумма, ₽</span><input class="input num" id="qeAmount" inputmode="decimal" placeholder="0" value="${esc(d.amount)}"></label>
      <label class="field"><span>Статья</span><select class="select" id="qeCat">${Object.entries(cats).map(([k, n]) => `<option value="${k}" ${k === d.cat ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="field"><span>Дата</span><input class="input" id="qeDate" type="date" value="${esc(d.date || today())}"></label>
      <label class="field qe-note"><span>Комментарий</span><input class="input" id="qeNote" placeholder="${d.kind === 'out' ? 'За что: например, хостинг на месяц' : d.kind === 'in' ? 'От кого и за что' : 'Кто вложил'}" value="${esc(d.note)}" maxlength="160"></label>
      <button class="btn ${d.kind === 'out' ? 'danger solid' : d.kind === 'in' ? 'good' : 'dark'} qe-go" type="submit">Записать ${KINDS[d.kind].name.toLowerCase()}</button>
    </div>
    ${recent.length ? `<div class="qe-recent"><span class="label">Последние</span>${recent.map(e => `<button type="button" class="qe-r" data-led="${e.id}"><span>${dayShort(e.date)}</span><span>${esc(e.note || catName(e.kind, e.cat))}</span><b class="${e.kind === 'out' ? 'bad' : 'good'}">${e.kind === 'out' ? '−' : '+'}${rub(e.amount)}</b></button>`).join('')}</div>` : ''}
  </form>`;
}
function wireQuickEntry(root) {
  const form = $('#qeForm', root);
  const d = MoneyUI.draft;
  on(form, 'click', '[data-kind]', (e, el) => { d.kind = el.dataset.kind; d.cat = Object.keys(KINDS[d.kind].cats)[0]; App.render({focus: 'qeAmount'}); });
  $('#qeAmount', form).oninput = e => { d.amount = e.target.value; };
  $('#qeCat', form).onchange = e => { d.cat = e.target.value; };
  $('#qeDate', form).onchange = e => { d.date = e.target.value; };
  $('#qeNote', form).oninput = e => { d.note = e.target.value; };
  form.onsubmit = e => {
    e.preventDefault();
    const amount = Math.round(parseNum($('#qeAmount', form).value) * 100) / 100;
    if (!(amount > 0)) { $('#qeAmount', form).focus(); toast('Укажите сумму больше нуля'); return; }
    const entry = {kind: d.kind, amount, cat: $('#qeCat', form).value, date: $('#qeDate', form).value || today(),
      note: $('#qeNote', form).value.trim(), by: Tasks.meKey(), at: Date.now()};
    const id = Store.add('ledger', entry);
    d.amount = ''; d.note = '';
    toast(`Записано: ${d.kind === 'out' ? '−' : '+'}${rub(amount)} · ${catName(entry.kind, entry.cat)}`, {undo: () => Store.remove('ledger', id)});
    App.render({focus: 'qeAmount'});
  };
}

/* ── P&L ── */
function pnlTable(rows) {
  const cell = (r, f, p) => {
    const st = monthStatus(r.m);
    if (st === 'plan') return `<td class="r pl-cell future"><b>${p ? rubK(p) : '—'}</b><small>план</small></td>`;
    return `<td class="r pl-cell"><b>${f ? rubK(f) : '—'}</b>${p ? `<small>план ${rubK(p)}</small>` : ''}</td>`;
  };
  const total = (get) => sum(rows, r => get(r));
  const line = (name, getF, getP, cls = '') => `<tr class="${cls}"><td>${name}</td>${rows.map(r => cell(r, getF(r), getP(r))).join('')}
    <td class="r pl-cell tot"><b>${rubK(total(r => (monthStatus(r.m) === 'plan' ? getP(r) : getF(r))))}</b><small>план ${rubK(total(getP))}</small></td></tr>`;
  const outCats = Object.keys(OUT_CATS).filter(c => rows.some(r => (r.fact.out[c] || 0) || (r.plan.out[c] || 0)));
  const profitCell = r => {
    const st = monthStatus(r.m), v = st === 'plan' ? r.plan.profit : r.fact.profit;
    return `<td class="r pl-cell ${st === 'plan' ? 'future' : ''}"><b class="${v < 0 ? 'bad' : 'good'}">${signed(v)}</b>${st !== 'plan' ? `<small>план ${signed(r.plan.profit)}</small>` : '<small>план</small>'}</td>`;
  };
  const profitTot = total(r => (monthStatus(r.m) === 'plan' ? r.plan.profit : r.fact.profit));
  return `<div class="table-wrap"><table class="t pnl grid-lines">
    <thead><tr><th>Статья</th>${rows.map(r => `<th class="r">${monthName(r.m)} <span class="th-tag">${STATUS_TAG[monthStatus(r.m)]}</span></th>`).join('')}<th class="r">До конца года</th></tr></thead>
    <tbody>
      <tr class="group in"><td colspan="${rows.length + 2}">Доходы</td></tr>
      ${line('Подписки <span class="note">из отчётов о продажах</span>', r => r.fact.subs, r => r.plan.subs, 'in')}
      ${line('Прочие приходы', r => r.fact.other, r => r.plan.other, 'in')}
      ${line('Итого доходы', r => r.fact.income, r => r.plan.income, 'sub in')}
      <tr class="group out"><td colspan="${rows.length + 2}">Расходы</td></tr>
      ${outCats.map(c => line(OUT_CATS[c], r => r.fact.out[c] || 0, r => r.plan.out[c] || 0, 'out')).join('') || `<tr><td colspan="${rows.length + 2}" class="note">Расходов пока нет</td></tr>`}
      ${line('Итого расходы', r => r.fact.outTotal, r => r.plan.outTotal, 'sub out')}
      <tr class="total"><td>Прибыль</td>${rows.map(profitCell).join('')}<td class="r pl-cell tot"><b class="${profitTot < 0 ? 'bad' : 'good'}">${signed(profitTot)}</b></td></tr>
      <tr class="fin"><td>Вложения <span class="note">вне P&amp;L</span></td>${rows.map(r => `<td class="r pl-cell"><b>${r.fact.invest ? rubK(r.fact.invest) : '—'}</b></td>`).join('')}<td class="r pl-cell tot"><b>${rubK(total(r => r.fact.invest))}</b></td></tr>
    </tbody></table></div>
    <p class="note">План расходов = план платежей ниже + от выручки по плану: реферальные ${pct(settings().referral)} первых оплат, эквайринг ${pct(settings().acquiring, 1)}, налог ${pct(settings().taxRate)}.</p>`;
}

/* ── план платежей ── */
function planTable() {
  const items = Money.planItems();
  const months = CF_MONTHS;
  const edit = Auth.can('money.edit');
  const seePay = Auth.can('payroll.view');
  if (!items.length) return `<div class="empty"><b>План платежей пуст</b>${edit ? 'Добавьте зарплаты, штаб, сервисы и разовые платежи кнопкой «Платёж».' : ''}</div>`;
  const cell = (it, m) => {
    const a = Money.planAmount(it, m);
    if (!a) return '<td class="r plan-c empty-c"></td>';
    const paid = Money.paid(it, m);
    const canPay = edit && (it.group !== 'payroll' || seePay);
    if (paid) return `<td class="r plan-c paid"><button class="pay-btn paid" ${canPay ? `data-unpay="${it.id}:${m}"` : 'disabled'} title="Оплачено ${dayLong(paid.date)}${canPay ? ' — нажмите, чтобы отменить' : ''}"><span>${rub(a)}</span>${icon('tick')}</button></td>`;
    return `<td class="r plan-c"><div class="pc-amt">${rub(a)}</div>${canPay ? `<button class="pay-btn" data-pay="${it.id}:${m}">Оплатить</button>` : `<span class="note">${m < monthOf(today()) ? 'не оплачено' : ''}</span>`}</td>`;
  };
  const groupRows = Object.entries(PLAN_GROUPS).map(([g, gname]) => {
    const list = items.filter(it => it.group === g);
    if (!list.length) return '';
    const gTot = m => sum(list, it => Money.planAmount(it, m));
    const head = `<tr class="group"><td>${gname}</td>${months.map(m => `<td class="r">${gTot(m) ? rubK(gTot(m)) : ''}</td>`).join('')}<td class="r">${rubK(sum(months, gTot))}</td></tr>`;
    if (g === 'payroll' && !seePay) {
      return head + `<tr><td><span class="soft">${list.length} ${plural(list.length, 'человек', 'человека', 'человек')} в команде</span><div class="note">суммы по людям видит основатель</div></td>${months.map(m => `<td class="r plan-c">${gTot(m) ? rub(gTot(m)) : ''}</td>`).join('')}<td class="r"><b>${rub(sum(months, gTot))}</b></td></tr>`;
    }
    return head + list.map(it => {
      const p = personById(it.personId);
      const off = p && (p.status === 'inactive' || p.archived);
      return `<tr class="${off ? 'dim' : ''}"><td><button class="plan-name" ${edit && (g !== 'payroll' || seePay) ? `data-plan-edit="${it.id}"` : 'disabled'}>${esc(it.title)}</button>${off ? ' <span class="pill warn">не активирован — не считаем</span>' : ''}
        <div class="note">${g === 'payroll' ? `${p ? esc(personName(p)) + ' · ' : ''}${rub(it.amount)}${it.insurance !== false ? ' + взносы ' + pct(settings().insurance, 1) : ''}` : `${catName('out', it.cat)} · ${rub(it.amount)}${g === 'regular' ? ' в месяц' : ''}`}</div></td>
        ${months.map(m => cell(it, m)).join('')}<td class="r"><b>${rub(sum(months, m => Money.planAmount(it, m)))}</b></td></tr>`;
    }).join('');
  }).join('');
  const tot = m => sum(items, it => Money.planAmount(it, m));
  const paidTot = m => sum(items, it => (Money.paid(it, m) ? Money.planAmount(it, m) : 0));
  return `<div class="table-wrap"><table class="t plan grid-lines">
    <thead><tr><th>Платёж</th>${months.map(m => `<th class="r">${monthName(m)}</th>`).join('')}<th class="r">Всего</th></tr></thead>
    <tbody>${groupRows}
      <tr class="total"><td>Итого по плану</td>${months.map(m => `<td class="r">${rub(tot(m))}</td>`).join('')}<td class="r">${rub(sum(months, tot))}</td></tr>
      <tr class="sub"><td>Оплачено</td>${months.map(m => `<td class="r good">${paidTot(m) ? rub(paidTot(m)) : '—'}</td>`).join('')}<td class="r good">${rub(sum(months, paidTot))}</td></tr>
      <tr class="sub"><td>Осталось оплатить</td>${months.map(m => `<td class="r">${tot(m) - paidTot(m) ? rub(tot(m) - paidTot(m)) : '—'}</td>`).join('')}<td class="r">${rub(sum(months, m => tot(m) - paidTot(m)))}</td></tr>
    </tbody></table></div>`;
}
function wirePlan(root) {
  on(root, 'click', '[data-pay]', async (e, el) => {
    const [id, m] = el.dataset.pay.split(':');
    const it = Store.get('plan', id);
    if (!it) return;
    const a = Money.planAmount(it, m);
    if (!(await confirmPop(el, {text: `Отметить оплаченным: ${it.title}, ${monthName(m).toLowerCase()} — ${rub(a)}?`, yes: 'Да, оплачено'}))) return;
    const cur = monthOf(today());
    const date = m === cur ? today() : m < cur ? monthEnd(m) : today();
    Store.add('ledger', {kind: 'out', amount: a, cat: it.group === 'payroll' ? 'payroll' : (it.cat || 'other'), date, note: it.title,
      planId: it.id, planMonth: m, by: Tasks.meKey(), at: Date.now()});
    toast(`Оплачено: ${it.title}`);
  });
  on(root, 'click', '[data-unpay]', async (e, el) => {
    const [id, m] = el.dataset.unpay.split(':');
    const it = Store.get('plan', id);
    const paid = it && Money.paid(it, m);
    if (!paid) return;
    if (!(await confirmPop(el, {text: `Отменить оплату: ${it.title}, ${monthName(m).toLowerCase()}? Операция уйдёт из журнала.`, yes: 'Да, отменить', danger: true}))) return;
    const copy = clone(paid);
    Store.remove('ledger', paid.id);
    toast('Оплата отменена', {undo: () => Store.put('ledger', copy.id, copy)});
  });
  on(root, 'click', '[data-plan-edit]', (e, el) => editPlanItem(el.dataset.planEdit));
  on(root, 'click', '[data-plan-add]', () => editPlanItem(null));
}
function editPlanItem(id) {
  const it = id ? Store.get('plan', id) : null;
  const seePay = Auth.can('payroll.view');
  const v = it || {title: '', group: 'regular', cat: 'office', amount: '', months: [monthOf(today())], insurance: true, personId: ''};
  const groups = Object.entries(PLAN_GROUPS).filter(([g]) => g !== 'payroll' || seePay);
  openModal({
    title: it ? 'Платёж в плане' : 'Новый платёж',
    body: `<label class="field"><span>Название</span><input class="input" id="piTitle" value="${esc(v.title)}" placeholder="Например: Студия-штаб, аренда"></label>
      <div class="grid3">
        <label class="field"><span>Группа</span><select class="select" id="piGroup">${groups.map(([g, n]) => `<option value="${g}" ${g === v.group ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="field" id="piCatF"><span>Статья</span><select class="select" id="piCat">${Object.entries(OUT_CATS).filter(([k]) => k !== 'payroll').map(([k, n]) => `<option value="${k}" ${k === v.cat ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="field"><span>Сумма за месяц, ₽</span><input class="input num" id="piAmount" inputmode="decimal" value="${esc(v.amount)}"></label>
      </div>
      <div class="grid2" id="piPayF">
        <label class="field"><span>Человек</span><select class="select" id="piPerson"><option value="">Вакансия / не выбран</option>${people().map(p => `<option value="${p.id}" ${p.id === v.personId ? 'selected' : ''}>${esc(personName(p))}</option>`).join('')}</select></label>
        <label class="check pi-ins"><input type="checkbox" id="piIns" ${v.insurance !== false ? 'checked' : ''}>Плюс страховые взносы ${pct(settings().insurance, 1)}</label>
      </div>
      <div class="field"><span>В какие месяцы платим</span><div class="chips">${CF_MONTHS.map(m => `<label class="chip pick"><input type="checkbox" value="${m}" ${(v.months || []).includes(m) ? 'checked' : ''}>${monthName(m)}</label>`).join('')}</div></div>`,
    foot: `${it ? `<button class="btn danger left" id="piDel">${icon('trash')}Удалить</button>` : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" id="piSave">Сохранить</button>`,
    onMount(el, close) {
      const sync = () => {
        const pay = $('#piGroup', el).value === 'payroll';
        $('#piPayF', el).hidden = !pay;
        $('#piCatF', el).hidden = pay;
      };
      $('#piGroup', el).onchange = sync;
      sync();
      $('#piSave', el).onclick = () => {
        const title = $('#piTitle', el).value.trim();
        const amount = parseNum($('#piAmount', el).value);
        const months = $$('.chip.pick input:checked', el).map(i => i.value);
        if (!title) return $('#piTitle', el).focus();
        if (!(amount > 0)) { $('#piAmount', el).focus(); toast('Укажите сумму'); return; }
        if (!months.length) { toast('Отметьте хотя бы один месяц'); return; }
        const group = $('#piGroup', el).value;
        const data = {title, group, amount, months, cat: group === 'payroll' ? 'payroll' : $('#piCat', el).value,
          personId: group === 'payroll' ? $('#piPerson', el).value || null : null, insurance: group === 'payroll' ? $('#piIns', el).checked : false};
        if (it) Store.put('plan', it.id, {...it, ...data}); else Store.add('plan', data);
        close();
      };
      const del = $('#piDel', el);
      if (del) del.onclick = async () => {
        const paid = Store.all('ledger').filter(e => e.planId === it.id).length;
        if (!(await confirmPop(del, {text: paid ? `Удалить платёж из плана? ${paid} оплат(ы) останутся в журнале.` : 'Удалить платёж из плана?', yes: 'Да, удалить', danger: true}))) return;
        const copy = clone(it);
        Store.remove('plan', it.id);
        close();
        toast('Платёж удалён из плана', {undo: () => Store.put('plan', copy.id, copy)});
      };
    },
  });
}

    onMount(el, close) {

      on(el, 'click', '[data-k]', (e, b) => { kind = b.dataset.k; $$('[data-k]', el).forEach(x => x.classList.toggle('on', x === b)); fillCats(''); });
      $('#leSave', el).onclick = () => {
        const amount = parseNum($('#leAmount', el).value);

        close();
        toast('Операция удалена', {undo: () => Store.put('ledger', copy.id, copy)});
      };
    },
  });
}

        `<div class="seg" title="Сравнить со сценарием">${Object.entries(SCENARIOS).map(([k, x]) => `<button data-sc="${k}" class="${k === sc ? 'on' : ''}">${x.name} ${fmt(Plan.total(k))}</button>`).join('')}</div>${helpBtn('reports')}`)}
      ${helpBox('reports', `<b>Как вносить цифры.</b> Каждый день до вечера (и обязательно до созвона в понедельник, 11:00) откройте «Цифры дня», выберите дату и впишите охват, регистрации и оплаты. Выручка посчитается сама: оплаты и продления × ${rub(s.price)} — поправьте, если были годовые тарифы или скидки. Внести может любой в команде, исправить — тоже: видно, кто внёс последним. Сценарий сверху только меняет сравнение — план команды выбирает основатель в «Стратегии».`)}

/* ── цифры дня ── */

  const inp = ([k, name, hint]) => `<label class="field"><span>${name}</span><input class="input num" id="se-${k}" data-sf="${k}" inputmode="numeric" value="${esc(val(k))}" placeholder="0"><small>${hint}</small></label>`;

        <button type="button" class="icon-btn" data-shift="1" aria-label="Следующий день" style="transform:scaleX(-1)">${icon('back')}</button>

      </div>
      <span class="note">${rec ? `внесено${by ? ': ' + esc(personName(by)) : ''}, ${timeAgo(rec.at)}` : 'за этот день ещё ничего'}</span>
    </div>
    <div class="entry-grid">${SALES_FIELDS.map(inp).join('')}
      <label class="field"><span>Выручка, ₽</span><input class="input num" id="se-revenue" data-sf="revenue" inputmode="numeric" value="${esc(val('revenue'))}" placeholder="${fmt(auto)}"><small>само: ${fmt(auto)} ₽ — поправьте при годовых</small></label>
    </div>
    <details class="entry-more" ${dr.experts || dr.mk || dr.note ? 'open' : ''}><summary>Продукт и заметка</summary>
      <div class="entry-grid">${PRODUCT_FIELDS.map(inp).join('')}
        <label class="field entry-note"><span>Заметка</span><input class="input" id="se-note" data-sf="note" value="${esc(val('note'))}" placeholder="Что повлияло на цифры: эфир, рассылка, сбой оплаты" maxlength="200"></label></div>
    </details>
    <div class="entry-foot">
      <span class="note">${[dr.reach && dr.views ? `просмотр ${pct(dr.views / dr.reach, 1)}` : '', dr.views && dr.clicks ? `переход ${pct(dr.clicks / dr.views, 1)}` : '', dr.clicks && dr.regs ? `регистрация ${pct(dr.regs / dr.clicks, 1)}` : dr.reach && dr.regs ? `охват → регистрация ${pct(dr.regs / dr.reach, 1)}` : '', dr.regs && dr.pays ? `покупка ${pct(dr.pays / dr.regs, 1)}` : ''].filter(Boolean).join(' · ')}</span>
      ${rec && Auth.can('tasks.manage') ? '<button type="button" class="btn ghost sm" id="seDel">Удалить день</button>' : ''}
      <button class="btn primary" type="submit">${rec ? 'Обновить' : 'Сохранить'} цифры за ${dayLong(d)}</button>
    </div>
  </form>`;
}
function wireEntry(root) {
  const form = $('#salesForm', root);
  if (!form) return;
  const d = () => RepUI.date || today();
  on(form, 'input', '[data-sf]', (e, el) => {
    const k = el.dataset.sf;
    const dr = RepUI.drafts[d()] = RepUI.drafts[d()] || {...(Sales.day(d()) || {})};
    dr[k] = k === 'note' ? el.value : (el.value === '' ? '' : Math.max(0, Math.round(parseNum(el.value))));
    if (k === 'pays' || k === 'renewals') {
      const auto = ((Number(dr.pays) || 0) + (Number(dr.renewals) || 0)) * settings().price;
      const r = $('#se-revenue', form); r.placeholder = fmt(auto);
      $('#se-revenue', form).nextElementSibling.textContent = `само: ${fmt(auto)} ₽ — поправьте при годовых`;
    }
  });
  on(form, 'click', '[data-shift]', (e, el) => {
    const n = Number(el.dataset.shift);
    RepUI.date = n === 0 ? today() : addDays(d(), n);
    App.render();
  });
  $('#seDate', form).onchange = e => { if (e.target.value) { RepUI.date = e.target.value; App.render(); } };
  const del = $('#seDel', form);
  if (del) del.onclick = async () => {
    if (!(await confirmPop(del, {text: `Удалить цифры за ${dayLong(d())}?`, yes: 'Да, удалить', danger: true}))) return;
    const copy = clone(Sales.day(d()));
    Store.remove('sales', d());
    delete RepUI.drafts[d()];
    toast('Цифры дня удалены', {undo: () => Store.put('sales', copy.id, copy)});
  };
  form.onsubmit = e => {
    e.preventDefault();
    const day = d();
    const rec = {};
    $$('[data-sf]', form).forEach(el => {
      const k = el.dataset.sf;
      if (k === 'note') { if (el.value.trim()) rec.note = el.value.trim(); return; }
      if (el.value.trim() !== '') rec[k] = Math.max(0, Math.round(parseNum(el.value)));
    });
    if (!Object.keys(rec).length) { toast('Впишите хотя бы одну цифру'); return; }
    Store.put('sales', day, {...rec, by: Tasks.meKey(), at: Date.now()});
    delete RepUI.drafts[day];
    toast(`Цифры за ${dayLong(day)} сохранены`);
    App.render();
  };
}

/* ── по дням ── */
function dayView(sc) {
  const t = today();
  const months = CF_MONTHS.filter(m => m <= monthOf(t) || m === Q.months[0]);
  let m = View.get('r.month', monthOf(t));
  if (!CF_MONTHS.includes(m)) m = CF_MONTHS.includes(monthOf(t)) ? monthOf(t) : Q.months[0];
  const days = [];
  for (let d = monthStart(m); d <= monthEnd(m); d = addDays(d, 1)) days.push(d);
  const byDay = byKey(Sales.list(), 'id');
  const chart = barChart({
    labels: days.map(d => ({text: dayWd(d), tick: String(Number(d.slice(8)))})),
    values: days.map(d => (d <= t ? Number((byDay[d] || {}).pays) || 0 : 0)),
    plan: Q.months.includes(m) ? days.map(d => Math.round(Plan.day(sc, d) * 10) / 10) : null,
    highlight: days.indexOf(t),
  });
  const rows = days.filter(d => d <= t || byDay[d]).reverse();
  const table = rows.length ? `<div class="table-wrap"><table class="t days">
    <thead><tr><th>День</th><th class="r">Охват</th><th class="r">Просм.</th><th class="r">Перех.</th><th class="r">Регистрации</th><th class="r">Оплаты</th><th class="r">Продления</th><th class="r">Выручка</th><th class="r">Рег. → оплата</th><th class="r">План оплат</th><th class="r">±</th><th>Внёс</th></tr></thead>
    <tbody>${rows.map(d => {
      const r = byDay[d];
      const plan = Plan.day(sc, d);
      const pays = r ? Number(r.pays) || 0 : 0;
      const diff = pays - plan;
      const p = r ? personById(r.by) : null;
      return `<tr class="${d === t ? 'now' : ''} ${Auth.can('sales.edit') ? 'click' : ''}" data-day="${d}">
        <td class="nowrap">${dayWd(d)}${r && r.note ? ` <span class="pill line" title="${esc(r.note)}">заметка</span>` : ''}</td>
        ${r ? `<td class="r">${fmt(r.reach || 0)}</td><td class="r">${r.views ? fmt(r.views) : '—'}</td><td class="r">${r.clicks ? fmt(r.clicks) : '—'}</td><td class="r">${fmt(r.regs || 0)}</td><td class="r"><b>${fmt(pays)}</b></td><td class="r">${fmt(r.renewals || 0)}</td><td class="r">${rub(revenueOf(r))}</td><td class="r">${r.regs ? pct(pays / r.regs, 1) : '—'}</td>`
          : `<td class="r muted" colspan="8">${Auth.can('sales.edit') ? 'не внесено — нажмите, чтобы внести' : 'не внесено'}</td>`}
        <td class="r muted">${plan ? fmt(plan, 1) : '—'}</td>
        <td class="r ${!plan ? '' : diff >= 0 ? 'good' : 'bad'}">${plan ? (diff >= 0 ? '+' : '') + fmt(diff, 1) : ''}</td>
        <td class="soft nowrap">${p ? esc(firstName(p)) : ''}</td></tr>`;
    }).join('')}</tbody></table></div>` : '<div class="empty"><b>Этот месяц ещё не начался</b>Цифры появятся с первого дня.</div>';
  return `<div class="tabs sub-tabs">${months.map(x => `<button data-rm="${x}" class="${x === m ? 'on' : ''}">${monthName(x)}</button>`).join('')}</div>
    <div class="card"><div class="card-head"><h2>Продажи по дням · ${monthName(m).toLowerCase()}</h2><span class="note">${Q.months.includes(m) ? `план ${fmt(Plan.sales(sc, m))} за месяц — ${fmt(Plan.sales(sc, m) / daysInMonth(m), 1)} в день` : 'подготовительный месяц — без плана'}</span></div>${chart}</div>
    <div class="section">${table}</div>`;
}

/* ── по неделям ── */
function weekView(sc) {
  const t = today();
  const weeks = [];
  for (let w = weekStart('2026-09-01'); w <= Q.end; w = addDays(w, 7)) weeks.push(w);
  const rows = weeks.map(w => {
    const from = w < '2026-09-01' ? '2026-09-01' : w, to = addDays(w, 6) > Q.end ? Q.end : addDays(w, 6);
    const f = Sales.range(from, to), plan = Plan.range(sc, from, to);
    return {w, from, to, f, plan, now: t >= w && t <= addDays(w, 6), future: from > t};
  });
  const chart = barChart({
    labels: rows.map(r => ({text: weekLabel(r.w), tick: dayShort(r.w).replace(NB, ' ')})),
    values: rows.map(r => (r.future ? 0 : r.f.pays)),
    plan: rows.map(r => Math.round(r.plan)),
    highlight: rows.findIndex(r => r.now),
  });
  return `<div class="card"><div class="card-head"><h2>Продажи по неделям</h2><span class="note">понедельник — воскресенье, план ${SCENARIOS[sc].name.toLowerCase()}</span></div>${chart}</div>
    <div class="section table-wrap"><table class="t weeks-t">
      <thead><tr><th>Неделя</th><th class="r">План продаж</th><th class="r">Факт</th><th class="r">% плана</th><th class="r">Регистрации</th><th class="r">план</th><th class="r">Охват</th><th class="r">Выручка</th><th class="r">Рег. → оплата</th></tr></thead>
      <tbody>${rows.map(r => {
        const share = r.plan ? r.f.pays / r.plan : null;
        return `<tr class="${r.now ? 'now' : ''} ${r.future ? 'muted-row' : ''}">
          <td class="nowrap">${weekLabel(r.w)}${r.now ? ' <span class="pill rose">эта</span>' : ''}</td>
          <td class="r">${r.plan ? fmt(r.plan, 0) : '—'}</td>
          <td class="r"><b>${r.future ? '' : fmt(r.f.pays)}</b></td>
          <td class="r ${r.future || !r.plan ? '' : paceTone(r.f.pays, r.plan)}">${r.future || !r.plan ? '' : pct(share)}</td>
          <td class="r">${r.future ? '' : fmt(r.f.regs)}</td><td class="r muted">${r.plan ? fmt(Plan.regs(r.plan)) : '—'}</td>
          <td class="r">${r.future ? '' : fmt(r.f.reach)}</td><td class="r">${r.future ? '' : rubK(r.f.revenue)}</td>
          <td class="r">${r.future || !r.f.regs ? '' : pct(r.f.pays / r.f.regs, 1)}</td></tr>`;
      }).join('')}</tbody></table></div>`;
}

/* ── по месяцам: сверка ── */

  const row = (name, get, getPlan, f = fmt) => `<tr><td>${name}</td>${cols.map(c => cell(get(c.f), getPlan(c), c.started, f)).join('')}${cell(get(qf), sum(Q.months, m => getPlan({m, plan: Plan.sales(sc, m)})), t >= Q.start, f)}</tr>`;

      ${row('Охват', f => f.reach, c => Plan.reach(c.plan))}
      ${row('Выручка первых платежей', f => f.revNew, c => c.plan * s.price, rubK)}
      ${row('Продления', f => f.revRenew, c => (chain[c.m] ? chain[c.m].revRenew : 0), rubK)}

      <tr><td>Охват → регистрация</td>${cols.map(c => rateCell(c.f.regs, c.f.reach, s.convReg, c.started)).join('')}${rateCell(qf.regs, qf.reach, s.convReg, t >= Q.start)}</tr>
      <tr><td>Эксперты / мастер-классы</td>${cols.map(c => `<td class="r sv"><b>${c.started ? `${fmt(c.f.experts)} / ${fmt(c.f.mk)}` : '—'}</b></td>`).join('')}<td class="r sv"><b>${fmt(cumExperts)} / ${fmt(cumMk)}</b><small>цель ${s.expertsGoal}+ / ${s.mkGoal}+</small></td></tr>
      <tr class="total"><td>Премия команды <span class="note">${pct(s.premium)} чистого дохода</span></td>${cols.map(() => '<td></td>').join('')}<td class="r sv"><b>${rubK(premium)}</b><small>по плану ${rubK(premiumPlan)}</small></td></tr>

/* ── Cash Flow ── */

function materialsHtml() {
  const mats = MATERIALS.filter(matVisible);
  const custom = Store.all('links').filter(l => (l.roles || ALL_ROLES).includes(Auth.role())).sort((a, b) => (a.at || 0) - (b.at || 0));
  const std = mats.find(m => m.group === 'standards');
  const card = m => `<a class="mat" href="#m-${m.id}"><span class="mat-ico">${icon(m.group === 'standards' ? 'book' : 'play')}</span><span class="mat-t"><b>${esc(m.title)}</b><small>${esc(m.sub)}</small></span>${icon('arrow', 'mat-go')}</a>`;
  const groups = ['team', 'investors', 'experts'].map(g => {
    const list = mats.filter(m => m.group === g);
    const own = custom.filter(l => l.group === g);
    if (!list.length && !own.length) return '';
    return `<div class="mat-group"><div class="mat-gh"><b>${MAT_GROUPS[g].name}</b><span>${MAT_GROUPS[g].about}</span></div>
      ${list.map(card).join('')}${own.map(linkCard).join('')}</div>`;
  }).join('');
  const more = Auth.role() === 'investor' ? [] : MORE_LINKS;
  const ownMore = custom.filter(l => !l.group || l.group === 'more' || l.group === 'standards');
  return `<div class="mats">
    ${std ? `<a class="mat-hero" href="#m-${std.id}">${brandIcon('mat-star')}<div><span class="label">Стандарты</span><b>${esc(std.title)}</b><p>${esc(std.sub)}</p></div><span class="btn primary sm">Открыть${icon('arrow')}</span></a>` : ''}

function linkCard(l) {
  const url = safeUrl(l.url);
  return `<div class="mat-wrap"><a class="mat" href="${esc(url)}" target="_blank" rel="noopener"><span class="mat-ico">${icon('ext')}</span><span class="mat-t"><b>${esc(l.title)}</b><small>${esc(l.sub || 'ссылка, откроется в новой вкладке')}</small></span></a>${Auth.isOwner() ? `<button class="icon-btn mat-del" data-link-del="${l.id}" title="Убрать ссылку" aria-label="Убрать ссылку">${icon('x')}</button>` : ''}</div>`;
}
function wireMaterials(root) {
  on(root, 'click', '[data-link-add]', () => {
    openModal({
      title: 'Материал по ссылке',
      body: `<label class="field"><span>Название</span><input class="input" id="lkTitle" placeholder="Например: Отчёт для инвестора, ноябрь"></label>
        <label class="field"><span>Ссылка</span><input class="input" id="lkUrl" placeholder="https://claude.ai/artifact/…"></label>
        <label class="field"><span>Короткое описание</span><input class="input" id="lkSub" placeholder="Необязательно"></label>
        <div class="grid2"><label class="field"><span>Раздел</span><select class="select" id="lkGroup">${Object.entries(MAT_GROUPS).filter(([k]) => k !== 'standards').map(([k, g]) => `<option value="${k}">${g.name}</option>`).join('')}</select></label>
        <label class="field"><span>Кому видно</span><select class="select" id="lkRoles"><option value="team">Команде</option><option value="all">Всем, включая инвесторов</option></select></label></div>`,
      foot: '<button class="btn" data-close>Отмена</button><button class="btn primary" id="lkSave">Добавить</button>',
      onMount(el, close) {
        $('#lkSave', el).onclick = () => {
          const title = $('#lkTitle', el).value.trim(), url = safeUrl($('#lkUrl', el).value.trim());
          if (!title) return $('#lkTitle', el).focus();
          if (!url) { $('#lkUrl', el).focus(); toast('Нужна ссылка, начинающаяся с https://'); return; }
          Store.add('links', {title, url, sub: $('#lkSub', el).value.trim(), group: $('#lkGroup', el).value,
            roles: $('#lkRoles', el).value === 'all' ? ALL_ROLES : TEAM_ROLES, at: Date.now()});
          close();
        };
      },
    });
  });
  on(root, 'click', '[data-link-del]', async (e, el) => {
    e.preventDefault();
    e.stopPropagation();
    if (!(await confirmPop(el, {text: 'Убрать ссылку из материалов?', yes: 'Да, убрать', danger: true}))) return;
    const copy = clone(Store.get('links', el.dataset.linkDel));
    Store.remove('links', el.dataset.linkDel);
    toast('Ссылка убрана', {undo: () => Store.put('links', copy.id, copy)});
  });
}

    </div>`;
    const box = $('#vFrame', root);

      const f = document.createElement('iframe');
      f.title = m.title;
      f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
      f.setAttribute('allowfullscreen', '');
      f.srcdoc = html;
      box.innerHTML = '';
      box.appendChild(f);
      setTimeout(() => { try { f.focus(); } catch (e) { /* ничего */ } }, 200);
    };
    if (deckCache[m.id]) { show(deckCache[m.id]); return; }

    });
  },
});

/* Команда: сначала список — должность, направление, ставка, формат, оклад,
   с какого месяца, статус и вход в штаб; затем вид по направлениям.
   Оклад связан с планом платежей в «Деньгах»: поменяли здесь — поменялось
   там. Не активированные люди в плане платежей не считаются. */

const PERSON_STATUS = {
  active:   {name: 'В команде',       tone: 'good'},
  inactive: {name: 'Не активирован',  tone: 'warn'},
  vacancy:  {name: 'Вакансия',        tone: 'line'},
};
const RATES = ['Полная', 'Частичная', 'Проектная'];
const FORMATS = ['Офис', 'Удалённо', 'Гибрид'];
const pStatus = p => (PERSON_STATUS[p.status] ? p.status : 'active');

App.register('team', {
  title: 'Команда',
  render(root) {
    const owner = Auth.can('team.manage');
    const seePay = Auth.can('payroll.view');
    const view = View.get('team.view', 'list');
    const ppl = people();
    const accs = Store.all('accounts');
    const invs = Store.all('invites');
    const tasks = Tasks.all();
    const accOf = pid => accs.find(a => a.personId === pid && a.active !== false);
    const invOf = pid => invs.find(i => i.personId === pid && !i.usedBy);
    const load = p => {
      const open = tasks.filter(t => t.assignee === p.id && Tasks.isOpen(t));
      return {open: open.length, late: open.filter(t => Tasks.overdue(t)).length};
    };
    const active = ppl.filter(p => pStatus(p) === 'active');
    const fot = sum(active, p => Number(p.salary) || 0);
    const access = p => {
      const acc = accOf(p.id), inv = invOf(p.id);
      if (acc) return `${rolePill(acc.role)}<small>${acc.lastSeen ? 'был ' + timeAgo(acc.lastSeen) : ''}</small>`;
      if (inv) return `<span class="pill warn">код выдан</span>${owner ? `<button class="link-btn" data-invite-for="${p.id}">код</button>` : ''}`;
      return owner && pStatus(p) !== 'vacancy' ? `<button class="btn xs" data-invite-for="${p.id}">${icon('key')}Пригласить</button>` : '<span class="muted">нет входа</span>';
    };

    const table = `<div class="table-wrap"><table class="t team-t">
      <thead><tr><th>Человек</th><th>Направление</th><th>Ставка · формат</th>${seePay ? '<th class="r">Оклад</th><th>С</th>' : ''}<th>Статус</th><th>Вход в штаб</th><th class="r">Задачи</th>${owner ? '<th></th>' : ''}</tr></thead>
      <tbody>${ppl.map(p => {
        const l = load(p), st = PERSON_STATUS[pStatus(p)];
        return `<tr class="${pStatus(p) !== 'active' ? 'dim' : ''}">
          <td><a class="tp" href="#p-${p.id}">${avatar(p)}<span><b>${esc(p.name || 'Имя не указано')}</b><small>${esc(p.title || '')}</small></span></a></td>
          <td>${dirPill(p.dir) || '<span class="muted">—</span>'}</td>
          <td class="soft">${esc([p.rate, p.format].filter(Boolean).join(' · ') || '—')}</td>
          ${seePay ? `<td class="r nowrap">${p.salary ? rub(p.salary) : '<span class="muted">—</span>'}</td><td class="nowrap soft">${p.startMonth ? monthShort(p.startMonth) : '—'}</td>` : ''}
          <td><span class="pill ${st.tone}">${st.name}</span></td>
          <td class="tp-acc">${access(p)}</td>
          <td class="r nowrap"><button class="link-btn" data-person-tasks="${p.id}">${l.open}</button>${l.late ? ` <span class="bad" title="просрочено">· ${l.late}</span>` : ''}</td>
          ${owner ? `<td class="r"><button class="icon-btn" data-person-edit="${p.id}" title="Изменить">${icon('edit')}</button></td>` : ''}
        </tr>`;
      }).join('')}</tbody>
      ${seePay ? `<tfoot><tr class="total"><td colspan="3">Фонд оплаты труда в месяц — активные</td><td class="r nowrap">${rub(fot)}</td><td colspan="${owner ? 5 : 4}" class="soft">с взносами ${rub(Math.round(fot * (1 + settings().insurance)))}</td></tr></tfoot>` : ''}
    </table></div>`;

    const card = p => {
      const l = load(p), acc = accOf(p.id);
      const lead = Object.entries(Strategy.whales()).find(([, w]) => w.lead === p.id);
      return `<a class="person" href="#p-${p.id}">
        <div class="person-h">${avatar(p, 'lg')}<div class="person-n"><b>${esc(p.name || 'Имя не указано')}</b><span>${esc(p.title || '')}</span></div></div>
        <div class="person-tags">${pStatus(p) !== 'active' ? `<span class="pill ${PERSON_STATUS[pStatus(p)].tone}">${PERSON_STATUS[pStatus(p)].name}</span>` : ''}${lead ? `<span class="pill gold">ведёт «${DIRS[lead[0]].name}»</span>` : ''}${acc ? rolePill(acc.role) : ''}</div>
        <div class="person-f"><span>${l.open} ${plural(l.open, 'задача', 'задачи', 'задач')}</span>${l.late ? `<span class="bad">${l.late} просрочено</span>` : ''}</div>
      </a>`;
    };
    const groups = [...Object.keys(DIRS), ''].map(d => {
      const list = ppl.filter(p => (p.dir || '') === d);
      if (!list.length) return '';
      return `<div class="team-group"><div class="team-gh">${d ? `<i class="dot" style="background:${DIRS[d].color}"></i>${DIRS[d].name}<span>${DIRS[d].metric}</span>` : 'Без направления'}<em>${list.length}</em></div>
        <div class="people">${list.map(card).join('')}</div></div>`;
    }).join('');

    root.innerHTML = `
      ${pageHead('Команда', 'Люди, должности, условия и доступ в штаб. Нажмите на человека — откроется его страница.',
        `${owner ? `<button class="btn primary" data-person-add>${icon('plus')}Человек</button>` : ''}`)}
      <div class="team-bar">
        <div class="seg"><button data-tv="list" class="${view === 'list' ? 'on' : ''}">Список</button><button data-tv="dirs" class="${view === 'dirs' ? 'on' : ''}">По направлениям</button></div>
        <span class="team-sum">${ppl.length} ${plural(ppl.length, 'человек', 'человека', 'человек')} · в команде ${active.length}${seePay ? ` · ФОТ ${rubK(fot)} в месяц` : ''}</span>
      </div>
      ${ppl.length ? (view === 'dirs' ? groups : table) : '<div class="empty"><b>В команде пока никого</b>Добавьте людей кнопкой «Человек».</div>'}
      ${owner ? accessHtml(accs, invs) : ''}`;

    on(root, 'click', '[data-tv]', (e, el) => { View.set('team.view', el.dataset.tv); App.render(); });
    on(root, 'click', '[data-person-tasks]', (e, el) => { View.set('t.who', el.dataset.personTasks); View.set('t.late', false); View.set('t.dir', ''); View.set('t.goal', ''); App.go('tasks'); });
    on(root, 'click', '[data-person-edit]', (e, el) => editPerson(el.dataset.personEdit));
    on(root, 'click', '[data-person-add]', () => editPerson(null));
    on(root, 'click', '[data-invite-for]', (e, el) => { e.preventDefault(); issueInvite(el.dataset.inviteFor); });
    if (owner) wireAccess(root);
  },
});

/* оклад → план платежей: меняем суммы у связанных строк зарплаты,
   а если строки нет — заводим её с месяца начала до конца года */
function syncPayroll(pid) {
  const p = personById(pid);
  if (!p) return;
  const items = Store.all('plan').filter(it => it.group === 'payroll' && it.personId === pid);
  const salary = Number(p.salary) || 0;
  items.forEach(it => { if (it.amount !== salary && salary > 0) Store.patch('plan', it.id, {amount: salary}); });
  if (!items.length && salary > 0 && pStatus(p) === 'active') {
    const from = p.startMonth || monthOf(today());
    const months = CF_MONTHS.filter(m => m >= from);
    if (months.length) Store.put('plan', 'pay_' + pid, {title: p.title || personName(p), group: 'payroll', cat: 'payroll', amount: salary, months, personId: pid, insurance: true});
  }
}

  const months = monthRange('2026-08', '2027-12');
  openModal({
    title: p ? personName(p) : 'Новый человек',
    wide: true,
    body: `<div class="form-sec"><span class="label">Кто</span>

      <label class="field"><span>Ставка</span><select class="select" id="peRate"><option value="">—</option>${opt(RATES, v.rate)}</select></label>
      <label class="field"><span>Формат</span><select class="select" id="peFormat"><option value="">—</option>${opt(FORMATS, v.format)}</select></label>
      <label class="field"><span>Оклад в месяц, ₽</span><input class="input num" id="peSalary" inputmode="numeric" value="${v.salary || ''}" placeholder="0 — пока без оклада"><small>попадёт в план платежей</small></label>

      <div class="grid3"><label class="field"><span>Почта</span><input class="input" id="peEmail" value="${esc(v.email || '')}"></label>

        let pid = p ? p.id : null;
        if (p) Store.patch('people', p.id, data); else pid = Store.add('people', {...data, order: 50});

        Store.patch('people', p.id, {archived: true});
