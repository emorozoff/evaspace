<script>
(() => {
'use strict';
/* ── 00-core.js ── */
/* Ядро: DOM, форматирование чисел и дат. Все модули собираются в одну
   область видимости (см. build.py), поэтому функции отсюда видны везде. */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const byKey = (arr, k) => Object.fromEntries(arr.map(x => [x[k], x]));

/* Слияние как у db.update(): вложенные объекты сливаются, остальное заменяется */
function deepMerge(base, patch) {
  const out = isObj(base) ? {...base} : {};
  for (const [k, v] of Object.entries(patch || {})) {
    out[k] = isObj(v) && isObj(out[k]) ? deepMerge(out[k], v) : clone(v);
  }
  return out;
}

/* Делегирование событий: on(root, 'click', '[data-x]', (e, el) => …) */
function on(root, type, sel, fn) {
  root.addEventListener(type, e => {
    const el = e.target.closest(sel);
    if (el && root.contains(el)) fn(e, el);
  });
}

/* ── числа ── */
const NB = ' ';
function fmt(n, d = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const v = Number(n);
  return v.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d}).replace(/\s/g, NB);
}
const rub = n => (n === null || n === undefined ? '—' : fmt(Math.round(n)) + NB + '₽');
/* компактно: 1,45 млн ₽ · 290 тыс ₽ · 900 ₽ */
function rubK(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + fmt(a / 1e6, a >= 1e7 ? 1 : 2).replace(/,?0+$/, '') + NB + 'млн' + NB + '₽';
  if (a >= 1e4) return s + fmt(Math.round(a / 1e3)) + NB + 'тыс' + NB + '₽';
  return s + fmt(Math.round(a)) + NB + '₽';
}
const signed = (n, f = rubK) => (n > 0 ? '+' : n < 0 ? '' : '') + f(n);
/* доля без лишних знаков: 5% · 5,3% · 1,9% */
const pctA = x => (Number.isFinite(x) && Math.abs(x * 100 - Math.round(x * 100)) >= 0.05 ? pct(x, 1) : pct(x));
const pct = (x, d = 0) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : fmt(x * 100, d) + '%');
const parseNum = s => {
  const v = parseFloat(String(s ?? '').replace(/\s| /g, '').replace(',', '.'));
  return Number.isFinite(v) ? v : 0;
};
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/* ── даты: всё в местном времени, формат 'YYYY-MM-DD' и месяц 'YYYY-MM' ── */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
/* «сегодня» можно подменить для проверок: window.__EVA_TODAY = '2026-10-15' */
const today = () => (typeof window !== 'undefined' && window.__EVA_TODAY) || isoOf(new Date());
const addDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return isoOf(d); };
const monthOf = s => String(s).slice(0, 7);
const daysBetween = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
const daysInMonth = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); };
const monthStart = m => m + '-01';
const monthEnd = m => m + '-' + pad(daysInMonth(m));
function addMonths(m, n) {
  const [y, mm] = m.split('-').map(Number);
  const d = new Date(y, mm - 1 + n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthRange(from, to) {
  const out = [];
  for (let m = from; m <= to; m = addMonths(m, 1)) out.push(m);
  return out;
}
/* понедельник недели */
const weekStart = s => { const d = dateOf(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return isoOf(d); };
const weekday = s => (dateOf(s).getDay() + 6) % 7; // 0 = пн

const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_SH = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD_SH = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const monthIdx = m => Number(m.slice(5, 7)) - 1;
/* 'Октябрь' · с годом, если он не текущий квартальный: 'Январь 2027' */
function monthName(m, withYear = false) {
  const name = cap(MONTHS[monthIdx(m)]);
  return withYear || m.slice(0, 4) !== '2026' ? `${name} ${m.slice(0, 4)}` : name;
}
const monthShort = m => cap(MONTHS_SH[monthIdx(m)]) + (m.slice(0, 4) !== '2026' ? ' ' + m.slice(2, 4) : '');
/* '5 окт' · '5 октября' */
const dayShort = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}`; };
const dayLong = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_GEN[d.getMonth()]}`; };
const dayWd = s => `${WD_SH[weekday(s)]}, ${dayShort(s)}`;
/* подпись недели: '5–11 окт' или '28 сен – 4 окт' */
function weekLabel(start) {
  const end = addDays(start, 6), a = dateOf(start), b = dateOf(end);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()}${NB}${MONTHS_SH[b.getMonth()]}`
    : `${dayShort(start)} – ${dayShort(end)}`;
}
function timeAgo(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return 'только что';
  if (s < 3600) { const m = Math.round(s / 60); return `${m}${NB}мин назад`; }
  if (s < 86400) { const h = Math.round(s / 3600); return `${h}${NB}ч назад`; }
  const d = new Date(ts);
  return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ── хранилище браузера: только удобства одного зрителя ── */
const Local = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* приватное окно */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ничего */ } },
};
/* состояние вида (вкладка, фильтр) — помнится в этом браузере */
const View = {
  _s: null,
  get(k, def) { if (!this._s) this._s = Local.get('eva-hq-view', {}); return k in this._s ? this._s[k] : def; },
  set(k, v) { if (!this._s) this._s = Local.get('eva-hq-view', {}); this._s[k] = v; Local.set('eva-hq-view', this._s); },
};

/* ── 01-config.js ── */
/* Константы штаба: роли и права, направления, сценарии квартала, статьи. */

const Q = {
  name: 'IV квартал 2026',
  start: '2026-10-01',
  end: '2026-12-31',
  months: ['2026-10', '2026-11', '2026-12'],
};

const CF_MONTHS = ['2026-09', '2026-10', '2026-11', '2026-12'];

/* ── роли ── */
const ROLES = {
  owner:    {name: 'Основатель',   tone: 'gold',   about: 'видит и меняет всё: стратегию, деньги, доступы'},
  lead:     {name: 'Руководитель', tone: 'violet', about: 'ведёт задачи команды, принимает работу, вносит деньги'},

  investor: {name: 'Инвестор',     tone: 'good',   about: 'только смотрит: главная, стратегия, отчёты, материалы'},
};
const roleOf = r => (ROLES[r] ? r : 'member'); // старые роли (эксперт и т. п.) считаем командой

const PERMS = {
  'tasks.view':     ['owner', 'lead', 'member'],
  'tasks.edit':     ['owner', 'lead', 'member'],

/* ── 02-store.js ── */
/* Хранилище. Один слой — два источника:
   • в артефакте Claude — общая база claude.use('db'): у каждой записи свой
     документ, правки расходятся по команде вживую (onSnapshot);
   • везде ещё (GitHub Pages, локальный сервер) — localStorage этого браузера.
   Коллекции: люди, учётки, приглашения, задачи, операции, план расходов,
   продажи по дням, ссылки на материалы, собрания, занятость по людям
   (только интервалы «занят») и docs — одиночные документы
   (docs/strategy, docs/settings, docs/learning). */

const Store = (() => {
  const COLS = ['accounts', 'invites', 'people', 'tasks', 'ledger', 'plan', 'sales', 'links', 'docs', 'meetings', 'busy'];
  const LS = 'eva-hq:';
  const data = Object.fromEntries(COLS.map(c => [c, new Map()]));
  const subs = new Set();
  const statusSubs = new Set();
  const queue = new Map();
  const state = {mode: 'local', ready: false, pending: 0, error: null, readOnly: false};
  let db = null;

  const strip = o => { const {id, ...body} = o || {}; return body; };
  const emit = c => subs.forEach(fn => { try { fn(c); } catch (e) { console.error(e); } });
  const emitStatus = () => statusSubs.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });

  function loadLocal() {
    for (const c of COLS) {
      const o = Local.get(LS + c, null);
      if (o && typeof o === 'object') for (const [id, v] of Object.entries(o)) data[c].set(id, {...v, id});
    }
  }
  function saveLocal(c) {
    Local.set(LS + c, Object.fromEntries([...data[c]].map(([id, v]) => [id, strip(v)])));
  }

  async function init() {
    loadLocal();
    let api = null;
    try {
      api = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null;
    } catch (e) { api = null; }
    if (!api) { state.mode = 'local'; state.ready = true; emitStatus(); return; }
    db = api;
    state.mode = 'db';
    /* ждём первый окончательный снимок каждой коллекции, чтобы не решить
       «учёток нет» по неполному кэшу; через 9 с идём с тем, что есть */
    await new Promise(resolve => {
      let left = COLS.length, done = false;
      const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
      const timer = setTimeout(finish, 9000);
      COLS.forEach(c => {
        let settled = false;
        const settle = () => { if (!settled) { settled = true; if (--left === 0) finish(); } };
        try {
          db.collection(c).onSnapshot(snap => {
            const m = new Map();
            snap.docs.forEach(d => { const v = d.data(); if (v) m.set(d.id, {...clone(v), id: d.id}); });
            data[c] = m;
            saveLocal(c);
            if (!snap.metadata || !snap.metadata.fromCache) settle();
            if (state.ready) emit(c);
          }, err => {
            state.error = (err && err.code) || 'error';
            if (err && err.code === 'revoked') state.readOnly = true;
            settle();
            emitStatus();
          });
        } catch (e) { settle(); }
      });
    });
    state.ready = true;
    emitStatus();
  }

  /* одна запись на документ за раз: следующая ждёт предыдущую */
  function enqueue(path, op) {
    state.pending++;
    emitStatus();
    const prev = queue.get(path) || Promise.resolve();
    const run = async () => {
      try { await op(); }
      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); await op(); }
        else throw e;
      }
    };
    const p = prev.catch(() => {}).then(run).then(
      () => { state.error = null; },
      e => {
        state.error = (e && e.code) || 'error';
        if (e && e.code === 'invalid_argument') state.readOnly = true;
        console.warn('Запись не прошла', path, e);
        if (typeof toast === 'function') toast(writeErrorText(e), {error: true});
      }
    ).finally(() => {
      state.pending--;
      if (queue.get(path) === p) queue.delete(path);
      emitStatus();
    });
    queue.set(path, p);
    return p;
  }
  function writeErrorText(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') return 'База заполнена: удалите старые записи, чтобы добавить новые';
    if (code === 'invalid_argument') return 'Не сохранилось: у вас доступ только на просмотр этого штаба';
    if (code === 'resource_exhausted') return 'Слишком много правок подряд — повторите через минуту';
    return 'Не сохранилось. Проверьте связь и повторите';
  }

  function commitLocal(c) { saveLocal(c); emit(c); }

  function put(c, id, obj) {
    const body = strip(obj);
    data[c].set(id, {...clone(body), id});
    commitLocal(c);
    if (db) return enqueue(`${c}/${id}`, () => db.collection(c).doc(id).set(body));
    return Promise.resolve();
  }
  function add(c, obj, id = uid()) { put(c, id, obj); return id; }
  function patch(c, id, partial) {
    const cur = data[c].get(id);
    const next = deepMerge(cur ? strip(cur) : {}, partial);
    data[c].set(id, {...next, id});
    commitLocal(c);
    if (!db) return Promise.resolve();
    return enqueue(`${c}/${id}`, async () => {
      const ref = db.collection(c).doc(id);
      if (!cur) return ref.set(next);
      try { await ref.update(clone(partial)); }
      catch (e) {
        /* документа уже нет в базе (удалили с другого устройства) — записываем целиком */
        if (e && e.code === 'invalid_argument') await ref.set(strip(data[c].get(id) || next));
        else throw e;
      }
    });
  }
  function remove(c, id) {
    data[c].delete(id);
    commitLocal(c);
    if (db) return enqueue(`${c}/${id}`, () => db.collection(c).doc(id).delete());
    return Promise.resolve();
  }

  return {
    COLS, state, init, put, add, patch, remove,
    all: c => [...data[c].values()],
    get: (c, id) => data[c].get(id) || null,
    count: c => data[c].size,
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    onStatus(fn) { statusSubs.add(fn); return () => statusSubs.delete(fn); },
    flush: () => Promise.all([...queue.values()]),
  };
})();

/* ── 03-auth.js ── */
/* Вход по ролям. У каждого человека своя учётка; роль решает меню и права.
   Пароль хранится только как PBKDF2-SHA256 (150 000 итераций) с солью —
   тем же способом, что в первой версии, поэтому старые пароли подходят.
   Честно: это разделение кабинетов внутри команды, а не сейф — общая база
   читается всеми, у кого есть доступ к штабу. */

const SESSION_KEY = 'eva-hq-session';
const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
function randSalt() {
  const a = new Uint8Array(16);
  if ((window.crypto || {}).getRandomValues) window.crypto.getRandomValues(a);
  else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  return b64(a.buffer);
}
async function hashPassword(pw, salt) {
  const enc = new TextEncoder();
  const subtle = (window.crypto || {}).subtle;
  if (subtle && subtle.importKey) {
    try {
      const key = await subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await subtle.deriveBits({name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256'}, key, 256);
      return 'pbkdf2$' + b64(bits);
    } catch (e) { /* ниже запасной путь */ }
  }
  let h = 5381;
  const s = salt + '|' + pw;
  for (let r = 0; r < 20000; r++) for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return 'weak$' + h.toString(36);
}
const normEmail = s => String(s || '').trim().toLowerCase();
function makeCode() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 8; i++) s += abc[Math.floor(Math.random() * abc.length)];
  return s.slice(0, 4) + '-' + s.slice(4);
}
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^(.{4})(.+)$/, '$1-$2');

const Auth = {
  me() {
    /* window.__EVA_AS — только для проверок: две вкладки под разными людьми */
    const id = window.__EVA_AS || Local.get(SESSION_KEY, null);
    const a = id ? Store.get('accounts', id) : null;
    return a && a.active !== false ? a : null;
  },
  role() { const a = this.me(); return a ? roleOf(a.role) : null; },
  person() { const a = this.me(); return a ? personById(a.personId) : null; },
  personId() { const a = this.me(); return a ? a.personId || null : null; },
  can(perm) { const r = this.role(); return !!r && (PERMS[perm] || []).includes(r); },
  isOwner() { return this.role() === 'owner'; },

  start(acc) {
    Local.set(SESSION_KEY, acc.id);
    if (!acc.lastSeen || Date.now() - acc.lastSeen > 3600e3) Store.patch('accounts', acc.id, {lastSeen: Date.now()});
  },
  logout() { Local.del(SESSION_KEY); window.__EVA_AS = null; App.render(); },

  findByEmail(email) { const e = normEmail(email); return Store.all('accounts').find(a => normEmail(a.email) === e) || null; },

  async login(email, pw) {
    const acc = this.findByEmail(email);
    if (!acc) throw new Error('Нет учётки с такой почтой. Если вас пригласили — войдите по коду приглашения.');
    if (acc.active === false) throw new Error('Учётка отключена. Напишите основателю.');
    if ((await hashPassword(pw, acc.salt)) !== acc.hash) throw new Error('Пароль не подошёл. Проверьте раскладку или попросите у основателя код сброса.');
    this.start(acc);
  },

  async createAccount({name, email, pw, role, personId}) {
    if (!name.trim()) throw new Error('Напишите имя и фамилию.');
    if (!/^\S+@\S+\.\S+$/.test(email.trim())) throw new Error('Почта выглядит неправильно.');
    if (pw.length < 6) throw new Error('Пароль — не короче 6 символов.');
    if (this.findByEmail(email)) throw new Error('Эта почта уже зарегистрирована — просто войдите.');
    const salt = randSalt();
    const acc = {name: name.trim(), email: normEmail(email), role, personId: personId || null,
      salt, hash: await hashPassword(pw, salt), active: true, createdAt: Date.now(), lastSeen: Date.now()};
    const id = Store.add('accounts', acc);
    return {...acc, id};
  },

  /* первый вход в пустой штаб — учётка основателя и его карточка в команде */
  async createOwner(f) {
    if (Store.count('accounts')) throw new Error('Штаб уже создан — войдите своей почтой.');
    let pid = (people().find(p => p.founder) || {}).id;
    if (!pid) pid = Store.add('people', {name: f.name.trim(), title: 'Основатель', dir: 'ops', founder: true, order: 0});
    const acc = await this.createAccount({...f, role: 'owner', personId: pid});
    if (!personById(pid).name) Store.patch('people', pid, {name: f.name.trim()});
    this.start(acc);
  },

  async acceptInvite(f) {
    const code = normCode(f.code);
    const inv = Store.get('invites', code);
    if (!inv || inv.usedBy) throw new Error('Код не найден или уже использован. Попросите у основателя новый.');
    let pid = inv.personId;
    if (!pid || !personById(pid)) pid = Store.add('people', {name: f.name.trim(), title: inv.title || '', dir: inv.dir || '', order: 50});
    const acc = await this.createAccount({...f, role: roleOf(inv.role), personId: pid});
    const p = personById(pid);
    if (p && !p.name) Store.patch('people', pid, {name: f.name.trim()});
    Store.patch('invites', code, {usedBy: acc.id, usedAt: Date.now()});
    this.start(acc);
  },

  async resetWithCode(f) {
    const acc = this.findByEmail(f.email);
    const r = acc && acc.reset;
    if (!r || r.exp < Date.now()) throw new Error('Код сброса не найден или истёк. Попросите у основателя новый.');
    if ((await hashPassword(normCode(f.code), r.salt)) !== r.hash) throw new Error('Код сброса не подошёл.');
    if (f.pw.length < 6) throw new Error('Пароль — не короче 6 символов.');
    const salt = randSalt();
    await Store.put('accounts', acc.id, {...acc, salt, hash: await hashPassword(f.pw, salt), reset: null});
    this.start(acc);
  },

  /* основатель выдаёт код сброса пароля: действует сутки */
  async issueReset(accId) {
    const code = makeCode(), salt = randSalt();
    await Store.patch('accounts', accId, {reset: {salt, hash: await hashPassword(normCode(code), salt), exp: Date.now() + 864e5}});
    return code;
  },
};

    code:  `<label class="field"><span>${mode === 'reset' ? 'Код сброса' : 'Код приглашения'}</span><input class="input auth-code" id="a-code" autocomplete="one-time-code" placeholder="ABCD-2345"></label>`,
  };
  const [title, lead] = titles[mode];
  const tabs = empty ? '' : `<div class="seg auth-tabs">
      <button data-mode="login" class="${mode === 'login' ? 'on' : ''}">Вход</button>
      <button data-mode="invite" class="${mode === 'invite' ? 'on' : ''}">У меня приглашение</button>
    </div>`;
  const roles = Object.entries(ROLES).map(([k, r]) =>
    `<li><span class="pill ${r.tone}">${r.name}</span><span>${esc(r.about)}</span></li>`).join('');

  root.innerHTML = `<div class="auth">
    <form class="auth-card card" id="authForm" novalidate>
      <div class="auth-brand">${brandIcon('auth-mark')}<div><b>Eva Club</b><span>штаб команды Eva Space · V2</span></div></div>
      ${tabs}
      <h1>${title}</h1>
      <p class="auth-lead">${lead}</p>
      <div class="auth-msg" id="authMsg" hidden></div>
      <div class="auth-fields">${fields[mode].map(k => F[k]).join('')}</div>
      <button class="btn primary auth-go" type="submit" id="authGo">${mode === 'owner' ? 'Создать штаб' : mode === 'invite' ? 'Войти и получить кабинет' : mode === 'reset' ? 'Сохранить пароль и войти' : 'Войти'}</button>
      <div class="auth-links">
        ${mode === 'login' ? '<button type="button" class="link-btn" data-mode="reset">Забыли пароль?</button>' : ''}
        ${mode === 'reset' ? '<button type="button" class="link-btn" data-mode="login">Вернуться ко входу</button>' : ''}
      </div>
      <p class="auth-note">Не используйте пароль от почты или банка: вход разделяет кабинеты внутри команды, а данные штаба видят все, кому открыт доступ к нему.</p>
    </form>
    <aside class="auth-side">
      <p class="label">Кто что видит</p>
      <ul class="auth-roles">${roles}</ul>
      <p class="note">Роль назначает основатель, когда выдаёт код приглашения. Поменять её можно в разделе «Команда».</p>
    </aside>
  </div>`;

  on(root, 'click', '[data-mode]', (e, el) => { e.preventDefault(); View.set('authMode', el.dataset.mode); App.render({force: true}); });
  const form = $('#authForm', root);
  const msg = $('#authMsg', root);
  const val = id => ($('#' + id, root) || {}).value || '';
  form.addEventListener('submit', async e => {
    e.preventDefault();
    msg.hidden = true;
    const f = {name: val('a-name'), email: val('a-email'), pw: val('a-pw'), code: val('a-code')};
    if (fields[mode].includes('pw2') && f.pw !== val('a-pw2')) { msg.textContent = 'Пароли не совпадают.'; msg.hidden = false; return; }
    const go = $('#authGo', root);
    go.disabled = true;
    go.textContent = 'Проверяю…';
    try {
      if (mode === 'owner') await Auth.createOwner(f);
      else if (mode === 'invite') await Auth.acceptInvite(f);
      else if (mode === 'reset') await Auth.resetWithCode(f);
      else await Auth.login(f.email, f.pw);
      View.set('authMode', 'login');
      App.render();
    } catch (err) {
      msg.textContent = err.message || String(err);
      msg.hidden = false;
      go.disabled = false;
      go.textContent = 'Попробовать ещё раз';
    }
  });
  const first = $('input', form);
  /* фокус в первое поле — только если человек ещё никуда не нажал */
  if (first) setTimeout(() => { if (!document.activeElement || document.activeElement === document.body) first.focus(); }, 30);
}

function toast(text, opts = {}) {
  const root = $('#toastRoot');

  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' err' : '');
  const span = document.createElement('span');
  span.textContent = text;
  el.appendChild(span);

  const close = () => { clearTimeout(timer); el.remove(); };

    const b = document.createElement('button');
    b.textContent = 'Отменить';
    b.onclick = () => { close(); opts.undo(); };

  root.appendChild(el);
  timer = setTimeout(close, opts.undo ? 7000 : 4200);
  while (root.children.length > 3) root.firstChild.remove();
}

function openModal({title, body, foot = '', wide = false, focus = true, onMount, onClose}) {
  closePops();

    <div class="modal-body">${body}</div>

  </div>`;
  $('#modalRoot').appendChild(back);
  const el = $('.modal', back);
  const key = e => { if (e.key === 'Escape' && !$('.pop')) close(); };
  function close() {
    if (!back.isConnected) return;
    back.remove();
    document.removeEventListener('keydown', key);
    if (onClose) onClose();
    App.renderSoon();
  }
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  on(back, 'click', '[data-close]', e => { e.preventDefault(); close(); });
  document.addEventListener('keydown', key);
  if (onMount) onMount(el, close);
  const first = $('input:not([type=checkbox]):not([disabled]), textarea, select', el);
  if (first && focus) setTimeout(() => { if (!el.contains(document.activeElement)) first.focus(); }, 30);

}

/* ── подтверждение «Да / Нет» рядом с кнопкой (confirm() в артефакте не работает) ── */
function closePops() { $$('.pop').forEach(p => (p._done ? p._done(false) : p.remove())); }
function confirmPop(anchor, {text, yes = 'Да', no = 'Нет', danger = false}) {
  return new Promise(resolve => {
    closePops();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.setAttribute('role', 'alertdialog');
    pop.innerHTML = `<p></p><div class="row"><button class="btn sm ${danger ? 'danger solid' : 'primary'}" data-yes></button><button class="btn sm" data-no></button></div>`;
    $('p', pop).textContent = text;
    $('[data-yes]', pop).textContent = yes;
    $('[data-no]', pop).textContent = no;
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = r.bottom + 6, left = r.left + r.width / 2 - w / 2;
    if (top + h > window.innerHeight - 8) top = r.top - h - 6;
    left = clamp(left, 8, window.innerWidth - w - 8);
    pop.style.top = (top + window.scrollY) + 'px';
    pop.style.left = (left + window.scrollX) + 'px';
    const done = v => {
      pop.remove();
      document.removeEventListener('mousedown', outside, true);
      document.removeEventListener('keydown', key, true);
      resolve(v);
    };
    pop._done = done;
    const outside = e => { if (!pop.contains(e.target)) done(false); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    document.addEventListener('keydown', key, true);
    $('[data-yes]', pop).onclick = () => done(true);
    $('[data-no]', pop).onclick = () => done(false);
    $('[data-yes]', pop).focus();
  });
}

/* ── выбор из списка рядом с кнопкой (исполнитель на карточке и т. п.) ── */
function pickPop(anchor, items, current) {
  return new Promise(resolve => {
    closePops();
    const pop = document.createElement('div');
    pop.className = 'pop pick';
    pop.setAttribute('role', 'listbox');
    items.forEach(([v, n]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick-i' + (String(v) === String(current) ? ' on' : '');
      b.textContent = n;
      b.onclick = () => done(v);
      pop.appendChild(b);
    });
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = r.bottom + 4, left = r.right - w;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
    left = clamp(left, 8, window.innerWidth - w - 8);
    pop.style.top = (top + window.scrollY) + 'px';
    pop.style.left = (left + window.scrollX) + 'px';
    function done(v) {
      pop.remove();
      document.removeEventListener('mousedown', outside, true);
      document.removeEventListener('keydown', key, true);
      resolve(v);
    }
    pop._done = () => done(null);
    const outside = e => { if (!pop.contains(e.target)) done(null); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    document.addEventListener('keydown', key, true);
    const on = $('.pick-i.on', pop) || $('.pick-i', pop);
    if (on) on.focus();
  });
}

/* ── подсказка «как пользоваться» на странице: скрывается и возвращается ── */

function wireHelp(root) {

/* полоса прогресса: доля и отметка «где должны быть» */
function progress(share, tone = '', mark = null) {
  const w = clamp(share || 0, 0, 1) * 100;
  return `<div class="bar"><i class="${tone}" style="width:${w.toFixed(1)}%"></i>${mark !== null ? `<b style="left:calc(${(clamp(mark, 0, 1) * 100).toFixed(1)}% - 1px)"></b>` : ''}</div>`;
}
const paceTone = (fact, plan) => (!plan ? '' : fact >= plan ? 'good' : fact >= plan * 0.8 ? 'warn' : 'bad');

/* ── графики ──
   Линии: факт — сплошная розовая с заливкой 10% и точкой на конце;
   планы — пунктир (это прогноз), подписаны у правого края.
   Столбики: не толще 24 px, скругление 4 px сверху. Подсказка по наведению. */
/* ровная шкала: шаг 1-2-2,5-5 × 10ⁿ, для штук — только целые */
function niceScale(v, integer = true, ticks = 4) {
  const raw = Math.max(v, integer ? 1 : 1e-9) / ticks;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  let step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  if (integer) step = Math.max(1, Math.ceil(step));
  const max = Math.max(step, Math.ceil(v / step) * step);
  return {max, step};
}
/* ширина графика в пикселях страницы — чтобы подписи были обычного размера */
const chartWidth = () => clamp((($('#page') || {}).clientWidth || 800) - 44, 300, 1200);
function lineChart({labels, series, height = 240, yFmt = fmt}) {
  const W = chartWidth(), H = height, L = 44, R = W < 520 ? 84 : 118, T = 14, B = 26;
  const n = labels.length;
  const sc = niceScale(Math.max(1, ...series.flatMap(s => s.values.filter(v => v !== null))));
  const maxV = sc.max;
  const x = i => L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R));
  const y = v => T + (1 - v / maxV) * (H - T - B);
  let g = '';
  for (let v = 0; v <= maxV + 1e-9; v += sc.step) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 8));
  labels.forEach((lb, i) => { if (lb.tick) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(lb.tick)}</text>`; else if (!labels.some(l => l.tick) && i % step === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(lb.text)}</text>`; });
  let marks = '';
  const ends = [], endsAbove = [];
  series.forEach(s => {
    const pts = s.values.map((v, i) => (v === null ? null : [x(i), y(v)])).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    if (s.area) marks += `<path d="${d}L${pts[pts.length - 1][0].toFixed(1)} ${y(0)}L${pts[0][0].toFixed(1)} ${y(0)}Z" fill="${s.color}" opacity=".1"/>`;
    marks += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linecap="round" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 5"' : ''} opacity="${s.opacity || 1}"/>`;
    const last = pts[pts.length - 1];
    if (s.dot) marks += `<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    if (s.endLabel) (s.labelAbove ? endsAbove : ends).push({y: last[1], x: last[0], text: s.endLabel, above: !!s.labelAbove});
  });
  ends.sort((a, b) => a.y - b.y);
  ends.push(...endsAbove);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  ends.forEach(e => { marks += e.above ? `<text x="${e.x}" y="${e.y - 12}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${esc(e.text)}</text>` : `<text x="${e.x + 8}" y="${e.y + 4}" style="fill:var(--ink-2)">${esc(e.text)}</text>`; });
  const legend = series.filter(s => s.legend).map(s => `<span><i class="${s.dash ? 'dash' : ''}" style="background:${s.color};color:${s.color}"></i>${esc(s.legend)}</span>`).join('');
  const data = esc(JSON.stringify({labels: labels.map(l => l.text), series: series.map(s => ({name: s.legend || s.endLabel || '', color: s.color, dash: !!s.dash, values: s.values}))}));
  return `<div class="chart-box" data-chart="line" data-cfg="${data}" data-geo="${[W, H, L, R, T, B].join(',')}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}<line class="cross" x1="0" x2="0" y1="${T}" y2="${y(0)}" hidden/></svg>
    <div class="chart-tip" hidden></div>
  </div>${legend ? `<div class="legend">${legend}</div>` : ''}`;
}
function barChart({labels, values, plan = null, height = 200, color = 'var(--rose)', yFmt = fmt, highlight = -1}) {
  const W = chartWidth(), H = height, L = 40, R = 12, T = 12, B = 26;
  const n = labels.length;
  const sc = niceScale(Math.max(1, ...values.map(v => v || 0), ...(plan || []).map(v => v || 0)));
  const maxV = sc.max;
  const band = (W - L - R) / Math.max(1, n);
  const bw = Math.min(24, Math.max(3, band - 2));
  const y = v => T + (1 - v / maxV) * (H - T - B);
  let g = '';
  for (let v = 0; v <= maxV + 1e-9; v += sc.step) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / (W < 520 ? 7 : 12)));
  let marks = '';
  values.forEach((v, i) => {
    const cx = L + band * i + band / 2;
    if (i % step === 0 || i === n - 1) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(labels[i].tick ?? labels[i].text)}</text>`;
    const val = v || 0;
    const h = Math.max(0, y(0) - y(val));
    const r = Math.min(4, h / 2, bw / 2);
    const x0 = cx - bw / 2, top = y(0) - h;
    const d = h > 0 ? `M${x0} ${y(0)}V${top + r}Q${x0} ${top} ${x0 + r} ${top}H${x0 + bw - r}Q${x0 + bw} ${top} ${x0 + bw} ${top + r}V${y(0)}Z` : '';
    const tip = `${labels[i].text}|${yFmt(val)}${plan ? '|' + yFmt(plan[i] || 0) : ''}`;
    marks += `<g class="bar-hit" data-tip="${esc(tip)}" tabindex="0"><rect x="${cx - band / 2}" y="${T}" width="${band}" height="${y(0) - T}" fill="transparent"/>${d ? `<path d="${d}" fill="${color}" opacity="${i === highlight || highlight < 0 ? 1 : .55}"/>` : ''}</g>`;
  });
  if (plan) {
    const pts = plan.map((v, i) => `${i ? 'L' : 'M'}${(L + band * i + band / 2).toFixed(1)} ${y(v || 0).toFixed(1)}`).join('');
    marks += `<path d="${pts}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4" pointer-events="none"/>`;
  }
  return `<div class="chart-box" data-chart="bar"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}</svg><div class="chart-tip" hidden></div></div>
    ${plan ? `<div class="legend"><span><i style="background:${color}"></i>Факт</span><span><i class="dash" style="color:var(--ink-2)"></i>План</span></div>` : ''}`;
}
/* подсказки графиков: одна подписка на весь документ */
function wireCharts() {
  const tipAt = (box, html, px, py) => {
    const tip = $('.chart-tip', box);
    tip.innerHTML = html;
    tip.hidden = false;
    const bw = box.clientWidth, tw = tip.offsetWidth;
    tip.style.left = clamp(px + 12, 0, bw - tw) + 'px';
    tip.style.top = Math.max(0, py - tip.offsetHeight - 8) + 'px';
  };
  document.addEventListener('pointermove', e => {
    const box = e.target.closest && e.target.closest('.chart-box');
    $$('.chart-box').forEach(b => { if (b !== box) { const t = $('.chart-tip', b); if (t) t.hidden = true; const c = $('.cross', b); if (c) c.setAttribute('hidden', ''); } });
    if (!box) return;
    const rect = box.getBoundingClientRect();
    if (box.dataset.chart === 'line') {
      const cfg = JSON.parse(box.dataset.cfg);
      const [W, H, L, R, T, B] = box.dataset.geo.split(',').map(Number);
      const sx = (e.clientX - rect.left) * (W / rect.width);
      const n = cfg.labels.length;
      const i = clamp(Math.round(((sx - L) / (W - L - R)) * (n - 1)), 0, n - 1);
      const cx = L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R));
      const cross = $('.cross', box);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.removeAttribute('hidden');
      const rows = cfg.series.filter(s => s.values[i] !== null && s.values[i] !== undefined)
        .map(s => `<div class="tip-row"><i class="${s.dash ? 'dash' : ''}" style="background:${s.color};color:${s.color}"></i><b>${fmt(s.values[i])}</b><span>${esc(s.name)}</span></div>`).join('');
      tipAt(box, `<div class="tip-h">${esc(cfg.labels[i])}</div>${rows}`, (cx / W) * rect.width, e.clientY - rect.top);
    } else {
      const hit = e.target.closest('.bar-hit');
      if (!hit) { $('.chart-tip', box).hidden = true; return; }
      const [label, val, plan] = hit.dataset.tip.split('|');
      tipAt(box, `<div class="tip-h">${esc(label)}</div><div class="tip-row"><b>${esc(val)}</b><span>факт</span></div>${plan !== undefined ? `<div class="tip-row"><b>${esc(plan)}</b><span>план</span></div>` : ''}`, e.clientX - rect.left, e.clientY - rect.top);
    }
  });
}

/* ── 05-app.js ── */
/* Оболочка и маршруты. Адрес страницы — простое слово после #:
   #home, #strategy, #tasks, #money, #reports, #team, #m-standards (материал).
   Данные приходят вживую — страница перерисовывается сама, но не тогда,
   когда человек печатает в поле: дождёмся, пока он закончит. */

const App = {
  pages: {},
  shell: false,
  cur: null,
  _t: null,
  _pending: false,
  _pointer: false,

  register(id, page) { this.pages[id] = page; },

  start() {
    Store.subscribe(() => this.renderSoon());
    Store.onStatus(s => this.paintSync(s));
    window.addEventListener('hashchange', () => this.render());
    document.addEventListener('pointerdown', () => { this._pointer = true; }, true);
    document.addEventListener('pointerup', () => { this._pointer = false; if (this._pending) this.renderSoon(); }, true);
    document.addEventListener('focusout', () => { if (this._pending) this.renderSoon(250); });
    wireCharts();
    this.render();
  },

  parse() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h.startsWith('m-')) return {id: 'material', param: h.slice(2)};
    if (h.startsWith('p-')) return {id: 'person', param: h.slice(2)};
    return {id: h || 'home', param: null};
  },
  go(hash) { if (location.hash === '#' + hash) this.render(); else location.hash = hash; },

  typing() {
    const a = document.activeElement, page = $('#page');
    return !!(page && a && page.contains(a) && a.matches('input:not([type=checkbox]):not([type=radio]), textarea, select'));
  },
  renderSoon(delay = 60) {
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      if (this.typing() || this._pointer) { this._pending = true; return; }
      this._pending = false;
      this.render();
    }, delay);
  },

  render(opts = {}) {
    const root = $('#app');
    const me = Auth.me();
    if (!me) {
      /* экран входа не перерисовываем от чужих правок — только если штаб перестал быть пустым */
      const mode = Store.count('accounts') ? 'has' : 'empty';
      if (!opts.force && $('#authRoot') && this._authMode === mode) return;
      this._authMode = mode;
      this.shell = false;
      this.cur = null;
      root.innerHTML = '<div class="auth-page" id="authRoot"></div>';
      renderAuth($('#authRoot'));
      return;
    }
    let {id, param} = this.parse();
    const nav = NAV.find(n => n.id === id);
    if (!this.pages[id] || (nav && nav.perm && !Auth.can(nav.perm))) { id = 'home'; param = null; }
    if (!this.shell) this.buildShell();
    this.paintNav(id);
    /* свежий контейнер на каждую отрисовку: старые обработчики событий уходят вместе с ним */
    const prev = $('#page');
    const page = prev.cloneNode(false);
    prev.replaceWith(page);
    const key = id + ':' + (param || '');
    const y = window.scrollY;
    page.dataset.page = id;
    this.pages[id].render(page, param);
    if (this.cur === key) window.scrollTo(0, y);
    else window.scrollTo(0, 0);
    this.cur = key;
    if (opts.focus) { const el = document.getElementById(opts.focus); if (el) el.focus(); }
    document.title = (id === 'home' ? '' : (this.pages[id].title || '') + ' · ') + 'Штаб Eva Club V2';
  },

  buildShell() {
    $('#app').innerHTML = `<div class="shell">
      <aside class="side">
        <a class="brand" href="#home">${brandIcon('brand-mark')}<div><b>Eva Club</b><span>штаб команды · V2</span></div></a>
        <nav class="nav" id="nav" aria-label="Разделы"></nav>
        <div class="side-foot">
          <div class="sync" id="sync"><i></i><span></span></div>
          <div class="me-chip" id="meChip"></div>
        </div>
      </aside>
      <main class="main"><div class="page" id="page"></div></main>
    </div>`;
    on($('#meChip'), 'click', '[data-logout]', () => Auth.logout());
    this.shell = true;
    this.paintSync(Store.state);
  },

  paintNav(active) {
    const items = NAV.filter(n => !n.perm || Auth.can(n.perm));
    $('#nav').innerHTML = items.map(n => {
      const b = n.id === 'tasks' ? taskBadge() : 0;
      return `<a href="#${n.id}" class="${n.id === active || (active === 'material' && n.id === 'home') ? 'on' : ''}">${icon(n.icon)}<span>${n.name}</span>${b ? `<span class="badge" title="Требуют внимания">${b}</span>` : ''}</a>`;
    }).join('');
    const me = Auth.me(), p = Auth.person();
    const chip = $('#meChip');
    chip.classList.toggle('on', active === 'me' || (active === 'person' && this.parse().param === Auth.personId()));
    chip.innerHTML = `<a class="me-link" href="#me" title="Моя страница">${avatar(p || {name: me.name})}<div class="who"><b>${esc(p && p.name ? p.name : me.name)}</b><span>${esc(p && p.title ? p.title : ROLES[roleOf(me.role)].name)}</span></div></a>
      <button data-logout title="Выйти" aria-label="Выйти">${icon('logout')}</button>`;
  },

  paintSync(s) {
    const el = $('#sync');
    if (!el) return;
    let cls = '', text = 'Общая база · сохранено';
    if (s.mode === 'local') { cls = 'local'; text = 'Только этот браузер'; }
    else if (s.pending) { cls = 'busy'; text = 'Сохраняю…'; }
    else if (s.readOnly) { cls = 'err'; text = 'Только просмотр'; }
    else if (s.error) { cls = 'err'; text = 'Не сохранилось'; }
    el.className = 'sync ' + cls;
    $('span', el).textContent = text;
    el.title = s.mode === 'local'
      ? 'Штаб открыт не в артефакте Claude: данные живут только в этом браузере'
      : 'Все правки сразу видны команде';
  },
};

/* заголовок страницы */
function pageHead(title, sub, actions = '') {

function noAccess(text = 'Этот раздел закрыт для вашей роли.') {

/* ── 06-model.js ── */
/* Расчёты для главной, денег и отчётов — в одном месте, чтобы цифры везде
   совпадали. Продажа = первая оплата подписки. Выручка дня считается сама:
   (оплаты + продления) × цена, если её не поправили руками. */

/* ── продажи ── */
function revenueOf(s) {
  const own = s.revenue;
  if (own !== undefined && own !== null && own !== '') return Number(own) || 0;
  return ((Number(s.pays) || 0) + (Number(s.renewals) || 0)) * settings().price;
}
const Sales = {
  list() { return Store.all('sales').filter(s => /^\d{4}-\d\d-\d\d$/.test(s.id)).sort((a, b) => (a.id < b.id ? -1 : 1)); },
  day(iso) { return Store.get('sales', iso); },
  agg(list) {
    const price = settings().price;
    const a = {reach: 0, views: 0, clicks: 0, regs: 0, pays: 0, renewals: 0, revenue: 0, revNew: 0, revRenew: 0, experts: 0, mk: 0, days: 0};
    list.forEach(s => {
      a.reach += Number(s.reach) || 0;
      a.views += Number(s.views) || 0;
      a.clicks += Number(s.clicks) || 0;
      a.regs += Number(s.regs) || 0;
      a.pays += Number(s.pays) || 0;
      a.renewals += Number(s.renewals) || 0;
      const rev = revenueOf(s), renew = Math.min(rev, (Number(s.renewals) || 0) * price);
      a.revenue += rev;
      a.revRenew += renew;
      a.revNew += rev - renew;
      a.experts += Number(s.experts) || 0;
      a.mk += Number(s.mk) || 0;
      a.days++;
    });
    return a;
  },
  range(from, to) { return this.agg(this.list().filter(s => s.id >= from && s.id <= to)); },
  month(m) { return this.range(monthStart(m), monthEnd(m)); },
};

/* ── план продаж ── */
const Plan = {
  /* продажи месяца по сценарию; сентябрь — подготовка, плана нет */
  sales(sc, m) { return Q.months.includes(m) ? scenarioSales(sc)[m] : 0; },
  day(sc, iso) { const m = monthOf(iso); return this.sales(sc, m) / daysInMonth(m); },
  range(sc, from, to) {
    let s = 0;
    for (let d = from; d <= to; d = addDays(d, 1)) s += this.day(sc, d);
    return s;
  },
  regs(sales) { return sales / (settings().convPay || 0.05); },
  reach(sales) { return this.regs(sales) / (settings().convReg || 0.02); },
  /* шаги воронки из «Метрик»: переходы и просмотры под план */
  clicks(sales) { return this.regs(sales) / funnelOf().reg; },
  views(sales) { return this.clicks(sales) / funnelOf().click; },
  total(sc) { return sum(Q.months, m => this.sales(sc, m)); },
  /* цепочка по плану: новые + продления при удержании */
  chain(sc) {
    const s = settings();
    let payers = 0;
    return CF_MONTHS.map(m => {
      const fresh = this.sales(sc, m);
      const renewals = payers * s.retention;
      payers = fresh + renewals;
      return {m, fresh, renewals, revNew: fresh * s.price, revRenew: renewals * s.price};
    });
  },
};

/* ход квартала: сколько продано, где должны быть, куда идём */
function quarterPace(sc) {
  const t = today();
  const started = t >= Q.start, over = t > Q.end;
  const to = over ? Q.end : t;
  const fact = started ? Sales.range(Q.start, to).pays : 0;
  const planToDate = started ? Plan.range(sc, Q.start, to) : 0;
  const total = Plan.total(sc);
  const daysAll = daysBetween(Q.start, Q.end) + 1;
  const daysGone = started ? daysBetween(Q.start, to) + 1 : 0;
  const daysLeft = daysAll - daysGone;
  const projected = daysGone ? Math.round(fact / daysGone * daysAll) : 0;
  const needPerDay = daysLeft > 0 ? Math.max(0, (total - fact) / daysLeft) : 0;
  let heading = 'ниже минимума';
  if (projected >= Plan.total('max')) heading = 'на «Прорыв»';
  else if (projected >= Plan.total('goal')) heading = 'на «Цель»';
  else if (projected >= Plan.total('min')) heading = 'на «Минимум»';
  return {started, over, fact, planToDate, total, daysAll, daysGone, daysLeft, projected, needPerDay, heading,
    toStart: started ? 0 : daysBetween(t, Q.start)};
}
/* премия команды: 30% чистого дохода (выручка первых платежей минус реферальные 30%) */
function premiumOf(salesCount, revNew) {
  const s = settings();
  if (salesCount < s.premiumMin) return 0;
  return revNew * (1 - s.referral) * s.premium;
}

/* ── деньги ── */
const Money = {
  ledger() { return Store.all('ledger').sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || 0) - (a.at || 0))); },
  month(m) {
    const t = {in: 0, out: 0, invest: 0, cats: {in: {}, out: {}, invest: {}}};
    Store.all('ledger').forEach(e => {
      if (monthOf(e.date) !== m || !KINDS[e.kind]) return;
      const a = Number(e.amount) || 0;
      t[e.kind] += a;
      t.cats[e.kind][e.cat] = (t.cats[e.kind][e.cat] || 0) + a;
    });
    return t;
  },
  planItems() {
    const order = {payroll: 0, regular: 1, once: 2};
    return Store.all('plan').sort((a, b) => (order[a.group] ?? 3) - (order[b.group] ?? 3) || (a.months || [])[0]?.localeCompare((b.months || [])[0] || '') || (b.amount || 0) - (a.amount || 0));
  },
  planAmount(item, m) {
    if (!(item.months || []).includes(m)) return 0;
    const who = item.personId ? personById(item.personId) : null;
    if (who && (who.status === 'inactive' || who.archived)) return 0;   // не активирован — не платим
    const base = Number(item.amount) || 0;
    return item.group === 'payroll' && item.insurance !== false ? Math.round(base * (1 + settings().insurance)) : base;
  },
  paid(item, m) { return Store.all('ledger').find(e => e.planId === item.id && e.planMonth === m) || null; },
  /* план расходов месяца по статьям: всего и ещё не оплачено */
  planByCat(m) {
    const all = {}, unpaid = {};
    this.planItems().forEach(it => {
      const a = this.planAmount(it, m);
      if (!a) return;
      const cat = it.group === 'payroll' ? 'payroll' : (it.cat || 'other');
      all[cat] = (all[cat] || 0) + a;
      if (!this.paid(it, m)) unpaid[cat] = (unpaid[cat] || 0) + a;
    });
    return {all, unpaid};
  },
  /* деньги на счёте: старт + приходы + вложения + выручка − расходы после даты старта */
  cashNow() {
    const s = settings(), t = today();
    let cash = Number(s.cashStart) || 0;
    Store.all('ledger').forEach(e => {
      if (e.date < s.cashDate || e.date > t) return;
      const a = Number(e.amount) || 0;
      cash += e.kind === 'out' ? -a : a;
    });
    cash += Sales.range(s.cashDate, t).revenue;
    return cash;
  },
};

const VAR_CATS = ['referral', 'acquiring', 'tax'];
const FIXED_CATS = Object.keys(OUT_CATS).filter(c => !VAR_CATS.includes(c));

/* ── Cash Flow до Нового года: прошлые месяцы — факт, текущий — факт плюс
   остаток плана, будущие — план. Выручка — по выбранному сценарию. ── */
function cashFlow(sc) {
  const s = settings(), t = today(), cur = monthOf(t);
  let open = Number(s.cashStart) || 0;
  let prevPayers = 0;
  return CF_MONTHS.map(m => {
    const status = m < cur ? 'fact' : m === cur ? 'now' : 'plan';
    const f = Sales.month(m), led = Money.month(m), plan = Money.planByCat(m);
    const planFresh = Plan.sales(sc, m);
    let fresh, renewCount, revNew, revRenew;
    if (status === 'fact') {
      fresh = f.pays; renewCount = f.renewals; revNew = f.revNew; revRenew = f.revRenew;
    } else {
      const restDays = status === 'now' ? Math.max(0, daysBetween(t, monthEnd(m))) : daysInMonth(m);
      const restPlan = planFresh * restDays / daysInMonth(m);
      fresh = f.pays + restPlan;
      renewCount = Math.max(f.renewals, prevPayers * s.retention);
      revNew = f.revNew + restPlan * s.price;
      revRenew = Math.max(f.revRenew, renewCount * s.price);
    }
    prevPayers = fresh + renewCount;
    const otherIn = led.in;
    const invest = status === 'fact' ? led.invest : Math.max(led.invest, Number((s.invest || {})[m]) || 0);
    const revenue = revNew + revRenew;
    const out = {};
    FIXED_CATS.forEach(c => {
      out[c] = (led.cats.out[c] || 0) + (status === 'fact' ? 0 : (plan.unpaid[c] || 0));
    });
    const varBase = {referral: revNew * s.referral, acquiring: revenue * s.acquiring, tax: revenue * s.taxRate};
    VAR_CATS.forEach(c => {
      out[c] = status === 'fact' ? (led.cats.out[c] || 0) : Math.max(led.cats.out[c] || 0, varBase[c]);
    });
    const inTotal = revenue + otherIn;
    const outTotal = sum(Object.values(out));
    const close = open + inTotal + invest - outTotal;
    const row = {m, status, open, fresh, renewCount, revNew, revRenew, otherIn, invest, out, inTotal, outTotal, net: inTotal + invest - outTotal, close};
    open = close;
    return row;
  });
}

/* ── P&L по месяцам: факт и план ── */
function pnl(sc) {
  const s = settings();
  const chain = Plan.chain(sc);
  return CF_MONTHS.map((m, i) => {
    const f = Sales.month(m), led = Money.month(m), plan = Money.planByCat(m);
    const c = chain[i];
    const factOut = {...led.cats.out};
    const planRev = c.revNew + c.revRenew;
    const planOut = {...plan.all, referral: c.revNew * s.referral, acquiring: planRev * s.acquiring, tax: planRev * s.taxRate};
    const fact = {subs: f.revenue, other: led.in, out: factOut, outTotal: led.out, invest: led.invest};
    fact.income = fact.subs + fact.other;
    fact.profit = fact.income - fact.outTotal;
    const pl = {subs: planRev, other: 0, out: planOut, outTotal: sum(Object.values(planOut))};
    pl.income = pl.subs;
    pl.profit = pl.income - pl.outTotal;
    return {m, fact, plan: pl};
  });
}

/* ── 07-drag.js ── */
/* Перетаскивание карточек между колонками — мышью и пальцем.
   Мышь: зажали и повели (от 5 px). Палец: подержали ~0,3 с и повели —
   так обычная прокрутка страницы не превращается в перетаскивание.
   Во время переноса карточка едет за указателем, на месте вставки — пустая
   рамка; у краёв окна и доски страница прокручивается сама. */

const Drag = {
  active: null,
  justDropped: 0,
  wired: false,

  /* root — контейнер доски; cols — селектор колонки (data-col="ключ");
     каждая колонка содержит список .kb-list с карточками [data-task] */
  board(root, {canDrag, onDrop}) {
    root.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      const card = e.target.closest('[data-task]');
      if (!card || !root.contains(card) || e.target.closest('button, a, input, select, textarea, [data-nodrag]')) return;
      if (canDrag && !canDrag(card.dataset.task)) return;
      Drag.arm(e, card, root, onDrop);
    });
    if (!Drag.wired) {
      Drag.wired = true;
      document.addEventListener('pointermove', e => Drag.move(e), {passive: false});
      document.addEventListener('pointerup', e => Drag.end(e, true));
      document.addEventListener('pointercancel', e => Drag.end(e, false));
      document.addEventListener('touchmove', e => { if (Drag.active && Drag.active.on) e.preventDefault(); }, {passive: false});
      /* клик, который браузер шлёт сразу после отпускания карточки, не должен открывать её */
      document.addEventListener('click', e => { if (Date.now() - Drag.justDropped < 350 && e.target.closest && e.target.closest('[data-task]')) { e.stopPropagation(); e.preventDefault(); } }, true);
    }
  },

  arm(e, card, root, onDrop) {
    const touch = e.pointerType !== 'mouse';
    const st = {card, root, onDrop, on: false, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId, touch, timer: null};
    if (touch) st.timer = setTimeout(() => { if (Drag.active === st) Drag.start(st); }, 280);
    Drag.active = st;
  },

  start(st) {
    const r = st.card.getBoundingClientRect();
    st.on = true;
    st.dx = st.x0 - r.left;
    st.dy = st.y0 - r.top;
    const ghost = st.card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px';
    document.body.appendChild(ghost);
    st.ghost = ghost;
    const ph = document.createElement('div');
    ph.className = 'drag-ph';
    ph.style.height = r.height + 'px';
    st.card.after(ph);
    st.card.classList.add('drag-src');
    st.ph = ph;
    document.body.classList.add('dragging-now');
    if (navigator.vibrate && st.touch) { try { navigator.vibrate(12); } catch (err) { /* ничего */ } }
    Drag.place(st);
  },

  move(e) {
    const st = Drag.active;
    if (!st || e.pointerId !== st.id) return;
    st.x = e.clientX; st.y = e.clientY;
    if (!st.on) {
      const d = Math.hypot(st.x - st.x0, st.y - st.y0);
      if (st.touch) { if (d > 10) { clearTimeout(st.timer); Drag.active = null; } return; }
      if (d < 5) return;
      Drag.start(st);
    }
    e.preventDefault();
    Drag.place(st);
    Drag.autoscroll(st);
  },

  place(st) {
    st.ghost.style.transform = `translate(${st.x - st.dx}px, ${st.y - st.dy}px) rotate(1.5deg)`;
    st.ghost.style.visibility = 'hidden';
    const under = document.elementFromPoint(st.x, st.y);
    st.ghost.style.visibility = '';
    const col = under && under.closest('[data-col]');
    $$('.kb-col.drop-on', st.root).forEach(c => c !== col && c.classList.remove('drop-on'));
    if (!col || !st.root.contains(col)) return;
    col.classList.add('drop-on');
    const list = $('.kb-list', col);
    const cards = $$('[data-task]', list).filter(c => c !== st.card);
    let before = null;
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      if (st.y < r.top + r.height / 2) { before = c; break; }
    }
    if (before) list.insertBefore(st.ph, before);
    else {
      const add = $('.kb-add, .kb-composer', list);
      if (add) list.insertBefore(st.ph, add); else list.appendChild(st.ph);
    }
    st.col = col;
  },

  autoscroll(st) {
    const edge = 56, speed = 14;
    if (st.y < edge) window.scrollBy(0, -speed);
    else if (st.y > window.innerHeight - edge) window.scrollBy(0, speed);
    const board = st.root.querySelector('.kb') || st.root;
    const r = board.getBoundingClientRect();
    if (board.scrollWidth > board.clientWidth) {
      if (st.x < r.left + edge) board.scrollLeft -= speed;
      else if (st.x > r.right - edge) board.scrollLeft += speed;
    }
  },

  end(e, drop) {
    const st = Drag.active;
    if (!st || (e && e.pointerId !== st.id)) return;
    clearTimeout(st.timer);
    Drag.active = null;
    if (!st.on) return;
    Drag.justDropped = Date.now();
    const col = st.col;
    let beforeId = null, afterId = null;
    if (col && drop) {
      const seq = $$('[data-task], .drag-ph', $('.kb-list', col)).filter(x => x !== st.card);
      const i = seq.indexOf(st.ph);
      const prev = seq[i - 1], next = seq[i + 1];
      afterId = prev && prev.dataset.task ? prev.dataset.task : null;
      beforeId = next && next.dataset.task ? next.dataset.task : null;
    }
    st.ghost.remove();
    st.ph.remove();
    st.card.classList.remove('drag-src');
    document.body.classList.remove('dragging-now');
    $$('.drop-on', st.root).forEach(c => c.classList.remove('drop-on'));
    if (col && drop) st.onDrop(st.card.dataset.task, col.dataset.col, {afterId, beforeId});
  },
};

/* ── 10-dashboard.js ── */
/* Главная: как идём (продажи, деньги, задачи), что ждёт меня сегодня,
   темп квартала и материалы — стандарты и презентации. Состав зависит
   от роли: инвестор видит цифры и материалы, команда — ещё и свои задачи. */

function paceChart(sc) {
  const days = [];
  for (let d = Q.start; d <= Q.end; d = addDays(d, 1)) days.push(d);
  const t = today();
  const plans = Object.keys(SCENARIOS).map(k => {
    let acc = 0;
    return {k, values: days.map(d => { acc += Plan.day(k, d); return Math.round(acc); })};
  });
  const byDay = byKey(Sales.list(), 'id');
  let acc = 0;
  const fact = days.map(d => { if (d > t) return null; acc += Number((byDay[d] || {}).pays) || 0; return acc; });
  const labels = days.map(d => ({text: dayLong(d), tick: d.endsWith('-01') ? dayShort(d) : d === Q.end ? dayShort(d) : ''}));
  const series = plans.reverse().map(p => ({
    values: p.values, color: 'var(--ink-2)', dash: true, width: p.k === sc ? 2 : 1.5, opacity: p.k === sc ? 1 : 0.45,
    endLabel: `${SCENARIOS[p.k].name} ${fmt(Plan.total(p.k))}`, legend: p.k === sc ? `План «${SCENARIOS[p.k].name}»` : '',
  }));
  if (t >= Q.start) series.push({values: fact, color: 'var(--rose)', area: true, dot: true, width: 2.5, legend: 'Продано', endLabel: t <= Q.end ? `${fmt(acc)} сейчас` : '', labelAbove: true});
  else series.push({values: fact.map(() => null), color: 'var(--rose)', legend: 'Продано'});
  return lineChart({labels, series, height: 250});
}

/* ── 20-strategy.js ── */
/* Стратегия без лишнего: пять целей квартала, план продаж по сценариям,
   дорожная карта года, три кита и ритм команды. Правит основатель,
   пункты целей отмечают основатель и руководители. */

const GANTT_START = '2026-09';   // полумесяц 0 = первая половина сентября 2026
const GANTT_HALVES = 34;         // до конца января 2028
const hMonth = h => addMonths(GANTT_START, Math.floor(h / 2));
const hLabel = h => `${h % 2 ? 'вторая' : 'первая'} половина ${MONTHS_GEN[monthIdx(hMonth(h))]} ${hMonth(h).slice(0, 4)}`;
const hOfDate = iso => { const [y, m, d] = iso.split('-').map(Number); return (y - 2026) * 24 + (m - 9) * 2 + (d > 15 ? 1 : 0); };

const GOAL_STATUS = {
  '':      {name: 'Не начато',  tone: ''},
  ontrack: {name: 'В графике',  tone: 'good'},
  behind:  {name: 'Отстаём',    tone: 'bad'},
  done:    {name: 'Сделано',    tone: 'violet'},
};
const ITEM_STATUS = {plan: 'В плане', doing: 'Идёт', done: 'Сделано'};

/* ритм команды — одинаков каждую неделю */
const RHYTHM = [
  {when: 'Каждый понедельник, 11:00', what: 'Созвон 45 минут: цифры недели → по направлениям → неделя вперёд → отчёты → идеи и решения', rule: 'Цифры продаж — в «Отчётах» до 11:00. Без цифр направление не выступает.'},
  {when: 'Последний понедельник месяца', what: 'Сверка месяца: шесть показателей план-факт, статус пяти целей, что меняем, деньги и штаб', rule: 'Таблица сверки собрана в «Отчётах» → «Месяц».'},
  {when: 'Первая неделя января', what: 'Кварталка: личная оценка, коэффициент компании, премия, стратегия на следующий квартал', rule: 'Меньше 60 продаж за квартал — премии нет ни у кого.'},
];
function nextCall() {
  const t = today();
  let d = t;
  while (weekday(d) !== 0) d = addDays(d, 1);
  return d;
}
function lastMonday(m) {
  let d = monthEnd(m);
  while (weekday(d) !== 0) d = addDays(d, -1);
  return d;
}
function nextReview() {
  const t = today();
  let d = lastMonday(monthOf(t));
  if (d < t) d = lastMonday(addMonths(monthOf(t), 1));
  return d;
}

const Strategy = {
  doc() { return Store.get('docs', 'strategy') || {}; },
  save(partial) { return Store.patch('docs', 'strategy', partial); },
  goals() { return Object.entries(this.doc().goals || {}).map(([id, g]) => ({...g, id})).filter(g => !g.deleted).sort((a, b) => (a.order ?? 99) - (b.order ?? 99)); },
  goal(id) { const g = (this.doc().goals || {})[id]; return g && !g.deleted ? {...g, id} : null; },
  items() { return Object.entries(this.doc().items || {}).map(([id, x]) => ({...x, id})).filter(x => !x.deleted).sort((a, b) => a.from - b.from || a.to - b.to); },
  miles() { return Object.entries(this.doc().miles || {}).map(([id, x]) => ({...x, id})).filter(x => !x.deleted).sort((a, b) => a.h - b.h); },
  stages() { return this.doc().stages || []; },
  drivers() { return this.doc().drivers || {}; },
  whales() { return this.doc().whales || {}; },
};

/* ── дорожная карта: расчерченная сетка кварталов, месяцев и полумесяцев.
   Полосы работ двигаются зажатием, края растягиваются, ключевые точки
   переезжают по шкале. Шаг — полмесяца. Правит основатель, остальные
   смотрят и открывают связанные задачи. ── */
const G_MONTHS = GANTT_HALVES / 2;
const gPct = h => (h / GANTT_HALVES * 100).toFixed(3) + '%';
const gShort = h => `${h % 2 ? '2-я' : '1-я'} пол. ${MONTHS_SH[monthIdx(hMonth(h))]}${hMonth(h).slice(0, 4) !== '2026' ? ' ' + hMonth(h).slice(2, 4) : ''}`;
const gRange = (a, b) => (a === b ? gShort(a) : `${gShort(a)} → ${gShort(b)}`);

function ganttHtml(allTasks) {
  const items = Strategy.items(), miles = Strategy.miles(), stages = Strategy.stages();
  const canEdit = Auth.can('strategy.edit');
  const months = [];
  for (let i = 0; i < G_MONTHS; i++) months.push(addMonths(GANTT_START, i));
  /* кварталы для верхней строки */
  const qs = [];
  months.forEach((m, i) => {
    const q = Math.floor(monthIdx(m) / 3), key = m.slice(0, 4) + 'q' + q;
    const last = qs[qs.length - 1];
    if (last && last.key === key) last.n++;
    else qs.push({key, i, n: 1, label: `${['I', 'II', 'III', 'IV'][q]} кв. ${m.slice(0, 4)}`});
  });
  const nowH = hOfDate(today());
  const dd = Number(today().slice(8)), dim = daysInMonth(monthOf(today()));
  const nowPos = nowH + (dd <= 15 ? (dd - 1) / 15 : (dd - 16) / (dim - 15));
  const lines = qs.slice(1).map(q => `<i class="gt-ql ${months[q.i].endsWith('-01') ? 'year' : ''}" style="left:${(q.i / G_MONTHS * 100).toFixed(3)}%"></i>`).join('')
    + miles.map(ml => `<i class="gt-ml" style="left:${gPct(ml.h + 0.5)}"></i>`).join('')
    + (nowH >= 0 && nowH < GANTT_HALVES ? `<i class="gt-now" style="left:${gPct(nowPos)}"></i>` : '');
  const nowTag = nowH >= 0 && nowH < GANTT_HALVES ? `<i class="gt-now-tag" style="left:${gPct(nowPos)}">${dayShort(today())}</i>` : '';

  const head = `<div class="gt-head"><div class="gt-lab gt-corner">${canEdit ? 'Тяните полосу — сдвиг,<br>край — длительность' : 'Нажмите на полосу — задачи'}</div><div class="gt-tl">
      <div class="gt-qrow">${qs.map(q => `<div style="width:${(q.n / G_MONTHS * 100).toFixed(3)}%">${q.label}</div>`).join('')}</div>
      <div class="gt-mrow">${months.map(m => `<div class="${m === monthOf(today()) ? 'now' : ''}">${cap(MONTHS_SH[monthIdx(m)])}</div>`).join('')}</div>
      ${nowTag}
    </div></div>`;
  const stageRow = stages.length ? `<div class="gt-row gt-stage-row"><div class="gt-lab"><b>Этапы года</b></div><div class="gt-tl grid">${stages.map((st, i) => {
      const a = hOfDate(st.from + '-01'), b = hOfDate(monthEnd(st.to));
      const here = nowH >= a && nowH <= b;
      return `<div class="gt-stage s${i % 3} ${here ? 'here' : ''}" style="left:${gPct(a)};width:${gPct(b - a + 1)}" title="${esc(st.title)}: ${esc(st.text || '')}"><b>${esc(st.title)}</b>${here ? '<small>мы здесь</small>' : ''}</div>`;
    }).join('')}</div></div>` : '';
  const doneMiles = miles.filter(ml => ml.done).length;
  const mileRow = `<div class="gt-row gt-mile-row"><div class="gt-lab gt-lab-col"><b>Ключевые точки</b><small>${doneMiles} из ${miles.length} достигнуто</small>${canEdit ? `<button class="gt-add" data-mile-add>${icon('plus')}точка</button>` : ''}</div><div class="gt-tl grid" id="gtMiles">${miles.map(ml => {
      const state = ml.done ? 'done' : ml.h < nowH ? 'late' : '';
      return `<div class="gt-mile ${state} ${canEdit ? 'can' : ''}" data-mile="${ml.id}" style="left:${gPct(ml.h + 0.5)}" title="${esc(ml.title)} · ${gShort(ml.h)}${ml.done ? ' · достигнута' : state === 'late' ? ' · срок прошёл' : ''}"><i></i><span>${ml.done ? '✓ ' : ''}${esc(ml.title)}</span></div>`;
    }).join('')}</div></div>`;

  const groups = Object.entries(DIRS).map(([k, d]) => {
    const list = items.filter(x => (x.dir || 'ops') === k);
    const rows = list.map(x => {
      const linked = allTasks.filter(t => t.stratId === x.id);
      const done = linked.filter(t => t.status === 'done').length;
      return `<div class="gt-row"><div class="gt-lab" title="${esc(x.title)}"><span>${esc(x.title)}</span></div><div class="gt-tl grid">
        <div class="gt-bar ${x.status || 'plan'} ${canEdit ? 'can' : ''}" data-item="${x.id}" style="left:${gPct(x.from)};width:${gPct(x.to - x.from + 1)};--c:${d.color}" title="${esc(x.title)} · ${gRange(x.from, x.to)}">
          ${canEdit ? '<i class="gt-hl" data-edge="l"></i><i class="gt-hr" data-edge="r"></i>' : ''}
          <span class="gt-bt">${esc(x.title)}</span>${linked.length ? `<em>${done}/${linked.length}</em>` : ''}</div></div></div>`;
    }).join('');
    return `<div class="gt-dir" style="--c:${d.color}"><div class="gt-lab"><b>${d.name}</b><span>${list.length}</span>${canEdit ? `<button class="gt-add" data-item-add="${k}">${icon('plus')}работа</button>` : ''}</div><div class="gt-tl grid"></div></div>${rows}`;
  }).join('');

  return `<div class="gt-wrap"><div class="gt" id="gantt">${head}<div class="gt-body">${stageRow}${mileRow}${groups}<div class="gt-over">${lines}</div></div></div></div>
    <div class="legend g-legend"><span><i style="background:var(--ink-3)"></i>В плане</span><span><i style="background:var(--violet)"></i>Идёт</span><span><i style="background:var(--good)"></i>Сделано</span><span><i class="g-leg-now"></i>Сегодня</span><span><i class="g-leg-mile"></i>Ключевая точка</span></div>`;
}

/* подписи ключевых точек — по дорожкам, чтобы не наезжали друг на друга */
function layoutMiles(root) {
  const box = $('#gtMiles', root);
  if (!box) return;
  const lanes = [];
  $$('.gt-mile', box).map(el => ({el, x: el.offsetLeft})).sort((a, b) => a.x - b.x).forEach(({el, x}) => {
    const w = el.offsetWidth;
    let lane = lanes.findIndex(r => r < x - 6);
    if (lane < 0) { lane = lanes.length; lanes.push(0); }
    lanes[lane] = x + w;
    el.style.top = (6 + lane * 22) + 'px';
  });
  box.style.height = Math.max(36, 12 + lanes.length * 22) + 'px';
}

function wireGantt(root) {
  const gt = $('#gantt', root);
  if (!gt) return;
  layoutMiles(root);
  const canEdit = Auth.can('strategy.edit');
  let st = null;
  const unit = el => el.closest('.gt-tl').getBoundingClientRect().width / GANTT_HALVES;
  gt.addEventListener('pointerdown', e => {
    const bar = e.target.closest('.gt-bar'), mile = e.target.closest('.gt-mile');
    if (!bar && !mile) return;
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    if (bar) {
      const x = Strategy.items().find(i => i.id === bar.dataset.item);
      if (!x) return;
      st = {kind: 'bar', el: bar, id: x.id, mode: e.target.dataset.edge || 'm', from: x.from, to: x.to, nf: x.from, nt: x.to, x0: e.clientX, u: unit(bar), moved: false};
    } else {
      const ml = Strategy.miles().find(m => m.id === mile.dataset.mile);
      if (!ml) return;
      st = {kind: 'mile', el: mile, id: ml.id, h: ml.h, nh: ml.h, x0: e.clientX, u: unit(mile), moved: false};
    }
    if (canEdit) { try { st.el.setPointerCapture(e.pointerId); } catch (err) { /* ничего */ } e.preventDefault(); }
  });
  gt.addEventListener('pointermove', e => {
    if (!st || !canEdit) return;
    const dh = Math.round((e.clientX - st.x0) / st.u);
    if (Math.abs(e.clientX - st.x0) > 3) st.moved = true;
    if (!st.moved) return;
    if (st.kind === 'bar') {
      const len = st.to - st.from;
      if (st.mode === 'm') { st.nf = clamp(st.from + dh, 0, GANTT_HALVES - 1 - len); st.nt = st.nf + len; }
      if (st.mode === 'l') { st.nf = clamp(st.from + dh, 0, st.to); st.nt = st.to; }
      if (st.mode === 'r') { st.nt = clamp(st.to + dh, st.from, GANTT_HALVES - 1); st.nf = st.from; }
      st.el.style.left = gPct(st.nf);
      st.el.style.width = gPct(st.nt - st.nf + 1);
      st.el.classList.add('moving');
      st.el.dataset.tip = gRange(st.nf, st.nt);
    } else {
      st.nh = clamp(st.h + dh, 0, GANTT_HALVES - 1);
      st.el.style.left = gPct(st.nh + 0.5);
      st.el.classList.add('moving');
      st.el.dataset.tip = gShort(st.nh);
    }
  });
  const finish = e => {
    if (!st) return;
    const s = st;
    st = null;
    s.el.classList.remove('moving');
    delete s.el.dataset.tip;
    if (!s.moved) {
      if (s.kind === 'bar') openItem(s.id); else if (canEdit) editMile(s.id);
      return;
    }
    if (s.kind === 'bar' && (s.nf !== s.from || s.nt !== s.to)) {
      Strategy.save({items: {[s.id]: {from: s.nf, to: s.nt}}});
      toast(`${Strategy.items().find(i => i.id === s.id).title}: ${gRange(s.nf, s.nt)}`, {undo: () => Strategy.save({items: {[s.id]: {from: s.from, to: s.to}}})});
    }
    if (s.kind === 'mile' && s.nh !== s.h) {
      Strategy.save({miles: {[s.id]: {h: s.nh}}});
      toast(`Ключевая точка: ${gShort(s.nh)}`, {undo: () => Strategy.save({miles: {[s.id]: {h: s.h}}})});
    }
  };
  gt.addEventListener('pointerup', finish);
  gt.addEventListener('pointercancel', () => { if (st) { st.el.classList.remove('moving'); st = null; App.render(); } });
}

/* ── 30-tasks.js ── */
/* Задачи команды: список, по месяцам, по неделям. Каждая задача — свой
   документ в базе, поэтому правки разных людей не затирают друг друга.
   Цикл: К работе → В работе → На проверке → Готово. Если задачу поставил
   другой человек, исполнитель сдаёт её на проверку, а принимает автор
   или руководитель. */

const Tasks = {
  all() { return Store.all('tasks'); },
  get(id) { return Store.get('tasks', id); },
  meKey() { return Auth.personId() || (Auth.me() || {}).id; },
  due(t) { return t.due || (t.month ? monthEnd(t.month) : null); },
  isOpen(t) { return t.status !== 'done'; },
  overdue(t) { const d = this.due(t); return this.isOpen(t) && !!d && d < today(); },
  mine(t) { return !!t.assignee && t.assignee === Auth.personId(); },
  manager() { return Auth.can('tasks.manage'); },
  canEdit(t) { return this.manager() || this.mine(t) || (t.createdBy && t.createdBy === this.meKey()); },
  canJudge(t) { return this.manager() || (t.createdBy && t.createdBy === this.meKey() && !this.mine(t)); },
  canDelete(t) { return this.manager() || (t.createdBy && t.createdBy === this.meKey()); },
  unseen(t) {
    const k = this.meKey();
    return this.mine(t) && this.isOpen(t) && t.updatedBy && t.updatedBy !== k && (!t.seen || !t.seen[k] || t.seen[k] < (t.updatedAt || 0));
  },
  /* нужна ли приёмка: задачу поставил другой человек, а сдаёт не руководитель */
  needsReview(t) { return !this.manager() && t.createdBy && t.createdBy !== this.meKey(); },
  sortKey(t) { return [t.status === 'done' ? 1 : 0, t.priority === 'high' ? 0 : 1, this.due(t) || '9999', t.createdAt || 0]; },
  sort(list) {
    return list.slice().sort((a, b) => {
      const x = this.sortKey(a), y = this.sortKey(b);
      for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
      return 0;
    });
  },

  create(fields) {
    const k = this.meKey(), now = Date.now();
    const assignee = fields.assignee === undefined ? Auth.personId() : fields.assignee;
    const p = personById(assignee);
    const t = {
      title: fields.title.trim(), desc: fields.desc || '', result: fields.result || '',
      status: fields.status || 'todo', assignee: assignee || null,
      dir: fields.dir || (p && p.dir) || '', priority: fields.priority || 'normal',
      due: fields.due || null, month: fields.due ? monthOf(fields.due) : (fields.month !== undefined ? fields.month : monthOf(today())),
      goalId: fields.goalId || null, stratId: fields.stratId || null,
      createdBy: k, createdAt: now, updatedAt: now, updatedBy: k, comments: {},
    };
    return Store.add('tasks', t);
  },
  update(id, patch, log) {
    const k = this.meKey(), now = Date.now();
    const p = {...patch, updatedAt: now, updatedBy: k};
    if (log) p.comments = {[uid()]: {by: k, at: now, text: log, kind: 'system'}};
    return Store.patch('tasks', id, p);
  },
  setStatus(t, status, note) {
    const patch = {status};
    if (status === 'done') patch.doneAt = Date.now();
    if (status === 'doing' && t.status === 'todo') patch.startedAt = Date.now();
    const who = firstName(Auth.person() || {name: Auth.me().name});
    const log = note || `${who}: ${STATUSES[t.status].name} → ${STATUSES[status].name}`;
    return this.update(t.id, patch, log);
  },
  /* «сделано» из списка или карточки */
  complete(t) {
    const next = this.needsReview(t) ? 'review' : 'done';
    this.setStatus(t, next);
    toast(next === 'review' ? 'Отправлено на проверку' : 'Готово', {undo: () => this.setStatus({...t, status: next}, t.status)});
  },
  comment(t, text, kind = 'comment') {
    const k = this.meKey(), now = Date.now();
    return Store.patch('tasks', t.id, {updatedAt: now, updatedBy: k, comments: {[uid()]: {by: k, at: now, text: text.trim(), kind}}});
  },
  markSeen(t) {
    if (!this.unseen(t)) return;
    Store.patch('tasks', t.id, {seen: {[this.meKey()]: Date.now()}});
  },
  remove(t, anchor) {
    return confirmPop(anchor, {text: `Удалить задачу «${t.title.slice(0, 60)}»?`, yes: 'Да, удалить', danger: true}).then(ok => {
      if (!ok) return false;
      const copy = clone(t);
      Store.remove('tasks', t.id);
      toast('Задача удалена', {undo: () => Store.put('tasks', copy.id, copy)});
      return true;
    });
  },
};

/* счётчик в меню: мне поставили или вернули + (руководителю) ждут приёмки */
function taskBadge() {
  if (!Auth.can('tasks.view')) return 0;
  const list = Tasks.all();
  const mine = list.filter(t => Tasks.unseen(t)).length;
  const review = Tasks.manager() ? list.filter(t => t.status === 'review').length
    : list.filter(t => t.status === 'review' && t.createdBy === Tasks.meKey() && !Tasks.mine(t)).length;
  return mine + review;
}

/* ── страница ── */
const DIR_CODE = {product: 'ПР', content: 'КН', audience: 'АУ', ops: 'УП'};
const TaskUI = {
  composer: null,        // открытая строка добавления в колонке: {col, title, assignee, due}
  showDone: false,
  months() {
    const t = monthOf(today());
    const set = new Set(Tasks.all().map(x => x.month).filter(Boolean));
    let from = addMonths(t, -1), to = addMonths(t, 4);
    set.forEach(m => { if (m < from && Tasks.all().some(x => x.month === m && Tasks.isOpen(x))) from = m; if (m > to) to = m; });
    return monthRange(from, to);
  },
  filters() {
    return {
      who: View.get('t.who', Auth.personId() ? 'me' : 'all'),
      late: View.get('t.late', false),
      done: View.get('t.done', false),
      dir: View.get('t.dir', ''),
      goal: View.get('t.goal', ''),
      q: View.get('t.q', ''),
    };
  },
  /* люди, направление, цель, поиск — общие для всех видов */
  filtered(opts = {}) {
    const f = this.filters(), q = f.q.trim().toLowerCase(), me = Auth.personId();
    return Tasks.all().filter(t => {
      if (f.who === 'me' && t.assignee !== me) return false;
      if (f.who === 'none' && t.assignee) return false;
      if (!['me', 'all', 'none'].includes(f.who) && t.assignee !== f.who) return false;
      if (f.dir && t.dir !== f.dir) return false;
      if (f.goal && t.goalId !== f.goal) return false;
      if (f.late && !opts.ignoreLate && !Tasks.overdue(t)) return false;
      if (q && !(t.title + ' ' + (t.desc || '')).toLowerCase().includes(q)) return false;
      return true;
    });
  },
};
/* порядок внутри колонки: ручной (перетаскиванием), иначе — по времени создания */
const effOrder = t => (typeof t.order === 'number' ? t.order : (t.createdAt || 0));
const byOrder = list => list.slice().sort((a, b) => effOrder(a) - effOrder(b));
function orderBetween(afterId, beforeId) {
  const a = afterId ? Tasks.get(afterId) : null, b = beforeId ? Tasks.get(beforeId) : null;
  if (a && b) return (effOrder(a) + effOrder(b)) / 2;
  if (a) return effOrder(a) + 1000;
  if (b) return effOrder(b) - 1000;
  return Date.now();
}
