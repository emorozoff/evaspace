function wireThread(root, sel) {
  const text = $('#ibText', root);
  const tplSel = $('#ibTpl', root);
  const c = sel && !sel.startsWith('chat:') ? Clients.get(sel) : null;
  if (c) Inbox.markRead(c);
  if (tplSel) tplSel.onchange = () => { const t = (Cfg.list('templates') || {})[tplSel.value]; if (t) { text.value = fillTemplate(t.text, c); if (t.ch) $('#ibCh', root).value = t.ch; text.focus(); } };
  const send = () => {
    const v = text.value.trim();
    if (!v) { text.classList.add('need'); text.focus(); return; }
    if (c) {
      const ch = $('#ibCh', root).value;
      if (ch.startsWith('group:')) { Chats.post(ch.slice(6), v, {to: c.id}); toast('Отправлено в групповой чат'); }
      else { Inbox.send(c.id, ch, v); toast(Inbox.live(ch) ? 'Отправлено' : 'Сохранено в истории — канал не подключён'); }
    } else if (sel.startsWith('chat:')) {
      Chats.post(sel.slice(5), v);
      toast('Отправлено в групповой чат');
    }
    text.value = '';
  };
  if (text) text.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
  on(root, 'click', '[data-ib-send], [data-ib-group]', e => { e.preventDefault(); send(); });
  on(root, 'click', '[data-members]', (e, el) => {
    const ch = Chats.get(el.dataset.members);
    const members = (ch.members || []).map(id => Clients.get(id)).filter(Boolean);
    const canManage = Who.can('clients.edit') && !Who.readOnly();
    openModal({title: `Участницы: ${ch.name.split(' · ')[0]}`, body: `<div class="task-list">${members.map(m => `<div class="task-row">${avatar(Clients.name(m))}<div class="tt"><b>${esc(Clients.name(m))}</b><br><a href="#client-${m.id}" data-close>${esc(m.city || '')} · ${esc((Funnels.stage('sales', m.stage) || {}).name || '')}</a></div>${canManage ? `<button class="btn xs ghost" data-rm="${m.id}">Убрать</button>` : ''}</div>`).join('') || '<p class="note">Пока никого.</p>'}</div>
      ${canManage ? `<div class="row" style="margin-top:10px"><select class="select" id="addMember">${opt('', 'Добавить клиентку…', '')}${Clients.all().filter(x => !(ch.members || []).includes(x.id)).sort((a, b) => Clients.name(a).localeCompare(Clients.name(b), 'ru')).map(x => opt(x.id, Clients.name(x), '')).join('')}</select></div>` : ''}`,
    onMount(mel, close) {
      on(mel, 'click', '[data-rm]', (ev, b) => { Store.patch('chats', ch.id, {members: (ch.members || []).filter(x => x !== b.dataset.rm)}); close(); });
      const add = $('#addMember', mel);
      if (add) add.onchange = () => { if (add.value) { Store.patch('chats', ch.id, {members: [...(ch.members || []), add.value]}); toast('Добавлена в чат'); close(); } };
    }});
  });
}

/* новые заявки: свободные заявки на подписку, заявки экспертов и партнёров */
function newApplications() {
  const out = [];
  Clients.visible().filter(c => !c.manager && ['lead', 'base'].includes(c.stage)).forEach(c => {
    out.push({kind: 'Подписка', tone: 'violet', name: Clients.name(c), text: (cx(c).lastIn || {}).text || `Заявка · ${SOURCES[c.source] || ''}`, t: c.createdAt || 0, href: '#client-' + c.id});
  });

  if (Who.can('partners.view')) Partners.all().filter(p => p.stage === 'base').forEach(p => out.push({kind: 'Партнёр', tone: 'good', name: p.name, text: `${p.category} · ${p.city}`, t: p.createdAt || 0, href: '#partner-' + p.id}));

/* ── 45-campaigns.js ── */
/* Касания: рассылки (почта, пуш, Telegram, WhatsApp, MAX, SMS) по
   сегментам и условиям, цепочки прогрева, шаблоны и частота касаний.
   Каждое касание записывается в историю клиентки. Без согласия на
   рекламу и без контакта в канале сообщение не уходит — это видно
   до отправки. */

function audienceOf(camp) {
  if (camp.audience && Array.isArray(camp.audience.ids)) return camp.audience.ids.map(id => Clients.get(id)).filter(Boolean);
  const a = camp.audience || {};
  return Clients.all().filter(c => {
    if (a.seg && ((cx(c).segment || {}).id !== a.seg)) return false;
    if (a.rules && a.rules.length && !testRules(a.rules, a.match, c)) return false;
    return true;
  });
}
/* сколько пушей клиентка получила за 7 дней — лимит как в приложении */
function recentPushes(c) { const since = Date.now() - 7 * 864e5; return Ev.list(c).filter(e => e.kind === 'camp' && e.ch === 'push' && e.t >= since).length; }
function audienceCheck(camp) {
  const s = settings();
  const all = audienceOf(camp);
  const res = {all, ok: [], noConsent: 0, noContact: 0, unsub: 0, capped: 0};
  all.forEach(c => {
    const a = allowed(c, camp.ch);
    if (!a.ok) { if (a.why === 'нет контакта') res.noContact++; else if (a.why === 'отписалась') res.unsub++; else res.noConsent++; return; }
    if (camp.ch === 'push' && recentPushes(c) >= s.pushPerWeek) { res.capped++; return; }
    res.ok.push(c);
  });
  return res;
}

          ${cp.status !== 'draft' ? `<div class="camp-stats">

        </tbody></table></div>
        ${Who.can('funnels.edit') ? `<button class="btn" style="margin-top:12px" data-tpl="">${icon('plus')}Шаблон</button>` : ''}`;
    } else {
      /* частота: кому писали слишком часто за 7 дней */

      const rows = Clients.visible().map(c => {

          <li>Ева пишет не чаще 2 раз в день, послание — не чаще раза в день.</li>
          <li>Не больше 5 касаний в неделю на одну клиентку по всем каналам.</li>
          <li>Тихие часы: с 21:00 до 9:00 по времени клиентки — рассылки ждут утра.</li>
          <li>Две тихие недели подряд — один бережный вопрос, не чаще раза в месяц. Не пишем «ты забросила»: вина не возвращает людей.</li></ul></div>
        <div class="card"><div class="card-head"><h2>Касаний за 7 дней на клиентку</h2></div>${hbarList(dist, {color: 'var(--rose)'})}</div>
      </div>

        ${over.length ? `<div class="task-list">${over.slice(0, 20).map(r => `<div class="task-row">${avatar(Clients.name(r.c))}<div class="tt"><b>${esc(Clients.name(r.c))}</b><br><a href="#client-${r.c.id}">открыть карточку</a></div><span class="${r.n >= 5 ? 'bad' : 'warn'}">${r.n} касаний${r.push ? `, пушей ${r.push}` : ''}</span></div>`).join('')}</div>` : '<div class="okline">Никого не перегружаем.</div>'}
      </section>`;
    }

    root.innerHTML = `
      ${pageHead('Касания', 'Рассылки, пуши и цепочки прогрева. Каждое касание видно в карточке клиентки; без согласия на рассылки и без контакта сообщение не уходит.', canSend ? `<button class="btn primary" data-new-camp>${icon('plus')}Рассылка</button>` : '')}
      ${tabsHtml('cp.tab', [['camps', 'Рассылки', camps.length], ['seq', 'Цепочки прогрева', Cfg.items('sequences').length], ['tpl', 'Шаблоны', Cfg.items('templates').length], ['freq', 'Частота касаний']], tab)}
      ${body}`;

    wireTabs(root);
    on(root, 'click', '[data-new-camp]', () => openCampaignForm(null));
    on(root, 'click', '[data-edit-camp]', (e, el) => openCampaignForm(el.dataset.editCamp));
    on(root, 'click', '[data-dup-camp]', (e, el) => { const cp = Store.get('campaigns', el.dataset.dupCamp); const id = Store.add('campaigns', {name: cp.name + ' (копия)', ch: cp.ch, text: cp.text, audience: cp.audience && !cp.audience.ids ? cp.audience : {match: 'all', rules: []}, status: 'draft', createdAt: Date.now(), by: Who.id()}); openCampaignForm(id); });
    on(root, 'click', '[data-seq-toggle]', (e, el) => { const sq = Cfg.list('sequences')[el.dataset.seqToggle]; Cfg.save('sequences', el.dataset.seqToggle, {...sq, on: !sq.on}); });
    on(root, 'click', '[data-seq-edit]', (e, el) => openSequenceForm(el.dataset.seqEdit));
    on(root, 'click', '[data-tpl]', (e, el) => openTemplateForm(el.dataset.tpl));
  },
});

function openCampaignForm(id, preset = {}) {
  const cp = id ? Store.get('campaigns', id) : null;
  const state = {
    name: cp ? cp.name : preset.ids ? `Рассылка для ${preset.ids.length} выбранных` : '',
    ch: cp ? cp.ch : 'tg', text: cp ? cp.text : '',
    rules: cp && cp.audience && cp.audience.rules ? clone(cp.audience.rules) : [], match: (cp && cp.audience && cp.audience.match) || 'all',
    seg: (cp && cp.audience && cp.audience.seg) || '', ids: preset.ids || (cp && cp.audience && cp.audience.ids) || null,
  };
  const body = `<div class="grid2">
      <label class="field"><span>Название</span><input class="input" id="cpName" value="${esc(state.name)}" placeholder="Октябрьский запуск"></label>
      <label class="field"><span>Канал</span><select class="select" id="cpCh">${MASS_CH.map(ch => opt(ch, CHANNELS[ch].name, state.ch)).join('')}</select></label>
    </div>
    ${state.ids ? `<p class="note">Аудитория: <b>${state.ids.length}</b> выбранных в таблице клиенток.</p>` : `<div class="field"><span>Аудитория</span>
      <select class="select" id="cpSeg">${opt('', 'Все клиентки, подходящие под условия', state.seg)}${Segments.all().map(s => opt(s.id, 'Сегмент: ' + s.name, state.seg)).join('')}</select></div>
      <div id="cpRules">${rulesEditorHtml(state.rules, state.match)}</div>`}
    <label class="field"><span>Текст</span><textarea class="textarea" id="cpText" placeholder="{имя}, …">${esc(state.text)}</textarea><small>Переменные: {имя}, {промокод}, {ссылка}, {цена}. Первое предложение — главное: его видно в уведомлении.</small></label>
    <div id="cpCheck"></div>`;
  openModal({title: cp ? 'Рассылка' : 'Новая рассылка', wide: true, body,
    foot: `<button class="btn ghost left" data-close>Отмена</button><button class="btn" data-draft>Сохранить черновик</button><button class="btn primary" data-send>Отправить</button>`,
    onMount(el, close) {
      const draft = () => ({name: $('#cpName', el).value.trim() || 'Без названия', ch: $('#cpCh', el).value, text: $('#cpText', el).value.trim(),
        audience: state.ids ? {ids: state.ids} : {seg: ($('#cpSeg', el) || {}).value || '', rules: state.read ? state.read() : state.rules, match: state.match}});
      const check = () => {
        const d = draft();
        const r = audienceCheck(d);
        const sample = r.ok[0];
        $('#cpCheck', el).innerHTML = `<div class="${r.ok.length ? 'okline' : 'warnline'}">${icon('users')}<span>Получат: <b>${r.ok.length}</b> из ${r.all.length}${r.noConsent ? ` · без согласия на рассылки ${r.noConsent}` : ''}${r.unsub ? ` · отписались ${r.unsub}` : ''}${r.noContact ? ` · нет контакта в канале ${r.noContact}` : ''}${r.capped ? ` · уже получили ${settings().pushPerWeek} пуша за неделю ${r.capped}` : ''}</span></div>
          ${sample && d.text ? `<p class="note" style="margin-top:8px">Как увидит ${esc(Clients.name(sample).split(' ')[0])}:</p><div class="bub out" style="max-width:100%">${esc(fillTemplate(d.text, sample))}</div>` : ''}
          ${!Inbox.live(d.ch) ? `<p class="note" style="margin-top:8px">Канал «${esc(CHANNELS[d.ch].name)}» ещё не подключён: рассылка встанет в очередь и уйдёт после подключения в «Настройках → Интеграции». В карточках она будет видна со статусом «В очереди».</p>` : ''}`;
      };
      if (!state.ids) wireRulesEditor($('#cpRules', el), state, check);
      el.addEventListener('input', () => { clearTimeout(el._t); el._t = setTimeout(check, 200); });
      el.addEventListener('change', () => check());
      check();
      $('[data-draft]', el).onclick = () => {
        const d = draft();
        if (cp) Store.patch('campaigns', cp.id, {...d, audience: d.audience}); else Store.add('campaigns', {...d, status: 'draft', createdAt: Date.now(), by: Who.id()});
        close();
        toast('Черновик сохранён');
      };
      $('[data-send]', el).onclick = async e => {
        const d = draft();
        if (!d.text) { $('#cpText', el).classList.add('need'); $('#cpText', el).focus(); return; }
        const r = audienceCheck(d);
        if (!r.ok.length) { toast('Некому отправить: проверьте аудиторию и согласия', {error: true}); return; }
        if (!await confirmPop(e.currentTarget, {text: `Отправить ${r.ok.length} ${plural(r.ok.length, 'клиентке', 'клиенткам', 'клиенткам')}?`, yes: 'Отправить'})) return;
        const live = Inbox.live(d.ch);
        const cid = cp ? cp.id : uid();
        const now = Date.now();
        Store.put('campaigns', cid, {...(cp || {}), ...d, audience: state.ids ? {ids: state.ids} : d.audience, status: live ? 'sent' : 'queued', at: now, createdAt: (cp && cp.createdAt) || now, by: Who.id(), excluded: r.all.length - r.ok.length, sent: r.ok.length});
        let n = 0;
        for (const c of r.ok) {
          Ev.add('clients', c.id, {kind: 'camp', camp: cid, ch: d.ch, status: live ? 'sent' : 'queued', text: d.name});
          if (++n % 25 === 0) await new Promise(res => setTimeout(res, 20));
        }
        close();
        Sel.clear();
        toast(live ? `Отправлено: ${n}` : `В очереди: ${n}. Уйдёт после подключения канала`);
        App.go('campaigns');
      };
    }});
}

function openTemplateForm(id) {

  openModal({title: t ? 'Шаблон' : 'Новый шаблон', body: `<div class="grid2"><label class="field"><span>Название</span><input class="input" id="tpName" value="${esc(t ? t.name : '')}"></label>
      <label class="field"><span>Канал</span><select class="select" id="tpCh">${MSG_CH.map(ch => opt(ch, CHANNELS[ch].name, t ? t.ch : 'tg')).join('')}</select></label></div>
      <label class="field"><span>Текст</span><textarea class="textarea" id="tpText">${esc(t ? t.text : '')}</textarea><small>{имя}, {менеджер}, {промокод}, {ссылка}, {цена}</small></label>`,

function openSequenceForm(id) {
  const sq = clone(Cfg.list('sequences')[id]);
  const stepRow = (st, i) => `<div class="rule" data-i="${i}" style="grid-template-columns:90px 130px minmax(0,1fr) 32px"><input class="input num" data-k="day" value="${st.day}" title="День"><select class="select" data-k="ch">${MASS_CH.map(ch => opt(ch, CHANNELS[ch].name, st.ch)).join('')}</select><input class="input" data-k="text" value="${esc(st.text)}"><button class="icon-btn" data-rm="${i}">${icon('x')}</button></div>`;
  openModal({title: sq.name, wide: true, body: `<label class="field"><span>Название</span><input class="input" id="sqName" value="${esc(sq.name)}"></label>
      <label class="field"><span>Когда запускается</span><input class="input" id="sqTrig" value="${esc(sq.trigger)}"></label>
      <div class="field"><span>Шаги: день, канал, текст</span><div class="rules" id="sqSteps">${sq.steps.map(stepRow).join('')}</div></div>
      <button class="btn sm" data-add style="align-self:flex-start">${icon('plus')}Шаг</button>`,
    foot: '<button class="btn" data-close>Отмена</button><button class="btn primary" data-ok>Сохранить</button>',
    onMount(el, close) {
      const read = () => $$('#sqSteps .rule', el).map(r => ({day: parseNum($('[data-k="day"]', r).value), ch: $('[data-k="ch"]', r).value, text: $('[data-k="text"]', r).value}));
      on(el, 'click', '[data-add]', () => { sq.steps = read(); sq.steps.push({day: (sq.steps.length ? sq.steps[sq.steps.length - 1].day : 0) + 2, ch: 'tg', text: ''}); $('#sqSteps', el).innerHTML = sq.steps.map(stepRow).join(''); });
      on(el, 'click', '[data-rm]', (e, b) => { sq.steps = read(); sq.steps.splice(Number(b.dataset.rm), 1); $('#sqSteps', el).innerHTML = sq.steps.map(stepRow).join(''); });
      $('[data-ok]', el).onclick = () => { Cfg.save('sequences', id, {...sq, name: $('#sqName', el).value.trim() || sq.name, trigger: $('#sqTrig', el).value.trim(), steps: read().filter(s => s.text.trim())}); close(); };
    }});
}

      <label class="field"><span>Направление</span><select class="select" id="exDirF">${EXPERT_DIRS.map(d => opt(d, d, v('direction') || EXPERT_DIRS[0])).join('')}</select></label>
      <label class="field"><span>Телефон</span><input class="input" id="exPhone" value="${esc(phoneFmt(v('phone')))}"></label>
      <label class="field"><span>Telegram</span><input class="input" id="exTg" value="${esc(v('tg'))}" placeholder="@username"></label>
      <label class="field"><span>Почта</span><input class="input" id="exEmail" value="${esc(v('email'))}"></label>
      <label class="field"><span>Город</span><input class="input" id="exCity" value="${esc(v('city'))}"></label>
      <label class="field"><span>Где посмотреть: сайт, канал, соцсеть</span><input class="input" id="exSocial" value="${esc(v('social'))}"></label>
      <label class="field"><span>Аудитория, подписчиков</span><input class="input num" id="exAud" inputmode="numeric" value="${esc(v('audience'))}"></label>
      <label class="field"><span>Стаж</span><select class="select" id="exExp">${opt('', '—', v('experience'))}${EXPERT_EXP.map(x => opt(x, x, v('experience'))).join('')}</select></label>
      <label class="field"><span>Доля эксперта с продаж</span><select class="select" id="exShare">${[0.5, 0.6, 0.7, 0.8].map(x => opt(x, pct(x), e && typeof e.share === 'number' ? e.share : settings().expertShare)).join('')}</select></label>
      <div class="field" style="grid-column:1/-1"><span>Что хотела бы вести</span><div class="chips" id="exFormats">${EXPERT_FORMATS.map(x => `<label class="chip ${(e && e.formats || []).includes(x) ? 'on' : ''}"><input type="checkbox" value="${esc(x)}" hidden ${(e && e.formats || []).includes(x) ? 'checked' : ''}>${esc(x)}</label>`).join('')}</div></div>
      <label class="field" style="grid-column:1/-1"><span>Пара слов о подходе</span><textarea class="textarea" id="exAbout">${esc(v('about'))}</textarea></label>
    </div>`;
  openModal({title: e ? `Эксперт: ${e.name}` : 'Новый эксперт', wide: true, body,
    foot: `<button class="btn" data-close>Отмена</button><button class="btn primary" data-ok>${e ? 'Сохранить' : 'Добавить'}</button>`,
    onMount(el, close) {
      on(el, 'change', '#exFormats input', (ev, i) => i.closest('.chip').classList.toggle('on', i.checked));
      $('[data-ok]', el).onclick = () => {
        const name = $('#exName', el).value.trim();
        if (!name) { $('#exName', el).classList.add('need'); $('#exName', el).focus(); return; }
        const d = {name, direction: $('#exDirF', el).value, phone: phoneDigits($('#exPhone', el).value), tg: tgUser($('#exTg', el).value), email: $('#exEmail', el).value.trim(), city: $('#exCity', el).value.trim(),
          social: $('#exSocial', el).value.trim(), audience: parseNum($('#exAud', el).value) || null, experience: $('#exExp', el).value, share: Number($('#exShare', el).value),
          formats: $$('#exFormats input:checked', el).map(i => i.value), about: $('#exAbout', el).value.trim()};
        if (e) { Store.patch('experts', e.id, d); close(); return; }
        const nid = Store.add('experts', {...d, stage, funnel: 'experts', manager: Who.id(), created: today(), createdAt: Date.now(), stageAt: Date.now(), content: {},
          ev: {[uid()]: {kind: 'sys', t: Date.now(), by: Who.id(), text: 'Эксперт добавлен вручную'}}});
        close();
        App.go('expert-' + nid);
      };
    }});
}

App.register('expert', {

        <div class="cc-acts">${canEdit ? `<button class="btn sm" data-edit>${icon('edit')}Изменить</button>` : ''}${e.tg ? `<a class="btn sm" href="https://t.me/${esc(tgUser(e.tg))}" target="_blank" rel="noopener">${icon('ext')}Telegram</a>` : ''}</div>

        <div class="cc-main">${canEdit ? composerHtml('experts', e, mode === 'pay' ? 'msg' : mode) : ''}
          <div class="card">${tabsHtml('ex.tab', [['feed', 'Лента', evs.length], ['content', 'Контент', content.length], ['sales', 'Продажи и доля', st.sales.length || null]], tab)}<div class="cc-pane">${pane}</div></div></div>

          <div class="card"><div class="mini-h"><h3>Условия</h3></div>

            ${kv('Съёмка', canEdit ? `<input class="input sm" type="date" id="exShoot" value="${esc(e.shootAt || '')}" style="width:150px">` : e.shootAt ? dayLong(e.shootAt) : '—')}

          <div class="card"><div class="mini-h"><h3>Заявка эксперта</h3></div>

            ${e.about ? `<p class="note" style="margin-top:6px">${esc(e.about)}</p>` : ''}</div>
          <div class="card"><div class="mini-h"><h3>Контакты</h3></div>${kv('Телефон', esc(phoneFmt(e.phone)))}${kv('Telegram', e.tg ? '@' + esc(tgUser(e.tg)) : '')}${kv('Почта', esc(e.email || ''))}</div>
        </aside>
      </div>`;

    wireTabs(root);
    wireStepper(root, 'experts', e);
    wireTimeline(root, 'experts', e);
    wireComposer(root, 'experts', e);
    on(root, 'click', '[data-edit]', () => openExpertForm(e.id));
    on(root, 'change', '[data-cstatus]', (ev, el) => Store.patch('experts', e.id, {content: {[el.dataset.cstatus]: {status: el.value}}}));
    const shoot = $('#exShoot', root);
    if (shoot) shoot.onchange = () => { Store.patch('experts', e.id, {shootAt: shoot.value || null}); if (shoot.value) Ev.add('experts', e.id, {kind: 'sys', text: `Съёмка назначена на ${dayLong(shoot.value)}`}); };
    const add = $('#addMk', root);
    if (add) add.onsubmit = ev => { ev.preventDefault(); const t = $('#mkTitle', root).value.trim(); if (!t) return; Store.patch('experts', e.id, {content: {['mk' + uid().slice(-5)]: {title: t, kind: $('#mkKind', root).value, status: 'plan', date: $('#mkDate', root).value}}}); };

});

/* Партнёры: салоны, студии пилатеса и йоги, фитнес, косметология,
   пространства, бренды маркета. Карточка: условия взаимодействия,
   спецпредложения с промокодами, адрес, контактное лицо, договор,
   приведённые клиентки и вознаграждение. */

App.register('partners', {
  title: 'Партнёры',
  render(root) {
    const tab = View.get('pt.tab', 'list');
    const all = Partners.all();
    const q = View.get('pt.q', '').trim().toLowerCase();
    const catF = View.get('pt.cat', ''), cityF = View.get('pt.city', ''), stF = View.get('pt.st', '');
    const list = all.filter(p => (!q || (p.name + ' ' + p.contactName + ' ' + p.address).toLowerCase().includes(q)) && (!catF || p.category === catF) && (!cityF || p.city === cityF) && (!stF || p.stage === stF));
    const canEdit = Who.can('partners.edit') && !Who.readOnly();
    const cities = [...new Set(all.map(p => p.city).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
    const active = all.filter(p => p.stage === 'active');
    const stats = all.map(p => ({p, s: Partners.stats(p)}));
    const offers = all.filter(p => ['active', 'contract'].includes(p.stage)).flatMap(p => Partners.offers(p).map(o => ({p, o})));

    let body = '';
    if (tab === 'list') {
      body = `<div class="t-bar"><input class="input sm t-search" id="ptQ" placeholder="Название, контакт, адрес" value="${esc(View.get('pt.q', ''))}">
          <select class="select sm" id="ptCat">${opts([['', 'Все категории'], ...PARTNER_CATS.map(c => [c, c])], catF)}</select>
          <select class="select sm" id="ptCity">${opts([['', 'Все города'], ...cities.map(c => [c, c])], cityF)}</select>
          <select class="select sm" id="ptSt">${opts([['', 'Все этапы'], ...Funnels.stages('partners').map(s => [s.id, s.name]), ['lost', 'Отказ']], stF)}</select></div>
        <div class="pgrid">${list.map(p => {
          const s = Partners.stats(p);
          const of = Partners.offers(p);
          return `<a class="card pcard" href="#partner-${p.id}">
            <div class="pcard-h">${avatar(p.name, 'lg')}<div><b>${esc(p.name)}</b><small>${esc(p.category)} · ${esc(p.city)}</small></div></div>
            <div class="row" style="gap:6px">${stagePill('partners', p.stage)}<span class="pill line">${esc((PARTNER_MODELS[p.model] || '').split(':')[0])}</span></div>
            ${of.length ? `<div class="offer"><span class="ico">${icon('gift')}</span><div><b>${esc(of[0].title)}</b>${of[0].promo ? `<small><span class="promo">${esc(of[0].promo)}</span></small>` : ''}</div></div>` : ''}
            <div class="pcard-f">${icon('users')}<span>${esc(p.contactName || '—')}${p.contactRole ? ', ' + esc(p.contactRole) : ''}</span><span class="sp"></span>${s.n ? `<b>${s.n}</b> ${plural(s.n, 'клиентка', 'клиентки', 'клиенток')}` : ''}</div>
          </a>`;
        }).join('') || '<div class="empty"><b>Никого не нашли</b>Поменяйте фильтры.</div>'}</div>`;
    } else if (tab === 'offers') {
      body = `<p class="note" style="margin-bottom:12px">Действующие спецпредложения партнёров. Менеджер делится ими с клиентками — в карточке клиентки видны предложения её города.</p>
        <div class="pgrid">${offers.map(({p, o}) => `<div class="card offer" style="border-style:solid"><span class="ico">${icon('gift')}</span><div style="flex:1">
          <b>${esc(o.title)}</b><small><a class="inline-link" href="#partner-${p.id}">${esc(p.name)}</a> · ${esc(p.city)}${o.until ? ` · до ${dayShort(o.until)}` : ''}</small>
          ${o.promo ? `<div class="row" style="margin-top:8px"><span class="promo">${esc(o.promo)}</span><button class="btn xs" data-copy="${esc(o.promo)}">${icon('copy')}Копировать</button></div>` : ''}</div></div>`).join('') || '<div class="empty"><b>Предложений нет</b>Добавьте их в карточке партнёра.</div>'}</div>`;
    } else {
      const rows = stats.filter(x => x.s.n || x.s.reward || x.s.paidOut).sort((a, b) => b.s.revenue - a.s.revenue);
      body = `<div class="table-wrap"><table class="t"><thead><tr><th>Партнёр</th><th>Модель</th><th class="r">Клиенток</th><th class="r">Оплатили</th><th class="r">Принесли</th><th class="r">Ставка</th><th class="r">Вознаграждение</th><th class="r">Выплачено</th><th class="r">К выплате</th></tr></thead><tbody>
        ${rows.map(({p, s}) => `<tr><td><a class="inline-link" href="#partner-${p.id}">${esc(p.name)}</a></td><td>${esc((PARTNER_MODELS[p.model] || '').split(':')[0])}</td><td class="r">${s.n}</td><td class="r">${s.paying}</td><td class="r">${rub(s.revenue)}</td><td class="r">${s.rate ? pct(s.rate) : '—'}</td><td class="r">${rub(s.reward)}</td><td class="r">${rub(s.paidOut)}</td><td class="r"><b>${rub(Math.max(0, s.reward - s.paidOut))}</b></td></tr>`).join('') || '<tr><td colspan="9"><p class="note">Пока нет клиенток от партнёров.</p></td></tr>'}
      </tbody></table></div>
      <p class="note" style="margin-top:8px">Вознаграждение считается с оплат клиенток, у которых в карточке указан партнёр (по промокоду или ссылке). Выплата — по акту раз в месяц; внесите её в карточке партнёра («Выплата»).</p>`;
    }

    root.innerHTML = `
      ${pageHead('Партнёры', 'Салоны красоты, студии пилатеса и йоги, фитнес, косметология, пространства и бренды. Условия, спецпредложения, контактные лица и что партнёр приносит.',
        `<a class="btn" href="#funnels" data-fnid="partners">${icon('funnel')}Воронка партнёров</a>${canEdit ? `<button class="btn primary" data-new>${icon('plus')}Партнёр</button>` : ''}`)}
      <div class="tiles6">
        <div class="card stat"><span class="label">Партнёров</span><div class="big">${all.length}</div><div class="foot">активных ${active.length} · в переговорах ${all.filter(p => ['contact', 'meeting', 'terms'].includes(p.stage)).length}</div></div>
        <div class="card stat"><span class="label">Спецпредложения</span><div class="big">${offers.length}</div><div class="foot">действуют для участниц Евы</div></div>
        <div class="card stat"><span class="label">Привели клиенток</span><div class="big">${sum(stats, x => x.s.n)}</div><div class="foot">оплатили ${sum(stats, x => x.s.paying)}</div></div>
        ${Who.can('money.view') ? `<div class="card stat"><span class="label">Принесли денег</span><div class="big">${rubK(sum(stats, x => x.s.revenue))}</div><div class="foot">вознаграждение ${rubK(sum(stats, x => x.s.reward))}</div></div>` : ''}
      </div>
      <div class="section">${tabsHtml('pt.tab', [['list', 'Все партнёры', all.length], ['offers', 'Спецпредложения', offers.length], ['money', 'Вознаграждения']], tab)}${body}</div>`;

    wireTabs(root);
    let qt;
    const qi = $('#ptQ', root);
    if (qi) qi.oninput = e => { clearTimeout(qt); const v = e.target.value; qt = setTimeout(() => { View.set('pt.q', v); App.render({focus: 'ptQ'}); }, 250); };
    [['ptCat', 'pt.cat'], ['ptCity', 'pt.city'], ['ptSt', 'pt.st']].forEach(([i, k]) => { const el = $('#' + i, root); if (el) el.onchange = () => { View.set(k, el.value); App.render(); }; });
    on(root, 'click', '[data-new]', () => openPartnerForm(null));
    on(root, 'click', '[data-fnid]', (e, el) => View.set('fn.id', el.dataset.fnid));
    on(root, 'click', '[data-copy]', async (e, el) => { e.preventDefault(); if (await copyText(el.dataset.copy)) toast('Промокод скопирован'); });
  },
});

  const body = `<div class="grid2">

      <label class="field"><span>Город</span><input class="input" id="pfCity" value="${esc(v('city'))}"></label>

      <label class="field"><span>Почта</span><input class="input" id="pfEmail" value="${esc(v('email'))}"></label>
      <label class="field"><span>Сайт или соцсеть</span><input class="input" id="pfSite" value="${esc(v('site'))}"></label>
      <label class="field"><span>Формат сотрудничества</span><select class="select" id="pfModel">${Object.entries(PARTNER_MODELS).map(([k, n]) => opt(k, n, v('model') || 'commission')).join('')}</select></label>
      <label class="field"><span>Ставка партнёра, %</span><input class="input num" id="pfRate" inputmode="decimal" value="${p && typeof p.rate === 'number' ? Math.round(p.rate * 100) : Math.round(settings().partnerRate * 100)}"><small>с оплат приведённых клиенток; 0 — без денег</small></label>

    </div>`;

        const cnum = $('#pfCNum', el).value.trim(), cdate = $('#pfCDate', el).value;
        const d = {name, category: $('#pfCat', el).value, city: $('#pfCity', el).value.trim(), address: $('#pfAddr', el).value.trim(), contactName: $('#pfCName', el).value.trim(), contactRole: $('#pfCRole', el).value.trim(),
          phone: phoneDigits($('#pfPhone', el).value), tg: tgUser($('#pfTg', el).value), email: $('#pfEmail', el).value.trim(), site: $('#pfSite', el).value.trim(), model: $('#pfModel', el).value,
          rate: parseNum($('#pfRate', el).value) / 100, promo: $('#pfPromo', el).value.trim().toUpperCase(), terms: $('#pfTerms', el).value.trim(), contract: cnum || cdate ? {num: cnum, date: cdate, until: p && p.contract ? p.contract.until || '' : ''} : null};
        if (p) { Store.patch('partners', p.id, d); if (!d.contract) Store.patch('partners', p.id, {contract: null}); close(); return; }
        const nid = Store.add('partners', {...d, stage, funnel: 'partners', manager: Who.id(), offers: {}, created: today(), createdAt: Date.now(), stageAt: Date.now(),
          ev: {[uid()]: {kind: 'sys', t: Date.now(), by: Who.id(), text: 'Партнёр добавлен'}}});
        close();
        App.go('partner-' + nid);
      };
    }});
}

function openOfferForm(p, oid) {
  const o = oid ? (p.offers || {})[oid] : null;
  openModal({title: o ? 'Спецпредложение' : 'Новое спецпредложение', body: `<label class="field"><span>Что предлагаем</span><input class="input" id="ofTitle" value="${esc(o ? o.title : '')}" placeholder="−15% на уход по промокоду"></label>
      <div class="grid3"><label class="field"><span>Промокод</span><input class="input" id="ofPromo" value="${esc(o ? o.promo : p.promo || '')}"></label>
      <label class="field"><span>Скидка, %</span><input class="input num" id="ofDisc" value="${esc(o ? o.discount || '' : '')}"></label>
      <label class="field"><span>Действует до</span><input class="input" type="date" id="ofUntil" value="${esc(o ? o.until || '' : addDays(today(), 90))}"></label></div>
      <label class="field"><span>Для кого</span><select class="select" id="ofFor">${opts([['участницам Евы', 'Участницам Евы'], ['клиентам партнёра', 'Клиентам партнёра — от Евы']], o ? o.forWhom : 'участницам Евы')}</select></label>`,
    foot: `${o ? '<button class="btn danger left" data-arch>В архив</button>' : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" data-ok>Сохранить</button>`,
    onMount(el, close) {
      $('[data-ok]', el).onclick = () => {
        const title = $('#ofTitle', el).value.trim();
        if (!title) { $('#ofTitle', el).classList.add('need'); return; }
        Store.patch('partners', p.id, {offers: {[oid || 'o' + uid().slice(-5)]: {title, promo: $('#ofPromo', el).value.trim().toUpperCase(), discount: parseNum($('#ofDisc', el).value) || 0, until: $('#ofUntil', el).value, forWhom: $('#ofFor', el).value}}});
        close();
      };
      const a = $('[data-arch]', el);
      if (a) a.onclick = () => { Store.patch('partners', p.id, {offers: {[oid]: {archived: true}}}); close(); };
    }});
}

/* Рефералы: «Приведи подругу» и амбассадоры. Начисления считаются из
   фактических оплат приглашённых (одна ступень, без «сетки»). Раз в месяц —
   реестр: каждой пригласившей — вывод на карту или деньги на балансе Евы
   (+10% сверху). Выплата — до 10 числа следующего месяца. */

App.register('referrals', {
  title: 'Рефералы',
  render(root) {
    const tab = View.get('rf.tab', 'people');
    const s = settings();
    const refs = Referral.list();
    const rows = refs.map(r => ({r, st: Referral.of(r), stage: Referral.stageOf(r)}));
    const invited = sum(rows, x => x.st.inv.length);
    const paying = sum(rows, x => x.st.paying);
    const accrued = sum(rows, x => x.st.accrued);
    const cur = monthOf(today());
    const prev = addMonths(cur, -1);
    const regPrev = Referral.registry(prev);
    const duePrev = sum(regPrev.filter(x => x.status === 'due'), x => x.due);
    const onBalance = sum(Clients.all(), c => (c.refProgram || Referral.invitees(c.id).length) ? c.balance || 0 : 0);
    const canPay = Who.can('payouts.manage') && !Who.readOnly();

    let body = '';
    if (tab === 'people') {
      const f = View.get('rf.prog', '');
      const list = rows.filter(x => !f || Referral.program(x.r) === f).sort((a, b) => b.st.accrued - a.st.accrued);
      body = `<div class="t-bar"><div class="seg">${[['', 'Все'], ...Object.entries(REF_PROGRAMS).map(([k, p]) => [k, p.name])].map(([k, n]) => `<button data-prog="${k}" class="${f === k ? 'on' : ''}">${esc(n)}</button>`).join('')}</div></div>
        <div class="table-wrap"><table class="t"><thead><tr><th>Пригласившая</th><th>Программа</th><th>Уровень · ставка</th><th class="r">Пригласила</th><th class="r">Оплатили</th><th class="r">Принесли</th><th class="r">Начислено</th><th class="r">Получила</th><th class="r">Доступно</th><th>Как получать</th></tr></thead><tbody>
        ${list.map(({r, st}) => {
          const prog = Referral.program(r);
          const rate = prog === 'friend' ? s.refRates[levelOf(r.points).id] : prog === 'key' ? s.ambKeyRate : s.ambRate;
          const needTax = r.refMode === 'card' && prog !== 'friend' && !['npd', 'ip'].includes(r.taxStatus);
          return `<tr style="cursor:pointer" data-href="#client-${r.id}"><td><span class="row" style="gap:8px;align-items:center;flex-wrap:nowrap">${avatar(Clients.name(r))}<b>${esc(Clients.name(r))}</b></span><small class="muted">${esc(r.refCode || '')}</small></td>
            <td><span class="pill ${prog === 'friend' ? 'rose' : prog === 'key' ? 'gold' : 'violet'}">${esc(REF_PROGRAMS[prog].name)}</span></td>
            <td>${prog === 'friend' ? esc(levelOf(r.points).name) + ' · ' : ''}${pct(rate)}${prog !== 'friend' ? ' чистого' : ''}</td>
            <td class="r">${st.inv.length}</td><td class="r">${st.paying}</td><td class="r">${rub(st.revenue)}</td><td class="r">${rub(st.accrued)}</td><td class="r">${rub(st.settled)}</td><td class="r"><b>${rub(Math.max(0, st.available))}</b></td>
            <td>${r.refMode === 'card' ? 'на карту' : 'на баланс'}${needTax ? ' <span class="pill bad" title="Амбассадорам платим только самозанятым и ИП">нужен статус</span>' : ''}</td></tr>`;
        }).join('') || '<tr><td colspan="10"><p class="note">Пока никто никого не пригласил.</p></td></tr>'}
        </tbody></table></div>`;
    } else if (tab === 'registry') {
      const months = monthsBack(4);
      const m = View.get('rf.month', prev);
      const reg = Referral.registry(m);
      const closed = m >= cur;
      const toCard = reg.filter(x => x.status === 'due' && x.mode === 'card');
      const toBal = reg.filter(x => x.status === 'due' && x.mode === 'balance');
      body = `<div class="t-bar"><div class="seg">${months.map(x => `<button data-month="${x}" class="${x === m ? 'on' : ''}">${monthName(x)}</button>`).join('')}</div><span class="t-bar-sp"></span>
          ${reg.length ? `<button class="btn sm" data-reg-csv>${icon('download')}Реестр для бухгалтерии</button>` : ''}
          ${canPay && !closed && toBal.length ? `<button class="btn sm primary" data-pay-all-bal>Зачислить на балансы (${toBal.length})</button>` : ''}</div>
        ${closed ? `<div class="warnline" style="margin-bottom:12px">${icon('clock')}<span>${monthName(m)} ещё идёт: начисления копятся. Реестр закрывается после конца месяца, выплата — до ${s.refPayDay} ${MONTHS_GEN[monthIdx(addMonths(m, 1))]}.</span></div>` : `<p class="note" style="margin-bottom:10px">Выплата за ${MONTHS[monthIdx(m)]} — до ${s.refPayDay} ${MONTHS_GEN[monthIdx(addMonths(m, 1))]}. На карту: ${rub(sum(toCard, x => x.due))} (${toCard.length}), на балансы: ${rub(sum(toBal, x => x.due))} + ${pct(s.refBalanceBonus)} бонусом.</p>`}

            <td><span class="pill ${ps.tone}">${esc(ps.name)}</span>${x.row && x.row.at ? `<br><small class="muted">${dayShort(isoTs(x.row.at))}</small>` : ''}</td>
            <td class="r">${canPay && !closed && ['due', 'carry', 'hold'].includes(x.status) ? `<div class="row" style="gap:4px;justify-content:flex-end">
              ${x.mode === 'card' && x.status === 'due' && !x.needTax ? `<button class="btn xs good" data-pay="${x.r.id}|paid|${x.due}">Выплачено</button>` : ''}
              <button class="btn xs" data-pay="${x.r.id}|balance|${x.due}">На баланс</button>
              ${x.status !== 'hold' ? `<button class="btn xs ghost" data-pay="${x.r.id}|hold|${x.due}" title="Возвратов больше ${pct(s.refundPause)} или подозрение на накрутку">Пауза</button>` : ''}</div>`

        }).join('') || '<tr><td colspan="7"><p class="note">За этот месяц начислений нет.</p></td></tr>'}
        </tbody></table></div>`;
    } else {
      const edit = Who.can('settings.edit') && !Who.readOnly();

      body = `<div class="two">
        <div class="card"><div class="card-head"><h2>«Приведи подругу»</h2><span class="pill rose">для всех клиенток</span></div>

          <div class="kv"><span>Подруге на первый заказ</span><b>${inp('friendBonus', s.friendBonus, 'бонусов', 1)}</b></div>
          <p class="note" style="margin-top:8px">Процент — с покупок подруги без учёта списанных бонусов. Подруга закрепляется навсегда, самоприглашение и накрутка отключают начисления.</p></div>
        <div class="card"><div class="card-head"><h2>Амбассадоры</h2><span class="pill gold">по приглашению</span></div>
          <div class="kv"><span>Стандартная ставка</span><b>${inp('ambRate', s.ambRate)}</b></div>

function payoutMark(month, rid, status, amount) {
  const r = Clients.get(rid);
  const s = settings();
  if (!Store.get('payouts', month)) Store.put('payouts', month, {month, createdAt: Date.now(), rows: {}});
  Store.patch('payouts', month, {rows: {[rid]: {status, amount, mode: status === 'paid' ? 'card' : r.refMode || 'balance', at: Date.now(), by: Who.id()}}});
  if (status === 'balance') {
    const add = Math.round(amount * (1 + s.refBalanceBonus));
    Store.patch('clients', rid, {balance: (r.balance || 0) + add});
    Ev.add('clients', rid, {kind: 'sys', text: `Реферальные за ${monthName(month)}: ${rub(amount)} + ${pct(s.refBalanceBonus)} бонус = ${rub(add)} зачислено на баланс Евы`});
  } else if (status === 'paid') {
    Ev.add('clients', rid, {kind: 'sys', text: `Реферальные за ${monthName(month)}: ${rub(amount)} выплачено на карту`});
  } else if (status === 'hold') {
    Ev.add('clients', rid, {kind: 'note', text: `Реферальные за ${monthName(month)} на паузе: проверить возвраты и накрутку`});
  }
  toast(status === 'hold' ? 'Начисление на паузе' : 'Отмечено');
}
function payoutUndo(month, rid) {
  const reg = Store.get('payouts', month);
  const row = reg && reg.rows && reg.rows[rid];
  if (!row) return;
  if (row.status === 'balance') {
    const r = Clients.get(rid);
    Store.patch('clients', rid, {balance: Math.max(0, (r.balance || 0) - Math.round(row.amount * (1 + settings().refBalanceBonus)))});
  }
  Store.unset('payouts', month, ['rows', rid]);
  toast('Отметка снята');
}

const GROUPS = {
  segment: {n: 'Сегмент', of: c => { const s = cx(c).segment; return s ? s.name : 'Без сегмента'; }},
  source:  {n: 'Источник', of: c => SOURCES[c.source] || c.source || '—'},
  manager: {n: 'Менеджер', of: c => (c.manager ? Team.name(Team.get(c.manager)) : 'Без менеджера')},
  city:    {n: 'Город', of: c => c.city || '—'},
  niche:   {n: 'Сфера / ниша', of: c => c.niche || '—'},
  stage:   {n: 'Этап', of: c => (Funnels.stage(Funnels.of('clients', c), c.stage) || {name: c.stage}).name},
  month:   {n: 'Месяц появления', of: c => (c.created ? monthName(monthOf(c.created), true) : '—'), sort: c => c.created || ''},
  sub:     {n: 'Подписка', of: c => SUB_STATUS[cx(c).sub].name},
  level:   {n: 'Уровень', of: c => levelOf(c.points).name},
  partner: {n: 'Партнёр', of: c => (c.partnerId ? (Partners.get(c.partnerId) || {}).name || '—' : 'Без партнёра')},
  tag:     {n: 'Тег', multi: c => ((c.tags || []).length ? c.tags.map(t => (Tags.get(t) || {}).name || t) : ['Без тегов'])},
  q_goal:  {n: 'Анкета: что важнее', multi: c => (((c.quiz || {}).goal || []).length ? c.quiz.goal.map(x => QUIZ.goal.opts[x]) : ['Не заполняла'])},
  q_stage: {n: 'Анкета: этап жизни', of: c => quizText('stage', (c.quiz || {}).stage) || 'Не заполняла'},
  q_level: {n: 'Анкета: опыт', of: c => quizText('level', (c.quiz || {}).level) || 'Не заполняла'},
  q_time:  {n: 'Анкета: время в день', of: c => quizText('time', (c.quiz || {}).time) || 'Не заполняла'},
  q_interest: {n: 'Анкета: интересы', multi: c => (((c.quiz || {}).interest || []).length ? c.quiz.interest.map(x => QUIZ.interest.opts[x]) : ['Не заполняла'])},
};
const METRICS = {
  n:      {n: 'Клиенток', f: L => L.length, fmt},
  leads:  {n: 'Дошли до заявки', f: L => L.filter(c => Funnels.idx('sales', c.stage) >= Funnels.idx('sales', 'lead') || (c.stage === 'lost' && Ev.list(c).some(e => e.kind === 'stage' && ['lead', 'qual', 'invoice'].includes(e.from)))).length, fmt},
  paid:   {n: 'Оплатили', f: L => L.filter(c => cx(c).ltv > 0).length, fmt},
  conv:   {n: 'Конверсия в оплату', f: L => (L.length ? L.filter(c => cx(c).ltv > 0).length / L.length : null), fmt: v => pct(v), pctM: true},
  ltv:    {n: 'Принесли, ₽', f: L => sum(L, c => cx(c).ltv), fmt: rub, money: true},
  avgLtv: {n: 'Средний LTV платящей, ₽', f: L => { const P = L.filter(c => cx(c).ltv > 0); return P.length ? sum(P, c => cx(c).ltv) / P.length : null; }, fmt: rub, money: true},
  active: {n: 'Активная подписка', f: L => L.filter(c => ['active', 'expiring'].includes(cx(c).sub)).length, fmt},
  touch:  {n: 'Касаний в среднем', f: L => (L.length ? sum(L, c => cx(c).touches) / L.length : null), fmt: v => fmt(v, 1)},
  lost:   {n: 'Отказов', f: L => L.filter(c => c.stage === 'lost').length, fmt},
};
function groupRows(list, gk) {
  const g = GROUPS[gk];
  const m = new Map();
  list.forEach(c => {
    const keys = g.multi ? g.multi(c) : [g.of(c)];
    keys.forEach(k => { if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
  });
  return [...m.entries()].map(([name, L]) => ({name, L}));
}

        </tbody></table></div>
        <section class="section card"><div class="card-head"><h2>Рассылки за период</h2></div>
          <div class="table-wrap"><table class="t"><thead><tr><th>Рассылка</th><th>Канал</th><th class="r">Получили</th><th class="r">Открыли</th><th class="r">Перешли</th><th class="r">Оплатили за 7 дней</th></tr></thead><tbody>
          ${Camps.all().filter(cp => cp.at && isoTs(cp.at) >= from).map(cp => { const st = Camps.stats(cp); return `<tr><td>${esc(cp.name)}</td><td>${chBadge(cp.ch)}</td><td class="r">${st.total}</td><td class="r">${st.total ? pct(st.opened / st.total) : '—'}</td><td class="r">${st.total ? pct(st.clicked / st.total) : '—'}</td><td class="r">${st.paid}${canMoney && st.paidSum ? ` · ${rubK(st.paidSum)}` : ''}</td></tr>`; }).join('') || '<tr><td colspan="6"><p class="note">Рассылок не было.</p></td></tr>'}
          </tbody></table></div></section>`;
    } else {
      /* конструктор */
      const gk = View.get('rp.g', 'niche');
      const mk = View.get('rp.m', ['n', 'paid', 'conv', 'ltv']).filter(k => METRICS[k] && (canMoney || !METRICS[k].money));
      const rules = View.get('rp.rules', []);
      const base = (per === 'all' ? vis : cohort).filter(c => !rules.length || testRules(rules, View.get('rp.match', 'all'), c));
      const sortM = mk[0] || 'n';
      const rows = groupRows(base, gk).map(r => ({...r, v: Object.fromEntries(mk.map(k => [k, METRICS[k].f(r.L)]))}))
        .sort((a, b) => (GROUPS[gk].sort ? String(GROUPS[gk].sort(a.L[0])).localeCompare(String(GROUPS[gk].sort(b.L[0]))) : (b.v[sortM] ?? -1) - (a.v[sortM] ?? -1)));
      const total = Object.fromEntries(mk.map(k => [k, METRICS[k].f(base)]));
      const barK = mk.find(k => !METRICS[k].pctM) || 'n';
      body = `<div class="card"><div class="card-head"><h2>Конструктор отчёта</h2><span class="note">любое поле таблицы × любые показатели · ${per === 'all' ? 'вся база' : 'контакты за период'}</span></div>
          <div class="row" style="align-items:flex-end">
            <label class="field"><span>Группировать по</span><select class="select" id="rpG">${Object.entries(GROUPS).map(([k, g]) => opt(k, g.n, gk)).join('')}</select></label>
            <div class="field" style="flex:1"><span>Показатели</span><div class="chips">${Object.entries(METRICS).filter(([k, m]) => canMoney || !m.money).map(([k, m]) => `<button class="chip ${mk.includes(k) ? 'on' : ''}" data-metric="${k}">${esc(m.n)}</button>`).join('')}</div></div>
            <button class="btn ${rules.length ? 'primary' : ''}" data-rp-rules>${icon('filter')}Условия${rules.length ? ' · ' + rules.length : ''}</button>
            ${Who.can('export') ? `<button class="btn" data-rp-csv>${icon('download')}CSV</button>` : ''}
          </div></div>
        <div class="split section">
          <div class="table-wrap"><table class="t"><thead><tr><th>${esc(GROUPS[gk].n)}</th>${mk.map(k => `<th class="r">${esc(METRICS[k].n)}</th>`).join('')}</tr></thead><tbody>
            ${rows.map(r => `<tr><td>${esc(r.name)}</td>${mk.map(k => `<td class="r">${r.v[k] === null ? '—' : METRICS[k].fmt(r.v[k])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${mk.length + 1}"><p class="note">Нет данных.</p></td></tr>`}
            <tr class="total"><td>Итого</td>${mk.map(k => `<td class="r">${total[k] === null ? '—' : METRICS[k].fmt(total[k])}</td>`).join('')}</tr>
          </tbody></table></div>
          <div class="card"><div class="card-head"><h2>${esc(METRICS[barK].n)}</h2></div>${hbarList(rows.slice(0, 14).map(r => ({name: r.name, v: r.v[barK] || 0})), {valFmt: METRICS[barK].money ? rubK : fmt})}</div>
        </div>`;
    }

    const tabs = [['funnel', 'Воронка'], ...(canMoney ? [['money', 'Деньги'], ['retention', 'Удержание']] : []), ['team', 'Менеджеры'], ['channels', 'Каналы и рассылки'], ['builder', 'Конструктор']];
    root.innerHTML = `
      ${pageHead('Отчёты', 'Всё считается из таблицы клиенток и их истории — цифры не расходятся с карточками.',
        `<div class="seg">${Object.entries(PERIODS).map(([k, p]) => `<button data-rper="${k}" class="${k === per ? 'on' : ''}">${p.name}</button>`).join('')}</div>`)}
      ${tabsHtml('rp.tab', tabs, tabs.some(x => x[0] === tab) ? tab : 'funnel')}
      ${body}`;

    wireTabs(root);
    on(root, 'click', '[data-rper]', (e, el) => { View.set('rp.per', el.dataset.rper); App.render(); });
    const fg = $('#rpFg', root); if (fg) fg.onchange = () => { View.set('rp.fg', fg.value); App.render(); };
    const g = $('#rpG', root); if (g) g.onchange = () => { View.set('rp.g', g.value); App.render(); };
    on(root, 'click', '[data-metric]', (e, el) => {
      const cur = View.get('rp.m', ['n', 'paid', 'conv', 'ltv']);
      const k = el.dataset.metric;
      View.set('rp.m', cur.includes(k) ? cur.filter(x => x !== k) : [...cur, k]);
      App.render();
    });
    on(root, 'click', '[data-rp-rules]', () => openRulesModal({title: 'Кого считаем в отчёте', rules: View.get('rp.rules', []), match: View.get('rp.match', 'all'), onSave: (r, m) => { View.set('rp.rules', r); View.set('rp.match', m); App.render(); }}));
    on(root, 'click', '[data-rp-csv]', () => {
      const gk = View.get('rp.g', 'niche');
      const mk = View.get('rp.m', ['n', 'paid', 'conv', 'ltv']).filter(k => METRICS[k]);
      const rules = View.get('rp.rules', []);
      const base = (per === 'all' ? vis : cohort).filter(c => !rules.length || testRules(rules, View.get('rp.match', 'all'), c));
      const rows = groupRows(base, gk).map(r => [r.name, ...mk.map(k => { const v = METRICS[k].f(r.L); return v === null ? '' : METRICS[k].pctM ? (v * 100).toFixed(1) + '%' : Math.round(v * 10) / 10; })]);
      saveFile(`eva-otchet-${gk}-${today()}.csv`, csvOf([[GROUPS[gk].n, ...mk.map(k => METRICS[k].n)], ...rows]), 'Отчёт');
    });
  },
});

            <ul>${x.what.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
            <p class="note">${esc(x.how)}</p>
            ${canEdit ? `<div class="row"><button class="btn sm" data-integ="${x.id}">${on_ ? 'Отключить' : 'Отметить подключённым'}</button></div>` : ''}</div>`;
        }).join('')}</div>`;
    } else if (tab === 'schema') {
      const EV_SCHEMA = [['kind', 'вид: msg, call, camp, pay, note, task, stage, meet, sys'], ['t', 'время, мс'], ['by', 'кто из команды'], ['ch', 'канал: tg, wa, max, email, sms, push'], ['dir', 'in / out'], ['text', 'текст, итог, заметка'], ['dur, result, rec', 'звонок: длительность, итог, ссылка на запись'], ['type, amount, method, status, item, expertId', 'оплата'], ['title, due, who, done', 'задача'], ['from, to, funnel, auto', 'смена этапа'], ['camp', 'id рассылки']];
      const cnt = Store.total();
      body = `<div class="card"><div class="card-head"><h2>Объём базы</h2><span class="note">${fmt(cnt)} из 5 000 записей в этой версии</span></div><div class="meter"><i style="width:${Math.min(100, cnt / 50).toFixed(1)}%"></i></div>
          <p class="note" style="margin-top:8px">Одна клиентка — одна запись со всей историей внутри. Эта версия вмещает до ~4 500 клиенток; дальше — производственная база (PostgreSQL на российском сервере), схема та же.</p></div>
        <section class="section"><h2 style="margin-bottom:10px">Таблица clients — клиентки</h2>
          <div class="table-wrap"><table class="t schema-t"><thead><tr><th>Поле</th><th>Название</th><th>Группа</th><th>Тип</th><th>Откуда</th></tr></thead><tbody>
          ${CLIENT_FIELDS.map(f => `<tr><td>${esc(f.k.startsWith('q_') ? 'quiz.' + f.k.slice(2) : f.k)}</td><td>${esc(f.n)}${f.about ? `<br><small class="muted">${esc(f.about)}</small>` : ''}</td><td>${esc(f.g)}</td><td>${esc(f.type)}</td><td>${f.calc ? '<span class="pill violet">считается</span>' : f.k.startsWith('q_') ? 'анкета' : 'вводится'}</td></tr>`).join('')}
          <tr><td>ev.{id}</td><td>История: касания, звонки, сообщения, оплаты, задачи, этапы</td><td>История</td><td>map</td><td>события</td></tr>
          </tbody></table></div></section>
        <section class="section"><h2 style="margin-bottom:10px">Событие истории — ev</h2><div class="table-wrap"><table class="t schema-t"><tbody>${EV_SCHEMA.map(([k, n]) => `<tr><td>${esc(k)}</td><td>${esc(n)}</td></tr>`).join('')}</tbody></table></div></section>
        <section class="section two">
          <div class="card"><div class="mini-h"><h3>experts — эксперты</h3></div><p class="note">name, direction, phone, tg, email, city, social, audience, experience, formats[], about, share, stage, funnel, manager, callAt, shootAt, content{title, kind, status, date}, ev{}</p></div>
          <div class="card"><div class="mini-h"><h3>partners — партнёры</h3></div><p class="note">name, category, city, address, contactName, contactRole, phone, tg, email, site, model, rate, promo, terms, contract{num, date, until}, offers{title, promo, discount, until, forWhom}, stage, manager, ev{}</p></div>
          <div class="card"><div class="mini-h"><h3>chats — групповые чаты</h3></div><p class="note">name, kind, ch, about, members[], msgs{t, from{type: client | team, id}, text, to}</p></div>
          <div class="card"><div class="mini-h"><h3>campaigns, payouts, team, cfg</h3></div><p class="note">campaigns: name, ch, text, audience{seg, rules, match | ids}, status, at, sent. payouts/{YYYY-MM}: rows{clientId: status, amount, mode, at}. team: name, uid, role, title. cfg: funnels, segments, tags, templates, sequences, views, integrations, settings.</p></div>
        </section>`;
    } else {
      const demo = Demo.present();
      const n = Store.total();
      body = `<div class="two">
        <div class="card"><div class="card-head"><h2>Демо-данные</h2>${demo ? '<span class="pill violet">загружены</span>' : ''}</div>
          <p class="note">78 вымышленных клиенток с анкетами, перепиской, звонками и оплатами, 14 экспертов, 10 партнёров, чат конференции UNICONF, рассылки и реестры выплат. Все записи помечены — удаляются одной кнопкой, ваши записи остаются.</p>
          ${canEdit ? `<div class="row" style="margin-top:10px">${demo ? `<button class="btn danger" data-demo-clear>${icon('trash')}Удалить демо-данные</button>` : ''}<button class="btn ${demo ? '' : 'primary'}" data-demo-load>${icon('db')}${demo ? 'Загрузить заново' : 'Загрузить демо-данные'}</button></div>` : ''}</div>
        <div class="card"><div class="card-head"><h2>Выгрузка всей базы</h2></div>
          <p class="note">JSON со всеми записями: клиентки с историей, эксперты, партнёры, чаты, рассылки, настройки. Для переезда на производственную базу и резервной копии.</p>
          ${Who.can('export') ? `<div class="row" style="margin-top:10px"><button class="btn" data-export-all>${icon('download')}Скачать JSON (${fmt(n)} записей)</button><button class="btn" data-export-clients>${icon('table')}Клиентки в CSV</button></div>` : ''}</div>
        <div class="card"><div class="card-head"><h2>Персональные данные</h2></div>
          <ul class="legal"><li>Храним только нужное для работы: контакты, анкету, согласия, историю касаний и оплат.</li>
            <li>Данные о здоровье (беременность, цикл) видны только при отдельном согласии.</li>
            <li>Отзыв согласия — удаляем данные в течение 30 дней: «Удалить карточку».</li>
            <li>Для реальной базы клиенток — производственная версия на сервере в России (152-ФЗ, ст. 18 ч. 5), уведомление Роскомнадзора, сообщение об утечке за 24 часа.</li></ul></div>
        ${canEdit ? `<div class="card"><div class="card-head"><h2>Очистить всё</h2></div><p class="note">Удаляет все записи этой CRM у всей команды. Отменить нельзя — сначала скачайте JSON.</p><div class="row" style="margin-top:10px"><button class="btn danger" data-wipe>${icon('trash')}Очистить базу</button></div></div>` : ''}
      </div>`;
    }

    const tabs = [['team', 'Команда', Team.all().length], ['funnels', 'Воронки и этапы'], ['segments', 'Сегменты и условия', Segments.all().length], ['tags', 'Теги', Tags.all().length], ['integrations', 'Интеграции'], ['schema', 'Схема базы'], ['data', 'Данные']];
    root.innerHTML = `${pageHead('Настройки', 'Команда, воронки, сегменты, теги, интеграции и данные.')}${tabsHtml('st.tab', tabs, tab)}${body}`;

    wireTabs(root);
    /* команда */
    on(root, 'change', '[data-tname]', (e, el) => Store.patch('team', el.dataset.tname, {name: el.value.trim()}));
    on(root, 'change', '[data-ttitle]', (e, el) => Store.patch('team', el.dataset.ttitle, {title: el.value.trim()}));
    on(root, 'change', '[data-trole]', (e, el) => { Store.patch('team', el.dataset.trole, {role: el.value}); toast('Роль изменена'); });
    on(root, 'click', '[data-tarch]', (e, el) => { const m = Team.get(el.dataset.tarch); Store.patch('team', m.id, {archived: !m.archived}); });
    on(root, 'click', '[data-as]', (e, el) => { View.set('as', el.dataset.as); App.go('home'); });
    const addM = $('#addMember', root);
    if (addM) addM.onsubmit = e => { e.preventDefault(); const name = $('#nmName', root).value.trim(); if (!name) return; Store.add('team', {name, role: $('#nmRole', root).value, title: ROLES[$('#nmRole', root).value].name, joinedAt: Date.now(), order: 30}); };
    /* воронки */
    on(root, 'click', '[data-stfn]', (e, el) => { View.set('st.fn', el.dataset.stfn); App.render(); });
    const readStages = () => $$('#stages [data-si]', root).map(c => {
      const f = Funnels.get(View.get('st.fn', 'sales')) || Funnels.get('sales');
      const old = f.stages[Number(c.dataset.si)] || {};
      const out = {...old, name: $('[data-k="name"]', c).value.trim() || old.name || 'Этап', about: $('[data-k="about"]', c).value.trim()};
      if ($('[data-k="won"]', c).checked) out.won = true; else delete out.won;
      return out;
    });
    const saveFunnel = (stages, msg) => {
      const f = Funnels.get(View.get('st.fn', 'sales')) || Funnels.get('sales');
      const base = {...f};
      delete base.id;
      Funnels.save(f.id, {...base, name: $('#fnName', root).value.trim() || f.name, about: $('#fnAbout', root).value.trim(), stages});
      if (msg) toast(msg);
    };
    on(root, 'click', '[data-up], [data-down]', (e, el) => {
      const st = readStages();
      const i = Number(el.dataset.up ?? el.dataset.down), j = el.dataset.up !== undefined ? i - 1 : i + 1;
      [st[i], st[j]] = [st[j], st[i]];
      saveFunnel(st);
    });
    on(root, 'click', '[data-rm-stage]', async (e, el) => {
      const f = Funnels.get(View.get('st.fn', 'sales'));
      const i = Number(el.dataset.rmStage);
      const s = f.stages[i];
      const n = entityList(f.entity).filter(x => Funnels.of(f.entity, x) === f.id && x.stage === s.id).length;
      if (n) { toast(`На этапе «${s.name}» ${n} ${plural(n, 'карточка', 'карточки', 'карточек')} — сначала перенесите их`, {error: true}); return; }
      if (f.stages.length <= 2) { toast('В воронке должно остаться хотя бы два этапа', {error: true}); return; }
      if (!await confirmPop(el, {text: `Удалить этап «${s.name}»?`, yes: 'Удалить', danger: true})) return;
      const st = readStages(); st.splice(i, 1); saveFunnel(st, 'Этап удалён');
    });
    on(root, 'click', '[data-add-stage]', () => { const st = readStages(); const won = st.findIndex(s => s.won); const ns = {id: 's' + uid().slice(-5), name: 'Новый этап', about: ''}; if (won >= 0) st.splice(won, 0, ns); else st.push(ns); saveFunnel(st); });
    on(root, 'click', '[data-save-funnel]', () => saveFunnel(readStages(), 'Воронка сохранена'));
    on(root, 'click', '[data-new-funnel]', async (e, el) => {
      const name = await askText(el, 'Название воронки', 'Корпоративные клиенты');
      if (!name) return;
      const id = 'f' + uid().slice(-5);
      Funnels.save(id, {name, entity: 'clients', order: 10, about: '', stages: [{id: 'new', name: 'Новый контакт', about: ''}, {id: 'talk', name: 'Переговоры', about: ''}, {id: 'offer', name: 'Предложение отправлено', about: ''}, {id: 'won', name: 'Сделка', about: '', won: true}]});
      View.set('st.fn', id);
      toast('Воронка создана: переносите в неё клиенток через «Изменить» в карточке');
    });
    /* сегменты и теги */
    on(root, 'click', '[data-seg-edit]', (e, el) => openSegmentForm(el.dataset.segEdit));
    on(root, 'click', '[data-tag-edit]', (e, el) => openTagForm(el.dataset.tagEdit));
    /* интеграции */
    on(root, 'click', '[data-integ]', (e, el) => { const cur = (Cfg.list('integrations') || {})[el.dataset.integ] || {}; Cfg.save('integrations', el.dataset.integ, {...cur, status: cur.status === 'on' ? 'off' : 'on', at: Date.now()}); });
    /* данные */
    wireEmptyBase(root);
    on(root, 'click', '[data-demo-clear]', async (e, el) => {
      if (!await confirmPop(el, {text: 'Удалить все демо-записи? Ваши записи останутся.', yes: 'Удалить', danger: true})) return;
      el.disabled = true; el.textContent = 'Удаляю…';
      const n = await Demo.clear();
      toast(`Удалено демо-записей: ${n}`);
    });
    on(root, 'click', '[data-export-all]', () => {
      const out = {exportedAt: new Date().toISOString(), app: 'Eva CRM'};
      Store.COLS.forEach(c => { out[c] = Object.fromEntries(Store.all(c).map(d => { const {id, ...b} = d; return [id, b]; })); });
      saveFile(`eva-crm-${today()}.json`, JSON.stringify(out, null, 1), 'Выгрузка базы');
    });
    on(root, 'click', '[data-export-clients]', () => exportClients(Clients.all(), CLIENT_FIELDS.filter(f => !['name', 'demo'].includes(f.k)).map(f => f.k)));
    on(root, 'click', '[data-wipe]', async (e, el) => {
      if (!await confirmPop(el, {text: 'Удалить ВСЕ записи CRM у всей команды?', yes: 'Удалить всё', danger: true})) return;
      for (const c of Store.COLS) for (const d of Store.all(c)) if (!(c === 'team' && d.uid)) Store.remove(c, d.id);
      await Store.flush();
      toast('База очищена');
    });
  },
});

function openSegmentForm(id) {
  const sg = id ? Segments.get(id) : null;
  const state = {rules: clone(sg ? sg.rules || [] : [{f: 'niche', op: 'eq', v: NICHES[0]}]), match: sg ? sg.match || 'all' : 'all'};
  openModal({title: sg ? `Сегмент: ${sg.name}` : 'Новый сегмент', wide: true, body: `<div class="grid3">
      <label class="field"><span>Название</span><input class="input" id="sgName" value="${esc(sg ? sg.name : '')}" placeholder="Салоны красоты"></label>
      <label class="field"><span>Цвет</span><input class="input" type="color" id="sgColor" value="${esc(sg ? sg.color : AV_COLORS[Segments.all().length % AV_COLORS.length])}"></label>
      <label class="field"><span>Порядок проверки</span><input class="input num" id="sgOrder" value="${sg ? sg.order ?? 50 : Segments.all().length + 1}"><small>меньше — проверяется раньше</small></label></div>
    <div class="field"><span>Условия попадания</span></div>
    <div id="sgRules">${rulesEditorHtml(state.rules, state.match)}</div>
    <label class="field"><span>Условия работы с сегментом</span><textarea class="textarea" id="sgOffer" placeholder="Какое предложение, скидка, формат для этого сегмента">${esc(sg ? sg.offer || '' : '')}</textarea></label>`,
    foot: `${sg ? '<button class="btn danger left" data-del>Удалить</button>' : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" data-ok>Сохранить</button>`,
    onMount(el, close) {
      const upd = () => { const r = state.read ? state.read() : state.rules; $('[data-r-count]', el).textContent = `подходят: ${Clients.all().filter(c => r.length && testRules(r, state.match, c)).length}`; };
      wireRulesEditor($('#sgRules', el), state, upd);
      upd();
      $('[data-ok]', el).onclick = () => {
        const name = $('#sgName', el).value.trim();
        if (!name) { $('#sgName', el).classList.add('need'); return; }
        Cfg.save('segments', id || 'sg' + uid().slice(-5), {name, color: $('#sgColor', el).value, order: parseNum($('#sgOrder', el).value), match: state.match, rules: state.read().filter(r => r.f && (OPS[r.op].noValue || !isEmpty(r.v))), offer: $('#sgOffer', el).value.trim()});
        close();
        toast('Сегмент сохранён');
      };
      const del = $('[data-del]', el);
      if (del) del.onclick = async () => { if (await confirmPop(del, {text: 'Удалить сегмент? Клиентки останутся, просто без этого сегмента.', yes: 'Удалить', danger: true})) { Cfg.drop('segments', id); close(); } };
    }});
}

function openTagForm(id) {
  const t = id ? Tags.get(id) : null;
  const groups = [...new Set(Tags.all().map(x => x.group))];
  openModal({title: t ? 'Тег' : 'Новый тег', body: `<div class="grid3"><label class="field"><span>Название</span><input class="input" id="tgName" value="${esc(t ? t.name : '')}"></label>
      <label class="field"><span>Группа</span><input class="input" id="tgGroup" list="tgGroups" value="${esc(t ? t.group : 'Интерес')}"><datalist id="tgGroups">${groups.map(g => `<option value="${esc(g)}">`).join('')}</datalist></label>
      <label class="field"><span>Цвет</span><input class="input" type="color" id="tgColor" value="${esc(t ? t.color : '#5A50C0')}"></label></div>`,
    foot: `${t ? '<button class="btn danger left" data-del>Удалить</button>' : ''}<button class="btn" data-close>Отмена</button><button class="btn primary" data-ok>Сохранить</button>`,
    onMount(el, close) {
      $('[data-ok]', el).onclick = () => { const name = $('#tgName', el).value.trim(); if (!name) { $('#tgName', el).classList.add('need'); return; } Cfg.save('tags', id || 't' + uid().slice(-6), {name, group: $('#tgGroup', el).value.trim() || 'Прочее', color: $('#tgColor', el).value}); close(); };
      const del = $('[data-del]', el);
      if (del) del.onclick = async () => {
        const n = Tags.count()[id] || 0;
        if (!await confirmPop(del, {text: n ? `Тег стоит у ${n}. Снять у всех и удалить?` : 'Удалить тег?', yes: 'Удалить', danger: true})) return;
        Clients.all().filter(c => (c.tags || []).includes(id)).forEach(c => Store.patch('clients', c.id, {tags: c.tags.filter(x => x !== id)}));
        Cfg.drop('tags', id);
        close();
      };
    }});
}

/* ── 99-boot.js ── */
/* Запуск: подключаемся к общей базе (или к браузеру) и узнаём, кто открыл
   CRM, затем рисуем. Вне артефакта при первом открытии загружаем пример,
   чтобы было на чём посмотреть; в общей базе пример загружает руководитель. */

(async function boot() {
  const mark = $('.boot-mark');
  if (mark) mark.innerHTML = brandIcon();
  const msg = $('#bootMsg');
  const slow = setTimeout(() => { if (msg) msg.textContent = 'База отвечает медленно — ещё пара секунд…'; }, 4000);
  try { await Promise.all([Store.init(), Who.init()]); } catch (e) { console.error('Хранилище не поднялось', e); }
  clearTimeout(slow);
  if (Store.state.mode === 'local' && !Store.total() && !Local.get('eva-crm-seeded', false)) {
    if (msg) msg.textContent = 'Готовлю пример базы…';
    Local.set('eva-crm-seeded', true);
    await Demo.load();
  }
  App.start();
  /* для проверок из консоли */
  window.__eva = {Store, Who, App, View, Clients, Referral, Demo, cx, settings};
})();
})();
</script>
