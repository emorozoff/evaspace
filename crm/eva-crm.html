<title>Eva CRM — работа с клиентами</title>
<meta name="description" content="CRM Eva Space: единая база клиентов, воронки продаж, экспертов, партнёров и рефералов, касания, переписка и отчёты.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── 00-tokens.css ── */
/* Деловая палитра на основе Книги стандартов Eva Space:
   Ночь #14111A — основа и тёмная панель, Роза и Золото — только акценты
   бренда (знак, отметки, деньги), Фиалка — ссылки и выбранное.
   Шрифт — Inter; Unbounded остаётся только в названии штаба. */
:root{
  --bg:#F3F3F6;
  --surface:#FFFFFF;
  --surface-2:#F8F8FA;
  --sunken:#EEEEF2;
  --line:#E2E2E8;
  --line-strong:#CBCBD4;
  --ink:#16141C;
  --ink-2:#4A4856;
  --ink-3:#7B7987;

  --night:#15121B;
  --night-2:#211C29;
  --night-line:#2F2838;
  --night-ink:#ECE9F1;
  --night-ink-2:#9F99AB;

  --accent:#1D1828;          /* главные кнопки */
  --on-accent:#FFFFFF;
  --link:#4F46B8;            /* ссылки, выбранные вкладки, фокус */
  --link-soft:#ECEBFA;

  --rose:#A8456F;
  --rose-brand:#E4A0B8;
  --rose-soft:#F7E6EE;
  --gold:#8A6420;
  --gold-brand:#E7C58B;
  --gold-soft:#F5EDDC;
  --violet:#4F46B8;
  --violet-soft:#ECEBFA;

  --good:#23734F;
  --good-soft:#E0F0E7;
  --bad:#A23A4A;
  --bad-soft:#F7E4E7;
  --warn:#94600E;
  --warn-soft:#F9EED8;

  --in-row:#F1F8F4;
  --out-row:#FCF3F4;

  /* сетка дорожной карты */
  --g-alt:rgba(22,20,28,.028);
  --g-half:rgba(22,20,28,.06);
  --g-month:rgba(22,20,28,.13);
  --g-quarter:rgba(22,20,28,.28);

  --shadow:0 1px 2px rgba(22,20,28,.05);
  --shadow-pop:0 16px 44px rgba(22,20,28,.18), 0 2px 6px rgba(22,20,28,.08);
  --radius:10px;
  --radius-sm:7px;

  --f-display:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --f-text:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --f-brand:'Unbounded', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111016; --surface:#1A1820; --surface-2:#1F1D26; --sunken:#15131A;
    --line:#2C2A34; --line-strong:#403D4B;
    --ink:#EFEDF3; --ink-2:#BEBBC8; --ink-3:#8D8A99;
    --night:#0C0B10; --night-2:#18161E; --night-line:#27242E;
    --accent:#ECE9F3; --on-accent:#15121B;
    --link:#A9A3F4; --link-soft:#26234A;
    --rose:#E4A0B8; --rose-soft:#3A2431;
    --gold:#E7C58B; --gold-soft:#33291B;
    --violet:#A9A3F4; --violet-soft:#26234A;
    --good:#7DCBA3; --good-soft:#1B3027;
    --bad:#EF929F; --bad-soft:#3B2027;
    --warn:#E8B463; --warn-soft:#352819;
    --in-row:#17231D; --out-row:#261B20;
    --g-alt:rgba(255,255,255,.025); --g-half:rgba(255,255,255,.05); --g-month:rgba(255,255,255,.11); --g-quarter:rgba(255,255,255,.24);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-pop:0 16px 44px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111016; --surface:#1A1820; --surface-2:#1F1D26; --sunken:#15131A;
  --line:#2C2A34; --line-strong:#403D4B;
  --ink:#EFEDF3; --ink-2:#BEBBC8; --ink-3:#8D8A99;
  --night:#0C0B10; --night-2:#18161E; --night-line:#27242E;
  --accent:#ECE9F3; --on-accent:#15121B;
  --link:#A9A3F4; --link-soft:#26234A;
  --rose:#E4A0B8; --rose-soft:#3A2431;
  --gold:#E7C58B; --gold-soft:#33291B;
  --violet:#A9A3F4; --violet-soft:#26234A;
  --good:#7DCBA3; --good-soft:#1B3027;
  --bad:#EF929F; --bad-soft:#3B2027;
  --warn:#E8B463; --warn-soft:#352819;
  --in-row:#17231D; --out-row:#261B20;
  --g-alt:rgba(255,255,255,.025); --g-half:rgba(255,255,255,.05); --g-month:rgba(255,255,255,.11); --g-quarter:rgba(255,255,255,.24);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 16px 44px rgba(0,0,0,.6);
}

/* ── 01-base.css ── */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 var(--f-text); -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance;}
h1{font:600 22px/1.25 var(--f-display); letter-spacing:-.015em;}
h2{font:600 15px/1.3 var(--f-display); letter-spacing:-.005em;}
h3{font:600 14px/1.35 var(--f-text);}
p{margin:0;}
a{color:inherit;}
button,input,select,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--link); outline-offset:2px;}
img{max-width:100%;}
[hidden]{display:none !important;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-3);}
.soft{color:var(--ink-2);}
.good{color:var(--good);}
.bad{color:var(--bad);}
.warn{color:var(--warn);}
.label{
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
}
.nowrap{white-space:nowrap;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

/* загрузка */
.boot{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:var(--ink-3); text-align:center; padding-inline:16px;
}
.boot b{font:500 17px var(--f-brand); color:var(--ink);}
.boot-mark{width:44px; height:44px; margin-bottom:8px; animation:pulse 1.6s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 02-shell.css ── */
/* Оболочка: тёмная боковая панель «Ночь» + рабочая область */
.app{min-height:100%;}
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh;}
.side{
  position:sticky; top:0; height:100vh; overflow-y:auto;
  background:var(--night); color:var(--night-ink);
  display:flex; flex-direction:column; padding:20px 14px 16px;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px; text-decoration:none;}
.brand-mark{width:34px; height:34px; flex:0 0 34px; border-radius:9px; box-shadow:0 2px 8px rgba(0,0,0,.35);}
.brand b{display:block; font:500 14.5px/1.1 var(--f-brand); color:#fff; letter-spacing:.02em;}
.brand span{display:block; font-size:11px; color:var(--night-ink-2); margin-top:3px;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav a{
  display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:7px;
  color:var(--night-ink-2); text-decoration:none; font-weight:500; font-size:14px;
}
.nav a svg{width:18px; height:18px; flex:0 0 18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.nav a:hover{background:var(--night-2); color:var(--night-ink);}
.nav a.on{background:var(--night-2); color:#fff; box-shadow:inset 2px 0 0 var(--gold-brand);}
.nav .badge{
  margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px;
  background:var(--rose-brand); color:var(--night); font-size:11.5px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center;
}
.side-foot{margin-top:auto; padding-top:18px; display:flex; flex-direction:column; gap:10px;}
.me-chip{
  display:flex; align-items:center; gap:10px; padding:8px; border-radius:9px;
  background:var(--night-2); border:1px solid var(--night-line);
}
.me-link{display:flex; align-items:center; gap:10px; flex:1; min-width:0; text-decoration:none; color:inherit; border-radius:7px;}
.me-link:hover b{text-decoration:underline; text-underline-offset:3px;}
.me-chip.on{border-color:var(--gold-brand);}
.me-chip .who{min-width:0; flex:1;}
.me-chip b{display:block; font-size:13px; color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.me-chip .who span{display:block; font-size:11.5px; color:var(--night-ink-2);}
.me-chip button{
  background:none; border:1px solid var(--night-line); color:var(--night-ink-2); border-radius:8px;
  width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 30px;
}
.me-chip button:hover{color:#fff; border-color:var(--rose-brand);}
.me-chip button svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8;}
.sync{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--night-ink-2); padding:0 4px;}
.sync i{width:7px; height:7px; border-radius:50%; background:#6FC49A; flex:0 0 7px;}
.sync.local i{background:var(--gold-brand);}
.sync.busy i{background:var(--gold-brand); animation:pulse 1s ease-in-out infinite;}
.sync.err i{background:#EF929F;}
@keyframes pulse{50%{opacity:.35;}}

.main{min-width:0; padding:26px 36px 64px;}
.page{max-width:1200px; margin:0 auto;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
.page-head .sub{color:var(--ink-3); margin-top:6px; max-width:62ch;}
.page-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.section{margin-top:30px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
.section-head .hint-inline{color:var(--ink-3); font-size:12.5px;}

/* узкие экраны: панель становится шапкой с прокручиваемым меню */
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);}
  .side{min-width:0;
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40; height:auto; overflow:visible;
    flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px 16px; gap:8px 12px;
  }
  .brand{padding:0; flex:1 1 auto;}
  .brand span{display:none;}
  .side-foot{margin:0; padding:0; flex-direction:row; align-items:center;}
  .sync span{display:none;}
  .me-chip{padding:4px 4px 4px 4px; background:none; border:0;}
  .me-chip .who{display:none;}
  .nav{order:3; flex:1 0 100%; flex-direction:row; overflow-x:auto; gap:4px; margin:0 -16px; padding:0 16px 2px; scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{padding:7px 10px; white-space:nowrap; font-size:13px;}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--rose-brand);}
  .main{padding:20px 16px 56px;}
  h1{font-size:20px;}
}

/* ── 03-components.css ── */
/* ── кнопки ── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:34px; padding:0 13px; border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-weight:500; font-size:13.5px; white-space:nowrap;
  text-decoration:none; transition:background .12s, border-color .12s, color .12s;
}
.btn:hover{border-color:var(--ink-3);}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.25);}
.btn.dark{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2);}
.btn.ghost:hover{background:var(--sunken); color:var(--ink);}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line));}
.btn.danger.solid{background:var(--bad); border-color:var(--bad); color:#fff;}
.btn.good{background:var(--good); border-color:var(--good); color:#fff;}
.btn.sm{height:30px; padding:0 10px; font-size:12.5px; border-radius:6px;}
.btn.xs{height:26px; padding:0 8px; font-size:12px; border-radius:7px;}
.btn[disabled]{opacity:.5; cursor:default; pointer-events:none;}
.icon-btn{
  width:32px; height:32px; border-radius:8px; border:1px solid transparent; background:none; color:var(--ink-3);
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 32px;
}
.icon-btn:hover{background:var(--sunken); color:var(--ink);}
.icon-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.link-btn{background:none; border:0; padding:0; color:var(--link); font-weight:500; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;}

/* ── поля ── */
.field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.field > span{font-size:12px; font-weight:500; color:var(--ink-2);}
.field small{font-size:11.5px; color:var(--ink-3);}
.input, .select, .textarea{
  width:100%; height:34px; padding:0 10px; border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:14px; min-width:0;
}
.textarea{height:auto; min-height:84px; padding:9px 11px; resize:vertical; line-height:1.5;}
.select{padding-right:28px; appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position:calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size:5px 5px; background-repeat:no-repeat;
}
.input:focus, .select:focus, .textarea:focus{outline:none; border-color:var(--link); box-shadow:0 0 0 3px var(--link-soft);}
.input.num{text-align:right;}
.input.sm, .select.sm{height:30px; font-size:13px; border-radius:8px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
@media (max-width:640px){ .grid2, .grid3{grid-template-columns:1fr;} }
.check{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px;}
.check input{width:16px; height:16px; accent-color:var(--link);}

/* ── переключатель вариантов ── */
.seg{display:inline-flex; background:var(--sunken); border-radius:8px; padding:3px; gap:2px; flex-wrap:wrap; border:1px solid var(--line);}
.seg button{
  border:0; background:none; height:28px; padding:0 11px; border-radius:6px; font-size:13px; font-weight:500; color:var(--ink-2);
  white-space:nowrap;
}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(23,19,31,.12);}
.seg.out button.on{color:var(--bad);} .seg.in button.on{color:var(--good);}

/* ── метки ── */
.pill{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:11px;
  font-size:11.5px; font-weight:600; white-space:nowrap; background:var(--sunken); color:var(--ink-2);
}
.pill.rose{background:var(--rose-soft); color:var(--rose);}
.pill.gold{background:var(--gold-soft); color:var(--gold);}
.pill.violet{background:var(--violet-soft); color:var(--violet);}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.line{background:none; border:1px solid var(--line-strong);}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 8px; background:var(--ink-3);}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  height:28px; padding:0 10px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface);
  font-size:12.5px; font-weight:500; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.chip:hover{border-color:var(--ink-3); color:var(--ink);}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.chip b{font-weight:700;}

/* ── панели ── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.card.flat{box-shadow:none;}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.card-head h2{font-size:14.5px;}
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));}
.split{display:grid; gap:16px; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);}
@media (max-width:1000px){ .split{grid-template-columns:1fr;} }

/* показатели */
.stat .label{display:block; margin-bottom:8px;}
.stat .big{font:600 26px/1.1 var(--f-display); letter-spacing:-.02em;}
.stat .big small{font:500 14px var(--f-text); color:var(--ink-3); letter-spacing:0;}
.stat .foot{margin-top:8px; font-size:12.5px; color:var(--ink-3);}
.bar{height:6px; border-radius:3px; background:var(--sunken); overflow:hidden; margin-top:10px; position:relative;}
.bar > i{display:block; height:100%; border-radius:3px; background:var(--link);}
.bar > i.good{background:var(--good);} .bar > i.warn{background:var(--warn);} .bar > i.bad{background:var(--bad);}
.bar > b{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); border-radius:1px;}

/* ── таблицы ── */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
table.t{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums;}
table.t th, table.t td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle;}
table.t th{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); background:var(--surface-2); white-space:nowrap;}
table.t tbody tr:last-child td{border-bottom:0;}
table.t td.r, table.t th.r{text-align:right;}
table.t td.c, table.t th.c{text-align:center;}
table.t tr.total td{font-weight:700; background:var(--surface-2);}
table.t tr.sub td{font-weight:600;}
table.t tr.group td{background:var(--sunken); font-weight:600; font-size:12px; color:var(--ink-2);}
table.t tr.now td{background:var(--rose-soft);}
table.t tr:hover td.hov{background:var(--surface-2);}
table.grid-lines td, table.grid-lines th{border-right:1px solid var(--line);}
table.grid-lines td:last-child, table.grid-lines th:last-child{border-right:0;}

/* ── аватар ── */
.av{
  width:26px; height:26px; border-radius:50%; flex:0 0 26px; display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff; background:var(--violet); letter-spacing:.02em; text-transform:uppercase;
}
.av.lg{width:40px; height:40px; flex-basis:40px; font-size:14px;}
.av.none{background:var(--sunken); color:var(--ink-3); border:1px dashed var(--line-strong);}
.av img{width:100%; height:100%; border-radius:50%; object-fit:cover;}

/* ── пустое состояние и подсказки ── */
.empty{padding:26px 18px; text-align:center; color:var(--ink-3); font-size:13.5px; border:1px dashed var(--line-strong); border-radius:var(--radius);}
.empty b{display:block; color:var(--ink-2); margin-bottom:4px; font-size:14px;}
.help{
  display:flex; gap:14px; align-items:flex-start; padding:12px 16px; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--link); color:var(--ink-2); font-size:13px; line-height:1.55; margin-bottom:18px;
}
.help b{color:var(--ink);}
.help ol, .help ul{margin:4px 0 0; padding-left:18px;}
.help .x{margin-left:auto; flex:0 0 auto;}
.note{font-size:12.5px; color:var(--ink-3); line-height:1.5;}

/* ── вкладки ── */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; scrollbar-width:none;}
.tabs button{
  border:0; background:none; padding:10px 12px; font-weight:500; color:var(--ink-3); font-size:14px; white-space:nowrap;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink);}
.tabs button.on{color:var(--ink); border-bottom-color:var(--link);}
.tabs button .n{font-size:11.5px; color:var(--ink-3); margin-left:4px;}

/* ── окно ── */
.modal-back{
  position:fixed; inset:0; z-index:100; background:rgba(14,11,18,.48); display:flex; align-items:flex-start; justify-content:center;
  padding:6vh 16px 24px; overflow-y:auto; animation:fade .14s ease-out;
}
.modal{
  width:100%; max-width:560px; background:var(--surface); border-radius:12px; box-shadow:var(--shadow-pop);
  border:1px solid var(--line); animation:rise .16s ease-out;
}
.modal.wide{max-width:860px;}
.modal-head{display:flex; align-items:flex-start; gap:12px; padding:18px 20px 0;}
.modal-head h2{flex:1; font-size:16px; padding-top:4px;}
.modal-body{padding:16px 20px 20px; display:flex; flex-direction:column; gap:14px;}
.modal-foot{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:14px 20px; border-top:1px solid var(--line); background:var(--surface-2); border-radius:0 0 12px 12px;}
.modal-foot .left{margin-right:auto;}
@keyframes fade{from{opacity:0;}}
@keyframes rise{from{opacity:0; transform:translateY(8px);}}

/* ── всплывающее подтверждение ── */
.pop{
  position:absolute; z-index:120; width:max-content; max-width:280px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow-pop); padding:12px 14px; animation:fade .12s ease-out;
}
.pop p{font-size:13px; font-weight:500; margin-bottom:10px;}
.pop .row{gap:6px;}

/* ── уведомления ── */
.toast-root{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:max-content; max-width:calc(100vw - 32px);}
.toast{
  display:flex; align-items:center; gap:14px; background:var(--night); color:var(--night-ink); padding:10px 14px 10px 16px;
  border-radius:11px; box-shadow:var(--shadow-pop); font-size:13.5px; animation:rise .16s ease-out;
}
.toast button{background:none; border:0; color:var(--rose-brand); font-weight:600; padding:2px 4px;}
.toast.err{background:var(--bad);}

/* ── графики ── */
.chart{width:100%; height:auto; display:block; overflow:visible;}
.chart text{font:11px var(--f-text); fill:var(--ink-3);}
.chart .grid{stroke:var(--line); stroke-width:1;}
.chart .axis{stroke:var(--line-strong); stroke-width:1;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:8px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:14px; height:3px; border-radius:2px; display:inline-block;}
.legend i.dash{background:repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height:2px;}
@media (max-width:640px){
  .tiles, .periods, .cf-sum{grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .tiles .stat, .periods .period, .cf-sum .stat{min-height:0; padding:14px;}
  .stat .big{font-size:20px;}
  .stat .foot{font-size:12px;}
}

/* ── 04-board.css ── */
/* ── задачи: панель ── */
.t-bar{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin-bottom:16px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
.t-bar .select{width:auto; max-width:190px;}
.t-search{width:170px;}
.t-bar-sp{flex:1;}
.t-done-t{font-size:12.5px; color:var(--ink-2);}
@media (max-width:760px){ .t-bar .select, .t-search{max-width:none; flex:1 1 140px;} .t-bar-sp{display:none;} }

/* ── доска ── */
.kb{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(264px, 1fr); gap:12px; overflow-x:auto; padding-bottom:10px; align-items:start;}
.kb-wide{grid-auto-columns:minmax(250px, 1fr);}
.kb-weeks{grid-auto-columns:minmax(210px, 1fr);}
@media (max-width:760px){ .kb, .kb-wide, .kb-weeks{grid-auto-columns:minmax(82vw, 1fr); scroll-snap-type:x mandatory;} .kb-col{scroll-snap-align:start;} }
.kb-col{background:var(--sunken); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column; min-height:120px; transition:border-color .12s, background .12s;}
.kb-col.now{border-color:color-mix(in srgb, var(--link) 45%, var(--line));}
.kb-col.backlog{background:var(--surface-2); border-style:dashed;}
.kb-col.drop-on{border-color:var(--link); background:color-mix(in srgb, var(--link-soft) 70%, var(--sunken));}
.kb-h{display:flex; align-items:center; gap:8px; padding:10px 12px 8px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.kb-h b{font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap;}
.kb-h em{font-style:normal; font-size:11.5px; color:var(--ink-3);}
.kb-col.doing .kb-h b{color:var(--violet);} .kb-col.review .kb-h b{color:var(--gold);} .kb-col.done .kb-h b{color:var(--good);}
.kb-col.now .kb-h b::after{content:' · сейчас'; color:var(--link); text-transform:none; letter-spacing:0; font-weight:600;}
.kb-n{margin-left:auto; min-width:22px; height:20px; padding:0 6px; border-radius:10px; background:var(--surface); border:1px solid var(--line); font-size:11.5px; font-weight:600; color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;}
.kb-prog{font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.kb-list{display:flex; flex-direction:column; gap:8px; padding:10px; min-height:60px;}
.kb-add{display:flex; align-items:center; gap:6px; width:100%; padding:8px 10px; border-radius:8px; border:1px dashed var(--line-strong); background:transparent; color:var(--ink-3); font-size:13px; font-weight:500; text-align:left;}
.kb-add svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;}
.kb-add:hover{border-style:solid; border-color:var(--link); color:var(--link); background:var(--surface);}
.kb-more-done{background:none; border:0; color:var(--link); font-size:12.5px; font-weight:500; padding:4px; text-align:left;}
.kb-composer{background:var(--surface); border:1px solid var(--link); border-radius:9px; padding:8px; display:flex; flex-direction:column; gap:6px; box-shadow:0 0 0 3px var(--link-soft);}
.kb-composer .textarea{min-height:52px; border:0; padding:4px 6px; box-shadow:none; resize:none; font-size:13.5px;}
.kb-composer .textarea:focus{box-shadow:none;}
.kb-comp-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.kb-comp-row .select, .kb-comp-row .input{flex:1 1 110px; width:auto;}
.kb-more{margin-left:auto;}
.list-add{background:none; border:0; min-height:0; margin-bottom:8px;}
.list-add .kb-list{padding:0; min-height:0;}

/* карточка */
.kc{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 10px 10px; display:flex; flex-direction:column; gap:7px; cursor:pointer; box-shadow:0 1px 1px rgba(22,20,28,.04); user-select:none; -webkit-user-select:none; touch-action:manipulation;}
.kc.can{cursor:grab;}
.kc:hover{border-color:var(--line-strong);}
.kc:focus-visible{outline:2px solid var(--link); outline-offset:1px;}
.kc.fresh{box-shadow:inset 3px 0 0 var(--rose-brand);}
.kc.done .kc-title{color:var(--ink-3); text-decoration:line-through;}
.kc-top{display:flex; align-items:center; gap:6px; min-height:24px;}
.kc-dir{font-size:10.5px; font-weight:700; letter-spacing:.06em; padding:2px 6px; border-radius:5px; color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent);}
.kc-dir.none{color:var(--ink-3); background:var(--sunken);}
.kc-prio{width:16px; height:16px; border-radius:50%; background:var(--bad-soft); color:var(--bad); font-size:11px; font-weight:800; display:inline-flex; align-items:center; justify-content:center;}
.kc-av{margin-left:auto; background:none; border:0; padding:0; border-radius:50%; line-height:0;}
.kc-av:hover:not([disabled]) .av{box-shadow:0 0 0 2px var(--link);}
.kc-av .av{width:24px; height:24px; flex-basis:24px; font-size:10px;}
.kc-av[disabled]{cursor:default;}
.kc-title{font-size:13.5px; font-weight:500; line-height:1.4; overflow-wrap:anywhere;}
.kc-foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ink-3);}
.kc-foot .t-goal{max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.kc-st{margin-left:auto; height:20px; font-size:11px;}
.due svg{width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2; vertical-align:-2px; margin-right:3px;}
.drag-ghost{position:fixed; left:0; top:0; z-index:300; pointer-events:none; box-shadow:0 18px 40px rgba(22,20,28,.28); border-color:var(--link) !important; opacity:.96; cursor:grabbing;}
.drag-ph{border:2px dashed var(--link); border-radius:9px; background:color-mix(in srgb, var(--link-soft) 60%, transparent); flex:0 0 auto;}
.kc.drag-src{display:none;}
body.dragging-now, body.dragging-now *{cursor:grabbing !important; user-select:none !important;}
.week-tabs{margin-bottom:12px;}

.t-check{
  width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line-strong); background:var(--surface); color:transparent;
  display:inline-flex; align-items:center; justify-content:center; padding:0;
}
.t-check svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;}
.t-check:hover:not([disabled]){border-color:var(--good); color:var(--good);}
.t-check.done{background:var(--good); border-color:var(--good); color:#fff;}
.t-check.review{background:var(--gold-soft); border-color:var(--gold); color:var(--gold);}
.t-check[disabled]{opacity:.45; cursor:default;}

/* ── 10-crm.css ── */
/* ── общие CRM-элементы ── */
.as-bar{max-width:1280px; margin:0 auto 14px; display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--radius); background:var(--gold-soft); color:var(--gold); font-size:13px;}
.as-bar svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}
.as-bar span{flex:1;}
.page{max-width:1280px;}

.ch{--c:var(--ink-3); display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 6px 0 4px; border-radius:6px; background:color-mix(in srgb, var(--c) 13%, transparent); color:var(--c); font-size:11px; font-weight:700; white-space:nowrap; vertical-align:middle;}
.ch svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.ch:not(:has(b)){padding:0 4px;}
.ch b{font-weight:700;}
.pill .st-n{font-style:normal; font-size:10px; opacity:.75; margin-right:1px;}
.tagc{--c:var(--ink-3); display:inline-flex; align-items:center; gap:3px; height:20px; padding:0 7px; border-radius:10px; font-size:11.5px; font-weight:600; color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent); white-space:nowrap;}
.tagc button{border:0; background:none; color:inherit; padding:0 0 0 2px; font-size:14px; line-height:1; opacity:.7;}
.tagc button:hover{opacity:1;}
.tagc.more{color:var(--ink-3); background:var(--sunken);}
.tags-line{display:flex; gap:4px; flex-wrap:wrap; align-items:center;}
.kv{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px;}
.kv:last-child{border-bottom:0;}
.kv > span{color:var(--ink-3); flex:0 0 auto; max-width:48%;}
.kv > b{font-weight:500; text-align:right; min-width:0; overflow-wrap:anywhere;}
.kv > b a{color:var(--link);}
.mini-h{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
.mini-h h3{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2);}
.dim{opacity:.55;}
.nowrap-ellipsis{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sp{flex:1;}
.inline-link{color:var(--link); text-decoration:none; font-weight:500;}
.inline-link:hover{text-decoration:underline; text-underline-offset:3px;}
.copy-fallback{width:100%; min-height:80px; font:12px/1.4 ui-monospace, Menlo, monospace;}
.counter{display:inline-flex; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--rose); color:#fff; font-size:10.5px; font-weight:700; align-items:center; justify-content:center;}
.warnline{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:9px; background:var(--warn-soft); color:var(--warn); font-size:12.5px; line-height:1.5;}
.warnline svg{width:16px; height:16px; flex:0 0 16px; stroke:currentColor; fill:none; stroke-width:1.9; margin-top:1px;}
.warnline b{color:inherit;}
.okline{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:9px; background:var(--good-soft); color:var(--good); font-size:12.5px;}

/* ── воронка-полосы и списки-полосы ── */
.fbars{display:flex; flex-direction:column; gap:6px;}
.fbar{display:grid; grid-template-columns:minmax(120px, 180px) minmax(0,1fr) 54px; gap:10px; align-items:center; font-size:13px;}
.fbar[data-go]{cursor:pointer;}
.fbar[data-go]:hover .fbar-n{color:var(--link);}
.fbar-n{color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fbar-track{position:relative; height:24px; border-radius:6px; background:var(--sunken); overflow:hidden;}
.fbar-track i{position:absolute; inset:0 auto 0 0; border-radius:6px; background:color-mix(in srgb, var(--link) 70%, var(--surface)); min-width:2px;}
.fbar.won .fbar-track i{background:var(--good);}
.fbar.lost .fbar-track i{background:color-mix(in srgb, var(--bad) 55%, var(--surface));}
.fbar-track b{position:relative; z-index:1; display:flex; align-items:center; height:100%; padding-left:8px; font-size:12px; font-weight:700; color:var(--ink);}
.fbar-c{text-align:right; font-size:12px; color:var(--ink-3);}
@media (max-width:520px){ .fbar{grid-template-columns:100px minmax(0,1fr) 44px;} }
.hbl{display:flex; flex-direction:column; gap:7px;}
.hbl-r{display:grid; grid-template-columns:minmax(110px, 170px) minmax(0,1fr) auto auto; gap:10px; align-items:center; font-size:13px;}
.hbl-n{display:flex; align-items:center; gap:6px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hbl-t{height:8px; border-radius:4px; background:var(--sunken); overflow:hidden;}
.hbl-t i{display:block; height:100%; border-radius:4px;}
.hbl-r b{font-weight:600; font-size:12.5px; text-align:right;}
.hbl-r small{font-size:11.5px; color:var(--ink-3); min-width:44px; text-align:right;}

/* ── дашборд ── */
.tiles6{display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));}
.tiles6 .stat{min-height:118px; padding:16px 18px;}
.delta{font-size:12px; font-weight:600;}
.delta.up{color:var(--good);} .delta.down{color:var(--bad);}
.attn{display:flex; flex-direction:column; gap:2px;}
.attn-g{border-top:1px solid var(--line); padding:10px 0 4px;}
.attn-g:first-child{border-top:0; padding-top:0;}
.attn-h{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:4px;}
.attn-h .n{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-3); font-weight:600;}
.attn-h .n.bad{color:var(--bad);}
.attn-row{display:flex; align-items:center; gap:10px; padding:6px 6px; border-radius:7px; text-decoration:none; color:inherit; font-size:13px;}
.attn-row:hover{background:var(--surface-2);}
.attn-row .av{width:24px; height:24px; flex-basis:24px; font-size:10px;}
.attn-row .t{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.attn-row small{color:var(--ink-3); font-size:12px; white-space:nowrap;}
.feed2{display:flex; flex-direction:column;}
.feed2 a{display:flex; gap:10px; padding:7px 4px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; font-size:13px; align-items:flex-start;}
.feed2 a:last-child{border-bottom:0;}
.feed2 a:hover{background:var(--surface-2);}
.feed2 .f-t{flex:1; min-width:0;}
.feed2 .f-t span{color:var(--ink-3);}
.feed2 small{color:var(--ink-3); font-size:11.5px; white-space:nowrap;}
.task-list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.task-row{display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--surface); font-size:13px;}
.task-row:last-child{border-bottom:0;}
.task-row .tt{flex:1; min-width:0;}
.task-row .tt a{color:var(--ink-3); text-decoration:none; font-size:12px;}
.task-row .tt a:hover{color:var(--link);}
.task-row.done .tt b{text-decoration:line-through; color:var(--ink-3);}
.task-row b{font-weight:500;}

/* ── таблица клиентов ── */
.c-tools{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
.views{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.c-table-wrap{overflow:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); max-height:calc(100vh - 250px); min-height:240px;}
table.ct{width:100%; border-collapse:separate; border-spacing:0; font-size:13px; font-variant-numeric:tabular-nums;}
table.ct th, table.ct td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; white-space:nowrap;}
table.ct th{position:sticky; top:0; z-index:2; background:var(--surface-2); font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); cursor:pointer; user-select:none;}
table.ct th.sorted{color:var(--link);}
table.ct th .arr{font-size:10px; margin-left:3px;}
table.ct th.ck, table.ct td.ck{width:34px; padding-right:0; cursor:default; position:sticky; left:0; z-index:1; background:inherit;}
table.ct th.ck{z-index:3; background:var(--surface-2);}
table.ct td.ck{background:var(--surface);}
table.ct tbody tr{cursor:pointer;}
table.ct tbody tr:hover td{background:var(--surface-2);}
table.ct tbody tr.sel td{background:var(--link-soft);}
table.ct td.name{position:sticky; left:34px; z-index:1; background:var(--surface); max-width:240px;}
table.ct th.name{position:sticky; left:34px; z-index:3;}
table.ct td.name .nm{display:flex; align-items:center; gap:8px; font-weight:600;}
table.ct td.name .nm span{overflow:hidden; text-overflow:ellipsis;}
table.ct td.name small{display:block; font-weight:400; color:var(--ink-3); font-size:11.5px; margin-left:34px; overflow:hidden; text-overflow:ellipsis;}
table.ct td.r, table.ct th.r{text-align:right;}
table.ct td.wrap{white-space:normal; min-width:160px; max-width:260px;}
table.ct tfoot td{position:sticky; bottom:0; background:var(--surface-2); font-weight:600; border-top:1px solid var(--line-strong); border-bottom:0;}
.ck input{width:16px; height:16px; accent-color:var(--link); cursor:pointer;}
.bulk{position:sticky; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:30; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; margin-top:12px; border-radius:12px; background:var(--night); color:var(--night-ink); box-shadow:var(--shadow-pop);}
.bulk b{margin-right:6px;}
.bulk .btn{background:var(--night-2); border-color:var(--night-line); color:var(--night-ink);}
.bulk .btn:hover{border-color:var(--rose-brand);}
.more-rows{display:flex; justify-content:center; padding:12px;}
.colpick{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:4px 14px;}
.colpick h4{grid-column:1/-1; margin:10px 0 2px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}

/* условия: конструктор */
.rules{display:flex; flex-direction:column; gap:8px;}
.rule{display:grid; grid-template-columns:minmax(150px, 1.3fr) minmax(110px, .9fr) minmax(120px, 1.3fr) 32px; gap:6px; align-items:center;}
.rule .select, .rule .input{height:32px; font-size:13px;}
@media (max-width:640px){ .rule{grid-template-columns:1fr 1fr; } .rule .rv{grid-column:1/2;} }
.rules-foot{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.rule-txt{font-size:12.5px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center;}

'use strict';
/* ── 00-core.js ── */
/* Ядро: DOM, форматирование чисел и дат. Все модули собираются в одну
   область видимости (см. build.py), поэтому функции отсюда видны везде. */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const byKey = (arr, k) => Object.fromEntries(arr.map(x => [x[k], x]));

/* Слияние как у db.update(): вложенные объекты сливаются, остальное заменяется */
function deepMerge(base, patch) {
  const out = isObj(base) ? {...base} : {};
  for (const [k, v] of Object.entries(patch || {})) {
    out[k] = isObj(v) && isObj(out[k]) ? deepMerge(out[k], v) : clone(v);
  }
  return out;
}

/* Делегирование событий: on(root, 'click', '[data-x]', (e, el) => …) */
function on(root, type, sel, fn) {
  root.addEventListener(type, e => {
    const el = e.target.closest(sel);
    if (el && root.contains(el)) fn(e, el);
  });
}

/* ── числа ── */
const NB = ' ';
function fmt(n, d = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const v = Number(n);
  return v.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d}).replace(/\s/g, NB);
}
const rub = n => (n === null || n === undefined ? '—' : fmt(Math.round(n)) + NB + '₽');
/* компактно: 1,45 млн ₽ · 290 тыс ₽ · 900 ₽ */
function rubK(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + fmt(a / 1e6, a >= 1e7 ? 1 : 2).replace(/,?0+$/, '') + NB + 'млн' + NB + '₽';
  if (a >= 1e4) return s + fmt(Math.round(a / 1e3)) + NB + 'тыс' + NB + '₽';
  return s + fmt(Math.round(a)) + NB + '₽';
}
const signed = (n, f = rubK) => (n > 0 ? '+' : n < 0 ? '' : '') + f(n);
const pct = (x, d = 0) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : fmt(x * 100, d) + '%');
const parseNum = s => {
  const v = parseFloat(String(s ?? '').replace(/\s| /g, '').replace(',', '.'));
  return Number.isFinite(v) ? v : 0;
};
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/* ── даты: всё в местном времени, формат 'YYYY-MM-DD' и месяц 'YYYY-MM' ── */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
/* «сегодня» можно подменить для проверок: window.__EVA_TODAY = '2026-10-15' */
const today = () => (typeof window !== 'undefined' && window.__EVA_TODAY) || isoOf(new Date());
const addDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return isoOf(d); };
const monthOf = s => String(s).slice(0, 7);
const daysBetween = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
const daysInMonth = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); };
const monthStart = m => m + '-01';
const monthEnd = m => m + '-' + pad(daysInMonth(m));
function addMonths(m, n) {
  const [y, mm] = m.split('-').map(Number);
  const d = new Date(y, mm - 1 + n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthRange(from, to) {
  const out = [];
  for (let m = from; m <= to; m = addMonths(m, 1)) out.push(m);
  return out;
}
/* понедельник недели */
const weekStart = s => { const d = dateOf(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return isoOf(d); };
const weekday = s => (dateOf(s).getDay() + 6) % 7; // 0 = пн

const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_SH = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD_SH = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const monthIdx = m => Number(m.slice(5, 7)) - 1;
/* 'Октябрь' · с годом, если он не текущий квартальный: 'Январь 2027' */
function monthName(m, withYear = false) {
  const name = cap(MONTHS[monthIdx(m)]);
  return withYear || m.slice(0, 4) !== today().slice(0, 4) ? `${name} ${m.slice(0, 4)}` : name;
}
const monthShort = m => cap(MONTHS_SH[monthIdx(m)]) + (m.slice(0, 4) !== today().slice(0, 4) ? ' ' + m.slice(2, 4) : '');
/* '5 окт' · '5 октября' */
const dayShort = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}`; };
const dayLong = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_GEN[d.getMonth()]}`; };
const dayWd = s => `${WD_SH[weekday(s)]}, ${dayShort(s)}`;
/* подпись недели: '5–11 окт' или '28 сен – 4 окт' */
function weekLabel(start) {
  const end = addDays(start, 6), a = dateOf(start), b = dateOf(end);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()}${NB}${MONTHS_SH[b.getMonth()]}`
    : `${dayShort(start)} – ${dayShort(end)}`;
}
function timeAgo(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return 'только что';
  if (s < 3600) { const m = Math.round(s / 60); return `${m}${NB}мин назад`; }
  if (s < 86400) { const h = Math.round(s / 3600); return `${h}${NB}ч назад`; }
  const d = new Date(ts);
  return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ── хранилище браузера: только удобства одного зрителя ── */
const Local = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* приватное окно */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ничего */ } },
};
/* состояние вида (вкладка, фильтр) — помнится в этом браузере */
const View = {
  _s: null,
  get(k, def) { if (!this._s) this._s = Local.get('eva-crm-view', {}); return k in this._s ? this._s[k] : def; },
  set(k, v) { if (!this._s) this._s = Local.get('eva-crm-view', {}); this._s[k] = v; Local.set('eva-crm-view', this._s); },
};
/* ── CRM: время событий хранится меткой времени (мс) ── */
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isoTs = ts => isoOf(new Date(ts));
/* '25 сен, 14:05' · 'сегодня, 14:05' · 'вчера, 09:10' */
function when(ts) {
  if (!ts) return '—';
  const d = isoTs(ts), t = today();
  if (d === t) return `сегодня, ${hm(ts)}`;
  if (d === addDays(t, -1)) return `вчера, ${hm(ts)}`;
  if (d === addDays(t, 1)) return `завтра, ${hm(ts)}`;
  return `${dayShort(d)}${d.slice(0, 4) !== t.slice(0, 4) ? ' ' + d.slice(0, 4) : ''}, ${hm(ts)}`;
}
const dayOrWhen = s => (!s ? '—' : s === today() ? 'сегодня' : s === addDays(today(), 1) ? 'завтра' : s === addDays(today(), -1) ? 'вчера' : dayShort(s));
/* 3:07 · 1:02:15 */
function dur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function durLong(sec) {
  const m = Math.round((sec || 0) / 60);
  if (m < 60) return `${m}${NB}мин`;
  return `${Math.floor(m / 60)}${NB}ч ${m % 60 ? (m % 60) + NB + 'мин' : ''}`.trim();
}
const ageOf = birth => { if (!birth) return null; const b = dateOf(birth), n = dateOf(today()); let a = n.getFullYear() - b.getFullYear(); if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--; return a; };

/* ── телефоны: храним цифрами 79991234567, показываем +7 999 123-45-67 ── */
const phoneDigits = s => { let d = String(s || '').replace(/\D/g, ''); if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1); if (d.length === 10) d = '7' + d; return d; };
function phoneFmt(s) {
  const d = phoneDigits(s);
  if (d.length === 11 && d[0] === '7') return `+7${NB}${d.slice(1, 4)}${NB}${d.slice(4, 7)}-${d.slice(7, 9)}-${d.slice(9)}`;
  return d ? '+' + d : '';
}
const tgUser = s => String(s || '').trim().replace(/^https?:\/\/t\.me\//, '').replace(/^@/, '');

/* ── детерминированный генератор для демо-данных ── */
function rng(seed) {
  let s = seed >>> 0;
  const next = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const r = {
    next,
    int: (a, b) => a + Math.floor(next() * (b - a + 1)),
    pick: arr => arr[Math.floor(next() * arr.length)],
    chance: p => next() < p,
    some: (arr, n) => { const c = arr.slice(), out = []; while (c.length && out.length < n) out.push(c.splice(Math.floor(next() * c.length), 1)[0]); return out; },
    /* выбор с весами: [[значение, вес], …] */
    weighted: pairs => { const tot = sum(pairs, p => p[1]); let x = next() * tot; for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; } return pairs[pairs.length - 1][0]; },
  };
  return r;
}

/* ── CSV: запятая или точка с запятой, кавычки по правилам RFC 4180 ── */
function csvParse(text) {
  const src = String(text || '').replace(/^﻿/, '');
  const first = src.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') ? '\t' : ',');
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (q) {
      if (c === '"') { if (src[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && src[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
const csvCell = v => { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvOf = rows => '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');

/* копирование: только из обработчика клика; если нельзя — выделяем текст */
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.focus(); fallbackEl.select(); }
    return false;
  }
}

/* устойчивый хеш строки — для цветов аватаров и промокодов */
function hashStr(s) { let h = 0; for (const ch of String(s || '')) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }
/* промокод-приглашение из имени: «Алёна» → ALENA417 */
function refCodeFor(name) {
  const tr = {а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ы: 'y', э: 'e', ю: 'yu', я: 'ya'};
  const first = String(name).trim().split(/\s+/)[0].toLowerCase();
  const lat = [...first].map(ch => tr[ch] ?? (/[a-z0-9]/.test(ch) ? ch : '')).join('').slice(0, 10);
  return (lat || 'eva').toUpperCase() + (100 + (hashStr(name) % 900));
}

/* ── 02-store.js ── */
/* Хранилище. Один слой — два источника:
   • в артефакте Claude — общая база claude.use('db'): у каждой записи свой
     документ, правки расходятся по команде вживую (onSnapshot);
   • везде ещё (GitHub Pages, локальный сервер) — localStorage этого браузера.
   История клиента (касания, звонки, сообщения, оплаты, задачи) лежит внутри
   его документа картой ev: {id: событие}. db.update() сливает вложенные
   объекты, поэтому два менеджера, записавшие звонок и сообщение одной
   клиентке одновременно, не затирают друг друга. */

const Store = (() => {
  const COLS = ['team', 'clients', 'experts', 'partners', 'chats', 'campaigns', 'payouts', 'cfg'];
  const LS = 'eva-crm:';
  const data = Object.fromEntries(COLS.map(c => [c, new Map()]));
  const subs = new Set();
  const statusSubs = new Set();
  const queue = new Map();
  const state = {mode: 'local', ready: false, pending: 0, error: null, readOnly: false, quota: false};
  let db = null;

  /* не больше четырёх записей одновременно — база не любит залпы */
  let inFlight = 0;
  const waiters = [];
  const slot = () => (inFlight < 4 ? (inFlight++, Promise.resolve()) : new Promise(r => waiters.push(r)));
  const release = () => { const w = waiters.shift(); if (w) w(); else inFlight--; };

  const strip = o => { const {id, ...body} = o || {}; return body; };
  const emit = c => subs.forEach(fn => { try { fn(c); } catch (e) { console.error(e); } });
  const emitStatus = () => statusSubs.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });

  function loadLocal() {
    for (const c of COLS) {
      const o = Local.get(LS + c, null);
      if (o && typeof o === 'object') for (const [id, v] of Object.entries(o)) data[c].set(id, {...v, id});
    }
  }
  let saveT = {};
  function saveLocal(c) {
    clearTimeout(saveT[c]);
    saveT[c] = setTimeout(() => Local.set(LS + c, Object.fromEntries([...data[c]].map(([id, v]) => [id, strip(v)]))), 120);
  }

  async function init() {
    let api = null;
    try {
      api = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null;
    } catch (e) { api = null; }
    if (!api) { loadLocal(); state.mode = 'local'; state.ready = true; emitStatus(); return; }
    db = api;
    state.mode = 'db';
    /* ждём первый окончательный снимок каждой коллекции; через 9 с идём с тем, что есть */
    await new Promise(resolve => {
      let left = COLS.length, done = false;
      const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
      const timer = setTimeout(finish, 9000);
      COLS.forEach(c => {
        let settled = false;
        const settle = () => { if (!settled) { settled = true; if (--left === 0) finish(); } };
        try {
          db.collection(c).onSnapshot(snap => {
            const m = new Map();
            snap.docs.forEach(d => { const v = d.data(); if (v) m.set(d.id, {...clone(v), id: d.id}); });
            data[c] = m;
            if (!snap.metadata || !snap.metadata.fromCache) settle();
            if (state.ready) emit(c);
          }, err => {
            state.error = (err && err.code) || 'error';
            if (err && err.code === 'revoked') state.readOnly = true;
            settle();
            emitStatus();
          });
        } catch (e) { settle(); }
      });
    });
    state.ready = true;
    emitStatus();
  }

  /* одна запись на документ за раз: следующая ждёт предыдущую */
  function enqueue(path, op) {
    state.pending++;
    emitStatus();
    const prev = queue.get(path) || Promise.resolve();
    const run = async () => {
      await slot();
      try {
        try { await op(); }
        catch (e) {
          if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 700 + Math.random() * 900)); await op(); }
          else throw e;
        }
      } finally { release(); }
    };
    const p = prev.catch(() => {}).then(run).then(
      () => { state.error = null; },
      e => {
        state.error = (e && e.code) || 'error';
        if (e && e.code === 'invalid_argument') state.readOnly = true;
        if (e && e.code === 'quota_exceeded') state.quota = true;
        console.warn('Запись не прошла', path, e);
        if (typeof toast === 'function') toast(writeErrorText(e), {error: true});
      }
    ).finally(() => {
      state.pending--;
      if (queue.get(path) === p) queue.delete(path);
      emitStatus();
    });
    queue.set(path, p);
    return p;
  }
  function writeErrorText(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') return 'База заполнена (до 5 000 записей): удалите старые или демо-записи в «Настройках → Данные»';
    if (code === 'invalid_argument') return 'Не сохранилось: у вас доступ только на просмотр этой CRM';
    if (code === 'resource_exhausted') return 'Слишком много правок подряд — повторите через минуту';
    return 'Не сохранилось. Проверьте связь и повторите';
  }

  function commitLocal(c) { if (!db) saveLocal(c); emit(c); }

  function put(c, id, obj) {
    const body = strip(obj);
    data[c].set(id, {...clone(body), id});
    commitLocal(c);
    if (db) return enqueue(`${c}/${id}`, () => db.collection(c).doc(id).set(body));
    return Promise.resolve();
  }
  function add(c, obj, id = uid()) { put(c, id, obj); return id; }
  function patch(c, id, partial) {
    const cur = data[c].get(id);
    const next = deepMerge(cur ? strip(cur) : {}, partial);
    data[c].set(id, {...next, id});
    commitLocal(c);
    if (!db) return Promise.resolve();
    return enqueue(`${c}/${id}`, async () => {
      const ref = db.collection(c).doc(id);
      if (!cur) return ref.set(next);
      try { await ref.update(clone(partial)); }
      catch (e) {
        /* документа уже нет в базе (удалили с другого устройства) — записываем целиком */
        if (e && e.code === 'invalid_argument') await ref.set(strip(data[c].get(id) || next));
        else throw e;
      }
    });
  }
  /* удалить вложенное поле (например, событие из ev): в базе — полной
     перезаписью документа, потому что update() умеет только сливать */
  function unset(c, id, pathArr) {
    const cur = data[c].get(id);
    if (!cur) return Promise.resolve();
    const next = clone(strip(cur));
    let o = next;
    for (let i = 0; i < pathArr.length - 1; i++) { o = o && o[pathArr[i]]; }
    if (o) delete o[pathArr[pathArr.length - 1]];
    return put(c, id, next);
  }
  function remove(c, id) {
    data[c].delete(id);
    commitLocal(c);
    if (db) return enqueue(`${c}/${id}`, () => db.collection(c).doc(id).delete());
    return Promise.resolve();
  }

  return {
    COLS, state, init, put, add, patch, unset, remove,
    all: c => [...data[c].values()],
    get: (c, id) => data[c].get(id) || null,
    count: c => data[c].size,
    total: () => COLS.reduce((a, c) => a + data[c].size, 0),
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    onStatus(fn) { statusSubs.add(fn); return () => statusSubs.delete(fn); },
    flush: () => Promise.all([...queue.values()]),
    isDb: () => !!db,
  };
})();

/* ── 03-who.js ── */
/* Кто работает в CRM. В артефакте Claude человека узнаёт сама площадка
   (claude.use('user')): паролей нет, в команде хранится только его id,
   имя подтягивается из профиля при каждой отрисовке. Роль выдаёт
   руководитель в «Настройках → Команда»; владелец артефакта — руководитель.
   Вне артефакта (GitHub Pages, локально) вы один — руководитель, данные
   живут в этом браузере.
   Честно: роли разделяют интерфейс внутри команды. Граница доступа — сам
   артефакт: кому он открыт, тот может прочитать общую базу. */

const Who = {
  mode: 'local',
  uid: null,
  owner: false,
  canWrite: null,
  api: null,
  names: {},

  async init() {
    let u = null;
    try { u = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('user') : null; } catch (e) { u = null; }
    if (!u) { this.mode = 'local'; this.uid = 'local'; this.owner = true; return; }
    this.api = u;
    this.mode = 'platform';
    try { this.uid = await u.id(); } catch (e) { this.uid = null; }
    try { this.owner = !!(await u.isOwner()); } catch (e) { this.owner = false; }
    try { this.canWrite = await u.can('data.write'); } catch (e) { this.canWrite = null; }
  },

  /* своя строка в команде: в платформе — по id, локально — 'local' */
  self() { return this.uid ? Store.all('team').find(t => t.uid === this.uid && !t.archived) || null : null; },
  realRole() {
    const m = this.self();
    if (m) return roleOf(m.role);
    return this.owner ? 'owner' : 'viewer';
  },
  /* руководитель может посмотреть CRM глазами сотрудника */
  asId() { const a = View.get('as', null); return a && this.realRole() === 'owner' && Store.get('team', a) ? a : null; },
  member() { const a = this.asId(); return a ? Store.get('team', a) : this.self(); },
  id() { const m = this.member(); return m ? m.id : null; },
  role() {
    if (Store.state.readOnly || (this.mode === 'platform' && this.canWrite === false)) {
      const r = this.asId() ? roleOf(this.member().role) : this.realRole();
      return r === 'owner' || r === 'lead' ? r : 'viewer';
    }
    const a = this.asId();
    return a ? roleOf(Store.get('team', a).role) : this.realRole();
  },
  can(perm) { return (PERMS[perm] || []).includes(this.role()); },
  readOnly() { return Store.state.readOnly || (this.mode === 'platform' && this.canWrite === false); },

  /* первый вход: заводим строку в команде */
  ensure() {
    if (!this.uid || this.self()) return;
    if (this.readOnly()) return;
    const hasOwner = Store.all('team').some(t => t.uid && roleOf(t.role) === 'owner' && !t.archived);
    const role = this.owner || (this.mode === 'local' && !hasOwner) ? 'owner' : 'manager';
    Store.add('team', {uid: this.uid, name: this.mode === 'local' ? 'Вы' : '', role, title: role === 'owner' ? 'Руководитель' : 'Менеджер', joinedAt: Date.now(), order: role === 'owner' ? 0 : 20});
  },

  /* имена из профилей площадки: не храним, спрашиваем при отрисовке */
  _asked: new Set(),
  resolveNames() {
    if (!this.api || typeof this.api.profiles !== 'function') return;
    const ids = Store.all('team').map(t => t.uid).filter(x => x && x !== 'local' && !this._asked.has(x));
    if (!ids.length) return;
    ids.forEach(x => this._asked.add(x));
    Promise.resolve(this.api.profiles(ids)).then(ps => {
      let changed = false;
      for (const id of ids) { const n = ps && ps[id] && ps[id].name; if (n && this.names[id] !== n) { this.names[id] = n; changed = true; } }
      if (changed) App.renderSoon();
    }).catch(() => {});
  },
};

/* ── команда ── */
const Team = {
  all(withArchived = false) {
    return Store.all('team').filter(t => withArchived || !t.archived)
      .sort((a, b) => (a.order ?? 50) - (b.order ?? 50) || this.name(a).localeCompare(this.name(b), 'ru'));
  },
  get(id) { return id ? Store.get('team', id) : null; },
  name(t) {
    if (!t) return 'Не назначен';
    return t.name || (t.uid && Who.names[t.uid]) || (t.uid === Who.uid ? 'Вы' : 'Сотрудник');
  },
  first(t) { return this.name(t).split(' ')[0]; },
  /* кому можно поручить клиентку */
  assignable() { return this.all().filter(t => ['owner', 'lead', 'manager', 'curator'].includes(roleOf(t.role))); },
  av(t, cls = '') { return t ? avatar(this.name(t), cls, t.color || null) : avatar('', cls); },
};
const meName = () => Team.name(Who.member());

/* ── уведомления ── */
function toast(text, opts = {}) {
  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' err' : '');
  const span = document.createElement('span');
  span.textContent = text;
  el.appendChild(span);
  let timer;
  const close = () => { clearTimeout(timer); el.remove(); };
  if (opts.undo) {
    const b = document.createElement('button');
    b.textContent = 'Отменить';
    b.onclick = () => { close(); opts.undo(); };
    el.appendChild(b);
  }
  root.appendChild(el);
  timer = setTimeout(close, opts.undo ? 7000 : 4200);
  while (root.children.length > 3) root.firstChild.remove();
}

/* ── окно ── */
function openModal({title, body, foot = '', wide = false, focus = true, onMount, onClose}) {
  closePops();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Закрыть">${icon('x')}</button></div>
    <div class="modal-body">${body}</div>
    ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
  </div>`;
  $('#modalRoot').appendChild(back);
  const el = $('.modal', back);
  const key = e => { if (e.key === 'Escape' && !$('.pop')) close(); };
  function close() {
    if (!back.isConnected) return;
    back.remove();
    document.removeEventListener('keydown', key);
    if (onClose) onClose();
    App.renderSoon();
  }
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  on(back, 'click', '[data-close]', e => { e.preventDefault(); close(); });
  document.addEventListener('keydown', key);
  if (onMount) onMount(el, close);
  const first = $('input:not([type=checkbox]):not([disabled]), textarea, select', el);
  if (first && focus) setTimeout(() => { if (!el.contains(document.activeElement)) first.focus(); }, 30);
  return {el, close};
}
const modalOpen = () => !!$('#modalRoot .modal-back');

/* ── подтверждение «Да / Нет» рядом с кнопкой (confirm() в артефакте не работает) ── */
function closePops() { $$('.pop').forEach(p => (p._done ? p._done(false) : p.remove())); }
function confirmPop(anchor, {text, yes = 'Да', no = 'Нет', danger = false}) {
  return new Promise(resolve => {
    closePops();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.setAttribute('role', 'alertdialog');
    pop.innerHTML = `<p></p><div class="row"><button class="btn sm ${danger ? 'danger solid' : 'primary'}" data-yes></button><button class="btn sm" data-no></button></div>`;
    $('p', pop).textContent = text;
    $('[data-yes]', pop).textContent = yes;
    $('[data-no]', pop).textContent = no;
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = r.bottom + 6, left = r.left + r.width / 2 - w / 2;
    if (top + h > window.innerHeight - 8) top = r.top - h - 6;
    left = clamp(left, 8, window.innerWidth - w - 8);
    pop.style.top = (top + window.scrollY) + 'px';
    pop.style.left = (left + window.scrollX) + 'px';
    const done = v => {
      pop.remove();
      document.removeEventListener('mousedown', outside, true);
      document.removeEventListener('keydown', key, true);
      resolve(v);
    };
    pop._done = done;
    const outside = e => { if (!pop.contains(e.target)) done(false); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    document.addEventListener('keydown', key, true);
    $('[data-yes]', pop).onclick = () => done(true);
    $('[data-no]', pop).onclick = () => done(false);
    $('[data-yes]', pop).focus();
  });
}

/* ── выбор из списка рядом с кнопкой (исполнитель на карточке и т. п.) ── */
function pickPop(anchor, items, current) {
  return new Promise(resolve => {
    closePops();
    const pop = document.createElement('div');
    pop.className = 'pop pick';
    pop.setAttribute('role', 'listbox');
    items.forEach(([v, n]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick-i' + (String(v) === String(current) ? ' on' : '');
      b.textContent = n;
      b.onclick = () => done(v);
      pop.appendChild(b);
    });
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = r.bottom + 4, left = r.right - w;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
    left = clamp(left, 8, window.innerWidth - w - 8);
    pop.style.top = (top + window.scrollY) + 'px';
    pop.style.left = (left + window.scrollX) + 'px';
    function done(v) {
      pop.remove();
      document.removeEventListener('mousedown', outside, true);
      document.removeEventListener('keydown', key, true);
      resolve(v);
    }
    pop._done = () => done(null);
    const outside = e => { if (!pop.contains(e.target)) done(null); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    document.addEventListener('keydown', key, true);
    const on = $('.pick-i.on', pop) || $('.pick-i', pop);
    if (on) on.focus();
  });
}

/* полоса прогресса: доля и отметка «где должны быть» */
function progress(share, tone = '', mark = null) {
  const w = clamp(share || 0, 0, 1) * 100;
  return `<div class="bar"><i class="${tone}" style="width:${w.toFixed(1)}%"></i>${mark !== null ? `<b style="left:calc(${(clamp(mark, 0, 1) * 100).toFixed(1)}% - 1px)"></b>` : ''}</div>`;
}
const paceTone = (fact, plan) => (!plan ? '' : fact >= plan ? 'good' : fact >= plan * 0.8 ? 'warn' : 'bad');

/* ── графики ──
   Линии: факт — сплошная розовая с заливкой 10% и точкой на конце;
   планы — пунктир (это прогноз), подписаны у правого края.
   Столбики: не толще 24 px, скругление 4 px сверху. Подсказка по наведению. */
/* ровная шкала: шаг 1-2-2,5-5 × 10ⁿ, для штук — только целые */
function niceScale(v, integer = true, ticks = 4) {
  const raw = Math.max(v, integer ? 1 : 1e-9) / ticks;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  let step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  if (integer) step = Math.max(1, Math.ceil(step));
  const max = Math.max(step, Math.ceil(v / step) * step);
  return {max, step};
}
/* ширина графика в пикселях страницы — чтобы подписи были обычного размера */
const chartWidth = () => clamp((($('#page') || {}).clientWidth || 800) - 44, 300, 1200);
/* график в половинной карточке: на узком экране карточки встают в столбик */
const halfWidth = () => { const w = ($('#page') || {}).clientWidth || 800; return w < 1000 ? chartWidth() : clamp(Math.round(w / 2 - 60), 300, 640); };
function lineChart({labels, series, height = 240, yFmt = fmt}) {
  const W = chartWidth(), H = height, L = 44, R = W < 520 ? 84 : 118, T = 14, B = 26;
  const n = labels.length;
  const sc = niceScale(Math.max(1, ...series.flatMap(s => s.values.filter(v => v !== null))));
  const maxV = sc.max;
  const x = i => L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R));
  const y = v => T + (1 - v / maxV) * (H - T - B);
  let g = '';
  for (let v = 0; v <= maxV + 1e-9; v += sc.step) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 8));
  labels.forEach((lb, i) => { if (lb.tick) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(lb.tick)}</text>`; else if (!labels.some(l => l.tick) && i % step === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(lb.text)}</text>`; });
  let marks = '';
  const ends = [], endsAbove = [];
  series.forEach(s => {
    const pts = s.values.map((v, i) => (v === null ? null : [x(i), y(v)])).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    if (s.area) marks += `<path d="${d}L${pts[pts.length - 1][0].toFixed(1)} ${y(0)}L${pts[0][0].toFixed(1)} ${y(0)}Z" fill="${s.color}" opacity=".1"/>`;
    marks += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linecap="round" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 5"' : ''} opacity="${s.opacity || 1}"/>`;
    const last = pts[pts.length - 1];
    if (s.dot) marks += `<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    if (s.endLabel) (s.labelAbove ? endsAbove : ends).push({y: last[1], x: last[0], text: s.endLabel, above: !!s.labelAbove});
  });
  ends.sort((a, b) => a.y - b.y);
  ends.push(...endsAbove);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  ends.forEach(e => { marks += e.above ? `<text x="${e.x}" y="${e.y - 12}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${esc(e.text)}</text>` : `<text x="${e.x + 8}" y="${e.y + 4}" style="fill:var(--ink-2)">${esc(e.text)}</text>`; });
  const legend = series.filter(s => s.legend).map(s => `<span><i class="${s.dash ? 'dash' : ''}" style="background:${s.color};color:${s.color}"></i>${esc(s.legend)}</span>`).join('');
  const data = esc(JSON.stringify({labels: labels.map(l => l.text), series: series.map(s => ({name: s.legend || s.endLabel || '', color: s.color, dash: !!s.dash, values: s.values}))}));
  return `<div class="chart-box" data-chart="line" data-cfg="${data}" data-geo="${[W, H, L, R, T, B].join(',')}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}<line class="cross" x1="0" x2="0" y1="${T}" y2="${y(0)}" hidden/></svg>
    <div class="chart-tip" hidden></div>
  </div>${legend ? `<div class="legend">${legend}</div>` : ''}`;
}
function barChart({labels, values, plan = null, height = 200, color = 'var(--rose)', yFmt = fmt, highlight = -1, half = false}) {
  const W = half ? halfWidth() : chartWidth(), H = height, L = 40, R = 12, T = 12, B = 26;
  const n = labels.length;
  const sc = niceScale(Math.max(1, ...values.map(v => v || 0), ...(plan || []).map(v => v || 0)));
  const maxV = sc.max;
  const band = (W - L - R) / Math.max(1, n);
  const bw = Math.min(24, Math.max(3, band - 2));
  const y = v => T + (1 - v / maxV) * (H - T - B);
  let g = '';
  for (let v = 0; v <= maxV + 1e-9; v += sc.step) {
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / (W < 520 ? 7 : 12)));
  let marks = '';
  values.forEach((v, i) => {
    const cx = L + band * i + band / 2;
    if (i % step === 0 || i === n - 1) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(labels[i].tick ?? labels[i].text)}</text>`;
    const val = v || 0;
    const h = Math.max(0, y(0) - y(val));
    const r = Math.min(4, h / 2, bw / 2);
    const x0 = cx - bw / 2, top = y(0) - h;
    const d = h > 0 ? `M${x0} ${y(0)}V${top + r}Q${x0} ${top} ${x0 + r} ${top}H${x0 + bw - r}Q${x0 + bw} ${top} ${x0 + bw} ${top + r}V${y(0)}Z` : '';
    const tip = `${labels[i].text}|${yFmt(val)}${plan ? '|' + yFmt(plan[i] || 0) : ''}`;
    marks += `<g class="bar-hit" data-tip="${esc(tip)}" tabindex="0"><rect x="${cx - band / 2}" y="${T}" width="${band}" height="${y(0) - T}" fill="transparent"/>${d ? `<path d="${d}" fill="${color}" opacity="${i === highlight || highlight < 0 ? 1 : .55}"/>` : ''}</g>`;
  });
  if (plan) {
    const pts = plan.map((v, i) => `${i ? 'L' : 'M'}${(L + band * i + band / 2).toFixed(1)} ${y(v || 0).toFixed(1)}`).join('');
    marks += `<path d="${pts}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4" pointer-events="none"/>`;
  }
  return `<div class="chart-box" data-chart="bar"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}</svg><div class="chart-tip" hidden></div></div>
    ${plan ? `<div class="legend"><span><i style="background:${color}"></i>Факт</span><span><i class="dash" style="color:var(--ink-2)"></i>План</span></div>` : ''}`;
}
/* подсказки графиков: одна подписка на весь документ */
function wireCharts() {
  const tipAt = (box, html, px, py) => {
    const tip = $('.chart-tip', box);
    tip.innerHTML = html;
    tip.hidden = false;
    const bw = box.clientWidth, tw = tip.offsetWidth;
    tip.style.left = clamp(px + 12, 0, bw - tw) + 'px';
    tip.style.top = Math.max(0, py - tip.offsetHeight - 8) + 'px';
  };
  document.addEventListener('pointermove', e => {
    const box = e.target.closest && e.target.closest('.chart-box');
    $$('.chart-box').forEach(b => { if (b !== box) { const t = $('.chart-tip', b); if (t) t.hidden = true; const c = $('.cross', b); if (c) c.setAttribute('hidden', ''); } });
    if (!box) return;
    const rect = box.getBoundingClientRect();
    if (box.dataset.chart === 'line') {
      const cfg = JSON.parse(box.dataset.cfg);
      const [W, H, L, R, T, B] = box.dataset.geo.split(',').map(Number);
      const sx = (e.clientX - rect.left) * (W / rect.width);
      const n = cfg.labels.length;
      const i = clamp(Math.round(((sx - L) / (W - L - R)) * (n - 1)), 0, n - 1);
      const cx = L + (n <= 1 ? 0 : (i / (n - 1)) * (W - L - R));
      const cross = $('.cross', box);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.removeAttribute('hidden');
      const rows = cfg.series.filter(s => s.values[i] !== null && s.values[i] !== undefined)
        .map(s => `<div class="tip-row"><i class="${s.dash ? 'dash' : ''}" style="background:${s.color};color:${s.color}"></i><b>${fmt(s.values[i])}</b><span>${esc(s.name)}</span></div>`).join('');
      tipAt(box, `<div class="tip-h">${esc(cfg.labels[i])}</div>${rows}`, (cx / W) * rect.width, e.clientY - rect.top);
    } else {
      const hit = e.target.closest('.bar-hit');
      if (!hit) { $('.chart-tip', box).hidden = true; return; }
      const [label, val, plan] = hit.dataset.tip.split('|');
      if (box.dataset.chart === 'stack') {
        tipAt(box, `<div class="tip-h">${esc(label)}</div><div class="tip-row"><b>${esc(val)}</b><span>всего</span></div>${(plan || '').split(' · ').filter(Boolean).map(x => `<div class="tip-row"><span>${esc(x)}</span></div>`).join('')}`, e.clientX - rect.left, e.clientY - rect.top);
        return;
      }
      tipAt(box, `<div class="tip-h">${esc(label)}</div><div class="tip-row"><b>${esc(val)}</b><span>факт</span></div>${plan !== undefined ? `<div class="tip-row"><b>${esc(plan)}</b><span>план</span></div>` : ''}`, e.clientX - rect.left, e.clientY - rect.top);
    }
  });
}

/* столбики с накоплением: деньги по месяцам и типам */
function stackChart({labels, series, height = 220, yFmt = rubK, half = false}) {
  const W = half ? halfWidth() : chartWidth(), H = height, L = 56, R = 12, T = 12, B = 26;
  const n = labels.length;
  const totals = labels.map((_, i) => sum(series, s => Math.max(0, s.values[i] || 0)));
  const sc = niceScale(Math.max(1, ...totals), false);
  const band = (W - L - R) / Math.max(1, n), bw = Math.min(34, Math.max(6, band - 10));
  const y = v => T + (1 - v / sc.max) * (H - T - B);
  let g = '';
  for (let v = 0; v <= sc.max + 1e-9; v += sc.step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(yFmt(v))}</text>`;
  let marks = '';
  labels.forEach((lb, i) => {
    const cx = L + band * i + band / 2;
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(lb)}</text>`;
    let acc = 0;
    const parts = [];
    series.forEach(s => {
      const v = Math.max(0, s.values[i] || 0);
      if (!v) return;
      const y0 = y(acc), y1 = y(acc + v);
      marks += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1 - (acc ? 1 : 0))}" fill="${s.color}" rx="2"/>`;
      parts.push(`${s.name}: ${yFmt(v)}`);
      acc += v;
    });
    marks += `<g class="bar-hit" data-tip="${esc(`${lb}|${yFmt(totals[i])}|${parts.join(' · ')}`)}" tabindex="0"><rect x="${cx - band / 2}" y="${T}" width="${band}" height="${y(0) - T}" fill="transparent"/></g>`;
  });
  return `<div class="chart-box" data-chart="stack"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}</svg><div class="chart-tip" hidden></div></div>
    <div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
