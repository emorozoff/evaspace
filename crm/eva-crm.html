/* Оболочка и маршруты. Адрес страницы — простое слово после #:
   #home, #clients, #funnels, #inbox … и карточки #client-<id>,
   #expert-<id>, #partner-<id>. Данные приходят вживую — страница
   перерисовывается сама, но не тогда, когда человек печатает в поле. */

const App = {
  pages: {},
  shell: false,
  cur: null,
  _t: null,
  _pending: false,
  _pointer: false,

  register(id, page) { this.pages[id] = page; },

  start() {
    Store.subscribe(c => { if (c === 'team') { Who.ensure(); Who.resolveNames(); } this.renderSoon(); });
    Store.onStatus(s => this.paintSync(s));
    window.addEventListener('hashchange', () => this.render());
    document.addEventListener('pointerdown', () => { this._pointer = true; }, true);
    document.addEventListener('pointerup', () => { this._pointer = false; if (this._pending) this.renderSoon(); }, true);
    document.addEventListener('focusout', () => { if (this._pending) this.renderSoon(250); });
    wireCharts();
    Who.ensure();
    Who.resolveNames();
    this.render();
  },

  parse() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    const m = h.match(/^(client|expert|partner)-(.+)$/);
    if (m) return {id: m[1], param: m[2]};
    return {id: h || 'home', param: null};
  },
  go(hash) { if (location.hash === '#' + hash) this.render(); else location.hash = hash; },

  typing() {
    const a = document.activeElement, page = $('#page');
    return !!(page && a && page.contains(a) && a.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select'));
  },
  renderSoon(delay = 60) {
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      if (this.typing() || this._pointer || Drag.active) { this._pending = true; return; }
      this._pending = false;
      this.render();
    }, delay);
  },

  render(opts = {}) {
    let {id, param} = this.parse();
    const nav = NAV.find(n => n.id === id);
    if (!this.pages[id] || (nav && nav.perm && !Who.can(nav.perm))) { id = 'home'; param = null; }
    if (!this.shell) this.buildShell();
    this.paintNav(id);
    const prev = $('#page');
    const page = prev.cloneNode(false);
    prev.replaceWith(page);
    const key = id + ':' + (param || '');
    const y = window.scrollY;
    page.dataset.page = id;
    try { this.pages[id].render(page, param); }
    catch (e) { console.error(e); page.innerHTML = `<div class="empty"><b>Страница не открылась</b>${esc(e.message || e)}</div>`; }
    if (this.cur === key) window.scrollTo(0, y); else window.scrollTo(0, 0);
    this.cur = key;
    if (opts.focus) { const el = document.getElementById(opts.focus); if (el) { el.focus(); if (el.setSelectionRange && typeof el.value === 'string') el.setSelectionRange(el.value.length, el.value.length); } }
    const t = typeof this.pages[id].title === 'function' ? this.pages[id].title(param) : this.pages[id].title;
    document.title = (id === 'home' ? '' : (t || '') + ' · ') + 'Eva CRM';
  },

  buildShell() {
    $('#app').innerHTML = `<div class="shell">
      <aside class="side">
        <a class="brand" href="#home">${brandIcon('brand-mark')}<div><b>Eva CRM</b><span>работа с клиентами</span></div></a>
        <nav class="nav" id="nav" aria-label="Разделы"></nav>
        <div class="side-foot">
          <div class="sync" id="sync"><i></i><span></span></div>
          <div class="me-chip" id="meChip"></div>
        </div>
      </aside>
      <main class="main"><div id="asBar"></div><div class="page" id="page"></div></main>
    </div>`;
    on($('#app'), 'click', '[data-as-exit]', () => { View.set('as', null); App.render(); });
    this.shell = true;
    this.paintSync(Store.state);
  },

  paintNav(active) {
    const items = NAV.filter(n => !n.perm || Who.can(n.perm));
    const cardOf = {client: 'clients', expert: 'experts', partner: 'partners'};
    const act = cardOf[active] || active;
    const badges = {inbox: Inbox.unreadTotal(), home: Tasks.mineOverdue()};
    $('#nav').innerHTML = items.map(n => {
      const b = badges[n.id] || 0;
      return `<a href="#${n.id}" class="${n.id === act ? 'on' : ''}">${icon(n.icon)}<span>${n.name}</span>${b ? `<span class="badge" title="${n.id === 'inbox' ? 'Непрочитанные' : 'Просроченные задачи'}">${b}</span>` : ''}</a>`;
    }).join('');
    const m = Who.member();
    const role = Who.role();
    $('#meChip').innerHTML = `${m ? Team.av(m) : avatar(Who.mode === 'local' ? 'Вы' : 'Гость')}<div class="who"><b>${esc(m ? Team.name(m) : 'Гость')}</b><span>${esc(ROLES[role] ? ROLES[role].name : 'Наблюдатель')}</span></div>`;
    const as = Who.asId();
    $('#asBar').innerHTML = as ? `<div class="as-bar">${icon('eye')}<span>Вы смотрите CRM как <b>${esc(Team.name(Store.get('team', as)))}</b> · ${esc(ROLES[Who.role()].name)}</span><button class="btn xs" data-as-exit>Вернуться к себе</button></div>` : '';
  },

  paintSync(s) {
    const el = $('#sync');
    if (!el) return;
    let cls = '', text = 'Общая база · сохранено';
    if (s.mode === 'local') { cls = 'local'; text = 'Только этот браузер'; }
    else if (s.pending) { cls = 'busy'; text = 'Сохраняю…'; }
    else if (Who.readOnly()) { cls = 'err'; text = 'Только просмотр'; }
    else if (s.error) { cls = 'err'; text = 'Не сохранилось'; }
    el.className = 'sync ' + cls;
    $('span', el).textContent = text;
    el.title = s.mode === 'local'
      ? 'CRM открыта не в артефакте Claude: данные живут только в этом браузере'
      : 'Все правки сразу видны команде';
  },
};

/* ── сегменты: условия по полям ── */
function fieldVal(c, k) {
  if (k.startsWith('q_')) return (c.quiz || {})[k.slice(2)];
  if (k === 'invited') return Referral.invitees(c.id).length;
  if (k === 'refEarned') return Referral.of(c).accrued;
  if (k === 'level') return levelOf(c.points).id;
  if (k === 'segment') { const sg = cx(c).segment; return sg ? sg.id : null; }
  const f = FIELD[k];
  if (f && f.calc) return cx(c)[k];
  return c[k];
}
const isEmpty = v => v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length);
function toDay(v) { if (!v) return null; return typeof v === 'number' ? isoTs(v) : String(v).slice(0, 10); }
function testRule(r, c) {
  const v = fieldVal(c, r.f);
  const arr = Array.isArray(v) ? v : isEmpty(v) ? [] : [v];
  const low = x => String(x ?? '').toLowerCase();
  switch (r.op) {
    case 'eq':    return arr.some(x => low(x) === low(r.v));
    case 'ne':    return !arr.some(x => low(x) === low(r.v));
    case 'in':    { const set = (Array.isArray(r.v) ? r.v : String(r.v).split(',')).map(x => low(String(x).trim())); return arr.some(x => set.includes(low(x))); }
    case 'has':   return arr.some(x => low(x).includes(low(r.v)) || low(x) === low(r.v));
    case 'nhas':  return !arr.some(x => low(x).includes(low(r.v)) || low(x) === low(r.v));
    case 'gte':   return Number(v) >= Number(r.v);
    case 'lte':   return !isEmpty(v) && Number(v) <= Number(r.v);
    case 'set':   return !isEmpty(v);
    case 'unset': return isEmpty(v);
    case 'within':{ const d = toDay(v); return !!d && d >= addDays(today(), -Number(r.v || 0)); }
    case 'older': { const d = toDay(v); return !!d && d < addDays(today(), -Number(r.v || 0)); }
    default: return false;
  }
}
function testRules(rules, match, c) {
  const list = (rules || []).filter(r => r && r.f && r.op);
  if (!list.length) return true;
  return match === 'any' ? list.some(r => testRule(r, c)) : list.every(r => testRule(r, c));
}
function ruleText(r) {
  const f = FIELD[r.f];
  const name = f ? f.n : r.f;
  const op = OPS[r.op] ? OPS[r.op].name : r.op;
  if (OPS[r.op] && OPS[r.op].noValue) return `${name} — ${op}`;
  return `${name} ${op} «${valueLabel(r.f, r.v)}»`;
}
function valueLabel(k, v) {
  const f = FIELD[k];
  const one = x => {
    if (!f) return x;
    if (f.type === 'quiz') return quizText(f.q, x);
    if (f.type === 'tags') return (Tags.get(x) || {}).name || x;
    if (f.type === 'stage') return (Funnels.stage('sales', x) || {}).name || x;
    if (f.type === 'person') return Team.name(Team.get(x));
    if (f.label) return f.label(x);
    return x;
  };
  return (Array.isArray(v) ? v : [v]).map(one).join(', ');
}
const Segments = {
  all() { return Cfg.items('segments'); },
  get(id) { const s = (Cfg.list('segments') || {})[id]; return s ? {...s, id} : null; },
  test(seg, c) { return !!(seg.rules && seg.rules.length) && testRules(seg.rules, seg.match, c); },
  /* первый подходящий по порядку; ручной выбор в карточке важнее условий */
  of(c) {
    if (c.segId === 'none') return null;
    if (c.segId) return this.get(c.segId);
    return this.all().find(s => this.test(s, c)) || null;
  },
  members(seg) { return Store.all('clients').filter(c => { const s = cx(c).segment; return s && s.id === seg.id; }); },
};

/* ── производные поля клиентки (кэш на каждую версию данных) ── */
const TOUCH_KINDS = ['msg', 'call', 'camp', 'meet', 'group'];
const REVENUE_TYPES = ['sub', 'year', 'course', 'consult', 'event', 'club', 'market', 'topup'];
const DC = new WeakMap();
function cx(c) {
  let e = DC.get(c);
  if (!e || e.v !== MV) {
    e = {v: MV, d: derive(c)};
    DC.set(c, e);
    /* сегмент — после кэша: условия читают LTV и подписку этой же клиентки */
    e.d.segment = Segments.of(c);
  }
  return e.d;
}
/* деньги, которые клиентка реально принесла: оплаты не с баланса, минус возвраты */
const cashOf = p => (p.status !== 'ok' ? 0 : p.type === 'refund' ? -Math.abs(p.amount || 0) : p.method === 'balance' ? 0 : (p.amount || 0));
function derive(c) {
  const evs = Ev.list(c);
  const pays = evs.filter(e => e.kind === 'pay');
  const ok = pays.filter(p => p.status === 'ok');
  let subUntil = null;
  ok.filter(p => PAY_TYPES[p.type] && PAY_TYPES[p.type].sub).forEach(p => {
    const d = isoTs(p.t);
    const start = subUntil && subUntil > d ? subUntil : d;
    subUntil = addDays(start, PAY_TYPES[p.type].sub);
  });
  const t = today();
  let sub = 'none';
  if (subUntil && subUntil >= t) sub = subUntil <= addDays(t, 7) ? 'expiring' : 'active';
  else if (c.trialUntil && c.trialUntil >= t) sub = 'trial';
  else if (subUntil) sub = 'expired';
  const touchEvs = evs.filter(e => TOUCH_KINDS.includes(e.kind));
  const groupMsgs = Chats.byClient(c.id);
  const lastTouchTs = Math.max(0, ...touchEvs.map(e => e.t), ...groupMsgs.map(m => m.t));
  const msgs = evs.filter(e => e.kind === 'msg');
  const lastIn = msgs.filter(m => m.dir === 'in').pop() || null;
  const lastOut = evs.filter(e => (e.kind === 'msg' && e.dir === 'out') || (e.kind === 'call' && e.result === 'ok')).pop() || null;
  const tasks = evs.filter(e => e.kind === 'task' && !e.done).sort((a, b) => String(a.due || '9').localeCompare(String(b.due || '9')));
  const firstPay = ok.find(p => p.type !== 'refund' && p.method !== 'balance');
  const pending = pays.filter(p => p.status === 'pending');
  const d = {
    evs, pays, ok, pending, msgs, tasks, groupMsgs,
    ltv: sum(ok, cashOf),
    pays_n: ok.filter(p => p.type !== 'refund').length,
    firstPay: firstPay ? firstPay.t : null,
    subUntil, sub,
    lastTouchTs: lastTouchTs || null,
    lastTouch: lastTouchTs ? isoTs(lastTouchTs) : null,
    touches: touchEvs.length + groupMsgs.length,
    lastIn, lastOut,
    lastMsg: msgs[msgs.length - 1] || null,
    unread: msgs.filter(m => m.dir === 'in' && m.t > (c.readAt || 0)).length,
    waiting: !!(lastIn && (!lastOut || lastOut.t < lastIn.t)),
    nextAt: tasks.length ? tasks[0].due || null : null,
    overdue: tasks.filter(x => x.due && x.due < t).length,
    level: levelOf(c.points),
    stageDays: c.stageAt ? daysBetween(isoTs(c.stageAt), t) : null,
  };
  d.pays = d.pays_n;
  d.payList = pays;
  d.segment = null;
  return d;
}
/* до какого дня оплачена подписка по оплатам не позже даты end */
function subUntilAt(c, end) {
  let until = null;
  cx(c).ok.filter(p => PAY_TYPES[p.type] && PAY_TYPES[p.type].sub && isoTs(p.t) <= end).forEach(p => {
    const d = isoTs(p.t);
    until = addDays(until && until > d ? until : d, PAY_TYPES[p.type].sub);
  });
  return until;
}

function moveStage(col, id, to, {reason = '', auto = false} = {}) {
  const e = Store.get(col, id);
  if (!e || e.stage === to) return;
  const now = Date.now();
  const p = {stage: to, stageAt: now, ev: {[uid()]: {kind: 'stage', t: now, by: auto ? null : Who.id(), funnel: Funnels.of(col, e), from: e.stage || null, to, auto, text: reason}}};
  if (to === 'lost') p.lostReason = reason || e.lostReason || 'Другое';
  Store.patch(col, id, p);
}

    if (!c) return null;
    const eid = Ev.add('clients', clientId, {kind: 'pay', status: 'ok', method: 'card', ...p});
    this.auto(c, p);
    return eid;
  },

    const c = Store.get('clients', clientId);

    if (p.status === 'ok' && p.type !== 'refund' && won && c.stage !== won) moveStage('clients', c.id, won, {auto: true, reason: 'пришла оплата'});
    else if (p.status === 'pending' && Funnels.idx('sales', c.stage) < Funnels.idx('sales', 'invoice') && Funnels.idx('sales', 'invoice') >= 0) moveStage('clients', c.id, 'invoice', {auto: true, reason: 'выставлен счёт'});
  },
};

/* ── рефералы: одна ступень, только с фактических оплат ── */
const Referral = {
  idx: memo(() => {
    const m = {};
    Store.all('clients').forEach(c => { if (c.referrerId) (m[c.referrerId] = m[c.referrerId] || []).push(c); });
    return m;
  }),
  invitees(id) { return this.idx()[id] || []; },
  program(r) { return REF_PROGRAMS[r.refProgram] ? r.refProgram : 'friend'; },
  rate(r, pay) {
    const s = settings();
    if (typeof r.refRate === 'number') return r.refRate;
    const prog = this.program(r);
    if (prog === 'key') {
      const since = r.ambSince || r.created || today();
      return isoTs(pay.t) <= addDays(since, 365) ? s.ambKeyRate : s.ambRate;
    }
    if (prog === 'amb') return s.ambRate;
    return s.refRates[levelOf(r.points).id] ?? 0.1;
  },
  /* начисления по месяцам: [{month, amount, inv, t, type, base}] */
  accruals(r) {
    const s = settings(), prog = this.program(r), out = [], cur = monthOf(today());
    for (const inv of this.invitees(r.id)) {
      if (inv.id === r.id) continue;           // самоприглашение не считается
      const until = addDays(inv.created || today(), 30 * s.refMonths);
      for (const p of cx(inv).ok) {
        if (p.method === 'balance' || p.type === 'topup') continue;
        const d = isoTs(p.t);
        if (prog === 'friend' && d > until) continue;
        const isSub = PAY_TYPES[p.type] && PAY_TYPES[p.type].sub;
        if (prog !== 'friend' && !isSub && p.type !== 'refund') continue;
        const rate = this.rate(r, p);
        const sign = p.type === 'refund' ? -1 : 1;
        const base = Math.abs(p.amount || 0) * (prog === 'friend' ? 1 : s.netFactor) * sign;
        if (prog !== 'friend' && p.type === 'year') {
          for (let i = 0; i < 12; i++) {
            const m = addMonths(monthOf(d), i);
            if (m > cur) break;
            out.push({month: m, amount: Math.round(base / 12 * rate), base: base / 12, rate, inv: inv.id, t: p.t, type: p.type, part: `${i + 1}/12`});
          }
        } else out.push({month: monthOf(d), amount: Math.round(base * rate), base, rate, inv: inv.id, t: p.t, type: p.type});
      }
    }
    return out;
  },
  settled(r, beforeMonth = '9999-99') {
    let s = 0;
    for (const reg of Store.all('payouts')) {
      if (reg.id >= beforeMonth) continue;
      const row = (reg.rows || {})[r.id];
      if (row && (row.status === 'paid' || row.status === 'balance')) s += row.amount || 0;
    }
    return s;
  },
  of(r) {
    const acc = this.accruals(r);
    const inv = this.invitees(r.id);
    const accrued = sum(acc, a => a.amount);
    const settled = this.settled(r);
    const paying = inv.filter(i => cx(i).ltv > 0).length;
    const revenue = sum(inv, i => cx(i).ltv);
    return {acc, inv, accrued, settled, available: accrued - settled, paying, revenue};
  },
  list: memo(() => Store.all('clients').filter(c => c.refProgram || Referral.invitees(c.id).length)),
  stageOf(r) {
    const st = this.of(r);
    if (st.settled > 0) return 'paid';
    if (st.accrued > 0) return 'accrued';
    if (st.paying) return 'converted';
    if (st.inv.length) return 'invited';
    return 'link';
  },
  min(r) { const s = settings(); return this.program(r) === 'friend' ? s.refMin : s.ambMin; },
  /* реестр месяца: что причитается к выплате 10 числа следующего месяца */
  registry(month) {
    const saved = Store.get('payouts', month) || {rows: {}};
    const rows = [];
    for (const r of this.list()) {
      const acc = this.accruals(r);
      const upTo = sum(acc.filter(a => a.month <= month), a => a.amount);
      const inMonth = sum(acc.filter(a => a.month === month), a => a.amount);
      const before = this.settled(r, month);
      const due = upTo - before;
      const row = (saved.rows || {})[r.id] || null;
      if (due <= 0 && !row) continue;
      const mode = (row && row.mode) || r.refMode || 'balance';
      const min = this.min(r);
      let status = row ? row.status : (mode === 'card' && due < min ? 'carry' : 'due');
      const needTax = mode === 'card' && this.program(r) !== 'friend' && !['npd', 'ip'].includes(r.taxStatus);
      rows.push({r, inMonth, due: row && row.amount ? row.amount : due, mode, status, min, needTax, row});
    }
    return rows.sort((a, b) => b.due - a.due);
  },
};

/* ── 07-drag.js ── */
/* Перетаскивание карточек между колонками — мышью и пальцем.
   Мышь: зажали и повели (от 5 px). Палец: подержали ~0,3 с и повели —
   так обычная прокрутка страницы не превращается в перетаскивание.
   Во время переноса карточка едет за указателем, на месте вставки — пустая
   рамка; у краёв окна и доски страница прокручивается сама. */

const Drag = {
  active: null,
  justDropped: 0,
  wired: false,

  /* root — контейнер доски; cols — селектор колонки (data-col="ключ");
     каждая колонка содержит список .kb-list с карточками [data-task] */
  board(root, {canDrag, onDrop}) {
    root.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      const card = e.target.closest('[data-task]');
      if (!card || !root.contains(card) || e.target.closest('button, a, input, select, textarea, [data-nodrag]')) return;
      if (canDrag && !canDrag(card.dataset.task)) return;
      Drag.arm(e, card, root, onDrop);
    });
    if (!Drag.wired) {
      Drag.wired = true;
      document.addEventListener('pointermove', e => Drag.move(e), {passive: false});
      document.addEventListener('pointerup', e => Drag.end(e, true));
      document.addEventListener('pointercancel', e => Drag.end(e, false));
      document.addEventListener('touchmove', e => { if (Drag.active && Drag.active.on) e.preventDefault(); }, {passive: false});
      /* клик, который браузер шлёт сразу после отпускания карточки, не должен открывать её */
      document.addEventListener('click', e => { if (Date.now() - Drag.justDropped < 350 && e.target.closest && e.target.closest('[data-task]')) { e.stopPropagation(); e.preventDefault(); } }, true);
    }
  },

  arm(e, card, root, onDrop) {
    const touch = e.pointerType !== 'mouse';
    const st = {card, root, onDrop, on: false, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId, touch, timer: null};
    if (touch) st.timer = setTimeout(() => { if (Drag.active === st) Drag.start(st); }, 280);
    Drag.active = st;
  },

  start(st) {
    const r = st.card.getBoundingClientRect();
    st.on = true;
    st.dx = st.x0 - r.left;
    st.dy = st.y0 - r.top;
    const ghost = st.card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px';
    document.body.appendChild(ghost);
    st.ghost = ghost;
    const ph = document.createElement('div');
    ph.className = 'drag-ph';
    ph.style.height = r.height + 'px';
    st.card.after(ph);
    st.card.classList.add('drag-src');
    st.ph = ph;
    document.body.classList.add('dragging-now');
    if (navigator.vibrate && st.touch) { try { navigator.vibrate(12); } catch (err) { /* ничего */ } }
    Drag.place(st);
  },

  move(e) {
    const st = Drag.active;
    if (!st || e.pointerId !== st.id) return;
    st.x = e.clientX; st.y = e.clientY;
    if (!st.on) {
      const d = Math.hypot(st.x - st.x0, st.y - st.y0);
      if (st.touch) { if (d > 10) { clearTimeout(st.timer); Drag.active = null; } return; }
      if (d < 5) return;
      Drag.start(st);
    }
    e.preventDefault();
    Drag.place(st);
    Drag.autoscroll(st);
  },

  place(st) {
    st.ghost.style.transform = `translate(${st.x - st.dx}px, ${st.y - st.dy}px) rotate(1.5deg)`;
    st.ghost.style.visibility = 'hidden';
    const under = document.elementFromPoint(st.x, st.y);
    st.ghost.style.visibility = '';
    const col = under && under.closest('[data-col]');
    $$('.kb-col.drop-on', st.root).forEach(c => c !== col && c.classList.remove('drop-on'));
    if (!col || !st.root.contains(col)) return;
    col.classList.add('drop-on');
    const list = $('.kb-list', col);
    const cards = $$('[data-task]', list).filter(c => c !== st.card);
    let before = null;
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      if (st.y < r.top + r.height / 2) { before = c; break; }
    }
    if (before) list.insertBefore(st.ph, before);
    else {
      const add = $('.kb-add, .kb-composer', list);
      if (add) list.insertBefore(st.ph, add); else list.appendChild(st.ph);
    }
    st.col = col;
  },

  autoscroll(st) {
    const edge = 56, speed = 14;
    if (st.y < edge) window.scrollBy(0, -speed);
    else if (st.y > window.innerHeight - edge) window.scrollBy(0, speed);
    const board = st.root.querySelector('.kb') || st.root;
    const r = board.getBoundingClientRect();
    if (board.scrollWidth > board.clientWidth) {
      if (st.x < r.left + edge) board.scrollLeft -= speed;
      else if (st.x > r.right - edge) board.scrollLeft += speed;
    }
  },

  end(e, drop) {
    const st = Drag.active;
    if (!st || (e && e.pointerId !== st.id)) return;
    clearTimeout(st.timer);
    Drag.active = null;
    if (!st.on) return;
    Drag.justDropped = Date.now();
    const col = st.col;
    let beforeId = null, afterId = null;
    if (col && drop) {
      const seq = $$('[data-task], .drag-ph', $('.kb-list', col)).filter(x => x !== st.card);
      const i = seq.indexOf(st.ph);
      const prev = seq[i - 1], next = seq[i + 1];
      afterId = prev && prev.dataset.task ? prev.dataset.task : null;
      beforeId = next && next.dataset.task ? next.dataset.task : null;
    }
    st.ghost.remove();
    st.ph.remove();
    st.card.classList.remove('drag-src');
    document.body.classList.remove('dragging-now');
    $$('.drop-on', st.root).forEach(c => c.classList.remove('drop-on'));
    if (col && drop) st.onDrop(st.card.dataset.task, col.dataset.col, {afterId, beforeId});
  },
};

  count(d) { return Object.values(d).reduce((a, m) => a + Object.keys(m).length, 0); },

  /* загрузка в текущую базу: по одной записи, с очередью хранилища */
  async load(onProgress) {
    const d = this.build();
    const total = this.count(d);
    let n = 0;
    for (const [c, docs] of Object.entries(d)) {
      for (const [id, doc] of Object.entries(docs)) {
        Store.put(c, id, doc);
        n++;
        if (onProgress && n % 10 === 0) onProgress(n, total);
        if (n % 20 === 0) await new Promise(r => setTimeout(r, 30));
      }
    }
    this.closeMonths();
    await Store.flush();
    return total;
  },
  /* позапрошлый месяц закрыт целиком, прошлый ждёт выплаты 10 числа */
  closeMonths() {
    const s = settings(), cur = monthOf(today());
    [addMonths(cur, -2), addMonths(cur, -1)].forEach((m, k) => {
      const rows = {};
      Referral.registry(m).forEach(x => {
        if (x.status !== 'due') return;
        if (k === 1) return;
        const status = x.mode === 'card' ? 'paid' : 'balance';
        rows[x.r.id] = {status, amount: x.due, mode: x.mode, at: dateOf(addMonths(m, 1) + '-0' + Math.min(9, s.refPayDay - 1)).getTime() + 11 * 3600e3, by: 'tm_vera'};
        if (status === 'balance') Store.patch('clients', x.r.id, {balance: (Clients.get(x.r.id).balance || 0) + Math.round(x.due * (1 + s.refBalanceBonus))});
        /* сохраняем по одному месяцу: registry следующего месяца учитывает выплаты этого */
        Store.put('payouts', m, {demo: true, month: m, createdAt: Date.now(), rows: {...((Store.get('payouts', m) || {}).rows || {}), [x.r.id]: rows[x.r.id]}});
      });
    });
  },
  async clear() {
    let n = 0;
    for (const c of Store.COLS) {
      for (const doc of Store.all(c)) {
        if (doc.demo) { Store.remove(c, doc.id); n++; }
      }
    }
    await Store.flush();
    return n;
  },
  present() { return Store.COLS.some(c => Store.all(c).some(d => d.demo)); },
};

/* путь по этапам воронки по умолчанию до нужного (для демо) */
function Funnels_default_path(fid, stage) {
  const st = DEFAULT_FUNNELS[fid].stages.map(s => s.id);
  if (stage === 'lost') return st.slice(0, 3).concat('lost');
  return st.slice(0, st.indexOf(stage) + 1);
}
function Funnels_default_idx(fid, stage) { return DEFAULT_FUNNELS[fid].stages.findIndex(s => s.id === stage); }

/* Дашборд: как идут продажи за период, что требует внимания прямо сейчас,
   мои задачи, деньги по месяцам, источники и работа менеджеров. */

/* сколько клиенток дошли до этапа (или дальше) — воронка когорты */
function reachFunnel(list, fid = 'sales') {
  const f = Funnels.get(fid);
  if (!f) return [];
  const idxOf = c => {
    if (c.stage !== 'lost') return f.stages.findIndex(s => s.id === c.stage);
    /* для отказа — самый дальний этап, до которого дошла */
    let best = -1;
    Ev.list(c).forEach(e => { if (e.kind === 'stage' && e.from) best = Math.max(best, f.stages.findIndex(s => s.id === e.from)); });
    return best;
  };
  const idx = list.map(idxOf);
  const rows = f.stages.map((s, i) => ({name: s.name, n: idx.filter(x => x >= i).length, won: !!s.won, href: `funnels`}));
  rows.push({name: LOST.name, n: list.filter(c => c.stage === 'lost').length, lost: true, sub: 'отказ'});
  return rows;
}

function periodDelta(cur, prev) {
  if (!prev) return cur ? '<span class="delta up">новое</span>' : '';
  const d = (cur - prev) / prev;
  if (Math.abs(d) < 0.005) return '<span class="delta">как раньше</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${pct(Math.abs(d))}</span>`;
}

function attentionHtml(list) {

  const stale = L.filter(c => !['paid', 'lost', 'warm1', 'warm2'].includes(c.stage) && (!cx(c).lastTouch || cx(c).lastTouch < addDays(t, -s.staleDays)));
  const expiring = L.filter(c => cx(c).sub === 'expiring');

  const html = [
    group('Ждут ответа', waiting, c => row(c, `${chBadge(cx(c).lastIn.ch)} ${timeAgo(cx(c).lastIn.t)}`), 'bad', '#inbox'),
    group('Свободные заявки — взять в работу', free, c => row(c, esc(Funnels.stage('sales', c.stage).name)), '', '#funnels'),

    group('Счёт не оплачен больше 3 дней', unpaid, c => row(c, rub(sum(cx(c).pending, p => p.amount || settings().price)))),
    group(`Без касания ${s.staleDays}+ дней`, stale, c => row(c, cx(c).lastTouch ? dayShort(cx(c).lastTouch) : 'ни разу')),
    group('Подписка заканчивается', expiring, c => row(c, 'до ' + dayShort(cx(c).subUntil))),
  ].join('');
  return html || '<div class="okline">Всё под контролем: никто не ждёт ответа, просроченных задач нет.</div>';

}
function wireTaskDone(root) {
  on(root, 'click', '[data-task-done]', (e, el) => {
    const [col, id, eid] = el.dataset.taskDone.split('|');
    const cur = (Store.get(col, id).ev || {})[eid];

function revenueByMonth(list, months) {
  const types = Object.keys(PAY_TYPES).filter(k => k !== 'refund');
  const m = Object.fromEntries(months.map(x => [x, Object.fromEntries(types.map(t => [t, 0]))]));
  list.forEach(c => cx(c).ok.forEach(p => {
    const mm = monthOf(isoTs(p.t));
    if (!m[mm]) return;
    const v = cashOf(p);
    if (p.type === 'refund') m[mm].sub += v; else if (m[mm][p.type] !== undefined) m[mm][p.type] += v;
  }));
  const groups = [
    {name: 'Подписки', color: '#5A50C0', keys: ['sub', 'year']},
    {name: 'Курсы и консультации', color: '#AD4C74', keys: ['course', 'consult']},
    {name: 'События и клубы', color: '#4F7A7A', keys: ['event', 'club']},
    {name: 'Маркет', color: '#2C7753', keys: ['market']},
    {name: 'Пополнения', color: '#C08F3B', keys: ['topup']},
  ];
  return {labels: months.map(monthShort), series: groups.map(g => ({name: g.name, color: g.color, values: months.map(x => sum(g.keys, k => m[x][k]))}))};
}

/* Клиенты — главная таблица. Одна строка = одна клиентка, колонки
   выбираются из схемы (CLIENT_FIELDS), фильтры — быстрые виды, выпадающие
   списки и конструктор условий. Отсюда — массовые действия, импорт и
   выгрузка CSV. */

const Sel = new Set();
const QUICK_VIEWS = {
  all:       {name: 'Все'},
  mine:      {name: 'Мои', test: c => c.manager === Who.id()},
  free:      {name: 'Без менеджера', test: c => !c.manager && c.stage !== 'lost'},
  hot:       {name: 'Горячие', test: c => (c.tags || []).includes('hot') || ['qual', 'invoice'].includes(c.stage)},
  waiting:   {name: 'Ждут ответа', test: c => cx(c).waiting && c.stage !== 'lost'},
  stale:     {name: 'Без касания 7+ дней', test: c => !['paid', 'lost'].includes(c.stage) && (!cx(c).lastTouch || cx(c).lastTouch < addDays(today(), -settings().staleDays))},
  expiring:  {name: 'Подписка заканчивается', test: c => cx(c).sub === 'expiring'},
  paying:    {name: 'С подпиской', test: c => ['active', 'expiring'].includes(cx(c).sub)},
  noconsent: {name: 'Без согласия на рассылки', test: c => !c.consentAds},
};
const DEFAULT_COLS = ['phone', 'city', 'stage', 'segment', 'tags', 'manager', 'source', 'sub', 'ltv', 'lastTouch', 'nextAt'];

/* значение поля для сортировки и CSV */
function sortVal(c, k) {
  if (k === 'name') return Clients.name(c).toLowerCase();
  if (k === 'stage') return (c.stage === 'lost' ? 100 : Funnels.idx(Funnels.of('clients', c), c.stage));
  if (k === 'manager') return Team.name(Team.get(c.manager));
  if (k === 'segment') { const s = cx(c).segment; return s ? s.name : 'я'; }
  if (k === 'sub') return ['active', 'expiring', 'trial', 'expired', 'none'].indexOf(cx(c).sub);
  if (k === 'level') return c.points || 0;
  const v = fieldVal(c, k);
  if (Array.isArray(v)) return v.join(', ');
  return v ?? '';
}
function textVal(c, k) {
  const f = FIELD[k] || {};
  const v = k === 'name' ? Clients.name(c) : fieldVal(c, k);
  if (isEmpty(v)) return '';
  switch (f.type) {
    case 'stage': return (Funnels.stage(Funnels.of('clients', c), c.stage) || {}).name || c.stage;
    case 'segment': { const s = cx(c).segment; return s ? s.name : ''; }
    case 'tags': return (v || []).map(t => (Tags.get(t) || {}).name || t).join(', ');
    case 'person': return Team.name(Team.get(v));
    case 'partner': return (Partners.get(v) || {}).name || '';
    case 'client': return Clients.name(Clients.get(v));
    case 'quiz': return quizText(f.q, v);
    case 'sub': return SUB_STATUS[cx(c).sub].name;
    case 'level': return levelOf(c.points).name;
    case 'phone': return phoneFmt(v);
    case 'date': return typeof v === 'number' ? isoTs(v) : v;
    case 'bool': return v ? 'да' : '';
    default: return f.label ? (Array.isArray(v) ? v.map(f.label).join(', ') : f.label(v)) : Array.isArray(v) ? v.join(', ') : String(v);
  }
}
function cellHtml(c, k) {
  const f = FIELD[k] || {};
  const v = fieldVal(c, k);
  switch (f.type) {
    case 'stage': return stagePill(Funnels.of('clients', c), c.stage);
    case 'segment': return segPill(cx(c).segment);
    case 'tags': return `<span class="tags-line">${tagsHtml(c.tags, 2)}</span>`;
    case 'person': { const m = Team.get(v); return m ? `<span class="row" style="gap:6px;flex-wrap:nowrap;align-items:center">${Team.av(m)}${esc(Team.first(m))}</span>` : '<span class="muted">—</span>'; }
    case 'sub': return subPill(c);
    case 'money': return isEmpty(v) || !v ? '<span class="muted">—</span>' : rub(v);
    case 'date': { const d = toDay(v); if (!d) return '<span class="muted">—</span>'; const late = k === 'nextAt' && d < today(); return `<span class="${late ? 'bad' : k === 'nextAt' && d === today() ? 'warn' : ''}">${dayOrWhen(d)}</span>`; }
    case 'phone': return v ? `<span class="nowrap">${esc(phoneFmt(v))}</span>` : '<span class="muted">—</span>';
    case 'level': return esc(levelOf(c.points).name);
    default: { const t = textVal(c, k); return t ? esc(t) : '<span class="muted">—</span>'; }
  }
}

const ClientsUI = {
  filters() {
    return {
      q: View.get('cl.q', ''), view: View.get('cl.view', 'all'), stage: View.get('cl.stage', ''), seg: View.get('cl.seg', ''),
      tag: View.get('cl.tag', ''), mgr: View.get('cl.mgr', ''), src: View.get('cl.src', ''), sub: View.get('cl.sub', ''),
      rules: View.get('cl.rules', []), match: View.get('cl.match', 'all'),
    };
  },
  list(f = this.filters()) {
    const q = f.q.trim().toLowerCase();
    const qd = q.replace(/\D/g, '');
    const qv = QUICK_VIEWS[f.view];
    const saved = f.view.startsWith('v:') ? (Cfg.list('views') || {})[f.view.slice(2)] : null;
    return Clients.visible().filter(c => {
      if (qv && qv.test && !qv.test(c)) return false;
      if (saved && !testRules(saved.rules, saved.match, c)) return false;
      if (f.stage && c.stage !== f.stage) return false;
      if (f.seg) { const s = cx(c).segment; if (f.seg === 'none' ? s : (!s || s.id !== f.seg)) return false; }
      if (f.tag && !(c.tags || []).includes(f.tag)) return false;
      if (f.mgr === 'me' && c.manager !== Who.id()) return false;
      if (f.mgr === 'none' && c.manager) return false;
      if (f.mgr && !['me', 'none'].includes(f.mgr) && c.manager !== f.mgr) return false;
      if (f.src && c.source !== f.src) return false;
      if (f.sub && cx(c).sub !== f.sub) return false;
      if (f.rules.length && !testRules(f.rules, f.match, c)) return false;
      if (q) {
        const hay = [c.name, c.org, c.email, c.tg, c.city, c.refCode].join(' ').toLowerCase();
        const ph = phoneDigits(c.phone) + ' ' + phoneDigits(c.wa);
        if (!hay.includes(q) && !(qd.length >= 3 && ph.includes(qd))) return false;
      }
      return true;
    });
  },
  sorted(list) {
    const s = View.get('cl.sort', {k: 'created', dir: 'desc'});
    const dir = s.dir === 'asc' ? 1 : -1;
    return list.slice().sort((a, b) => {
      const x = sortVal(a, s.k), y = sortVal(b, s.k);
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
      return String(x).localeCompare(String(y), 'ru', {numeric: true}) * dir;
    });
  },
  cols() { return View.get('cl.cols', DEFAULT_COLS).filter(k => FIELD[k] && k !== 'name'); },
};

App.register('clients', {
  title: 'Клиенты',
  render(root) {
    const f = ClientsUI.filters();
    const list = ClientsUI.sorted(ClientsUI.list(f));

/* ── массовые действия ── */
async function bulkAction(kind, anchor) {
  const ids = [...Sel].filter(id => Store.get('clients', id));
  const list = ids.map(id => Store.get('clients', id));
  if (kind === 'clear') { Sel.clear(); App.render(); return; }
  if (kind === 'assign') {
    const v = await pickPop(anchor, [['', 'Снять менеджера'], ...Team.assignable().map(m => [m.id, Team.name(m)])], '');
    if (v === null) return;
    list.forEach(c => Store.patch('clients', c.id, {manager: v || null}));
    toast(`Менеджер назначен: ${list.length}`);
  }
  if (kind === 'tag') {
    const v = await pickPop(anchor, [...Tags.all().map(t => [t.id, `${t.name} · ${t.group}`]), ['__new', '+ Новый тег…']], '');
    if (v === null) return;
    let id = v;
    if (v === '__new') { const name = await askText(anchor, 'Новый тег', 'Например, «Была на эфире»'); if (!name) return; id = Tags.ensure(name); }
    list.forEach(c => { if (!(c.tags || []).includes(id)) Store.patch('clients', c.id, {tags: [...(c.tags || []), id]}); });
    toast(`Тег добавлен: ${list.length}`);
  }
  if (kind === 'stage') {
    const v = await pickPop(anchor, [...Funnels.stages('sales').map(s => [s.id, s.name]), ['lost', LOST.name]], '');
    if (v === null) return;
    let reason = '';
    if (v === 'lost') { reason = await pickPop(anchor, LOST_REASONS.map(r => [r, r]), ''); if (reason === null) return; }
    list.forEach(c => moveStage('clients', c.id, v, {reason}));
    toast(`Этап изменён: ${list.length}`);
  }
  if (kind === 'task') {
    const title = await askText(anchor, 'Задача для выбранных', 'Позвонить и пригласить на эфир');
    if (!title) return;
    list.forEach(c => Tasks.add('clients', c.id, {title, due: today(), who: c.manager || Who.id()}));
    toast(`Задач поставлено: ${list.length}`);
  }
  if (kind === 'camp') { openCampaignForm(null, {ids}); return; }
  if (kind === 'export') { exportClients(list, ClientsUI.cols()); return; }
  if (kind === 'del') {
    if (!await confirmPop(anchor, {text: `Удалить ${list.length} ${plural(list.length, 'карточку', 'карточки', 'карточек')} со всей историей?`, yes: 'Удалить', danger: true})) return;
    list.forEach(c => Store.remove('clients', c.id));
    Sel.clear();
    toast(`Удалено: ${list.length}`);
  }
  App.render();
}

/* короткий ввод текста рядом с кнопкой (prompt() в артефакте не работает) */
function askText(anchor, label, placeholder = '', value = '') {
  return new Promise(resolve => {
    closePops();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.innerHTML = `<p></p><form class="row" style="gap:6px;flex-wrap:nowrap"><input class="input sm" style="min-width:200px"><button class="btn sm primary" type="submit">OK</button></form>`;
    $('p', pop).textContent = label;
    const inp = $('input', pop);
    inp.placeholder = placeholder;
    inp.value = value;
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = r.top - h - 6;
    pop.style.top = (top + window.scrollY) + 'px';
    pop.style.left = (clamp(r.left, 8, window.innerWidth - w - 8) + window.scrollX) + 'px';
    const done = v => { pop.remove(); document.removeEventListener('mousedown', outside, true); resolve(v); };
    pop._done = () => done(null);
    const outside = e => { if (!pop.contains(e.target)) done(null); };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    $('form', pop).onsubmit = e => { e.preventDefault(); done(inp.value.trim() || null); };
    inp.addEventListener('keydown', e => { if (e.key === 'Escape') done(null); });
    inp.focus();
  });
}

/* ── конструктор условий: общий для фильтра, сегментов и рассылок ── */
const RULE_FIELDS = () => CLIENT_FIELDS.filter(f => !['name', 'id', 'demo', 'segment', 'wa', 'birth'].includes(f.k));
function valueOptions(k) {
  const f = FIELD[k];
  if (!f) return null;
  if (f.type === 'quiz') return Object.entries(QUIZ[f.q].opts);
  if (f.type === 'stage') return [...Funnels.stages('sales').map(s => [s.id, s.name]), ['lost', LOST.name]];
  if (f.type === 'tags') return Tags.all().map(t => [t.id, t.name]);
  if (f.type === 'person') return Team.assignable().map(m => [m.id, Team.name(m)]);
  if (f.type === 'partner') return Partners.all().map(p => [p.id, p.name]);
  if (f.type === 'sub') return Object.entries(SUB_STATUS).map(([k2, s]) => [k2, s.name]);
  if (f.type === 'level') return LEVELS.map(l => [l.id, l.name]);
  if (f.list) return f.list().map(v => [v, f.label ? f.label(v) : v]);
  return null;
}
function ruleRowHtml(r, i) {
  const f = FIELD[r.f] || RULE_FIELDS()[0];
  const ops = opsFor(f.type);
  const op = ops.includes(r.op) ? r.op : ops[0];
  const vo = valueOptions(f.k);
  const noV = OPS[op] && OPS[op].noValue;
  const groups = FIELD_GROUPS.map(g => {
    const fs = RULE_FIELDS().filter(x => x.g === g);
    return fs.length ? `<optgroup label="${esc(g)}">${fs.map(x => opt(x.k, x.n, f.k)).join('')}</optgroup>` : '';
  }).join('');
  let val = '';
  if (noV) val = '<span></span>';
  else if (vo && op !== 'in') val = `<select class="select rv" data-r="v">${vo.map(([v, n]) => opt(v, n, r.v)).join('')}</select>`;
  else if (vo && op === 'in') val = `<select class="select rv" data-r="v" multiple size="3">${vo.map(([v, n]) => `<option value="${esc(v)}" ${(Array.isArray(r.v) ? r.v : [r.v]).includes(v) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  else val = `<input class="input rv" data-r="v" value="${esc(r.v ?? '')}" ${['number', 'money', 'date'].includes(f.type) ? 'inputmode="numeric"' : ''} placeholder="${f.type === 'date' ? 'дней' : 'значение'}">`;
  return `<div class="rule" data-i="${i}">
    <select class="select" data-r="f">${groups}</select>
    <select class="select" data-r="op">${ops.map(o => opt(o, OPS[o].name, op)).join('')}</select>
    ${val}
    <button class="icon-btn" data-r-del title="Убрать условие">${icon('x')}</button>
  </div>`;
}
function rulesEditorHtml(rules, match) {
  return `<div class="rules" data-rules-ed>${rules.map(ruleRowHtml).join('') || '<p class="note">Условий пока нет.</p>'}</div>
    <div class="rules-foot"><button class="btn sm" data-r-add>${icon('plus')}Условие</button>
      <div class="seg" data-match><button data-m="all" class="${match !== 'any' ? 'on' : ''}">Все условия</button><button data-m="any" class="${match === 'any' ? 'on' : ''}">Любое из</button></div>
      <span class="note" data-r-count></span></div>`;
}
/* читает редактор в массив правил; перерисовывает строку при смене поля */
function wireRulesEditor(el, state, onChange) {
  const read = () => $$('.rule', el).map(row => {
    const f = $('[data-r="f"]', row).value, op = $('[data-r="op"]', row).value;
    const ve = $('[data-r="v"]', row);
    let v = '';
    if (ve) v = ve.multiple ? $$('option:checked', ve).map(o => o.value) : ve.value;
    const ft = (FIELD[f] || {}).type;
    if (['number', 'money'].includes(ft) || ['within', 'older'].includes(op)) v = v === '' ? '' : parseNum(v);
    return {f, op, v};
  });
  const redraw = () => {
    const box = $('[data-rules-ed]', el);
    box.innerHTML = state.rules.map(ruleRowHtml).join('') || '<p class="note">Условий пока нет.</p>';
    onChange && onChange(state);
  };
  el.addEventListener('change', e => {
    const row = e.target.closest('.rule');
    if (!row) return;
    const i = Number(row.dataset.i);
    const prev = state.rules[i] || {};
    state.rules = read();
    if (e.target.dataset.r === 'f' && prev.f !== state.rules[i].f) { state.rules[i] = {f: state.rules[i].f, op: opsFor(FIELD[state.rules[i].f].type)[0], v: ''}; redraw(); return; }
    if (e.target.dataset.r === 'op') { redraw(); return; }
    onChange && onChange(state);
  });
  el.addEventListener('input', e => { if (e.target.closest('.rule') && e.target.tagName === 'INPUT') { state.rules = read(); onChange && onChange(state); } });
  on(el, 'click', '[data-r-add]', e => { e.preventDefault(); state.rules = read(); state.rules.push({f: 'city', op: 'eq', v: ''}); redraw(); });
  on(el, 'click', '[data-r-del]', (e, b) => { e.preventDefault(); state.rules = read(); state.rules.splice(Number(b.closest('.rule').dataset.i), 1); redraw(); });
  on(el, 'click', '[data-m]', (e, b) => { e.preventDefault(); state.match = b.dataset.m; $$('[data-m]', el).forEach(x => x.classList.toggle('on', x === b)); onChange && onChange(state); });
  state.read = read;
}
function openRulesModal({title, rules, match, hint, onSave}) {
  const state = {rules: clone(rules || []), match: match || 'all'};
  const count = () => Clients.visible().filter(c => testRules(state.rules, state.match, c)).length;
  openModal({title, wide: true, body: `${hint ? `<p class="note">${esc(hint)}</p>` : ''}${rulesEditorHtml(state.rules, state.match)}`,
    foot: '<button class="btn ghost left" data-clear>Очистить</button><button class="btn" data-close>Отмена</button><button class="btn primary" data-ok>Применить</button>',
    onMount(el, close) {
      const upd = () => { $('[data-r-count]', el).textContent = `подходят: ${count()}`; };
      wireRulesEditor(el, state, upd);
      upd();
      $('[data-clear]', el).onclick = () => { onSave([], 'all'); close(); };
      $('[data-ok]', el).onclick = () => { state.rules = state.read(); onSave(state.rules.filter(r => r.f && (OPS[r.op].noValue || !isEmpty(r.v))), state.match); close(); };
    }});
}

/* ── новая клиентка / правка карточки ── */
function fieldInput(f, v, idp = 'ff') {
  const id = `${idp}-${f.k}`;
  const vo = valueOptions(f.k);
  if (f.type === 'quiz') {
    const q = QUIZ[f.q];
    if (q.multi) return `<div class="chips" id="${id}" data-multi>${Object.entries(q.opts).map(([k, n]) => `<label class="chip ${(v || []).includes(k) ? 'on' : ''}"><input type="checkbox" value="${k}" ${(v || []).includes(k) ? 'checked' : ''} hidden>${esc(n)}</label>`).join('')}</div>`;
    return `<select class="select" id="${id}">${opt('', '—', v)}${Object.entries(q.opts).map(([k, n]) => opt(k, n, v)).join('')}</select>`;
  }
  if (f.type === 'multi') return `<div class="chips" id="${id}" data-multi>${(vo || []).map(([k, n]) => `<label class="chip ${(v || []).includes(k) ? 'on' : ''}"><input type="checkbox" value="${k}" ${(v || []).includes(k) ? 'checked' : ''} hidden>${esc(n)}</label>`).join('')}</div>`;
  if (vo) return `<select class="select" id="${id}">${opt('', '—', v)}${vo.map(([k, n]) => opt(k, n, v)).join('')}</select>`;
  if (f.type === 'date') return `<input class="input" type="date" id="${id}" value="${esc(toDay(v) || '')}">`;
  if (f.type === 'bool') return `<label class="check"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}>да</label>`;
  if (['number', 'money'].includes(f.type)) return `<input class="input num" inputmode="numeric" id="${id}" value="${esc(v ?? '')}">`;
  return `<input class="input" id="${id}" value="${esc(f.type === 'phone' ? phoneFmt(v) : v ?? '')}" ${f.type === 'email' ? 'type="email"' : ''} placeholder="${f.type === 'tg' ? '@username' : ''}">`;
}
function readField(f, el, idp = 'ff') {
  const node = $(`#${idp}-${f.k}`, el);
  if (!node) return undefined;
  if (node.dataset.multi !== undefined) return $$('input:checked', node).map(i => i.value);
  if (f.type === 'bool') return node.checked;
  const v = node.value.trim();
  if (f.type === 'phone') return v ? phoneDigits(v) : '';
  if (f.type === 'tg') return tgUser(v);
  if (['number', 'money'].includes(f.type)) return v === '' ? null : parseNum(v);
  return v || null;
}
const FORM_SKIP = ['stage', 'tags', 'segment', 'id', 'demo', 'lostReason'];

/* ── выгрузка ── */
async function saveFile(filename, data, label = 'Файл') {
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({filename, data}); toast(`${label} сохранён`); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  /* запасной путь: текст в окне, копируется кнопкой */
  openModal({title: label, wide: true, body: `<p class="note">Скачивание здесь недоступно — скопируйте содержимое и вставьте в Excel или Google Таблицы.</p><textarea class="textarea copy-fallback" id="copyBox" readonly>${esc(data)}</textarea>`,
    foot: '<button class="btn" data-close>Закрыть</button><button class="btn primary" data-copy>Скопировать</button>',
    onMount(el) { $('[data-copy]', el).onclick = async () => { if (await copyText(data, $('#copyBox', el))) toast('Скопировано'); }; }});
}
function exportClients(list, cols) {
  const keys = ['name', ...cols.filter(k => k !== 'name')];
  const extra = ['phone', 'email', 'tg', 'city', 'created'].filter(k => !keys.includes(k));
  const all = [...keys, ...extra];
  const rows = [all.map(k => (k === 'name' ? 'Имя и фамилия' : FIELD[k].n)), ...list.map(c => all.map(k => textVal(c, k)))];
  saveFile(`eva-crm-klienty-${today()}.csv`, csvOf(rows), 'Выгрузка клиентов');
}

        go.disabled = false;

      let t;
      $('#impText', el).oninput = e => { clearTimeout(t); t = setTimeout(() => show(e.target.value), 300); };

/* Карточка: всё о человеке на одной странице. Общие части — этапы,
   лента касаний, композер (сообщение, звонок, заметка, задача, оплата,

/* ── этапы стрелками ── */
function stepperHtml(col, e, canEdit) {
  const fid = Funnels.of(col, e);
  const f = Funnels.get(fid);
  if (!f) return '';
  const cur = f.stages.findIndex(s => s.id === e.stage);
  return `<div class="stepper" role="group" aria-label="Этап воронки «${esc(f.name)}»">
    ${f.stages.map((s, i) => `<button class="step ${i < cur && e.stage !== 'lost' ? 'past' : ''} ${i === cur ? 'cur' : ''} ${s.won ? 'won' : ''}" data-step="${s.id}" ${canEdit ? '' : 'disabled'} title="${esc(s.about || '')}">${esc(s.name)}${i === cur && e.stageAt ? `<small>${cx0(e).stageDays} дн.</small>` : ''}</button>`).join('')}
    <button class="step lost ${e.stage === 'lost' ? 'cur' : ''}" data-step="lost" ${canEdit ? '' : 'disabled'} title="${e.stage === 'lost' ? esc(e.lostReason || '') : 'Отказ с причиной'}">${e.stage === 'lost' ? `Отказ: ${esc(e.lostReason || '')}` : 'Отказ'}</button>
  </div>`;
}
/* для экспертов и партнёров — только дни на этапе */
const cx0 = e => ({stageDays: e.stageAt ? daysBetween(isoTs(e.stageAt), today()) : 0});
function wireStepper(root, col, e) {
  on(root, 'click', '[data-step]', async (ev, el) => {
    const to = el.dataset.step;
    if (to === e.stage) return;
    let reason = '';
    if (to === 'lost') { reason = await pickPop(el, LOST_REASONS.map(r => [r, r]), ''); if (reason === null) return; }
    moveStage(col, e.id, to, {reason});
    toast(`Этап: ${(Funnels.stage(Funnels.of(col, e), to) || {}).name}`);
  });
}

function timelineHtml(col, ent, events, canEdit) {
  if (!events.length) return '<div class="empty"><b>Пока пусто</b>Здесь появятся сообщения, звонки, рассылки и оплаты.</div>';
  let last = '', html = '';
  events.slice().sort((a, b) => b.t - a.t).forEach(e => {
    const d = isoTs(e.t);
    if (d !== last) { html += `<div class="tl-day">${d === today() ? 'Сегодня' : d === addDays(today(), -1) ? 'Вчера' : cap(dayWd(d))}${d.slice(0, 4) !== today().slice(0, 4) ? ' ' + d.slice(0, 4) : ''}</div>`; last = d; }
    html += evItemHtml(col, ent, e, {canEdit});
  });
  return `<div class="tl">${html}</div>`;
}

      <div class="comp-foot"><span class="note">После подключения телефонии звонки и записи появятся сами.</span><button class="btn primary sm" data-cm-send>${icon('phone')}Записать звонок</button></div>`;
  } else if (mode === 'note') {

function wireComposer(root, col, ent) {
  const box = $('[data-composer]', root);
  if (!box) return;
  on(root, 'click', '[data-cm-mode]', (e, el) => { View.set('cm.mode', el.dataset.cmMode); App.render(); });
  on(box, 'click', '#cmDir button', (e, el) => $$('#cmDir button', box).forEach(b => b.classList.toggle('on', b === el)));
  const tplSel = $('#cmTpl', box);
  if (tplSel) tplSel.onchange = () => {
    const t = (Cfg.list('templates') || {})[tplSel.value];
    if (!t) return;
    $('#cmText', box).value = fillTemplate(t.text, col === 'clients' ? ent : null);
    if (t.ch && $('#cmCh', box)) $('#cmCh', box).value = t.ch;
    $('#cmText', box).focus();
  };
  const text = $('#cmText', box);
  if (text && text.tagName === 'TEXTAREA') text.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
  const mode = box.dataset.mode;
  function send() {
    const v = text ? text.value.trim() : '';
    if (mode === 'msg') {
      if (!v) { text.classList.add('need'); text.focus(); return; }
      const ch = $('#cmCh', box).value;
      if (ch.startsWith('group:')) {
        const chat = Chats.get(ch.slice(6));
        Chats.post(chat.id, v, {to: ent.id});
        toast(`Отправлено в групповой чат «${chat.name.split(' · ')[0]}» — видно всем участницам`);
      } else {
        if (col === 'clients') Inbox.send(ent.id, ch, v);
        else Ev.add(col, ent.id, {kind: 'msg', ch, dir: 'out', text: v, status: Inbox.live(ch) ? 'queued' : 'saved'});
        toast(Inbox.live(ch) ? 'Сообщение поставлено в отправку' : 'Сохранено в истории. Канал не подключён — отправьте по ссылке');
      }
    } else if (mode === 'call') {
      const dir = ($('#cmDir button.on', box) || {}).dataset.v || 'out';
      const res = $('#cmRes', box).value;
      const mins = parseNum($('#cmDur', box).value);
      const rec = $('#cmRec', box).value.trim();
      Ev.add(col, ent.id, {kind: 'call', dir, result: res, dur: Math.round(mins * 60), text: v, rec: /^https?:\/\//.test(rec) ? rec : ''});
      if ($('#cmNext', box).checked || res === 'later' || res === 'noanswer') Tasks.add(col, ent.id, {title: res === 'noanswer' ? 'Перезвонить: не дозвонились' : 'Перезвонить', due: $('#cmNextD', box).value || addDays(today(), 1), who: ent.manager || Who.id()});
      toast('Звонок записан');
    } else if (mode === 'note') {
      if (!v) { text.classList.add('need'); text.focus(); return; }
      Ev.add(col, ent.id, {kind: 'note', text: v});
    } else if (mode === 'task') {
      if (!v) { text.classList.add('need'); text.focus(); return; }
      Tasks.add(col, ent.id, {title: v, due: $('#cmDue', box).value, who: $('#cmWho', box).value});
      toast('Задача поставлена');
    } else if (mode === 'meet') {
      if (!v) { text.classList.add('need'); text.focus(); return; }
      const d = $('#cmDue', box).value || today();
      Ev.add(col, ent.id, {kind: 'meet', ch: $('#cmMeetCh', box).value, text: v, t: d === today() ? Date.now() : dateOf(d).getTime() + 12 * 3600e3});
    } else if (mode === 'payout') {
      const amount = parseNum($('#cmAmount', box).value);
      if (!amount) { $('#cmAmount', box).classList.add('need'); return; }
      Ev.add(col, ent.id, {kind: 'pay', type: 'payout', amount, status: 'ok', method: 'invoice', text: v});
      toast('Выплата записана');
    }
  }
  on(box, 'click', '[data-cm-send]', e => { e.preventDefault(); send(); });
  on(box, 'click', '[data-cm-pay]', () => openPayForm(ent.id, 'ok'));
  on(box, 'click', '[data-cm-invoice]', () => openPayForm(ent.id, 'pending'));
}

/* ── оплата или счёт ── */
function openPayForm(clientId, status = 'ok') {
  const s = settings();
  const c = Clients.get(clientId);
  const exOpts = Experts.all().filter(x => ['live', 'paying', 'shot', 'agreed'].includes(x.stage));
  const body = `<div class="grid2">
      <label class="field"><span>Что</span><select class="select" id="pyType">${Object.entries(PAY_TYPES).map(([k, t]) => opt(k, t.name, 'sub')).join('')}</select></label>
      <label class="field"><span>Сумма, ₽</span><input class="input num" id="pyAmount" inputmode="numeric" value="${s.price}"></label>
      <label class="field"><span>Способ</span><select class="select" id="pyMethod">${Object.entries(PAY_METHODS).map(([k, n]) => opt(k, n, 'card')).join('')}</select></label>
      <label class="field"><span>Дата</span><input class="input" type="date" id="pyDate" value="${today()}"></label>
      <label class="field" style="grid-column:1/-1"><span>Название (курс, товар, событие)</span><input class="input" id="pyItem" placeholder="Курс «Мягкая сила»"></label>
      <label class="field"><span>Эксперт — для доли с продаж</span><select class="select" id="pyExpert">${opt('', '—', '')}${exOpts.map(x => opt(x.id, x.name, '')).join('')}</select></label>
      <label class="field"><span>Оплачено бонусами, ₽</span><input class="input num" id="pyBonus" inputmode="numeric" placeholder="до 30% заказа"></label>
    </div>
    ${status === 'pending' ? '<p class="note">Счёт попадёт в историю со статусом «Ждёт оплаты», клиентка — на этап «Счёт выставлен». Когда оплата придёт, нажмите «Оплачено» в ленте.</p>' : '<p class="note">Первая оплата сама переведёт клиентку в «Оплата получена».</p>'}`;
  openModal({title: status === 'pending' ? `Счёт: ${Clients.name(c)}` : `Оплата: ${Clients.name(c)}`, body,
    foot: `<button class="btn" data-close>Отмена</button><button class="btn primary" data-ok>${status === 'pending' ? 'Выставить счёт' : 'Внести оплату'}</button>`,
    onMount(el, close) {
      const typeSel = $('#pyType', el);
      typeSel.onchange = () => { const v = typeSel.value; $('#pyAmount', el).value = v === 'sub' ? s.price : v === 'year' ? s.priceYear : v === 'club' ? 1500 : ''; };
      $('[data-ok]', el).onclick = () => {
        const amount = parseNum($('#pyAmount', el).value);
        if (!amount && status === 'ok') { $('#pyAmount', el).classList.add('need'); return; }
        const d = $('#pyDate', el).value || today();
        const bonus = parseNum($('#pyBonus', el).value);
        Pay.add(clientId, {type: typeSel.value, amount, method: $('#pyMethod', el).value, status, item: $('#pyItem', el).value.trim() || undefined,
          expertId: $('#pyExpert', el).value || undefined, bonusUsed: bonus || undefined, t: d === today() ? Date.now() : dateOf(d).getTime() + 12 * 3600e3});
        close();
        toast(status === 'pending' ? 'Счёт выставлен' : 'Оплата внесена');
      };
    }});
}

            ${kv('Последнее касание', d.lastTouchTs ? when(d.lastTouchTs) : 'ни разу')}
            ${kv('Касаний', fmt(d.touches))}
            ${kv('Сегмент', seg ? `${esc(seg.name)}${c.segId ? ' · вручную' : ''}` : '—')}
            ${canEdit ? `<div class="row" style="margin-top:8px"><button class="btn xs" data-seg>Сменить сегмент</button></div>` : ''}
          </div>

          ${Who.can('money.view') || c.manager === Who.id() ? `<div class="card"><div class="mini-h"><h3>Подписка и деньги</h3></div>

            ${d.subUntil ? kv('Оплачено до', dayLong(d.subUntil)) : ''}
            ${c.trialUntil ? kv('Пробный до', dayLong(c.trialUntil)) : ''}
            ${kv('Принесла, LTV', `<b>${rub(d.ltv)}</b>`)}
            ${kv('Оплат', fmt(d.pays))}

            ${kv('Баланс Евы', rub(c.balance || 0))}
            ${kv('Бонусы', rub(c.bonus || 0))}

            ${!c.consentAds ? '<p class="note" style="margin-top:6px">Без согласия рассылки не уходят. Личные ответы на её сообщения — можно.</p>' : ''}
          </div>
          <div class="card"><div class="mini-h"><h3>В приложении</h3></div>
            ${kv('Была', c.lastSeen ? dayOrWhen(c.lastSeen) : '—')}${kv('Звёзд за неделю', `${fmt(c.stars || 0)} из 21`)}${kv('Практик пройдено', fmt(c.practices || 0))}${kv('Баллы', fmt(c.points || 0))}${c.appId ? kv('ID', esc(c.appId)) : ''}
          </div>
          <div class="card"><div class="mini-h"><h3>Откуда</h3></div>
            ${kv('Источник', esc(SOURCES[c.source] || c.source || ''))}${c.utm ? kv('Кампания', esc(c.utm)) : ''}
            ${ref ? kv('Пригласила', `<a href="#client-${ref.id}">${esc(Clients.name(ref))}</a>`) : ''}
            ${partner ? kv('Партнёр', `<a href="#partner-${partner.id}">${esc(partner.name)}</a>`) : ''}
            ${kv('Промокод для подруг', c.refCode ? `<span class="promo">${esc(c.refCode)}</span>` : '')}
            ${c.refProgram ? kv('Программа', esc(REF_PROGRAMS[c.refProgram].name)) : ''}
          </div>
          ${chats.length ? `<div class="card"><div class="mini-h"><h3>Групповые чаты</h3></div>${chats.map(g => `<a class="attn-row" href="#inbox" data-open-chat="${g.id}">${chBadge('group')}<span class="t">${esc(g.name)}</span></a>`).join('')}</div>` : ''}
          ${offers.length ? `<div class="card"><div class="mini-h"><h3>Предложения партнёров рядом</h3></div><div class="stack">${offers.map(({p, o}) => `<div class="offer"><span class="ico">${icon('gift')}</span><div><b>${esc(o.title)}</b><small><a class="inline-link" href="#partner-${p.id}">${esc(p.name)}</a>${o.promo ? ` · <span class="promo">${esc(o.promo)}</span>` : ''}</small></div></div>`).join('')}</div></div>` : ''}
        </aside>
      </div>`;

    wireTabs(root);
    wireStepper(root, 'clients', c);
    wireTimeline(root, 'clients', c);
    wireComposer(root, 'clients', c);
    if (tab === 'chat' || tab === 'feed') Inbox.markRead(c);
    on(root, 'click', '[data-mode-go]', (e, el) => { View.set('cm.mode', el.dataset.modeGo); App.render(); setTimeout(() => { const t = $('#cmText'); if (t) t.focus(); }, 30); });
    on(root, 'click', '[data-invoice]', () => openPayForm(c.id, 'pending'));
    on(root, 'click', '[data-edit]', () => openClientForm(c.id));
    on(root, 'click', '[data-edit-g]', (e, el) => openClientForm(c.id, el.dataset.editG));
    on(root, 'click', '[data-copy]', async (e, el) => { if (await copyText(el.dataset.copy)) toast('Скопировано'); });
    on(root, 'click', '[data-take]', () => { Store.patch('clients', c.id, {manager: Who.id()}); toast('Клиентка ваша'); });
    on(root, 'click', '[data-open-chat]', (e, el) => { View.set('ib.sel', 'chat:' + el.dataset.openChat); });
    on(root, 'click', '[data-mgr]', async (e, el) => {
      const v = await pickPop(el, [['', 'Без менеджера'], ...Team.assignable().map(m => [m.id, Team.name(m)])], c.manager || '');
      if (v === null) return;
      Store.patch('clients', c.id, {manager: v || null});
      Ev.add('clients', c.id, {kind: 'sys', text: v ? `Назначен менеджер: ${Team.name(Team.get(v))}` : 'Менеджер снят'});
    });
    on(root, 'click', '[data-seg]', async (e, el) => {
      const v = await pickPop(el, [['', 'Автоматически — по условиям'], ...Segments.all().map(sg => [sg.id, sg.name]), ['none', 'Без сегмента']], c.segId || '');
      if (v === null) return;
      Store.patch('clients', c.id, {segId: v || null});
    });
    on(root, 'click', '[data-untag]', (e, el) => Store.patch('clients', c.id, {tags: (c.tags || []).filter(t => t !== el.dataset.untag)}));
    on(root, 'click', '[data-tag-add]', async (e, el) => {
      const v = await pickPop(el, [...Tags.all().filter(t => !(c.tags || []).includes(t.id)).map(t => [t.id, `${t.name} · ${t.group}`]), ['__new', '+ Новый тег…']], '');
      if (v === null) return;
      let tid = v;
      if (v === '__new') { tid = Tags.ensure(await askText(el, 'Новый тег', 'Например, «Хочет курс по деньгам»')); if (!tid) return; }
      Store.patch('clients', c.id, {tags: [...(c.tags || []), tid]});
    });
    on(root, 'click', '[data-del]', async (e, el) => {
      if (!await confirmPop(el, {text: 'Удалить карточку со всей историей? Это нельзя отменить.', yes: 'Удалить', danger: true})) return;
      Store.remove('clients', c.id);
      App.go('clients');
      toast('Карточка удалена');
    });
    void s;
  },
});

/* ── 30-funnels.js ── */
/* Воронки: доска по этапам с перетаскиванием, разбивка по сегментам
   (салоны красоты, пилатес… — условия задаются в «Настройках»), матрица
   «сегмент × этап» и критерии этапов. Работает для клиенток, экспертов
   и партнёров — у каждой воронки своя сущность. */

function entityList(col) {
  if (col === 'clients') return Clients.visible();
  if (col === 'experts') return Experts.all();
  return Partners.all();
}
function entityCanEdit(col, e) {
  if (col === 'clients') return Clients.canEdit(e);
  return Who.can(col === 'experts' ? 'experts.edit' : 'partners.edit') && !Who.readOnly();
}

function kanbanCard(col, e, fid) {
  const late = (e.stageAt && daysBetween(isoTs(e.stageAt), today())) || 0;
  const st = Funnels.stage(fid, e.stage);
  const lateTone = !st || st.won || e.stage === 'lost' ? '' : late > 14 ? 'late' : '';
  const nextTask = Ev.list(e).filter(x => x.kind === 'task' && !x.done).sort((a, b) => String(a.due).localeCompare(String(b.due)))[0];
  const due = nextTask && nextTask.due ? `<span class="kc-due ${nextTask.due < today() ? 'late' : nextTask.due === today() ? 'today' : ''}" title="${esc(nextTask.title)}">${icon('clock')}${dayOrWhen(nextTask.due)}</span>` : '';
  const m = Team.get(e.manager);
  const can = entityCanEdit(col, e);
  let mid = '', money = '';
  if (col === 'clients') {
    const d = cx(e);
    mid = `${e.org ? `<div class="kc-org">${esc(e.org)}</div>` : e.city ? `<div class="kc-org">${esc(e.city)}${e.niche ? ' · ' + esc(e.niche) : ''}</div>` : ''}
      ${(e.tags || []).length ? `<div class="tags-line">${tagsHtml(e.tags, 2)}</div>` : ''}`;
    if (d.pending.length) money = `<span class="kc-money">${rub(sum(d.pending, p => p.amount || settings().price))}</span>`;
    else if (d.ltv) money = `<span class="kc-money">${rubK(d.ltv)}</span>`;
    if (d.waiting) money = `<span class="pill rose" title="Ждёт ответа">ждёт ответа</span>` + money;
  } else if (col === 'experts') {
    const s = Experts.stats(e);
    mid = `<div class="kc-org">${esc(e.direction || '')}${e.audience ? ` · ${fmt(e.audience)} подписчиков` : ''}</div>
      <div class="kc-row">${s.content.length ? `${icon('cam')}${s.live}/${s.content.length} МК` : ''}${e.shootAt ? `<span>съёмка ${dayShort(e.shootAt)}</span>` : ''}</div>`;
    if (s.revenue) money = `<span class="kc-money">${rubK(s.revenue)}</span>`;
  } else {
    const s = Partners.stats(e);
    mid = `<div class="kc-org">${esc(e.category || '')} · ${esc(e.city || '')}</div>
      <div class="kc-row">${Partners.offers(e).length ? `<span class="pill gold">${icon('gift')}${Partners.offers(e).length}</span>` : ''}${s.n ? `<span>${s.n} ${plural(s.n, 'клиентка', 'клиентки', 'клиенток')}</span>` : ''}</div>`;
  }
  return `<div class="kc ${can ? 'can' : ''} ${col === 'clients' && cx(e).waiting ? 'waiting' : ''}" data-task="${e.id}" data-href="${entHref(col, e)}" tabindex="0">
    <div class="kc-name">${esc(entName(col, e))}</div>
    ${mid}
    <div class="kc-row">${m ? Team.av(m) : '<span class="av none" title="Без менеджера">?</span>'}<span class="kc-days ${lateTone}" title="Дней на этапе">${late} дн.</span>${due}<span class="sp"></span>${money}</div>
  </div>`;
}

App.register('funnels', {
  title: 'Воронки',
  render(root) {
    const list = Funnels.list().filter(f => f.entity !== 'clients' || Who.can('clients.view')).filter(f => f.entity === 'clients' || Who.can(f.entity + '.view'));
    let fid = View.get('fn.id', 'sales');
    if (!list.find(f => f.id === fid)) fid = list[0].id;
    const f = Funnels.get(fid);
    const col = f.entity;
    const view = View.get('fn.view', 'board');
    const segF = col === 'clients' ? View.get('fn.seg', '') : '';
    const mgrF = View.get('fn.mgr', '');
    const q = View.get('fn.q', '').trim().toLowerCase();
    const all = entityList(col).filter(e => Funnels.of(col, e) === fid);
    const segs = col === 'clients' ? Segments.all() : [];
    const segOf = e => cx(e).segment;
    let items = all.filter(e => {
      if (segF === 'none' && segOf(e)) return false;
      if (segF && segF !== 'none') { const s = segOf(e); if (!s || s.id !== segF) return false; }
      if (mgrF === 'me' && e.manager !== Who.id()) return false;
      if (mgrF === 'none' && e.manager) return false;
      if (q && !entName(col, e).toLowerCase().includes(q) && !String(e.org || e.city || '').toLowerCase().includes(q)) return false;
      return true;
    });
    const canAdd = col === 'clients' ? Who.can('clients.edit') : Who.can(col + '.edit');

    const tabs = list.map(x => [x.id, x.name, entityList(x.entity).filter(e => Funnels.of(x.entity, e) === x.id && e.stage !== 'lost').length]);
    const segStrip = col === 'clients' ? `<div class="seg-strip">
      <button class="chip ${!segF ? 'on' : ''}" data-segf="">Все <b>${all.length}</b></button>
      ${segs.map(s => { const n = all.filter(e => (segOf(e) || {}).id === s.id).length; return `<button class="chip ${segF === s.id ? 'on' : ''}" data-segf="${s.id}" title="${esc((s.rules || []).map(ruleText).join(s.match === 'any' ? ' или ' : ' и '))}"><i class="dot" style="background:${esc(s.color)}"></i>${esc(s.name)} <b>${n}</b></button>`; }).join('')}
      <button class="chip ${segF === 'none' ? 'on' : ''}" data-segf="none">Без сегмента <b>${all.filter(e => !segOf(e)).length}</b></button>
      ${Who.can('funnels.edit') ? '<a class="btn sm ghost" href="#settings" data-goset="segments">+ Сегмент и условия</a>' : ''}
    </div>` : '';

    let content = '';
    if (view === 'board') {
      const cols = [...f.stages.map(s => ({s, items: items.filter(e => e.stage === s.id)})), {s: {...LOST, about: 'Отказ с причиной. Раз в квартал — вернуться с новым предложением.'}, items: items.filter(e => e.stage === 'lost'), lost: true}];
      const orphan = items.filter(e => e.stage !== 'lost' && !f.stages.some(s => s.id === e.stage));
      if (orphan.length) cols[0].items.push(...orphan);
      const sumOf = (s, its) => {
        if (col !== 'clients') return '';
        if (s.id === 'invoice') { const v = sum(its, e => sum(cx(e).pending, p => p.amount || settings().price)); return v ? `ждём ${rubK(v)}` : ''; }
        if (s.won) { const v = sum(its, e => cx(e).ltv); return v ? `принесли ${rubK(v)}` : ''; }
        return '';
      };
      const collapsedLost = View.get('fn.lostOpen', false);
      content = `<div class="kb" id="board">${cols.map(({s, items: its, lost}) => `
        <div class="kb-col ${lost ? 'lost-col' : ''} ${s.won ? 'won-col' : ''}" data-col="${s.id}">
          <div class="kb-h"><b>${esc(s.name)}</b>${s.about ? `<button class="help-dot" title="${esc(s.about)}" data-nodrag>?</button>` : ''}<span class="kb-n">${its.length}</span>${sumOf(s, its) ? `<span class="kb-sum">${sumOf(s, its)}</span>` : ''}</div>
          <div class="kb-list">${(lost && !collapsedLost && its.length > 3 ? its.slice(0, 3) : its).sort((a, b) => (b.stageAt || 0) - (a.stageAt || 0)).map(e => kanbanCard(col, e, fid)).join('')}
            ${lost && !collapsedLost && its.length > 3 ? `<button class="kb-more-done" data-lost-open>Показать все отказы (${its.length})</button>` : ''}
            ${canAdd && !lost && !Who.readOnly() ? `<button class="kb-add" data-add="${s.id}">${icon('plus')}Добавить</button>` : ''}</div>
        </div>`).join('')}</div>`;
    } else if (view === 'matrix' && col === 'clients') {
      const rows = [...segs.map(s => ({id: s.id, name: s.name, color: s.color, list: all.filter(e => (segOf(e) || {}).id === s.id)})), {id: 'none', name: 'Без сегмента', color: 'var(--ink-3)', list: all.filter(e => !segOf(e))}];
      const max = Math.max(1, ...rows.flatMap(r => f.stages.map(s => r.list.filter(e => e.stage === s.id).length)));
      content = `<div class="table-wrap"><table class="t matrix"><thead><tr><th>Сегмент</th>${f.stages.map(s => `<th class="c">${esc(s.name)}</th>`).join('')}<th class="c">Отказ</th><th class="r">Всего</th><th class="r">Конверсия в оплату</th></tr></thead><tbody>
        ${rows.map(r => {
          const won = r.list.filter(e => f.stages.find(s => s.id === e.stage && s.won)).length;
          const lead = r.list.filter(e => Funnels.idx(fid, e.stage) >= Funnels.idx(fid, 'lead') || e.stage === 'lost').length;
          return `<tr><td><span class="row" style="gap:8px;align-items:center;flex-wrap:nowrap"><i class="dot" style="background:${esc(r.color)}"></i>${esc(r.name)}</span></td>
          ${f.stages.map(s => { const n = r.list.filter(e => e.stage === s.id).length; return `<td class="cell ${n ? '' : 'zero'}" data-cell="${r.id}"><span class="heat" style="background:color-mix(in srgb, var(--link) ${Math.round(n / max * 38)}%, transparent)"><b>${n}</b></span></td>`; }).join('')}
          <td class="cell ${r.list.filter(e => e.stage === 'lost').length ? '' : 'zero'}" data-cell="${r.id}">${r.list.filter(e => e.stage === 'lost').length}</td>
          <td class="r">${r.list.length}</td><td class="r">${lead ? pct(won / lead) : '—'} <small class="muted">${won}/${lead}</small></td></tr>`;
        }).join('')}
      </tbody></table></div>
      <p class="note" style="margin-top:8px">Конверсия — от заявки до оплаты: сколько из дошедших до «Заявка получена» оплатили. Нажмите на ячейку, чтобы открыть этот сегмент на доске.</p>`;
    } else {
      content = `<div class="crit">${f.stages.map((s, i) => {
        const its = all.filter(e => e.stage === s.id);
        const avg = its.length ? Math.round(sum(its, e => (e.stageAt ? daysBetween(isoTs(e.stageAt), today()) : 0)) / its.length) : 0;
        return `<div><b>${i + 1}. ${esc(s.name)}${s.won ? ' ✓' : ''}</b>${esc(s.about || 'Критерий не задан')}<p class="note" style="margin-top:6px">сейчас: ${its.length} · в среднем ${avg} дн. на этапе</p></div>`;
      }).join('')}<div><b>Отказ</b>Причина обязательна: ${esc(LOST_REASONS.join(', '))}.<p class="note" style="margin-top:6px">сейчас: ${all.filter(e => e.stage === 'lost').length}</p></div></div>
      <p class="note">${esc(f.about || '')}${Who.can('funnels.edit') ? ' Этапы и критерии меняются в «Настройках → Воронки».' : ''}</p>`;
    }

    root.innerHTML = `
      ${pageHead('Воронки', esc(f.about || ''), `${Who.can('funnels.edit') ? `<a class="btn" href="#settings" data-goset="funnels">${icon('gear')}Этапы</a>` : ''}${canAdd && !Who.readOnly() ? `<button class="btn primary" data-add="${f.stages[0].id}">${icon('plus')}${col === 'clients' ? 'Клиентка' : col === 'experts' ? 'Эксперт' : 'Партнёр'}</button>` : ''}`)}
      ${tabsHtml('fn.id', tabs, fid)}
      ${segStrip}
      <div class="t-bar">
        <input class="input sm t-search" id="fnQ" placeholder="Поиск по имени" value="${esc(View.get('fn.q', ''))}">
        <select class="select sm" id="fnMgr">${opts([['', 'Все менеджеры'], ['me', 'Мои'], ['none', 'Без менеджера']], mgrF)}</select>
        <span class="t-bar-sp"></span>
        <div class="seg">${[['board', 'Доска'], ...(col === 'clients' ? [['matrix', 'Сегменты × этапы']] : []), ['stages', 'Критерии этапов']].map(([k, n]) => `<button data-fnview="${k}" class="${view === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      </div>
      ${view === 'board' ? `<p class="note" style="margin:-6px 0 10px">Перетащите карточку в другой этап: мышью — сразу, пальцем — подержите полсекунды. В «Отказ» — с причиной.</p>` : ''}
      ${content}`;

    wireTabs(root);
    let qt;
    $('#fnQ', root).oninput = e => { clearTimeout(qt); const v = e.target.value; qt = setTimeout(() => { View.set('fn.q', v); App.render({focus: 'fnQ'}); }, 250); };
    $('#fnMgr', root).onchange = e => { View.set('fn.mgr', e.target.value); App.render(); };
    on(root, 'click', '[data-segf]', (e, el) => { View.set('fn.seg', el.dataset.segf); App.render(); });
    on(root, 'click', '[data-fnview]', (e, el) => { View.set('fn.view', el.dataset.fnview); App.render(); });
    on(root, 'click', '[data-cell]', (e, el) => { View.set('fn.seg', el.dataset.cell); View.set('fn.view', 'board'); App.render(); });
    on(root, 'click', '[data-lost-open]', () => { View.set('fn.lostOpen', true); App.render(); });
    on(root, 'click', '[data-goset]', (e, el) => { View.set('st.tab', el.dataset.goset); });
    on(root, 'click', '[data-add]', (e, el) => {
      if (col === 'clients') openClientForm(null), setTimeout(() => { const s = $('#ff-stage'); if (s) s.value = el.dataset.add; const fn = $('#ff-funnel'); if (fn) fn.value = fid; }, 20);
      else if (col === 'experts') openExpertForm(null, el.dataset.add);
      else openPartnerForm(null, el.dataset.add);
    });
    on(root, 'click', '.kc', (e, el) => { if (e.target.closest('button, a')) return; location.hash = el.dataset.href; });
    on(root, 'keydown', '.kc', (e, el) => { if (e.key === 'Enter') location.hash = el.dataset.href; });
    const board = $('#board', root);
    if (board) Drag.board(board, {
      canDrag: id => entityCanEdit(col, Store.get(col, id)),
      onDrop: async (id, stage) => {
        const e = Store.get(col, id);
        if (!e || e.stage === stage) { App.render(); return; }
        let reason = '';
        if (stage === 'lost') {
          const anchor = $(`[data-col="lost"] .kb-h`, root) || root;
          reason = await pickPop(anchor, LOST_REASONS.map(r => [r, r]), '');
          if (reason === null) { App.render(); return; }
        }
        moveStage(col, id, stage, {reason});
        const nm = (Funnels.stage(fid, stage) || {}).name;
        toast(`${entName(col, e)} → ${nm}`, {undo: () => moveStage(col, id, e.stage, {reason: 'отмена переноса'})});
      },
    });
  },
});

/* ── 40-inbox.js ── */
/* Сообщения: вся переписка в одном окне — Telegram, WhatsApp, MAX, почта,
   SMS — и групповые чаты. Сообщение, адресованное в групповой чат
   конференции, показывается в этом чате у всех участниц и попадает в
   историю каждой из них. Ещё здесь — новые заявки из приложения. */

App.register('inbox', {
  title: 'Сообщения',
  render(root) {
    const filter = View.get('ib.f', 'all');
    let sel = View.get('ib.sel', '');
    if (!sel && window.innerWidth > 880) { const w = Inbox.threads().find(c => cx(c).waiting); sel = w ? w.id : Chats.all()[0] ? 'chat:' + Chats.all()[0].id : ''; }
    const q = View.get('ib.q', '').trim().toLowerCase();
    const threads = Inbox.threads().filter(c => {
      const d = cx(c);
      if (filter === 'wait' && !d.waiting) return false;
      if (filter === 'unread' && !d.unread) return false;
      if (MSG_CH.includes(filter) && !d.msgs.some(m => m.ch === filter)) return false;
      if (q && !Clients.name(c).toLowerCase().includes(q)) return false;
      return true;
    });
    const chats = Chats.all();
    const apps = newApplications();
    const counts = {all: Inbox.threads().length, wait: Inbox.threads().filter(c => cx(c).waiting).length, unread: Inbox.threads().filter(c => cx(c).unread).length};

    const listHtml = () => {
      if (filter === 'apps') {
        return apps.length ? apps.map(a => `<a class="ib-i" href="${a.href}">${avatar(a.name)}<div class="ib-i-b"><div class="ib-i-t"><span class="nm">${esc(a.name)}</span><time>${timeAgo(a.t)}</time></div><div class="ib-i-p"><span class="pill ${a.tone}">${esc(a.kind)}</span><span class="snip">${esc(a.text)}</span></div></div></a>`).join('')
          : '<div class="ib-empty">Новых заявок нет</div>';
      }
      const groupPart = (filter === 'all' || filter === 'group') && chats.length ? `<div class="ib-sec">Групповые чаты</div>${chats.map(ch => {

        return `<a class="ib-i ${sel === 'chat:' + ch.id ? 'on' : ''}" href="#inbox" data-sel="chat:${ch.id}"><span class="ib-group-ico">${icon('users')}</span><div class="ib-i-b"><div class="ib-i-t"><span class="nm">${esc(ch.name.split(' · ')[0])}</span>${last ? `<time>${timeAgo(last.t)}</time>` : ''}</div><div class="ib-i-p">${chBadge(ch.ch || 'tg')}<span class="snip">${last ? esc(msgAuthor(last).split(' ')[0] + ': ' + last.text) : 'сообщений пока нет'}</span></div></div></a>`;
      }).join('')}` : '';
      if (filter === 'group') return groupPart;
      const personal = threads.map(c => {
        const d = cx(c), m = d.lastMsg;
        return `<a class="ib-i ${sel === c.id ? 'on' : ''} ${d.unread ? 'unread' : ''}" href="#inbox" data-sel="${c.id}">${avatar(Clients.name(c))}<div class="ib-i-b">

function msgAuthor(m) {
  if (!m.from) return '';
  if (m.from.type === 'team') return Team.name(Team.get(m.from.id));
  if (m.from.type === 'client') return Clients.name(Clients.get(m.from.id));
  return '';
}

  const d = cx(c);
  const items = [...d.msgs, ...d.groupMsgs.map(m => ({...m, kind: 'group'}))].sort((a, b) => a.t - b.t);

  const body = items.map(m => {
    const dd = isoTs(m.t);
    const sep = dd !== last ? `<div class="tl-day">${dd === today() ? 'Сегодня' : cap(dayWd(dd))}</div>` : '';
    last = dd;
    if (m.kind === 'group') return sep + `<div class="bub in"><div class="bub-who">${chBadge('group')} в чате «${esc(m.chatName.split(' · ')[0])}»</div>${esc(m.text)}<div class="bub-meta">${hm(m.t)}</div></div>`;

      <a class="btn sm" href="#client-${c.id}">Карточка</a>

        ${tpl.length ? `<select class="select" id="ibTpl">${opt('', 'Шаблон…', '')}${tpl.map(t => opt(t.id, t.name, '')).join('')}</select>` : ''}
