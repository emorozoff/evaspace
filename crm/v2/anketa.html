<title>Анкета Eva</title>
<meta name="description" content="Короткая анкета Eva Space: несколько вопросов кнопками — помогите нам сделать Еву лучше.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Анкета Eva: мягкая, мобильная, одна мысль на экран. Стиль Eva Space v2:
   графит и приглушённая фуксия, белая путеводная звезда на сливовом
   градиенте; фон — тёплый светлый или ночной. */
:root{
  --bg:#F7F6F4; --bg-2:#F4E6EC; --card:#FFFFFF; --ink:#111014; --ink-2:#4A4650; --ink-3:#7E7A85;
  --line:#E6E2DE; --rose:#C2506F; --rose-soft:#F7E9EE; --plum:#2B2233; --gold:#B8894A; --violet:#A8375C; --violet-soft:#F7E9EE;
  --grad:linear-gradient(155deg,#1A171F 0%,#2B2233 55%,#4A2C42 100%);
  --shadow:0 10px 40px rgba(17,16,20,.08);
  --f-display:'Unbounded', 'Inter', system-ui, sans-serif;
  --f-text:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121014; --bg-2:#2A1822; --card:#1B181F; --ink:#F3EFF4; --ink-2:#C4BCC9; --ink-3:#938B9A;
    --line:#2E2934; --rose:#E693B0; --rose-soft:#3A2230; --plum:#E7C58B; --gold:#E7C58B; --violet:#E693B0; --violet-soft:#3A2230;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121014; --bg-2:#2A1822; --card:#1B181F; --ink:#F3EFF4; --ink-2:#C4BCC9; --ink-3:#938B9A;
  --line:#2E2934; --rose:#E693B0; --rose-soft:#3A2230; --plum:#E7C58B; --gold:#E7C58B; --violet:#E693B0; --violet-soft:#3A2230;
  --shadow:0 10px 40px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{min-height:100%;}
body{margin:0; background:radial-gradient(900px 420px at 90% -10%, var(--bg-2), transparent 70%), var(--bg); color:var(--ink); font:16px/1.5 var(--f-text); -webkit-font-smoothing:antialiased;}
button,input,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--violet); outline-offset:2px;}
[hidden]{display:none !important;}
.wrap{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:24px 48px; display:flex; flex-direction:column; gap:14px;}
.top{display:flex; align-items:center; gap:12px;}
.mark{width:34px; height:34px; flex:0 0 34px; display:block;}
.mark svg, .big svg{display:block; width:100%; height:100%; border-radius:22%;}
.brand{font:400 13px var(--f-display); letter-spacing:.2em; text-transform:uppercase;}
.count{margin-left:auto; font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden;}
.bar i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg, var(--rose), var(--violet)); transition:width .3s ease;}
.card{background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:26px 22px; display:flex; flex-direction:column; gap:16px;}
h1{margin:0; font:600 24px/1.25 var(--f-display); letter-spacing:-.01em; text-wrap:balance;}
h2{margin:0; font:600 20px/1.35 var(--f-display); letter-spacing:-.01em; text-wrap:balance;}
p{margin:0;}
.lead{color:var(--ink-2); font-size:15px;}
.small{font-size:12.5px; color:var(--ink-3); line-height:1.5;}
.intro{text-align:center; align-items:center;}
.big{font-size:52px; line-height:1;}
.big.mark-big{width:64px; height:64px; margin:0 auto;}
.opts{display:flex; flex-direction:column; gap:8px;}
.opt{min-height:52px; width:100%; text-align:left; padding:12px 16px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); font-size:15.5px; font-weight:500; display:flex; align-items:center; gap:10px; transition:border-color .12s, background .12s, transform .08s;}
.opt:hover{border-color:var(--rose);}
.opt:active{transform:scale(.99);}
.opt.on{border-color:var(--violet); background:var(--violet-soft);}
.opt .tick{margin-left:auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:12px; flex:0 0 22px;}
.opt.on .tick{background:var(--violet); border-color:var(--violet); color:#fff;}
.scale{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px;}
.scale button{aspect-ratio:1; max-width:100%; border-radius:16px; border:1.5px solid var(--line); background:var(--card); font-size:30px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
.scale button small{font-size:11px; color:var(--ink-3);}
.scale button.on{border-color:var(--violet); background:var(--violet-soft);}
.scale-ends{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-3);}
.inp{width:100%; min-height:52px; padding:12px 16px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); font-size:16px;}
textarea.inp{min-height:110px; resize:vertical;}
textarea.inp.tall{min-height:200px;}
.inp:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 4px var(--violet-soft);}
.go{min-height:54px; border:0; border-radius:16px; background:#111014; color:#fff; font-weight:600; font-size:16px; padding:0 22px; width:100%;}
.go:disabled{opacity:.45; cursor:default;}
.go.alt{background:var(--card); color:var(--ink); border:1.5px solid var(--line);}
.nav{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.link{border:0; background:none; color:var(--ink-3); font-size:14px; padding:8px 0; text-decoration:underline; text-underline-offset:3px;}
.hint{font-size:13px; color:var(--ink-3);}
.types{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;}
.types button{border:1.5px solid var(--line); background:var(--card); border-radius:18px; padding:18px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:600;}
.types button span{font-size:34px;}
.types button:hover{border-color:var(--rose);}
.send{display:flex; flex-direction:column; gap:8px;}
.send a{min-height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; text-decoration:none; font-size:15.5px;}
.send .tg{background:#2A9FD8; color:#fff;}
.send .wa{background:#1FA855; color:#fff;}
.linkbox{width:100%; min-height:80px; font:12px/1.4 ui-monospace, Menlo, monospace; border-radius:12px; border:1px solid var(--line); background:var(--bg); padding:10px; color:var(--ink-2);}
.note{padding:12px 14px; border-radius:14px; background:var(--rose-soft); font-size:14px; line-height:1.5;}
.fade{animation:fade .22s ease-out;}
@keyframes fade{from{opacity:0; transform:translateY(6px);}}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* разделы: шапка над вопросом и оглавление на вводном экране */
.sect{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--ink-3); margin-top:-4px;}
.sect b{color:var(--ink); font-weight:600; font-size:14px;}
.sect-e{font-size:16px; line-height:1;}
.dots{display:inline-flex; gap:4px; margin-left:auto;}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--line);}
.dots i.done{background:var(--rose);}
.dots i.cur{background:var(--ink); box-shadow:0 0 0 3px var(--rose-soft);}
.meta{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.toc{list-style:none; margin:0; padding:0; width:100%; display:flex; flex-direction:column; gap:6px; text-align:left;}
.toc li{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:14px; background:var(--bg); border:1px solid var(--line);}
.toc li.done{background:var(--rose-soft); border-color:transparent;}
.toc-e{font-size:18px; width:22px; text-align:center; flex:0 0 22px;}
.toc li > span:nth-child(2){flex:1; min-width:0; display:flex; flex-direction:column;}
.toc b{font-size:14.5px; font-weight:600;}
.toc small{font-size:12px; color:var(--ink-3);}
.toc em{font-style:normal; font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
/* варианты в две колонки, когда их много и они короткие */
.opts.two{display:grid; grid-template-columns:repeat(2, minmax(0,1fr));}
@media (max-width:380px){ .opts.two{grid-template-columns:1fr;} }
.other-inp{margin-top:-6px;}
/* шкала 1–10: цифры, заливка до выбранной */
.scale10{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px;}
.scale10 button{height:52px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; transition:background .12s, border-color .12s;}
.scale10 button:hover{border-color:var(--rose);}
.scale10 button.fill{background:var(--rose-soft); border-color:transparent;}
.scale10 button.on{background:var(--violet); border-color:var(--violet); color:#fff;}
input[type=date].inp{appearance:none; -webkit-appearance:none;}

/* ── кастдев 3: «Дальше» на каждом экране, всё в один экран телефона ── */
.wrap{min-height:100vh; min-height:100dvh;}
.card.q{flex:1; gap:14px;}
.qhead{display:flex; flex-direction:column; gap:6px;}
.act{margin-top:auto; display:flex; flex-direction:column; gap:6px; padding-top:4px;}
.flash{margin:0; font-size:13.5px; color:var(--rose); text-align:center; font-weight:500;}
.opt .ot{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1;}
.opt .ot small{font-size:12.5px; font-weight:400; color:var(--ink-3); line-height:1.3;}
.opt .dot{margin-left:auto; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); flex:0 0 20px; position:relative;}
.opt.on .dot{border-color:var(--violet); background:var(--violet);}
.opt.on .dot:after{content:''; position:absolute; inset:5px; border-radius:50%; background:#fff;}
.ogroup{margin:4px 2px -2px; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
.opts.two .opt{min-height:48px;}
/* шкала 1–10: от красного к зелёному, подсказка к выбранной цифре */
.scale10.hue button{background:hsl(var(--h) 70% 94%); border-color:transparent; color:hsl(var(--h) 55% 28%);}
.scale10.hue button:hover{border-color:hsl(var(--h) 60% 55%);}
.scale10.hue button.on{background:hsl(var(--h) 62% 46%); color:#fff; box-shadow:0 0 0 3px hsl(var(--h) 70% 85%); transform:scale(1.04);}
.scale-tip{border-radius:14px; padding:11px 13px; background:var(--bg); border:1px solid var(--line); font-size:13.5px; color:var(--ink-3); min-height:64px; display:flex; flex-direction:column; gap:3px;}
.scale-tip.on{background:hsl(var(--h) 70% 96%); border-color:hsl(var(--h) 55% 80%); color:var(--ink-2);}
.scale-tip b{color:hsl(var(--h) 55% 28%); font-size:14.5px;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .scale10.hue button{background:hsl(var(--h) 35% 20%); color:hsl(var(--h) 70% 80%);}
  :root:not([data-theme="light"]) .scale10.hue button.on{background:hsl(var(--h) 55% 48%); color:#111014; box-shadow:0 0 0 3px hsl(var(--h) 40% 28%);}
  :root:not([data-theme="light"]) .scale-tip.on{background:hsl(var(--h) 30% 15%); border-color:hsl(var(--h) 35% 30%);}
  :root:not([data-theme="light"]) .scale-tip b{color:hsl(var(--h) 70% 78%);}
}
:root[data-theme="dark"] .scale10.hue button{background:hsl(var(--h) 35% 20%); color:hsl(var(--h) 70% 80%);}
:root[data-theme="dark"] .scale10.hue button.on{background:hsl(var(--h) 55% 48%); color:#111014; box-shadow:0 0 0 3px hsl(var(--h) 40% 28%);}
:root[data-theme="dark"] .scale-tip.on{background:hsl(var(--h) 30% 15%); border-color:hsl(var(--h) 35% 30%);}
:root[data-theme="dark"] .scale-tip b{color:hsl(var(--h) 70% 78%);}
/* город: подсказки и страна */
.sugg{display:flex; flex-wrap:wrap; gap:6px; margin-top:-6px;}
.sugg:empty{display:none;}
.sugg button{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 12px; font-size:14px; display:inline-flex; gap:6px; align-items:baseline;}
.sugg button small{color:var(--ink-3); font-size:12px;}
.country:empty{display:none;}
.country .ok{font-size:14px; color:var(--ink-2);}
.country .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.country .chips button{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:7px 12px; font-size:14px;}
.country .chips button.on{border-color:var(--violet); background:var(--violet-soft);}
.country .other-inp{margin-top:8px;}
/* тёплые слова на трети и двух третях */
.cheer{position:relative; overflow:hidden; min-height:340px; justify-content:center; flex:1;}
.cheer > *{position:relative;}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;}
@keyframes pop{from{transform:scale(.3); opacity:0;}}
.bloom{position:absolute !important; inset:0; pointer-events:none; overflow:hidden;}
.bloom i{position:absolute; left:var(--x); bottom:-40px; font-style:normal; font-size:calc(26px * var(--s)); animation:rise 3.6s ease-out var(--d) infinite; opacity:0;}
@keyframes rise{0%{transform:translateY(0) rotate(0) scale(.6); opacity:0;} 15%{opacity:1;} 100%{transform:translateY(-420px) rotate(40deg) scale(1.1); opacity:0;}}
/* подарок в конце */
.gift{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; border-radius:18px;
  background:linear-gradient(135deg, var(--rose-soft), var(--bg-2)); border:1px solid var(--line);}
.gift-box{font-size:40px; line-height:1; animation:pop .7s cubic-bezier(.2,1.6,.4,1) both, wiggle 2.6s ease-in-out 1s infinite;}
@keyframes wiggle{0%,86%,100%{transform:rotate(0);} 90%{transform:rotate(-10deg);} 94%{transform:rotate(9deg);} 97%{transform:rotate(-5deg);}}
.gift b{display:block; font:600 16px/1.3 var(--f-display);}
.gift span{font-size:13.5px; color:var(--ink-2);}
/* телефон: компактнее, чтобы вопрос и все варианты помещались в один экран */
@media (max-width:560px){
  .wrap{padding:10px 12px 12px; gap:8px;}
  .top{gap:10px;}
  .mark{width:28px; height:28px; flex-basis:28px;}
  .brand{font-size:11.5px;}
  .sect{font-size:12px; margin-top:0;}
  .sect b{font-size:13px;}
  .card{padding:16px 14px 12px; border-radius:18px; gap:12px;}
  .card.q{gap:11px;}
  h2{font-size:17.5px; line-height:1.3;}
  h1{font-size:21px;}
  .hint{font-size:12.5px;}
  .opts{gap:6px;}
  .opt{min-height:44px; padding:8px 12px; border-radius:13px; font-size:14.5px; gap:8px;}
  .opt .ot small{font-size:12px;}
  .opts.dense .opt{min-height:40px; padding:7px 11px; font-size:14px;}
  .opts.two{gap:6px;}
  .opts.two .opt{min-height:44px; font-size:13.5px; line-height:1.25; padding:7px 10px;}
  .opts.two .opt .dot,.opts.two .opt .tick{width:16px; height:16px; flex-basis:16px;}
  .opts.two .opt.on .dot:after{inset:4px;}
  .ogroup{font-size:10.5px;}
  .scale10 button{height:46px; font-size:17px;}
  .scale-tip{min-height:58px; font-size:12.5px; padding:9px 11px;}
  .go{min-height:48px; border-radius:14px;}
  .link{padding:4px 0; font-size:13.5px;}
  .inp{min-height:48px;}
  .toc li{padding:7px 10px;}
}
@media (max-width:380px){ .opts.two{grid-template-columns:repeat(2, minmax(0,1fr));} .opts.two .opt{font-size:13px;} }
@media (prefers-reduced-motion: reduce){ .bloom{display:none;} }
/* описание выбранного варианта под длинным списком */
.opt-tip{border-radius:12px; padding:8px 11px; background:var(--bg); border:1px solid var(--line); font-size:12.5px; color:var(--ink-3); line-height:1.4; display:flex; flex-direction:column; gap:2px; min-height:38px; justify-content:center;}
.opt-tip.on{background:var(--violet-soft); border-color:transparent; color:var(--ink-2);}
.opt-tip b{color:var(--ink); font-weight:600;}
.opts.two .ogroup{grid-column:1/-1;}
@media (max-width:560px){
  .top .brand{font-size:10.5px;}
  .bar{height:4px;}
  .wrap{gap:7px;}
  .opts.two .opt{min-height:42px;}
}
@media (max-height:700px) and (max-width:560px){
  .top{display:none;}
  .card{padding:14px 13px 10px;}
  h2{font-size:16.5px;}
  .opt{min-height:40px; padding:7px 11px; font-size:14px;}
  .opts.two .opt{min-height:40px; font-size:13px; padding:6px 9px;}
  .opts.dense .opt{min-height:38px;}
  .go{min-height:46px;}
  .scale10 button{height:42px;}
}
</style>
<main class="wrap" id="app">
  <div class="card intro"><div class="big">🌸</div><h1>Eva</h1><p>Загружаю анкету…</p></div>
</main>
<script>
(() => {
'use strict';
/* ── 05-brand.js ── */
/* Знак Eva Space — как иконка приложения и «Книга стандартов»: белая
   путеводная звезда и две искры на сливовом градиенте с фуксиевым
   свечением. Один рисунок на CRM, анкету и вкладку браузера. */
const BRAND_STAR = 'M50 2c1.6 16.4 4.4 27.4 8.8 33.6C63.2 41.8 73.6 45.6 90 48c-16.4 2.4-26.8 6.2-31.2 12.4C54.4 66.6 51.6 79 50 98c-1.6-19-4.4-31.4-8.8-37.6C36.8 54.2 26.4 50.4 10 48c16.4-2.4 26.8-6.2 31.2-12.4C45.6 29.4 48.4 18.4 50 2z';
const BRAND_SPARK_A = 'M78 22c.4 4 1.1 6.7 2.2 8.2 1.1 1.5 3.6 2.5 7.6 3.1-4 .6-6.5 1.5-7.6 3.1-1.1 1.5-1.8 4.6-2.2 9.2-.4-4.6-1.1-7.7-2.2-9.2-1.1-1.6-3.6-2.5-7.6-3.1 4-.6 6.5-1.6 7.6-3.1 1.1-1.5 1.8-4.2 2.2-8.2z';
const BRAND_SPARK_B = 'M22 68c.3 3 .8 5 1.6 6.1.8 1.1 2.7 1.9 5.7 2.3-3 .5-4.9 1.2-5.7 2.3-.8 1.2-1.3 3.5-1.6 6.9-.3-3.4-.8-5.7-1.6-6.9-.8-1.1-2.7-1.8-5.7-2.3 3-.4 4.9-1.2 5.7-2.3.8-1.1 1.3-3.1 1.6-6.1z';
let brandSeq = 0;
function brandMark(cls = '') {
  const n = ++brandSeq, g = 'evg' + n, r = 'evr' + n;
  return `<svg viewBox="0 0 100 100" class="${cls}" aria-hidden="true">
    <defs>
      <linearGradient id="${g}" x1="0" y1="0" x2=".72" y2="1"><stop offset="0" stop-color="#1A171F"/><stop offset=".55" stop-color="#2B2233"/><stop offset="1" stop-color="#4A2C42"/></linearGradient>
      <radialGradient id="${r}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C2506F" stop-opacity=".55"/><stop offset="1" stop-color="#C2506F" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="100" height="100" rx="22" fill="url(#${g})"/>
    <circle cx="50" cy="50" r="34" fill="url(#${r})"/>
    <path d="${BRAND_STAR}" fill="#fff" transform="translate(50 50) scale(.62) translate(-50 -50)"/>
    <g fill="#fff" opacity=".85"><path d="${BRAND_SPARK_A}" transform="scale(.55) translate(63 62)"/><path d="${BRAND_SPARK_B}" transform="scale(.72) translate(6 8)"/></g>
  </svg>`;
}

/* ── 10-questions.js ── */
/* База вопросов Eva CRM 2.0 — общая для CRM и публичной анкеты.
   У каждой группы два набора:
   • test — анкета: быстрые ответы кнопками, человек заполняет сам по ссылке
     или менеджер за него. Из неё собирается статистика;
   • talk — вопросы для созвона в Zoom: открытые, отвечают своими словами.
   Виды вопросов: one — один вариант, many — несколько (max — сколько),
   scale — шкала 1–5 или 1–10 (n), date — дата, short — короткий текст,

/* Одна ссылка на человека — и для анкеты, и для рефералки.
   Ссылка анкеты:  <анкета>#k.ANNA482          k — клиентка, e — эксперт, p — партнёр, a — амбассадор
                   <анкета>#k.ANNA482.q…       хвост .q… — вопросы, которые команда добавила или скрыла
   Ссылка интервью: <анкета>#k.ANNA482.i(.q…)  те же правки, но вопросов интервью; ответы сервер кладёт в карточку
   Ответы назад:   <CRM>#in.z…                 z — сжатые ответы, j — без сжатия
   В адресе после # разрешены только буквы, цифры и . _ ~ - — поэтому
   данные упакованы в base64url. */

const Codec = {
  b64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  unb64(str) {
    let b = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const bin = atob(b);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },
  encJson(obj) { return this.b64(new TextEncoder().encode(JSON.stringify(obj))); },
  decJson(str) { return JSON.parse(new TextDecoder().decode(this.unb64(str))); },
  /* сжатие, где браузер умеет (CompressionStream); иначе — как есть */
  async pack(obj) {
    const raw = new TextEncoder().encode(JSON.stringify(obj));
    try {
      if (typeof CompressionStream === 'function') {
        const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        const buf = new Uint8Array(await new Response(cs).arrayBuffer());
        if (buf.length < raw.length) return 'z' + this.b64(buf);
      }
    } catch (e) { /* ниже — без сжатия */ }
    return 'j' + this.b64(raw);
  },
  async unpack(str) {
    const s = String(str || '').trim();
    const body = s.slice(1);
    if (s[0] === 'j') return JSON.parse(new TextDecoder().decode(this.unb64(body)));
    if (s[0] === 'z') {
      const ds = new Blob([this.unb64(body)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return JSON.parse(await new Response(ds).text());
    }
    throw new Error('Не похоже на ответы анкеты');
  },
  /* разбор хвоста ссылки анкеты: k.ANNA482.q… */
  parseAnketaHash(h) {
    const parts = String(h || '').replace(/^#/, '').split('.');
    const type = TYPE_BY_LETTER[parts[0]] || null;
    const code = parts[1] && /^[A-Za-z0-9_-]{2,40}$/.test(parts[1]) ? parts[1].toUpperCase() : '';
    let diff = null;
    const q = parts.find((p, i) => i >= 2 && p[0] === 'q');
    if (q) { try { diff = this.decJson(q.slice(1)); } catch (e) { diff = null; } }
    return {type, code, diff, talk: parts.slice(2).includes('i')};
  },
  /* найти ответы в любом тексте: ссылке, сообщении из Telegram, чистом коде */
  findPayload(text) {
    const s = String(text || '');
    const m = s.match(/#in\.([zj][A-Za-z0-9_-]+)/) || s.match(/\bin\.([zj][A-Za-z0-9_-]{20,})/) || s.match(/^\s*([zj][A-Za-z0-9_-]{20,})\s*$/);
    return m ? m[1] : null;
  },
};

  const base = ((Q_DEFAULT[type] || {})[part] || []).map(q => ({...q}));

}

  client:  {emo: '🌸', title: 'Привет! Помоги нам сделать Еву лучше 💜', lead: 'Почти всё — кнопками. Здесь нет правильных ответов: нам важен твой честный опыт. В конце — подарок 🎁', min: 8},
  expert:  {emo: '🎓', title: 'Давайте знакомиться ✨', lead: 'Несколько вопросов о вашем опыте и о том, что можно создать вместе с Евой.', min: 4},
  partner: {emo: '🤝', title: 'Давайте дружить 🤝', lead: 'Расскажите о себе — подберём формат, выгодный обеим сторонам.', min: 3},
  amb:     {emo: '📣', title: 'Стань голосом Евы 💜', lead: 'Расскажи о себе и своей аудитории — придумаем, как тебе удобнее делиться Евой.', min: 3},
};
/* интервью по ссылке: те же люди, вопросы — открытые */
const INTRO_TALK = {
  client:  {emo: '💬', title: 'Интервью Eva 💜', lead: 'Ответь своими словами — как рассказала бы подруге. Коротко или подробно, как удобно. Любой вопрос можно пропустить.', min: 25},
  expert:  {emo: '💬', title: 'Вопросы о вашем опыте ✨', lead: 'Ответьте своими словами. Любой вопрос можно пропустить.', min: 15},
  partner: {emo: '💬', title: 'Вопросы о вашем бизнесе 🤝', lead: 'Ответьте своими словами. Любой вопрос можно пропустить.', min: 15},
  amb:     {emo: '💬', title: 'Расскажи о себе 💜', lead: 'Ответь своими словами. Любой вопрос можно пропустить.', min: 15},
};
const TALK_MAX = 4000;
/* вопрос интервью — развёрнутый ответ, можно пропустить */
const asText = q => ({...q, k: 'text', opt: true});
/* тёплые слова на трети пути — одно из списка */
const CHEERS = [
  'Ты делаешь то, до чего у многих не доходят руки, — честно смотришь на свою жизнь. Это уже забота о себе.',
  'Спасибо за искренность. Такие ответы помогают сделать Еву по-настоящему твоей.',
  'Ты замечательная — и то, как внимательно ты отвечаешь, это только подтверждает.',
  'Каждый ответ — маленький шаг к себе. Ты уже прошла треть, и это прекрасно.',
];

const S = {type: null, code: '', talk: false, invited: false, all: [], i: -1, a: {}, key: '', m: {}};
const part = () => (S.talk ? 'talk' : 'test');

function init() {
  const h = Codec.parseAnketaHash(location.hash);
  S.type = h.type;
  S.code = h.code;
  /* интервью — только для своей карточки: без кода ответы некуда положить */
  S.talk = !!(h.talk && h.code);
  setQuestions(h.type ? applyDiff(h.type, h.diff, part()) : []);
  S.key = `eva-anketa:${S.talk ? 'talk:' : ''}${h.type || ''}:${h.code || 'new'}`;
  const saved = store.get(S.key);
  if (saved && saved.a) { S.a = saved.a; S.invited = !!saved.invited; S.m = saved.m || {}; }
  if (!S.type) return renderChooser();
  S.i = -1;
  render();
}
/* вопросы по разделам: добавленный в раздел позже идёт внутри своего раздела */
function setQuestions(qs) { S.all = S.type ? groupByBlock(S.type, part(), S.talk ? qs.map(asText) : qs).flatMap(x => x.qs) : []; }
/* какие вопросы видны сейчас: без автоматических (страна) и без тех, чьё условие не выполнено */
function qs() { return S.all.filter(q => qVisible(q, S.a)); }
function blocks() { return groupByBlock(S.type, part(), qs()); }
function save() { store.set(S.key, {a: S.a, invited: S.invited, m: S.m}); }
function total() { return qs().length; }
/* в каком разделе вопрос: номер раздела, его вопросы и место внутри */
function where(i) {
  const q = qs()[i], bl = blocks();
  const bi = bl.findIndex(b => b.qs.includes(q));
  const b = bl[bi] || {qs: [q], name: ''};
  return {bi, b, j: b.qs.indexOf(q), n: bl.length};
}

function shell(inner, withTop = true) {
  const inQ = S.i >= 0 && S.i < total();
  const pct = S.i < 0 ? 0 : Math.round((S.i / total()) * 100);
  const w = inQ ? where(S.i) : null;
  const named = w && w.b.name && w.n > 1;
  $('#app').innerHTML = `${withTop ? `<div class="top"><span class="mark">${brandMark()}</span><span class="brand">Eva Space</span>${inQ ? `<span class="count">${S.i + 1} из ${total()}</span>` : ''}</div>
    ${inQ ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
    ${named ? `<div class="sect"><span class="sect-e" aria-hidden="true">${w.b.emo || '•'}</span><b>${esc(w.b.name)}</b><span>${w.bi + 1} из ${w.n}</span>
      <span class="dots" aria-hidden="true">${w.b.qs.map((x, k) => `<i class="${k < w.j ? 'done' : k === w.j ? 'cur' : ''}"></i>`).join('')}</span></div>` : ''}` : ''}${inner}`;
}

function renderChooser() {
  S.i = -1;
  shell(`<div class="card intro fade"><div class="big mark-big">${brandMark()}</div><h1>Кто вы?</h1><p class="lead">Выберите — и покажем вопросы для вас</p>
    <div class="types">${Object.entries(TYPES).map(([k, t]) => `<button data-t="${k}"><span>${t.emo}</span>${t.one}</button>`).join('')}</div></div>`);
  $('#app').onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    S.type = b.dataset.t;
    setQuestions(applyDiff(S.type, null));
    S.key = `eva-anketa:${S.type}:new`;
    const saved = store.get(S.key);
    S.a = saved && saved.a ? saved.a : {};
    S.m = saved && saved.m ? saved.m : {};
    S.i = -1;
    render();
  };
}

/* «Другое» хранится как «Другое: свой ответ» */
const isOther = (q, v) => !!q.other && (v === q.other || String(v || '').startsWith(q.other + OTHER_SEP));
const withOther = (q, text) => (text ? `${q.other}${OTHER_SEP}${text}` : q.other);
const canSkip = q => q.k === 'many' || q.k === 'date' || q.opt || (q.k === 'short' && q.key !== 'name' && !q.city) || q.k === 'text';
const answered = (q, v) => !(v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length));
/* подсказка у вопросов с несколькими ответами */
function pickHint(q) {
  if (q.k !== 'many') return '';
  if (q.hint) return q.hint;
  return q.max === 2 ? 'Выбери один или два варианта' : q.max ? `Выбери до ${q.max === 3 ? 'трёх' : q.max} вариантов` : 'Выбери один или несколько вариантов';
}
/* pick — длинный список с описаниями: два столбца, описание выбранного — под списком */
const optBtn = (q, o, j, on, pick) => {
  const d = pick ? '' : optDesc(q, o);
  return `<button class="opt ${on ? 'on' : ''}" data-o="${j}" aria-pressed="${on ? 'true' : 'false'}"><span class="ot"><span>${esc(o)}</span>${d ? `<small>${esc(d)}</small>` : ''}</span>${q.k === 'many' ? `<span class="tick">${on ? '✓' : ''}</span>` : '<span class="dot"></span>'}</button>`;
};

function render() {
  if (S.i < 0) return renderIntro();
  if (S.i >= total()) return renderDone();
  const q = qs()[S.i];
  const v = S.a[q.id];
  let ctl = '';
  if (q.k === 'one' || q.k === 'many') {
    let sel = q.k === 'one' ? [v] : (Array.isArray(v) ? v : v ? [v] : []);
    /* этап жизни: только варианты выбранной сферы; чужие отметки снимаем */
    const idx = depOptions(q, S.a);
    if (q.dep && q.k === 'many') { const keep = sel.filter(x => idx.some(i => q.o[i] === x)); if (keep.length !== sel.length) { S.a[q.id] = keep; sel = keep; save(); } }
    const otherOn = sel.some(x => isOther(q, x));
    const otherVal = otherOn ? otherText(q, sel.find(x => isOther(q, x))) : '';
    const many = idx.length + (q.other ? 1 : 0);
    const pick = !!q.od && many > 5;
    const two = pick || many > 7;
    const grouped = q.groups && new Set(idx.map(i => q.g[i])).size > 1;
    const list = grouped
      ? [...new Set(idx.map(i => q.g[i]))].map(g => `<p class="ogroup">${esc(q.groups[g])}</p>${idx.filter(i => q.g[i] === g).map(i => optBtn(q, q.o[i], i, sel.includes(q.o[i]), pick)).join('')}`).join('')
      : idx.map(i => optBtn(q, q.o[i], i, sel.includes(q.o[i]), pick)).join('');
    const tips = pick ? sel.filter(x => optDesc(q, x)).map(x => `<span><b>${esc(x)}</b> — ${esc(optDesc(q, x))}</span>`) : [];
    ctl = `<div class="opts ${two ? 'two' : ''} ${many > 8 ? 'dense' : ''}">${list}${q.other ? optBtn(q, q.other, q.o.length, otherOn, pick) : ''}</div>
      ${q.other ? `<input class="inp other-inp" id="oth" value="${esc(otherVal)}" placeholder="Напиши свой вариант" maxlength="120" ${otherOn ? '' : 'hidden'}>` : ''}
      ${pick ? `<div class="opt-tip ${tips.length ? 'on' : ''}" aria-live="polite">${tips.length ? tips.join('') : '<span>Нажми на вариант — покажем, что он значит</span>'}</div>` : ''}`;
  } else if (q.k === 'scale') {
    const n = scaleN(q);
    if (n === 5) {
      ctl = `<div class="scale">${SCALE_EMO.map((e, j) => `<button class="${Number(v) === j + 1 ? 'on' : ''}" data-s="${j + 1}" aria-label="${j + 1} из 5">${e}<small>${j + 1}</small></button>`).join('')}</div>
        <div class="scale-ends"><span>1 — ${esc(q.lo || '')}</span><span>${n} — ${esc(q.hi || '')}</span></div>`;
    } else {
      const x = Number(v) || 0, tip = q.sh && x ? q.sh[x - 1] : null;
      ctl = `<div class="scale10 hue" role="radiogroup">${Array.from({length: n}, (_, j) => `<button class="${x === j + 1 ? 'on' : ''}" data-s="${j + 1}" role="radio" aria-checked="${x === j + 1}" aria-label="${j + 1} из ${n}${q.sh ? ' — ' + esc(q.sh[j][0]) : ''}" style="--h:${scaleHue(j + 1, n)}">${j + 1}</button>`).join('')}</div>
        <div class="scale-ends"><span>1 — ${esc(q.lo || '')}</span><span>${n} — ${esc(q.hi || '')}</span></div>
        <div class="scale-tip ${tip ? 'on' : ''}" style="--h:${x ? scaleHue(x, n) : 0}" aria-live="polite">${tip ? `<b>${x} · ${esc(tip[0])}</b><span>${esc(tip[1])}</span>` : `<span>${q.sh ? 'Нажми на цифру — покажем, что она значит' : 'Выбери цифру'}</span>`}</div>`;
    }
  } else if (q.k === 'date') {
    const y = new Date().getFullYear();
    ctl = `<input class="inp" id="inp" type="date" value="${esc(v || '')}" min="${y - 90}-01-01" max="${y - 12}-12-31">`;
  } else if (q.k === 'text') {
    ctl = `<textarea class="inp ${S.talk ? 'tall' : ''}" id="inp" placeholder="${esc(q.ph || (S.talk ? 'Напиши своими словами' : 'Напишите, как есть'))}">${esc(v || '')}</textarea>`;
  } else if (q.city) {
    ctl = `<input class="inp" id="inp" value="${esc(v || '')}" placeholder="${esc(q.ph || '')}" autocomplete="address-level2" autocapitalize="words">
      <div class="sugg" id="sugg"></div><div class="country" id="ctry"></div>`;
  } else {
    ctl = `<input class="inp" id="inp" value="${esc(v || '')}" placeholder="${esc(q.ph || '')}" ${q.key === 'tg' ? 'autocomplete="tel"' : q.key === 'name' ? 'autocomplete="given-name"' : ''}>`;
  }
  const last = S.i === total() - 1;
  const hint = q.k === 'many' ? pickHint(q) : q.city ? '' : q.hint || '';
  shell(`<div class="card q fade"><div class="qhead"><h2>${esc(q.t)}</h2>${hint ? `<p class="hint">${esc(hint)}</p>` : ''}</div>${ctl}
    <div class="act"><button class="go" id="next">${last ? 'Готово 🎉' : 'Дальше →'}</button>
    <div class="nav"><button class="link" id="back">← Назад</button>${canSkip(q) ? '<button class="link" id="skip">Пропустить</button>' : '<span></span>'}</div></div></div>`);
  const inp = $('#inp'), oth = $('#oth');
  if (inp && q.k !== 'date' && !matchMedia('(pointer:coarse)').matches) inp.focus();
  if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter' && (q.k === 'short' || e.ctrlKey || e.metaKey)) { e.preventDefault(); next(); } });
  if (q.city) wireCity(q, inp);
  if (oth) {
    if (!oth.hidden && !oth.value) oth.focus();
    oth.addEventListener('input', () => {
      const text = oth.value.trim().slice(0, 120);
      if (q.k === 'one') S.a[q.id] = withOther(q, text);
      else S.a[q.id] = (S.a[q.id] || []).map(x => (isOther(q, x) ? withOther(q, text) : x));
      save();
    });
    oth.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); next(); } });
  }
  $('#app').onclick = e => {
    const o = e.target.closest('[data-o]');
    const s = e.target.closest('[data-s]');
    if (o) {
      const j = Number(o.dataset.o);
      const isOth = j >= q.o.length;
      const label = isOth ? withOther(q, oth ? oth.value.trim() : '') : q.o[j];
      if (q.k === 'one') { S.a[q.id] = label; save(); render(); return; }
      const cur = (Array.isArray(S.a[q.id]) ? S.a[q.id] : S.a[q.id] ? [S.a[q.id]] : []).slice();
      const at = cur.findIndex(x => (isOth ? isOther(q, x) : x === label));
      if (at >= 0) cur.splice(at, 1);
      else { if (q.max && cur.length >= q.max) { flash(q.max === 2 ? 'Можно выбрать два — сними одну отметку' : `Можно выбрать до ${q.max}`); return; } cur.push(label); }
      S.a[q.id] = cur;
      save();
      render();
      return;
    }
    if (s) { S.a[q.id] = Number(s.dataset.s); save(); render(); return; }
    if (e.target.closest('#next')) next();
    if (e.target.closest('#back')) { S.i--; render(); }
    if (e.target.closest('#skip')) { delete S.a[q.id]; if (q.city) delete S.a.country; save(); go(); }
  };
  function next() {
    if (inp) {
      const val = inp.value.trim();
      if (!val && q.key === 'name') { inp.focus(); flash('Как к тебе обращаться? 🙂'); return; }
      if (q.city) {
        if (!val) { inp.focus(); flash('Напиши город — так мы поймём, где ты'); return; }
        const m = cityCountry(val);
        S.a[q.id] = (m ? m[0] : val).slice(0, 80);
        if (m) S.a.country = m[1];
        else if (!S.a.country) { flash('Выбери страну — город мы не узнали'); return; }
        save();
        return go();
      }
      if (val) S.a[q.id] = val.slice(0, S.talk ? TALK_MAX : q.k === 'text' ? 600 : 160); else delete S.a[q.id];
      save();
    }
    if (q.k === 'many' && !(S.a[q.id] || []).length) delete S.a[q.id];
    if (!inp && !canSkip(q) && !answered(q, S.a[q.id])) { flash(q.k === 'scale' ? 'Выбери цифру от 1 до ' + scaleN(q) : 'Выбери вариант'); return; }
    if (q.other && isOther(q, q.k === 'one' ? S.a[q.id] : (S.a[q.id] || []).find(x => isOther(q, x))) && oth && !oth.value.trim()) { oth.focus(); flash('Напиши свой вариант'); return; }
    go();
  }
}
/* следующий вопрос; на трети и двух третях — тёплые слова */
function go() {
  S.i++;
  const t = total();
  if (S.type === 'client' && t >= 9) {
    if (S.i === Math.round(t / 3) && !S.m.m1) { S.m.m1 = 1; save(); return cheer(1); }
    if (S.i === Math.round(t * 2 / 3) && !S.m.m2) { S.m.m2 = 1; save(); return cheer(2); }
  }
  render();
}
function cheer(k) {
  const name = S.a.name ? String(S.a.name).split(' ')[0] : '';
  const flowers = k === 2 ? `<div class="bloom" aria-hidden="true">${['🌸', '🌷', '🌼', '🌺', '💐', '🌸', '🌷', '🌼', '🌺', '🌸', '🌷', '🌼'].map((f, i) => `<i style="--x:${(i * 37) % 100}%;--d:${(i % 5) * .35}s;--s:${.9 + (i % 3) * .25}">${f}</i>`).join('')}</div>` : '';
  shell(`<div class="card intro cheer fade">${flowers}
    <div class="big pop">${k === 1 ? '💜' : '💐'}</div>
    <h1>${k === 1 ? `${name ? esc(name) + ', ты' : 'Ты'} молодец!` : 'Спасибо большое за искренние ответы!'}</h1>
    <p class="lead">${k === 1 ? esc(CHEERS[(String(S.a.name || '').length + total()) % CHEERS.length]) : 'Осталось совсем немножко — и твоя Ева станет ещё ближе к тебе 🌸'}</p>
    <p class="meta">${k === 1 ? 'Треть позади' : 'Две трети позади'} · отвечено ${S.i} из ${total()}</p>
    <button class="go" id="cont">${k === 1 ? 'Продолжаем ✨' : 'Дальше 🌷'}</button></div>`);
  $('#app').onclick = e => { if (e.target.closest('#cont')) render(); };
}
/* город: подсказки по первым буквам и страна, которую подставим сами */
function wireCity(q, inp) {
  const sugg = $('#sugg'), ctry = $('#ctry');
  const draw = () => {
    const val = inp.value.trim(), m = cityCountry(val);
    const list = m ? [] : citySuggest(val, 4);
    sugg.innerHTML = list.map(([c, k]) => `<button type="button" data-city="${esc(c)}">${esc(c)}<small>${esc(k)}</small></button>`).join('');
    if (m) { S.a.country = m[1]; save(); }
    const cq = S.all.find(x => x.id === 'country');
    if (!val) ctry.innerHTML = '';
    else if (m) ctry.innerHTML = `<span class="ok">Страна: <b>${esc(m[1])}</b> ✓</span>`;
    else if (!list.length && val.length >= 3 && cq) {
      const cur = S.a.country || '';
      ctry.innerHTML = `<p class="hint">Не узнали город — выбери страну:</p><div class="chips">${[...cq.o, cq.other].map(o => `<button type="button" class="${cur === o || (o === cq.other && isOther(cq, cur)) ? 'on' : ''}" data-ctry="${esc(o)}">${esc(o)}</button>`).join('')}</div>
        ${isOther(cq, cur) ? `<input class="inp other-inp" id="ctryo" value="${esc(otherText(cq, cur))}" placeholder="Какая страна?" maxlength="60">` : ''}`;
      const co = $('#ctryo');
      if (co) co.addEventListener('input', () => { S.a.country = withOther(cq, co.value.trim().slice(0, 60)); save(); });
    } else ctry.innerHTML = '';
  };
  inp.addEventListener('input', () => { if (!cityCountry(inp.value)) { const cq = S.all.find(x => x.id === 'country'); if (S.a.country && cq && cq.o.includes(S.a.country) && !$('#ctry .chips')) delete S.a.country; } draw(); });
  sugg.addEventListener('click', e => { const b = e.target.closest('[data-city]'); if (!b) return; inp.value = b.dataset.city; draw(); });
  ctry.addEventListener('click', e => {
    const b = e.target.closest('[data-ctry]'); if (!b) return;
    const cq = S.all.find(x => x.id === 'country');
    S.a.country = b.dataset.ctry === cq.other ? withOther(cq, '') : b.dataset.ctry;
    save(); draw();
    const co = $('#ctryo'); if (co) co.focus();
  });
  draw();
}
function flash(text) {
  let el = $('#flash');
  if (!el) { el = document.createElement('p'); el.id = 'flash'; el.className = 'flash'; el.setAttribute('role', 'alert'); $('.act').prepend(el); }
  el.textContent = text;
}

function renderIntro() {
  const I = (S.talk ? INTRO_TALK : INTRO)[S.type];
  const started = Object.keys(S.a).length;
  const bl = blocks();
  const named = bl.length > 1 && bl[0].name;
  const doneIn = b => b.qs.filter(q => S.a[q.id] !== undefined).length;
  shell(`<div class="card intro fade"><div class="big">${I.emo}</div><h1>${esc(I.title)}</h1><p class="lead">${esc(I.lead)}</p>
    <p class="meta">${total()} ${plural(total(), 'вопрос', 'вопроса', 'вопросов')} · около ${I.min} минут${named ? ` · ${bl.length} ${plural(bl.length, 'раздел', 'раздела', 'разделов')}` : ''}</p>
    ${named ? `<ol class="toc">${bl.map(b => `<li class="${doneIn(b) === b.qs.length ? 'done' : ''}"><span class="toc-e" aria-hidden="true">${b.emo || '•'}</span><span><b>${esc(b.name)}</b>${b.about ? `<small>${esc(b.about)}</small>` : ''}</span><em>${doneIn(b) ? `${doneIn(b)}/${b.qs.length}` : b.qs.length}</em></li>`).join('')}</ol>` : ''}
    ${S.invited ? '<div class="note">👭 Ты пришла по приглашению — мы сохраним, кто тебя позвал.</div>' : ''}
    <button class="go" id="start">${started ? 'Продолжить 🚀' : 'Начать 🚀'}</button>
    ${S.code && !S.invited && !S.talk ? '<button class="link" id="inv">Меня пригласили по этой ссылке 👭</button>' : ''}
    <p class="small">Нажимая «Начать», вы соглашаетесь, что команда Eva Space увидит ваши ответы и сможет связаться с вами. Ответы нужны, чтобы сделать продукт лучше, и никуда не публикуются.</p></div>`);
  $('#app').onclick = e => {
    if (e.target.closest('#start')) { const k = qs().findIndex(q => S.a[q.id] === undefined); S.i = started && k >= 0 ? k : 0; render(); }
    if (e.target.closest('#inv')) { S.invited = true; S.a = {}; S.m = {}; S.key += ':inv'; save(); render(); }
  };
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/* интервью: на своём сервере ответы уходят сразу в карточку; иначе — ссылкой менеджеру, как анкета */
async function renderTalkDone() {
  const onSrv = location.pathname.startsWith('/anketa');
  if (onSrv) {
    shell('<div class="card intro fade"><div class="big">⏳</div><h1>Отправляем ответы…</h1></div>');
    let ok = false, why = '';
    try {
      const r = await fetch('/crm/api/talk', {method: 'POST', headers: {'content-type': 'application/json', 'x-eva': '1'}, body: JSON.stringify({c: S.code, a: S.a})});
      const j = await r.json().catch(() => ({}));
      ok = r.ok; why = j.error || '';
    } catch (e) { why = 'Нет связи с интернетом'; }
    if (ok) {
      shell(`<div class="card intro fade"><div class="big">🎉</div><h1>Спасибо!</h1><p class="lead">Ответы уже у команды Евы 💜 Каждый из них поможет сделать Еву лучше.</p>
        <button class="link" id="edit">← Поменять ответы</button></div>`);
    } else {
      shell(`<div class="card intro fade"><div class="big">😕</div><h1>Не получилось отправить</h1><p class="lead">${esc(why || 'Попробуй ещё раз через минуту.')} Ответы сохранились в этом браузере.</p>
        <button class="go" id="retry">Отправить ещё раз</button><button class="link" id="edit">← Вернуться к ответам</button></div>`);
    }
    $('#app').onclick = e => {
      if (e.target.closest('#retry')) renderTalkDone();
      if (e.target.closest('#edit')) { S.i = total() - 1; render(); }
    };
    return;
  }
  const packed = await Codec.pack({v: 1, t: TYPES[S.type].letter, c: S.code, m: 'talk', a: S.a, at: Date.now()});
  const link = `${CRM_URL}#in.${packed}`;
  shell(`<div class="card intro fade"><div class="big">🎉</div><h1>Спасибо!</h1><p class="lead">Скопируй ссылку с ответами и отправь менеджеру Евы, который прислал тебе вопросы.</p>
    <button class="go alt" id="copy">📋 Скопировать ссылку с ответами</button><textarea class="linkbox" id="lb" readonly hidden>${esc(link)}</textarea>
    <button class="link" id="edit">← Поменять ответы</button></div>`);
  $('#app').onclick = async e => {
    if (e.target.closest('#copy')) {
      try { await navigator.clipboard.writeText(link); e.target.closest('#copy').textContent = '✅ Скопировано'; }
      catch (err) { const lb = $('#lb'); lb.hidden = false; lb.focus(); lb.select(); }
    }
    if (e.target.closest('#edit')) { S.i = total() - 1; render(); }
  };
}

async function renderDone() {
  if (S.talk) return renderTalkDone();
  /* ответы на вопросы, которые теперь не показываются (сменили занятость), не отправляем */
  S.all.forEach(q => { if (!q.auto && !qVisible(q, S.a)) delete S.a[q.id]; });
  save();
  const gift = S.type === 'client';
  const payload = {v: 1, t: TYPES[S.type].letter, c: S.code || '', r: S.invited ? 1 : 0, a: S.a, at: Date.now(), ...(gift ? {g: 1} : {})};
  const packed = await Codec.pack(payload);
  const link = `${CRM_URL}#in.${packed}`;
  const text = gift ? 'Привет! Это мои ответы для Eva 💜 Жду подарок — неделю Евы 🎁' : 'Привет! Это мои ответы для Eva 💜';
  const tg = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
  const wa = `https://wa.me/?text=${encodeURIComponent(text + ' ' + link)}`;
  const own = S.code && !S.invited && ['client', 'amb'].includes(S.type);
  shell(`<div class="card intro fade"><div class="big">🎉</div><h1>Спасибо${S.a.name ? ', ' + esc(String(S.a.name).split(' ')[0]) : ''}!</h1>
    ${gift ? `<div class="gift"><div class="gift-box" aria-hidden="true">🎁</div><div><b>Неделя Евы — в подарок</b><span>Отправь ответы менеджеру — и в ответ получишь доступ к Еве на 7 дней.</span></div></div>` : ''}
    <p class="lead">${gift ? 'Одно нажатие — и выбери чат с менеджером Евы, который прислал тебе ссылку.' : 'Остался один шаг: отправьте ответы менеджеру Евы, который прислал вам ссылку. Одно нажатие — и выберите чат с ним.'}</p>
    <div class="send" style="width:100%"><a class="tg" href="${esc(tg)}" target="_blank" rel="noopener">✈️ Отправить в Telegram</a><a class="wa" href="${esc(wa)}" target="_blank" rel="noopener">💬 Отправить в WhatsApp</a>
      <button class="go alt" id="copy">📋 Скопировать ссылку с ответами</button></div>
    <textarea class="linkbox" id="lb" readonly hidden>${esc(link)}</textarea>
    ${own ? `<div class="note">👭 Эту же страницу можно переслать подруге: она выберет «Меня пригласили», а мы узнаем, что она от тебя.</div>` : ''}
    <button class="link" id="edit">← Поменять ответы</button></div>`);
  $('#app').onclick = async e => {
    if (e.target.closest('#copy')) {
      const lb = $('#lb');
      try { await navigator.clipboard.writeText(link); e.target.closest('#copy').textContent = '✅ Скопировано — вставь в чат с менеджером'; }
      catch (err) { lb.hidden = false; lb.focus(); lb.select(); }
    }
    if (e.target.closest('#edit')) { S.i = total() - 1; render(); }
  };
}

window.addEventListener('hashchange', init);
init();
})();
</script>
