<title>Анкета Eva</title>
<meta name="description" content="Короткая анкета Eva Space: несколько вопросов кнопками — помогите нам сделать Еву лучше.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Анкета Eva: мягкая, мобильная, одна мысль на экран. Стиль Eva Space v2:
   графит и приглушённая фуксия, белая путеводная звезда на сливовом
   градиенте; фон — тёплый светлый или ночной. */
:root{
  --bg:#F7F6F4; --bg-2:#F4E6EC; --card:#FFFFFF; --ink:#111014; --ink-2:#4A4650; --ink-3:#7E7A85;
  --line:#E6E2DE; --rose:#C2506F; --rose-soft:#F7E9EE; --plum:#2B2233; --gold:#B8894A; --violet:#A8375C; --violet-soft:#F7E9EE;
  --grad:linear-gradient(155deg,#1A171F 0%,#2B2233 55%,#4A2C42 100%);
  --shadow:0 10px 40px rgba(17,16,20,.08);
  --f-display:'Unbounded', 'Inter', system-ui, sans-serif;
  --f-text:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121014; --bg-2:#2A1822; --card:#1B181F; --ink:#F3EFF4; --ink-2:#C4BCC9; --ink-3:#938B9A;
    --line:#2E2934; --rose:#E693B0; --rose-soft:#3A2230; --plum:#E7C58B; --gold:#E7C58B; --violet:#E693B0; --violet-soft:#3A2230;
    --shadow:0 10px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121014; --bg-2:#2A1822; --card:#1B181F; --ink:#F3EFF4; --ink-2:#C4BCC9; --ink-3:#938B9A;
  --line:#2E2934; --rose:#E693B0; --rose-soft:#3A2230; --plum:#E7C58B; --gold:#E7C58B; --violet:#E693B0; --violet-soft:#3A2230;
  --shadow:0 10px 40px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{min-height:100%;}
body{margin:0; background:radial-gradient(900px 420px at 90% -10%, var(--bg-2), transparent 70%), var(--bg); color:var(--ink); font:16px/1.5 var(--f-text); -webkit-font-smoothing:antialiased;}
button,input,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--violet); outline-offset:2px;}
[hidden]{display:none !important;}
.wrap{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:24px 48px; display:flex; flex-direction:column; gap:14px;}
.top{display:flex; align-items:center; gap:12px;}
.mark{width:34px; height:34px; flex:0 0 34px; display:block;}
.mark svg, .big svg{display:block; width:100%; height:100%; border-radius:22%;}
.brand{font:400 13px var(--f-display); letter-spacing:.2em; text-transform:uppercase;}
.count{margin-left:auto; font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden;}
.bar i{display:block; height:100%; border-radius:3px; background:linear-gradient(90deg, var(--rose), var(--violet)); transition:width .3s ease;}
.card{background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:26px 22px; display:flex; flex-direction:column; gap:16px;}
h1{margin:0; font:600 24px/1.25 var(--f-display); letter-spacing:-.01em; text-wrap:balance;}
h2{margin:0; font:600 20px/1.35 var(--f-display); letter-spacing:-.01em; text-wrap:balance;}
p{margin:0;}
.lead{color:var(--ink-2); font-size:15px;}
.small{font-size:12.5px; color:var(--ink-3); line-height:1.5;}
.intro{text-align:center; align-items:center;}
.big{font-size:52px; line-height:1;}
.big.mark-big{width:64px; height:64px; margin:0 auto;}
.opts{display:flex; flex-direction:column; gap:8px;}
.opt{min-height:52px; width:100%; text-align:left; padding:12px 16px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); font-size:15.5px; font-weight:500; display:flex; align-items:center; gap:10px; transition:border-color .12s, background .12s, transform .08s;}
.opt:hover{border-color:var(--rose);}
.opt:active{transform:scale(.99);}
.opt.on{border-color:var(--violet); background:var(--violet-soft);}
.opt .tick{margin-left:auto; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:12px; flex:0 0 22px;}
.opt.on .tick{background:var(--violet); border-color:var(--violet); color:#fff;}
.scale{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px;}
.scale button{aspect-ratio:1; max-width:100%; border-radius:16px; border:1.5px solid var(--line); background:var(--card); font-size:30px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
.scale button small{font-size:11px; color:var(--ink-3);}
.scale button.on{border-color:var(--violet); background:var(--violet-soft);}
.scale-ends{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-3);}
.inp{width:100%; min-height:52px; padding:12px 16px; border-radius:16px; border:1.5px solid var(--line); background:var(--card); font-size:16px;}
textarea.inp{min-height:110px; resize:vertical;}
.inp:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 4px var(--violet-soft);}
.go{min-height:54px; border:0; border-radius:16px; background:#111014; color:#fff; font-weight:600; font-size:16px; padding:0 22px; width:100%;}
.go:disabled{opacity:.45; cursor:default;}
.go.alt{background:var(--card); color:var(--ink); border:1.5px solid var(--line);}
.nav{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.link{border:0; background:none; color:var(--ink-3); font-size:14px; padding:8px 0; text-decoration:underline; text-underline-offset:3px;}
.hint{font-size:13px; color:var(--ink-3);}
.types{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;}
.types button{border:1.5px solid var(--line); background:var(--card); border-radius:18px; padding:18px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:600;}
.types button span{font-size:34px;}
.types button:hover{border-color:var(--rose);}
.send{display:flex; flex-direction:column; gap:8px;}
.send a{min-height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; text-decoration:none; font-size:15.5px;}
.send .tg{background:#2A9FD8; color:#fff;}
.send .wa{background:#1FA855; color:#fff;}
.linkbox{width:100%; min-height:80px; font:12px/1.4 ui-monospace, Menlo, monospace; border-radius:12px; border:1px solid var(--line); background:var(--bg); padding:10px; color:var(--ink-2);}
.note{padding:12px 14px; border-radius:14px; background:var(--rose-soft); font-size:14px; line-height:1.5;}
.fade{animation:fade .22s ease-out;}
@keyframes fade{from{opacity:0; transform:translateY(6px);}}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* разделы: шапка над вопросом и оглавление на вводном экране */
.sect{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--ink-3); margin-top:-4px;}
.sect b{color:var(--ink); font-weight:600; font-size:14px;}
.sect-e{font-size:16px; line-height:1;}
.dots{display:inline-flex; gap:4px; margin-left:auto;}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--line);}
.dots i.done{background:var(--rose);}
.dots i.cur{background:var(--ink); box-shadow:0 0 0 3px var(--rose-soft);}
.meta{font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.toc{list-style:none; margin:0; padding:0; width:100%; display:flex; flex-direction:column; gap:6px; text-align:left;}
.toc li{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:14px; background:var(--bg); border:1px solid var(--line);}
.toc li.done{background:var(--rose-soft); border-color:transparent;}
.toc-e{font-size:18px; width:22px; text-align:center; flex:0 0 22px;}
.toc li > span:nth-child(2){flex:1; min-width:0; display:flex; flex-direction:column;}
.toc b{font-size:14.5px; font-weight:600;}
.toc small{font-size:12px; color:var(--ink-3);}
.toc em{font-style:normal; font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
/* варианты в две колонки, когда их много и они короткие */
.opts.two{display:grid; grid-template-columns:repeat(2, minmax(0,1fr));}
@media (max-width:380px){ .opts.two{grid-template-columns:1fr;} }
.other-inp{margin-top:-6px;}
/* шкала 1–10: цифры, заливка до выбранной */
.scale10{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px;}
.scale10 button{height:52px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; transition:background .12s, border-color .12s;}
.scale10 button:hover{border-color:var(--rose);}
.scale10 button.fill{background:var(--rose-soft); border-color:transparent;}
.scale10 button.on{background:var(--violet); border-color:var(--violet); color:#fff;}
input[type=date].inp{appearance:none; -webkit-appearance:none;}
</style>
<main class="wrap" id="app">
  <div class="card intro"><div class="big">🌸</div><h1>Eva</h1><p>Загружаю анкету…</p></div>
</main>
<script>

'use strict';
/* ── 05-brand.js ── */
/* Знак Eva Space — как иконка приложения и «Книга стандартов»: белая
   путеводная звезда и две искры на сливовом градиенте с фуксиевым
   свечением. Один рисунок на CRM, анкету и вкладку браузера. */

     или менеджер за него. Из неё собирается статистика;
   • talk — вопросы для созвона в Zoom: открытые, отвечают своими словами.
   Виды вопросов: one — один вариант, many — несколько (max — сколько),
   scale — шкала 1–5 или 1–10 (n), date — дата, short — короткий текст,
   text — развёрнутый ответ. other — вариант «Другое» со своим ответом:

   считаем как новые. b — раздел (Q_BLOCKS), opt — можно пропустить.
   key — ответ заполняет поле карточки (имя, город, контакт…).
   rec — рекомендация, если этот вариант выбирают чаще всего (по номеру варианта).
   pick (у вопросов созвона) — быстрые метки, которые интервьюер отмечает
   кнопкой; они попадают в статистику.
   Вопросы редактируются в CRM («Вопросы»); здесь — стартовый набор. */

];

  '💅 Салон красоты', '🤸‍♀️ Студия пилатеса', '🧘‍♀️ Йога-студия', '🏋️‍♀️ Фитнес-клуб', '✨ Косметология', '💆‍♀️ SPA и массаж',

];

const Q_DEFAULT = {
  /* ── клиентки: кастдев 2.0 — по таблице команды «Вопросы V2»:
     жёлтые строки — анкета, зелёные — считаем в статистике, синие —

  client: {
    test: [
      {id: 'name', b: 'me', k: 'short', key: 'name', t: 'Как тебя зовут?', ph: 'Имя'},

      {id: 'birth', b: 'me', k: 'date', t: 'Когда у тебя день рождения?', hint: 'Возраст посчитаем сами — в анкете он не нужен'},

      {id: 'time', b: 'self', k: 'one', t: 'Сколько минут в день реально готова уделять себе?', o: ['5–10 минут', '15–20 минут', '30 минут и больше'],

function groupByBlock(type, part, qs) {
  const names = ((Q_BLOCKS[type] || {})[part]) || {};

  qs.forEach(q => {

    let g = out.find(x => x.key === key);

/* подпись варианта для подсчёта: без смайлов, старые подписи — как новые,
   «Другое: свой ответ» — просто «Другое» */
const plainLabel = s => String(s ?? '').replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}\u200d\uFE0F\u20E3]/gu, '').replace(/\s{2,}/g, ' ').trim();
const OTHER_SEP = ': ';
function canonLabel(q, label) {
  const l = plainLabel(label);
  if (q && q.other && (l === q.other || l.startsWith(q.other + OTHER_SEP))) return q.other;
  if (q && q.alias && q.alias[l]) return q.alias[l];
  return l;
}
/* свой ответ из «Другое: …» */
function otherText(q, label) {
  const l = String(label ?? '');
  return q && q.other && l.startsWith(q.other + OTHER_SEP) ? l.slice(q.other.length + OTHER_SEP.length).trim() : '';
}
const scaleN = q => (q && Number(q.n) > 5 ? Number(q.n) : 5);

/* возраст из даты рождения; старые анкеты отвечали группой */
const AGE_GROUPS = ['до 25', '25–34', '35–44', '45+'];
function ageFromBirth(birth, now = new Date()) {
  const m = String(birth || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  let a = now.getFullYear() - Number(m[1]);
  if (now.getMonth() + 1 < Number(m[2]) || (now.getMonth() + 1 === Number(m[2]) && now.getDate() < Number(m[3]))) a--;
  return a >= 5 && a <= 110 ? a : null;
}
const ageGroup = a => (a === null || a === undefined ? null : a < 25 ? AGE_GROUPS[0] : a < 35 ? AGE_GROUPS[1] : a < 45 ? AGE_GROUPS[2] : AGE_GROUPS[3]);
function ageGroupOf(answers) {
  const a = answers || {};
  const g = ageGroup(ageFromBirth(a.birth));
  if (g) return g;
  const old = plainLabel(a.age || '');
  return AGE_GROUPS.includes(old) ? old : null;
}

/* Одна ссылка на человека — и для анкеты, и для рефералки.
   Ссылка анкеты:  <анкета>#k.ANNA482          k — клиентка, e — эксперт, p — партнёр, a — амбассадор
                   <анкета>#k.ANNA482.q…       хвост .q… — вопросы, которые команда добавила или скрыла
   Ответы назад:   <CRM>#in.z…                 z — сжатые ответы, j — без сжатия
   В адресе после # разрешены только буквы, цифры и . _ ~ - — поэтому
   данные упакованы в base64url. */

const Codec = {
  b64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  unb64(str) {
    let b = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const bin = atob(b);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },
  encJson(obj) { return this.b64(new TextEncoder().encode(JSON.stringify(obj))); },
  decJson(str) { return JSON.parse(new TextDecoder().decode(this.unb64(str))); },
  /* сжатие, где браузер умеет (CompressionStream); иначе — как есть */
  async pack(obj) {
    const raw = new TextEncoder().encode(JSON.stringify(obj));
    try {
      if (typeof CompressionStream === 'function') {
        const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        const buf = new Uint8Array(await new Response(cs).arrayBuffer());
        if (buf.length < raw.length) return 'z' + this.b64(buf);
      }
    } catch (e) { /* ниже — без сжатия */ }
    return 'j' + this.b64(raw);
  },
  async unpack(str) {
    const s = String(str || '').trim();
    const body = s.slice(1);
    if (s[0] === 'j') return JSON.parse(new TextDecoder().decode(this.unb64(body)));
    if (s[0] === 'z') {
      const ds = new Blob([this.unb64(body)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return JSON.parse(await new Response(ds).text());
    }
    throw new Error('Не похоже на ответы анкеты');
  },
  /* разбор хвоста ссылки анкеты: k.ANNA482.q… */
  parseAnketaHash(h) {
    const parts = String(h || '').replace(/^#/, '').split('.');
    const type = TYPE_BY_LETTER[parts[0]] || null;
    const code = parts[1] && /^[A-Za-z0-9_-]{2,40}$/.test(parts[1]) ? parts[1].toUpperCase() : '';
    let diff = null;
    const q = parts.find((p, i) => i >= 2 && p[0] === 'q');
    if (q) { try { diff = this.decJson(q.slice(1)); } catch (e) { diff = null; } }
    return {type, code, diff};
  },
  /* найти ответы в любом тексте: ссылке, сообщении из Telegram, чистом коде */
  findPayload(text) {
    const s = String(text || '');
    const m = s.match(/#in\.([zj][A-Za-z0-9_-]+)/) || s.match(/\bin\.([zj][A-Za-z0-9_-]{20,})/) || s.match(/^\s*([zj][A-Za-z0-9_-]{20,})\s*$/);
    return m ? m[1] : null;
  },
};

/* вопросы анкеты с учётом правок команды: скрытые убираем, изменённые
   подменяем, новые добавляем в конец */
function applyDiff(type, diff) {
  const base = (Q_DEFAULT[type] || {test: []}).test.map(q => ({...q}));
  /* ссылка выдана до смены набора вопросов — её правки относятся к прежнему набору */
  if (!diff || (diff.v || 1) < (Q_VER[type] || 1)) return base;
  const hide = new Set(diff.h || []);
  const changed = Object.fromEntries((diff.c || []).map(q => [q.id, q]));
  const out = base.filter(q => !hide.has(q.id)).map(q => (changed[q.id] ? {...q, ...changed[q.id]} : q));
  (diff.c || []).forEach(q => { if (!base.some(b => b.id === q.id) && !hide.has(q.id)) out.push(q); });
  if (Array.isArray(diff.s)) { const pos = id => { const i = diff.s.indexOf(id); return i < 0 ? 999 : i; }; out.sort((a, b) => pos(a.id) - pos(b.id)); }
  return out;
}
/* ответ вопроса «как текст»: индексы вариантов → подписи, шкала → «7 из 10»,
   дата → «12 марта 1992» */
const BIRTH_MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
function dateLabel(v) {
  const m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${Number(m[3])} ${BIRTH_MON[Number(m[2]) - 1] || ''} ${m[1]}` : String(v);
}
function answerLabels(q, v) {
  if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) return [];
  if (q.k === 'one' || q.k === 'many') return (Array.isArray(v) ? v : [v]).map(x => (typeof x === 'number' ? (q.o || [])[x] : x)).filter(x => x !== undefined && x !== '');
  if (q.k === 'scale') return [`${v} из ${scaleN(q)}`];
  if (q.k === 'date') return [dateLabel(v)];
  return [String(v)];
}

/* ── app.js ── */
/* Публичная анкета Eva. Ссылка: <анкета>#k.ANNA482 — тип и код человека.
   Один вопрос на экран, варианты — крупные кнопки, один выбор листает
   дальше сам. Ответы помнятся в этом браузере до отправки. В конце —
   «Отправить»: человек пересылает менеджеру ссылку, которая кладёт ответы
   в карточку CRM. Эта же ссылка — реферальная: подруга выберет «Меня
   пригласили», и CRM запишет, кто её привёл. Длинная анкета разбита на
   разделы: на вводном экране — оглавление, над вопросом — раздел и точки
   его вопросов. */

/* на своём сервере анкета живёт по адресу /anketa/, CRM — рядом, в /crm/ */
const CRM_URL = location.pathname.startsWith('/anketa') ? location.origin + '/crm/' : 'https://claude.ai/artifact/3KRhRoeBVMY5cWps3oSASA';
const $ = (s, r = document) => r.querySelector(s);
const ESC = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* приватное окно */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ничего */ } },
};
const INTRO = {
  client:  {emo: '🌸', title: 'Привет! Помоги нам сделать Еву лучше 💜', lead: 'Почти всё — кнопками. Здесь нет правильных ответов: нам важен твой честный опыт.', min: 7},
  expert:  {emo: '🎓', title: 'Давайте знакомиться ✨', lead: 'Несколько вопросов о вашем опыте и о том, что можно создать вместе с Евой.', min: 4},
  partner: {emo: '🤝', title: 'Давайте дружить 🤝', lead: 'Расскажите о себе — подберём формат, выгодный обеим сторонам.', min: 3},
  amb:     {emo: '📣', title: 'Стань голосом Евы 💜', lead: 'Расскажи о себе и своей аудитории — придумаем, как тебе удобнее делиться Евой.', min: 3},
};

const S = {type: null, code: '', invited: false, qs: [], i: -1, a: {}, key: '', blocks: []};

function init() {
  const h = Codec.parseAnketaHash(location.hash);
  S.type = h.type;
  S.code = h.code;
  S.qs = h.type ? applyDiff(h.type, h.diff) : [];
  S.blocks = h.type ? groupByBlock(h.type, 'test', S.qs) : [];
  S.qs = S.blocks.flatMap(x => x.qs);   // вопрос, добавленный в раздел позже, идёт внутри своего раздела
  S.key = `eva-anketa:${h.type || ''}:${h.code || 'new'}`;
  const saved = store.get(S.key);
  if (saved && saved.a) { S.a = saved.a; S.invited = !!saved.invited; }
  if (!S.type) return renderChooser();
  S.i = -1;
  render();
}
function save() { store.set(S.key, {a: S.a, invited: S.invited}); }
function total() { return S.qs.length; }
/* в каком разделе вопрос: номер раздела, его вопросы и место внутри */
function where(i) {
  const q = S.qs[i];
  const bi = S.blocks.findIndex(b => b.qs.includes(q));
  const b = S.blocks[bi] || {qs: [q], name: ''};
  return {bi, b, j: b.qs.indexOf(q)};
}

function shell(inner, withTop = true) {
  const inQ = S.i >= 0 && S.i < total();
  const pct = S.i < 0 ? 0 : Math.round((S.i / total()) * 100);
  const w = inQ ? where(S.i) : null;
  const named = w && w.b.name && S.blocks.length > 1;
  $('#app').innerHTML = `${withTop ? `<div class="top"><span class="mark">${brandMark()}</span><span class="brand">Eva Space</span>${inQ ? `<span class="count">${S.i + 1} из ${total()}</span>` : ''}</div>
    ${inQ ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
    ${named ? `<div class="sect"><span class="sect-e" aria-hidden="true">${w.b.emo || '•'}</span><b>${esc(w.b.name)}</b><span>раздел ${w.bi + 1} из ${S.blocks.length}</span>
      <span class="dots" aria-hidden="true">${w.b.qs.map((x, k) => `<i class="${k < w.j ? 'done' : k === w.j ? 'cur' : ''}"></i>`).join('')}</span></div>` : ''}` : ''}${inner}`;
}

function renderChooser() {
  S.i = -1;
  shell(`<div class="card intro fade"><div class="big mark-big">${brandMark()}</div><h1>Кто вы?</h1><p class="lead">Выберите — и покажем вопросы для вас</p>
    <div class="types">${Object.entries(TYPES).map(([k, t]) => `<button data-t="${k}"><span>${t.emo}</span>${t.one}</button>`).join('')}</div></div>`);
  $('#app').onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    S.type = b.dataset.t;
    S.qs = applyDiff(S.type, null);
    S.blocks = groupByBlock(S.type, 'test', S.qs);
    S.qs = S.blocks.flatMap(x => x.qs);
    S.key = `eva-anketa:${S.type}:new`;
    const saved = store.get(S.key);
    S.a = saved && saved.a ? saved.a : {};
    S.i = -1;
    render();
  };
}

/* «Другое» хранится как «Другое: свой ответ» */
const isOther = (q, v) => !!q.other && (v === q.other || String(v || '').startsWith(q.other + OTHER_SEP));
const withOther = (q, text) => (text ? `${q.other}${OTHER_SEP}${text}` : q.other);
const canSkip = q => q.k === 'many' || q.k === 'date' || q.opt || (q.k === 'short' && q.key !== 'name') || q.k === 'text';

function render() {
  if (S.i < 0) return renderIntro();
  if (S.i >= total()) return renderDone();
  const q = S.qs[S.i];
  const v = S.a[q.id];
  let ctl = '';
  if (q.k === 'one' || q.k === 'many') {
    const sel = q.k === 'one' ? [v] : (v || []);
    const otherOn = sel.some(x => isOther(q, x));
    const otherVal = otherOn ? otherText(q, sel.find(x => isOther(q, x))) : '';
    const opts = [...q.o, ...(q.other ? [q.other] : [])];
    ctl = `<div class="opts ${opts.length > 6 && opts.every(o => o.length < 22) ? 'two' : ''}">${opts.map((o, j) => {
      const on = j < q.o.length ? sel.includes(o) : otherOn;
      return `<button class="opt ${on ? 'on' : ''}" data-o="${j}"><span>${esc(o)}</span>${q.k === 'many' ? `<span class="tick">${on ? '✓' : ''}</span>` : ''}</button>`;
    }).join('')}</div>
      ${q.other ? `<input class="inp other-inp" id="oth" value="${esc(otherVal)}" placeholder="Напиши свой вариант" maxlength="120" ${otherOn ? '' : 'hidden'}>` : ''}
      ${q.k === 'many' ? `<p class="hint">${q.max ? `Можно выбрать до ${q.max}` : 'Можно выбрать несколько'}</p>` : ''}`;
  } else if (q.k === 'scale') {
    const n = scaleN(q);
    ctl = n === 5
      ? `<div class="scale">${SCALE_EMO.map((e, j) => `<button class="${Number(v) === j + 1 ? 'on' : ''}" data-s="${j + 1}" aria-label="${j + 1} из 5">${e}<small>${j + 1}</small></button>`).join('')}</div>`
      : `<div class="scale10">${Array.from({length: n}, (_, j) => `<button class="${Number(v) === j + 1 ? 'on' : ''} ${v && j + 1 <= Number(v) ? 'fill' : ''}" data-s="${j + 1}" aria-label="${j + 1} из ${n}">${j + 1}</button>`).join('')}</div>`;
    ctl += `<div class="scale-ends"><span>1 — ${esc(q.lo || '')}</span><span>${n} — ${esc(q.hi || '')}</span></div>`;
  } else if (q.k === 'date') {
    const y = new Date().getFullYear();
    ctl = `<input class="inp" id="inp" type="date" value="${esc(v || '')}" min="${y - 90}-01-01" max="${y - 12}-12-31">`;
  } else if (q.k === 'text') {
    ctl = `<textarea class="inp" id="inp" placeholder="${esc(q.ph || 'Напишите, как есть')}">${esc(v || '')}</textarea>`;
  } else {
    ctl = `<input class="inp" id="inp" value="${esc(v || '')}" placeholder="${esc(q.ph || '')}" ${q.key === 'tg' ? 'autocomplete="tel"' : q.key === 'name' ? 'autocomplete="given-name"' : ''}>`;
  }
  const otherSel = q.other && (q.k === 'one' ? isOther(q, v) : (v || []).some(x => isOther(q, x)));
  const needNext = !['one', 'scale'].includes(q.k) || otherSel;
  const last = S.i === total() - 1;
  shell(`<div class="card fade"><h2>${esc(q.t)}</h2>${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ''}${ctl}
    ${needNext ? `<button class="go" id="next">${last ? 'Готово 🎉' : 'Дальше →'}</button>` : ''}
    <div class="nav"><button class="link" id="back">← Назад</button>${canSkip(q) ? '<button class="link" id="skip">Пропустить</button>' : '<span></span>'}</div></div>`);
  const inp = $('#inp'), oth = $('#oth');
  if (inp && q.k !== 'date') { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter' && (q.k === 'short' || e.ctrlKey || e.metaKey)) { e.preventDefault(); next(); } }); }
  if (oth) {
    if (!oth.hidden && !oth.value) oth.focus();
    oth.addEventListener('input', () => {
      const text = oth.value.trim().slice(0, 120);
      if (q.k === 'one') S.a[q.id] = withOther(q, text);
      else S.a[q.id] = (S.a[q.id] || []).map(x => (isOther(q, x) ? withOther(q, text) : x));
      save();
    });
    oth.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); next(); } });
  }
  $('#app').onclick = e => {
    const o = e.target.closest('[data-o]');
    const s = e.target.closest('[data-s]');
    if (o) {
      const j = Number(o.dataset.o);
      const isOth = j >= q.o.length;
      const label = isOth ? withOther(q, oth ? oth.value.trim() : '') : q.o[j];
      if (q.k === 'one') {
        S.a[q.id] = label;
        save();
        render();
        if (!isOth) setTimeout(() => { S.i++; render(); }, 220);
        return;
      }
      const cur = (S.a[q.id] || []).slice();
      const at = cur.findIndex(x => (isOth ? isOther(q, x) : x === label));
      if (at >= 0) cur.splice(at, 1);
      else { if (q.max && cur.length >= q.max) { flash(`Можно выбрать до ${q.max}`); return; } cur.push(label); }
      S.a[q.id] = cur;
      save();
      render();
      return;
    }
    if (s) { S.a[q.id] = Number(s.dataset.s); save(); render(); setTimeout(() => { S.i++; render(); }, 240); return; }
    if (e.target.closest('#next')) next();
    if (e.target.closest('#back')) { S.i--; render(); }
    if (e.target.closest('#skip')) { delete S.a[q.id]; save(); S.i++; render(); }
  };
  function next() {
    if (inp) {
      const val = inp.value.trim();
      if (!val && q.key === 'name') { inp.focus(); flash('Как к вам обращаться? 🙂'); return; }
      if (val) S.a[q.id] = val.slice(0, q.k === 'text' ? 600 : 160); else delete S.a[q.id];
      save();
    }
    if (q.k === 'many' && !(S.a[q.id] || []).length) delete S.a[q.id];
    S.i++;
    render();
  }
}
function flash(text) {
  let el = $('#flash');
  if (!el) { el = document.createElement('p'); el.id = 'flash'; el.className = 'note'; $('.card').appendChild(el); }
  el.textContent = text;
}

function renderIntro() {
  const I = INTRO[S.type];
  const started = Object.keys(S.a).length;
  const named = S.blocks.length > 1 && S.blocks[0].name;
  const doneIn = b => b.qs.filter(q => S.a[q.id] !== undefined).length;
  shell(`<div class="card intro fade"><div class="big">${I.emo}</div><h1>${esc(I.title)}</h1><p class="lead">${esc(I.lead)}</p>
    <p class="meta">${total()} ${plural(total(), 'вопрос', 'вопроса', 'вопросов')} · около ${I.min} минут${named ? ` · ${S.blocks.length} ${plural(S.blocks.length, 'раздел', 'раздела', 'разделов')}` : ''}</p>
    ${named ? `<ol class="toc">${S.blocks.map(b => `<li class="${doneIn(b) === b.qs.length ? 'done' : ''}"><span class="toc-e" aria-hidden="true">${b.emo || '•'}</span><span><b>${esc(b.name)}</b>${b.about ? `<small>${esc(b.about)}</small>` : ''}</span><em>${doneIn(b) ? `${doneIn(b)}/${b.qs.length}` : b.qs.length}</em></li>`).join('')}</ol>` : ''}
    ${S.invited ? '<div class="note">👭 Вы пришли по приглашению — мы сохраним, кто вас позвал.</div>' : ''}
    <button class="go" id="start">${started ? 'Продолжить 🚀' : 'Начать 🚀'}</button>
    ${S.code && !S.invited ? '<button class="link" id="inv">Меня пригласили по этой ссылке 👭</button>' : ''}
    <p class="small">Нажимая «Начать», вы соглашаетесь, что команда Eva Space увидит ваши ответы и сможет связаться с вами. Ответы нужны, чтобы сделать продукт лучше, и никуда не публикуются.</p></div>`);
  $('#app').onclick = e => {
    if (e.target.closest('#start')) { const k = S.qs.findIndex(q => S.a[q.id] === undefined); S.i = started && k >= 0 ? k : 0; render(); }
    if (e.target.closest('#inv')) { S.invited = true; S.a = {}; S.key += ':inv'; save(); render(); }
  };
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

async function renderDone() {
  const payload = {v: 1, t: TYPES[S.type].letter, c: S.code || '', r: S.invited ? 1 : 0, a: S.a, at: Date.now()};
  const packed = await Codec.pack(payload);
  const link = `${CRM_URL}#in.${packed}`;
  const text = `Привет! Это мои ответы для Eva 💜`;
  const tg = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
  const wa = `https://wa.me/?text=${encodeURIComponent(text + ' ' + link)}`;
  const own = S.code && !S.invited && ['client', 'amb'].includes(S.type);
  shell(`<div class="card intro fade"><div class="big">🎉</div><h1>Спасибо${S.a.name ? ', ' + esc(String(S.a.name).split(' ')[0]) : ''}!</h1>
    <p class="lead">Остался один шаг: отправьте ответы менеджеру Евы, который прислал вам ссылку. Одно нажатие — и выберите чат с ним.</p>
    <div class="send" style="width:100%"><a class="tg" href="${esc(tg)}" target="_blank" rel="noopener">✈️ Отправить в Telegram</a><a class="wa" href="${esc(wa)}" target="_blank" rel="noopener">💬 Отправить в WhatsApp</a>
      <button class="go alt" id="copy">📋 Скопировать ссылку с ответами</button></div>
    <textarea class="linkbox" id="lb" readonly hidden>${esc(link)}</textarea>
    ${own ? `<div class="note">👭 Эту же страницу можно переслать подруге: она выберет «Меня пригласили», а мы узнаем, что она от тебя.</div>` : ''}
    <button class="link" id="edit">← Поменять ответы</button></div>`);
  $('#app').onclick = async e => {
    if (e.target.closest('#copy')) {
      const lb = $('#lb');
      try { await navigator.clipboard.writeText(link); e.target.closest('#copy').textContent = '✅ Скопировано — вставьте в чат с менеджером'; }
      catch (err) { lb.hidden = false; lb.focus(); lb.select(); }
    }
    if (e.target.closest('#edit')) { S.i = total() - 1; render(); }
  };
}

window.addEventListener('hashchange', init);
init();
})();
</script>
