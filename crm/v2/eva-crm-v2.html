/* ── 15-stats.js ── */
/* Статистика для трёх ролей и ответы анкеты:
   • Процесс — команде и руководителю: воронка каждой группы с конверсией
     шага, сколько дней уходит на шаг, динамика по неделям, кто сколько сделал;
   • Продукт — основателю: что болит, что хотят, спрос на форматы против
     того, что могут снять эксперты, цена против 2 900 ₽, боли по этапам
     жизни, метки с цитатами, идеи из интервью и сводка от Claude;
   • Маркетинг — маркетологу: портрет клиентки, откуда приходят, когда
     удобно, слова клиенток, сегменты, рефералы и охват, что дают партнёры,
     заходы для рекламы от Claude;
   • Ответы — графики по каждому вопросу анкеты с фильтром по сегменту.
   Подписи без смайлов — так цифры читаются с первого взгляда. */

const ST_TABS = [['process', 'Процесс'], ['product', 'Продукт'], ['marketing', 'Маркетинг'], ['answers', 'Ответы анкеты']];
const PRICE_NOW = 2900;
/* клиентский формат ↔ что может снять эксперт */
const FORMAT_MAP = [
  ['Короткие практики', 'Короткие практики'], ['Мастер-классы экспертов', 'Мастер-класс'], ['Курсы', 'Курс'],
  ['Живые эфиры', 'Эфир'], ['Офлайн-встречи', 'Офлайн'],
];
const Syn = {};   // сводки Claude по ключу — только в этом окне

App.register('stats', {
  title: 'Статистика',
  render(root) {
    const tab = ST_TABS.some(([k]) => k === View.get('st.tab', 'process')) ? View.get('st.tab', 'process') : 'process';
    const body = tab === 'product' ? productView() : tab === 'marketing' ? marketingView() : tab === 'answers' ? answersStatsView() : processView();
    const sub = {
      process: 'Как идут три шага: где люди застревают, сколько дней уходит на шаг, кто сколько сделал.',
      product: 'Что улучшить в Еве: боли, желания, форматы, цена и идеи прямо из интервью.',
      marketing: 'Кому и как рассказывать о Еве: портрет, каналы, время, слова клиенток, рефералы.',
      answers: 'Графики по каждому вопросу анкеты. Всё считается само, когда приходят ответы.',
    }[tab];
    root.innerHTML = `
      ${pageHead('Статистика', sub)}
      ${tabsHtml('st.tab', ST_TABS, tab)}
      ${body}`;
    wireTabs(root);
    on(root, 'click', '[data-seg]', (e, el) => { View.set('st.seg', el.dataset.seg); App.render(); });
    on(root, 'click', '[data-syn]', async (e, el) => {
      const key = el.dataset.syn;
      Syn[key] = {loading: true};
      App.render();
      try { Syn[key] = {data: await synthesize(key)}; }
      catch (err) { Syn[key] = {err: CLAUDE_ERR[err && err.code] || 'Claude не ответил: ' + ((err && err.message) || 'попробуйте ещё раз')}; }
      App.render();
    });
    on(root, 'click', '[data-syn-copy]', (e, el) => copyOrShow(synText(el.dataset.synCopy), 'Скопировано — можно вставить задачей в штаб 📋'));
  },
});

/* ── общие кусочки ── */
const kpiRow = (items, cls = 'kpis-4') => `<div class="kpis ${cls} card">${items.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
const card = (title, note, inner, cls = '') => `<div class="card ${cls}"><div class="card-head"><h2>${title}</h2>${note ? `<span class="note">${note}</span>` : ''}</div>${inner}</div>`;
const answered = type => People.all(type).filter(p => Object.keys(p.answers || {}).length);
function aggOf(type, id, list) { return Stats.agg(type, list).find(a => a.q.id === id && a.n) || null; }
function topShare(a) { const t = a && Stats.top(a); return t ? {name: noEmo(t.name), share: t.v / a.n, v: t.v, n: a.n} : null; }
const bars = (a, color, max = 8) => (a ? hbarList(a.rows.slice().sort((x, y) => (a.q.k === 'many' ? y.v - x.v : 0)).filter(r => r.v || a.q.k !== 'many').slice(0, max).map(r => ({name: noEmo(r.name), v: r.v})), {color, sub: r => pct(r.v / a.n)}) : '<p class="note">Пока нет ответов.</p>');
const avgDays = pairs => { const d = pairs.filter(([a, b]) => a && b && b >= a).map(([a, b]) => (b - a) / 864e5); return d.length ? d.reduce((x, y) => x + y, 0) / d.length : null; };
const daysTxt = v => (v === null ? '—' : v < 1 ? 'меньше дня' : `${fmt(v, v < 10 ? 1 : 0)} ${plural(Math.round(v), 'день', 'дня', 'дней')}`);

/* ── Процесс ── */
function processView() {
  const all = Store.all('people');
  const stages = type => {
    const L = People.all(type);
    return [
      ['Добавлены', L.length],
      ['Ссылка отправлена', L.filter(p => (p.s1 || 'new') !== 'new').length],
      ['Анкета заполнена', L.filter(p => p.s1 === 'done').length],
      [type === 'client' ? 'Интервью назначено' : 'Созвон назначен', L.filter(p => hasCall(p) || ['done', 'skip'].includes(p.s2)).length],
      [type === 'client' ? 'Интервью прошло' : 'Созвон прошёл', L.filter(p => p.s2 === 'done').length],
      [type === 'client' ? 'Инсайты собраны' : 'Подключаем', L.filter(People.connected).length],
    ];
  };
  const funnelHtml = type => {
    const st = stages(type);
    const max = Math.max(1, st[0][1]);
    return `<div class="pf">${st.map(([name, v], i) => {
      const conv = i && st[i - 1][1] ? v / st[i - 1][1] : null;
      return `<div class="pf-r"><span class="pf-n">${name}</span><span class="pf-t"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><b>${v}</b><small class="${conv !== null && conv < .5 ? 'bad' : ''}">${conv === null ? '' : pct(conv)}</small></div>`;
    }).join('')}</div>`;
  };
  const sentToAns = avgDays(all.map(p => [p.sentAt, p.answeredAt]));
  const ansToCall = avgDays(all.filter(p => p.callAt).map(p => [p.answeredAt, p.callAt]));
  /* отвечают на анкету: заполнили сами / (заполнили сами + ещё ждём) */
  const selfDone = all.filter(p => p.s1 === 'done' && p.answeredBy === 'self').length, waiting = all.filter(p => p.s1 === 'sent').length;
  const respRate = selfDone + waiting ? selfDone / (selfDone + waiting) : null;
  const closed = all.filter(p => ['done', 'noshow'].includes(p.s2));
  const showRate = closed.length ? closed.filter(p => p.s2 === 'done').length / closed.length : null;
  const stuck = all.filter(p => p.s1 === 'sent' && p.sentAt && Date.now() - p.sentAt > 3 * 864e5);
  /* по неделям: добавили, анкеты, созвоны */
  const w0 = weekStart(today());
  const weeks = Array.from({length: 6}, (_, i) => addDays(w0, (i - 5) * 7));
  const inWeek = (ts, w) => ts && ts >= dateOf(w).getTime() && ts < dateOf(addDays(w, 7)).getTime();
  const wk = weeks.map(w => ({w, added: all.filter(p => inWeek(p.createdAt, w)).length, ans: all.filter(p => inWeek(p.answeredAt, w)).length, calls: all.filter(p => p.s2 === 'done' && inWeek(p.callAt, w)).length}));
  const wmax = Math.max(1, ...wk.flatMap(x => [x.added, x.ans, x.calls]));
  const team = Team.all().map(m => { const L = all.filter(p => p.owner === m.id); return {m, n: L.length, calls: L.filter(p => p.s2 === 'done').length, res: L.filter(p => (p.s3 || 'none') !== 'none').length}; }).filter(x => x.n);
  return `
    ${kpiRow([[respRate === null ? '—' : pct(respRate), 'отвечают на анкету'], [daysTxt(sentToAns), 'от ссылки до ответов'], [daysTxt(ansToCall), 'от анкеты до созвона'], [showRate === null ? '—' : pct(showRate), 'доходят до созвона']])}
    ${stuck.length ? `<div class="warnline" style="margin-top:12px">${stuck.length} ${plural(stuck.length, 'человек молчит', 'человека молчат', 'человек молчат')} больше трёх дней после ссылки: ${esc(stuck.slice(0, 4).map(People.name).join(', '))}${stuck.length > 4 ? '…' : ''}. Напомните одним сообщением.</div>` : ''}
    <div class="two section">${Object.keys(TYPES).map(k => card(`${TYPES[k].emo} ${groupName(k)}`, 'сколько дошло до шага · доля от прошлого', funnelHtml(k))).join('')}</div>
    <div class="two section">
      ${card('По неделям', 'последние 6 недель', `<div class="wk">${wk.map(x => `<div class="wk-c"><div class="wk-b">${[['added', 'var(--ink-3)'], ['ans', 'var(--link)'], ['calls', 'var(--good)']].map(([k, c]) => `<i style="height:${(x[k] / wmax * 100).toFixed(0)}%;background:${c}" title="${x[k]}"></i>`).join('')}</div><small>${dayShort(x.w)}</small></div>`).join('')}</div>
        <div class="cal-legend" style="margin:8px 0 0"><span><i class="cb-dot" style="background:var(--ink-3)"></i>добавили</span><span><i class="cb-dot" style="background:var(--link)"></i>анкет</span><span><i class="cb-dot" style="background:var(--good)"></i>созвонов прошло</span></div>`)}
      ${card('Кто сколько сделал', 'людей · созвонов · итогов', team.length ? `<div class="tm-list">${team.map(x => `<div class="tm-r">${Team.av(x.m)}<b>${esc(Team.name(x.m))}</b><span>${x.n}</span><span>${x.calls}</span><span>${x.res}</span></div>`).join('')}</div>` : '<p class="note">Назначьте ведущих в карточках — здесь появится вклад каждого.</p>')}
    </div>`;
}

/* ── Продукт ── */
function productView() {
  const seg = View.get('st.seg', '');
  const qs = Questions.set('client').test;
  const stageQ = qs.find(q => q.id === 'stage');
  const base = answered('client');
  const list = seg ? base.filter(p => (p.answers || {}).stage === seg) : base;
  const n = list.length;
  const pain = aggOf('client', 'pain', list), goal = aggOf('client', 'goal', list), formats = aggOf('client', 'formats', list);
  const time = aggOf('client', 'time', list), price = aggOf('client', 'price', list), fit = aggOf('client', 'fit', list);
  const priceHi = price ? price.rows.filter(r => /1 500–3 000|Больше 3 000/.test(r.name)).reduce((a, r) => a + r.v, 0) / price.n : null;
  const tp = topShare(pain);
  /* спрос клиенток на форматы против того, что эксперты готовы снять */
  const ex = answered('expert');
  const demand = FORMAT_MAP.map(([c, e]) => {
    const want = formats ? (formats.rows.find(r => noEmo(r.name).startsWith(c)) || {v: 0}).v / formats.n : 0;
    const can = ex.length ? ex.filter(p => [].concat((p.answers || {}).record || []).some(x => noEmo(x).startsWith(e))).length / ex.length : 0;
    return {c, want, can, gap: want - can};
  });
  /* боли по этапам жизни */
  const stages = stageQ ? stageQ.o.filter(o => base.some(p => p.answers.stage === o)) : [];
  const painQ = qs.find(q => q.id === 'pain');
  const cross = painQ ? painQ.o.map(o => ({o, cells: stages.map(s => { const L = base.filter(p => p.answers.stage === s); return {s, v: L.filter(p => [].concat(p.answers.pain || []).includes(o)).length, n: L.length}; })})) : [];
  /* метки из интервью с цитатами */
  const tags = Stats.insightTags();
  const clients = People.all('client');
  const tagQuote = t => { for (const p of clients.filter(x => ((x.res || {}).tags || []).includes(t))) { const s = Object.values(p.talk || {}).find(x => x && x.star && x.a); if (s) return {p, text: s.a}; } return null; };
  const ideas = clients.filter(p => (p.res || {}).idea || (p.res || {}).main).map(p => ({p, main: p.res.main, idea: p.res.idea}));
  const about = clients.map(p => ({p, a: ((p.talk || {}).t9 || {}).a})).filter(x => x.a);
  const recs = recommendations().filter(r => r.kind === 'idea').slice(0, 6);
  return `
    ${segChips(stages, seg, base.length)}
    ${kpiRow([[n, n === base.length ? 'анкет клиенток' : 'анкет в сегменте'], [tp ? pct(tp.share) : '—', tp ? `главная боль: ${esc(tp.name.toLowerCase())}` : 'главная боль'],
      [priceHi === null ? '—' : pct(priceHi), `готовы платить от 1 500 ₽ (сейчас ${fmt(PRICE_NOW)} ₽)`], [fit && fit.avg !== null ? `${fmt(fit.avg, 1)} из 5` : '—', 'откликается идея Евы']])}
    ${synBox('product', 'Что улучшить в продукте', 'Claude соберёт 5 главных улучшений с доказательствами из ответов и интервью — готово, чтобы поставить задачами в штабе.')}
    <div class="two section">
      ${card('Что болит', `${pain ? pain.n : 0} ответов`, bars(pain, 'var(--link)'))}
      ${card('Что важно', `${goal ? goal.n : 0} ответов`, bars(goal, 'var(--violet)'))}
      ${card('Спрос на форматы и что могут эксперты', 'доля клиенток, которые хотят · доля экспертов, которые снимут', `<div class="dm">${demand.map(d => `<div class="dm-r"><b>${esc(d.c)}</b>
          <span class="dm-t"><i class="want" style="width:${(d.want * 100).toFixed(0)}%"></i></span><small>${pct(d.want)}</small>
          <span class="dm-t"><i class="can" style="width:${(d.can * 100).toFixed(0)}%"></i></span><small>${pct(d.can)}</small>
          ${d.gap > .15 ? '<em class="st warn">не хватает</em>' : d.gap < -.2 ? '<em class="st">с запасом</em>' : '<em></em>'}</div>`).join('')}</div>
        <div class="cal-legend" style="margin:8px 0 0"><span><i class="cb-dot" style="background:var(--link)"></i>хотят клиентки</span><span><i class="cb-dot" style="background:var(--violet)"></i>готовы снять эксперты</span></div>`)}
      ${card('Время и цена', `подписка сейчас ${fmt(PRICE_NOW)} ₽`, `${bars(time, 'var(--good)')}<div style="height:12px"></div>${bars(price, 'var(--gold)')}`)}
    </div>
    ${cross.length && stages.length > 1 ? `<section class="section card"><div class="card-head"><h2>Боли по этапам жизни</h2><span class="note">сколько человек в сегменте отметили боль · темнее — чаще</span></div>
      <div class="xt-wrap"><table class="xt"><thead><tr><th></th>${stages.map(s => `<th>${esc(noEmo(s))}<small>${base.filter(p => p.answers.stage === s).length}</small></th>`).join('')}</tr></thead>
      <tbody>${cross.map(r => `<tr><td>${esc(noEmo(r.o))}</td>${r.cells.map(c => { const sh = c.n ? c.v / c.n : 0; return `<td style="background:color-mix(in srgb, var(--link) ${(sh * 70).toFixed(0)}%, var(--surface));color:${sh > .5 ? '#fff' : 'inherit'}">${c.v ? `${c.v}<small>${pct(sh)}</small>` : '·'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div></section>` : ''}
    <div class="two section">
      ${card('Что слышим на интервью', 'метки из разбора и пример цитаты', tags.length ? `<div class="tq-list">${tags.map(t => { const q = tagQuote(t.name); return `<div class="tqr"><div class="tqr-h"><b>${esc(noEmo(t.name))}</b><span>${t.v}</span></div>${q ? `<p>«${esc(q.text.length > 150 ? q.text.slice(0, 150) + '…' : q.text)}» <a href="#p-${q.p.id}">${esc(People.name(q.p))}</a></p>` : ''}</div>`; }).join('')}</div>` : '<p class="note">Метки появятся, когда разберёте первые интервью.</p>')}
      ${card('Идеи из интервью', `${ideas.length} ${plural(ideas.length, 'интервью', 'интервью', 'интервью')}`, ideas.length ? `<div class="idea-list">${ideas.map(x => `<a class="idea" href="#p-${x.p.id}">${x.main ? `<b>${esc(x.main)}</b>` : ''}${x.idea ? `<span>${esc(x.idea)}</span>` : ''}<small>${esc(People.name(x.p))}</small></a>`).join('')}</div>` : '<p class="note">В итоге интервью заполняйте «Главный инсайт» и «Что улучшить в Еве» — они соберутся здесь.</p>')}
      ${card('Что говорят про Еву', 'ответы на вопрос о приложении', about.length ? `<div class="stack">${about.slice(0, 6).map(x => `<div class="quote">«${esc(x.a)}»<small><a href="#p-${x.p.id}">${esc(People.name(x.p))}</a></small></div>`).join('')}</div>` : '<p class="note">Пока нет ответов.</p>')}
      ${card('Рекомендации по ответам', '', recs.length ? `<div class="recs">${recs.map(r => `<a class="rec" href="#${r.href}"><b>${esc(r.text)}</b><small><span class="rec-g">${r.type === 'all' ? 'Все группы' : groupName(r.type)}</span>${esc(r.why)}</small></a>`).join('')}</div>` : '<p class="note">Появятся, когда придут первые анкеты.</p>')}
    </div>`;
}

/* ── Маркетинг ── */
function marketingView() {
  const base = answered('client');
  const n = base.length;
  const mode = id => topShare(aggOf('client', id, base));
  const persona = [['Возраст', mode('age')], ['Город', mode('city')], ['Этап жизни', mode('stage')], ['Болит', mode('pain')], ['Хочет', mode('goal')], ['Время в день', mode('time')], ['Когда удобно', mode('when')], ['Готова платить', mode('price')], ['Откуда узнаёт', mode('source')]].filter(x => x[1]);
  const quotes = Stats.quotes().filter(x => x.p.type === 'client').slice(0, 4);
  const source = aggOf('client', 'source', base), when = aggOf('client', 'when', base), tried = aggOf('client', 'tried', base);
  const ambs = People.all('amb');
  const reach = sum(ambs, p => REACH[(p.answers || {}).size] || 0);
  const platforms = {};
  ambs.forEach(p => ((p.answers || {}).where || []).forEach(w => { platforms[w] = (platforms[w] || 0) + 1; }));
  const refs = Store.all('people').map(p => ({p, n: People.invited(p).length})).filter(x => x.n).sort((a, b) => b.n - a.n);
  const invited = Store.all('people').filter(p => p.ref);
  const giveQ = aggOf('partner', 'give', answered('partner')), tellQ = aggOf('partner', 'tell', answered('partner'));
  const stageQ = Questions.set('client').test.find(q => q.id === 'stage');
  const segs = stageQ ? stageQ.o.map(o => { const L = base.filter(p => p.answers.stage === o); const g = topShare(aggOf('client', 'goal', L)), pn = topShare(aggOf('client', 'pain', L)); return {o, n: L.length, g, pn}; }).filter(x => x.n) : [];
  return `
    ${kpiRow([[n, 'анкет клиенток'], [`≈ ${fmt(reach)}`, 'охват амбассадоров'], [invited.length, 'пришли по ссылкам'], [People.all('partner').filter(People.connected).length, 'партнёров подключаем']])}
    ${synBox('marketing', 'Заходы для рекламы', 'Claude предложит 5 заходов для постов и рекламы на языке клиенток: кому, где и почему сработает.')}
    <div class="two section">
      ${card('Портрет клиентки', `самый частый ответ · по ${n} ${plural(n, 'анкете', 'анкетам', 'анкетам')}`, persona.length ? `<div class="persona">${persona.map(([k, x]) => `<div><span>${k}</span><b>${esc(x.name)}</b><small>${pct(x.share)}</small></div>`).join('')}</div>
        ${quotes.length ? `<div class="stack" style="margin-top:12px">${quotes.slice(0, 2).map(x => `<div class="quote">«${esc(x.text)}»<small><a href="#p-${x.p.id}">${esc(People.name(x.p))}</a></small></div>`).join('')}</div>` : ''}` : '<p class="note">Портрет появится с первыми анкетами.</p>')}
      ${card('Сегменты', 'сколько человек · что хотят · что болит', segs.length ? `<div class="segs">${segs.map(s => `<div><b>${esc(noEmo(s.o))}</b><span>${s.n}</span><small>${s.g ? 'хочет: ' + esc(s.g.name.toLowerCase()) : ''}${s.pn ? ' · болит: ' + esc(s.pn.name.toLowerCase()) : ''}</small></div>`).join('')}</div>` : '<p class="note">Пока нет данных.</p>')}
      ${card('Откуда узнают', 'клиентки', bars(source, 'var(--link)'))}
      ${card('Когда удобно', 'время для пушей, постов и эфиров', bars(when, 'var(--gold)'))}
      ${card('Что уже пробовали', 'с чем сравнивают Еву', bars(tried, 'var(--violet)'))}
      ${card('Амбассадоры: где рассказывают', `охват ≈ ${fmt(reach)}`, Object.keys(platforms).length ? hbarList(Object.entries(platforms).map(([name, v]) => ({name: noEmo(name), v})).sort((a, b) => b.v - a.v), {color: 'var(--rose)'}) : '<p class="note">Пока нет анкет амбассадоров.</p>')}
      ${card('Кто приводит людей', 'по единой ссылке', refs.length ? `<div class="tm-list">${refs.slice(0, 8).map(x => `<a class="tm-r" href="#p-${x.p.id}">${avatar(People.name(x.p))}<b>${esc(People.name(x.p))}</b><small>${groupName(x.p.type)}</small><span>${x.n}</span></a>`).join('')}</div>` : '<p class="note">Когда по ссылке придут первые люди, здесь будет видно, кто их привёл.</p>')}
      ${card('Что дают партнёры', 'для совместных акций', giveQ ? `${bars(giveQ, 'var(--good)')}<div style="height:12px"></div>${bars(tellQ, 'var(--good)')}` : '<p class="note">Пока нет анкет партнёров.</p>')}
    </div>`;
}

/* ── Ответы анкеты по группам (как было) с фильтром по сегменту ── */
function answersStatsView() {
  const type = TYPES[View.get('st.type', 'client')] ? View.get('st.type', 'client') : 'client';
  const seg = type === 'client' ? View.get('st.seg', '') : '';
  const stageQ = Questions.set('client').test.find(q => q.id === 'stage');
  const base = People.all(type);
  const list = seg ? base.filter(p => (p.answers || {}).stage === seg) : base;
  const f = Stats.funnel(type);
  const agg = Stats.agg(type, list).filter(a => a.n);
  const nAns = list.filter(p => Object.keys(p.answers || {}).length).length;
  let extra = '';
  if (type === 'expert') {
    const cov = Stats.dirCoverage();
    extra = `<section class="section card"><div class="card-head"><h2>14 направлений</h2><span class="note">закрыто ${cov.filter(x => x.n).length} из ${cov.length} · розовые — экспертов пока нет</span></div>
      <div class="coverage">${cov.map(x => `<div class="cov ${x.n ? '' : 'zero'}"><b>${esc(noEmo(x.d))}</b>${x.n ? `<small>${x.n} ${plural(x.n, 'эксперт', 'эксперта', 'экспертов')}</small>${x.yes ? `<small>подключаем: ${x.yes}</small>` : ''}${x.course ? `<small>хотят курс: ${x.course}</small>` : ''}` : '<small>ищем</small>'}</div>`).join('')}</div></section>`;
  } else if (type === 'partner') {
    const cats = Stats.catCoverage().filter(x => x.n);
    extra = `<section class="section card"><div class="card-head"><h2>Партнёры по категориям</h2><span class="note">${cats.length} из ${PARTNER_CATS.length} категорий</span></div>
      ${cats.length ? hbarList(cats.map(x => ({name: noEmo(x.c), v: x.n, yes: x.yes})), {color: 'var(--good)', sub: r => (r.yes ? `подключаем ${r.yes}` : '')}) : '<p class="note">Пока нет партнёров.</p>'}</section>`;
  }
  return `
    <div class="st-sub">${Object.keys(TYPES).map(k => `<button class="chip ${k === type ? 'on' : ''}" data-tab-key="st.type" data-tab="${k}">${groupName(k)}<span class="chip-n">${People.all(k).length}</span></button>`).join('')}</div>
    ${type === 'client' && stageQ ? segChips(stageQ.o.filter(o => base.some(p => (p.answers || {}).stage === o)), seg, f.answered) : ''}
    ${kpiRow([[f.all, 'в базе'], [nAns, seg ? 'анкет в сегменте' : 'анкет заполнено'], [base.filter(p => p.s2 === 'done').length, type === 'client' ? 'интервью проведено' : 'созвонов проведено'], [f.yes, type === 'client' ? 'интервью разобрано' : 'подключаем']])}
    ${extra}
    <section class="section"><div class="section-head"><h2>Ответы анкеты</h2><span class="hint-inline">по ${nAns} ${plural(nAns, 'анкете', 'анкетам', 'анкетам')} · где можно выбрать несколько, сумма больше 100%</span></div>
      ${agg.length ? `<div class="qstats">${agg.map(qStatCard).join('')}</div>` : '<p class="note">Графики появятся, когда придут первые анкеты.</p>'}</section>`;
}

/* фильтр по этапу жизни: «Все · Мама малыша · Карьера …» */
function segChips(opts, cur, total) {
  if (!opts.length) return '';
  return `<div class="chip-row st-seg"><span class="note">Сегмент:</span><button class="chip ${!cur ? 'on' : ''}" data-seg="">Все<span class="chip-n">${total}</span></button>${opts.map(o => `<button class="chip ${cur === o ? 'on' : ''}" data-seg="${esc(o)}">${esc(noEmo(o))}<span class="chip-n">${answered('client').filter(p => p.answers.stage === o).length}</span></button>`).join('')}</div>`;
}

/* один вопрос анкеты: вариант — полоса — сколько человек — доля.
   Один ответ (возраст, цена, время) — в порядке вариантов, чтобы шкала
   читалась слева направо; несколько ответов — от частых к редким. */
function qStatCard(a) {
  const colors = ['var(--link)', 'var(--violet)', 'var(--good)', 'var(--gold)'];
  const color = colors[hashStr(a.q.id) % colors.length];
  const rows = a.q.k === 'many' ? a.rows.slice().sort((x, y) => y.v - x.v) : a.rows;
  return `<div class="card qstat"><div class="qstat-h"><h3>${esc(noEmo(a.q.t))}</h3><span>${a.n} ${plural(a.n, 'ответ', 'ответа', 'ответов')}${a.q.k === 'many' ? ' · несколько' : ''}</span></div>
    ${a.q.k === 'scale' && a.avg !== null ? `<p class="qstat-avg">В среднем <b>${fmt(a.avg, 1)}</b> из 5</p>` : ''}
    ${hbarList(rows.map(r => ({name: noEmo(r.name), v: r.v})), {color, sub: r => (a.n ? pct(r.v / a.n) : '')})}</div>`;
}

/* ── сводки Claude для основателя и маркетолога ── */
function synBox(key, title, lead) {
  const s = Syn[key];
  const canAsk = People.canEdit();
  const head = `<div class="ai-h"><span class="ai-mark">${brandMark()}</span><div><b>${title} — сводка от Claude</b><span class="note">${lead}</span></div><span class="sp"></span>
    ${canAsk ? `<button class="btn sm ${s && s.data ? '' : 'primary'}" data-syn="${key}" ${s && s.loading ? 'disabled' : ''}>${s && s.loading ? 'Claude думает…' : s && s.data ? 'Обновить' : 'Собрать сводку'}</button>` : ''}
    ${s && s.data ? `<button class="btn sm ghost" data-syn-copy="${key}">${icon('copy')}Скопировать</button>` : ''}</div>`;
  if (!s || (!s.data && !s.err)) return `<div class="ai-box section">${head}</div>`;
  if (s.err) return `<div class="ai-box section">${head}<p class="warnline" style="margin-top:10px">${esc(s.err)}</p></div>`;
  const items = s.data.items || [];
  return `<div class="ai-box section">${head}<ol class="syn">${items.map(it => `<li><b>${esc(it.title || '')}</b>${it.evidence ? `<span>${esc(it.evidence)}</span>` : ''}${it.action ? `<em>${esc(it.action)}</em>` : ''}</li>`).join('')}</ol></div>`;
}
function synText(key) {
  const s = Syn[key];
  return ((s && s.data && s.data.items) || []).map((it, i) => `${i + 1}. ${it.title}\n   ${it.evidence || ''}\n   → ${it.action || ''}`).join('\n\n');
}
/* что отдаём Claude: только сводные цифры, метки, инсайты и цитаты — без контактов */
function statsDigest() {
  const base = answered('client');
  const line = (label, id) => { const a = aggOf('client', id, base); return a ? `${label}: ${a.rows.slice().sort((x, y) => y.v - x.v).filter(r => r.v).map(r => `${noEmo(r.name)} — ${r.v} из ${a.n}`).join('; ')}` : ''; };
  const tags = Stats.insightTags().map(t => `${noEmo(t.name)} — ${t.v}`).join('; ');
  const ideas = People.all('client').map(p => [(p.res || {}).main, (p.res || {}).idea].filter(Boolean).join(' / ')).filter(Boolean).map(x => '- ' + x).join('\n');
  const quotes = Stats.quotes().filter(x => x.p.type === 'client').slice(0, 10).map(x => `- «${x.text}»`).join('\n');
  const about = People.all('client').map(p => ((p.talk || {}).t9 || {}).a).filter(Boolean).map(x => '- ' + x).join('\n');
  const ex = answered('expert');
  const rec = ex.length ? `Эксперты готовы снять (из ${ex.length}): ` + FORMAT_MAP.map(([, e]) => `${e} — ${ex.filter(p => [].concat((p.answers || {}).record || []).some(x => noEmo(x).startsWith(e))).length}`).join('; ') : '';
  const cov = Stats.dirCoverage().filter(x => !x.n).map(x => noEmo(x.d)).join(', ');
  const amb = People.all('amb');
  return [`Анкет клиенток: ${base.length}.`, line('Возраст', 'age'), line('Этап жизни', 'stage'), line('Болит', 'pain'), line('Важно', 'goal'), line('Время в день', 'time'), line('Когда удобно', 'when'),
    line('Пробовали', 'tried'), line('Интересно в Еве', 'formats'), line('Готовы платить в месяц', 'price'), line('Откуда узнали', 'source'),
    tags ? `Метки из интервью: ${tags}` : '', ideas ? `Инсайты и идеи из интервью:\n${ideas}` : '', quotes ? `Яркие цитаты:\n${quotes}` : '', about ? `Что говорят про приложение:\n${about}` : '',
    rec, cov ? `Направления без экспертов: ${cov}` : '', amb.length ? `Амбассадоров: ${amb.length}, охват около ${fmt(sum(amb, p => REACH[(p.answers || {}).size] || 0))}` : ''].filter(Boolean).join('\n');
}
async function synthesize(key) {
  let sample = null;
  try { sample = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('sample') : null; } catch (e) { sample = null; }
  if (!sample) throw {code: 'unavailable'};
  const about = 'Eva Space — приложение для женщин 25–45: программа коротких практик под этап жизни, проверенные эксперты, мастер-классы и курсы, сообщество, ИИ-помощница Ева. Подписка 2 900 ₽ в месяц.';
  const task = key === 'product'
    ? 'Ты — продуктовый аналитик. По данным кастдева назови 5 главных улучшений продукта, от самого важного. Для каждого: что сделать, на каких данных это основано (цифры или цитата), первый шаг на эту неделю.'
    : 'Ты — маркетолог. По данным кастдева предложи 5 заходов для постов и рекламы на языке клиенток. Для каждого: заход (заголовок как в посте), кому он (сегмент) и почему сработает (цифры или цитата), где запускать (канал из данных).';
  const shape = key === 'product'
    ? '{"items": [{"title": "что улучшить, до 90 знаков", "evidence": "на чём основано, до 160 знаков", "action": "первый шаг, до 120 знаков"}]}'
    : '{"items": [{"title": "заход — как заголовок поста, до 90 знаков", "evidence": "кому и почему сработает, до 160 знаков", "action": "где и как запустить, до 120 знаков"}]}';
  const input = `${about}\n${task}\nОпирайся только на данные ниже, ничего не выдумывай. Пиши по-русски, коротко, без канцелярита.\n\nДанные:\n${statsDigest()}\n\nВерни только JSON такого вида: ${shape}`;
  const out = await sample.json(input, {modelTier: 'default'});
  return {items: (Array.isArray(out.items) ? out.items : []).slice(0, 5)};
}

/* ── 20-board.js ── */
/* Страница группы (кастдев, эксперты, партнёры, амбассадоры): три шага
   общения колонками — анкета → созвон → итог. На карточке — имя, одна
   строка о человеке, статус (только если он что-то добавляет) и одна-две
   кнопки следующего действия. */

const stChip = (tone, text) => `<span class="st ${tone}">${esc(text)}</span>`;
/* 'сегодня' · 'вчера' · '3 дня' */
function sinceDays(ts) {
  const d = Math.floor((Date.now() - ts) / 864e5);
  return d <= 0 ? 'сегодня' : d === 1 ? 'вчера' : `${d} ${plural(d, 'день', 'дня', 'дней')}`;
}
/* статус на карточке: пусто, если кнопка рядом и так говорит, что делать */
function statusLine(p) {
  const c = People.col(p);
  if (c === 1) return p.s1 === 'sent' ? stChip('warn', `Ждём ответы${p.sentAt ? ' · ' + sinceDays(p.sentAt) : ''}`) : '';
  if (c === 2) {
    if (p.s2 === 'set') return stChip('violet', p.callAt ? `Созвон ${when(p.callAt)}` : 'Созвон назначен');
    if (p.s2 === 'noshow') return stChip('bad', 'Созвон не состоялся');
    return '';
  }
  const s = s3Map(p.type)[p.s3 || 'none'];
  return (p.s3 || 'none') !== 'none' ? stChip(s.tone, s.name) : '';
}
/* кнопки следующего шага: одни и те же на доске и в карточке (big — в карточке, больше вариантов) */
function nextActs(p, big = false) {
  if (!People.canEdit()) return '';
  const b = (act, label, primary = false) => `<button class="btn ${big ? 'sm' : 'xs'} ${primary ? 'primary' : ''}" data-act="${act}" data-pid="${p.id}">${label}</button>`;
  const talk = p.type === 'client' ? 'интервью' : 'созвон';
  const c = People.col(p);
  if (c === 1) return (p.s1 === 'sent' ? b('link', 'Ссылка ещё раз') : b('link', 'Отправить анкету', true)) + b('fill', 'Заполнить') + (big ? b('skip1', 'Без анкеты') : '');
  if (c === 2) {
    if (p.s2 === 'set') return b('talk', `Начать ${talk}`, true) + b('done2', p.type === 'client' ? 'Прошло' : 'Прошёл') + (big ? b('time', 'Перенести') + b('noshow', 'Не состоялся') : '');
    return b('time', 'Назначить созвон', true) + (big ? b('talk', `Начать ${talk} сейчас`) + b('skip2', 'Без созвона') : '');
  }
  const s3 = p.s3 || 'none';
  if (p.type === 'client') return s3 === 'none' ? b('result', 'Разобрать интервью', true) : '';
  if (s3 === 'none') return b('yes', 'Подключаем', true) + b('think', 'Думает') + b('no', 'Не сейчас');
  if (s3 === 'think') return b('yes', 'Подключаем', true) + b('no', 'Не сейчас');
  return '';
}
/* обработчик всех кнопок шагов */
function wireActs(root) {
  on(root, 'click', '[data-act]', async (e, el) => {
    e.stopPropagation();
    const p = People.get(el.dataset.pid);
    if (!p) return;
    const act = el.dataset.act;
    const T = TYPES[p.type];
    if (act === 'link') {
      await copyOrShow(People.link(p), 'Ссылка скопирована 💌 Отправьте её в Telegram или WhatsApp');
      if ((p.s1 || 'new') === 'new') People.patch(p.id, {s1: 'sent', sentAt: Date.now()}, 'Отправили ссылку на анкету', '🔗');
    } else if (act === 'fill') { View.set('pp.last', p.id); View.set('pp.tab', 'anketa'); View.set('pp.edit', true); App.go('p-' + p.id); }
    else if (act === 'skip1') People.patch(p.id, {s1: 'skip'}, 'Решили без анкеты', '⏭');
    else if (act === 'time') openTimePicker(p);
    else if (act === 'talk') { Timer.start(p.id); View.set('pp.last', p.id); View.set('pp.tab', 'talk'); App.go('p-' + p.id); }
    else if (act === 'done2') { People.patch(p.id, {s2: 'done', talkAt: p.talkAt || Date.now()}, `${p.type === 'client' ? 'Интервью' : 'Созвон'} прошёл`, '✅'); syncCall(p.id); }
    else if (act === 'noshow') People.patch(p.id, {s2: 'noshow'}, 'Не пришла на созвон', '🙈');
    else if (act === 'skip2') People.patch(p.id, {s2: 'skip'}, 'Без созвона', '⏭');
    else if (act === 'result') { View.set('pp.last', p.id); View.set('pp.tab', 'result'); App.go('p-' + p.id); }
    else if (['yes', 'think', 'no'].includes(act)) { const s = S3.other[act]; People.patch(p.id, {s3: act}, `Итог: ${s.name}`, s.emo); toast(`${s.emo} ${People.name(p)}: ${s.name.toLowerCase()}`); }
    void T;
  });
}

/* быстро добавить человека: имя, контакт — и сразу ссылка */

  const T = TYPES[type];

  openModal({title: `${T.one}: добавить`, body: `
      <label class="field"><span>${type === 'partner' ? 'Название' : 'Имя'}</span><input class="input" id="adName" placeholder="${type === 'partner' ? 'Студия «Баланс»' : 'Анна Иванова'}"></label>
      <div class="grid2"><label class="field"><span>Telegram или телефон</span><input class="input" id="adTg" placeholder="@username"></label>
      <label class="field"><span>Город</span><input class="input" id="adCity" placeholder="Москва"></label></div>
      ${extra}
      <p class="note">Ссылка на анкету скопируется сама — отправьте её человеку. Ответы попадут в карточку.</p>`,
    foot: '<button class="btn" data-close>Отмена</button><button class="btn" data-only>Просто добавить</button><button class="btn primary" data-ok>Добавить и скопировать ссылку</button>',
    onMount(el, close) {
      on(el, 'click', '#adDirs button', (ev, b) => b.classList.toggle('on'));
      const save = async withLink => {
        const name = $('#adName', el).value.trim();
        if (!name) { $('#adName', el).classList.add('need'); $('#adName', el).focus(); return; }
        const f = {type, name, tg: $('#adTg', el).value.trim(), city: $('#adCity', el).value.trim()};

        if (type === 'partner') { f.cat = $('#adCat', el).value; f.contact = $('#adContact', el).value.trim(); }
        const id = People.create(f);
        close();
        if (withLink) {
          const p = People.get(id);
          await copyOrShow(People.link(p), 'Ссылка скопирована 💌 Отправьте её человеку');
          People.patch(id, {s1: 'sent', sentAt: Date.now()}, 'Отправили ссылку на анкету', '🔗');
        } else toast(`${name}: добавлено ✨`);
      };
      $('[data-ok]', el).onclick = () => save(true);
      $('[data-only]', el).onclick = () => save(false);
    }});
}

            <div class="b3-list">${cols[i].map(p => { const st = statusLine(p), acts = nextActs(p); return `<div class="pc" data-open="${p.id}" data-drag="${p.id}">

}

/* ── 21-person.js ── */
/* Карточка человека: три шага крупно, анкета (ответы кнопками), режим
   созвона (вопросы + заметки + звёздочка у яркой цитаты), итог и история.
   Всё сохраняется само — кнопки «Сохранить» почти нигде не нужны. */

/* ── анкета кнопками: общая для ручного заполнения ── */
function fillFormHtml(type, answers, prefix = 'fa') {
  return `<div class="fill">${Questions.test(type).map((q, i) => {
    const v = answers[q.id];
    let ctl = '';
    if (q.k === 'one' || q.k === 'many') {
      const sel = answerLabels(q, v);
      ctl = `<div class="ans" data-q="${q.id}" data-k="${q.k}" data-max="${q.max || 0}">${(q.o || []).map(o => `<button type="button" class="${sel.includes(o) ? 'on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    } else if (q.k === 'scale') {
      ctl = `<div class="scale num-scale" data-q="${q.id}" data-k="scale">${[1, 2, 3, 4, 5].map(j => `<button type="button" class="${Number(v) === j ? 'on' : ''}" data-v="${j}">${j}</button>`).join('')}<span class="scale-ends">1 — ${esc(q.lo || 'совсем нет')}, 5 — ${esc(q.hi || 'очень')}</span></div>`;
    } else if (q.k === 'text') {
      ctl = `<textarea class="textarea" data-q="${q.id}" data-k="text" placeholder="${esc(q.ph || '')}">${esc(v || '')}</textarea>`;
    } else {
      ctl = `<input class="input" data-q="${q.id}" data-k="short" value="${esc(v || '')}" placeholder="${esc(q.ph || '')}">`;
    }
    return `<div class="fq"><div class="fq-t"><i>${i + 1}</i><span>${esc(q.t)}${q.k === 'many' && q.max ? ` <span class="fq-hint">· до ${q.max}</span>` : ''}</span></div><div class="fq-v">${ctl}</div></div>`;
  }).join('')}</div>`;
}
function wireFill(el) {
  on(el, 'click', '.ans button', (e, b) => {
    const box = b.closest('.ans');
    if (box.dataset.k === 'one') { $$('button', box).forEach(x => x !== b && x.classList.remove('on')); b.classList.toggle('on'); return; }
    const max = Number(box.dataset.max) || 99;
    if (!b.classList.contains('on') && $$('button.on', box).length >= max) { toast(`Можно выбрать до ${max}`); return; }
    b.classList.toggle('on');
  });
  on(el, 'click', '.scale button', (e, b) => { const box = b.closest('.scale'); $$('button', box).forEach(x => x !== b && x.classList.remove('on')); b.classList.toggle('on'); });
}
function readFill(el) {
  const out = {};
  $$('[data-q]', el).forEach(n => {
    const id = n.dataset.q, k = n.dataset.k;
    if (k === 'one') { const b = $('button.on', n); if (b) out[id] = b.dataset.v; }
    else if (k === 'many') { const L = $$('button.on', n).map(b => b.dataset.v); if (L.length) out[id] = L; }
    else if (k === 'scale') { const b = $('button.on', n); if (b) out[id] = Number(b.dataset.v); }
    else { const v = n.value.trim(); if (v) out[id] = v; }
  });
  return out;
}
function answersView(type, answers) {
  const qs = Questions.set(type).test;
  const ids = Object.keys(answers || {});
  if (!ids.length) return '';
  const ordered = [...qs.filter(q => ids.includes(q.id)), ...ids.filter(id => !qs.some(q => q.id === id)).map(id => ({id, t: id, k: 'short'}))];
  return ordered.map((q, i) => {
    const labels = q.k === 'scale' ? [`${answers[q.id]} из 5`] : answerLabels(q, answers[q.id]).map(noEmo);
    return `<div class="fq"><div class="fq-t"><i>${i + 1}</i><span>${esc(noEmo(q.t))}${q.hidden ? ' <span class="fq-hint">· скрытый вопрос</span>' : ''}</span></div>
      <div class="fq-v answer-val">${['short', 'text'].includes(q.k) ? `<em>${esc(labels.join(''))}</em>` : labels.map(l => `<span>${esc(l)}</span>`).join('')}</div></div>`;
  }).join('');
}

    <button class="btn sm ${d && d.data ? '' : 'primary'}" data-ai ${d && d.loading ? 'disabled' : ''}>${d && d.loading ? 'Claude думает…' : d && d.data ? 'Ещё раз' : 'Разобрать с Claude'}</button></div>`;

    : [x.decision ? ['Решение', esc(S3.other[x.decision].name)] : null, x.next ? ['Следующий шаг', esc(x.next)] : null, x.note ? ['Заметка', esc(x.note)] : null];
  return `<div class="ai-box">${head}
    <div class="ai-rows">${rows.filter(Boolean).map(([k, v]) => `<div><span>${k}</span><div>${v}</div></div>`).join('')}
      ${(x.tags || []).length ? `<div><span>Метки</span><div class="ai-tags">${x.tags.map(t => `<i>${esc(noEmo(t))}</i>`).join('')}</div></div>` : ''}
      ${x.why ? `<div><span>Почему так</span><div class="note">${esc(x.why)}</div></div>` : ''}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm primary" data-ai-apply>Применить — заполнить пустые поля и метки</button><button class="btn sm ghost" data-ai-hide>Скрыть</button></div></div>`;
}

/* ── 23-interview.js ── */
/* Режим интервью: всё, что нужно в Zoom, на одном экране.
   Слева — сценарий начала, вопросы с заметками (задан / звёздочка — яркая
   цитата), «что ещё прозвучало» и сценарий завершения. Справа — что уже
   знаем из анкеты, метки на лету и шпаргалка уточняющих вопросов. Таймер
   помнится в этом браузере и не сбрасывается от перерисовки; «Завершить
   интервью» сохраняет длительность и открывает итог. */

/* ── таймер: {start, acc} в состоянии вида — переживает перерисовку и перезагрузку ── */
const Timer = {
  id: null,
  get(pid) { return View.get('tm.' + pid, null); },
  secs(pid) { const t = this.get(pid); return t ? Math.floor(((t.start ? Date.now() - t.start : 0) + (t.acc || 0)) / 1000) : 0; },
  running(pid) { const t = this.get(pid); return !!(t && t.start); },
  start(pid) { const t = this.get(pid) || {acc: 0}; if (!t.start) { t.start = Date.now(); View.set('tm.' + pid, t); } },
  toggle(pid) {
    const t = this.get(pid) || {acc: 0};
    if (t.start) { t.acc = (t.acc || 0) + Date.now() - t.start; t.start = null; } else t.start = Date.now();
    View.set('tm.' + pid, t);
  },
  reset(pid) { View.set('tm.' + pid, null); },
  /* одна секундная стрелка на всё окно: обновляет все таймеры на экране */
  wire() {
    if (this.id) return;
    this.id = setInterval(() => $$('[data-timer-for]').forEach(el => { el.textContent = dur(Timer.secs(el.dataset.timerFor)); }), 1000);
  },
};

function knownRows(p) {
  const a = p.answers || {};
  const qs = Questions.set(p.type).test;
  const seen = new Set();
  const val = (q, v) => (q && q.k === 'scale' ? `${v} из 5` : (q ? answerLabels(q, v) : [].concat(v)).map(noEmo).join(', '));
  const rows = (KNOWN[p.type] || []).filter(([id]) => a[id] !== undefined && a[id] !== '' && !(Array.isArray(a[id]) && !a[id].length)).map(([id, label]) => { seen.add(id); return [label, val(qs.find(q => q.id === id), a[id])]; });
  qs.forEach(q => { if (!seen.has(q.id) && !['name', 'tg', 'call', 'social', 'addr', 'contact'].includes(q.id) && a[q.id] !== undefined && a[q.id] !== '') rows.push([noEmo(q.t).replace(/\?.*$/, ''), val(q, a[q.id])]); });
  return rows;
}

  if (secs >= 60) patch.callDur = secs;
  if (!p.callAt) { patch.callAt = Date.now() - secs * 1000; patch.callMin = callMin(p); }

/* Google Календарь — через коннектор Claude (capability mcp) и от имени

const GCAL = 'Google Calendar';
const CRM_TAG = '#eva-crm';
const TZ_LOCAL = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Moscow'; } catch (e) { return 'Europe/Moscow'; } })();
const GCAL_ERR = {
  needs_reauth: 'Доступ к Google Календарю истёк. Переподключите его: claude.ai → Настройки → Коннекторы → Google Calendar — и обновите страницу.',
  server_not_connected: 'Google Календарь не подключён к вашему Claude. Добавьте его: claude.ai → Настройки → Коннекторы → Google Calendar — и обновите страницу.',
  selection_required: 'У вас подключено несколько Google Календарей — Claude попросит выбрать один. Если окно закрыли, обновите страницу.',
  not_in_manifest: 'Доступ к календарю для этой страницы выключен или отклонён. Разрешите Google Календарь в настройках артефакта и обновите страницу.',
  blocked_by_policy: 'Организация запретила этот инструмент Google Календаря.',
  approval_required: 'Нужно разрешение администратора организации на Google Календарь.',
  server_not_found: 'Коннектор Google Календаря не найден. Подключите его заново: claude.ai → Настройки → Коннекторы.',
  consent_required: 'CRM нужен доступ к Google Календарю — нажмите «Подключить» ещё раз и подтвердите.',
  server_unavailable: 'Google Календарь сейчас не отвечает. Попробуйте через минуту.',
  rate_limited: 'Слишком много запросов к календарю — подождите немного.',
  cancelled: 'Действие отменено.',
};
const GCAL_OFF = ['not_granted', 'capability_disabled', 'capability_removed'];
const GCAL_CONN = ['needs_reauth', 'server_not_connected', 'selection_required', 'not_in_manifest', 'blocked_by_policy', 'approval_required', 'server_not_found', 'consent_required'];
function gcalErr(e) {
  const code = (e && e.code) || 'upstream_error';
  let text = GCAL_ERR[code];
  if (!text && GCAL_OFF.includes(code)) text = 'Google Календарь недоступен в этом окне — откройте CRM в Claude.';
  if (!text && code === 'tool_error') text = 'Google ответил ошибкой: ' + ((e && e.message) || 'без подробностей');
  if (!text) text = 'Не получилось связаться с Google Календарём' + (e && e.message ? ': ' + e.message : '') + '.';
  /* для записи «не ответил» не значит «не сделал» — повторять только после проверки */
  const ambiguous = code === 'server_unavailable' || code === 'upstream_error' || !(code in GCAL_ERR || GCAL_OFF.includes(code) || code === 'tool_error' || code === 'bad_request');

const gwait = ms => new Promise(r => setTimeout(r, ms));
const gEventOf = res => (res && (res.event || res.createdEvent || res.updatedEvent)) || res || {};
function gRange(ev) {
  const s = ev.start || {}, e = ev.end || {};
  if (s.dateTime) { const a = Date.parse(s.dateTime); return {start: a, end: Date.parse(e.dateTime || s.dateTime) || a, allDay: false}; }
  if (s.date) { const d0 = String(s.date).slice(0, 10); const d1 = e.date ? String(e.date).slice(0, 10) : addDays(d0, 1); return {start: dateOf(d0).getTime(), end: dateOf(d1 > d0 ? d1 : addDays(d0, 1)).getTime(), allDay: true}; }

}
const gIsCrm = ev => String(ev.description || '').includes(CRM_TAG) || /^CRM ·/.test(String(ev.summary || ''));
function gBusy(ev) {
  if (ev.transparency === 'transparent' || ev.availability === 'AVAILABILITY_FREE') return false;
  const me = (ev.attendees || []).find(a => a.self);
  return !(me && me.responseStatus === 'declined');

const Gcal = {
  api: undefined,
  conn: 'checking',     // checking · ready · prompt · denied · off · error
  err: null,
  week: {},             // понедельник → {events, at} | {loading} | {err} — только в памяти этого окна
  busy: false,
  _init: null,
  _reconciled: false,

  init() {
    if (this._init) return this._init;
    this._init = (async () => {
      try { this.api = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('mcp') : null; }
      catch (e) { this.api = null; }
      if (!this.api) { this.conn = 'off'; App.renderSoon(); return; }
      let st = 'prompt';
      try {
        const perms = await window.claude.use('permissions');
        if (perms) st = await perms.state('mcp:' + GCAL).catch(() => 'unavailable');
      } catch (e) { st = 'prompt'; }
      this.conn = st === 'unavailable' ? 'off' : st === 'denied' ? 'denied' : st === 'granted' ? 'ready' : 'prompt';
      App.renderSoon();
      if (this.conn === 'ready') this.reconcile();
    })();
    return this._init;
  },
  usable() { return this.conn === 'ready' || this.conn === 'prompt'; },
  /* ставить ли созвоны в Google по умолчанию — выбор каждого в своём браузере */
  auto() { return this.conn === 'ready' && View.get('gcal.auto', true) !== false; },
  setErr(e) {
    const x = gcalErr(e);
    if (x.off) { this.conn = 'off'; this.err = null; }
    else if (x.conn) { this.conn = 'error'; this.err = x; }
    return x;
  },

  /* read — чтение: одна тихая повторная попытка, если Google разрешил; запись не повторяем */
  async call(tool, input, read = false) {
    await this.init();
    if (!this.api) throw {code: 'capability_disabled'};
    const run = () => this.api.callTool(GCAL, tool, input, read ? undefined : {cache: false});
    let r;
    try { r = await run(); }
    catch (e) {
      if (!(read && e && e.retryable)) { this.setErr(e); throw e; }
      await gwait(Math.min(60000, e.retryAfterMs || 700 + Math.random() * 1300));
      try { r = await run(); } catch (e2) { this.setErr(e2); throw e2; }
    }
    const wasReady = this.conn === 'ready';
    this.conn = 'ready';
    this.err = null;
    if (!wasReady) { App.renderSoon(); this.reconcile(); }
    return r && r.payload !== undefined ? r.payload : r;
  },

  async events(fromMs, toMs) {
    const input = {startTime: new Date(fromMs).toISOString(), endTime: new Date(toMs).toISOString(), orderBy: 'startTime', pageSize: 250, timeZone: TZ_LOCAL};
    let list = [], token = null;
    for (let page = 0; page < 4; page++) {
      const res = await this.call('list_events', token ? {...input, pageToken: token} : input, true);
      list = list.concat(Array.isArray(res) ? res : (res && (res.events || res.items)) || []);
      token = res && res.nextPageToken;
      if (!token) break;
    }
    return list.filter(ev => ev && ev.status !== 'cancelled');
  },

  /* свои события недели — только для сетки, в базу не попадают */
  async loadWeek(ws, force = false) {
    if (!force && this.week[ws] && !this.week[ws].err) return;
    this.week[ws] = {loading: true};
    try {
      const a = dateOf(ws).getTime(), b = dateOf(addDays(ws, 7)).getTime();
      this.week[ws] = {events: await this.events(a, b), at: Date.now()};
    } catch (e) {
      this.week[ws] = {err: gcalErr(e)};
    }
    App.renderSoon();
  },
  /* подключить: первое чтение само спросит разрешение */
  async connect(ws) {
    this.week = {};
    await this.loadWeek(ws, true);
    const w = this.week[ws];
    if (w && w.err && !w.err.conn && !w.err.off) toast(w.err.text, {error: true});

  },

  /* событие созвона */
  title(p) { return `CRM · ${p.type === 'client' ? 'Интервью' : p.type === 'partner' ? 'Встреча' : 'Созвон'}: ${People.name(p)}${p.type === 'client' ? '' : ' (' + TYPES[p.type].one.toLowerCase() + ')'}`; },
  desc(p) {
    const url = (settings().crmUrl || LINKS.crm) + '#p-' + p.id;
    const lines = [`Созвон из Eva CRM — ${groupName(p.type)}.`, `Карточка: ${url}`];
    if (p.zoom) lines.push(`Zoom: ${p.zoom}`);
    if (p.tg) lines.push(`Контакт: ${p.tg}`);

  },
  sig(p) { return [p.callAt, callMin(p), this.title(p), p.zoom || ''].join('|'); },
  mine(p) { return !!(p.gcal && p.gcal.id && p.gcal.by === Who.id()); },
  wanted(p) { return !!p.callAt && ['set', 'done', 'noshow'].includes(p.s2); },

  /* поставить или обновить событие; true — получилось */
  async push(p, {silent = false} = {}) {

    const input = {summary: this.title(p), description: this.desc(p), startTime: new Date(p.callAt).toISOString(), endTime: new Date(p.callAt + callMin(p) * 60e3).toISOString(), timeZone: TZ_LOCAL, colorId: '4', notificationLevel: 'NONE'};

    } catch (e) {

const DURS = [20, 30, 45, 60, 90];
const GROUP_TONE = {client: 'g-client', expert: 'g-expert', partner: 'g-partner', amb: 'g-amb'};
const CallUI = {ws: null, month: null};

/* ── созвоны ── */
const hasCall = p => !!p.callAt && ['set', 'done', 'noshow'].includes(p.s2 || 'none');
function callState(p) {
  if (p.s2 === 'done') return 'done';
  if (p.s2 === 'noshow') return 'noshow';
  return p.callAt + callMin(p) * 60e3 < Date.now() ? 'late' : 'set';
}
const CALL_STATE = {set: 'назначен', late: 'прошёл? отметьте', done: 'прошёл', noshow: 'не состоялся'};
const callsBetween = (a, b) => Store.all('people').filter(p => hasCall(p) && p.callAt >= a && p.callAt < b).sort((x, y) => x.callAt - y.callAt);
const minOfDay = ts => { const d = new Date(ts); return d.getHours() * 60 + d.getMinutes(); };
const tsOf = (iso, min) => { const d = dateOf(iso); d.setHours(Math.floor(min / 60), min % 60, 0, 0); return d.getTime(); };
const hmMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
/* после любой смены времени или статуса — привести своё событие в Google */
const syncCall = id => setTimeout(() => Gcal.sync(People.get(id)), 60);

/* ── назначить или перенести созвон ── */
function openTimePicker(p, preset = null) {
  Gcal.init();
  const base = preset ? preset.ts : p.callAt || (() => { const d = new Date(Date.now() + 864e5); d.setHours(12, 0, 0, 0); return d.getTime(); })();
  const d = new Date(base);
  const local = `${isoOf(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const pref = (p.answers || {}).call || (p.answers || {}).when || '';
  const dur = callMin(p);
  const gOn = Gcal.usable();
  const busyWith = ts => {
    const e = ts + Number(($('#tpDur') || {}).value || dur) * 60e3;
    const crm = Store.all('people').filter(x => x.id !== p.id && hasCall(x) && x.s2 === 'set' && x.callAt < e && x.callAt + callMin(x) * 60e3 > ts).map(x => `${hmMin(minOfDay(x.callAt))} ${People.name(x)}`);
    const ws = weekStart(isoTs(ts));
    const g = ((Gcal.week[ws] || {}).events || []).filter(ev => !gIsCrm(ev) && gBusy(ev)).map(ev => ({ev, r: gRange(ev)})).filter(x => x.r && !x.r.allDay && x.r.start < e && x.r.end > ts).map(x => `${hmMin(minOfDay(x.r.start))} ${x.ev.summary || 'занято'}`);
    return [...crm.map(x => 'CRM: ' + x), ...g.map(x => 'Google: ' + x)];
  };
  openModal({title: `${p.callAt && p.s2 === 'set' ? 'Перенести' : 'Назначить'} созвон: ${People.name(p)}`, body: `
      ${pref ? `<div class="warnline" style="background:var(--violet-soft);color:var(--violet)">В анкете удобно: «${esc(noEmo(Array.isArray(pref) ? pref.join(', ') : pref))}»</div>` : ''}
      <div class="grid2"><label class="field"><span>Когда</span><input class="input" type="datetime-local" id="tpWhen" value="${local}" step="900"></label>
      <label class="field"><span>Сколько</span><select class="select" id="tpDur">${DURS.map(m => `<option value="${m}" ${m === dur ? 'selected' : ''}>${m} минут</option>`).join('')}</select></label></div>
      <div class="chip-row">${[['Завтра 12:00', 1, 12], ['Завтра 19:00', 1, 19], ['Послезавтра 12:00', 2, 12], ['Через неделю', 7, 12]].map(([n, dd, hh]) => `<button class="chip" data-quick="${dd}|${hh}">${n}</button>`).join('')}</div>
      <div id="tpBusy"></div>
      <label class="field"><span>Ссылка на Zoom (необязательно)</span><input class="input" id="tpZoom" value="${esc(p.zoom || '')}" placeholder="https://zoom.us/j/…"></label>
      ${gOn ? `<label class="check"><input type="checkbox" id="tpG" ${Gcal.auto() || Gcal.mine(p) ? 'checked' : ''}> Поставить в мой Google Календарь${Gcal.mine(p) ? ' (событие уже есть — обновится)' : ''}</label>` : ''}`,
    foot: '<button class="btn" data-close>Отмена</button><button class="btn primary" data-ok>Сохранить</button>',
    onMount(el, close) {
      const paintBusy = () => {
        const v = $('#tpWhen', el).value;
        const list = v ? busyWith(new Date(v).getTime()) : [];
        $('#tpBusy', el).innerHTML = list.length ? `<div class="warnline">В это время уже: ${esc(list.slice(0, 3).join(' · '))}</div>` : '';
      };
      paintBusy();
      $('#tpWhen', el).oninput = paintBusy;
      $('#tpDur', el).onchange = paintBusy;
      on(el, 'click', '[data-quick]', (ev, b) => { const [dd, hh] = b.dataset.quick.split('|').map(Number); const x = new Date(); x.setDate(x.getDate() + dd); x.setHours(hh, 0, 0, 0); $('#tpWhen', el).value = `${isoOf(x)}T${pad(hh)}:00`; paintBusy(); });
      $('[data-ok]', el).onclick = async () => {
        const v = $('#tpWhen', el).value;
        if (!v) return;
        const ts = new Date(v).getTime();
        const moved = p.callAt && p.s2 === 'set' && p.callAt !== ts;
        People.patch(p.id, {s2: 'set', callAt: ts, callMin: Number($('#tpDur', el).value) || 30, zoom: $('#tpZoom', el).value.trim(), s1: ['done', 'skip'].includes(p.s1) ? p.s1 : 'skip'}, `${moved ? 'Созвон перенесён' : 'Созвон назначен'} на ${when(ts)}`, '📅');
        const wantG = $('#tpG', el) && $('#tpG', el).checked;
        close();
        toast(`Созвон ${moved ? 'перенесён' : 'назначен'}: ${when(ts)}`);
        if (wantG) { View.set('gcal.auto', true); await Gcal.push(People.get(p.id)); }
        else { if ($('#tpG', el)) View.set('gcal.auto', false); syncCall(p.id); }
      };
    }});
}

/* кого позвать на свободное время: кому нужен созвон — сверху */
function openSlotPicker(ts) {
  const need = Store.all('people').filter(p => People.col(p) === 2 && ['none', 'noshow'].includes(p.s2 || 'none'));
  const rest = Store.all('people').filter(p => !need.includes(p) && !(p.s2 === 'set'));
  const row = p => `<button class="slot-p" data-pick="${p.id}">${avatar(People.name(p))}<span><b>${esc(People.name(p))}</b><small>${groupName(p.type)}${People.sub(p) ? ' · ' + esc(People.sub(p)) : ''}</small></span></button>`;
  openModal({title: `Созвон ${when(ts)}`, body: `
      <input class="input" id="spQ" placeholder="Поиск: имя, город">
      <div class="slot-list" id="spList">
        ${need.length ? `<p class="rec-h">Ждут созвона · ${need.length}</p>${need.map(row).join('')}` : ''}
        <p class="rec-h">Остальные</p>${rest.slice(0, 60).map(row).join('')}
      </div>`,
    foot: '<button class="btn" data-close>Отмена</button>',
    onMount(el, close) {
      $('#spQ', el).oninput = e => { const q = e.target.value.trim().toLowerCase(); $$('[data-pick]', el).forEach(b => { b.hidden = q && !b.textContent.toLowerCase().includes(q); }); };
      on(el, 'click', '[data-pick]', (e, b) => { close(); setTimeout(() => openTimePicker(People.get(b.dataset.pick), {ts}), 80); });
    }});
}

/* созвон по клику: что с ним сделать */
function openCallCard(p) {
  const st = callState(p);
  const canEdit = People.canEdit();
  const owner = p.owner ? Team.get(p.owner) : null;
  openModal({title: People.name(p), body: `
      <div class="call-head"><span class="cb-dot ${GROUP_TONE[p.type]}"></span><b>${groupName(p.type)}</b><span class="st ${st === 'done' ? 'good' : st === 'noshow' ? 'bad' : st === 'late' ? 'warn' : 'violet'}">${CALL_STATE[st]}</span></div>
      <div class="kv-list">
        ${kv('Когда', esc(`${cap(dayWd(isoTs(p.callAt)))}, ${hmMin(minOfDay(p.callAt))}–${hmMin(minOfDay(p.callAt + callMin(p) * 60e3))}`))}
        ${People.sub(p) ? kv('Кто это', esc(People.sub(p))) : ''}
        ${owner ? kv('Ведёт', esc(Team.name(owner))) : ''}
        ${p.zoom ? kv('Zoom', `<a href="${esc(p.zoom)}" target="_blank" rel="noopener">открыть ↗</a>`) : ''}
        ${p.gcal && p.gcal.id ? kv('Google', p.gcal.link ? `<a href="${esc(p.gcal.link)}" target="_blank" rel="noopener">событие в календаре ↗</a>` : 'событие в календаре') : ''}
      </div>`,
    foot: `<button class="btn" data-go>Карточка</button>${canEdit ? `
      ${st === 'set' || st === 'late' ? `<button class="btn" data-cc="time">Перенести</button><button class="btn" data-cc="noshow">Не состоялся</button><button class="btn" data-cc="done">Прошёл</button><button class="btn primary" data-cc="talk">Начать ${p.type === 'client' ? 'интервью' : 'созвон'}</button>` : ''}
      ${st === 'noshow' ? '<button class="btn primary" data-cc="time">Назначить заново</button>' : ''}
      ${st === 'done' ? '<button class="btn primary" data-cc="result">Итог</button>' : ''}` : ''}`,
    onMount(el, close) {
      $('[data-go]', el).onclick = () => { close(); App.go('p-' + p.id); };
      on(el, 'click', '[data-cc]', (e, b) => {
        const a = b.dataset.cc;
        close();
        if (a === 'time') setTimeout(() => openTimePicker(People.get(p.id)), 80);
        else if (a === 'talk') { Timer.start(p.id); View.set('pp.last', p.id); View.set('pp.tab', 'talk'); App.go('p-' + p.id); }
        else if (a === 'result') { View.set('pp.last', p.id); View.set('pp.tab', 'result'); App.go('p-' + p.id); }
        else if (a === 'done') People.patch(p.id, {s2: 'done', talkAt: p.talkAt || Date.now()}, `${p.type === 'client' ? 'Интервью' : 'Созвон'} прошёл`, '✅');
        else if (a === 'noshow') { People.patch(p.id, {s2: 'noshow'}, 'Созвон не состоялся', '🙈'); toast('Отметили. Назначьте новое время, пока человек на связи', {undo: () => People.patch(p.id, {s2: 'set'})}); }
      });
    }});
}

/* ── статистика созвонов за период ── */
function callStats(list) {
  const done = list.filter(p => p.s2 === 'done'), noshow = list.filter(p => p.s2 === 'noshow');
  const future = list.filter(p => callState(p) === 'set'), late = list.filter(p => callState(p) === 'late');
  const durs = done.map(p => p.callDur ? p.callDur / 60 : 0).filter(Boolean);
  const byGroup = Object.keys(TYPES).map(k => { const L = list.filter(p => p.type === k); return {k, all: L.length, done: L.filter(p => p.s2 === 'done').length, noshow: L.filter(p => p.s2 === 'noshow').length, set: L.filter(p => p.s2 === 'set').length}; });
  const byDir = DIRECTIONS.map(d => { const L = list.filter(p => p.type === 'expert' && (p.dirs || []).includes(d)); return {name: noEmo(d), v: L.length, done: L.filter(p => p.s2 === 'done').length}; });
  const byCat = PARTNER_CATS.map(c => { const L = list.filter(p => p.type === 'partner' && p.cat === c); return {name: noEmo(c), v: L.length, done: L.filter(p => p.s2 === 'done').length}; }).filter(x => x.v);
  const byOwner = Team.all().map(m => { const L = list.filter(p => p.owner === m.id); return {name: Team.name(m), v: L.length, done: L.filter(p => p.s2 === 'done').length}; }).filter(x => x.v);
  const noOwner = list.filter(p => !p.owner || !Team.get(p.owner)).length;
  if (noOwner) byOwner.push({name: 'Не назначен', v: noOwner, done: list.filter(p => (!p.owner || !Team.get(p.owner)) && p.s2 === 'done').length});
  const byHour = Array.from({length: CAL_H1 - CAL_H0}, (_, i) => ({name: `${pad(CAL_H0 + i)}:00`, v: list.filter(p => new Date(p.callAt).getHours() === CAL_H0 + i).length}));
  const byWd = WD_SH.map((w, i) => ({name: w, v: list.filter(p => weekday(isoTs(p.callAt)) === i).length}));
  const closed = done.length + noshow.length;
  return {all: list.length, done: done.length, noshow: noshow.length, future: future.length, late: late.length, show: closed ? done.length / closed : null,
    avg: durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : null, byGroup, byDir, byCat, byOwner, byHour, byWd};
}

App.register('calendar', {
  title: 'Календарь',
  render(root) {
    Gcal.init();
    const t = today();
    const tab = View.get('cal.tab', 'week');
    const ws = CallUI.ws || weekStart(t);
    const month = CallUI.month || monthOf(t);
    const range = tab === 'month' ? [dateOf(monthStart(month)).getTime(), dateOf(addDays(monthEnd(month), 1)).getTime()]
      : tab === 'week' ? [dateOf(ws).getTime(), dateOf(addDays(ws, 7)).getTime()] : [0, Infinity];
    const period = View.get('cal.period', 'view');
    const statList = period === 'all' ? Store.all('people').filter(hasCall) : callsBetween(range[0], range[1]);
    const S = callStats(statList);
    const canEdit = People.canEdit();
    const late = Store.all('people').filter(p => hasCall(p) && callState(p) === 'late');

    root.innerHTML = `
      ${pageHead('Календарь созвонов', 'Все созвоны CRM по дням. Перетащите созвон, чтобы перенести; нажмите на свободное время, чтобы назначить.',
        canEdit ? `<button class="btn primary" data-slot-now>${icon('plus')}Назначить созвон</button>` : '')}
      ${gcalCard(ws)}
      ${late.length ? `<div class="warnline cal-late"><span><b>${late.length} ${plural(late.length, 'созвон прошёл', 'созвона прошли', 'созвонов прошли')} без отметки.</b> Отметьте, состоялись ли они — это нужно для статистики.</span><span class="sp"></span>${late.slice(0, 3).map(p => `<button class="btn xs" data-call="${p.id}">${esc(People.name(p))}</button>`).join('')}</div>` : ''}
      <div class="kpis kpis-4 card cal-kpis">${[
        [S.all, period === 'all' ? 'созвонов всего' : tab === 'week' ? 'созвонов на неделе' : tab === 'month' ? 'созвонов в месяце' : 'созвонов всего'],
        [S.done, 'прошли'],
        [S.noshow, 'не состоялись'],
        [S.show === null ? '—' : pct(S.show), 'доходимость'],
      ].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
      <div class="cal-bar">
        ${tabsHtml('cal.tab', [['week', 'Неделя'], ['month', 'Месяц'], ['list', 'Список']], tab)}
        ${tab === 'week' ? `<div class="cal-nav"><button class="icon-btn" data-wk="-7" aria-label="Предыдущая неделя">${icon('back')}</button><b>${weekLabel(ws)}</b><button class="icon-btn flip" data-wk="7" aria-label="Следующая неделя">${icon('back')}</button>${ws !== weekStart(t) ? '<button class="btn xs ghost" data-wk="0">Сегодня</button>' : ''}</div>` : ''}
        ${tab === 'month' ? `<div class="cal-nav"><button class="icon-btn" data-mo="-1" aria-label="Предыдущий месяц">${icon('back')}</button><b>${monthName(month, true)}</b><button class="icon-btn flip" data-mo="1" aria-label="Следующий месяц">${icon('back')}</button>${month !== monthOf(t) ? '<button class="btn xs ghost" data-mo="0">Сегодня</button>' : ''}</div>` : ''}
      </div>
      <div class="cal-legend">${Object.keys(TYPES).map(k => `<span><i class="cb-dot ${GROUP_TONE[k]}"></i>${groupName(k)}</span>`).join('')}${Gcal.conn === 'ready' ? '<span><i class="cb-dot g-google"></i>ваш Google Календарь</span>' : ''}<span class="note">бледные — прошедшие</span></div>
      <div id="calView">${tab === 'month' ? monthView(month) : tab === 'list' ? listView() : weekView(ws)}</div>
      <section class="section">
        <div class="section-head"><h2>Статистика созвонов</h2>
          <div class="seg">${[['view', tab === 'week' ? 'Эта неделя' : tab === 'month' ? 'Этот месяц' : 'Список'], ['all', 'Всё время']].map(([v, n]) => `<button data-period="${v}" class="${period === v ? 'on' : ''}">${n}</button>`).join('')}</div></div>
        ${S.all ? callStatsHtml(S) : '<p class="note">В этом периоде созвонов нет.</p>'}
      </section>`;

    wireTabs(root);
    on(root, 'click', '[data-wk]', (e, el) => { const n = Number(el.dataset.wk); CallUI.ws = n ? addDays(ws, n) : weekStart(t); App.render(); });
    on(root, 'click', '[data-mo]', (e, el) => { const n = Number(el.dataset.mo); CallUI.month = n ? addMonths(month, n) : monthOf(t); App.render(); });
    on(root, 'click', '[data-period]', (e, el) => { View.set('cal.period', el.dataset.period); App.render(); });
    on(root, 'click', '[data-call]', (e, el) => { e.stopPropagation(); if (Date.now() - CalDrag.dropped < 350) return; openCallCard(People.get(el.dataset.call)); });
    on(root, 'click', '[data-day]', (e, el) => { CallUI.ws = weekStart(el.dataset.day); View.set('cal.tab', 'week'); App.render(); });
    on(root, 'click', '[data-slot-now]', () => { const d = new Date(Date.now() + 864e5); d.setHours(12, 0, 0, 0); openSlotPicker(d.getTime()); });
    on(root, 'click', '[data-gcal-connect]', async (e, el) => { el.disabled = true; el.textContent = 'Подключаю…'; await Gcal.connect(ws); App.render(); });
    on(root, 'click', '[data-gcal-auto]', (e, el) => { View.set('gcal.auto', el.dataset.gcalAuto === '1'); App.render(); });
    on(root, 'click', '[data-gcal-refresh]', () => { Gcal.loadWeek(ws, true); });
    on(root, 'click', '[data-gcal-retry]', () => { Gcal._init = null; Gcal.err = null; Gcal.conn = 'checking'; Gcal.week = {}; App.render(); });
    if (tab === 'week') wireWeek(root, canEdit);
    if (tab === 'week' && Gcal.conn === 'ready' && !Gcal.week[ws]) Gcal.loadWeek(ws);
  },
});

function gcalCard(ws) {
  const c = Gcal.conn;
  if (c === 'checking') return '<div class="gc-card slim"><i class="dot"></i><span>Проверяю Google Календарь…</span></div>';
  if (c === 'off') return '<div class="gc-card slim off"><i class="dot"></i><span><b>Google Календарь подключается, когда CRM открыта в Claude.</b> Здесь созвоны живут только в CRM.</span></div>';
  if (c === 'error' && Gcal.err) return `<div class="gc-card warn"><span><b>Google Календарь не отвечает</b><br>${esc(Gcal.err.text)}</span><span class="sp"></span><button class="btn sm" data-gcal-retry>Проверить снова</button></div>`;
  if (c === 'denied') return '<div class="gc-card warn"><span><b>Доступ к календарю не разрешён.</b> Обновите страницу и нажмите «Разрешить», когда Claude спросит.</span></div>';
  if (c === 'prompt') return `<div class="gc-card"><span><b>Подключите свой Google Календарь</b><br>Созвоны сами встанут в ваш календарь с пометкой «CRM», а в сетке будет видно, когда вы заняты. Штаб увидит созвоны CRM в общем календаре. Claude спросит разрешение — нажмите «Разрешить».</span><span class="sp"></span><button class="btn primary" data-gcal-connect>Подключить Google Календарь</button></div>`;
  const w = Gcal.week[ws];
  const mine = Store.all('people').filter(p => Gcal.mine(p)).length;
  return `<div class="gc-card slim ok"><i class="dot"></i><span><b>Google Календарь подключён</b> · ваших созвонов CRM в нём: ${mine} · ${w && w.loading ? 'загружаю неделю…' : w && w.err ? esc(w.err.text) : w ? 'неделя обновлена ' + timeAgo(w.at) : ''}</span><span class="sp"></span>
    <button class="btn xs ghost" data-gcal-refresh>${icon('refresh')}Обновить</button>
    <button class="btn xs ${Gcal.auto() ? '' : 'ghost'}" data-gcal-auto="${Gcal.auto() ? '0' : '1'}">${Gcal.auto() ? 'Новые созвоны ставлю в Google' : 'Не ставлю созвоны в Google'}</button></div>`;
}

/* ── неделя ── */
function weekView(ws) {
  const t = today();
  const dates = Array.from({length: 7}, (_, i) => addDays(ws, i));
  const H = CAL_H1 - CAL_H0;
  const pctOf = min => clamp((min - CAL_H0 * 60) / (H * 60) * 100, 0, 100);
  const calls = callsBetween(dateOf(ws).getTime(), dateOf(addDays(ws, 7)).getTime());
  const gw = Gcal.week[ws];
  const gev = gw && gw.events ? gw.events.filter(ev => !gIsCrm(ev) && gBusy(ev)).map(ev => ({ev, r: gRange(ev)})).filter(x => x.r && !x.r.allDay) : [];
  const col = d => {
    const items = [];
    calls.filter(p => isoTs(p.callAt) === d).forEach(p => items.push({s: p.callAt, e: p.callAt + callMin(p) * 60e3, p}));
    gev.filter(x => isoTs(x.r.start) === d).forEach(x => items.push({s: x.r.start, e: x.r.end, g: x.ev}));
    lanesOf(items);
    const blocks = items.map(it => {
      const top = pctOf(minOfDay(it.s)), h = Math.max(pctOf(minOfDay(it.s) + (it.e - it.s) / 60e3) - top, 3);
      const style = `top:${top.toFixed(2)}%;height:${h.toFixed(2)}%;left:calc(${(it.lane / it.lanes * 100).toFixed(2)}% + 2px);width:calc(${(100 / it.lanes).toFixed(2)}% - 4px)`;
      const time = `${hmMin(minOfDay(it.s))}–${hmMin(minOfDay(it.e))}`;
      if (it.g) return `<div class="cb gcal" style="${style}" title="${esc(it.g.summary || 'Занято')} · ${time} · из вашего Google Календаря"><b>${esc(it.g.summary || 'Занято')}</b><small>${time}</small></div>`;
      const st = callState(it.p);
      return `<div class="cb ${GROUP_TONE[it.p.type]} st-${st} ${it.e - it.s <= 35 * 60e3 ? 'short' : ''}" style="${style}" data-call="${it.p.id}" data-cdrag="${it.p.id}" title="${esc(People.name(it.p))} · ${time} · ${CALL_STATE[st]}"><b>${esc(People.name(it.p))}</b><small>${time} · ${groupName(it.p.type)}${st === 'done' ? ' · прошёл' : st === 'noshow' ? ' · не состоялся' : st === 'late' ? ' · отметьте' : ''}</small></div>`;
    }).join('');
    const now = new Date();
    const nowLine = d === t ? `<i class="cw-now" style="top:${pctOf(now.getHours() * 60 + now.getMinutes()).toFixed(2)}%"></i>` : '';
    return `<div class="cw-col ${weekday(d) > 4 ? 'we' : ''} ${d < t ? 'past' : ''}" data-date="${d}">${blocks}${nowLine}</div>`;
  };
  return `<div class="cal-wrap"><div class="cal-week">
      <div class="cw-corner"></div>

      <div class="cw-times">${Array.from({length: H}, (_, i) => `<span style="top:${(i / H * 100).toFixed(2)}%">${pad(CAL_H0 + i)}:00</span>`).join('')}</div>
      ${dates.map(col).join('')}
    </div></div>`;
}
/* пересекающиеся блоки — рядом, дорожками */
function lanesOf(items) {
  items.sort((a, b) => a.s - b.s || b.e - a.e);
  let group = [], ends = [], groupEnd = -Infinity;
  const finish = () => { const n = ends.length || 1; group.forEach(x => { x.lanes = n; }); };
  items.forEach(it => {
    if (it.s >= groupEnd && group.length) { finish(); group = []; ends = []; }
    let c = ends.findIndex(end => end <= it.s);
    if (c < 0) { c = ends.length; ends.push(0); }
    ends[c] = it.e;
    it.lane = c;
    group.push(it);
    groupEnd = Math.max(groupEnd, it.e);
  });
  if (group.length) finish();
  return items;
}

/* клик по пустому месту — назначить; зажать созвон и перенести — сменить время */
const CalDrag = {st: null, dropped: 0};
function wireWeek(root, canEdit) {
  const grid = $('.cal-week', root);
  if (!grid || !canEdit) return;
  const H = CAL_H1 - CAL_H0;
  const minAt = (colEl, y) => { const r = colEl.getBoundingClientRect(); return clamp(Math.round((CAL_H0 * 60 + (y - r.top) / r.height * H * 60) / 15) * 15, CAL_H0 * 60, CAL_H1 * 60 - 15); };
  on(grid, 'click', '.cw-col', (e, el) => {
    if (e.target.closest('.cb') || Date.now() - CalDrag.dropped < 350) return;
    const min = Math.floor(minAt(el, e.clientY) / 30) * 30;
    openSlotPicker(tsOf(el.dataset.date, min));
  });
  grid.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const blk = e.target.closest('[data-cdrag]');
    if (!blk) return;
    const p = People.get(blk.dataset.cdrag);
    if (!p || p.s2 !== 'set') return;
    const touch = e.pointerType !== 'mouse';
    const r = blk.getBoundingClientRect();
    const st = {blk, p, x0: e.clientX, y0: e.clientY, id: e.pointerId, touch, on: false, dy: e.clientY - r.top, timer: null};
    if (touch) st.timer = setTimeout(() => { if (CalDrag.st === st) calDragStart(st); }, 300);
    CalDrag.st = st;
  });
  const move = e => {
    const st = CalDrag.st;
    if (!st || e.pointerId !== st.id) return;
    if (!st.on) {
      const d = Math.hypot(e.clientX - st.x0, e.clientY - st.y0);
      if (st.touch) { if (d > 10) { clearTimeout(st.timer); CalDrag.st = null; } return; }
      if (d < 5) return;
      calDragStart(st);
    }
    e.preventDefault();
    st.blk.style.visibility = 'hidden';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    st.blk.style.visibility = '';
    const colEl = under && under.closest('.cw-col');
    if (!colEl) return;
    const min = minAt(colEl, e.clientY - st.dy);
    const top = (min - CAL_H0 * 60) / (H * 60) * 100;
    if (st.blk.parentNode !== colEl) colEl.appendChild(st.blk);
    st.blk.style.top = top.toFixed(2) + '%';
    st.blk.style.left = '2px';
    st.blk.style.width = 'calc(100% - 4px)';
    st.target = {date: colEl.dataset.date, min};
    $('small', st.blk).textContent = `${hmMin(min)}–${hmMin(min + callMin(st.p))} · перенести сюда`;
  };
  const end = (e, drop) => {
    const st = CalDrag.st;
    if (!st || (e && e.pointerId !== st.id)) return;
    clearTimeout(st.timer);
    CalDrag.st = null;
    if (!st.on) return;
    CalDrag.dropped = Date.now();
    document.body.classList.remove('dragging-now');
    st.blk.classList.remove('cb-drag');
    if (!drop || !st.target) { App.render(); return; }
    const ts = tsOf(st.target.date, st.target.min);
    if (ts === st.p.callAt) { App.render(); return; }
    const before = st.p.callAt;
    People.patch(st.p.id, {callAt: ts}, `Созвон перенесён на ${when(ts)}`, '📅');
    syncCall(st.p.id);
    toast(`${People.name(st.p)}: ${when(ts)}`, {undo: () => { People.patch(st.p.id, {callAt: before}, 'Отменили перенос созвона', '↩'); syncCall(st.p.id); }});
  };
  if (!CalDrag.wired) {
    CalDrag.wired = true;
    document.addEventListener('pointermove', move, {passive: false});
    document.addEventListener('pointerup', e => end(e, true));
    document.addEventListener('pointercancel', e => end(e, false));
    document.addEventListener('touchmove', e => { if (CalDrag.st && CalDrag.st.on) e.preventDefault(); }, {passive: false});
  }
}
function calDragStart(st) {
  st.on = true;
  st.blk.classList.add('cb-drag');
  document.body.classList.add('dragging-now');
  if (navigator.vibrate && st.touch) { try { navigator.vibrate(12); } catch (err) { /* ничего */ } }
}

/* ── месяц ── */
function monthView(month) {
  const t = today();
  const first = monthStart(month), start = weekStart(first);
  const days = Array.from({length: 42}, (_, i) => addDays(start, i));
  const weeks = days[35] > monthEnd(month) ? days.slice(0, 35) : days;
  const calls = callsBetween(dateOf(start).getTime(), dateOf(addDays(start, weeks.length)).getTime());
  return `<div class="cal-month">${WD_SH.map(w => `<div class="cm-h">${w}</div>`).join('')}${weeks.map(d => {
    const L = calls.filter(p => isoTs(p.callAt) === d);
    return `<button class="cm-d ${d.slice(0, 7) !== month ? 'out' : ''} ${d === t ? 'is-today' : ''} ${d < t ? 'past' : ''}" data-day="${d}">
      <span class="cm-n">${Number(d.slice(8))}</span>
      ${L.slice(0, 3).map(p => `<span class="cm-c ${GROUP_TONE[p.type]} st-${callState(p)}">${hmMin(minOfDay(p.callAt))} ${esc(People.name(p).split(' ')[0])}</span>`).join('')}
      ${L.length > 3 ? `<span class="cm-more">ещё ${L.length - 3}</span>` : ''}</button>`;
  }).join('')}</div>`;
}

/* ── список ── */
function listView() {
  const t = today();
  const all = Store.all('people').filter(hasCall).sort((a, b) => a.callAt - b.callAt);
  const upcoming = all.filter(p => isoTs(p.callAt) >= t);

}

          const o = $('#qO', el).value.split('\n').map(x => x.trim()).filter(Boolean);
          if (['one', 'many'].includes(out.k)) {
            if (o.length < 2) { $('#qO', el).classList.add('need'); toast('Нужно хотя бы два варианта'); return; }
            out.o = o;
          } else delete out.o;
          const mx = parseNum($('#qMax', el).value);
          if (out.k === 'many' && mx) out.max = mx; else delete out.max;
          const ph = $('#qPh', el).value.trim();
          if (ph && ['short', 'text'].includes(out.k)) out.ph = ph; else delete out.ph;
          if (out.k === 'scale') { out.lo = out.lo || 'совсем нет'; out.hi = out.hi || 'очень'; }
        } else out.why = $('#qW', el).value.trim();
        const s = clone(set);
        if (i >= 0) s[part][i] = out; else s[part].push(out);
        Questions.save(type, s);
        close();
        toast(isTest ? 'Вопрос в анкете — новые ссылки уже с ним ✅' : 'Вопрос сохранён ✅');
      };
    }});
}

function exportCsv(type) {
  const qs = Questions.set(type).test, talk = Questions.set(type).talk;
  const list = People.all(type);
  const head = ['Имя', 'Код', 'Город', 'Шаг', 'Анкета', 'Созвон', 'Итог', ...qs.map(q => noEmo(q.t)), ...talk.map(q => 'Созвон: ' + q.t), 'Метки', 'Главное', 'Заметка'];
  const rows = list.map(p => [People.name(p), p.code, p.city || '', ['', 'Анкета', 'Созвон', 'Итог'][People.col(p)], (S1[p.s1] || {}).name || '', (S2[p.s2] || {}).name || '', (s3Map(type)[p.s3] || {}).name || '',
    ...qs.map(q => answerLabels(q, (p.answers || {})[q.id]).map(noEmo).join(', ')), ...talk.map(q => ((p.talk || {})[q.id] || {}).a || ''),
    ((p.res || {}).tags || []).map(noEmo).join(', '), (p.res || {}).main || (p.res || {}).next || '', (p.res || {}).note || (p.res || {}).idea || '']);
  const data = csvOf([head, ...rows]);
  (async () => {
    let dl = null;
    try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) { try { await dl.save({filename: `eva-${type}-${today()}.csv`, data}); toast('📤 Таблица сохранена'); return; } catch (e) { if (e && e.code === 'declined') return; } }
    copyOrShow(data, '📋 Таблица скопирована — вставьте в Google Таблицы');
  })();
}

/* ── 99-boot.js ── */
/* Запуск: общая база или браузер, кто открыл — и рисуем. Вне артефакта
   при первом открытии загружаем пример, чтобы было на что посмотреть. */

(async function boot() {
  const mark = $('.boot-mark');
  if (mark) mark.innerHTML = brandIcon();
  const msg = $('#bootMsg');
  const slow = setTimeout(() => { if (msg) msg.textContent = 'База отвечает медленно — ещё пара секунд…'; }, 4000);
  try { await Promise.all([Store.init(), Who.init()]); } catch (e) { console.error('Хранилище не поднялось', e); }
  clearTimeout(slow);
  if (Store.state.mode === 'local' && !Store.total() && !Local.get('eva-crm2-seeded', false)) {
    Local.set('eva-crm2-seeded', true);
    await Demo.load();
  }
  App.start();
  window.__eva = {Store, Who, App, View, People, Questions, Stats, Codec, Import, Demo, recommendations};
})();
})();
