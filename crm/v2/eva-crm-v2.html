  let inFlight = 0;
  const waiters = [];
  const slot = () => (inFlight < 4 ? (inFlight++, Promise.resolve()) : new Promise(r => waiters.push(r)));
  const release = () => { const w = waiters.shift(); if (w) w(); else inFlight--; };

  const strip = o => { const {id, ...body} = o || {}; return body; };
  const emit = c => subs.forEach(fn => { try { fn(c); } catch (e) { console.error(e); } });
  const emitStatus = () => statusSubs.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });

  function loadLocal() {
    for (const c of COLS) {
      const o = Local.get(LS + c, null);
      if (o && typeof o === 'object') for (const [id, v] of Object.entries(o)) data[c].set(id, {...v, id});
    }
  }
  let saveT = {};
  function saveLocal(c) {
    clearTimeout(saveT[c]);
    saveT[c] = setTimeout(() => Local.set(LS + c, Object.fromEntries([...data[c]].map(([id, v]) => [id, strip(v)]))), 120);
  }

  async function init() {
    let api = null;
    try {
      api = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null;
    } catch (e) { api = null; }
    if (!api) { loadLocal(); state.mode = 'local'; state.ready = true; emitStatus(); return; }
    db = api;
    state.mode = 'db';
    /* ждём первый окончательный снимок каждой коллекции; через 9 с идём с тем, что есть */
    await new Promise(resolve => {
      let left = COLS.length, done = false;
      const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
      const timer = setTimeout(finish, 9000);
      COLS.forEach(c => {
        let settled = false;
        const settle = () => { if (!settled) { settled = true; if (--left === 0) finish(); } };
        try {
          db.collection(c).onSnapshot(snap => {
            const m = new Map();
            snap.docs.forEach(d => { const v = d.data(); if (v) m.set(d.id, {...clone(v), id: d.id}); });
            data[c] = m;
            if (!snap.metadata || !snap.metadata.fromCache) settle();
            if (state.ready) emit(c);
          }, err => {
            state.error = (err && err.code) || 'error';
            if (err && err.code === 'revoked') state.readOnly = true;
            settle();
            emitStatus();
          });
        } catch (e) { settle(); }
      });
    });
    state.ready = true;
    emitStatus();
  }

  /* одна запись на документ за раз: следующая ждёт предыдущую */
  function enqueue(path, op) {
    state.pending++;
    emitStatus();
    const prev = queue.get(path) || Promise.resolve();
    const run = async () => {
      await slot();
      try {
        try { await op(); }
        catch (e) {
          if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 700 + Math.random() * 900)); await op(); }
          else throw e;
        }
      } finally { release(); }
    };
    const p = prev.catch(() => {}).then(run).then(
      () => { state.error = null; },
      e => {
        state.error = (e && e.code) || 'error';
        if (e && e.code === 'invalid_argument') state.readOnly = true;
        if (e && e.code === 'quota_exceeded') state.quota = true;
        console.warn('Запись не прошла', path, e);
        if (typeof toast === 'function') toast(writeErrorText(e), {error: true});
      }
    ).finally(() => {
      state.pending--;
      if (queue.get(path) === p) queue.delete(path);
      emitStatus();
    });
    queue.set(path, p);
    return p;
  }
  function writeErrorText(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') return 'База заполнена (до 5 000 записей): удалите демо-записи в «Настройках»';
    if (code === 'invalid_argument') return 'Не сохранилось: у вас доступ только на просмотр этой CRM';
    if (code === 'resource_exhausted') return 'Слишком много правок подряд — повторите через минуту';
    return 'Не сохранилось. Проверьте связь и повторите';
  }

  function commitLocal(c) { if (!db) saveLocal(c); emit(c); }

  function put(c, id, obj) {
    const body = strip(obj);
    data[c].set(id, {...clone(body), id});
    commitLocal(c);
    if (db) return enqueue(`${c}/${id}`, () => db.collection(c).doc(id).set(body));
    return Promise.resolve();
  }
  function add(c, obj, id = uid()) { put(c, id, obj); return id; }
  function patch(c, id, partial) {
    const cur = data[c].get(id);
    const next = deepMerge(cur ? strip(cur) : {}, partial);
    data[c].set(id, {...next, id});
    commitLocal(c);
    if (!db) return Promise.resolve();
    return enqueue(`${c}/${id}`, async () => {
      const ref = db.collection(c).doc(id);
      if (!cur) return ref.set(next);
      try { await ref.update(clone(partial)); }
      catch (e) {
        /* документа уже нет в базе (удалили с другого устройства) — записываем целиком */
        if (e && e.code === 'invalid_argument') await ref.set(strip(data[c].get(id) || next));
        else throw e;
      }
    });
  }
  /* удалить вложенное поле (например, событие из ev): в базе — полной
     перезаписью документа, потому что update() умеет только сливать */
  function unset(c, id, pathArr) {
    const cur = data[c].get(id);
    if (!cur) return Promise.resolve();
    const next = clone(strip(cur));
    let o = next;
    for (let i = 0; i < pathArr.length - 1; i++) { o = o && o[pathArr[i]]; }
    if (o) delete o[pathArr[pathArr.length - 1]];
    return put(c, id, next);
  }
  function remove(c, id) {
    data[c].delete(id);
    commitLocal(c);
    if (db) return enqueue(`${c}/${id}`, () => db.collection(c).doc(id).delete());
    return Promise.resolve();
  }

  return {
    COLS, state, init, put, add, patch, unset, remove,
    all: c => [...data[c].values()],
    get: (c, id) => data[c].get(id) || null,
    count: c => data[c].size,
    total: () => COLS.reduce((a, c) => a + data[c].size, 0),
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    onStatus(fn) { statusSubs.add(fn); return () => statusSubs.delete(fn); },
    flush: () => Promise.all([...queue.values()]),
    isDb: () => !!db,
  };
})();

/* ── 03-who.js ── */
/* Кто работает в CRM. В артефакте Claude человека узнаёт сама площадка
   (claude.use('user')): паролей нет, в команде хранится только его id,
   имя подтягивается из профиля при каждой отрисовке. Роль выдаёт
   руководитель в «⚙️ Настройках»; владелец артефакта — руководитель.
   Вне артефакта (GitHub Pages, локально) вы один — руководитель, данные
   живут в этом браузере.
   Честно: роли разделяют интерфейс внутри команды. Граница доступа — сам
   артефакт: кому он открыт, тот может прочитать общую базу. */

const Who = {
  mode: 'local',
  uid: null,
  owner: false,
  canWrite: null,
  api: null,
  names: {},

  async init() {
    let u = null;
    try { u = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('user') : null; } catch (e) { u = null; }
    if (!u) { this.mode = 'local'; this.uid = 'local'; this.owner = true; return; }
    this.api = u;
    this.mode = 'platform';
    try { this.uid = await u.id(); } catch (e) { this.uid = null; }
    try { this.owner = !!(await u.isOwner()); } catch (e) { this.owner = false; }
    try { this.canWrite = await u.can('data.write'); } catch (e) { this.canWrite = null; }
  },

  /* своя строка в команде: в платформе — по id, локально — 'local' */
  self() { return this.uid ? Store.all('team').find(t => t.uid === this.uid && !t.archived) || null : null; },
  realRole() {
    const m = this.self();
    if (m) return roleOf(m.role);
    return this.owner ? 'owner' : 'viewer';
  },
  /* руководитель может посмотреть CRM глазами сотрудника */
  asId() { const a = View.get('as', null); return a && this.realRole() === 'owner' && Store.get('team', a) ? a : null; },
  member() { const a = this.asId(); return a ? Store.get('team', a) : this.self(); },
  id() { const m = this.member(); return m ? m.id : null; },
  role() {
    if (Store.state.readOnly || (this.mode === 'platform' && this.canWrite === false)) {
      const r = this.asId() ? roleOf(this.member().role) : this.realRole();
      return r === 'owner' ? r : 'viewer';
    }
    const a = this.asId();
    return a ? roleOf(Store.get('team', a).role) : this.realRole();
  },
  can(perm) { return (PERMS[perm] || []).includes(this.role()); },
  readOnly() { return Store.state.readOnly || (this.mode === 'platform' && this.canWrite === false); },

  /* первый вход: заводим строку в команде */
  ensure() {
    if (!this.uid || this.self()) return;
    if (this.readOnly()) return;
    const hasOwner = Store.all('team').some(t => t.uid && roleOf(t.role) === 'owner' && !t.archived);
    const role = this.owner || (this.mode === 'local' && !hasOwner) ? 'owner' : 'member';
    Store.add('team', {uid: this.uid, name: this.mode === 'local' ? 'Вы' : '', role, joinedAt: Date.now(), order: role === 'owner' ? 0 : 20});
  },

  /* имена из профилей площадки: не храним, спрашиваем при отрисовке */
  _asked: new Set(),
  resolveNames() {
    if (!this.api || typeof this.api.profiles !== 'function') return;
    const ids = Store.all('team').map(t => t.uid).filter(x => x && x !== 'local' && !this._asked.has(x));
    if (!ids.length) return;
    ids.forEach(x => this._asked.add(x));
    Promise.resolve(this.api.profiles(ids)).then(ps => {
      let changed = false;
      for (const id of ids) { const n = ps && ps[id] && ps[id].name; if (n && this.names[id] !== n) { this.names[id] = n; changed = true; } }
      if (changed) App.renderSoon();
    }).catch(() => {});
  },
};

/* ── команда ── */
const Team = {
  all(withArchived = false) {
    return Store.all('team').filter(t => withArchived || !t.archived)
      .sort((a, b) => (a.order ?? 50) - (b.order ?? 50) || this.name(a).localeCompare(this.name(b), 'ru'));
  },
  get(id) { return id ? Store.get('team', id) : null; },
  name(t) {
    if (!t) return 'Не назначен';
    return t.name || (t.uid && Who.names[t.uid]) || (t.uid === Who.uid ? 'Вы' : 'Сотрудник');
  },
  first(t) { return this.name(t).split(' ')[0]; },
  /* кому можно поручить клиентку */
  assignable() { return this.all().filter(t => ['owner', 'member'].includes(roleOf(t.role))); },
  av(t, cls = '') { return t ? avatar(this.name(t), cls, t.color || null) : avatar('', cls); },
};
const meName = () => Team.name(Who.member());

/* ── уведомления ── */
function toast(text, opts = {}) {
  const root = $('#toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' err' : '');
  const span = document.createElement('span');
  span.textContent = text;
  el.appendChild(span);
  let timer;
  const close = () => { clearTimeout(timer); el.remove(); };
  if (opts.undo) {
    const b = document.createElement('button');
    b.textContent = 'Отменить';
    b.onclick = () => { close(); opts.undo(); };
    el.appendChild(b);
  }
  root.appendChild(el);
  timer = setTimeout(close, opts.undo ? 7000 : 4200);
  while (root.children.length > 3) root.firstChild.remove();
}

/* ── окно ── */
function openModal({title, body, foot = '', wide = false, focus = true, onMount, onClose}) {
  closePops();
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Закрыть">${icon('x')}</button></div>
    <div class="modal-body">${body}</div>
    ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
  </div>`;
  $('#modalRoot').appendChild(back);
  const el = $('.modal', back);
  const key = e => { if (e.key === 'Escape' && !$('.pop')) close(); };
  function close() {
    if (!back.isConnected) return;
    back.remove();
    document.removeEventListener('keydown', key);
    if (onClose) onClose();
    App.renderSoon();
  }
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  on(back, 'click', '[data-close]', e => { e.preventDefault(); close(); });
  document.addEventListener('keydown', key);
  if (onMount) onMount(el, close);
  const first = $('input:not([type=checkbox]):not([disabled]), textarea, select', el);
  if (first && focus) setTimeout(() => { if (!el.contains(document.activeElement)) first.focus(); }, 30);
  return {el, close};
}
const modalOpen = () => !!$('#modalRoot .modal-back');

/* ── подтверждение «Да / Нет» рядом с кнопкой (confirm() в артефакте не работает) ── */
function closePops() { $$('.pop').forEach(p => (p._done ? p._done(false) : p.remove())); }
function confirmPop(anchor, {text, yes = 'Да', no = 'Нет', danger = false}) {
  return new Promise(resolve => {
    closePops();
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.setAttribute('role', 'alertdialog');
    pop.innerHTML = `<p></p><div class="row"><button class="btn sm ${danger ? 'danger solid' : 'primary'}" data-yes></button><button class="btn sm" data-no></button></div>`;
    $('p', pop).textContent = text;
    $('[data-yes]', pop).textContent = yes;
    $('[data-no]', pop).textContent = no;
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = r.bottom + 6, left = r.left + r.width / 2 - w / 2;
    if (top + h > window.innerHeight - 8) top = r.top - h - 6;
    left = clamp(left, 8, window.innerWidth - w - 8);
    pop.style.top = (top + window.scrollY) + 'px';
    pop.style.left = (left + window.scrollX) + 'px';
    const done = v => {
      pop.remove();
      document.removeEventListener('mousedown', outside, true);
      document.removeEventListener('keydown', key, true);
      resolve(v);
    };
    pop._done = done;
    const outside = e => { if (!pop.contains(e.target)) done(false); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    document.addEventListener('keydown', key, true);
    $('[data-yes]', pop).onclick = () => done(true);
    $('[data-no]', pop).onclick = () => done(false);
    $('[data-yes]', pop).focus();
  });
}

/* ── выбор из списка рядом с кнопкой (исполнитель на карточке и т. п.) ── */
function pickPop(anchor, items, current) {
  return new Promise(resolve => {
    closePops();
    const pop = document.createElement('div');
    pop.className = 'pop pick';
    pop.setAttribute('role', 'listbox');
    items.forEach(([v, n]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick-i' + (String(v) === String(current) ? ' on' : '');
      b.textContent = n;
      b.onclick = () => done(v);
      pop.appendChild(b);
    });
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = r.bottom + 4, left = r.right - w;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
    left = clamp(left, 8, window.innerWidth - w - 8);
    pop.style.top = (top + window.scrollY) + 'px';
    pop.style.left = (left + window.scrollX) + 'px';
    function done(v) {
      pop.remove();
      document.removeEventListener('mousedown', outside, true);
      document.removeEventListener('keydown', key, true);
      resolve(v);
    }
    pop._done = () => done(null);
    const outside = e => { if (!pop.contains(e.target)) done(null); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
    document.addEventListener('keydown', key, true);
    const on = $('.pick-i.on', pop) || $('.pick-i', pop);
    if (on) on.focus();
  });
}

/* ── CRM: аватар по имени, цвет — по имени же, чтобы человек узнавался ── */
const AV_COLORS = ['#5A50C0', '#AD4C74', '#2C7753', '#8F6B27', '#3D6FA8', '#8A4FA0', '#B0573A', '#4F7A7A'];
function initialsOf(name) {
  const n = String(name || '').replace(/[^\p{L}\s-]/gu, '').trim().split(/\s+/).filter(Boolean);
  return ((n[0] || '?')[0] + (n[1] ? n[1][0] : '')).toUpperCase();
}
function avatar(name, cls = '', color = null) {
  if (!name) return `<span class="av none ${cls}" title="Не назначено">?</span>`;

/* ── воронка: горизонтальные полосы с конверсией шага ── */
function funnelBars(rows, {money = false} = {}) {
  const max = Math.max(1, ...rows.map(r => r.n));
  return `<div class="fbars">${rows.map((r, i) => {
    const prev = i ? rows[i - 1].n : null;
    const conv = prev ? r.n / prev : null;
    return `<div class="fbar ${r.won ? 'won' : ''} ${r.lost ? 'lost' : ''}" ${r.href ? `data-go="${esc(r.href)}"` : ''}>
      <span class="fbar-n">${esc(r.name)}</span>
      <span class="fbar-track"><i style="width:${(r.n / max * 100).toFixed(1)}%"></i><b class="num">${fmt(r.n)}</b></span>
      <span class="fbar-c num">${conv === null || r.lost ? (r.sub || '') : pct(conv)}</span>
    </div>`;
  }).join('')}</div>`;
}
/* строки «название — полоса — значение», например источники */
function hbarList(rows, {valFmt = fmt, color = 'var(--link)', sub = null} = {}) {

/* ── 05-app.js ── */
/* Оболочка и маршруты: #home, #client, #expert, #partner, #amb, #questions,
   #settings, карточка #p-<id>. Ответы, присланные по ссылке, приходят
   адресом #in.<ответы> — тогда открывается окно «Сохранить в карточку». */

const App = {
  pages: {},
  shell: false,
  cur: null,
  _t: null,
  _pending: false,
  _pointer: false,

  register(id, page) { this.pages[id] = page; },

  start() {
    Store.subscribe(c => { if (c === 'team') { Who.ensure(); Who.resolveNames(); } this.renderSoon(); });
    Store.onStatus(s => this.paintSync(s));
    window.addEventListener('hashchange', () => this.render());
    document.addEventListener('pointerdown', () => { this._pointer = true; }, true);
    document.addEventListener('pointerup', () => { this._pointer = false; if (this._pending) this.renderSoon(); }, true);
    document.addEventListener('focusout', () => { if (this._pending) this.renderSoon(250); });
    Who.ensure();
    Who.resolveNames();
    this.render();
  },

  parse() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h.startsWith('in.')) return {id: 'import', param: h.slice(3)};
    const m = h.match(/^p-(.+)$/);
    if (m) return {id: 'person', param: m[1]};
    return {id: h || 'home', param: null};
  },
  go(hash) { if (location.hash === '#' + hash) this.render(); else location.hash = hash; },

  typing() {
    const a = document.activeElement;
    return !!(a && a.matches && a.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select') && !$('#modalRoot').contains(a));
  },
  renderSoon(delay = 60) {
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      if (this.typing() || this._pointer || modalOpen()) { this._pending = true; return; }
      this._pending = false;
      this.render();
    }, delay);
  },

  render(opts = {}) {
    let {id, param} = this.parse();
    if (id === 'import') { this.buildShellOnce(); openImport(param); history.replaceState(null, '', '#home'); id = 'home'; param = null; }
    if (!this.pages[id]) { id = 'home'; param = null; }
    this.buildShellOnce();
    this.paintNav(id === 'person' ? (People.get(param) || {}).type : id);
    const prev = $('#page');
    const page = prev.cloneNode(false);
    prev.replaceWith(page);
    const key = id + ':' + (param || '');
    const y = window.scrollY;
    try { this.pages[id].render(page, param); }
    catch (e) { console.error(e); page.innerHTML = `<div class="empty"><b>Страница не открылась 😕</b>${esc(e.message || e)}</div>`; }
    if (this.cur === key) window.scrollTo(0, y); else window.scrollTo(0, 0);
    this.cur = key;
    if (opts.focus) { const el = document.getElementById(opts.focus); if (el) { el.focus(); if (el.setSelectionRange && typeof el.value === 'string') el.setSelectionRange(el.value.length, el.value.length); } }
    const t = typeof this.pages[id].title === 'function' ? this.pages[id].title(param) : this.pages[id].title;
    document.title = (id === 'home' ? '' : (t || '') + ' · ') + 'Eva CRM 2.0';
  },

  buildShellOnce() {
    if (this.shell) return;
    $('#app').innerHTML = `<div class="shell">
      <aside class="side">
        <a class="brand" href="#home">${brandIcon('brand-mark')}<div><b>Eva CRM 2.0</b><span>кастдев и подключение</span></div></a>
        <nav class="nav" id="nav" aria-label="Разделы"></nav>
        <div class="side-foot">
          <div class="sync" id="sync"><i></i><span></span></div>
          <div class="me-chip" id="meChip"></div>
        </div>
      </aside>
      <main class="main"><div class="page" id="page"></div></main>
    </div>`;
    this.shell = true;
    this.paintSync(Store.state);
  },

  paintNav(active) {
    /* у группы одна цифра — сколько в ней людей; что делать, видно на главной */
    $('#nav').innerHTML = NAV.map(n => {
      const cnt = TYPES[n.id] ? People.all(n.id).length : n.id === 'calendar' ? callsBetween(Date.now() - 3600e3, dateOf(addDays(weekStart(today()), 7)).getTime()).filter(p => p.s2 === 'set').length || null : null;
      return `<a href="#${n.id}" class="${n.id === active ? 'on' : ''}"><span class="nav-emo" aria-hidden="true">${n.emo}</span><span>${n.name}</span>${cnt ? `<span class="nav-n">${cnt}</span>` : ''}</a>`;
    }).join('');
    const m = Who.member();
    $('#meChip').innerHTML = `${m ? Team.av(m) : avatar('Гость')}<div class="who"><b>${esc(m ? Team.name(m) : 'Гость')}</b><span>${esc(ROLES[Who.role()] ? ROLES[Who.role()].name : 'Наблюдатель')}</span></div>`;
  },

  paintSync(s) {
    const el = $('#sync');
    if (!el) return;
    let cls = '', text = 'Общая база · сохранено';
    if (s.mode === 'local') { cls = 'local'; text = 'Только этот браузер'; }
    else if (s.pending) { cls = 'busy'; text = 'Сохраняю…'; }
    else if (Who.readOnly()) { cls = 'err'; text = 'Только просмотр'; }
    else if (s.error) { cls = 'err'; text = 'Не сохранилось'; }
    el.className = 'sync ' + cls;
    $('span', el).textContent = text;
  },
};

/* ── 06-model.js ── */
/* Модель CRM 2.0. Человек — один документ people/<id>: кто он (клиентка,
   эксперт, партнёр, амбассадор), уникальный код для ссылки, три шага
   (s1 — анкета, s2 — созвон, s3 — итог), ответы анкеты, заметки созвона,
   итог и короткая история. Статистика и рекомендации считаются из ответов. */

let MV = 0;
Store.subscribe(() => { MV++; });
function memo(fn) { let v = -1, val; return () => (v === MV ? val : (v = MV, val = fn())); }

/* адреса опубликованных страниц; руководитель может поменять в настройках */
const LINKS = {
  crm: 'http://localhost:8766/crm/v2/index.html',
  anketa: 'http://localhost:8766/crm/v2/a/index.html',
};
const settings = memo(() => ({anketaUrl: LINKS.anketa, ...(Store.get('cfg', 'settings') || {})}));

/* ── вопросы с правками команды ── */
/* для сравнения и для ссылки: без служебных полей и без текстов рекомендаций */
const strip = q => { const {hidden, custom, rec, ...rest} = q; return rest; };
const Questions = {
  set(type) {
    const d = Store.get('cfg', 'q_' + type);
    return {test: d && Array.isArray(d.test) ? d.test : clone(Q_DEFAULT[type].test), talk: d && Array.isArray(d.talk) ? d.talk : clone(Q_DEFAULT[type].talk)};
  },
  test(type) { return this.set(type).test.filter(q => !q.hidden); },
  talk(type) { return this.set(type).talk.filter(q => !q.hidden); },
  find(type, id) { return this.set(type).test.find(q => q.id === id) || null; },
  save(type, set) { return Store.put('cfg', 'q_' + type, {test: set.test, talk: set.talk, at: Date.now()}); },
  reset(type) { return Store.remove('cfg', 'q_' + type); },
  /* что изменили в анкете относительно стартового набора — едет в ссылке */
  diff(type) {
    const cur = this.set(type).test, def = Q_DEFAULT[type].test;
    const defIds = def.map(q => q.id);
    const h = cur.filter(q => q.hidden && defIds.includes(q.id)).map(q => q.id);
    const c = cur.filter(q => !q.hidden && (!defIds.includes(q.id) || JSON.stringify(strip(q)) !== JSON.stringify(strip(def.find(d => d.id === q.id))))).map(strip);
    const order = cur.filter(q => !q.hidden).map(q => q.id);
    const defOrder = [...def.filter(q => order.includes(q.id)).map(q => q.id), ...order.filter(id => !defIds.includes(id))];
    const s = JSON.stringify(order) !== JSON.stringify(defOrder) ? order : undefined;
    if (!h.length && !c.length && !s) return null;
    const d = {};
    if (h.length) d.h = h;
    if (c.length) d.c = c;
    if (s) d.s = s;
    return d;
  },
  edited(type) { return !!Store.get('cfg', 'q_' + type); },
};

/* ── люди ── */
const People = {
  all(type) { return Store.all('people').filter(p => !type || p.type === type).sort((a, b) => (b.touchedAt || b.createdAt || 0) - (a.touchedAt || a.createdAt || 0)); },
  get(id) { return id ? Store.get('people', id) : null; },
  byCode(code) { const c = String(code || '').toUpperCase(); return Store.all('people').find(p => p.code === c) || null; },
  name(p) { return p ? p.name || 'Без имени' : '—'; },
  /* в какой колонке человек: 1 — анкета, 2 — созвон, 3 — итог */
  col(p) {
    if (['new', 'sent'].includes(p.s1 || 'new')) return 1;
    if (['done', 'skip'].includes(p.s2)) return 3;
    return 2;
  },
  connected(p) { return p.type === 'client' ? ['done', 'fan'].includes(p.s3) : p.s3 === 'yes'; },
  /* строка под именем: без смайлов, чтобы читалась с одного взгляда */
  sub(p) {
    const a = p.answers || {};
    if (p.type === 'expert') return [p.topic || a.topic || (p.dirs || []).map(noEmo).join(', '), p.city].filter(Boolean).join(' · ');
    if (p.type === 'partner') return [noEmo(p.cat), p.city].filter(Boolean).join(' · ');
    if (p.type === 'amb') return [a.size ? `аудитория ${noEmo(a.size)}` : '', p.city].filter(Boolean).join(' · ');
    return [a.age ? noEmo(a.age) : '', p.city, a.stage ? noEmo(a.stage) : ''].filter(Boolean).join(' · ');
  },
  uniqueCode(name) {
    let code = refCodeFor(name || 'eva');
    const base = code.replace(/\d+$/, '');
    let n = 0;
    while (Store.all('people').some(p => p.code === code) && n < 50) { code = base + (100 + ((hashStr(name) + ++n * 37) % 900)); }
    return code;
  },
  create(f) {
    const now = Date.now();
    const doc = {s1: 'new', s2: 'none', s3: 'none', answers: {}, talk: {}, res: {tags: []}, createdAt: now, touchedAt: now, owner: Who.id(), ...f};
    doc.code = doc.code || this.uniqueCode(doc.name);
    doc.log = {[uid()]: {t: now, by: Who.id(), emo: '✨', text: f.ref ? `Пришла по ссылке ${f.ref}` : 'Добавлен в CRM'}, ...(f.log || {})};
    return Store.add('people', doc);
  },
  patch(id, p, logText = '', emo = '•') {
    const now = Date.now();
    const data = {...p, touchedAt: now};
    if (logText) data.log = {[uid()]: {t: now, by: Who.id(), emo, text: logText}};
    return Store.patch('people', id, data);
  },
  link(p) {
    const base = settings().anketaUrl || LINKS.anketa;
    const d = Questions.diff(p.type);
    return `${base}#${TYPES[p.type].letter}.${p.code}${d ? '.q' + Codec.encJson(d) : ''}`;
  },
  canEdit() { return Who.can('edit') && !Who.readOnly(); },
  /* перенос между шагами на доске: статусы подстраиваются под колонку,
     zone — точный итог («Подключаем», «Думает»…). Возвращает прежние
     статусы для «Отменить» или null, если ничего не поменялось. */
  moveTo(p, col, zone = null) {
    const before = {s1: p.s1 || 'new', s2: p.s2 || 'none', s3: p.s3 || 'none'};
    const done1 = ['done', 'skip'].includes(before.s1) ? before.s1 : Object.keys(p.answers || {}).length ? 'done' : 'skip';
    let next;
    if (col === 1) next = {s1: before.s1 === 'new' ? 'new' : 'sent', s2: 'none', s3: 'none'};
    else if (col === 2) next = {s1: done1, s2: ['set', 'noshow'].includes(before.s2) ? before.s2 : 'none', s3: 'none'};
    else next = {s1: done1, s2: before.s2 === 'skip' ? 'skip' : 'done', s3: zone || (this.col(p) === 3 ? before.s3 : 'none')};
    if (next.s1 === before.s1 && next.s2 === before.s2 && next.s3 === before.s3) return null;
    const T = TYPES[p.type];
    const extra = col === 3 && next.s2 === 'done' && !p.talkAt ? {talkAt: Date.now()} : {};
    const zoneName = zone ? s3Map(p.type)[zone].name : '';
    this.patch(p.id, {...next, ...extra}, `Перенесли на шаг «${T.steps[col - 1]}»${zoneName ? ': ' + zoneName.toLowerCase() : ''}`, '↔');
    return before;
  },
  invited(p) { return Store.all('people').filter(x => x.ref && x.ref === p.code); },
};

/* ── ответы анкеты: из ссылки или вручную ── */
const KEY_FIELDS = ['name', 'city', 'tg', 'cat', 'dirs', 'contact'];
function keyPatch(p, type, answers) {
  const out = {};
  Questions.set(type).test.forEach(q => {
    if (!q.key) return;
    const v = answers[q.id];
    if (v === undefined || v === '' || (Array.isArray(v) && !v.length)) return;
    if (!p || !p[q.key] || (Array.isArray(p[q.key]) && !p[q.key].length) || q.key === 'dirs' || q.key === 'cat') out[q.key] = v;
  });
  return out;
}
const Import = {
  /* сохранить ответы, присланные по ссылке: к карточке по коду или новой карточкой */
  apply(pl) {
    const type = TYPE_BY_LETTER[pl.t] || pl.t;
    if (!TYPES[type]) throw new Error('Неизвестный тип анкеты');
    const answers = pl.a || {};
    const owner = pl.c ? People.byCode(pl.c) : null;
    if (owner && !pl.r) {
      People.patch(owner.id, {answers: {...(owner.answers || {}), ...answers}, s1: 'done', answeredAt: pl.at || Date.now(), answeredBy: 'self', ...keyPatch(owner, type, answers)}, 'Заполнила анкету по ссылке', '📝');
      return owner.id;
    }
    const fromKeys = keyPatch(null, type, answers);
    return People.create({type, name: fromKeys.name || 'Без имени', ...fromKeys, answers, s1: 'done', answeredAt: pl.at || Date.now(), answeredBy: 'self', ref: pl.r && owner ? owner.code : pl.r ? pl.c : null, source: pl.r ? 'ref' : 'link'});
  },
};

/* ── статистика ответов ── */
/* шкала 1–5 цифрами: крайние значения с подписью, без смайлов */
const scaleName = (q, i) => (i === 0 ? `1 — ${q.lo || 'совсем нет'}` : i === 4 ? `5 — ${q.hi || 'очень'}` : String(i + 1));
const Stats = {
  agg(type, list = People.all(type)) {
    const answered = list.filter(p => p.answers && Object.keys(p.answers).length);
    return Questions.test(type).filter(q => ['one', 'many', 'scale'].includes(q.k)).map(q => {
      const counts = {};
      let n = 0, total = 0;
      answered.forEach(p => {
        const v = p.answers[q.id];
        if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) return;
        n++;
        if (q.k === 'scale') { total += Number(v) || 0; counts[v] = (counts[v] || 0) + 1; return; }
        answerLabels(q, v).forEach(l => { counts[l] = (counts[l] || 0) + 1; });
      });
      const opts = q.k === 'scale' ? [1, 2, 3, 4, 5].map(String) : (q.o || []);
      const rows = opts.map((o, i) => ({i, name: q.k === 'scale' ? scaleName(q, i) : o, v: counts[o] || 0})).filter(r => r.v || q.k !== 'many');
      Object.keys(counts).forEach(k => { if (q.k !== 'scale' && !opts.includes(k)) rows.push({i: -1, name: k, v: counts[k]}); });
      return {q, n, rows, avg: q.k === 'scale' && n ? total / n : null};
    });
  },
  top(a) { const r = a.rows.slice().sort((x, y) => y.v - x.v)[0]; return r && r.v ? r : null; },
  funnel(type) { const L = People.all(type); return {all: L.length, c1: L.filter(p => People.col(p) === 1).length, c2: L.filter(p => People.col(p) === 2).length, c3: L.filter(p => People.col(p) === 3).length, yes: L.filter(People.connected).length, answered: L.filter(p => p.s1 === 'done').length}; },
  quotes() {
    const out = [];
    Store.all('people').forEach(p => Object.entries(p.talk || {}).forEach(([qid, x]) => { if (x && x.star && x.a) out.push({p, qid, text: x.a, t: x.t || p.talkAt || 0}); }));
    return out.sort((a, b) => b.t - a.t);
  },
  insightTags() {
    const m = {};
    People.all('client').forEach(p => ((p.res || {}).tags || []).forEach(t => { m[t] = (m[t] || 0) + 1; }));
    return Object.entries(m).map(([name, v]) => ({name, v})).sort((a, b) => b.v - a.v);
  },
  dirCoverage() {
    return DIRECTIONS.map(d => {
      const L = People.all('expert').filter(p => (p.dirs || []).includes(d));
      return {d, n: L.length, yes: L.filter(People.connected).length, course: L.filter(p => /Да|готовый/.test(String((p.answers || {}).course || ''))).length};
    });
  },
  catCoverage() { return PARTNER_CATS.map(c => ({c, n: People.all('partner').filter(p => p.cat === c).length, yes: People.all('partner').filter(p => p.cat === c && People.connected(p)).length})); },
};

/* ── рекомендации двух видов: «сделать сейчас» (где люди застряли) и
   «что улучшить» (из ответов и пробелов в экспертах и партнёрах) ── */
const REACH = {'До 500': 300, '500–3 000': 1500, '3–10 тыс.': 6000, '10–50 тыс.': 25000, 'Больше 50 тыс.': 60000};
/* группа, где таких людей больше всего, — туда ведёт ссылка */
const topType = (list, def = 'client') => { const m = {}; list.forEach(p => { m[p.type] = (m[p.type] || 0) + 1; }); return Object.keys(m).sort((a, b) => m[b] - m[a])[0] || def; };
const names3 = list => list.slice(0, 3).map(People.name).join(', ') + (list.length > 3 ? ` и ещё ${list.length - 3}` : '');
function recommendations() {
  const out = [];
  const add = (kind, type, text, why, w, href = type) => out.push({kind, type, text: noEmo(text), why: noEmo(why), w, href});
  const t0 = Date.now();
  /* сделать сейчас */
  const stuck2 = Store.all('people').filter(p => p.s1 === 'done' && p.s2 === 'none' && (t0 - (p.answeredAt || p.touchedAt || 0)) > 2 * 864e5);
  if (stuck2.length) add('now', 'all', `Назначьте созвон: ${stuck2.length} ${plural(stuck2.length, 'человек заполнил', 'человека заполнили', 'человек заполнили')} анкету больше двух дней назад. Пока интерес тёплый.`, names3(stuck2), 1.2, topType(stuck2));
  const stuck3 = Store.all('people').filter(p => p.type !== 'client' && ['done', 'skip'].includes(p.s2) && (p.s3 || 'none') === 'none');
  if (stuck3.length) add('now', 'all', `Запишите решение после созвона: ${stuck3.length} ${plural(stuck3.length, 'человек', 'человека', 'человек')} без итога.`, names3(stuck3), 1.1, topType(stuck3, 'expert'));
  const clientsNoInsight = People.all('client').filter(p => ['done', 'skip'].includes(p.s2) && (p.s3 || 'none') === 'none');
  if (clientsNoInsight.length) add('now', 'client', `Разберите ${clientsNoInsight.length} ${plural(clientsNoInsight.length, 'интервью', 'интервью', 'интервью')}, пока разговор свежий: отметьте, что услышали.`, names3(clientsNoInsight), 1.05);
  const noTax = People.all('amb').filter(p => /Пока нет/.test(String((p.answers || {}).tax || '')) && /карту/.test(String((p.answers || {}).pay || '')));
  if (noTax.length) add('now', 'amb', `Отправьте памятку про «Мой налог»: ${noTax.length} ${plural(noTax.length, 'амбассадор хочет', 'амбассадора хотят', 'амбассадоров хотят')} выплаты на карту, но без статуса. Или предложите баланс Евы +10%.`, names3(noTax), 0.7);
  /* что улучшить: самый частый вариант ответа, если он набрал заметную долю */
  Object.keys(TYPES).forEach(type => {
    Stats.agg(type).forEach(a => {
      if (!a.q.rec || a.n < 3) return;
      const top = Stats.top(a);
      if (!top || top.i < 0 || !a.q.rec[top.i]) return;
      const share = top.v / a.n;
      if (share < 0.3) return;
      add('idea', type, a.q.rec[top.i], `${top.v} из ${a.n} ответили «${noEmo(top.name)}»`, share + (type === 'client' ? 0.3 : 0));
    });
  });
  const sleepPain = People.all('client').filter(p => ((p.answers || {}).pain || []).some(x => /сплю/.test(x))).length;
  if (sleepPain >= 2 && !DIRECTIONS.some(d => /Сон/.test(d))) add('idea', 'client', 'Плохой сон — частая боль, а направления «Сон» среди 14 нет. Добавьте направление и найдите эксперта.', `${sleepPain} ${plural(sleepPain, 'клиентка жалуется', 'клиентки жалуются', 'клиенток жалуются')} на сон`, 0.95);
  const empty = Stats.dirCoverage().filter(x => !x.n).map(x => noEmo(x.d));
  if (empty.length) add('idea', 'expert', `Найдите экспертов по направлениям: ${empty.slice(0, 5).join(', ')}${empty.length > 5 ? ` и ещё ${empty.length - 5}` : ''}. Пока там никого.`, `закрыто ${DIRECTIONS.length - empty.length} из ${DIRECTIONS.length} направлений`, 0.9);
  const wantCourse = People.all('expert').filter(p => /Да, уже есть идея/.test(String((p.answers || {}).course || '')));
  if (wantCourse.length) add('idea', 'expert', `Поставьте съёмочные дни в план: ${wantCourse.length} ${plural(wantCourse.length, 'эксперт хочет', 'эксперта хотят', 'экспертов хотят')} снять курс.`, names3(wantCourse), 0.8);
  const emptyCats = Stats.catCoverage().filter(x => !x.n).map(x => noEmo(x.c));
  if (emptyCats.length && People.all('partner').length) add('idea', 'partner', `Нет партнёров в категориях: ${emptyCats.slice(0, 4).join(', ')}${emptyCats.length > 4 ? ` и ещё ${emptyCats.length - 4}` : ''}.`, `охвачено ${PARTNER_CATS.length - emptyCats.length} из ${PARTNER_CATS.length} категорий`, 0.5);
  const reach = sum(People.all('amb'), p => REACH[(p.answers || {}).size] || 0);
  if (reach) add('idea', 'amb', `Амбассадоры читают около ${fmt(reach)} человек. Даже 1% — это ${fmt(Math.round(reach * 0.01))} ${plural(Math.round(reach * 0.01), 'регистрация', 'регистрации', 'регистраций')}.`, 'по ответам «Сколько людей тебя читает»', 0.4);
  return out.sort((a, b) => b.w - a.w);
}

/* ── 07-drag.js ── */
/* Перетаскивание карточек между шагами — мышью и пальцем (как в штабе).
   Мышь: зажали и повели (от 5 px). Палец: подержали ~0,3 с и повели —
   так обычная прокрутка не превращается в перетаскивание. Карточка едет
   за указателем, на месте вставки — пустая рамка, у краёв окна страница
   прокручивается сама. Зоны [data-zone] внутри колонки (например,
   «Подключаем» в «Итоге») ловят карточку точнее, чем колонка целиком. */

const Drag = {
  active: null,
  justDropped: 0,
  wired: false,

  /* root — доска; карточки [data-drag], колонки [data-col] со списком .b3-list */
  board(root, {canDrag, onDrop}) {
    root.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      const card = e.target.closest('[data-drag]');
      if (!card || !root.contains(card) || e.target.closest('button, a, input, select, textarea, [data-nodrag]')) return;
      if (canDrag && !canDrag(card.dataset.drag)) return;
      Drag.arm(e, card, root, onDrop);
    });
    if (Drag.wired) return;
    Drag.wired = true;
    document.addEventListener('pointermove', e => Drag.move(e), {passive: false});
    document.addEventListener('pointerup', e => Drag.end(e, true));
    document.addEventListener('pointercancel', e => Drag.end(e, false));
    document.addEventListener('touchmove', e => { if (Drag.active && Drag.active.on) e.preventDefault(); }, {passive: false});
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && Drag.active) Drag.end(null, false); });
    /* клик сразу после отпускания карточки не должен её открывать */
    document.addEventListener('click', e => { if (Date.now() - Drag.justDropped < 350 && e.target.closest && e.target.closest('[data-drag]')) { e.stopPropagation(); e.preventDefault(); } }, true);
  },

  arm(e, card, root, onDrop) {
    const touch = e.pointerType !== 'mouse';
    const st = {card, root, onDrop, on: false, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId, touch, timer: null, from: card.closest('[data-col]')};
    if (touch) st.timer = setTimeout(() => { if (Drag.active === st) Drag.start(st); }, 300);
    Drag.active = st;
  },

  start(st) {
    const r = st.card.getBoundingClientRect();
    st.on = true;
    st.dx = st.x0 - r.left;
    st.dy = st.y0 - r.top;
    const ghost = st.card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = r.width + 'px';
    document.body.appendChild(ghost);
    st.ghost = ghost;
    const ph = document.createElement('div');
    ph.className = 'drag-ph';
    ph.style.height = r.height + 'px';
    st.card.after(ph);
    st.card.classList.add('drag-src');
    st.ph = ph;
    document.body.classList.add('dragging-now');
    if (st.from) st.from.classList.add('drag-from');
    if (navigator.vibrate && st.touch) { try { navigator.vibrate(12); } catch (err) { /* ничего */ } }
    Drag.place(st);
  },

  move(e) {
    const st = Drag.active;
    if (!st || e.pointerId !== st.id) return;
    st.x = e.clientX; st.y = e.clientY;
    if (!st.on) {
      const d = Math.hypot(st.x - st.x0, st.y - st.y0);
      if (st.touch) { if (d > 10) { clearTimeout(st.timer); Drag.active = null; } return; }
      if (d < 5) return;
      Drag.start(st);
    }
    e.preventDefault();
    Drag.place(st);
    Drag.autoscroll(st);
  },

  place(st) {
    st.ghost.style.transform = `translate(${st.x - st.dx}px, ${st.y - st.dy}px) rotate(1.5deg)`;
    st.ghost.style.visibility = 'hidden';
    const under = document.elementFromPoint(st.x, st.y);
    st.ghost.style.visibility = '';
    const col = under && under.closest('[data-col]');
    const zone = under && under.closest('[data-zone]');
    $$('.drop-on', st.root).forEach(c => c !== col && c !== zone && c.classList.remove('drop-on'));
    st.zone = zone && st.root.contains(zone) ? zone : null;
    if (st.zone) st.zone.classList.add('drop-on');
    if (!col || !st.root.contains(col)) { st.col = null; return; }
    col.classList.add('drop-on');
    const list = $('.b3-list', col);
    const cards = $$('[data-drag]', list).filter(c => c !== st.card);
    let before = null;
    for (const c of cards) {
      const r = c.getBoundingClientRect();
      if (st.y < r.top + r.height / 2) { before = c; break; }
    }
    if (before) list.insertBefore(st.ph, before); else list.appendChild(st.ph);
    st.col = col;
  },

  autoscroll(st) {
    const edge = 60, speed = 14;
    if (st.y < edge) window.scrollBy(0, -speed);
    else if (st.y > window.innerHeight - edge) window.scrollBy(0, speed);
  },

  end(e, drop) {
    const st = Drag.active;
    if (!st || (e && e.pointerId !== st.id)) return;
    clearTimeout(st.timer);
    Drag.active = null;
    if (!st.on) return;
    Drag.justDropped = Date.now();
    st.ghost.remove();
    st.ph.remove();
    st.card.classList.remove('drag-src');
    document.body.classList.remove('dragging-now');
    $$('.drop-on, .drag-from', st.root).forEach(c => c.classList.remove('drop-on', 'drag-from'));
    if (drop && st.col) st.onDrop(st.card.dataset.drag, st.col.dataset.col, st.zone ? st.zone.dataset.zone : null);
  },
};

/* ── 08-seed.js ── */
/* Пример данных: вымышленные люди на разных шагах. Все записи с demo: true —
   удаляются одной кнопкой в настройках. Генератор детерминированный. */

const Demo = {
  build(T = Date.now()) {
    const R = rng(20261001);
    const DAY = 864e5;
    const ago = (d, h = 12) => { const x = new Date(T - d * DAY); x.setHours(h, R.int(0, 59), 0, 0); return Math.min(x.getTime(), T - 60e3); };
    const inDays = (d, h = 12) => { const x = new Date(T + d * DAY); x.setHours(h, 0, 0, 0); return x.getTime(); };
    const out = {team: {}, people: {}, cfg: {}};
    /* прошедшие созвоны — в разные дни и часы последних двух недель, без наложений */
    const HOURS = [10, 11, 12, 13, 15, 16, 17, 18, 19];
    let si = 0;
    const pastCall = () => { const n = si++; const x = new Date(T - (1 + (n * 4) % 13) * DAY); x.setHours(HOURS[(n * 7) % HOURS.length], n % 2 ? 30 : 0, 0, 0); return Math.min(x.getTime(), T - 2 * 3600e3); };
    out.team.dm_anna = {demo: true, name: 'Анна Смирнова', role: 'member', joinedAt: ago(60), order: 1, color: '#5A50C0'};
    out.team.dm_vera = {demo: true, name: 'Вера Орлова', role: 'member', joinedAt: ago(60), order: 2, color: '#8F6B27'};
    const team = ['dm_anna', 'dm_vera'];
    const codes = new Set();
    const codeOf = name => { let c = refCodeFor(name); while (codes.has(c)) c = c.replace(/\d+$/, n => String(Number(n) + 7)); codes.add(c); return c; };
    const Q = type => Object.fromEntries(Q_DEFAULT[type].test.map(q => [q.id, q]));
    /* ответ по весам вариантов */
    const one = (q, w) => (w ? R.weighted(q.o.map((o, i) => [o, w[i] ?? 1])) : R.pick(q.o));
    const many = (q, w, n) => { const pool = q.o.map((o, i) => [o, w ? w[i] ?? 1 : 1]); const res = new Set(); let guard = 0; while (res.size < n && guard++ < 30) res.add(R.weighted(pool)); return [...res]; };
    let k = 0;
    const person = (type, name, f) => {
      const id = `d${type[0]}${String(++k).padStart(2, '0')}`;
      const created = f.created ?? R.int(5, 30);
      const log = {l1: {t: ago(created), by: f.owner || null, emo: '✨', text: f.ref ? `Пришла по ссылке ${f.ref}` : 'Добавлен в CRM'}};
      if (f.s1 && f.s1 !== 'new') log.l2 = {t: ago(created - 1), by: f.owner || null, emo: '🔗', text: 'Отправили ссылку на анкету'};
      if (f.s1 === 'done') log.l3 = {t: f.answeredAt || ago(created - 2), emo: '📝', text: f.answeredBy === 'team' ? 'Анкету заполнила команда' : 'Заполнила анкету по ссылке'};
      if (f.s2 === 'set' || f.s2 === 'done') log.l4 = {t: ago(Math.max(1, created - 3)), by: f.owner || null, emo: '📅', text: 'Созвон назначен'};
      if (f.s2 === 'done') log.l5 = {t: f.callAt || ago(2), by: f.owner || null, emo: '✅', text: type === 'client' ? 'Интервью прошёл' : 'Созвон прошёл'};
      if (f.s3 && f.s3 !== 'none') log.l6 = {t: ago(1), by: f.owner || null, emo: '🚀', text: 'Итог записан'};
      out.people[id] = {demo: true, type, name, code: codeOf(name), s1: 'new', s2: 'none', s3: 'none', answers: {}, talk: {}, res: {tags: []}, createdAt: ago(created), touchedAt: ago(Math.max(0, created - 4)), log, ...f};
      const doc = out.people[id];
      /* ссылку отправили за 1–3 дня до ответов — чтобы было видно, сколько человек думает */
      if (doc.s1 === 'done' && doc.answeredBy === 'self' && doc.answeredAt && !doc.sentAt) doc.sentAt = doc.answeredAt - (1 + (k % 3)) * DAY + 3 * 3600e3;
      if (doc.callAt) doc.callMin = type === 'partner' ? 45 : 30;
      if (doc.s2 === 'done' && doc.callAt) doc.callDur = Math.round(doc.callMin * 60 * (0.75 + R.next() * 0.55));
      return id;
    };

    /* ── клиентки: кастдев ── */
    const qc = Q('client');
    const TALK_C = {
      t1: ['Работаю в IT удалённо, двое детей. Утро — сборы в сад, вечером падаю. Для себя остаётся минут 15 перед сном.', 'Я бухгалтер, в офисе до семи. Выходные уходят на быт и родителей.', 'Декрет, дочке год и два. День кусками: 20 минут тут, 10 там.'],
      t2: ['Неделю назад включила йогу на YouTube — на десятой минуте проснулся сын. Так и не вернулась.', 'Месяц назад ходила на пилатес, потом отпуск — и выпала.', 'Вчера сделала дыхательную практику в машине перед встречей. Помогло!'],
      t3: ['Постоянная тревога из-за работы и ощущение, что ничего не успеваю. Вчера опять не могла уснуть до двух.', 'Усталость. Просыпаюсь уже уставшей, кофе не помогает.', 'Ругаю себя за всё: что мало с ребёнком, что поправилась, что не работаю.'],
      t4: ['Пробовала Calm и Headspace — нравилось первые дни, потом стало скучно и дорого. Психолог помогал, но 5 000 за сессию не потянуть.', 'Марафоны блогеров — первые три дня бодро, потом чат превращается в продажи.', 'Бегала по утрам, но зимой бросила.'],

        ${tile(2, 'Созвон', needCall, 'назначить созвон', callsToday.length ? `сегодня ${callsToday.length} ${plural(callsToday.length, 'созвон', 'созвона', 'созвонов')}` : callsSet.length ? `уже назначено: ${callsSet.length}` : 'анкета уже заполнена')}
        ${tile(3, 'Итог', decide, 'подвести итог', 'созвон прошёл — запишите, что решили')}

          <div class="aud-f">${k === 'client' ? 'Разобрано интервью' : 'Подключаем'}: <b>${f.yes}</b></div></a>`; }).join('')}</section>
      <p class="note aud-note">Цифры в плитке — сколько людей сейчас на каждом шаге.</p>
      <div class="split section">
        <div class="card"><div class="card-head"><h2>Рекомендации</h2></div>

          ${ideas.length ? `<h3 class="rec-h">Что улучшить</h3><div class="recs">${ideas.map(rec).join('')}</div>` : ''}
        </div>
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Ближайшие созвоны</h2></div>
            ${upcoming.length ? `<div class="calls">${upcoming.map(p => `<a class="call" href="#p-${p.id}"><time>${esc(when(p.callAt))}</time><span><b>${esc(People.name(p))}</b><small>${groupName(p.type)}${p.zoom ? ' · есть ссылка на Zoom' : ''}</small></span></a>`).join('')}</div>` : '<p class="note">Созвонов не назначено.</p>'}</div>
          <a class="card as-link known" href="#stats"><div class="card-head"><h2>Что уже знаем</h2><span class="note">Статистика →</span></div>
            <div class="kpis">${[[known.answers, 'анкет'], [known.talks, 'созвонов'], [known.quotes, 'цитат']].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('')}</div></a>
