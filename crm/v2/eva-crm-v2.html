<title>Eva CRM 2.0</title>
<meta name="description" content="Кастдев и подключение экспертов, партнёров и амбассадоров Eva Space: анкеты по единой ссылке, созвоны, инсайты и рекомендации.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── 00-tokens.css ── */
/* Деловая палитра на основе Книги стандартов Eva Space:
   Ночь #14111A — основа и тёмная панель, Роза и Золото — только акценты
   бренда (знак, отметки, деньги), Фиалка — ссылки и выбранное.
   Шрифт — Inter; Unbounded остаётся только в названии штаба. */
:root{
  /* Eva Space, дизайн-система v2: графит + приглушённая фуксия (как приложение
     и «Книга стандартов»). Фуксия — выбранное и ссылки, графит — главные
     кнопки, золото и зелень — только смысловые отметки. */
  --bg:#F7F6F4;
  --surface:#FFFFFF;
  --surface-2:#FAF9F7;
  --sunken:#F1EFEC;
  --line:#E6E2DE;
  --line-strong:#D2CDC8;
  --ink:#111014;
  --ink-2:#4A4650;
  --ink-3:#7E7A85;

  --night:#1A171F;
  --night-2:#2B2233;
  --night-line:#3A2F42;
  --night-ink:#F3EFF4;
  --night-ink-2:#B3AAB9;
  --night-grad:linear-gradient(170deg,#1A171F 0%,#2B2233 62%,#4A2C42 100%);

  --accent:#111014;          /* главные кнопки */
  --on-accent:#FFFFFF;
  --link:#A8375C;            /* ссылки, выбранные вкладки, фокус */
  --link-soft:#F7E9EE;

  --rose:#A8375C;
  --rose-brand:#C2506F;
  --rose-soft:#F7E9EE;
  --gold:#8C6528;
  --gold-brand:#E7C58B;
  --gold-soft:#F6EEDF;
  --violet:#5B4BD0;
  --violet-soft:#EFECFC;

  --good:#3F7D62;
  --good-soft:#E4F1EA;
  --bad:#B03A48;
  --bad-soft:#F8E6E8;
  --warn:#B4642A;
  --warn-soft:#FAEEDF;

  --in-row:#F1F8F4;
  --out-row:#FCF3F4;

  --g-alt:rgba(17,16,20,.028);
  --g-half:rgba(17,16,20,.06);
  --g-month:rgba(17,16,20,.13);
  --g-quarter:rgba(17,16,20,.28);

  --shadow:0 1px 2px rgba(17,16,20,.05);
  --shadow-pop:0 16px 44px rgba(17,16,20,.16), 0 2px 6px rgba(17,16,20,.07);
  --radius:12px;
  --radius-sm:8px;

  --f-display:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --f-text:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --f-brand:'Unbounded', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121014; --surface:#1B181F; --surface-2:#211D26; --sunken:#16131A;
    --line:#2E2934; --line-strong:#453E4D;
    --ink:#F3EFF4; --ink-2:#C4BCC9; --ink-3:#938B9A;
    --night:#0E0C11; --night-2:#221C29; --night-line:#2F2836;
    --night-grad:linear-gradient(170deg,#0E0C11 0%,#1B1622 62%,#2E1F2B 100%);
    --accent:#F3EFF4; --on-accent:#111014;
    --link:#E693B0; --link-soft:#3A2230;
    --rose:#E693B0; --rose-soft:#3A2230;
    --gold:#E7C58B; --gold-soft:#33291B;
    --violet:#ABA2F2; --violet-soft:#29254A;
    --good:#7DCBA3; --good-soft:#1B3027;
    --bad:#EF929F; --bad-soft:#3B2027;
    --warn:#E8B463; --warn-soft:#352819;
    --in-row:#17231D; --out-row:#261B20;
    --g-alt:rgba(255,255,255,.025); --g-half:rgba(255,255,255,.05); --g-month:rgba(255,255,255,.11); --g-quarter:rgba(255,255,255,.24);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-pop:0 16px 44px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121014; --surface:#1B181F; --surface-2:#211D26; --sunken:#16131A;
  --line:#2E2934; --line-strong:#453E4D;
  --ink:#F3EFF4; --ink-2:#C4BCC9; --ink-3:#938B9A;
  --night:#0E0C11; --night-2:#221C29; --night-line:#2F2836;
  --night-grad:linear-gradient(170deg,#0E0C11 0%,#1B1622 62%,#2E1F2B 100%);
  --accent:#F3EFF4; --on-accent:#111014;
  --link:#E693B0; --link-soft:#3A2230;
  --rose:#E693B0; --rose-soft:#3A2230;
  --gold:#E7C58B; --gold-soft:#33291B;
  --violet:#ABA2F2; --violet-soft:#29254A;
  --good:#7DCBA3; --good-soft:#1B3027;
  --bad:#EF929F; --bad-soft:#3B2027;
  --warn:#E8B463; --warn-soft:#352819;
  --in-row:#17231D; --out-row:#261B20;
  --g-alt:rgba(255,255,255,.025); --g-half:rgba(255,255,255,.05); --g-month:rgba(255,255,255,.11); --g-quarter:rgba(255,255,255,.24);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 16px 44px rgba(0,0,0,.6);
}

/* ── 01-base.css ── */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 var(--f-text); -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance;}
h1{font:600 22px/1.25 var(--f-display); letter-spacing:-.015em;}
h2{font:600 15px/1.3 var(--f-display); letter-spacing:-.005em;}
h3{font:600 14px/1.35 var(--f-text);}
p{margin:0;}
a{color:inherit;}
button,input,select,textarea{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--link); outline-offset:2px;}
img{max-width:100%;}
[hidden]{display:none !important;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-3);}
.soft{color:var(--ink-2);}
.good{color:var(--good);}
.bad{color:var(--bad);}
.warn{color:var(--warn);}
.label{
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
}
.nowrap{white-space:nowrap;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

/* загрузка */
.boot{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:var(--ink-3); text-align:center; padding-inline:16px;
}
.boot b{font:500 17px var(--f-brand); color:var(--ink);}
.boot-mark{width:44px; height:44px; margin-bottom:8px; animation:pulse 1.6s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 02-shell.css ── */
/* Оболочка: тёмная боковая панель «Ночь» + рабочая область */
.app{min-height:100%;}
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh;}
.side{
  position:sticky; top:0; height:100vh; overflow-y:auto;
  background:var(--night-grad); color:var(--night-ink);
  display:flex; flex-direction:column; padding:20px 14px 16px;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 8px 22px; text-decoration:none;}
.brand-mark{width:34px; height:34px; flex:0 0 34px; border-radius:9px; box-shadow:0 2px 8px rgba(0,0,0,.35);}
.brand b{display:block; font:400 13.5px/1.1 var(--f-brand); color:#fff; letter-spacing:.16em; text-transform:uppercase;}
.brand span{display:block; font-size:11px; color:var(--night-ink-2); margin-top:3px;}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav a{
  display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:7px;
  color:var(--night-ink-2); text-decoration:none; font-weight:500; font-size:14px;
}
.nav a svg{width:18px; height:18px; flex:0 0 18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.nav a:hover{background:rgba(255,255,255,.06); color:var(--night-ink);}
.nav a.on{background:rgba(255,255,255,.08); color:#fff; box-shadow:inset 2px 0 0 var(--rose-brand);}
.nav .badge{
  margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px;
  background:var(--rose-brand); color:var(--night); font-size:11.5px; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center;
}
.side-foot{margin-top:auto; padding-top:18px; display:flex; flex-direction:column; gap:10px;}
.me-chip{
  display:flex; align-items:center; gap:10px; padding:8px; border-radius:9px;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
}
.me-link{display:flex; align-items:center; gap:10px; flex:1; min-width:0; text-decoration:none; color:inherit; border-radius:7px;}
.me-link:hover b{text-decoration:underline; text-underline-offset:3px;}
.me-chip.on{border-color:var(--gold-brand);}
.me-chip .who{min-width:0; flex:1;}
.me-chip b{display:block; font-size:13px; color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.me-chip .who span{display:block; font-size:11.5px; color:var(--night-ink-2);}
.me-chip button{
  background:none; border:1px solid var(--night-line); color:var(--night-ink-2); border-radius:8px;
  width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 30px;
}
.me-chip button:hover{color:#fff; border-color:var(--rose-brand);}
.me-chip button svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8;}
.sync{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--night-ink-2); padding:0 4px;}
.sync i{width:7px; height:7px; border-radius:50%; background:#6FC49A; flex:0 0 7px;}
.sync.local i{background:var(--gold-brand);}
.sync.busy i{background:var(--gold-brand); animation:pulse 1s ease-in-out infinite;}
.sync.err i{background:#EF929F;}
@keyframes pulse{50%{opacity:.35;}}

.main{min-width:0; padding:26px 36px 64px;}
.page{max-width:1200px; margin:0 auto;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
.page-head .sub{color:var(--ink-3); margin-top:6px; max-width:62ch;}
.page-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.section{margin-top:30px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
.section-head .hint-inline{color:var(--ink-3); font-size:12.5px;}

/* узкие экраны: панель становится шапкой с прокручиваемым меню */
@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr);}
  .side{min-width:0;
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40; height:auto; overflow:visible;
    flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px 16px; gap:8px 12px;
  }
  .brand{padding:0; flex:1 1 auto;}
  .brand span{display:none;}
  .side-foot{margin:0; padding:0; flex-direction:row; align-items:center;}
  .sync span{display:none;}
  .me-chip{padding:4px 4px 4px 4px; background:none; border:0;}
  .me-chip .who{display:none;}
  .nav{order:3; flex:1 0 100%; flex-direction:row; overflow-x:auto; gap:4px; margin:0 -16px; padding:0 16px 2px; scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav a{padding:7px 10px; white-space:nowrap; font-size:13px;}
  .nav a.on{box-shadow:inset 0 -2px 0 var(--rose-brand);}
  .main{padding:20px 16px 56px;}
  h1{font-size:20px;}
}

/* ── 03-components.css ── */
/* ── кнопки ── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:34px; padding:0 13px; border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-weight:500; font-size:13.5px; white-space:nowrap;
  text-decoration:none; transition:background .12s, border-color .12s, color .12s;
}
.btn:hover{border-color:var(--ink-3);}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.btn.primary:hover{filter:brightness(1.25);}
.btn.dark{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2);}
.btn.ghost:hover{background:var(--sunken); color:var(--ink);}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line));}
.btn.danger.solid{background:var(--bad); border-color:var(--bad); color:#fff;}
.btn.good{background:var(--good); border-color:var(--good); color:#fff;}
.btn.sm{height:30px; padding:0 10px; font-size:12.5px; border-radius:6px;}
.btn.xs{height:26px; padding:0 8px; font-size:12px; border-radius:7px;}
.btn[disabled]{opacity:.5; cursor:default; pointer-events:none;}
.icon-btn{
  width:32px; height:32px; border-radius:8px; border:1px solid transparent; background:none; color:var(--ink-3);
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 32px;
}
.icon-btn:hover{background:var(--sunken); color:var(--ink);}
.icon-btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.link-btn{background:none; border:0; padding:0; color:var(--link); font-weight:500; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;}

/* ── поля ── */
.field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.field > span{font-size:12px; font-weight:500; color:var(--ink-2);}
.field small{font-size:11.5px; color:var(--ink-3);}
.input, .select, .textarea{
  width:100%; height:34px; padding:0 10px; border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); font-size:14px; min-width:0;
}
.textarea{height:auto; min-height:84px; padding:9px 11px; resize:vertical; line-height:1.5;}
.select{padding-right:28px; appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position:calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size:5px 5px; background-repeat:no-repeat;
}
.input:focus, .select:focus, .textarea:focus{outline:none; border-color:var(--link); box-shadow:0 0 0 3px var(--link-soft);}
.input.num{text-align:right;}
.input.sm, .select.sm{height:30px; font-size:13px; border-radius:8px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
@media (max-width:640px){ .grid2, .grid3{grid-template-columns:1fr;} }
.check{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px;}
.check input{width:16px; height:16px; accent-color:var(--link);}

/* ── переключатель вариантов ── */
.seg{display:inline-flex; background:var(--sunken); border-radius:8px; padding:3px; gap:2px; flex-wrap:wrap; border:1px solid var(--line);}
.seg button{
  border:0; background:none; height:28px; padding:0 11px; border-radius:6px; font-size:13px; font-weight:500; color:var(--ink-2);
  white-space:nowrap;
}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(23,19,31,.12);}
.seg.out button.on{color:var(--bad);} .seg.in button.on{color:var(--good);}

/* ── метки ── */
.pill{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:11px;
  font-size:11.5px; font-weight:600; white-space:nowrap; background:var(--sunken); color:var(--ink-2);
}
.pill.rose{background:var(--rose-soft); color:var(--rose);}
.pill.gold{background:var(--gold-soft); color:var(--gold);}
.pill.violet{background:var(--violet-soft); color:var(--violet);}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.line{background:none; border:1px solid var(--line-strong);}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 8px; background:var(--ink-3);}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  height:28px; padding:0 10px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface);
  font-size:12.5px; font-weight:500; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.chip:hover{border-color:var(--ink-3); color:var(--ink);}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.chip b{font-weight:700;}

/* ── панели ── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.card.flat{box-shadow:none;}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.card-head h2{font-size:14.5px;}
.cards{display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));}
.split{display:grid; gap:16px; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);}
@media (max-width:1000px){ .split{grid-template-columns:1fr;} }

/* показатели */
.stat .label{display:block; margin-bottom:8px;}
.stat .big{font:600 26px/1.1 var(--f-display); letter-spacing:-.02em;}
.stat .big small{font:500 14px var(--f-text); color:var(--ink-3); letter-spacing:0;}
.stat .foot{margin-top:8px; font-size:12.5px; color:var(--ink-3);}
.bar{height:6px; border-radius:3px; background:var(--sunken); overflow:hidden; margin-top:10px; position:relative;}
.bar > i{display:block; height:100%; border-radius:3px; background:var(--link);}
.bar > i.good{background:var(--good);} .bar > i.warn{background:var(--warn);} .bar > i.bad{background:var(--bad);}
.bar > b{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); border-radius:1px;}

/* ── таблицы ── */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
table.t{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums;}
table.t th, table.t td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle;}
table.t th{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); background:var(--surface-2); white-space:nowrap;}
table.t tbody tr:last-child td{border-bottom:0;}
table.t td.r, table.t th.r{text-align:right;}
table.t td.c, table.t th.c{text-align:center;}
table.t tr.total td{font-weight:700; background:var(--surface-2);}
table.t tr.sub td{font-weight:600;}
table.t tr.group td{background:var(--sunken); font-weight:600; font-size:12px; color:var(--ink-2);}
table.t tr.now td{background:var(--rose-soft);}
table.t tr:hover td.hov{background:var(--surface-2);}
table.grid-lines td, table.grid-lines th{border-right:1px solid var(--line);}
table.grid-lines td:last-child, table.grid-lines th:last-child{border-right:0;}

/* ── аватар ── */
.av{
  width:26px; height:26px; border-radius:50%; flex:0 0 26px; display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:#fff; background:var(--violet); letter-spacing:.02em; text-transform:uppercase;
}
.av.lg{width:40px; height:40px; flex-basis:40px; font-size:14px;}
.av.none{background:var(--sunken); color:var(--ink-3); border:1px dashed var(--line-strong);}
.av img{width:100%; height:100%; border-radius:50%; object-fit:cover;}

/* ── пустое состояние и подсказки ── */
.empty{padding:26px 18px; text-align:center; color:var(--ink-3); font-size:13.5px; border:1px dashed var(--line-strong); border-radius:var(--radius);}
.empty b{display:block; color:var(--ink-2); margin-bottom:4px; font-size:14px;}
.help{
  display:flex; gap:14px; align-items:flex-start; padding:12px 16px; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--link); color:var(--ink-2); font-size:13px; line-height:1.55; margin-bottom:18px;
}
.help b{color:var(--ink);}
.help ol, .help ul{margin:4px 0 0; padding-left:18px;}
.help .x{margin-left:auto; flex:0 0 auto;}
.note{font-size:12.5px; color:var(--ink-3); line-height:1.5;}

/* ── вкладки ── */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; scrollbar-width:none;}
.tabs button{
  border:0; background:none; padding:10px 12px; font-weight:500; color:var(--ink-3); font-size:14px; white-space:nowrap;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink);}
.tabs button.on{color:var(--ink); border-bottom-color:var(--link);}
.tabs button .n{font-size:11.5px; color:var(--ink-3); margin-left:4px;}

/* ── окно ── */
.modal-back{
  position:fixed; inset:0; z-index:100; background:rgba(14,11,18,.48); display:flex; align-items:flex-start; justify-content:center;
  padding:6vh 16px 24px; overflow-y:auto; animation:fade .14s ease-out;
}
.modal{
  width:100%; max-width:560px; background:var(--surface); border-radius:12px; box-shadow:var(--shadow-pop);
  border:1px solid var(--line); animation:rise .16s ease-out;
}
.modal.wide{max-width:860px;}
.modal-head{display:flex; align-items:flex-start; gap:12px; padding:18px 20px 0;}
.modal-head h2{flex:1; font-size:16px; padding-top:4px;}
.modal-body{padding:16px 20px 20px; display:flex; flex-direction:column; gap:14px;}
.modal-foot{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:14px 20px; border-top:1px solid var(--line); background:var(--surface-2); border-radius:0 0 12px 12px;}
.modal-foot .left{margin-right:auto;}
@keyframes fade{from{opacity:0;}}
@keyframes rise{from{opacity:0; transform:translateY(8px);}}

/* ── всплывающее подтверждение ── */
.pop{
  position:absolute; z-index:120; width:max-content; max-width:280px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow-pop); padding:12px 14px; animation:fade .12s ease-out;
}
.pop p{font-size:13px; font-weight:500; margin-bottom:10px;}
.pop .row{gap:6px;}

/* ── уведомления ── */
.toast-root{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:max-content; max-width:calc(100vw - 32px);}
.toast{
  display:flex; align-items:center; gap:14px; background:var(--night); color:var(--night-ink); padding:10px 14px 10px 16px;
  border-radius:11px; box-shadow:var(--shadow-pop); font-size:13.5px; animation:rise .16s ease-out;
}
.toast button{background:none; border:0; color:var(--rose-brand); font-weight:600; padding:2px 4px;}
.toast.err{background:var(--bad);}

/* ── графики ── */
.chart{width:100%; height:auto; display:block; overflow:visible;}
.chart text{font:11px var(--f-text); fill:var(--ink-3);}
.chart .grid{stroke:var(--line); stroke-width:1;}
.chart .axis{stroke:var(--line-strong); stroke-width:1;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:8px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:14px; height:3px; border-radius:2px; display:inline-block;}
.legend i.dash{background:repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height:2px;}
@media (max-width:640px){
  .tiles, .periods, .cf-sum{grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .tiles .stat, .periods .period, .cf-sum .stat{min-height:0; padding:14px;}
  .stat .big{font-size:20px;}
  .stat .foot{font-size:12px;}
}

/* ── 10-v2.css ── */
/* ── CRM 2.0: проще и спокойнее. Смайл — только «лицо» раздела (меню,
   заголовок группы, карточка человека). Цифры, статусы, кнопки и графики —
   без смайлов, чтобы читались с первого взгляда. ── */
.page{max-width:1240px;}
.nav-emo{width:20px; flex:0 0 20px; text-align:center; font-size:15px; line-height:1;}
.nav .nav-n{margin-left:auto; font-size:11.5px; color:var(--night-ink-2); font-variant-numeric:tabular-nums;}
.emo{font-size:1.15em; line-height:1;}
.muted{color:var(--ink-3);}
.sp{flex:1;}
.stack{display:flex; flex-direction:column; gap:12px;}
.two{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px;}
@media (max-width:900px){ .two{grid-template-columns:1fr;} }
.copy-fallback{width:100%; min-height:90px; font:12px/1.4 ui-monospace, Menlo, monospace;}
.input.need, .textarea.need{border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-soft);}
a.card.as-link{text-decoration:none; color:inherit; transition:border-color .12s, background .12s;}
a.card.as-link:hover{border-color:var(--line-strong); background:var(--surface-2);}

/* главная: три шага «что сделать» */
.h-sm{font-size:13px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; margin:18px 0 10px;}
.h-sm:first-of-type{margin-top:4px;}
.todo{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px;}
@media (max-width:760px){ .todo{grid-template-columns:1fr;} }
.todo-i{display:flex; flex-direction:column; gap:2px; padding:14px 16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); text-decoration:none; color:inherit;}
.todo-i:hover{border-color:var(--line-strong);}
.todo-step{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink-3); margin-bottom:4px;}
.todo-step i{font-style:normal; width:20px; height:20px; border-radius:50%; background:var(--sunken); display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-2);}
.todo-i b{font:600 30px/1.1 var(--f-display); font-variant-numeric:tabular-nums;}
.todo-t{font-size:14px; font-weight:500;}
.todo-i small{font-size:12.5px; color:var(--ink-3);}
.todo-i.hot{background:var(--rose-soft); border-color:transparent;}
.todo-i.hot .todo-step i{background:var(--rose); color:#fff;}

/* плитки групп с тремя шагами */
.aud{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px;}
@media (max-width:1100px){ .aud{grid-template-columns:repeat(2, minmax(0,1fr));} }
@media (max-width:560px){ .aud{grid-template-columns:1fr;} }
.aud-c{display:flex; flex-direction:column; gap:10px; padding:16px 18px; text-decoration:none; color:inherit;}
.aud-h{display:flex; align-items:center; gap:10px;}
.aud-h .e{font-size:22px; line-height:1;}
.aud-h b{font-size:15px;}
.aud-h .n{margin-left:auto; font:600 24px/1 var(--f-display); font-variant-numeric:tabular-nums;}
.steps3{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px;}
.steps3 div{background:var(--surface-2); border-radius:8px; padding:7px 9px; font-size:12px; color:var(--ink-3); display:flex; flex-direction:column; gap:1px;}
.steps3 b{font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums;}
.aud-f{font-size:12.5px; color:var(--ink-2);}
.aud-f b{font-variant-numeric:tabular-nums;}
.aud-note{margin-top:8px;}

/* рекомендации: текст, под ним группа и почему */
.rec-h{font-size:12px; font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; margin:4px 0 8px;}
.recs + .rec-h{margin-top:16px;}
.recs{display:flex; flex-direction:column; gap:8px;}
.rec{display:block; padding:11px 14px; border-radius:10px; background:var(--surface); border:1px solid var(--line); text-decoration:none; color:inherit;}
.rec:hover{border-color:var(--line-strong);}
.rec b{display:block; font-weight:500; font-size:13.5px; line-height:1.45;}
.rec small{display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; color:var(--ink-3); font-size:12px; margin-top:5px;}
.rec-g{padding:1px 8px; border-radius:9px; background:var(--sunken); color:var(--ink-2); font-weight:600; font-size:11.5px;}

/* ближайшие созвоны: время слева, кто — справа */
.calls{display:flex; flex-direction:column;}
.call{display:grid; grid-template-columns:118px minmax(0,1fr); gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; align-items:baseline;}
.call:last-child{border-bottom:0;}
.call:hover b{color:var(--link);}
.call time{font-size:12.5px; font-weight:600; color:var(--violet); font-variant-numeric:tabular-nums;}
.call b{display:block; font-size:13.5px; font-weight:600;}
.call small{display:block; font-size:12px; color:var(--ink-3);}

/* крупные цифры с подписью под ними */
.kpis{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px;}
.kpis > div{display:flex; flex-direction:column; gap:2px;}
.kpis b{font:600 26px/1.1 var(--f-display); font-variant-numeric:tabular-nums;}
.kpis span{font-size:12.5px; color:var(--ink-3);}
.kpis.kpis-4{grid-template-columns:repeat(4, minmax(0,1fr)); padding:16px 20px;}
.two .kpis{grid-template-columns:repeat(2, minmax(0,1fr));}
@media (max-width:640px){ .kpis.kpis-4{grid-template-columns:repeat(2, minmax(0,1fr)); row-gap:14px;} }
a.known .card-head .note{color:var(--link);}

/* полосы ответов */
.hbl{display:flex; flex-direction:column; gap:7px;}
.hbl-r{display:grid; grid-template-columns:minmax(120px, 210px) minmax(0,1fr) auto auto; gap:10px; align-items:center; font-size:13px;}
.hbl-n{display:flex; align-items:center; gap:6px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hbl-t{height:8px; border-radius:4px; background:var(--sunken); overflow:hidden;}
.hbl-t i{display:block; height:100%; border-radius:4px;}
.hbl-r b{font-weight:600; font-size:12.5px; text-align:right;}
.hbl-r small{font-size:11.5px; color:var(--ink-3); min-width:36px; text-align:right;}
@media (max-width:520px){ .hbl-r{grid-template-columns:110px minmax(0,1fr) auto;} .hbl-r small{display:none;} }
.qstats{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:12px;}
@media (max-width:420px){ .qstats{grid-template-columns:1fr;} }
.qstat-h{display:flex; gap:10px; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
.qstat h3{font-size:13.5px; font-weight:600; line-height:1.4;}
.qstat-h span{font-size:12px; color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums;}
.qstat-avg{font-size:12.5px; color:var(--ink-3); margin:-4px 0 10px;}
.qstat-avg b{color:var(--ink); font-size:14px;}
.coverage{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px;}
.cov{border-radius:10px; padding:9px 11px; border:1px solid var(--line); background:var(--surface); font-size:12.5px; display:flex; flex-direction:column; gap:1px;}
.cov b{font-size:13px; font-weight:600;}
.cov.zero{background:var(--rose-soft); border-color:transparent;}
.cov.zero small{color:var(--rose); font-weight:600;}
.cov small{color:var(--ink-3);}
.quote{padding:12px 14px; border-radius:10px; background:var(--gold-soft); font-size:13.5px; line-height:1.5;}
.quote small{display:block; margin-top:6px; color:var(--gold); font-size:12px;}
.quote a{color:inherit;}
.cloud{display:flex; flex-wrap:wrap; gap:6px;}
.cloud span{display:inline-flex; gap:6px; align-items:center; padding:5px 10px; border-radius:14px; background:var(--violet-soft); color:var(--violet); font-size:12.5px; font-weight:600;}

/* доска трёх шагов */
.board3{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; align-items:start;}
@media (max-width:900px){ .board3{grid-template-columns:1fr;} }
.b3-col{background:var(--sunken); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column;}
.b3-h{display:flex; align-items:center; gap:8px; padding:12px 14px 10px; border-bottom:1px solid var(--line);}
.b3-h .num{width:24px; height:24px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-2);}
.b3-h b{font-size:14px;}
.b3-h .kb-n{margin-left:auto;}
.b3-list{display:flex; flex-direction:column; gap:8px; padding:10px; min-height:80px;}
.b3-hint{font-size:12px; color:var(--ink-3); padding:0 14px 10px; line-height:1.45;}
.kb-n{min-width:22px; height:20px; padding:0 6px; border-radius:10px; background:var(--surface); border:1px solid var(--line); font-size:11.5px; font-weight:600; color:var(--ink-2); display:inline-flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;}
.pc{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 11px; display:flex; flex-direction:column; gap:7px; cursor:pointer; transition:border-color .12s;}
.pc:hover{border-color:var(--line-strong);}
.pc-top{display:flex; align-items:center; gap:8px;}
.pc-top .av{width:28px; height:28px; flex-basis:28px; font-size:11px;}
.pc-top b{font-size:13.5px; font-weight:600; line-height:1.3; flex:1; min-width:0; overflow-wrap:anywhere;}
.pc-sub{font-size:12px; color:var(--ink-3); line-height:1.4;}
.pc-ref{color:var(--violet); font-weight:600;}
.pc-acts{display:flex; gap:6px; flex-wrap:wrap;}
.st{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:11px; font-size:11.5px; font-weight:600; background:var(--sunken); color:var(--ink-2); white-space:nowrap;}
.st.good{background:var(--good-soft); color:var(--good);} .st.warn{background:var(--warn-soft); color:var(--warn);} .st.bad{background:var(--bad-soft); color:var(--bad);} .st.violet{background:var(--violet-soft); color:var(--violet);}
.chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
.chip{height:30px; padding:0 11px; border-radius:15px; border:1px solid var(--line-strong); background:var(--surface); font-size:12.5px; font-weight:500; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer;}
.chip:hover{border-color:var(--ink-3); color:var(--ink);}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.chip b{font-weight:700;}
.chip-n{min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--sunken); color:var(--ink-2); font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;}
.chip.on .chip-n{background:color-mix(in srgb, var(--bg) 25%, transparent); color:var(--bg);}

/* выбор ответа: крупные чипы */
.ans{display:flex; flex-wrap:wrap; gap:6px;}
.ans button{min-height:34px; padding:6px 12px; border-radius:17px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:13px; text-align:left; line-height:1.3;}
.ans button:hover{border-color:var(--link);}
.ans button.on{background:var(--link); border-color:var(--link); color:#fff;}
.scale{display:flex; gap:6px;}
.scale button{width:46px; height:46px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); font-size:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;}
.scale button small{font-size:10px; color:var(--ink-3); margin-top:2px;}
.scale button.on{border-color:var(--link); background:var(--link-soft); box-shadow:0 0 0 2px var(--link) inset;}
.num-scale{flex-wrap:wrap; align-items:center;}
.num-scale button{width:40px; height:40px; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;}
.num-scale .scale-ends{font-size:12px; color:var(--ink-3); margin-left:6px;}
.fq{display:flex; flex-direction:column; gap:8px; padding:14px 0; border-bottom:1px solid var(--line);}
.fq:last-child{border-bottom:0;}
.fq-t{display:flex; gap:10px; font-size:14px; font-weight:600; line-height:1.4;}
.fq-t i{font-style:normal; color:var(--ink-3); font-weight:500; min-width:22px;}
.fq-v{padding-left:32px;}
.fq-hint{font-size:12px; color:var(--ink-3); font-weight:400;}
.answer-val{display:flex; flex-wrap:wrap; gap:6px;}
.answer-val span{padding:4px 10px; border-radius:12px; background:var(--link-soft); color:var(--link); font-size:13px; font-weight:500;}
.answer-val em{font-style:normal; font-size:13.5px; color:var(--ink);}

/* карточка человека */
.ph{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px 18px; align-items:start; padding:18px 20px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); margin-bottom:14px;}
.ph .type-emo{width:56px; height:56px; border-radius:16px; background:var(--sunken); display:flex; align-items:center; justify-content:center; font-size:30px;}
.ph h1{font-size:21px; overflow-wrap:anywhere;}
.ph-sub{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:13px; color:var(--ink-3); margin-top:4px;}
.ph-sub a{color:var(--link);}
.ph-acts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
@media (max-width:760px){ .ph{grid-template-columns:auto minmax(0,1fr);} .ph-acts{grid-column:1/-1; justify-content:flex-start;} }
.code{font:600 12.5px ui-monospace, Menlo, monospace; letter-spacing:.05em; padding:3px 8px; border-radius:6px; background:var(--gold-soft); color:var(--gold);}
.big3{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-bottom:14px;}
@media (max-width:760px){ .big3{grid-template-columns:1fr;} }
.b3{border-radius:var(--radius); padding:14px 16px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:8px;}
.b3.cur{border-color:var(--link); box-shadow:0 0 0 3px var(--link-soft);}
.b3.done{background:var(--good-soft); border-color:transparent;}
.b3-t{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-3); font-weight:600;}
.b3-t .step-n{width:22px; height:22px; border-radius:50%; background:var(--sunken); display:inline-flex; align-items:center; justify-content:center; font-size:11.5px; color:var(--ink-2);}
.b3.done .step-n{background:var(--good); color:#fff;}
.b3-s{font-size:15px; font-weight:600;}
.b3-when{display:block; font-size:12.5px; font-weight:400; color:var(--ink-3); margin-top:2px;}
a.b3-when{color:var(--link); display:inline-block;}
.b3 .row{gap:6px;}
.link-box{display:flex; gap:6px; align-items:center; padding:8px 10px; border-radius:9px; background:var(--surface-2); border:1px dashed var(--line-strong); font:12px ui-monospace, Menlo, monospace; color:var(--ink-2); overflow:hidden;}
.link-box span{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* режим созвона */
.talk{display:flex; flex-direction:column; gap:10px;}
.tq{border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:6px;}
.tq.filled{border-color:color-mix(in srgb, var(--good) 35%, var(--line));}
.tq-h{display:flex; gap:10px; align-items:flex-start;}
.tq-h b{flex:1; font-size:14px; font-weight:600; line-height:1.4;}
.tq-h i{font-style:normal; color:var(--ink-3); min-width:22px; font-weight:600;}
.tq-why{font-size:12px; color:var(--ink-3); padding-left:32px;}
.tq .textarea{min-height:56px; margin-left:32px; width:calc(100% - 32px);}
.star{border:0; background:none; line-height:0; padding:3px; color:var(--ink-3); border-radius:6px;}
.star:hover{background:var(--sunken); color:var(--gold);}
.star svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linejoin:round;}
.star.on{color:var(--gold);}
.star.on svg{fill:currentColor;}
.timer{font:600 14px ui-monospace, Menlo, monospace; padding:4px 10px; border-radius:8px; background:var(--sunken); font-variant-numeric:tabular-nums;}
.tagpick{display:flex; flex-wrap:wrap; gap:6px;}
.tagpick button{height:30px; padding:0 11px; border-radius:15px; border:1px solid var(--line-strong); background:var(--surface); font-size:12.5px;}
.tagpick button.on{background:var(--violet); border-color:var(--violet); color:#fff;}
.log{display:flex; flex-direction:column; gap:6px;}
.log div{display:flex; gap:10px; font-size:13px; align-items:baseline;}
.log time{color:var(--ink-3); font-size:11.5px; white-space:nowrap; min-width:92px;}

/* вопросы */
.ql{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); overflow:hidden;}
.qi{display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:10px; align-items:start; padding:11px 14px; border-bottom:1px solid var(--line);}
.qi:last-child{border-bottom:0;}
.qi.hid{opacity:.45;}
.qi .n{font-size:12px; color:var(--ink-3); font-weight:600; padding-top:2px;}
.qk{display:inline-block; margin-right:8px; padding:0 7px; border-radius:8px; background:var(--sunken); color:var(--ink-2); font-weight:600; font-size:11px;}
.qi b{font-size:13.5px; font-weight:500; line-height:1.45; display:block;}
.qi small{display:block; font-size:12px; color:var(--ink-3); margin-top:3px; line-height:1.4;}
.qi .acts{display:flex; gap:2px;}
.qi .acts .icon-btn{width:28px; height:28px; flex-basis:28px;}
.qi .acts .icon-btn svg{width:15px; height:15px;}
.qi .acts .icon-btn.up svg{transform:rotate(180deg);}
.qi .acts .icon-btn.on{color:var(--link); background:var(--link-soft);}
.qi .acts .icon-btn:disabled{opacity:.3;}
.h-n{font-size:12.5px; font-weight:500; color:var(--ink-3); margin-left:6px;}
.pill.custom{background:var(--violet-soft); color:var(--violet);}
.opt-lines{font:13px/1.6 var(--f-text);}
.kinds{display:flex; flex-wrap:wrap; gap:6px;}
.kinds button{height:32px; padding:0 11px; border-radius:16px; border:1px solid var(--line-strong); background:var(--surface); font-size:12.5px;}
.kinds button.on{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.welcome{display:flex; gap:14px; align-items:center; padding:16px 18px; border-radius:var(--radius); background:linear-gradient(120deg, color-mix(in srgb, var(--rose-brand) 22%, var(--surface)), var(--surface)); border:1px solid var(--line); margin-bottom:16px;}
.welcome .e{font-size:30px;}
.welcome b{display:block; font-size:15px;}
.welcome p{font-size:13px; color:var(--ink-2);}
.how3{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-top:10px;}
@media (max-width:760px){ .how3{grid-template-columns:1fr;} }
.how3 div{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--ink-2);}
.how3 b{display:block; font-size:13.5px; color:var(--ink); margin-bottom:2px;}

/* ── из первой версии: полоса фильтров, строки-подсказки, назад ── */
.t-bar{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin-bottom:16px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);}
.t-bar .select{width:auto; max-width:190px;}
.t-search{width:280px;}
.t-bar-sp{flex:1;}
@media (max-width:760px){ .t-bar .select, .t-search{max-width:none; flex:1 1 140px;} .t-bar-sp{display:none;} }
.warnline{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:9px; background:var(--warn-soft); color:var(--warn); font-size:12.5px; line-height:1.5;}
.warnline svg{width:16px; height:16px; flex:0 0 16px; stroke:currentColor; fill:none; stroke-width:1.9; margin-top:1px;}
.warnline b{color:inherit;}
.okline{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:9px; background:var(--good-soft); color:var(--good); font-size:12.5px;}
.back-link{display:inline-flex; align-items:center; gap:4px; color:var(--ink-3); text-decoration:none; font-size:13px; margin-bottom:10px;}
.back-link svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;}
.back-link:hover{color:var(--link);}
.legal{font-size:12.5px; color:var(--ink-2); line-height:1.6;}
.legal li{margin-bottom:4px;}

/* ── перетаскивание карточек между шагами ── */
.can-drag .pc{cursor:grab; touch-action:pan-y;}
.drag-ghost{position:fixed; left:0; top:0; z-index:300; pointer-events:none; box-shadow:0 18px 40px rgba(17,16,20,.28); border-color:var(--link) !important; opacity:.96; cursor:grabbing;}
.drag-ph{border:2px dashed var(--link); border-radius:10px; background:color-mix(in srgb, var(--link-soft) 60%, transparent); flex:0 0 auto;}
.pc.drag-src{display:none;}
body.dragging-now, body.dragging-now *{cursor:grabbing !important; user-select:none !important;}
.b3-col.drop-on:not(.drag-from){border-color:var(--link); background:color-mix(in srgb, var(--link-soft) 70%, var(--sunken));}
.b3-zones{display:none; gap:6px; padding:0 10px 4px; grid-template-columns:repeat(auto-fit, minmax(90px,1fr));}
body.dragging-now .b3-zones{display:grid;}
.b3-zone{border:1.5px dashed var(--line-strong); border-radius:9px; padding:9px 8px; text-align:center; font-size:12px; font-weight:600; color:var(--ink-2); background:var(--surface);}
.b3-zone.good{color:var(--good);} .b3-zone.warn{color:var(--warn);} .b3-zone.bad{color:var(--bad);} .b3-zone.violet{color:var(--violet);}
.b3-zone.drop-on{border-style:solid; border-color:currentColor; background:color-mix(in srgb, currentColor 10%, var(--surface));}

/* ── 20-calendar.css ── */
/* ── календарь созвонов: сетка недели как в штабе, цвет — по группе ── */
.g-client{--g:var(--link);} .g-expert{--g:var(--violet);} .g-partner{--g:var(--good);} .g-amb{--g:var(--gold);} .g-google{--g:var(--ink-3);}
.cb-dot{width:10px; height:10px; border-radius:3px; display:inline-block; flex:0 0 10px; background:var(--g, var(--ink-3));}
.cal-bar{display:flex; align-items:flex-end; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin:18px 0 12px;}
.cal-bar .tabs{border-bottom:0; margin-bottom:0;}
.cal-nav{display:flex; align-items:center; gap:6px; padding-bottom:6px; flex-wrap:wrap;}
.cal-nav b{font-size:14px; min-width:120px; text-align:center;}
.icon-btn.flip svg{transform:scaleX(-1);}
.cal-legend{display:flex; gap:8px 16px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--ink-2); margin-bottom:10px;}
.cal-legend > span{display:inline-flex; align-items:center; gap:6px;}
.cal-legend .note{margin-left:auto;}
.cal-kpis{margin-top:14px;}
.cal-late{margin-top:12px; align-items:center; flex-wrap:wrap;}

.cal-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
.cal-week{--hh:44px; display:grid; grid-template-columns:52px repeat(7, minmax(104px, 1fr)); min-width:calc(52px + 7 * 104px);}
.cw-corner{border-bottom:1px solid var(--line); background:var(--surface-2);}
.cw-dh{display:flex; align-items:baseline; gap:5px; padding:8px 10px; border-bottom:1px solid var(--line); border-left:1px solid var(--line); background:var(--surface-2); white-space:nowrap;}
.cw-dh span{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); font-weight:600;}
.cw-dh b{font-size:17px; font-weight:600;}
.cw-dh small{font-size:11.5px; color:var(--ink-3);}
.cw-dh.is-today b{background:var(--link); color:#fff; border-radius:6px; padding:0 6px;}
.cw-dh.we span, .cw-dh.we b{color:var(--ink-3);}
.cw-times{position:relative; height:calc(var(--hh) * 14);}
.cw-times span{position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums;}
.cw-times span:first-child{transform:none; top:2px !important;}
.cw-col{position:relative; height:calc(var(--hh) * 14); border-left:1px solid var(--line); cursor:copy;
  background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(var(--g-alt) 1px, transparent 1px);
  background-size:100% var(--hh), 100% calc(var(--hh) / 2);}
.cw-col.we{background-color:var(--surface-2);}
.cw-col.past{background-color:color-mix(in srgb, var(--sunken) 45%, transparent);}
.cw-col:hover{background-color:color-mix(in srgb, var(--link-soft) 35%, transparent);}
.cw-now{position:absolute; left:0; right:0; height:2px; background:var(--bad); z-index:3; pointer-events:none;}
.cw-now::before{content:''; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--bad);}
.cb{position:absolute; z-index:2; overflow:hidden; border-radius:6px; padding:3px 6px; display:flex; flex-direction:column; gap:1px; font-size:11.5px; line-height:1.25; min-height:18px; cursor:pointer;
  background:color-mix(in srgb, var(--g) 16%, var(--surface)); border:1px solid color-mix(in srgb, var(--g) 35%, transparent); border-left:3px solid var(--g); color:var(--ink); touch-action:none;}
.cb b{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cb small{font-size:10.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cb.short{flex-direction:row; align-items:center; gap:6px;}
.cb:hover{z-index:4; box-shadow:0 4px 14px rgba(17,16,20,.14);}
.cb.st-done{opacity:.62;}
.cb.st-noshow{opacity:.55; background:var(--surface); border-style:dashed;}
.cb.st-noshow b{text-decoration:line-through;}
.cb.st-late{border-left-color:var(--warn); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent);}
.cb.gcal{--g:var(--ink-3); background:repeating-linear-gradient(135deg, var(--sunken) 0 5px, var(--surface) 5px 10px); border-color:var(--line-strong); border-left-color:var(--ink-3); color:var(--ink-2); cursor:default; z-index:1; opacity:.9;}
.cb.cb-drag{z-index:10; box-shadow:0 12px 30px rgba(17,16,20,.3); opacity:1; outline:2px solid var(--link);}

/* месяц */
.cal-month{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--surface);}
.cm-h{padding:8px 10px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); background:var(--surface-2); border-bottom:1px solid var(--line);}
.cm-d{min-height:96px; border:0; border-top:1px solid var(--line); border-left:1px solid var(--line); background:var(--surface); padding:6px 7px; display:flex; flex-direction:column; gap:3px; text-align:left; align-items:stretch; min-width:0;}
.cm-d:nth-child(7n+8){border-left:0;}
.cm-d:hover{background:color-mix(in srgb, var(--link-soft) 40%, var(--surface));}
.cm-d.out{background:var(--surface-2); color:var(--ink-3);}
.cm-d.past .cm-c{opacity:.6;}
.cm-n{font-size:12.5px; font-weight:600;}
.cm-d.is-today .cm-n{background:var(--link); color:#fff; border-radius:6px; padding:0 6px; align-self:flex-start;}
.cm-c{font-size:11px; padding:1px 5px; border-radius:4px; background:color-mix(in srgb, var(--g) 15%, var(--surface)); border-left:2px solid var(--g); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cm-c.st-noshow{text-decoration:line-through;}
.cm-more{font-size:11px; color:var(--ink-3);}
@media (max-width:640px){ .cm-d{min-height:64px; padding:4px;} .cm-c{font-size:10px;} }

/* список */
.cl-card .cl-day + .cl-day{margin-top:10px;}
.cl-row{display:grid; grid-template-columns:48px 12px minmax(0,1fr) auto; gap:10px; align-items:center; width:100%; padding:8px 4px; border:0; border-top:1px solid var(--line); background:none; text-align:left;}
.cl-row:hover{background:var(--surface-2);}
.cl-row time{font-weight:600; font-variant-numeric:tabular-nums; font-size:13px;}
.cl-n b{display:block; font-size:13.5px;}
.cl-n small{display:block; font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* статистика созвонов */
.cs-groups{display:flex; flex-direction:column; gap:10px;}
.cs-g{display:grid; grid-template-columns:12px 110px minmax(0,1fr) auto; gap:10px; align-items:center; font-size:13px;}
.cs-bar{display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--sunken);}
.cs-bar i{display:block; height:100%;}
.cs-bar i.good{background:var(--good);} .cs-bar i.bad{background:var(--bad);} .cs-bar i.set{background:color-mix(in srgb, var(--link) 45%, var(--surface));}
.cs-n{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap;}
.hours{display:grid; grid-template-columns:repeat(14, minmax(0,1fr)); gap:4px; align-items:end; height:120px;}
.hours div{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px;}
.hours i{display:block; width:100%; min-height:2px; border-radius:4px 4px 0 0; background:var(--link);}
.hours small{font-size:10px; color:var(--ink-3);}

/* Google Календарь */
.gc-card{display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 16px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); font-size:13px; color:var(--ink-2); margin-bottom:4px;}
.gc-card b{color:var(--ink);}
.gc-card .dot{background:var(--ink-3);}
.gc-card.ok .dot{background:var(--good);}
.gc-card.off .dot{background:var(--gold-brand);}
.gc-card.warn{border-color:color-mix(in srgb, var(--warn) 45%, var(--line)); background:var(--warn-soft);}
.gc-card.slim{padding:9px 14px;}

/* окна созвона */
.slot-list{display:flex; flex-direction:column; gap:4px; max-height:52vh; overflow:auto; margin-top:4px;}
.slot-p{display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); text-align:left;}
.slot-p:hover{border-color:var(--link);}
.slot-p b{display:block; font-size:13.5px;}
.slot-p small{display:block; font-size:12px; color:var(--ink-3);}
.call-head{display:flex; align-items:center; gap:8px; font-size:13.5px;}
.call-head .st{margin-left:auto;}
.kv-list{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
.kv{display:grid; grid-template-columns:110px minmax(0,1fr); gap:10px; font-size:13.5px;}
.kv span{color:var(--ink-3);}
.kv b{font-weight:500;}
.kv a{color:var(--link);}

/* ── режим интервью: вопросы слева, подсказки справа ── */
.iv{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start;}
@media (max-width:1100px){ .iv{grid-template-columns:1fr;} .iv-side{position:static !important;} }
.iv-bar{position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; padding:10px 12px; margin:-4px -6px 12px; border-radius:12px; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(8px); border:1px solid var(--line); box-shadow:var(--shadow);}
.timer.on{background:var(--rose-soft); color:var(--rose);}
.iv-prog{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2);}
.iv-prog b{font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums;}
.iv-pbar{width:90px; height:6px; border-radius:3px; background:var(--sunken); overflow:hidden; display:inline-block;}
.iv-pbar i{display:block; height:100%; background:var(--good); border-radius:3px;}
.iv-script{border:1px dashed var(--line-strong); border-radius:12px; padding:10px 14px; margin-bottom:10px; background:var(--surface-2); font-size:13.5px;}
.iv-script summary{cursor:pointer; font-weight:600; color:var(--ink-2);}
.iv-script ol{margin:8px 0 6px; padding-left:20px; display:flex; flex-direction:column; gap:4px; color:var(--ink);}
.iv-script .btn{margin-top:4px;}
.tq-n{min-width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface); font-size:11.5px; font-weight:700; color:var(--ink-3); display:inline-flex; align-items:center; justify-content:center; flex:0 0 24px; padding:0;}
.tq-n:hover{border-color:var(--good); color:var(--good);}
.tq.asked .tq-n{background:var(--good); border-color:var(--good); color:#fff;}
.tq.cur{border-color:var(--link); box-shadow:0 0 0 3px var(--link-soft);}
.tq.asked:not(.filled) textarea{min-height:40px;}
.iv-side{position:sticky; top:12px; display:flex; flex-direction:column; gap:10px;}
.iv-card{padding:14px 16px;}
.iv-card h3{font-size:13.5px; margin-bottom:8px;}
.iv-card .note{margin-bottom:8px;}
.iv-known{display:flex; flex-direction:column; gap:7px;}
.iv-known div{display:flex; flex-direction:column; gap:1px;}
.iv-known span{font-size:11.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
.iv-known b{font-size:13px; font-weight:500; line-height:1.4;}
.iv-probes{margin:0 0 8px; padding-left:18px; display:flex; flex-direction:column; gap:4px; font-size:13px;}
.iv-side .tagpick button{height:28px; font-size:12px;}

/* ── черновик итога от Claude ── */
.ai-box{border:1px solid color-mix(in srgb, var(--link) 30%, var(--line)); border-radius:14px; padding:14px 16px; background:linear-gradient(135deg, var(--link-soft), var(--surface) 60%);}
.ai-h{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
.ai-h b{display:block; font-size:14px;}
.ai-mark svg{width:30px; height:30px; display:block; border-radius:8px;}
.ai-rows{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.ai-rows > div{display:grid; grid-template-columns:130px minmax(0,1fr); gap:10px; font-size:13.5px;}
.ai-rows > div > span{color:var(--ink-3); font-size:12.5px;}
.ai-tags{display:flex; flex-wrap:wrap; gap:5px;}
.ai-tags i{font-style:normal; padding:2px 9px; border-radius:10px; background:var(--violet-soft); color:var(--violet); font-size:12px; font-weight:600;}
@media (max-width:640px){ .ai-rows > div{grid-template-columns:1fr; gap:2px;} }

/* ── 30-stats.css ── */
/* ── статистика для ролей ── */
.st-sub{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.st-seg{margin:0 0 14px;}
.st-seg .note{margin-right:4px;}

/* процесс: воронка группы */
.pf{display:flex; flex-direction:column; gap:7px;}
.pf-r{display:grid; grid-template-columns:150px minmax(0,1fr) 34px 44px; gap:10px; align-items:center; font-size:13px;}
.pf-n{color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pf-t{height:12px; border-radius:6px; background:var(--sunken); overflow:hidden;}
.pf-t i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, var(--link), color-mix(in srgb, var(--link) 55%, var(--violet)));}
.pf-r b{text-align:right; font-variant-numeric:tabular-nums;}
.pf-r small{font-size:11.5px; color:var(--ink-3); text-align:right; font-variant-numeric:tabular-nums;}
.pf-r small.bad{color:var(--bad); font-weight:600;}
@media (max-width:520px){ .pf-r{grid-template-columns:110px minmax(0,1fr) 28px 38px;} }
.wk{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:10px; height:150px; align-items:end;}
.wk-c{display:flex; flex-direction:column; align-items:center; gap:6px; height:100%;}
.wk-b{flex:1; width:100%; display:flex; gap:3px; align-items:flex-end; justify-content:center;}
.wk-b i{display:block; width:28%; min-height:2px; border-radius:3px 3px 0 0;}
.wk-c small{font-size:11px; color:var(--ink-3); white-space:nowrap;}
.tm-list{display:flex; flex-direction:column;}
.tm-r{display:grid; grid-template-columns:28px minmax(0,1fr) 44px 44px 44px; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px; text-decoration:none; color:inherit;}
.tm-r:first-child{border-top:0;}
.tm-r span{text-align:right; font-weight:600; font-variant-numeric:tabular-nums;}
.tm-r small{color:var(--ink-3); font-size:12px;}
a.tm-r{grid-template-columns:28px minmax(0,1fr) auto 36px;}
a.tm-r:hover b{color:var(--link);}

/* продукт: спрос и предложение форматов */
.dm{display:flex; flex-direction:column; gap:10px;}
.dm-r{display:grid; grid-template-columns:150px minmax(0,1fr) 40px minmax(0,1fr) 40px 90px; gap:8px; align-items:center; font-size:13px;}
.dm-t{height:9px; border-radius:5px; background:var(--sunken); overflow:hidden;}

<script>
(() => {
'use strict';
/* ── 00-core.js ── */
/* Ядро: DOM, форматирование чисел и дат. Все модули собираются в одну
   область видимости (см. build.py), поэтому функции отсюда видны везде. */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const byKey = (arr, k) => Object.fromEntries(arr.map(x => [x[k], x]));

/* Слияние как у db.update(): вложенные объекты сливаются, остальное заменяется */
function deepMerge(base, patch) {
  const out = isObj(base) ? {...base} : {};
  for (const [k, v] of Object.entries(patch || {})) {
    out[k] = isObj(v) && isObj(out[k]) ? deepMerge(out[k], v) : clone(v);
  }
  return out;
}

/* Делегирование событий: on(root, 'click', '[data-x]', (e, el) => …) */
function on(root, type, sel, fn) {
  root.addEventListener(type, e => {
    const el = e.target.closest(sel);
    if (el && root.contains(el)) fn(e, el);
  });
}

/* ── числа ── */
const NB = ' ';
function fmt(n, d = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const v = Number(n);
  return v.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d}).replace(/\s/g, NB);
}
const rub = n => (n === null || n === undefined ? '—' : fmt(Math.round(n)) + NB + '₽');
/* компактно: 1,45 млн ₽ · 290 тыс ₽ · 900 ₽ */
function rubK(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + fmt(a / 1e6, a >= 1e7 ? 1 : 2).replace(/,?0+$/, '') + NB + 'млн' + NB + '₽';
  if (a >= 1e4) return s + fmt(Math.round(a / 1e3)) + NB + 'тыс' + NB + '₽';
  return s + fmt(Math.round(a)) + NB + '₽';
}
const signed = (n, f = rubK) => (n > 0 ? '+' : n < 0 ? '' : '') + f(n);
const pct = (x, d = 0) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : fmt(x * 100, d) + '%');
const parseNum = s => {
  const v = parseFloat(String(s ?? '').replace(/\s| /g, '').replace(',', '.'));
  return Number.isFinite(v) ? v : 0;
};
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

/* ── даты: всё в местном времени, формат 'YYYY-MM-DD' и месяц 'YYYY-MM' ── */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dateOf = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
/* «сегодня» можно подменить для проверок: window.__EVA_TODAY = '2026-10-15' */
const today = () => (typeof window !== 'undefined' && window.__EVA_TODAY) || isoOf(new Date());
const addDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return isoOf(d); };
const monthOf = s => String(s).slice(0, 7);
const daysBetween = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);
const daysInMonth = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); };
const monthStart = m => m + '-01';
const monthEnd = m => m + '-' + pad(daysInMonth(m));
function addMonths(m, n) {
  const [y, mm] = m.split('-').map(Number);
  const d = new Date(y, mm - 1 + n, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthRange(from, to) {
  const out = [];
  for (let m = from; m <= to; m = addMonths(m, 1)) out.push(m);
  return out;
}
/* понедельник недели */
const weekStart = s => { const d = dateOf(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return isoOf(d); };
const weekday = s => (dateOf(s).getDay() + 6) % 7; // 0 = пн

const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_SH = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD_SH = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
/* убрать эмодзи из подписи: в CRM они мешают читать цифры и списки,
   а в анкете для людей остаются */
const noEmo = s => String(s ?? '').replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}\u200d\uFE0F\u20E3]/gu, '').replace(/\s{2,}/g, ' ').trim();

const monthIdx = m => Number(m.slice(5, 7)) - 1;
/* 'Октябрь' · с годом, если он не текущий квартальный: 'Январь 2027' */
function monthName(m, withYear = false) {
  const name = cap(MONTHS[monthIdx(m)]);
  return withYear || m.slice(0, 4) !== today().slice(0, 4) ? `${name} ${m.slice(0, 4)}` : name;
}
const monthShort = m => cap(MONTHS_SH[monthIdx(m)]) + (m.slice(0, 4) !== today().slice(0, 4) ? ' ' + m.slice(2, 4) : '');
/* '5 окт' · '5 октября' */
const dayShort = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}`; };
const dayLong = s => { const d = dateOf(s); return `${d.getDate()}${NB}${MONTHS_GEN[d.getMonth()]}`; };
const dayWd = s => `${WD_SH[weekday(s)]}, ${dayShort(s)}`;
/* подпись недели: '5–11 окт' или '28 сен – 4 окт' */
function weekLabel(start) {
  const end = addDays(start, 6), a = dateOf(start), b = dateOf(end);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()}${NB}${MONTHS_SH[b.getMonth()]}`
    : `${dayShort(start)} – ${dayShort(end)}`;
}
function timeAgo(ts) {
  if (!ts) return '';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return 'только что';
  if (s < 3600) { const m = Math.round(s / 60); return `${m}${NB}мин назад`; }
  if (s < 86400) { const h = Math.round(s / 3600); return `${h}${NB}ч назад`; }
  const d = new Date(ts);
  return `${d.getDate()}${NB}${MONTHS_SH[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ── хранилище браузера: только удобства одного зрителя ── */
const Local = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* приватное окно */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ничего */ } },
};
/* состояние вида (вкладка, фильтр) — помнится в этом браузере */
const View = {
  _s: null,
  get(k, def) { if (!this._s) this._s = Local.get('eva-crm2-view', {}); return k in this._s ? this._s[k] : def; },
  set(k, v) { if (!this._s) this._s = Local.get('eva-crm2-view', {}); this._s[k] = v; Local.set('eva-crm2-view', this._s); },
};
/* ── CRM: время событий хранится меткой времени (мс) ── */
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isoTs = ts => isoOf(new Date(ts));
/* '25 сен, 14:05' · 'сегодня, 14:05' · 'вчера, 09:10' */
function when(ts) {
  if (!ts) return '—';
  const d = isoTs(ts), t = today();
  if (d === t) return `сегодня, ${hm(ts)}`;
  if (d === addDays(t, -1)) return `вчера, ${hm(ts)}`;
  if (d === addDays(t, 1)) return `завтра, ${hm(ts)}`;
  return `${dayShort(d)}${d.slice(0, 4) !== t.slice(0, 4) ? ' ' + d.slice(0, 4) : ''}, ${hm(ts)}`;
}
const dayOrWhen = s => (!s ? '—' : s === today() ? 'сегодня' : s === addDays(today(), 1) ? 'завтра' : s === addDays(today(), -1) ? 'вчера' : dayShort(s));
/* 3:07 · 1:02:15 */
function dur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function durLong(sec) {
  const m = Math.round((sec || 0) / 60);
  if (m < 60) return `${m}${NB}мин`;
  return `${Math.floor(m / 60)}${NB}ч ${m % 60 ? (m % 60) + NB + 'мин' : ''}`.trim();
}
const ageOf = birth => { if (!birth) return null; const b = dateOf(birth), n = dateOf(today()); let a = n.getFullYear() - b.getFullYear(); if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--; return a; };

/* ── телефоны: храним цифрами 79991234567, показываем +7 999 123-45-67 ── */
const phoneDigits = s => { let d = String(s || '').replace(/\D/g, ''); if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1); if (d.length === 10) d = '7' + d; return d; };
function phoneFmt(s) {
  const d = phoneDigits(s);
  if (d.length === 11 && d[0] === '7') return `+7${NB}${d.slice(1, 4)}${NB}${d.slice(4, 7)}-${d.slice(7, 9)}-${d.slice(9)}`;
  return d ? '+' + d : '';
}
const tgUser = s => String(s || '').trim().replace(/^https?:\/\/t\.me\//, '').replace(/^@/, '');

/* ── детерминированный генератор для демо-данных ── */
function rng(seed) {
  let s = seed >>> 0;
  const next = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const r = {
    next,
    int: (a, b) => a + Math.floor(next() * (b - a + 1)),
    pick: arr => arr[Math.floor(next() * arr.length)],
    chance: p => next() < p,
    some: (arr, n) => { const c = arr.slice(), out = []; while (c.length && out.length < n) out.push(c.splice(Math.floor(next() * c.length), 1)[0]); return out; },
    /* выбор с весами: [[значение, вес], …] */
    weighted: pairs => { const tot = sum(pairs, p => p[1]); let x = next() * tot; for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; } return pairs[pairs.length - 1][0]; },
  };
  return r;
}

/* ── CSV: запятая или точка с запятой, кавычки по правилам RFC 4180 ── */
function csvParse(text) {
  const src = String(text || '').replace(/^﻿/, '');
  const first = src.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') ? '\t' : ',');
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (q) {
      if (c === '"') { if (src[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && src[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some(x => x.trim() !== '')) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
const csvCell = v => { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvOf = rows => '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');

/* копирование: только из обработчика клика; если нельзя — выделяем текст */
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.focus(); fallbackEl.select(); }
    return false;
  }
}

/* устойчивый хеш строки — для цветов аватаров и промокодов */
function hashStr(s) { let h = 0; for (const ch of String(s || '')) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }
/* промокод-приглашение из имени: «Алёна» → ALENA417 */
function refCodeFor(name) {
  const tr = {а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'i', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ы: 'y', э: 'e', ю: 'yu', я: 'ya'};
  const first = String(name).trim().split(/\s+/)[0].toLowerCase();
  const lat = [...first].map(ch => tr[ch] ?? (/[a-z0-9]/.test(ch) ? ch : '')).join('').slice(0, 10);
  return (lat || 'eva').toUpperCase() + (100 + (hashStr(name) % 900));
}

/* ── 01-config.js ── */

   итогов. Вопросы, направления и категории — в shared/10-questions.js. */

/* смайл — только «лицо» раздела в меню; в статусах, кнопках и у цифр их нет */
const NAV = [

/* шаг 1 — анкета, шаг 2 — созвон, шаг 3 — итог. Названия — состояние,

/* итог: для кастдева — разобрано ли интервью, для остальных — решение */

/* ── 20-codec.js ── */
/* Одна ссылка на человека — и для анкеты, и для рефералки.
   Ссылка анкеты:  <анкета>#k.ANNA482          k — клиентка, e — эксперт, p — партнёр, a — амбассадор
                   <анкета>#k.ANNA482.q…       хвост .q… — вопросы, которые команда добавила или скрыла
   Ответы назад:   <CRM>#in.z…                 z — сжатые ответы, j — без сжатия
   В адресе после # разрешены только буквы, цифры и . _ ~ - — поэтому
   данные упакованы в base64url. */

const Codec = {
  b64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  unb64(str) {
    let b = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const bin = atob(b);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },
  encJson(obj) { return this.b64(new TextEncoder().encode(JSON.stringify(obj))); },
  decJson(str) { return JSON.parse(new TextDecoder().decode(this.unb64(str))); },
  /* сжатие, где браузер умеет (CompressionStream); иначе — как есть */
  async pack(obj) {
    const raw = new TextEncoder().encode(JSON.stringify(obj));
    try {
      if (typeof CompressionStream === 'function') {
        const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        const buf = new Uint8Array(await new Response(cs).arrayBuffer());
        if (buf.length < raw.length) return 'z' + this.b64(buf);
      }
    } catch (e) { /* ниже — без сжатия */ }
    return 'j' + this.b64(raw);
  },
  async unpack(str) {
    const s = String(str || '').trim();
    const body = s.slice(1);
    if (s[0] === 'j') return JSON.parse(new TextDecoder().decode(this.unb64(body)));
    if (s[0] === 'z') {
      const ds = new Blob([this.unb64(body)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return JSON.parse(await new Response(ds).text());
    }
    throw new Error('Не похоже на ответы анкеты');
  },
  /* разбор хвоста ссылки анкеты: k.ANNA482.q… */
  parseAnketaHash(h) {
    const parts = String(h || '').replace(/^#/, '').split('.');
    const type = TYPE_BY_LETTER[parts[0]] || null;
    const code = parts[1] && /^[A-Za-z0-9_-]{2,40}$/.test(parts[1]) ? parts[1].toUpperCase() : '';
    let diff = null;
    const q = parts.find((p, i) => i >= 2 && p[0] === 'q');
    if (q) { try { diff = this.decJson(q.slice(1)); } catch (e) { diff = null; } }
    return {type, code, diff};
  },
  /* найти ответы в любом тексте: ссылке, сообщении из Telegram, чистом коде */
  findPayload(text) {
    const s = String(text || '');
    const m = s.match(/#in\.([zj][A-Za-z0-9_-]+)/) || s.match(/\bin\.([zj][A-Za-z0-9_-]{20,})/) || s.match(/^\s*([zj][A-Za-z0-9_-]{20,})\s*$/);
    return m ? m[1] : null;
  },
};

/* вопросы анкеты с учётом правок команды: скрытые убираем, изменённые
   подменяем, новые добавляем в конец */
function applyDiff(type, diff) {
  const base = (Q_DEFAULT[type] || {test: []}).test.map(q => ({...q}));
  if (!diff) return base;
  const hide = new Set(diff.h || []);
  const changed = Object.fromEntries((diff.c || []).map(q => [q.id, q]));
  const out = base.filter(q => !hide.has(q.id)).map(q => (changed[q.id] ? {...q, ...changed[q.id]} : q));
  (diff.c || []).forEach(q => { if (!base.some(b => b.id === q.id) && !hide.has(q.id)) out.push(q); });
  if (Array.isArray(diff.s)) { const pos = id => { const i = diff.s.indexOf(id); return i < 0 ? 999 : i; }; out.sort((a, b) => pos(a.id) - pos(b.id)); }
  return out;
}
/* ответ вопроса «как текст»: индексы вариантов → подписи */
function answerLabels(q, v) {
  if (v === undefined || v === null || v === '') return [];
  if (q.k === 'one') return [typeof v === 'number' ? (q.o || [])[v] : v].filter(x => x !== undefined);
  if (q.k === 'many') return (Array.isArray(v) ? v : [v]).map(x => (typeof x === 'number' ? (q.o || [])[x] : x)).filter(x => x !== undefined);
  if (q.k === 'scale') return [`${SCALE_EMO[(v | 0) - 1] || ''} ${v} из 5`];
  return [String(v)];
}
