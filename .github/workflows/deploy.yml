name: Публикация на GitHub Pages

on:
  push:
    branches:
      - claude/eva-space-v2-file-m38dcn
      - claude/eva-space-app-ho4tcy
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Приложение собирается из src/ в один файл — как и то, что уходит на хостинг.
      - name: Сборка приложения
        run: |
          python3 build.py
          test -s dist/index.html

      - name: Подготовка папки сайта
        run: |
          mkdir -p site
          cp dist/index.html site/
          cp manifest.json sw.js icon.svg *.png site/
          cp dist/index.html site/404.html   # чтобы работали ссылки вида /evaspace/#/...
          touch site/.nojekyll
          ls -la site

      # Публикация в ветку gh-pages — основной способ.
      # GitHub Pages подхватывает эту ветку и сайт открывается по ссылке.
      - name: Публикация в ветку gh-pages
        run: |
          cd site
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сборка сайта из ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Запасной способ: если в настройках выбран источник «GitHub Actions».
      - name: Настройка Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Загрузка сайта как артефакта Pages
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

    outputs:
      pages_ready: ${{ steps.pages.outcome }}

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация артефакта
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
