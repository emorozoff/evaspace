name: Публикация UPASS

# UPASS публикуется отдельно от остального сайта: сборка кладётся только
# в папку /upass/ ветки gh-pages, всё остальное на сайте остаётся как было.
# Так публикация из этой ветки не затирает сборку Eva Space, которую
# выкладывают другие ветки.

on:
  push:
    branches:
      - claude/upass-dao-blockchain-av7skf
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка UPASS
        run: npm run build:upass

      - name: Публикация папки /upass/ в gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3; do
            rm -rf site
            if git clone -q --depth 1 --branch gh-pages "$REMOTE" site; then
              echo "Ветка gh-pages получена"
            else
              echo "Ветки gh-pages ещё нет — создаём"
              mkdir site && cd site && git init -q && git checkout -qb gh-pages && cd ..
            fi

            rm -rf site/upass site/u
            mkdir -p site/upass site/u
            cp -r dist-upass/. site/upass/
            cp public/u/index.html site/u/index.html
            touch site/.nojekyll

            cd site
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "Изменений нет"
              exit 0
            fi
            git commit -q -m "UPASS из ${GITHUB_SHA}"
            if git push -q "$REMOTE" gh-pages; then
              echo "Опубликовано: /upass/"
              exit 0
            fi
            echo "Кто-то опубликовался параллельно, пробуем ещё раз"
            cd ..
            sleep 5
          done
          echo "Не удалось опубликовать после трёх попыток" >&2
          exit 1
