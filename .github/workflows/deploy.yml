name: Публикация на GitHub Pages

on:
  push:
    branches:
      - claude/eva-space-app-ho4tcy
      - claude/lucid-feynman-2vq7le
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build

      # Публикация в ветку gh-pages — основной способ.
      # GitHub Pages подхватывает эту ветку и сайт открывается по ссылке.
      #
      # На этой ветке рядом с Евой живут другие приложения: club, klub, u, upass.
      # Раньше публикация собирала ветку заново и пушила её с -f, поэтому каждая
      # сборка стирала соседей — их адреса начинали отдавать 404.html, а это копия
      # оболочки Евы, и вместо приложения открывалась Ева. Теперь берём ветку как
      # есть и заменяем только то, что собрала эта сборка.
      - name: Публикация в ветку gh-pages
        run: |
          set -eu
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --quiet --depth 1 --branch gh-pages "$REMOTE" published; then
            cd published
          else
            echo "Ветки gh-pages ещё нет — создаём"
            mkdir published && cd published
            git init -q && git checkout -qb gh-pages
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Убираем только то, что принадлежит этой сборке: список берём из dist,
          # поэтому он не разъедется, если сборка начнёт отдавать что-то ещё.
          (cd ../dist && find . -mindepth 1 -maxdepth 1 -printf '%f\0') \
            | while IFS= read -r -d '' item; do rm -rf -- "./$item"; done
          cp -a ../dist/. .

          git add -A
          if git diff --cached --quiet; then
            echo "Сайт не изменился, публиковать нечего"
          else
            git commit -q -m "Сборка сайта из ${GITHUB_SHA}"
            git push "$REMOTE" gh-pages
          fi
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Запасной способ: если в настройках выбран источник «GitHub Actions».
      - name: Настройка Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Загрузка сборки как артефакта Pages
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

    outputs:
      pages_ready: ${{ steps.pages.outcome }}

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация артефакта
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
