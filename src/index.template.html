<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Eva Space</title>
<meta name="description" content="Eva Space — платформа женского развития: личная программа, практики, курсы экспертов.">
<meta name="theme-color" content="#111014">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eva Space">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500&display=swap" rel="stylesheet">
<style>
<!--{{styles}}--></style>
</head>
<body>
<div id="app"></div>
<script>
/* Если приложение не смогло запуститься — старый браузер, обрыв загрузки, файл
   открыт не с сайта, — показываем причину вместо пустой страницы. Как только
   приложение нарисовало хоть что-то, эта заглушка больше не вмешивается. */
(function(){
  var shown = false;
  function boom(msg){
    if(shown) return;
    var app = document.getElementById('app');
    if(!app || app.childElementCount) return;
    shown = true;
    var why = location.protocol === 'file:'
      ? 'Файл открыт с телефона напрямую. Приложение работает с сайта — открой его по адресу хостинга.'
      : 'Похоже, браузер устарел или страница загрузилась не полностью. Обнови страницу; если не помогло — открой Eva Space в Safari или Chrome последней версии.';
    app.innerHTML = '<div style="font:15px/1.5 -apple-system,Inter,Arial,sans-serif;padding:48px 24px;max-width:420px;margin:0 auto;color:#111014">'
      + '<div style="font-size:22px;font-weight:700;margin-bottom:10px">Eva Space не запустилась</div>'
      + '<p style="margin:0 0 14px;color:#6E6579">' + why + '</p>'
      + '<button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:999px;background:#111014;color:#fff;font-weight:600;font-size:14px">Обновить</button>'
      + '<p style="margin-top:18px;font-size:11px;color:#9B93A6;word-break:break-word">' + String(msg || '').replace(/[<>&]/g, '') + '</p></div>';
  }
  window.addEventListener('error', function(e){ boom(e && e.message); });
})();
</script>
<script>
<!--{{app}}--></script>
</body>
</html>
