<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Eva Space</title>
<meta name="description" content="Eva Space — платформа женского развития: личная программа, практики, курсы экспертов.">
<meta name="theme-color" content="#111014">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eva Space">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   EVA SPACE — дизайн-система v2: графит + приглушённая фуксия
   ===================================================================== */
:root{
  --ink:#111014; --ink-2:#1C1A21; --ink-3:#2A272F;
  --paper:#F7F6F4; --surface:#FFFFFF; --surface-2:#F1EFEC;
  --muted:#7E7A85; --line:rgba(17,16,20,.09); --line-2:rgba(17,16,20,.16);
  --accent:#A8375C; --accent-2:#C2506F; --accent-soft:#F7E9EE;
  --gold:#B8894A; --ok:#3F7D62; --warn:#B4642A; --lilac:#6C5CE0;
  --grad-dark:linear-gradient(155deg,#1A171F 0%,#2B2233 55%,#4A2C42 100%);
  --sh-1:0 1px 2px rgba(17,16,20,.05);
  --sh-2:0 4px 18px rgba(17,16,20,.07);
  --sh-3:0 16px 44px rgba(17,16,20,.14);
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:28px;
  --shell:430px; --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);
  color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:15px;letter-spacing:-.006em}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font-family:inherit;font-size:15px;letter-spacing:-.006em}
::-webkit-scrollbar{display:none}
img{max-width:100%}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.serif{font-family:Inter,sans-serif;font-weight:700;letter-spacing:-.038em;line-height:1.13}
.logo{font-family:Unbounded,Inter,sans-serif;font-weight:300;letter-spacing:.18em}
.small{font-size:13px;line-height:1.5}
.muted{color:var(--muted)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1.serif{font-size:26px;margin:0}
h2.serif{font-size:19px;margin:0}

.shell{max-width:var(--shell);margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + 58px + env(safe-area-inset-bottom))}
.pad{padding:0 16px}
.view{animation:up .3s cubic-bezier(.2,.75,.3,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.anim-up{animation:up .45s cubic-bezier(.2,.75,.3,1) forwards}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.24s}

.sky{position:fixed;inset:0;background:var(--grad-dark);z-index:0}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.night{position:relative;z-index:1;color:#fff;min-height:100vh;display:flex;flex-direction:column;
  max-width:var(--shell);margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom))}
.night .muted{color:rgba(255,255,255,.6)}
.night .field{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}
.night .field::placeholder{color:rgba(255,255,255,.4)}
.night .btn.ghost{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.16)}

.hero{background:var(--grad-dark);color:#fff;border-radius:0 0 var(--r-xl) var(--r-xl);
  padding:calc(14px + env(safe-area-inset-top)) 16px 20px;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.6)}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:relative;z-index:2}
.brandbar .b{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;opacity:.85}
.ava{border-radius:50%;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px;position:relative;z-index:2}
.stats div,.stats button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);
  padding:10px 6px;text-align:center;color:#fff}
.stats b{display:block;font-size:21px;font-weight:700;line-height:1.1;letter-spacing:-.035em;display:flex;align-items:center;justify-content:center;gap:4px}
.stats span{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;font-weight:700}
.levelbar{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:7px 12px;margin-top:8px;position:relative;z-index:2;width:100%;text-align:left;color:#fff}
.lchip{background:#fff;color:var(--ink);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700;flex:none}

.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1);margin-bottom:12px;border:1px solid var(--line)}
.card.p0{padding:0;overflow:hidden}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec-h h2{font-size:20px;margin:0}
.link{font-size:12px;font-weight:600;color:var(--accent)}

.btn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;padding:12px;border-radius:var(--r);
  font-weight:600;font-size:14px;transition:.16s}
.btn:hover{background:var(--ink-3)}
.btn.acc{background:var(--accent)}
.btn.acc:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.done{background:#EAF2ED;color:var(--ok)}
.btn.sm{padding:8px 14px;font-size:12.5px;width:auto;display:inline-block;border-radius:var(--r-sm)}
.btn.xs{padding:6px 11px;font-size:11.5px;width:auto;display:inline-block;border-radius:var(--r-xs)}
.btn[disabled]{opacity:.4;pointer-events:none}
.acts{display:flex;gap:8px;margin-top:10px}
.acts .btn{flex:1;width:auto}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.14s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.pale{background:var(--surface-2);border-color:transparent;color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;padding:8px 6px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--muted);line-height:1.2;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 5px;text-align:center}
.quick i{display:block;font-size:16px;font-style:normal;margin-bottom:4px}
.quick span{font-size:10px;font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px}
.hscroll > *{flex:none;width:180px}

.week{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.wd{flex:none;width:44px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 0;text-align:center;position:relative;transition:.16s}
.wd span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted)}
.wd b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.wd .pips{display:flex;gap:3px;justify-content:center;margin-top:4px}
.pip{width:4px;height:4px;border-radius:50%;background:var(--line-2)}
.pip.on{background:var(--ok)}
.wd.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.wd.sel span{color:rgba(255,255,255,.55)}
.wd.today{border-color:var(--accent)}
.wd.locked{opacity:.45}
.wstar{position:absolute;top:-4px;right:-2px;font-size:10px;color:var(--gold)}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:12px}
.lesson .cov{position:relative;height:156px;cursor:pointer}
.lesson .cov svg,.lesson .cov img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:rgba(17,16,20,.72);color:#fff;backdrop-filter:blur(8px);
  border-radius:999px;padding:4px 10px;font-size:10px;font-weight:600;z-index:3}
.cov .cap{position:absolute;left:12px;right:12px;bottom:10px;z-index:3;color:#fff}
.cov .cap b{font-size:16px;display:block;line-height:1.25;letter-spacing:-.02em}
.cov .cap span{font-size:11px;opacity:.8;font-weight:500}
.cov:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(17,16,20,.62),transparent 58%);z-index:1}
.play{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;
  background:rgba(17,16,20,.4);backdrop-filter:blur(4px);display:grid;place-items:center;
  z-index:3;color:rgba(255,255,255,.9);font-size:9px;border:1px solid rgba(255,255,255,.25)}
.lesson .body{padding:12px 14px 14px}

.crow{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px;margin-bottom:8px;width:100%;text-align:left;align-items:center}
.crow .mini{width:80px;height:56px;border-radius:var(--r-sm);overflow:hidden;flex:none;position:relative;background:var(--surface-2)}
.crow .mini svg,.crow .mini img{width:100%;height:100%;display:block;object-fit:cover}
.arow2{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:9px;margin-bottom:8px}
.arow2 .mini{width:70px;height:50px;border-radius:var(--r-xs);overflow:hidden;flex:none;background:var(--surface-2)}
.arow2 .mini svg,.arow2 .mini img{width:100%;height:100%;display:block;object-fit:cover}

.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.price{font-weight:700;font-size:15px;letter-spacing:-.02em}
.old{color:var(--muted);text-decoration:line-through;font-size:12px;font-weight:500;margin-left:5px}

.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prod .ph{height:132px;position:relative}
.prod .ph svg,.prod .ph img{width:100%;height:100%;display:block;object-fit:cover}
.prod .info{padding:10px 11px 11px}
.prod .nm{font-size:12.5px;font-weight:600;line-height:1.3;min-height:32px}
.flag{position:absolute;top:8px;left:8px;background:rgba(17,16,20,.72);color:#fff;border-radius:999px;
  padding:3px 9px;font-size:9.5px;font-weight:600;z-index:2}

.exp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center}
.pcirc{width:58px;height:58px;border-radius:50%;overflow:hidden;margin:0 auto;background:var(--surface-2)}
.pcirc svg,.pcirc img{width:100%;height:100%;display:block;object-fit:cover}
.vt{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--lilac);
  color:#fff;font-size:8.5px;vertical-align:middle}
.vt.big{width:18px;height:18px;font-size:10px}
.dot-ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11.5px;flex:none}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--shell);
  background:rgba(247,246,244,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:40}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:600;color:var(--muted);padding:3px 0}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.fab{position:fixed;right:calc(50% - var(--shell)/2 + 14px);bottom:calc(var(--nav-h) + 48px + env(safe-area-inset-bottom));
  width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:45;box-shadow:var(--sh-3)}
@media(max-width:462px){.fab{right:14px}}
.backbtn{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;margin:14px 0 2px}

.bg{position:fixed;inset:0;background:rgba(17,16,20,.55);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;animation:fade .18s both;backdrop-filter:blur(2px)}
.sheet{background:var(--paper);width:100%;max-width:var(--shell);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  animation:slide .28s cubic-bezier(.2,.75,.3,1) both}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.grab{width:34px;height:4px;background:var(--line-2);border-radius:99px;margin:0 auto 12px}

.field{width:100%;padding:12px 13px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);margin-bottom:9px}
.field:focus{outline:none;border-color:var(--ink)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 6px;display:block}
.sw{width:42px;height:25px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:.18s}
.sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.18s;box-shadow:var(--sh-1)}
.sw.on{background:var(--ink)}
.sw.on i{left:20px}
.optl{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin-bottom:8px;font-size:14px;font-weight:500}
.optl:hover{border-color:var(--ink)}
.opt{width:100%;text-align:left;display:flex;gap:11px;align-items:center;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:13px;margin-bottom:8px;color:#fff;transition:.14s}
.opt.on{background:rgba(255,255,255,.14);border-color:#fff}
.opt i{font-size:17px;font-style:normal;flex:none;opacity:.9}
.opt b{font-size:14px;font-weight:600;display:block}
.opt small{opacity:.6;font-size:11.5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 74px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:600;z-index:90;animation:slide .22s both;box-shadow:var(--sh-3)}
.empty{text-align:center;padding:38px 18px;color:var(--muted);font-size:13.5px}
.qm{width:17px;height:17px;border-radius:50%;background:var(--surface-2);color:var(--muted);
  font-size:10px;font-weight:700;flex:none;display:inline-grid;place-items:center;line-height:1;border:1px solid var(--line)}
.hero .qm{background:rgba(255,255,255,.14);color:#fff;border-color:transparent}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) var(--r) 5px;
  padding:11px 13px;font-size:13.5px;line-height:1.5;margin-bottom:8px}
.bubble.me{border-radius:var(--r) var(--r) 5px var(--r);background:var(--ink);color:#fff;margin-left:36px;border-color:var(--ink)}
.rep{display:flex;align-items:flex-end;gap:5px;height:96px;margin:12px 0 6px}
.rep div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.rep i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--ink);min-height:3px;transition:height .5s}
.rep span{font-size:9px;font-weight:600;color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:center}
.wish{position:relative;z-index:2;margin-top:12px;font-size:14.5px;line-height:1.42;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:11px 13px}
.daystrip{position:relative;z-index:2;display:flex;gap:9px;align-items:center;width:100%;margin-top:8px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:999px;
  padding:7px 13px;color:#fff;font-size:11px;font-weight:600;overflow-x:auto;white-space:nowrap}
.advice .arow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.advice .arow:first-of-type{border-top:none;padding-top:2px}
.ae{font-size:18px;flex:none;width:24px;text-align:center}
.cday{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;position:relative}
.cday.now{border:1.5px solid var(--accent)}
.cday i{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%}
i.lg{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px}
.phbox{background:var(--surface-2);border-radius:var(--r-sm);padding:9px;text-align:center}
.phbox.on{background:var(--ink);color:#fff}
.camera{position:absolute;right:0;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--ink);
  color:#fff;box-shadow:var(--sh-2);font-size:13px}
.linkbox{background:var(--surface-2);border-radius:var(--r-sm);padding:9px 11px;font-size:12px;font-weight:600;word-break:break-all}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.badge-exp{background:var(--lilac);color:#fff;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:700}
.card.unread{border-left:3px solid var(--accent)}

.atabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;position:relative;z-index:2;padding-bottom:2px}
.atabs button{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:7px 12px;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;position:relative}
.atabs button.on{background:#fff;color:var(--ink);border-color:#fff}
.atabs .cnt{background:var(--accent);color:#fff;border-radius:99px;padding:1px 5px;font-size:9px;margin-left:4px}
.mini-sel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;
  border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:600;max-width:150px}
.mini-sel option{color:var(--ink)}
.rolesw{position:fixed;left:50%;transform:translateX(-50%);z-index:80;display:flex;gap:2px;
  bottom:calc(var(--nav-h) + 4px + env(safe-area-inset-bottom));
  background:rgba(17,16,20,.9);backdrop-filter:blur(10px);border-radius:999px;padding:3px}
.rolesw button{padding:5px 10px;border-radius:999px;font-size:10px;font-weight:600;color:rgba(255,255,255,.55)}
.rolesw button.on{background:rgba(255,255,255,.16);color:#fff}

.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}

                     <path d="M${n%40+10} ${n%30+20} L${n%30+45} ${n%20+45} L${n%25+70} ${n%25+25}" /></g>`,

/* =====================================================================
   ХРАНИЛИЩЕ И АККАУНТЫ
   Работает поверх localStorage там, где он доступен (GitHub Pages,
   свой домен). В песочницах без доступа автоматически падает в память,
   поэтому приложение нигде не ломается.
   ===================================================================== */
const Store = (() => {
  let ok = false, mem = {};
  try {
    const k = '__eva_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    ok = true;
  } catch(e){ ok = false; }
  return {
    available: ok,
    get(key, def){
      try {
        const raw = ok ? window.localStorage.getItem(key) : mem[key];
        return raw ? JSON.parse(raw) : def;
      } catch(e){ return def; }
    },
    set(key, val){
      const raw = JSON.stringify(val);
      try { ok ? window.localStorage.setItem(key, raw) : (mem[key] = raw); } catch(e){ mem[key] = raw; }
    },
    del(key){
      try { ok ? window.localStorage.removeItem(key) : delete mem[key]; } catch(e){}
    }
  };
})();

const DB = {
  users(){ return Store.get('eva_users', {}); },
  saveUsers(u){ Store.set('eva_users', u); },
  find(email){ return this.users()[String(email).toLowerCase().trim()] || null; },
  upsert(u){
    const all = this.users();
    all[u.email.toLowerCase()] = u;
    this.saveUsers(all);
    if(typeof syncUser === 'function') syncUser(u);
  },
  session(){ return Store.get('eva_session', null); },
  setSession(s){ Store.set('eva_session', s); },
  clearSession(){ Store.del('eva_session'); },
  progress(email){ return Store.get('eva_progress_' + email.toLowerCase(), null); },
  saveProgress(email, data){ Store.set('eva_progress_' + email.toLowerCase(), data); }
};

/* примитивный хеш пароля — не криптография, а защита от чтения глазами.
   На бою пароль хешируется на сервере (bcrypt/argon2), см. README. */
function hashPass(p){
  let h = 5381;
  for(let i = 0; i < p.length; i++) h = ((h << 5) + h + p.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(36) + p.length;
}

  const d = DB.progress(email);
  if(!d) return false;
  Object.keys(d).forEach(k => {
    if(k === 'events') S.myEvents = d[k] || [];
    else if(d[k] !== undefined && d[k] !== null) S[k] = d[k];
  });
  return true;
}

function moonAge(d = new Date()){
  const lp = 29.530588853;
  const known = Date.UTC(2000,0,6,18,14);
  return (((d.getTime() - known) / 86400000) % lp + lp) % lp;
}
function moon(d = new Date()){
  const a = moonAge(d);
  const i = Math.floor((a / 29.530588853) * 8 + 0.5) % 8;
  return {...MOONS[i], age:Math.round(a), pct:Math.round((1 - Math.abs(a/29.530588853*2 - 1)) * 100)};
}

function cycleNow(){
  const c = S.cycle;
  if(!c || !c.last) return null;
  const start = new Date(c.last), today = new Date();
  start.setHours(0,0,0,0); today.setHours(0,0,0,0);
  let day = Math.floor((today - start)/86400000) % c.len;
  if(day < 0) day += c.len;
  const p = day < c.period ? PHASES[0]
          : day < Math.round(c.len/2) - 2 ? PHASES[1]
          : day <= Math.round(c.len/2) + 1 ? PHASES[2] : PHASES[3];
  const next = c.len - day;
  return {day:day+1, phase:p, next, len:c.len};
}

function matchOf(item){
  if(!S.tags.length) return 60 + (hash(item.id) % 25);
  const hits = item.tags.filter(t => S.tags.includes(t)).length;
  const base = Math.round(hits / Math.max(1, Math.min(S.tags.length, 3)) * 62) + 30;
  return Math.max(52, Math.min(96, base + (hash(item.id) % 7)));
}

/* подходит ли материал пользовательнице по этапу жизни и уровню */
function fitsAudience(item){
  const mine = myAudience();
  const aud = item.aud || [];
  const cy = typeof cycleNow === 'function' ? cycleNow() : null;
  const inPeriod = cy && cy.phase.k === 'menstrual';

  // активные практики не предлагаем в дни менструации
  if(inPeriod && aud.includes('active')) return false;

  // материал без разметки подходит всем
  if(!aud.length) return true;

  // строгие группы: если материал помечен ими, он только для них
  const strict = ['pregnant','newborn','toddler'];
  const strictTags = aud.filter(k => strict.includes(k));
  if(strictTags.length && !strictTags.some(k => mine.includes(k))) return false;

  // беременным не показываем материалы, помеченные как активные
  if(mine.includes('pregnant') && aud.includes('active')) return false;

  const soft = aud.filter(k => !strict.includes(k) && k !== 'active' && k !== 'period');
  if(soft.length && !soft.some(k => mine.includes(k))) return false;
  return true;
}

/* уровень подготовки: новичку не даём продвинутое */
function fitsLevel(item){
  const lvl = item.level || 'any';

  const mine = S.tags.includes('опыт') ? 'pro' : S.tags.includes('новичок') ? 'new' : 'middle';
  if(mine === 'new') return false;

function fitsTime(item){
  if(S.time >= 35) return true;
  if(S.time >= 20) return item.min <= 34;
  return item.type === 'class' ? item.min <= 28 : item.min <= 12;
}

function buildProgram(){
  const shift = (S.seed || 0) + (S.week || 0);
  const rank = a => matchOf(a);

  /* отбор: время, этап жизни, уровень. Если после фильтров пусто — ослабляем условия */
  const byType = t => {
    const all = LIB.filter(x => x.type === t && x.status === 'live');
    let list = all.filter(x => fitsTime(x) && fitsAudience(x) && fitsLevel(x));
    if(list.length < 3) list = all.filter(x => fitsAudience(x));
    if(list.length < 3) list = all;
    return list.sort((a,b) => rank(b) - rank(a));
  };
  const af = byType('affirm'), pr = byType('practice'), mk = byType('class');
  const slot = S.slot;

  /* материалы, привязанные к конкретному дню недели */
  const fitsDay = (item, i) => !item.days || !item.days.length || item.days.includes(DAY_KEYS[i]);
  const pickForDay = (list, i, fallbackPick) => {
    const fixed = list.filter(x => x.days && x.days.length && x.days.includes(DAY_KEYS[i]));
    if(fixed.length) return fixed[(i + shift) % fixed.length];
    const free = list.filter(x => !x.days || !x.days.length);
    return fallbackPick(free.length ? free : list, i);
  };

  /* мастер-классы стараемся не повторять: помним показанные */
  S.seenClasses = S.seenClasses || [];
  let freshMk = mk.filter(x => !S.seenClasses.includes(x.id));
  if(freshMk.length < 7){
    // всё показали — добавляем открытые уроки курсов, потом разрешаем повторы
    const lessons = openCourseLessons().filter(x => !S.seenClasses.includes(x.id));
    freshMk = freshMk.concat(lessons);
    if(freshMk.length < 7){ S.seenClasses = []; freshMk = mk.slice(); }
  }

  /* практики и аффирмации чередуем со сдвигом недели — повторы допустимы, но не подряд */
  const pickRotating = (list, i) => list[(i * 2 + shift * 3 + i) % list.length];

  S.program = DAYS.map((d,i) => ({
    d, tasks:[
      task(pickForDay(af, i, pickRotating), 'утро'),
      task(pickForDay(pr, i, pickRotating), slot),
      task(freshMk.filter(x => fitsDay(x, i))[i % Math.max(1, freshMk.filter(x => fitsDay(x, i)).length)]
           || freshMk[i % freshMk.length], 'вечер')
    ]
  }));
  S.program.forEach(day => {
    const c = day.tasks[2];
    if(c && !S.seenClasses.includes(c.id)) S.seenClasses.push(c.id);
  });
  S.stars = starsWeek();

  const all = S.program.flatMap(x => x.tasks);
  S.match = Math.round(all.reduce((a,t) => a + t.match, 0) / all.length);
  S.day = todayIdx();
}

function task(item, slot){
  return {...item, slot, pts:TYPE[item.type].pts, match:matchOf(item), done:false};
}

const todayIdx = () => (new Date().getDay() + 6) % 7;
const weekNo = () => Math.floor((Date.now() - new Date(new Date().getFullYear(),0,1)) / 6048e5);

/* при смене недели программа пересобирается на свежих материалах */
function checkWeek(){
  S.day = todayIdx();
  bumpVisit();
  const w = weekNo();
  if(S.week === undefined){ S.week = w; return; }
  if(S.week !== w){
    S.week = w; S.weekly.exchanged = false;
    buildProgram();
    toast('Новая неделя - Ева собрала свежую программу');
  }
}
function nextWeek(){
  S.week = weekNo() - 1;
  S.seed = (S.seed || 0) + 1;
  checkWeek(); render();
}
const doneOf = i => S.program[i] ? S.program[i].tasks.filter(t => t.done).length : 0;
const starsTotal = () => S.program.length * 3;

/* звёзды текущей недели считаем из самой программы, чтобы счётчик
   не мог перерасти максимум после пересборки. Накопленное за всё
   время живёт отдельно в S.starsAll */
function starsWeek(){
  return (S.program || []).reduce((a, d) => a + d.tasks.filter(t => t.done).length, 0);
}

function complete(di, ti){
  const t = S.program[di].tasks[ti];
  if(t.done) return;
  t.done = true;
  S.points += t.pts;
  S.starsAll = (S.starsAll || 0) + 1;
  S.stars = starsWeek();
  toast(`+${t.pts} баллов`);
  if(doneOf(di) === 3) setTimeout(() => toast('День закрыт полностью'), 1000);
  render(); schedulePersist();
}

function levelNow(){
  let cur = LEVELS[0], next = LEVELS[1];
  LEVELS.forEach((l,i) => { if(S.points >= l.from){ cur = l; next = LEVELS[i+1] || null; } });
  return {cur, next};
}

function streak(){
  let n = 0;
  for(let i = todayIdx(); i >= 0; i--){ if(doneOf(i) === 3) n++; else break; }
  return n;
}

function speak(text){
  if(!S.voice || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = String(text).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/\s+/g,' ');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'ru-RU'; u.rate = .98; u.pitch = 1.08;
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
  const f = vs.find(v => /Milena|Alyona|Katya|Female|Google/i.test(v.name)) || vs[0];
  if(f) u.voice = f;
  speechSynthesis.speak(u);
}

/* ---------- действия онбординга ---------- */
function startQuiz(){
  if(!S.name.trim()) S.name = 'Ева';
  S.screen = 'quiz'; S.qi = 0; S.picked = []; S.tags = [];
  render(); stars();
}
function pick(i){
  const q = quizFlow()[S.qi]; let sel = S.picked[S.qi] || [];
  if(sel.includes(i)) sel = sel.filter(x => x !== i);
  else if(q.max === 1) sel = [i];
  else if(sel.length < q.max) sel = [...sel, i];
  else sel = [sel[1], i];
  S.picked[S.qi] = sel; render(); stars();
}
function prevQ(){
  if(S.qi === 0){ S.screen = 'welcome'; render(); return; }
  S.qi--; render(); stars();
}
function nextQ(){
  const flow = quizFlow();
  const q = flow[S.qi];
  S.answers = S.answers || {};
  (S.picked[S.qi] || []).forEach(i => {
    const o = q.o[i];
    (o.tags || []).forEach(t => { if(!S.tags.includes(t)) S.tags.push(t); });
    if(o.time) S.time = o.time;
    if(o.slot) S.slot = o.slot;
    if(o.extra) Object.assign(S.extra, o.extra);
    S.answers[q.id] = {t:o.t, next:o.next || null};
  });
  if(S.qi < quizFlow().length - 1){ S.qi++; render(); stars(); return; }
  if(!S.user){ S.screen = 'mail'; render(); stars(); return; }
  S.screen = 'building'; render(); stars();
  const steps = ['Читаю твои ответы','Сравниваю с '+LIB.length+' уроками библиотеки','Раскладываю на семь дней','Проверяю, что влезает в '+S.time+' минут'];
  persist();
  let k = 0;
  const iv = setInterval(() => {
    k++;
    const t = document.getElementById('bs'), p = document.getElementById('bp');
    if(t && steps[k]) t.textContent = steps[k];
    if(p) p.style.width = (8 + k*24) + '%';
    if(k >= 4){ clearInterval(iv); buildProgram(); S.screen = 'ready'; render(); stars(); }
  }, 780);
}

/* =====================================================================
   ТОЧЕЧНЫЕ ОБНОВЛЕНИЯ БЕЗ ПЕРЕРИСОВКИ
   Клик по тегу или цене не должен перестраивать экран и сбрасывать скролл.
   ===================================================================== */
function pathGet(obj, path){
  return path.split('.').reduce((o,k) => (o == null ? o : o[k]), obj);
}
function pathSet(obj, path, val){
  const ks = path.split('.'), last = ks.pop();
  const t = ks.reduce((o,k) => (o[k] = o[k] || {}), obj);
  t[last] = val;
}

/* переключает тег в массиве по пути в S и подсвечивает кнопку на месте */
function chipToggle(btn, path, value, counterSel){
  const arr = pathGet(S, path) || [];
  const on = arr.includes(value);
  const next = on ? arr.filter(x => x !== value) : [...arr, value];
  pathSet(S, path, next);
  btn.classList.toggle('on', !on);
  const mark = btn.querySelector('.x');
  if(mark) mark.textContent = on ? '' : ' ✕';
  if(counterSel){
    const c = document.querySelector(counterSel);
    if(c) c.textContent = next.length ? '(' + next.length + ')' : '';
  }
  schedulePersist();
}

/* выбор одного значения в группе кнопок */
function chipPick(btn, path, value){
  pathSet(S, path, value);
  const wrap = btn.parentElement;
  [...wrap.children].forEach(b => b.classList.toggle('on', b === btn));
  schedulePersist();
}

/* изменение числа с обновлением одного узла */
function stepValue(path, dir, outSel, fmt){
  const cur = pathGet(S, path) || 0;
  const idx = Math.round((cur - 490) / 500);
  const next = Math.max(0, idx + dir);
  const val = next === 0 ? 0 : 490 + next * 500;
  pathSet(S, path, val);
  const out = document.querySelector(outSel);
  if(out) out.textContent = val === 0 ? 'Бесплатно' : money(val);
  const manual = document.querySelector(outSel + '-input');
  if(manual) manual.value = val || '';
}

function stars(){
  const c = document.getElementById('sky');
  if(!c) return;
  const x = c.getContext('2d'), w = c.width = c.offsetWidth, h = c.height = c.offsetHeight;
  const pts = [...Array(70)].map(() => ({x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.2+.3, a:Math.random(), s:Math.random()*.01+.004}));
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function loop(){

    x.clearRect(0,0,w,h);

      x.fillStyle = `rgba(255,255,255,${o})`; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); });
    requestAnimationFrame(loop);
  })();
}

/* =====================================================================
   МЕДИА: загрузка фото со сжатием
   ===================================================================== */
const MEDIA = {};   // id -> dataURL (jpeg)

function cover(id, kind){
  if(MEDIA[id]){
    const pos = (typeof POS !== 'undefined' && POS[id]) || '50% 50%';
    return `<img src="${MEDIA[id]}" alt="" style="object-position:${pos}">`;
  }
  return coverGen(id, kind);
}

/* Сжатие: длинная сторона до 1400px, JPEG 0.86 — вес падает в разы,
   картинка остаётся резкой на ретине. PNG с прозрачностью не теряется. */
function compressImage(file, cb, maxSide, quality){
  maxSide = maxSide || 1400; quality = quality || 0.86;
  const okType = /^image\//.test(file.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || '');
  if(!okType) return toast('Это не изображение');
  if(file.size > 25 * 1024 * 1024) return toast('Файл больше 25 МБ, выбери снимок поменьше');
  toast('Обрабатываю фото…');
  const fr = new FileReader();
  fr.onload = e => {
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      const k = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, 0, 0, w, h);
      const isPng = /png|webp/.test(file.type) && hasAlpha(x, w, h);
      const out = isPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', quality);
      cb(out, {w, h, before:file.size, after:Math.round(out.length*0.75)});
    };
    img.onerror = () => {
      // HEIC с айфона браузер иногда не открывает как картинку
      toast(/heic|heif/i.test(file.type + file.name)
        ? 'Формат HEIC не читается браузером. В настройках айфона: Камера → Форматы → «Наиболее совместимый»'
        : 'Не удалось прочитать файл');
    };
    img.src = e.target.result;
  };
  fr.onerror = () => toast('Не удалось открыть файл');
  fr.readAsDataURL(file);
}
function hasAlpha(ctx, w, h){
  try{
    const d = ctx.getImageData(0,0,Math.min(w,60),Math.min(h,60)).data;
    for(let i = 3; i < d.length; i += 4) if(d[i] < 250) return true;
  }catch(e){}
  return false;
}
const kb = n => n > 1e6 ? (n/1048576).toFixed(1)+' МБ' : Math.round(n/1024)+' КБ';

function pickImage(key, after){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.cssText = 'position:fixed;left:-9999px;opacity:0';
  document.body.appendChild(inp);
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    setTimeout(() => { try{ inp.remove(); }catch(e){} }, 500);
    if(!f) return;
    compressImage(f, async (data, info) => {
      MEDIA[key] = data;
      toast(`Фото загружено · ${kb(info.before)} → ${kb(info.after)}`);
      if(after) after(data, info); else render();
      if(typeof uploadImage === 'function'){
        const url = await uploadImage(key, data);
        if(url && url !== data){ MEDIA[key] = url; render(); }
        if(typeof syncPush === 'function') syncPush();
      }
    });
  };
  inp.click();
}

/* ---------- встраивание видео ---------- */
function videoUrl(id){
  const x = (typeof itemById === 'function') ? itemById(id) : null;
  if(x && x.video) return x.video;
  if(S.videos && S.videos[id]) return S.videos[id];
  if(S.editCourse || true){
    for(const cid in (S.lessons||{})){
      const l = (S.lessons[cid]||[]).find(u => u.id === id);
      if(l && l.video) return l.video;
    }
  }
  return '';
}
function embedSrc(url){
  if(!url) return null;
  let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if(m) return {type:'iframe', src:'https://www.youtube.com/embed/' + m[1]};
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return {type:'iframe', src:'https://player.vimeo.com/video/' + m[1]};
  m = url.match(/kinescope\.io\/(?:embed\/)?([\w-]+)/);
  if(m) return {type:'iframe', src:'https://kinescope.io/embed/' + m[1]};
  if(/\.(mp4|webm|mov)(\?|$)/i.test(url)) return {type:'video', src:url};
  return {type:'link', src:url};
}
function videoBlock(id, posterKind){
  const url = videoUrl(id), e = embedSrc(url);
  if(e && e.type === 'iframe')
    return `<iframe class="frame" src="${e.src}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
  if(e && e.type === 'video')
    return `<video class="frame" src="${e.src}" controls playsinline poster="${MEDIA[id]||''}"></video>`;
  if(e && e.type === 'link')

function lessonsOf(cid){
  if(!S.lessons[cid]) S.lessons[cid] = (LESSON_SETS[cid]||[]).map(([t,d,m],i) =>
    ({id:cid+'_'+(i+1), n:i+1, t, d, min:m, done:false, video:'', free:i===0||i===3}));
  return S.lessons[cid];
}

function doneUnit(cid, i){
  const ls = lessonsOf(cid);
  if(ls[i].done) return;
  ls[i].done = true; S.points += 20;
  const all = ls.every(x => x.done);
  render();
  toast(all ? 'Курс пройден полностью. +150 баллов' : '+20 баллов');
  if(all) S.points += 130;
}

function openCourseLessons(){
  const out = [];
  COURSES.filter(c => !c.draft).forEach(c => {
    (lessonsOf(c.id) || []).filter(l => l.free).forEach(l => {
      out.push({
        id:'cl_' + l.id, type:'class', title:l.t, text:(l.d || 'Открытый урок курса «' + c.t + '»'),
        expert:c.e, min:l.min || 15, tags:(COURSE_TAGS[c.id] || []), status:'live', free:true,
        video:l.video || '', fromCourse:c.id, aud:[], level:'any'
      });
    });
  });
  return out;
}

function goEvent(id){
  const e = EVENTS.find(x => x.id === id);
  if(!e) return;
  if(S.myEvents.includes(id)){
    S.myEvents = S.myEvents.filter(x => x !== id);
    e.left = Math.min(e.seats, e.left + 1);
    S.points = Math.max(0, S.points - 10);
    render(); schedulePersist(); syncPush(['events']);
    return toast('Запись отменена, место освободилось');
  }
  if(e.left <= 0) return toast('Мест не осталось');
  S.myEvents.push(id);
  e.left = Math.max(0, e.left - 1);
  S.points += 10;
  render(); schedulePersist(); syncPush(['events']);
  toast(e.price
    ? `Билет забронирован. Осталось ${plural(e.left,'место','места','мест')}`
    : `Записала. Осталось ${plural(e.left,'место','места','мест')}`);
}

function publishProfile(){
  S.datingProfile.published = true;

}
function datingBlock(){
  const p = S.datingProfile;
  if(!p.published) return myProfileCard();
  const fmt = S.datingFmt || 'кофе';
  const pool = matchPool(fmt);
  const idx = Math.min(S.matchIdx || 0, Math.max(0, pool.length-1));
  const m = pool[idx];
  return `
  <div class="card" style="padding:14px">
    <div class="spread" style="margin-bottom:10px">
      <b style="font-size:16px">Новые знакомства</b>
      <button class="chip" onclick="openSheet('dating')">Анкета</button>
    </div>
    <div class="seg" style="margin-bottom:12px">
      <button class="${fmt==='кофе'?'on':''}" onclick="setFmt('кофе')">Кофе в моём городе</button>
      <button class="${fmt==='онлайн'?'on':''}" onclick="setFmt('онлайн')">Знакомство онлайн</button>
    </div>

    ${m ? `<div class="mcard">
      <div class="mphoto">${MEDIA[m.id] ? `<img src="${MEDIA[m.id]}" alt="">` : portrait(m.id)}
        <div class="mname">
          <b>${m.n}, ${m.age}</b>
          <span>${fmt === 'кофе' ? m.city : m.city === 'Онлайн' ? 'онлайн' : m.city + ' · онлайн'}</span>
        </div>
      </div>
      <div style="padding:14px">
        <p style="margin:0 0 10px;font-size:14px;line-height:1.5">${m.bio}</p>
        <div class="eyebrow" style="margin-bottom:6px">Интересы</div>
        <div class="chips wrap" style="padding:0">${m.ints.map(t =>
          `<span class="chip ${(p.ints||[]).includes(t)?'on':'pale'}" style="padding:4px 10px">${t}</span>`).join('')}</div>
        ${common(m).length ? `<div class="small" style="color:var(--ok);margin-top:8px;font-weight:600">
          Совпадение: ${common(m).join(', ')}</div>` : ''}
        <div class="acts">
          <button class="btn" onclick="inviteMatch('${m.id}')">Позвать ${fmt === 'кофе' ? 'на кофе' : 'познакомиться'}</button>
          <button class="btn ghost" onclick="nextMatch()">Следующая</button>
        </div>
      </div>
    </div>
    <div class="small muted" style="text-align:center;margin-top:8px">${idx+1} из ${pool.length}</div>`
    : `<div class="empty">В этом формате пока никого нет. Попробуй другой формат или добавь интересы в анкету.</div>`}
  </div>`;
}
function common(m){
  const mine = (S.datingProfile && S.datingProfile.ints) || [];
  return m.ints.filter(t => mine.includes(t));
}
function matchPool(fmt){
  let pool = MEMBERS.filter(m => fmt === 'онлайн' || m.city !== 'Онлайн');
  if(fmt === 'кофе' && S.datingProfile && S.datingProfile.city){
    const same = pool.filter(m => m.city === S.datingProfile.city);
    if(same.length) pool = same;
  }
  return pool.slice().sort((a,b) => {
    const photo = (MEDIA[b.id] ? 1 : 0) - (MEDIA[a.id] ? 1 : 0);
    if(photo) return photo;
    return common(b).length - common(a).length;
  });
}
function setFmt(f){ S.datingFmt = f; S.matchIdx = 0; render(); }
function nextMatch(){
  const pool = matchPool(S.datingFmt || 'кофе');
  S.matchIdx = ((S.matchIdx || 0) + 1) % Math.max(1, pool.length);
  render();
}
function inviteMatch(id){
  const m = MEMBERS.find(x => x.id === id);
  const fmt = S.datingFmt || 'кофе';
  sendInvite(m, fmt);
  S.points += 5;
  nextMatch();
}

/* создаёт переписку у себя и «входящее» приглашение для демонстрации ответа */
function sendInvite(m, fmt){
  initInbox();
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const text = fmt === 'кофе'
    ? `Привет! Увидела твою анкету, у нас общие интересы. Давай выпьем кофе в ${(S.datingProfile&&S.datingProfile.city)||'городе'}?`
    : 'Привет! Увидела твою анкету, у нас общие интересы. Давай познакомимся онлайн?';
  let t = S.inbox.find(x => x.who === m.id);
  if(!t){
    t = {id:'inv'+Date.now().toString(36), from:m.n, who:m.id, c:'#6C5CE0', kind:'знакомство',
         ago:'только что', unread:false, msgs:[]};
    S.inbox.unshift(t);
  }
  t.msgs.push({me:true, t:text, tm});
  S.thread = t.id; S.page = 'inbox'; S.clubTab = 'people';
  render(); schedulePersist();
  toast('Приглашение отправлено ' + m.n);
  setTimeout(() => {
    t.msgs.push({me:false, t:'Привет! С удовольствием. Когда тебе удобно?', tm, invite:true});
    if(S.thread === t.id) render(); else { t.unread = true; render(); }
  }, 2200);
}

/* входящее приглашение с кнопками */
function seedIncomingInvite(){
  initInbox();
  if(S.inbox.some(t => t.pending)) return;
  const now = new Date();
  S.inbox.unshift({id:'in'+Date.now().toString(36), from:'Даша', c:'#3F7D62', kind:'приглашение',
    ago:'5 мин назад', unread:true, pending:true,
    msgs:[{me:false, t:'Привет! Я в субботу иду в горы, есть место в машине. Маршрут лёгкий. Пойдёшь?',
      tm:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')}]});
}
function answerInvite(id, yes){
  const t = S.inbox.find(x => x.id === id);
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  t.pending = false;
  t.msgs.push({me:true, t: yes ? 'Да, с удовольствием! Давай договоримся о времени.' : 'Спасибо за приглашение, но в этот раз не смогу.', tm});
  if(yes) S.points += 10;
  render(); schedulePersist();
  toast(yes ? 'Приглашение принято. +10 баллов' : 'Приглашение отклонено');
  if(yes) setTimeout(() => {
    t.msgs.push({me:false, t:'Отлично! Выезжаем в 8 утра от метро, скину точку.', tm});
    if(S.thread === t.id) render();
  }, 1600);
}

function addComment(id){
  const inp = document.getElementById('cm_' + id);

/* забираем ответы админа на вопросы о товарах, адресованные этой почте */
function pullMarketReplies(){
  if(!S.user || !S.marketReplies || !S.marketReplies.length) return;
  const mine = String(S.user.email).toLowerCase();
  S.seenReplies = S.seenReplies || [];
  const fresh = S.marketReplies.filter(r =>
    String(r.mail).toLowerCase() === mine && !S.seenReplies.includes(r.qid + '_' + r.at));
  if(!fresh.length) return;
  let th = S.inbox.find(x => x.kind === 'маркет');
  if(!th){
    th = {id:'mk'+Date.now().toString(36), from:'Eva Space · Маркет', c:'#111014',
          kind:'маркет', ago:'только что', unread:false, sys:true, msgs:[]};
    S.inbox.unshift(th);
  }
  fresh.forEach(r => {
    th.msgs.push({me:false, t:r.t, tm:r.tm});
    S.seenReplies.push(r.qid + '_' + r.at);
  });
  th.unread = true;
}

function allTags(){
  const c = {};
  LIB.forEach(x => x.tags.forEach(t => c[t] = (c[t]||0)+1));
  return Object.entries(c).sort((a,b) => b[1]-a[1]);
}

function pgContent(){
  const types = {'Всё':null, 'Аффирмации':'affirm', 'Практики':'practice', 'Мастер-классы':'class'};
  let items = LIB.filter(x => x.status === 'live');
  if(types[S.filter]) items = items.filter(x => x.type === types[S.filter]);
  if(S.tagFilter) items = items.filter(x => x.tags.includes(S.tagFilter));
  if(S.onlyLiked) items = items.filter(x => isLiked(x.id));
  if(S.q.trim()){
    const q = S.q.toLowerCase();
    items = items.filter(x => (x.title+' '+x.text+' '+x.expert+' '+x.tags.join(' ')).toLowerCase().includes(q));
  }
  items = items.map(x => ({...x, m:matchOf(x)})).sort((a,b) => b.m - a.m);

  return `<div class="view pad" style="padding-top:calc(20px + env(safe-area-inset-top))">

    <div style="position:relative;margin-bottom:12px">
      <input class="field" style="margin:0;padding-left:40px" placeholder="Поиск: тревога, йога, сон"
        value="${esc(S.q)}" oninput="S.q=this.value;renderList()">
      <span style="position:absolute;left:15px;top:13px;opacity:.4">🔍</span>
    </div>

    <div class="seg">${Object.keys(types).map(k =>
      `<button class="${S.filter===k?'on':''}" onclick="S.filter='${k}';render()">${k}</button>`).join('')}</div>
    ${(S.likes||[]).length ? `<div class="chips">
      <button class="chip ${S.onlyLiked?'on':''}" onclick="S.onlyLiked=!S.onlyLiked;render()">
        ${starMark(12, S.onlyLiked?'#fff':'#E7A339')} избранное ${(S.likes||[]).length}</button></div>` : ''}

    <div class="chips">
      ${S.tagFilter ? `<button class="chip on" onclick="S.tagFilter=null;render()">${S.tagFilter} ✕</button>` : ''}

    <div class="small muted" style="margin:4px 0 12px">Найдено ${plural(items.length,'урок','урока','уроков')} · отсортировано по совпадению с тобой</div>
    <div id="list">${items.length ? items.map(x => contentRow(x)).join('') :
      `<div class="empty">Ничего не нашлось.<br>Попробуй другое слово или сними фильтр.</div>`}</div>

}

function renderList(){ render(); const i = $('#list'); if(i) window.scrollTo(0, window.scrollY); }

function starContent(btn, id){
  S.likes = S.likes || [];
  const on = S.likes.includes(id);
  S.likes = on ? S.likes.filter(v => v !== id) : [...S.likes, id];
  btn.classList.toggle('on', !on);
  btn.innerHTML = starMark(15, !on ? '#E7A339' : 'rgba(17,16,20,.22)');
  schedulePersist();
  if(!on) toast('Добавлено в избранное');
}

/* ---------- дата дня программы ---------- */
function dateOfDay(i){
  const d = new Date();
  d.setDate(d.getDate() - todayIdx() + i);
  return d;
}

/* ---------- рекомендация дня ---------- */
function dayAdvice(){

  if(S.visits.day !== today){ S.visits = {day:today, n:1}; }
  else S.visits.n++;

}
function schedulePersit_safe(){ try{ schedulePersist(); }catch(e){} }

function greetingLine(){
  const v = (S.visits && S.visits.n) || 1;
  const h = new Date().getHours();
  const day = S.program[S.day] || {tasks:[]};
  const left = day.tasks.filter(t => !t.done).length;
  const total = day.tasks.length;
  const done = total - left;
  const cy = cycleNow();
  const name = S.name || 'Ева';
  const wd = new Date().toLocaleDateString('ru-RU',{weekday:'long'});
  const Wd = wd[0].toUpperCase() + wd.slice(1);
  const nextCourse = COURSES.filter(c => !c.draft && !S.courses.includes(c.id))[0];

  if(total && done === total){
    const praise = [
      `Ты закрыла все три задания. Это целый день, который ты провела на своей стороне - и таких звёзд у тебя уже ${S.starsAll || S.stars}.`,
      `Три из трёх. Ты не просто выполнила программу, ты выбрала себя сегодня. Отдыхай спокойно.`,
      `День закрыт полностью. Знаешь, что самое ценное? Не сами практики, а то, что ты возвращаешься к ним снова.`
    ][v % 3];
    return nextCourse
      ? `${praise} Если захочется глубже - посмотри курс «${nextCourse.t}», первые уроки открыты бесплатно.`
      : praise;
  }
  if(done && left === 1)
    return `Осталось одно задание - ${day.tasks.find(t => !t.done).title.toLowerCase()}. Ты уже почти собрала полный день.`;
  if(S.gentle)
    return `Сегодня мягкий режим: аффирмация и мастер-класс, практику отложили. Так тоже считается.`;
  if(cy && cy.phase.k === 'menstrual' && v <= 2)
    return `${Wd}, день ${cy.day} цикла. Сил сейчас меньше - это физиология, а не лень. Возьми самое короткое задание и не требуй большего.`;
  if(cy && cy.phase.k === 'ovulation' && v <= 2)
    return `${Wd}, овуляторная фаза - пик энергии за весь цикл. Если откладывала сложный разговор или дело, сегодня лучший день.`;

  const morning = [
    `Доброе утро, ${name}. Рада тебя видеть. Начни с аффирмации - это одна минута, а тон дня она задаёт на весь день.`,
    `Ты прекрасна сегодня. Скажи это себе вслух перед зеркалом и посмотри, как изменится лицо. Потом можно и к практике.`,
    `Аффирмация дня: скажи вслух «вселенная, что за сюрприз ты мне сегодня приготовила?» - и весь день посматривай, что она ответит.`,
    `${Wd} только начинается, и он ещё ничей. Сделай первый вдох поглубже - и забирай его себе.`,
    `Не спеши включаться в чужие дела. Первые пять минут этого утра пусть будут только твоими.`
  ];
  const dayl = [
    `Ты уже в середине дня. Если он выдался тяжёлым - это не повод отменять заботу о себе, скорее наоборот.`,
    `Спроси себя честно: чего сейчас не хватает - тишины, воды или движения? С этого и начни, остальное подождёт.`,
    `${left ? `Осталось ${plural(left,'задание','задания','заданий')}, и ни одно не займёт больше получаса.` : 'На сегодня всё закрыто.'} Ты справляешься лучше, чем тебе кажется.`,
    `Маленький комплимент: ты продолжаешь возвращаться к себе даже тогда, когда некогда. Это редкое умение.`
  ];
  const evening = [
    `Вечер - время выдоха. Одна практика перед сном стоит трёх утренних обещаний себе.`,
    `Сегодня был день. Не идеальный, но твой - и он почти закончился. Давай завершим его мягко.`,
    `Скажи себе спасибо за сегодня, вслух и по-настоящему. А потом можно отдыхать с чистой совестью.`,
    `Если сил не осталось совсем - включи мягкий режим внизу. Одна минута сегодня всегда лучше, чем ноль.`
  ];
  const pool = h < 12 ? morning : h < 18 ? dayl : evening;
  return pool[(v - 1) % pool.length];
}

function pgReport(){
  const done = S.program.map((_,i) => doneOf(i));
  const total = done.reduce((a,b) => a+b, 0);
  const mins = S.program.flatMap(d => d.tasks).filter(t => t.done).reduce((a,t) => a + t.min, 0);
  const byTag = {};
  S.program.flatMap(d => d.tasks).filter(t => t.done).forEach(t => t.tags.forEach(x => byTag[x] = (byTag[x]||0)+1));
  const top = Object.entries(byTag).sort((a,b) => b[1]-a[1]).slice(0,5);
  const best = done.indexOf(Math.max(...done));

  return `<div class="view pad">${backBtn('Назад')}

    </div>

    <div class="g2">
      <div class="card" style="text-align:center;margin:0"><div class="serif" style="font-size:30px">${streak()}</div>
        <div class="small muted">дней подряд</div></div>

        <div class="small muted">звёзд собрано</div></div>
    </div>

    <div class="card" style="margin-top:14px">
      <b style="font-size:15px">Над чем ты работала</b>

        <div style="margin-top:11px">
          <div class="spread" style="margin-bottom:5px"><span class="small">${t}</span><span class="small muted">${n}</span></div>

        total === 0 ? 'Ты только начала. Самое трудное - первое задание, дальше проще.' :
        total < 7 ? 'Неделя идёт неровно, и это нормально. Попробуй мягкий режим в те дни, когда нет сил: одно задание тоже считается.' :
        total < 15 ? 'Хороший темп. Ты закрываешь больше половины - и это уже устойчивая привычка, а не рывок.' :

  </div>`;

function cycleRing(cy){

  const seg = C * (cy.day / cy.len);
  return `<svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg);display:block;margin:0 auto">
    <circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="${cy.phase.c}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${seg} ${C}"/>
    <text x="60" y="60" transform="rotate(90 60 60)" text-anchor="middle" dy="6"
      style="font:700 22px Inter;fill:var(--ink)">${cy.day}</text>
  </svg>`;
}

function setBirthPart(k, v){
  if(!S.birth.parts){
    const c = S.birth.date ? S.birth.date.split('-') : ['','',''];
    S.birth.parts = {y:c[0], m:c[1], d:c[2]};
  }
  const p = S.birth.parts;
  if(k === 'y') p.y = v;
  if(k === 'm') p.m = v ? String(v).padStart(2,'0') : '';
  if(k === 'd') p.d = v ? String(v).padStart(2,'0') : '';
  if(p.y && p.m && p.d){
    S.birth.date = `${p.y}-${p.m}-${p.d}`;
    render(); schedulePersist();
  } else {
    S.birth.date = '';
  }
}
function setBirth(f, v){ S.birth[f] = v; render(); schedulePersist(); }

function setCoverFrom(gk){
  const d = S.gDraft, key = d.key;
  if(!MEDIA[gk]) return;
  const old = MEDIA[key];
  MEDIA[key] = MEDIA[gk];
  const i = d.gallery.indexOf(gk);
  if(i > -1){
    if(old){ MEDIA[gk] = old; }            // бывшая обложка уходит в галерею
    else d.gallery.splice(i, 1);
  }
  d.pos = '50% 50%';
  render(); toast('Фото стало обложкой');
}
function dropCover(key){
  const d = S.gDraft;
  if(d.gallery.length){                     // первое из галереи поднимаем в обложку
    const next = d.gallery.shift();
    MEDIA[key] = MEDIA[next];
    delete MEDIA[next];
  } else delete MEDIA[key];
  render(); toast('Обложка убрана');
}
/* ---------- кадрирование обложки ползунками ---------- */
function cropBox(key, pos, path){
  const [px, py] = String(pos).split(' ').map(v => parseInt(v) || 50);
  return `<label class="lbl">Кадрирование обложки</label>
    <div class="cropwrap">

        <img src="${MEDIA[key]}" style="object-position:${px}% ${py}%">

        <input type="range" min="0" max="100" value="${px}" class="crange"

      </div>
      <div class="croprow">
        <span class="small muted">По вертикали</span>
        <input type="range" min="0" max="100" value="${py}" class="crange"
          oninput="setCrop('${path}','y',this.value)">
      </div>
      <button class="btn ghost xs" style="margin-top:6px" onclick="resetCrop('${path}')">Сбросить в центр</button>
    </div>
    <div class="small muted" style="margin:6px 0 12px">Двигай ползунки - так обложка будет обрезана в карточке и на странице</div>`;

function setCrop(path, axis, val){
  const cur = String(pathGet(S, path) || '50% 50%').split(' ').map(v => parseInt(v) || 50);
  if(axis === 'x') cur[0] = +val; else cur[1] = +val;
  const pos = cur[0] + '% ' + cur[1] + '%';
  pathSet(S, path, pos);
  const img = document.querySelector('#croppv img');
  if(img) img.style.objectPosition = pos;
}
function resetCrop(path){
  pathSet(S, path, '50% 50%');
  render();
}

  const d = S.gDraft;
  const key = d.key;
  if(!d.t.trim()) return toast('Назови товар');
  if(d._id === 'new'){
    const id = 'g'+Date.now().toString(36);
    if(MEDIA[d.key]){ MEDIA[id] = MEDIA[d.key]; delete MEDIA[d.key]; }
    GOODS.unshift({id, t:d.t.trim(), p:d.p, old:d.old || undefined, sh:d.sh, c:d.c, f:d.f || undefined});
    GOOD_INFO[id] = {about:d.about, video:d.video, gallery:d.gallery, delivery:d.delivery,
      stock:d.stock, offer:null, pos:d.pos || '50% 50%'};
    if(d.video) { S.videos = S.videos || {}; S.videos[id + '_vid'] = d.video; }
  } else {
    const g = GOODS.find(x => x.id === d._id);
    Object.assign(g, {t:d.t.trim(), p:d.p, old:d.old || undefined, sh:d.sh, c:d.c, f:d.f || undefined});

function answerQ(id){
  const v = (($('#qa_'+id)||{}).value || '').trim();
  if(!v) return toast('Напиши ответ');
  const q = [...GOOD_QS, ...S.qs].find(x => x.id === id);
  if(!q) return;
  q.answer = v;
  q.answeredAt = Date.now();
  replyToBuyer(q, v);
  render(); syncPush(['questions','replies']);
  toast('Ответ отправлен покупательнице в личные сообщения');
}

/* ответ покупательнице в её переписку */
function replyToBuyer(q, text){
  if(typeof initInbox !== 'function') return;
  initInbox();
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  S.marketReplies = S.marketReplies || [];
  S.marketReplies.push({qid:q.id, mail:q.mail, t:text, tm, at:Date.now()});

  /* если отвечающий смотрит платформу под тем же аккаунтом — сразу в тред */
  const th = (S.inbox || []).find(x => x.kind === 'маркет');
  if(th && S.user && String(S.user.email).toLowerCase() === String(q.mail).toLowerCase()){
    th.msgs.push({me:false, t:text, tm});
    th.unread = true;
  }
}

/* ---------- пользователи ---------- */
function allUsers(){
  const reg = Object.values(DB.users()).map(u => ({
    id:u.email, n:u.name, m:u.email, tg:u.tg || '—', role:u.role === 'expert' ? 'эксперт' : u.role === 'admin' ? 'админ' : 'ученица',
    pay:u.paid ? 'paid' : 'trial', since:new Date(u.created||Date.now()).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
    sum:0, note:u.note||'', st:u.st||'', last:'сегодня', real:true, gift:!!u.gift, offer:u.offer||'',
    verified:u.verified, days:Math.max(0, (u.trialDays||3) - Math.floor((Date.now()-(u.created||Date.now()))/864e5)), eng:70
  }));
  const demo = USERS.map(u => ({...u, verified:true, days:u.pay==='trial'?2:0, eng:(hash(u.id)%60)+35}));
  return [...reg, ...demo];
}

function setUser(id, f, v){ const u = USERS.find(x => x.id === id); if(u){ u[f] = v; return render(); }
  const all = DB.users(); const k = String(id).toLowerCase();
  if(all[k]){ all[k][f] = v; DB.saveUsers(all); render(); } }
function setUserQuiet(id, f, v){ const u = USERS.find(x => x.id === id); if(u){ u[f] = v; return; }
  const all = DB.users(); const k = String(id).toLowerCase(); if(all[k]){ all[k][f] = v; DB.saveUsers(all); } }

function setTicket(id, st){ const t = INBOX.find(x => x.id === id); t.st = st; render(); }
function replyTicket(id){

}

/* ---------- товары и идеи ---------- */
function adIdeas(){
  const news = S.ideas.filter(i => i.st === 'новое').sort((a,b) => b.v - a.v);
  const log = S.ideas.filter(i => i.st !== 'новое').sort((a,b) => b.v - a.v);
  return `
  <p class="small muted" style="margin:0 0 12px">Предложения пользователей. Понравившиеся уходят в бэклог со статусом и приоритетом.</p>
  <div class="sec-h" style="margin-top:0"><h2 class="serif" style="font-size:18px">Новые</h2><span class="small muted">${news.length}</span></div>
  ${news.length ? news.map(ideaCard).join('') : '<div class="empty">Новых предложений нет</div>'}
  <div class="sec-h"><h2 class="serif" style="font-size:18px">Бэклог</h2><span class="small muted">${log.length}</span></div>
  ${log.map(ideaCard).join('')}`;
}
function ideaCard(i){
  const PR = ['высокий','средний','низкий'];
  const ST = ['новое','в бэклоге','в работе','готово','отклонено'];
  return `<div class="card">
    <div class="spread" style="margin-bottom:6px"><span class="chip pale">${i.a}</span>
      <span class="small muted">${i.d} · ${i.v} голосов</span></div>
    <b style="font-size:14px">${esc(i.t)}</b>
    <div class="small muted" style="margin:8px 0 5px">Статус</div>
    <div class="chips">${ST.map(s => `<button class="chip ${i.st===s?'on':''}" onclick="setIdea('${i.id}','st','${s}')">${s}</button>`).join('')}</div>
    <div class="small muted" style="margin:3px 0 5px">Приоритет</div>
    <div class="chips">${PR.map(s => `<button class="chip ${i.pr===s?'on':''}" onclick="setIdea('${i.id}','pr','${s}')">${s}</button>`).join('')}</div>
  </div>`;
}
function setIdea(id, f, v){ const i = S.ideas.find(x => x.id === id); i[f] = v;
  if(f === 'st' && v !== 'новое' && i.pr === '—') i.pr = 'средний'; render(); }

function exportUsers(){
  const rows = [['Имя','Почта','Телеграм','Роль','Доступ','Вовлечённость','Статус','Комментарий']]
    .concat(allUsers().map(u => [u.n,u.m,u.tg||'',u.role,u.gift?'подарен':u.pay,u.eng+'%',u.st||'',u.note||'']));
  const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,%EF%BB%BF' + encodeURIComponent(csv);
  a.download = 'eva-users.csv'; a.click();
  toast('CSV выгружен');
}

/* ---------- образование на проверке ---------- */
function eduQueue(){
  const out = [];
  EXPERTS.forEach(e => (e.edu||[]).forEach(x => { if(x.st === 'pending') out.push({e, x}); }));
  return out;
}

/* ---------- редактор курса ---------- */
function openCourseEditor(id){ S.editCourse = id; S.sheet = null; render(); window.scrollTo(0,0); }
function closeCourseEditor(){ S.editCourse = null; S.editUnit = null; render(); window.scrollTo(0,0); }

function modulesOf(cid){
  if(!S.modules) S.modules = {};
  if(!S.modules[cid]){
    const src = MODULES[cid] || [[1,'Модуль 1', lessonsOf(cid).map(l => l.n)]];
    S.modules[cid] = src.map(([n,t,units]) => ({n, t, units:[...units]}));
  }
  return S.modules[cid];
}
function publishCourse(cid){
  const c = COURSES.find(x => x.id === cid);
  const ls = lessonsOf(cid);
  if(!ls.length) return toast('Добавь хотя бы один урок');
  if(!ls.some(l => l.free)) return toast('Открой хотя бы один урок как витрину');
  c.draft = false; c.n = ls.length;
  pushShared(); render(); toast('Курс опубликован в каталоге');
}

function setCourse(id, f, v){ const c = COURSES.find(x => x.id === id); c[f] = v; }
function addModule(cid){
  const m = modulesOf(cid);
  m.push({n:m.length+1, t:'Новый модуль', units:[]});
  render(); toast('Модуль добавлен');
}
function renameModule(cid, mi){
  const m = modulesOf(cid)[mi];
  const t = prompt('Название модуля', m.t);
  if(t && t.trim()) m.t = t.trim();
  render();
}
function addUnitTo(cid, mi){
  const ls = lessonsOf(cid), n = ls.length + 1;
  const l = {id:cid+'_'+n, n, t:'Новый урок', d:'', min:12, done:false, video:'', free:false};
  ls.push(l);
  modulesOf(cid)[mi].units.push(n);
  S.editCourse = cid; S.editUnit = l.id; render(); window.scrollTo(0,0);
}

function setUnit(cid, uid, f, v){ const l = lessonsOf(cid).find(x => x.id === uid); if(l) l[f] = v; }
function setUnitR(cid, uid, f, v){ setUnit(cid, uid, f, v); render(); }
function delUnit(cid, uid){
  const ls = lessonsOf(cid), i = ls.findIndex(x => x.id === uid);
  if(i < 0) return;
  const n = ls[i].n;
  ls.splice(i,1);
  modulesOf(cid).forEach(m => m.units = m.units.filter(u => u !== n));

function tgAud(btn, id, k){

}

function saveExpertName(){
  const e = me();
  const n = (($('#ex_name')||{}).value || '').trim();
  const r = (($('#ex_role')||{}).value || '').trim();
  if(!n) return toast('Имя не может быть пустым');
  const old = e.n;
  e.n = n;
  if(r) e.r = r;
  /* переносим авторство материалов, курсов и мероприятий на новое имя */
  LIB.forEach(x => { if(x.expert === old) x.expert = n; });
  (S.pending || []).forEach(x => { if(x.expert === old) x.expert = n; });
  COURSES.forEach(c => { if(c.e === old) c.e = n; });
  EVENTS.forEach(v => { if(v.by === old) v.by = n; });
  if(S.user){
    const u = DB.find(S.user.email);
    if(u){ u.name = n; DB.upsert(u); }
    S.user.name = n;
  }
  syncPush(); render(); schedulePersist();
  toast('Изменения сохранены');
}

   Смените обе строки перед публикацией сайта.
   ───────────────────────────────────────────────────────────────── */
const SYNC_KEY = 'eva-change-me';

const SYNC = {
  base: 'api.php',
  alive: null,          // null — ещё не проверяли
  rev: 0,
  lastError: '',
  lastSaved: 0,
  queue: {},            // ветки, ждущие отправки
  sending: false,
  get key(){ return Store.get('eva_sync_key', SYNC_KEY); },
  set key(v){ Store.set('eva_sync_key', v); }
};

async function apiCall(action, body, opts){
  opts = opts || {};
  if(SYNC.alive === false && !opts.force) return null;
  try {
    let payload = null;
    if(body){
      payload = JSON.stringify(body);
      if(payload.length > 6_000_000){
        SYNC.lastError = 'пакет ' + Math.round(payload.length/1048576) + ' МБ — больше лимита хостинга. Сохраняю частями';
        return null;
      }
    }
    const init = payload
      ? { method:'POST', headers:{'Content-Type':'application/json'}, body:payload }
      : { cache:'no-store' };
    const res = await fetch(SYNC.base + '?action=' + action, init);
    let j = null;
    try { j = await res.json(); }
    catch(e){ throw new Error('сервер ответил не в формате JSON (код ' + res.status + ')'); }
    if(!j.ok){
      SYNC.lastError = j.error || ('ошибка ' + res.status);
      if(!opts.silent) toast('Не сохранилось: ' + SYNC.lastError);
      return null;
    }
    SYNC.lastError = '';
    return j;
  } catch(e){
    SYNC.lastError = e.message || 'нет связи с сервером';
    if(!opts.silent) toast('Нет связи с сервером');
    return null;
  }
}

/* ---------- ветки общих данных ----------
   Всё, что здесь, видно каждому. Картинки хранятся ссылками. */
const BRANCHES = {
  lib:        () => LIB.map(clean),
  courses:    () => COURSES.map(clean),
  lessons:    () => S.lessons || {},
  modules:    () => S.modules || {},
  courseInfo: () => COURSE_INFO,
  courseTags: () => COURSE_TAGS,
  courseKind: () => COURSE_KIND,
  goods:      () => GOODS.map(clean),
  goodInfo:   () => GOOD_INFO,
  events:     () => EVENTS.map(clean),
  experts:    () => EXPERTS.map(clean),
  pending:    () => S.pending || [],
  media:      () => mediaLinks(),
  videos:     () => S.videos || {},
  covPos:     () => S.covPos || {},
  wall:       () => (typeof WALL !== 'undefined' ? WALL : []),
  support:    () => (typeof INBOX !== 'undefined' ? INBOX : []),
  orders:     () => [...(typeof ORDERS !== 'undefined' ? ORDERS : []), ...(S.orders || [])],
  questions:  () => [...(typeof GOOD_QS !== 'undefined' ? GOOD_QS : []), ...(S.qs || [])],
  ideas:      () => S.ideas || [],
  adminInfo:  () => ({name:S.adminName, avatar:S.adminAvatar}),
  avatars:    () => AVATARS,
  replies:    () => S.marketReplies || []
};

const clean = o => JSON.parse(JSON.stringify(o));

/* в общие данные попадают только ссылки на файлы, не base64 */
function mediaLinks(){
  const out = {};
  Object.keys(MEDIA).forEach(k => {
    const v = MEDIA[k];
    if(typeof v === 'string' && !v.startsWith('data:')) out[k] = v;
  });
  return out;
}

/* ---------- сохранение ---------- */
let syncTimer = null;

/* поставить ветки в очередь; без аргументов — все, что относится к контенту */
function syncPush(branches, immediate){
  if(SYNC.alive === false) return;
  const list = branches || ['lib','courses','lessons','modules','courseInfo','courseTags','courseKind',
    'goods','goodInfo','events','experts','pending','media','videos','covPos','adminInfo','avatars'];
  list.forEach(b => { if(BRANCHES[b]) SYNC.queue[b] = true; });
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flushSync, immediate ? 0 : 800);
}

async function flushSync(){
  if(SYNC.sending || SYNC.alive === false) return;
  const names = Object.keys(SYNC.queue);
  if(!names.length) return;
  SYNC.sending = true;
  SYNC.queue = {};

  const parts = {};
  names.forEach(b => { try { parts[b] = BRANCHES[b](); } catch(e){} });

  // если пакет слишком большой — режем по одной ветке
  const size = JSON.stringify(parts).length;
  let okAll = true;
  if(size > 1_200_000){
    for(const b of names){
      const r = await apiCall('patch', { key:SYNC.key, parts:{ [b]: parts[b] } });
      if(!r) okAll = false; else SYNC.rev = r.rev;
    }
  } else {
    const r = await apiCall('patch', { key:SYNC.key, parts });
    if(!r) okAll = false; else SYNC.rev = r.rev;
  }
  SYNC.sending = false;
  if(okAll){
    SYNC.lastSaved = Date.now();
    updateSyncBadge('saved');
    if(S.role !== 'user' && !S.sheet) render();
  } else {
    names.forEach(b => SYNC.queue[b] = true);
    updateSyncBadge('error');
    if(!S.sheet) render();
  }
}

/* совместимость со старыми вызовами */
function pushShared(){ syncPush(); }
function pushBranch(branch, value){ syncPush([branch]); }

/* ---------- чтение ---------- */
function applyShared(sh){
  if(!sh || typeof sh !== 'object') return false;
  const repl = (arr, data) => { if(Array.isArray(data) && data.length){ arr.length = 0; data.forEach(x => arr.push(x)); } };
  repl(LIB, sh.lib);
  repl(COURSES, sh.courses);
  repl(GOODS, sh.goods);
  repl(EVENTS, sh.events);
  if(typeof WALL !== 'undefined')  repl(WALL, sh.wall);
  if(typeof INBOX !== 'undefined') repl(INBOX, sh.support);
  if(Array.isArray(sh.experts)) sh.experts.forEach(e => {
    const cur = EXPERTS.find(x => x.id === e.id);
    if(cur) Object.assign(cur, e); else EXPERTS.push(e);
  });
  const maps = {courseInfo:COURSE_INFO, courseTags:COURSE_TAGS, courseKind:COURSE_KIND, goodInfo:GOOD_INFO};
  Object.keys(maps).forEach(k => { if(sh[k] && typeof sh[k] === 'object') Object.assign(maps[k], sh[k]); });
  if(sh.media)   Object.assign(MEDIA, sh.media);
  if(sh.videos)  S.videos = Object.assign(S.videos || {}, sh.videos);
  if(sh.covPos)  S.covPos = Object.assign(S.covPos || {}, sh.covPos);
  if(sh.lessons) S.lessons = Object.assign(S.lessons || {}, sh.lessons);
  if(sh.modules) S.modules = Object.assign(S.modules || {}, sh.modules);
  if(Array.isArray(sh.pending) && sh.pending.length) S.pending = sh.pending;
  if(Array.isArray(sh.ideas)   && sh.ideas.length)   S.ideas = sh.ideas;
  if(Array.isArray(sh.replies)) S.marketReplies = sh.replies;
  if(sh.avatars && typeof sh.avatars === 'object'){
    Object.keys(sh.avatars).forEach(m => { if(sh.avatars[m]) AVATARS[m] = sh.avatars[m]; });
    if(S.user && AVATARS[String(S.user.email).toLowerCase()]) S.avatar = AVATARS[String(S.user.email).toLowerCase()];
  }
  if(sh.adminInfo && typeof sh.adminInfo === 'object'){
    if(sh.adminInfo.name) S.adminName = sh.adminInfo.name;
    if(sh.adminInfo.avatar) S.adminAvatar = sh.adminInfo.avatar;
  }
  if(Array.isArray(sh.orders) && typeof ORDERS !== 'undefined'){
    ORDERS.length = 0; sh.orders.forEach(o => ORDERS.push(o)); S.orders = [];
  }
  if(Array.isArray(sh.questions) && typeof GOOD_QS !== 'undefined'){
    GOOD_QS.length = 0; sh.questions.forEach(q => GOOD_QS.push(q)); S.qs = [];
  }
  return true;
}

async function syncPull(silent){
  const r = await apiCall('state', null, { silent:true });
  if(!r) return false;
  if(r.rev === SYNC.rev && silent) return false;
  SYNC.rev = r.rev;
  const changed = applyShared(r.shared);
  if(changed && !silent) render();
  return changed;
}

/* ---------- файлы ---------- */
async function uploadImage(id, dataUrl){
  if(SYNC.alive === false) return dataUrl;
  const r = await apiCall('upload', { id, data:dataUrl });
  if(r && r.url) return r.url;
  toast('Фото осталось только на этом устройстве: ' + (SYNC.lastError || 'сервер недоступен'));
  return dataUrl;
}

/* ---------- аккаунты и прогресс ---------- */
async function syncUser(u){ if(SYNC.alive !== false) await apiCall('user_save', { user:u }, { silent:true }); }
async function pullUsers(){
  const r = await apiCall('users', null, { silent:true });
  if(r && r.users && typeof r.users === 'object'){
    DB.saveUsers(Object.assign({}, r.users, DB.users()));
  }
}
async function pushProgress(){
  if(SYNC.alive === false || !S.user || !S.user.email) return;
  const d = DB.progress(S.user.email);
  if(d) await apiCall('progress_save', { email:S.user.email, progress:d }, { silent:true });
}
async function pullProgress(email){
  const r = await apiCall('progress_get&email=' + encodeURIComponent(email), null, { silent:true });
  if(!r || !r.progress) return false;
  const local = DB.progress(email);
  if(local && (local.savedAt || 0) > (r.progress.savedAt || 0)){
    await apiCall('progress_save', { email, progress:local }, { silent:true });
    return true;
  }
  DB.saveProgress(email, r.progress);
  return true;
}

          ${row('Размер базы', (d.db_size/1024).toFixed(1) + ' КБ')}
          ${row('Версия данных', d.rev)}
          ${row('Аккаунтов', d.users)}
          ${row('Лимит запроса', d.post_max)}
          ${row('Разделов сохранено', (d.branches||[]).length)}
        `}
      </div>
      ${(d.problems||[]).length ? `<div class="card" style="border-color:var(--accent)">
        <b style="font-size:14px">Что мешает</b>
        ${d.problems.map(p => `<div class="small" style="margin-top:6px">— ${esc(p)}</div>`).join('')}

      ${d.key_default ? `<div class="card" style="border-color:var(--warn)">

      ${!d.key_ok && !d.err ? `
        <label class="lbl">Ключ синхронизации из api.php</label>
        <input class="field" id="sk" value="${esc(SYNC.key)}" placeholder="ADMIN_KEY из api.php">

      <div class="acts">
        <button class="btn ghost" onclick="runDiag()">Проверить снова</button>
        <button class="btn ghost" onclick="syncPush(null,true);toast('Отправляю данные на сервер')">Сохранить всё</button>
      </div>
      <button class="btn ghost" style="margin-top:8px" onclick="backupDB()">Скачать резервную копию</button>

}
async function runDiag(){
  const r = await apiCall('diag&key=' + encodeURIComponent(SYNC.key), null, { silent:true, force:true });
  S.diag = r ? r : { err: SYNC.lastError || 'сервер не отвечает' };
  render();
}
function saveSyncKey(){
  const v = (($('#sk')||{}).value || '').trim();
  if(!v) return toast('Впишите ключ');
  SYNC.key = v;
  toast('Ключ сохранён');
  runDiag();
}
async function backupDB(){
  const r = await apiCall('export&key=' + encodeURIComponent(SYNC.key), null, { silent:true });
  if(!r) return toast('Не удалось выгрузить: ' + SYNC.lastError);
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(r.db, null, 2));
  a.download = 'eva-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Копия сохранена');
}

/* ---------- запуск ---------- */
async function initSync(){
  const ping = await apiCall('ping', null, { silent:true, force:true });
  SYNC.alive = !!ping;
  if(!SYNC.alive){
    console.info('[Eva] Сервер не найден — работаем локально в этом браузере');
    return;
  }
  await pullUsers();
  await syncPull(true);
  if(S.screen === 'app') render();
  setInterval(() => {
    if(SYNC.sending || S.sheet) return;
    syncPull(true).then(ch => { if(ch) render(); });
  }, 30000);
  // если что-то не отправилось — пробуем ещё раз
  setInterval(() => { if(Object.keys(SYNC.queue).length) flushSync(); }, 15000);
  window.addEventListener('online', () => { SYNC.alive = true; flushSync(); });
}

function ask(q){
  if(!q || !q.trim()) return;
  S.eva = S.eva || []; S.eva.push({r:'me', t:q.trim()});
  const a = evaAnswer(q.toLowerCase());
  S.eva.push({r:'eva', t:a});
  render();
  const c = $('#chat'); if(c) c.scrollTop = c.scrollHeight;
  speak(a);
}

function evaAnswer(q){
  const day = S.program[S.day], left = day.tasks.filter(t => !t.done);
  if(/аффирмац|прочит/.test(q)) return day.tasks[0].text;
  if(/балл|звёзд|звезд|статус|уровен/.test(q)){
    const {next} = levelNow();
    return `У тебя ${S.points} баллов и ${S.stars} из ${starsTotal()} звёзд на этой неделе.` + (next ? ` До статуса «${next.n}» осталось ${next.from - S.points}.` : '');
  }
  if(/почему|как.*собра|подобра/.test(q))
    return `Я собрала программу по твоим темам: ${S.tags.slice(0,4).join(', ')}. Из ${LIB.length} уроков библиотеки выбрала те, где совпадение выше всего - среднее по программе ${S.match}%.`;
  if(/нет времени|не успева|некогда|нет сил|устал|тяжел/.test(q)){
    S.gentle = true;
    return 'Включила мягкий режим: сегодня только аффирмация на одну минуту. Остальное подождёт, программа никуда не денется.';
  }
  if(/сегодня|делать|задани|план/.test(q))
    return left.length ? `Осталось ${plural(left.length,'задание','задания','заданий')}: ${left.map(t => t.title).join(', ')}. Начни с самого короткого - это ${left.slice().sort((a,b)=>a.min-b.min)[0].title}.`
                       : 'Всё на сегодня закрыто. Три звезды твои, можно выдохнуть.';
  if(/пересобра|нов.*программ|друг.*программ/.test(q)){ setTimeout(() => openSheet('rebuild'), 500); return 'Открываю настройки программы.'; }
  if(/сплю|сон|бессонниц/.test(q)) return 'Посмотри «Йога-нидра перед сном» у Марины Ясной - двадцать минут лёжа, многие засыпают на середине. Найдёшь в контенте по тегу «сон».';
  if(/тревог|паник|страшно/.test(q)) return 'В моменте помогает удлинённый выдох: вдох на четыре, выдох на восемь. В библиотеке это «Дыхание при тревоге», шесть минут.';
  if(/курс/.test(q)) return `Под твои темы ближе всего «${COURSES[0].t}» от ${COURSES[0].e}. Открой вкладку Курсы.`;
  if(/привет|здравств|как дела/.test(q)) return `${hello()}, ${S.name || 'Ева'}. Чем помочь?`;
  return 'Я умею рассказать про сегодняшний день, объяснить логику программы, включить мягкий режим и прочитать аффирмацию вслух. Спроси что-то из этого.';
}

function listen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return toast('Распознавание речи работает в Chrome и Safari');
  const r = new SR(); r.lang = 'ru-RU'; r.interimResults = false;
  r.onresult = e => ask(e.results[0][0].transcript);
  r.onerror = () => toast('Не расслышала, попробуй ещё раз');
  r.start(); toast('Слушаю...');
}

function checkout(){
  const _items = S.cart.map(c => ({id:c.id, n:c.n}));
  const items = S.cart.map(c => ({...GOODS.find(g => g.id === c.id), n:c.n}));
  const total = items.reduce((a,i) => a + i.p*i.n, 0);
  const used = Math.min(S.bonus, Math.round(total*0.3));
  const cb = Math.round(total*0.05);
  S.bonus = S.bonus - used + cb;
  S.points += Math.min(50, Math.round(total/200));
  items.forEach(i => S.purchases.unshift({t:i.t, p:i.p*i.n, cb:Math.round(i.p*i.n*0.05), date:'сегодня'}));
  S.orders.unshift({id:'o'+Date.now().toString(36), who:S.name || 'Гостья',
    mail:S.user ? S.user.email : '—', items:_items, sum:total, bonus:used, st:'новый',
    d:'сегодня', city:(S.datingProfile && S.datingProfile.city) || 'Москва', phone:S.phone || ''});
  S.cart = []; S.page = 'profile'; render(); schedulePersist();

  S.bonus -= used; S.courses.push(id); S.points += 50;
  S.purchases.unshift({t:c.t, p:c.p - used, cb:0, date:'сегодня'});
  S.sheet = null; render();
  toast('Курс открыт. +150 баллов');

function setEvCover(gk){
  const d = evDraft(), key = d.key;
  const old = MEDIA[key];

  const i = d.gallery.indexOf(gk);
  if(i > -1){ if(old) MEDIA[gk] = old; else d.gallery.splice(i,1); }
  render(); toast('Фото стало обложкой');

function delEvPhoto(k){
  const d = evDraft();
  if(k === d.key){
    if(d.gallery.length){ const n = d.gallery.shift(); MEDIA[d.key] = MEDIA[n]; delete MEDIA[n]; }
    else delete MEDIA[d.key];
  } else {
    delete MEDIA[k];
    d.gallery = d.gallery.filter(x => x !== k);
  }
  render();
}

function grant(id, kind){
  const all = DB.users(), k = String(id).toLowerCase();
  const label = {gift30:'Бесплатный доступ на 30 дней', gift:'Бессрочный доступ подарен',
    off50:'Скидка 50% на первый месяц', trial7:'Пробный продлён до 7 дней', revoke:'Доступ снят'}[kind];
  if(all[k]){
    if(kind === 'revoke'){ all[k].gift = false; all[k].paid = false; all[k].offer = ''; }
    else if(kind === 'off50'){ all[k].offer = 'Скидка 50%'; }
    else if(kind === 'trial7'){ all[k].trialDays = 7; }
    else { all[k].gift = true; all[k].paid = true; all[k].offer = label; }
    DB.saveUsers(all);
  } else {
    const u = USERS.find(x => x.id === id);
    if(u){ u.pay = kind === 'revoke' ? 'none' : 'paid'; u.note = (u.note ? u.note + '. ' : '') + label; }
  }
  if(S.user && S.user.email === k && kind !== 'revoke') S.sub.active = true;
  S.sheet = null; render(); toast(label);
}

      <button class="btn sm" onclick="addOwnPhrase('${id}','${field}')">→</button>
    </div>

    ${free.length ? `<div class="sec-h" style="margin-top:16px">
        <h2 class="serif" style="font-size:17px">Готовые формулировки</h2>
        <span class="small muted">${free.length}</span></div>
      ${free.map(t => `<button class="phrase" onclick="addPhrase('${id}','${field}', this.dataset.t)" data-t="${esc(t)}">
        <span class="pl2">＋</span><span>${esc(t)}</span></button>`).join('')}`
    : '<div class="empty" style="margin-top:14px">Все готовые формулировки уже добавлены</div>'}`;
}
function addPhrase(id, field, text){
  const e = EXPERTS.find(x => x.id === id);
  e[field] = e[field] || [];
  if(!e[field].includes(text)) e[field].push(text);
  S.sheet = null; render(); syncPush(['experts']);
  toast('Добавлено - поправь под себя');
}
function addOwnPhrase(id, field){
  const v = (($('#ph_own')||{}).value || '').trim();
  if(!v) return toast('Напиши формулировку');
  const e = EXPERTS.find(x => x.id === id);
  e[field] = e[field] || [];
  e[field].push(v);
  S.sheet = null; render(); syncPush(['experts']);
  toast('Добавлено');
}


</script>
</body>
</html>
