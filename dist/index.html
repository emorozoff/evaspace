/* =====================================================================
   МИНИ-КАЛЕНДАРЬ «Я ИДУ»
   Не месяц и не все недели — только те дни, где у неё что-то есть.
   Слева день недели и число, справа время, название, короткое описание
   и формат: онлайн или офлайн с городом. Прошедшее не исчезает —
   уходит вниз приглушённым списком.
   ===================================================================== */
const DOW = ['вс','пн','вт','ср','чт','пт','сб'];

/* Дата хранится строкой «2026-09-15». Читаем её как есть: через Date такая
   строка считается полуночью по Гринвичу, и в части часовых поясов день
   уезжал на сутки назад. */
function evDay(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d == null ? '' : d));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

/* короткая подпись: первая мысль из описания, без хвоста */
function evShort(e){
  const t = String(e.about || '').trim();
  if(!t) return '';
  const first = t.split(/(?<=[.!?])\s/)[0] || t;
  return first.length > 64 ? first.slice(0, 63).replace(/[\s,;:-]+$/, '') + '…' : first;
}

/* Все её мероприятия, сгруппированные по дню: сначала ближайшие по
   возрастанию, потом прошедшие — свежие сверху. */
function planDays(mine){
  const today = new Date(); today.setHours(0,0,0,0);
  const rows = [];
  (mine || []).forEach(e => {
    const day = evDay(e.d);
    if(day) rows.push({e, at:day.getTime(), day});
  });

  const pack = list => {
    const days = [];
    list.forEach(r => {
      const cur = days[days.length - 1];
      if(cur && cur.at === r.at) cur.items.push(r.e);
      else days.push({at:r.at, day:r.day, past:r.at < today.getTime(), items:[r.e]});
    });
    days.forEach(d => d.items.sort((a,b) => String(a.tm).localeCompare(String(b.tm))));
    return days;
  };

  const soon = rows.filter(r => r.at >= today.getTime()).sort((a,b) => a.at - b.at);
  const gone = rows.filter(r => r.at <  today.getTime()).sort((a,b) => b.at - a.at);
  return pack(soon).concat(pack(gone));
}

function myPlan(mine){
  const days = planDays(mine);
  if(!days.length) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = today.getTime() + 864e5;
  const count = days.reduce((n, x) => n + x.items.length, 0);
  const soon = days.filter(d => !d.past).length;

  const dayHtml = d => {
    const mark = d.at === today.getTime() ? 'сегодня' : d.at === tomorrow ? 'завтра' : '';
    return `<div class="pday${d.at === today.getTime() ? ' now' : ''}${d.past ? ' gone' : ''}">
      <div class="pcell">
        <span class="dw">${DOW[d.day.getDay()]}</span>
        <b>${d.day.getDate()}</b>
        <span class="mn">${MON[d.day.getMonth()]}</span>
      </div>
      <div class="pitems">${d.items.map(e => {
        const note = evShort(e);
        const on = e.mode === 'онлайн';
        return `
        <button class="pline" onclick="openSheet({k:'event',id:'${attJs(e.id)}'})">
          <span class="ptxt">
            <span class="phead"><b>${esc(e.t)}</b>${
              (typeof evBadge === 'function' ? evBadge(e.id) : '') ||
              (mark ? `<span class="psoon">${mark}</span>` : '')}</span>
            <span class="pmeta">
              <i class="pdot ${on ? 'on' : 'off'}"></i>${esc(e.tm)} · ${
                on ? 'онлайн' : 'офлайн' + (e.city ? ', ' + esc(e.city) : '')}</span>
            ${note ? `<span class="pnote">${esc(note)}</span>` : ''}
          </span>
        </button>`; }).join('')}</div>
    </div>`;
  };

  return `
  <div class="sec-h" style="margin-top:6px">
    <h2 class="serif" style="font-size:18px">Я иду</h2>
    <span class="small muted">${plural(count,'мероприятие','мероприятия','мероприятий')}</span>
  </div>
  <div class="myplan">
    ${days.filter(d => !d.past).map(dayHtml).join('')}
    ${days.some(d => d.past) ? `<div class="pgone">${soon ? 'уже прошли' : 'всё уже прошло'}</div>
      ${days.filter(d => d.past).map(dayHtml).join('')}` : ''}
  </div>`;
}

  return `<div class="evcard">
    <div class="ph" onclick="openSheet({k:'event',id:'${attJs(e.id)}'})">
      ${cover(e.id, e.kind === 'Концерт' ? 'class' : 'practice')}
      <div class="when"><b>${esc(dt.d)}</b><span>${esc(dt.m)}</span></div>
      <div class="evtags">

      </div>

      <div class="small muted" style="margin-top:2px">${esc(e.by)} · ${
        e.unlimited ? 'мест хватит всем' : plural(e.left,'место','места','мест') + ' свободно'}</div>
      <button class="btn sm ${going?'done':'acc'}" style="width:100%;margin-top:10px"
        ${!going && !e.unlimited && !e.left ? 'disabled' : ''}
        onclick="event.stopPropagation();goEvent('${attJs(e.id)}')">
        ${going ? '✓ Я иду, отменить'
          : (!e.unlimited && !e.left) ? 'Мест не осталось'
          : e.price ? 'Купить билет' : 'Записаться'}</button>
    </div>
  </div>`;
}

function goEvent(id){
  const e = EVENTS.find(x => x.id === id);
  if(!e) return;
  if(S.myEvents.includes(id)){
    S.myEvents = S.myEvents.filter(x => x !== id);
    if(!e.unlimited) e.left = Math.min(e.seats, e.left + 1);
    S.points = Math.max(0, S.points - 10);
    if(typeof stopEvChain === 'function') stopEvChain(id, 'cancelled');
    render(); schedulePersist(); syncPush(['events']);
    return toast('Запись отменена, место освободилось');
  }
  /* «места не ограничены» — счётчик мест не при чём, иначе записаться нельзя */
  if(!e.unlimited && e.left <= 0) return toast('Мест не осталось');
  S.myEvents.push(id);
  if(!e.unlimited) e.left = Math.max(0, e.left - 1);
  S.points += 10;
  /* Eva Events сразу пишет подтверждение и дальше ведёт до самой встречи */
  if(typeof startEvChain === 'function') startEvChain(id);
  render(); schedulePersist(); syncPush(['events']);
  toast(e.price
    ? (e.unlimited ? 'Билет забронирован' : `Билет забронирован. Осталось ${plural(e.left,'место','места','мест')}`)
    : (e.unlimited ? 'Записала. Мест хватит всем' : `Записала. Осталось ${plural(e.left,'место','места','мест')}`));
}

  return `

/* ---------- лента посланий ---------- */
function wallFeed(){
  return `
  <div class="sec-h"><h2 class="serif" style="font-size:18px">Послания</h2>
    <span class="small muted">${WALL.length}</span></div>

  ${wallStarter()}

  ${WALL.length ? WALL.map(wallCard).join('')
    : `<div class="empty">Здесь пока пусто. Напиши первой — тебя увидят все участницы.</div>`}`;
}

/* Писать послание можно прямо в ленте. Отдельное окно ради двух строк
   текста сбивало с мысли: пока оно открывалось, экран перестраивался, а
   мысль успевала уйти. Поле всегда на месте — нажала и пишешь. */
function wallStarter(){
  const d = (S.post && S.post.t) || '';
  return `<div class="wnew${d.trim() ? ' open' : ''}">
    ${chatAva(S.name, 'var(--ink)', true, 34, myMail())}
    <div class="wnbody">
      <textarea class="wnfield" id="wp_t" rows="1" data-grow="190"
        placeholder="Что расскажешь участницам?" oninput="wallDraft(this)">${esc(d)}</textarea>
      <div class="wnfoot">
        <span class="wnnote">Все участницы · +5 баллов</span>
        <button class="wnsend" onclick="sendPost()">Отправить</button>
      </div>
    </div>
  </div>`;
}

/* Растём под текст и запоминаем черновик, но экран не перерисовываем:
   иначе на каждой букве пропадал бы курсор. */
function wallDraft(box){
  S.post = S.post || {t:''};
  S.post.t = box.value;
  grow(box);
  const wrap = box.closest('.wnew');
  if(wrap) wrap.classList.toggle('open', !!box.value.trim());
}

/* Карточка послания: имя, текст, звезда и ответы. Больше ничего —
   послание должно писаться и читаться за несколько секунд. */
function wallCard(w){
  const liked = (S.starred||[]).includes(w.id);
  const mine = isMine(w);
  const canDrop = mine || S.role === 'admin';
  const col = authorColor(w.email || w.a);
  const cmts = w.comments || [];
  const open = (S.openCmts||[]).includes(w.id);

  return `<div class="wallpost" style="--kc:${safeColor(col)}">
    <div class="wtop">
      ${chatAva(w.a, col, mine, 38, w.email)}
      <div style="flex:1;min-width:0">
        <b style="font-size:14px;display:block">${esc(w.a)}${mine?' · ты':''}</b>
        <span class="small muted" style="font-size:11px">${esc(w.city || '')}${w.city?' · ':''}${esc(w.ago)}</span>
      </div>
      ${canDrop ? `<button class="wdel" title="Удалить"
        onclick="delPost('${attJs(w.id)}')">✕</button>` : ''}
    </div>

    <p class="wtext">${esc(w.t)}</p>

    <div class="wallfoot">
      <div class="row" style="gap:7px">
        <button class="starbtn ${liked?'on':''}" onclick="starPost('${attJs(w.id)}')">
          ${starMark(15, liked ? '#E7A339' : 'rgba(17,16,20,.22)')}
          <span>${w.st + (liked?1:0)}</span>
        </button>
        <button class="cmtbtn ${open?'on':''}" onclick="toggleComments('${attJs(w.id)}')">
          ответить${cmts.length ? ' · ' + cmts.length : ''}</button>
      </div>
      <button class="btn xs" onclick="replyWall('${attJs(w.id)}')">Написать</button>
    </div>

    ${open ? `<div class="cmts">
        ${cmts.map((c, ci) => commentRow(w, c, ci)).join('')
          || `<div class="small muted" style="padding:4px 0 8px">Пока никто не ответил. Будь первой</div>`}
        <div class="cmtnew">
          <input class="field" id="cm_${esc(w.id)}" placeholder="Ответить"
            onkeydown="if(event.key==='Enter')addComment('${attJs(w.id)}')">
          <button class="btn sm" onclick="addComment('${attJs(w.id)}')">→</button>
        </div>
      </div>`
    : cmts.length ? `<button class="cmtpeek" onclick="toggleComments('${attJs(w.id)}')">
        ${chatAva(cmts[0].a, authorColor(cmts[0].email || cmts[0].a), isMine(cmts[0]), 22, cmts[0].email)}
        <span><b>${esc(cmts[0].a)}:</b> ${esc(cmts[0].t.slice(0,38))}${cmts[0].t.length>38?'…':''}</span>
        ${cmts.length > 1 ? `<span class="cmtmore">ещё ${cmts.length - 1}</span>` : ''}
      </button>` : ''}
  </div>`;
}

/* Ответ под посланием. У каждой женщины свой цвет — лента перестаёт быть
   серой простынёй, и видно, кто здесь уже свой. */
function commentRow(w, c, ci){
  const col = authorColor(c.email || c.a);
  const mine = isMine(c);
  const author = !!(c.email && w.email && String(c.email).toLowerCase() === String(w.email).toLowerCase());
  const starred = (S.starredCmts||[]).includes(w.id + ':' + ci);
  const canDrop = mine || S.role === 'admin';
  return `<div class="cmt${mine?' own':''}" style="--ac:${safeColor(col)}">
    ${chatAva(c.a, col, mine, 28, c.email)}
    <div style="flex:1;min-width:0">
      <div class="crow">
        <b style="font-size:12.5px;color:${safeColor(col)}">${esc(c.a)}${mine?' · ты':''}</b>
        ${author ? '<span class="badge-au">автор</span>' : ''}
        ${c.curator ? '<span class="badge-cur">куратор</span>' : ''}
        <span class="small muted" style="font-size:10px;margin-left:auto">${esc(c.ago)}</span>
        ${canDrop ? `<button class="cdel" title="Удалить"
          onclick="delComment('${attJs(w.id)}',${ci})">✕</button>` : ''}
      </div>
      <div class="ctext">${esc(c.t)}</div>
      <button class="cstar ${starred?'on':''}" onclick="starComment('${attJs(w.id)}',${ci})">
        ${starMark(12, starred ? '#E7A339' : 'rgba(17,16,20,.24)')}
        <span>${(c.st || 0) + (starred?1:0) || ''}</span></button>
    </div>
  </div>`;
}

/* ---------- знакомства ---------- */
/* Анкета всегда сначала показывается такой, какой её увидят другие: сохранила —
   смотришь на себя со стороны и решаешь, публиковать или ещё поправить. */
function profileCard(preview){
  const p = S.datingProfile;
  const age = S.birth.date ? Math.floor((Date.now() - new Date(S.birth.date))/31557600000) : null;
  return `
  <div class="card" style="padding:14px">
    <div class="spread" style="margin-bottom:8px">
      <b style="font-size:16px">${preview ? 'Так тебя увидят' : 'Твоя анкета'}</b>
      ${preview ? '' : '<span class="chip pale" style="padding:3px 9px">опубликована</span>'}
    </div>
    ${preview ? `<p class="small muted" style="margin:0 0 12px">Проверь и опубликуй — после этого
      начнём подбирать знакомства.</p>` : ''}
    <div class="mcard myprofile">
      <div class="mphoto">${myAvatar()
        ? `<img src="${safeUrl(myAvatar())}" alt="">`
        : `<div style="width:100%;height:100%;display:grid;place-items:center;background:var(--surface-2)">
            <div style="text-align:center;padding:20px">
              <div class="dot-ava" style="width:64px;height:64px;font-size:24px;margin:0 auto 10px;background:var(--ink)">${esc((S.name||'Я')[0])}</div>
              <button class="btn ghost sm" onclick="pickAvatar()">Добавить фото</button>
              <div class="small muted" style="margin-top:6px">С фото откликаются в разы чаще</div>
            </div></div>`}
        <div class="mname"><b>${esc(S.name||'Ты')}${age ? ', ' + age : ''}</b>
          <span>${esc(p.city || 'город не указан')}${p.goal ? ' · ' + esc(p.goal) : ''}</span></div>
      </div>
      <div style="padding:14px">
        <p style="margin:0 0 10px;font-size:14px;line-height:1.5">${esc(p.about || 'Расскажи пару слов о себе - это поможет найти близких по духу')}</p>
        <div class="eyebrow" style="margin-bottom:6px">Интересы</div>
        <div class="chips wrap" style="padding:0">${(p.ints||[]).map(t => `<span class="chip pale" style="padding:4px 10px">${esc(t)}</span>`).join('')}</div>
      </div>
    </div>
    <div class="draftbar">
      <button class="btn ghost" style="flex:1" onclick="openSheet('dating')">Изменить</button>
      ${preview
        ? `<button class="btn" style="flex:1" onclick="publishProfile()">Опубликовать</button>`
        : `<button class="btn ghost" style="flex:1" onclick="hideMyProfile()">Скрыть</button>`}
    </div>
    <button class="btn ghost sm" style="margin-top:9px;color:var(--accent)"
      onclick="openSheet('dropProfile')">Удалить анкету</button>
  </div>`;
}
function publishProfile(){
  S.datingProfile.published = true;
  S.showProfile = false;
  S.matchIdx = 0;
  render(); schedulePersist();
  toast(myAvatar() ? 'Анкета опубликована. Подбираем знакомства' : 'Опубликовано. С фото откликаются чаще - добавь позже');
}
/* посмотреть свою опубликованную анкету и убрать просмотр обратно */
function showMyProfile(){ S.showProfile = true; render(); }
function hideMyProfile(){ S.showProfile = false; render(); }

/* анкету можно убрать совсем: пропадает из подбора, интересы остаются в профиле */
function dropProfile(){
  S.datingProfile = null; S.dp = null; S.showProfile = false;
  S.matchIdx = 0; S.sheet = null;
  render(); schedulePersist();
  toast('Анкета удалена. Тебя больше не показывают в знакомствах');
}

function datingBlock(){
  const p = S.datingProfile;
  if(!p.published) return profileCard(true);        // не опубликована — сначала показываем
  if(S.showProfile) return profileCard(false);      // и по кнопке в любой момент
  const fmt = S.datingFmt || 'кофе';
  const pool = matchPool(fmt);
  const idx = Math.min(S.matchIdx || 0, Math.max(0, pool.length-1));
  const m = pool[idx];
  return `
  <div class="card" style="padding:14px">
    <div class="spread" style="margin-bottom:10px">
      <b style="font-size:16px">Новые знакомства</b>
      <button class="chip" onclick="showMyProfile()">Моя анкета</button>
    </div>
    <div class="seg" style="margin-bottom:12px">
      <button class="${fmt==='кофе'?'on':''}" onclick="setFmt('кофе')">Кофе в моём городе</button>
      <button class="${fmt==='онлайн'?'on':''}" onclick="setFmt('онлайн')">Знакомство онлайн</button>
    </div>

    ${m ? `<div class="mcard">
      <div class="mphoto">${MEDIA[m.id] ? `<img src="${safeUrl(MEDIA[m.id])}" alt="">` : portrait(m.id)}
        <div class="mname">
          <b>${esc(m.n)}, ${m.age}</b>
          <span>${fmt === 'кофе' ? m.city : m.city === 'Онлайн' ? 'онлайн' : m.city + ' · онлайн'}</span>
        </div>
      </div>
      <div style="padding:14px">
        <p style="margin:0 0 10px;font-size:14px;line-height:1.5">${m.bio}</p>
        <div class="eyebrow" style="margin-bottom:6px">Интересы</div>
        <div class="chips wrap" style="padding:0">${m.ints.map(t =>
          `<span class="chip ${(p.ints||[]).includes(t)?'on':'pale'}" style="padding:4px 10px">${t}</span>`).join('')}</div>
        ${common(m).length ? `<div class="small" style="color:var(--ok);margin-top:8px;font-weight:600">
          Совпадение: ${common(m).join(', ')}</div>` : ''}
        <div class="acts">
          <button class="btn" onclick="inviteMatch('${attJs(m.id)}')">Позвать ${fmt === 'кофе' ? 'на кофе' : 'познакомиться'}</button>
          <button class="btn ghost" onclick="nextMatch()">Следующая</button>
        </div>
      </div>
    </div>
    <div class="small muted" style="text-align:center;margin-top:8px">${idx+1} из ${pool.length}</div>`
    : `<div class="empty">В этом формате пока никого нет. Попробуй другой формат или добавь интересы в анкету.</div>`}
  </div>`;
}
function common(m){
  const mine = (S.datingProfile && S.datingProfile.ints) || [];
  return m.ints.filter(t => mine.includes(t));
}
function matchPool(fmt){
  let pool = MEMBERS.filter(m => fmt === 'онлайн' || m.city !== 'Онлайн');
  if(fmt === 'кофе' && S.datingProfile && S.datingProfile.city){
    const same = pool.filter(m => m.city === S.datingProfile.city);
    if(same.length) pool = same;
  }
  return pool.slice().sort((a,b) => {
    const photo = (MEDIA[b.id] ? 1 : 0) - (MEDIA[a.id] ? 1 : 0);
    if(photo) return photo;
    return common(b).length - common(a).length;
  });
}
function setFmt(f){ S.datingFmt = f; S.matchIdx = 0; render(); }
function nextMatch(){
  const pool = matchPool(S.datingFmt || 'кофе');
  S.matchIdx = ((S.matchIdx || 0) + 1) % Math.max(1, pool.length);
  render();
}
function inviteMatch(id){
  const m = MEMBERS.find(x => x.id === id);
  const fmt = S.datingFmt || 'кофе';
  sendInvite(m, fmt);
  S.points += 5;
  nextMatch();
}

/* создаёт переписку у себя и «входящее» приглашение для демонстрации ответа */
function sendInvite(m, fmt){
  initInbox();
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const text = fmt === 'кофе'
    ? `Привет! Увидела твою анкету, у нас общие интересы. Давай выпьем кофе в ${(S.datingProfile&&S.datingProfile.city)||'городе'}?`
    : 'Привет! Увидела твою анкету, у нас общие интересы. Давай познакомимся онлайн?';
  let t = S.inbox.find(x => x.who === m.id);
  if(!t){
    t = {id:'inv'+Date.now().toString(36), from:m.n, who:m.id, c:'#6C5CE0', kind:'знакомство',
         ago:'только что', unread:false, msgs:[]};
    S.inbox.unshift(t);
  }
  t.msgs.push({me:true, t:text, tm});
  S.thread = t.id; S.page = 'inbox'; S.clubTab = 'people';
  render(); schedulePersist();
  toast('Приглашение отправлено ' + m.n);
  setTimeout(() => {
    t.msgs.push({me:false, t:'Привет! С удовольствием. Когда тебе удобно?', tm, invite:true});
    if(S.thread === t.id) render(); else { t.unread = true; render(); }
  }, 2200);
}

/* входящее приглашение с кнопками */
function seedIncomingInvite(){
  initInbox();
  if(S.inbox.some(t => t.pending)) return;
  const now = new Date();
  S.inbox.unshift({id:'in'+Date.now().toString(36), from:'Даша', c:'#3F7D62', kind:'приглашение',
    ago:'5 мин назад', unread:true, pending:true,
    msgs:[{me:false, t:'Привет! Я в субботу иду в горы, есть место в машине. Маршрут лёгкий. Пойдёшь?',
      tm:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')}]});
}
function answerInvite(id, yes){
  const t = S.inbox.find(x => x.id === id);
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  t.pending = false;
  t.msgs.push({me:true, t: yes ? 'Да, с удовольствием! Давай договоримся о времени.' : 'Спасибо за приглашение, но в этот раз не смогу.', tm});
  if(yes) S.points += 10;
  render(); schedulePersist();
  toast(yes ? 'Приглашение принято. +10 баллов' : 'Приглашение отклонено');
  if(yes) setTimeout(() => {
    t.msgs.push({me:false, t:'Отлично! Выезжаем в 8 утра от метро, скину точку.', tm});
    if(S.thread === t.id) render();
  }, 1600);
}

function toggleComments(id){
  S.openCmts = S.openCmts || [];
  S.openCmts = S.openCmts.includes(id) ? S.openCmts.filter(x => x !== id) : [...S.openCmts, id];
  render();
}
function addComment(id){
  const inp = document.getElementById('cm_' + id);
  const v = inp ? inp.value.trim() : '';
  if(!v) return toast('Напиши ответ');
  const w = WALL.find(x => x.id === id);
  if(!w) return;
  w.comments = w.comments || [];
  w.comments.push({a:S.role === 'admin' ? (S.adminName || 'Куратор') : (S.name || 'Я'),
    t:v, ago:'только что', st:0, curator:S.role === 'admin', email:myMail()});
  if(inp) inp.value = '';
  S.points += 3;
  render(); schedulePersist(); syncPush(['wall']);
  toast('Ответ добавлен. +3 балла');
}

function starPost(id){
  S.starred = S.starred || [];
  const on = S.starred.includes(id);
  S.starred = on ? S.starred.filter(x => x !== id) : [...S.starred, id];
  render(); schedulePersist();
  if(!on) toast('Звезда отправлена');
}

/* звёздочка у ответа: отмечаем свои, чтобы не накрутить дважды */
function starComment(pid, ci){
  const key = pid + ':' + ci;
  S.starredCmts = S.starredCmts || [];
  const on = S.starredCmts.includes(key);
  S.starredCmts = on ? S.starredCmts.filter(x => x !== key) : [...S.starredCmts, key];
  const w = WALL.find(x => x.id === pid);
  if(w && w.comments && w.comments[ci]){
    const c = w.comments[ci];
    c.st = Math.max(0, (c.st || 0) + (on ? -1 : 1));
  }
  render(); schedulePersist(); syncPush(['wall']);
}

function initChats(){
  const first = !S.chats;
  S.chats = S.chats || {};
  /* добираем и новые группы: раньше добавленная группа оставалась без
     переписки, и отправка сообщения в неё падала */
  GROUPS.forEach(g => {
    if(!Array.isArray(S.chats[g.id]))
      S.chats[g.id] = (CHAT_SEED[g.id]||[]).map(([a,c,t,tm,exp], i) =>
        ({id:g.id + '_s' + i, a, c, t, tm, exp:!!exp, at:1000 + i}));
  });
  if(first || !S.chat) S.chat = {open:null, reply:null, unread:{gr2:2, gr3:1}};
}

/* Номер и время нужны каждому сообщению: по номеру сервер склеивает
   переписку от разных женщин, по времени она выстраивается по порядку.
   Без этого сообщения затирали друг друга при обмене. */
const msgId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* кому открыта группа: экспертная — только своим, клуб — по подписке */
function canEnter(g){
  if(!g) return false;
  if(S.role === 'admin') return true;
  if(g.status && g.status !== 'live' && myGRole(g) === 'visitor') return false;
  if(g.access === 'experts') return S.role === 'expert';
  if(g.access === 'club') return (S.clubs || []).includes(g.id);
  /* по заявке: переписка открывается, когда ведущая впустила */
  if(g.access === 'request') return myGRole(g) !== 'visitor';
  return true;
}
const isClub = g => g && g.access === 'club';

function pgClub(){
  initChats();
  /* на согласовании и закрытые видит только своя команда */
  const seen = GROUPS.filter(g => (g.access !== 'experts' || canEnter(g)) &&
    (!g.status || g.status === 'live' || myGRole(g) !== 'visitor'));

        <div class="small muted gline">

      ${locked ? `<span class="glock">${lockIcon(12)}</span>`
        : un ? `<span class="unreadc">${un}</span>`

      <div><div class="eyebrow">Сообщество</div>

      ${tab==='groups' ? `<button class="chip" onclick="openSheet('newGroup')">＋ Создать</button>` : ''}
    </div>
    <div class="seg" style="margin-top:12px">
      <button class="${tab==='groups'?'on':''}" onclick="S.clubTab='groups';render()">Группы</button>
      <button class="${tab==='events'?'on':''}" onclick="S.clubTab='events';render()">Мероприятия</button>
      <button class="${tab==='people'?'on':''}" onclick="S.clubTab='people';render()">Участницы</button>
    </div>
    ${tab === 'people' ? pgMembers() : tab === 'events' ? `
      <p class="small muted" style="margin:0 0 12px">Женские круги, встречи, концерты и практики офлайн и онлайн.
        ${S.myEvents.length ? 'Ты записана на ' + plural(S.myEvents.length,'мероприятие','мероприятия','мероприятий') + '.' : ''}</p>
      ${pgEvents()}`
    : `
      <p class="small muted" style="margin:0 0 12px">Переписка как в мессенджере. Эксперты отвечают внутри своих групп.</p>
      ${mine.length ? `<div class="eyebrow" style="margin-bottom:8px">Мои группы</div>${mine.map(g => row(g,true)).join('')}` : ''}

      ${open.map(g => row(g,false)).join('')}
      ${clubs.length ? `<div class="sec-h" style="margin:18px 0 8px">
          <h2 class="serif" style="font-size:17px">Частные клубы</h2>
          <span class="small muted">по подписке</span></div>
        <p class="small muted" style="margin:0 0 10px">Маленькие закрытые круги с ведущей, своим ритмом

        ${clubs.map(g => row(g,false)).join('')}` : ''}`}
  </div>`;
}

/* Поле ввода живёт вне ленты сообщений: внутри .view его прижимало
   к последнему сообщению, потому что у блока своя анимация появления. */
function chatBar(){
  const g = GROUPS.find(x => x.id === (S.chat && S.chat.open));
  if(!g || !canEnter(g)) return '';
  const msgs = S.chats[g.id] || [];
  const re = S.chat.reply && S.chat.reply.g === g.id ? msgs[S.chat.reply.i] : null;
  return `<div class="chatbar">
    ${re ? `<div class="rebar">
      <div style="flex:1;min-width:0"><b>${esc(re.a)}</b><span>${esc(String(re.t).slice(0,70))}</span></div>

      <input class="field" id="cin" placeholder="${re ? 'Ответ для ' + esc(re.a) : 'Сообщение'}"
        onkeydown="if(event.key==='Enter')sendMsg('${attJs(g.id)}')">
      <button class="btn" onclick="sendMsg('${attJs(g.id)}')">→</button>

/* ответ на сообщение: цитата остаётся видимой, пока не отправишь или не отменишь */
function replyMsg(gid, i){
  S.chat.reply = {g:gid, i};
  render();
  setTimeout(() => { const el = $('#cin'); if(el) el.focus(); }, 60);
}
function cancelReply(){ S.chat.reply = null; render(); }

/* своё ли сообщение в групповом чате: по почте, метка — только у старых */
function chatMine(m){
  if(!m) return false;
  const his = String(m.email || '').toLowerCase();
  return his ? his === myMail() : !!m.own;
}

/* аватар автора: своё фото у себя, буква у остальных */
function chatAva(name, color, own, size, email){
  const s = size || 32;
  /* почта автора важнее любых меток: так фото не перескакивают между людьми */
  if(email){
    const src = avatarOf(email);
    if(src) return avaImg(src, s);
    own = String(email).toLowerCase() === myMail();
  }
  if(own && S.role === 'admin' && S.adminAvatar) return avaImg(S.adminAvatar, s);
  if((name === 'Куратор' || name === S.adminName) && S.adminAvatar) return avaImg(S.adminAvatar, s);
  if(own){
    const mine = myAvatar();
    if(mine) return avaImg(mine, s);
  }
  const initials = String(name || '?').split(' ').map(w => w[0]).join('').slice(0,2);
  return `<div class="dot-ava" style="width:${s}px;height:${s}px;background:${safeColor(color)}">${esc(initials)}</div>`;
}

function sendMsg(gid){
  const inp = $('#cin'); if(!inp) return;
  const t = inp.value.trim(); if(!t) return;
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  /* если отвечаем на чьё-то сообщение — цитата уезжает вместе с текстом */
  const r = S.chat.reply && S.chat.reply.g === gid ? (S.chats[gid] || [])[S.chat.reply.i] : null;
  S.chats[gid].push({id:msgId(), at:Date.now(),
    a: S.role === 'admin' ? (S.adminName || 'Куратор') : (S.name || 'Я'),
    c: authorColor(myMail() || S.name), t, tm, email:myMail(), own:true,
    curator: S.role === 'admin',
    re: r ? {a:r.a, t:String(r.t).slice(0, 90)} : null});
  inp.value = '';
  S.chat.reply = null;
  S.points += 5;
  render(); scrollChat(); schedulePersist(); syncPush(['chats']);
  toast('+5 баллов за участие');
  setTimeout(() => {
    const g = GROUPS.find(x => x.id === gid);
    const ex = EXPERTS[hash(gid) % EXPERTS.length];
    const replies = [
      'Спасибо, что написала. Ты не одна с этим - в группе многие проходили похожее.',
      'Хороший вопрос. Начни с самого малого шага, остальное подтянется.',
      'Отмечу это на ближайшем эфире, разберём подробнее.'
    ];
    S.chats[gid].push({id:msgId(), at:Date.now(), a:ex.n, c:authorColor(ex.n),
      t:replies[hash(t) % replies.length], tm, exp:true,
      re:{a:S.name || 'Я', t:t.slice(0, 90)}});
    if(S.chat.open === gid){ render(); scrollChat(); } else { S.chat.unread[gid] = (S.chat.unread[gid]||0)+1; }
  }, 1600);
}
function delMsg(gid, i){
  const gone = S.chats[gid][i];
  S.chats[gid].splice(i, 1);
  tombChat(gid, gone);
  render(); schedulePersist(); syncPush(['chats']);
  toast('Сообщение удалено');
}

/* модерация ленты: удаление послания и отдельного комментария */
function delPost(id){
  const w = WALL.find(x => x.id === id);
  if(!w) return;
  /* своё послание женщина убирает сама, чужое — только администратор */
  if(!isMine(w) && S.role !== 'admin') return toast('Убрать послание может только автор');
  if(!confirm('Удалить послание «' + String(w.t).slice(0, 60) + '…»? Вернуть будет нельзя.')) return;
  WALL.splice(WALL.indexOf(w), 1);
  tombWall(id);
  S.openCmts = (S.openCmts||[]).filter(x => x !== id);
  render(); schedulePersist(); syncPush(['wall'], true);
  toast('Послание удалено');
}
function delComment(pid, ci){
  const w = WALL.find(x => x.id === pid);
  if(!w || !w.comments || !w.comments[ci]) return;
  if(!isMine(w.comments[ci]) && S.role !== 'admin') return toast('Убрать ответ может только автор');
  if(!confirm('Удалить ответ?')) return;
  w.comments.splice(ci, 1);
  S.starredCmts = (S.starredCmts||[]).filter(x => x.indexOf(pid + ':') !== 0);
  render(); schedulePersist(); syncPush(['wall'], true);
  toast('Ответ удалён');
}

/* забираем ответы админа на вопросы о товарах, адресованные этой почте */
function pullMarketReplies(){
  if(!S.user || !S.marketReplies || !S.marketReplies.length) return;
  const mine = String(S.user.email).toLowerCase();
  S.seenReplies = S.seenReplies || [];
  const fresh = S.marketReplies.filter(r =>
    String(r.mail).toLowerCase() === mine && !S.seenReplies.includes(r.qid + '_' + r.at));
  if(!fresh.length) return;
  let th = S.inbox.find(x => x.kind === 'маркет');
  if(!th){
    th = {id:'mk'+Date.now().toString(36), from:'Eva Space · Маркет', c:'#111014',
          kind:'маркет', ago:'только что', unread:false, sys:true, msgs:[]};
    S.inbox.unshift(th);
  }
  fresh.forEach(r => {
    th.msgs.push({me:false, t:r.t, tm:r.tm});
    S.seenReplies.push(r.qid + '_' + r.at);
  });
  th.unread = true;
}

function threadBar(){

  return `<div class="chatbar"><div class="chatinput">

  </div></div>`;

function sendDM(id){
  const inp = $('#tin'); if(!inp) return;
  const v = inp.value.trim(); if(!v) return;
  const t = S.inbox.find(x => x.id === id);
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  t.msgs.push({me:true, t:v, tm});
  /* сообщение в тред маркета — это новый вопрос администратору */
  if(t.kind === 'маркет'){
    S.qs.push({id:'q'+Date.now().toString(36), gid:t.gid || '', who:S.name || 'Гостья',
      mail:S.user ? S.user.email : '', ago:'только что', t:v, answer:'', private:true});
    syncPush(['questions']);
    render(); schedulePersist();
    return toast('Вопрос отправлен, ответим в течение дня');
  }
  render(); schedulePersist();
  setTimeout(() => {
    if(t.sys) return;
    t.msgs.push({me:false, t:t.exp ? 'Спасибо, что написала. Отвечу подробнее в течение дня.' : 'Отлично, давай! Напиши, когда тебе удобно.',
      tm:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')});
    if(S.thread === id) render(); else t.unread = true;
  }, 1500);
}


function replyWall(id){
  const w = WALL.find(x => x.id === id);
  if(!w) return;
  initInbox();
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  let t = S.inbox.find(x => x.from === w.a && x.kind === 'знакомство');
  if(!t){
    t = {id:'wr'+Date.now().toString(36), from:w.a, c:authorColor(w.email || w.a),
         kind:'знакомство', ago:'только что', unread:false, msgs:[], email:w.email || ''};
    S.inbox.unshift(t);
  }
  t.msgs.push({me:true, t:`Привет! Откликаюсь на твоё послание: «${w.t.slice(0,60)}${w.t.length>60?'…':''}»`, tm});
  S.thread = t.id; S.page = 'inbox';
  render(); schedulePersist(); toast('Написала ' + w.a);
  setTimeout(() => {
    t.msgs.push({me:false, t:'Привет! Здорово, что откликнулась. Расскажи о себе немного?', tm});
    if(S.thread === t.id) render(); else { t.unread = true; render(); }
  }, 1800);
}

/* отбор материалов вынесен отдельно: им пользуются и экран, и обновление списка */
const CTYPES = {'Всё':null, 'Аффирмации':'affirm', 'Практики':'practice', 'Мастер-классы':'class'};

function contentItems(){
  let items = LIB.filter(x => x.status === 'live');
  if(CTYPES[S.filter]) items = items.filter(x => x.type === CTYPES[S.filter]);
  if(S.topicFilter) items = items.filter(x => (x.topics||[]).includes(S.topicFilter));
  if(S.onlyLiked) items = items.filter(x => isLiked(x.id));
  if(S.q.trim()){
    const q = S.q.toLowerCase();
    items = items.filter(x => (x.title + ' ' + x.text + ' ' + x.expert + ' ' + x.tags.join(' ') + ' ' +
      (x.topics||[]).map(topicName).join(' ')).toLowerCase().includes(q));
  }
  items = items.map(x => ({...x, m:matchOf(x)})).sort((a,b) => b.m - a.m);
  return items;
}

}

/* Направления показываем только внутри вида. В общем списке их набирается
   на три экрана, и за фишками теряется сам контент; поэтому во «Всём»
   остаются только «Все» и «Избранное», а направления приходят вместе с
   выбранным видом — и лишь те, в которых действительно что-то есть. */
function topicRow(){
  const type = CTYPES[S.filter];
  const live = LIB.filter(x => x.status === 'live' && (!type || x.type === type));
  const have = {};
  live.forEach(x => (x.topics||[]).forEach(k => { have[k] = (have[k]||0) + 1; }));
  const list = type
    ? (topicsFor(type) || []).filter(t => have[t.k])
        .sort((a,b) => have[b.k] - have[a.k]).slice(0, 8)
    : [];
  const liked = (S.likes || []).length;
  const all = !S.topicFilter && !S.onlyLiked;
  return `<div class="trow hscroll">
    <button class="tchip ${all?'on plain':''}" onclick="showAll()"><span>Все</span></button>
    ${liked ? `<button class="tchip fav ${S.onlyLiked?'on':''}" onclick="tgLiked()">
      ${starMark(13, S.onlyLiked ? '#fff' : '#E7A339')}<span>Избранное</span><b>${liked}</b></button>` : ''}
    ${list.map(t => `<button class="tchip ${S.topicFilter===t.k?'on':''}" style="--tc:${safeColor(t.c)}"
      onclick="pickTopic('${attJs(t.k)}')">
      ${tIcon(t.k, 14)}<span>${esc(t.l)}</span><b>${have[t.k]}</b></button>`).join('')}
  </div>`;
}

/* Переключения меняют только фишки и список: заголовок и поле поиска
   остаются нетронутыми, поэтому экран не дёргается и курсор не пропадает. */
function setCType(k){ S.filter = k; S.topicFilter = null; renderTabs(); }
function pickTopic(k){ S.topicFilter = S.topicFilter === k ? null : k; S.onlyLiked = false; renderTabs(); }
function tgLiked(){ S.onlyLiked = !S.onlyLiked; if(S.onlyLiked) S.topicFilter = null; renderTabs(); }
function showAll(){ S.topicFilter = null; S.onlyLiked = false; renderTabs(); }

function renderTabs(){
  const box = $('#cbox');
  if(!box) return render();
  box.innerHTML = contentTabs() + topicRow();
  deskArrows();
  renderList();
}

const foundLine = n => 'Найдено ' + plural(n,'урок','урока','уроков') + ' · отсортировано по совпадению с тобой';
const listHTML = items => items.length ? items.map(x => contentRow(x)).join('')
  : `<div class="empty">Ничего не нашлось.<br>Попробуй другое слово или сними фильтр.</div>`;

/* Обновляем только список, не трогая поле ввода: иначе на каждой букве
   пропадал курсор и приходилось щёлкать по полю заново. */
function renderList(){

function bumpVisit(){
  const today = new Date().toDateString();
  S.visits = S.visits || {day:'', n:0};
  if(S.visits.day !== today){ S.visits = {day:today, n:1}; }
  else S.visits.n++;
  schedulePersit_safe();
}
function schedulePersit_safe(){ try{ schedulePersist(); }catch(e){} }

function greetingLine(){
  const v = (S.visits && S.visits.n) || 1;
  const h = new Date().getHours();
  const day = S.program[S.day] || {tasks:[]};
  const left = day.tasks.filter(t => !t.done).length;
  const total = day.tasks.length;
  const done = total - left;
  const cy = cycleNow();
  const name = S.name || 'Ева';
  const wd = new Date().toLocaleDateString('ru-RU',{weekday:'long'});
  const Wd = wd[0].toUpperCase() + wd.slice(1);
  const nextCourse = COURSES.filter(c => !c.draft && !S.courses.includes(c.id))[0];

  if(total && done === total){
    const praise = [
      `Ты закрыла все три задания. Это целый день, который ты провела на своей стороне - и таких звёзд у тебя уже ${S.starsAll || S.stars}.`,
      `Три из трёх. Ты не просто выполнила программу, ты выбрала себя сегодня. Отдыхай спокойно.`,
      `День закрыт полностью. Знаешь, что самое ценное? Не сами практики, а то, что ты возвращаешься к ним снова.`
    ][v % 3];
    return nextCourse
      ? `${praise} Если захочется глубже - посмотри курс «${esc(nextCourse.t)}», первые уроки открыты бесплатно.`
      : praise;
  }
  if(done && left === 1)
    return `Осталось одно задание - ${day.tasks.find(t => !t.done).title.toLowerCase()}. Ты уже почти собрала полный день.`;
  if(S.gentle)
    return `Сегодня мягкий режим: аффирмация и мастер-класс, практику отложили. Так тоже считается.`;
  if(cy && cy.phase.k === 'menstrual' && v <= 2)
    return `${Wd}, день ${cy.day} цикла. Сил сейчас меньше - это физиология, а не лень. Возьми самое короткое задание и не требуй большего.`;

    `Доброе утро, ${name}. Рада тебя видеть. Начни с аффирмации - это одна минута, а тон дня она задаёт на весь день.`,

    `Аффирмация дня: скажи вслух «вселенная, что за сюрприз ты мне сегодня приготовила?» - и весь день посматривай, что она ответит.`,
    `${Wd} только начинается, и он ещё ничей. Сделай первый вдох поглубже - и забирай его себе.`,
    `Не спеши включаться в чужие дела. Первые пять минут этого утра пусть будут только твоими.`
  ];
  const dayl = [
    `Ты уже в середине дня. Если он выдался тяжёлым - это не повод отменять заботу о себе, скорее наоборот.`,
    `Спроси себя честно: чего сейчас не хватает - тишины, воды или движения? С этого и начни, остальное подождёт.`,
    `${left ? `Осталось ${plural(left,'задание','задания','заданий')}, и ни одно не займёт больше получаса.` : 'На сегодня всё закрыто.'} Ты справляешься лучше, чем тебе кажется.`,
    `Маленький комплимент: ты продолжаешь возвращаться к себе даже тогда, когда некогда. Это редкое умение.`
  ];
  const evening = [
    `Вечер - время выдоха. Одна практика перед сном стоит трёх утренних обещаний себе.`,
    `Сегодня был день. Не идеальный, но твой - и он почти закончился. Давай завершим его мягко.`,
    `Скажи себе спасибо за сегодня, вслух и по-настоящему. А потом можно отдыхать с чистой совестью.`,
    `Если сил не осталось совсем - включи мягкий режим внизу. Одна минута сегодня всегда лучше, чем ноль.`
  ];
  const pool = h < 12 ? morning : h < 18 ? dayl : evening;
  return pool[(v - 1) % pool.length];
}

function cycleRing(cy){
  const C = 2*Math.PI*46;
  const seg = C * (cy.day / cy.len);
  return `<svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg);display:block;margin:0 auto">
    <circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="${esc(cy.phase.c)}" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${seg} ${C}"/>
    <text x="60" y="60" transform="rotate(90 60 60)" text-anchor="middle" dy="6"
      style="font:700 22px Inter;fill:var(--ink)">${cy.day}</text>
  </svg>`;
}

function setCoverFrom(gk){
  const d = S.gDraft, key = d.key;
  if(!MEDIA[gk]) return;
  const old = MEDIA[key];
  MEDIA[key] = MEDIA[gk];
  const i = d.gallery.indexOf(gk);
  if(i > -1){
    if(old){ MEDIA[gk] = old; }            // бывшая обложка уходит в галерею
    else d.gallery.splice(i, 1);
  }
  d.pos = '50% 50%';
  render(); toast('Фото стало обложкой');
}
function dropCover(key){
  const d = S.gDraft;
  if(d.gallery.length){                     // первое из галереи поднимаем в обложку
    const next = d.gallery.shift();
    MEDIA[key] = MEDIA[next];
    delete MEDIA[next];
  } else delete MEDIA[key];
  render(); toast('Обложка убрана');
}
/* ---------- кадрирование обложки ползунками ---------- */
function cropBox(key, pos, path){
  const [px, py] = String(pos).split(' ').map(v => parseInt(v) || 50);
  return `<label class="lbl">Кадрирование обложки</label>
    <div class="cropwrap">
      <div class="croppreview" id="croppv">
        <img src="${safeUrl(MEDIA[key])}" style="object-position:${px}% ${py}%">
        <span class="cropgrid"></span>
      </div>
      <div class="croprow">
        <span class="small muted">По горизонтали</span>
        <input type="range" min="0" max="100" value="${px}" class="crange"
          oninput="setCrop('${attJs(path)}','x',this.value)">
      </div>
      <div class="croprow">
        <span class="small muted">По вертикали</span>
        <input type="range" min="0" max="100" value="${py}" class="crange"
          oninput="setCrop('${attJs(path)}','y',this.value)">
      </div>
      <button class="btn ghost xs" style="margin-top:6px" onclick="resetCrop('${attJs(path)}')">Сбросить в центр</button>
    </div>
    <div class="small muted" style="margin:6px 0 12px">Двигай ползунки - так обложка будет обрезана в карточке и на странице</div>`;
}
function setCrop(path, axis, val){
  const cur = String(pathGet(S, path) || '50% 50%').split(' ').map(v => parseInt(v) || 50);
  if(axis === 'x') cur[0] = +val; else cur[1] = +val;
  const pos = cur[0] + '% ' + cur[1] + '%';
  pathSet(S, path, pos);
  const img = document.querySelector('#croppv img');
  if(img) img.style.objectPosition = pos;
}
function resetCrop(path){
  pathSet(S, path, '50% 50%');
  render();
}
function addGalleryPhoto(key){
  const gk = key + '_g' + Date.now().toString(36);
  pickImage(gk, () => { S.gDraft.gallery.push(gk); render(); });
}
function delGalleryPhoto(i){
  const gk = S.gDraft.gallery[i];
  delete MEDIA[gk];
  S.gDraft.gallery.splice(i,1); render();
}

function saveGood(){
  const d = S.gDraft;
  const key = d.key;
  if(!d.t.trim()) return toast('Назови товар');
  if(d._id === 'new'){
    const id = 'g'+Date.now().toString(36);
    if(MEDIA[d.key]){ MEDIA[id] = MEDIA[d.key]; delete MEDIA[d.key]; }
    GOODS.unshift({id, t:d.t.trim(), p:d.p, old:d.old || undefined, sh:d.sh, c:d.c, f:d.f || undefined});
    GOOD_INFO[id] = {about:d.about, video:d.video, gallery:d.gallery, delivery:d.delivery,
      stock:d.stock, offer:null, pos:d.pos || '50% 50%'};
    if(d.video) { S.videos = S.videos || {}; S.videos[id + '_vid'] = d.video; }
  } else {
    const g = GOODS.find(x => x.id === d._id);
    Object.assign(g, {t:d.t.trim(), p:d.p, old:d.old || undefined, sh:d.sh, c:d.c, f:d.f || undefined});
    GOOD_INFO[d._id] = {about:d.about, video:d.video, gallery:d.gallery, delivery:d.delivery,
      stock:d.stock, offer:null, pos:d.pos || '50% 50%'};
    if(d.video){ S.videos = S.videos || {}; S.videos[d._id + '_vid'] = d.video; }
  }
  S.gDraft = null; S.page = null; pushShared(); render();
  toast('Товар сохранён');
}

/* ответ покупательнице в её переписку */
function replyToBuyer(q, text){
  if(typeof initInbox !== 'function') return;
  initInbox();
  const now = new Date();
  const tm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  S.marketReplies = S.marketReplies || [];
  S.marketReplies.push({qid:q.id, mail:q.mail, t:text, tm, at:Date.now()});
  /* В переписку сообщение попадёт одним путём — через pullMarketReplies.
     Раньше его клали ещё и напрямую, и покупательница видела ответ дважды. */
  if(typeof pullMarketReplies === 'function') pullMarketReplies();
}

/* как и у мероприятий: меняем картинку, а не собираем страницу заново */
function slideGood(d){
  const g = GOODS.find(x => x.id === S.viewGood);
  if(!g) return;
  const slides = [g.id, ...((GOOD_INFO[g.id] || {}).gallery || [])].filter(k => MEDIA[k]);
  const n = slides.length;
  if(n < 2) return;
  S.gSlide = ((S.gSlide || 0) + d + n) % n;
  const box = document.getElementById('gdshot');
  const img = box && box.querySelector('img');
  if(!img) return render();
  img.src = safeUrl(MEDIA[slides[S.gSlide]]);
  const dots = document.getElementById('gddots');
  if(dots) [...dots.children].forEach((el, k) => el.className = k === S.gSlide ? 'on' : '');
}

function approve(id){
  const x = S.pending.find(i => i.id === id);
  x.status = 'live';
  LIB.push({id:x.id, type:x.type, title:x.title, expert:x.expert, min:x.min, tags:x.tags, text:x.text, status:'live'});
  pushShared(); render(); toast('Опубликовано в библиотеке');
}
function rework(id){
  const c = (($('#rc')||{}).value || '').trim();
  if(!c) return toast('Напиши, что поправить');
  const x = S.pending.find(i => i.id === id);
  x.status = 'rework'; x.comment = c;
  S.sheet = null; pushShared(); render(); toast('Отправлено эксперту на доработку');
}
function reject(id){
  const c = (($('#rc')||{}).value || '').trim();
  const x = S.pending.find(i => i.id === id);
  x.status = 'rejected'; x.comment = c || 'Без комментария';
  S.sheet = null; pushShared(); render(); toast('Отклонено');
}

/* Что заходит в подсказках дня.
   Собирается из звёзд, которые женщины ставят под посланием. Смотреть
   сюда имеет смысл, когда наберётся хотя бы сотня отметок: до этого
   разница между первым и последним местом — случайность. */
function tipStatsCard(){
  const r = typeof tipRating === 'function' ? tipRating() : [];
  const total = r.reduce((n, x) => n + x.n, 0);
  return `<div class="card">
    <div class="spread"><b style="font-size:14.5px">Что заходит в подсказках дня</b>
      <span class="small muted">${plural(total, 'отметка', 'отметки', 'отметок')}</span></div>
    ${!total ? `<p class="small muted" style="margin:9px 0 0">Пока ни одной звезды.
        Женщины ставят их под подсказкой на главной — по ним будет видно,
        какие послания стоит оставить, а какие переписать.</p>`
      : `${r.filter(x => x.n).slice(0, 8).map((x, i) => `<div class="trow" style="padding:8px 0">
          <span class="muted" style="font-size:12px;width:16px">${i + 1}</span>
          <div style="flex:1"><b style="font-size:13px">${esc(x.h)}</b>
            <div class="bar" style="margin-top:5px"><i style="width:${Math.round(x.n / r[0].n * 100)}%"></i></div></div>
          <b style="font-size:13px;width:34px;text-align:right">${x.n}</b></div>`).join('')}
        ${r.filter(x => !x.n).length ? `<div class="small muted" style="margin-top:10px">
          Без единой звезды: ${r.filter(x => !x.n).length} из ${r.length}.
          Когда отметок наберётся больше сотни — эти можно переписывать.</div>` : ''}`}
  </div>`;
}

function allUsers(){
  const reg = Object.values(DB.users()).map(u => ({
    id:u.email, n:u.name, m:u.email, tg:u.tg || '—', role:u.role === 'expert' ? 'эксперт' : u.role === 'admin' ? 'админ' : 'ученица',
    pay:u.paid ? 'paid' : 'trial', since:new Date(u.created||Date.now()).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
    sum:0, note:u.note||'', st:u.st||'', last:'сегодня', real:true, gift:!!u.gift, offer:u.offer||'',
    verified:u.verified, days:Math.max(0, (u.trialDays||3) - Math.floor((Date.now()-(u.created||Date.now()))/864e5)), eng:70
  }));
  const demo = USERS.map(u => ({...u, verified:true, days:u.pay==='trial'?2:0, eng:(hash(u.id)%60)+35}));
  return [...reg, ...demo];
}

/* Роль меняет сервер: администратора назначает только data/config.php,
   эксперта — администратор. Из браузера роль себе не выдать. */
async function toggleExpert(id){
  const u = allUsers().find(x => x.id === id);
  if(!u) return;
  if(!u.real) return toast('Это демонстрационная запись, роль ей менять нечему');
  if(u.role === 'админ') return toast('Права администратора снимаются в data/config.php на хостинге');
  const next = u.role === 'эксперт' ? 'user' : 'expert';
  if(SYNC.alive === false) return toast('Роль меняется только при подключённом сервере');
  const r = await apiCall('grant', { email:u.m, role:next }, { silent:true });
  if(!r) return toast(SYNC.lastError || 'Не получилось поменять роль');
  if(next === 'expert') bindExpert(u.m, u.n);
  await pullUsers();
  render();
  toast(next === 'expert' ? 'Теперь эксперт' : 'Роль эксперта снята');
}

/* Аккаунт и карточка эксперта связываются почтой. Без этой связки кабинет
   открывался на чужом профиле, а сервер не мог понять, чьи это материалы. */
function bindExpert(mail, name){
  const key = String(mail || '').toLowerCase();
  if(!key) return;
  if(EXPERTS.some(x => String(x.email || '').toLowerCase() === key)) return;
  const byName = EXPERTS.find(x => !x.email && x.n === name);
  if(byName){ byName.email = key; }
  else EXPERTS.push({id:'e' + Date.now().toString(36), n:name || 'Эксперт',
    r:'Специализация', rate:5.0, c:'#8054B8', t:[], email:key, exp:0});
  syncPush(['experts'], true);
}

async function removeUser(id){
  const u = allUsers().find(x => x.id === id);
  if(!u) return;
  if(!u.real) return toast('Это демонстрационная запись, её нельзя удалить');
  if(!confirm('Удалить аккаунт ' + u.m + '? Вместе с ним пропадут прогресс и переписка. Отменить будет нельзя.')) return;
  if(SYNC.alive === false) return toast('Удаление работает только при подключённом сервере');
  const r = await apiCall('user_delete', { email:u.m }, { silent:true });
  if(!r) return toast(SYNC.lastError || 'Не получилось удалить');
  const all = DB.users(); delete all[String(u.m).toLowerCase()]; DB.saveUsers(all);
  render();
  toast('Аккаунт удалён');
}

/* ---------- мероприятия ---------- */
/* =====================================================================
   ДОХОДИМОСТЬ
   Главная метрика по мероприятиям: сколько женщин из записавшихся
   действительно пришли. Считается по бесплатным — там отказ ничего не
   стоит, и именно там доходимость проседает.
   ===================================================================== */
function adReach(){
  const rev = S.reviews || [];
  const free = EVENTS.filter(e => !e.price);

  /* считаем по тем, где уже есть ответы: цифра появляется сразу,
     как только пришёл первый ответ, а не ждёт конца месяца */
  const rows = free.map(e => {
    const mine = rev.filter(r => r.eid === e.id);
    const came = mine.filter(r => r.came).length;
    const rates = mine.filter(r => r.rate > 0).map(r => r.rate);
    return {e, asked:mine.length, came,
      rate: rates.length ? (rates.reduce((a,b) => a + b, 0) / rates.length) : 0};
  }).filter(r => r.asked);

  const asked = rows.reduce((n, r) => n + r.asked, 0);
  const came  = rows.reduce((n, r) => n + r.came, 0);
  const share = asked ? Math.round(came / asked * 100) : 0;
  const allRates = rev.filter(r => r.rate > 0).map(r => r.rate);
  const avg = allRates.length ? (allRates.reduce((a,b) => a + b, 0) / allRates.length) : 0;
  const why = rev.filter(r => r.why).slice(-6).reverse();

  return `
  <div class="sec-h"><h2 class="serif">Доходимость</h2>
    <span class="small muted">бесплатные мероприятия</span></div>
  <div class="reach">
    <div class="rtile"><b>${share}%</b><span>дошли из записавшихся</span></div>
    <div class="rtile"><b>${came} из ${asked}</b><span>ответили, что были</span></div>
    <div class="rtile"><b>${avg ? avg.toFixed(1) : '—'}</b><span>средняя оценка</span></div>
  </div>
  ${rows.length ? `<div class="tablewrap"><table class="reachtab">
      <thead><tr><th>Мероприятие</th><th>Записалось</th><th>Дошло</th><th>Оценка</th></tr></thead>
      <tbody>${rows.map(r => {
        const p = r.asked ? Math.round(r.came / r.asked * 100) : 0;
        return `<tr>
          <td class="nm"><b>${esc(r.e.t)}</b>
            <span>${new Date(r.e.d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span></td>
          <td>${r.asked}</td>
          <td><span class="bar"><i style="width:${p}%"></i></span>${r.came} · ${p}%</td>
          <td>${r.rate ? r.rate.toFixed(1) : '—'}</td>
        </tr>`; }).join('')}</tbody>
    </table></div>`
    : `<div class="empty">Пока никто не ответил на вопрос «получилось прийти».
        Цифры появятся на следующий день после первого бесплатного мероприятия.</div>`}
  ${why.length ? `<div class="sec-h" style="margin-top:18px"><h2 class="serif" style="font-size:17px">Что помешало и что не так</h2></div>
    ${why.map(r => `<div class="card" style="padding:11px 13px;margin-bottom:8px">
      <div class="small muted" style="font-size:11.5px">${esc(r.who)} · ${esc(r.title)}${
        r.rate ? ' · оценка ' + r.rate : ''}</div>
      <div style="font-size:13.5px;margin-top:3px">${esc(r.why)}</div>
    </div>`).join('')}` : ''}`;
}

function adIdeas(){
  const news = S.ideas.filter(i => i.st === 'новое').sort((a,b) => b.v - a.v);
  const log = S.ideas.filter(i => i.st !== 'новое').sort((a,b) => b.v - a.v);

function ideaCard(i){
  const PR = ['высокий','средний','низкий'];
  const ST = ['новое','в бэклоге','в работе','готово','отклонено'];
  return `<div class="card">
    <div class="spread" style="margin-bottom:6px"><span class="chip pale">${esc(i.a)}</span>
      <span class="small muted">${esc(i.d)} · ${i.v} голосов</span></div>
    <b style="font-size:14px">${esc(i.t)}</b>
    <div class="small muted" style="margin:8px 0 5px">Статус</div>
    <div class="chips">${ST.map(s => `<button class="chip ${i.st===s?'on':''}" onclick="setIdea('${attJs(i.id)}','st','${attJs(s)}')">${s}</button>`).join('')}</div>
    <div class="small muted" style="margin:3px 0 5px">Приоритет</div>
    <div class="chips">${PR.map(s => `<button class="chip ${i.pr===s?'on':''}" onclick="setIdea('${attJs(i.id)}','pr','${attJs(s)}')">${s}</button>`).join('')}</div>
  </div>`;
}
function setIdea(id, f, v){ const i = S.ideas.find(x => x.id === id); i[f] = v;
  if(f === 'st' && v !== 'новое' && i.pr === '—') i.pr = 'средний'; render(); }

function exportUsers(){
  const rows = [['Имя','Почта','Телеграм','Роль','Доступ','Вовлечённость','Статус','Комментарий']]
    .concat(allUsers().map(u => [u.n,u.m,u.tg||'',u.role,u.gift?'подарен':u.pay,u.eng+'%',u.st||'',u.note||'']));
  const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,%EF%BB%BF' + encodeURIComponent(csv);
  a.download = 'eva-users.csv'; a.click();
  toast('CSV выгружен');
}

function eduQueue(){
  const out = [];
  EXPERTS.forEach(e => (e.edu||[]).forEach(x => { if(x.st === 'pending') out.push({e, x}); }));
  return out;
}

function setItem(id, f, v){ const x = itemById(id); if(x){ x[f] = v; pushShared(); render(); } }

/* направление материала: подсветка меняется на месте, экран не дёргается */
function tgTopic(btn, id, k){
  const x = itemById(id);
  if(!x) return;
  x.topics = Array.isArray(x.topics) ? x.topics : [];
  const on = x.topics.includes(k);
  x.topics = on ? x.topics.filter(t => t !== k) : [...x.topics, k];
  btn.classList.toggle('on', !on);
  pushShared();
}
function setQuiet(id, f, v){ const x = itemById(id); if(x) x[f] = v; }

function openCourseEditor(id){ S.editCourse = id; S.sheet = null; render(); window.scrollTo(0,0); }
function closeCourseEditor(){ S.editCourse = null; S.editUnit = null; render(); window.scrollTo(0,0); }

function modulesOf(cid){
  if(!S.modules) S.modules = {};
  if(!S.modules[cid]){
    const src = MODULES[cid] || [[1,'Модуль 1', lessonsOf(cid).map(l => l.n)]];
    S.modules[cid] = src.map(([n,t,units]) => ({n, t, units:[...units]}));
  }
  return S.modules[cid];
}
function publishCourse(cid){
  const c = COURSES.find(x => x.id === cid);
  const ls = lessonsOf(cid);
  if(!ls.length) return toast('Добавь хотя бы один урок');
  if(!ls.some(l => l.free)) return toast('Открой хотя бы один урок как витрину');
  c.draft = false; c.n = ls.length;
  pushShared(); render(); toast('Курс опубликован в каталоге');
}

/* Удаление курса: вместе с уроками, модулями и описанием — иначе они
   остаются висеть в данных и всплывают в других списках. */
function delCourse(cid){
  const c = COURSES.find(x => x.id === cid);
  if(!c) return;
  const ls = lessonsOf(cid).length;
  if(!confirm('Удалить курс «' + c.t + '»' + (ls ? ' вместе с ' + plural(ls,'уроком','уроками','уроками') : '') +
              '? Вернуть будет нельзя.')) return;
  COURSES.splice(COURSES.indexOf(c), 1);
  if(S.lessons) delete S.lessons[cid];
  if(S.modules) delete S.modules[cid];
  if(typeof COURSE_INFO !== 'undefined') delete COURSE_INFO[cid];
  if(typeof COURSE_TAGS !== 'undefined') delete COURSE_TAGS[cid];
  if(typeof COURSE_KIND !== 'undefined') delete COURSE_KIND[cid];
  S.editCourse = null; S.course = null;
  render(); syncPush(['courses','lessons','modules','courseInfo','courseTags','courseKind'], true);
  toast('Курс удалён');
}

/* Удаление модуля: уроки внутри него удаляются вместе с ним, иначе они
   пропадают из программы, но остаются в данных. */
function delModule(cid, mi){
  const mods = modulesOf(cid), m = mods[mi];
  if(!m) return;
  const n = (m.units || []).length;
  if(!confirm('Удалить модуль «' + m.t + '»' + (n ? ' вместе с ' + plural(n,'уроком','уроками','уроками') : '') + '?')) return;
  const ls = lessonsOf(cid);
  (m.units || []).forEach(un => {
    const i = ls.findIndex(l => l.n === un);
    if(i >= 0) ls.splice(i, 1);
  });
  mods.splice(mi, 1);
  mods.forEach((x, i) => x.n = i + 1);              // нумерация не должна рваться
  render(); syncPush(['lessons','modules'], true);
  toast('Модуль удалён');
}

function addModule(cid){
  const m = modulesOf(cid);
  m.push({n:m.length+1, t:'Новый модуль', units:[]});

}
function renameModule(cid, mi){
  const m = modulesOf(cid)[mi];
  const t = prompt('Название модуля', m.t);

  render();

function addUnitTo(cid, mi){
  const ls = lessonsOf(cid), n = ls.length + 1;
  const l = {id:cid+'_'+n, n, t:'Новый урок', d:'', min:12, done:false, video:'', free:false};

}

/* =====================================================================
   СИНХРОНИЗАЦИЯ С СЕРВЕРОМ v2

   Главное отличие от первой версии: на сервер уходят отдельные ветки,
   а не всё состояние целиком, и в них никогда не попадает base64 картинок —
   только ссылки на файлы в /uploads. Именно из-за этого раньше молча
   срабатывал лимит post_max_size и данные не сохранялись.
   ===================================================================== */

/* ─────────────────────────────────────────────────────────────────
   ВХОД НА СЕРВЕР
   Общего ключа больше нет. Приложение входит по почте и паролю,
   сервер выдаёт токен сессии и сам решает, что этой женщине можно.
   Права администратора выдаются в файле data/config.php на хостинге.
   ───────────────────────────────────────────────────────────────── */

const SYNC = {
  base: 'api.php',
  alive: null,          // null — ещё не проверяли
  rev: 0,
  lastCode: 0,          // код последнего ответа сервера
  lastError: '',
  lastSaved: 0,
  queue: {},            // ветки, ждущие отправки
  sending: false,
  ready: null,          // обещание первой проверки связи
  get token(){ return Store.get('eva_token', ''); },
  set token(v){ v ? Store.set('eva_token', v) : Store.del('eva_token'); }
};

/* местная копия профиля: чтобы приложение открывалось и без сети */
function mirrorUser(u){
  if(!u || !u.email) return;
  const mail = String(u.email).toLowerCase();
  const all = DB.users();
  all[mail] = Object.assign({}, all[mail], {
    email: mail, name: u.name, role: u.role || 'user',
    verified: !!u.verified, created: u.created || Date.now()
  });
  DB.saveUsers(all);
}

/* сервер сказал, что токен больше не годится */
function dropSession(){
  SYNC.token = '';
  if(!S.user) return;
  const last = S.user.email;
  DB.clearSession();
  S.user = null; S.role = 'user'; S.avatar = '';
  S.auth = {mode:'login', email:last, pass:'', name:'',
    err:'Сессия истекла, войди ещё раз', code:'', sent:'', remember:true};
  S.screen = 'auth'; S.page = null; S.sheet = null; S.course = null;
  render(); stars();
}

async function apiCall(action, body, opts){
  opts = opts || {};
  if(SYNC.alive === false && !opts.force) return null;
  try {
    const tok = SYNC.token;
    let payload = null;
    if(body){
      payload = JSON.stringify(tok ? Object.assign({ token:tok }, body) : body);
      if(payload.length > 6_000_000){
        SYNC.lastError = 'пакет ' + Math.round(payload.length/1048576) + ' МБ — больше лимита хостинга. Сохраняю частями';
        return null;
      }
    }
    const init = payload
      ? { method:'POST', headers:{'Content-Type':'application/json'}, body:payload }
      : { cache:'no-store' };
    const url = SYNC.base + '?action=' + action + (tok && !payload ? '&token=' + encodeURIComponent(tok) : '');
    const res = await fetch(url, init);
    let j = null;
    try { j = await res.json(); }
    catch(e){ throw new Error('сервер ответил не в формате JSON (код ' + res.status + ')'); }
    if(!j.ok){
      SYNC.lastError = j.error || ('ошибка ' + res.status);
      SYNC.lastCode = res.status;              // 403 — запрещено навсегда, повтор не поможет
      if(res.status === 401 && tok) dropSession();
      if(!opts.silent) toast('Не сохранилось: ' + SYNC.lastError);
      return null;
    }
    SYNC.lastCode = 200;
    SYNC.lastError = '';
    return j;
  } catch(e){
    SYNC.lastError = e.message || 'нет связи с сервером';
    SYNC.lastCode = 0;                         // связи нет — повторить стоит
    if(!opts.silent) toast('Нет связи с сервером');
    return null;
  }
}

/* ---------- ветки общих данных ----------
   Всё, что здесь, видно каждому. Картинки хранятся ссылками. */
const BRANCHES = {
  lib:        () => LIB.map(clean),
  courses:    () => COURSES.map(clean),
  lessons:    () => S.lessons || {},
  modules:    () => S.modules || {},
  courseInfo: () => COURSE_INFO,
  courseTags: () => COURSE_TAGS,
  courseKind: () => COURSE_KIND,
  goods:      () => GOODS.map(clean),
  goodInfo:   () => GOOD_INFO,
  events:     () => EVENTS.map(clean),
  groups:     () => GROUPS.map(clean),
  experts:    () => EXPERTS.map(clean),
  pending:    () => S.pending || [],
  media:      () => mediaLinks(),
  videos:     () => S.videos || {},
  covPos:     () => S.covPos || {},
  wall:       () => (typeof WALL !== 'undefined' ? WALL.map(shareable) : []).concat(TOMBS.wall),
  chats:      () => Object.keys(S.chats || {}).reduce((acc, g) =>
                acc.concat((S.chats[g] || []).filter(m => m && m.id)
                  .map(m => ({...m, g, own:undefined}))), []).concat(TOMBS.chats),
  support:    () => (typeof INBOX !== 'undefined' ? INBOX : []),
  orders:     () => [...(typeof ORDERS !== 'undefined' ? ORDERS : []), ...(S.orders || [])],
  questions:  () => [...(typeof GOOD_QS !== 'undefined' ? GOOD_QS : []), ...(S.qs || [])],
  ideas:      () => S.ideas || [],
  adminInfo:  () => ({name:S.adminName, avatar:S.adminAvatar}),
  avatars:    () => AVATARS,
  replies:    () => S.marketReplies || [],
  reviews:    () => S.reviews || [],
  /* отметки «зашло» под посланиями дня: по записи на женщину и послание */
  tipstars:   () => (typeof TIP_VOTES !== 'undefined' ? TIP_VOTES : [])
};

const clean = o => JSON.parse(JSON.stringify(o));

/* Надгробия: общий раздел на сервере умеет дописывать и обновлять записи,
   но не умеет стирать — иначе одна женщина могла бы вычистить чужое.
   Поэтому удалённое уезжает не «пропажей», а пометкой del: сервер обновит
   запись по номеру, а при загрузке помеченное мы просто не показываем. */
const TOMBS = {wall: [], chats: []};
function tombWall(id){ TOMBS.wall.push({id: String(id), del: true, a: '', t: ''}); }
function tombChat(gid, m){
  if(m && m.id) TOMBS.chats.push({id: String(m.id), g: gid, del: true, a: '', c: ''});
}
const alive = list => (Array.isArray(list) ? list.filter(x => x && !x.del) : list);

/* Из общих записей убираем всё, что верно только на этом устройстве.
   Метка «моё» раньше уезжала на сервер, и чужие послания приходили к другим
   помеченными как свои — вместе с чужой аватаркой. Автор теперь узнаётся
   по почте, а метка остаётся только в памяти браузера. */
function shareable(rec){
  const out = clean(rec);
  delete out.own; delete out.photo; delete out.kind; delete out.ints;
  if(out.email) out.email = String(out.email).toLowerCase();
  if(Array.isArray(out.comments)) out.comments = out.comments.map(c => {
    const cc = Object.assign({}, c); delete cc.own;
    if(cc.email) cc.email = String(cc.email).toLowerCase();
    return cc;
  });
  return out;
}

/* В общие данные попадают только ссылки на файлы, не base64.
   Аватарки не кладём: у них своя защищённая ветка, где каждая может писать
   только свою строку. Через общий справочник картинок чужое фото можно было
   бы подменить. */
function mediaLinks(){
  const out = {};
  Object.keys(MEDIA).forEach(k => {
    const v = MEDIA[k];
    if(k.indexOf('ava_') === 0) return;
    if(typeof v === 'string' && !v.startsWith('data:')) out[k] = v;
  });
  return out;
}

/* ---------- сохранение ---------- */
let syncTimer = null;

/* Что кому разрешено писать. Раньше отправляли всё подряд, и сервер отвечал
   «раздел lib меняют только эксперты и администраторы» — а падал при этом
   весь пакет целиком, вместе с посланием или сообщением, ради которых его
   и отправляли. Ветка, которую эта роль всё равно не запишет, теперь просто
   не уезжает. */
const OPEN_PUSH = ['wall','chats','groups','events','orders','questions',
                   'support','ideas','media','reviews','avatars','tipstars'];
function mayPush(b){
  if(S.role === 'admin')  return true;
  if(S.role === 'expert') return b !== 'adminInfo';
  return OPEN_PUSH.indexOf(b) >= 0;
}

/* поставить ветки в очередь; без аргументов — все, что относится к контенту */
function syncPush(branches, immediate){
  if(SYNC.alive === false) return;
  const list = branches || ['lib','courses','lessons','modules','courseInfo','courseTags','courseKind',
    'goods','goodInfo','events','experts','pending','media','videos','covPos','adminInfo','avatars',
    'groups','chats'];
  list.forEach(b => { if(BRANCHES[b] && mayPush(b)) SYNC.queue[b] = true; });
  if(!Object.keys(SYNC.queue).length) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flushSync, immediate ? 0 : 800);
}

async function flushSync(){
  if(SYNC.sending || SYNC.alive === false) return;
  const names = Object.keys(SYNC.queue);
  if(!names.length) return;
  SYNC.sending = true;
  SYNC.queue = {};

  const parts = {};
  names.forEach(b => { try { parts[b] = BRANCHES[b](); } catch(e){} });

  // если пакет слишком большой — режем по одной ветке
  const size = JSON.stringify(parts).length;
  let okAll = true;
  if(size > 1_200_000){
    for(const b of names){
      const r = await apiCall('patch', { parts:{ [b]: parts[b] } });
      if(!r) okAll = false; else SYNC.rev = r.rev;
    }
  } else {
    const r = await apiCall('patch', { parts });
    if(!r) okAll = false; else SYNC.rev = r.rev;
  }
  SYNC.sending = false;
  if(okAll){
    SYNC.lastSaved = Date.now();
    updateSyncBadge('saved');
    if(S.role !== 'user' && !S.sheet) render();
    return;
  }
  /* Запрет не лечится повтором: раньше такая ветка возвращалась в очередь,
     уходила снова каждые пятнадцать секунд и каждый раз перерисовывала
     страницу — со стороны это выглядело как самопроизвольная перезагрузка. */
  if(SYNC.lastCode !== 403) names.forEach(b => SYNC.queue[b] = true);
  updateSyncBadge('error');
}

/* совместимость со старыми вызовами */
function pushShared(){ syncPush(); }

/* ---------- страховка от неполных данных ----------
   Материал, курс или товар может прийти с сервера без части полей: сохранили
   старой версией, оборвалась связь, поправили руками в файле. Раньше такой
   объект ронял весь экран. Дополняем безопасными значениями — пусть лучше
   будет пусто, чем белый лист. */
const okStr = (v, d) => (typeof v === 'string' ? v : (v == null ? (d || '') : String(v)));
const okNum = (v, d) => { const n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : (d || 0); };
const okArr = v => Array.isArray(v) ? v : [];
const okObj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};

/* оставляем только записи-объекты с идентификатором и дополняем их */
function fixList(list, fill){
  return okArr(list).filter(x => x && typeof x === 'object' && x.id != null)
                    .map(x => fill(Object.assign({}, x)));
}

const FIX = {
  chats: x => {

    x.c = okStr(x.c); x.email = okStr(x.email).toLowerCase();
    x.at = okNum(x.at); x.exp = !!x.exp; x.curator = !!x.curator;
    /* метка «моё» верна только на своём устройстве: узнаём автора по почте */
    delete x.own;
    x.re = x.re && typeof x.re === 'object'
      ? {a:okStr(x.re.a), t:okStr(x.re.t)} : null;
    return x;
  },
  groups: x => {
    x.id = String(x.id); x.t = okStr(x.t, 'Сообщество');

    x.tags  = Array.isArray(x.tags)  ? x.tags.map(t => okStr(t)).filter(Boolean) : [];
    x.rules = Array.isArray(x.rules) ? x.rules.map(r => okStr(r)).filter(Boolean) : [];
    x.team  = Array.isArray(x.team) ? x.team.map(m => ({
      n:okStr(m && m.n, 'Помощница'), r:okStr(m && m.r), e:okStr(m && m.e),

      role:['owner','host','keeper'].indexOf(m && m.role) >= 0 ? m.role : 'keeper'
    })) : [];
    x.requests = Array.isArray(x.requests) ? x.requests.map(r => ({
      n:okStr(r && r.n, 'Гостья'), mail:okStr(r && r.mail).toLowerCase(),
      ago:okStr(r && r.ago, 'недавно'), t:okStr(r && r.t)
    })) : [];
    return x;
  },
  lib: x => {

    x.min = okNum(x.min, 5); x.expert = okStr(x.expert);
    x.tags = okArr(x.tags).map(t => okStr(t)); x.d = okStr(x.d); x.text = okStr(x.text);
    x.topics = okArr(x.topics).map(t => okStr(t)).filter(Boolean); x.ord = okNum(x.ord);
    x.aud = okArr(x.aud); x.days = okArr(x.days); x.level = okStr(x.level, 'any');
    return x;
  },
  courses: x => {
    x.id = String(x.id); x.t = okStr(x.t, 'Без названия'); x.e = okStr(x.e);
    x.n = okNum(x.n, 1); x.p = okNum(x.p); x.old = okNum(x.old, x.p);
    x.r = okNum(x.r, 5); x.s = okNum(x.s); x.d = okStr(x.d);
    return x;
  },
  goods: x => {
    x.id = String(x.id); x.t = okStr(x.t, 'Без названия'); x.p = okNum(x.p);
    x.c = okStr(x.c, 'Разное'); x.sh = okStr(x.sh, 'mat');

  },

    x.program = okArr(x.program).map(v => okStr(v)).filter(Boolean);

  },
  wall: x => {

    x.st = okNum(x.st);

       забываем эти поля: в ленте их больше нет */
    delete x.photo; delete x.kind; delete x.ints;
    delete x.own;                       /* чужая метка «моё» с сервера не в счёт */
    x.comments = okArr(x.comments).filter(c => c && typeof c === 'object')
                  .map(c => { const cc = {...c, a: okStr(c.a, 'Гостья'), t: okStr(c.t),
                                ago: okStr(c.ago), st: okNum(c.st),
                                email: okStr(c.email).toLowerCase()};
                              delete cc.own; return cc; });
    return x;
  },
  plain: x => x                                   // заказы, вопросы, поддержка, идеи

function fixShared(sh){
  ['lib','courses','goods','experts','events','wall'].forEach(k => {
    if(sh[k] !== undefined) sh[k] = fixList(sh[k], FIX[k]);
  });
  ['orders','questions','support','ideas','pending','replies','reviews','tipstars'].forEach(k => {
    if(sh[k] !== undefined) sh[k] = fixList(sh[k], FIX.plain);
  });
  if(sh.goodInfo !== undefined){
    const src = okObj(sh.goodInfo), out = {};
    Object.keys(src).forEach(id => {
      const i = okObj(src[id]);
      out[id] = Object.assign({}, i, {
        about: okStr(i.about), gallery: okArr(i.gallery), spec: okArr(i.spec),
        stock: okNum(i.stock, 0),
        delivery: Object.assign({free:false, price:390, cities:'', pickup:false}, okObj(i.delivery))
      });
    });
    sh.goodInfo = out;
  }
  if(sh.courseInfo !== undefined){
    const src = okObj(sh.courseInfo), out = {};
    Object.keys(src).forEach(id => {
      const i = okObj(src[id]);
      out[id] = Object.assign({}, i, {promo: okStr(i.promo), about: okStr(i.about)});
    });
    sh.courseInfo = out;
  }
  ['courseTags','courseKind','media','videos','covPos','avatars','lessons','modules'].forEach(k => {
    if(sh[k] !== undefined) sh[k] = okObj(sh[k]);
  });
  return sh;
}

/* ---------- чтение ---------- */
function applyShared(sh){
  if(!sh || typeof sh !== 'object') return false;
  try { sh = fixShared(sh); }
  catch(e){ console.error('[Eva] данные с сервера пришли в неожиданном виде:', e); }
  const repl = (arr, data) => { if(Array.isArray(data) && data.length){ arr.length = 0; data.forEach(x => arr.push(x)); } };
  repl(LIB, sh.lib);
  repl(COURSES, sh.courses);
  repl(GOODS, sh.goods);
  repl(EVENTS, sh.events);
  repl(GROUPS, sh.groups);
  if(typeof WALL !== 'undefined')  repl(WALL, alive(sh.wall));
  if(typeof INBOX !== 'undefined') repl(INBOX, sh.support);
  if(Array.isArray(sh.experts)) sh.experts.forEach(e => {
    const cur = EXPERTS.find(x => x.id === e.id);
    if(cur) Object.assign(cur, e); else EXPERTS.push(e);
  });
  const maps = {courseInfo:COURSE_INFO, courseTags:COURSE_TAGS, courseKind:COURSE_KIND, goodInfo:GOOD_INFO};
  Object.keys(maps).forEach(k => { if(sh[k] && typeof sh[k] === 'object') Object.assign(maps[k], sh[k]); });
  if(sh.media)   Object.assign(MEDIA, sh.media);
  if(Array.isArray(sh.chats) && sh.chats.length){
    /* обратно из плоского списка в переписку по группам, по времени */
    const by = {};
    sh.chats.forEach(m => {
      const g = okStr(m && m.g);
      if(!g || !m.id || m.del) return;
      (by[g] = by[g] || []).push(m);
    });
    S.chats = S.chats || {};
    Object.keys(by).forEach(g => {
      S.chats[g] = by[g].sort((a, b) => (a.at || 0) - (b.at || 0));
    });
  }
  if(sh.videos)  S.videos = Object.assign(S.videos || {}, sh.videos);
  if(sh.covPos)  S.covPos = Object.assign(S.covPos || {}, sh.covPos);
  if(sh.lessons) S.lessons = Object.assign(S.lessons || {}, sh.lessons);
  if(sh.modules) S.modules = Object.assign(S.modules || {}, sh.modules);
  if(Array.isArray(sh.pending) && sh.pending.length) S.pending = sh.pending;
  if(Array.isArray(sh.ideas)   && sh.ideas.length)   S.ideas = sh.ideas;
  if(Array.isArray(sh.replies)) S.marketReplies = sh.replies;
  if(Array.isArray(sh.reviews)) S.reviews = sh.reviews;
  if(Array.isArray(sh.tipstars)) TIP_VOTES = sh.tipstars.filter(v => v && v.id && v.k);
  /* снятые звёзды приходят пометками — свои отметки восстанавливаем по ним же */
  if(Array.isArray(sh.tipstars) && S.user && S.user.email){
    const me = String(S.user.email).toLowerCase();
    S.tipStars = TIP_VOTES.filter(v => !v.del && v.id === v.k + '__' + me).map(v => v.k);
  }
  if(sh.avatars && typeof sh.avatars === 'object'){
    Object.keys(sh.avatars).forEach(m => {
      const key = String(m).toLowerCase();
      if(sh.avatars[m] && typeof sh.avatars[m] === 'string') AVATARS[key] = sh.avatars[m];
    });
    const me = S.user ? String(S.user.email).toLowerCase() : '';
    if(me && AVATARS[me]) S.avatar = AVATARS[me];
  }
  if(sh.adminInfo && typeof sh.adminInfo === 'object'){
    if(sh.adminInfo.name) S.adminName = sh.adminInfo.name;
    if(sh.adminInfo.avatar) S.adminAvatar = sh.adminInfo.avatar;
  }
  if(Array.isArray(sh.orders) && typeof ORDERS !== 'undefined'){
    ORDERS.length = 0; sh.orders.forEach(o => ORDERS.push(o)); S.orders = [];
  }
  if(Array.isArray(sh.questions) && typeof GOOD_QS !== 'undefined'){
    GOOD_QS.length = 0; sh.questions.forEach(q => GOOD_QS.push(q)); S.qs = [];
  }
  return true;
}

async function syncPull(silent){
  /* фоновая проверка: сначала спрашиваем только номер версии — это
     несколько байт вместо всей базы. Тянем данные, лишь если он другой. */
  if(silent && SYNC.rev){
    const head = await apiCall('rev', null, { silent:true });
    if(head && head.rev === SYNC.rev) return false;
  }
  const r = await apiCall('state', null, { silent:true });
  if(!r) return false;
  if(r.rev === SYNC.rev && silent) return false;
  SYNC.rev = r.rev;
  const changed = applyShared(r.shared);
  if(changed && !silent) render();
  return changed;
}

/* ---------- личные сообщения от платформы ----------
   Лежат на сервере отдельно от общих данных: каждая женщина забирает только
   свои. Поэтому и читаем их отдельным запросом, а не из общего состояния. */
async function pullDm(){
  if(SYNC.alive === false || !SYNC.token || !S.user || !S.user.email) return false;
  const r = await apiCall('dm_get', null, { silent:true });
  if(!r || !Array.isArray(r.dm) || !r.dm.length) return false;
  if(typeof initInbox === 'function') initInbox();
  S.seenDm = S.seenDm || [];
  const fresh = r.dm.filter(m => m && m.id && S.seenDm.indexOf(m.id) < 0);
  if(!fresh.length) return false;

  let th = (S.inbox || []).find(x => x.kind === 'платформа');
  if(!th){
    th = {id:'pf' + Date.now().toString(36), from:'Eva Space', c:'#111014',
          kind:'платформа', ago:'только что', unread:false, sys:true, msgs:[]};
    S.inbox.unshift(th);
  }
  fresh.forEach(m => {
    const d = new Date(m.at || Date.now());
    const tm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    th.msgs.push({me:false, t:(m.subject ? m.subject + ' — ' : '') + m.text, tm});
    S.seenDm.push(m.id);
  });
  th.unread = true;
  if(typeof schedulePersist === 'function') schedulePersist();
  return true;
}

/* Список аккаунтов сервер отдаёт только администратору.
   Данные сервера главнее местной копии: иначе роль, имя и отметка о почте
   остаются старыми — например, только что выданная роль эксперта тут же
   затирается тем, что лежало в браузере. Местные поля, которых на сервере
   нет (пароль для работы без сети), при этом сохраняются. */
async function pullUsers(){
  if(S.role !== 'admin') return;
  const r = await apiCall('users', null, { silent:true });
  if(!r || !r.users || typeof r.users !== 'object') return;
  const local = DB.users(), merged = {};
  Object.keys(local).forEach(k => merged[k] = local[k]);
  Object.keys(r.users).forEach(k => merged[k] = Object.assign({}, local[k], r.users[k]));
  DB.saveUsers(merged);
}
async function pushProgress(){
  if(SYNC.alive === false || !S.user || !S.user.email) return;
  const d = DB.progress(S.user.email);
  if(d) await apiCall('progress_save', { email:S.user.email, progress:d }, { silent:true });
}
async function pullProgress(email){
  const r = await apiCall('progress_get&email=' + encodeURIComponent(email), null, { silent:true });
  if(!r || !r.progress) return false;
  const local = DB.progress(email);
  if(local && (local.savedAt || 0) > (r.progress.savedAt || 0)){
    await apiCall('progress_save', { email, progress:local }, { silent:true });
    return true;
  }
  DB.saveProgress(email, r.progress);
  return true;
}
