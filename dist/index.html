<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Eva Space</title>
<meta name="description" content="Eva Space — платформа женского развития: личная программа, практики, курсы экспертов.">
<meta name="theme-color" content="#111014">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eva Space">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   EVA SPACE — дизайн-система v2: графит + приглушённая фуксия
   ===================================================================== */
:root{
  --ink:#111014; --ink-2:#1C1A21; --ink-3:#2A272F;
  --paper:#F7F6F4; --surface:#FFFFFF; --surface-2:#F1EFEC;
  --muted:#7E7A85; --line:rgba(17,16,20,.09); --line-2:rgba(17,16,20,.16);
  --accent:#A8375C; --accent-2:#C2506F; --accent-soft:#F7E9EE;
  --gold:#B8894A; --ok:#3F7D62; --warn:#B4642A; --lilac:#6C5CE0;
  --grad-dark:linear-gradient(155deg,#1A171F 0%,#2B2233 55%,#4A2C42 100%);
  --sh-1:0 1px 2px rgba(17,16,20,.05);
  --sh-2:0 4px 18px rgba(17,16,20,.07);
  --sh-3:0 16px 44px rgba(17,16,20,.14);
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:28px;
  --shell:430px; --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);
  color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:15px;letter-spacing:-.006em}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font-family:inherit;font-size:15px;letter-spacing:-.006em}
::-webkit-scrollbar{display:none}
img{max-width:100%}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.serif{font-family:Inter,sans-serif;font-weight:700;letter-spacing:-.038em;line-height:1.13}
.logo{font-family:Unbounded,Inter,sans-serif;font-weight:300;letter-spacing:.18em}
.small{font-size:13px;line-height:1.5}
.muted{color:var(--muted)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1.serif{font-size:26px;margin:0}
h2.serif{font-size:19px;margin:0}

.shell{max-width:var(--shell);margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + 58px + env(safe-area-inset-bottom))}
.pad{padding:0 16px}
.view{animation:up .3s cubic-bezier(.2,.75,.3,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.anim-up{animation:up .45s cubic-bezier(.2,.75,.3,1) forwards}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.24s}

.sky{position:fixed;inset:0;background:var(--grad-dark);z-index:0}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.night{position:relative;z-index:1;color:#fff;min-height:100vh;display:flex;flex-direction:column;
  max-width:var(--shell);margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom))}
.night .muted{color:rgba(255,255,255,.6)}
.night .field{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#fff}
.night .field::placeholder{color:rgba(255,255,255,.4)}
.night .btn.ghost{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.16)}

.hero{background:var(--grad-dark);color:#fff;border-radius:0 0 var(--r-xl) var(--r-xl);
  padding:calc(14px + env(safe-area-inset-top)) 16px 20px;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.6)}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:relative;z-index:2}
.brandbar .b{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;opacity:.85}
.ava{border-radius:50%;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px;position:relative;z-index:2}
.stats div,.stats button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);
  padding:10px 6px;text-align:center;color:#fff}
.stats b{display:block;font-size:21px;font-weight:700;line-height:1.1;letter-spacing:-.035em;display:flex;align-items:center;justify-content:center;gap:4px}
.stats span{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;font-weight:700}
.levelbar{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:7px 12px;margin-top:8px;position:relative;z-index:2;width:100%;text-align:left;color:#fff}
.lchip{background:#fff;color:var(--ink);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700;flex:none}

.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1);margin-bottom:12px;border:1px solid var(--line)}
.card.p0{padding:0;overflow:hidden}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec-h h2{font-size:20px;margin:0}
.link{font-size:12px;font-weight:600;color:var(--accent)}

.btn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;padding:12px;border-radius:var(--r);
  font-weight:600;font-size:14px;transition:.16s}
.btn:hover{background:var(--ink-3)}
.btn.acc{background:var(--accent)}
.btn.acc:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.done{background:#EAF2ED;color:var(--ok)}
.btn.sm{padding:8px 14px;font-size:12.5px;width:auto;display:inline-block;border-radius:var(--r-sm)}
.btn.xs{padding:6px 11px;font-size:11.5px;width:auto;display:inline-block;border-radius:var(--r-xs)}
.btn[disabled]{opacity:.4;pointer-events:none}
.acts{display:flex;gap:8px;margin-top:10px}
.acts .btn{flex:1;width:auto}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.14s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.pale{background:var(--surface-2);border-color:transparent;color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;padding:8px 6px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--muted);line-height:1.2;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 5px;text-align:center}
.quick i{display:block;font-size:16px;font-style:normal;margin-bottom:4px}
.quick span{font-size:10px;font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px}
.hscroll > *{flex:none;width:180px}

.week{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.wd{flex:none;width:44px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 0;text-align:center;position:relative;transition:.16s}
.wd span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted)}
.wd b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.wd .pips{display:flex;gap:3px;justify-content:center;margin-top:4px}
.pip{width:4px;height:4px;border-radius:50%;background:var(--line-2)}
.pip.on{background:#E7A339}
/* выбранный день был почти чёрным, и точки дел на нём пропадали:
   глубокий фиолетовый плюс золотые точки — тот же цвет отметок, что и везде */
.wd.sel{background:linear-gradient(155deg,#3B2851,#221733);color:#fff;border-color:transparent}
.wd.sel span{color:rgba(255,255,255,.62)}
.wd.sel .pip{background:rgba(255,255,255,.28)}
.wd.sel .pip.on{background:#E7A339;box-shadow:0 0 0 1px rgba(231,163,57,.3)}
.wd.today{border-color:var(--accent)}
.wd.locked{opacity:.45}
.wstar{position:absolute;top:-4px;right:-2px;font-size:10px;color:var(--gold)}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:9px}
.lesson .cov{position:relative;height:156px;cursor:pointer}
/* только сама обложка: без > правило растягивало на всю карточку и галочку
   внутри отметки — она перекрывала обложку и съедала нажатие */
.lesson .cov > svg,.lesson .cov > img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:rgba(17,16,20,.72);color:#fff;backdrop-filter:blur(8px);
  border-radius:999px;padding:4px 10px;font-size:10px;font-weight:600;z-index:3}
.cov .cap{position:absolute;left:12px;right:12px;bottom:10px;z-index:3;color:#fff}
.cov .cap b{font-size:16px;display:block;line-height:1.25;letter-spacing:-.02em}
.cov .cap span{font-size:11px;opacity:.8;font-weight:500}
.cov:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(17,16,20,.62),transparent 58%);z-index:1}
.play{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;
  background:rgba(17,16,20,.4);backdrop-filter:blur(4px);display:grid;place-items:center;
  z-index:3;color:rgba(255,255,255,.9);font-size:9px;border:1px solid rgba(255,255,255,.25)}
.lesson .body{padding:12px 14px 14px}

.crow{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px;margin-bottom:8px;width:100%;text-align:left;align-items:center}
.crow .mini{width:80px;height:56px;border-radius:var(--r-sm);overflow:hidden;flex:none;position:relative;background:var(--surface-2)}
.crow .mini svg,.crow .mini img{width:100%;height:100%;display:block;object-fit:cover}
.arow2{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:9px;margin-bottom:8px}
.arow2 .mini{width:70px;height:50px;border-radius:var(--r-xs);overflow:hidden;flex:none;background:var(--surface-2)}
.arow2 .mini svg,.arow2 .mini img{width:100%;height:100%;display:block;object-fit:cover}

.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.price{font-weight:700;font-size:15px;letter-spacing:-.02em}
.old{color:var(--muted);text-decoration:line-through;font-size:12px;font-weight:500;margin-left:5px}

.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prod .ph{height:132px;position:relative}
.prod .ph svg,.prod .ph img{width:100%;height:100%;display:block;object-fit:cover}
.prod .info{padding:10px 11px 11px}
.prod .nm{font-size:12.5px;font-weight:600;line-height:1.3;min-height:32px}
.flag{position:absolute;top:8px;left:8px;background:rgba(17,16,20,.72);color:#fff;border-radius:999px;
  padding:3px 9px;font-size:9.5px;font-weight:600;z-index:2}

.exp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center}
.pcirc{width:58px;height:58px;border-radius:50%;overflow:hidden;margin:0 auto;background:var(--surface-2)}
.pcirc svg,.pcirc img{width:100%;height:100%;display:block;object-fit:cover}
.vt{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--lilac);
  color:#fff;font-size:8.5px;vertical-align:middle}
.vt.big{width:18px;height:18px;font-size:10px}
.dot-ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11.5px;flex:none}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--shell);
  background:rgba(247,246,244,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:40}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:600;color:var(--muted);padding:3px 0}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.fab{position:fixed;right:calc(50% - var(--shell)/2 + 14px);bottom:calc(var(--nav-h) + 48px + env(safe-area-inset-bottom));
  width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:45;box-shadow:var(--sh-3)}
@media(max-width:462px){.fab{right:14px}}
.backbtn{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;margin:14px 0 2px}

.bg{position:fixed;inset:0;background:rgba(17,16,20,.55);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;animation:fade .18s both;backdrop-filter:blur(2px)}
.sheet{background:var(--paper);width:100%;max-width:var(--shell);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  animation:slide .28s cubic-bezier(.2,.75,.3,1) both}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.grab{width:34px;height:4px;background:var(--line-2);border-radius:99px;margin:0 auto 12px}

.field{width:100%;padding:12px 13px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);margin-bottom:9px}
.field:focus{outline:none;border-color:var(--ink)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 6px;display:block}
.sw{width:42px;height:25px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:.18s}
.sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.18s;box-shadow:var(--sh-1)}
.sw.on{background:var(--ink)}
.sw.on i{left:20px}
.optl{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin-bottom:8px;font-size:14px;font-weight:500}
.optl:hover{border-color:var(--ink)}
.opt{width:100%;text-align:left;display:flex;gap:11px;align-items:center;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:13px;margin-bottom:8px;color:#fff;transition:.14s}
.opt.on{background:rgba(255,255,255,.14);border-color:#fff}
.opt i{font-size:17px;font-style:normal;flex:none;opacity:.9}
.opt b{font-size:14px;font-weight:600;display:block}
.opt small{opacity:.6;font-size:11.5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 74px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:600;z-index:90;animation:slide .22s both;box-shadow:var(--sh-3)}
.empty{text-align:center;padding:38px 18px;color:var(--muted);font-size:13.5px}
.qm{width:17px;height:17px;border-radius:50%;background:var(--surface-2);color:var(--muted);
  font-size:10px;font-weight:700;flex:none;display:inline-grid;place-items:center;line-height:1;border:1px solid var(--line)}
.hero .qm{background:rgba(255,255,255,.14);color:#fff;border-color:transparent}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) var(--r) 5px;
  padding:11px 13px;font-size:13.5px;line-height:1.5;margin-bottom:8px}
.bubble.me{border-radius:var(--r) var(--r) 5px var(--r);background:var(--ink);color:#fff;margin-left:36px;border-color:var(--ink)}
.rep{display:flex;align-items:flex-end;gap:5px;height:96px;margin:12px 0 6px}
.rep div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.rep i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--ink);min-height:3px;transition:height .5s}
.rep span{font-size:9px;font-weight:600;color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:center}
.wish{position:relative;z-index:2;margin-top:12px;font-size:14.5px;line-height:1.42;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:11px 13px}.advice .arow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.advice .arow:first-of-type{border-top:none;padding-top:2px}
.ae{font-size:18px;flex:none;width:24px;text-align:center}
.cday{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;position:relative}
.cday.now{border:1.5px solid var(--accent)}
.cday i{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%}
i.lg{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:3px}
.phbox{background:var(--surface-2);border-radius:var(--r-sm);padding:9px;text-align:center}
.phbox.on{background:var(--ink);color:#fff}
.camera{position:absolute;right:0;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--ink);
  color:#fff;box-shadow:var(--sh-2);font-size:13px}
.linkbox{background:var(--surface-2);border-radius:var(--r-sm);padding:9px 11px;font-size:12px;font-weight:600;word-break:break-all}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.badge-exp{background:var(--lilac);color:#fff;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:700}
.card.unread{border-left:3px solid var(--accent)}

.atabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;position:relative;z-index:2;padding-bottom:2px}
.atabs button{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  border-radius:999px;padding:7px 12px;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;position:relative}
.atabs button.on{background:#fff;color:var(--ink);border-color:#fff}
.atabs .cnt{background:var(--accent);color:#fff;border-radius:99px;padding:1px 5px;font-size:9px;margin-left:4px}
.mini-sel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;
  border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:600;max-width:150px}
.mini-sel option{color:var(--ink)}
.rolesw{position:fixed;left:50%;transform:translateX(-50%);z-index:80;display:flex;gap:2px;
  bottom:calc(var(--nav-h) + 4px + env(safe-area-inset-bottom));
  background:rgba(17,16,20,.9);backdrop-filter:blur(10px);border-radius:999px;padding:3px}
.rolesw button{padding:5px 10px;border-radius:999px;font-size:10px;font-weight:600;color:rgba(255,255,255,.55)}

.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.mphoto{position:relative;height:230px;background:var(--surface-2)}
.mphoto svg,.mphoto img{width:100%;height:100%;object-fit:cover;display:block}
/* плёнка только рисует затемнение: без этого она перехватывала нажатие
   и кнопка «Добавить фото» в анкете не работала */
.mphoto:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(12,10,16,.8),transparent 55%)}
.mname{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;color:#fff}
.mname b{display:block;font-size:19px;letter-spacing:-.02em}
.mname span{font-size:12.5px;opacity:.85}
.gslider{position:relative;border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;background:var(--surface-2)}
.gslide{height:280px}
.gslide img,.gslide svg{width:100%;height:100%;object-fit:cover;display:block}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:19px;z-index:2;box-shadow:var(--sh-2)}
.gnav.left{left:10px} .gnav.right{right:10px}
.gdots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center;z-index:2}
.gdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.gdots i.on{background:#fff;width:16px;border-radius:99px}
.galrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.buybar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;
  margin-top:14px;box-shadow:var(--sh-2)}
.wallpost{margin-top:12px}
.wallpost .chips.wrap{padding-top:2px!important}
.atabs.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;overflow:visible}
.atabs.grid button{padding:7px 4px;font-size:10px;text-align:center;white-space:normal;line-height:1.15;min-height:34px;
  display:flex;align-items:center;justify-content:center}
.regionsel{margin-bottom:10px}.poscell.on{background:var(--ink);border-color:var(--ink)}.mailbtn2{position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);
  display:grid;place-items:center;color:#fff}
.mailbtn2 svg{width:19px;height:19px}
.mdot{position:absolute;top:-2px;right:-2px;background:var(--accent);color:#fff;border-radius:999px;
  min-width:16px;height:16px;font-size:9.5px;font-weight:700;display:grid;place-items:center;font-style:normal;padding:0 4px}
.unreadrow{border-color:var(--accent)}
.svcbtn{width:100%;margin-top:16px;color:rgba(255,255,255,.62);font-size:12px;font-weight:600;
  padding:9px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.svcbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.atabs.grid.six{grid-template-columns:repeat(3,1fr);gap:6px}
.atabs.grid.six button{min-height:36px;font-size:11px;padding:8px 6px}
.cropwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:4px}
.croppreview{position:relative;height:150px;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.croppreview img{width:100%;height:100%;object-fit:cover;display:block}
.cropgrid{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,transparent 33%,rgba(255,255,255,.35) 33%,rgba(255,255,255,.35) 33.4%,transparent 33.4%,
    transparent 66%,rgba(255,255,255,.35) 66%,rgba(255,255,255,.35) 66.4%,transparent 66.4%),
    linear-gradient(to bottom,transparent 33%,rgba(255,255,255,.35) 33%,rgba(255,255,255,.35) 33.4%,transparent 33.4%,
    transparent 66%,rgba(255,255,255,.35) 66%,rgba(255,255,255,.35) 66.4%,transparent 66.4%)}
.croprow{display:flex;align-items:center;gap:10px;margin-top:9px}
.croprow .small{width:96px;flex:none}
.crange{flex:1;-webkit-appearance:none;height:4px;border-radius:99px;background:var(--line);outline:none}
.crange::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ink);cursor:pointer;box-shadow:var(--sh-1)}
.crange::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:none;cursor:pointer}
.installbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 46px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:406px;background:var(--ink);color:#fff;border-radius:var(--r-lg);
  padding:13px 14px;display:flex;gap:12px;align-items:center;z-index:75;box-shadow:var(--sh-3);animation:slide .3s both}
.installbar .ic{width:38px;height:38px;border-radius:11px;background:var(--grad-dark);display:grid;place-items:center;flex:none;
  border:1px solid rgba(255,255,255,.16)}
.installbar b{font-size:13.5px;display:block}
.installbar .small{color:rgba(255,255,255,.65);font-size:11px}
.installbar .go{background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;flex:none}
.installbar .cl{color:rgba(255,255,255,.5);font-size:16px;padding:0 4px;flex:none}
.iosbox{background:var(--surface-2);border-radius:var(--r);padding:12px;margin:10px 0}
.iosstep{display:flex;gap:9px;align-items:flex-start;margin-top:8px;font-size:12.5px}
.iosnum{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;flex:none}
.syncbar{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin-bottom:12px;font-size:11.5px;
  font-weight:600;color:var(--muted)}
.syncbar.err{border-color:var(--accent);color:var(--accent)}
.syncbar.off{border-style:dashed}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.syncdot.error{background:var(--accent)}
.syncdot.off{background:var(--muted)}
/* ---------- v4.2 ---------- */
/* фотографии товара */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.photo{position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.cover{grid-column:span 3;aspect-ratio:16/10;outline:2px solid var(--ink);outline-offset:-2px}
.covlabel{position:absolute;left:8px;bottom:8px;background:var(--ink);color:#fff;border-radius:999px;
  padding:4px 10px;font-size:10px;font-weight:700}
.mkcov{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(17,16,20,.78);color:#fff;
  border-radius:8px;padding:5px 0;font-size:9.5px;font-weight:700}
.phdel{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
  background:rgba(17,16,20,.72);color:#fff;font-size:11px;display:grid;place-items:center}
.addphoto{aspect-ratio:1;border:1.5px dashed var(--line-2);border-radius:var(--r-sm);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)}
.addphoto.big{grid-column:span 3;aspect-ratio:16/9;gap:6px}
.addphoto .pl2{font-size:20px;line-height:1}
.addphoto b{font-size:13.5px;color:var(--ink)}
.addphoto .small{font-size:10.5px;text-align:center;padding:0 14px}

/* всплывающее окно установки */
.installbar.pop{bottom:auto;top:calc(14px + env(safe-area-inset-top));animation:popin .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes popin{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
.installbar .cl{font-size:19px;opacity:.7;padding:0 2px 0 6px}

/* широкая обложка урока */
/* три карточки дня плюс полоса недели должны помещаться в экран телефона
   целиком — иначе она видит первое дело и не знает, что есть ещё два */
.lesson.wide .cov{height:152px}
.lesson.wide .body{padding:10px 12px 12px}
.lesson.wide .cap b{font-size:15.5px}
.lesson.wide .cap span{font-size:10.5px}

/* закреплённая шапка чата */
.chathead{position:sticky;top:0;z-index:30}
.badge-cur{background:var(--gold);color:#fff;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:700}
.cmtbtn{background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--muted)}
.cmts{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.cmt{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.cmtpeek{display:flex;gap:7px;align-items:center;width:100%;text-align:left;margin-top:9px;padding-top:9px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.cmtpeek span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}







/* ---------- направления контента ---------- */
/* Направления в тесте: иконка и название в одну строку, две колонки.
   Крупные карточки с подписями занимали два экрана и читались тяжело —
   здесь всё видно разом, а выбранное заливается одним цветом. */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ttile{position:relative;display:flex;align-items:center;gap:9px;text-align:left;
  padding:9px 10px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
  color:rgba(255,255,255,.92);font-size:12.5px;font-weight:600;
  transition:background .16s ease,border-color .16s ease,color .16s ease}
.ttile .tico{display:grid;place-items:center;flex:none;width:28px;height:28px;
  border-radius:9px;background:rgba(255,255,255,.1);color:#fff;opacity:.8;
  transition:.16s}
.ttile .tlab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.25}
.ttile .tmark{display:none;flex:none}
.ttile:hover{background:rgba(255,255,255,.1)}
/* Выбранное направление подсвечивается так же, как всё выбранное в тесте:
   светлая подложка и белая рамка. Золотая заливка выбивалась из ночного
   экрана и читалась как предупреждение. */
.ttile.on{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.55);color:#fff}
.ttile.on .tico{background:rgba(255,255,255,.2);color:#fff;opacity:1}
.ttile .tmark{color:#fff}
.ttile.on .tmark{display:block}

/* фишки направлений в ленте и в редакторе */
.trow{gap:7px;padding:2px 16px 10px;margin:0 -16px}
.trow > *{width:auto}
.tchip{flex:none;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:600;
  color:var(--muted);white-space:nowrap;transition:.14s}
.tchip svg{color:var(--tc,var(--muted));flex:none}
.tchip b{font-size:9.5px;font-weight:700;opacity:.5}
.tchip.on{background:var(--tc,var(--ink));border-color:transparent;color:#fff}
.tchip.on svg,.tchip.on b{color:#fff;opacity:.9}
.tchip.on.plain{background:var(--ink)}
.tchip.fav.on{background:#E7A339}
.tpick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.tpick .tchip{background:var(--surface-2);border-color:transparent}

/* ---------- доходимость в админке ---------- */
.reach{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0 14px}
.rtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.rtile b{display:block;font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
  font-variant-numeric:tabular-nums}
.rtile span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.reachtab{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
.reachtab th,.reachtab td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line)}
.reachtab thead th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:700}
.reachtab tbody tr:last-child td{border-bottom:none}
.reachtab td{font-variant-numeric:tabular-nums;white-space:nowrap}
.reachtab td.nm{white-space:normal;min-width:150px}
.reachtab td.nm b{display:block;font-size:13.5px}
.reachtab td.nm span{display:block;font-size:11px;color:var(--muted)}
.bar{display:inline-block;width:44px;height:5px;border-radius:3px;background:var(--surface-2);
  margin-right:7px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}

/* оценка и «что помешало» в переписке */
.rateline{display:flex;gap:2px;margin-top:9px}
.rstar{padding:3px;line-height:0;border-radius:6px}
.rstar:hover{background:rgba(17,16,20,.06)}
.whyrow{display:flex;gap:7px;margin-top:9px}
.whyrow .field{margin:0;flex:1;padding:8px 11px;font-size:13px}

/* ---------- билет и приглашение ---------- */
.tick{border-radius:var(--r-lg);overflow:hidden;color:#fff;
  background:linear-gradient(150deg,#1A171F 0%,#2B2233 52%,#4A2C42 100%);
  box-shadow:0 14px 34px rgba(17,16,20,.22)}
.tick.inv{background:linear-gradient(150deg,#3A2230 0%,#6B2A46 55%,#A8375C 100%)}
.tick-top{display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px 0;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.tick-brand{display:flex;align-items:center;gap:6px;font-family:Unbounded,Inter,sans-serif;
  font-weight:300;opacity:.9}
.tick-kind{font-weight:700;opacity:.6}
.tick-body{display:flex;gap:14px;padding:14px 16px 16px}
.tick-date{flex:none;width:62px;text-align:center;background:rgba(255,255,255,.1);
  border-radius:var(--r);padding:9px 4px 7px}
.tick-date b{display:block;font-size:28px;line-height:1;font-weight:700;letter-spacing:-.03em}
.tick-date span{display:block;font-size:10.5px;opacity:.75;margin-top:2px}
.tick-date i{display:block;font-style:normal;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.5;margin-top:4px}
.tick-what{flex:1;min-width:0}
.tick-kindname{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;font-weight:700}
.tick-what h3{margin:4px 0 7px;font-size:17px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.tick-line{font-size:12px;opacity:.9;line-height:1.4}
.tick-line.muted{opacity:.55;margin-top:2px}
.tick-rip{position:relative;height:1px;margin:0 0;background:transparent;
  border-top:1px dashed rgba(255,255,255,.3)}
.tick-rip i{position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.tick-rip i:first-child{left:-9px} .tick-rip i:last-child{right:-9px}
.tick-foot{display:flex;justify-content:space-between;gap:12px;padding:12px 16px 15px}
.tick-cell span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;
  font-weight:700;margin-bottom:2px}
.tick-cell b{font-size:14px;font-weight:700;letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.tick-cell.right{text-align:right}

/* ---------- письма Eva Events ---------- */
.mwhen{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);background:rgba(17,16,20,.05);border-radius:999px;padding:2px 7px;margin-bottom:6px}
.cmsg.own .mwhen{background:rgba(17,16,20,.06);color:var(--muted)}
.macts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.macts .btn{width:auto;flex:0 1 auto}
.evok{display:inline-flex;align-items:center;background:#EAF4EE;color:var(--ok);border-radius:999px;
  padding:2px 8px;font-size:9.5px;font-weight:700}
.evwait{display:inline-flex;align-items:center;background:#FFF3E2;color:var(--warn);border-radius:999px;
  padding:2px 8px;font-size:9.5px;font-weight:700}
.evfast{display:flex;gap:8px;align-items:flex-start;background:#F3EFFA;border-radius:var(--r);
  padding:10px 12px;margin-bottom:12px;font-size:11.5px;line-height:1.45;color:#5B4E86}
.evfast b{display:block;font-size:12px;margin-bottom:2px}

/* ---------- сообщества ---------- */
.gemoji{display:grid;place-items:center;color:var(--gc,var(--ink));
  background:color-mix(in srgb,var(--gc,#111014) 11%,transparent)}
@supports not (color:color-mix(in srgb,red 11%,transparent)){ .gemoji{background:var(--surface-2)} }
.gline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.gitem.locked{opacity:.9}
.gitem.locked .gline{white-space:normal;font-size:11.5px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.glock{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface-2);
  color:var(--muted);display:grid;place-items:center}

.gcover{text-align:center;padding:6px 0 14px}
.gcircle{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;
  color:#fff;background:var(--gc,var(--ink))}
.grow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.grow span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.gabout{margin:0 0 14px;font-size:14px;line-height:1.55}
.gplate{background:var(--surface-2);border-radius:var(--r);padding:11px 12px;margin-bottom:14px}
.gsec{margin-bottom:14px}
.gsec .dh{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.gsec p{margin:0;font-size:13.5px;line-height:1.5}
.grules{list-style:none;margin:0;padding:0}
.grules li{position:relative;padding:0 0 7px 16px;font-size:13.5px;line-height:1.45}
.grules li:before{content:'';position:absolute;left:3px;top:7px;width:5px;height:5px;border-radius:50%;
  background:var(--line-2)}
.glocked{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:var(--r);
  padding:12px;margin-bottom:12px;color:var(--muted)}
.glocked b{color:var(--ink);font-size:13.5px;display:block;margin-bottom:2px}


/* по названию в шапке чата тоже открывается описание группы */
.ghead{cursor:pointer;border-radius:999px;padding:3px 8px;transition:background .15s}
.ghead:hover{background:rgba(255,255,255,.08)}

/* команда сообщества: маленькие аватарки, строки списком, лента листается */
.teamrow{gap:8px;padding:2px 16px 8px;margin:0 -16px}
.teamrow > *{width:auto}
.tcard{flex:none;display:flex;align-items:center;gap:8px;min-width:170px;max-width:210px;
  background:var(--surface-2);border-radius:999px;padding:5px 13px 5px 5px}
.tpic{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;background:var(--surface)}
.tpic svg,.tpic img{width:100%;height:100%;object-fit:cover;display:block}
.tpic .dot-ava{width:30px;height:30px;font-size:11px}
.tcard b{display:block;font-size:12.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard span{display:block;font-size:10.5px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ---------- чат группы: поле ввода закреплено внизу ---------- */
/* место под закреплённым полем: иначе оно закрывало последнее сообщение */
.chatview{padding-bottom:104px}
.chatview.replying{padding-bottom:150px}
.chatbar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:var(--shell);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:35;display:block;
  padding:8px 16px 10px;background:rgba(247,246,244,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--line)}
.chatinput{display:flex;gap:8px}
.chatinput .field{margin:0;flex:1}

<script>
/* =====================================================================
   EVA SPACE v2 — один файл, без сборки.
   ===================================================================== */

/* ---------- утилиты ---------- */
const el = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Строка, которую подставляют внутрь обработчика: onclick="fn('${attJs(v)}')".
   Одного esc тут мало: браузер вернёт &#39; обратно в кавычку раньше, чем
   строку увидит JavaScript. Поэтому сначала прячем кавычку от JavaScript,
   потом всё вместе — от разметки. */
const attJs = s => esc(String(s == null ? '' : s)
  .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/[\r\n]+/g, ' '));

/* Ссылка на картинку: пропускаем только загруженные файлы, https и картинки
   в data:. Всё остальное — включая javascript: — превращается в пустую строку. */
/* Простое оформление длинных текстов — как в постах телеграма:
   абзацы, подзаголовки со строки «## », списки с «- » и *жирное*.
   Сначала всё экранируем, потом добавляем разметку: чужой текст
   не может протащить сюда свои теги. */
function richText(src){
  const lines = String(src == null ? '' : src).split(/\r?\n/);
  const bold = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,!?)]|$)/g, '$1<b>$2</b>');
  let out = '', list = [];
  const flush = () => { if(list.length){ out += '<ul class="rlist">' + list.join('') + '</ul>'; list = []; } };
  lines.forEach(raw => {
    const t = raw.trim();
    if(!t){ flush(); return; }
    if(/^##\s+/.test(t)){ flush(); out += '<div class="rhead">' + bold(t.replace(/^##\s+/, '')) + '</div>'; return; }
    if(/^[-•]\s+/.test(t)){ list.push('<li>' + bold(t.replace(/^[-•]\s+/, '')) + '</li>'); return; }
    flush(); out += '<p>' + bold(t) + '</p>';
  });
  flush();
  return out;
}

/* =====================================================================
   ХРАНИЛИЩЕ И АККАУНТЫ
   Работает поверх localStorage там, где он доступен (GitHub Pages,
   свой домен). В песочницах без доступа автоматически падает в память,
   поэтому приложение нигде не ломается.
   ===================================================================== */
const Store = (() => {
  let ok = false, mem = {};
  try {
    const k = '__eva_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    ok = true;
  } catch(e){ ok = false; }
  return {
    available: ok,
    get(key, def){
      try {
        const raw = ok ? window.localStorage.getItem(key) : mem[key];
        return raw ? JSON.parse(raw) : def;
      } catch(e){ return def; }
    },
    set(key, val){
      const raw = JSON.stringify(val);
      try { ok ? window.localStorage.setItem(key, raw) : (mem[key] = raw); } catch(e){ mem[key] = raw; }
    },
    del(key){
      try { ok ? window.localStorage.removeItem(key) : delete mem[key]; } catch(e){}
    }
  };
})();

const DB = {
  users(){ return Store.get('eva_users', {}); },
  saveUsers(u){ Store.set('eva_users', u); },
  find(email){ return this.users()[String(email).toLowerCase().trim()] || null; },
  upsert(u){
    const all = this.users();
    all[u.email.toLowerCase()] = u;
    this.saveUsers(all);
    if(typeof syncUser === 'function') syncUser(u);
  },
  session(){ return Store.get('eva_session', null); },
  setSession(s){ Store.set('eva_session', s); },
  clearSession(){ Store.del('eva_session'); },
  progress(email){ return Store.get('eva_progress_' + email.toLowerCase(), null); },
  saveProgress(email, data){ Store.set('eva_progress_' + email.toLowerCase(), data); }
};

/* примитивный хеш пароля — не криптография, а защита от чтения глазами.
   На бою пароль хешируется на сервере (bcrypt/argon2), см. README. */
function hashPass(p){
  let h = 5381;
  for(let i = 0; i < p.length; i++) h = ((h << 5) + h + p.charCodeAt(i)) >>> 0;
  return 'h' + h.toString(36) + p.length;

function cycleNow(){
  const c = S.cycle;
  if(!c || !c.last) return null;
  const start = new Date(c.last), today = new Date();
  start.setHours(0,0,0,0); today.setHours(0,0,0,0);
  let day = Math.floor((today - start)/86400000) % c.len;
  if(day < 0) day += c.len;
  const p = day < c.period ? PHASES[0]
          : day < Math.round(c.len/2) - 2 ? PHASES[1]
          : day <= Math.round(c.len/2) + 1 ? PHASES[2] : PHASES[3];

  return {day:day+1, phase:p, next, len:c.len};
}

/* Послание на сегодня: самое точное из подошедших. */
function dayTip(d = new Date()){
  const m = moon(d), z = zodiac(S.birth && S.birth.date), cy = cycleNow();
  const fits = DAY_TIPS.filter(t => {
    if(t.m && t.m.indexOf(m.n) < 0) return false;
    if(t.c && (!cy || t.c.indexOf(cy.phase.k) < 0)) return false;
    if(t.day && (!cy || cy.day !== t.day)) return false;
    if(t.el && (!z || z.el !== t.el)) return false;
    return true;
  });
  if(!fits.length) return DAY_TIPS[DAY_TIPS.length - 1];
  const top = Math.max(...fits.map(t => t.w));
  const best = fits.filter(t => t.w === top);
  return best[(d.getDate() + d.getMonth()) % best.length];
}

/* Строка-повод под заголовком: из чего сегодня сложилось послание. */
function dayWhy(d = new Date()){
  const m = moon(d), z = zodiac(S.birth && S.birth.date), cy = cycleNow();

          cy ? cy.phase.n.toLowerCase() + ' фаза, день ' + cy.day : '',
          z ? z.e + ' ' + z.n.toLowerCase() : ''].filter(Boolean).join(' · ');
}

/* ---------- звезда под посланием ----------
   «Зашло или нет» нельзя посчитать по открытиям: подсказку видят все,
   кто открыл главную. Звезда — единственный честный сигнал, и она же
   единственная причина, по которой базу посланий можно будет чистить,
   а не только пополнять.

   Отметка уходит на сервер отдельной записью: номер складывается из ключа
   послания и почты, поэтому одна женщина не может отметить дважды и не
   может стереть чужую отметку. Текст послания не отправляем — он и так
   есть в коде, а на сервере нужен только счёт. */
function tipStarred(k){ return (S.tipStars || []).indexOf(k) >= 0; }

function starTip(k){
  S.tipStars = S.tipStars || [];
  const on = tipStarred(k);
  S.tipStars = on ? S.tipStars.filter(x => x !== k) : [...S.tipStars, k];
  const me = typeof myMail === 'function' ? myMail() : '';
  if(me){
    const id = k + '__' + me;
    TIP_VOTES = (TIP_VOTES || []).filter(v => v.id !== id);
    /* Снятая звезда уезжает пометкой, а не пропажей: общий раздел на сервере
       умеет дописывать и обновлять, но не стирать. Без пометки счёт остался
       бы завышенным навсегда. */
    TIP_VOTES.push(on ? {id, k, del:true} : {id, k, at:Date.now()});
    if(typeof syncPush === 'function') syncPush(['tipstars']);
  }
  /* перерисовываем одну кнопку, а не всю страницу */
  const btn = document.getElementById('tipstar');
  if(btn){
    btn.classList.toggle('on', !on);
    btn.setAttribute('aria-pressed', String(!on));
  } else if(typeof render === 'function') render();
  if(typeof schedulePersist === 'function') schedulePersist();
  if(typeof toast === 'function') toast(on ? 'Отметка снята' : 'Спасибо, отметила');
}

/* Отметки всех женщин: сюда же приходят чужие с сервера.
   Из них считается, какие послания заходят. */
let TIP_VOTES = [];
function tipRating(){
  const by = {};
  (TIP_VOTES || []).forEach(v => { if(v && v.k && !v.del) by[v.k] = (by[v.k] || 0) + 1; });
  return DAY_TIPS.map(t => ({k:t.k, h:t.h, n:by[t.k] || 0}))
                 .sort((a, b) => b.n - a.n);
}

/* =====================================================================
   ЛОГИКА ПРОГРАММЫ
   ===================================================================== */
function matchOf(item){
  const id = String(item && item.id || '');
  const near = topicHit(item) ? 8 : 0;          // выбранное направление поднимает совпадение
  if(!S.tags.length) return Math.min(96, 60 + (hash(id) % 25) + near);
  const hits = (item && Array.isArray(item.tags) ? item.tags : []).filter(t => S.tags.includes(t)).length;
  const base = Math.round(hits / Math.max(1, Math.min(S.tags.length, 3)) * 62) + 30;
  return Math.max(52, Math.min(96, base + near + (hash(id) % 7)));
}

/* попадает ли материал в выбранные ею направления */
function topicHit(item){
  const mine = S.topics || [];
  if(!mine.length) return false;
  const his = (item && Array.isArray(item.topics)) ? item.topics : [];
  return his.some(t => mine.indexOf(t) >= 0);
}

/* подходит ли материал пользовательнице по этапу жизни и уровню */
function fitsAudience(item){
  const mine = myAudience();
  const aud = item.aud || [];
  const cy = typeof cycleNow === 'function' ? cycleNow() : null;
  const inPeriod = cy && cy.phase.k === 'menstrual';

  // активные практики не предлагаем в дни менструации
  if(inPeriod && aud.includes('active')) return false;

  // материал без разметки подходит всем
  if(!aud.length) return true;

  // строгие группы: если материал помечен ими, он только для них
  const strict = ['pregnant','newborn','toddler'];
  const strictTags = aud.filter(k => strict.includes(k));
  if(strictTags.length && !strictTags.some(k => mine.includes(k))) return false;

  // беременным не показываем материалы, помеченные как активные
  if(mine.includes('pregnant') && aud.includes('active')) return false;

  const soft = aud.filter(k => !strict.includes(k) && k !== 'active' && k !== 'period');
  if(soft.length && !soft.some(k => mine.includes(k))) return false;
  return true;
}

/* уровень подготовки: новичку не даём продвинутое */
function fitsLevel(item){
  const lvl = item.level || 'any';
  if(lvl === 'any') return true;
  const mine = S.tags.includes('опыт') ? 'pro' : S.tags.includes('новичок') ? 'new' : 'middle';
  if(mine === 'new') return false;
  if(mine === 'middle') return lvl !== 'pro';
  return true;
}

function fitsTime(item){
  if(S.time >= 35) return true;
  if(S.time >= 20) return item.min <= 34;
  return item.type === 'class' ? item.min <= 28 : item.min <= 12;
}

function buildProgram(){
  const shift = (S.seed || 0) + (S.week || 0);
  const rank = a => matchOf(a);

  /* отбор: время, этап жизни, уровень. Если после фильтров пусто — ослабляем условия */
  const byType = t => {
    const all = LIB.filter(x => x.type === t && x.status === 'live');
    let list = all.filter(x => fitsTime(x) && fitsAudience(x) && fitsLevel(x));
    if(list.length < 3) list = all.filter(x => fitsAudience(x));
    if(list.length < 3) list = all;
    /* Порядок такой: сначала очередь, которую задала редакция (меньше число —
       раньше), потом выбранные ею направления, потом совпадение по тегам. */
    const q = x => (+x.ord > 0 ? +x.ord : 9999);
    return list.sort((a,b) =>
      (q(a) - q(b)) ||
      ((topicHit(b) ? 1 : 0) - (topicHit(a) ? 1 : 0)) ||
      (rank(b) - rank(a)));
  };
  const af = byType('affirm'), pr = byType('practice'), mk = byType('class');
  const slot = S.slot;

  /* материалы, привязанные к конкретному дню недели */
  const fitsDay = (item, i) => !item.days || !item.days.length || item.days.includes(DAY_KEYS[i]);
  const pickForDay = (list, i, fallbackPick) => {
    const fixed = list.filter(x => x.days && x.days.length && x.days.includes(DAY_KEYS[i]));
    if(fixed.length) return fixed[(i + shift) % fixed.length];
    const free = list.filter(x => !x.days || !x.days.length);
    return fallbackPick(free.length ? free : list, i);
  };

  /* Мастер-классы на неделю. Порядок такой:
     1) те, которых она ещё не видела;
     2) когда кончились — открытые уроки курсов;
     3) в крайнем случае повторы, начиная с самых давних.
     Внутри одной недели материал не повторяется никогда. */
  S.seenClasses = S.seenClasses || [];
  const classPool = weekClasses(mk, DAYS.length + 3);

  /* практики и аффирмации чередуем со сдвигом недели — повторы допустимы, но не подряд */
  const pickRotating = (list, i) => list[(i * 2 + shift * 3 + i) % list.length];

  /* материал, привязанный к дню недели, важнее очереди; остальное — по очереди */
  const usedClasses = [];

  S.program = DAYS.map((d,i) => ({
    d, tasks:[
      task(pickForDay(af, i, pickRotating), 'утро'),
      task(pickForDay(pr, i, pickRotating), slot),
      task(classForDay(mk, classPool, i, shift, usedClasses), 'вечер')
    ]
  }));
  /* показанное запоминаем: недавние — в конце списка, чтобы при нехватке
     материала повторялись самые давние, а не одни и те же */
  S.program.forEach(day => {
    const c = day.tasks[2];
    if(!c) return;
    const at = S.seenClasses.indexOf(c.id);
    if(at >= 0) S.seenClasses.splice(at, 1);
    S.seenClasses.push(c.id);
  });
  if(S.seenClasses.length > 300) S.seenClasses = S.seenClasses.slice(-300);
  S.stars = starsWeek();

  const all = S.program.flatMap(x => x.tasks);
  S.match = Math.round(all.reduce((a,t) => a + t.match, 0) / all.length);
  S.day = todayIdx();
}

/* Список мастер-классов на неделю без повторов.
   Сначала неувиденное, потом открытые уроки курсов, потом самые давние. */
/* Мастер-класс на конкретный день: сначала привязанный к этому дню недели,
   иначе следующий из очереди, который сегодня ещё не занят. */
function classForDay(mk, pool, i, shift, used){
  const fixed = mk.filter(x => x.days && x.days.length && x.days.includes(DAY_KEYS[i])
                            && used.indexOf(x.id) < 0);
  const pick = fixed.length ? fixed[(i + shift) % fixed.length]
                            : pool.find(x => used.indexOf(x.id) < 0)
                              || pool[i % Math.max(1, pool.length)]
                              || mk[i % Math.max(1, mk.length)];
  if(pick) used.push(pick.id);
  return pick;
}

function weekClasses(mk, count){
  const shown = S.seenClasses || [];
  const lessons = (typeof openCourseLessons === 'function') ? openCourseLessons() : [];
  const allMk = LIB.filter(x => x.type === 'class' && x.status === 'live');
  const uniq = [];
  const add = list => list.forEach(x => { if(x && !uniq.some(u => u.id === x.id)) uniq.push(x); });

  add(mk.filter(x => shown.indexOf(x.id) < 0));         // подходящие и ещё не показанные
  add(allMk.filter(x => shown.indexOf(x.id) < 0));      // остальные мастер-классы
  add(lessons.filter(x => shown.indexOf(x.id) < 0));    // открытые уроки курсов
  if(uniq.length < count){                              // всё показано — идут повторы
    const rest = allMk.concat(lessons).filter(x => !uniq.some(u => u.id === x.id));
    rest.sort((a, b) => shown.indexOf(a.id) - shown.indexOf(b.id));   // сначала самые давние
    add(rest);
  }
  return uniq.slice(0, Math.max(count, 1));
}

function task(item, slot){
  return {...item, slot, pts:TYPE[item.type].pts, match:matchOf(item), done:false};

const todayIdx = () => (new Date().getDay() + 6) % 7;
const weekNo = () => Math.floor((Date.now() - new Date(new Date().getFullYear(),0,1)) / 6048e5);

/* при смене недели программа пересобирается на свежих материалах */
function checkWeek(quiet){
  const wasDay = S.day;
  S.day = todayIdx();
  if(!quiet) bumpVisit();
  const w = weekNo();
  S.weekly = S.weekly || {exchanged:false};
  if(S.week === undefined || S.week === null){ S.week = w; return wasDay !== S.day; }
  if(S.week !== w){
    /* снимок делаем ДО пересборки: после неё считать уже нечего */
    const past = typeof weekSnapshot === 'function' ? weekSnapshot() : null;
    S.week = w;
    S.weekly.exchanged = false;          // обмен баллов снова доступен
    S.stars = 0;                          // звёзды недели считаются заново
    buildProgram();                       // программа пересобирается на свежем
    if(typeof evaWeekly === 'function') evaWeekly(past);
    if(!quiet) toast('Новая неделя — Ева подвела итоги');
    if(typeof schedulePersist === 'function') schedulePersist();
    return true;
  }
  /* в выходные напоминаем про непройденное — один раз за неделю */
  if(typeof weekendNudge === 'function' && weekendNudge()) return true;
  if(wasDay !== S.day && typeof schedulePersist === 'function') schedulePersist();
  return wasDay !== S.day;
}

/* Приложение часто остаётся открытым на ночь. Раз в минуту проверяем,
   не наступил ли новый день или новая неделя, иначе программа замирает
   на вчерашнем дне до перезахода. */
function watchCalendar(){
  setInterval(() => {
    if(S.screen !== 'app' || !S.user) return;
    try {
      let need = checkWeek();
      /* заодно двигаем письма Eva Events по настоящему расписанию */
      if(typeof tickEvChain === 'function' && tickEvChain()) need = true;
      if(typeof maybeShowWeek === 'function' && maybeShowWeek()) need = true;
      if(need) render();
    } catch(e){ console.error('[Eva] смена дня:', e); }
  }, 60000);
}
const doneOf = i => S.program[i] ? S.program[i].tasks.filter(t => t.done).length : 0;
const starsTotal = () => S.program.length * 3;

/* звёзды текущей недели считаем из самой программы, чтобы счётчик
   не мог перерасти максимум после пересборки. Накопленное за всё
   время живёт отдельно в S.starsAll */
function starsWeek(){
  return (S.program || []).reduce((a, d) => a + d.tasks.filter(t => t.done).length, 0);
}

function complete(di, ti){
  const t = S.program[di].tasks[ti];
  if(t.done) return;
  t.done = true;
  S.points += t.pts;
  S.starsAll = (S.starsAll || 0) + 1;
  S.stars = starsWeek();
  toast(`+${t.pts} баллов`);
  if(doneOf(di) === 3) setTimeout(() => toast('День закрыт полностью'), 1000);
  render(); schedulePersist();
}

function levelNow(){

  return {cur, next};
}

function streak(){
  let n = 0;
  for(let i = todayIdx(); i >= 0; i--){ if(doneOf(i) === 3) n++; else break; }

}

function speak(text){
  if(!S.voice || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = String(text).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/\s+/g,' ');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'ru-RU'; u.rate = .98; u.pitch = 1.08;
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
  const f = vs.find(v => /Milena|Alyona|Katya|Female|Google/i.test(v.name)) || vs[0];
  if(f) u.voice = f;
  speechSynthesis.speak(u);
}

/* Перерисовка по чужому изменению: страница остаётся на месте.
   Обычный render() пересобирает разметку, и браузер прокручивает наверх —
   женщина читала послание, а её выбросило в начало ленты. Со стороны это

/* Пересборка страницы — самая дорогая операция в приложении: браузер
   заново разбирает разметку и считает раскладку. Перерисовку дёргают и
   таймеры, и ответы сервера, поэтому сравниваем с тем, что уже показано,
   и не трогаем страницу, если ничего не изменилось. Заодно не сбивается
   набранный текст и позиция прокрутки. */
let shownHTML = null, shownSheet = null;
window.__renders = 0; window.__skipped = 0;
function setHTML(html){
  shownSheet = null;
  if(html === shownHTML && !el.__split){ window.__skipped++; return false; }
  el.__split = false;
  shownHTML = html; el.innerHTML = html; window.__renders++;
  after();
  return true;
}

/* Внутри приложения страница и шторка живут в разных коробках. Открыть
   урок — значит дорисовать шторку, а не пересобрать всё вокруг: список
   под ней остаётся на месте, прокрутка не прыгает, экран не моргает. */
function setApp(body, sh){
  if(!el.__split){
    el.innerHTML = '<div id="pagebox"></div><div id="sheetbox"></div>';
    el.__split = true; shownHTML = null; shownSheet = null;
  }
  const pageBox = el.firstElementChild, sheetBox = el.lastElementChild;
  if(body === shownHTML) window.__skipped++;
  else {
    const memo = keepFocus();
    shownHTML = body; pageBox.innerHTML = body; window.__renders++;
    after(); memo();
  }
  if(sh !== shownSheet){ shownSheet = sh; sheetBox.innerHTML = sh; }
  return true;
}

/* Что делаем после каждой пересборки разметки. */
function after(){ deskArrows(); growFields(); }

/* Поля, которые растут под текст: после пересборки их надо померить заново,
   иначе набранное послание схлопывается в одну строку. */
function growFields(){
  document.querySelectorAll('textarea[data-grow]').forEach(grow);
}
function grow(t){
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, +t.dataset.grow || 190) + 'px';
}

/* Перерисовку могут дёрнуть таймер или ответ сервера прямо посреди набора
   текста. Запоминаем, где стоял курсор, и возвращаем его на место. */
function keepFocus(){
  const a = document.activeElement;
  if(!a || !a.id || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA')) return () => {};
  const id = a.id, pos = a.selectionStart, end = a.selectionEnd;
  return () => {
    const n = document.getElementById(id);
    if(!n || typeof n.focus !== 'function') return;
    try { n.focus({preventScroll:true}); } catch(e){ n.focus(); }
    try { if(pos != null && n.setSelectionRange) n.setSelectionRange(pos, end); } catch(e){}
  };
}

/* =====================================================================
   СТРЕЛКИ У ГОРИЗОНТАЛЬНЫХ ЛЕНТ
   На телефоне ленту листают пальцем, на компьютере листать было нечем.
   После каждой перерисовки оборачиваем ленты, которым не хватает ширины,
   и ставим по краям две круглые кнопки. На сенсорных экранах их нет.
   ===================================================================== */
const RAILS = '.hscroll, .carousel, .galrow';

function railOf(btn){
  const box = btn && btn.parentElement;
  return box ? box.querySelector(RAILS) : null;
}
function slideRail(btn, dir){
  const row = railOf(btn);
  if(!row) return;
  row.scrollBy({ left: dir * Math.max(220, row.clientWidth * 0.8), behavior:'smooth' });
}
/* стрелка гаснет, когда в эту сторону листать больше нечего */
function markRail(box){
  const row = box.querySelector(RAILS);
  if(!row) return;
  const left = box.querySelector('.snav.left'), right = box.querySelector('.snav.right');
  const end = row.scrollWidth - row.clientWidth - 2;
  if(left)  left.classList.toggle('off', row.scrollLeft <= 2);
  if(right) right.classList.toggle('off', row.scrollLeft >= end);
}
function deskArrows(){
  try {
    /* мышь или просто широкий экран: на телефоне ленту листают пальцем */
    const mouse = window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches;
    if(!mouse && window.innerWidth < 720) return;
    document.querySelectorAll(RAILS).forEach(row => {
      const parent = row.parentElement;
      if(!parent || parent.classList.contains('scroller')) return;
      if(row.scrollWidth - row.clientWidth < 24) return;      // всё и так помещается
      const box = document.createElement('div');
      box.className = 'scroller rail';
      parent.insertBefore(box, row);
      box.appendChild(row);
      box.insertAdjacentHTML('afterbegin',
        '<button class="snav left" aria-label="Назад" onclick="slideRail(this,-1)">‹</button>');
      box.insertAdjacentHTML('beforeend',
        '<button class="snav right" aria-label="Вперёд" onclick="slideRail(this,1)">›</button>');
      row.addEventListener('scroll', () => markRail(box), { passive:true });
      markRail(box);
    });
  } catch(e){ console.error('[Eva] стрелки лент:', e); }
}
window.addEventListener('resize', () => { try { deskArrows(); } catch(e){} });

/* ---------- действия онбординга ---------- */
function startQuiz(){
  if(!S.name.trim()) S.name = 'Ева';
  S.screen = 'quiz'; S.qi = 0; S.picked = []; S.tags = [];
  render(); stars();
}
function pick(i){
  const q = quizFlow()[S.qi]; let sel = S.picked[S.qi] || [];
  /* max не указан — один ответ; max:0 — сколько захочет */
  const max = q.max == null ? 1 : q.max;
  if(sel.includes(i)) sel = sel.filter(x => x !== i);
  else if(max === 1) sel = [i];
  else if(!max || sel.length < max) sel = [...sel, i];
  /* набрала максимум — вытесняем самый давний выбор, а не схлопываем список
     до двух: на вопросе с четырьмя вариантами так терялись ответы */
  else sel = [...sel.slice(1), i];
  S.picked[S.qi] = sel; render(); stars();
}
function prevQ(){
  if(S.qi === 0){ S.screen = 'welcome'; render(); return; }
  S.qi--; render(); stars();
}
function nextQ(){
  const flow = quizFlow();
  const q = flow[S.qi];
  S.answers = S.answers || {};
  /* направления собираем заново: женщина могла снять галочку и вернуться */
  if(q.grid) S.topics = [];
  (S.picked[S.qi] || []).forEach(i => {
    const o = q.o[i];
    (o.tags || []).forEach(t => { if(!S.tags.includes(t)) S.tags.push(t); });
    if(o.topic){ S.topics = S.topics || []; if(!S.topics.includes(o.topic)) S.topics.push(o.topic); }
    if(o.time) S.time = o.time;
    if(o.slot) S.slot = o.slot;
    if(o.extra) Object.assign(S.extra, o.extra);
    S.answers[q.id] = {t:o.t, next:o.next || null};
  });
  if(S.qi < quizFlow().length - 1){ S.qi++; render(); stars(); return; }
  if(!S.user){ S.screen = 'mail'; render(); stars(); return; }
  S.screen = 'building'; render(); stars();
  const steps = ['Читаю твои ответы','Сравниваю с '+LIB.length+' уроками библиотеки','Раскладываю на семь дней','Проверяю, что влезает в '+S.time+' минут'];
  persist();
  let k = 0;
  const iv = setInterval(() => {
    k++;
    const t = document.getElementById('bs'), p = document.getElementById('bp');
    if(t && steps[k]) t.textContent = steps[k];
    if(p) p.style.width = (8 + k*24) + '%';
    if(k >= 4){ clearInterval(iv); buildProgram(); S.screen = 'ready'; render(); stars(); }
  }, 780);
}

/* =====================================================================
   ТОЧЕЧНЫЕ ОБНОВЛЕНИЯ БЕЗ ПЕРЕРИСОВКИ
   Клик по тегу или цене не должен перестраивать экран и сбрасывать скролл.
   ===================================================================== */
function pathGet(obj, path){
  return path.split('.').reduce((o,k) => (o == null ? o : o[k]), obj);
}
function pathSet(obj, path, val){
  const ks = path.split('.'), last = ks.pop();
  const t = ks.reduce((o,k) => (o[k] = o[k] || {}), obj);
  t[last] = val;
}

/* переключает тег в массиве по пути в S и подсвечивает кнопку на месте */
function chipToggle(btn, path, value, counterSel){
  const arr = pathGet(S, path) || [];
  const on = arr.includes(value);
  const next = on ? arr.filter(x => x !== value) : [...arr, value];
  pathSet(S, path, next);
  btn.classList.toggle('on', !on);
  const mark = btn.querySelector('.x');
  if(mark) mark.textContent = on ? '' : ' ✕';
  if(counterSel){
    const c = document.querySelector(counterSel);
    if(c) c.textContent = next.length ? '(' + next.length + ')' : '';
  }
  schedulePersist();
}

/* выбор одного значения в группе кнопок */
function chipPick(btn, path, value){
  pathSet(S, path, value);
  const wrap = btn.parentElement;
  [...wrap.children].forEach(b => b.classList.toggle('on', b === btn));
  schedulePersist();
}

/* изменение числа с обновлением одного узла */
function stepValue(path, dir, outSel, fmt){
  const cur = pathGet(S, path) || 0;
  const idx = Math.round((cur - 490) / 500);
  const next = Math.max(0, idx + dir);
  const val = next === 0 ? 0 : 490 + next * 500;
  pathSet(S, path, val);
  const out = document.querySelector(outSel);
  if(out) out.textContent = val === 0 ? 'Бесплатно' : money(val);
  const manual = document.querySelector(outSel + '-input');
  if(manual) manual.value = val || '';
}

async function submitAuth(){

  if(a.mode === 'signup'){
    if(!nm){ a.err = 'Как к тебе обращаться?'; return render(); }
    if(a.pass.length < 6){ a.err = 'Пароль минимум 6 символов'; return render(); }
    a.err = ''; a.name = nm;
    S.name = nm; S.role = 'user';
    S.tags = []; S.picked = []; S.qi = 0; S.answers = {}; S.extra = {};
    S.screen = 'quiz';
    render(); stars();
    return;
  }

  a.email = (($('#a_mail')||{}).value || '').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[a-zа-я]{2,}$/i.test(a.email)){ a.err = 'Проверь адрес почты'; return render(); }
  if(a.pass.length < 6){ a.err = 'Пароль минимум 6 символов'; return render(); }

  if(a.mode === 'login'){
    if(SYNC.alive !== false){                      // пароль проверяет сервер
      const r = await apiCall('login', { email:a.email, pass:a.pass }, { silent:true });
      if(!r){ a.err = SYNC.lastError || 'Не удалось войти'; return render(); }
      SYNC.token = r.token;
      mirrorUser(r.user);
      if(!r.user.verified){
        a.err = ''; a.code = r.demo_code || ''; a.mode = 'verify';
        sendVerificationEmail(a.email, a.code);
        return render();
      }
      return signIn(DB.find(a.email) || r.user);
    }
    const u = DB.find(a.email);                    // без сервера — только на этом устройстве
    if(!u){ a.err = 'Аккаунт с такой почтой не найден'; return render(); }
    if(u.pass !== hashPass(a.pass)){ a.err = 'Неверный пароль'; return render(); }
    if(!u.verified){ a.err = ''; a.code = u.code; a.mode = 'verify'; sendVerificationEmail(a.email, u.code); return render(); }
    signIn(u);
    return;
  }

}

async function checkCode(){

  if(SYNC.alive !== false){                        // код сверяет сервер
    const r = await apiCall('verify', { email:S.auth.email, code:v }, { silent:true });
    if(!r){ S.auth.err = SYNC.lastError || 'Код не совпадает'; return render(); }
    mirrorUser(r.user);
    S.auth.err = '';
    S.user = {email:r.user.email, name:r.user.name, role:r.user.role};
    S.role = r.user.role === 'expert' ? 'expert' : r.user.role === 'admin' ? 'admin' : 'user';
    S.name = r.user.name;
    if(S.auth.remember) DB.setSession({email:r.user.email, at:Date.now()});

    if(S.tags && S.tags.length){ buildAnim(); }

    return;
  }

  const u = DB.find(S.auth.email);
  if(!u) { S.auth.mode = 'signup'; return render(); }
  if(v !== u.code){ S.auth.err = 'Код не совпадает'; return render(); }

  S.auth.err = '';
  S.user = {email:u.email, name:u.name, role:u.role || 'user'};
  S.role = 'user'; S.name = u.name;

  if(S.tags && S.tags.length){ buildAnim(); }

async function adminLogin(){
  const mail = (($('#ad_mail')||{}).value || '').trim().toLowerCase();
  const pass = ($('#ad_pass')||{}).value || '';
  if(!mail || !pass) return toast('Введи почту и пароль');

  const enter = (u, role) => {
    S.role = role;
    S.user = {email:u.email, name:u.name, role};
    S.name = u.name;
    if(role === 'admin') S.adminName = u.name;
    DB.setSession({email:u.email, at:Date.now()});
    S.screen = 'app'; S.page = null;
    render();
    toast(role === 'admin' ? 'Панель администратора' : 'Кабинет эксперта');
  };

  if(SYNC.alive === false){                        // без сервера — только на этом устройстве
    const u = DB.find(mail);
    if(!u || u.pass !== hashPass(pass)) return toast('Неверная почта или пароль');
    const role = u.role === 'admin' ? 'admin' : u.role === 'expert' ? 'expert' : 'user';
    if(role === 'user') return toast('У этого аккаунта нет доступа к панели');
    return enter(u, role);
  }

  const r = await apiCall('login', { email:mail, pass }, { silent:true });
  if(!r) return toast(SYNC.lastError || 'Не удалось войти');
  const role = r.user.role;
  if(role !== 'admin' && role !== 'expert'){
    S.role = 'user';
    return toast('У этого аккаунта нет доступа к панели. Администратор назначается в data/config.php на хостинге');
  }
  SYNC.token = r.token;
  mirrorUser(r.user);
  enter(r.user, role);
  if(role === 'admin') pullUsers();
}

async function tryAutoLoginAsync(){
  try { await SYNC.ready; } catch(e){}

  if(SYNC.alive !== false){                        // с сервером решает токен, а не запись в браузере
    if(!SYNC.token) return false;
    const r = await apiCall('me', null, { silent:true });
    if(!r || !r.user){ SYNC.token = ''; DB.clearSession(); return false; }
    mirrorUser(r.user);
    DB.setSession({email:r.user.email, at:Date.now()});
    if(typeof pullProgress === 'function') await pullProgress(r.user.email);
    const entered = tryAutoLogin();
    if(entered && r.user.role === 'admin') await pullUsers();

  if(!s) return false;
  const u = DB.find(s.email);
  if(!u || !u.verified) return false;
  if(typeof pullProgress === 'function') await pullProgress(u.email);
  return tryAutoLogin();
}

function stars(){
  const c = document.getElementById('sky');
  if(!c) return;
  const x = c.getContext('2d'), w = c.width = c.offsetWidth, h = c.height = c.offsetHeight;
  const pts = [...Array(70)].map(() => ({x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.2+.3, a:Math.random(), s:Math.random()*.01+.004}));
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function loop(){

    x.clearRect(0,0,w,h);

      x.fillStyle = `rgba(255,255,255,${o})`; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); });
    requestAnimationFrame(loop);
  })();
}

/* =====================================================================
   МЕДИА: загрузка фото со сжатием
   ===================================================================== */
const MEDIA = {};   // id -> dataURL (jpeg)

function cover(id, kind){
  if(MEDIA[id]){
    const pos = (typeof POS !== 'undefined' && POS[id]) || '50% 50%';
    return `<img src="${safeUrl(MEDIA[id])}" alt="" style="object-position:${esc(pos)}">`;
  }
  return coverGen(id, kind);
}

/* Сжатие: длинная сторона до 1400px, JPEG 0.86 — вес падает в разы,
   картинка остаётся резкой на ретине. PNG с прозрачностью не теряется. */
function compressImage(file, cb, maxSide, quality){
  maxSide = maxSide || 1400; quality = quality || 0.86;
  const okType = /^image\//.test(file.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || '');
  if(!okType) return toast('Это не изображение');
  if(file.size > 25 * 1024 * 1024) return toast('Файл больше 25 МБ, выбери снимок поменьше');
  toast('Обрабатываю фото…');
  const fr = new FileReader();
  fr.onload = e => {
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      const k = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, 0, 0, w, h);
      const isPng = /png|webp/.test(file.type) && hasAlpha(x, w, h);
      const out = isPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', quality);
      cb(out, {w, h, before:file.size, after:Math.round(out.length*0.75)});
    };
    img.onerror = () => {
      // HEIC с айфона браузер иногда не открывает как картинку
      toast(/heic|heif/i.test(file.type + file.name)
        ? 'Формат HEIC не читается браузером. В настройках айфона: Камера → Форматы → «Наиболее совместимый»'
        : 'Не удалось прочитать файл');
    };
    img.src = e.target.result;
  };
  fr.onerror = () => toast('Не удалось открыть файл');
  fr.readAsDataURL(file);
}
function hasAlpha(ctx, w, h){
  try{
    const d = ctx.getImageData(0,0,Math.min(w,60),Math.min(h,60)).data;
    for(let i = 3; i < d.length; i += 4) if(d[i] < 250) return true;
  }catch(e){}
  return false;
}
const kb = n => n > 1e6 ? (n/1048576).toFixed(1)+' МБ' : Math.round(n/1024)+' КБ';

function pickImage(key, after){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.cssText = 'position:fixed;left:-9999px;opacity:0';
  document.body.appendChild(inp);
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    setTimeout(() => { try{ inp.remove(); }catch(e){} }, 500);
    if(!f) return;
    compressImage(f, async (data, info) => {
      MEDIA[key] = data;
      toast(`Фото загружено · ${kb(info.before)} → ${kb(info.after)}`);
      if(after) after(data, info); else render();
      if(typeof uploadImage === 'function'){
        const url = await uploadImage(key, data);
        if(url && url !== data){ MEDIA[key] = url; render(); }
        if(typeof syncPush === 'function') syncPush();
      }
    });
  };
  inp.click();
}

/* ---------- встраивание видео ---------- */
function videoUrl(id){
  const x = (typeof itemById === 'function') ? itemById(id) : null;
  if(x && x.video) return x.video;
  if(S.videos && S.videos[id]) return S.videos[id];
  if(S.editCourse || true){
    for(const cid in (S.lessons||{})){
      const l = (S.lessons[cid]||[]).find(u => u.id === id);
      if(l && l.video) return l.video;
    }
  }
  return '';
}
function embedSrc(url){
  if(!url) return null;
  let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if(m) return {type:'iframe', src:'https://www.youtube.com/embed/' + m[1]};
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return {type:'iframe', src:'https://player.vimeo.com/video/' + m[1]};
  m = url.match(/kinescope\.io\/(?:embed\/)?([\w-]+)/);
  if(m) return {type:'iframe', src:'https://kinescope.io/embed/' + m[1]};
  if(/\.(mp4|webm|mov)(\?|$)/i.test(url)) return {type:'video', src:url};
  return {type:'link', src:url};
}
/* есть ли по этому ключу настоящий проигрыватель, а не заглушка */
function hasPlayer(id){
  const e = embedSrc(videoUrl(id));
  return !!e && (e.type === 'iframe' || e.type === 'video');
}
function videoBlock(id, posterKind){
  const url = videoUrl(id), e = embedSrc(url);
  if(e && e.type === 'iframe')
    return `<iframe class="frame" src="${e.src}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
  if(e && e.type === 'video')
    return `<video class="frame" src="${safeUrl(e.src)}" controls playsinline
      poster="${safeUrl(MEDIA[id]||'')}" preload="metadata"></video>`;
  if(e && e.type === 'link')
    return `<a class="player" href="${e.src}" target="_blank" rel="noopener" style="text-decoration:none;display:grid">
      ${cover(id, posterKind||'practice')}<div class="pl">▶</div></a>`;
  return `<div class="player" onclick="toast('Видео ещё не добавлено')">
    ${cover(id, posterKind||'practice')}<div class="pl">▶</div></div>`;
}

function lessonsOf(cid){
  if(!S.lessons[cid]) S.lessons[cid] = (LESSON_SETS[cid]||[]).map(([t,d,m],i) =>
    ({id:cid+'_'+(i+1), n:i+1, t, d, min:m, done:false, video:'', free:i===0||i===3}));
  return S.lessons[cid];
}

function openCourseLanding(id){ S.course = {id, mode:'landing'}; S.sheet = null; S.page = null; render(); window.scrollTo(0,0); }
function openCourseLearn(id, unit){ S.course = {id, mode:'learn', unit:unit || 0}; S.sheet = null; render(); window.scrollTo(0,0); }
function closeCourse(){ S.course = null; render(); window.scrollTo(0,0); }

    <div class="eyebrow" style="margin-top:6px">Урок ${esc(l.n)} из ${ls.length} · ${l.min} мин</div>

        ${hwDone ? '<span class="pill free">выполнено</span>' : ''}
      </div>
      <button class="btn ${hwDone?'ghost':''}" style="margin-top:10px" onclick="openSheet({k:'hw',id:'${attJs(l.id)}',cid:'${attJs(c.id)}'})">
        ${hwDone ? 'Открыть задание' : 'Открыть задание'}</button>
    </div>` : ''}

    <div class="bar" style="margin:14px 0 6px"><i style="width:${done/ls.length*100}%"></i></div>
    <div class="small muted" style="margin-bottom:12px">Пройдено ${done} из ${ls.length}</div>

    <div class="acts" style="margin-bottom:14px">
      <button class="btn ghost" ${i===0?'disabled':''} onclick="openCourseLearn('${attJs(c.id)}',${i-1})">←</button>

      <button class="btn ghost" ${i===ls.length-1?'disabled':''} onclick="openCourseLearn('${attJs(c.id)}',${i+1})">→</button>

      return `<button class="unit ${u.done?'done':''}" style="${k===i?'border-color:var(--ink)':''}"
        onclick="${open?`openCourseLearn('${attJs(c.id)}',${k})`:`toast('Урок откроется после покупки')`}">
        <div class="n">${u.done?'✓':u.n}</div>
        <div style="flex:1;min-width:0"><b style="font-size:13px;display:block">${esc(u.t)}</b>
          <div class="small muted">${u.min} мин${u.hw?' · есть домашнее':''}</div></div>
        ${k===i?'<span class="chip pale">сейчас</span>':open?'<span class="muted">›</span>':'<span class="lockmini">🔒</span>'}
      </button>`;
    }).join('')}
  </div>`;
}

function doneUnit(cid, i){
  const ls = lessonsOf(cid);
  if(ls[i].done) return;
  ls[i].done = true; S.points += 20;
  const all = ls.every(x => x.done);
  render();
  toast(all ? 'Курс пройден полностью. +150 баллов' : '+20 баллов');
  if(all) S.points += 130;
}

/* открытые уроки курсов дополняют мастер-классы, когда библиотека исчерпана */
function openCourseLessons(){
  const out = [];
  COURSES.filter(c => !c.draft).forEach(c => {
    (lessonsOf(c.id) || []).filter(l => l.free).forEach(l => {
      out.push({
        id:'cl_' + l.id, type:'class', title:l.t, text:(l.d || 'Открытый урок курса «' + c.t + '»'),
        expert:c.e, min:l.min || 15, tags:(COURSE_TAGS[c.id] || []), status:'live', free:true,
        video:l.video || '', fromCourse:c.id, aud:[], level:'any'
      });
    });
  });
  return out;
}
