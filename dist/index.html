/* ---------- запуск ---------- */
async function initSync(){
  const ping = await apiCall('ping', null, { silent:true, force:true });
  SYNC.alive = !!ping;
  if(!SYNC.alive){
    console.info('[Eva] Сервер не найден — работаем локально в этом браузере');
    return;
  }
  await syncPull(true);
  await pullDm();
  if(S.screen === 'app') render();
  /* пока вкладка не на виду, сервер не тревожим совсем */
  setInterval(() => {
    if(document.hidden || SYNC.sending || S.sheet) return;
    syncPull(true).then(ch => { if(ch) softRender(); });
    pullDm().then(ch => { if(ch) softRender(); });
  }, 30000);
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && !SYNC.sending) syncPull(true).then(ch => { if(ch) softRender(); });
  });
  // если что-то не отправилось — пробуем ещё раз
  setInterval(() => { if(Object.keys(SYNC.queue).length) flushSync(); }, 15000);
  window.addEventListener('online', () => { SYNC.alive = true; flushSync(); });
}

function ask(q){
  if(!q || !q.trim()) return;
  S.eva = S.eva || []; S.eva.push({r:'me', t:q.trim()});
  const a = evaAnswer(q.toLowerCase());
  S.eva.push({r:'eva', t:a});
  render();
  const c = $('#chat'); if(c) c.scrollTop = c.scrollHeight;
  speak(a);
}

function evaAnswer(q){
  const day = S.program[S.day], left = day.tasks.filter(t => !t.done);
  if(/аффирмац|прочит/.test(q)) return day.tasks[0].text;
  if(/балл|звёзд|звезд|статус|уровен/.test(q)){
    const {next} = levelNow();
    return `У тебя ${S.points} баллов и ${S.stars} из ${starsTotal()} звёзд на этой неделе.` + (next ? ` До статуса «${esc(next.n)}» осталось ${next.from - S.points}.` : '');
  }
  if(/почему|как.*собра|подобра/.test(q))
    return `Я собрала программу по твоим темам: ${S.tags.slice(0,4).join(', ')}. Из ${LIB.length} уроков библиотеки выбрала те, где совпадение выше всего - среднее по программе ${S.match}%.`;
  if(/нет времени|не успева|некогда|нет сил|устал|тяжел/.test(q)){
    S.gentle = true;
    return 'Включила мягкий режим: сегодня только аффирмация на одну минуту. Остальное подождёт, программа никуда не денется.';
  }
  if(/сегодня|делать|задани|план/.test(q))
    return left.length ? `Осталось ${plural(left.length,'задание','задания','заданий')}: ${left.map(t => t.title).join(', ')}. Начни с самого короткого - это ${left.slice().sort((a,b)=>a.min-b.min)[0].title}.`
                       : 'Всё на сегодня закрыто. Три звезды твои, можно выдохнуть.';
  if(/пересобра|нов.*программ|друг.*программ/.test(q)){ setTimeout(() => openSheet('rebuild'), 500); return 'Открываю настройки программы.'; }
  if(/сплю|сон|бессонниц/.test(q)) return 'Посмотри «Йога-нидра перед сном» у Марины Ясной - двадцать минут лёжа, многие засыпают на середине. Найдёшь в контенте по тегу «сон».';
  if(/тревог|паник|страшно/.test(q)) return 'В моменте помогает удлинённый выдох: вдох на четыре, выдох на восемь. В библиотеке это «Дыхание при тревоге», шесть минут.';
  if(/курс/.test(q)) return `Под твои темы ближе всего «${COURSES[0].t}» от ${COURSES[0].e}. Открой вкладку Курсы.`;
  if(/привет|здравств|как дела/.test(q)) return `${hello()}, ${S.name || 'Ева'}. Чем помочь?`;
  return 'Я умею рассказать про сегодняшний день, объяснить логику программы, включить мягкий режим и прочитать аффирмацию вслух. Спроси что-то из этого.';
}

function listen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return toast('Распознавание речи работает в Chrome и Safari');
  const r = new SR(); r.lang = 'ru-RU'; r.interimResults = false;
  r.onresult = e => ask(e.results[0][0].transcript);
  r.onerror = () => toast('Не расслышала, попробуй ещё раз');
  r.start(); toast('Слушаю...');
}

function checkout(){
  const _items = S.cart.map(c => ({id:c.id, n:c.n}));
  const items = S.cart.map(c => ({...GOODS.find(g => g.id === c.id), n:c.n}));
  const total = items.reduce((a,i) => a + i.p*i.n, 0);
  const used = Math.min(S.bonus, Math.round(total*0.3));

  S.bonus = S.bonus - used + cb;
  S.points += Math.min(50, Math.round(total/200));
  items.forEach(i => S.purchases.unshift({t:i.t, p:i.p*i.n, cb:Math.round(i.p*i.n*0.05), date:'сегодня'}));
  S.orders.unshift({id:'o'+Date.now().toString(36), who:S.name || 'Гостья',
    mail:S.user ? S.user.email : '—', items:_items, sum:total, bonus:used, st:'новый',
    d:'сегодня', city:(S.datingProfile && S.datingProfile.city) || 'Москва', phone:S.phone || ''});
  S.cart = []; S.page = 'profile'; render(); schedulePersist();

  const c = COURSES.find(x => x.id === id);

  S.bonus -= used; S.courses.push(id); S.points += 50;
  S.purchases.unshift({t:c.t, p:c.p - used, cb:0, date:'сегодня'});

/* ---------- черновик материала ---------- */
function cDraft(){
  if(!S.cd) S.cd = {type:'practice', title:'', text:'', min:10, video:'', tags:[], free:true,
                    aud:[], level:'any', days:[], key:'draft_'+Date.now().toString(36)};
  return S.cd;
}
function setCD(f, v){ cDraft()[f] = v; }
function tgNew(btn, t){
  const d = cDraft();
  const on = d.tags.includes(t);
  d.tags = on ? d.tags.filter(x => x !== t) : [...d.tags, t];
  btn.classList.toggle('on', !on);
  const c = document.getElementById('tagcount');
  if(c) c.textContent = d.tags.length ? '· выбрано ' + d.tags.length : '';
}

function saveContent(){
  const d = cDraft();
  if(!d.title.trim() || !d.text.trim()) return toast('Заполни название и описание');
  const id = 'n'+Date.now().toString(36);
  if(MEDIA[d.key]){ MEDIA[id] = MEDIA[d.key]; delete MEDIA[d.key]; }
  const item = {id, type:d.type, title:d.title.trim(), text:d.text.trim(), min:d.min || 10,
    video:d.video || '', free:d.free !== false, aud:d.aud || [], level:d.level || 'any', days:d.days || [],
    tags:d.tags.length ? d.tags : suggestTags(d.title + ' ' + d.text),
    expert:S.role === 'expert' ? me().n : 'Редакция Eva'};
  if(S.role === 'admin'){ LIB.push({...item, status:'live'}); toast('Опубликовано в библиотеке'); }
  else { S.pending.push({...item, status:'pending', sent:'только что'}); toast('Отправлено на проверку'); }
  S.cd = null; S.sheet = null; pushShared(); render();
}

function createCourse(){
  const d = kDraft();
  if(!d.t.trim()) return toast('Назови курс');
  const id = 'c'+Date.now().toString(36);
  COURSES.push({id, t:d.t.trim(), d:d.d.trim() || 'Описание появится позже',
    e:d.e, n:0, p:d.p || 4900, old:d.old || 7900, r:5.0, s:0, draft:true});
  COURSE_KIND[id] = d.kind;
  COURSE_TAGS[id] = d.tags;
  COURSE_INFO[id] = {who:['Опиши, кому подойдёт курс'], gives:['Что получит ученица'], promo:d.d.trim()};
  REVIEWS[id] = [];
  S.lessons[id] = [];
  S.modules = S.modules || {};
  S.modules[id] = [{n:1, t:'Модуль 1', units:[]}];
  S.kd = null; S.sheet = null;
  pushShared();
  openCourseEditor(id);
  toast('Курс создан. Добавь модули и уроки');
}

function leaveClub(id){
  if(!confirm('Отменить подписку на клуб? Доступ пропадёт сразу.')) return;

  S.joined = S.joined.filter(x => x !== id);

}

/* Подробности мероприятия: коротко видно сразу, детали — по неприметной
   строчке. Раскрываем без перерисовки экрана, иначе страница дёргается. */
function evDetails(e){
  const prog = Array.isArray(e.program) ? e.program.filter(Boolean) : [];
  const has = e.full || prog.length || e.who || e.bring;
  if(!has) return '';
  const open = S.evMore === e.id;
  return `<button class="evmore${open?' on':''}" onclick="toggleEvDet('${attJs(e.id)}', this)">
      <span>Подробности</span><i>⌄</i></button>
    <div class="evdet${open?' on':''}" id="evdet_${esc(e.id)}" style="max-height:${open?'none':'0'}">
      <div class="evdet-in">
        ${e.full ? richText(e.full) : ''}
        ${prog.length ? `<div class="dh">Расписание</div>
          <ul class="evprog">${prog.map(x => {
            const m = /^\s*(\d{1,2}[:.]\d{2}|[А-Яа-яЁё]{2}\s+\d{1,2}[:.]\d{2})\s*[—–-]\s*(.+)$/.exec(x);
            return m ? `<li><b>${esc(m[1])}</b> ${esc(m[2])}</li>` : `<li>${esc(x)}</li>`;
          }).join('')}</ul>` : ''}
        ${e.who ? `<div class="dh">Для кого</div><p>${esc(e.who)}</p>` : ''}
        ${e.bring ? `<div class="dh">${e.mode === 'онлайн' ? 'Как подключиться' : 'Что взять с собой'}</div>
          <p>${esc(e.bring)}</p>` : ''}

}

/* плавное раскрытие: считаем высоту содержимого и анимируем её,
   а не перерисовываем весь экран */
function toggleEvDet(id, btn){
  const box = document.getElementById('evdet_' + id);
  if(!box){ S.evMore = S.evMore === id ? null : id; return render(); }
  const inner = box.firstElementChild;
  const open = box.classList.contains('on');
  if(open){
    /* сначала фиксируем текущую высоту, заставляем браузер её посчитать
       и только потом сжимаем — иначе перехода не будет */
    box.style.maxHeight = inner.offsetHeight + 'px';
    void box.offsetHeight;
    box.classList.remove('on');
    box.style.maxHeight = '0px';
    S.evMore = null;
  } else {
    box.classList.add('on');
    box.style.maxHeight = inner.offsetHeight + 'px';
    S.evMore = id;
    setTimeout(() => { if(box.classList.contains('on')) box.style.maxHeight = 'none'; }, 280);
  }
  if(btn) btn.classList.toggle('on', !open);
}

/* Листаем фото мероприятия, меняя одну картинку.
   Раньше здесь был render(): страница пересобиралась целиком, прокрутка
   улетала наверх — со стороны это выглядело как перезагрузка. */
function slideEv(d){
  const e = EVENTS.find(x => x.id === (S.sheet||{}).id);
  if(!e) return;
  const shots = [e.id, ...(e.gallery || [])].filter(k => MEDIA[k]);
  const n = shots.length;
  if(n < 2) return;
  S.evSlide = ((S.evSlide || 0) + d + n) % n;
  const img = document.getElementById('evshot');
  if(!img) return render();                       // шторки нет — обычный путь
  img.src = safeUrl(MEDIA[shots[S.evSlide]]);
  const dots = document.getElementById('evdots');
  if(dots) [...dots.children].forEach((i, k) => i.className = k === S.evSlide ? 'on' : '');
}

  return S.evd;

function setEvD(f, v){ evDraft()[f] = v; }

/* снимаем всё, что сейчас в полях, в черновик — вызывается перед перерисовкой */
function keepEventFields(){
  const d = evDraft();
  [['ev_t','t'], ['ev_d','d'], ['ev_tm','tm'], ['ev_c','city'], ['ev_pl','place'],
   ['ev_a','about'], ['ev_f','full'], ['ev_w','who'], ['ev_b','bring']].forEach(([id, f]) => {

  const pr = $('#ev_pr'); if(pr && pr.value !== '') d.program = evLines(pr.value);
  [['ev_p','price'], ['ev_s','seats']].forEach(([id, f]) => {
    const e = $('#' + id); if(e && e.value !== '') d[f] = +e.value || 0;

/* Переключатели в форме меняют только то, что должны: экран не
   перерисовывается, набранное остаётся на месте, страница не дёргается. */
function tgUnlimited(btn){
  const d = evDraft();
  d.unlimited = !d.unlimited;
  const sw = btn && btn.querySelector('.sw');
  if(sw){
    sw.classList.toggle('on', d.unlimited);
    const dot = sw.querySelector('i');
    if(dot) dot.style.left = d.unlimited ? '19px' : '';
  }
  const seats = $('#ev_s'); if(seats) seats.disabled = d.unlimited;
  const note = $('#ev_unl'); if(note) note.hidden = !d.unlimited;
  schedulePersist();
}

/* выбор одной фишки из ряда: подсветка переставляется на месте */
function markChip(btn){
  const wrap = btn && btn.parentElement;
  if(wrap) [...wrap.children].forEach(b => b.classList.toggle('on', b === btn));
}
function pickChip(btn, path, value){
  keepEventFields();
  pathSet(S, path, value);
  markChip(btn);
  schedulePersist();
}
/* формат встречи: подпись поля и адрес переключаются без перерисовки */
function pickMode(btn, mode){
  keepEventFields();
  evDraft().mode = mode;
  markChip(btn);
  const lbl = $('#ev_clbl'), city = $('#ev_c'), place = $('#ev_place');
  if(lbl)   lbl.textContent = mode === 'онлайн' ? 'Платформа' : 'Город';
  if(city)  city.placeholder = mode === 'онлайн' ? 'Zoom' : 'Москва';
  if(place) place.hidden = mode !== 'офлайн';
  schedulePersist();
}
function addEvPhoto(){
  keepEventFields();
  const d = evDraft(), gk = d.key + '_g' + Date.now().toString(36);
  pickImage(gk, () => { d.gallery.push(gk); render(); });
}
function setEvCover(gk){
  keepEventFields();
  const d = evDraft(), key = d.key;
  const old = MEDIA[key];
  MEDIA[key] = MEDIA[gk];
  const i = d.gallery.indexOf(gk);
  if(i > -1){ if(old) MEDIA[gk] = old; else d.gallery.splice(i,1); }

/* сообщение уходит на сервер и появляется у женщины в личных сообщениях */
async function sendUserMessage(id){
  const u = allUsers().find(x => x.id === id);
  if(!u) return;
  const text = (($('#w_t')||{}).value || '').trim();
  const subject = (($('#w_s')||{}).value || '').trim();
  if(!text) return toast('Напиши сообщение');
  if(!u.real) return toast('Это демонстрационная запись — писать некому');
  if(SYNC.alive === false) return toast('Отправка работает только при подключённом сервере');
  const r = await apiCall('dm_send', { email:u.m, subject, text,
                                       from:S.adminName || 'Eva Space' }, { silent:true });
  if(!r) return toast(SYNC.lastError || 'Не отправилось');
  S.sheet = null; render();
  toast('Сообщение отправлено в личные сообщения');
}

/* =====================================================================
   EVA EVENTS — цепочка сообщений вокруг мероприятия
   Задача простая: чтобы женщина дошла. Для этого её ведут:
   сразу после записи — подтверждение и вопрос про подругу, за три дня —
   обязательное «подтверждаю» или «не смогу», накануне и в день —
   напоминание, после — вопрос о впечатлении.
   Место, от которого отказались заранее, достаётся другой.
   ===================================================================== */

const EVA_EVENTS = 'Eva Events';

/* Шаги цепочки: смещение от начала мероприятия в часах.
   За купленный билет женщина уже заплатила — дёргать её подтверждениями
   невежливо, вместо этого напоминаем и зовём взять подругу. На бесплатном
   подтверждение и есть главный рычаг доходимости: место стоит денег
   ведущей, даже когда не стоит денег гостье. */
const EV_CHAIN = [
  {k:'booked',  h:null,  label:'сразу после записи'},
  {k:'invite',  h:7*24,  label:'за неделю'},
  {k:'confirm', h:3*24,  label:'за три дня', when:'free'},
  {k:'hold',    h:3*24,  label:'за три дня', when:'paid'},
  {k:'day',     h:24,    label:'накануне'},
  {k:'today',   h:3,     label:'в день мероприятия'},
  {k:'after',   h:-24,   label:'на следующий день'}
];
const evPaid = e => !!(e && e.price);
/* шаги именно этого мероприятия */
function evSteps(e){
  const kind = evPaid(e) ? 'paid' : 'free';
  return EV_CHAIN.filter(s => !s.when || s.when === kind);
}

const evStep = k => EV_CHAIN.find(s => s.k === k);
const evById = id => EVENTS.find(e => e.id === id);

/* когда мероприятие начинается */
function evStart(e){
  const d = evDay(e && e.d);
  if(!d) return null;
  const m = /^(\d{1,2})[:.](\d{2})/.exec(String(e.tm || '19:00'));
  if(m) d.setHours(+m[1], +m[2], 0, 0);
  return d.getTime();
}
const evWhenText = e => {
  const d = evDay(e.d);
  return d ? d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'}) + ', ' + (e.tm || '') : (e.tm || '');
};
const evPlaceText = e => e.mode === 'онлайн'
  ? 'Онлайн' + (e.city ? ' · ' + e.city : '')
  : [e.city, e.place].filter(Boolean).join(', ');

/* ---------- состояние цепочки ---------- */
function evState(id){
  S.evChain = S.evChain || {};
  return S.evChain[id];
}
function evStateSet(id, patch){
  S.evChain = S.evChain || {};
  S.evChain[id] = Object.assign({sent:[], status:'booked', plusOne:false, at:Date.now()},
                                S.evChain[id] || {}, patch || {});
  return S.evChain[id];
}

/* ---------- переписка ---------- */
function evThread(e){
  initInbox();
  let t = S.inbox.find(x => x.kind === 'мероприятие' && x.eid === e.id);
  if(!t){
    t = {id:'ev_' + e.id, from:EVA_EVENTS, c:'#111014', kind:'мероприятие', eid:e.id,
         ago:'только что', unread:false, sys:true, msgs:[]};
    S.inbox.unshift(t);
  }
  return t;
}
function evSay(e, k, text, act, ticket){
  const t = evThread(e);
  const now = new Date();
  const step = (evSteps(e).find(x => x.k === k) || evStep(k));
  t.msgs.push({me:false, t:text, when:step ? step.label : '',
    tm:String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'),
    act:act || '', ticket:!!ticket, eid:e.id});
  t.unread = true;
  t.ago = 'только что';
  const st = evStateSet(e.id, {});
  if(k && st.sent.indexOf(k) < 0) st.sent.push(k);
  schedulePersist();
}

/* ---------- тексты шагов ---------- */
function evMessage(e, k){
  const st = evStateSet(e.id, {});
  const when = evWhenText(e), place = evPlaceText(e);
  const bring = e.bring ? '\nЧто взять: ' + e.bring : '';

  if(k === 'booked') return {t:
    (evPaid(e) ? 'Билет у тебя. ' : 'Место за тобой. ') + '«' + e.t + '»\n\n' +
    '📅 ' + when + '\n📍 ' + place +
    (evPaid(e) ? '\n🎟 ' + money(e.price) + ', оплачено' : '\n🎟 бесплатно') + '\n\n' +
    (evPaid(e)
      ? 'Подтверждать ничего не нужно — просто приходи. Напомню накануне и в день встречи.'
      : 'За три дня попрошу подтвердить, что идёшь: на бесплатных местах всегда есть очередь.') +
    '\n\nСкажи, придёшь одна или с подругой?', act:'plusone', ticket:true};

  if(k === 'invite') return st.plusOne
    ? {t:'Держи приглашение для подруги на «' + e.t + '».\n\n' +
         'Она открывает ссылку, вводит код и попадает на то же место рядом с тобой.\n' +
         'Код: ' + evInviteCode(e) + '\n\n' +
         'Если подруга передумала — просто не отправляй код, на записи это не скажется.', act:''}
    : {t:'Через неделю «' + e.t + '».\n\n' +
         'Вдвоём доходят чаще — если хочешь, возьми подругу. Для неё будет скидка по приглашению.',
       act:'invite'};

  if(k === 'confirm') return {t:
    'Через три дня «' + e.t + '», ' + when + '.\n\n' +
    'Скажи, идёшь? Если планы поменялись — так тоже бывает, просто нажми «не смогу», ' +
    'и место достанется той, кто ждёт. Никто не расстроится, честный ответ дороже.', act:'confirm'};

  if(k === 'hold') return {t:
    'Через три дня «' + e.t + '», ' + when + '.\n\n' +
    'Билет у тебя, ничего подтверждать не надо. Если хочешь, возьми с собой подругу — ' +
    'вдвоём и дорога легче, и разговор потом длиннее.', act:'invite'};

  if(k === 'day') return {t:
    'Завтра «' + e.t + '», в ' + (e.tm || '') + '.\n\n' +
    '📍 ' + place + bring + '\n\n' +
    (e.mode === 'онлайн'
      ? 'Ссылку пришлю утром, она откроется за десять минут до начала. Можно быть без камеры.'
      : 'Если опоздаешь — не страшно, просто напиши сюда, тебя дождутся.'),
    act:'', ticket:true};

  if(k === 'today') return {t:
    'Сегодня в ' + (e.tm || '') + '. Ждём тебя.\n\n' +
    (e.mode === 'онлайн' ? '🔗 Ссылка открыта, заходи за пять минут до начала.' : '📍 ' + place) +
    '\n\nЕсли день сложился иначе — напиши сюда, это нормально.', act:'', ticket:true};

  if(k === 'after') return {t:
    'Ну как «' + e.t + '»?\n\n' +
    'Сначала главное: получилось прийти? Отвечай честно — по этому мы понимаем, ' +
    'какие встречи собирают, а какие только выглядят красиво.', act:'came'};

  return null;
}

/* код приглашения для подруги: короткий и читаемый вслух */
function evInviteCode(e){
  const st = evStateSet(e.id, {});
  if(!st.code){
    st.code = 'EVA-' + String(hash(e.id + (myMail() || S.name || ''))).slice(0, 4);
    schedulePersist();
  }
  return st.code;
}

/* ---------- запуск и остановка ---------- */
function startEvChain(id){
  const e = evById(id);
  if(!e) return;
  const st = evStateSet(id, {status:'booked', at:Date.now(), sent:[]});
  const t = evThread(e);
  t.msgs = [];                          // записалась заново — переписка начинается сначала
  st.sent = [];
  evFire(e, 'booked');
  if(S.evFast !== false) evDemoTimer();
  else tickEvChain();
}
function stopEvChain(id, why){
  const st = evState(id);
  if(!st) return;
  st.status = why || 'cancelled';
  schedulePersist();
}

/* отправка одного шага */
function evFire(e, k){
  const m = evMessage(e, k);
  if(!m) return false;
  evSay(e, k, m.t, m.act, m.ticket);
  return true;
}

/* ---------- расписание ---------- */
/* какие шаги уже пора отправить по настоящему времени */
function evDueSteps(e, st){
  const start = evStart(e);
  if(!start) return [];
  const left = (start - Date.now()) / 36e5;              // часов до начала
  return evSteps(e).filter(s => s.h !== null && left <= s.h && st.sent.indexOf(s.k) < 0)
                   .map(s => s.k);
}
function tickEvChain(){
  if(S.evFast !== false) return;                        // в ускоренном режиме шагами двигает таймер
  let changed = false;
  Object.keys(S.evChain || {}).forEach(id => {
    const st = S.evChain[id], e = evById(id);
    if(!e || !st || st.status === 'cancelled') return;
    evDueSteps(e, st).forEach(k => { if(evFire(e, k)) changed = true; });
  });
  return changed;
}

/* Ускоренный показ: шаги идут раз в десять секунд, у каждого письма
   написано, за сколько до мероприятия оно пришло бы на самом деле. */
let evTimer = null;
function evDemoTimer(){
  if(evTimer) return;
  evTimer = setInterval(() => {
    if(S.evFast === false) return;
    let moved = false;
    Object.keys(S.evChain || {}).forEach(id => {
      const st = S.evChain[id], e = evById(id);
      if(!e || !st || st.status === 'cancelled') return;
      const next = evSteps(e).find(s => s.h !== null && st.sent.indexOf(s.k) < 0);
      if(next && evFire(e, next.k)) moved = true;
    });
    if(moved && S.screen === 'app'){ try { render(); } catch(err){ console.error('[Eva] цепочка:', err); } }
  }, 10000);
}

/* ---------- ответы женщины ---------- */
function evAnswer(id, text){
  const e = evById(id);
  if(!e) return;
  const t = evThread(e);
  const now = new Date();
  t.msgs.push({me:true, t:text,
    tm:String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0')});
}
function evPlusOne(id, yes){
  const e = evById(id); if(!e) return;
  evAnswer(id, yes ? 'Приду с подругой' : 'Приду одна');
  const st = evStateSet(id, {plusOne:!!yes});
  evSay(e, '', yes
    ? 'Отлично, беру два места. За неделю пришлю приглашение для подруги.'
    : 'Записала. Если передумаешь и захочешь взять подругу — скажи, место найдём.', yes ? '' : 'invite');
  st.sent = st.sent; render(); schedulePersist();
}
function evInvite(id){
  const e = evById(id); if(!e) return;
  evAnswer(id, 'Хочу приглашение для подруги');
  evStateSet(id, {plusOne:true});
  evSay(e, '', 'Приглашение готово — открой и перешли подруге.\n\nКод: ' + evInviteCode(e), '');
  S.sheet = {k:'ticket', id:e.id, mode:'invite'};
  render(); schedulePersist();
}
function evConfirm(id, yes){
  const e = evById(id); if(!e) return;
  if(yes){
    evAnswer(id, 'Подтверждаю, иду');
    evStateSet(id, {status:'confirmed'});
    evSay(e, '', 'Записала окончательно. Ждём тебя ' + evWhenText(e) + '.\n' +
      'Накануне напомню про адрес и что взять с собой.', '');
  } else {
    evAnswer(id, 'Не смогу прийти');
    evStateSet(id, {status:'cancelled'});
    /* место возвращается сразу: в этом весь смысл раннего отказа */
    if(S.myEvents.includes(id)){
      S.myEvents = S.myEvents.filter(x => x !== id);
      e.left = Math.min(e.seats || e.left + 1, (e.left || 0) + 1);
      syncPush(['events']);
    }
    evSay(e, '', 'Спасибо, что сказала заранее — место уйдёт другой женщине.\n' +
      'Запись отменена, деньги за билет вернутся тем же способом в течение трёх дней.', '');
  }
  render(); schedulePersist();
}
/* Дошла или нет — главный вопрос: из ответов складывается доходимость,
   а из оценок — понимание, что повторять. */
function evCame(id, yes){
  const e = evById(id); if(!e) return;
  evAnswer(id, yes ? 'Да, была' : 'Не получилось прийти');
  evStateSet(id, {came:!!yes, status:'done'});
  if(yes) evSay(e, '', 'Хорошо. Оцени встречу — от одной звезды до пяти. ' +
    'Это две секунды, а ведущей помогает.', 'rate');
  else evSay(e, '', 'Бывает. Скажи в двух словах, что помешало, — не для галочки, ' +
    'а чтобы в следующий раз получилось.', 'why');
  pushReview(e);
  render(); schedulePersist();
}
function evRate(id, n){
  const e = evById(id); if(!e) return;
  evAnswer(id, 'Оценка: ' + n + ' из 5');
  evStateSet(id, {rate:n});
  evSay(e, '', n >= 4
    ? 'Спасибо. Передам ведущей — ей важно это слышать. Похожие встречи буду показывать первыми.'
    : 'Спасибо за честность. Напиши пару слов, что было не так, — передам ведущей и учту в подборе.',
    n >= 4 ? '' : 'why');
  pushReview(e);
  render(); schedulePersist();
}
function evWhy(id){
  const inp = document.getElementById('evwhy_' + id);
  const v = inp ? inp.value.trim() : '';
  if(!v) return toast('Напиши хотя бы пару слов');
  const e = evById(id); if(!e) return;
  evAnswer(id, v);
  evStateSet(id, {why:v});
  evSay(e, '', 'Записала. Спасибо, что не промолчала.', '');
  pushReview(e);
  render(); schedulePersist();
}

/* отзыв уезжает на сервер: по нему админ видит доходимость и оценки */
function pushReview(e){
  const st = evStateSet(e.id, {});
  S.reviews = S.reviews || [];
  const id = 'rv_' + e.id + '_' + (myMail() || 'guest');
  const rec = {id, kind:'event', eid:e.id, title:e.t, free:!evPaid(e),
    email:myMail(), who:S.name || 'Гостья',
    came:st.came === true, rate:st.rate || 0, why:st.why || '', at:Date.now()};
  const i = S.reviews.findIndex(r => r.id === id);
  if(i >= 0) S.reviews[i] = rec; else S.reviews.push(rec);
  if(typeof syncPush === 'function') syncPush(['reviews']);
}

/* ---------- отметка о подтверждении ---------- */
function evBadge(id){
  const st = evState(id);
  if(!st || st.status === 'cancelled') return '';
  if(st.status === 'confirmed') return '<span class="evok">подтверждено</span>';
  if(st.sent.indexOf('confirm') >= 0) return '<span class="evwait">ждём ответа</span>';
  return '';
}

/* кнопки под письмом Eva Events */

    <button class="btn xs" onclick="S.thread=null;go('home')">Не сейчас</button></div>`;

    onclick="openSheet({k:'ticket',id:'${attJs(id)}'})">Показать билет</button></div>` : '';

    <button class="btn xs" onclick="evConfirm('${attJs(id)}',false)">Не смогу</button></div>`;
  if(m.act === 'came') return `<div class="macts">

      onkeydown="if(event.key==='Enter')evWhy('${attJs(id)}')">

  return '';
}

function tourStart(){
  if(S.role !== 'user' || S.screen !== 'app') return;
  if(document.getElementById('tour')) return;
  S.tour = 0;
  const box = document.createElement('div');
  box.id = 'tour';
  box.innerHTML = `<div class="tveil"></div><div class="thole"></div><div class="ttip"></div>`;
  document.body.appendChild(box);
  window.addEventListener('resize', tourPlace);
  window.addEventListener('scroll', tourPlace, {passive:true});
  tourShow();
}

function tourShow(){
  const box = document.getElementById('tour');
  if(!box) return;
  const step = TOUR[S.tour];
  if(!step) return tourEnd();

  /* каждый шаг показываем на своём экране: она сразу видит, куда попадёт */
  if(step.tab && (S.tab !== step.tab || S.page || S.sheet)){
    S.page = null; S.sheet = null; S.course = null;
    if(S.chat) S.chat.open = null;
    S.tab = step.tab;
    render();
  }

  /* приветствие не считаем: шаги нумеруются от первой настоящей подсказки */
  const steps = TOUR.length - 1;
  const dots = TOUR.slice(1).map((_,i) => `<i class="${i < S.tour ? 'on' : ''}"></i>`).join('');
  box.querySelector('.ttip').innerHTML = `
    <div class="tipico">${step.ico}</div>
    ${step.intro ? '' :
      `<div class="tnum"><span>${S.tour} / ${steps}</span><span class="tbars">${dots}</span></div>`}
    <h3>${esc(typeof step.h === 'function' ? step.h() : step.h)}</h3>
    <p>${esc(step.p)}</p>
    <div class="tacts">
      ${step.last ? '' : `<button class="tskip" onclick="tourEnd()">Пропустить</button>`}
      ${S.tour > 1 && !step.last ? `<button class="tback" onclick="tourBack()" aria-label="Назад">‹</button>` : ''}
      <button class="tgo" onclick="${step.last ? 'tourEnd()' : 'tourNext()'}">
        ${step.last ? 'Начать первый день' : step.intro ? 'Посмотреть' : 'Дальше'}</button>
    </div>`;
  tourPlace();
}

/* Закреплённые блоки — нижняя навигация — не прокручиваются вместе со
   страницей: их подсвечиваем там, где они стоят. */
function fixedEl(el){
  for(let n = el; n && n !== document.body; n = n.parentElement)
    if(getComputedStyle(n).position === 'fixed') return true;
  return false;
}

/* Считаем место каждый раз заново: экран мог прокрутиться, повернуться
   или перерисоваться, и подсветка обязана остаться на своём блоке. */
function tourPlace(){
  const box = document.getElementById('tour');
  if(!box) return;
  const step = TOUR[S.tour];
  if(!step) return;
  const hole = box.querySelector('.thole'), tip = box.querySelector('.ttip'),
        veil = box.querySelector('.tveil');
  const t = step.at ? document.querySelector(step.at) : null;
  const vh = window.innerHeight, vw = window.innerWidth, gap = 14, edge = 12;

  if(!t){
    hole.style.display = 'none';
    veil.style.display = '';
    tip.className = 'ttip mid';
    tip.style.top = '';
    return;
  }

  /* высоту карточки надо знать заранее: от неё зависит, сколько места
     останется подсветке и с какой стороны карточка встанет */
  tip.className = 'ttip';
  tip.style.top = '-9999px';
  const tipH = tip.offsetHeight || 210;
  const pad = step.pad == null ? 8 : step.pad;
  const room = Math.max(140, vh - tipH - 2*gap - 2*edge);

  if(!fixedEl(t)){
    const r0 = t.getBoundingClientRect();
    const a = edge, b = edge + room;
    if(r0.top < a || r0.bottom > b){
      /* блок выше экрана целиком не показать — подводим его верх под край */
      let want = window.scrollY + r0.top - a;
      if(r0.height < room) want -= (room - r0.height) / 2;
      window.scrollTo(0, Math.max(0, want));
    }
  }

  const r = t.getBoundingClientRect();
  /* к краю экрана прижимаемся вплотную: иначе поверх шапки, которая и так
     начинается от нуля, рисуется белая полоска обводки */
  const top = r.top - pad;
  /* длинный блок подсвечиваем не весь: карточке тоже нужно место */
  const bot = Math.min(vh, top + room, r.bottom + pad);
  hole.style.display = '';
  veil.style.display = 'none';
  hole.style.left = (r.left - pad) + 'px';
  hole.style.top = top + 'px';
  hole.style.width = Math.min(vw, r.width + pad*2) + 'px';
  hole.style.height = Math.max(28, bot - top) + 'px';
  /* без явного скругления повторяем форму самого блока — подсветка садится
     на него как влитая */
  hole.style.borderRadius = step.round != null ? step.round + 'px'
    : pad ? '20px' : (getComputedStyle(t).borderRadius || '20px');

  /* карточку ставим с той стороны, где для неё есть место */
  if(bot + gap + tipH <= vh - edge){
    tip.classList.add('below');
    tip.style.top = (bot + gap) + 'px';
  } else if(top - gap - tipH >= edge){
    tip.classList.add('above');
    tip.style.top = (top - gap - tipH) + 'px';
  } else {
    tip.classList.add('mid');
    tip.style.top = '';
  }

  /* остриё смотрит в середину подсветки, но не сползает с карточки */
  const tr = tip.getBoundingClientRect();
  const x = Math.min(Math.max(r.left + r.width/2 - tr.left - 8, 20), tr.width - 36);
  tip.style.setProperty('--ax', x + 'px');
}

function tourNext(){ S.tour++; S.tour < TOUR.length ? tourShow() : tourEnd(); }
function tourBack(){ if(S.tour > 0){ S.tour--; tourShow(); } }

function tourEnd(){
  const box = document.getElementById('tour');
  if(box) box.remove();
  window.removeEventListener('resize', tourPlace);
  window.removeEventListener('scroll', tourPlace);
  S.tour = null;
  S.tourDone = true;
  S.tab = 'home'; S.page = null;
  render(); window.scrollTo(0, 0);
  schedulePersist();
}

/* показать подсказки заново — из настроек */
function tourAgain(){
  S.sheet = null; S.page = null; S.tab = 'home';
  render(); window.scrollTo(0, 0);
  setTimeout(tourStart, 60);
}

   Роль на платформе и роль в сообществе — разные вещи. Обычная участница
   может быть владелицей своего круга и решать там всё, оставаясь обычной
   участницей на самой платформе. Администратор платформы может всё и
   везде: за платформу отвечает он.
   ===================================================================== */

const GROLES = {
  owner:  {n:'Владелица',     s:'Описание, команда, заявки, закрытие'},
  host:   {n:'Со-ведущая',    s:'Правит описание, принимает заявки, закрепляет'},
  keeper: {n:'Хранительница', s:'Следит за разговором и встречает новеньких'},
  member: {n:'Участница',     s:'Пишет и отвечает'}
};

const GACCESS = {
  open:    {n:'Открытое',      s:'Заходит любая участница платформы'},
  request: {n:'По заявке',     s:'Видно описание, переписка — после одобрения'},
  club:    {n:'Клуб',          s:'Доступ по подписке, помесячно'},

};

/* Что можно каждой роли. Список плоский нарочно: так его видно целиком
   и не приходится держать в голове иерархию. */
const GRIGHTS = {
  owner:   ['read','write','delAny','pin','mute','kick','accept','edit','team','price','close'],
  host:    ['read','write','delAny','pin','mute','kick','accept','edit'],
  keeper:  ['read','write','delAny','mute','greet'],
  member:  ['read','write'],
  visitor: []
};

function myGRole(g){
  if(!g) return 'visitor';
  const me = myMail();
  if(me && g.owner && String(g.owner).toLowerCase() === me) return 'owner';
  /* в демонстрационных сообществах почт нет: ведущую узнаём по имени */
  if(S.role === 'expert' && g.lead && g.lead === (S.name || '')) return 'owner';
  const t = (g.team || []).find(m => m.mail && String(m.mail).toLowerCase() === me);
  if(t) return t.role || 'keeper';
  return (S.joined || []).includes(g.id) ? 'member' : 'visitor';
}

function gCan(g, act){
  if(S.role === 'admin') return true;
  return (GRIGHTS[myGRole(g)] || []).indexOf(act) >= 0;
}

  const id = 'g' + Date.now().toString(36);
  GROUPS.push({
    id, t:d.t.trim(), e:d.e || '🌸', c:d.c || '#B64F7C', m:1,
    access:d.access || 'open', price:d.access === 'club' ? (d.price || 0) : 0,
    about:d.about.trim(), who:(d.who || '').trim(),
    rules:(d.rules || []).map(r => r.trim()).filter(Boolean),
    welcome:(d.welcome || '').trim(),
    lead:S.name || 'Ведущая', owner:myMail(), status:'pending', tags:[], requests:[],
    team:[{n:S.name || 'Я', r:'ведёт сообщество', role:'owner', mail:myMail()}]
  });
  S.gdraft = null; S.sheet = null;
  S.joined = [...new Set([...(S.joined || []), id])];
  render(); schedulePersist(); syncPush(['groups']);
  toast('Отправили на согласование. Ответим в сообщениях');
}

/* =====================================================================
   ИТОГИ НЕДЕЛИ И ВОВЛЕЧЁННОСТЬ
   Раз в неделю программа пересобирается, и звёзды обнуляются. Раньше это
   происходило молча — женщина возвращалась в понедельник и видела чужую
   неделю без объяснений. Теперь Ева подводит итог: что получилось, над
   чем она работала, и что дальше.

   Тон зависит от того, как прошла неделя, и это главное правило: хвалим
   за настоящее, а не за факт захода. Пустую неделю не празднуем — но и
   не стыдим: вина не возвращает людей, она их прогоняет.
   ===================================================================== */

const EVA_NAME = 'Ева';

/* Три уровня вовлечённости. Границы взяты от 21 дела в неделе:
   две трети — сильная неделя, четверть — начатая, ниже — тихая. */
const WEEK_LEVELS = [
  {k:'strong', from:14, n:'сильная неделя'},
  {k:'middle', from:5,  n:'рабочая неделя'},
  {k:'quiet',  from:0,  n:'тихая неделя'}
];
const weekLevel = done => (WEEK_LEVELS.find(l => done >= l.from) || WEEK_LEVELS[2]).k;

/* Снимок недели делаем ДО пересборки программы: после неё считать уже
   нечего — задания заменились на новые. */
function weekSnapshot(){
  const days = (S.program || []);
  const tasks = days.flatMap(d => d.tasks || []);
  const done = tasks.filter(t => t.done);
  const byType = {affirm:0, practice:0, class:0};
  done.forEach(t => { if(byType[t.type] !== undefined) byType[t.type]++; });
  /* над чем работала: направления сделанных материалов, по убыванию */
  const topics = {};
  done.forEach(t => (t.topics || []).forEach(k => { topics[k] = (topics[k] || 0) + 1; }));
  const top = Object.keys(topics).sort((a,b) => topics[b] - topics[a]).slice(0, 3);
  return {
    at: Date.now(),
    done: done.length,
    total: tasks.length,
    days: days.filter(d => (d.tasks || []).some(t => t.done)).length,
    full: days.filter(d => (d.tasks || []).length && (d.tasks || []).every(t => t.done)).length,
    byType, topics: top,
    points: S.points || 0,
    level: weekLevel(done.length)
  };
}

/* строка «над чем работала» — только по настоящим делам, без выдумок */
function weekWork(w){
  const parts = [];
  if(w.byType.affirm)   parts.push(plural(w.byType.affirm, 'аффирмация', 'аффирмации', 'аффирмаций'));
  if(w.byType.practice) parts.push(plural(w.byType.practice, 'практика', 'практики', 'практик'));
  if(w.byType.class)    parts.push(plural(w.byType.class, 'мастер-класс', 'мастер-класса', 'мастер-классов'));
  return parts.join(', ');
}

function weekTopics(w){
  const names = (w.topics || []).map(topicName).filter(Boolean);
  if(!names.length) return '';
  return names.length === 1 ? names[0]
    : names.slice(0, -1).join(', ') + ' и ' + names[names.length - 1];
}

/* ---------- письмо от Евы ---------- */
function evaThread(){
  S.inbox = S.inbox || [];
  let t = S.inbox.find(x => x.id === 'eva_week');
  if(!t){
    t = {id:'eva_week', from:EVA_NAME, c:'#A8375C', kind:'итоги', ago:'только что',
         unread:false, sys:true, msgs:[]};
    S.inbox.unshift(t);
  }
  return t;
}

function evaSay(text, act){
  const t = evaThread();
  const now = new Date();
  t.msgs.push({me:false, t:text, act:act || '',
    tm:String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0')});
  t.unread = true;
  t.ago = 'только что';
  /* переписка с Евой длинная — держим последние тридцать сообщений */
  if(t.msgs.length > 30) t.msgs = t.msgs.slice(-30);
  schedulePersist();
}

/* Итог недели: письмо в сообщения плюс шторка при входе.
   Вызывается из checkWeek со снимком прошедшей недели. */
/* Что мешает — вопрос второй тихой недели.
   Одна тихая неделя бывает у всех. Две подряд — это почти ушедшая женщина,
   и обычным письмом её не вернуть: она его уже читала неделю назад и оно
   не сработало. Поэтому вместо итога — короткий вопрос и три ответа,
   каждый из которых что-то делает, а не просто записывается в метрику. */
const BLOCKS = [
  {k:'time',  n:'Нет времени',
   r:'Поняла. Включаю мягкий режим: два дела в день вместо трёх, минут семь. ' +
     'Когда станет полегче — вернём как было, это одна кнопка в настройках.'},
  {k:'wrong', n:'Не то, что нужно',
   r:'Спасибо, это важнее всего остального. Давай пересоберём программу — ' +
     'ответишь заново на несколько вопросов, и я подберу другое.'},
  {k:'hard',  n:'Тяжело сейчас',
   r:'Спасибо, что сказала. Программа подождёт, она никуда не денется. ' +
     'Если хочешь поговорить с живым человеком — напиши нам, мы правда отвечаем.'}
];

/* Вопрос вместо итога: пишем его на второй тихой неделе подряд и не чаще
   раза в месяц — иначе он сам превращается в фон. */
function askWhatBlocks(w){
  const name = S.name || 'Ева';
  evaSay(`${name}, вторую неделю подряд почти ничего не отмечено — и я не хочу ` +
    `делать вид, что не заметила. Не для галочки: скажи, что мешает? ` +
    `Я подстрою программу под ответ.`, 'weekBlock');
  S.lastWeek = w;
  S.weekShown = false;
  S.weekMood = null;
  S.askedBlock = S.week;
}

function weekBlock(k){
  const b = BLOCKS.find(x => x.k === k);
  if(!b) return;
  S.weekMood = k === 'time' ? 'so-so' : 'hard';
  const t = evaThread();
  t.msgs.push({me:true, t:b.n, tm:nowTime()});
  evaSay(b.r, k === 'wrong' ? 'rebuild' : (k === 'hard' ? 'support' : ''));
  if(k === 'time') S.gentle = true;
  S.sheet = null;
  render(); schedulePersist();
  toast(k === 'time' ? 'Включила мягкий режим' : 'Спасибо, что ответила');
}

function evaWeekly(w){
  if(!w || !S.user) return;
  /* считаем тихие недели подряд: на второй разговор другой */
  S.quietRun = w.level === 'quiet' ? (S.quietRun || 0) + 1 : 0;
  if(S.quietRun >= 2 && (S.askedBlock === null || S.askedBlock === undefined ||
     S.week - S.askedBlock >= 4)){
    S.quietRun = 0;
    return askWhatBlocks(w);
  }
  const name = S.name || 'Ева';
  const set = WEEK_TEXT[w.level] || WEEK_TEXT.quiet;
  const lead = set[(S.week || 0) % set.length](name);
  const work = weekWork(w), topics = weekTopics(w);

  const lines = [lead];
  /* На тихой неделе цифры не называем. «2 из 21» — это не поддержка,
     а счёт к оплате: она и так знает, что почти ничего не сделала. */
  if(w.level !== 'quiet'){
    if(w.done) lines.push(`За неделю: ${w.done} из ${w.total} дел, ${plural(w.days,'день','дня','дней')} с отметками` +
      (w.full ? `, ${plural(w.full,'день закрыт','дня закрыты','дней закрыты')} полностью` : '') + '.');
    if(work)   lines.push(`Ты прошла: ${work}.`);
    if(topics) lines.push(`Больше всего — про ${topics.toLowerCase()}.`);
  }
  lines.push(WEEK_TAIL[w.level] || WEEK_TAIL.quiet);

  evaSay(lines.join(' '), 'weekMood');
  S.lastWeek = w;
  S.weekShown = false;
  S.weekMood = null;
}

/* Ответ на «как прошла неделя» */
const MOODS = [
  {k:'good',  n:'Хорошо',        r:'Рада за тебя. Пусть новая неделя будет такой же.'},
  {k:'so-so', n:'По-разному',    r:'Так чаще всего и бывает. Главное, что ты возвращаешься.'},
  {k:'hard',  n:'Было тяжело',   r:'Спасибо, что сказала. Я собрала неделю полегче — начни с малого, остальное подождёт.'}
];
function weekMood(k){
  const m = MOODS.find(x => x.k === k);
  if(!m) return;
  S.weekMood = k;
  const t = evaThread();
  t.msgs.push({me:true, t:m.n, tm:nowTime()});
  evaSay(m.r);
  if(k === 'hard') S.gentle = true;
  S.sheet = null;
  render(); schedulePersist();
  toast(k === 'hard' ? 'Включила мягкий режим' : 'Спасибо');
}
const nowTime = () => {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};

/* ---------- шторка с итогом ---------- */
function shWeekSum(){
  const w = S.lastWeek;
  if(!w) return `<div class="empty">Итогов пока нет</div>`;
  if(S.askedBlock === S.week && !S.weekMood) return shWeekBlock(w);
  const work = weekWork(w), topics = weekTopics(w);
  const set = WEEK_TEXT[w.level] || WEEK_TEXT.quiet;
  const quiet = w.level === 'quiet';
  return `<div class="wsum wsum-${w.level}">
      <div class="wsumtop">${starMark(20, quiet ? 'rgba(255,255,255,.5)' : '#E7A339')}
        <span>Итоги недели</span></div>
      ${quiet ? `<div class="wsumsub" style="margin-top:6px">Неделя вышла тихой</div>`
              : `<div class="wsumbig">${w.done}<i>из ${w.total}</i></div>
      <div class="wsumsub">${plural(w.days,'день','дня','дней')} с отметками${
        w.full ? ` · ${plural(w.full,'день','дня','дней')} закрыто полностью` : ''}</div>`}
    </div>
    <p class="wsumtext">${esc(set[(S.week || 0) % set.length](S.name || 'Ева'))}</p>
    ${work && !quiet ? `<div class="uline first"><span class="small muted" style="flex:1">Прошла</span>
      <b style="font-size:13px">${esc(work)}</b></div>` : ''}
    ${topics && !quiet ? `<div class="uline"><span class="small muted" style="flex:1">Больше всего</span>
      <b style="font-size:13px">${esc(topics)}</b></div>` : ''}
    <div class="uline"><span class="small muted" style="flex:1">Баллов всего</span>
      <b style="font-size:13px">${w.points}</b></div>
    <p class="small muted" style="margin:14px 0 12px">${esc(WEEK_TAIL[w.level] || WEEK_TAIL.quiet)}</p>
    <div class="eyebrow" style="margin-bottom:8px">Как прошла твоя неделя?</div>
    <div class="moods">${MOODS.map(m => `<button class="mood" onclick="weekMood('${attJs(m.k)}')">
      ${esc(m.n)}</button>`).join('')}</div>
    ${typeof pushOffer === 'function' ? pushOffer() : ''}
    <button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Позже</button>`;
}

/* Вторая тихая неделя: вместо цифр — вопрос. Цифры здесь были бы упрёком:
   она и так знает, что ничего не сделала. */
function shWeekBlock(w){
  return `<div class="wsum wsum-quiet">
      <div class="wsumtop">${starMark(20, 'rgba(255,255,255,.5)')}<span>Разговор</span></div>
      <div class="wsumsub" style="margin-top:6px">Вторая тихая неделя подряд</div>
    </div>
    <p class="wsumtext">${esc(S.name || 'Ева')}, я не буду делать вид, что не заметила.
      Скажи, что мешает — я подстрою программу под ответ.</p>
    <div class="moods">${BLOCKS.map(b => `<button class="mood" onclick="weekBlock('${attJs(b.k)}')">
      ${esc(b.n)}</button>`).join('')}</div>
    <button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Позже</button>`;
}

/* ---------- напоминание в выходные ---------- */
/* Задача — вовлечённость, а не давление: пишем один раз за неделю,
   только если непройденного действительно много, и зовём посмотреть,
   а не требуем догнать. */
function weekendNudge(){
  if(!S.user || S.screen !== 'app') return false;
  const day = new Date().getDay();               // 6 — суббота, 0 — воскресенье
  if(day !== 6 && day !== 0) return false;
  if(S.nudgedWeek === S.week) return false;

  const tasks = (S.program || []).flatMap(d => d.tasks || []);
  const left = tasks.filter(t => !t.done).length;
  if(!tasks.length || left < tasks.length * 0.5) return false;

  S.nudgedWeek = S.week;
  const name = S.name || 'Ева';
  evaSay(`${name}, выходные — хорошее время догнать неделю. ` +
    `Непройденного осталось ${plural(left,'дело','дела','дел')}, но догонять всё не нужно: ` +
    `выбери одно, что откликается. Или загляни в библиотеку — там есть короткие практики на пять минут.`,
    'openContent');
  schedulePersist();
  return true;
}

/* ---------- показ при входе ---------- */
/* Шторку показываем один раз и только на главной: посреди чата или
   оплаты она была бы не к месту. */
function maybeShowWeek(){
  if(!S.lastWeek || S.weekShown) return false;
  if(S.screen !== 'app' || S.page || S.sheet || (S.chat && S.chat.open)) return false;
  if(S.role !== 'user') return false;
  S.weekShown = true;
  S.sheet = 'weekSum';
  schedulePersist();
  return true;
}

/* Открыть итоги вручную — из настроек. Если недели ещё не было,
   считаем по текущей: женщина всё равно хочет посмотреть, как идёт. */
function showWeekSum(){
  if(!S.lastWeek) S.lastWeek = weekSnapshot();
  S.page = null; S.sheet = 'weekSum';
  render();
}

/* =====================================================================
   НАПОМИНАНИЯ НА ТЕЛЕФОН
   Письмо от Евы лежит в приложении и ждёт, пока женщина зайдёт сама.
   А не заходят как раз те, кого мы теряем. Уведомление достаёт их —
   но только пока ему верят, поэтому обещание здесь жёсткое и одно:
   не чаще двух раз в неделю и только от Евы. Итоги в понедельник,
   напоминание в субботу. Ничего про акции, курсы и мероприятия.

   Как это устроено технически. Приложение ставится на экран телефона —
   это и есть «веб-версия», отдельного приложения из магазина не нужно.
   На Android и в Chrome уведомления работают и во вкладке. На iPhone,
   начиная с iOS 16.4, — только у приложения, добавленного на экран
   «Домой»: во вкладке Safari кнопки разрешения просто нет. Поэтому
   на айфоне сначала предлагаем поставить, а разрешение спрашиваем уже
   внутри установленного приложения.
   ===================================================================== */

const PUSH_PROMISE = 'Не чаще двух раз в неделю и только от Евы: итоги в понедельник ' +
  'и напоминание в субботу. Ни акций, ни рекламы курсов — это обещание.';

let pushKey = null;                       // публичный ключ сервера, берём один раз

const pushApi = () => 'serviceWorker' in navigator &&
  'PushManager' in window && 'Notification' in window;

/* Почему нельзя — человеческим языком, а не «not supported» */
function pushWhy(){
  if(!window.isSecureContext && location.protocol !== 'http:')
    return 'Уведомления работают только на защищённом соединении (https)';
  if(isIOS() && !isStandalone())
    return 'На айфоне уведомления приходят приложению с экрана «Домой». Поставь Eva Space — и вернись сюда';
  if(!pushApi())
    return 'Этот браузер уведомления не умеет. Попробуй Chrome или Safari';
  if(Notification.permission === 'denied')
    return 'Уведомления запрещены в настройках телефона. Разреши их для Eva Space и вернись';
  return '';
}

/* off — можно включить, on — включены, no — нельзя и почему */
function pushState(){
  if(!S.user) return 'no';
  if(pushWhy()) return 'no';
  if(Notification.permission !== 'granted') return 'off';
  return S.pushOn ? 'on' : 'off';
}

const b64ToBytes = s => {
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
};

async function pushServerKey(){
  if(pushKey) return pushKey;
  const r = await apiCall('push_key', null, {silent:true});
  pushKey = r && r.key ? r.key : null;
  return pushKey;
}

/* Включение. Вызывается только по нажатию — иначе браузер не покажет
   запрос разрешения, а на айфоне просто откажет. */
async function pushOn(){
  const why = pushWhy();
  if(why){
    if(isIOS() && !isStandalone()) return openSheet('install');
    return toast(why);
  }
  if(SYNC.alive === false) return toast('Нужен сервер: без него напоминание некому отправить');

  let perm = Notification.permission;
  if(perm !== 'granted') perm = await Notification.requestPermission();
  if(perm !== 'granted'){
    render();
    return toast(perm === 'denied' ? 'Уведомления запрещены — можно разрешить в настройках телефона'
                                   : 'Хорошо, не буду напоминать');
  }

  const key = await pushServerKey();
  if(!key) return toast('Сервер не отдал ключ — попробуй позже');

  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe(
      {userVisibleOnly:true, applicationServerKey:b64ToBytes(key)});
    const j = sub.toJSON();
    const r = await apiCall('push_save', {
      endpoint: sub.endpoint,
      p256dh: (j.keys || {}).p256dh || '',
      auth:   (j.keys || {}).auth || ''
    }, {silent:true});
    if(!r) return toast('Не получилось сохранить — попробуй ещё раз');
    S.pushOn = true; schedulePersist(); render();
    toast('Договорились. Ева напишет в понедельник');
  } catch(e){
    console.error('[Eva] уведомления:', e);
    toast('Телефон не дал подписаться на уведомления');
  }
}

async function pushOff(){
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await apiCall('push_drop', {endpoint: sub.endpoint}, {silent:true});
      await sub.unsubscribe();
    } else {
      await apiCall('push_drop', {endpoint: ''}, {silent:true});
    }
  } catch(e){}
  S.pushOn = false; schedulePersist(); render();
  toast('Больше не напоминаю');
}

function pushToggle(){ return S.pushOn ? pushOff() : pushOn(); }

/* Проверка «дошло или нет»: женщина нажимает сама и видит уведомление
   своими глазами. Без этого включение — акт веры. */
async function pushCheck(){
  const r = await apiCall('push_test', {}, {silent:true});
  if(!r) return toast('Не получилось — проверь связь');
  toast(r.sent ? 'Отправила, посмотри на экран телефона'
               : 'Ни одного устройства не подписано');
}

/* ---------- где предлагаем ---------- */

/* Строка в настройках: всегда честная — и когда включено, и когда нельзя */
function pushRow(){
  if(!S.user || S.role !== 'user') return '';
  const st = pushState();
  const why = pushWhy();
  return `<button class="uline" style="width:100%;text-align:left" onclick="${
      st === 'no' ? (isIOS() && !isStandalone() ? "openSheet('install')" : "toast('" + attJs(why) + "')")
                  : 'pushToggle()'}">
      <span style="flex:1;font-size:13.5px;font-weight:600">Напоминания от Евы
        <span class="small muted" style="display:block;font-weight:400;margin-top:2px">${
          st === 'on' ? 'Включены · два раза в неделю' : (why || 'Итоги недели и напоминание в субботу')}</span></span>
      <span class="${st === 'on' ? 'pill on' : 'muted'}">${st === 'on' ? 'вкл' : (st === 'no' ? '' : '›')}</span></button>
    ${st === 'on' ? `<button class="uline" style="width:100%;text-align:left" onclick="pushCheck()">
      <span style="flex:1;font-size:13.5px">Проверить, доходят ли</span><span class="muted">›</span></button>` : ''}`;
}

/* Предложение включить — один раз и в правильный момент: сразу после
   того, как она прочитала первое письмо Евы про неделю. Раньше просить
   рано: непонятно, о чём вообще будут напоминать. */
function pushOffer(){
  if(S.pushAsked || S.pushOn) return '';
  if(!S.user || S.role !== 'user') return '';
  if(pushWhy() && !(isIOS() && !isStandalone())) return '';
  return `<div class="pushoffer">
      <b>Присылать это на телефон?</b>
      <p>${esc(PUSH_PROMISE)}</p>
      <div class="row" style="gap:8px">
        <button class="btn xs acc" onclick="pushFromOffer()">Присылать</button>
        <button class="btn xs" onclick="pushNoThanks()">Не надо</button>
      </div>
    </div>`;
}
function pushFromOffer(){ S.pushAsked = true; schedulePersist(); pushOn(); }
function pushNoThanks(){ S.pushAsked = true; schedulePersist(); render(); toast('Хорошо, не буду'); }

/* при входе восстанавливаем отметку: подписка могла отвалиться сама */
async function pushSync(){
  if(!S.pushOn || !pushApi()) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub || Notification.permission !== 'granted'){ S.pushOn = false; schedulePersist(); }
  } catch(e){}
}

/* Все модули расставили значения по умолчанию — запоминаем чистое состояние,
   чтобы вход в другой аккаунт начинался с него, а не с чужих данных. */
keepPristine();
</script>
</body>
</html>
